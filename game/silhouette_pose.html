<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>실루엣 포즈 맞추기</title>
<meta name="description" content="웹캠으로 내 몸을 인식해 다가오는 벽의 포즈 구멍에 몸을 맞추는 게임. 만세·T자·삼각형·물 분자 결합각 자세를 취해 벽을 통과하세요.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="preload" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="../labs/common/ui-layout.css">
<link rel="stylesheet" href="../labs/common/qr-modal.css">
<style>
@font-face{
    font-family:'SeoulNamsan';
    src:local('SeoulNamsan M'),local('SeoulNamsanM'),local('서울남산체 M'),
        url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff') format('woff');
    font-weight:400;font-style:normal;font-display:swap;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
    --bg:#0a1020; --ink:#eaf1fb; --muted:#9aa8bd; --line:rgba(255,255,255,.14);
    --glass:rgba(18,24,42,.64); --accent:#8b5cf6; --ok:#34d399; --warn:#fbbf24; --danger:#f87171;
}
body.dark-mode{--bg:#05080f;--glass:rgba(10,14,26,.76)}
html,body{margin:0;padding:0;width:100%;height:100%}
body{
    font-family:'SeoulNamsan',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:var(--ink); background:var(--bg); overflow:hidden; -webkit-user-select:none; user-select:none;
}
.glass{
    background:var(--glass); backdrop-filter:blur(18px) saturate(170%); -webkit-backdrop-filter:blur(18px) saturate(170%);
    border:1px solid var(--line); box-shadow:0 10px 30px rgba(0,0,0,.32); border-radius:18px;
}
.top-left-bar{
    position:fixed; top:calc(max(10px,env(safe-area-inset-top)) + 4px); left:16px; z-index:30;
    display:flex; align-items:center; gap:8px; min-width:0; max-width:calc(100vw - 210px);
}
.back-btn{
    display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:999px;
    border:1px solid var(--line); background:var(--glass); color:inherit; font-family:inherit;
    font-size:13px; font-weight:800; text-decoration:none; white-space:nowrap; cursor:pointer;
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
}
.tag-badge{
    display:inline-flex; align-items:center; gap:7px; padding:8px 13px; border-radius:999px; min-width:0;
    border:1px solid var(--line); background:var(--glass); font-size:13px; font-weight:900;
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); white-space:nowrap; overflow:hidden;
}
.tag-badge .t{overflow:hidden; text-overflow:ellipsis; min-width:0}
.tag-pill{
    flex:0 0 auto; font-size:9.5px; font-weight:900; letter-spacing:.2px; padding:2px 7px; border-radius:999px;
    background:linear-gradient(135deg,#ff2d95,#ff6ec4); color:#fff;
}
.top-right-bar{z-index:30}
#theme-toggle{
    width:40px; height:40px; flex:0 0 40px; display:inline-flex; align-items:center; justify-content:center;
    border-radius:50%; border:1px solid var(--line); background:var(--glass); color:inherit;
    font-family:inherit; font-size:15px; line-height:1; cursor:pointer;
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
}
#stage{position:fixed; left:0; right:0; top:60px; bottom:0; z-index:0}
#cv{display:block; width:100%; height:100%; touch-action:none}
body.pseudo-fs #stage{top:0}
body.pseudo-fs .top-left-bar{transform:translateY(-140%); opacity:0; pointer-events:none}
body.pseudo-fs #hud{top:calc(max(8px,env(safe-area-inset-top)) + 8px)}

#hud{
    position:fixed; top:calc(60px + 10px); left:16px; z-index:14;
    display:flex; align-items:center; gap:7px; flex-wrap:wrap; max-width:calc(100vw - 200px); pointer-events:none;
}
.chip{
    display:inline-flex; align-items:baseline; gap:6px; padding:6px 11px; border-radius:999px;
    background:rgba(12,16,32,.72); border:1px solid var(--line); color:#eaf1fb;
    font-size:11px; font-weight:800; white-space:nowrap; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
.chip b{font-size:14px; font-weight:900; font-variant-numeric:tabular-nums}
.chip.hot b{color:var(--warn)}
.chip.heart b{color:#fda4af}
.chip.cam{color:#cbd5e1}
.chip.cam.live{color:#6ee7b7; border-color:rgba(52,211,153,.4)}
.chip.cam.err{color:#fca5a5; border-color:rgba(248,113,113,.4)}

/* 포즈 선택 (카메라 없이 즐길 때) */
#posePad{
    position:fixed; left:50%; transform:translateX(-50%); z-index:20;
    bottom:calc(96px + env(safe-area-inset-bottom));
    display:none; gap:6px; align-items:center; justify-content:center; flex-wrap:wrap;
    max-width:calc(100vw - 20px);
}
#posePad.show{display:flex}
#posePad button{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    min-width:62px; padding:7px 9px; border-radius:14px; border:1.5px solid var(--line);
    background:rgba(18,24,42,.86); color:inherit; font-family:inherit; font-size:10.5px; font-weight:800;
    cursor:pointer; line-height:1.25; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
}
#posePad button b{font-size:17px; line-height:1}
#posePad button:active{transform:scale(.96)}

.overlay{
    position:fixed; inset:0; z-index:40; display:none; align-items:center; justify-content:center; padding:18px;
    background:rgba(5,8,16,.58); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
.overlay.show{display:flex}
.card{
    width:min(520px,100%); max-height:calc(100vh - 40px); overflow-y:auto; padding:22px 22px 20px;
    border-radius:24px; background:rgba(14,18,34,.95); border:1px solid var(--line);
    box-shadow:0 24px 60px rgba(0,0,0,.5); text-align:center;
}
body.dark-mode .card{background:rgba(8,10,20,.97)}
.card h1{margin:0 0 6px; font-size:23px; font-weight:900; letter-spacing:-.5px}
.card p.sub{margin:0 0 14px; font-size:12.5px; font-weight:700; color:var(--muted); line-height:1.6}
.rule{display:flex; flex-direction:column; gap:7px; text-align:left; margin:0 0 16px}
.rule div{
    display:flex; align-items:flex-start; gap:8px; font-size:12px; font-weight:700; color:#cbd5e1;
    line-height:1.5; padding:8px 11px; border-radius:12px; background:rgba(255,255,255,.05);
}
.rule span.ic{flex:0 0 auto; font-size:14px; line-height:1.35}
.primary{
    display:inline-flex; align-items:center; justify-content:center; gap:7px; width:100%;
    padding:13px 18px; border-radius:14px; border:none; cursor:pointer; font-family:inherit;
    font-size:14.5px; font-weight:900; color:#fff; background:linear-gradient(135deg,#8b5cf6,#6d28d9);
    box-shadow:0 10px 24px rgba(139,92,246,.32);
}
.primary:active{transform:scale(.985)}
.ghost{
    display:inline-flex; align-items:center; justify-content:center; gap:6px; width:100%; margin-top:8px;
    padding:11px 14px; border-radius:13px; border:1px solid var(--line); background:transparent;
    color:inherit; font-family:inherit; font-size:12.5px; font-weight:800; cursor:pointer;
}
.big-score{font-size:40px; font-weight:900; letter-spacing:-1px; margin:4px 0 2px; color:#c4b5fd}
.res-row{display:flex; justify-content:center; gap:8px; margin:10px 0 4px; flex-wrap:wrap}
.res-row div{flex:1 1 92px; padding:9px 8px; border-radius:13px; background:rgba(255,255,255,.06); border:1px solid var(--line)}
.res-row b{display:block; font-size:17px; font-weight:900; font-variant-numeric:tabular-nums}
.res-row span{font-size:10.5px; font-weight:800; color:var(--muted)}

#bar{gap:7px}
#bar .control-tab-btn{display:inline-flex; align-items:center; gap:5px}
#bar .control-tab-btn.on{background:#8b5cf6 !important; color:#fff !important; border-color:#8b5cf6 !important}
#fullscreenBtn{border:1px solid var(--line); background:var(--glass); color:inherit; font-family:inherit; font-weight:800; font-size:12.5px; cursor:pointer; border-radius:999px; padding:9px 14px; display:inline-flex; align-items:center; gap:6px; backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px)}
body.dark-mode #fullscreenBtn{background:rgba(10,14,26,.8); color:#eaf1fb}

.svl-toast{
    position:fixed; left:50%; top:calc(60px + 56px); bottom:auto; transform:translate(-50%,-8px);
    z-index:2000; max-width:86vw; padding:10px 16px; border-radius:14px; background:rgba(14,18,34,.95);
    color:#fff; font-size:12.5px; font-weight:700; line-height:1.45; text-align:center;
    box-shadow:0 10px 26px rgba(0,0,0,.4); opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
    font-family:inherit;
}
.svl-toast.show{opacity:1; transform:translate(-50%,0)}

@media (max-width:900px){
    .top-left-bar{top:calc(max(6px,env(safe-area-inset-top)) + 6px); left:10px; gap:6px; max-width:calc(100vw - 152px)}
    .back-btn{padding:7px 11px; font-size:12px}
    .tag-badge{padding:7px 10px; font-size:12px; gap:5px}
    .tag-pill{font-size:8.5px; padding:1px 5px}
    #theme-toggle{width:34px; height:34px; flex:0 0 34px; font-size:13px}
    .top-right-bar{top:calc(max(6px,env(safe-area-inset-top)) + 8px) !important; right:10px !important}
    #stage{top:52px}
    #hud{top:calc(52px + 8px); left:10px; gap:5px; max-width:calc(100vw - 24px)}
    .chip{padding:5px 9px; font-size:10px; gap:4px}
    .chip b{font-size:12.5px}
    body #bar{bottom:calc(52px + env(safe-area-inset-bottom)) !important; gap:4px; padding:4px 7px !important; max-width:calc(100vw - 12px) !important}
    #bar .control-tab-btn{font-size:10px !important; padding:6px 8px !important}
    #fullscreenBtn{bottom:calc(8px + env(safe-area-inset-bottom)) !important; right:10px !important; padding:7px 11px; font-size:11.5px}
    #posePad{bottom:calc(94px + env(safe-area-inset-bottom)); gap:4px}
    #posePad button{min-width:54px; padding:6px 7px; font-size:9.5px}
    #posePad button b{font-size:15px}
    .svl-toast{top:calc(52px + 54px); bottom:auto}
    .card{padding:18px 16px 16px}
    .card h1{font-size:20px}
}
@media (max-width:420px){
    .tag-badge .t{max-width:92px}
    .chip.hide-xs{display:none}
}
@media (max-height:520px) and (orientation:landscape){
    #stage{top:44px}
    #hud{top:calc(44px + 6px)}
    body #bar{bottom:calc(46px + env(safe-area-inset-bottom)) !important}
    #posePad{bottom:calc(88px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>

<div id="stage"><canvas id="cv"></canvas></div>

<div class="top-left-bar">
    <a href="../index.html" class="back-btn" onclick="var r=document.referrer;if(history.length>1&&r&&r.indexOf(location.origin+'/')===0&&/(\/|index(_3d)?\.html)(\?|#|$)/.test(r)){history.back();return false;}"><span>⬅</span> 메인</a>
    <div class="tag-badge"><span class="t">🧍 실루엣 포즈</span><span class="tag-pill">visionOS</span></div>
    <button class="back-btn qr-btn" id="qrBtn" type="button" title="QR 코드" aria-label="QR 코드 보기"><span class="qr-btn-icon" aria-hidden="true">📱</span><span class="qr-btn-label">QR code</span></button>
</div>

<div class="top-right-bar">
    <div class="tr-util">
        <button id="theme-toggle" type="button" title="야간 모드" aria-label="야간 모드">🌙</button>
    </div>
</div>

<div id="hud">
    <div class="chip"><span>통과</span><b id="hScore">0</b></div>
    <div class="chip heart"><span>기회</span><b id="hLife">♥♥♥</b></div>
    <div class="chip hot"><span>자세 적합도</span><b id="hFit">—</b></div>
    <div class="chip cam hide-xs" id="hCam">🎥 카메라 OFF</div>
</div>

<div id="posePad"></div>

<div class="overlay show" id="ovStart">
    <div class="card">
        <h1>🧍 실루엣 포즈 맞추기</h1>
        <p class="sub">다가오는 벽의 포즈 구멍에 내 몸을 맞춰 통과하세요</p>
        <div class="rule">
            <div><span class="ic">📷</span><span>카메라를 켜면 <b>내 몸의 자세</b>를 실시간으로 인식해 벽의 구멍과 비교해요.</span></div>
            <div><span class="ic">🙌</span><span>구멍 모양(만세·T자·삼각형·물 분자 결합각·활)에 맞춰 팔을 움직이세요.</span></div>
            <div><span class="ic">🎯</span><span>벽이 도착할 때 <b>적합도 62% 이상</b>이면 통과!</span></div>
            <div><span class="ic">⌨️</span><span>카메라가 없으면 아래 <b>포즈 버튼</b>으로 같은 규칙으로 즐길 수 있어요.</span></div>
        </div>
        <button class="primary" id="btnStart" type="button">🎮 시작하기</button>
        <button class="ghost" id="btnStartCam" type="button">🎥 카메라 켜고 시작</button>
    </div>
</div>

<div class="overlay" id="ovOver">
    <div class="card">
        <h1>결과</h1>
        <div class="big-score" id="rScore">0</div>
        <p class="sub" id="rMsg">수고했어요!</p>
        <div class="res-row">
            <div><b id="rPass">0</b><span>통과한 벽</span></div>
            <div><b id="rFail">0</b><span>부딪힌 벽</span></div>
            <div><b id="rBest">0%</b><span>최고 적합도</span></div>
        </div>
        <button class="primary" id="btnAgain" type="button">🔄 다시 하기</button>
    </div>
</div>

<div id="bar" class="bottom-control-bar">
    <button class="control-tab-btn" id="btnCam" type="button">🎥 카메라</button>
    <button class="control-tab-btn" id="btnFacing" type="button">📷 전면</button>
    <button class="control-tab-btn" id="btnPause" type="button">⏸ 일시정지</button>
    <button class="control-tab-btn" id="btnReset" type="button">🔄 처음부터</button>
</div>

<div class="bottom-right-bar">
    <button id="fullscreenBtn" type="button" aria-label="전체화면으로 전환">
        <span id="fsIcon">⛶</span><span id="fsText">전체화면</span>
    </button>
</div>

<script>
/* 🏆 명예의 전당 — 게임 ID / 결과 카드 / 시작 화면 연결 */
window.HOF_GAME = { game:'silhouette_pose', result:'#ovOver .card', start:'#ovStart .card' };
</script>
<script src="../labs/common/hall-of-fame.js" defer></script>
<script src="../labs/common/feedback.js" defer></script>
<script src="../labs/common/lib/qrcode.min.js" defer></script>
<script src="../labs/common/qr-modal.js" defer></script>
<script src="../labs/common/game-core.js"></script>
<script>
/* ==========================================================
   실루엣 포즈 맞추기 — MediaPipe Pose(33관절)
   · 다가오는 벽의 구멍(포즈)에 내 몸(엄지·검지 아닌 어깨·팔꿈치·손목)
     실루엣을 맞춘다. 몸 좌표계(어깨 중점 · 어깨 너비 기준)로 비교.
   · 카메라가 없거나 포즈 인식이 안 되면 포즈 버튼 모드로 자동 전환
   ========================================================== */
(function () {
    'use strict';
    var U = SVL.utils, $ = function (s) { return document.querySelector(s); };

    var cv = $('#cv'), ctx = cv.getContext('2d');
    var off = document.createElement('canvas'), octx = off.getContext('2d');
    var W = 900, H = 620, DPR = 1;

    var theme = SVL.initTheme('theme-toggle', 'svl_pose_theme');
    SVL.initFullscreen('fullscreenBtn', 'fsIcon', 'fsText');

    /* ---------------- 포즈 정의 (어깨 너비 = 1 단위, y는 아래로 +) ---------------- */
    var POSES = [
        {
            id: 'banzae', name: '만세', icon: '🙌', hint: '두 팔을 위로 쭉',
            joints: { elbow: [[-0.62, -0.70], [0.62, -0.70]], wrist: [[-0.78, -1.28], [0.78, -1.28]] }
        },
        {
            id: 't', name: 'T자', icon: 'T', hint: '두 팔을 옆으로',
            joints: { elbow: [[-0.72, 0.02], [0.72, 0.02]], wrist: [[-1.45, 0.04], [1.45, 0.04]] }
        },
        {
            id: 'triangle', name: '삼각형', icon: '🔺', hint: '두 손을 머리 위로 모으기',
            joints: { elbow: [[-0.62, -0.60], [0.62, -0.60]], wrist: [[-0.12, -1.22], [0.12, -1.22]] }
        },
        {
            id: 'water', name: '물 분자', icon: '💧', hint: '104.5° V자로 두 팔 들기',
            joints: { elbow: [[-0.60, -0.52], [0.60, -0.52]], wrist: [[-0.86, -1.02], [0.86, -1.02]] }
        },
        {
            id: 'bow', name: '활', icon: '🏹', hint: '한 팔은 위, 한 팔은 아래로',
            joints: { elbow: [[-0.70, -0.48], [0.76, 0.42]], wrist: [[-1.08, -0.96], [1.04, 0.84]] }
        }
    ];
    var TOL = 0.42;        /* 관절 허용 오차(어깨 너비 기준) */
    var PASS_FIT = 0.62;

    var G = {
        mode: 'ready', walls: [], score: 0, life: 3, fail: 0, best: 0,
        t: 0, spawnAcc: 0, shake: 0, flash: 0, fit: 0, fitPose: null,
        padMode: false, pops: []
    };

    var cam = SVL.createCamera({
        onChange: function () { syncCamUI(); },
        onStatus: function (msg, kind) { setCamChip(msg, kind); }
    });
    var poseLM = null, lastDetect = 0, pose = { pts: null, seen: 0, present: false, ready: false };

    function resize() {
        var box = $('#stage').getBoundingClientRect();
        W = Math.max(300, box.width);
        H = Math.max(320, box.height);
        DPR = Math.min(2, window.devicePixelRatio || 1);
        cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        off.width = cv.width; off.height = cv.height;
    }

    /* ---------------- 카메라 ---------------- */
    function syncCamUI() {
        var i = cam.info();
        var b = $('#btnCam'), f = $('#btnFacing');
        if (b) { b.textContent = i.on ? '🎥 카메라 끄기' : '🎥 카메라'; b.classList.toggle('on', i.on); }
        if (f) f.textContent = '📷 ' + i.label;
        if (!i.on) setCamChip('🎥 카메라 OFF · 포즈 버튼', '');
        else if (pose.ready) setCamChip('🧍 몸을 인식했어요', 'live');
        updatePadVisibility();
    }
    function setCamChip(txt, kind) {
        var el = $('#hCam');
        if (!el) return;
        el.textContent = txt;
        el.className = 'chip cam hide-xs' + (kind ? ' ' + kind : '');
    }
    function startCam() {
        cam.start().then(function (ok) {
            if (!ok) { setPadMode(true); return; }
            SVL.poseTracker.get().then(function (lm) {
                poseLM = lm; pose.ready = true;
                setCamChip('🧍 몸 전체가 보이게 서 주세요', 'live');
                setPadMode(false);
            }, function () {
                pose.ready = false;
                setCamChip('⚠️ 포즈 인식 불가 · 포즈 버튼', 'err');
                SVL.toast('포즈 인식 모델을 불러오지 못했어요 · 포즈 버튼으로 계속 즐길 수 있어요');
                setPadMode(true);
            });
        });
    }
    function stopCam() {
        cam.stop();
        pose.present = false; pose.pts = null;
        syncCamUI();
    }
    function setPadMode(on) {
        G.padMode = !!on;
        updatePadVisibility();
    }
    function updatePadVisibility() {
        var pad = $('#posePad');
        if (!pad) return;
        var show = G.padMode || !cam.isOn() || !pose.ready;
        pad.classList.toggle('show', show);
        if (show) pad.style.display = 'flex'; else pad.style.display = '';
    }

    /* ---------------- 포즈 인식 ---------------- */
    function trackPose(now) {
        if (!cam.isOn() || !poseLM || cam.video.readyState < 2) return;
        if (now - lastDetect < 66) return;
        lastDetect = now;
        var res = null;
        try { res = poseLM.detectForVideo(cam.video, now); } catch (e) { res = null; }
        if (!res || !res.landmarks || !res.landmarks.length) {
            if (now - pose.seen > 600) { pose.present = false; pose.pts = null; }
            return;
        }
        var lm = res.landmarks[0];
        pose.pts = lm; pose.present = true; pose.seen = now;
        if (pose.ready) setCamChip('🧍 몸을 인식했어요', 'live');
    }

    /* 몸 좌표계로 변환: 어깨 중점 기준, 어깨 너비 = 1 */
    function bodyFrame() {
        if (!pose.pts) return null;
        var l = pose.pts[11], r = pose.pts[12];
        if (!l || !r) return null;
        var a = cam.toStage(l.x, l.y, W, H), b = cam.toStage(r.x, r.y, W, H);
        var S = U.dist(a.x, a.y, b.x, b.y);
        if (S < 12) return null;
        return { mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, S: S, a: a, b: b };
    }

    function jointNorm(idx, fr) {
        if (!pose.pts || !pose.pts[idx] || !fr) return null;
        var p = cam.toStage(pose.pts[idx].x, pose.pts[idx].y, W, H);
        return [(p.x - fr.mx) / fr.S, (p.y - fr.my) / fr.S];
    }

    /* 한 조합(좌/우 그대로 vs 뒤집기)의 적합도 */
    function fitFor(poseDef, fr, flip) {
        var total = 0, n = 0;
        var map = flip
            ? { elbow: [14, 13], wrist: [16, 15] }
            : { elbow: [13, 14], wrist: [15, 16] };
        ['elbow', 'wrist'].forEach(function (kind) {
            for (var i = 0; i < 2; i++) {
                var got = jointNorm(map[kind][i], fr);
                if (!got) continue;
                var tg = poseDef.joints[kind][i];
                var d = Math.sqrt(Math.pow(got[0] - tg[0], 2) + Math.pow(got[1] - tg[1], 2));
                total += U.clamp(1 - d / TOL, 0, 1);
                n++;
            }
        });
        return n ? total / n : 0;
    }

    function fitOf(poseDef) {
        var fr = bodyFrame();
        if (!fr) return 0;
        return Math.max(fitFor(poseDef, fr, false), fitFor(poseDef, fr, true));
    }

    /* ---------------- 벽 ---------------- */
    var poseIdx = 0;
    function nextPose() {
        /* 같은 포즈가 연달아 나오지 않게 섞어서 */
        var cand = [];
        for (var i = 0; i < POSES.length; i++) if (i !== poseIdx) cand.push(i);
        poseIdx = U.pick(cand);
        return POSES[poseIdx];
    }

    function spawnWall() {
        G.walls.push({
            z: 1, pose: nextPose(), spd: 0.105 + Math.min(0.06, G.score * 0.005),
            wobble: U.rand(-1, 1) * 0.06, alpha: 0, passed: false, done: false
        });
    }

    function wallGeom(w) {
        var k = 1 - w.z;                      /* 0(멀다) ~ 1(도착) */
        var scale = U.lerp(0.46, 1.0, k);
        var wh = H * 0.58 * scale;
        var ww = Math.min(W * 0.62, wh * 1.15);
        var cx = W / 2 + w.wobble * W * 0.16;
        var bottom = H * 0.72 - (1 - scale) * H * 0.02;
        return { cx: cx, cy: bottom - wh / 2, ww: ww, wh: wh, bottom: bottom, scale: scale, k: k };
    }

    /* ---------------- 게임 흐름 ---------------- */
    function startGame() {
        G.mode = 'play'; G.walls = []; G.score = 0; G.life = 3; G.fail = 0; G.best = 0;
        G.t = 0; G.spawnAcc = 0; G.shake = 0; G.flash = 0; G.fit = 0; G.pops = [];
        $('#ovStart').classList.remove('show');
        $('#ovOver').classList.remove('show');
        $('#btnPause').textContent = '⏸ 일시정지';
        spawnWall();
        syncHud();
        SVL.toast(cam.isOn() && pose.ready ? '다가오는 벽의 구멍에 몸을 맞춰 보세요!' : '벽의 포즈와 같은 버튼을 누르세요!');
        updatePadVisibility();
    }
    function endGame() {
        G.mode = 'over';
        $('#rScore').textContent = G.score;
        $('#rPass').textContent = G.score;
        $('#rFail').textContent = G.fail;
        $('#rBest').textContent = Math.round(G.best * 100) + '%';
        $('#rMsg').textContent = G.score >= 12 ? '포즈 마스터! 🏆' : (G.score >= 6 ? '훌륭해요! 👏' : '한 번 더 도전해 볼까요?');
        if (window.HOF) HOF.gameOver(G.score, '실패 ' + G.fail + '회 · 최고 정확도 ' + Math.round(G.best * 100) + '%', '#ovOver .card');
        $('#ovOver').classList.add('show');
    }
    function resetGame() {
        G.mode = 'ready'; G.walls = []; G.score = 0; G.life = 3; G.fail = 0; G.t = 0; G.pops = [];
        $('#ovOver').classList.remove('show');
        $('#ovStart').classList.add('show');
        $('#btnPause').textContent = '⏸ 일시정지';
        G.fit = 0;
        syncHud();
    }

    function judge(w) {
        /* 카메라는 켜져 있는데 몸이 안 보였다면 벗지 않고 버튼 모드로 바꾼다 */
        if (cam.isOn() && pose.ready && !pose.present && !G.padMode) {
            setPadMode(true);
            SVL.toast('몸이 화면에 보이지 않아 포즈 버튼 모드로 바꿨어요 · 이번 벽은 그냥 지나갑니다', 2600);
            w.done = true; w.passed = true;
            return;
        }
        var usePad = G.padMode || !cam.isOn() || !pose.ready || !pose.present;
        var ok;
        if (usePad) ok = w.padAnswered === w.pose.id;
        else ok = fitOf(w.pose) >= PASS_FIT;
        if (ok) {
            G.score++;
            G.flash = 0;
            pop(W / 2, H * 0.42, '통과!  ' + w.pose.icon, '#6ee7b7');
            w.passed = true;
        } else {
            G.fail++; G.life--;
            G.shake = 1; G.flash = 1;
            pop(W / 2, H * 0.42, '부딪혔어요!', '#fca5a5');
            syncHud();
            if (G.life <= 0) { w.done = true; endGame(); return; }
            SVL.toast('포즈가 맞지 않았어요 · 기회 ' + G.life + '번 남음', 1500);
        }
        w.done = true;
        syncHud();
    }

    function pop(x, y, text, c) { G.pops.push({ x: x, y: y, text: text, color: c, life: 1 }); }

    /* ---------------- 업데이트 ---------------- */
    function update(dt) {
        var now = performance.now();
        trackPose(now);
        if (!pose.present && cam.isOn() && pose.ready && !G.padMode) {
            /* 몸이 안 보이면 버튼 사용을 안내 */
            if (Math.random() < 0.02) setCamChip('🧍 몸 전체가 화면에 보이게 서 주세요', '');
        }
        G.t += dt;
        G.shake = Math.max(0, G.shake - dt * 2.2);
        G.flash = Math.max(0, G.flash - dt * 2);
        for (var p = G.pops.length - 1; p >= 0; p--) {
            G.pops[p].y -= 30 * dt; G.pops[p].life -= dt * 1.05;
            if (G.pops[p].life <= 0) G.pops.splice(p, 1);
        }

        var nearest = null;
        for (var i = G.walls.length - 1; i >= 0; i--) {
            var w = G.walls[i];
            if (!w.done) w.alpha = Math.min(1, w.alpha + dt * 3.5);
            if (G.mode === 'play' && !w.done) {
                w.z -= w.spd * dt;
                if (w.z <= 0.02) { w.z = 0.02; judge(w); }
            }
            if (w.done) {
                w.alpha -= dt * 3;
                if (w.alpha <= 0) G.walls.splice(i, 1);
            } else if (!nearest || w.z < nearest.z) nearest = w;
        }
        /* 가장 가까운 벽의 적합도 표시 */
        if (nearest && G.mode === 'play' && !nearest.done) {
            var usePad = G.padMode || !cam.isOn() || !pose.ready || !pose.present;
            G.fit = usePad ? 0 : fitOf(nearest.pose);
            if (!usePad && G.fit > G.best) G.best = G.fit;
            G.fitPose = nearest.pose;
        } else {
            G.fit = 0; G.fitPose = null;
        }

        if (G.mode === 'play' && G.walls.length === 0) {
            G.spawnAcc += dt;
            if (G.spawnAcc > 0.45) { G.spawnAcc = 0; spawnWall(); }
        }
        syncHud();
    }

    /* ---------------- 벽 그리기 ---------------- */
    function addCircles(c, x1, y1, x2, y2, r, steps) {
        steps = steps || 10;
        for (var i = 0; i <= steps; i++) {
            var t = i / steps;
            var x = x1 + (x2 - x1) * t, y = y1 + (y2 - y1) * t;
            c.moveTo(x + r, y);
            c.arc(x, y, r, 0, Math.PI * 2);
        }
    }

    function holePath(c, cx, my, S, poseDef) {
        /* 머리 */
        c.moveTo(cx + 0.40 * S, my - 0.98 * S);
        c.arc(cx, my - 0.98 * S, 0.40 * S, 0, Math.PI * 2);
        /* 몸통(어깨~골반) */
        var tw = 0.92 * S, th = 1.95 * S;
        var tx = cx - 0.58 * S, ty = my - 0.30 * S;
        c.moveTo(tx + 0.26 * S, ty);
        c.lineTo(tx + tw - 0.26 * S, ty);
        c.quadraticCurveTo(tx + tw, ty, tx + tw, ty + 0.26 * S);
        c.lineTo(tx + tw, ty + th - 0.26 * S);
        c.quadraticCurveTo(tx + tw, ty + th, tx + tw - 0.26 * S, ty + th);
        c.lineTo(tx + 0.26 * S, ty + th);
        c.quadraticCurveTo(tx, ty + th, tx, ty + th - 0.26 * S);
        c.lineTo(tx, ty + 0.26 * S);
        c.quadraticCurveTo(tx, ty, tx + 0.26 * S, ty);
        c.closePath();
        /* 다리 */
        addCircles(c, cx - 0.34 * S, my + 1.55 * S, cx - 0.40 * S, my + 3.05 * S, 0.24 * S, 9);
        addCircles(c, cx + 0.34 * S, my + 1.55 * S, cx + 0.40 * S, my + 3.05 * S, 0.24 * S, 9);
        /* 팔: 어깨 → 팔꿈치 → 손목 */
        for (var s = 0; s < 2; s++) {
            var sgn = s === 0 ? -1 : 1;
            var ex = cx + poseDef.joints.elbow[s][0] * S, ey = my + poseDef.joints.elbow[s][1] * S;
            var wx = cx + poseDef.joints.wrist[s][0] * S, wy = my + poseDef.joints.wrist[s][1] * S;
            var shx = cx + sgn * 0.52 * S, shy = my - 0.10 * S;
            addCircles(c, shx, shy, ex, ey, 0.20 * S, 8);
            addCircles(c, ex, ey, wx, wy, 0.20 * S, 8);
            c.moveTo(wx + 0.27 * S, wy);
            c.arc(wx, wy, 0.27 * S, 0, Math.PI * 2);
        }
    }

    function drawWall(w) {
        var g = wallGeom(w);
        var cx = g.cx;
        var S = g.wh / 5.6;                /* 몸 전체(키 ≈ 4.7S)와 이름표가 벽 안에 들어오는 비율 */
        var my = (g.cy - g.wh / 2) + g.wh * 0.34;   /* 어깨 중점 */
        octx.setTransform(DPR, 0, 0, DPR, 0, 0);
        octx.clearRect(0, 0, W, H);
        octx.globalAlpha = Math.max(0, Math.min(1, w.alpha));

        /* 벽 본체 */
        var x0 = cx - g.ww / 2, y0 = g.cy - g.wh / 2;
        U.roundRect(octx, x0, y0, g.ww, g.wh, 16);
        var wg = octx.createLinearGradient(x0, y0, x0 + g.ww, y0 + g.wh);
        wg.addColorStop(0, 'rgba(51,65,85,.96)');
        wg.addColorStop(0.5, 'rgba(30,41,59,.96)');
        wg.addColorStop(1, 'rgba(15,23,42,.97)');
        octx.fillStyle = wg;
        octx.fill();
        octx.strokeStyle = w.done && !w.passed ? 'rgba(248,113,113,.9)' : (w.done ? 'rgba(52,211,153,.9)' : 'rgba(139,92,246,.85)');
        octx.lineWidth = 3;
        octx.stroke();

        /* 벽 무늬 */
        octx.save();
        U.roundRect(octx, x0, y0, g.ww, g.wh, 16);
        octx.clip();
        octx.globalAlpha = 0.10;
        octx.strokeStyle = '#e2e8f0';
        octx.lineWidth = 1;
        for (var i = 1; i < 10; i++) {
            octx.beginPath();
            octx.moveTo(x0, y0 + (g.wh / 10) * i);
            octx.lineTo(x0 + g.ww, y0 + (g.wh / 10) * i);
            octx.stroke();
        }
        octx.restore();
        octx.globalAlpha = Math.max(0, Math.min(1, w.alpha));

        /* 구멍 뚫기 */
        octx.globalCompositeOperation = 'destination-out';
        octx.fillStyle = '#000';
        octx.beginPath();
        holePath(octx, cx, my, S, w.pose);
        octx.fill();
        octx.globalCompositeOperation = 'source-over';

        /* 이름표는 벽 바깥 위쪽에 띄워 구멍(실루엣)을 가리지 않게 한다 */
        octx.globalAlpha = Math.max(0, Math.min(1, w.alpha));
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.drawImage(off, 0, 0);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        if (g.cy - g.wh / 2 > 30 && !w.done) {
            ctx.save();
            ctx.globalAlpha = Math.max(0, Math.min(1, w.alpha));
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            var fs = U.clamp(g.ww * 0.06, 12, 22);
            ctx.font = '900 ' + Math.round(fs) + 'px "SeoulNamsan", sans-serif';
            var label = w.pose.name + '  ·  ' + (w.pose.id === 'water' ? '결합각 104.5°' : w.pose.hint);
            var lw = ctx.measureText(label).width + 26;
            var ly = g.cy - g.wh / 2 - fs - 6;
            U.roundRect(ctx, cx - lw / 2, ly - fs, lw, fs * 2, fs);
            ctx.fillStyle = w.done && !w.passed ? 'rgba(190,24,60,.85)' : 'rgba(30,27,75,.88)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(196,181,253,.6)'; ctx.lineWidth = 1.2; ctx.stroke();
            ctx.fillStyle = '#f8fafc';
            ctx.fillText(label, cx, ly);
            ctx.restore();
        }
    }

    function drawSkeleton() {
        if (!pose.pts || !pose.present || !cam.isOn()) return;
        var fr = bodyFrame();
        var need = [11, 12, 13, 14, 15, 16, 23, 24];
        var pg = G.walls.filter(function (w) { return !w.done; }).sort(function (a, b) { return a.z - b.z; })[0];
        ctx.save();
        /* 몸 외곽 실루엣 */
        ctx.beginPath();
        var pts = [];
        for (var i = 0; i < pose.pts.length; i++) {
            var p = cam.toStage(pose.pts[i].x, pose.pts[i].y, W, H);
            pts.push(p);
        }
        ctx.fillStyle = 'rgba(139,92,246,.10)';
        ctx.strokeStyle = 'rgba(196,181,253,.45)';
        ctx.lineWidth = 1.6;
        [[11, 12], [11, 13], [13, 15], [12, 14], [14, 16], [11, 23], [12, 24], [23, 24], [23, 25], [25, 27], [24, 26], [26, 28]].forEach(function (c) {
            var a = pts[c[0]], b = pts[c[1]];
            if (!a || !b) return;
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        });
        /* 관절 점: 목표에 가까우면 초록, 아니면 주황 */
        var targets = { 13: null, 14: null, 15: null, 16: null };
        if (pg && fr) {
            var flipL = fitFor(pg.pose, fr, false), flipR = fitFor(pg.pose, fr, true);
            var flip = flipR > flipL;
            targets[13] = pg.pose.joints.elbow[flip ? 1 : 0];
            targets[14] = pg.pose.joints.elbow[flip ? 0 : 1];
            targets[15] = pg.pose.joints.wrist[flip ? 1 : 0];
            targets[16] = pg.pose.joints.wrist[flip ? 0 : 1];
        }
        need.forEach(function (idx) {
            var p = pts[idx];
            if (!p) return;
            var ok = false;
            if (targets[idx] && fr) {
                var got = jointNorm(idx, fr);
                var d = Math.sqrt(Math.pow(got[0] - targets[idx][0], 2) + Math.pow(got[1] - targets[idx][1], 2));
                ok = d < TOL;
            }
            ctx.beginPath();
            ctx.arc(p.x, p.y, idx === 15 || idx === 16 ? 8 : 6, 0, Math.PI * 2);
            ctx.fillStyle = ok ? 'rgba(52,211,153,.9)' : 'rgba(251,191,36,.85)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(10,14,26,.8)';
            ctx.lineWidth = 1.6;
            ctx.stroke();
        });
        ctx.restore();
    }

    function drawFitBar() {
        if (G.mode !== 'play') return;
        var usePad = G.padMode || !cam.isOn() || !pose.ready || !pose.present;
        if (usePad) return;              /* 버튼 모드에서는 포즈 버튼이 안내 역할을 한다 */
        var w = Math.min(W * 0.5, 300), h = 12;
        var x = W / 2 - w / 2, y = H * 0.90;
        ctx.save();
        U.roundRect(ctx, x, y, w, h, h / 2);
        ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fill();
        var k = usePad ? 0 : U.clamp(G.fit, 0, 1);
        var g = ctx.createLinearGradient(x, 0, x + w, 0);
        g.addColorStop(0, '#f59e0b'); g.addColorStop(0.65, '#34d399'); g.addColorStop(1, '#22d3ee');
        ctx.fillStyle = g;
        U.roundRect(ctx, x, y, Math.max(3, w * k), h, h / 2); ctx.fill();
        ctx.strokeStyle = 'rgba(248,250,252,.8)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x + w * PASS_FIT, y - 4);
        ctx.lineTo(x + w * PASS_FIT, y + h + 4);
        ctx.stroke();
        ctx.font = '800 10.5px "SeoulNamsan", sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        ctx.fillStyle = 'rgba(226,232,240,.9)';
        ctx.fillText('자세 적합도 ' + Math.round(G.fit * 100) + '% · 흰 선(' + Math.round(PASS_FIT * 100) + '%)을 넘으면 통과',
            W / 2, y + h + 7);
        ctx.restore();
    }

    function drawPops() {
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        for (var i = 0; i < G.pops.length; i++) {
            var p = G.pops[i];
            ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.3));
            ctx.font = '900 ' + Math.round(U.clamp(H * 0.045, 18, 30)) + 'px "SeoulNamsan", sans-serif';
            ctx.strokeStyle = 'rgba(5,8,16,.85)'; ctx.lineWidth = 5;
            ctx.strokeText(p.text, p.x, p.y);
            ctx.fillStyle = p.color;
            ctx.fillText(p.text, p.x, p.y);
        }
        ctx.globalAlpha = 1;
    }

    function drawBg() {
        var camOk = cam.drawCover(ctx, W, H, 1);
        if (camOk) {
            var g = ctx.createLinearGradient(0, 0, 0, H);
            g.addColorStop(0, 'rgba(6,9,20,.35)');
            g.addColorStop(0.6, 'rgba(6,9,20,.45)');
            g.addColorStop(1, 'rgba(4,6,14,.72)');
            ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
        } else {
            var bg = ctx.createLinearGradient(0, 0, 0, H);
            bg.addColorStop(0, '#1a1f3d');
            bg.addColorStop(0.6, '#0b0f1e');
            bg.addColorStop(1, '#04060c');
            ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
            ctx.save();
            for (var i = 0; i < 44; i++) {
                var sx = (i * 157.3) % W, sy = (i * 223.9) % (H * 0.8);
                ctx.globalAlpha = 0.07 + (i % 7) * 0.03;
                ctx.fillStyle = i % 5 === 0 ? '#c4b5fd' : '#ffffff';
                ctx.beginPath(); ctx.arc(sx, sy, 1.2, 0, Math.PI * 2); ctx.fill();
            }
            ctx.restore();
        }
        /* 바닥 */
        ctx.fillStyle = 'rgba(4,6,14,.55)';
        ctx.fillRect(0, H * 0.94, W, H * 0.06);
    }

    function drawPaused() {
        if (G.mode !== 'pause') return;
        ctx.fillStyle = 'rgba(4,6,14,.6)'; ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = '900 ' + Math.round(U.clamp(H * 0.055, 20, 32)) + 'px "SeoulNamsan", sans-serif';
        ctx.fillStyle = '#eaf1fb';
        ctx.fillText('⏸ 일시정지', W / 2, H / 2 - 6);
        ctx.font = '800 13px "SeoulNamsan", sans-serif';
        ctx.fillStyle = 'rgba(203,213,225,.85)';
        ctx.fillText('아래 [▶ 계속] 을 눌러 이어서 하세요', W / 2, H / 2 + 26);
    }

    function draw() {
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        ctx.clearRect(0, 0, W, H);
        ctx.save();
        if (G.shake > 0) {
            var s = G.shake * 9;
            ctx.translate(U.rand(-s, s), U.rand(-s, s));
        }
        drawBg();
        /* 먼 벽부터 */
        var sorted = G.walls.slice().sort(function (a, b) { return b.z - a.z; });
        for (var i = 0; i < sorted.length; i++) drawWall(sorted[i]);
        drawSkeleton();
        ctx.restore();
        drawFitBar();
        drawPops();
        if (G.flash > 0) {
            ctx.fillStyle = 'rgba(248,113,113,' + (G.flash * 0.26) + ')';
            ctx.fillRect(0, 0, W, H);
        }
        drawPaused();
    }

    var lastHud = { s: -1, l: '', f: -1 };
    function syncHud() {
        if (G.score !== lastHud.s) { $('#hScore').textContent = G.score; lastHud.s = G.score; }
        var hearts = '';
        for (var i = 0; i < 3; i++) hearts += i < G.life ? '♥' : '♡';
        if (hearts !== lastHud.l) { $('#hLife').textContent = hearts; lastHud.l = hearts; }
        var usePad = G.padMode || !cam.isOn() || !pose.ready || !pose.present;
        var f = usePad ? '—' : Math.round(G.fit * 100);
        if (f !== lastHud.f) { $('#hFit').textContent = f === '—' ? '—' : f + '%'; lastHud.f = f; }
    }

    var last = 0;
    function loop(ts) {
        var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016;
        last = ts;
        update(dt);
        draw();
        requestAnimationFrame(loop);
    }

    /* ---------------- 포즈 버튼(대체 조작) ---------------- */
    (function buildPad() {
        var pad = $('#posePad');
        POSES.forEach(function (p, i) {
            var b = document.createElement('button');
            b.type = 'button';
            b.dataset.pose = p.id;
            b.innerHTML = '<b>' + p.icon + '</b>' + p.name;
            b.addEventListener('click', function () { padAnswer(p.id); });
            pad.appendChild(b);
        });
        var tip = document.createElement('div');
        tip.style.cssText = 'flex:1 0 100%;text-align:center;font-size:10px;font-weight:800;color:#94a3b8;margin-top:2px';
        tip.textContent = '벽의 포즈와 같은 버튼을 누르세요';
        pad.appendChild(tip);
    })();

    function padAnswer(poseId) {
        if (G.mode !== 'play') return;
        var targets = G.walls.filter(function (w) { return !w.done; }).sort(function (a, b) { return a.z - b.z; });
        if (!targets.length) return;
        var w = targets[0];
        w.padAnswered = poseId;
        if (poseId === w.pose.id) {
            /* 즉시 통과 처리 */
            G.score++;
            pop(W / 2, H * 0.42, '통과!  ' + w.pose.icon, '#6ee7b7');
            w.done = true; w.passed = true;
            syncHud();
        } else {
            pop(W / 2, H * 0.42, '다른 포즈예요!', '#fca5a5');
            w.padPenalty = true;
        }
    }

    /* ---------------- 버튼 ---------------- */
    $('#btnStart').addEventListener('click', startGame);
    $('#btnStartCam').addEventListener('click', function () { startCam(); setTimeout(startGame, 80); });
    $('#btnAgain').addEventListener('click', startGame);
    $('#btnReset').addEventListener('click', resetGame);
    $('#btnCam').addEventListener('click', function () { if (cam.isOn()) stopCam(); else startCam(); });
    $('#btnFacing').addEventListener('click', function () { cam.toggleFacing().then(syncCamUI); });
    $('#btnPause').addEventListener('click', function () {
        if (G.mode === 'play') { G.mode = 'pause'; this.textContent = '▶ 계속'; }
        else if (G.mode === 'pause') { G.mode = 'play'; this.textContent = '⏸ 일시정지'; }
    });
    document.addEventListener('keydown', function (e) {
        if (e.code === 'Space') {
            e.preventDefault();
            if (G.mode === 'ready') startGame();
            else if (G.mode === 'play') { G.mode = 'pause'; $('#btnPause').textContent = '▶ 계속'; }
            else if (G.mode === 'pause') { G.mode = 'play'; $('#btnPause').textContent = '⏸ 일시정지'; }
        }
        var n = parseInt(e.key, 10);
        if (n >= 1 && n <= POSES.length && G.mode === 'play') padAnswer(POSES[n - 1].id);
    });

    resize();
    window.addEventListener('resize', resize);
    syncCamUI(); syncHud();
    updatePadVisibility();
    requestAnimationFrame(loop);

    window.__pose = {
        get state() {
            return {
                mode: G.mode, score: G.score, life: G.life, fail: G.fail,
                fit: Math.round(G.fit * 100), best: Math.round(G.best * 100),
                walls: G.walls.filter(function (w) { return !w.done; }).length,
                nextPose: G.fitPose ? G.fitPose.id : null,
                padMode: G.padMode, padVisible: $('#posePad').classList.contains('show'),
                camOn: cam.isOn(), facing: cam.facing(), poseReady: pose.ready, posePresent: pose.present,
                stage: { w: Math.round(W), h: Math.round(H) }
            };
        },
        start: startGame, reset: resetGame, padAnswer: padAnswer,
        rush: function (z) { G.walls.forEach(function (w) { if (!w.done) w.z = z; }); }
    };
})();
</script>
</body>
</html>
