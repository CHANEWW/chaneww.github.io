<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>차누쌤의 가상 실험실</title>
    <style>
        /* 서울남산체L 웹 폰트 불러오기 (눈누 폰트 제공) */
        @font-face {
            font-family: 'SeoulNamsanL';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanL.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        /* 웹앱 느낌을 주는 기본 배경과 폰트 설정 */
        body {
            margin: 0;
            padding: 0;
            font-family: 'SeoulNamsanL', sans-serif; /* 폰트가 서울남산체L로 변경되었습니다 */
            background-color: #f4f7f6;
            color: #333;
        }

        /* 상단 헤더 (앱 타이틀바 느낌) */
        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* 실험 목록을 담는 그리드 (바둑판 배열) */
        .lab-grid {
            display: grid;
            /* 스마트폰에서는 1줄, PC/태블릿에서는 2~3줄로 자동 조절 */
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto; /* 가운데 정렬 */
        }

        /* 개별 실험 버튼(카드) 디자인 */
        .lab-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            color: #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 120px;
        }

        /* 마우스를 올렸을 때 애니메이션 효과 */
        .lab-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        /* 카드 안의 아이콘 (이모지 활용) */
        .lab-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .lab-title {
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        Science Virtual LAB
    </header>

    <div class="lab-grid">
        <!-- 첫 번째 실험 버튼 -->
        <a href="labs/pendulum.html" class="lab-card">
            <div class="lab-icon">⏱️</div>
            <div class="lab-title">진자 운동</div>
        </a>

        <!-- 두 번째 실험 버튼 -->
        <a href="labs/gravity.html" class="lab-card">
            <div class="lab-icon">🍎</div>
            <div class="lab-title">자유 낙하</div>
        </a>

        <!-- 세 번째 실험 버튼 -->
        <a href="labs/chemistry.html" class="lab-card">
            <div class="lab-icon">🧪</div>
            <div class="lab-title">분자 결합</div>
        </a>
        
        <!-- 필요한 만큼 카드를 계속 추가할 수 있습니다 -->
    </div>

</body>
</html>
