<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Science Virtual LAB</title>
    <style>
        /* 서울남산체L 웹 폰트 불러오기 */
        @font-face {
            font-family: 'SeoulNamsanL';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanL.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        /* 기본 배경과 폰트 설정 */
        body {
            margin: 0;
            padding: 0;
            font-family: 'SeoulNamsanL', sans-serif;
            background-color: #f4f7f6;
            color: #333;
        }

        /* 상단 헤더 */
        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* 5열 바둑판 배열 설정 */
        .lab-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr); /* PC 기준 5칸을 한 줄로 꽉 채움 */
            gap: 20px;
            padding: 20px;
            max-width: 1100px; /* 5개가 들어가도록 전체 최대 너비 확장 */
            margin: 0 auto; 
        }

        /* 기기 화면 크기에 따른 반응형 줄바꿈 설정 */
        @media (max-width: 950px) {
            .lab-grid { grid-template-columns: repeat(3, 1fr); } /* 태블릿: 3칸 */
        }
        @media (max-width: 600px) {
            .lab-grid { grid-template-columns: repeat(2, 1fr); } /* 스마트폰: 2칸 */
        }

        /* 개별 실험 버튼(카드) 디자인 */
        .lab-card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            text-decoration: none;
            color: #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 130px;
        }

        .lab-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        .lab-icon {
            font-size: 35px;
            margin-bottom: 10px;
        }

        .lab-title {
            font-size: 15px;
            font-weight: bold;
            word-break: keep-all; /* 단어가 중간에 잘리지 않도록 설정 */
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <header>
        Science Virtual LAB
    </header>

    <div class="lab-grid">
        <!-- 1열 (1~5번) -->
        <a href="labs/pendulum.html" class="lab-card">
            <div class="lab-icon">⏱️</div>
            <div class="lab-title">단진자 운동</div>
        </a>
        <a href="labs/buoyancy.html" class="lab-card">
            <div class="lab-icon">🚢</div>
            <div class="lab-title">부력</div>
        </a>
        <a href="labs/hookeslaw.html" class="lab-card">
            <div class="lab-icon">📏</div>
            <div class="lab-title">용수철과 무게</div>
        </a>
        <a href="labs/faraday.html" class="lab-card">
            <div class="lab-icon">🧲</div>
            <div class="lab-title">전자기 유도</div>
        </a>
        <a href="labs/electrostatics.html" class="lab-card">
            <div class="lab-icon">⚡</div>
            <div class="lab-title">정전기 유도</div>
        </a>

        <!-- 2열 (6~10번) -->
        <a href="labs/gravity.html" class="lab-card">
            <div class="lab-icon">🍎</div>
            <div class="lab-title">자유 낙하</div>
        </a>
        <a href="labs/refraction.html" class="lab-card">
            <div class="lab-icon">💡</div>
            <div class="lab-title">빛의 굴절</div>
        </a>
        <a href="labs/waves.html" class="lab-card">
            <div class="lab-icon">🌊</div>
            <div class="lab-title">파동의 성질</div>
        </a>
        <a href="labs/ohm.html" class="lab-card">
            <div class="lab-icon">🔋</div>
            <div class="lab-title">옴의 법칙</div>
        </a>
        <a href="labs/lens.html" class="lab-card">
            <div class="lab-icon">🔍</div>
            <div class="lab-title">볼록 렌즈</div>
        </a>
    </div>

</body>
</html>
