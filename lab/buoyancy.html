<div>
<style>
    /* 시뮬레이션 전체 래퍼 */
    #physics-sim-wrapper {
        position: relative;
        font-family: 'Pretendard', -apple-system, sans-serif;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 12px;
        padding: 20px;
        margin: 20px 0;
        text-align: center;
        box-sizing: border-box;
        overflow: hidden;
        transition: all 0.3s ease;
    }

    /* CSS 기반 강력한 전체화면 모드 (모바일 100% 호환) */
    #physics-sim-wrapper.fullscreen-mode {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        max-width: none !important;
        margin: 0 !important;
        border: none !important;
        border-radius: 0 !important;
        padding: 15px !important;
        background: #ffffff !important;
        z-index: 99999 !important;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    #physics-sim-wrapper .sim-desc {
        background: #f8f9fa;
        padding: 15px;
        border-radius: 8px;
        font-size: 14px;
        color: #333;
        margin-bottom: 15px;
        text-align: left;
        line-height: 1.6;
        width: 100%;
        max-width: 800px;
        box-sizing: border-box;
    }
    
    #physics-sim-wrapper.fullscreen-mode .sim-desc {
        display: none; /* 전체화면 시 설명란을 숨겨 몰입감 극대화 */
    }

    /* 컨트롤 오버레이 (체크박스 및 레버) */
    .control-panel {
        width: 100%;
        max-width: 800px;
        background: rgba(255, 255, 255, 0.95);
        padding: 15px;
        border-radius: 8px;
        border: 1px solid #aaa;
        font-size: 14px;
        text-align: left;
        margin-bottom: 15px;
        box-sizing: border-box;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
    }

    .checkbox-group label {
        margin-right: 15px;
        cursor: pointer;
        color: #333;
        font-weight: bold;
    }
    
    .slider-container {
        flex: 1;
        min-width: 200px;
        display: flex;
        flex-direction: column;
    }
    .slider-container label {
        font-size: 13px;
        margin-bottom: 5px;
        font-weight: bold;
    }
    .slider-container input[type="range"] {
        width: 100%;
        cursor: pointer;
    }

    /* 캔버스를 감싸는 반응형 컨테이너 */
    .canvas-container {
        position: relative;
        width: 100%;
        max-width: 800px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #physics-sim-wrapper.fullscreen-mode .canvas-container {
        flex: 1; /* 남은 높이 꽉 채우기 */
        min-height: 0; 
        max-width: 100%;
    }

    #simCanvas {
        background: #e0f7fa;
        border-radius: 8px;
        border: 1px solid #ccc;
        cursor: grab;
        touch-action: none; /* 터치 스크롤 완벽 방지 */
        display: block;
        /* 크기는 JS로 동적 할당됨 (비율 유지) */
    }
    #simCanvas:active {
        cursor: grabbing;
    }

    /* 버튼 컨테이너 */
    .button-group {
        display: flex;
        justify-content: center;
        gap: 15px;
        width: 100%;
        max-width: 800px;
        margin-top: 15px;
    }
    
    .btn {
        padding: 12px 24px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        font-weight: bold;
        font-size: 15px;
        transition: background 0.2s;
        flex: 1;
        max-width: 250px;
    }
    #resetBtn { background: #4CAF50; color: white; }
    #resetBtn:hover { background: #45a049; }
    #fullscreenBtn { background: #333; color: white; }
    #fullscreenBtn:hover { background: #555; }

</style>
</div>
<div id="physics-sim-wrapper">
<h2 style="margin-top: 0; max-width: 800px; width: 100%;" data-ke-size="size26">부력과 중력 평형 시뮬레이션</h2>
<div class="sim-desc"><b>[실험 방법]</b><br />1. 배를 마우스나 <b>터치로 드래그</b>하여 물속으로 깊이 넣어 보세요.<br />2. <b>중력가속도 레버</b>를 조절하며 힘과 진동의 변화를 관찰해 보세요.</div>
<div class="control-panel">
<div class="checkbox-group"><label><input id="chkGravity" checked="checked" type="checkbox" /> 🔴 중력 표시</label> <label><input id="chkBuoyancy" checked="checked" type="checkbox" /> 🔵 부력 표시</label></div>
<div class="slider-container"><label for="gSlider">중력가속도: <span>9.8</span> m/s&sup2;</label> <input id="gSlider" max="10" min="0" step="0.1" type="range" value="9.8" /></div>
</div>
<div id="canvasContainer" class="canvas-container">&nbsp;</div>
<div class="button-group"><button id="resetBtn" class="btn">초기 상태로</button> <button id="fullscreenBtn" class="btn">전체화면 ⛶</button></div>
</div>
<script>
(function() {
    const canvas = document.getElementById('simCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    
    const wrapper = document.getElementById('physics-sim-wrapper');
    const container = document.getElementById('canvasContainer');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const resetBtn = document.getElementById('resetBtn');
    
    const chkGravity = document.getElementById('chkGravity');
    const chkBuoyancy = document.getElementById('chkBuoyancy');
    const gSlider = document.getElementById('gSlider');
    const gValueDisplay = document.getElementById('gValue');

    // 내부 좌표계 (논리적 해상도는 항상 800x500 유지)
    const logicWidth = 800;
    const logicHeight = 500;
    const waterLevel = logicHeight / 2;

    const boat = { w: 180, h: 90, x: logicWidth / 2, y: waterLevel, vy: 0, mass: 1, isDragging: false };
    const baseGravityForce = 120; 
    const baseWaterDensity = baseGravityForce / (boat.h / 2); 
    const damping = 0.04;
    let dragOffsetY = 0;

    // 반응형 크기 조절 함수 (비율 유지)
    function resizeCanvasLayout() {
        const cWidth = container.clientWidth;
        // 전체화면 모드일 경우 컨테이너의 실제 높이 사용, 아닐 경우 비율(5/8)로 계산
        const isFS = wrapper.classList.contains('fullscreen-mode');
        const cHeight = isFS ? container.clientHeight : cWidth * (5 / 8); 

        const targetRatio = logicWidth / logicHeight; // 1.6
        let newWidth = cWidth;
        let newHeight = newWidth / targetRatio;

        // 전체화면 시 화면 세로 길이에 꽉 차게 제한
        if (isFS && newHeight > container.clientHeight) {
            newHeight = container.clientHeight;
            newWidth = newHeight * targetRatio;
        }

        canvas.style.width = newWidth + 'px';
        canvas.style.height = newHeight + 'px';
    }
    window.addEventListener('resize', resizeCanvasLayout);

    // 마우스 및 터치 좌표 계산 함수 (스타일 크기 변경에 따른 비율 완벽 보정)
    function getMousePos(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = logicWidth / rect.width;
        const scaleY = logicHeight / rect.height;
        return {
            x: (clientX - rect.left) * scaleX,
            y: (clientY - rect.top) * scaleY
        };
    }

    // 터치 & 마우스 공통 로직
    function handleDown(clientX, clientY) {
        const pos = getMousePos(clientX, clientY);
        if (pos.x > boat.x - boat.w/2 && pos.x < boat.x + boat.w/2 &&
            pos.y > boat.y - boat.h/2 && pos.y < boat.y + boat.h/2) {
            boat.isDragging = true;
            dragOffsetY = boat.y - pos.y;
            boat.vy = 0;
        }
    }
    function handleMove(clientX, clientY) {
        if (boat.isDragging) {
            const pos = getMousePos(clientX, clientY);
            let newY = pos.y + dragOffsetY;
            newY = Math.max(boat.h/2, Math.min(logicHeight - boat.h/2, newY));
            boat.y = newY;
        }
    }
    function handleUp() { boat.isDragging = false; }

    // 이벤트 리스너 등록
    canvas.addEventListener('mousedown', (e) => handleDown(e.clientX, e.clientY));
    canvas.addEventListener('mousemove', (e) => handleMove(e.clientX, e.clientY));
    window.addEventListener('mouseup', handleUp);
    canvas.addEventListener('mouseleave', handleUp);

    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        handleDown(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });
    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        handleMove(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });
    window.addEventListener('touchend', handleUp);
    canvas.addEventListener('touchcancel', handleUp);

    // 초기화 및 모드 전환 로직
    resetBtn.addEventListener('click', () => { boat.y = waterLevel; boat.vy = 0; });

    // 통합 전체화면 기능 (CSS 클래스 + API 혼합 방식)
    function toggleFullscreen() {
        const isFS = wrapper.classList.contains('fullscreen-mode');
        if (!isFS) {
            // 브라우저 API 시도 (PC/안드로이드 대응)
            if (wrapper.requestFullscreen) wrapper.requestFullscreen().catch(()=>{});
            else if (wrapper.webkitRequestFullscreen) wrapper.webkitRequestFullscreen();
            
            // 모바일 iOS 등을 위한 CSS 기반 강제 전체화면 추가
            wrapper.classList.add('fullscreen-mode');
            fullscreenBtn.innerText = '창모드 🗗';
        } else {
            // 브라우저 API 해제
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
            wrapper.classList.remove('fullscreen-mode');
            fullscreenBtn.innerText = '전체화면 ⛶';
        }
        // UI 렌더링 후 캔버스 리사이즈 갱신
        setTimeout(resizeCanvasLayout, 100);
    }
    fullscreenBtn.addEventListener('click', toggleFullscreen);

    // 사용자가 ESC키를 눌러 나갔을 때 상태 동기화
    function syncFullscreenState() {
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            wrapper.classList.remove('fullscreen-mode');
            fullscreenBtn.innerText = '전체화면 ⛶';
            setTimeout(resizeCanvasLayout, 100);
        }
    }
    document.addEventListener('fullscreenchange', syncFullscreenState);
    document.addEventListener('webkitfullscreenchange', syncFullscreenState);

    function drawArrow(ctx, fromX, fromY, toX, toY, color, label, isUp) {
        const headlen = 12;
        const dx = toX - fromX;
        const dy = toY - fromY;
        const angle = Math.atan2(dy, dx);
        const length = Math.sqrt(dx*dx + dy*dy);
        if (length < 1) return;

        ctx.beginPath();
        ctx.moveTo(fromX, fromY);
        ctx.lineTo(toX, toY);
        ctx.strokeStyle = color;
        ctx.lineWidth = 5;
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(toX, toY);
        ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
        ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
        ctx.fillStyle = color;
        ctx.fill();

        ctx.font = 'bold 18px sans-serif';
        ctx.fillStyle = color;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, toX + 15, isUp ? toY + 10 : toY - 10);
    }

    function loop() {
        ctx.clearRect(0, 0, logicWidth, logicHeight);

        let currentG = parseFloat(gSlider.value);
        gValueDisplay.innerText = currentG.toFixed(1);
        let gRatio = currentG / 9.8; 

        let bottomOfBoat = boat.y + boat.h / 2;
        let submergedDepth = Math.max(0, Math.min(boat.h, bottomOfBoat - waterLevel));
        
        let Fb = baseWaterDensity * submergedDepth * gRatio;
        let Fg = baseGravityForce * gRatio;

        if (!boat.isDragging) {
            let Fnet = Fg - Fb;
            let acc = Fnet / boat.mass;
            boat.vy += acc * 0.045; 
            boat.vy *= (1 - damping);
            boat.y += boat.vy;
            
            if(boat.y < boat.h/2) { boat.y = boat.h/2; boat.vy = 0; }
            if(boat.y > logicHeight - boat.h/2) { boat.y = logicHeight - boat.h/2; boat.vy = 0; }
        }

        ctx.fillStyle = '#6c757d';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('공기', 30, 40);

        ctx.fillStyle = 'rgba(0, 105, 148, 0.6)';
        ctx.fillRect(0, waterLevel, logicWidth, logicHeight - waterLevel);
        
        ctx.beginPath();
        ctx.moveTo(0, waterLevel);
        ctx.lineTo(logicWidth, waterLevel);
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.fillText('바닷물', 30, waterLevel + 40);

        ctx.save();
        ctx.translate(boat.x, boat.y);
        ctx.beginPath();
        ctx.moveTo(-boat.w/2, -boat.h/2); 
        ctx.lineTo(boat.w/2, -boat.h/2);  
        ctx.lineTo(boat.w/2 - 30, boat.h/2); 
        ctx.lineTo(-boat.w/2 + 30, boat.h/2); 
        ctx.closePath();
        
        ctx.fillStyle = '#d7ccc8';
        ctx.fill();
        ctx.strokeStyle = '#5d4037';
        ctx.lineWidth = 4;
        ctx.stroke();
        
        ctx.beginPath();
        ctx.arc(0, 0, 5, 0, Math.PI*2);
        ctx.fillStyle = '#333';
        ctx.fill();
        ctx.restore();

        if (chkGravity.checked) drawArrow(ctx, boat.x, boat.y, boat.x, boat.y + Fg, '#e53935', '중력', false);
        if (chkBuoyancy.checked) drawArrow(ctx, boat.x, boat.y, boat.x, boat.y - Fb, '#1e88e5', '부력', true);

        requestAnimationFrame(loop);
    }
    
    // 초기 레이아웃 적용 후 루프 시작
    resizeCanvasLayout();
    loop();
})();
</script>
