<!DOCTYPE html>
<html lang="ko">
<head><script src="../labs/common/i18n.js"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>가정통신문 빌더 · Science Virtual LAB</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#f4f7f6">
<meta name="robots" content="noindex,nofollow">
<link rel="preload" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="../labs/common/work-tool.css">
<link rel="stylesheet" href="../labs/common/feedback.css">
</head>
<body class="wt">

<header class="wt-bar" data-svl-nofit>
  <a class="wt-brand" href="../work.html">
    <span class="wt-logo">⚡</span>
    <span class="wt-name"><span class="wt-site">Science Virtual LAB <span class="wt-sep">·</span> </span><b>가정통신문 빌더</b></span>
  </a>
  <div class="wt-acts">
    <button class="wt-pill" id="aiBtn" type="button"><span aria-hidden="true">⚙️</span> <span class="lbl">AI Worker</span></button>
    <a class="wt-pill" id="navWork" href="../work.html"><span aria-hidden="true">←</span> <span class="lbl">업무</span></a>
    <a class="wt-pill" id="navHome" href="../index.html"><span aria-hidden="true">🏠</span> <span class="lbl">메인</span></a>
    <div class="top-right-bar"><div class="tr-util">
      <button class="wt-pill" id="lockBtn" type="button"><span aria-hidden="true">🔒</span> <span class="lbl">잠금</span></button>
    </div></div>
  </div>
</header>

<main class="wt-main" data-svl-nofit>
  <div class="wt-head">
    <h1>📰 가정통신문 빌더</h1>
    <p>행사 목적·일시·준비물·협조 사항만 적으면, 학부모가 읽기 편한 가정통신문 초안을 만들어 줍니다. 나이스·학교종이 앱에 바로 붙여넣거나 A4로 인쇄할 수 있습니다.</p>
  </div>

  <div class="wt-grid">
    <form class="wt-card wt-form" id="f" autocomplete="off">
      <h2><span class="num">1</span> 무슨 행사인가요?</h2>

      <div class="wt-fld">
        <label for="iTitle">행사명·목적 <span class="req">*</span></label>
        <input class="wt-in" id="iTitle" type="text" placeholder="예: 1학년 현장체험학습(경주 역사 탐방)" required>
      </div>

      <div class="wt-fld">
        <label for="iWhen">일시</label>
        <input class="wt-in" id="iWhen" type="text" placeholder="예: 11월 26일(수) 08:40~16:30">
      </div>

      <div class="wt-fld">
        <label for="iWhere">장소</label>
        <input class="wt-in" id="iWhere" type="text" placeholder="예: 경주 불국사·국립경주박물관 일원">
      </div>

      <div class="wt-fld">
        <label>대상</label>
        <div class="wt-chips" id="whoChips" role="group" aria-label="대상">
          <button type="button" class="wt-chip on" data-v="전교생">전교생</button>
          <button type="button" class="wt-chip" data-v="1학년">1학년</button>
          <button type="button" class="wt-chip" data-v="2학년">2학년</button>
          <button type="button" class="wt-chip" data-v="3학년">3학년</button>
          <button type="button" class="wt-chip" data-v="학부모">학부모</button>
        </div>
      </div>

      <div class="wt-fld">
        <label for="iPrep">준비물</label>
        <input class="wt-in" id="iPrep" type="text" placeholder="예: 도시락, 물, 모자, 필기구">
      </div>

      <div class="wt-fld">
        <label for="iNotes">학부모 협조·유의 사항</label>
        <textarea class="wt-ta" id="iNotes" placeholder="예: 08:30까지 등교, 개인 간식 1만 원 이내, 귀가 후 안전 문자 꼭 보내 주세요."></textarea>
        <p class="wt-hint">한 줄에 하나씩 적으면 항목으로 나눠 정리합니다.</p>
      </div>

      <div class="wt-fld">
        <label for="iContact">회신·문의처</label>
        <input class="wt-in" id="iContact" type="text" placeholder="예: 담임 000 선생님(학교 055-000-0000), 11월 21일(금)까지 회신">
      </div>

      <div class="wt-fld">
        <label>문체</label>
        <div class="wt-chips" id="toneChips" role="group" aria-label="문체">
          <button type="button" class="wt-chip on" data-v="정중하고 따뜻한 안내문">정중하고 따뜻한 안내문</button>
          <button type="button" class="wt-chip" data-v="간결한 요약형">간결한 요약형</button>
        </div>
      </div>

      <div class="wt-run">
        <button class="wt-btn primary" id="btnGen" type="submit">✍️ 초안 만들기</button>
        <button class="wt-btn ghost" id="btnSample" type="button">예시 채우기</button>
      </div>
    </form>

    <section class="wt-out" aria-live="polite">
      <div class="wt-out-bar">
        <span class="t">📄 가정통신문 초안</span>
        <span class="wt-src" id="src" hidden></span>
        <button class="wt-btn" id="btnCopy" type="button">📋 복사</button>
        <button class="wt-btn" id="btnPrint" type="button">🖨️ A4 인쇄</button>
        <button class="wt-btn ghost" id="btnReset" type="button">🔄 초기화</button>
      </div>
      <div class="wt-paper" id="paper">
        <p class="placeholder">행사명을 적고 초안 만들기를 누르면 학부모용 가정통신문이 여기에 만들어집니다.</p>
      </div>
    </section>
  </div>
</main>

<script src="../labs/common/work-tool.js"></script>
<script src="../labs/common/feedback.js" defer></script>
<script src="../labs/common/haptics.js" defer></script>
<script>
(function () {
    'use strict';

    var TBD = { ko: '미정', en: 'TBD', ja: '未定', zh: '待定', es: 'Por confirmar' };

    var SYS = 'You write Korean school newsletters (가정통신문) for middle-school parents. ' +
        'Return ONLY plain text in this compact markdown: "# 대제목", "## 소제목", "- 목록", "| 항목 | 내용 |" tables. ' +
        'No preamble, no explanation, no code fences.';

    var DRAFT = {
        ko: function (d) {
            var warm = d.tone !== '간결한 요약형';
            var notes = d.notes.length ? d.notes : ['학생이 안전하게 참여할 수 있도록 가정에서도 관심을 부탁드립니다.'];
            var out = [];
            out.push('# ' + d.title + ' 안내');
            out.push('');
            if (warm) {
                out.push('## 학부모님께');
                out.push('안녕하십니까? 학부모님의 가정에 늘 건강과 행복이 가득하시길 바랍니다.');
                out.push('아래와 같이 **' + d.title + '**을(를) 안내드리오니, 학생이 뜻깊게 참여할 수 있도록 따뜻한 관심과 협조를 부탁드립니다.');
                out.push('');
            }
            out.push('## 행사 안내');
            out.push('| 구분 | 내용 |');
            out.push('| --- | --- |');
            out.push('| 일시 | ' + (d.when || TBD.ko) + ' |');
            out.push('| 장소 | ' + (d.where || TBD.ko) + ' |');
            out.push('| 대상 | ' + (d.who || TBD.ko) + ' |');
            out.push('| 준비물 | ' + (d.prep || '없음') + ' |');
            out.push('');
            out.push('## 협조해 주실 일');
            notes.forEach(function (n) { out.push('- ' + n); });
            out.push('');
            out.push('## 회신·문의');
            out.push('- ' + (d.contact || '담임 선생님께 문의해 주세요.'));
            out.push('');
            out.push('## 맺음말');
            out.push(warm
                ? '학생들이 학교 밖에서도 배움을 넓히는 소중한 시간이 될 수 있도록 가정에서도 격려해 주시기 바랍니다. 감사합니다.'
                : '협조에 감사드립니다.');
            return out.join('\n');
        },
        en: function (d) {
            var warm = d.tone !== '간결한 요약형';
            var notes = d.notes.length ? d.notes : ['We ask for your interest at home so that students can take part safely.'];
            var out = [];
            out.push('# Notice: ' + d.title);
            out.push('');
            if (warm) {
                out.push('## Dear parents');
                out.push('Greetings, and we wish your family health and happiness.');
                out.push('Please find below the details of **' + d.title + '**. We would be grateful for your warm interest and cooperation so that your child can take part meaningfully.');
                out.push('');
            }
            out.push('## Event details');
            out.push('| Item | Details |');
            out.push('| --- | --- |');
            out.push('| Date & time | ' + (d.when || TBD.en) + ' |');
            out.push('| Place | ' + (d.where || TBD.en) + ' |');
            out.push('| Participants | ' + (d.who || TBD.en) + ' |');
            out.push('| What to bring | ' + (d.prep || 'Not needed') + ' |');
            out.push('');
            out.push('## What we ask of you');
            notes.forEach(function (n) { out.push('- ' + n); });
            out.push('');
            out.push('## Reply & enquiries');
            out.push('- ' + (d.contact || 'Please contact your homeroom teacher.'));
            out.push('');
            out.push('## Closing');
            out.push(warm
                ? 'We hope this will be a valuable time of learning beyond the classroom, and ask for your encouragement at home. Thank you.'
                : 'Thank you for your cooperation.');
            return out.join('\n');
        },
        ja: function (d) {
            var warm = d.tone !== '간결한 요약형';
            var notes = d.notes.length ? d.notes : ['生徒が安全に参加できますよう、ご家庭でもご関心をお願いいたします。'];
            var out = [];
            out.push('# ' + d.title + ' のお知らせ');
            out.push('');
            if (warm) {
                out.push('## 保護者の皆様へ');
                out.push('平素より本校の教育活動にご理解とご協力をいただき、ありがとうございます。');
                out.push('下記のとおり **' + d.title + '** を実施いたします。お子様が有意義に参加できますよう、温かいご関心とご協力をお願いいたします。');
                out.push('');
            }
            out.push('## 実施案内');
            out.push('| 区分 | 内容 |');
            out.push('| --- | --- |');
            out.push('| 日時 | ' + (d.when || TBD.ja) + ' |');
            out.push('| 場所 | ' + (d.where || TBD.ja) + ' |');
            out.push('| 対象 | ' + (d.who || TBD.ja) + ' |');
            out.push('| 持ち物 | ' + (d.prep || 'なし') + ' |');
            out.push('');
            out.push('## ご協力のお願い');
            notes.forEach(function (n) { out.push('- ' + n); });
            out.push('');
            out.push('## 返信・お問い合わせ');
            out.push('- ' + (d.contact || '担任までお問い合わせください。'));
            out.push('');
            out.push('## 結び');
            out.push(warm
                ? '校外でも学びを広げる貴重な時間となりますよう、ご家庭でも励ましていただければ幸いです。よろしくお願いいたします。'
                : 'ご協力ありがとうございます。');
            return out.join('\n');
        },
        zh: function (d) {
            var warm = d.tone !== '간결한 요약형';
            var notes = d.notes.length ? d.notes : ['为了学生安全参加，请家长在家中也给予关注。'];
            var out = [];
            out.push('# ' + d.title + ' 通知');
            out.push('');
            if (warm) {
                out.push('## 致家长');
                out.push('您好！祝您家庭健康幸福。');
                out.push('现将 **' + d.title + '** 相关事宜通知如下，恳请您给予关心与配合，让孩子有意义地参与活动。');
                out.push('');
            }
            out.push('## 活动安排');
            out.push('| 项目 | 内容 |');
            out.push('| --- | --- |');
            out.push('| 时间 | ' + (d.when || TBD.zh) + ' |');
            out.push('| 地点 | ' + (d.where || TBD.zh) + ' |');
            out.push('| 对象 | ' + (d.who || TBD.zh) + ' |');
            out.push('| 准备物品 | ' + (d.prep || '无') + ' |');
            out.push('');
            out.push('## 请家长配合');
            notes.forEach(function (n) { out.push('- ' + n); });
            out.push('');
            out.push('## 回复与咨询');
            out.push('- ' + (d.contact || '请咨询班主任老师。'));
            out.push('');
            out.push('## 结语');
            out.push(warm
                ? '希望这次活动成为孩子走出课堂、拓展学习的好机会，也请家长在家给予鼓励。谢谢！'
                : '感谢您的配合。');
            return out.join('\n');
        },
        es: function (d) {
            var warm = d.tone !== '간결한 요약형';
            var notes = d.notes.length ? d.notes : ['Le pedimos interés en casa para que el alumnado participe con seguridad.'];
            var out = [];
            out.push('# Aviso: ' + d.title);
            out.push('');
            if (warm) {
                out.push('## Estimadas familias');
                out.push('Reciban un cordial saludo y nuestros mejores deseos para su familia.');
                out.push('Les informamos a continuación sobre **' + d.title + '**. Agradecemos su interés y colaboración para que su hijo o hija participe de forma significativa.');
                out.push('');
            }
            out.push('## Datos del evento');
            out.push('| Apartado | Detalle |');
            out.push('| --- | --- |');
            out.push('| Fecha y hora | ' + (d.when || TBD.es) + ' |');
            out.push('| Lugar | ' + (d.where || TBD.es) + ' |');
            out.push('| Participantes | ' + (d.who || TBD.es) + ' |');
            out.push('| Qué llevar | ' + (d.prep || 'Nada') + ' |');
            out.push('');
            out.push('## Le pedimos');
            notes.forEach(function (n) { out.push('- ' + n); });
            out.push('');
            out.push('## Respuesta y consultas');
            out.push('- ' + (d.contact || 'Consulte con el tutor o tutora.'));
            out.push('');
            out.push('## Despedida');
            out.push(warm
                ? 'Esperamos que sea una experiencia valiosa de aprendizaje fuera del aula y le agradecemos su apoyo en casa. Muchas gracias.'
                : 'Gracias por su colaboración.');
            return out.join('\n');
        }
    };

    function $(s) { return document.querySelector(s); }
    var lastText = '';

    function readForm() {
        var who = $('#whoChips .wt-chip.on');
        var tone = $('#toneChips .wt-chip.on');
        return {
            title: $('#iTitle').value.trim(),
            when: $('#iWhen').value.trim(),
            where: $('#iWhere').value.trim(),
            who: who ? who.dataset.v : '',
            prep: $('#iPrep').value.trim(),
            notes: $('#iNotes').value.split(/\n+/).map(function (s) { return s.trim(); }).filter(Boolean),
            contact: $('#iContact').value.trim(),
            tone: tone ? tone.dataset.v : '정중하고 따뜻한 안내문'
        };
    }

    function promptFor(d) {
        var lang = window.SVLWorkTool.lang();
        var L = {
            ko: 'Korean', en: 'English', ja: 'Japanese', zh: 'Chinese', es: 'Spanish'
        };
        var lines = [
            'Write a school newsletter (가정통신문) for parents in ' + L[lang] + '.',
            'Event / purpose: ' + d.title,
            'Date & time: ' + (d.when || '-'),
            'Place: ' + (d.where || '-'),
            'Participants: ' + window.SVLWorkTool.term(d.who || '-'),
            'What to bring: ' + (d.prep || '-'),
            'Parents must note: ' + (d.notes.length ? d.notes.join(' / ') : '-'),
            'Reply / contact: ' + (d.contact || '-'),
            'Tone: ' + window.SVLWorkTool.term(d.tone),
            'Structure: title, greeting, an event table (when / place / who / what to bring), what we ask of parents, reply & enquiries, closing.',
            'Use the exact facts above; do not invent dates, fees or phone numbers. Korean school context, middle school.'
        ];
        return lines.join('\n');
    }

    function run() {
        var WT = window.SVLWorkTool;
        var d = readForm();
        if (!d.title) { WT.toast('행사명을 먼저 적어 주세요'); $('#iTitle').focus(); return; }
        var btn = $('#btnGen');
        WT.busy(btn, true, '✍️ 작성 중…');
        WT.badge('#src', 'busy');
        WT.generate({ kind: 'newsletter', system: SYS, prompt: promptFor(d), draft: function () { return DRAFT[WT.lang()](d); } })
            .then(function (r) {
                lastText = r.text;
                WT.paint('#paper', r.text);
                WT.badge('#src', r.source);
                WT.busy(btn, false);
                if (r.source === 'draft') {
                    WT.toast(r.error && r.error.reason === 'no-worker'
                        ? WT.P({ ko: 'AI 연결 없이 즉시 초안으로 만들었습니다', en: 'Made an instant draft (no AI worker)', ja: 'AI未接続の即時下書きです', zh: '已生成即时草稿（未连接 AI）', es: 'Borrador instantáneo (sin IA)' })
                        : WT.P({ ko: 'AI 응답이 없어 즉시 초안으로 만들었습니다', en: 'No AI answer — used the instant draft', ja: 'AI応答なし。即時下書きを使用', zh: 'AI 无响应，已使用即时草稿', es: 'Sin respuesta de IA: borrador instantáneo' }));
                }
            });
    }

    window.SVLWorkTool.ready(function (WT) {
        $('#f').addEventListener('submit', function (e) { e.preventDefault(); run(); });
        ['#whoChips', '#toneChips'].forEach(function (sel) {
            var box = $(sel);
            box.addEventListener('click', function (e) {
                var b = e.target.closest('.wt-chip');
                if (!b) return;
                box.querySelectorAll('.wt-chip').forEach(function (x) { x.classList.remove('on'); });
                b.classList.add('on');
            });
        });
        $('#btnCopy').addEventListener('click', function () {
            if (!lastText) { WT.toast(WT.P({ ko: '먼저 초안을 만들어 주세요', en: 'Make a draft first', ja: '先に下書きを作成してください', zh: '请先生成草稿', es: 'Primero crea un borrador' })); return; }
            WT.copy(lastText, WT.P({ ko: '복사했습니다. 나이스·학교종이 앱에 붙여넣으세요', en: 'Copied — paste into NEIS or the school app', ja: 'コピーしました。アプリに貼り付けてください', zh: '已复制，可粘贴到应用', es: 'Copiado: pégalo en la app del colegio' }));
        });
        $('#btnPrint').addEventListener('click', function () { WT.print(); });
        $('#btnReset').addEventListener('click', function () {
            $('#f').reset();
            $('#whoChips').querySelectorAll('.wt-chip').forEach(function (x, i) { x.classList.toggle('on', i === 0); });
            $('#toneChips').querySelectorAll('.wt-chip').forEach(function (x, i) { x.classList.toggle('on', i === 0); });
            lastText = '';
            $('#paper').innerHTML = '<p class="placeholder">행사명을 적고 초안 만들기를 누르면 학부모용 가정통신문이 여기에 만들어집니다.</p>';
            WT.badge('#src', '');
            $('#iTitle').focus();
            WT.toast(WT.P({ ko: '초기화했습니다', en: 'Cleared', ja: '初期化しました', zh: '已清空', es: 'Borrado' }));
        });
        $('#btnSample').addEventListener('click', function () {
            $('#iTitle').value = '1학년 현장체험학습(경주 역사 탐방)';
            $('#iWhen').value = '11월 26일(수) 08:40~16:30';
            $('#iWhere').value = '경주 불국사·국립경주박물관 일원';
            $('#iPrep').value = '도시락, 물, 모자, 필기구';
            $('#iNotes').value = '08:30까지 등교해 주세요.\n간식은 1만 원 이내로 준비해 주세요.\n귀가 후 안전 도착 문자를 꼭 보내 주세요.';
            $('#iContact').value = '담임 000 선생님(055-000-0000), 11월 21일(금)까지 회신';
            var w = $('#whoChips').querySelector('[data-v="1학년"]');
