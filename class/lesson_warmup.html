    <p>단원과 학습 목표를 고르면 5분 안에 바로 실행할 수 있는 퀴즈·역할극·토의 아이디어를 3가지씩, 진행 멘트와 예상 반응까지 만들어 줍니다.</p>
  </div>

  <div class="wt-grid">
    <form class="wt-card wt-form" id="f" autocomplete="off">
      <h2><span class="num">1</span> 오늘 수업은?</h2>

      <div class="wt-fld">
        <label for="iUnit">교과·단원명 <span class="req">*</span></label>
        <input class="wt-in" id="iUnit" type="text" placeholder="예: 중2 과학 · 전기와 자기" required>
      </div>

      <div class="wt-fld">
        <label for="iGoal">차시 학습 목표</label>
        <textarea class="wt-ta" id="iGoal" placeholder="예: 전류·전압·저항의 관계를 설명하고, 옴의 법칙으로 저항을 구할 수 있다."></textarea>
      </div>

      <div class="wt-fld">
        <label>학년 수준</label>
        <div class="wt-chips" id="lvChips" role="group" aria-label="학년 수준">
          <button type="button" class="wt-chip" data-v="중1">중1</button>
          <button type="button" class="wt-chip on" data-v="중2">중2</button>
          <button type="button" class="wt-chip" data-v="중3">중3</button>
        </div>
      </div>

      <div class="wt-fld">
        <label>수업 분위기</label>
        <div class="wt-chips" id="moodChips" role="group" aria-label="수업 분위기">
          <button type="button" class="wt-chip on" data-v="활발한 참여">활발한 참여</button>
          <button type="button" class="wt-chip" data-v="조용한 집중">조용한 집중</button>
          <button type="button" class="wt-chip" data-v="모둠 토의">모둠 토의</button>
        </div>
      </div>

      <div class="wt-fld">
        <label>가용 시간</label>
        <div class="wt-chips" id="timeChips" role="group" aria-label="가용 시간">
          <button type="button" class="wt-chip" data-v="3분">3분</button>
          <button type="button" class="wt-chip on" data-v="5분">5분</button>
          <button type="button" class="wt-chip" data-v="7분">7분</button>
        </div>
      </div>

      <div class="wt-run">
        <button class="wt-btn primary" id="btnGen" type="submit">✨ 아이디어 만들기</button>
        <button class="wt-btn ghost" id="btnSample" type="button">예시 채우기</button>
      </div>
    </form>

    <section class="wt-out" aria-live="polite">

                '## ① 三个小测创意',
                '### 1. 三个对错判断开场',
                '- 说法：“关于' + u + '老师说三句话。对的举○，错的举×。第一句：‘' + g + '’在生活中永远成立吗？”',
                '- 预期反应：多数学生抢着说“当然对”，答案是对错相反时，会追问“咦，为什么？”并转入正题。',
                '### 2. 三秒关键词解释',
                '- 说法：“用三秒解释' + u + '中最重要的一个词。只能说话，不许比划！”',
                '- 预期反应：第一个学生卡壳，第二个接着说“啊，那个！”，概念的核心自然浮现。',
                '### 3. 找出错误说法',
                '- 说法：“这里有三句老师故意写错的话，30秒内找出错在哪里。”',
                '- 预期反应：连安静的学生也翻开课本，找到的小组笑着说“老师是故意的吧？”',
                '',
                '## ② 三个角色扮演创意',
                '### 1. 正反立场对决',
                '- 说法：“请两位同学：一位主张‘' + g + '’成立，一位主张不成立，各说30秒。没有输赢，更有说服力的获胜。”',
                '- 预期反应：起初笑嘻嘻，一旦有人给出理由，另一方就会说“话是这么说……”并认真起来。',
                '### 2. 30秒新闻采访',
                '- 说法：“一人当记者，一人当专家。记者：‘最近' + u + '争议不少。’专家请用30秒说明。”',
                '- 预期反应：记者即兴追问，专家会说“啊，这确实需要解释”，自己点出难点。',
                '### 3. 教室情景剧',
                '- 说法：“选一个与' + u + '有关的情景，演主角在三秒内做决定。”',
                '- 预期反应：同学喊“不对，那样不行！”，这一反应本身就成了今天的争论点。',
                '',
                '## ③ 三个讨论·提问主题',
                '### 1. 最不明白的一点',
                '- 说法：“和同桌说说‘' + u + '’里最不明白的一点，一分钟后请两三位同学分享。”',
                '- 预期反应：说“都懂了”的学生一旦要开口，就会细抠细节，问题一汇集，今天的目标就定了。',
                '### 2. 如果不成立会怎样？',
                '- 说法：“如果‘' + g + '’不成立，会是什么情形？每组说一个。”',
                '- 预期反应：安静型班级先写再说，讨论型班级会意见分歧并展开争论。',
                '### 3. 30秒观点接力',
                '- 说法：“轮流用30秒说出你认为‘' + u + '’中最重要的内容，不能与上一位重复。”',
                '- 预期反应：不能重复的规则让人更专注，越往后越要找更深的理由。',
                '',
                '## 教学提示',
                '- 想在' + d.time + '内结束，只选一个创意进行，其余留到下一节导入。',
                '- 面对' + d.mood + '的班级，用点名代替等待举手可以节省时间。',
                '- 最后把今日目标写在黑板一行，导入就自然衔接到学习目标。'
            ].join('\n');
        },
        es: function (d) {
            var u = d.unit, g = d.goal || d.unit;
            return [
                '# ' + u + ' · calentamiento de ' + d.time,
                '',
                '## Datos de la clase',
                '| Apartado | Detalle |',
                '| --- | --- |',
                '| Unidad | ' + u + ' |',
                '| Objetivo | ' + g + ' |',
                '| Nivel y ambiente | ' + d.lv + ' · ' + d.mood + ' |',
                '| Tiempo | ' + d.time + ' |',
                '',
                '## ① Tres ideas de concurso rápido',
                '### 1. Tres frases de verdadero o falso',
                '- Di: «Voy a leer tres frases sobre ' + u + '. Pulgar arriba si es verdadero, abajo si es falso. Primera: ¿‘' + g + '’ siempre se cumple en la vida real?»',
                '- Se espera: casi todos levantan la mano con «¡pues claro!» y, si la respuesta es falsa, preguntan «¿por qué?» y se enganchan.',

                '- Di: «Explica la palabra más importante de ' + u + ' en tres segundos. Solo palabras, sin gestos.»',

                '### 1. Debate de posturas opuestas',
                '- Di: «Dos voluntarios: uno defiende que ‘' + g + '’ es cierto y otro que no, 30 segundos cada uno. No hay ganador; gana quien convence más.»',
                '- Se espera: empiezan riendo y se ponen serios en cuanto alguien da una razón: «Bueno, pero…».',

                '- Di: «Un periodista y un experto. Periodista: “Últimamente se debate mucho sobre ' + u + '”. Experto: explícalo en 30 segundos.»',

                '### 3. Escena de aula',
                '- Di: «Elegid una situación relacionada con ' + u + ' y actuad la decisión del protagonista en tres segundos.»',

                '- Di: «Con tu compañero, decid una cosa de ‘' + u + '’ que no entendáis. En un minuto preguntaré a dos o tres.»',

                '### 2. ¿Y si no fuera cierto?',
                '- Di: «Si ‘' + g + '’ no se cumpliera, ¿qué situación veríamos? Un ejemplo por grupo.»',
                '- Se espera: los grupos tranquilos escriben primero y los participativos discuten; el objetivo llega igual.',
                '### 3. Relevo de argumentos de 30 segundos',
                '- Di: «Por turnos, defended en 30 segundos lo más importante de ‘' + u + '’. No vale repetir lo anterior.»',
                '- Se espera: la regla agudiza la atención y los últimos buscan razones más profundas.',
                '',
                '## Consejos',
                '- Para acabar en ' + d.time + ', haz una sola idea y guarda el resto para la próxima clase.',
                '- En un grupo de ' + d.mood + ', preguntar por nombre ahorra tiempo frente a esperar manos.',
                '- Escribe el objetivo en la pizarra al final para que el calentamiento enlace con la clase.'
            ].join('\n');
        }
    };

    function $(s) { return document.querySelector(s); }
    var lastText = '';

    function readForm() {
        var lv = $('#lvChips .wt-chip.on'), mood = $('#moodChips .wt-chip.on'), time = $('#timeChips .wt-chip.on');
        return {
            unit: $('#iUnit').value.trim(),
            goal: $('#iGoal').value.trim(),
            lv: lv ? lv.dataset.v : '중2',
            mood: mood ? mood.dataset.v : '활발한 참여',
            time: time ? time.dataset.v : '5분'
        };
    }

    function promptFor(d) {
        var WT = window.SVLWorkTool;
        var L = { ko: 'Korean', en: 'English', ja: 'Japanese', zh: 'Chinese', es: 'Spanish' };
        return [
            'Write lesson warm-up ideas in ' + L[WT.lang()] + ' for a Korean middle-school class.',
            'Unit: ' + d.unit,
            'Lesson objective: ' + (d.goal || '-'),
            'Level: ' + WT.term(d.lv) + ' / Class mood: ' + WT.term(d.mood) + ' / Available time: ' + WT.term(d.time),
            'Give exactly: ① three quiz ideas, ② three role-play or skit ideas, ③ three discussion or question prompts.',
            'For every idea add "- 진행 멘트:" (the exact words the teacher says) and "- 예상 학생 반응:" (what students will likely do or say), except write those two labels in the output language.',
            'Ideas must be doable within the given minutes with no special materials. Finish with a short "수업 팁" section.',
            'Do not invent textbook page numbers or student names.'
        ].join('\n');
    }

    function run() {
        var WT = window.SVLWorkTool;
        var d = readForm();
        if (!d.unit) { WT.toast('교과·단원명을 먼저 적어 주세요'); $('#iUnit').focus(); return; }
        var btn = $('#btnGen');
        WT.busy(btn, true, '✨ 작성 중…');
        WT.badge('#src', 'busy');
        WT.generate({ kind: 'warmup', system: SYS, prompt: promptFor(d), draft: function () { return DRAFT[WT.lang()](d); } })
            .then(function (r) {
                lastText = r.text;
                WT.paint('#paper', r.text);
                WT.badge('#src', r.source);
                WT.busy(btn, false);
                if (r.source === 'draft') WT.toast(WT.P({ ko: 'AI 연결 없이 즉시 초안으로 만들었습니다', en: 'Made an instant draft (no AI worker)', ja: 'AI未接続の即時下書きです', zh: '已生成即时草稿（未连接 AI）', es: 'Borrador instantáneo (sin IA)' }));
            });
    }

    window.SVLWorkTool.ready(function (WT) {
        $('#f').addEventListener('submit', function (e) { e.preventDefault(); run(); });
        ['#lvChips', '#moodChips', '#timeChips'].forEach(function (sel) {
            var box = $(sel);
            box.addEventListener('click', function (e) {
                var b = e.target.closest('.wt-chip');
                if (!b) return;
                box.querySelectorAll('.wt-chip').forEach(function (x) { x.classList.remove('on'); });
                b.classList.add('on');
            });
        });
        $('#btnCopy').addEventListener('click', function () {
            if (!lastText) { WT.toast(WT.P({ ko: '먼저 아이디어를 만들어 주세요', en: 'Generate ideas first', ja: '先にアイデアを作成してください', zh: '请先生成创意', es: 'Primero genera ideas' })); return; }
            WT.copy(lastText);
        });
        $('#btnReset').addEventListener('click', function () {
            $('#f').reset();
            ['#lvChips', '#moodChips', '#timeChips'].forEach(function (sel) {
                var def = sel === '#lvChips' ? 1 : 0;
                $(sel).querySelectorAll('.wt-chip').forEach(function (x, i) { x.classList.toggle('on', i === def); });
            });
            lastText = '';
            $('#paper').innerHTML = '<p class="placeholder">단원과 학습 목표를 적고 아이디어 만들기를 누르면 퀴즈·역할극·토의 아이디어 9가지가 여기에 만들어집니다.</p>';
            WT.badge('#src', '');
            $('#iUnit').focus();
            WT.toast(WT.P({ ko: '초기화했습니다', en: 'Cleared', ja: '初期化しました', zh: '已清空', es: 'Borrado' }));
        });
        $('#btnSample').addEventListener('click', function () {
            $('#iUnit').value = '중2 과학 · 전기와 자기';
            $('#iGoal').value = '전류·전압·저항의 관계를 설명하고, 옴의 법칙으로 저항을 구할 수 있다.';
        });
    });
})();
</script>

</html>
