<!DOCTYPE html>
<html lang="ko">
<head><script src="../labs/common/i18n.js"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>가상실험실 탐구학습지</title>
<meta name="description" content="Science Virtual LAB 물리 37·화학 21·생명과학 21·지구과학 26, 모두 105종 과학 실험의 A4 한 장 탐구학습지를 실험별로 찾아 미리 보고 원클릭으로 인쇄하거나 PDF로 저장합니다.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="preload" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff" as="font" type="font/woff" crossorigin>
<style>
@font-face {
    font-family: 'SeoulNamsan';
    src: local('SeoulNamsan M'), local('SeoulNamsanM'), local('서울남산체 M'),
         url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff') format('woff');
    font-weight: 400; font-style: normal; font-display: swap;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    font-family: 'SeoulNamsan', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: #eef3fa; color: #16233a;
    -webkit-user-select: none; user-select: none;
    transition: background .3s ease, color .3s ease;
}
body.dark-mode { background: #0d1320; color: #eaf0fa; }
:root {
    --ink: #16233a; --sub: #64748b; --line: rgba(20,40,70,.12);
    --panel: rgba(255,255,255,.86); --panel-2: rgba(255,255,255,.96);
    --chip: rgba(50,110,210,.09); --accent: #2563eb; --accent-2: #7c3aed;
    --ok: #0f9d6b; --warn: #b45309; --danger: #d92c46; --shadow: 0 10px 32px rgba(20,40,80,.10);
}
body.dark-mode {
    --ink: #eaf0fa; --sub: #94a6c2; --line: rgba(150,180,230,.16);
    --panel: rgba(24,32,48,.8); --panel-2: rgba(30,40,60,.94);
    --chip: rgba(110,160,240,.13); --accent: #5b9bff; --accent-2: #a78bfa;
    --ok: #37d39b; --warn: #ffb454; --danger: #ff6b81; --shadow: 0 12px 36px rgba(0,0,0,.42);
}
.glass { background: var(--panel); backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }

/* ---------- 상단 ---------- */
.top-left-bar { position: fixed; top: 16px; left: 20px; display: flex; align-items: center; gap: 10px; z-index: 60; max-width: calc(100vw - 130px); }
.back-btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 15px; border-radius: 999px; text-decoration: none; color: var(--ink); font-family: inherit; font-weight: 700; font-size: 13.5px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); cursor: pointer; white-space: nowrap; transition: transform .18s ease; }
.back-btn:hover { transform: translateY(-1px); }
.page-title-badge { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; }
.page-title-badge .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qr-btn { padding: 9px 13px; }
.qr-btn-icon { font-size: 14px; }
.qr-btn-label { font-size: 12.5px; }
.top-right-bar { position: fixed; top: 16px; right: 20px; display: flex; align-items: center; gap: 8px; z-index: 60; }
.tr-util { display: flex; align-items: center; gap: 8px; }
.icon-btn { width: 40px; height: 40px; flex: 0 0 40px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-family: inherit; font-size: 16px; cursor: pointer; box-shadow: var(--shadow); padding: 0; }
.icon-btn:hover { transform: translateY(-1px); }

/* ---------- 레이아웃 ---------- */
.screen { position: absolute; inset: 0; padding: 70px 16px 20px; }
.layout { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 12px; height: calc(100vh - 92px); }
.panel { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.panel-head { padding: 12px 14px; border-bottom: 1px solid var(--line); }
.panel-title { font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.panel-title .cnt { font-size: 11px; color: var(--sub); font-weight: 700; }
.search-row { display: flex; gap: 6px; margin-top: 9px; }
input#search {
    flex: 1 1 auto; height: 38px; padding: 0 12px; border-radius: 11px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--ink); font-family: inherit; font-size: 12.5px; outline: none;
    -webkit-user-select: text; user-select: text;
}
input#search:focus { border-color: var(--accent); }
.chips { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
.chip {
    padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: transparent;
    color: var(--sub); font-family: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer;
}
.chip.on { background: var(--chip); color: var(--accent); border-color: rgba(80,140,240,.45); }
.list { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.item {
    text-align: left; padding: 10px 12px; border-radius: 12px; cursor: pointer;
    background: transparent; border: 1px solid transparent; color: var(--ink); font-family: inherit;
    display: flex; flex-direction: column; gap: 3px; transition: background .14s ease, border-color .14s ease;
}
.item:hover { background: var(--chip); }
.item.on { background: var(--chip); border-color: rgba(80,140,240,.45); }
.item .it-top { display: flex; align-items: center; gap: 7px; }
.item .it-num { width: 20px; height: 20px; flex: 0 0 20px; border-radius: 6px; background: var(--chip); color: var(--accent); font-size: 10.5px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; }
.item.on .it-num { background: rgba(80,140,240,.22); }
.item .it-title { font-size: 13px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .it-sub { font-size: 10.5px; color: var(--sub); padding-left: 27px; }
.item .it-field { font-size: 9.5px; font-weight: 800; padding: 1px 6px; border-radius: 999px; background: var(--chip); color: var(--accent); margin-left: auto; flex: 0 0 auto; }
.panel-foot { padding: 10px 12px 12px; border-top: 1px solid var(--line); display: flex; gap: 6px; flex-wrap: wrap; }
.act-btn {
    flex: 1 1 84px; min-height: 42px; border-radius: 12px; cursor: pointer; font-family: inherit;
    font-size: 12.5px; font-weight: 800; border: 1px solid var(--line); background: var(--chip); color: var(--ink);
    white-space: nowrap;
}
.act-btn.primary { border: none; color: #fff; background: linear-gradient(100deg,#2563eb,#7c3aed); box-shadow: 0 8px 20px rgba(50,100,220,.26); }
.act-btn:active { transform: scale(.98); }

/* ---------- 미리보기 ---------- */
.preview-panel { display: flex; flex-direction: column; min-height: 0; }
.preview-bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.preview-title { font-size: 12.5px; font-weight: 800; }
.preview-title span { color: var(--sub); font-weight: 700; }
.preview-bar .spacer { flex: 1 1 auto; }
.hint { font-size: 10.5px; color: var(--sub); }
.preview-scroll { flex: 1 1 auto; overflow: auto; -webkit-overflow-scrolling: touch; padding: 16px; display: flex; justify-content: center; align-items: flex-start; background: repeating-linear-gradient(45deg, rgba(120,150,200,.05) 0 10px, transparent 10px 20px); }

/* ---------- A4 (화면) ---------- */
.sheet-wrap { transform-origin: top center; }
.sheet-stack { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.sheet {
    width: 210mm; height: 297mm; padding: 11mm 12mm 10mm;
    background: #ffffff; color: #15202e;
    box-shadow: 0 14px 40px rgba(20,40,80,.18);
    font-family: 'SeoulNamsan', sans-serif; line-height: 1.5;
    position: relative; display: flex; flex-direction: column;
}
.sheet * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.sheet .page-body { flex: 1 1 auto; min-height: 0; }
.sheet .s-head { position: relative; padding-right: 25mm; padding-bottom: 5px; min-height: 22mm; border-bottom: 2.5px solid #15202e; }
.sheet .sheet-qr { position: absolute; top: 0.3mm; right: 0; width: 21mm; text-align: center; }
.sheet .sheet-qr .qr-box { width: 17mm; height: 17mm; margin: 0 auto; background: #fff; }
.sheet .sheet-qr .qr-box svg { display: block; width: 100%; height: 100%; }
.sheet .sheet-qr .qr-cap { display: block; margin-top: 0.7mm; font-size: 5.6pt; line-height: 1.2; color: #5b6b82; letter-spacing: -0.2px; }
.sheet .cont-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; border-bottom: 1px dashed #cdd8e6; padding-bottom: 4px; margin-bottom: 3mm; }
.sheet .cont-title { font-size: 8.8pt; font-weight: 700; color: #3c4a5e; line-height: 1.35; }
.sheet .cont-title em { font-style: normal; color: #78879c; }
.sheet .cont-qr { flex: 0 0 15mm; width: 15mm; text-align: center; }
.sheet .cont-qr .qr-box { width: 14mm; height: 14mm; margin: 0 auto; background: #fff; }
.sheet .cont-qr .qr-box svg { display: block; width: 100%; height: 100%; }
.sheet .cont-qr .qr-cap { display: block; margin-top: 0.5mm; font-size: 5.2pt; line-height: 1.2; color: #5b6b82; }
.sheet .s-field { font-size: 9pt; font-weight: 800; color: #2563eb; letter-spacing: 1.5px; }
.sheet h1 { margin: 2px 0 1px; font-size: 17.5pt; font-weight: 800; letter-spacing: -0.6px; line-height: 1.15; }
.sheet .s-lab { font-size: 8.5pt; color: #5b6b82; }
.sheet .s-meta { display: flex; gap: 8px; margin-top: 5px; font-size: 8pt; color: #3c4a5e; }
.sheet .s-meta span { flex: 1 1 0; border-bottom: 1px solid #9aa8ba; padding-bottom: 2px; }
.sheet .s-meta b { font-weight: 800; color: #15202e; }
.sheet section { margin-top: 6px; }
.sheet .sec-h .cont-mark { font-size: 8.2pt; font-weight: 700; color: #5b6b82; margin-left: 2px; }
.sheet .sec-h {
    display: flex; align-items: center; gap: 6px; font-size: 10pt; font-weight: 800;
    background: #eef4ff; border-left: 4px solid #2563eb; padding: 2px 7px; border-radius: 0 6px 6px 0;
}
.sheet ul, .sheet ol { margin: 3px 0 0; padding-left: 16px; }
.sheet li { font-size: 8.8pt; margin: 1px 0; line-height: 1.42; }
.sheet .prep { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.sheet .prep span { font-size: 8.3pt; border: 1px solid #cdd8e6; border-radius: 999px; padding: 1.5px 8px; color: #3c4a5e; }
.sheet table { width: 100%; border-collapse: collapse; margin-top: 4px; }
.sheet th, .sheet td { border: 1px solid #9aa8ba; padding: 3.4px 4px; font-size: 8.7pt; text-align: center; }
.sheet th { background: #f2f6fc; font-weight: 800; font-size: 8.2pt; color: #22314a; }
.sheet td.pre { font-weight: 700; color: #22314a; }
.sheet td.blank { height: 18px; }
.sheet .q-list { margin-top: 3px; }
.sheet .q { margin-top: 4px; }
.sheet .q .qt { font-size: 8.9pt; font-weight: 700; }
.sheet .q .lines { margin-top: 3px; }
.sheet .q .lines i { display: block; border-bottom: 1px dotted #9aa8ba; height: 15px; }
.sheet .tip { margin-top: 5px; font-size: 8pt; color: #4a5a70; background: #f7fafd; border: 1px dashed #cdd8e6; border-radius: 6px; padding: 4px 7px; line-height: 1.42; }
.sheet .s-foot { flex: 0 0 auto; margin-top: 3mm; display: flex; justify-content: space-between; gap: 6px; border-top: 1px solid #cdd8e6; padding-top: 3px; font-size: 7.2pt; color: #78879c; }

/* 한 장에 아슬아슬하게 넘치던 학습지를 한 장으로 담기 위한 한 단계 더 컴팩트한 판형 */
.sheet.tight { padding: 9mm 10mm 8mm; }
.sheet.tight .s-head { min-height: 19.5mm; padding-bottom: 4px; padding-right: 22mm; }
.sheet.tight .sheet-qr { width: 18mm; }
.sheet.tight .sheet-qr .qr-box { width: 15mm; height: 15mm; }
.sheet.tight .sheet-qr .qr-cap { font-size: 5pt; }
.sheet.tight h1 { font-size: 16pt; }
.sheet.tight .s-field { font-size: 8.6pt; }
.sheet.tight .s-lab { font-size: 8.2pt; }
.sheet.tight .s-meta { margin-top: 4px; font-size: 7.7pt; }
.sheet.tight section { margin-top: 5px; }
.sheet.tight .sec-h { font-size: 9.4pt; padding: 2px 6px; }
.sheet.tight li { font-size: 8.3pt; line-height: 1.36; }
.sheet.tight .prep span { font-size: 7.9pt; padding: 1px 7px; }
.sheet.tight th, .sheet.tight td { padding: 2.6px 3px; font-size: 8.2pt; }
.sheet.tight th { font-size: 7.8pt; }
.sheet.tight td.blank { height: 15px; }
.sheet.tight .q .qt { font-size: 8.4pt; }
.sheet.tight .q .lines i { height: 13px; }
.sheet.tight .tip { font-size: 7.6pt; padding: 3px 6px; margin-top: 4px; }

/* 남는 아래 여백 채우기 — 페이지마다 스크립트가 잰 값(--fill-*)을 더한다.
   값이 없으면(0px) 위에서 정한 원래 간격·높이 그대로다. */
.sheet section { margin-top: calc(6px + var(--fill-gap, 0px)); }
.sheet .tip { margin-top: calc(5px + var(--fill-gap, 0px)); padding-bottom: calc(4px + var(--fill-tip, 0px)); }
.sheet td.blank { height: calc(18px + var(--fill-blank, 0px)); }
.sheet .q .lines i { height: calc(15px + var(--fill-line, 0px)); }
.sheet.tight section { margin-top: calc(5px + var(--fill-gap, 0px)); }
.sheet.tight .tip { margin-top: calc(4px + var(--fill-gap, 0px)); padding-bottom: calc(3px + var(--fill-tip, 0px)); }
.sheet.tight td.blank { height: calc(15px + var(--fill-blank, 0px)); }
.sheet.tight .q .lines i { height: calc(13px + var(--fill-line, 0px)); }

/* ---------- 인쇄 ---------- */
#printAll { display: none; }
@page { size: A4; margin: 0; }
@media print {
    html, body { overflow: visible !important; background: #fff !important; height: auto !important; width: auto !important; }
    body .top-left-bar, body .top-right-bar, body .fs-pill-wrap, body #ux-toast,
    body .fb-toast, body [class*="svl-feedback"], body [id*="svl-feedback"],
    body .qr-modal-overlay, body .svl-qr-overlay { display: none !important; }
    body .screen {
        display: block !important; position: static !important; inset: auto !important;
        padding: 0 !important; overflow: visible !important; height: auto !important;
    }
    body .layout { display: block !important; height: auto !important; }
    body .panel { display: none !important; }
    body .preview-panel { display: block !important; }
    body .preview-bar { display: none !important; }
    body .preview-scroll {
        display: block !important; padding: 0 !important; overflow: visible !important;
        background: none !important; height: auto !important;
        /* 줄바꿈 공백이 1px 줄 상자를 만들어 A4 한 장이 다음 쪽으로 밀리는 것을 막는다 */
        font-size: 0 !important; line-height: 0 !important;
    }
    body .sheet { font-size: 12pt !important; line-height: 1.5 !important; }
    body .sheet-wrap { transform: none !important; width: auto !important; height: auto !important; }
    body .sheet-stack { display: block !important; gap: 0 !important; }
    body .sheet {
        box-shadow: none !important; margin: 0 !important; border: none !important;
        /* 인쇄는 @page 여백 0 기준 — 297mm에 딱 맞추면 끝단 1~2px 때문에 빈 쪽이 생기므로 1mm 여유를 둔다 */
        width: 210mm !important; height: 296mm !important; min-height: 296mm !important; max-height: 296mm !important;
        page-break-after: always; break-after: page;
        page-break-inside: avoid; break-inside: avoid;
    }
    body .sheet-stack:last-child > .sheet:last-child { page-break-after: auto !important; break-after: auto !important; }
    body #a4Measure { display: none !important; }
    body.print-all .preview-panel { display: none !important; }
    body #printAll { display: block !important; }
}

/* ---------- 토스트 / 전체화면 ---------- */
#ux-toast { position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 300; background: rgba(16,22,36,.94); color: #fff; font-size: 12.5px; padding: 10px 16px; border-radius: 14px; max-width: 88vw; text-align: center; pointer-events: none; opacity: 0; transition: opacity .3s ease; box-shadow: 0 10px 30px rgba(0,0,0,.35); line-height: 1.5; }
.fs-pill-wrap { position: fixed; right: 18px; bottom: 14px; z-index: 70; }
.fs-pill { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 999px; cursor: pointer; background: var(--panel); border: 1px solid var(--line); color: var(--ink); font-family: inherit; font-size: 12.5px; font-weight: 800; box-shadow: var(--shadow); white-space: nowrap; }

/* ---------- 반응형 ---------- */
@media (max-width: 1100px) {
    .layout { grid-template-columns: 280px minmax(0, 1fr); }
}
@media (max-width: 900px) {
    .top-left-bar { top: max(8px, env(safe-area-inset-top)); left: 8px; right: 54px; gap: 6px; }
    .top-left-bar .back-btn { padding: 6px 10px; font-size: 12px; }
    .page-title-badge { padding: 6px 10px; font-size: 12px; min-width: 0; }
    .qr-btn { display: none; }
    .top-right-bar { top: max(8px, env(safe-area-inset-top)); right: 8px; }
    .icon-btn { width: 34px; height: 34px; flex: 0 0 34px; font-size: 15px; }
    .screen { padding: calc(max(8px, env(safe-area-inset-top)) + 50px) 8px 90px; overflow-y: auto; }
    .layout { display: flex; flex-direction: column; height: auto; gap: 10px; }
    .panel { overflow: visible; }
    .list { max-height: 44vh; overflow-y: auto; }
    .preview-panel { min-height: 0; }
    .preview-scroll { padding: 10px 0 20px; }
    .panel-foot { position: sticky; bottom: 0; background: var(--panel); }
    .fs-pill-wrap { right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); }
    .fs-pill { padding: 8px; width: 38px; height: 38px; justify-content: center; font-size: 14px; }
    .fs-pill #fullscreenText { display: none; }
}
@media (max-width: 400px) {
    .page-title-badge { font-size: 11px; padding: 6px 9px; }
    .top-left-bar .back-btn { padding: 6px 8px; font-size: 11.5px; }
}
@media (max-height: 560px) and (orientation: landscape) {
    .screen { padding: 50px 8px 8px; }
    .layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); height: calc(100vh - 58px); flex-direction: row; }
    .list { max-height: none; }
    .fs-pill-wrap { bottom: 6px; right: 6px; }
}
html.pseudo-fs .top-right-bar { display: none !important; }
html.pseudo-fs .fs-pill-wrap { display: flex !important; }

/* 좁은 화면에서 제목 배지가 우측 버튼(제안하기·테마)을 침범하지 않도록 폭을 제한 */
@media (max-width: 900px) {
  .top-left-bar { right: auto !important; width: max-content !important; max-width: calc(100vw - 172px) !important; }
  .top-left-bar .tag-badge { max-width: 86px !important; overflow: hidden !important; min-width: 0 !important; }
  .top-left-bar .tag-badge > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
}
</style>

<link rel="stylesheet" href="../labs/common/ui-layout.css">

<body>
<div class="top-left-bar">
    <a href="../index.html" class="back-btn" onclick="var r=document.referrer;if(history.length>1&&r&&r.indexOf(location.origin+'/')===0&&/(\/|index(_3d)?\.html)(\?|#|$)/.test(r)){history.back();return false;}"><span>⬅</span> 메인</a>
    <div class="page-title-badge">
        <span class="tt">가상실험실 탐구학습지</span>
    </div>
    <button class="back-btn qr-btn" id="qrBtn" type="button" title="QR 코드" aria-label="QR 코드 보기">
        <span class="qr-btn-icon" aria-hidden="true">📱</span><span class="qr-btn-label">QR code</span>
    </button>
</div>
<div class="top-right-bar">
    <div class="tr-util">
        <button class="icon-btn" id="themeBtn" type="button" title="야간 모드 전환" aria-label="야간 모드 전환">🌙</button>
    </div>
</div>

<main class="screen">
    <div class="layout">

       학습지 블록 · A4 페이지 나눔

    var PX_PER_MM = 96 / 25.4;

    function mk(tag, cls, html) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (html != null) e.innerHTML = html;
        return e;
    }

    /* ---------- 실험별 바로가기 QR (정수 좌표 SVG → 인쇄해도 선명) ---------- */
    var QR_NS = 'http://www.w3.org/2000/svg';
    var qrCache = {};

    function qrSvg(url) {
        if (qrCache[url]) return qrCache[url].cloneNode(true);
        if (typeof window.QRCode !== 'function') return null;
        var tmp = mk('div');
        tmp.style.cssText = 'position:absolute;left:-9999px;top:0;width:1px;height:1px;overflow:hidden;';
        document.body.appendChild(tmp);
        var model = null;
        try {
            var qr = new window.QRCode(tmp, {
                text: url, width: 256, height: 256,
                correctLevel: window.QRCode.CorrectLevel.M
            });
            model = qr && qr._oQRCode;
        } catch (err) { model = null; }
        var out = null;
        if (model && typeof model.getModuleCount === 'function' && typeof model.isDark === 'function') {
            var count = model.getModuleCount(), quiet = 4, total = count + quiet * 2;
            var svg = document.createElementNS(QR_NS, 'svg');
            svg.setAttribute('viewBox', '0 0 ' + total + ' ' + total);
            svg.setAttribute('shape-rendering', 'crispEdges');
            svg.setAttribute('role', 'img');
            svg.setAttribute('aria-label', '실험 바로가기 QR 코드');
            var bg = document.createElementNS(QR_NS, 'rect');
            bg.setAttribute('width', String(total));
            bg.setAttribute('height', String(total));
            bg.setAttribute('fill', '#ffffff');
            svg.appendChild(bg);
            var group = document.createElementNS(QR_NS, 'g');
            group.setAttribute('fill', '#000000');
            for (var row = 0; row < count; row++) {
                var col = 0;
                while (col < count) {
                    if (model.isDark(row, col)) {
                        var from = col;
                        while (col < count && model.isDark(row, col)) col++;
                        var r = document.createElementNS(QR_NS, 'rect');
                        r.setAttribute('x', String(from + quiet));
                        r.setAttribute('y', String(row + quiet));
                        r.setAttribute('width', String(col - from));
                        r.setAttribute('height', '1');
                        group.appendChild(r);
                    } else col++;
                }
            }
            svg.appendChild(group);
            out = svg;
            qrCache[url] = svg.cloneNode(true);
        }
        document.body.removeChild(tmp);
        return out;
    }

    function paintQrs(root) {
        qsa('.qr-box[data-url]', root || document).forEach(function (box) {
            if (box.firstChild) return;
            var svg = qrSvg(box.getAttribute('data-url'));
            if (svg) box.appendChild(svg);
        });
    }

    /* 2쪽부터 맨 위에 붙는 머리띠 — 어떤 학습지의 몇 쪽인지와 실험 QR을 함께 보여 준다 */

    function listSection(title, tag, items, startNo, cont) {

    function tableSection(s, rows, cont) {

    function qSection(items, cont) {

    function qItem(no, text) {
        return '<div class="qt">' + no + '. ' + esc(text) + '</div>' +
            '<div class="lines"><i></i><i></i></div>';
    }

    /* 학습지 하나를 페이지로 나눌 수 있는 블록 목록으로 만든다 */
    function sheetChunks(s, idx) {
        var chunks = [];
        chunks.push({
            kind: 'atomic', build: function () {
                var hold = mk('div', 's-hold');
                hold.appendChild(headNode(s, idx));
                hold.appendChild(metaNode());
                return hold;
            }
        });
        chunks.push({
            kind: 'atomic', build: function () {
                return listSection('🎯 탐구 목표', 'ul', s.goal, 1, false);
            }
        });
        chunks.push({
            kind: 'atomic', build: function () {
                var sec = mk('section');
                sec.appendChild(secHead('🧰 준비물', false));
                var prep = mk('div', 'prep');
                s.prep.forEach(function (t) { prep.appendChild(mk('span', null, esc(t))); });
                sec.appendChild(prep);
                return sec;
            }
        });
        chunks.push({ kind: 'list', tag: 'ol', title: '🔬 실험 과정', items: s.steps.slice() });
        chunks.push({ kind: 'table', s: s, items: s.table.pre.slice() });
        chunks.push({
            kind: 'q', items: s.questions.map(function (q, i) { return qItem(i + 1, q); })
        });
        chunks.push({
            kind: 'atomic', build: function () {
                return mk('div', 'tip', '💡 탐구 도움말 · ' + esc(s.tip));
            }
        });
        return chunks;
    }

    /* ---------- 페이지 나눔 ---------- */
    var measureBody = null, measureLevel = -1;

    function ensureMeasure(level) {
        level = level || 0;
        if (measureBody && measureBody.isConnected && measureLevel === level) return measureBody;
        var old = document.getElementById('a4Measure');
        if (old && old.parentNode) old.parentNode.removeChild(old);
        var host = mk('div');
        host.id = 'a4Measure';
        host.setAttribute('aria-hidden', 'true');
        host.style.cssText = 'position:absolute;left:-20000px;top:0;width:210mm;visibility:hidden;pointer-events:none;';
        var page = mk('div', 'sheet page' + (level ? ' tight' : ''));
        measureBody = mk('div', 'page-body');
        page.appendChild(measureBody);
        page.appendChild(mk('div', 's-foot',
            '<span>Science Virtual LAB · ' + esc(SITE) + '</span><span>가상실험실에서 실험하기</span>'));
        host.appendChild(page);
        document.body.appendChild(host);
        measureLevel = level;
        return measureBody;
    }

    function measureNode(node) {
        var body = ensureMeasure(measureLevel < 0 ? 0 : measureLevel);
        body.innerHTML = '';
        body.appendChild(node);
        var mt = parseFloat(window.getComputedStyle(node).marginTop) || 0;
        return node.offsetHeight + mt;
    }

    function buildPartial(ch, consumed, items, cont) {
        if (ch.kind === 'list') {
            return listSection(ch.title, ch.tag, items, ch.tag === 'ol' ? consumed + 1 : 1, cont);
        }
        if (ch.kind === 'table') return tableSection(ch.s, items, cont);
        if (ch.kind === 'q') return qSection(items, cont);
        return mk('div');
    }

    function paginate(s, idx, level) {
        var chunks = sheetChunks(s, idx);
        var body = ensureMeasure(level);
        /* 인쇄는 종이 높이가 1mm 쯤 짧고 브라우저·프린터 여백도 달라서,
           페이지를 꽉 채우면 빈 쪽이 하나 더 생긴다. 아래쪽 3%는 비워 둔다. */
        var usable = Math.floor((body.clientHeight || 990) * 0.97);
        var contH = measureNode(contHeadNode(s, idx));
        var pages = [], cur = [], used = 0, hasCont = false;

        function ensureCont() {
            if (!cur.length && pages.length && !hasCont) {
                cur.push(contHeadNode(s, idx));
                used = contH;
                hasCont = true;
            }
        }
        function flush() {
            if (cur.length) { pages.push(cur); cur = []; used = 0; hasCont = false; }
        }

        function place(node, h) {
            cur.push(node);
            used += h;
        }

        chunks.forEach(function (ch) {
            if (ch.kind === 'atomic') {
                ensureCont();
                var node = ch.build();
                var h = measureNode(node);
                if (cur.length && used + h > usable) { flush(); ensureCont(); }
                if (used + h > usable && cur.length > 1) { /* stay on this page anyway */ }
                place(node, h);
                return;
            }

            var rest = ch.items.slice();
            var consumed = 0;

            while (rest.length) {
                ensureCont();
                var whole = buildPartial(ch, consumed, rest, consumed > 0);
                var wholeH = measureNode(whole);
                if (used + wholeH <= usable) {
                    place(whole, wholeH);
                    consumed += rest.length;
                    rest = [];
                    break;
                }

                /* 남은 자리에 들어갈 만큼만 잘라 넣는다 */
                var fit = 0;
                for (var k = rest.length - 1; k >= 1; k--) {
                    if (used + measureNode(buildPartial(ch, consumed, rest.slice(0, k), consumed > 0)) <= usable) {
                        fit = k;
                        break;
                    }
                }
                if (fit > 0) {
                    var part = buildPartial(ch, consumed, rest.slice(0, fit), consumed > 0);
                    place(part, measureNode(part));
                    consumed += fit;
                    rest = rest.slice(fit);
                    flush();
                    continue;
                }

                if (cur.length > (hasCont ? 1 : 0)) { flush(); continue; }

                /* 한 페이지에 한 항목도 들어가지 않는 매우 긴 항목 — 한 항목만 놓고 넘어간다 */
                var forced = buildPartial(ch, consumed, rest.slice(0, 1), consumed > 0);
                place(forced, measureNode(forced));
                consumed += 1;
                rest = rest.slice(1);
                flush();
            }
        });

        flush();
        return pages.length ? pages : [[]];
    }

    var stackCache = {};

    function stackFor(s, idx) {
        var level = 0;
        var pages = paginate(s, idx, 0);
        /* 애매하게 두 번째 쪽으로 넘치는 학습지 — 한 단계 컴팩트한 판형으로 다시 나눠
           한 장에 들어가면 그 판형을 쓴다. (정말 긴 학습지는 그대로 2쪽) */
        if (pages.length > 1) {
            var tightPages = paginate(s, idx, 1);
            if (tightPages.length === 1) { pages = tightPages; level = 1; }
        }
        var pageCls = 'sheet page' + (level ? ' tight' : '');
        var stack = mk('div', 'sheet-stack');
        pages.forEach(function (nodes, i) {
            var page = mk('div', pageCls);
            var body = mk('div', 'page-body');
            nodes.forEach(function (n) { body.appendChild(n); });
            page.appendChild(body);
            var foot = mk('div', 's-foot');
            foot.appendChild(mk('span', null, 'Science Virtual LAB · ' + esc(SITE + s.path)));
            foot.appendChild(mk('span', null, '가상실험실에서 실험하기' + (pages.length > 1 ? ' · ' + (i + 1) + '/' + pages.length + '쪽' : '')));
            page.appendChild(foot);
            stack.appendChild(page);
        });
        return stack;
    }

    function stackHtml(s, idx) {
        if (!stackCache[idx]) stackCache[idx] = stackFor(s, idx).outerHTML;
        return stackCache[idx];
    }

    /* ============================================================
       남는 아래 여백 채우기
       ------------------------------------------------------------
       paginate()가 정한 쪽 나눔은 건드리지 않고, 화면에 실제로 그려진
       각 쪽(.sheet.page)의 섹션 높이를 재서 남는 세로 여백을
       ① 섹션 사이 간격(--fill-gap) ② 표의 빈 칸 높이(--fill-blank)
       ③ 서술형 답안 줄 간격(--fill-line) ④ 도움말 패딩(--fill-tip)
       순으로 고르게 나눠 준다. 어느 쪽도 page-body 높이를 넘지 않도록
       아래에 여유(FILL_RESERVE)를 남기고 멈춘다.
       ============================================================ */
    var FILL_RESERVE = 10;      /* 인쇄는 종이 높이가 1mm(≈4px) 짧고 반올림도 있어 아래를 조금 남긴다 */
    var FILL_GAP_MAX = 18;      /* 섹션 사이 간격 — 1차 상한 */
    var FILL_BLANK_MAX = 24;    /* 표의 빈 칸(학생이 쓰는 줄) 높이 — 1차 상한 */
    var FILL_LINE_MAX = 12;     /* 서술형 답안 줄 간격 — 1차 상한 */
    var FILL_TIP_MAX = 16;      /* 도움말 상자 아래 여백 — 1차 상한 */
    /* 1차 상한을 다 써도 자리가 남는(짧은) 학습지 — 한 번 더 조금씩 넓힌다 */
    var FILL_GAP_HARD = 30;
    var FILL_BLANK_HARD = 36;
    var FILL_LINE_HARD = 20;
    var FILL_TIP_HARD = 24;

    /* page-body 안에서 마지막 블록이 차지한 높이(위에서부터) */
    function fillBottom(body) {
        var kids = body.children;
        if (!kids.length) return 0;
        var last = kids[kids.length - 1];
        return (last.offsetTop + last.offsetHeight) - body.offsetTop;
    }

    function fillApply(page, f) {
        f = f || {};
        page.style.setProperty('--fill-gap', (f.gap || 0) + 'px');
        page.style.setProperty('--fill-blank', (f.blank || 0) + 'px');
        page.style.setProperty('--fill-line', (f.line || 0) + 'px');
        page.style.setProperty('--fill-tip', (f.tip || 0) + 'px');
    }

    /* 남은 자리를 상한(caps)까지 나눠 넣는다. 넘치면 단위별로 깎아 target 이하로 맞춘다. */
    function fillGrow(page, body, f, target, caps, n) {
        var h = fillBottom(body);
        var room = target - h;
        if (room < 4) return h;
        var groups = [
            { k: 'gap', cnt: n.gap, cap: Math.max(0, caps.gap - f.gap), w: caps.w },
            { k: 'blank', cnt: n.row, cap: Math.max(0, caps.blank - f.blank), w: 1 },
            { k: 'line', cnt: n.line, cap: Math.max(0, caps.line - f.line), w: 1 },
            { k: 'tip', cnt: n.tip, cap: Math.max(0, caps.tip - f.tip), w: 1 }
        ];
        var W = 0, i, g;
        for (i = 0; i < groups.length; i++) W += groups[i].cnt * groups[i].cap * groups[i].w;
        if (W <= 0) return h;
        var use = Math.min(room, W);
        for (i = 0; i < groups.length; i++) {
            g = groups[i];
            if (g.cnt > 0 && g.cap > 0) f[g.k] += Math.min(g.cap, Math.floor(use * g.cap * g.w / W));
        }
        fillApply(page, f);
        h = fillBottom(body);
        /* 넘치면 단위별로(1px 당 줄어드는 높이가 큰 곳부터) 깎아 맞춘다 */
        var guard = 0;
        while (h > target && guard++ < 12) {
            var over = h - target, cut = false;
            for (i = 0; i < groups.length; i++) {
                g = groups[i];
                if (g.cnt > 0 && f[g.k] > 0) {
                    f[g.k] = Math.max(0, f[g.k] - Math.max(1, Math.ceil(over / g.cnt)));
                    fillApply(page, f);
                    h = fillBottom(body);
                    cut = true;
                    break;
                }
            }
            if (!cut) break;
        }
        return h;
    }

    function fillPage(page) {
        var body = page.querySelector('.page-body');
        if (!body) return;
        var avail = body.clientHeight;
        if (!avail) return;
        fillApply(page, null);
        var base = fillBottom(body);
        var target = avail - FILL_RESERVE;
        if (target - base < 6) return;

        /* 늘릴 수 있는 곳 — 첫 블록(머리글)은 그대로 두고 나머지 섹션·도움말 */
        var gaps = 0, hasTip = false, kids = body.children, i, cls;
        for (i = 1; i < kids.length; i++) {
            cls = ' ' + (kids[i].className || '') + ' ';
            if (kids[i].tagName === 'SECTION') gaps++;
            else if (cls.indexOf(' tip ') >= 0) { gaps++; hasTip = true; }
        }
        var n = {
            gap: gaps,
            row: body.querySelectorAll('tbody tr').length,
            line: body.querySelectorAll('.q .lines i').length,
            tip: hasTip ? 1 : 0
        };
        var f = { gap: 0, blank: 0, line: 0, tip: 0 };
        fillGrow(page, body, f, target,
            { gap: FILL_GAP_MAX, blank: FILL_BLANK_MAX, line: FILL_LINE_MAX, tip: FILL_TIP_MAX, w: 1.4 }, n);
        fillGrow(page, body, f, target,
            { gap: FILL_GAP_HARD, blank: FILL_BLANK_HARD, line: FILL_LINE_HARD, tip: FILL_TIP_HARD, w: 1 }, n);
    }

    function fillSheets(root) {
        var host = root || document;
        var pages = host.querySelectorAll('.sheet.page');
        for (var i = 0; i < pages.length; i++) fillPage(pages[i]);
    }

    /* ============================================================
       목록 · 선택
       ============================================================ */
    var state = { field: 'all', q: '', sel: 0 };

    /* 화면 언어가 한국어가 아니면, 목록에 보이는 번역문으로도 검색되게 한다 */
    function trText(t) {
        try {
            if (window.SVL_I18N && SVL_I18N.lang() !== 'ko') {
                var v = SVL_I18N.tr(t);
                if (v) return String(v);
            }
        } catch (e) {}
        return String(t);
    }

    function filtered() {
        var q = state.q.trim().toLowerCase();
        return SHEETS.filter(function (s) {
            if (state.field !== 'all' && s.field !== state.field) return false;
            if (!q) return true;
            var fld = FIELD[s.field];
            if ((s.title + ' ' + s.lab + ' ' + fld).toLowerCase().indexOf(q) >= 0) return true;
            return (trText(s.title) + ' ' + trText(s.lab) + ' ' + trText(fld)).toLowerCase().indexOf(q) >= 0;
        });
    }

    function renderList() {
        var list = filtered();
        $('countView').textContent = list.length + '장';
        var host = $('list');
        if (!list.length) {
            host.innerHTML = '<div style="padding:20px 10px;text-align:center;color:var(--sub);font-size:12px;line-height:1.7;">조건에 맞는 학습지가 없습니다.<br>다른 낱말로 찾아보세요.</div>';
            return;
        }
        host.innerHTML = list.map(function (s) {
            var idx = SHEETS.indexOf(s);
            var on = (idx === state.sel) ? ' on' : '';
            return '<button class="item' + on + '" type="button" data-idx="' + idx + '">' +
                '<span class="it-top"><span class="it-num">' + (idx + 1) + '</span>' +
                '<span class="it-title">' + esc(s.title) + '</span>' +
                '<span class="it-field">' + esc(FIELD[s.field]) + '</span></span>' +
                '<span class="it-sub">' + esc(s.lab) + '</span></button>';
        }).join('');
    }

    function selectSheet(idx) {
        state.sel = idx;
        var s = SHEETS[idx];
        if (!s) return;
        $('sheetHost').innerHTML = stackHtml(s, idx);
        paintQrs($('sheetHost'));
        $('previewName').textContent = '· ' + s.title;
        var pages = $('sheetHost').querySelectorAll('.sheet.page').length;
        $('previewName').textContent = '· ' + s.title + (pages > 1 ? ' · ' + pages + '쪽' : '');
        renderList();
        fitSheet();
        $('previewScroll').scrollTop = 0;
        /* 번역·폰트가 적용된 뒤 실제 높이를 재서 아래 여백을 채운다 */
        setTimeout(function () { fillSheets($('sheetHost')); }, 0);
    }

    /* 미리보기 배율 */
    function fitSheet() {
        var wrap = $('sheetWrap');
        var box = $('previewScroll');
        if (!wrap || !box) return;
        var avail = box.clientWidth - 32;
        var A4 = 794; /* 210mm @96dpi */
        var scale = Math.min(1, avail / A4);
        scale = Math.max(0.2, scale);
        wrap.style.transform = 'scale(' + scale + ')';
        wrap.style.width = A4 + 'px';
        var stack = $('sheetHost');
        var h = stack ? stack.offsetHeight : 1123;
        wrap.style.height = (h * scale) + 'px';
    }

    /* ============================================================
       인쇄
       ============================================================ */
    function printOne() {
        var s = SHEETS[state.sel];
        if (!s) return;
        document.body.classList.remove('print-all');
        $('printAll').innerHTML = '';
        var pages = $('sheetHost').querySelectorAll('.sheet.page').length;
        toast('🖨 ' + pages + '쪽을 인쇄합니다. “PDF로 저장”을 고르면 파일로 받을 수 있습니다.', 2800);
        setTimeout(function () { fillSheets($('sheetHost')); window.print(); }, 380);
    }
    function printAll() {
        $('printAll').innerHTML = SHEETS.map(function (s, i) { return stackHtml(s, i); }).join('');
        paintQrs($('printAll'));
        document.body.classList.add('print-all');
        var total = $('printAll').querySelectorAll('.sheet.page').length;
        toast('🖨 ' + SHEETS.length + '장 · ' + total + '쪽을 인쇄합니다. 인쇄 대화상자에서 페이지를 확인하세요.', 3000);
        setTimeout(function () {
            /* #printAll은 화면에서 display:none이라 그대로는 높이를 잴 수 없다.
               잠시 화면 밖에 펼쳐 놓고 아래 여백을 채운 뒤 인쇄한다. */
            var pa = $('printAll');
            pa.style.cssText = 'display:block;position:absolute;left:-20000px;top:0;width:210mm;visibility:hidden;';
            try { fillSheets(pa); } finally { pa.style.cssText = ''; }
            window.print();
            setTimeout(function () { document.body.classList.remove('print-all'); }, 1200);
        }, 700);
    }

    /* ============================================================
       이벤트
       ============================================================ */
    $('list').addEventListener('click', function (e) {
        var it = e.target.closest ? e.target.closest('[data-idx]') : null;
        if (!it) return;
        selectSheet(parseInt(it.getAttribute('data-idx'), 10));
    });
    $('fieldChips').addEventListener('click', function (e) {
        var c = e.target.closest ? e.target.closest('[data-field]') : null;
        if (!c) return;
        state.field = c.getAttribute('data-field');
        qsa('#fieldChips .chip').forEach(function (b) { b.classList.toggle('on', b === c); });
        renderList();
        var list = filtered();
        if (list.length && list.indexOf(SHEETS[state.sel]) < 0) selectSheet(SHEETS.indexOf(list[0]));
    });
    $('search').addEventListener('input', function () {
        state.q = this.value;
        renderList();
        var list = filtered();
        if (list.length && list.indexOf(SHEETS[state.sel]) < 0) selectSheet(SHEETS.indexOf(list[0]));
    });
    $('printOne').addEventListener('click', printOne);
    $('printAllBtn').addEventListener('click', printAll);

    /* 테마 */
    var themeBtn = $('themeBtn');
    function applyTheme(dark) {
        document.body.classList.toggle('dark-mode', dark);
        themeBtn.textContent = dark ? '☀️' : '🌙';
        themeBtn.title = dark ? '주간 모드 전환' : '야간 모드 전환';
    }
    themeBtn.addEventListener('click', function () { applyTheme(!document.body.classList.contains('dark-mode')); });

    window.addEventListener('resize', fitSheet);
    if (window.ResizeObserver) {
        try { new ResizeObserver(fitSheet).observe($('previewScroll')); } catch (e) {}
    }

    renderList();
    selectSheet(0);

    /* 언어를 바꾸면 한국어 원문으로 다시 그려 번역·여백을 새로 맞춘다
       (같은 언어로 다시 알려 오는 경우는 그대로 둔다) */
    var lastLang = (window.SVL_I18N && SVL_I18N.lang && SVL_I18N.lang()) || 'ko';
    document.addEventListener('svl:lang', function () {
        var cur = (window.SVL_I18N && SVL_I18N.lang && SVL_I18N.lang()) || 'ko';
        if (cur === lastLang) return;
        lastLang = cur;
        stackCache = {};
        selectSheet(state.sel);
    });

    /* 웹폰트가 늦게 도착하면 줄 높이가 달라지므로 나눔을 다시 계산한다 */
    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () {
            stackCache = {};
            qrCache = {};
            selectSheet(state.sel);
            paintQrs(document);
        });
    }
    /* qrcode.min.js는 defer로 실려 처음 그릴 때 아직 없을 수 있다 */
    window.addEventListener('load', function () { paintQrs(document); });
    setTimeout(function () { paintQrs(document); }, 600);
})();
</script>
<script>
/* ============ 전체화면 / 창모드 ============ */
(function () {
    'use strict';
    var docEl = document.documentElement;
    var btn = document.getElementById('fullscreenBtn');
    var icon = document.getElementById('fullscreenIcon');
    var text = document.getElementById('fullscreenText');
    function realFs() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement ||
                  document.mozFullScreenElement || document.msFullscreenElement);
    }
    function pseudo() { return docEl.classList.contains('pseudo-fs'); }
    function toast(msg) {
        var t = document.getElementById('ux-toast');
        if (!t) {
            t = document.createElement('div');
            t.id = 'ux-toast';
            t.style.cssText = 'position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);' +
                'background:rgba(16,22,36,.94);color:#fff;font-size:12px;line-height:1.4;padding:9px 14px;border-radius:14px;' +
                'z-index:9999;max-width:86vw;text-align:center;pointer-events:none;transition:opacity .3s;' +
                'font-family:inherit;box-shadow:0 8px 24px rgba(0,0,0,.25)';
            document.body.appendChild(t);
        }
        t.textContent = msg;
        t.style.opacity = '1';
        clearTimeout(t._t);
        t._t = setTimeout(function () { t.style.opacity = '0'; }, 2600);
    }
    function setUI() {
        var on = realFs() || pseudo();
        if (icon) icon.textContent = on ? '\uD83D\uDDD7' : '\u26F6';
        if (text) text.textContent = on ? '창모드' : '전체화면';
        if (btn) {
            btn.setAttribute('aria-label', on ? '창모드로 전환' : '전체화면으로 전환');
            btn.title = on ? '창모드로 전환' : '전체화면으로 전환';
        }
        document.body.classList.toggle('is-fullscreen', on);
        setTimeout(function () {
            try { window.dispatchEvent(new Event('resize')); } catch (e) {}
            var box = document.getElementById('previewScroll');
            if (box) { box.dispatchEvent(new Event('scroll')); }
        }, 160);
    }
    if (btn) {
        btn.addEventListener('click', function () {
            if (realFs()) {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                return;
            }
            if (pseudo()) { docEl.classList.remove('pseudo-fs'); setUI(); return; }
            var req = docEl.requestFullscreen || docEl.webkitRequestFullscreen;
            if (req) {
                try {
                    var r = req.call(docEl);
                    if (r && typeof r.catch === 'function') r.catch(function () { docEl.classList.add('pseudo-fs'); setUI(); });
                } catch (err) { docEl.classList.add('pseudo-fs'); }
            } else {
                docEl.classList.add('pseudo-fs');
                toast('이 브라우저는 전체화면을 지원하지 않아 상단 정보를 숨긴 몰입 모드로 표시합니다');
            }
            setUI();
        }, false);
    }
    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
        document.addEventListener(ev, setUI);
    });
    document.addEventListener('keydown', function (e) {
        if ((e.key === 'Escape' || e.key === 'Esc') && pseudo() && !realFs()) {
            docEl.classList.remove('pseudo-fs'); setUI();
        }
    });
    setUI();
})();
</script>
