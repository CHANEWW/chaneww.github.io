<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>모둠별 멀티 스톱워치 | Science Virtual LAB</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="preload" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="../labs/common/ui-layout.css">
<style>
@font-face{
    font-family:'SeoulNamsan';
    src:local('SeoulNamsan M'),local('SeoulNamsanM'),local('서울남산체 M'),
        url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff') format('woff');
    font-weight:400;font-style:normal;font-display:swap;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
    --bg:#eef2f7; --ink:#14181f; --muted:#64748b; --line:rgba(15,23,42,.10);
    --card:rgba(255,255,255,.9); --card-solid:#fff; --accent:#0a84ff; --accent-soft:rgba(10,132,255,.12);
    --ok:#10b981; --danger:#ef4444; --shadow:0 10px 30px rgba(15,23,42,.10);
}
body.dark{
    --bg:#0e121c; --ink:#eef3fb; --muted:#94a3b8; --line:rgba(255,255,255,.13);
    --card:rgba(26,32,45,.9); --card-solid:#1a2130; --accent:#4aa3ff; --accent-soft:rgba(74,163,255,.18);
    --ok:#34d399; --shadow:0 10px 30px rgba(0,0,0,.5);
}
html,body{margin:0;padding:0;width:100%;height:100%}
body{
    font-family:'SeoulNamsan',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:var(--ink); background:var(--bg); overflow:hidden; transition:background .3s ease,color .3s ease;
}
.top-nav{
    position:fixed; top:0; left:0; right:0; height:60px; display:flex; align-items:center; gap:10px;
    padding:0 250px 0 16px; z-index:100; background:var(--card);
    backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-bottom:1px solid var(--line);
}
.back-btn{
    display:inline-flex; align-items:center; gap:6px; padding:7px 14px; font-family:inherit; font-size:13px;
    font-weight:800; color:inherit; text-decoration:none; border:1px solid var(--line); border-radius:999px;
    background:var(--card-solid); transition:transform .16s ease; white-space:nowrap;
}
.back-btn:hover{transform:translateY(-1px)}
.page-title{display:flex; align-items:center; gap:8px; font-size:14.5px; font-weight:800; letter-spacing:-.2px; min-width:0}
.page-title .t{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pill-badge{padding:3px 9px; border-radius:999px; font-size:10.5px; font-weight:800; background:var(--accent-soft); color:var(--accent); white-space:nowrap; flex:0 0 auto}
.top-right-bar{
    position:fixed !important; top:15px !important; right:20px !important;
    display:flex !important; flex-direction:column; align-items:flex-end; gap:8px; z-index:130 !important; pointer-events:none;
}
.top-right-bar > .tr-util{display:flex !important; flex-direction:row; align-items:center; gap:8px; pointer-events:auto}
#bTheme{
    display:inline-flex; align-items:center; justify-content:center; gap:6px; height:40px; padding:0 15px;
    border-radius:20px; cursor:pointer; font-family:inherit; font-size:12.5px; font-weight:800; color:inherit;
    border:1px solid var(--line); background:var(--card); box-shadow:var(--shadow);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); white-space:nowrap; transition:transform .16s ease;
}
#bTheme:hover{transform:translateY(-1px)}

.app{position:fixed; top:60px; left:0; right:0; bottom:0; overflow-y:auto; padding:12px 16px 26px}
.wrap{max-width:1120px; margin:0 auto}

/* 상단 조작 */
.bar{
    display:flex; align-items:center; gap:9px; flex-wrap:wrap; padding:11px 13px; border-radius:18px;
    background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow); margin-bottom:12px;
    position:sticky; top:0; z-index:40; backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
}
.grp{display:flex; align-items:center; gap:6px; padding:4px 8px; border-radius:12px; background:var(--card-solid); border:1px solid var(--line)}
.grp .lbl{font-size:11px; font-weight:900; color:var(--muted); padding:0 2px; white-space:nowrap}
.step-btn{
    width:28px; height:28px; border-radius:9px; border:1px solid var(--line); background:var(--card);
    color:inherit; font-family:inherit; font-size:15px; font-weight:900; cursor:pointer; line-height:1;
    display:flex; align-items:center; justify-content:center;
}
.step-btn:hover{border-color:var(--accent)}
.count{min-width:22px; text-align:center; font-size:14px; font-weight:900}
.count[type=number]{
    width:44px; padding:2px 0; background:transparent; border:1px solid transparent; border-radius:8px;
    color:inherit; font-family:inherit; font-size:14px; font-weight:900; text-align:center; outline:none;
    -moz-appearance:textfield; appearance:textfield;
}
.count[type=number]:hover{border-color:var(--line); background:var(--card)}
.count[type=number]:focus{border-color:var(--accent)}
.count[type=number]::-webkit-outer-spin-button,
.count[type=number]::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
.btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:9px 15px; border-radius:12px;
    border:none; cursor:pointer; font-family:inherit; font-size:12.5px; font-weight:900; color:#fff;
    background:var(--accent); box-shadow:0 8px 18px rgba(10,132,255,.24); transition:transform .16s ease; white-space:nowrap;
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line); box-shadow:none}
.btn.stop{background:linear-gradient(135deg,#ef4444,#dc2626); box-shadow:0 8px 18px rgba(239,68,68,.26)}
.btn.start{background:linear-gradient(135deg,#10b981,#059669); box-shadow:0 8px 18px rgba(16,185,129,.26)}
.btn:disabled{opacity:.4; cursor:not-allowed; transform:none}
.spacer{margin-left:auto}

/* 진자 모드 */
.pend{
    display:none; align-items:center; gap:7px; padding:6px 10px; border-radius:12px;
    background:rgba(14,165,233,.12); border:1px solid rgba(14,165,233,.35); font-size:11.5px; font-weight:800;
}
.pend.on{display:flex}
.pend input{
    width:48px; padding:4px 6px; border-radius:8px; border:1px solid var(--line); background:var(--card-solid);
    color:inherit; font-family:inherit; font-size:12px; font-weight:900; text-align:center;
}

/* 모둠 카드 */
.teams{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:11px; margin-bottom:13px}
.team{
    position:relative; border-radius:20px; border:1px solid var(--line); background:var(--card);
    box-shadow:var(--shadow); padding:13px 14px 12px; overflow:hidden;
    border-top:4px solid var(--tc,var(--accent));
}
.t-head{display:flex; align-items:center; gap:8px}
.t-name{
    flex:1 1 auto; min-width:0; padding:4px 7px; border-radius:8px; border:1px solid transparent;
    background:transparent; color:inherit; font-family:inherit; font-size:13px; font-weight:900; outline:none;
}
.t-name:hover{border-color:var(--line); background:var(--card-solid)}
.t-name:focus{border-color:var(--accent); background:var(--card-solid); box-shadow:0 0 0 3px var(--accent-soft)}
.t-state{
    flex:0 0 auto; font-size:10px; font-weight:900; padding:3px 8px; border-radius:999px;
    background:rgba(120,140,170,.16); color:var(--muted);
}
.t-state.run{background:rgba(16,185,129,.16); color:#059669}
body.dark .t-state.run{color:#34d399}
.t-state.stop{background:rgba(245,158,11,.18); color:#b45309}
body.dark .t-state.stop{color:#fbbf24}
.t-time{
    margin:6px 0 9px; font-size:38px; font-weight:900; letter-spacing:-1.6px; line-height:1.05;
    font-variant-numeric:tabular-nums; color:var(--tc,var(--accent));
}
.t-time small{font-size:13px; font-weight:900; color:var(--muted); letter-spacing:0; margin-left:4px}
.t-btns{display:flex; gap:7px}
.t-btns button{
    flex:1 1 0; padding:9px 6px; border-radius:11px; border:1px solid var(--line); background:var(--card-solid);
    color:inherit; font-family:inherit; font-size:12px; font-weight:900; cursor:pointer; transition:transform .14s ease;
}
.t-btns button:hover:not(:disabled){transform:translateY(-1px)}
.t-btns button:disabled{opacity:.4; cursor:not-allowed}
.t-btns .t-start{background:var(--tc,var(--accent)); color:#fff; border-color:transparent}
.t-btns .t-start.pause{background:rgba(245,158,11,.9)}
.t-laps{display:flex; flex-wrap:wrap; gap:5px; margin-top:9px}
.lap{
    font-size:10.5px; font-weight:800; padding:3px 8px; border-radius:999px;
    background:rgba(120,140,170,.14); color:var(--muted); font-variant-numeric:tabular-nums;
}
.lap b{color:var(--ink); font-weight:900}
.t-period{
    display:none; margin-top:8px; padding:7px 10px; border-radius:10px; background:rgba(14,165,233,.12);
    font-size:11.5px; font-weight:800; color:#0369a1;
}
body.dark .t-period{color:#7dd3fc}
.pend-on .t-period{display:block}

/* 기록 표 */
.rec{border-radius:20px; border:1px solid var(--line); background:var(--card); box-shadow:var(--shadow); padding:14px 15px}
.rec-head{display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap}
.rec-head h2{margin:0; font-size:14px; font-weight:900}
.rec-head .sub{font-size:11px; font-weight:700; color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{width:100%; border-collapse:collapse; font-size:12px; min-width:520px}
th,td{padding:8px 7px; border-bottom:1px solid var(--line); text-align:center; font-variant-numeric:tabular-nums}
th{font-size:10.5px; font-weight:900; color:var(--muted); letter-spacing:.2px; white-space:nowrap}
td:first-child,th:first-child{text-align:left; font-weight:900}
td.empty{color:var(--muted); opacity:.5}
tbody tr:last-child td{border-bottom:none}
td.per{color:#0369a1; font-weight:900}
body.dark td.per{color:#7dd3fc}

/* 전체화면 */
#btn-fullscreen{
    position:fixed; right:20px; bottom:calc(18px + env(safe-area-inset-bottom,0px)); z-index:95;
    display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:9px 16px; border-radius:999px;
    border:1px solid var(--line); background:var(--card); box-shadow:0 8px 24px rgba(15,23,42,.16);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    color:inherit; font-family:inherit; font-size:12.5px; font-weight:800; white-space:nowrap; cursor:pointer;
    transition:transform .18s ease;
}
#btn-fullscreen:hover{transform:translateY(-1px)}
body.pseudo-fullscreen .top-nav{transform:translateY(-100%); opacity:0; pointer-events:none}
body.pseudo-fullscreen .app{top:0}
body.pseudo-fullscreen #feedback-btn,body.pseudo-fullscreen .svl-fb-btn{display:none !important}
.fs-toast{
    position:fixed; left:50%; bottom:calc(74px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,8px);
    z-index:2050; max-width:86vw; padding:10px 16px; border-radius:14px; background:rgba(28,28,30,.92);
    color:#fff; font-size:12.5px; font-weight:700; line-height:1.45; text-align:center;
    box-shadow:0 10px 26px rgba(0,0,0,.3); opacity:0; pointer-events:none; transition:opacity .26s ease, transform .26s ease;
}
.fs-toast.show{opacity:1; transform:translate(-50%,0)}

/* 반응형 */
@media (max-width:900px){
    .top-nav{height:52px; padding:0 12px; gap:8px}
    .page-title{font-size:12.5px}
    .back-btn{padding:6px 11px; font-size:12px}
    .top-right-bar{top:calc(max(8px,env(safe-area-inset-top)) + 48px) !important; right:8px !important}
    #bTheme{height:34px; padding:0 11px; font-size:11.5px}
    .app{top:100px; padding:8px 10px 64px}
    .bar{gap:7px; padding:9px 10px}
    .bar .btn{padding:8px 11px; font-size:11.5px}
    table{min-width:0; font-size:11px}
    th,td{padding:7px 4px}
    .rec{padding:11px 11px}
    .rec-head h2{font-size:13px}
    .rec-head .sub{font-size:10px}
    .rec-head .btn{padding:7px 10px; font-size:11px}
    .teams{grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px}
    .team{padding:10px 10px 9px; border-radius:16px; border-top-width:3px}
    .t-time{font-size:27px; letter-spacing:-1px}
    .t-name{font-size:12px; padding:3px 5px}
    .t-state{font-size:9px; padding:2px 6px}
    .t-btns{gap:5px}
    .t-btns button{font-size:11px; padding:8px 4px}
    .t-laps{margin-top:7px}
    .lap{font-size:9.5px; padding:2px 6px}
    #btn-fullscreen{bottom:calc(10px + env(safe-area-inset-bottom,0px)); right:10px; padding:8px 13px; font-size:12px}
}
@media (max-width:430px){
    .bar .grp{padding:3px 6px}
    .bar .grp .lbl{font-size:10px}
    .t-time{font-size:23px}
    .t-btns button{font-size:10.5px; padding:7px 3px}
}
@media (max-height:500px) and (orientation:landscape){
    .top-nav{height:44px}
    .app{top:44px}
    .top-right-bar{top:max(6px,env(safe-area-inset-top)) !important; right:88px !important}
    .teams{grid-template-columns:repeat(2,minmax(0,1fr))}
    .t-time{font-size:28px}
}
</style>
</head>
<body>

<nav class="top-nav">
    <a href="../index.html" class="back-btn" onclick="var r=document.referrer;if(history.length>1&&r&&r.indexOf(location.origin+'/')===0&&/(\/|index(_3d)?\.html)(\?|#|$)/.test(r)){history.back();return false;}"><span>⬅</span> 메인</a>
    <div class="page-title"><span class="t">모둠별 멀티 스톱워치</span><span class="pill-badge">교실 도구</span></div>
</nav>

<div class="top-right-bar">
    <div class="tr-util">
        <button id="bTheme" type="button">🌙 야간 모드</button>
    </div>
</div>

<div class="app">
<div class="wrap">

    <div class="bar">
        <div class="grp">
            <span class="lbl">모둠 수</span>
            <button class="step-btn" id="btnMinus" type="button" aria-label="모둠 수 줄이기">−</button>
            <input class="count" id="teamCount" type="number" min="2" max="16" step="1" value="6" inputmode="numeric" aria-label="모둠 수 (2~16)">
            <button class="step-btn" id="btnPlus" type="button" aria-label="모둠 수 늘리기">＋</button>
        </div>
        <button class="btn start" id="btnAllStart" type="button">▶ 전체 동시 시작</button>
        <button class="btn stop" id="btnAllStop" type="button">⏸ 전체 정지</button>
        <button class="btn ghost" id="btnAllReset" type="button">🔄 전체 초기화</button>
        <div class="grp">
            <span class="lbl">진자 모드</span>
            <button class="step-btn" id="btnPend" type="button" aria-pressed="false" style="width:auto;padding:0 10px;font-size:11.5px;font-weight:900">OFF</button>
        </div>
        <div class="pend" id="pendBox">
            <span>1회 측정 =</span>
            <input id="pendN" type="text" inputmode="numeric" value="10">
            <span>회 왕복 → 주기 자동 계산</span>
        </div>
        <div class="spacer"></div>
        <span class="count" id="hintKey" style="font-size:10.5px;font-weight:800;color:var(--muted)">Space: 전체 시작/정지</span>
    </div>

    <div class="teams" id="teams"></div>

    <div class="rec">
        <div class="rec-head">
            <h2>📋 모둠별 기록</h2>
            <span class="sub" id="recSub">랩 버튼을 누른 시각이 기록됩니다</span>
            <div class="spacer"></div>
            <button class="btn ghost" id="btnCopyTable" type="button">📋 표 복사</button>
            <button class="btn" id="btnCsv" type="button">⬇ CSV 저장</button>
        </div>
        <div class="tbl-wrap">
            <table id="recTable">
                <thead id="recHead"></thead>
                <tbody id="recBody"></tbody>
            </table>
        </div>
    </div>

</div>
</div>

<button id="btn-fullscreen" type="button" aria-pressed="false" aria-label="전체화면으로 전환">
    <span class="fs-icon" id="fsIcon">⛶</span><span class="fs-text" id="fsText">전체화면</span>
</button>

<script>
/* ==========================================================
   모둠별 멀티 스톱워치 (2~16모둠 · 랩타임 · 진자 주기 · CSV)
   ========================================================== */
(function () {
    'use strict';
    var $ = function (s) { return document.querySelector(s); };
    var COLORS = ['#0a84ff', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4', '#ec4899', '#84cc16',
                  '#6366f1', '#14b8a6', '#f97316', '#e11d48', '#a855f7', '#0ea5e9', '#ca8a04', '#64748b'];
    var MAX_TEAMS = 16, MIN_TEAMS = 2;

    var state = {
        count: 6,
        teams: [],
        pendulum: false,
        swings: 10
    };

    function now() { return (window.performance && performance.now) ? performance.now() : Date.now(); }

    function mkTeam(i) {
        return { name: (i + 1) + '모둠', elapsed: 0, startTs: 0, running: false, laps: [], color: COLORS[i % COLORS.length] };
    }

    function ensureTeams() {
        while (state.teams.length < state.count) state.teams.push(mkTeam(state.teams.length));
        if (state.teams.length > state.count) state.teams.length = state.count;
    }

    /* ---------- 시간 표기 ---------- */
    function pad(n, w) {
        var s = String(Math.floor(Math.abs(n)));
        while (s.length < w) s = '0' + s;
        return s;
    }
    function fmtTime(ms) {
        if (!isFinite(ms) || ms < 0) ms = 0;
        var m = Math.floor(ms / 60000);
        var s = Math.floor((ms % 60000) / 1000);
        var cs = Math.floor((ms % 1000) / 10);
        return pad(m, 2) + ':' + pad(s, 2) + '.' + pad(cs, 2);
    }
    function fmtShort(ms) {
        var s = ms / 1000;
        return (s >= 60 ? Math.floor(s / 60) + '분 ' + (s % 60).toFixed(2) + '초' : s.toFixed(2) + '초');
    }
    function cur(t) {
        return t.elapsed + (t.running ? now() - t.startTs : 0);
    }

    /* ---------- 카드 그리기 ---------- */
    function renderTeams() {
        var html = '';
        state.teams.forEach(function (t, i) {
            html += '<div class="team" data-i="' + i + '" style="--tc:' + t.color + '">' +
                '<div class="t-head">' +
                '<input class="t-name" value="' + escAttr(t.name) + '" aria-label="모둠 이름">' +
                '<span class="t-state">대기</span>' +
                '</div>' +
                '<div class="t-time" data-time>00:00.00</div>' +
                '<div class="t-btns">' +
                '<button class="t-start" type="button" data-act="start">▶ 시작</button>' +
                '<button class="t-lap" type="button" data-act="lap" disabled>랩</button>' +
                '</div>' +
                '<div class="t-laps" data-laps></div>' +
                '<div class="t-period" data-period></div>' +
                '</div>';
        });
        $('#teams').innerHTML = html;
        document.body.classList.toggle('pend-on', state.pendulum);
        state.teams.forEach(function (t, i) { paintTeam(i); });
    }

    function escAttr(s) {
        return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
            return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c];
        });
    }

    function teamEl(i) { return $('#teams').children[i]; }

    function paintTeam(i) {
        var t = state.teams[i], el = teamEl(i);
        if (!el) return;
        var ms = cur(t);
        el.querySelector('[data-time]').textContent = fmtTime(ms);
        var st = el.querySelector('.t-state');
        var startBtn = el.querySelector('[data-act="start"]');
        var lapBtn = el.querySelector('[data-act="lap"]');
        if (t.running) {
            st.textContent = '측정 중';
            st.className = 't-state run';
            startBtn.textContent = '⏸ 일시정지';
            startBtn.classList.add('pause');
        } else {
            st.textContent = t.laps.length ? '정지' : (ms > 0 ? '일시정지' : '대기');
            st.className = 't-state' + (ms > 0 ? ' stop' : '');
            startBtn.textContent = ms > 0 ? '▶ 이어서' : '▶ 시작';
            startBtn.classList.remove('pause');
        }
        lapBtn.disabled = !(t.running || ms > 0);

        var lapsHtml = '';
        t.laps.forEach(function (lapMs, n) {
            lapsHtml += '<span class="lap">' + (n + 1) + '회 <b>' + fmtTime(lapMs) + '</b>' +
                (state.pendulum ? ' · 주기 ' + (lapMs / state.swings / 1000).toFixed(3) + '초' : '') + '</span>';
        });
        el.querySelector('[data-laps]').innerHTML = lapsHtml;

        var pd = el.querySelector('[data-period]');
        if (state.pendulum) {
            if (t.laps.length) {
                var avg = t.laps.reduce(function (a, b) { return a + b; }, 0) / t.laps.length;
                pd.innerHTML = '🔄 ' + state.swings + '회 왕복 평균 ' + (avg / 1000).toFixed(2) + '초 → 평균 주기 <b>' +
                    (avg / state.swings / 1000).toFixed(3) + '초</b>';
            } else {
                pd.textContent = '🔄 랩을 누르면 ' + state.swings + '회 왕복 시간으로 주기를 계산합니다';
            }
        } else {
            pd.textContent = '';
        }
    }

    function paintAll() {
        state.teams.forEach(function (t, i) { paintTeam(i); });
        renderTable();
    }

    /* ---------- 동작 ---------- */
    function toggleTeam(i) {
        var t = state.teams[i];
        if (t.running) {
            t.elapsed = cur(t);
            t.running = false;
        } else {
            t.startTs = now();
            t.running = true;
        }
        paintTeam(i);
        renderTable();
    }
    function lapTeam(i) {
        var t = state.teams[i];
        if (!t.running && t.elapsed === 0) return;
        t.laps.push(cur(t));
        paintTeam(i);
        renderTable();
    }
    function resetTeam(i) {
        var t = state.teams[i];
        t.elapsed = 0; t.startTs = 0; t.running = false; t.laps = [];
        paintTeam(i);
    }
    function startAll() {
        state.teams.forEach(function (t) {
            if (!t.running) { t.startTs = now(); t.running = true; }
        });
        paintAll();
    }
    function stopAll() {
        state.teams.forEach(function (t) {
            if (t.running) { t.elapsed = cur(t); t.running = false; }
        });
        paintAll();
    }
    function resetAll() {
        state.teams.forEach(function (t) {
            t.elapsed = 0; t.startTs = 0; t.running = false; t.laps = [];
        });
        paintAll();
    }

    /* ---------- 기록 표 ---------- */
    function maxLaps() {
        return state.teams.reduce(function (m, t) { return Math.max(m, t.laps.length); }, 0);
    }
    function renderTable() {
        var n = maxLaps();
        var head = '<tr><th>모둠</th>';
        for (var i = 0; i < n; i++) head += '<th>' + (i + 1) + '회</th>';
        head += '<th>최종</th>' + (state.pendulum ? '<th>평균 주기</th>' : '') + '</tr>';
        $('#recHead').innerHTML = head;

        var body = '';
        state.teams.forEach(function (t) {
            body += '<tr><td>' + escAttr(t.name) + '</td>';
            for (var i = 0; i < n; i++) {
                if (i < t.laps.length) {
                    body += '<td' + (state.pendulum ? ' class="per" style="font-weight:800;color:inherit"' : '') + '>' +
                        (state.pendulum ? (t.laps[i] / state.swings / 1000).toFixed(3) + '초' : fmtTime(t.laps[i])) + '</td>';
                } else {
                    body += '<td class="empty">–</td>';
                }
            }
            var curMs = cur(t);
            body += '<td>' + (curMs > 0 ? fmtTime(curMs) : '–') + '</td>';
            if (state.pendulum) {
                if (t.laps.length) {
                    var avg = t.laps.reduce(function (a, b) { return a + b; }, 0) / t.laps.length;
                    body += '<td class="per">' + (avg / state.swings / 1000).toFixed(3) + '초</td>';
                } else {
                    body += '<td class="empty">–</td>';
                }
            }
            body += '</tr>';
        });
        $('#recBody').innerHTML = body;
        $('#recSub').textContent = state.pendulum
            ? '진자 모드: 각 기록은 ' + state.swings + '회 왕복 시간이며, 칸에 1회 주기를 표시합니다'
            : '랩 버튼을 누른 시각이 기록됩니다';
    }

    function tableText() {
        var n = maxLaps();
        var lines = [];
        var head = ['모둠'];
        for (var i = 0; i < n; i++) head.push((i + 1) + '회');
        head.push('최종');
        if (state.pendulum) head.push('평균 주기(초)');
        lines.push(head.join('\t'));
        state.teams.forEach(function (t) {
            var row = [t.name];
            for (var i = 0; i < n; i++) {
                if (i < t.laps.length) {
                    row.push(state.pendulum ? (t.laps[i] / state.swings / 1000).toFixed(3) : fmtTime(t.laps[i]));
                } else row.push('');
            }
            var ms = cur(t);
            row.push(ms > 0 ? fmtTime(ms) : '');
            if (state.pendulum) {
                if (t.laps.length) {
                    var avg = t.laps.reduce(function (a, b) { return a + b; }, 0) / t.laps.length;
                    row.push((avg / state.swings / 1000).toFixed(3));
                } else row.push('');
            }
            lines.push(row.join('\t'));
        });
        return lines.join('\n');
    }

    function copyText(txt, btn) {
        var done = function () {
            if (!btn) return;
            var old = btn.textContent;
            btn.textContent = '✅ 복사됨';
            setTimeout(function () { btn.textContent = old; }, 1400);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(txt).then(done, fb);
        } else fb();
        function fb() {
            var ta = document.createElement('textarea');
            ta.value = txt;
            ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); done(); } catch (e) { }
            document.body.removeChild(ta);
        }
    }

    /* ---------- 이벤트 ---------- */
    $('#teams').addEventListener('click', function (e) {
        var b = e.target.closest('button[data-act]');
        if (!b) return;
        var card = b.closest('.team');
        var i = +card.getAttribute('data-i');
        if (b.getAttribute('data-act') === 'start') toggleTeam(i);
        else lapTeam(i);
    });
    $('#teams').addEventListener('input', function (e) {
        if (!e.target.classList.contains('t-name')) return;
        var i = +e.target.closest('.team').getAttribute('data-i');
        state.teams[i].name = e.target.value;
        renderTable();
    });
    $('#btnMinus').addEventListener('click', function () {
        if (state.count <= MIN_TEAMS) return;
        state.count--;
        $('#teamCount').value = state.count;
        ensureTeams();
        renderTeams();
        renderTable();
    });
    $('#btnPlus').addEventListener('click', function () {
        if (state.count >= MAX_TEAMS) return;
        state.count++;
        $('#teamCount').value = state.count;
        ensureTeams();
        renderTeams();
        renderTable();
    });
    $('#teamCount').addEventListener('change', function () {
        var v = parseInt(this.value, 10);
        if (isNaN(v)) v = state.count;
        v = Math.max(MIN_TEAMS, Math.min(MAX_TEAMS, v));
        state.count = v;
        this.value = v;
        ensureTeams();
        renderTeams();
        renderTable();
    });
    $('#teamCount').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') this.blur();
    });
    $('#btnAllStart').addEventListener('click', startAll);
    $('#btnAllStop').addEventListener('click', stopAll);
    $('#btnAllReset').addEventListener('click', resetAll);
    $('#btnPend').addEventListener('click', function () {
        state.pendulum = !state.pendulum;
        this.textContent = state.pendulum ? 'ON' : 'OFF';
        this.setAttribute('aria-pressed', state.pendulum ? 'true' : 'false');
        this.style.background = state.pendulum ? 'rgba(14,165,233,.9)' : '';
        this.style.color = state.pendulum ? '#fff' : '';
        this.style.borderColor = state.pendulum ? 'transparent' : '';
        $('#pendBox').classList.toggle('on', state.pendulum);
        document.body.classList.toggle('pend-on', state.pendulum);
        paintAll();
    });
    $('#pendN').addEventListener('input', function () {
        var v = parseInt(String(this.value).replace(/[^\d]/g, ''), 10);
        state.swings = (isFinite(v) && v > 0 && v <= 100) ? v : 10;
        paintAll();
    });
    $('#btnCopyTable').addEventListener('click', function () { copyText(tableText(), this); });
    $('#btnCsv').addEventListener('click', function () {
        var rows = tableText().split('\n').map(function (line) {
            return line.split('\t').map(function (c) {
                return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c;
            }).join(',');
        });
        var csv = '\ufeff' + rows.join('\r\n');
        var d = new Date();
        var stamp = d.getFullYear() + pad(d.getMonth() + 1, 2) + pad(d.getDate(), 2) + '_' + pad(d.getHours(), 2) + pad(d.getMinutes(), 2);
        var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = '모둠별_스톱워치_' + stamp + '.csv';
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1200);
    });
    document.addEventListener('keydown', function (e) {
        var tag = (e.target && e.target.tagName) || '';
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
        if (e.code === 'Space' || e.key === ' ') {
            e.preventDefault();
            var anyRunning = state.teams.some(function (t) { return t.running; });
            if (anyRunning) stopAll(); else startAll();
        }
    });

    /* ---------- 렌더 루프 ---------- */
    var last = 0;
    function loop(t) {
        requestAnimationFrame(loop);
        if (!state.teams.some(function (x) { return x.running; })) return;
        if (t - last < 32) return;
        last = t;
        state.teams.forEach(function (tm, i) {
            if (tm.running) {
                var el = teamEl(i);
                if (el) el.querySelector('[data-time]').textContent = fmtTime(cur(tm));
            }
        });
    }

    /* ---------- 테마 · 전체화면 ---------- */
    function applyTheme(dark) {
        document.body.classList.toggle('dark', dark);
        $('#bTheme').textContent = dark ? '☀️ 주간 모드' : '🌙 야간 모드';
        try { localStorage.setItem('svl_sw_theme', dark ? '1' : '0'); } catch (e) { }
    }
    $('#bTheme').addEventListener('click', function () { applyTheme(!document.body.classList.contains('dark')); });
    try { if (localStorage.getItem('svl_sw_theme') === '1') applyTheme(true); } catch (e) { }

    (function () {
        var btn = document.getElementById('btn-fullscreen');
        var iconEl = document.getElementById('fsIcon');
        var textEl = document.getElementById('fsText');
        var root = document.documentElement;
        var PSEUDO = 'pseudo-fullscreen';
        function isRealFs() {
            return !!(document.fullscreenElement || document.webkitFullscreenElement ||
                document.mozFullScreenElement || document.msFullscreenElement);
        }
        function isPseudo() { return document.body.classList.contains(PSEUDO); }
        function syncUI() {
            var on = isRealFs() || isPseudo();
            iconEl.textContent = on ? '🗗' : '⛶';
            textEl.textContent = on ? '창모드' : '전체화면';
            btn.setAttribute('aria-pressed', on ? 'true' : 'false');
            btn.setAttribute('aria-label', on ? '창모드로 전환' : '전체화면으로 전환');
        }
        function toast(msg) {
            var el = document.getElementById('fs-toast');
            if (!el) {
                el = document.createElement('div');
                el.className = 'fs-toast'; el.id = 'fs-toast';
                document.body.appendChild(el);
            }
            el.textContent = msg; void el.offsetWidth; el.classList.add('show');
            clearTimeout(toast._t);
            toast._t = setTimeout(function () { el.classList.remove('show'); }, 2600);
        }
        function enterPseudo(hint) {
            if (isRealFs()) return;
            document.body.classList.add(PSEUDO);
            syncUI();
            if (hint) toast('이 브라우저는 브라우저 전체화면 대신 상단 바를 숨긴 몰입 모드로 표시합니다');
        }
        function requestReal() {
            var req = root.requestFullscreen || root.webkitRequestFullscreen || root.mozRequestFullScreen || root.msRequestFullscreen;
            if (!req) return false;
            try {
                var p = req.call(root);
                if (p && typeof p.then === 'function') p.then(syncUI, function () { enterPseudo(true); });
                else setTimeout(function () { if (!isRealFs() && !isPseudo()) enterPseudo(true); else syncUI(); }, 500);
                return true;
            } catch (err) { return false; }
        }
        btn.addEventListener('click', function () {
            if (isRealFs()) {
                var exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
                try { if (exit) { var q = exit.call(document); if (q && typeof q.catch === 'function') q.catch(function () { }); } } catch (err) { }
                syncUI(); return;
            }
            if (isPseudo()) { document.body.classList.remove(PSEUDO); syncUI(); return; }
            if (!requestReal()) enterPseudo(true);
            syncUI();
        });
        ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
            document.addEventListener(ev, function () {
                if (isRealFs()) document.body.classList.remove(PSEUDO);
                syncUI();
            });
        });
        document.addEventListener('keydown', function (e) {
            if ((e.key === 'Escape' || e.key === 'Esc') && isPseudo() && !isRealFs()) {
                document.body.classList.remove(PSEUDO); syncUI();
            }
        });
        window.addEventListener('resize', syncUI);
        syncUI();
    })();

    /* ---------- 시작 ---------- */
    ensureTeams();
    renderTeams();
    renderTable();
    requestAnimationFrame(loop);
})();
</script>
<script src="../labs/common/feedback.js" defer></script>
</body>
</html>
