<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>다양한 착시현상</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="preload" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff" as="font" type="font/woff" crossorigin>
<script src="../labs/common/i18n.js"></script>
<link rel="stylesheet" href="../labs/common/ui-layout.css">
<link rel="stylesheet" href="../labs/common/qr-modal.css">
<style>
@font-face{
    font-family:'SeoulNamsan';
    src:local('SeoulNamsan M'),local('SeoulNamsanM'),local('서울남산체 M'),
        url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff') format('woff');
    font-weight:400;font-style:normal;font-display:swap;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
    --bg:#eef2f7; --ink:#14181f; --muted:#64748b; --line:rgba(15,23,42,.10);
    --card:rgba(255,255,255,.92); --card-solid:#fff; --accent:#0a84ff; --accent-soft:rgba(10,132,255,.12);
    --ok:#10b981; --danger:#ef4444; --shadow:0 10px 30px rgba(15,23,42,.10);
    --stage:#f7f8fb;
}
body.dark{
    --bg:#0e121c; --ink:#eef3fb; --muted:#94a3b8; --line:rgba(255,255,255,.13);
    --card:rgba(26,32,45,.92); --card-solid:#1a2130; --accent:#4aa3ff; --accent-soft:rgba(74,163,255,.18);
    --ok:#34d399; --shadow:0 10px 30px rgba(0,0,0,.5);
    --stage:#f7f8fb;
}
html{scroll-behavior:smooth}
body{
    margin:0;padding:0;width:100%;min-height:100%;
    font-family:'SeoulNamsan',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:var(--ink); background:var(--bg); transition:background .3s ease,color .3s ease;
    -webkit-text-size-adjust:100%;
    word-break:keep-all; overflow-wrap:break-word;
}
/* ---------------- 상단 바 ---------------- */
.top-nav{
    position:fixed; top:0; left:0; right:0; height:60px; display:flex; align-items:center; gap:10px;
    padding:0 250px 0 16px; z-index:100; background:var(--card);
    backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-bottom:1px solid var(--line);
}
.back-btn{
    display:inline-flex; align-items:center; gap:6px; padding:7px 14px; font-family:inherit; font-size:13px;
    font-weight:800; color:inherit; text-decoration:none; border:1px solid var(--line); border-radius:999px;
    background:var(--card-solid); transition:transform .16s ease; white-space:nowrap; cursor:pointer;
}
.back-btn:hover{transform:translateY(-1px)}
.page-title{display:flex; align-items:center; gap:8px; font-size:14.5px; font-weight:800; letter-spacing:-.2px; min-width:0}
.page-title .t{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tag-pill{
    flex:0 0 auto; background:rgba(0,122,255,.14); color:#007aff;
    padding:2px 8px; border-radius:999px; font-size:10px; font-weight:800; letter-spacing:.2px;
}
body.dark .tag-pill{background:rgba(90,170,255,.22); color:#8bc4ff}
.top-right-bar{
    position:fixed !important; top:15px !important; right:20px !important;
    display:flex !important; flex-direction:column; align-items:flex-end; gap:8px; z-index:130 !important; pointer-events:none;
}
.top-right-bar > .tr-util{display:flex !important; flex-direction:row; align-items:center; gap:8px; pointer-events:auto}
#bTheme{
    display:inline-flex; align-items:center; justify-content:center; height:40px; width:40px; padding:0;
    border-radius:50%; cursor:pointer; font-family:inherit; font-size:17px; font-weight:800; color:inherit;
    border:1px solid var(--line); background:var(--card); box-shadow:var(--shadow);
}
#bTheme:hover{transform:translateY(-1px)}

/* ---------------- 본문 ---------------- */
.wrap{max-width:1200px; margin:0 auto; padding:78px 18px 40px}
.hero h1{font-size:clamp(21px,3.4vw,29px); margin:0 0 6px; letter-spacing:-.6px}
.hero .sub{margin:0 0 4px; font-size:13.5px; color:var(--muted); font-weight:700; line-height:1.55}
.hero .hint{margin:0; font-size:12px; color:var(--muted); line-height:1.6}

.toolbar{
    position:sticky; top:60px; z-index:70; margin:14px 0 16px; padding:10px 0;
    display:flex; flex-wrap:wrap; align-items:center; gap:8px;
    background:linear-gradient(to bottom, var(--bg) 72%, rgba(0,0,0,0));
}
.chips{display:flex; flex-wrap:wrap; gap:6px; flex:1 1 320px; min-width:0}
.chip{
    display:inline-flex; align-items:center; gap:6px; padding:8px 13px; border-radius:999px; cursor:pointer;
    font-family:inherit; font-size:12.5px; font-weight:800; color:var(--ink);
    border:1px solid var(--line); background:var(--card); white-space:nowrap; transition:transform .15s ease, background .15s ease;
}
.chip:hover{transform:translateY(-1px)}
.chip .cnt{font-size:11px; color:var(--muted); font-weight:800}
.chip.on{background:var(--accent); border-color:transparent; color:#fff}
.chip.on .cnt{color:rgba(255,255,255,.82)}
.tools{display:flex; flex-wrap:wrap; gap:8px}

.btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:9px 15px; border-radius:12px;
    font-family:inherit; font-size:12.5px; font-weight:800; color:var(--ink); cursor:pointer; white-space:nowrap;
    border:1px solid var(--line); background:var(--card-solid); transition:transform .15s ease, filter .15s ease;
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--accent); border-color:transparent; color:#fff}
.btn.ghost{background:transparent}
.btn.solid{background:#111827; border-color:transparent; color:#fff}
body.dark .btn.solid{background:#e6edf7; color:#101725}

/* ---------------- 카드 격자 ---------------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:14px}
.card{
    display:flex; flex-direction:column; gap:9px; padding:12px; border-radius:18px;
    background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow);
}
.card-head{display:flex; align-items:center; gap:7px; min-width:0}
.card-head .dot{flex:0 0 auto; width:8px; height:8px; border-radius:50%}
.card-head h3{margin:0; font-size:14.5px; font-weight:800; letter-spacing:-.2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.card-head .num{margin-left:auto; flex:0 0 auto; font-size:10.5px; font-weight:800; color:var(--muted); font-variant-numeric:tabular-nums}
.stage{position:relative; aspect-ratio:4/3; border-radius:13px; overflow:hidden; background:var(--stage); border:1px solid var(--line); cursor:zoom-in}
.stage-host{position:absolute; inset:0}
.stage-inner{position:absolute; inset:0; font-size:14px}
.stage-inner svg{display:block; width:100%; height:100%}
.card .q{margin:0; font-size:12.5px; font-weight:800; line-height:1.45}
.card .acts{display:flex; gap:6px; flex-wrap:wrap}
.card .acts .btn{padding:7px 11px; font-size:11.5px; border-radius:10px; flex:1 1 auto}
.btn .ico{display:inline-flex; margin-right:4px; font-size:11px}
.why{
    margin:0; font-size:11.5px; line-height:1.55; color:var(--muted);
    max-height:0; opacity:0; overflow:hidden; transition:max-height .32s ease, opacity .25s ease;
}
.card.revealed .why{max-height:260px; opacity:1}
.card.revealed{border-color:rgba(10,132,255,.4)}

/* 깨기 레이어: 보조선만 켜고 방해 요소는 흐리게 */
.stage-inner .aux{opacity:0; transition:opacity .35s ease; pointer-events:none}
.stage-inner .dim{transition:opacity .35s ease}
.stage-inner.reveal .aux{opacity:1}
.stage-inner.reveal .dim{opacity:.10}

.foot{margin:26px 2px 0; font-size:11.5px; color:var(--muted); line-height:1.6; text-align:center}

/* ---------------- 스트룹 위젯 ---------------- */
.stroop{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.7em; padding:.8em}
.stroop-word{font-size:2.5em; font-weight:900; letter-spacing:-.03em; line-height:1.1}
.stroop-opts{display:grid; grid-template-columns:repeat(4,1fr); gap:.35em; width:100%}
.stroop-opts button{
    font-family:inherit; font-size:.86em; font-weight:800; padding:.6em .2em; border-radius:.6em; cursor:pointer;
    border:.09em solid rgba(15,23,42,.14); background:#fff; color:#111;
}
.stroop-opts button:active{transform:scale(.97)}
.stroop-fb{height:1.3em; font-size:1em; font-weight:900; color:#10b981}
.stroop-fb.bad{color:#ef4444}
.stroop-ans{font-size:.8em; font-weight:800; color:var(--muted); opacity:0; transition:opacity .25s ease}
.stage-inner.reveal .stroop-ans{opacity:1}

/* ---------------- 보색 잔상 위젯 ---------------- */
.after{position:absolute; inset:0; background:#111; overflow:hidden; transition:background .35s ease}
.after.white{background:#fff}
.after-disc{
    position:absolute; top:50%; left:50%; width:56%; aspect-ratio:1; transform:translate(-50%,-50%);
    border-radius:50%; background:#e01b24; transition:opacity .3s ease;
}
.after.white .after-disc{opacity:0}
.after-dot{position:absolute; top:50%; left:50%; width:5px; height:5px; margin:-2.5px 0 0 -2.5px; border-radius:50%; background:#111}
.after.white .after-dot{background:#111}
.after-count{
    position:absolute; left:0; right:0; bottom:6%; text-align:center; font-size:1.6em; font-weight:900;
    color:#fff; opacity:0; transition:opacity .2s ease; font-variant-numeric:tabular-nums;
}
.after.run .after-count{opacity:1}
.after-msg{
    position:absolute; left:0; right:0; top:6%; text-align:center; font-size:.8em; font-weight:800;
    color:rgba(255,255,255,.86); padding:0 .6em;
}
.after.white .after-msg{color:#475569}

/* ---------------- 발표 모드 ---------------- */
.present{
    position:fixed; inset:0; z-index:300; display:none; flex-direction:column;
    background:var(--bg); padding:max(10px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom));
}
.present.on{display:flex}
.p-top{display:flex; align-items:center; gap:10px; min-width:0; padding:2px 2px 8px}
.p-cat{font-size:11px; font-weight:800; padding:4px 10px; border-radius:999px; background:var(--accent-soft); color:var(--accent); white-space:nowrap}
.p-title{font-size:clamp(15px,2.2vw,21px); font-weight:900; letter-spacing:-.4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.p-count{margin-left:auto; font-size:12px; font-weight:800; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums}
.p-close{
    flex:0 0 auto; font-family:inherit; font-size:12.5px; font-weight:800; color:var(--ink); cursor:pointer;
    padding:7px 13px; border-radius:999px; border:1px solid var(--line); background:var(--card-solid);
}
.p-stage{flex:0 0 auto; display:flex; align-items:center; justify-content:center; min-height:0; padding:6px 0; overflow:hidden; margin-top:auto}
.p-stage .stage-inner{
    position:relative; inset:auto; width:min(100%, calc((100vh - 250px) * 1.3333)); max-width:1040px;
    aspect-ratio:4/3; font-size:19px; border-radius:16px; overflow:hidden;
    background:var(--stage); border:1px solid var(--line);
}
.p-q{margin:10px 2px 0; font-size:clamp(13.5px,1.6vw,17px); font-weight:800; text-align:center; line-height:1.45}
.p-acts{display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-top:auto; padding-top:10px}
.p-acts .btn{font-size:13px; padding:10px 18px}
.p-why{
    margin:10px auto 0; max-width:900px; text-align:center; font-size:clamp(11.5px,1.3vw,14px); line-height:1.6;
    color:var(--muted); opacity:0; transition:opacity .25s ease; min-height:1.2em;
}
.present.revealed .p-why{opacity:1}

@media (max-width:760px){
    .top-nav{padding:0 130px 0 10px; height:54px}
    .page-title{font-size:13px}
    .wrap{padding:66px 12px 32px}
    .toolbar{top:54px; padding:8px 0}
    .grid{grid-template-columns:1fr; gap:12px}
    .chips{flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; padding-bottom:2px}
    .chips::-webkit-scrollbar{display:none}
    .chip{flex:0 0 auto}
    .tools{flex:0 0 auto}
    .p-stage .stage-inner{width:96vw; font-size:15px}
    .p-why{font-size:11px; line-height:1.45; max-height:3.6em; overflow:auto}
}
@media (max-width:420px){
    .top-nav{padding:0 118px 0 8px}
    .back-btn{padding:6px 10px; font-size:11.5px}
    .page-title .tag-pill{display:none}
}
@media (max-height:520px) and (orientation:landscape){
    .top-nav{height:46px}
    .wrap{padding-top:56px}
    .toolbar{top:46px}
    .p-top{padding-bottom:4px}
    .p-q{margin-top:6px; font-size:12.5px}
    .p-acts{margin-top:6px}
}
</style>

<script>
(function () {
'use strict';

/* =========================================================
   0. 공통 도우미
   ========================================================= */
var $ = function (s, r) { return (r || document).querySelector(s); };
var SVGNS = 'http://www.w3.org/2000/svg';

function pol(cx, cy, r, deg) {
    var a = deg * Math.PI / 180;
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
}
function n(v) { return Math.round(v * 10) / 10; }

/* 도넛 모양 부채꼴 (자스트로 착시) */
function sector(cx, cy, r1, r2, a1, a2) {
    var p1 = pol(cx, cy, r2, a1), p2 = pol(cx, cy, r2, a2);
    var p3 = pol(cx, cy, r1, a2), p4 = pol(cx, cy, r1, a1);
    var big = Math.abs(a2 - a1) > 180 ? 1 : 0;
    return 'M' + n(p1[0]) + ' ' + n(p1[1]) +
        'A' + r2 + ' ' + r2 + ' 0 ' + big + ' 1 ' + n(p2[0]) + ' ' + n(p2[1]) +
        'L' + n(p3[0]) + ' ' + n(p3[1]) +
        'A' + r1 + ' ' + r1 + ' 0 ' + big + ' 0 ' + n(p4[0]) + ' ' + n(p4[1]) + 'Z';
}

/* 점 목록 → 부드러운 곡선 경로 (루빈의 꽃병 윤곽) */
function smoothPath(pts) {
    if (!pts.length) return '';
    var d = 'M' + n(pts[0][0]) + ' ' + n(pts[0][1]);
    for (var i = 0; i < pts.length - 1; i++) {
        var p0 = pts[Math.max(i - 1, 0)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(i + 2, pts.length - 1)];
        var c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
        var c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
        d += 'C' + n(c1x) + ' ' + n(c1y) + ' ' + n(c2x) + ' ' + n(c2y) + ' ' + n(p2[0]) + ' ' + n(p2[1]);
    }
    return d;
}

/* 물결 윤곽 (수채화 착시) */
function wavyPath(cx, cy, R, amp, n) {
    var pts = [], i, p;
    for (i = 0; i < n; i++) {
        p = pol(cx, cy, R + ((i % 2) ? amp : -amp), i * 360 / n);
        pts.push([p[0], p[1]]);
    }
    pts.push(pts[0]);
    return smoothPath(pts);
}

function svg(inner) {
    return '<svg viewBox="0 0 400 300" xmlns="' + SVGNS + '" preserveAspectRatio="xMidYMid meet">' + inner + '</svg>';
}

/* =========================================================
   1. 착시 목록 (22종 · 5개 카테고리)
   ========================================================= */
var CATS = [
    { id: 'size',   name: '크기·길이',        color: '#0a84ff' },
    { id: 'shape',  name: '형태·평행·반전',   color: '#af52de' },
    { id: 'color',  name: '색·밝기·대비',     color: '#ff9f0a' },
    { id: 'motion', name: '움직임·잔상',      color: '#30d158' },
    { id: 'mind',   name: '불가능 도형·인지', color: '#ff375f' }
];

var ACT = {
    guide:  '보조선 보기',
    over:   '겹쳐 보기',
    hide:   '방해선 숨기기',
    lift:   '가림막 걷기',
    lock:   '한 면으로 고정',
    face:   '얼굴 칠하기',
    same:   '같은 색 다리 놓기',
    real:   '실제 색 보기',
    steps:  '밝기 단계 보기',
    cross:  '교차점 칠하기',
    place:  '주변 자리 보기',
    pieces: '조각 보기',
    answer: '정답 보기',
    ghost:  '없는 삼각형 보기'
};

var ILLUSIONS = [
/* ---------- 1. 크기·길이 ---------- */
{
    id: 'muller', cat: 'size', title: '뮐러-라이어', act: ACT.guide,
    q: '두 화살표 중 어느 선이 더 길어 보이나요?',
    why: '양 끝 화살촉이 눈의 움직임을 안쪽으로 끌어당겨, 바깥으로 벌어진 선이 더 길게 느껴집니다. 두 선의 길이는 똑같습니다.',
    render: function () {
        return svg(
            '<g class="dim">' +
                '<line x1="95" y1="100" x2="305" y2="100" stroke="#111" stroke-width="4"/>' +
                '<path d="M95 100 L68 77 M95 100 L68 123" stroke="#111" stroke-width="4" fill="none"/>' +
                '<path d="M305 100 L332 77 M305 100 L332 123" stroke="#111" stroke-width="4" fill="none"/>' +

/* ---------- 4. 움직임·잔상 ---------- */
{
    id: 'snake', cat: 'motion', title: '회전하는 뱀', act: ACT.steps,
    q: '그림이 돌아가는 것처럼 보이나요?',
    why: '밝기 단계가 반복되는 무늬를 눈이 움직이며 볼 때, 뇌가 밝기 변화를 움직임으로 해석합니다(프레이저-윌콕스 착시). 화면은 멈춰 있습니다.',
    render: function () {
        var sw = '', i, cols = ['#000000', '#3f3f3f', '#8c8c8c', '#ffffff'];
        for (i = 0; i < 4; i++) {
            sw += '<rect x="' + (128 + i * 38) + '" y="252" width="34" height="22" fill="' + cols[i] + '" stroke="#ffffff" stroke-width="1.5"/>';
        }
        return '<canvas class="snake-canvas" width="600" height="450" style="position:absolute;inset:0;width:100%;height:100%;display:block;background:#000"></canvas>' +
            '<svg class="aux" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" style="position:absolute;inset:0;width:100%;height:100%">' +
                '<rect x="112" y="240" width="176" height="46" rx="10" fill="rgba(0,0,0,.55)" stroke="#ffffff" stroke-width="1.5"/>' +
                sw +
            '</svg>';
    },
    mount: function (si) {
        var c = $('canvas.snake-canvas', si);
        if (!c) return;
        var ctx = c.getContext('2d'), W = c.width, H = c.height;
        var pal = ['#000000', '#3f3f3f', '#8c8c8c', '#ffffff'];
        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
        var rows = 3, cols = 5, r = 52, i, j, q;
        var sx = W / (cols + 0.55), sy = H / (rows + 0.55);
        for (i = 0; i < rows; i++) {
            for (j = 0; j < cols; j++) {
                var cx = sx * 0.78 + j * sx, cy = sy * 0.78 + i * sy;
                var phase = (j + i * 2) % 4;
                for (q = 0; q < 4; q++) {
                    var a0 = q * Math.PI / 2, a1 = (q + 1) * Math.PI / 2;
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, a0, a1);
                    ctx.lineWidth = r * 0.56;
                    ctx.strokeStyle = pal[(q + phase) % 4];
                    ctx.stroke();
                }
                /* 조각 경계를 검게 그어 밝기 단계를 또렷하게 */
                for (q = 0; q < 4; q++) {
                    var aa = q * Math.PI / 2;
                    ctx.beginPath();
                    ctx.moveTo(cx + Math.cos(aa) * r * 0.7, cy + Math.sin(aa) * r * 0.7);
                    ctx.lineTo(cx + Math.cos(aa) * r * 1.3, cy + Math.sin(aa) * r * 1.3);
                    ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.stroke();
                }
                ctx.beginPath();
                ctx.arc(cx, cy, r * 1.29, 0, Math.PI * 2);
                ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.stroke();
                ctx.beginPath();
                ctx.arc(cx, cy, r * 0.71, 0, Math.PI * 2);
                ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.stroke();
            }
        }
    }
},

                root._t = setTimeout(function () { stroopNext(root); }, ok ? 520 : 900);

/* =========================================================
   2. 카드 · 필터 · 발표 모드
   ========================================================= */
var grid = $('#grid'), chips = $('#chips');
var cards = [];
var filter = 'all';
var current = null;     /* 발표 중인 카드 */

function catOf(id) {
    for (var i = 0; i < CATS.length; i++) if (CATS[i].id === id) return CATS[i];
    return CATS[0];
}

function buildChips() {
    var html = '<button class="chip on" type="button" data-cat="all">전체 <span class="cnt">' + ILLUSIONS.length + '</span></button>';
    CATS.forEach(function (c) {
        var k = ILLUSIONS.filter(function (d) { return d.cat === c.id; }).length;
        html += '<button class="chip" type="button" data-cat="' + c.id + '">' + c.name + ' <span class="cnt">' + k + '</span></button>';
    });
    chips.innerHTML = html;
}

function buildCards() {
    grid.innerHTML = '';
    cards = [];
    ILLUSIONS.forEach(function (d, i) {
        var c = catOf(d.cat);
        var el = document.createElement('article');
        el.className = 'card';
        el.setAttribute('data-id', d.id);
        var acts = '';
        if (d.act) acts += '<button class="btn primary" type="button" data-act="reveal"><span class="ico" aria-hidden="true">🔍</span><span>' + d.act + '</span></button>';
        (d.controls || []).forEach(function (ct) {
            acts += '<button class="btn ghost" type="button" data-act="' + ct.act + '">' + ct.label + '</button>';
        });
        acts += '<button class="btn ghost" type="button" data-act="open">크게 보기</button>';
        el.innerHTML =
            '<div class="card-head"><span class="dot" style="background:' + c.color + '"></span>' +
                '<h3>' + d.title + '</h3><span class="num">' + (i + 1 < 10 ? '0' : '') + (i + 1) + '</span></div>' +
            '<div class="stage" role="button" tabindex="0" aria-label="착시를 크게 봅니다">' +
                '<div class="stage-host"><div class="stage-inner">' + d.render() + '</div></div>' +
            '</div>' +
            '<p class="q">' + d.q + '</p>' +
            '<div class="acts">' + acts + '</div>' +
            '<p class="why">' + d.why + '</p>';

        var card = {
            def: d, el: el, cat: c,
            stage: $('.stage-inner', el)
        };
        cards.push(card);
        grid.appendChild(el);

        if (d.mount) { try { d.mount(card.stage, card); } catch (e) { console.warn(d.id, e); } }
    });
}

/* 카드 클릭 처리 */
grid.addEventListener('click', function (e) {
    var cardEl = e.target.closest('.card');
    if (!cardEl) return;
    var card = null;
    for (var i = 0; i < cards.length; i++) if (cards[i].el === cardEl) card = cards[i];
    if (!card) return;
    var btn = e.target.closest('[data-act]');
    if (btn) { onAct(card, btn.getAttribute('data-act')); return; }
    /* 무대 안의 조작 위젯(스트룹 보기 버튼 등)은 발표 모드로 넘기지 않는다 */
    if (e.target.closest('button, a, input, select, label')) return;
    if (e.target.closest('.stage')) openPresent(card);
});
grid.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var st = e.target.closest('.stage');
    if (!st) return;
    e.preventDefault();
    var cardEl = st.closest('.card');
    for (var i = 0; i < cards.length; i++) if (cards[i].el === cardEl) openPresent(cards[i]);
});

function isRevealed(card) { return card.stage.classList.contains('reveal'); }

function revealHtml(card, on) {
    return on
        ? '<span class="ico" aria-hidden="true">↺</span><span>원래대로</span>'
        : '<span class="ico" aria-hidden="true">🔍</span><span>' + card.def.act + '</span>';
}

function setReveal(card, on) {
    card.stage.classList.toggle('reveal', !!on);
    card.el.classList.toggle('revealed', !!on);
    var b = $('[data-act="reveal"]', card.el);
    if (b) b.innerHTML = revealHtml(card, on);
    if (current === card) {
        $('#present').classList.toggle('revealed', !!on);
        var pb = $('#pReveal');
        if (pb) pb.innerHTML = revealHtml(card, on);
    }
}

function onAct(card, act) {
    if (act === 'reveal') { setReveal(card, !isRevealed(card)); return; }
    if (act === 'open') { openPresent(card); return; }
    var h = card.def.handle && card.def.handle[act];
    if (h) { try { h(card); } catch (e) { console.warn(e); } }
}

/* ---------- 발표 모드 ---------- */
function openPresent(card) {
    if (!card) return;
    /* 발표 모드에서 카드를 넘길 때, 앞 카드의 무대는 제자리로 돌려놓는다 */
    if (current && current !== card) {
        $('.stage-host', current.el).appendChild(current.stage);
    }
    current = card;
    var p = $('#present');
    $('#pCat').textContent = card.cat.name;
    $('#pTitle').textContent = card.def.title;
    $('#pQ').textContent = card.def.q;
    $('#pWhy').textContent = card.def.why;
    var lf = p.style.display;
    p.classList.add('on');
    p.setAttribute('aria-hidden', 'false');

    /* 지금 화면에 있는 조작 위젯(스트룹·보색 잔상 등)을 그대로 옮겨 온다 */
    $('#pStage').appendChild(card.stage);

    buildPresentActs(card);
    updateCount();
    p.classList.toggle('revealed', isRevealed(card));
    document.body.style.overflow = 'hidden';
}

function buildPresentActs(card) {
    var box = $('#pActs');
    box.innerHTML = '';
    var mk = function (label, act, cls, html) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'btn ' + (cls || '');
        b.setAttribute('data-pact', act);
        if (html) b.innerHTML = html; else b.textContent = label;
        return b;
    };
    box.appendChild(mk('◀ 이전', 'prev'));
    if (card.def.act) {
        var rb = mk('', 'reveal', 'primary', revealHtml(card, isRevealed(card)));
        rb.id = 'pReveal';
        box.appendChild(rb);
    }
    (card.def.controls || []).forEach(function (ct) {
        box.appendChild(mk(ct.label, ct.act, ''));
    });
    box.appendChild(mk('다음 ▶', 'next'));
}

function closePresent() {
    if (!current) return;
    var card = current;
    $('.stage-host', card.el).appendChild(card.stage);
    var p = $('#present');
    p.classList.remove('on');
    p.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    current = null;
}

$('#pActs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-pact]');
    if (!b || !current) return;
    var act = b.getAttribute('data-pact');
    if (act === 'prev') { step(-1); return; }
    if (act === 'next') { step(1); return; }
    if (act === 'reveal') { setReveal(current, !isRevealed(current)); return; }
    onAct(current, act);
});

$('#pClose').addEventListener('click', closePresent);

/* 발표 모드 안에서 보이는 카드 순서 = 지금 필터에 맞는 카드들 */
function visibleCards() {
    return cards.filter(function (c) { return c.el.style.display !== 'none'; });
}
function step(d) {
    var list = visibleCards();
    if (!list.length) return;
    var i = list.indexOf(current);
    var nx = list[(i + d + list.length) % list.length];
    if (nx !== current) openPresent(nx);
}
function updateCount() {
    var list = visibleCards();
    var i = list.indexOf(current);
    $('#pCount').textContent = (i + 1) + ' / ' + list.length;
}

document.addEventListener('keydown', function (e) {
    if (!current) return;
    if (e.key === 'Escape') { closePresent(); return; }
    if (e.key === 'ArrowRight') { step(1); return; }
    if (e.key === 'ArrowLeft') { step(-1); return; }
    if (e.key === ' ' && current.def.act) { e.preventDefault(); setReveal(current, !isRevealed(current)); }
});

/* ---------- 필터 ---------- */
chips.addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b) return;
    filter = b.getAttribute('data-cat');
    chips.querySelectorAll('.chip').forEach(function (x) { x.classList.toggle('on', x === b); });
    applyFilter();
});
function applyFilter() {
    cards.forEach(function (card) {
        var show = (filter === 'all' || card.def.cat === filter);
        card.el.style.display = show ? '' : 'none';
    });
}

$('#btnRandom').addEventListener('click', function () {
    var list = visibleCards();
    if (!list.length) return;
    var pick = list[Math.floor(Math.random() * list.length)];
    openPresent(pick);
});
$('#btnPresent').addEventListener('click', function () {
    var list = visibleCards();
    if (list.length) openPresent(list[0]);
});

/* =========================================================
   3. 위젯 동작
   ========================================================= */
/* --- 스트룹 --- */
function stroopNext(root) {
    if (!root || !root._names) return;
    var keys = ['red', 'blue', 'green', 'yellow'];
    var w = keys[Math.floor(Math.random() * 4)];
    var c = keys[Math.floor(Math.random() * 4)];
    var guard = 0;
    while (c === w && guard++ < 20) c = keys[Math.floor(Math.random() * 4)];
    var word = $('.stroop-word', root);
    word.textContent = root._names[w];
    word.style.color = root._ink[c];
    root._cur = c;
    var av = $('.sto-ans-val', root);
    if (av) av.textContent = root._names[root._cur];
    var fb = $('.stroop-fb', root);
    if (fb) { fb.textContent = ''; fb.classList.remove('bad'); }
}

/* --- 보색 잔상 --- */
function startAfter(card) {
    var box = $('.after', card.stage);
    if (!box) return;
    resetAfter(card, true);
    var left = 20;
    box.classList.add('run');
    var num = $('.after-count', box);
    var msg = $('.after-msg', box);
    num.textContent = String(left);
    if (msg) msg.textContent = '가운데 점을 20초 동안 바라보세요';
    clearInterval(box._timer);
    box._timer = setInterval(function () {
        left--;
        if (left <= 0) {
            clearInterval(box._timer);
            box.classList.remove('run');
            box.classList.add('white');
            if (msg) msg.textContent = '이제 흰 화면을 보세요 · 청록색 잔상이 보입니다';
            return;
        }
        num.textContent = String(left);
    }, 1000);
}
function resetAfter(card, keepRun) {
    var box = $('.after', card.stage);
    if (!box) return;
    clearInterval(box._timer);
    box.classList.remove('white');
    if (!keepRun) box.classList.remove('run');
    var msg = $('.after-msg', box);
    if (msg) msg.textContent = '가운데 점을 20초 동안 바라보세요';
    var num = $('.after-count', box);
    if (num) num.textContent = '20';
}

/* =========================================================
   4. 테마 · 시작
   ========================================================= */
function applyTheme(dark) {
    document.body.classList.toggle('dark', dark);
    var b = $('#bTheme');
    if (b) b.textContent = dark ? '☀️' : '🌙';
    try { localStorage.setItem('svl_illu_theme', dark ? '1' : '0'); } catch (e) {}
}
$('#bTheme').addEventListener('click', function () {
    applyTheme(!document.body.classList.contains('dark'));
});
try {
    var saved = localStorage.getItem('svl_illu_theme');
    if (saved === '1') applyTheme(true);
} catch (e) {}

buildChips();
buildCards();
applyFilter();

})();
</script>
