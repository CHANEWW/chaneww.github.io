<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>전기 회로 시뮬레이터 3D - Science Virtual LAB</title>
<style>
@font-face{font-family:'SeoulNamsanL';src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanL.woff') format('woff');font-weight:normal;font-style:normal}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;color:#1c1c1e;background:#f4f7f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","SeoulNamsanL",sans-serif}

/* 캔버스 */
canvas{position:fixed;inset:0;touch-action:none;display:block;z-index:1}

/* UI 공통 유리 스타일 */
.ui-card{background:rgba(255,255,255,0.75);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.8);border-radius:18px;box-shadow:0 8px 32px rgba(0,0,0,0.06);z-index:100;position:fixed}

/* 좌측 상단 헤더 */
#header{top:16px;left:20px;display:flex;align-items:center;gap:12px;padding:8px 16px;border-radius:999px}
.back-btn{display:flex;align-items:center;gap:4px;background:none;border:none;font-size:14px;font-weight:700;color:#333;cursor:pointer;padding:4px 8px;border-radius:8px;transition:background .2s}
.back-btn:hover{background:rgba(0,0,0,0.05)}
.title-text{font-size:15px;font-weight:800;color:#111}
.badge-tag{background:#e8f0fe;color:#3b82f6;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}

/* 중앙 상단 힌트 */
#hint{top:20px;left:50%;transform:translateX(-50%);padding:8px 20px;font-size:13px;color:#555;border-radius:999px;pointer-events:none;white-space:nowrap}

/* 좌측 부품 팔레트 */
#palette{left:20px;top:50%;transform:translateY(-50%);padding:12px 8px;display:flex;flex-direction:column;gap:8px;width:88px;border-radius:24px}
.pbtn{border:none;background:rgba(255,255,255,0.6);border-radius:16px;padding:10px 4px;color:#333;font:inherit;font-size:12px;font-weight:700;cursor:grab;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 2px 8px rgba(0,0,0,0.04);transition:all .15s ease;user-select:none}
.pbtn b{font-size:22px;line-height:1}
.pbtn:hover{background:#fff;transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,0.08)}
.pbtn:active{cursor:grabbing;transform:scale(0.95)}

/* 드래그 고스트 요소 */
#dragGhost{position:fixed;pointer-events:none;z-index:9999;display:none;padding:10px 16px;background:rgba(255,255,255,0.9);backdrop-filter:blur(10px);border:2px solid #3b82f6;border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,0.15);font-size:13px;font-weight:800;color:#111;transform:translate(-50%,-50%)}

/* 하단 컨트롤 바 */
#bar{bottom:20px;left:50%;transform:translateX(-50%);padding:10px 24px;display:flex;gap:16px;align-items:center;justify-content:center;border-radius:999px}
.ctl-group{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#444}
.seg{display:flex;background:rgba(0,0,0,0.06);border-radius:999px;padding:3px}
.seg label{padding:6px 14px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;color:#666;transition:all .2s}
.seg input{display:none}
.seg label:has(input:checked){background:#fff;color:#111;box-shadow:0 2px 8px rgba(0,0,0,0.1)}

.cbtn{border:none;background:rgba(255,255,255,0.8);color:#333;border-radius:999px;padding:8px 16px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:0 2px 8px rgba(0,0,0,0.05);transition:all .2s}
.cbtn:hover{background:#fff;transform:translateY(-1px)}
.cbtn:active{transform:scale(0.96)}

/* 부품 설정 팝업 */
#pop{display:none;width:220px;padding:16px;border-radius:24px;z-index:200}
#pop h4{margin:0 0 6px;font-size:14px;color:#111}
#pop input[type=range]{width:100%;margin:8px 0 12px;accent-color:#2c3e50}
#pv{font-size:20px;font-weight:900;color:#2c3e50;margin-bottom:4px}
.btn-del{width:100%;border:none;background:#fee2e2;color:#ef4444;border-radius:12px;padding:8px;font-weight:700;cursor:pointer}
.btn-del:hover{background:#fca5a5;color:#fff}

@media(max-width:768px){
  #palette{width:76px;padding:8px 6px}.pbtn{font-size:11px;padding:8px 2px}
  #header{padding:6px 12px}.title-text{font-size:13px}
  #hint{display:none}
}
</style>
</head>
<body>

<!-- 상단 헤더 -->
<div id="header" class="ui-card">
  <button class="back-btn" onclick="history.back()">← 메인</button>
  <span class="title-text">전기 회로 3D</span>
  <span class="badge-tag">visionOS</span>
</div>

<div id="hint" class="ui-card">💡 왼쪽 부품을 화면으로 끌어다 놓아 회로를 구성하세요</div>

<!-- 좌측 팔레트 -->
<div id="palette" class="ui-card"></div>

<!-- 드래그 고스트 -->
<div id="dragGhost"></div>

<!-- 팝업 메뉴 -->
<div id="pop" class="ui-card">
  <h4 id="pt">부품 설정</h4>
  <div id="pv">0</div>
  <input type="range" id="ps">
  <button class="btn-del" id="pd">삭제</button>
</div>

<!-- 하단 컨트롤 바 -->
<div id="bar" class="ui-card">
  <div class="seg">
    <label><input type="radio" name="mode" value="current">전류 흐름</label>
    <label><input type="radio" name="mode" value="electron" checked>전자 이동</label>
  </div>

  <div class="ctl-group">
    <label style="cursor:pointer;"><input type="checkbox" id="cLight" checked style="accent-color:#2c3e50;"> 전구 빛</label>
  </div>

  <button class="cbtn" id="bEx">⚡ 예제 회로</button>
  <button class="cbtn" id="bRst">🔄 초기화</button>
  <button class="cbtn" id="bCam">🎥 시점정렬</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const RA=[];for(let i=1;i<=10;i++)RA.push(i);
for(let i=2;i<=10;i++)RA.push(i*10);
for(let i=2;i<=10;i++)RA.push(i*100);
for(let i=2;i<=10;i++)RA.push(i*1000);

const TYPES={
  resist:{n:'저항',ic:'〰',R:10},
  bulb:{n:'전구',ic:'💡',R:10},
  wire:{n:'도선',ic:'━',R:0},
  batt:{n:'전지',ic:'🔋',V:1.5},
  vMeter:{n:'전압계',ic:'V',R:1e9},
  iMeter:{n:'전류계',ic:'A',R:0}
};

const mod=(a,b)=>((a%b)+b)%b;
function fmt(v,u){
  const a=Math.abs(v);if(a<1e-12)return '0 '+u;
  for(const[s,p]of[[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'μ']])
    if(a>=s)return(+(v/s).toPrecision(3))+' '+p+u;
  return(+(v/1e-6).toPrecision(3))+' μ'+u;
}

/* 3D 렌더러 & 씬 기본 설정 (밝은 톤) */
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const cv=renderer.domElement;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(38,1,.1,100);
let yaw=0,pitch=.85,dist=14;

function updateCam(){
  camera.position.set(dist*Math.sin(yaw)*Math.cos(pitch),dist*Math.sin(pitch),dist*Math.cos(yaw)*Math.cos(pitch)+.3);
  camera.lookAt(0,0,.2);
}
function resize(){
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();

/* 조명 */
scene.add(new THREE.HemisphereLight(0xffffff,0xdde3ea,1.1));
const sun=new THREE.DirectionalLight(0xffffff,0.8);
sun.position.set(5,12,7);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-10,right:10,top:8,bottom:-8,near:1,far:30});
sun.shadow.radius=3;
scene.add(sun);

/* 3D 판 geometry */
function rr(w,h,r){
  const s=new THREE.Shape(),x=-w/2,y=-h/2;
  s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);return s;
}

const bgGeom=new THREE.ExtrudeGeometry(rr(16,9.5,0.8),{depth:.3,bevelEnabled:true,bevelThickness:.08,bevelSize:.08,bevelSegments:4,curveSegments:16});
bgGeom.rotateX(-Math.PI/2);
const board=new THREE.Mesh(bgGeom,new THREE.MeshStandardMaterial({color:0xffffff,roughness:.2,metalness:.05}));
board.position.y=-.4;board.receiveShadow=true;scene.add(board);

const shadowPlane=new THREE.Mesh(new THREE.PlaneGeometry(16,9.5),new THREE.ShadowMaterial({opacity:.08}));
shadowPlane.rotation.x=-Math.PI/2;shadowPlane.position.y=.01;shadowPlane.receiveShadow=true;scene.add(shadowPlane);

/* 부품 관리 */
const parts=[];
const cylX=(r,l)=>new THREE.CylinderGeometry(r,r,l,28).rotateZ(Math.PI/2);
const mat=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.4,metalness:.15},o||{}));
const tmp=new THREE.Object3D();

function addPart(type,x0,z0,x1,z1){
  const T=TYPES[type];
  const p={type,x:[x0,x1],z:[z0,z1],V:T.V||0,R:T.R||0,I:0,dv:0,ph:0};
  const g=new THREE.Group();p.g=g;
  p.mid=new THREE.Group();
  const add=(geo,m,x,y,z)=>{const o=new THREE.Mesh(geo,m);o.position.set(x||0,y||0,z||0);o.castShadow=true;p.mid.add(o);return o};
  p.lead=new THREE.Mesh(cylX(type==='wire'?.07:.05,1),mat(type==='wire'?0xdd8844:0xc0c5d0,{metalness:.7,roughness:.3}));
  p.lead.castShadow=true;g.add(p.lead);
  p.j=[0,1].map(()=>{const m=new THREE.Mesh(new THREE.SphereGeometry(.15,20,16),mat(0x333333,{roughness:.3}));m.castShadow=true;g.add(m);return m});
  g.add(p.mid);

  if(type==='resist'){
    add(cylX(.22,1.1),mat(0xe5c396,{roughness:.5}));
    [[-.35,0xb5472f],[-.12,0x222222],[.1,0xd9a526],[.38,0xc9c9c9]].forEach(b=>add(cylX(.235,.08),mat(b[1]),b[0],0,0));
  }else if(type==='bulb'){
    add(new THREE.CylinderGeometry(.18,.22,.35,24),mat(0xd4af37,{metalness:.7,roughness:.3}),0,.18,0);
    p.glass=add(new THREE.SphereGeometry(.45,32,24),new THREE.MeshPhysicalMaterial({color:0xffffff,transparent:true,opacity:.3,roughness:.1,clearcoat:1}),0,.7,0);
    p.fil=add(new THREE.SphereGeometry(.18,20,16),mat(0x666666,{emissive:0xffb840,emissiveIntensity:0}),0,.7,0);
  }else if(type==='batt'){
    add(cylX(.3,1.0),mat(0x1f2937,{roughness:.3,metalness:.4}),-.2,0,0);
    add(cylX(.305,.45),mat(0xf59e0b,{metalness:.8,roughness:.2}),.48,0,0);
    add(cylX(.12,.12),mat(0xe5e7eb,{metalness:.9}),.78,0,0);
  }else if(type==='vMeter'||type==='iMeter'){
    const col=type==='vMeter'?0x3b82f6:0x10b981;
    add(new THREE.CylinderGeometry(.55,.55,.28,40),mat(col,{roughness:.3}),0,.14,0);
    add(new THREE.CylinderGeometry(.42,.42,.3,40),mat(0xffffff,{roughness:.2}),0,.15,0);
  }

  const geoCount=48;
  p.el=new THREE.InstancedMesh(new THREE.SphereGeometry(.075,10,8),new THREE.MeshBasicMaterial({color:0x3b82f6}),geoCount);
  p.ar=new THREE.InstancedMesh(new THREE.ConeGeometry(.1,.3,10).rotateZ(-Math.PI/2),new THREE.MeshBasicMaterial({color:0xef4444}),geoCount);
  p.el.frustumCulled=p.ar.frustumCulled=false;
  g.add(p.el);g.add(p.ar);
  g.position.y=.2;scene.add(g);parts.push(p);return p;
}

function removePart(p){
  scene.remove(p.g);parts.splice(parts.indexOf(p),1);
  if(sel===p)select(null);
}

/* 회로 해석 */
function simulate(){
  const pts=[],cnt=[];
  const id=(x,z)=>{
    for(let i=0;i<pts.length;i++)if(Math.hypot(pts[i][0]-x,pts[i][1]-z)<.05){cnt[i]++;return i}
    pts.push([x,z]);cnt.push(1);return pts.length-1;
  };
  parts.forEach(p=>{p.n0=id(p.x[0],p.z[0]);p.n1=id(p.x[1],p.z[1])});
  const n=pts.length;if(!n)return;
  parts.forEach(p=>{p.c0=cnt[p.n0]>1;p.c1=cnt[p.n1]>1});
  const A=Array.from({length:n},()=>new Float64Array(n+1));
  for(let i=0;i<n;i++)A[i][i]+=1e-9;
  parts.forEach(p=>{
    let r=p.type==='resist'||p.type==='bulb'?p.R:p.type==='vMeter'?1e9:.001;
    p.g=1/r;
    const a=p.n0,b=p.n1;
    A[a][a]+=p.g;A[b][b]+=p.g;A[a][b]-=p.g;A[b][a]-=p.g;
    if(p.type==='batt'){const Is=p.V*p.g;A[b][n]+=Is;A[a][n]-=Is}
  });
  for(let c=0;c<n;c++){
    let m=c;for(let r=c+1;r<n;r++)if(Math.abs(A[r][c])>Math.abs(A[m][c]))m=r;
    [A[c],A[m]]=[A[m],A[c]];
    const d=A[c][c]||1e-18;
    for(let r=0;r<n;r++){if(r===c)continue;const f=A[r][c]/d;if(f)for(let k=c;k<=n;k++)A[r][k]-=f*A[c][k]}
  }
  const v=A.map((row,i)=>row[n]/(row[i]||1e-18));
  parts.forEach(p=>{
    p.dv=v[p.n0]-v[p.n1];
    p.I=p.g*p.dv+(p.type==='batt'?p.V*p.g:0);
  });
}

function updatePart(p){
  const dx=p.x[1]-p.x[0],dz=p.z[1]-p.z[0],L=Math.hypot(dx,dz);
  p.L=L;
  p.g.position.set(p.x[0],.2,p.z[0]);p.g.rotation.y=-Math.atan2(dz,dx);
  p.lead.scale.x=L;p.lead.position.x=L/2;p.j[1].position.x=L;p.mid.position.x=L/2;
  [0,1].forEach(i=>{
    const on=i?p.c1:p.c0;
    p.j[i].material.color.set(on?0x111111:0x888888);
  });
  
  const modeEl=document.querySelector('input[name=mode]:checked');
  const electron=modeEl?modeEl.value==='electron':true;
  const I=p.I,S=.8,on=Math.abs(I)>1e-5;
  p.ph+=on?Math.sign(I)*(.01+Math.min(Math.abs(I),1)*.08):0;
  const mesh=electron?p.el:p.ar;(electron?p.ar:p.el).visible=false;mesh.visible=on;
  const off=electron?mod(-p.ph,S):mod(p.ph,S);let c=0;
  for(let k=0;k<48;k++){
    const x=k*S+off;if(x>L)break;
    tmp.position.set(x,0,0);tmp.rotation.set(0,electron||I>=0?0:Math.PI,0);tmp.updateMatrix();
    mesh.setMatrixAt(c++,tmp.matrix);
  }
  mesh.count=c;mesh.instanceMatrix.needsUpdate=true;
  
  if(p.type==='bulb'){
    const P=I*I*p.R;
    const b=$('#cLight').checked?1-Math.exp(-P*1.2):0;
    p.fil.material.emissiveIntensity=b*3.5;
  }
}

/* 팝업 제어 */
let sel=null;
const pop=$('#pop'),ps=$('#ps'),pv=$('#pv');
function select(p){
  sel=p;
  if(!p){pop.style.display='none';return}
  pop.style.display='block';
  $('#pt').textContent=TYPES[p.type].n+' 설정';
  if(p.type==='batt'){ps.min=.5;ps.max=12;ps.step=.5;ps.value=p.V;pv.textContent=fmt(p.V,'V')}
  else{ps.min=0;ps.max=36;ps.step=1;ps.value=RA.indexOf(p.R);pv.textContent=fmt(p.R,'Ω')}
}
ps.oninput=()=>{
  if(!sel)return;
  if(sel.type==='batt'){sel.V=+ps.value;pv.textContent=fmt(sel.V,'V')}
  else{sel.R=RA[+ps.value];pv.textContent=fmt(sel.R,'Ω')}
};
$('#pd').onclick=()=>removePart(sel);

/* 터치 및 마우스 포인터 인터랙션 */
const rc=new THREE.Raycaster(),pl=new THREE.Plane(new THREE.Vector3(0,1,0),-.2),v2=new THREE.Vector2();
function wp(e){
  const x = e.clientX !== undefined ? e.clientX : (e.touches ? e.touches[0].clientX : 0);
  const y = e.clientY !== undefined ? e.clientY : (e.touches ? e.touches[0].clientY : 0);
  v2.set(x/innerWidth*2-1,-y/innerHeight*2+1);rc.setFromCamera(v2,camera);
  const t=new THREE.Vector3();return rc.ray.intersectPlane(pl,t)?t:null;
}
function segDist(px,pz,p){
  const ax=p.x[0],az=p.z[0],bx=p.x[1],bz=p.z[1],dx=bx-ax,dz=bz-az;
  const l2=dx*dx+dz*dz||1e-9;let t=((px-ax)*dx+(pz-az)*dz)/l2;t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-ax-t*dx,pz-az-t*dz);
}

let drag=null,orbit=false,moved=false,down={x:0,y:0};

cv.addEventListener('pointerdown',e=>{
  if(e.target!==cv) return;
  moved=false;down={x:e.clientX,y:e.clientY};
  if(e.button===2){orbit=true;return}
  const w=wp(e);if(!w){orbit=true;return}
  
  let best=.6,hit=null;
  parts.forEach(p=>[0,1].forEach(i=>{const d=Math.hypot(w.x-p.x[i],w.z-p.z[i]);if(d<best){best=d;hit=[p,i]}}));
  if(hit){
    const hx=hit[0].x[hit[1]],hz=hit[0].z[hit[1]];
    const list=[];parts.forEach(p=>[0,1].forEach(i=>{if(Math.hypot(p.x[i]-hx,p.z[i]-hz)<.05)list.push([p,i])}));
    drag={kind:'joint',list,ox:w.x-hx,oz:w.z-hz};select(null);return;
  }
  for(let k=parts.length-1;k>=0;k--){
    const p=parts[k];
    if(segDist(w.x,w.z,p)<.55){
      drag={kind:'part',p,sx:w.x,sz:w.z,x0:p.x.slice(),z0:p.z.slice()};return;
    }
  }
  orbit=true;
});

cv.addEventListener('pointermove',e=>{
  if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>5)moved=true;
  if(orbit){
    yaw-=(e.movementX||0)*.005;
    pitch=Math.max(.3,Math.min(1.4,pitch+(e.movementY||0)*.005));
    updateCam();return;
  }
  if(!drag||!moved)return;
  const w=wp(e);if(!w)return;
  if(drag.kind==='joint'){
    drag.list.forEach(([p,i])=>{p.x[i]=w.x-drag.ox;p.z[i]=w.z-drag.oz});
  }else{
    const p=drag.p,dx=w.x-drag.sx,dz=w.z-drag.sz;
    for(let i=0;i<2;i++){p.x[i]=drag.x0[i]+dx;p.z[i]=drag.z0[i]+dz}
  }
});

cv.addEventListener('pointerup',e=>{
  if(!moved){
    if(drag&&drag.kind==='part'&&['resist','bulb','batt'].includes(drag.p.type))select(drag.p);
    else if(!drag)select(null);
  }
  drag=null;orbit=false;
});

/* 팔레트 부품 드래그 앤 드롭 생성 기능 */
const pal=$('#palette');
const ghost=$('#dragGhost');
let draggingType=null;

Object.keys(TYPES).forEach(k=>{
  const b=document.createElement('div');
  b.className='pbtn';
  b.innerHTML='<b>'+TYPES[k].ic+'</b>'+TYPES[k].n;
  
  const startDrag=(clientX, clientY)=>{
    draggingType=k;
    ghost.style.display='block';
    ghost.innerHTML=TYPES[k].ic+' '+TYPES[k].n;
    ghost.style.left=clientX+'px';
    ghost.style.top=clientY+'px';
  };

  b.addEventListener('pointerdown',e=>{
    e.stopPropagation();
    startDrag(e.clientX, e.clientY);
  });

  pal.appendChild(b);
});

window.addEventListener('pointermove',e=>{
  if(!draggingType) return;
  ghost.style.left=e.clientX+'px';
  ghost.style.top=e.clientY+'px';
});

window.addEventListener('pointerup',e=>{
  if(!draggingType) return;
  ghost.style.display='none';
  
  // 좌측 팔레트 바깥 영역에 드롭했을 때 3D 위치 계산 후 부품 추가
  const palRect=pal.getBoundingClientRect();
  if(e.clientX > palRect.right || e.clientY < palRect.top || e.clientY > palRect.bottom){
    const w=wp(e);
    if(w){
      addPart(draggingType, w.x-1.0, w.z, w.x+1.0, w.z);
    }else{
      addPart(draggingType, -1.0, 0, 1.0, 0);
    }
  }
  draggingType=null;
});

$('#bRst').onclick=()=>{while(parts.length)removePart(parts[0]);select(null)};
$('#bCam').onclick=()=>{yaw=0;pitch=.85;dist=14;updateCam()};

$('#bEx').onclick=()=>{
  $('#bRst').click();
  addPart('batt',-2.5,-1.5,-0.5,-1.5);
  addPart('bulb',-0.5,-1.5,1.5,-1.5);
  addPart('wire',1.5,-1.5,1.5,1.5);
  addPart('wire',1.5,1.5,-2.5,1.5);
  addPart('wire',-2.5,1.5,-2.5,-1.5);
};

/* 메인 프레임 루프 */
function frame(){
  requestAnimationFrame(frame);
  simulate();
  parts.forEach(updatePart);
  if(sel&&parts.includes(sel)){
    const mx=(sel.x[0]+sel.x[1])/2,mz=(sel.z[0]+sel.z[1])/2;
    const v=new THREE.Vector3(mx,.2,mz).project(camera);
    const sx=(v.x*.5+.5)*innerWidth,sy=(-v.y*.5+.5)*innerHeight;
    pop.style.left=Math.max(10,Math.min(innerWidth-230,sx-110))+'px';
    pop.style.top=Math.max(10,Math.min(innerHeight-200,sy+35))+'px';
  }
  renderer.render(scene,camera);
}

$('#bEx').click();
frame();
</script>
</body>
