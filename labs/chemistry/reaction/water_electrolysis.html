<style>
/* ============================================================
   Science Virtual LAB — 공통 기반 스타일 (base.css)
   ============================================================ */
@font-face {
    font-family: 'SeoulNamsan';
    src: local('SeoulNamsan M'), local('SeoulNamsanM'), local('서울남산체 M'),
         url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff') format('woff');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'SeoulNamsan', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background-color: #eef2f8;
    color: #1c1c1e;
    transition: background-color 0.35s ease, color 0.35s ease;
    -webkit-user-select: none;
    user-select: none;
}

#canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

/* ---------- visionOS 글래스모피즘 ---------- */
.glass-panel {
    background: rgba(255, 255, 255, 0.78);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.85);
    box-shadow: 0 8px 32px rgba(15, 23, 42, 0.08);
    border-radius: 18px;
    transition: background 0.3s ease, border-color 0.3s ease;
}

/* ---------- 상단 좌측 ---------- */
.top-left-bar {
    position: absolute;
    top: 16px;
    left: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 10;
}
.back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 15px;
    border-radius: 999px;
    text-decoration: none;
    color: #1c1c1e;
    font-weight: bold;
    font-size: 13.5px;
    cursor: pointer;
    transition: transform 0.2s ease, background 0.2s ease;
    border: none;
    font-family: inherit;
    white-space: nowrap;
}
.back-btn:hover { transform: translateY(-1px); background: rgba(255, 255, 255, 0.95); }
.tag-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 16px;
    border-radius: 999px;
    font-weight: bold;
    font-size: 14px;
    white-space: nowrap;
}
.tag-pill {
    background: rgba(0, 122, 255, 0.14);
    color: #007aff;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 999px;
    font-weight: 800;
    letter-spacing: 0.2px;
}
.qr-btn-icon { font-size: 14px; line-height: 1; }
.qr-btn-label { font-size: 12.5px; }

/* ---------- 상단 우측 ---------- */
.top-right-bar {
    position: absolute;
    top: 16px;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 10;
}
.tr-util { display: flex; align-items: center; gap: 8px; }
.icon-btn {
    width: 40px;
    height: 40px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    padding: 0;
    line-height: 1;
    flex: 0 0 40px;
    border: none;
    color: #1c1c1e;
    font-family: inherit;
    transition: all 0.2s ease;
}
.icon-btn:hover { transform: translateY(-1px); background: rgba(255, 255, 255, 0.95); }
.data-card {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 7px 16px;
    border-radius: 16px;
}
.data-item { display: flex; flex-direction: column; align-items: center; line-height: 1.15; }
.data-label { font-size: 9.5px; color: #64748b; font-weight: bold; letter-spacing: -0.2px; white-space: nowrap; }
.data-value {
    font-size: 13.5px;
    font-weight: 900;
    color: #0284c7;
    margin-top: 1px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
}
.data-sep { width: 1px; height: 22px; background: rgba(0, 0, 0, 0.08); }

/* ---------- 중앙 힌트 ---------- */
.center-tooltip {
    position: absolute;
    top: 84px;
    left: 46%;
    transform: translateX(-50%);
    padding: 8px 18px;
    border-radius: 16px;
    font-size: 11.5px;
    font-weight: bold;
    color: #334155;
    pointer-events: none;
    z-index: 10;
    white-space: normal;
    text-align: center;
    line-height: 1.5;
    letter-spacing: -0.2px;
    transition: opacity 0.35s ease;
    max-width: min(700px, calc(100vw - 460px));
    word-break: keep-all;
}
.center-tooltip.hidden { opacity: 0; }

/* ---------- 하단 중앙 ---------- */
.bottom-ctrl-bar {
    position: absolute;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);

    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-radius: 999px;
    z-index: 40;
}
.action-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid rgba(0, 0, 0, 0.08);
    background: rgba(255, 255, 255, 0.92);
    color: #1c1c1e;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
}
.action-btn:hover { background: #fff; transform: translateY(-1px); }

/* ---------- 우측 하단 전체화면 ---------- */
.bottom-right-bar { position: absolute; bottom: 22px; right: 20px; z-index: 45; }
.fullscreen-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 14px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    font-weight: 800;
    color: #1c1c1e;
    white-space: nowrap;
}

/* ---------- 우측 조절 패널 ---------- */
.side-ctrl-panel {
    position: absolute;
    right: 20px;
    bottom: 76px;
    width: 232px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 60;
    border-radius: 18px;
    max-height: calc(100vh - 150px);
}
.panel-title {
    font-size: 12px;
    font-weight: 800;
    color: #475569;
    letter-spacing: -0.2px;
    text-align: center;
    padding-bottom: 6px;
    border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    flex: 0 0 auto;
}
.panel-body {
    display: flex;
    flex-direction: column;
    gap: 7px;
    overflow-y: auto;
    min-height: 0;
    -webkit-overflow-scrolling: touch;
}
.tab-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; }
.tab-row.three { grid-template-columns: repeat(3, 1fr); }
.ctrl-tab-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 7px 1px;
    border-radius: 12px;
    border: 1px solid rgba(0, 0, 0, 0.08);
    background: rgba(255, 255, 255, 0.9);
    color: #334155;
    font-family: inherit;
    font-size: 9.5px;
    font-weight: 800;
    line-height: 1.15;
    cursor: pointer;
    white-space: nowrap;
    letter-spacing: -0.3px;
    transition: all 0.2s ease;
}
.ctrl-tab-btn .t-ico { font-size: 14px; line-height: 1; }
.ctrl-tab-btn:hover { background: #ffffff; }
.ctrl-tab-btn.active {
    background: #007aff;
    border-color: #007aff;
    color: #ffffff;
    box-shadow: 0 4px 12px rgba(0, 122, 255, 0.28);
}
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.seg.three { grid-template-columns: repeat(3, 1fr); }
.seg-btn {
    padding: 8px 1px;
    border-radius: 12px;
    border: 1px solid rgba(0, 0, 0, 0.08);
    background: rgba(255, 255, 255, 0.9);
    color: #334155;
    font-family: inherit;
    font-size: 10.5px;
    font-weight: 800;
    cursor: pointer;
    white-space: nowrap;
    letter-spacing: -0.3px;
    transition: all 0.2s ease;
}
.seg-btn:hover { background: #ffffff; }
.seg-btn.active { background: #0f172a; border-color: #0f172a; color: #ffffff; }
.btn-start {
    width: 100%;
    padding: 11px 8px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, #0ea5e9, #2563eb);
    color: #ffffff;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 900;
    letter-spacing: -0.2px;
    cursor: pointer;
    box-shadow: 0 5px 16px rgba(37, 99, 235, 0.28);
    transition: all 0.2s ease;
    white-space: nowrap;
}
.btn-start:hover { transform: translateY(-1px); }
.btn-start.on { background: linear-gradient(135deg, #22c55e, #0d9488); box-shadow: 0 5px 16px rgba(13, 148, 136, 0.26); }
.btn-start.off { background: linear-gradient(135deg, #94a3b8, #64748b); box-shadow: 0 5px 16px rgba(100, 116, 139, 0.24); }
.ctrl-row { display: flex; align-items: center; gap: 4px; }
.ctrl-row .lbl {
    flex: 0 0 30px;
    font-size: 9.5px;
    font-weight: 800;
    color: #64748b;
    letter-spacing: -0.3px;
    white-space: nowrap;
}
.mini {
    flex: 1 1 0;
    min-width: 0;
    padding: 6px 0;
    border-radius: 9px;
    border: 1px solid rgba(0, 0, 0, 0.08);
    background: rgba(255, 255, 255, 0.9);
    color: #334155;
    font-family: inherit;
    font-size: 10.5px;
    font-weight: 800;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.18s ease;
}
.mini:hover { background: #ffffff; }
.mini.active { background: #0f172a; border-color: #0f172a; color: #ffffff; }
.slider-row { display: flex; flex-direction: column; gap: 3px; }
.slider-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.slider-name { font-size: 10px; font-weight: 800; color: #64748b; letter-spacing: -0.3px; white-space: nowrap; }
.slider-val {
    font-size: 10.5px;
    font-weight: 900;
    color: #2563eb;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
}
input[type="range"].ctrl-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 999px;
    background: #e2e8f0;
    outline: none;
    cursor: pointer;
    margin: 0;
}
input[type="range"].ctrl-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #3b82f6;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(59, 130, 246, 0.4);
    border: 2px solid #fff;
}
input[type="range"].ctrl-slider::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #3b82f6;
    border: 2px solid #fff;
    cursor: pointer;
}
.state-badge {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    padding: 7px 8px;
    border-radius: 12px;
    background: rgba(2, 132, 199, 0.09);
    border: 1px dashed rgba(2, 132, 199, 0.28);
    font-size: 10.5px;
    font-weight: 800;
    color: #0369a1;
    letter-spacing: -0.3px;
    text-align: center;
    overflow: hidden;
}
.state-badge .sb-note { font-size: 8.5px; font-weight: 700; opacity: 0.8; white-space: nowrap; }

/* ---------- 도킹 서브 패널 ---------- */
.sub-panel {
    position: absolute;
    right: 264px;
    bottom: 76px;
    width: 340px;
    max-height: 78vh;
    overflow-y: auto;
    display: none;
    flex-direction: column;
    gap: 10px;
    padding: 13px 15px;
    border-radius: 18px;
    z-index: 55;
    -webkit-overflow-scrolling: touch;
}
.sub-panel.show { display: flex; }
@media (min-width: 901px) {
    body .sub-panel.left { left: 20px !important; right: auto !important; top: auto !important; bottom: 76px !important; width: 330px !important; max-width: 330px !important; max-height: 58vh !important; }
}
.sub-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding-bottom: 5px;
    border-bottom: 1px solid rgba(0, 0, 0, 0.06);
}
.sub-panel-title { font-size: 12.5px; font-weight: 800; color: #1e293b; letter-spacing: -0.3px; }
.sub-close {
    background: rgba(0, 0, 0, 0.06);
    border: none;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 11px;
    font-weight: bold;
    color: #64748b;
    font-family: inherit;
    flex: 0 0 24px;
}
.graph-canvas {
    width: 100%;
    height: 190px;
    display: block;
    border-radius: 12px;
    background: rgba(248, 250, 252, 0.9);
}
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 9.5px; font-weight: 800; color: #64748b; }
.legend i { display: inline-block; width: 14px; height: 8px; border-radius: 3px; margin-right: 4px; vertical-align: middle; }
.note { font-size: 9.5px; color: #7c8899; line-height: 1.45; letter-spacing: -0.2px; }

/* ---------- 다크 모드 ---------- */
body.dark-mode { background-color: #0b1220; color: #e2e8f0; }
body.dark-mode .glass-panel {
    background-color: rgba(22, 30, 45, 0.92);
    border-color: rgba(255, 255, 255, 0.1);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
}
body.dark-mode .sub-panel, body.dark-mode .side-ctrl-panel { background-color: rgba(22, 30, 45, 0.94); }
body.dark-mode .back-btn, body.dark-mode .tag-badge, body.dark-mode .icon-btn { color: #e2e8f0; }

body.dark-mode .data-sep { background: rgba(255, 255, 255, 0.12); }
body.dark-mode .panel-title { color: #94a3b8; border-bottom-color: rgba(255, 255, 255, 0.1); }
body.dark-mode .ctrl-tab-btn, body.dark-mode .seg-btn, body.dark-mode .mini {
    background: rgba(44, 54, 74, 0.92);
    border-color: rgba(255, 255, 255, 0.1);

}
body.dark-mode .ctrl-tab-btn.active { background: #0a84ff; border-color: #0a84ff; color: #fff; }
body.dark-mode .seg-btn.active { background: #e2e8f0; border-color: #e2e8f0; color: #0f172a; }
body.dark-mode .mini.active { background: #e2e8f0; color: #0f172a; border-color: #e2e8f0; }
body.dark-mode .state-badge { background: rgba(56, 189, 248, 0.14); color: #7dd3fc; border-color: rgba(56, 189, 248, 0.3); }
body.dark-mode .action-btn, body.dark-mode .fullscreen-btn {
    background: rgba(44, 54, 74, 0.92);
    color: #e2e8f0;
    border-color: rgba(255, 255, 255, 0.1);
}
body.dark-mode .sub-panel-title { color: #f1f5f9; }
body.dark-mode .sub-close { background: rgba(255, 255, 255, 0.12); color: #cbd5e1; }
body.dark-mode .graph-canvas { background: rgba(15, 23, 42, 0.9); }
body.dark-mode .legend, body.dark-mode .note { color: #94a3b8; }
body.dark-mode .center-tooltip { color: #cbd5e1; }
body.dark-mode input[type="range"].ctrl-slider { background: #334155; }


/* ---------- 이 실험 전용 ---------- */
#valO2 { color: #e11d48; }
#valH2 { color: #2563eb; }
.tube-line { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 10px; font-weight: 800; color: #64748b; }
.tube-line b { font-size: 11px; font-variant-numeric: tabular-nums; }

/* ============================================================
   모바일 반응형 보정 (세로/가로) — 공통 블록
   ============================================================ */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
img, canvas { max-width: 100%; }

/* ---------- 모바일 세로 (폭 900px 이하) ---------- */
@media (max-width: 900px) {
    .top-left-bar {
        top: max(8px, env(safe-area-inset-top)) !important;
        left: 8px !important;
        right: 56px !important;
        gap: 6px !important;
        flex-wrap: nowrap !important;
        align-items: center !important;
        overflow: hidden;
    }
    .top-left-bar .back-btn, .top-left-bar > a {
        flex: 0 0 auto;
        padding: 6px 10px !important;
        font-size: 12px !important;
        gap: 4px !important;
        white-space: nowrap;
    }
    .top-left-bar .tag-badge {
        flex: 0 1 auto;
        min-width: 0;
        padding: 6px 10px !important;
        font-size: 12px !important;
        gap: 5px !important;
        white-space: nowrap;
        overflow: hidden;
    }
    .top-left-bar .tag-badge > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .qr-btn-label { display: none !important; }
    .tag-pill { font-size: 9px !important; padding: 1px 6px !important; flex: 0 0 auto; }

    .top-right-bar {
        top: calc(max(8px, env(safe-area-inset-top)) + 40px) !important;
        right: 8px !important;
        gap: 6px !important;
        flex-wrap: nowrap !important;
    }
    .data-card {
        flex: 0 1 auto;
        min-width: 0;
        gap: 7px !important;
        padding: 5px 9px !important;
        overflow: hidden;
    }
    .data-item { min-width: 0; }
    .data-label { font-size: 8.5px !important; line-height: 1.2; letter-spacing: -0.4px; }
    .data-value { font-size: 12px !important; line-height: 1.25; }
    .data-sep { height: 18px; }
    .icon-btn { width: 34px !important; height: 34px !important; min-width: 34px; font-size: 15px !important; flex: 0 0 34px; }

    /* 3D 실험실: 전체화면 버튼은 1행 우측 아이콘으로 */
    body.is-3d .bottom-right-bar {
        top: max(8px, env(safe-area-inset-top)) !important;
        bottom: auto !important;
        right: 8px !important;
        left: auto !important;
        z-index: 20;
    }
    body .bottom-right-bar button { padding: 7px 10px !important; font-size: 14px !important; gap: 4px !important; line-height: 1; }
    body .bottom-right-bar #fullscreenText { display: none !important; }

    controls.minDistance = 4;

        g.textAlign = 'center';
        g.textBaseline = 'middle';
        var tw = Math.min(460, g.measureText(text).width + pad);

        g.fillStyle = 'rgba(255,255,255,0.92)';
        g.beginPath();
        var r = 34;
        g.moveTo(x0 + r, 18);
        g.lineTo(x0 + tw - r, 18);
        g.quadraticCurveTo(x0 + tw, 18, x0 + tw, 18 + r);
        g.lineTo(x0 + tw, 110 - r);
        g.quadraticCurveTo(x0 + tw, 110, x0 + tw - r, 110);
        g.lineTo(x0 + r, 110);
        g.quadraticCurveTo(x0, 110, x0, 110 - r);
        g.lineTo(x0, 18 + r);
        g.quadraticCurveTo(x0, 18, x0 + r, 18);
        g.closePath();
        g.fill();
        g.fillStyle = color;
        g.fillText(text, cv.width / 2, 66);

    function makeMoleculeMesh(kind) {
        var g = new THREE.Group();
        var isH = kind === 'H';
        var mat = new THREE.MeshStandardMaterial(isH
            ? { color: 0xdbeafe, roughness: 0.3, metalness: 0.05, emissive: 0x2f6fb5, emissiveIntensity: 0.75 }
            : { color: 0xf05a5a, roughness: 0.34, metalness: 0.05, emissive: 0x8f1a1a, emissiveIntensity: 0.7 });

            m.position.x = sx * r * 0.95;
            g.add(m);
        });
        var bond = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.36, r * 0.36, r * 1.0, 10), mat);
        bond.rotation.z = Math.PI / 2;
        g.add(bond);

    }

    var molecules = [];

        var nH = 16, nO = 10;

    function spawnMolecule(kind) {

    }

    function spawnBubble(tube) {

    function ratioText() {

    function updateHud() {

        } else if (!state.naoh) {
            name.textContent = '순수한 물';
            note.textContent = '전류가 거의 흐르지 않아 기체가 거의 생기지 않습니다';
        } else if (state.h2 >= MAX_H2 - 0.05) {

    function updateGasVisual() {
        var gh2 = state.h2 * ML_TO_H;
        var go2 = state.o2 * ML_TO_H;

        // 수소 시험관
        var hTop2 = TUBE_INNER_TOP - gh2;
        tubeH2.water.scale.y = Math.max(0.001, hTop2 - TUBE_BASE);
        tubeH2.water.position.y = TUBE_BASE + (hTop2 - TUBE_BASE) / 2;
        tubeH2.gas.visible = gh2 > 0.01;
        tubeH2.gas.scale.y = Math.max(0.001, gh2);
        tubeH2.gas.position.y = TUBE_INNER_TOP - gh2 / 2;
        tubeH2.meniscus.visible = gh2 > 0.01;
        tubeH2.meniscus.position.y = hTop2;

        // 산소 시험관
        var hTop1 = TUBE_INNER_TOP - go2;
        tubeO2.water.scale.y = Math.max(0.001, hTop1 - TUBE_BASE);
        tubeO2.water.position.y = TUBE_BASE + (hTop1 - TUBE_BASE) / 2;
        tubeO2.gas.visible = go2 > 0.01;
        tubeO2.gas.scale.y = Math.max(0.001, go2);
        tubeO2.gas.position.y = TUBE_INNER_TOP - go2 / 2;
        tubeO2.meniscus.visible = go2 > 0.01;
        tubeO2.meniscus.position.y = hTop1;
    }

    /* ============================================================
       시뮬레이션
       ============================================================ */
    var spawnAcc = [0, 0];

    function simulate(dt) {
        var conducting = state.on && state.volt >= 2 && !state.busy;
        var k = clamp((state.volt - 2) / 10, 0, 1);
        var eff = state.naoh ? 1 : 0.05;
        var rate = k * eff;

        if (conducting && rate > 0.001) {
            var h2rate = rate * 2.4;                     // mL/s
            var before = state.h2;
            state.h2 = Math.min(MAX_H2, state.h2 + h2rate * dt);
            var produced = state.h2 - before;
            state.o2 = Math.min(MAX_O2, state.o2 + produced / 2);

            // 기포 생성: 수소 2 : 산소 1
            spawnAcc[1] += rate * 30 * dt;
            spawnAcc[0] += rate * 15 * dt;
            while (spawnAcc[1] >= 1) { spawnBubble(1); spawnAcc[1] -= 1; }
            while (spawnAcc[0] >= 1) { spawnBubble(0); spawnAcc[0] -= 1; }
            // 분자 모형: 수소 2 : 산소 1 비율로 조금씩
            if (molOn) {
                molAcc += rate * 7 * dt;
                while (molAcc >= 1) {
                    molAcc -= 1;
                    spawnMolecule(Math.random() < 0.66 ? 'H' : 'O');
                }
            }
        }
        // 분자 모형 상승 (물을 타고 시험관으로 올라간다)
        var limitH = TUBE_INNER_TOP - state.h2 * ML_TO_H;
        var limitO = TUBE_INNER_TOP - state.o2 * ML_TO_H;
        for (var mi = 0; mi < molecules.length; mi++) {
            var mo = molecules[mi];
            if (!mo.active) continue;
            if (!molOn) { mo.active = false; mo.mesh.visible = false; continue; }
            mo.y += mo.vy * dt;
            mo.bob += dt * 3.4;
            mo.mesh.position.set(mo.x + Math.sin(mo.bob) * 0.03, mo.y, mo.z + Math.cos(mo.bob * 0.9) * 0.03);
            mo.mesh.rotation.y += mo.sp * dt;
            mo.mesh.rotation.z = Math.sin(mo.bob * 0.7) * 0.5;
            var lim = mo.kind === 'H' ? limitH : limitO;
            if (mo.y >= lim - 0.05) { mo.active = false; mo.mesh.visible = false; }
        }

        // 전극 발광
        var glowTarget = conducting && rate > 0.001 ? clamp(0.25 + rate * 0.7, 0, 1) : 0;
        cathode.glow.material.opacity = lerp(cathode.glow.material.opacity, glowTarget * 0.8, 0.08);
        anode.glow.material.opacity = lerp(anode.glow.material.opacity, glowTarget * 0.8, 0.08);
        ledMat.color.setHex(state.on ? 0x22c55e : 0x1f2937);
        ledGlow.intensity = state.on ? 1.2 : 0;

        // 기포 상승
        var topH2 = TUBE_INNER_TOP - state.h2 * ML_TO_H;
        var topO2 = TUBE_INNER_TOP - state.o2 * ML_TO_H;
        for (var i = 0; i < bubbles.length; i++) {
            var b = bubbles[i];
            if (!b.active) continue;
            var limit = b.tube === 1 ? topH2 : topO2;
            b.y += b.vy * dt;
            b.wob += dt * 5;
            b.mesh.position.set(b.x + Math.sin(b.wob) * 0.02, b.y, b.z + Math.cos(b.wob * 0.8) * 0.02);
            if (b.y >= limit - 0.02) {
                b.active = false;
                b.mesh.visible = false;
            }
        }

        updateGasVisual();
    }

    /* ============================================================
       트윈(연출)
       ============================================================ */
    var tweens = [];
    function tween(dur, onUpdate, onDone) {
        tweens.push({ t: 0, dur: dur, onUpdate: onUpdate, onDone: onDone });
    }
    function updateTweens(dt) {
        for (var i = tweens.length - 1; i >= 0; i--) {
            var tw = tweens[i];
            tw.t += dt;
            var p = clamp(tw.t / tw.dur, 0, 1);
            if (tw.onUpdate) tw.onUpdate(p);
            if (p >= 1) {
                tweens.splice(i, 1);
                if (tw.onDone) tw.onDone();
            }
        }
    }
    function easeInOut(t) { return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; }

    /* ---------- 확인 실험: 향불(산소) ---------- */
    function testOxygen() {
        if (state.busy || state.o2 < 1.5) return;
        state.busy = true;
        updateHud();
        setHint('🔥 꺼져가던 향불을 (+)극 시험관에 넣습니다…', true);

        splint.visible = true;
        splint.position.set(1.1, 3.5, 0);
        splint.rotation.z = 0;
        flame.visible = false;
        emberMat.color.setHex(0x5a3b1e);
        emberLight.intensity = 0;

        var topY = TUBE_INNER_TOP - state.o2 * ML_TO_H;
        var endY = Math.max(TUBE_BASE + 0.45, topY + 0.35);

        tween(0.9, function (p) {
            splint.position.y = lerp(3.5, endY, easeInOut(p));
        }, function () {
            setHint('✨ 향불이 다시 환하게 타올랐습니다! (+)극 기체는 연소를 돕는 산소입니다.', true);
            emberMat.color.setHex(0xffd166);
            emberLight.intensity = 2.6;
            flame.visible = true;
            flame.scale.set(1.5, 1.5, 1.5);
            flash.position.set(1.1, endY + 0.55, 0);
            flash.visible = true;
            flash.material.opacity = 0.55;
            flash.scale.setScalar(0.35);
            tween(1.0, function (q) {
                flash.material.opacity = 0.55 * (1 - q);
                flash.scale.setScalar(0.35 + q * 0.55);
                flame.scale.set(1.5 + Math.sin(q * 20) * 0.2, 1.5 + q * 0.5, 1.5);
            }, function () {
                flash.visible = false;
            });
            tween(2.2, function (q) {
                if (q > 0.75) {
                    splint.position.y = lerp(endY, 3.9, (q - 0.75) / 0.25);
                    flame.scale.setScalar(Math.max(0.001, 1.5 * (1 - (q - 0.75) / 0.25)));
                }
            }, function () {
                splint.visible = false;
                flame.visible = false;
                emberLight.intensity = 0;
                state.o2 = Math.max(0, state.o2 * 0.7);
                state.busy = false;
                addLog('산소', '향불이 다시 타올랐다', '연소를 돕는 기체 → 산소');
                updateHud();
            });
        });
    }

    /* ---------- 확인 실험: 성냥불(수소) ---------- */
    function testHydrogen() {
        if (state.busy || state.h2 < 3.0) return;
        state.busy = true;
        updateHud();
        setHint('🧨 성냥불을 (-)극 시험관 입구에 댑니다…', true);

        splint.visible = true;
        splint.position.set(-1.1, 3.45, 0);
        flame.visible = true;
        flame.scale.setScalar(0.9);
        emberMat.color.setHex(0xffd166);
        emberLight.intensity = 1.6;

        var topY = TUBE_INNER_TOP - state.h2 * ML_TO_H;
        var endY = Math.max(TUBE_BASE + 0.55, topY + 0.4);

        tween(0.85, function (p) {
            splint.position.y = lerp(3.45, endY, easeInOut(p));
        }, function () {
            // 폭발 연출
            flash.position.set(-1.1, endY + 0.3, 0);
            flash.visible = true;
            flash.material.opacity = 0.85;
            flash.scale.setScalar(0.25);
            popLabel.visible = true;
            popLabel.position.set(-1.1, endY + 1.15, 0);
            popLabel.material.opacity = 0;
            setTimeout(function () {
                setHint('💥 "펑!" 작은 폭발음과 함께 불꽃이 튀었습니다! (-)극 기체는 수소입니다.', true);
            }, 60);
            tween(0.8, function (q) {
                flash.material.opacity = 0.85 * (1 - q);
                flash.scale.setScalar(0.25 + q * 1.15);
                popLabel.material.opacity = q < 0.2 ? q * 5 : (1 - (q - 0.2) / 0.8);
                popLabel.position.y = endY + 1.15 + q * 0.35;
            }, function () {
                flash.visible = false;
                popLabel.visible = false;
                splint.visible = false;
                flame.visible = false;
                emberLight.intensity = 0;
                state.h2 = Math.max(0, state.h2 * 0.55);
                state.o2 = Math.min(state.o2, state.h2 / 2);
                state.busy = false;
                addLog('수소', '"펑!" 폭발음과 함께 탔다', '가연성 기체 → 수소');
                updateHud();
            });
        });
    }

    /* ---------- 기록 ---------- */
    function addLog(name, result, conclusion) {
        state.log.push({ name: name, result: result, conclusion: conclusion });
        renderLog();
        $('panelLog').classList.add('show');
    }
    function renderLog() {
        var wrap = $('logList');
        if (!state.log.length) {
            wrap.innerHTML = '<div class="log-empty">아직 확인한 기체가 없습니다.<br>기체를 모은 뒤 향불·성냥불을 넣어 보세요.</div>';
            return;
        }
        var html = '';
        for (var i = 0; i < state.log.length; i++) {
            var L = state.log[i];
            html += '<div class="log-item"><span class="num">' + (i + 1) + '</span><span><b>' + L.name + '</b> · ' + L.result + '<br>' + L.conclusion + '</span></div>';
        }
        wrap.innerHTML = html;
    }

    /* ============================================================
       UI 연결
       ============================================================ */
    function setTab(tab) {
        state.tab = tab;
        $('paneCtrl').style.display = tab === 'ctrl' ? 'flex' : 'none';
        $('paneTest').style.display = tab === 'test' ? 'flex' : 'none';
        $('tabCtrl').classList.toggle('active', tab === 'ctrl');
        $('tabTest').classList.toggle('active', tab === 'test');
    }

    $('tabCtrl').addEventListener('click', function () { setTab('ctrl'); });
    $('tabTest').addEventListener('click', function () { setTab('test'); });

    $('btnPower').addEventListener('click', function () {
        state.on = !state.on;
        if (state.on) {
            if (state.volt < 2) setHint('⚠️ 전압이 2 V보다 낮아 전기 분해가 거의 일어나지 않습니다. 전압을 올려 보세요.');
            else if (!state.naoh) setHint('💧 순수한 물에는 전해질이 거의 없어 전류가 잘 흐르지 않습니다. 수산화 나트륨을 넣어 보세요.');
            else setHint('⚡ 전원이 켜졌습니다. 두 전극에서 기체가 발생합니다.');
        } else {
            setHint('⏻ 전원을 껐습니다. 발생하던 기포가 멈춥니다.');
        }
        updateHud();
    });

    $('voltRange').addEventListener('input', function (e) {
        state.volt = parseFloat(e.target.value);
        updateHud();
    });

    $('btnMolecule').addEventListener('click', function () {
        molOn = !molOn;
        this.classList.toggle('active', molOn);
        this.innerHTML = molOn ? '🧪 수소·산소 모형 표시' : '🧪 수소·산소 모형 숨김';
        if (!molOn) {
            molecules.forEach(function (m) { m.active = false; m.mesh.visible = false; });
        }
        setHint(molOn ? '🧪 전극에서 올라오는 수소(H₂)·산소(O₂) 분자 모형을 보여 줍니다.' : '🧪 분자 모형을 숨겼습니다. 기포의 부피만 봅니다.', false);
    });

    $('btnNaoh').addEventListener('click', function () {
        state.naoh = true;
        $('btnNaoh').classList.add('active');
        $('btnWater').classList.remove('active');
        if (state.on) setHint('🧂 수산화 나트륨을 녹여 전해질을 만들었습니다. 전류가 잘 흐릅니다.');
        updateHud();
    });
    $('btnWater').addEventListener('click', function () {
        state.naoh = false;
        $('btnWater').classList.add('active');
        $('btnNaoh').classList.remove('active');
        setHint('💧 전해질이 없는 순수한 물은 전기가 거의 통하지 않아 기체가 거의 생기지 않습니다.');
        updateHud();
    });

    $('btnSplint').addEventListener('click', function () {
        if (state.o2 < 1.5) {
            setHint('⚠️ (+)극에 산소가 1.5 mL 이상 모여야 향불을 확인할 수 있습니다.');
            return;
        }
        testOxygen();
    });
    $('btnMatch').addEventListener('click', function () {
        if (state.h2 < 3.0) {
            setHint('⚠️ (-)극에 수소가 3 mL 이상 모여야 성냥불을 확인할 수 있습니다.');
            return;
        }
        testHydrogen();
    });

    $('btnLog').addEventListener('click', function () {
        $('panelLog').classList.toggle('show');
    });
    $('closeLog').addEventListener('click', function () {
        $('panelLog').classList.remove('show');
    });

    $('themeBtn').addEventListener('click', function () {
        state.dark = !state.dark;
        document.body.classList.toggle('dark-mode', state.dark);
        scene.background = new THREE.Color(state.dark ? DARK_BG : LIGHT_BG);
        benchMat.color.setHex(state.dark ? 0x16202f : 0xd7e2ee);
        hemi.intensity = state.dark ? 0.34 : 0.62;
        key.intensity = state.dark ? 0.78 : 1.05;
        fill.intensity = state.dark ? 0.16 : 0.28;
        $('themeBtn').textContent = state.dark ? '☀️' : '🌙';
        $('themeBtn').title = state.dark ? '주간 모드로 전환' : '야간 모드로 전환';
    });

    function reset() {
        state.on = false;
        state.h2 = 0;
        state.o2 = 0;
        state.busy = false;
        state.log = [];
        $('voltRange').value = state.volt;
        for (var i = 0; i < bubbles.length; i++) {
            bubbles[i].active = false;
            bubbles[i].mesh.visible = false;
        }
        tweens.length = 0;
        splint.visible = false;
        flame.visible = false;
        emberLight.intensity = 0;
        flash.visible = false;
        popLabel.visible = false;
        $('panelLog').classList.remove('show');
        renderLog();
        updateGasVisual();
        updateHud();
        setHint(hintBase, false);
    }

    $('btnReset').addEventListener('click', function () { reset(); });
    $('btnAlign').addEventListener('click', function () {
        fitCamera();
    });

    /* ---------- 3D 클릭: 전원 장치 토글 ---------- */
    var raycaster = new THREE.Raycaster();
    var pointer = new THREE.Vector2();
    var downPos = { x: 0, y: 0 };
    renderer.domElement.addEventListener('pointerdown', function (e) {
        downPos.x = e.clientX;
        downPos.y = e.clientY;
    });
    renderer.domElement.addEventListener('pointerup', function (e) {
        if (Math.abs(e.clientX - downPos.x) > 6 || Math.abs(e.clientY - downPos.y) > 6) return;
        pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
        pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        var hits = raycaster.intersectObjects([boxBody, boxFace, led, knob], false);
        if (hits.length) {
            $('btnPower').click();
            return;
        }
        hits = raycaster.intersectObjects([tubeO2.group, tubeH2.group, glassCell], true);
        if (hits.length) {
            setHint('💡 시험관 속 기체의 부피는 위쪽 데이터 카드에서 실시간으로 확인할 수 있습니다.');
        }
    });

    /* ---------- 리사이즈 ---------- */
    window.addEventListener('resize', function () {
        camera.aspect = window.innerWidth / Math.max(1, window.innerHeight);
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        fitCamera();
    });

    /* ============================================================
       시작
       ============================================================ */
    fitCamera();
    updateGasVisual();
    updateHud();
    setTab('ctrl');
    setHint(hintBase, false);

    var lastT = performance.now();
    var lastHud = 0;
    function loop(now) {
        requestAnimationFrame(loop);
        var dt = Math.min((now - lastT) / 1000, 0.06);
        lastT = now;
        updateTweens(dt);
        simulate(dt);
        if (now - lastHud > 140) { lastHud = now; updateHud(); }
        // 광원 미세 흔들림(연출)
        if (state.on && !state.busy && state.volt >= 2 && state.naoh) {
            key.position.x = 6 + Math.sin(now * 0.0007) * 0.15;
        }
        controls.update();
        renderer.render(scene, camera);
    }
    requestAnimationFrame(loop);

    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () { fitCamera(); });
    }
})();
</script>
<script>
/* ============ 전체화면 / 창모드 + 모바일 화면 재조정 (공통) ============ */
(function () {
    'use strict';
    var docEl = document.documentElement;
    var btn = document.getElementById('fullscreenBtn');
    var icon = document.getElementById('fullscreenIcon');
    var text = document.getElementById('fullscreenText');
    var started = false;

    function realFs() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement ||
                  document.mozFullScreenElement || document.msFullscreenElement);
    }
    function pseudo() { return docEl.classList.contains('pseudo-fs'); }

    function toast(msg) {
        var t = document.getElementById('ux-toast');
        if (!t) {
            t = document.createElement('div');
            t.id = 'ux-toast';
            t.style.cssText = 'position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);' +
                'background:rgba(28,28,30,.88);color:#fff;font-size:12px;line-height:1.4;padding:9px 14px;border-radius:14px;' +
                'z-index:9999;max-width:86vw;text-align:center;pointer-events:none;transition:opacity .3s;' +
                'font-family:inherit;box-shadow:0 8px 24px rgba(0,0,0,.25)';
            document.body.appendChild(t);
        }
        t.textContent = msg;
        t.style.opacity = '1';
        clearTimeout(t._t);
        t._t = setTimeout(function () { t.style.opacity = '0'; }, 2600);
    }

    function setUI() {
        var on = realFs() || pseudo();
        if (icon) icon.textContent = on ? '\uD83D\uDDD7' : '\u26F6';
        if (text) text.textContent = on ? '창모드' : '전체화면';
        if (btn) {
            btn.setAttribute('aria-label', on ? '창모드로 전환' : '전체화면으로 전환');
            btn.title = on ? '창모드로 전환' : '전체화면으로 전환';
        }
        document.body.classList.toggle('is-fullscreen', on);
        setTimeout(function () {
            try { window.dispatchEvent(new Event('resize')); } catch (e) {}
            if (typeof window.svlFitCamera === 'function') window.svlFitCamera();
        }, 140);
        setTimeout(function () {
            try { window.dispatchEvent(new Event('resize')); } catch (e) {}
            if (typeof window.svlFitCamera === 'function') window.svlFitCamera();
        }, 420);
    }

    function onKey(e) {
        if (e.key !== 'Escape' && e.key !== 'Esc') return;
        if (pseudo() && !realFs()) { docEl.classList.remove('pseudo-fs'); setUI(); }
    }

    if (btn) {
        btn.addEventListener('click', function () {
            if (realFs()) {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                else if (document.msExitFullscreen) document.msExitFullscreen();
                return;
            }
            if (pseudo()) { docEl.classList.remove('pseudo-fs'); setUI(); return; }
            var req = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.msRequestFullscreen;
            if (req) {
                try {
                    var r = req.call(docEl);
                    if (r && typeof r.catch === 'function') r.catch(function () { docEl.classList.add('pseudo-fs'); setUI(); });
                } catch (err) {
                    docEl.classList.add('pseudo-fs');
                }
            } else {
                docEl.classList.add('pseudo-fs');
                try { window.scrollTo(0, 1); } catch (e) {}
                toast('이 브라우저는 전체화면을 지원하지 않아 상단 정보를 숨긴 몰입 모드로 표시합니다');
            }
            setUI();
        }, false);
    }

    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
        document.addEventListener(ev, setUI);
    });
    document.addEventListener('keydown', onKey);

    /* 회전·주소창 변화·전체화면 전환 후 3D 카메라/렌더러 재계산 */
    var rt = null;
    function refit() {
        clearTimeout(rt);
        rt = setTimeout(function () {
            try { window.dispatchEvent(new Event('resize')); } catch (e) {}
            if (typeof window.svlFitCamera === 'function') window.svlFitCamera();
        }, 240);
    }
    window.addEventListener('orientationchange', refit);
    window.addEventListener('pageshow', refit);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) refit(); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', refit);

    setUI();
    started = true;
})();

</script>
