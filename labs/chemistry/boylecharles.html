<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>보일·샤를 법칙 3D</title>
    <!-- Three.js 및 OrbitControls 3D 엔진 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        @font-face {
            font-family: 'SeoulNamsan';
            src: local('SeoulNamsan M'), local('SeoulNamsanM'), local('서울남산체 M'),
                 url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'SeoulNamsan', -apple-system, sans-serif;
            background-color: #f2f2f7;
            color: #1c1c1e;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Apple visionOS Glassmorphic UI */
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            z-index: 10;
        }

        .top-left-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            color: #1c1c1e;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tag-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
        }

        .tag-pill {
            background: rgba(0, 122, 255, 0.15);
            color: #007aff;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
        }

        .top-right-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .data-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 20px;
        }

        .data-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .data-label {
            font-size: 11px;
            color: #8e8e93;
            font-weight: bold;
        }

        .data-value {
            font-size: 15px;
            font-weight: bold;
            color: #1c1c1e;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            transition: all 0.2s;
        }

        .center-tooltip {
            position: absolute;
            top: 12%;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 18px;
            font-size: 13px;
            color: #8e8e93;
            border-radius: 30px;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.5s ease;
            white-space: nowrap;
        }

        /* 좌측 하단 그래프 패널 */
        .graph-panel {
            position: absolute;
            left: 20px;
            bottom: 24px;
            padding: 12px 14px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            z-index: 10;
        }

        #graph-canvas {
            width: 220px;
            height: 150px;
            display: block;
            border-radius: 12px;
        }

        .graph-caption {
            font-size: 11px;
            font-weight: bold;
            color: #8e8e93;
        }

        .bottom-control-bar {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            z-index: 10;
        }

        .control-tab-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 14px;
            min-width: 68px;
            border-radius: 14px;
            border: none;
            background: transparent;
            color: #1c1c1e;
            font-size: 12px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-tab-btn.active {
            background: #007aff;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }

        .sub-panel {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            padding: 20px;
            width: 340px;
            display: none;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }

        .sub-panel.show { display: flex; }

        .slider-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #007aff;
        }

        .mode-row {
            display: flex;
            gap: 8px;
        }

        .mode-btn {
            flex: 1;
            padding: 9px 6px;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            background: rgba(255, 255, 255, 0.6);
            font-family: inherit;
            font-size: 13px;
            font-weight: bold;
            color: #1c1c1e;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.on {
            background: #007aff;
            color: #ffffff;
            border-color: #007aff;
        }

        .panel-note {
            font-size: 11px;
            color: #8e8e93;
            line-height: 1.6;
            font-weight: bold;
        }

        .formula {
            text-align: center;
            font-size: 15px;
            font-weight: bold;
            color: #007aff;
            letter-spacing: 0.5px;
            padding: 6px 0;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        }

        body.dark-mode {
            background-color: #121212;
            color: #f2f2f7;
        }

        body.dark-mode .glass-panel {
            background: rgba(30, 30, 30, 0.78);
            border-color: rgba(255, 255, 255, 0.15);
            color: #f2f2f7;
        }

        body.dark-mode .data-value, body.dark-mode .back-btn,
        body.dark-mode .control-tab-btn {
            color: #f2f2f7;
        }

        body.dark-mode .icon-btn {
            background: rgba(40, 40, 40, 0.75);
            color: #fff;
        }

        body.dark-mode .mode-btn {
            background: rgba(60, 64, 78, 0.8);
            color: #eee;
            border-color: rgba(255, 255, 255, 0.1);
        }

        body.dark-mode .mode-btn.on {
            background: #007aff;
            color: #fff;
        }

        .bottom-right-bar {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }
        button.back-btn, button.tag-badge {
            font-family: inherit;
            border: none;
        }

        @media (max-width: 768px) {
            .bottom-right-bar { bottom: 15px; right: 15px; }
            .center-tooltip { display: none; }
            .graph-panel { left: 12px; bottom: 78px; padding: 8px 10px 6px; }
            #graph-canvas { width: 150px; height: 105px; }
            .bottom-control-bar { bottom: 14px; }
            .control-tab-btn { min-width: 52px; padding: 6px 8px; font-size: 11px; }
            .sub-panel { width: 300px; bottom: 76px; }
            .data-card { gap: 9px; padding: 8px 12px; }
            .data-value { font-size: 13px; }
        }
    













/* @@MOBILE-BASE v1@@ */
/* ============================================================
   모바일 반응형 보정 (세로/가로) — 자동 생성 블록
   ============================================================ */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
img, canvas { max-width: 100%; }

/* ---------- 모바일 세로 (폭 900px 이하) ---------- */
@media (max-width: 900px) {
    /* 1행: [메인][제목]  ...  [전체화면 아이콘] */
    .top-left-bar {
        top: max(8px, env(safe-area-inset-top)) !important;
        left: 8px !important;
        right: 56px !important;
        gap: 6px !important;
        flex-wrap: nowrap !important;
        align-items: center !important;
        overflow: hidden;
    }
    .top-left-bar .back-btn,
    .top-left-bar > a {
        flex: 0 0 auto;
        padding: 6px 10px !important;
        font-size: 12px !important;
        gap: 4px !important;
        white-space: nowrap;
    }
    .top-left-bar .tag-badge {
        flex: 0 1 auto;
        min-width: 0;
        padding: 6px 10px !important;
        font-size: 12px !important;
        gap: 5px !important;
        white-space: nowrap;
        overflow: hidden;
    }
    .top-left-bar .tag-badge > span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .tag-pill { font-size: 9px !important; padding: 1px 6px !important; flex: 0 0 auto; }

    /* 2행: [데이터 카드 .............][테마] */
    .top-right-bar {
        top: calc(max(8px, env(safe-area-inset-top)) + 40px) !important;
        left: 8px !important;
        right: 8px !important;
        gap: 6px !important;
        justify-content: flex-end !important;
        flex-wrap: nowrap !important;
    }
    .data-card {
        flex: 1 1 0%;
        min-width: 0;
        gap: 4px !important;
        padding: 6px 8px !important;
        justify-content: space-around !important;
        overflow: hidden;
    }
    .data-card { flex-direction: row !important; align-items: center !important; flex-wrap: nowrap !important; }
    .data-item { min-width: 0; flex-direction: column !important; align-items: center !important; gap: 0 !important; }
    .data-item > * { white-space: nowrap; }
    .voltmeter-display { font-size: 24px !important; }
    .data-label { font-size: 9px !important; white-space: nowrap; line-height: 1.2; }
    .data-value { font-size: 12.5px !important; white-space: nowrap; line-height: 1.25; }
    .icon-btn { width: 34px !important; height: 34px !important; min-width: 34px; font-size: 15px !important; flex: 0 0 auto; }

    /* 전체화면: 1행 우측 아이콘 버튼 (글자는 숨김) */
    .bottom-right-bar {
        top: max(8px, env(safe-area-inset-top)) !important;
        bottom: auto !important;
        right: 8px !important;
        left: auto !important;
        z-index: 20;
    }
    .bottom-right-bar button,
    .bottom-right-bar .back-btn {
        padding: 6px 9px !important;
        font-size: 14px !important;
        gap: 4px !important;
        line-height: 1;
    }
    .bottom-right-bar #fullscreenText,
    .bottom-right-bar .fs-text { display: none !important; }

    /* 안내 문구 */
    .center-tooltip, #guide-tooltip {
        top: calc(max(8px, env(safe-area-inset-top)) + 88px) !important;
        left: 8px !important;
        right: 8px !important;
        transform: none !important;
        margin: 0 auto;
        width: auto !important;
        max-width: none !important;
        font-size: 11.5px !important;
        padding: 7px 12px !important;
        white-space: normal !important;
        line-height: 1.45;
        text-align: center;
        z-index: 15 !important;
    }

    /* 하단 컨트롤 바: 화면 폭 전체, 한 줄 유지 */
    .bottom-control-bar {
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        transform: none !important;
        width: 100% !important;
        border-radius: 18px 18px 0 0 !important;
        padding: 6px 6px calc(6px + env(safe-area-inset-bottom)) !important;
        gap: 2px !important;
        justify-content: space-around !important;
        flex-wrap: nowrap !important;
        overflow: visible;
    }
    .control-tab-btn {
        flex: 1 1 0 !important;
        min-width: 0 !important;
        padding: 5px 2px !important;
        font-size: 10.5px !important;
        gap: 1px !important;
        border-radius: 12px !important;
        white-space: nowrap !important;
        line-height: 1.15;
    }
    .control-tab-btn span { white-space: nowrap !important; }
    .control-tab-btn span:first-child { font-size: 15px !important; line-height: 1.1; }

    /* 슬라이더 등 서브 패널 */
    .sub-panel {
        left: 8px !important;
        right: 8px !important;
        bottom: calc(76px + env(safe-area-inset-bottom)) !important;
        transform: none !important;
        width: auto !important;
        max-width: none !important;
        max-height: 46vh;
        overflow-y: auto;
        padding: 13px 14px !important;
        gap: 10px !important;
        -webkit-overflow-scrolling: touch;
    }
    .sub-panel-title { font-size: 11px !important; }
    .slider-header { font-size: 11px !important; }
    .control-row { gap: 5px !important; flex-wrap: wrap; }
    .toggle-btn, .mode-btn, .quick-btn, .example-item, .preset-btn { font-size: 11px !important; }
    input[type="range"] { height: 22px; }

    /* 팝업(모달)이 화면을 넘지 않도록 */
    .modal-overlay { padding: 12px !important; align-items: center !important; }
    .modal-card {
        max-height: 88vh !important;
        overflow-y: auto !important;
        width: auto !important;
        max-width: 100% !important;
        padding: 16px !important;
        -webkit-overflow-scrolling: touch;
    }
    .modal-title { font-size: 15px !important; }
    .modal-body { font-size: 12px !important; }
    .example-title { font-size: 11.5px !important; }
    .example-desc { font-size: 11px !important; line-height: 1.5 !important; }
}

@media (max-width: 430px) {
    /* 아주 좁은 화면에서는 장식용 배지를 숨겨 제목 자리를 확보 */
    .tag-pill { display: none !important; }
}

/* ---------- 모바일 가로 (높이 500px 이하) ---------- */
@media (max-height: 500px) and (orientation: landscape) {
    .top-left-bar {
        top: max(6px, env(safe-area-inset-top)) !important;
        left: 6px !important;
        right: auto !important;
        max-width: 46vw;
        gap: 5px !important;
    }
    .top-left-bar .back-btn,
    .top-left-bar > a,
    .top-left-bar .tag-badge {
        padding: 4px 9px !important;
        font-size: 11px !important;
        height: 30px;
    }
    .tag-pill { display: none !important; }

    .top-right-bar {
        top: max(6px, env(safe-area-inset-top)) !important;
        right: 88px !important;
        left: auto !important;
        gap: 5px !important;
    }
    .data-card { padding: 4px 9px !important; gap: 9px !important; flex: 0 0 auto; }
    .data-label { font-size: 8.5px !important; }
    .data-value { font-size: 11.5px !important; }
    .icon-btn { width: 28px !important; height: 28px !important; min-width: 28px; font-size: 13px !important; }

    .bottom-right-bar {
        top: max(6px, env(safe-area-inset-top)) !important;
        bottom: auto !important;
        right: 6px !important;
        z-index: 20;
    }
    .bottom-right-bar button,
    .bottom-right-bar .back-btn { padding: 4px 8px !important; font-size: 13px !important; }
    .bottom-right-bar #fullscreenText,
    .bottom-right-bar .fs-text { display: none !important; }

    .center-tooltip, #guide-tooltip {
        top: auto !important;
        bottom: 56px !important;
        left: 50% !important;
        right: auto !important;
        transform: translateX(-50%) !important;
        width: max-content !important;
        max-width: 44vw !important;
        font-size: 10px !important;
        padding: 4px 9px !important;
        line-height: 1.3;
    }

    /* 가로 모드에서 각종 패널을 구석으로 모아 3D 화면을 가리지 않게 한다 */
    .side-panel { top: 44px !important; right: 8px !important; left: auto !important; width: 214px !important; padding: 7px 9px !important; gap: 4px !important; }
    .side-title { font-size: 10.5px !important; }
    .side-scale { font-size: 8.5px !important; }
    .meter-panel { left: 8px !important; bottom: 40px !important; top: auto !important; width: 190px !important; padding: 6px 8px !important; gap: 3px !important; }
    .meter-title { font-size: 9.5px !important; }
    .action-panel { top: auto !important; bottom: 40px !important; right: 8px !important; left: auto !important; grid-template-columns: repeat(2, 44px) !important; gap: 4px !important; }
    .side-btn { width: 44px !important; height: 44px !important; font-size: 8.5px !important; border-radius: 12px !important; gap: 1px !important; }
    .energy-panel { left: 8px !important; bottom: 40px !important; top: auto !important; width: 176px !important; padding: 6px 8px !important; gap: 4px !important; }
    .energy-title, .panel-note { font-size: 9px !important; line-height: 1.3 !important; }
    .info-panel { right: 8px !important; bottom: 40px !important; top: auto !important; min-width: 128px !important; padding: 6px 8px !important; gap: 2px !important; }
    .info-row { font-size: 9.5px !important; gap: 8px !important; }
    .view-panel { left: 8px !important; bottom: 40px !important; top: auto !important; padding: 6px 8px !important; }
    .phase-panel { left: 8px !important; bottom: 40px !important; top: auto !important; padding: 6px 8px !important; }
    .graph-panel { max-height: 40vh; width: 182px !important; }
    .legend, .panel-note { font-size: 9px !important; }

    .bottom-control-bar {
        left: 50% !important;
        right: auto !important;
        bottom: 4px !important;
        transform: translateX(-50%) !important;
        width: auto !important;
        max-width: calc(100vw - 12px);
        border-radius: 14px !important;
        padding: 4px 8px !important;
        gap: 3px !important;
    }
    .control-tab-btn {
        flex: 0 0 auto !important;
        min-width: 46px !important;
        padding: 3px 9px !important;
        font-size: 10px !important;
        gap: 3px !important;
        align-items: center !important;
        justify-content: center !important;
    }
    .control-tab-btn span:first-child { font-size: 13px !important; }

    .sub-panel {
        left: 50% !important;
        right: auto !important;
        bottom: 96px !important;
        transform: translateX(-50%) !important;
        width: min(400px, calc(100vw - 24px)) !important;
        max-width: min(400px, calc(100vw - 24px)) !important;
        max-height: 62vh;
        overflow-y: auto;
        padding: 9px 12px !important;
        gap: 6px !important;
    }
    .sub-panel .slider-row { gap: 3px !important; }
    .slider-header { font-size: 10.5px !important; }

    .modal-overlay { padding: 8px !important; }
    .modal-card {
        max-height: 94vh !important;
        overflow-y: auto !important;
        width: auto !important;
        max-width: min(460px, 96vw) !important;
        padding: 12px 14px !important;
    }
    .modal-title { font-size: 14px !important; }
    .modal-body { font-size: 11.5px !important; }
    .example-desc { font-size: 11px !important; line-height: 1.45 !important; }
}

/* ---------- 몰입(의사 전체화면) 모드 ---------- */
html.pseudo-fs .top-left-bar .tag-badge,
html.pseudo-fs .top-right-bar,
html.pseudo-fs .center-tooltip,
html.pseudo-fs #guide-tooltip { display: none !important; }
html.pseudo-fs .top-left-bar { right: 56px !important; }
html.pseudo-fs #fullscreenBtn,
html.pseudo-fs .bottom-right-bar { display: flex !important; }

/* ---------- 전체화면 시 캔버스 채움 ---------- */
body.is-fullscreen #canvas-container,
body.is-fullscreen #webgl-container { width: 100vw !important; height: 100vh !important; }

    <div class="top-left-bar">
        <a href="/index.html" class="glass-panel back-btn">
            <span>⬅</span> 메인
        </a>
        <div class="glass-panel tag-badge">
            <span>보일·샤를 법칙 3D</span>
            <span class="tag-pill">visionOS</span>
        </div>
    </div>

    <div class="top-right-bar">
        <div class="glass-panel data-card">
            <div class="data-item">
                <span class="data-label">압력</span>
                <span class="data-value" id="val-p" style="color:#ff3b30;">101.3 kPa</span>
            </div>
            <div class="data-item">
                <span class="data-label">부피</span>
                <span class="data-value" id="val-v" style="color:#007aff;">2.00 L</span>
            </div>
            <div class="data-item">
                <span class="data-label">온도</span>
                <span class="data-value" id="val-t" style="color:#ff9500;">300 K</span>
            </div>
        </div>
        <button class="icon-btn glass-panel" id="theme-toggle">🌙</button>
    </div>

    <div class="glass-panel center-tooltip" id="guide-tooltip">
        💡 피스톤을 움직이며 기체의 압력과 부피, 온도가 어떻게 변하는지 관찰하세요
    </div>

    <!-- 그래프 -->
    <div class="glass-panel graph-panel">
        <canvas id="graph-canvas" width="440" height="300"></canvas>
        <span class="graph-caption" id="graph-caption">보일 법칙 · 압력-부피 그래프</span>
    </div>

    <div class="glass-panel sub-panel" id="physics-panel">
        <div class="mode-row">
            <button class="mode-btn on" id="mode-boyle">🧪 보일 법칙</button>
            <button class="mode-btn" id="mode-charles">🔥 샤를 법칙</button>
        </div>
        <div class="slider-row" id="row-volume">
            <div class="slider-header">
                <span>기체의 부피</span>
                <span id="txt-volume">2.00 L</span>
            </div>
            <input type="range" id="sld-volume" min="1" max="4" step="0.05" value="2">
        </div>
        <div class="slider-row" id="row-temp" style="display:none;">
            <div class="slider-header">
                <span>기체의 온도</span>
                <span id="txt-temp">300 K</span>
            </div>
            <input type="range" id="sld-temp" min="150" max="600" step="5" value="300">
        </div>
        <div class="formula" id="formula-text">P × V = 일정 (온도 일정)</div>
        <div class="panel-note" id="mode-note">
            보일 법칙: 온도가 일정할 때 기체의 부피를 줄이면 압력이 커집니다. 부피를 절반으로 줄이면 압력은 2배가 됩니다.
        </div>
    </div>

    <div class="glass-panel bottom-control-bar">
        <button class="control-tab-btn" id="btn-toggle-physics">
            <span>⚙️</span>
            <span>설정 조절</span>
        </button>
        <button class="control-tab-btn" id="btn-record">
            <span>📌</span>
            <span>측정 기록</span>
        </button>
        <button class="control-tab-btn" id="btn-reset">
            <span>🔄</span>
            <span>초기화</span>
        </button>
        <button class="control-tab-btn" id="btn-view">
            <span>📷</span>
            <span id="view-text">비스듬 시점</span>
        </button>
    </div>

    <!-- Fullscreen / Windowed Mode Button -->
    <div class="bottom-right-bar">
        <button id="fullscreenBtn" class="glass-panel back-btn">
            <span id="fullscreenIcon">⛶</span>
            <span id="fullscreenText">전체화면</span>
        </button>
    </div>

    <script>
        // --- 1. 씬 설정 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf2f2f7);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(1.9, 3.5, 10.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.target.set(0, 2.05, 0);
        controls.maxPolarAngle = Math.PI / 2 + 0.03;
        controls.minDistance = 3;
        controls.maxDistance = 16;

        // --- 2. 조명 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
        dirLight.position.set(4, 7, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        const rimLight = new THREE.DirectionalLight(0xa8d0ff, 0.4);
        rimLight.position.set(-5, 3, -4);
        scene.add(rimLight);

        // --- 3. 바닥 ---
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(30, 30),
            new THREE.MeshStandardMaterial({ color: 0xe5e5ea, roughness: 0.9 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = 0;
        floor.receiveShadow = true;
        scene.add(floor);

        // --- 4. 실린더(기체 용기) ---
        const CYL_R = 0.85;
        const BASE_Y = 0.25;       // 기체가 시작되는 바닥 높이
        const VOL_PER_UNIT = 0.9;  // 1 L = 0.9 월드 단위 높이

        // 받침대
        const basePlate = new THREE.Mesh(
            new THREE.CylinderGeometry(CYL_R + 0.18, CYL_R + 0.24, 0.22, 48),
            new THREE.MeshStandardMaterial({ color: 0x2c3e50, metalness: 0.5, roughness: 0.35 })
        );
        basePlate.position.y = 0.11;
        basePlate.castShadow = true;
        basePlate.receiveShadow = true;
        scene.add(basePlate);

        // 유리관
        const tubeMat = new THREE.MeshPhysicalMaterial({
            color: 0xbfe3ff,
            transparent: true,
            opacity: 0.22,
            roughness: 0.08,
            metalness: 0.0,
            side: THREE.DoubleSide,
            depthWrite: false
        });
        const tube = new THREE.Mesh(new THREE.CylinderGeometry(CYL_R, CYL_R, 4.1, 64, 1, true), tubeMat);
        tube.position.y = 0.22 + 4.1 / 2;
        scene.add(tube);

        // 상단 테두리
        const rim = new THREE.Mesh(
            new THREE.TorusGeometry(CYL_R, 0.05, 16, 64),
            new THREE.MeshStandardMaterial({ color: 0x9aa6b6, metalness: 0.8, roughness: 0.25 })
        );
        rim.rotation.x = Math.PI / 2;
        rim.position.y = 0.22 + 4.1;
        scene.add(rim);

        // 용기 내부 바닥
        const innerFloor = new THREE.Mesh(
            new THREE.CircleGeometry(CYL_R, 64),
            new THREE.MeshStandardMaterial({ color: 0xdfe6ef, roughness: 0.6 })
        );
        innerFloor.rotation.x = -Math.PI / 2;
        innerFloor.position.y = BASE_Y;
        scene.add(innerFloor);

        // --- 5. 피스톤 ---
        const pistonGroup = new THREE.Group();
        const pistonHead = new THREE.Mesh(
            new THREE.CylinderGeometry(CYL_R - 0.02, CYL_R - 0.02, 0.09, 64),
            new THREE.MeshStandardMaterial({ color: 0x5b6779, metalness: 0.7, roughness: 0.25 })
        );
        pistonHead.castShadow = true;
        pistonGroup.add(pistonHead);

        const pistonRod = new THREE.Mesh(
            new THREE.CylinderGeometry(0.09, 0.09, 1.4, 32),
            new THREE.MeshStandardMaterial({ color: 0x8d99ab, metalness: 0.85, roughness: 0.2 })
        );
        pistonRod.position.y = 0.7;
        pistonGroup.add(pistonRod);

        const pistonHandle = new THREE.Mesh(
            new THREE.CylinderGeometry(0.3, 0.3, 0.08, 48),
            new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.4 })
        );
        pistonHandle.position.y = 1.45;
        pistonGroup.add(pistonHandle);

        scene.add(pistonGroup);

        /* 손가락으로 잡기 편하도록 피스톤 막대 둘레에 보이지 않는 집기 영역을 둔다 */
        const pistonGrab = new THREE.Mesh(
            new THREE.CylinderGeometry(0.42, 0.42, 1.8, 20),
            new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })
        );
        pistonGrab.position.y = 0.74;
        pistonGroup.add(pistonGrab);

        // --- 6. 기체 입자 ---
        const PARTICLE_COUNT = 220;
        const particleGeom = new THREE.BufferGeometry();
        const positions = new Float32Array(PARTICLE_COUNT * 3);
        const velocities = [];
        const pRadius = 0.02 + Math.random() * 0.01;

        function randomInside(r) {
            const a = Math.random() * Math.PI * 2;
            const rr = Math.sqrt(Math.random()) * r;
            return { x: Math.cos(a) * rr, z: Math.sin(a) * rr };
        }

        let V_L = 2.0;
        let T_K = 300;
        let P_KPA = 101.3;
        const N_MOL = 0.08;
        const R_GAS = 8.314;

        function pistonY() {
            return BASE_Y + V_L * VOL_PER_UNIT;
        }

        let pistonYNow = pistonY();

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const p = randomInside(CYL_R * 0.9);
            positions[i * 3] = p.x;
            positions[i * 3 + 1] = BASE_Y + 0.05 + Math.random() * (V_L * VOL_PER_UNIT - 0.1);
            positions[i * 3 + 2] = p.z;
            const v = new THREE.Vector3(
                (Math.random() - 0.5), (Math.random() - 0.5), (Math.random() - 0.5)
            ).normalize().multiplyScalar(0.8 + Math.random() * 0.7);
            velocities.push(v);
        }

        particleGeom.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        function makeParticleTexture() {
            const c = document.createElement('canvas');
            c.width = 64; c.height = 64;
            const ctx = c.getContext('2d');
            const g = ctx.createRadialGradient(32, 32, 2, 32, 32, 30);
            g.addColorStop(0, 'rgba(255,255,255,1)');
            g.addColorStop(0.45, 'rgba(255,255,255,0.75)');
            g.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(c);
        }

        const particleMat = new THREE.PointsMaterial({
            color: 0xff7b2e,
            size: 0.13,
            map: makeParticleTexture(),
            transparent: true,
            opacity: 1.0,
            depthWrite: false
        });
        const particles = new THREE.Points(particleGeom, particleMat);
        scene.add(particles);

        // 온도에 따른 입자 색 (차가우면 파랑, 뜨거우면 빨강)
        function particleColorForTemp(t) {
            // 150K(차가움·파랑) -> 350K(따뜻함·주황) -> 600K(뜨거움·빨강)
            const cold = new THREE.Color(0x5aa9ff);
            const warm = new THREE.Color(0xffb020);
            const hot = new THREE.Color(0xff3b30);
            if (t <= 350) {
                const k = Math.max(0, Math.min(1, (t - 150) / 200));
                return cold.clone().lerp(warm, k);
            }
            const k = Math.max(0, Math.min(1, (t - 350) / 250));
            return warm.clone().lerp(hot, k);
        }

        // --- 7. 압력계(눈금판) ---
        const gaugeGroup = new THREE.Group();
        const gaugeBody = new THREE.Mesh(
            new THREE.CylinderGeometry(0.42, 0.42, 0.08, 48),
            new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 })
        );
        gaugeBody.rotation.x = Math.PI / 2;
        gaugeGroup.add(gaugeBody);

        const gaugeRim = new THREE.Mesh(
            new THREE.TorusGeometry(0.42, 0.035, 12, 48),
            new THREE.MeshStandardMaterial({ color: 0x2c3e50, metalness: 0.6, roughness: 0.3 })
        );
        gaugeGroup.add(gaugeRim);

        const needle = new THREE.Mesh(
            new THREE.BoxGeometry(0.015, 0.3, 0.02),
            new THREE.MeshBasicMaterial({ color: 0xff3b30 })
        );
        needle.position.z = 0.06;
        needle.geometry.translate(0, 0.15, 0);
        gaugeGroup.add(needle);

        const gaugePin = new THREE.Mesh(
            new THREE.SphereGeometry(0.035, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0x1c1c1e })
        );
        gaugePin.position.z = 0.07;
        gaugeGroup.add(gaugePin);

        gaugeGroup.position.set(1.75, 2.3, 0.2);
        gaugeGroup.rotation.y = -0.35;
        scene.add(gaugeGroup);

        // 압력계 지지대
        const gaugePole = new THREE.Mesh(
            new THREE.CylinderGeometry(0.03, 0.03, 2.3, 16),
            new THREE.MeshStandardMaterial({ color: 0x9aa6b6, metalness: 0.7, roughness: 0.3 })
        );
        gaugePole.position.set(1.75, 1.15, 0.2);
        scene.add(gaugePole);

        // --- 8. 상태 및 계산 ---
        let mode = 'boyle';
        let records = [];

        function computeState() {
            if (mode === 'boyle') {
                T_K = 300;
                P_KPA = (N_MOL * R_GAS * T_K) / V_L;
            } else {
                P_KPA = 101.3;
                V_L = (N_MOL * R_GAS * T_K) / P_KPA;
            }
        }

        // --- 9. 그래프 ---
        const graphCanvas = document.getElementById('graph-canvas');
        const gctx = graphCanvas.getContext('2d');

        function drawGraph() {
            const W = graphCanvas.width, H = graphCanvas.height;
            const padL = 52, padR = 16, padT = 18, padB = 34;
            gctx.clearRect(0, 0, W, H);

            gctx.fillStyle = 'rgba(255,255,255,0.0)';
            gctx.fillRect(0, 0, W, H);

            const x0 = padL, y0 = H - padB, x1 = W - padR, y1 = padT;
            gctx.strokeStyle = 'rgba(120,130,150,0.45)';
            gctx.lineWidth = 1.5;

            // 축
            gctx.beginPath();
            gctx.moveTo(x0, y1);
            gctx.lineTo(x0, y0);
            gctx.lineTo(x1, y0);
            gctx.stroke();

            gctx.font = 'bold 15px "SeoulNamsan", sans-serif';
            gctx.fillStyle = '#8e8e93';
            gctx.textAlign = 'center';
            gctx.textBaseline = 'top';

            if (mode === 'boyle') {
                const vMax = 4.6, pMax = 260;
                const X = v => x0 + (v / vMax) * (x1 - x0);
                const Y = p => y0 - (p / pMax) * (y0 - y1);

                // 눈금
                for (let v = 1; v <= 4; v++) {
                    gctx.strokeStyle = 'rgba(140,150,170,0.18)';
                    gctx.beginPath();
                    gctx.moveTo(X(v), y0);
                    gctx.lineTo(X(v), y1);
                    gctx.stroke();
                    gctx.fillStyle = '#8e8e93';
                    gctx.fillText(v + '', X(v), y0 + 6);
                }
                for (let p = 50; p <= 250; p += 50) {
                    gctx.strokeStyle = 'rgba(140,150,170,0.18)';
                    gctx.beginPath();
                    gctx.moveTo(x0, Y(p));
                    gctx.lineTo(x1, Y(p));
                    gctx.stroke();
                    gctx.textAlign = 'right';
                    gctx.textBaseline = 'middle';
                    gctx.fillStyle = '#8e8e93';
                    gctx.fillText(p + '', x0 - 8, Y(p));
                    gctx.textAlign = 'center';
                    gctx.textBaseline = 'top';
                }

                // 이론 곡선 P = nRT/V (T = 300K)
                gctx.beginPath();
                for (let v = 0.9; v <= 4.6; v += 0.02) {
                    const p = (N_MOL * R_GAS * 300) / v;
                    if (p > pMax) continue;
                    const px = X(v), py = Y(p);
                    if (v === 0.9) gctx.moveTo(px, py); else gctx.lineTo(px, py);
                }
                gctx.strokeStyle = 'rgba(0,122,255,0.7)';
                gctx.lineWidth = 3;
                gctx.stroke();

                // 기록 점
                records.forEach(r => {
                    gctx.beginPath();
                    gctx.arc(X(r.v), Y(r.p), 5, 0, Math.PI * 2);
                    gctx.fillStyle = '#34c759';
                    gctx.fill();
                });

                // 현재 점
                gctx.beginPath();
                gctx.arc(X(V_L), Y(P_KPA), 8, 0, Math.PI * 2);
                gctx.fillStyle = '#ff3b30';
                gctx.fill();
                gctx.strokeStyle = '#fff';
                gctx.lineWidth = 2;
                gctx.stroke();

                gctx.fillStyle = '#8e8e93';
                gctx.font = 'bold 15px "SeoulNamsan", sans-serif';
                gctx.textAlign = 'left';
                gctx.fillText('부피 (L)', x1 - 74, y0 + 6);
                gctx.save();
                gctx.translate(16, y1 + 6);
                gctx.fillText('압력', 0, 0);
                gctx.restore();
            } else {
                const tMax = 680, vMax = 4.6;
                const X = t => x0 + (t / tMax) * (x1 - x0);
                const Y = v => y0 - (v / vMax) * (y0 - y1);

                for (let t = 150; t <= 600; t += 150) {
                    gctx.strokeStyle = 'rgba(140,150,170,0.18)';
                    gctx.beginPath();
                    gctx.moveTo(X(t), y0);
                    gctx.lineTo(X(t), y1);
                    gctx.stroke();
                    gctx.fillStyle = '#8e8e93';
                    gctx.textAlign = 'center';
                    gctx.textBaseline = 'top';
                    gctx.fillText(t + '', X(t), y0 + 6);
                }
                for (let v = 1; v <= 4; v++) {
                    gctx.strokeStyle = 'rgba(140,150,170,0.18)';
                    gctx.beginPath();
                    gctx.moveTo(x0, Y(v));
                    gctx.lineTo(x1, Y(v));
                    gctx.stroke();
                    gctx.textAlign = 'right';
                    gctx.textBaseline = 'middle';
                    gctx.fillStyle = '#8e8e93';
                    gctx.fillText(v + '', x0 - 8, Y(v));
                }

                // 이론 직선 V = nRT/P (원점 통과)
                gctx.beginPath();
                gctx.moveTo(X(0), Y(0));
                gctx.lineTo(X(tMax), Y((N_MOL * R_GAS * tMax) / 101.3));
                gctx.strokeStyle = 'rgba(0,122,255,0.7)';
                gctx.lineWidth = 3;
                gctx.stroke();

                records.forEach(r => {
                    gctx.beginPath();
                    gctx.arc(X(r.t), Y(r.v), 5, 0, Math.PI * 2);
                    gctx.fillStyle = '#34c759';
                    gctx.fill();
                });

                gctx.beginPath();
                gctx.arc(X(T_K), Y(V_L), 8, 0, Math.PI * 2);
                gctx.fillStyle = '#ff3b30';
                gctx.fill();
                gctx.strokeStyle = '#fff';
                gctx.lineWidth = 2;
                gctx.stroke();

                gctx.fillStyle = '#8e8e93';
                gctx.font = 'bold 15px "SeoulNamsan", sans-serif';
                gctx.textAlign = 'left';
                gctx.fillText('온도 (K)', x1 - 74, y0 + 6);
                gctx.fillText('부피 (L)', 12, y1 + 2);
            }
        }

        // --- 10. UI 갱신 ---
        function updateUI() {
            document.getElementById('val-p').innerText = P_KPA.toFixed(1) + ' kPa';
            document.getElementById('val-v').innerText = V_L.toFixed(2) + ' L';
            document.getElementById('val-t').innerText = T_K.toFixed(0) + ' K';
            document.getElementById('txt-volume').innerText = V_L.toFixed(2) + ' L';
            document.getElementById('txt-temp').innerText = T_K.toFixed(0) + ' K';
            document.getElementById('graph-caption').innerText = mode === 'boyle'
                ? '보일 법칙 · 압력-부피 그래프'
                : '샤를 법칙 · 부피-온도 그래프';

            // 압력계 바늘 (-130° ~ +130°)
            const pNorm = Math.max(0, Math.min(1, P_KPA / 250));
            needle.rotation.z = Math.PI * 0.72 - pNorm * Math.PI * 1.44;

            // 온도에 따른 입자 색
            particleMat.color.copy(particleColorForTemp(T_K));

            drawGraph();
        }

        function syncSliders() {
            if (mode === 'boyle') {
                document.getElementById('sld-volume').value = V_L;
            } else {
                document.getElementById('sld-temp').value = T_K;
            }
        }

        // --- 11. 모드 전환 ---
        function setMode(m) {
            mode = m;
            computeState();
            syncSliders();
            document.getElementById('mode-boyle').classList.toggle('on', m === 'boyle');
            document.getElementById('mode-charles').classList.toggle('on', m === 'charles');
            document.getElementById('row-volume').style.display = m === 'boyle' ? 'flex' : 'none';
            document.getElementById('row-temp').style.display = m === 'charles' ? 'flex' : 'none';
            document.getElementById('formula-text').innerText = m === 'boyle'
                ? 'P × V = 일정 (온도 일정)'
                : 'V ÷ T = 일정 (압력 일정)';
            document.getElementById('mode-note').innerText = m === 'boyle'
                ? '보일 법칙: 온도가 일정할 때 기체의 부피를 줄이면 압력이 커집니다. 부피를 절반으로 줄이면 압력은 2배가 됩니다.'
                : '샤를 법칙: 압력이 일정할 때 기체의 온도를 높이면 부피가 비례해서 커집니다. 온도를 2배로 하면 부피도 2배가 됩니다.';
            document.getElementById('guide-tooltip').innerText = m === 'boyle'
                ? '💡 피스톤을 직접 위아래로 드래그하거나 슬라이더로 부피를 바꿔 보세요'
                : '💡 피스톤을 위로 끌어올리면 온도가 올라가 부피가 늘어납니다';
            records = [];
            updateUI();
        }

        document.getElementById('mode-boyle').addEventListener('click', () => setMode('boyle'));
        document.getElementById('mode-charles').addEventListener('click', () => setMode('charles'));

        const btnTogglePhysics = document.getElementById('btn-toggle-physics');
        const physicsPanel = document.getElementById('physics-panel');
        btnTogglePhysics.addEventListener('click', () => {
            physicsPanel.classList.toggle('show');
            btnTogglePhysics.classList.toggle('active');
        });

        document.getElementById('sld-volume').addEventListener('input', (e) => {
            V_L = parseFloat(e.target.value);
            computeState();
            updateUI();
        });

        document.getElementById('sld-temp').addEventListener('input', (e) => {
            T_K = parseFloat(e.target.value);
            computeState();
            updateUI();
        });

        document.getElementById('btn-record').addEventListener('click', () => {
            if (mode === 'boyle') records.push({ v: V_L, p: P_KPA });
            else records.push({ t: T_K, v: V_L });
            if (records.length > 24) records.shift();
            drawGraph();
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            V_L = 2.0;
            T_K = 300;
            records = [];
            setMode(mode);
            camera.position.set(1.9, 3.5, 10.2);
            controls.target.set(0, 2.05, 0);
        });

        let obliqueView = true;
        document.getElementById('btn-view').addEventListener('click', () => {
            obliqueView = !obliqueView;
            if (obliqueView) {
                camera.position.set(1.9, 3.5, 10.2);
                document.getElementById('view-text').innerText = '비스듬 시점';
            } else {
                camera.position.set(0, 2.3, 9.4);
                document.getElementById('view-text').innerText = '정면 시점';
            }
            controls.target.set(0, 2.05, 0);
        });

        document.getElementById('theme-toggle').addEventListener('click', (e) => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            e.currentTarget.innerText = isDark ? '☀️' : '🌙';
            scene.background.setHex(isDark ? 0x121212 : 0xf2f2f7);
            floor.material.color.setHex(isDark ? 0x1c1c1e : 0xe5e5ea);
            innerFloor.material.color.setHex(isDark ? 0x2a2f3a : 0xdfe6ef);
        });

        /* --- 피스톤 직접 드래그 (마우스·터치) : 위아래로 끌어 압력 변화 --- */
        const dragRaycaster = new THREE.Raycaster();
        const dragPointer = new THREE.Vector2();
        let pistonDragging = false, dragStartClientY = 0, dragStartV = 2;
        const VOL_MIN = 1, VOL_MAX = 4, T_MIN = 150, T_MAX = 600;

        function setDragPointer(e) {
            const r = renderer.domElement.getBoundingClientRect();
            dragPointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
            dragPointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
            dragRaycaster.setFromCamera(dragPointer, camera);
        }
        function pistonHit(e) {
            setDragPointer(e);
            return dragRaycaster.intersectObjects([pistonGrab, pistonHead, pistonRod, pistonHandle], false).length > 0;
        }
        const _pp1 = new THREE.Vector3(), _pp2 = new THREE.Vector3();
        function pxPerWorld() {
            _pp1.set(0, pistonYNow, 0).project(camera);
            _pp2.set(0, pistonYNow + 1, 0).project(camera);
            const px = Math.abs(_pp2.y - _pp1.y) * window.innerHeight / 2;
            return px > 4 ? px : 60;
        }
        function applyPistonVolume(v) {
            v = Math.max(VOL_MIN, Math.min(VOL_MAX, v));
            if (mode === 'boyle') {
                V_L = v;
            } else {
                // 샤를 법칙: 압력이 일정하므로 부피 변화는 곧 온도 변화
                T_K = Math.max(T_MIN, Math.min(T_MAX, v * (101.3 / (N_MOL * R_GAS))));
            }
            computeState();
            syncSliders();
            updateUI();
        }
        const dragEl = renderer.domElement;
        dragEl.addEventListener('pointerdown', (e) => {
            if (e.pointerType === 'mouse' && e.button !== 0) return;
            if (!pistonHit(e)) return;
            pistonDragging = true;
            dragStartClientY = e.clientY;
            dragStartV = (mode === 'boyle') ? V_L : (T_K * N_MOL * R_GAS / 101.3);
            controls.enabled = false;
            try { dragEl.setPointerCapture(e.pointerId); } catch (err) {}
            dragEl.style.cursor = 'grabbing';
            pistonHead.material.emissive.setHex(0x1e4e8c);
            e.preventDefault();
        }, { passive: false });
        dragEl.addEventListener('pointermove', (e) => {
            if (!pistonDragging) {
                dragEl.style.cursor = pistonHit(e) ? 'grab' : 'default';
                return;
            }
            const dv = -((e.clientY - dragStartClientY) / pxPerWorld()) / VOL_PER_UNIT;
            applyPistonVolume(dragStartV + dv);
            e.preventDefault();
        }, { passive: false });
        function endPistonDrag(e) {
            if (!pistonDragging) return;
            pistonDragging = false;
            controls.enabled = true;
            dragEl.style.cursor = 'default';
            pistonHead.material.emissive.setHex(0x000000);
            try { dragEl.releasePointerCapture(e.pointerId); } catch (err) {}
        }
        dragEl.addEventListener('pointerup', endPistonDrag);
        dragEl.addEventListener('pointercancel', endPistonDrag);
        dragEl.addEventListener('pointerleave', () => { if (!pistonDragging) dragEl.style.cursor = 'default'; });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 12. 시뮬레이션 루프 ---
        const posAttr = particleGeom.attributes.position;
        const clock = new THREE.Clock();

        function simulateParticles(dt) {
            const topY = pistonYNow - 0.07;
            const span = Math.max(0.15, topY - BASE_Y);
            const speedScale = Math.sqrt(T_K / 300) * 1.35;

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const idx = i * 3;
                let x = posAttr.array[idx];
                let y = posAttr.array[idx + 1];
                let z = posAttr.array[idx + 2];
                const v = velocities[i];

                x += v.x * speedScale * dt;
                y += v.y * speedScale * dt;
                z += v.z * speedScale * dt;

                // 벽 반사
                const rr = Math.hypot(x, z);
                if (rr > CYL_R - 0.03) {
                    const nx = x / (rr || 1), nz = z / (rr || 1);
                    const dot = v.x * nx + v.z * nz;
                    v.x -= 2 * dot * nx;
                    v.z -= 2 * dot * nz;
                    x = nx * (CYL_R - 0.035);
                    z = nz * (CYL_R - 0.035);
                }

                // 바닥 반사
                if (y < BASE_Y + 0.03) {
                    y = BASE_Y + 0.03;
                    v.y = Math.abs(v.y);
                }
                // 피스톤 반사
                if (y > topY) {
                    y = topY;
                    v.y = -Math.abs(v.y);
                }

                posAttr.array[idx] = x;
                posAttr.array[idx + 1] = y;
                posAttr.array[idx + 2] = z;
            }
            posAttr.needsUpdate = true;
            particleMat.size = 0.09 + Math.min(0.04, span * 0.006);
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.04);

            // 피스톤 부드럽게 이동
            const target = pistonY() - 0.02;
            pistonYNow += (target - pistonYNow) * Math.min(1, dt * 9);
            pistonGroup.position.y = pistonYNow;

            simulateParticles(dt);
            controls.update();
            renderer.render(scene, camera);
        }

        // 초기 상태
        pistonGroup.position.y = pistonY();
        pistonYNow = pistonY();
        setMode('boyle');
        animate();

        /* ---------- Fullscreen / Windowed Mode Logic ---------- */
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const fullscreenIcon = document.getElementById('fullscreenIcon');
        const fullscreenText = document.getElementById('fullscreenText');

        function updateFullscreenUI() {
            const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
            if (fullscreenIcon) fullscreenIcon.innerText = isFS ? '🗗' : '⛶';
            if (fullscreenText) fullscreenText.innerText = isFS ? '창모드' : '전체화면';
        }

        if (fullscreenBtn) {
            fullscreenBtn.addEventListener('click', () => {
                try {
                    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                        const req = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
                        if (req) req.call(document.documentElement);
                    } else {
                        const exit = document.exitFullscreen || document.webkitExitFullscreen;
                        if (exit) exit.call(document);
                    }
                } catch (err) {
                    console.error('전체화면 모드를 전환할 수 없습니다:', err);
                }
            });
        }

        document.addEventListener('fullscreenchange', updateFullscreenUI);
        document.addEventListener('webkitfullscreenchange', updateFullscreenUI);
    </script>

<script>
/* ============ 모바일 화면 재조정 + 전체화면 대체 동작 (자동 생성) ============ */
(function () {
    var docEl = document.documentElement;
    var btn = document.getElementById('fullscreenBtn');
    var icon = document.getElementById('fullscreenIcon');
    var text = document.getElementById('fullscreenText');

    function realFs() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement ||
                  document.mozFullScreenElement || document.msFullscreenElement);
    }
    function pseudo() { return docEl.classList.contains('pseudo-fs'); }
    function setUI() {
        var on = realFs() || pseudo();
        if (icon) icon.textContent = on ? '🗗' : '⛶';
        if (text) text.textContent = on ? '창모드' : '전체화면';
        if (btn) btn.setAttribute('aria-label', on ? '창모드로 전환' : '전체화면으로 전환');
        document.body.classList.toggle('is-fullscreen', on);
    }
    function toast(msg) {
        var t = document.getElementById('ux-toast');
        if (!t) {
            t = document.createElement('div');
            t.id = 'ux-toast';
            t.style.cssText = 'position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);' +
                'background:rgba(28,28,30,.88);color:#fff;font-size:12px;line-height:1.4;padding:9px 14px;border-radius:14px;' +
                'z-index:9999;max-width:86vw;text-align:center;pointer-events:none;transition:opacity .3s;' +
                'font-family:inherit;box-shadow:0 8px 24px rgba(0,0,0,.25)';
            document.body.appendChild(t);
        }
        t.textContent = msg;
        t.style.opacity = '1';
        clearTimeout(t._t);
        t._t = setTimeout(function () { t.style.opacity = '0'; }, 2600);
    }

    if (btn) {
        btn.addEventListener('click', function () {
            var wasReal = realFs();
            var wasPseudo = pseudo();
            setTimeout(function () {
                if (wasReal) { setUI(); return; }          // 진짜 전체화면에서 나온 경우
                if (wasPseudo) { docEl.classList.remove('pseudo-fs'); setUI(); return; }  // 몰입 모드 해제
                if (!realFs()) {                            // 전체화면 API가 동작하지 않는 환경
                    docEl.classList.add('pseudo-fs');
                    try { window.scrollTo(0, 1); } catch (e) {}
                    toast('이 브라우저는 전체화면을 지원하지 않아 상단 정보를 숨긴 몰입 모드로 표시합니다');
                }
                setUI();
            }, 380);
        }, false);
    }
    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
        document.addEventListener(ev, setUI);
    });

    /* 좁은 화면에서는 3D 장면이 잘리지 않도록 시야각을 넓혀 전체가 들어오게 한다 */
    function mobileFit() {
        try {
            if (typeof camera === 'undefined' || !camera || !camera.isPerspectiveCamera) return;
            if (!camera.userData) camera.userData = {};
            if (!camera.userData.baseFov) camera.userData.baseFov = camera.fov;
            var w = window.innerWidth, h = window.innerHeight, f = 1;
            var k = 0.62;
            var attr = document.documentElement.getAttribute('data-mzoom');
            if (attr) { var v = parseFloat(attr); if (!isNaN(v) && v > 0) k = v; }
            if (w < h) f = 1 + (1 - w / h) * k;
            else if (h <= 500) f = 1 + k * 0.16;
            camera.fov = Math.min(88, camera.userData.baseFov * f);
            camera.updateProjectionMatrix();
        } catch (e) {}
    }
    mobileFit();

    /* 화면 회전·주소창 변화·전체화면 전환 후 렌더러 크기 재계산 */
    var rt = null;
    function refit() {
        clearTimeout(rt);
        rt = setTimeout(function () {
            mobileFit();
            try { window.dispatchEvent(new Event('resize')); } catch (e) {}
        }, 240);
    }
    window.addEventListener('orientationchange', refit);
    window.addEventListener('pageshow', refit);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) refit(); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', refit);

    setUI();
})();
</script>
