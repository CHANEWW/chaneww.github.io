<!DOCTYPE html>
<html lang="ko" data-mzoom="0.62">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>이슬점과 상대습도 3D</title>
<meta name="description" content="얼음을 넣어 이슬점을 찾고 건습구 습도계로 상대습도를 구하는 3D 실험">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="preload" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff" as="font" type="font/woff" crossorigin>
<script src="../../common/lib/three.min.js"></script>
<script src="../../common/lib/OrbitControls.js"></script>
<style>

@font-face {
    font-family: 'SeoulNamsan';
    src: local('SeoulNamsan M'), local('SeoulNamsanM'), local('서울남산체 M'),
         url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff') format('woff');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    font-family: 'SeoulNamsan', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background-color: #eef2f8; color: #1c1c1e;
    transition: background-color 0.35s ease, color 0.35s ease;
    -webkit-user-select: none; user-select: none;
}
#canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
#canvas-container canvas { display: block; touch-action: none; }

/* ---------- visionOS 글래스모피즘 ---------- */
.glass-panel {
    background: rgba(255, 255, 255, 0.78);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.85);
    box-shadow: 0 8px 32px rgba(15, 23, 42, 0.08);
    border-radius: 18px;
    transition: background 0.3s ease, border-color 0.3s ease;
}

/* ---------- 상단 좌측 ---------- */
.top-left-bar { position: absolute; top: 16px; left: 20px; display: flex; align-items: center; gap: 10px; z-index: 10; }
.back-btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 9px 15px; border-radius: 999px;
    text-decoration: none; color: #1c1c1e; font-weight: bold; font-size: 13.5px; cursor: pointer;
    transition: transform 0.2s ease, background 0.2s ease; border: none; font-family: inherit; white-space: nowrap;
}
.back-btn:hover { transform: translateY(-1px); background: rgba(255, 255, 255, 0.95); }
.tag-badge { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; font-weight: bold; font-size: 14px; white-space: nowrap; }
.tag-pill { background: rgba(0, 122, 255, 0.14); color: #007aff; font-size: 10px; padding: 2px 7px; border-radius: 999px; font-weight: 800; letter-spacing: 0.2px; }
.qr-btn-icon { font-size: 14px; line-height: 1; }
.qr-btn-label { font-size: 12.5px; }

/* ---------- 상단 우측 ---------- */
.top-right-bar { position: absolute; top: 16px; right: 20px; display: flex; align-items: center; gap: 10px; z-index: 10; }
.tr-util { display: flex; align-items: center; gap: 8px; }
.icon-btn {
    width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center;
    border-radius: 50%; cursor: pointer; font-size: 16px; padding: 0; line-height: 1; flex: 0 0 40px;
    border: none; color: #1c1c1e; font-family: inherit; transition: all 0.2s ease;
}
.icon-btn:hover { transform: translateY(-1px); background: rgba(255, 255, 255, 0.95); }
.data-card { display: inline-flex; align-items: center; gap: 14px; padding: 7px 16px; border-radius: 16px; }
.data-item { display: flex; flex-direction: column; align-items: center; line-height: 1.15; }
.data-label { font-size: 9.5px; color: #64748b; font-weight: bold; letter-spacing: -0.2px; white-space: nowrap; }
.data-value { font-size: 13.5px; font-weight: 900; color: #0284c7; margin-top: 1px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.data-sep { width: 1px; height: 22px; background: rgba(0, 0, 0, 0.08); }

/* ---------- 중앙 힌트 ---------- */
.center-tooltip {
    position: absolute; top: 84px; left: 46%; transform: translateX(-50%);
    padding: 8px 18px; border-radius: 16px; font-size: 11.5px; font-weight: bold; color: #334155;
    pointer-events: none; z-index: 10; white-space: normal; text-align: center; line-height: 1.5;
    letter-spacing: -0.2px; transition: opacity 0.35s ease; max-width: min(700px, calc(100vw - 460px)); word-break: keep-all;
}
.center-tooltip.hidden { opacity: 0; }

/* ---------- 하단 중앙 ---------- */
.bottom-ctrl-bar {
    position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; z-index: 40;
}
.action-btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 999px;
    border: 1px solid rgba(0, 0, 0, 0.08); background: rgba(255, 255, 255, 0.92); color: #1c1c1e;
    font-family: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; white-space: nowrap;
    transition: all 0.2s ease; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
}
.action-btn:hover { background: #fff; transform: translateY(-1px); }
.action-btn.on { background: #0f172a; color: #fff; border-color: #0f172a; }

/* ---------- 우측 하단 전체화면 ---------- */
.bottom-right-bar { position: absolute; bottom: 22px; right: 20px; z-index: 45; }
.fullscreen-btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 999px;
    border: none; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 800; color: #1c1c1e; white-space: nowrap;
}

/* ---------- 우측 조절 패널 ---------- */
.side-ctrl-panel {
    position: absolute; right: 20px; bottom: 76px; width: 232px; padding: 12px;
    display: flex; flex-direction: column; gap: 8px; z-index: 60; border-radius: 18px;
    max-height: calc(100vh - 150px);
}
.panel-title {
    font-size: 12px; font-weight: 800; color: #475569; letter-spacing: -0.2px; text-align: center;
    padding-bottom: 6px; border-bottom: 1px solid rgba(0, 0, 0, 0.06); flex: 0 0 auto;
}
.panel-body { display: flex; flex-direction: column; gap: 7px; overflow-y: auto; min-height: 0; -webkit-overflow-scrolling: touch; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.seg.three { grid-template-columns: repeat(3, 1fr); }
.seg.four { grid-template-columns: repeat(4, 1fr); }
.seg-btn {
    padding: 8px 1px; border-radius: 12px; border: 1px solid rgba(0, 0, 0, 0.08);
    background: rgba(255, 255, 255, 0.9); color: #334155; font-family: inherit; font-size: 10.5px;
    font-weight: 800; cursor: pointer; white-space: nowrap; letter-spacing: -0.3px; transition: all 0.2s ease;
}
.seg-btn:hover { background: #ffffff; }
.seg-btn.active { background: #0f172a; border-color: #0f172a; color: #ffffff; }
.seg-btn.accent.active { background: #0ea5e9; border-color: #0ea5e9; }
.btn-start {
    width: 100%; padding: 11px 8px; border-radius: 14px; border: none;
    background: linear-gradient(135deg, #0ea5e9, #2563eb); color: #ffffff; font-family: inherit;
    font-size: 12.5px; font-weight: 900; letter-spacing: -0.2px; cursor: pointer;
    box-shadow: 0 5px 16px rgba(37, 99, 235, 0.28); transition: all 0.2s ease; white-space: nowrap;
}
.btn-start:hover { transform: translateY(-1px); }
.btn-start.on { background: linear-gradient(135deg, #22c55e, #0d9488); box-shadow: 0 5px 16px rgba(13, 148, 136, 0.26); }
.btn-start.off { background: linear-gradient(135deg, #94a3b8, #64748b); box-shadow: 0 5px 16px rgba(100, 116, 139, 0.24); }
.btn-ghost {
    width: 100%; padding: 9px 8px; border-radius: 12px; border: 1px dashed rgba(37, 99, 235, 0.35);
    background: rgba(37, 99, 235, 0.07); color: #1d4ed8; font-family: inherit; font-size: 11.5px;
    font-weight: 800; cursor: pointer; white-space: nowrap; transition: all 0.2s ease; letter-spacing: -0.3px;
}
.btn-ghost:hover { background: rgba(37, 99, 235, 0.14); }
.ctrl-row { display: flex; align-items: center; gap: 4px; }
.ctrl-row .lbl { flex: 0 0 30px; font-size: 9.5px; font-weight: 800; color: #64748b; letter-spacing: -0.3px; white-space: nowrap; }
.mini {
    flex: 1 1 0; min-width: 0; padding: 6px 0; border-radius: 9px; border: 1px solid rgba(0, 0, 0, 0.08);
    background: rgba(255, 255, 255, 0.9); color: #334155; font-family: inherit; font-size: 10.5px;
    font-weight: 800; cursor: pointer; white-space: nowrap; transition: all 0.18s ease;
}
.mini:hover { background: #ffffff; }
.mini.active { background: #0f172a; border-color: #0f172a; color: #ffffff; }
.slider-row { display: flex; flex-direction: column; gap: 3px; }
.slider-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.slider-name { font-size: 10px; font-weight: 800; color: #64748b; letter-spacing: -0.3px; white-space: nowrap; }
.slider-val { font-size: 10.5px; font-weight: 900; color: #2563eb; font-variant-numeric: tabular-nums; white-space: nowrap; }
input[type="range"].ctrl-slider {
    -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 999px;
    background: #e2e8f0; outline: none; cursor: pointer; margin: 0;
}
input[type="range"].ctrl-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: #3b82f6; cursor: pointer; box-shadow: 0 2px 6px rgba(59, 130, 246, 0.4); border: 2px solid #fff;
}
input[type="range"].ctrl-slider::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%; background: #3b82f6; border: 2px solid #fff; cursor: pointer;
}
.state-badge {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    padding: 7px 8px; border-radius: 12px; background: rgba(2, 132, 199, 0.09);
    border: 1px dashed rgba(2, 132, 199, 0.28); font-size: 10.5px; font-weight: 800; color: #0369a1;
    letter-spacing: -0.3px; text-align: center; overflow: hidden;
}
.state-badge .sb-note { font-size: 8.5px; font-weight: 700; opacity: 0.82; white-space: nowrap; }
.state-badge.good { background: rgba(22, 163, 74, 0.11); border-color: rgba(22, 163, 74, 0.32); color: #15803d; }
.state-badge.warn { background: rgba(234, 88, 12, 0.11); border-color: rgba(234, 88, 12, 0.32); color: #c2410c; }

/* ---------- 좌측 데이터/그래프 패널 ---------- */
.sub-panel {
    position: absolute; right: 264px; bottom: 76px; width: 340px; max-height: 78vh; overflow-y: auto;
    display: none; flex-direction: column; gap: 10px; padding: 13px 15px; border-radius: 18px; z-index: 55;
    -webkit-overflow-scrolling: touch;
}
.sub-panel.show { display: flex; }
@media (min-width: 901px) {
    body .sub-panel.left { left: 20px !important; right: auto !important; top: auto !important; bottom: 76px !important; width: 318px !important; max-width: 318px !important; max-height: 62vh !important; }
}
.sub-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-bottom: 5px; border-bottom: 1px solid rgba(0, 0, 0, 0.06); }
.sub-panel-title { font-size: 12.5px; font-weight: 800; color: #1e293b; letter-spacing: -0.3px; }
.sub-close { background: rgba(0, 0, 0, 0.06); border: none; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; font-size: 11px; font-weight: bold; color: #64748b; font-family: inherit; flex: 0 0 24px; }
.graph-canvas { width: 100%; height: 178px; display: block; border-radius: 12px; background: rgba(248, 250, 252, 0.9); }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 9.5px; font-weight: 800; color: #64748b; }
.legend i { display: inline-block; width: 14px; height: 8px; border-radius: 3px; margin-right: 4px; vertical-align: middle; }
.note { font-size: 9.5px; color: #7c8899; line-height: 1.45; letter-spacing: -0.2px; }

/* ---------- 통계 막대 ---------- */
.stat-block { display: flex; flex-direction: column; gap: 5px; }
.stat-title { font-size: 10.5px; font-weight: 900; color: #334155; letter-spacing: -0.3px; display: flex; justify-content: space-between; align-items: center; }
.stat-title b { color: #2563eb; font-variant-numeric: tabular-nums; }
.stat-row { display: grid; grid-template-columns: 62px 1fr 54px; align-items: center; gap: 6px; font-size: 9.5px; font-weight: 800; color: #475569; }
.stat-row .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat-row .bar { height: 9px; border-radius: 999px; background: rgba(148, 163, 184, 0.22); overflow: hidden; }
.stat-row .bar i { display: block; height: 100%; width: 0%; border-radius: 999px; transition: width 0.35s ease; }
.stat-row .vl { text-align: right; font-variant-numeric: tabular-nums; color: #0f172a; }
.mini-table { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 8px; }
.mini-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 9.5px; font-weight: 800; color: #475569; padding: 2px 0; border-bottom: 1px dashed rgba(148, 163, 184, 0.3); }
.mini-row .vl { font-variant-numeric: tabular-nums; color: #0f172a; }
.hr { height: 1px; background: rgba(0, 0, 0, 0.07); margin: 1px 0; }

/* ---------- 다크 모드 ---------- */
body.dark-mode { background-color: #0b1220; color: #e2e8f0; }
body.dark-mode .glass-panel { background-color: rgba(22, 30, 45, 0.92); border-color: rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45); }
body.dark-mode .sub-panel, body.dark-mode .side-ctrl-panel { background-color: rgba(22, 30, 45, 0.94); }
body.dark-mode .back-btn, body.dark-mode .tag-badge, body.dark-mode .icon-btn { color: #e2e8f0; }
body.dark-mode .data-label { color: #94a3b8; }
body.dark-mode .data-value { color: #38bdf8; }
body.dark-mode .data-sep { background: rgba(255, 255, 255, 0.12); }
body.dark-mode .panel-title { color: #94a3b8; border-bottom-color: rgba(255, 255, 255, 0.1); }
body.dark-mode .seg-btn, body.dark-mode .mini { background: rgba(44, 54, 74, 0.92); border-color: rgba(255, 255, 255, 0.1); color: #cbd5e1; }
body.dark-mode .seg-btn.active { background: #e2e8f0; border-color: #e2e8f0; color: #0f172a; }
body.dark-mode .seg-btn.accent.active { background: #0a84ff; border-color: #0a84ff; color: #fff; }
body.dark-mode .mini.active { background: #e2e8f0; color: #0f172a; border-color: #e2e8f0; }
body.dark-mode .state-badge { background: rgba(56, 189, 248, 0.14); color: #7dd3fc; border-color: rgba(56, 189, 248, 0.3); }
body.dark-mode .state-badge.good { background: rgba(34, 197, 94, 0.16); color: #86efac; border-color: rgba(34, 197, 94, 0.34); }
body.dark-mode .state-badge.warn { background: rgba(251, 146, 60, 0.16); color: #fdba74; border-color: rgba(251, 146, 60, 0.34); }
body.dark-mode .action-btn, body.dark-mode .fullscreen-btn { background: rgba(44, 54, 74, 0.92); color: #e2e8f0; border-color: rgba(255, 255, 255, 0.1); }
body.dark-mode .action-btn.on { background: #e2e8f0; color: #0f172a; }
body.dark-mode .sub-panel-title { color: #f1f5f9; }
body.dark-mode .sub-close { background: rgba(255, 255, 255, 0.12); color: #cbd5e1; }
body.dark-mode .graph-canvas { background: rgba(15, 23, 42, 0.9); }
body.dark-mode .legend, body.dark-mode .note { color: #94a3b8; }
body.dark-mode .center-tooltip { color: #cbd5e1; }
body.dark-mode .stat-title, body.dark-mode .stat-row { color: #cbd5e1; }
body.dark-mode .stat-row .vl, body.dark-mode .mini-row .vl { color: #f1f5f9; }
body.dark-mode .mini-row { color: #cbd5e1; border-bottom-color: rgba(148, 163, 184, 0.22); }
body.dark-mode input[type="range"].ctrl-slider { background: #334155; }

/* ============================================================
   모바일 반응형 보정 (세로/가로) — 공통 블록
   ============================================================ */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
img, canvas { max-width: 100%; }

@media (max-width: 900px) {
    .top-left-bar { top: max(8px, env(safe-area-inset-top)) !important; left: 8px !important; right: 56px !important; gap: 6px !important; flex-wrap: nowrap !important; align-items: center !important; overflow: hidden; }
    .top-left-bar .back-btn, .top-left-bar > a { flex: 0 0 auto; padding: 6px 10px !important; font-size: 12px !important; gap: 4px !important; white-space: nowrap; }
    .top-left-bar .tag-badge { flex: 0 1 auto; min-width: 0; padding: 6px 10px !important; font-size: 12px !important; gap: 5px !important; white-space: nowrap; overflow: hidden; }
    .top-left-bar .tag-badge > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .qr-btn-label { display: none !important; }
    .tag-pill { font-size: 9px !important; padding: 1px 6px !important; flex: 0 0 auto; }

    .top-right-bar { top: calc(max(8px, env(safe-area-inset-top)) + 40px) !important; right: 8px !important; gap: 6px !important; flex-wrap: nowrap !important; }
    .data-card { flex: 0 1 auto; min-width: 0; gap: 7px !important; padding: 5px 9px !important; overflow: hidden; }
    .data-item { min-width: 0; }
    .data-label { font-size: 8.5px !important; line-height: 1.2; letter-spacing: -0.4px; }
    .data-value { font-size: 12px !important; line-height: 1.25; }
    .data-sep { height: 18px; }
    .icon-btn { width: 34px !important; height: 34px !important; min-width: 34px; font-size: 15px !important; flex: 0 0 34px; }

    body.is-3d .bottom-right-bar { top: max(8px, env(safe-area-inset-top)) !important; bottom: auto !important; right: 8px !important; left: auto !important; z-index: 20; }
    body .bottom-right-bar button { padding: 7px 10px !important; font-size: 14px !important; gap: 4px !important; line-height: 1; }
    body .bottom-right-bar #fullscreenText { display: none !important; }

    .center-tooltip {
        top: calc(max(8px, env(safe-area-inset-top)) + 78px) !important; left: 8px !important; right: 8px !important;
        transform: none !important; margin: 0 auto; width: auto !important; max-width: none !important;
        font-size: 11px !important; padding: 6px 12px !important; white-space: normal !important;
        line-height: 1.45; text-align: center; z-index: 15 !important; text-overflow: clip;
    }

    .bottom-ctrl-bar { left: 8px !important; right: 8px !important; bottom: calc(6px + env(safe-area-inset-bottom)) !important; transform: none !important; width: auto !important; border-radius: 16px !important; padding: 6px !important; gap: 5px !important; justify-content: center !important; flex-wrap: wrap !important; }
    .action-btn { padding: 7px 12px !important; font-size: 11.5px !important; }

    .side-ctrl-panel { right: 8px !important; left: auto !important; bottom: calc(60px + env(safe-area-inset-bottom)) !important; width: min(212px, calc(100vw - 16px)) !important; padding: 8px !important; gap: 6px !important; max-height: 46vh !important; }
    .panel-title { font-size: 10.5px !important; padding-bottom: 4px !important; }
    .seg-btn { padding: 7px 1px !important; font-size: 9.5px !important; }
    .btn-start { padding: 9px 6px !important; font-size: 11.5px !important; }
    .btn-ghost { padding: 7px 6px !important; font-size: 10px !important; }
    .ctrl-row .lbl { font-size: 9px !important; flex-basis: 28px !important; }
    .mini { padding: 5px 0 !important; font-size: 9.5px !important; }
    .slider-name { font-size: 9.5px !important; }
    .slider-val { font-size: 10px !important; }
    .state-badge { font-size: 9.5px !important; padding: 6px 6px !important; }

    .sub-panel { left: 8px !important; right: 8px !important; bottom: calc(66px + env(safe-area-inset-bottom)) !important; transform: none !important; width: auto !important; max-width: none !important; max-height: 42vh !important; padding: 10px 12px !important; gap: 7px !important; }
    .sub-panel-title { font-size: 11px !important; }
    .graph-canvas { height: 140px !important; }
    .legend { font-size: 8.5px !important; gap: 7px !important; }
    .note { font-size: 8.5px !important; }
    .stat-row { grid-template-columns: 56px 1fr 48px; font-size: 9px; }
}

@media (max-width: 430px) {
    .tag-pill { display: none !important; }
    .data-label { font-size: 8px !important; }
    .data-value { font-size: 11px !important; }
}

@media (max-height: 500px) and (orientation: landscape) {
    .top-left-bar { top: max(6px, env(safe-area-inset-top)) !important; left: 6px !important; right: auto !important; max-width: 46vw; gap: 5px; }
    .top-left-bar .back-btn, .top-left-bar > a, .top-left-bar .tag-badge { padding: 4px 9px !important; font-size: 11px !important; height: 30px; }
    .tag-pill { display: none !important; }
    .top-right-bar { top: max(6px, env(safe-area-inset-top)) !important; right: 72px !important; left: auto !important; gap: 5px; flex-direction: column !important; align-items: flex-end !important; }
    .data-card { padding: 4px 9px !important; gap: 9px !important; flex: 0 0 auto; }

<script>
/* ============ 공통 3D 기반 (씬·카메라·조명·테마·반응형) ============ */
window.SVL = (function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var LIGHT_BG = 0xeef2f8, DARK_BG = 0x0b1220;

    var container = $('canvas-container');
    var scene = new THREE.Scene();
    scene.background = new THREE.Color(LIGHT_BG);

    var camera = new THREE.PerspectiveCamera(45, window.innerWidth / Math.max(1, window.innerHeight), 0.1, 400);

    var renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    var controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enablePan = true;
    controls.screenSpacePanning = true;
    controls.minDistance = 3;
    controls.maxDistance = 60;
    controls.minPolarAngle = Math.PI * 0.06;
    controls.maxPolarAngle = Math.PI * 0.55;
    controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
    if (THREE.TOUCH) { controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN }; }

    var hemi = new THREE.HemisphereLight(0xffffff, 0xd7e2ee, 0.78);
    scene.add(hemi);
    var key = new THREE.DirectionalLight(0xffffff, 1.05);
    key.position.set(6, 18, 9);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.left = -12;
    key.shadow.camera.right = 12;
    key.shadow.camera.top = 12;
    key.shadow.camera.bottom = -12;
    key.shadow.camera.near = 1;
    key.shadow.camera.far = 50;
    key.shadow.radius = 3;
    scene.add(key);
    var fill = new THREE.DirectionalLight(0xffffff, 0.34);
    fill.position.set(-7, 6, -6);
    scene.add(fill);

    var benchMat = new THREE.MeshStandardMaterial({ color: 0xdfe8f3, roughness: 0.94, metalness: 0.02 });
    var bench = new THREE.Mesh(new THREE.PlaneGeometry(90, 60), benchMat);
    bench.rotation.x = -Math.PI / 2;
    bench.receiveShadow = true;
    scene.add(bench);

    /* ---- 라벨 스프라이트 (폰트 로드 후 재그리기 지원) ---- */
    var labelList = [];
    function drawLabel(cv, text, color) {
        var g = cv.getContext('2d');
        g.clearRect(0, 0, 512, 128);
        g.font = "bold 54px 'SeoulNamsan', -apple-system, sans-serif";
        g.textAlign = 'center';
        g.textBaseline = 'middle';
        var tw = Math.min(470, g.measureText(text).width + 46);
        var x0 = (512 - tw) / 2, r = 30;
        g.fillStyle = 'rgba(255,255,255,0.93)';
        g.beginPath();
        g.moveTo(x0 + r, 22); g.lineTo(x0 + tw - r, 22);
        g.quadraticCurveTo(x0 + tw, 22, x0 + tw, 22 + r);
        g.lineTo(x0 + tw, 106 - r);
        g.quadraticCurveTo(x0 + tw, 106, x0 + tw - r, 106);
        g.lineTo(x0 + r, 106);
        g.quadraticCurveTo(x0, 106, x0, 106 - r);
        g.lineTo(x0, 22 + r);
        g.quadraticCurveTo(x0, 22, x0 + r, 22);
        g.closePath();
        g.fill();
        g.fillStyle = color || '#124';
        g.fillText(text, 256, 66);
    }
    function makeLabel(text, color, w) {
        var cv = document.createElement('canvas');
        cv.width = 512; cv.height = 128;
        drawLabel(cv, text, color);
        var tex = new THREE.CanvasTexture(cv);
        tex.minFilter = THREE.LinearFilter;
        var spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
        var ww = w || 1.9;
        spr.scale.set(ww, ww * 0.25, 1);
        spr.userData.label = { cv: cv, tex: tex, text: text, color: color };
        labelList.push(spr);
        return spr;
    }
    function relabelAll() {
        for (var i = 0; i < labelList.length; i++) {
            var L = labelList[i].userData.label;
            if (!L) continue;
            drawLabel(L.cv, L.text, L.color);
            if (L.tex) L.tex.needsUpdate = true;
        }
    }
    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () { setTimeout(relabelAll, 30); }).catch(function () {});
    }
    window.addEventListener('load', function () { setTimeout(relabelAll, 120); });

    /* ---- 안내 문구 ---- */
    var hintEl = $('centerTooltip');
    var hintTimer = null;
    function setHint(text, sticky) {
        if (!hintEl) return;
        hintEl.textContent = text;
        hintEl.classList.remove('hidden');
        if (hintTimer) clearTimeout(hintTimer);
        if (!sticky) hintTimer = setTimeout(function () { hintEl.classList.add('hidden'); }, 5200);
    }

    /* ---- 테마 ---- */
    var isDark = false;
    var themeCbs = [];
    function applyTheme() {
        document.body.classList.toggle('dark-mode', isDark);
        scene.background = new THREE.Color(isDark ? DARK_BG : LIGHT_BG);
        benchMat.color.setHex(isDark ? 0x16203a : 0xdfe8f3);
        hemi.intensity = isDark ? 0.42 : 0.78;
        key.intensity = isDark ? 0.82 : 1.05;
        fill.intensity = isDark ? 0.26 : 0.34;
        $('themeBtn').textContent = isDark ? '☀️' : '🌙';
        $('themeBtn').title = isDark ? '주간 모드로 전환' : '야간 모드로 전환';
        for (var i = 0; i < themeCbs.length; i++) { try { themeCbs[i](isDark); } catch (e) {} }
    }
    $('themeBtn').addEventListener('click', function () { isDark = !isDark; applyTheme(); });

    /* ---- 크기/시점 ---- */
    function onResize() {
        renderer.setSize(window.innerWidth, window.innerHeight);
        camera.aspect = window.innerWidth / Math.max(1, window.innerHeight);
        camera.updateProjectionMatrix();
        if (typeof svlFit === 'function') svlFit();
    }
    var svlFit = null;

    window.addEventListener('resize', onResize);

    /* ---- 실험 훅 ---- */
    var hooks = { reset: null, align: null, fit: null };
    $('btnReset').addEventListener('click', function () { if (hooks.reset) hooks.reset(); else { svlFit && svlFit(); } });
    $('btnAlign').addEventListener('click', function () {
        if (hooks.align) hooks.align(); else if (hooks.fit) hooks.fit();
        setHint('🎥 정면 시점으로 정렬했습니다.', false);
    });

    function alignView() { if (hooks.align) hooks.align(); else if (hooks.fit) hooks.fit(); }

    var frameCbs = [];
    var clock = new THREE.Clock();
    var last = performance.now();
    function frame(now) {
        requestAnimationFrame(frame);
        var dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        for (var i = 0; i < frameCbs.length; i++) { try { frameCbs[i](dt, now); } catch (e) {} }
        controls.update();
        renderer.render(scene, camera);
    }
    requestAnimationFrame(frame);

    return {
        $: $, scene: scene, camera: camera, renderer: renderer, controls: controls,
        hemi: hemi, key: key, fill: fill, benchMat: benchMat,
        LIGHT_BG: LIGHT_BG, DARK_BG: DARK_BG,
        makeLabel: makeLabel, setHint: setHint, relabel: relabelAll,
        onTheme: function (fn) { themeCbs.push(fn); },
        onFrame: function (fn) { frameCbs.push(fn); },
        isDark: function () { return isDark; },
        hooks: hooks,
        setFit: function (fn) { hooks.fit = fn; svlFit = fn; window.svlFitCamera = fn; },
        setReset: function (fn) { hooks.reset = fn; },
        setAlign: function (fn) { hooks.align = fn; },
        alignView: alignView
    };
})();
</script>
<script>

(function () {
  'use strict';
  var S = window.SVL, $ = S.$, scene = S.scene;

  var state = {
    mode: 'dew',        /* dew = 이슬점 측정 / hygro = 건습구 습도계 */
    vapor: 9.5,         /* 공기 1m³ 속 수증기량 g */
    room: 24,           /* 실내 온도 */
    cup: 24,            /* 비커 물의 온도 */
    icing: false,
    found: false,       /* 이슬점 발견 */
    wet: true,
    fan: 0
  };

  /* ---------- 수증기 계산 ---------- */
  function es(T) { return 6.112 * Math.exp(17.62 * T / (243.12 + T)); }          /* hPa */
  function absFromE(e, T) { return 217 * e / (T + 273.15); }                     /* g/m³ */
  function eFromAbs(a, T) { return a * (T + 273.15) / 217; }
  function dewPoint(a) {
    var e = eFromAbs(a, state.room);
    var ln = Math.log(e / 6.112);
    return 243.12 * ln / (17.62 - ln);
  }
  function rhNow() {
    var e = eFromAbs(state.vapor, state.room);
    return Math.min(100, e / es(state.room) * 100);
  }
  /* 습구 온도 (습도계 공식) */
  function wetBulb(T, e) {
    var lo = -10, hi = T;
    for (var i = 0; i < 40; i++) {
      var mid = (lo + hi) / 2;
      var eCalc = es(mid) - 0.00066 * 1013 * (1 + 0.00115 * mid) * (T - mid);
      if (eCalc > e) hi = mid; else lo = mid;
    }
    return (lo + hi) / 2;
  }

  /* ---------- 공통 재질 ---------- */
  var glassMat = new THREE.MeshPhysicalMaterial({
    color: 0xdfeaf5, transparent: true, opacity: 0.32, roughness: 0.08, metalness: 0.0, side: THREE.DoubleSide
  });
  var steelMat = new THREE.MeshStandardMaterial({ color: 0xd6e0ea, roughness: 0.38, metalness: 0.22 });
  var waterMat = new THREE.MeshStandardMaterial({ color: 0x4aa3d8, transparent: true, opacity: 0.72, roughness: 0.2, metalness: 0.1 });

  /* ---------- 온도계 만들기 ---------- */
  function makeThermometer(h) {
    var g = new THREE.Group();
    var tube = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, h, 18, 1, true), glassMat);
    tube.position.y = h / 2;
    g.add(tube);
    var bulb = new THREE.Mesh(new THREE.SphereGeometry(0.105, 18, 14), new THREE.MeshStandardMaterial({ color: 0xd93b3b, roughness: 0.35 }));
    bulb.position.y = 0;
    g.add(bulb);
    var col = new THREE.Mesh(new THREE.CylinderGeometry(0.021, 0.021, 1, 12), new THREE.MeshStandardMaterial({ color: 0xe23b3b, roughness: 0.3 }));
    col.position.y = 0.05;
    g.add(col);
    var cap = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.05, 16), steelMat);
    cap.position.y = h + 0.02;
    g.add(cap);

    /* 눈금 */
    var cv = document.createElement('canvas'); cv.width = 96; cv.height = 512;
    var c = cv.getContext('2d');
    c.fillStyle = 'rgba(255,255,255,0.9)'; c.fillRect(0, 0, 96, 512);
    c.strokeStyle = '#334155'; c.lineWidth = 3;
    c.strokeRect(1, 1, 94, 510);
    c.fillStyle = '#1e293b'; c.font = "bold 26px 'SeoulNamsan', sans-serif"; c.textAlign = 'left';
    for (var t = 0; t <= 40; t += 2) {
      var y = 496 - (t / 40) * 480;
      var len = t % 10 === 0 ? 34 : (t % 5 === 0 ? 24 : 14);
      c.fillRect(6, y, len, 2.5);
      if (t % 10 === 0) c.fillText(String(t), 46, y + 9);
    }
    var tex = new THREE.CanvasTexture(cv);
    var board = new THREE.Mesh(new THREE.PlaneGeometry(0.17, h * 1.02), new THREE.MeshBasicMaterial({ map: tex }));
    board.position.set(0.1, h / 2, 0.0);
    g.add(board);
    return { group: g, col: col, h: h };
  }

  /* ============================================================
     A. 이슬점 측정 장치
     ============================================================ */
  var dewGroup = new THREE.Group();
  dewGroup.position.set(-0.15, 0.02, 0);
  scene.add(dewGroup);

  var CUP_R = 0.62, CUP_H = 1.22;
  var beakerMat = new THREE.MeshPhysicalMaterial({ color: 0xe8f2fb, transparent: true, opacity: 0.24, roughness: 0.06, metalness: 0.0, side: THREE.DoubleSide, depthWrite: false });
  var cup = new THREE.Mesh(new THREE.CylinderGeometry(CUP_R, CUP_R * 0.94, CUP_H, 44, 1, true), beakerMat);
  cup.position.y = CUP_H / 2;
  cup.castShadow = true;
  dewGroup.add(cup);
  var cupBottom = new THREE.Mesh(new THREE.CylinderGeometry(CUP_R * 0.94, CUP_R * 0.94, 0.05, 44), steelMat);
  cupBottom.position.y = 0.02;
  dewGroup.add(cupBottom);
  var cupRim = new THREE.Mesh(new THREE.TorusGeometry(CUP_R, 0.028, 10, 44), steelMat);
  cupRim.rotation.x = Math.PI / 2;
  cupRim.position.y = CUP_H;
  dewGroup.add(cupRim);

  var cupWater = new THREE.Mesh(new THREE.CylinderGeometry(CUP_R * 0.93, CUP_R * 0.86, 1, 40), new THREE.MeshPhysicalMaterial({ color: 0x5fb2e0, transparent: true, opacity: 0.62, roughness: 0.15, metalness: 0.05 }));
  cupWater.position.y = 0.5;
  dewGroup.add(cupWater);

  /* 얼음 조각 */
  var iceGroup = new THREE.Group();
  dewGroup.add(iceGroup);
  var iceMat = new THREE.MeshPhysicalMaterial({ color: 0xeaf6ff, transparent: true, opacity: 0.78, roughness: 0.15, metalness: 0.0 });
  var ices = [];
  for (var ic = 0; ic < 7; ic++) {
    var cube = new THREE.Mesh(new THREE.BoxGeometry(0.19, 0.16, 0.19), iceMat);
    cube.visible = ic < 2;
    if (ic < 2) cube.position.set((ic - 0.5) * 0.32, 0.99, 0.12);
    iceGroup.add(cube);
    ices.push(cube);
  }

  /* 온도계 */
  var dewThermo = makeThermometer(1.32);
  dewThermo.group.position.set(0.22, 0.06, 0.05);
  dewGroup.add(dewThermo.group);
  var dewTempLab = S.makeLabel('24.0 ℃', '#b91c1c', 1.05);
  dewTempLab.position.set(0.22, 1.72, 0.05);
  dewGroup.add(dewTempLab);

  /* 물방울 */
  var dropMat = new THREE.MeshStandardMaterial({ color: 0xcfeafb, roughness: 0.1, metalness: 0.25, transparent: true, opacity: 0.95 });
  var dropGeo = new THREE.SphereGeometry(1, 8, 6);
  var drops = [];
  for (var d = 0; d < 86; d++) {
    var dm = new THREE.Mesh(dropGeo, dropMat);
    var ang = (Math.random() - 0.5) * 2.5;
    var yy = 0.1 + Math.random() * (CUP_H * 0.82);
    var rad = CUP_R * 0.985;
    dm.position.set(Math.sin(ang) * rad, yy, Math.cos(ang) * rad);
    var sz = 0.009 + Math.random() * 0.011;
    dm.scale.set(sz, sz * (1.2 + Math.random() * 0.9), sz);
    dm.visible = false;
    dewGroup.add(dm);
    drops.push(dm);
  }

  var dewLabCup = S.makeLabel('비커', '#334155', 0.95);
  dewLabCup.position.set(-0.82, 0.95, 0.45);
  dewGroup.add(dewLabCup);
  var dewLabDrop = S.makeLabel('표면에 물방울', '#0369a1', 1.0);
  dewLabDrop.position.set(-0.92, 0.42, 0.55);
  dewLabDrop.visible = false;
  dewGroup.add(dewLabDrop);

  /* ============================================================
     B. 건습구 습도계
     ============================================================ */
  var hygroGroup = new THREE.Group();
  hygroGroup.position.set(0, 0.02, 0);
  hygroGroup.visible = false;
  scene.add(hygroGroup);

  /* 받침 + 기둥 */
  var base = new THREE.Mesh(new THREE.CylinderGeometry(0.78, 0.84, 0.1, 30), new THREE.MeshStandardMaterial({ color: 0xd8c3a0, roughness: 0.8 }));
  base.position.y = 0.05;
  hygroGroup.add(base);
  var pole = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 1.5, 12), steelMat);
  pole.position.set(0, 0.8, -0.28);
  hygroGroup.add(pole);
  var cross = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.07, 0.07), steelMat);
  cross.position.set(0, 1.52, -0.28);
  hygroGroup.add(cross);

  var dryT = makeThermometer(1.62);
  dryT.group.position.set(-0.42, 0.34, 0);
  hygroGroup.add(dryT.group);
  var wetT = makeThermometer(1.62);
  wetT.group.position.set(0.42, 0.34, 0);
  hygroGroup.add(wetT.group);

  /* 습구의 젖은 천 */
  var wick = new THREE.Mesh(new THREE.CylinderGeometry(0.115, 0.13, 0.34, 16), new THREE.MeshStandardMaterial({ color: 0xf2f7fb, roughness: 0.95 }));
  wick.position.set(0.42, 0.36, 0);
  hygroGroup.add(wick);
  /* 물 컵 + 심지 */
  var wetCup = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.15, 0.22, 20), glassMat);
  wetCup.position.set(0.42, 0.11, 0.34);
  hygroGroup.add(wetCup);
  var wetWater = new THREE.Mesh(new THREE.CylinderGeometry(0.155, 0.14, 0.13, 20), waterMat);
  wetWater.position.set(0.42, 0.13, 0.34);
  hygroGroup.add(wetWater);

  /* 선풍기 */
  var fanGroup = new THREE.Group();
  fanGroup.position.set(-1.72, 0.0, 0.2);
  fanGroup.scale.setScalar(0.82);
  fanGroup.rotation.y = 0.35;
  hygroGroup.add(fanGroup);
  var fanStand = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.36, 0.08, 22), steelMat);
  fanStand.position.y = 0.04;
  fanGroup.add(fanStand);
  var fanPole = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.0, 10), steelMat);
  fanPole.position.y = 0.55;
  fanGroup.add(fanPole);
  var fanHead = new THREE.Mesh(new THREE.TorusGeometry(0.34, 0.045, 10, 30), steelMat);
  fanHead.position.y = 1.12;
  fanGroup.add(fanHead);
  var fanGrille = new THREE.Mesh(new THREE.CircleGeometry(0.33, 26), new THREE.MeshBasicMaterial({ color: 0xdfe8f2, transparent: true, opacity: 0.25, side: THREE.DoubleSide }));
  fanGrille.position.set(0, 1.12, -0.02);
  fanGroup.add(fanGrille);
  var blades = new THREE.Group();
  blades.position.set(0, 1.12, 0.0);
  fanGroup.add(blades);
  for (var b = 0; b < 3; b++) {
    var blade = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.09, 0.012), new THREE.MeshStandardMaterial({ color: 0xb9c6d3, roughness: 0.6 }));
    blade.position.set(Math.cos(b * Math.PI * 2 / 3) * 0.16, Math.sin(b * Math.PI * 2 / 3) * 0.16, 0);
    blade.rotation.z = b * Math.PI * 2 / 3;
    blades.add(blade);
  }

  var labDry = S.makeLabel('건구 24.0 ℃', '#b91c1c', 1.45);
  labDry.position.set(-0.62, 2.42, 0);
  hygroGroup.add(labDry);
  var labWet = S.makeLabel('습구 18.0 ℃', '#1d4ed8', 1.45);
  labWet.position.set(0.62, 2.42, 0);
  hygroGroup.add(labWet);
  var labDiff = S.makeLabel('온도차 6.0 ℃', '#0f172a', 1.3);
  labDiff.position.set(0.05, 0.12, 1.35);
  hygroGroup.add(labDiff);
  var labWick = S.makeLabel('젖은 천', '#0369a1', 1.05);
  labWick.position.set(1.15, 0.62, 0.35);
  hygroGroup.add(labWick);

  /* ============================================================
     좌측 그래프
     ============================================================ */
  var cv = document.getElementById('curveCanvas');
  var ctx = cv.getContext('2d');

  function drawCurve() {
    var W = cv.width, H = cv.height;
    var dark = S.isDark();
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = dark ? '#0f1a2a' : '#f6faff';
    ctx.fillRect(0, 0, W, H);

    var padL = 46, padR = 16, padT = 30, padB = 38;
    var x0 = padL, x1 = W - padR, y0 = padT, y1 = H - padB;
    function X(t) { return x0 + ((t + 5) / 45) * (x1 - x0); }
    function Y(a) { return y1 - (a / 55) * (y1 - y0); }

    /* 축 */
    ctx.strokeStyle = dark ? 'rgba(148,163,184,0.28)' : 'rgba(100,116,139,0.28)';
    ctx.lineWidth = 1.3;
    for (var t = -5; t <= 40; t += 5) {
      ctx.beginPath(); ctx.moveTo(X(t), y0); ctx.lineTo(X(t), y1); ctx.stroke();
      ctx.fillStyle = dark ? '#94a3b8' : '#64748b'; ctx.font = "bold 12px 'SeoulNamsan', sans-serif"; ctx.textAlign = 'center';
      if (t % 10 === -5 || t % 10 === 5) ctx.fillText(t + '℃', X(t), y1 + 17);
    }
    for (var a = 0; a <= 50; a += 10) {
      ctx.beginPath(); ctx.moveTo(x0, Y(a)); ctx.lineTo(x1, Y(a)); ctx.stroke();
      ctx.fillStyle = dark ? '#94a3b8' : '#64748b'; ctx.textAlign = 'right';
      ctx.fillText(a, x0 - 6, Y(a) + 4);
    }

    /* 포화 수증기량 곡선 */
    ctx.beginPath();
    for (var i = 0; i <= 300; i++) {
      var tt = -5 + i / 300 * 45;
      var aa = absFromE(es(tt), tt);
      i ? ctx.lineTo(X(tt), Y(aa)) : ctx.moveTo(X(tt), Y(aa));
    }
    ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 3.2; ctx.stroke();

    /* 실제 수증기량 수평선 */
    var vapor = state.vapor;
    var Td = dewPoint(vapor);
    ctx.beginPath(); ctx.moveTo(x0, Y(vapor)); ctx.lineTo(x1, Y(vapor));
    ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2.4; ctx.setLineDash([7, 5]); ctx.stroke(); ctx.setLineDash([]);

    /* 이슬점 지점 */
    ctx.beginPath(); ctx.arc(X(Td), Y(vapor), 6.5, 0, Math.PI * 2);
    ctx.fillStyle = '#f59e0b'; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = dark ? '#fcd34d' : '#b45309';
    ctx.font = "bold 12.5px 'SeoulNamsan', sans-serif"; ctx.textAlign = 'center';
    ctx.fillText('이슬점 ' + Td.toFixed(1) + '℃', X(Td), Y(vapor) - 12);

    /* 현재 온도 */
    var Tnow = state.mode === 'dew' ? state.cup : state.room;
    var satNow = absFromE(es(Tnow), Tnow);
    ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(X(Tnow), y0); ctx.lineTo(X(Tnow), y1); ctx.stroke();
    ctx.beginPath(); ctx.arc(X(Tnow), Y(satNow), 6, 0, Math.PI * 2);
    ctx.fillStyle = '#ef4444'; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = dark ? '#fca5a5' : '#b91c1c';
    ctx.fillText(Tnow.toFixed(1) + '℃', X(Tnow), y1 - 6);

    /* 부족한 수증기량 */
    if (state.mode === 'dew') {
      ctx.beginPath();
      ctx.moveTo(X(Tnow), Y(satNow));
      ctx.lineTo(X(Tnow), Y(vapor));
      ctx.strokeStyle = '#7c3aed'; ctx.lineWidth = 3.4; ctx.stroke();
    }

    /* 제목 */
    ctx.fillStyle = dark ? '#e2e8f0' : '#1e293b';
    ctx.textAlign = 'left'; ctx.font = "bold 16px 'SeoulNamsan', sans-serif";
    ctx.fillText('포화 수증기량 곡선', 12, 20);

    /* 범례 */
    ctx.font = "bold 11.5px 'SeoulNamsan', sans-serif";
    ctx.textAlign = 'right';
    ctx.fillStyle = '#f59e0b';
    ctx.fillText('● 실제 수증기량', x1, 20);
  }

  /* ============================================================
     UI
     ============================================================ */
  function updateUI() {
    var Td = dewPoint(state.vapor);
    var rh = rhNow();
    var wb = wetBulb(state.room, eFromAbs(state.vapor, state.room));
    $('dVapor').textContent = state.vapor.toFixed(1) + ' g';
    $('dDew').textContent = Td.toFixed(1) + ' ℃';
    $('dRh').textContent = Math.round(rh) + ' %';
    $('vaporVal').textContent = state.vapor.toFixed(1) + ' g/m³';
    $('vapor').value = state.vapor;
    $('btnIce').style.display = state.mode === 'dew' ? '' : 'none';
    $('btnWet').style.display = state.mode === 'hygro' ? '' : 'none';
    $('modeTag').innerHTML = state.mode === 'dew'
      ? '<b>이슬점 측정</b><span>' + state.cup.toFixed(1) + ' ℃</span>'
      : '<b>건습구 습도계</b><span>ΔT ' + (state.room - wb).toFixed(1) + ' ℃</span>';
    document.querySelectorAll('[data-mode]').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-mode') === state.mode); });

    dewTempLab.userData.label.text = state.cup.toFixed(1) + ' ℃';
    labDry.userData.label.text = '건구 ' + state.room.toFixed(1) + ' ℃';
    labWet.userData.label.text = '습구 ' + wb.toFixed(1) + ' ℃';
    labDiff.userData.label.text = '온도차 ' + (state.room - wb).toFixed(1) + ' ℃';
    S.relabel();

    $('dewState').textContent = state.found ? ('✅ 이슬점 ' + Td.toFixed(1) + '℃ 발견') : (state.cup <= Td + 0.05 ? '💧 물방울 맺힘!' : '아직 마르고 있어요');
  }

  document.getElementById('segMode').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-mode]') : null;
    if (!b) return;
    state.mode = b.getAttribute('data-mode');
    var isDew = state.mode === 'dew';
    dewGroup.visible = isDew;
    hygroGroup.visible = !isDew;
    if (isDew) {
      state.cup = state.room; state.icing = false; state.found = false;
      for (var i = 0; i < ices.length; i++) ices[i].visible = false;
    }
    updateUI(); drawCurve(); fitFn();
    S.setHint(isDew ? '🧊 얼음을 넣어 비커 물의 온도를 낮추고, 표면에 물방울이 맺히는 순간의 온도를 찾아보세요.'
      : '💧 젖은 천을 두른 습구의 온도가 건구보다 낮아요. 온도차로 상대습도를 계산해요.', false);
  });

  $('vapor').addEventListener('input', function (e) {
    state.vapor = parseFloat(e.target.value);
    updateUI(); drawCurve();
  });

  $('btnIce').addEventListener('click', function () {
    state.icing = true;
    var show = 0;
    for (var i = 0; i < ices.length; i++) {
      if (!ices[i].visible) {
        ices[i].visible = true;
        ices[i].position.set((Math.random() - 0.5) * 0.6, 0.7 + Math.random() * 0.25, (Math.random() - 0.5) * 0.6);
        ices[i].rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
        show++; break;
      }
    }
    S.setHint(show ? '🧊 얼음을 넣었어요. 물의 온도가 내려가요.' : '🧊 얼음이 가득 찼어요!', false);
  });

  $('btnWet').addEventListener('click', function () {
    state.wet = true;
    wick.material.color.setHex(0xe6f4ff);
    S.setHint('💧 젖은 천을 다시 적셨어요.', false);
  });

  /* ============================================================
     초기화 / 시점
     ============================================================ */
  var fitFn = function () {
    var w = window.innerWidth, h = window.innerHeight;
    var portrait = h > w;
    if (state.mode === 'dew') {
      S.controls.target.set(0, 0.8, 0);
      S.camera.position.set(0.15, portrait ? 2.7 : 2.0, portrait ? 6.8 : (h <= 520 ? 6.4 : 5.0));
      S.camera.fov = portrait ? 52 : 42;
    } else {
      S.controls.target.set(0, 1.2, 0);
      S.camera.position.set(0.1, portrait ? 3.2 : 2.5, portrait ? 8.6 : (h <= 520 ? 9.4 : 7.0));
      S.camera.fov = portrait ? 54 : 44;
    }
    S.camera.updateProjectionMatrix();
    S.controls.update();
  };
  S.setFit(fitFn); S.setAlign(fitFn);
  S.setReset(function () {
    state.mode = 'dew'; state.vapor = 9.5; state.cup = state.room;
    state.icing = false; state.found = false; state.wet = true;
    dewGroup.visible = true; hygroGroup.visible = false;
    for (var i = 0; i < ices.length; i++) ices[i].visible = false;
    updateUI(); drawCurve(); fitFn();
  });

  /* ============================================================
     애니메이션
     ============================================================ */
  var t = 0;
  S.onFrame(function (dt) {
    t += dt;
    var Td = dewPoint(state.vapor);

    if (state.mode === 'dew') {
      if (state.icing && state.cup > 2.0) {
        state.cup = Math.max(2.0, state.cup - dt * 2.1);
        updateUI();
        drawCurve._q = (drawCurve._q || 0) + dt;
        if (drawCurve._q > 0.25) { drawCurve._q = 0; drawCurve(); }
      }
      /* 물방울 */
      var below = Td - state.cup;
      var n = below <= 0 ? 0 : Math.min(1, below / 1.8) * drops.length;
      for (var i = 0; i < drops.length; i++) drops[i].visible = i < n;
      dewLabDrop.visible = n > 4;
      if (n > 4 && !state.found) { state.found = true; updateUI(); S.setHint('💧 표면에 물방울이 맺혔어요! 이때의 온도가 이슬점이에요.', false); }
      if (n === 0 && state.found) { state.found = false; updateUI(); }
      dewThermo.col.scale.y = Math.max(0.1, (state.cup / 40) * dewThermo.h);
      dewThermo.col.position.y = 0.05 + (state.cup / 40) * dewThermo.h / 2;
      cupWater.scale.y = CUP_H * 0.8;
      cupWater.position.y = 0.06 + CUP_H * 0.4;
    } else {
      var wb = wetBulb(state.room, eFromAbs(state.vapor, state.room));
      var dryN = state.room / 40, wetN = wb / 40;
      dryT.col.scale.y = Math.max(0.1, dryN * dryT.h);
      dryT.col.position.y = 0.05 + dryN * dryT.h / 2;
      wetT.col.scale.y = Math.max(0.1, wetN * wetT.h);
      wetT.col.position.y = 0.05 + wetN * wetT.h / 2;
      blades.rotation.z += dt * 9;
      if (Math.floor(t * 4) % 4 === 0 && Math.abs((state.room - wb) - (parseFloat((labDiff.userData.label.text.split(' ')[1]) || 0))) > 0.05) {
        updateUI();
      }
    }
  });

  /* 시작 */
  dewGroup.visible = true;
  hygroGroup.visible = false;
  updateUI();
  drawCurve();
  fitFn();
  S.setHint('🧊 얼음을 넣어 비커 물의 온도를 낮추고, 표면에 물방울이 맺히는 순간의 온도를 찾아보세요.', false);
})();

</script>

<script>
/* ============ 전체화면 / 창모드 + 모바일 화면 재조정 (공통) ============ */
(function () {
    'use strict';
    var docEl = document.documentElement;
    var btn = document.getElementById('fullscreenBtn');
    var icon = document.getElementById('fullscreenIcon');
    var text = document.getElementById('fullscreenText');

    function realFs() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement ||
                  document.mozFullScreenElement || document.msFullscreenElement);
    }
    function pseudo() { return docEl.classList.contains('pseudo-fs'); }

    function toast(msg) {
        var t = document.getElementById('ux-toast');
        if (!t) {
            t = document.createElement('div');
            t.id = 'ux-toast';
            t.style.cssText = 'position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);' +
                'background:rgba(28,28,30,.88);color:#fff;font-size:12px;line-height:1.4;padding:9px 14px;border-radius:14px;' +
                'z-index:9999;max-width:86vw;text-align:center;pointer-events:none;transition:opacity .3s;' +
                'font-family:inherit;box-shadow:0 8px 24px rgba(0,0,0,.25)';
            document.body.appendChild(t);
        }
        t.textContent = msg;
        t.style.opacity = '1';
        clearTimeout(t._t);
        t._t = setTimeout(function () { t.style.opacity = '0'; }, 2600);
    }

    function setUI() {
        var on = realFs() || pseudo();
        if (icon) icon.textContent = on ? '\uD83D\uDDD7' : '\u26F6';
        if (text) text.textContent = on ? '창모드' : '전체화면';
        if (btn) {
            btn.setAttribute('aria-label', on ? '창모드로 전환' : '전체화면으로 전환');
            btn.title = on ? '창모드로 전환' : '전체화면으로 전환';
        }
        document.body.classList.toggle('is-fullscreen', on);
        setTimeout(function () {
            try { window.dispatchEvent(new Event('resize')); } catch (e) {}
            if (window.SVL && window.SVL.hooks && window.SVL.hooks.fit) window.SVL.hooks.fit();
        }, 150);
        setTimeout(function () {
            try { window.dispatchEvent(new Event('resize')); } catch (e) {}
            if (window.SVL && window.SVL.hooks && window.SVL.hooks.fit) window.SVL.hooks.fit();
        }, 440);
    }

    function onKey(e) {
        if (e.key !== 'Escape' && e.key !== 'Esc') return;
        if (pseudo() && !realFs()) { docEl.classList.remove('pseudo-fs'); setUI(); }
    }

    if (btn) {
        btn.addEventListener('click', function () {
            if (realFs()) {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                else if (document.msExitFullscreen) document.msExitFullscreen();
                return;
            }
            if (pseudo()) { docEl.classList.remove('pseudo-fs'); setUI(); return; }
            var req = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.msRequestFullscreen;
            if (req) {
                try {
                    var r = req.call(docEl);
                    if (r && typeof r.catch === 'function') r.catch(function () { docEl.classList.add('pseudo-fs'); setUI(); });
                } catch (err) {
                    docEl.classList.add('pseudo-fs');
                }
            } else {
                docEl.classList.add('pseudo-fs');
                try { window.scrollTo(0, 1); } catch (e) {}
                toast('이 브라우저는 전체화면을 지원하지 않아 상단 정보를 숨긴 몰입 모드로 표시합니다');
            }
            setUI();
        }, false);
    }

    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
        document.addEventListener(ev, setUI);
    });
    document.addEventListener('keydown', onKey);

    var rt = null;
    function refit() {
        clearTimeout(rt);
        rt = setTimeout(function () {
            try { window.dispatchEvent(new Event('resize')); } catch (e) {}
        }, 240);
    }
    window.addEventListener('orientationchange', refit);
    window.addEventListener('pageshow', refit);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) refit(); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', refit);

    setUI();
})();
</script>
