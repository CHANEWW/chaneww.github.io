<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>kepler console check</title>
</head>
<body>
<script>
/* 같은 폴더의 kepler.html을 받아 최상단에 오류 수집기를 심은 뒤 그 페이지로 덮어쓴다. */
fetch('kepler.html').then(function (r) { return r.text(); }).then(function (html) {
  var hook = '<script>' +
    'window.__errs=[];' +
    'window.addEventListener("error",function(e){window.__errs.push("error: "+(e.message||e.type)+" @"+(e.filename||"")+":"+e.lineno);},true);' +
    'window.addEventListener("unhandledrejection",function(e){window.__errs.push("reject: "+e.reason);});' +
    'var _ce=console.error;console.error=function(){window.__errs.push("console.error: "+Array.prototype.join.call(arguments," "));_ce.apply(console,arguments);};' +
    'var _cw=console.warn;console.warn=function(){window.__errs.push("console.warn: "+Array.prototype.join.call(arguments," "));_cw.apply(console,arguments);};' +
    '<\/script>';
  document.open();
  document.write(html.replace('<head>', '<head>' + hook));
  document.close();
});
</script>
</body>
</html>
