<!DOCTYPE html>
<html lang="ko" data-mzoom="0.95">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>태양계 3D</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="preload" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff" as="font" type="font/woff" crossorigin>
    <script src="../../common/lib/three.min.js"></script>
    <script src="../../common/lib/OrbitControls.js"></script>
    <link rel="stylesheet" href="../../common/qr-modal.css">
    <link rel="stylesheet" href="../../common/ui-layout.css">
    <style>
        @font-face {
            font-family: 'SeoulNamsan';
            src: local('SeoulNamsan M'), local('SeoulNamsanM'), local('서울남산체 M'),
                 url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff') format('woff');
            font-weight: 400; font-style: normal; font-display: swap;
        }
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden;
            font-family: 'SeoulNamsan', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: #030612;
            color: #f2f5fa;
            touch-action: none;
            transition: background-color .3s ease, color .3s ease;
        }
        body.light-mode { background-color: #eef3f9; color: #1c1c1e; }

        #canvas-container {
            width: 100%; height: 100%;
            position: absolute; top: 0; left: 0;
            z-index: 1; touch-action: none;
        }

        .glass-panel {
            background: rgba(13, 20, 36, 0.76);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            z-index: 10;
        }
        body.light-mode .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            border-color: rgba(255, 255, 255, 0.7);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            color: #1c1c1e;
        }

        /* ---------- 상단 좌측 바 ---------- */
        .top-left-bar {
            position: absolute; top: 18px; left: 20px;
            display: flex; align-items: center; gap: 10px; z-index: 10;
        }
        .back-btn {
            display: flex; align-items: center; gap: 6px;
            padding: 8px 16px; font-size: 14px; font-weight: bold;
            color: #eaf1ff; text-decoration: none; cursor: pointer;
            transition: all .2s ease;
        }
        body.light-mode .back-btn { color: #1c1c1e; }
        .back-btn:hover { transform: translateY(-1px); background: rgba(255,255,255,0.15); }
        body.light-mode .back-btn:hover { background: rgba(0,0,0,0.06); }

        .tag-badge { display: flex; align-items: center; gap: 8px; padding: 8px 16px; font-size: 14px; font-weight: bold; }
        .title-text { font-size: 14px; font-weight: bold; letter-spacing: -0.3px; }
        .vision-badge {
            background: rgba(10, 132, 255, 0.28); color: #7cc0ff;
            padding: 2px 8px; border-radius: 10px;
            font-size: 11px; font-weight: bold; letter-spacing: .2px;
        }
        body.light-mode .vision-badge { background: rgba(0, 122, 255, 0.14); color: #007aff; }

        /* ---------- 상단 우측 바 ---------- */
        .top-right-bar {
            position: absolute; top: 18px; right: 20px;
            display: flex; align-items: center; gap: 10px; z-index: 10;
        }
        .icon-btn {
            width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; cursor: pointer; border: none;
            background: rgba(30, 40, 60, 0.75); color: #eaf1ff;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            transition: all .2s; font-size: 16px; font-family: inherit;
        }
        body.light-mode .icon-btn { background: rgba(255,255,255,.8); color: #1c1c1e; }
        .icon-btn:hover { transform: scale(1.05); }

        /* ---------- 행성 퀵 네비게이터 (상단 중앙) ---------- */
        .planet-nav-bar {
            position: absolute; top: 72px; left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; gap: 6px;
            padding: 6px 10px; z-index: 10;
            overflow-x: auto; max-width: calc(100vw - 32px);
            scrollbar-width: none; -ms-overflow-style: none;
            white-space: nowrap;
        }
        .planet-nav-bar::-webkit-scrollbar { display: none; }
        .p-nav-btn {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 6px 12px; border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.06);
            color: #dbe4f3; font-size: 12.5px; font-weight: bold; font-family: inherit;
            cursor: pointer; transition: all .2s ease;
        }
        body.light-mode .p-nav-btn {
            background: rgba(0, 0, 0, 0.04);
            border-color: rgba(0, 0, 0, 0.08);
            color: #333;
        }
        .p-nav-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-1px);
        }
        body.light-mode .p-nav-btn:hover { background: rgba(0, 0, 0, 0.08); }
        .p-nav-btn.active {
            background: #0a84ff; border-color: #0a84ff; color: #fff;
            box-shadow: 0 4px 14px rgba(10, 132, 255, 0.45);
        }

        /* ---------- 상단 안내 힌트 ---------- */
        .center-tooltip {
            position: absolute; top: 122px; left: 50%; transform: translateX(-50%);
            padding: 6px 16px; font-size: 12.5px; font-weight: bold;
            color: #9db1cf; border-radius: 30px;
            pointer-events: none; z-index: 5;
            transition: opacity .5s ease; white-space: nowrap;
            background: rgba(10, 16, 28, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        body.light-mode .center-tooltip {
            color: #555; background: rgba(255, 255, 255, 0.7);
            border-color: rgba(0, 0, 0, 0.06);
        }

        /* ---------- 하단 중앙 글래스 캡슐 바 ---------- */
        .bottom-control-bar {
            position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; gap: 6px;
            padding: 6px 12px; z-index: 10;
        }
        .control-capsule-btn {
            display: flex; align-items: center; gap: 6px;
            padding: 8px 16px; border-radius: 999px; border: none;
            background: transparent; color: #e6edf9;
            font-size: 13px; font-weight: bold; font-family: inherit;
            cursor: pointer; transition: all .2s; white-space: nowrap;
        }
        body.light-mode .control-capsule-btn { color: #1c1c1e; }
        .control-capsule-btn:hover { background: rgba(255, 255, 255, 0.15); }
        body.light-mode .control-capsule-btn:hover { background: rgba(0, 0, 0, 0.06); }
        .control-capsule-btn.primary {
            background: #0a84ff; color: #fff;
            box-shadow: 0 4px 12px rgba(10, 132, 255, 0.35);
        }
        .control-capsule-btn.primary:hover { background: #0077ed; }

        /* ---------- 우측 하단 실험 조절 패널 (고대비 시인성 개선) ---------- */
        #side-ctrl,
        body #side-ctrl.side-ctrl-panel,
        body.dark-mode #side-ctrl.side-ctrl-panel {
            position: fixed !important; right: 20px !important; bottom: 74px !important;
            width: 280px !important; padding: 14px 16px !important;
            display: flex !important; flex-direction: column !important; gap: 10px !important; z-index: 85 !important;
            max-height: calc(100vh - 160px) !important;
            overflow-y: auto !important;
            background: rgba(13, 20, 36, 0.94) !important;
            border: 1px solid rgba(255, 255, 255, 0.22) !important;
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.6) !important;
            color: #ffffff !important;
            border-radius: 18px !important;
            backdrop-filter: blur(20px) !important;
            -webkit-backdrop-filter: blur(20px) !important;
        }
        body.light-mode #side-ctrl,
        body.light-mode #side-ctrl.side-ctrl-panel {
            background: rgba(255, 255, 255, 0.95) !important;
            border: 1px solid rgba(0, 0, 0, 0.12) !important;
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.12) !important;
            color: #111827 !important;
        }

        #side-ctrl .panel-header {
            display: flex !important; align-items: center !important; justify-content: space-between !important;
            padding-bottom: 6px !important; border-bottom: 1px solid rgba(255, 255, 255, 0.15) !important;
        }
        body.light-mode #side-ctrl .panel-header {
            border-bottom-color: rgba(0, 0, 0, 0.08) !important;
        }
        #side-ctrl .panel-title {
            font-size: 12.5px !important; font-weight: 800 !important;
            color: #7cc0ff !important; letter-spacing: .2px !important;
            text-align: left !important; margin: 0 !important; padding: 0 !important; border: none !important;
        }
        body.light-mode #side-ctrl .panel-title {
            color: #007aff !important;
        }

        #side-ctrl .ctrl-group { display: flex !important; flex-direction: column !important; gap: 6px !important; }
        #side-ctrl .ctrl-label {
            font-size: 11.5px !important; font-weight: 700 !important;
            color: #ffffff !important; letter-spacing: -0.2px !important;
        }
        body.light-mode #side-ctrl .ctrl-label {
            color: #1f2937 !important;
        }

        #side-ctrl .btn-tab-group { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 6px !important; width: 100% !important; }
        #side-ctrl .btn-tab-group.three { grid-template-columns: 1fr 1fr 1fr !important; }

        #side-ctrl .tile-btn {
            display: inline-flex !important; align-items: center !important; justify-content: center !important;
            padding: 8px 6px !important; min-height: 36px !important; border-radius: 10px !important;
            background: rgba(35, 45, 68, 0.85) !important;
            border: 1px solid rgba(255, 255, 255, 0.22) !important;
            color: #ffffff !important; font-size: 11.5px !important; font-weight: 700 !important;
            font-family: inherit !important; cursor: pointer !important; transition: all .2s !important;
            text-align: center !important; white-space: nowrap !important;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15) !important;
        }
        #side-ctrl .tile-btn:hover:not(.active) {
            background: rgba(55, 70, 105, 0.95) !important;
            color: #ffffff !important;
            border-color: rgba(255, 255, 255, 0.35) !important;
        }
        #side-ctrl .tile-btn.active {
            background: #0a84ff !important;
            color: #ffffff !important;
            border-color: #0a84ff !important;
            box-shadow: 0 2px 10px rgba(10, 132, 255, 0.45) !important;
        }

        body.light-mode #side-ctrl .tile-btn {
            background: #f1f5f9 !important;
            border-color: #cbd5e1 !important;
            color: #1e293b !important;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04) !important;
        }
        body.light-mode #side-ctrl .tile-btn:hover:not(.active) {
            background: #e2e8f0 !important;
            color: #0f172a !important;
        }
        body.light-mode #side-ctrl .tile-btn.active {
            background: #007aff !important;
            border-color: #007aff !important;
            color: #ffffff !important;
            box-shadow: 0 2px 10px rgba(0, 122, 255, 0.35) !important;
        }

        #side-ctrl .slider-row {
            display: flex !important; justify-content: space-between !important; align-items: center !important;
            font-size: 11.5px !important; font-weight: 700 !important; color: #ffffff !important;
        }
        #side-ctrl .slider-row span:first-child {
            color: #ffffff !important; font-weight: 700 !important;
        }
        #side-ctrl .slider-row span:last-child,
        #side-ctrl #speed-val {
            color: #7cc0ff !important; font-weight: 800 !important;
        }
        body.light-mode #side-ctrl .slider-row,
        body.light-mode #side-ctrl .slider-row span:first-child {
            color: #1f2937 !important;
        }
        body.light-mode #side-ctrl .slider-row span:last-child,
        body.light-mode #side-ctrl #speed-val {
            color: #007aff !important;
        }
        #side-ctrl input[type="range"] {
            width: 100% !important; height: 20px !important; accent-color: #0a84ff !important; cursor: pointer !important; margin: 2px 0 0 !important;
        }

        #side-ctrl .toggle-row {
            display: flex !important; justify-content: space-between !important; align-items: center !important;
            font-size: 11.5px !important; font-weight: 700 !important; color: #ffffff !important;
        }
        #side-ctrl .toggle-row span {
            color: #ffffff !important; font-weight: 700 !important;
        }
        body.light-mode #side-ctrl .toggle-row,
        body.light-mode #side-ctrl .toggle-row span {
            color: #1f2937 !important;
        }
        #side-ctrl .mini-toggle {
            padding: 4px 10px !important; border-radius: 999px !important;
            border: 1px solid rgba(255, 255, 255, 0.25) !important;
            background: rgba(35, 45, 68, 0.8) !important;
            color: #cbd5e1 !important; font-size: 11px !important; font-weight: 700 !important;
            cursor: pointer !important; font-family: inherit !important; transition: all .2s !important;
        }
        #side-ctrl .mini-toggle.on {
            background: #0a84ff !important; color: #ffffff !important; border-color: #0a84ff !important;
            box-shadow: 0 2px 8px rgba(10, 132, 255, 0.4) !important;
        }
        body.light-mode #side-ctrl .mini-toggle {
            background: #f1f5f9 !important; border-color: #cbd5e1 !important; color: #64748b !important;
        }
        body.light-mode #side-ctrl .mini-toggle.on {
            background: #007aff !important; border-color: #007aff !important; color: #ffffff !important;
        }

        /* ---------- 행성 상세 정보 모달 카드 ---------- */
        #planet-detail-card {
            position: fixed; left: 20px; bottom: 74px;
            width: 320px; padding: 18px 20px;
            display: none; flex-direction: column; gap: 12px; z-index: 100;
            max-height: calc(100vh - 160px);
            overflow-y: auto;
            animation: slideUp .25s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #planet-detail-card.show { display: flex; }
        .detail-top { display: flex; align-items: center; justify-content: space-between; }
        .detail-title-wrap { display: flex; align-items: center; gap: 8px; }
        .planet-icon-lg { font-size: 26px; line-height: 1; }
        .detail-name { font-size: 18px; font-weight: 900; letter-spacing: -0.5px; }
        .detail-en { font-size: 12px; color: #8fa0ba; font-weight: bold; margin-left: 2px; }
        .detail-badge {
            font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 999px;
            background: rgba(10, 132, 255, 0.25); color: #7cc0ff; border: 1px solid rgba(10, 132, 255, 0.4);
        }
        .detail-badge.terrestrial { background: rgba(245, 166, 35, 0.25); color: #ffbe53; border-color: rgba(245, 166, 35, 0.45); }
        .detail-badge.jovian { background: rgba(10, 132, 255, 0.25); color: #7cc0ff; border-color: rgba(10, 132, 255, 0.4); }
        .detail-close-btn {
            background: none; border: none; color: #8fa0ba; font-size: 18px;
            cursor: pointer; padding: 4px; line-height: 1; font-family: inherit;
        }
        .detail-close-btn:hover { color: #fff; }

        .metrics-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
            background: rgba(255, 255, 255, 0.05); padding: 10px; border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        body.light-mode .metrics-grid {
            background: rgba(0, 0, 0, 0.03); border-color: rgba(0, 0, 0, 0.06);
        }
        .metric-box { display: flex; flex-direction: column; gap: 2px; }
        .metric-label { font-size: 10px; color: #8fa0ba; font-weight: bold; }
        body.light-mode .metric-label { color: #6b7280; }
        .metric-val { font-size: 12px; font-weight: bold; color: #f2f5fa; }
        body.light-mode .metric-val { color: #1c1c1e; }

        .features-wrap { display: flex; flex-direction: column; gap: 6px; }
        .features-title { font-size: 11.5px; font-weight: bold; color: #7cc0ff; }
        body.light-mode .features-title { color: #007aff; }
        .feature-item {
            font-size: 11.5px; line-height: 1.5; color: #cfdcf0;
            padding-left: 12px; position: relative; word-break: keep-all;
        }
        body.light-mode .feature-item { color: #374151; }
        .feature-item::before {
            content: '•'; position: absolute; left: 2px; top: 0; color: #0a84ff; font-weight: bold;
        }

        .detail-nav-row { display: flex; gap: 6px; margin-top: 4px; }
        .detail-action-btn {
            flex: 1; padding: 7px 0; border-radius: 10px; border: none;
            background: rgba(255, 255, 255, 0.1); color: #e6edf9;
            font-size: 11.5px; font-weight: bold; font-family: inherit;
            cursor: pointer; transition: all .2s; text-align: center;
        }
        body.light-mode .detail-action-btn { background: #e2e8f0; color: #1c1c1e; }
        .detail-action-btn:hover { background: #0a84ff; color: #fff; }

        /* ---------- 우측 하단 전체화면 바 ---------- */
        .bottom-right-bar {
            position: absolute; bottom: 24px; right: 20px;
            display: flex; align-items: center; gap: 10px; z-index: 10;
        }

        /* 반응형 모바일 최적화 */
        @media (max-width: 768px) {
            .top-left-bar { top: 12px; left: 12px; gap: 6px; }
            .back-btn { padding: 6px 12px; font-size: 12px; }
            .tag-badge { padding: 6px 12px; font-size: 12px; }
            .top-right-bar { top: 12px; right: 12px; gap: 6px; }
            .planet-nav-bar { top: 58px; padding: 4px 8px; gap: 4px; }
            .p-nav-btn { padding: 4px 8px; font-size: 11px; }
            .center-tooltip { display: none; }
            
            .side-ctrl-panel {
                right: 12px; bottom: 76px; width: 230px; padding: 12px;
            }
            #planet-detail-card {
                left: 12px; right: 12px; bottom: 76px; width: auto; max-height: 48vh; padding: 14px;
            }
            .bottom-control-bar { bottom: 16px; }
            .control-capsule-btn { padding: 6px 12px; font-size: 11.5px; }
            .bottom-right-bar { bottom: 16px; right: 12px; }
        }
    </style>
</head>
<body class="dark-mode">

<div id="canvas-container"></div>

<!-- 상단 좌측 바: 뒤로가기 & 타이틀 -->
<div class="top-left-bar">
    <a href="../../../index.html" class="back-btn glass-panel" aria-label="메인 페이지로 이동">← 메인</a>
    <div class="tag-badge glass-panel">
        <span class="title-text">태양계 3D</span>
        <span class="vision-badge">지구과학</span>
    </div>
</div>

<!-- 상단 우측 바: 테마 토글 등 -->
<div class="top-right-bar">
    <button class="icon-btn glass-panel" id="bTheme" title="주간 모드로 전환" aria-label="테마 전환">☀️</button>
</div>

<!-- 행성 퀵 네비게이터 바 -->
<div class="planet-nav-bar glass-panel" id="planet-nav">
    <button class="p-nav-btn active" data-id="all">🌌 전체</button>
    <button class="p-nav-btn" data-id="sun">☀️ 태양</button>
    <button class="p-nav-btn" data-id="mercury">☿ 수성</button>
    <button class="p-nav-btn" data-id="venus">♀ 금성</button>
    <button class="p-nav-btn" data-id="earth">♁ 지구</button>
    <button class="p-nav-btn" data-id="mars">♂ 화성</button>
    <button class="p-nav-btn" data-id="jupiter">♃ 목성</button>
    <button class="p-nav-btn" data-id="saturn">♄ 토성</button>
    <button class="p-nav-btn" data-id="uranus">♅ 천왕성</button>
    <button class="p-nav-btn" data-id="neptune">♆ 해왕성</button>
</div>

<div class="center-tooltip" id="hint-tip">💡 행성이나 이름표를 클릭하면 확대되어 상세한 특징을 살펴볼 수 있습니다.</div>

<!-- 행성 상세 정보 모달 카드 -->
<div class="glass-panel" id="planet-detail-card">
    <div class="detail-top">
        <div class="detail-title-wrap">
            <span class="planet-icon-lg" id="detail-icon">🪐</span>
            <div>
                <span class="detail-name" id="detail-name">목성</span>
                <span class="detail-en" id="detail-en">Jupiter</span>
            </div>
            <span class="detail-badge" id="detail-badge">목성형 행성</span>
        </div>
        <button class="detail-close-btn" id="detail-close" title="닫기 (전체보기)">✕</button>
    </div>

    <div class="metrics-grid">
        <div class="metric-box">
            <span class="metric-label">반지름 (크기)</span>
            <span class="metric-val" id="val-radius">69,911 km (지구 11.2배)</span>
        </div>
        <div class="metric-box">
            <span class="metric-label">태양과의 거리</span>
            <span class="metric-val" id="val-dist">5.20 AU (약 7.8억 km)</span>
        </div>
        <div class="metric-box">
            <span class="metric-label">공전 주기</span>
            <span class="metric-val" id="val-orbit">11.86년</span>
        </div>
        <div class="metric-box">
            <span class="metric-label">자전 주기 (기울기)</span>
            <span class="metric-val" id="val-rot">9시간 56분 (3.1°)</span>

    // 2. 텍스처 절차적 생성 함수군 (고화질 2D 캔버스 기반)
    function createSunTexture() {
        const c = document.createElement('canvas');
        c.width = 512; c.height = 256;
        const ctx = c.getContext('2d');
        const g = ctx.createLinearGradient(0, 0, 0, 256);
        g.addColorStop(0, '#ff9015');
        g.addColorStop(0.5, '#ffd242');
        g.addColorStop(1, '#ff7c05');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 512, 256);

        // 쌀알 무늬 및 흑점
        for (let i = 0; i < 400; i++) {
            ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.18)' : 'rgba(220,100,0,0.18)';
            ctx.beginPath();
            ctx.arc(Math.random() * 512, Math.random() * 256, 1 + Math.random() * 3, 0, Math.PI * 2);
            ctx.fill();
        }
        // 대표 흑점 군집
        const spots = [[180, 110, 8], [195, 115, 5], [320, 140, 10], [335, 138, 6]];
        spots.forEach(s => {
            ctx.fillStyle = 'rgba(100, 30, 0, 0.85)';
            ctx.beginPath();
            ctx.arc(s[0], s[1], s[2], 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(40, 10, 0, 0.95)';
            ctx.beginPath();
            ctx.arc(s[0], s[1], s[2] * 0.5, 0, Math.PI * 2);
            ctx.fill();
        });
        return new THREE.CanvasTexture(c);
    }

    function createCoronaGlowTexture() {
        const c = document.createElement('canvas');
        c.width = 256; c.height = 256;
        const ctx = c.getContext('2d');
        const g = ctx.createRadialGradient(128, 128, 10, 128, 128, 128);
        g.addColorStop(0, 'rgba(255, 250, 210, 1)');
        g.addColorStop(0.2, 'rgba(255, 200, 70, 0.7)');
        g.addColorStop(0.55, 'rgba(255, 140, 30, 0.22)');
        g.addColorStop(1, 'rgba(255, 100, 20, 0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 256, 256);
        return new THREE.CanvasTexture(c);
    }

    function createMercuryTexture() {
        const c = document.createElement('canvas');
        c.width = 512; c.height = 256;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#8a8c92';
        ctx.fillRect(0, 0, 512, 256);
        // 암석 노이즈 & 크레이터
        for (let i = 0; i < 200; i++) {
            const x = Math.random() * 512, y = Math.random() * 256;
            const r = 2 + Math.random() * 10;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(60,62,68,' + (0.3 + Math.random() * 0.4) + ')';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x - r * 0.2, y - r * 0.2, r * 0.35, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(210,214,220,0.5)';
            ctx.fill();
        }
        return new THREE.CanvasTexture(c);
    }

    // 3. 스프라이트 텍스트 라벨 제작
    function makeLabel(text, color, scale, bg) {
        const fs = 56;
        const cv = document.createElement('canvas');
        const ctx = cv.getContext('2d');
        const font = "bold " + fs + "px 'SeoulNamsan', 'Apple SD Gothic Neo', sans-serif";
        ctx.font = font;
        const tm = ctx.measureText(text);
        const padX = 32, padY = 16;
        cv.width = Math.ceil(tm.width + padX * 2);
        cv.height = Math.ceil(fs + padY * 2);

        ctx.font = font;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        if (bg) {
            ctx.fillStyle = bg;
            const r = 18;
            ctx.beginPath();
            ctx.moveTo(r, 0);
            ctx.lineTo(cv.width - r, 0); ctx.quadraticCurveTo(cv.width, 0, cv.width, r);
            ctx.lineTo(cv.width, cv.height - r); ctx.quadraticCurveTo(cv.width, cv.height, cv.width - r, cv.height);
            ctx.lineTo(r, cv.height); ctx.quadraticCurveTo(0, cv.height, 0, cv.height - r);
            ctx.lineTo(0, r); ctx.quadraticCurveTo(0, 0, r, 0);
            ctx.closePath();
            ctx.fill();
        }
        ctx.fillStyle = color || '#ffffff';
        ctx.fillText(text, cv.width / 2, cv.height / 2 + 2);

        const tex = new THREE.CanvasTexture(cv);
        tex.minFilter = THREE.LinearFilter;
        const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
        const sp = new THREE.Sprite(mat);
        const wpp = 0.006 * (scale || 1);
        sp.scale.set(cv.width * wpp, cv.height * wpp, 1);
        sp.userData = { text: text, cv: cv };
        return sp;
    }

    // 4. Three.js 씬 초기화
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030612);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    const CAM_OVERVIEW = { pos: new THREE.Vector3(0, 95, 125), target: new THREE.Vector3(0, 0, 0) };

    // 크기 비교 모드 전용 카메라 기준값
    // 태양(중심 -84, 반지름 24) 왼쪽 끝 ~ 해왕성(중심 62, 반지름 3.5) 오른쪽 끝 구간을 화면에 담는다.
    const SCALE_VIEW_X_LEFT = -108;   // 태양 왼쪽 끝
    const SCALE_VIEW_X_RIGHT = 65.5;  // 해왕성 오른쪽 끝
    const SCALE_VIEW_HALF_HEIGHT = 30; // 세로로 확보해야 하는 반높이(태양 반지름+이름표 여백)
    const SCALE_VIEW_MIN_DIST = 92.8; // 너무 가까이 붙지 않게 하는 최소 거리

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });

    // 5. 조명 & 우주 배경 (별 무리)
    const sunLight = new THREE.PointLight(0xfff8ea, 2.4, 500, 0.6);

    // 우주 배경 성운/별 파티클
    (function createStarfield() {
        const starGeo = new THREE.BufferGeometry();
        const cnt = 2500;
        const pos = new Float32Array(cnt * 3);
        const colors = new Float32Array(cnt * 3);
        for (let i = 0; i < cnt; i++) {
            const rad = 280 + Math.random() * 200;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            pos[i * 3] = rad * Math.sin(phi) * Math.cos(theta);
            pos[i * 3 + 1] = rad * Math.sin(phi) * Math.sin(theta);
            pos[i * 3 + 2] = rad * Math.cos(phi);

            // 별 색상 약간의 베리에이션 (청백색, 황백색, 백색)
            const rnd = Math.random();
            if (rnd > 0.8) { colors[i * 3] = 0.8; colors[i * 3 + 1] = 0.9; colors[i * 3 + 2] = 1.0; }
            else if (rnd > 0.6) { colors[i * 3] = 1.0; colors[i * 3 + 1] = 0.9; colors[i * 3 + 2] = 0.7; }
            else { colors[i * 3] = 1.0; colors[i * 3 + 1] = 1.0; colors[i * 3 + 2] = 1.0; }
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        starGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        const starMat = new THREE.PointsMaterial({ size: 1.3, vertexColors: true, transparent: true, opacity: 0.85 });
        scene.add(new THREE.Points(starGeo, starMat));
    })();

    // 6. 태양 생성
    const sunGroup = new THREE.Group();

    // 7. 8개 행성 객체 생성 및 궤도선 구성
    const planetObjects = [];
    const orbitLines = [];
    const interactiveMeshes = [sunMesh];
    sunMesh.userData = { id: 'sun', isPlanet: true };

    PLANET_DATA.forEach(data => {
        const pObj = {

        };

        scene.add(pObj.orbitGroup);
        pObj.orbitGroup.add(pObj.planetPivot);
        pObj.planetPivot.add(pObj.tiltGroup);

        // 궤도선 (Circle / LineLoop)
        const curvePts = [];
        const segs = 128;
        for (let i = 0; i <= segs; i++) {
            const th = (i / segs) * Math.PI * 2;
            curvePts.push(new THREE.Vector3(Math.cos(th) * data.orbitR, 0, Math.sin(th) * data.orbitR));
        }
        const orbitGeo = new THREE.BufferGeometry().setFromPoints(curvePts);
        const orbitMat = new THREE.LineBasicMaterial({

        const orbitLine = new THREE.LineLoop(orbitGeo, orbitMat);
        scene.add(orbitLine);

        pObj.orbitLine = orbitLine;

        // 텍스처 선택
        let tex = null;
        if (data.id === 'mercury') tex = createMercuryTexture();
        else if (data.id === 'venus') tex = createVenusTexture();
        else if (data.id === 'earth') tex = createEarthTexture();
        else if (data.id === 'mars') tex = createMarsTexture();
        else if (data.id === 'jupiter') tex = createJupiterTexture();
        else if (data.id === 'saturn') tex = createSaturnTexture();
        else if (data.id === 'uranus') tex = createUranusTexture();
        else if (data.id === 'neptune') tex = createNeptuneTexture();

        const pMat = new THREE.MeshStandardMaterial({
            map: tex, roughness: 0.8, metalness: 0.08
        });
        const pMesh = new THREE.Mesh(new THREE.SphereGeometry(data.meshR, 48, 36), pMat);
        pMesh.userData = { id: data.id, isPlanet: true };
        pObj.mesh = pMesh;
        interactiveMeshes.push(pMesh);

        // 자전축 기울기 적용
        pObj.tiltGroup.rotation.z = (data.tilt * Math.PI) / 180;
        pObj.tiltGroup.add(pMesh);

        // 지구 특화: 구름 레이어 & 달
        if (data.id === 'earth') {
            const cMat = new THREE.MeshStandardMaterial({
                map: createEarthCloudTexture(), transparent: true, opacity: 0.4, depthWrite: false
            });
            const cMesh = new THREE.Mesh(new THREE.SphereGeometry(data.meshR * 1.025, 48, 36), cMat);

            // 달 (Moon)
            const moonPivot = new THREE.Group();
            const moonMat = new THREE.MeshStandardMaterial({ map: createMoonTexture(), roughness: 0.9 });
            const moonMesh = new THREE.Mesh(new THREE.SphereGeometry(0.38, 32, 24), moonMat);
            moonMesh.position.set(3.4, 0, 0);
            moonPivot.add(moonMesh);
            pObj.planetPivot.add(moonPivot);
            pObj.moonPivot = moonPivot;
        }

        // 토성 고리
        if (data.id === 'saturn') {
            const innerR = data.meshR * 1.35;
            const outerR = data.meshR * 2.45;
            const ringGeo = new THREE.RingGeometry(innerR, outerR, 64);
            // Ring UV 매핑
            const pos = ringGeo.attributes.position;
            const v3 = new THREE.Vector3();
            for (let i = 0; i < pos.count; i++) {
                v3.fromBufferAttribute(pos, i);
                ringGeo.attributes.uv.setXY(i, (v3.length() - innerR) / (outerR - innerR), 0.5);
            }
            const ringMat = new THREE.MeshStandardMaterial({
                map: createSaturnRingTexture(), side: THREE.DoubleSide, transparent: true, opacity: 0.95, roughness: 0.7
            });
            const ringMesh = new THREE.Mesh(ringGeo, ringMat);

            pObj.tiltGroup.add(ringMesh);

    // 행성별 실제 크기(토성 고리 포함)를 반영한 크기 비교 모드 전용 X 좌표
    // 목성·토성·천왕성처럼 반지름이 큰 행성은 간격을 넓게, 지구형 행성은 촘촘하게 배치한다.
    const SCALE_MODE_POS_X = {
        mercury: -46, venus: -38, earth: -29, mars: -20,
        jupiter: -4, saturn: 24, uranus: 48, neptune: 62
    };

    // 8. 상태 변수군
    let currentMode = 'orbit'; // 'orbit' | 'scale'
    let currentFilter = 'all'; // 'all' | 'terrestrial' | 'jovian'
    let orbitSpeedMult = 1.0;
    let isPaused = false;
    let showOrbits = true;
    let showLabels = true;
    let showAxes = true;

    // 포커스 & 카메라 트윈
    let focusedPlanetId = null; // null: overview, 'sun' or planet id
    let camTargetPos = new THREE.Vector3();
    let camTargetLook = new THREE.Vector3();
    let isTransitioning = false;
    let transitionProgress = 0;
    const startCamPos = new THREE.Vector3();
    const startCamLook = new THREE.Vector3();

    // 9. 위치 갱신 및 시뮬레이션 루프
    const clock = new THREE.Clock();

    function updatePlanets(delta) {
        // 태양 자전
        sunMesh.rotation.y += 0.004;

        planetObjects.forEach(pObj => {
            const d = pObj.data;

            if (currentMode === 'orbit') {
                // 공전 각도 갱신
                if (!isPaused) {
                    pObj.angle += delta * 0.35 * d.orbitSpeed * orbitSpeedMult;
                }
                const px = Math.cos(pObj.angle) * d.orbitR;
                const pz = Math.sin(pObj.angle) * d.orbitR;
                pObj.planetPivot.position.set(px, 0, pz);

                // 스케일 복원
                pObj.mesh.scale.set(1, 1, 1);
                if (pObj.cloudMesh) pObj.cloudMesh.scale.set(1, 1, 1);
                if (pObj.ringMesh) pObj.ringMesh.scale.set(1, 1, 1);
                if (pObj.axisLine) pObj.axisLine.scale.set(1, 1, 1);
            } else if (currentMode === 'scale') {
                // 크기 비교 모드: X축으로 나란히 정렬 & 상대 크기 반영
                const idx = PLANET_DATA.findIndex(p => p.id === d.id);
                // 행성별 고유 좌표(겹침 방지)로 배치, 미등록 행성은 기존 간격식으로 대체
                const spacingX = (SCALE_MODE_POS_X[d.id] !== undefined) ? SCALE_MODE_POS_X[d.id] : (-32 + idx * 9.2);
                pObj.planetPivot.position.set(spacingX, 0, 0);

                const sc = d.sizeScaleR / d.meshR;
                pObj.mesh.scale.set(sc, sc, sc);
                // 구름층·고리·자전축도 본체와 같은 비율로 확대(겹침·비율 어긋남 방지)
                if (pObj.cloudMesh) pObj.cloudMesh.scale.set(sc, sc, sc);
                if (pObj.ringMesh) pObj.ringMesh.scale.set(sc, sc, sc);
                if (pObj.axisLine) pObj.axisLine.scale.set(sc, sc, sc);
            }

            // 행성 자전
            if (!isPaused) {
                pObj.mesh.rotation.y += d.rotSpeed * (1 + orbitSpeedMult * 0.2);
                if (pObj.cloudMesh) pObj.cloudMesh.rotation.y += d.rotSpeed * 1.25;
                if (pObj.moonPivot) pObj.moonPivot.rotation.y += delta * 1.5;
            }

            // 라벨 위치 동기화
            if (pObj.label) {
                pObj.label.visible = showLabels && (currentFilter === 'all' || (currentFilter === 'terrestrial' && d.type === '지구형 행성') || (currentFilter === 'jovian' && d.type === '목성형 행성'));
                const curR = (currentMode === 'scale') ? d.sizeScaleR : d.meshR;
                pObj.label.position.set(0, curR + 1.6, 0);
            }
            if (pObj.axisLine) {
                pObj.axisLine.visible = showAxes;
            }

            // 필터링에 따른 투명도/하이라이트 처리
            let targetOpacity = 1.0;
            if (currentFilter === 'terrestrial') {
                targetOpacity = (d.type === '지구형 행성') ? 1.0 : 0.15;
            } else if (currentFilter === 'jovian') {
                targetOpacity = (d.type === '목성형 행성') ? 1.0 : 0.15;
            }
            pObj.mesh.material.opacity = targetOpacity;
            pObj.mesh.material.transparent = targetOpacity < 1.0;
            if (pObj.orbitLine) {
                pObj.orbitLine.visible = showOrbits && (currentMode === 'orbit') && (targetOpacity > 0.5);
            }
        });

        // 태양 및 광원 위치 동기화 (크기 비교 모드 시 태양 대면 정상 조명)
        if (currentMode === 'scale') {
            sunGroup.position.set(-84, 0, 0);
            sunMesh.scale.set(SUN_DATA.sizeScaleR / SUN_DATA.meshR, SUN_DATA.sizeScaleR / SUN_DATA.meshR, SUN_DATA.sizeScaleR / SUN_DATA.meshR);
            sunGlow.scale.set(SUN_DATA.sizeScaleR * 3.5, SUN_DATA.sizeScaleR * 3.5, 1);
            sunLabel.position.set(0, SUN_DATA.sizeScaleR + 2, 0);
            sunLight.position.set(-84, 0, 0);
            sunLight.distance = 600;
        } else {
            sunGroup.position.set(0, 0, 0);
            sunMesh.scale.set(1, 1, 1);
            sunGlow.scale.set(SUN_DATA.meshR * 3.8, SUN_DATA.meshR * 3.8, 1);
            sunLabel.position.set(0, SUN_DATA.meshR + 2, 0);
            sunLight.position.set(0, 0, 0);
            sunLight.distance = 500;
        }
    }

    // 10. 부드러운 카메라 트랜지션 (Lerp)
    function updateCamera(delta) {
        if (isTransitioning) {
            transitionProgress += delta * 1.8;
            if (transitionProgress >= 1) {
                transitionProgress = 1;
                isTransitioning = false;
            }
            // easeInOutCubic
            const t = transitionProgress < 0.5 ? 4 * transitionProgress * transitionProgress * transitionProgress : 1 - Math.pow(-2 * transitionProgress + 2, 3) / 2;
            camera.position.lerpVectors(startCamPos, camTargetPos, t);
            controls.target.lerpVectors(startCamLook, camTargetLook, t);
        } else if (focusedPlanetId && currentMode === 'orbit') {
            // 포커스 중인 행성이 공전함에 따라 카메라 타깃도 부드럽게 추종
            if (focusedPlanetId === 'sun') {
                controls.target.set(0, 0, 0);
            } else {
                const targetObj = planetObjects.find(p => p.data.id === focusedPlanetId);
                if (targetObj) {
                    const worldPos = new THREE.Vector3();
                    targetObj.planetPivot.getWorldPosition(worldPos);
                    const diff = new THREE.Vector3().subVectors(worldPos, controls.target);
                    controls.target.copy(worldPos);
                    camera.position.add(diff);
                }
            }
        }
        controls.update();
    }

    function animate() {
        requestAnimationFrame(animate);
        const delta = Math.min(clock.getDelta(), 0.1);
        updatePlanets(delta);
        updateCamera(delta);
        renderer.render(scene, camera);
    }
    animate();

    // 11. 행성 포커스 & 모달 카드 연동
    const detailCard = document.getElementById('planet-detail-card');
    const detailIcon = document.getElementById('detail-icon');
    const detailName = document.getElementById('detail-name');
    const detailEn = document.getElementById('detail-en');
    const detailBadge = document.getElementById('detail-badge');
    const valRadius = document.getElementById('val-radius');
    const valDist = document.getElementById('val-dist');
    const valOrbit = document.getElementById('val-orbit');
    const valRot = document.getElementById('val-rot');
    const valTemp = document.getElementById('val-temp');
    const valMoons = document.getElementById('val-moons');
    const featuresList = document.getElementById('features-list');

    // 크기 비교 모드 카메라 위치 계산
    // 태양과 8개 행성이 겹치지 않고 화면 안에 모두 들어오도록, 화면 비율과
    // 우측 조절 패널이 가리는 폭까지 고려해 위치·거리를 정한다.
    function getScaleModeView() {
        const vw = window.innerWidth, vh = window.innerHeight;
        const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
        const tanH = Math.max(0.05, tanV * camera.aspect);
        let usableW = vw;
        const panelEl = document.getElementById('side-ctrl');
        if (panelEl && vw > 768) {
            const pr = panelEl.getBoundingClientRect();
            if (pr.width > 0 && pr.height > 0 && pr.top < vh * 0.62) {
                usableW = Math.min(usableW, pr.left - 12);
            }
        }
        usableW = Math.max(vw * 0.5, usableW);
        const margin = 14;
        const rowSpan = SCALE_VIEW_X_RIGHT - SCALE_VIEW_X_LEFT;
        const pxPerUnit = Math.max(0.1, (usableW - margin * 2) / rowSpan);
        const targetX = SCALE_VIEW_X_LEFT + (vw / 2 - margin) / pxPerUnit;
        const distForWidth = (vw / 2) / (pxPerUnit * tanH);
        const distForHeight = SCALE_VIEW_HALF_HEIGHT / tanV;
        const dist = Math.max(SCALE_VIEW_MIN_DIST, distForWidth, distForHeight);
        const target = new THREE.Vector3(targetX, 0, 0);
        const dir = new THREE.Vector3(0, 12, 92).normalize();
        return { pos: target.clone().add(dir.multiplyScalar(dist)), target: target };
    }

    function focusOnObject(id) {
        focusedPlanetId = id;

        // 퀵 네브 바 버튼 활성화
        document.querySelectorAll('.p-nav-btn').forEach(btn => {
            btn.classList.toggle('active', btn.getAttribute('data-id') === id);
        });

        if (id === 'all' || !id) {
            focusedPlanetId = null;
            detailCard.classList.remove('show');
            if (currentMode === 'scale') {
                const scaleView = getScaleModeView();
                startTransition(scaleView.pos, scaleView.target);
            } else {
                startTransition(CAM_OVERVIEW.pos, CAM_OVERVIEW.target);
            }
            return;
        }

        let targetData = null;
        let targetWorldPos = new THREE.Vector3();
        let targetMeshR = 2.0;

        if (id === 'sun') {
            targetData = SUN_DATA;
            sunGroup.getWorldPosition(targetWorldPos);
            targetMeshR = SUN_DATA.meshR;
        } else {
            const pObj = planetObjects.find(p => p.data.id === id);
            if (!pObj) return;
            targetData = pObj.data;
            pObj.planetPivot.getWorldPosition(targetWorldPos);
            targetMeshR = (currentMode === 'scale') ? targetData.sizeScaleR : targetData.meshR;
        }

        // 상세 모달 카드 채우기
        detailIcon.textContent = targetData.symbol;
        detailName.textContent = targetData.name;
        detailEn.textContent = targetData.enName + (targetData.hanja ? ' · ' + targetData.hanja : '');
        detailBadge.textContent = targetData.type;
        detailBadge.className = 'detail-badge ' + targetData.badgeClass;

        valRadius.textContent = targetData.realR;
        valDist.textContent = targetData.realDist;
        valOrbit.textContent = targetData.orbitPeriod;
        valRot.textContent = targetData.rotPeriod;
        valTemp.textContent = targetData.temp;
        valMoons.textContent = targetData.moons;

        featuresList.innerHTML = '';
        targetData.features.forEach(f => {
            const item = document.createElement('div');
            item.className = 'feature-item';
            item.textContent = f;
            featuresList.appendChild(item);
        });
        detailCard.classList.add('show');

        // 카메라 줌인 타깃 위치 계산 (행성 바로 앞 비스듬한 뷰)
        const zoomDist = targetMeshR * (targetData.hasRings ? 4.2 : 3.4);
        const camPos = new THREE.Vector3(
            targetWorldPos.x + zoomDist * 0.7,
            targetWorldPos.y + zoomDist * 0.45,
            targetWorldPos.z + zoomDist * 0.7
        );
        startTransition(camPos, targetWorldPos);
    }

    function startTransition(toPos, toLook) {
        startCamPos.copy(camera.position);
        startCamLook.copy(controls.target);
        camTargetPos.copy(toPos);
        camTargetLook.copy(toLook);
        transitionProgress = 0;
        isTransitioning = true;
    }

    // 12. 3D 클릭 & 레이캐스팅 (마우스 / 터치)
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let downPos = { x: 0, y: 0 };

    window.addEventListener('pointerdown', e => {
        downPos.x = e.clientX;
        downPos.y = e.clientY;
    });

    window.addEventListener('pointerup', e => {
        const dist = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
        if (dist > 6) return; // 드래그 회전인 경우 클릭 무시

        // UI 요소 클릭은 무시
        if (e.target.closest('.glass-panel') || e.target.closest('button') || e.target.closest('input')) return;

        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);

        const intersects = raycaster.intersectObjects(interactiveMeshes);
        if (intersects.length > 0) {
            const hitMesh = intersects[0].object;
            if (hitMesh.userData && hitMesh.userData.id) {
                focusOnObject(hitMesh.userData.id);
            }
        }
    });

    // 13. UI 이벤트 바인딩
    // 상단 퀵 네브 바
    document.getElementById('planet-nav').addEventListener('click', e => {
        const btn = e.target.closest('.p-nav-btn');
        if (!btn) return;
        const id = btn.getAttribute('data-id');
        focusOnObject(id);
    });

    // 모달 닫기
    document.getElementById('detail-close').addEventListener('click', () => {
        focusOnObject('all');
    });

    // 이전/다음 행성 버튼
    const allPlanetIds = ['sun', 'mercury', 'venus', 'earth', 'mars', 'jupiter', 'saturn', 'uranus', 'neptune'];
    document.getElementById('btn-prev-p').addEventListener('click', () => {
        let curIdx = allPlanetIds.indexOf(focusedPlanetId);
        if (curIdx <= 0) curIdx = allPlanetIds.length - 1;
        else curIdx--;
        focusOnObject(allPlanetIds[curIdx]);
    });
    document.getElementById('btn-next-p').addEventListener('click', () => {
        let curIdx = allPlanetIds.indexOf(focusedPlanetId);
        if (curIdx === -1 || curIdx >= allPlanetIds.length - 1) curIdx = 0;
        else curIdx++;
        focusOnObject(allPlanetIds[curIdx]);
    });

    // 보기 모드 전환 (공전 궤도 vs 크기 비교)
    const btnModeOrbit = document.getElementById('btn-mode-orbit');
    const btnModeScale = document.getElementById('btn-mode-scale');

    btnModeOrbit.addEventListener('click', () => {
        currentMode = 'orbit';
        btnModeOrbit.classList.add('active');
        btnModeScale.classList.remove('active');
        focusOnObject('all');
    });

    btnModeScale.addEventListener('click', () => {
        currentMode = 'scale';
        btnModeScale.classList.add('active');
        btnModeOrbit.classList.remove('active');
        focusedPlanetId = null;
        detailCard.classList.remove('show');
        // 크기 비교 전용 카메라: 태양과 8개 행성이 한눈에 들어오는 위치로 이동
        const scaleView = getScaleModeView();
        startTransition(scaleView.pos, scaleView.target);
    });

    // 행성 분류 필터 (전체 / 지구형 / 목성형)
    const btnFiltAll = document.getElementById('btn-filt-all');
    const btnFiltTerr = document.getElementById('btn-filt-terrestrial');
    const btnFiltJov = document.getElementById('btn-filt-jovian');

    function setFilter(filt) {
        currentFilter = filt;
        btnFiltAll.classList.toggle('active', filt === 'all');
        btnFiltTerr.classList.toggle('active', filt === 'terrestrial');
        btnFiltJov.classList.toggle('active', filt === 'jovian');
    }
    btnFiltAll.addEventListener('click', () => setFilter('all'));
    btnFiltTerr.addEventListener('click', () => setFilter('terrestrial'));
    btnFiltJov.addEventListener('click', () => setFilter('jovian'));

    // 공전 속도 슬라이더
    const speedSlider = document.getElementById('speed-slider');
    const speedVal = document.getElementById('speed-val');
    speedSlider.addEventListener('input', e => {
        orbitSpeedMult = parseFloat(e.target.value);
        speedVal.textContent = orbitSpeedMult.toFixed(1) + 'x';
    });

    // 토글 버튼들
    const togOrbits = document.getElementById('tog-orbits');
    togOrbits.addEventListener('click', () => {
        showOrbits = !showOrbits;
        togOrbits.classList.toggle('on', showOrbits);
        togOrbits.textContent = showOrbits ? 'ON' : 'OFF';
    });

    const togLabels = document.getElementById('tog-labels');
    togLabels.addEventListener('click', () => {
        showLabels = !showLabels;
        togLabels.classList.toggle('on', showLabels);
        togLabels.textContent = showLabels ? 'ON' : 'OFF';
        sunLabel.visible = showLabels;
    });

    const togAxes = document.getElementById('tog-axes');
    togAxes.addEventListener('click', () => {
        showAxes = !showAxes;
        togAxes.classList.toggle('on', showAxes);
        togAxes.textContent = showAxes ? 'ON' : 'OFF';
    });

    // 하단 캡슐 바: 초기화 / 전체 시점 / 일시정지
    document.getElementById('btn-reset').addEventListener('click', () => {
        currentMode = 'orbit';
        btnModeOrbit.classList.add('active');
        btnModeScale.classList.remove('active');
        setFilter('all');
        orbitSpeedMult = 1.0;
        speedSlider.value = 1.0;
        speedVal.textContent = '1.0x';
        isPaused = false;
        document.getElementById('btn-pause').textContent = '⏸️ 정지';
        focusOnObject('all');
    });

    document.getElementById('btn-overview').addEventListener('click', () => {
        focusOnObject('all');
    });

    const btnPause = document.getElementById('btn-pause');
    btnPause.addEventListener('click', () => {
        isPaused = !isPaused;
        btnPause.textContent = isPaused ? '▶ 재생' : '⏸️ 정지';
    });

    // 야간/라이트 테마 전환
    const themeBtn = document.getElementById('bTheme');
    function applyTheme(isDark, save) {
        document.body.classList.toggle('dark-mode', isDark);
        document.body.classList.toggle('light-mode', !isDark);
        if (themeBtn) {
            themeBtn.textContent = isDark ? '☀️' : '🌙';
            themeBtn.setAttribute('title', isDark ? '주간 모드로 전환' : '야간 모드로 전환');
            themeBtn.setAttribute('aria-label', isDark ? '주간 모드로 전환' : '야간 모드로 전환');
        }
        if (scene) {
            scene.background.setHex(isDark ? 0x030612 : 0xeef3f9);
        }
        if (ambientLight) {
            ambientLight.intensity = isDark ? 0.45 : 0.75;
        }
        if (save) {
            try { localStorage.setItem('svlLabTheme', isDark ? 'dark' : 'light'); } catch (e) {}
        }
    }

    if (themeBtn) {
        themeBtn.addEventListener('click', () => {
            const nextDark = !document.body.classList.contains('dark-mode');
            applyTheme(nextDark, true);
        });
    }

    try {
        const savedTheme = localStorage.getItem('svlLabTheme');
        applyTheme(savedTheme !== 'light', false);
    } catch (e) {
        applyTheme(true, false);
    }

    // 14. 전체화면 제어
    const fsBtn = document.getElementById('btn-fullscreen');
    if (fsBtn) {
        fsBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        });
    }

    // 15. 리사이즈 핸들러
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

})();
</script>
