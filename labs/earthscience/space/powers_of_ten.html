<head>

<style>
@font-face{
  font-family:'SeoulNamsan';
  src:local('SeoulNamsan M'),local('SeoulNamsanM'),local('서울남산체 M'),
      url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff') format('woff');
  font-weight:400;font-style:normal;font-display:swap;
}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;padding:0;width:100%;height:100%;overflow:hidden;
  font-family:'SeoulNamsan',-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color:#eaf1ff;background:radial-gradient(130% 120% at 50% 8%,#12203a 0%,#0a1220 48%,#04060c 100%);
  touch-action:none;transition:background .35s ease,color .35s ease;
}
body.light-mode{color:#16202e;background:radial-gradient(130% 120% at 50% 8%,#ffffff 0%,#e9f1fa 50%,#d7e4f2 100%)}
#canvas-container{position:fixed;inset:0;z-index:1;touch-action:none}
#canvas-container canvas{display:block}

.glass-panel{
  background:rgba(18,28,46,.80);backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(255,255,255,.13);border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.45);transition:background .35s,border-color .35s,color .35s;
}
body.light-mode .glass-panel{background:rgba(255,255,255,.84);border-color:rgba(255,255,255,.7);box-shadow:0 10px 28px rgba(15,23,42,.12)}

/* ---------- 좌상단 ---------- */
.top-left-bar{position:fixed;top:16px;left:18px;display:flex;align-items:center;gap:9px;z-index:40;max-width:calc(100vw - 120px)}
.back-btn{
  display:flex;align-items:center;gap:6px;padding:9px 16px;font-size:14px;font-weight:700;font-family:inherit;
  color:#eaf1ff;text-decoration:none;border:none;border-radius:999px;cursor:pointer;white-space:nowrap;
  background:rgba(18,28,46,.80);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.13);box-shadow:0 10px 28px rgba(0,0,0,.35);transition:transform .18s,background .35s;
}
body.light-mode .back-btn{color:#16202e;background:rgba(255,255,255,.84);border-color:rgba(255,255,255,.7)}
.back-btn:active{transform:scale(.97)}
.tag-badge{display:flex;align-items:center;gap:8px;padding:9px 16px;font-size:14px;font-weight:700;border-radius:999px;min-width:0;overflow:hidden}
.tag-badge .title-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vision-badge{flex:0 0 auto;background:rgba(10,132,255,.28);color:#8cc6ff;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;letter-spacing:.2px}
body.light-mode .vision-badge{background:rgba(0,122,255,.14);color:#007aff}

/* ---------- 우상단 ---------- */
.icon-btn{
  width:38px;height:38px;min-width:38px;border-radius:50%;border:1px solid rgba(255,255,255,.13);
  display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;cursor:pointer;font-family:inherit;
  color:#eaf1ff;background:rgba(18,28,46,.80);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 8px 22px rgba(0,0,0,.3);transition:background .35s,border-color .35s;
}
body.light-mode .icon-btn{color:#16202e;background:rgba(255,255,255,.86);border-color:rgba(255,255,255,.7)}
.data-card{display:flex;align-items:center;gap:14px;padding:9px 15px;border-radius:16px}
.data-item{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.data-label{font-size:10.5px;font-weight:700;color:#93a7c4;white-space:nowrap;line-height:1.2}
body.light-mode .data-label{color:#64748b}
.data-value{font-size:14px;font-weight:800;color:#eaf1ff;white-space:nowrap;line-height:1.25}
body.light-mode .data-value{color:#16202e}

/* ---------- 중앙 안내 ---------- */
.center-tooltip{
  position:fixed;top:78px;left:50%;transform:translateX(-50%);padding:8px 18px;border-radius:999px;
  font-size:12.5px;font-weight:700;color:#c7d6ea;pointer-events:none;z-index:15;white-space:nowrap;
  max-width:calc(100vw - 40px);overflow:hidden;text-overflow:ellipsis;
  background:rgba(18,28,46,.72);border:1px solid rgba(255,255,255,.10);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
body.light-mode .center-tooltip{color:#475569;background:rgba(255,255,255,.72);border-color:rgba(255,255,255,.6)}

/* ---------- 좌측 정보 패널 ---------- */
.info-panel{position:fixed;left:18px;bottom:76px;width:256px;padding:13px 14px;z-index:20;border-radius:18px;display:flex;flex-direction:column;gap:7px}
.ip-head{display:flex;align-items:center;justify-content:space-between;gap:6px}
.ip-title{font-size:11.5px;font-weight:800;color:#93a7c4;letter-spacing:-.2px}
body.light-mode .ip-title{color:#64748b}
.ip-exp{font-size:10.5px;font-weight:800;color:#7cc0ff;background:rgba(10,132,255,.16);padding:2px 8px;border-radius:999px;white-space:nowrap}
body.light-mode .ip-exp{color:#0071e3;background:rgba(0,122,255,.12)}
.ip-main{display:flex;align-items:center;gap:10px}
.ip-icon{font-size:28px;line-height:1;flex:0 0 auto}
.ip-name{font-size:19px;font-weight:800;letter-spacing:-.4px;line-height:1.15}
.ip-size{font-size:13px;font-weight:800;color:#7cc0ff;line-height:1.2}
body.light-mode .ip-size{color:#0a66c2}
.ip-desc{font-size:10.5px;font-weight:700;color:#9db0cb;line-height:1.45;word-break:keep-all}
body.light-mode .ip-desc{color:#64748b}
.ip-bar{display:flex;flex-direction:column;gap:3px;margin-top:2px}
.ip-bar-track{height:8px;border-radius:999px;background:rgba(255,255,255,.10);overflow:hidden;position:relative}
body.light-mode .ip-bar-track{background:rgba(15,23,42,.10)}
.ip-bar-fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,#0a84ff,#5e5ce6);transition:width .25s}
.ip-bar-cap{font-size:9.5px;font-weight:700;color:#7e93b0;display:flex;justify-content:space-between;gap:6px}
body.light-mode .ip-bar-cap{color:#7b8aa0}

/* ---------- 우측 조절 패널 ---------- */
body #side-ctrl.side-ctrl-panel{width:250px !important;padding:12px !important;gap:9px !important;background:rgba(16,25,42,.86) !important;border:1px solid rgba(255,255,255,.13) !important;box-shadow:0 10px 30px rgba(0,0,0,.45) !important}
body.light-mode #side-ctrl.side-ctrl-panel{background:rgba(255,255,255,.88) !important;border-color:rgba(255,255,255,.75) !important;box-shadow:0 10px 28px rgba(15,23,42,.12) !important}
.panel-header{display:flex;align-items:center;justify-content:space-between;gap:6px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.10);width:100%}
body.light-mode .panel-header{border-bottom-color:rgba(15,23,42,.08)}
.panel-title{font-size:12px !important;font-weight:800 !important;color:#c7d6ea !important}
body.light-mode .panel-title{color:#334155 !important}
.ctrl-block{display:flex;flex-direction:column;gap:6px;width:100%}
.ctrl-cap{font-size:10.5px;font-weight:800;color:#8fa4c2;letter-spacing:-.1px}
body.light-mode .ctrl-cap{color:#64748b}
.nbig{display:flex;align-items:baseline;justify-content:center;gap:4px;padding:2px 0 0}
.nbig .b10{font-size:15px;font-weight:800;color:#9db0cb}
body.light-mode .nbig .b10{color:#64748b}
.nbig .sup{font-size:26px;font-weight:800;color:#7cc0ff;line-height:1;letter-spacing:-.5px}
body.light-mode .nbig .sup{color:#0a66c2}
.nbig .unit{font-size:12px;font-weight:800;color:#9db0cb}
body.light-mode .nbig .unit{color:#64748b}
.ctrl-slider{
  width:100%;height:7px;border-radius:999px;background:rgba(255,255,255,.14);outline:none;
  -webkit-appearance:none;appearance:none;cursor:pointer;margin:6px 0 2px;
}
body.light-mode .ctrl-slider{background:rgba(15,23,42,.14)}
.ctrl-slider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#0a84ff;box-shadow:0 2px 8px rgba(10,132,255,.6);cursor:pointer;border:2px solid #dce9ff}
.ctrl-slider::-moz-range-thumb{width:18px;height:18px;border:2px solid #dce9ff;border-radius:50%;background:#0a84ff}
.stop-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;width:100%}
.stop-btn{
  display:flex;align-items:center;justify-content:center;gap:4px;padding:7px 3px;border-radius:11px;
  border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:#dbe7f7;
  font-family:inherit;font-size:10.5px;font-weight:800;cursor:pointer;white-space:nowrap;transition:all .16s;
}
body.light-mode .stop-btn{background:rgba(255,255,255,.9);border-color:rgba(15,23,42,.09);color:#334155}
.stop-btn:hover{background:rgba(255,255,255,.16)}
body.light-mode .stop-btn:hover{background:#fff}
.stop-btn.active{background:#0a84ff;border-color:#0a84ff;color:#fff;box-shadow:0 4px 12px rgba(10,132,255,.45)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}
.mini-btn{
  padding:8px 4px;border-radius:11px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);
  color:#dbe7f7;font-family:inherit;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap;transition:all .16s;
}
body.light-mode .mini-btn{background:rgba(255,255,255,.9);border-color:rgba(15,23,42,.09);color:#334155}
.mini-btn:hover{background:rgba(255,255,255,.16)}
.mini-btn.on{background:#30d158;border-color:#30d158;color:#04240f}
.panel-note{font-size:10px;font-weight:700;color:#8fa4c2;line-height:1.45;word-break:keep-all}
body.light-mode .panel-note{color:#64748b}

/* ---------- 하단 ---------- */
.bottom-right-bar{position:fixed;right:18px;bottom:18px;display:flex;align-items:center;gap:10px;z-index:40}

/* ---------- 모바일 세로 ---------- */
@media (max-width:900px){
  .top-left-bar{top:max(8px,env(safe-area-inset-top));left:8px;gap:6px;max-width:calc(100vw - 178px)}
  .back-btn{padding:7px 11px;font-size:12px}
  .tag-badge{padding:7px 11px;font-size:12px}
  .vision-badge{display:none}
  .icon-btn{width:32px;height:32px;min-width:32px;font-size:14px}
  .data-card{gap:10px;padding:6px 10px;border-radius:14px}
  .data-label{font-size:9px}
  .data-value{font-size:12px}
  .center-tooltip{display:none}
  .info-panel{
    left:8px;right:8px;top:calc(max(8px,env(safe-area-inset-top)) + 104px);bottom:auto;
    width:auto;padding:8px 10px;gap:4px;border-radius:14px;
  }
  .ip-title{font-size:10px}
  .ip-exp{font-size:9.5px;padding:1px 6px}
  .ip-icon{font-size:20px}
  .ip-name{font-size:15px}
  .ip-size{font-size:11px}
  .ip-desc{display:none}
  .ip-bar-cap{font-size:8.5px}
  body #side-ctrl.side-ctrl-panel{
    right:8px !important;width:226px !important;
    bottom:calc(66px + env(safe-area-inset-bottom)) !important;
    max-height:min(46vh,360px) !important;padding:9px !important;gap:6px !important;
  }
  .ctrl-cap{font-size:9.5px}
  .stop-btn{font-size:9.5px;padding:6px 2px}
  .mini-btn{font-size:10px;padding:7px 3px}
  .panel-note{font-size:9px}
  .bottom-right-bar{right:8px;bottom:calc(8px + env(safe-area-inset-bottom))}
  #fullscreenText{display:none}
}
/* ---------- 모바일 가로 ---------- */
@media (max-height:520px) and (orientation:landscape){
  .top-left-bar{top:max(6px,env(safe-area-inset-top));left:6px;gap:5px;max-width:46vw}
  .back-btn{padding:5px 9px;font-size:11px}
  .tag-badge{padding:5px 9px;font-size:11px}
  .vision-badge{display:none}
  .icon-btn{width:28px;height:28px;min-width:28px;font-size:13px}
  .data-card{gap:8px;padding:4px 9px;border-radius:12px}
  .data-label{font-size:8.5px}
  .data-value{font-size:11px}
  .center-tooltip{display:none}
  .info-panel{left:auto;right:calc(236px + 8px);top:auto;bottom:calc(44px + env(safe-area-inset-bottom));width:200px;padding:7px 9px;gap:3px}
  .ip-desc{display:none}
  .ip-name{font-size:13px}
  .ip-icon{font-size:17px}
  .ip-size{font-size:10px}
  body #side-ctrl.side-ctrl-panel{
    right:8px !important;width:226px !important;
    bottom:calc(44px + env(safe-area-inset-bottom)) !important;
    max-height:calc(100vh - 92px) !important;padding:8px !important;gap:5px !important;
  }
  .panel-note{display:none}
  .stop-btn{font-size:9px;padding:5px 2px}
  .bottom-right-bar{right:8px;bottom:calc(6px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div id="canvas-container"></div>

<div class="top-left-bar">
  <a href="/index.html" class="back-btn" onclick="var r=document.referrer;if(history.length>1&&r&&r.indexOf(location.origin+'/')===0&&/(\/|index(_3d)?\.html)(\?|#|$)/.test(r)){history.back();return false;}"><span>⬅</span> 메인</a>
  <div class="glass-panel tag-badge">
    <span class="title-text">우주의 크기 10ⁿ 탐험 3D</span>
    <span class="vision-badge">visionOS</span>
  </div>
  <button class="back-btn qr-btn" id="qrBtn" type="button" title="QR 코드" aria-label="QR 코드 보기"><span class="qr-btn-icon" aria-hidden="true">📱</span><span class="qr-btn-label">QR code</span></button>
</div>

<div class="top-right-bar">
  <div class="tr-util">
    <button class="icon-btn" id="theme-toggle" type="button" title="주간/야간 모드" aria-label="주간/야간 모드 전환">☀️</button>
  </div>
  <div class="glass-panel data-card">
    <div class="data-item"><span class="data-label">화면 크기</span><span class="data-value" id="val-width">1 m</span></div>
    <div class="data-item"><span class="data-label">관찰 대상</span><span class="data-value" id="val-focus" style="color:#7cc0ff">사람</span></div>
    <div class="data-item"><span class="data-label">단계</span><span class="data-value" id="val-step">0 / 7</span></div>
  </div>
</div>

<div class="glass-panel center-tooltip" id="guide-tooltip">💡 지수 슬라이더를 움직이면 원자에서 은하까지 한 번에 줌인·줌아웃합니다</div>

<div class="glass-panel bottom-control-bar">
  <button class="control-tab-btn" id="btn-reset" type="button"><span>🔄</span><span>초기화</span></button>
  <button class="control-tab-btn" id="btn-cam" type="button"><span>🎥</span><span>시점정렬</span></button>
</div>

<div class="glass-panel info-panel" id="info-panel">
  <div class="ip-head">
    <span class="ip-title">🔭 지금 보고 있는 크기</span>
    <span class="ip-exp" id="ip-exp">10⁻¹⁰ m</span>
  </div>
  <div class="ip-main">
    <span class="ip-icon" id="ip-icon">⚛️</span>
    <div style="min-width:0">
      <div class="ip-name" id="ip-name">원자</div>
      <div class="ip-size" id="ip-size">0.1 nm</div>
    </div>
  </div>
  <div class="ip-desc" id="ip-desc">수소 원자의 지름</div>
  <div class="ip-bar">
    <div class="ip-bar-track"><div class="ip-bar-fill" id="ip-fill" style="width:4%"></div></div>
    <div class="ip-bar-cap"><span>원자</span><span>우리 은하</span></div>
  </div>
</div>

<div class="glass-panel side-ctrl-panel" id="side-ctrl">
  <div class="panel-header"><span class="panel-title">🔎 배율 조절</span></div>
  <div class="ctrl-block">
    <div class="nbig"><span class="b10">10</span><span class="sup" id="n-exp">-10.0</span><span class="unit">m</span></div>
    <input type="range" class="ctrl-slider" id="n-slider" min="-10.6" max="21.4" step="0.02" value="-10">
    <div class="panel-note" id="n-note">화면 가로가 10⁻¹⁰ m 인 크기입니다</div>
  </div>
  <div class="ctrl-block">
    <span class="ctrl-cap">주요 단계로 바로 가기</span>
    <div class="stop-grid" id="stop-grid"></div>
  </div>
  <div class="row2">
    <button class="mini-btn" id="btn-play" type="button">▶ 자동 탐험</button>
    <button class="mini-btn" id="btn-zoomout" type="button">🔭 줌아웃</button>
  </div>
</div>

<script>

   ===================================================================== */

'use strict';
var $ = function (s) { return document.querySelector(s); };

  { id: 'field', name: '운동장', icon: '🏟️', size: 1e2, desc: '운동장 트랙의 지름 (100 m)', build: 'field' },
  { id: 'city', name: '도시', icon: '🏙️', size: 2e4, desc: '도시의 폭 (20 km)', build: 'city' },
  { id: 'korea', name: '한반도', icon: '🗺️', size: 5e5, desc: '한반도의 남북 길이 (500 km)', build: 'korea' },
  { id: 'earth', name: '지구', icon: '🌍', size: 1.27e7, desc: '지구의 지름 (12,700 km)', build: 'earth' },
  { id: 'sun', name: '태양', icon: '☀️', size: 1.39e9, desc: '태양의 지름 (139만 km)', build: 'sun' },
  { id: 'au', name: '지구–태양 거리', icon: '📏', size: 1.5e11, desc: '1 AU · 빛이 8분 20초 동안 가는 거리', build: 'au' },

  var s = starDot(0xbfe0ff, 0.07);
  s.position.x = 0.5;
  g.add(s);
  var pts = [new THREE.Vector3(-0.5, 0, 0), new THREE.Vector3(0.5, 0, 0)];
  var line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineDashedMaterial({ color: 0x9fd0ff, dashSize: 0.05, gapSize: 0.03, transparent: true, opacity: 0.75 }));
  line.computeLineDistances();
  g.add(line);
  return g;
};

BUILD.star = function () {
  var g = G();
  var a = starDot(0xffd27a, 0.12);
  a.position.x = -0.5;
  g.add(a);
  var b = starDot(0xff8a5c, 0.1);
  b.position.x = 0.5;
  g.add(b);
  var pts = [new THREE.Vector3(-0.5, 0, 0), new THREE.Vector3(0.5, 0, 0)];
  var line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: 0x9fd0ff, transparent: true, opacity: 0.45 }));
  g.add(line);
  return g;
};

BUILD.galaxy = function () {
  var g = G();
  var N = 4200;
  var pos = new Float32Array(N * 3);
  var col = new Float32Array(N * 3);
  var c1 = new THREE.Color(0xffd9a0), c2 = new THREE.Color(0x9fc6ff), c3 = new THREE.Color(0xfff2d0);
  for (var i = 0; i < N; i++) {
    var arm = i % 4;
    var t = Math.pow(Math.random(), 0.55);
    var r = 0.06 + t * 0.44;
    var ang = arm * Math.PI / 2 + Math.log(r / 0.06) * 2.6 + (Math.random() - 0.5) * 0.42;
    var spread = 0.012 + t * 0.045;
    pos[i * 3] = Math.cos(ang) * r + (Math.random() - 0.5) * spread;
    pos[i * 3 + 1] = (Math.random() - 0.5) * spread * 0.6;
    pos[i * 3 + 2] = Math.sin(ang) * r + (Math.random() - 0.5) * spread;
    var c = Math.random() < 0.25 ? c1 : (Math.random() < 0.5 ? c3 : c2);
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  var pts = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.022, vertexColors: true, transparent: true, opacity: 1, depthWrite: false, blending: THREE.AdditiveBlending }));
  g.add(pts);
  var bulge = M(new THREE.SphereGeometry(0.035, 20, 16), mat(0xfff0cc, { emissive: 0xffdca0, emissiveIntensity: 1.6 }));
  g.add(bulge);
  g.rotation.set(-0.62, 0, 0.22);
  var glow = starDot(0xffe0b0, 0.1);
  g.add(glow);
  g.userData.spin = pts;
  return g;
};

/* 객체 생성 — 각 모형의 가장 긴 변을 1로 정규화해 '선언한 크기 = 실제 화면 크기'로 맞춘다 */
var built = {};
OBS.forEach(function (o) {
  var inner = BUILD[o.build]();
  var bb = new THREE.Box3().setFromObject(inner);
  var sz = bb.getSize(new THREE.Vector3());
  var maxDim = Math.max(sz.x, sz.y, sz.z, 1e-6);
  inner.scale.multiplyScalar(1 / maxDim);
  bb.setFromObject(inner);
  var ctr = bb.getCenter(new THREE.Vector3());
  inner.position.sub(ctr);
  var g = new THREE.Group();
  g.add(inner);
  g.userData.inner = inner;
  if (inner.userData.spin) g.userData.spin = inner.userData.spin;
  g.visible = false;
  g.userData.baseOpacity = [];
  g.traverse(function (c) {
    if (c.material) {
      var mats = Array.isArray(c.material) ? c.material : [c.material];
      mats.forEach(function (m) {
        m.transparent = true;
        if (c.userData.__baseOp === undefined) c.userData.__baseOp = m.opacity;
      });
    }
  });
  scene.add(g);
  built[o.id] = g;
});

/* ---------------------------------------------------------------
   5. 크기 적용
   --------------------------------------------------------------- */
function smoothstep(a, b, x) {
  var t = Math.max(0, Math.min(1, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}
function applyScale() {
  var n = state.n;
  OBS.forEach(function (o) {
    var g = built[o.id];
    var f = Math.pow(10, o.log - n) * K;
    if (f < 0.09 || f > 9) {
      if (g.visible) g.visible = false;
      return;
    }
    g.visible = true;
    g.scale.setScalar(f);
    var op = smoothstep(0.09, 0.26, f) * (1 - smoothstep(6, 9, f));
    g.traverse(function (c) {
      if (!c.material) return;
      var mats = Array.isArray(c.material) ? c.material : [c.material];
      mats.forEach(function (m) {
        var base = c.userData.__baseOp === undefined ? 1 : c.userData.__baseOp;
        m.opacity = base * op;
        m.depthWrite = !(m.opacity < 0.99);
      });
    });
  });
  if (window.__stars) {
    window.__stars.material.opacity = 0.25 + 0.65 * smoothstep(3, 8, n);
  }
}

/* ---------------------------------------------------------------
   6. UI
   --------------------------------------------------------------- */
var SUP = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
function supNum(v) {
  var s = v.toFixed(1).replace(/\.0$/, '');
  return s.split('').map(function (ch) { return SUP[ch] || ch; }).join('');
}
function fmtLen(m) {
  var a = Math.abs(m);
  if (a < 1e-9) return (m * 1e12).toFixed(1) + ' pm';
  if (a < 1e-6) return (m * 1e9).toFixed(1) + ' nm';
  if (a < 1e-3) return (m * 1e6).toFixed(1) + ' µm';
  if (a < 1e-2) return (m * 1e3).toFixed(1) + ' mm';
  if (a < 1) return (m * 100).toFixed(0) + ' cm';
  if (a < 1e3) return (m < 10 ? m.toFixed(1) : Math.round(m)) + ' m';
  if (a < 1e7) return (m / 1e3).toFixed(1) + ' km';
  if (a < 1e10) return Math.round(m / 1e3).toLocaleString('en-US') + ' km';
  if (a < 1e13) return Math.round(m / 1e3).toLocaleString('en-US') + ' km';
  if (a < 9.46e15) return (m / 1.496e11).toFixed(1) + ' AU';
  var ly = m / 9.46e15;
  return (ly < 1000 ? ly.toFixed(1) : Math.round(ly).toLocaleString('en-US')) + ' 광년';
}
function focusIndex() {
  var best = 0, bd = 1e9;
  for (var i = 0; i < OBS.length; i++) {
    var d = Math.abs(OBS[i].log - state.n);
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}
function updateUI() {
  var n = state.n;
  var fi = focusIndex();
  var f = OBS[fi];

  $('#n-exp').textContent = n.toFixed(1);
  $('#ip-exp').textContent = '10' + supNum(n) + ' m';
  $('#ip-icon').textContent = f.icon;
  $('#ip-name').textContent = f.name;
  $('#ip-size').textContent = fmtLen(f.size);
  $('#ip-desc').textContent = f.desc;
  $('#val-width').textContent = fmtLen(Math.pow(10, n));
  $('#val-focus').textContent = f.name;
  $('#n-note').textContent = '화면 가로가 ' + fmtLen(Math.pow(10, n)) + ' 인 크기입니다';

  var pct = (n - N_MIN) / (N_MAX - N_MIN);
  $('#ip-fill').style.width = Math.max(2, Math.min(100, pct * 100)) + '%';

  var stepIdx = STOPS.indexOf(f.id);
  var near = 0;
  STOPS.forEach(function (id, i) {
    var o = OBS.filter(function (x) { return x.id === id; })[0];
    if (o.log <= n + 0.06) near = i;
  });
  $('#val-step').textContent = near + ' / ' + (STOPS.length - 1);

  $$('.stop-btn').forEach(function (b) {
    b.classList.toggle('active', b.getAttribute('data-id') === f.id);
  });
  if (!$('#n-slider').matches(':active')) $('#n-slider').value = String(n);
}

/* ---------------------------------------------------------------
   7. 조작
   --------------------------------------------------------------- */
function goTo(n, instant) {
  state.target = Math.max(N_MIN, Math.min(N_MAX, n));
  if (instant) { state.n = state.target; applyScale(); updateUI(); }
}
$('#n-slider').addEventListener('input', function (e) {
  state.playing = false;
  $('#btn-play').classList.remove('on');
  $('#btn-play').textContent = '▶ 자동 탐험';
  state.n = parseFloat(e.target.value);
  state.target = state.n;
  applyScale();
  updateUI();
});
$('#btn-play').addEventListener('click', function () {
  state.playing = !state.playing;
  $('#btn-play').classList.toggle('on', state.playing);
  $('#btn-play').textContent = state.playing ? '⏸ 일시정지' : '▶ 자동 탐험';
  if (state.playing && state.target >= N_MAX - 0.5) goTo(N_MIN, true);
});
$('#btn-zoomout').addEventListener('click', function () {
  state.playing = false;
  $('#btn-play').classList.remove('on');
  $('#btn-play').textContent = '▶ 자동 탐험';
  goTo(state.target + 1);
});
$('#btn-reset').addEventListener('click', function () {
  state.playing = false;
  $('#btn-play').classList.remove('on');
  $('#btn-play').textContent = '▶ 자동 탐험';
  controls.target.set(0, 0, 0);
  camera.position.set(0, 0.9, CAM_DIST);
  goTo(-10, true);
});
$('#btn-cam').addEventListener('click', function () {
  camera.position.set(0, 0.9, CAM_DIST);
  controls.target.set(0, 0, 0);
  controls.update();
});

/* 단계 버튼 */
(function buildStops() {
  var grid = $('#stop-grid');
  STOPS.forEach(function (id) {
    var o = OBS.filter(function (x) { return x.id === id; })[0];
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'stop-btn';
    b.setAttribute('data-id', id);
    b.innerHTML = o.icon + ' ' + o.name;
    b.addEventListener('click', function () {
      state.playing = false;
      $('#btn-play').classList.remove('on');
      $('#btn-play').textContent = '▶ 자동 탐험';
      goTo(o.log);
    });
    grid.appendChild(b);
  });
})();

/* 야간/주간 */
$('#theme-toggle').addEventListener('click', function (e) {
  var light = document.body.classList.toggle('light-mode');
  e.currentTarget.textContent = light ? '🌙' : '☀️';
  hemi.intensity = light ? 1.15 : 1.05;
  keyL.intensity = light ? 1.05 : 0.95;
});

/* ---------------------------------------------------------------
   8. 루프
   --------------------------------------------------------------- */
var clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  var dt = Math.min(clock.getDelta(), 0.05);

  if (state.playing) {
    state.target += dt * 0.62 * state.playDir;
    if (state.target >= N_MAX) { state.target = N_MAX; state.playing = false; $('#btn-play').classList.remove('on'); $('#btn-play').textContent = '▶ 자동 탐험'; }
  }
  if (Math.abs(state.target - state.n) > 0.0005) {
    state.n += (state.target - state.n) * Math.min(1, dt * 5.5);
    applyScale();
    updateUI();
  }

  /* 회전하는 물체 */
  var t = performance.now() * 0.001;
  if (built.earth.visible) built.earth.userData.spin.rotation.y = t * 0.14;
  if (built.atom.visible && built.atom.userData.spin) {
    var s = built.atom.userData.spin;
    s.position.set(Math.cos(t * 1.6) * 0.42, 0, Math.sin(t * 1.6) * 0.42);
  }
  if (built.galaxy.visible && built.galaxy.userData.spin) built.galaxy.userData.spin.rotation.y = t * 0.02;
  if (built.sun.visible && built.sun.userData.spin) built.sun.userData.spin.rotation.y = t * 0.05;

  controls.update();
  renderer.render(scene, camera);
}

function resize() {
  var w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  var vfov = camera.fov * Math.PI / 180;
  var vh = 2 * CAM_DIST * Math.tan(vfov / 2);
  var vw = vh * camera.aspect;
  K = Math.min(vw, vh) * 0.56;
  applyScale();
}
window.addEventListener('resize', resize);
window.__LAB_CAM__ = camera;

/* 부트 */
camera.position.set(0, 0.9, CAM_DIST);
controls.target.set(0, 0, 0);
controls.update();
resize();
state.n = -10;
state.target = -10;
applyScale();
updateUI();
animate();

})();
</script>

<!-- Fullscreen / Windowed Mode Button -->
<div class="bottom-right-bar">
  <button id="fullscreenBtn" class="glass-panel back-btn" type="button" aria-label="전체화면으로 전환">
    <span id="fullscreenIcon">⛶</span><span id="fullscreenText">전체화면</span>
  </button>
</div>

<script>
/* ============ 전체화면 / 창모드 (표준 + 모바일 몰입 모드 폴백) ============ */
(function () {
    var docEl = document.documentElement;
    var btn = document.getElementById('fullscreenBtn');
    var icon = document.getElementById('fullscreenIcon');
    var text = document.getElementById('fullscreenText');

    function realFs() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement ||
                  document.mozFullScreenElement || document.msFullscreenElement);
    }
    function pseudo() { return docEl.classList.contains('pseudo-fs'); }
    function setUI() {
        var on = realFs() || pseudo();
        if (icon) icon.textContent = on ? '🗗' : '⛶';
        if (text) text.textContent = on ? '창모드' : '전체화면';
        if (btn) btn.setAttribute('aria-label', on ? '창모드로 전환' : '전체화면으로 전환');
        document.body.classList.toggle('is-fullscreen', on);
    }
    function toast(msg) {
        var t = document.getElementById('ux-toast');
        if (!t) {
            t = document.createElement('div');
            t.id = 'ux-toast';
            t.style.cssText = 'position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);' +
                'background:rgba(28,28,30,.88);color:#fff;font-size:12px;line-height:1.4;padding:9px 14px;border-radius:14px;' +
                'z-index:9999;max-width:86vw;text-align:center;pointer-events:none;transition:opacity .3s;' +
                'font-family:inherit;box-shadow:0 8px 24px rgba(0,0,0,.25)';
            document.body.appendChild(t);
        }
        t.textContent = msg;
        t.style.opacity = '1';
        clearTimeout(t._t);
        t._t = setTimeout(function () { t.style.opacity = '0'; }, 2600);
    }

    if (btn) {
        btn.addEventListener('click', function () {
            var wasReal = realFs();
            var wasPseudo = pseudo();
            try {
                if (!wasReal) {
                    var req = docEl.requestFullscreen || docEl.webkitRequestFullscreen ||
                              docEl.webkitRequestFullScreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
                    if (req) req.call(docEl);
                } else {
                    var exit = document.exitFullscreen || document.webkitExitFullscreen ||
                               document.webkitCancelFullScreen || document.mozCancelFullScreen || document.msExitFullscreen;
                    if (exit) exit.call(document);
                }
            } catch (e) {}
            setTimeout(function () {
                if (wasReal) { setUI(); return; }
                if (wasPseudo) { docEl.classList.remove('pseudo-fs'); setUI(); return; }
                if (!realFs()) {
                    docEl.classList.add('pseudo-fs');
                    try { window.scrollTo(0, 1); } catch (e) {}
                    toast('이 브라우저는 전체화면을 지원하지 않아 상단 정보를 숨긴 몰입 모드로 표시합니다');
                }
                setUI();
            }, 420);
        }, false);
    }
    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
        document.addEventListener(ev, function () { setUI(); refit(); });
    });

    function theCam() {
        try { if (window.__LAB_CAM__ && window.__LAB_CAM__.isPerspectiveCamera) return window.__LAB_CAM__; } catch (e) {}
        return null;
    }
    function mobileFit() {
        var cam = theCam();
        if (!cam) return;
        try {
            if (!cam.userData) cam.userData = {};
            if (!cam.userData.baseFov) cam.userData.baseFov = cam.fov;
            var w = window.innerWidth, h = window.innerHeight, f = 1;
            var k = 0.62;
            var attr = docEl.getAttribute('data-mzoom');
            if (attr) { var v = parseFloat(attr); if (!isNaN(v) && v > 0) k = v; }
            if (w < h) f = 1 + (1 - w / h) * k;
            else if (h <= 520) f = 1 + k * 0.18;
            cam.fov = Math.min(88, cam.userData.baseFov * f);
            cam.updateProjectionMatrix();
        } catch (e) {}
    }
    mobileFit();

    var rt = null;
    function refit() {
        clearTimeout(rt);
        rt = setTimeout(function () {
            mobileFit();
            try { window.dispatchEvent(new Event('resize')); } catch (e) {}
        }, 240);
    }
    window.addEventListener('orientationchange', refit);
    window.addEventListener('pageshow', refit);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) refit(); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', refit);
    setUI();
})();
</script>
