<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>생물 다양성 3D</title>
    <!-- Three.js 및 OrbitControls 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        @font-face {
            font-family: 'SeoulNamsanL';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanL.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'SeoulNamsanL', -apple-system, sans-serif;
            background-color: #0b1325;
            color: #f2f2f7;
            touch-action: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Apple visionOS Glassmorphic UI 패널 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(25px) saturate(190%);
            -webkit-backdrop-filter: blur(25px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        /* 좌측 상단 헤더 */
        .top-left-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tag-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
        }

        .tag-pill {
            background: rgba(52, 199, 89, 0.3);
            color: #34c759;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
        }

        /* 우측 상단 카운트 패널 */
        .top-right-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .data-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 20px;
        }

        .data-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .data-label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            font-weight: bold;
        }

        .data-value {
            font-size: 15px;
            font-weight: bold;
            color: #30d158;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            color: #fff;
            transition: all 0.2s;
        }

        /* 중앙 가이드 안내 툴팁 */
        .center-tooltip {
            position: absolute;
            top: 85px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 20px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.9);
            border-radius: 30px;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.5s ease;
        }

        /* 생물 클릭 시 확대 상세 정보창 (VisionOS Card) */
        .info-card {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(30px);
            width: 360px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 20;
        }

        .info-card.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }

        .info-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-title {
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .habitat-badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 8px;
            font-weight: bold;
        }

        .habitat-forest { background: rgba(52, 199, 89, 0.25); color: #30d158; }
        .habitat-river { background: rgba(10, 132, 255, 0.25); color: #64d2ff; }

        .info-desc {
            font-size: 13.5px;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.85);
        }

        .info-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }

        .info-tag {
            font-size: 11px;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.7);
        }

        .close-btn {
            position: absolute;
            top: 14px;
            right: 16px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 18px;
            cursor: pointer;
        }

        /* 하단 바 컨트롤 */
        .bottom-control-bar {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            z-index: 10;
        }

        .control-tab-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 16px;
            border-radius: 14px;
            border: none;
            background: transparent;
            color: #ffffff;
            font-size: 13px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-tab-btn:hover, .control-tab-btn.active {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="top-left-bar">
        <a href="../index.html" class="glass-panel back-btn">
            <span>⬅</span> 메인
        </a>
        <div class="glass-panel tag-badge">
            <span>생물 다양성 3D</span>
            <span class="tag-pill">visionOS</span>
        </div>
    </div>

    <div class="top-right-bar">
        <div class="glass-panel data-card">
            <div class="data-item">
                <span class="data-label">숲 생물</span>
                <span class="data-value" id="val-forest-cnt">5 종</span>
            </div>
            <div class="data-item">
                <span class="data-label">강 생물</span>
                <span class="data-value" id="val-river-cnt" style="color: #64d2ff;">3 종</span>
            </div>
        </div>
        <button class="icon-btn glass-panel" id="btn-focus-reset">🌐</button>
    </div>

    <div class="glass-panel center-tooltip">
        ✨ 자연 속에서 돌아다니는 생물(토끼, 개구리, 새, 물고기 등)을 클릭해보세요!
    </div>

    <!-- 생물 클릭 상세 카드 -->
    <div class="glass-panel info-card" id="info-card">
        <button class="close-btn" id="btn-close-card">✕</button>
        <div class="info-header">
            <div class="info-title" id="card-title">
                <span id="card-icon">🐇</span>
                <span id="card-name">토끼</span>
            </div>
            <span class="habitat-badge habitat-forest" id="card-habitat">숲 서식</span>
        </div>
        <div class="info-desc" id="card-desc">
            풀밭과 숲속을 통통 튀며 이동합니다. 긴 귀로 주위 소리를 잘 감지하며 주로 풀과 뿌리를 먹습니다.
        </div>
        <div class="info-tags" id="card-tags">
            <span class="info-tag">#포유류</span>
            <span class="info-tag">#초식동물</span>
            <span class="info-tag">#점프운동</span>
        </div>
    </div>

    <div class="glass-panel bottom-control-bar">
        <button class="control-tab-btn" id="btn-cam-forest">
            <span>🌲</span>
            <span>숲 시점</span>
        </button>
        <button class="control-tab-btn" id="btn-cam-river">
            <span>🌊</span>
            <span>강 시점</span>
        </button>
        <button class="control-tab-btn" id="btn-cam-all">
            <span>🏔️</span>
            <span>전체보기</span>
        </button>
    </div>

    <script>
        // --- 1. Three.js 기본 씬, 카메라, 렌더러 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a1526);
        scene.fog = new THREE.FogExp2(0x0a1526, 0.025);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 10, 18);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;
        controls.target.set(0, 1, 0);

        // --- 2. 자연 스튜디오 조명 연출 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
        sunLight.position.set(12, 20, 10);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.bias = -0.0005;
        scene.add(sunLight);

        const riverLight = new THREE.PointLight(0x64d2ff, 0.8, 15);
        riverLight.position.set(4, 2, 0);
        scene.add(riverLight);

        // --- 3. 자연 환경 (숲 지형 + 굽이치는 강) 구축 ---
        const terrainGroup = new THREE.Group();
        scene.add(terrainGroup);

        // 숲 잔디 지형 (-X ~ 2.0)
        const forestGeo = new THREE.BoxGeometry(12, 1, 16);
        const forestMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.85 });
        const forestTerrain = new THREE.Mesh(forestGeo, forestMat);
        forestTerrain.position.set(-6, -0.5, 0);
        forestTerrain.receiveShadow = true;
        terrainGroup.add(forestTerrain);

        // 강 바닥 및 강 지형 (2.0 ~ 10.0)
        const riverBedGeo = new THREE.BoxGeometry(10, 0.8, 16);
        const riverBedMat = new THREE.MeshStandardMaterial({ color: 0x1f3a52, roughness: 0.9 });
        const riverBed = new THREE.Mesh(riverBedGeo, riverBedMat);
        riverBed.position.set(5, -0.6, 0);
        riverBed.receiveShadow = true;
        terrainGroup.add(riverBed);

        // 반투명 유기적 강물
        const waterGeo = new THREE.BoxGeometry(9.8, 0.4, 15.8);
        const waterMat = new THREE.MeshPhysicalMaterial({
            color: 0x0088cc,
            transparent: true,
            opacity: 0.65,
            roughness: 0.1,
            transmission: 0.6,
            ior: 1.33
        });
        const waterMesh = new THREE.Mesh(waterGeo, waterMat);
        waterMesh.position.set(5, -0.3, 0);
        terrainGroup.add(waterMesh);

        // 숲속 입체 나무 조경
        function createTree(x, z) {
            const tree = new THREE.Group();
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4e342e, roughness: 0.9 });
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.25, 1.2, 8), trunkMat);
            trunk.position.y = 0.6;
            trunk.castShadow = true;
            tree.add(trunk);

            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x1b5e20, roughness: 0.6 });
            const leaves = new THREE.Mesh(new THREE.ConeGeometry(0.9, 1.8, 8), leavesMat);
            leaves.position.y = 1.8;
            leaves.castShadow = true;
            tree.add(leaves);

            tree.position.set(x, 0, z);
            terrainGroup.add(tree);
        }

        const treeCoords = [
            [-10, -5], [-9, -2], [-11, 3], [-8, 6], [-5, -6],
            [-7, -3], [-4, 5], [-10, 0], [-3, -4]
        ];
        treeCoords.forEach(c => createTree(c[0], c[1]));

        // 강가 수초 및 수중 바위
        function createRock(x, y, z, scale) {
            const rockMat = new THREE.MeshStandardMaterial({ color: 0x546e7a, roughness: 0.8 });
            const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(scale), rockMat);
            rock.position.set(x, y, z);
            rock.castShadow = true;
            rock.receiveShadow = true;
            terrainGroup.add(rock);
        }
        createRock(1.5, 0.1, -2, 0.35);
        createRock(2.2, 0.0, 3, 0.45);
        createRock(6.0, -0.4, -4, 0.5);
        createRock(4.5, -0.4, 2, 0.4);

        // --- 4. 살아 움직이는 3D 생물 모델링 & 애니메이션 등록 ---
        const creatures = [];

        // 생물 정보 데이터베이스
        const creatureDB = {
            rabbit: {
                name: '토끼',
                icon: '🐇',
                habitat: '숲 서식',
                habitatClass: 'habitat-forest',
                desc: '숲속 잔디밭을 통통 뛰어다닙니다. 관절이 입체적으로 구부러지며 움직이며, 긴 귀로 위험을 잘 탐지합니다.',
                tags: ['#포유류', '#초식동물', '#점프운동']
            },
            frog: {
                name: '개구리',
                icon: '🐸',
                habitat: '숲/강가 서식',
                habitatClass: 'habitat-forest',
                desc: '강가와 습지를 오가며 긴 뒷다리로 껑충 점프합니다. 수륙 양용 생활을 하는 대표적인 양서류입니다.',
                tags: ['#양서류', '#점프운동', '#수륙양용']
            },
            bird: {
                name: '새 (참새)',
                icon: '🐦',
                habitat: '숲 공중 서식',
                habitatClass: 'habitat-forest',
                desc: '숲 상공을 자유롭게 비행하며 날개를 파닥입니다. 뛰어난 시력으로 나무 열매나 곤충을 탐색합니다.',
                tags: ['#조류', '#비행', '#잡식성']
            },
            beetle: {
                name: '장수풍뎅이',
                icon: '🪲',
                habitat: '숲 나무 서식',
                habitatClass: 'habitat-forest',
                desc: '나무 기둥과 바닥을 느릿하게 기어다닙니다. 튼튼한 껍질과 멋진 뿔을 지닌 숲의 곤충입니다.',
                tags: ['#곤충류', '#절지동물', '#외골격']
            },
            deer: {
                name: '사슴',
                icon: '🦌',
                habitat: '숲 깊은곳 서식',
                habitatClass: 'habitat-forest',
                desc: '멋진 뿔을 자랑하며 숲속을 우아하게 걸어다닙니다. 경계심이 강하며 주로 나뭇잎을 먹습니다.',
                tags: ['#포유류', '#대형초식', '#우아한행보']
            },
            fish: {
                name: '열대어 (물고기)',
                icon: '🐟',
                habitat: '강 수중 서식',
                habitatClass: 'habitat-river',
                desc: '맑은 강물 속을 유유히 좌우로 지느러미를 흔들며 유영합니다. 아가미로 호흡하며 강 생태계를 구성합니다.',
                tags: ['#어류', '#지느러미유영', '#아가미호흡']
            },
            otter: {
                name: '수달',
                icon: '🦦',
                habitat: '강 수면 서식',
                habitatClass: 'habitat-river',
                desc: '강 수면 위를 둥둥 떠다니며 헤엄칩니다. 물고기를 사냥하는 강 생태계의 대표적인 포식자입니다.',
                tags: ['#포유류', '#수중수영', '#잡식/포식']
            },
            waterbug: {
                name: '소금쟁이',
                icon: '🦟',
                habitat: '강 수면 서식',
                habitatClass: 'habitat-river',
                desc: '물의 표면장력을 이용하여 강 수면 위를 미끄러지듯 스케이팅하며 원활하게 이동합니다.',
                tags: ['#곤충류', '#표면장력', '#수면이동']
            }
        };

        // (1) 토끼 (실제 관절 3D 모델링 + 점프 애니메이션)
        function buildRabbit() {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0xf5f5f7, roughness: 0.5 });

            // 몸통
            const body = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), mat);
            body.scale.set(1, 0.85, 1.3);
            body.position.y = 0.35;
            body.castShadow = true;
            group.add(body);

            // 머리
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 16), mat);
            head.position.set(0, 0.55, 0.35);
            head.castShadow = true;
            group.add(head);

            // 귀 (좌/우)
            [-0.08, 0.08].forEach(x => {
                const ear = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.05, 0.4, 8), mat);
                ear.position.set(x, 0.8, 0.3);
                ear.rotation.x = -0.2;
                ear.castShadow = true;
                group.add(ear);
            });

            // 다리 (4개)
            const legMat = new THREE.MeshStandardMaterial({ color: 0xe5e5ea });
            const legs = [];
            [[-0.2, 0.2, 0.25], [0.2, 0.2, 0.25], [-0.22, 0.18, -0.25], [0.22, 0.18, -0.25]].forEach(pos => {
                const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.06, 0.25, 8), legMat);
                leg.position.set(...pos);
                leg.castShadow = true;
                group.add(leg);
                legs.push(leg);
            });

            group.position.set(-6, 0, 2);
            scene.add(group);

            creatures.push({
                id: 'rabbit',
                group: group,
                update: (time) => {
                    // 순환 이동 및 점프
                    group.position.x = -6 + Math.sin(time * 0.8) * 2.2;
                    group.position.z = 2 + Math.cos(time * 0.8) * 1.5;
                    group.rotation.y = time * 0.8 + Math.PI / 2;
                    
                    const jump = Math.abs(Math.sin(time * 3.5)) * 0.35;
                    group.position.y = jump;
                    legs[2].rotation.x = Math.sin(time * 7) * 0.5;
                    legs[3].rotation.x = -Math.sin(time * 7) * 0.5;
                }
            });
        }

        // (2) 개구리 (점프 애니메이션)
        function buildFrog() {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0x43a047, roughness: 0.4 });

            const body = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 16), mat);
            body.scale.set(1.1, 0.7, 1);
            body.position.y = 0.2;
            body.castShadow = true;
            group.add(body);

            // 눈
            const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffeb3b });
            [-0.12, 0.12].forEach(x => {
                const eye = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 8), eyeMat);
                eye.position.set(x, 0.32, 0.15);
                group.add(eye);
            });

            group.position.set(-1.5, 0, -1);
            scene.add(group);

            creatures.push({
                id: 'frog',
                group: group,
                update: (time) => {
                    const cycle = time * 2;
                    const jump = Math.max(0, Math.sin(cycle)) * 0.6;
                    group.position.y = jump;
                    group.position.z = -1 + (Math.sin(time * 0.5) * 2.0);
                    group.rotation.y = Math.cos(time * 0.5) > 0 ? 0 : Math.PI;
                }
            });
        }

        // (3) 새 (공중 비행 및 날갯짓)
        function buildBird() {
            const group = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x29b6f6 });
            const wingMat = new THREE.MeshStandardMaterial({ color: 0x0288d1 });

            const body = new THREE.Mesh(new THREE.ConeGeometry(0.18, 0.6, 8), bodyMat);
            body.rotation.x = Math.PI / 2;
            group.add(body);

            // 양 날개
            const wings = [];
            [-1, 1].forEach(side => {
                const wing = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.03, 0.22), wingMat);
                wing.position.set(side * 0.3, 0, 0);
                group.add(wing);
                wings.push(wing);
            });

            group.position.set(-5, 4, 0);
            scene.add(group);

            creatures.push({
                id: 'bird',
                group: group,
                update: (time) => {
                    group.position.x = -6 + Math.cos(time * 1.2) * 4;
                    group.position.z = Math.sin(time * 1.2) * 4;
                    group.position.y = 3.5 + Math.sin(time * 2) * 0.5;
                    group.rotation.y = -time * 1.2 - Math.PI / 2;

                    // 날갯짓
                    const wingAngle = Math.sin(time * 12) * 0.5;
                    wings[0].rotation.z = wingAngle;
                    wings[1].rotation.z = -wingAngle;
                }
            });
        }

        // (4) 장수풍뎅이 (나무/바닥 모션)
        function buildBeetle() {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0x3e2723, roughness: 0.2 });

            const body = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 12), mat);
            body.scale.set(0.8, 0.6, 1.2);
            body.position.y = 0.12;
            group.add(body);

            // 뿔
            const horn = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.04, 0.25, 8), mat);
            horn.position.set(0, 0.22, 0.2);
            horn.rotation.x = 0.5;
            group.add(horn);

            group.position.set(-8, 0, -4);
            scene.add(group);

            creatures.push({
                id: 'beetle',
                group: group,
                update: (time) => {
                    group.position.x = -8 + Math.sin(time * 0.3) * 0.8;
                    group.position.z = -4 + Math.cos(time * 0.3) * 0.8;
                    group.rotation.y = time * 0.3;
                }
            });
        }

        // (5) 사슴 (우아한 숲 이동)
        function buildDeer() {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0x8d6e63, roughness: 0.7 });

            const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 1.2), mat);
            body.position.y = 0.8;
            body.castShadow = true;
            group.add(body);

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.4), mat);
            head.position.set(0, 1.3, 0.5);
            group.add(head);

            // 뿔 (양쪽)
            const hornMat = new THREE.MeshStandardMaterial({ color: 0xd7ccc8 });
            [-0.1, 0.1].forEach(x => {
                const horn = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.03, 0.5, 6), hornMat);
                horn.position.set(x, 1.6, 0.4);
                horn.rotation.z = x > 0 ? -0.3 : 0.3;
                group.add(horn);
            });

            group.position.set(-7, 0, -3);
            scene.add(group);

            creatures.push({
                id: 'deer',
                group: group,
                update: (time) => {
                    group.position.x = -7 + Math.sin(time * 0.4) * 2;
                    group.position.z = -3 + Math.cos(time * 0.4) * 1.5;
                    group.rotation.y = time * 0.4 + Math.PI / 2;
                }
            });
        }

        // (6) 물고기 (강속 유영 + 지느러미 모션)
        function buildFish() {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0xff7043, roughness: 0.3 });

            const body = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 12), mat);
            body.scale.set(0.5, 0.8, 1.3);
            body.position.y = -0.35;
            group.add(body);

            // 꼬리 지느러미
            const tail = new THREE.Mesh(new THREE.ConeGeometry(0.18, 0.3, 6), mat);
            tail.position.set(0, -0.35, -0.3);
            tail.rotation.x = -Math.PI / 2;
            group.add(tail);

            group.position.set(5, 0, 0);
            scene.add(group);

            creatures.push({
                id: 'fish',
                group: group,
                update: (time) => {
                    group.position.x = 5 + Math.sin(time * 1.5) * 2.5;
                    group.position.z = Math.cos(time * 1.5) * 4;
                    group.position.y = -0.35 + Math.sin(time * 3) * 0.08;
                    group.rotation.y = -time * 1.5;

                    tail.rotation.z = Math.sin(time * 10) * 0.4;
                }
            });
        }

        // (7) 수달 (강 수면 수영)
        function buildOtter() {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0x5d4037, roughness: 0.6 });

            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.9, 12), mat);
            body.rotation.x = Math.PI / 2;
            body.position.y = -0.15;
            group.add(body);

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 12), mat);
            head.position.set(0, -0.1, 0.45);
            group.add(head);

            group.position.set(7, 0, -2);
            scene.add(group);

            creatures.push({
                id: 'otter',
                group: group,
                update: (time) => {
                    group.position.x = 6.5 + Math.cos(time * 0.9) * 1.8;
                    group.position.z = -2 + Math.sin(time * 0.9) * 3.5;
                    group.rotation.y = -time * 0.9 + Math.PI / 2;
                }
            });
        }

        // (8) 소금쟁이 (수면 스케이팅)
        function buildWaterbug() {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0x212121 });

            const body = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), mat);
            body.scale.set(0.6, 0.5, 1.2);
            body.position.y = -0.08;
            group.add(body);

            // 긴 다리들
            [-0.25, 0.25].forEach(x => {
                const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.6, 4), mat);
                leg.position.set(x, -0.08, 0);
                leg.rotation.z = x > 0 ? -1.2 : 1.2;
                group.add(leg);
            });

            group.position.set(3.5, 0, 2);
            scene.add(group);

            creatures.push({
                id: 'waterbug',
                group: group,
                update: (time) => {
                    const snapTime = Math.floor(time * 2);
                    group.position.x = 3.5 + Math.sin(snapTime * 1.3) * 1.5;
                    group.position.z = 2 + Math.cos(snapTime * 1.3) * 2.0;
                }
            });
        }

        // 모든 생물 생성 실행
        buildRabbit();
        buildFrog();
        buildBird();
        buildBeetle();
        buildDeer();
        buildFish();
        buildOtter();
        buildWaterbug();

        // --- 5. 레이캐스팅 마우스/터치 클릭 확대 이벤트 ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let selectedCreature = null;

        const infoCard = document.getElementById('info-card');
        const cardIcon = document.getElementById('card-icon');
        const cardName = document.getElementById('card-name');
        const cardHabitat = document.getElementById('card-habitat');
        const cardDesc = document.getElementById('card-desc');
        const cardTags = document.getElementById('card-tags');

        function onPointerDown(e) {
            // UI 영역 클릭 시 무시
            if (e.target.closest('.glass-panel') || e.target.closest('.control-tab-btn')) return;

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            // 생물 메쉬들 검사
            const targets = creatures.map(c => c.group);
            const intersects = raycaster.intersectObjects(targets, true);

            if (intersects.length > 0) {
                let hitObj = intersects[0].object;
                while (hitObj.parent && !creatures.find(c => c.group === hitObj)) {
                    hitObj = hitObj.parent;
                }
                const found = creatures.find(c => c.group === hitObj);
                if (found) {
                    selectCreature(found);
                }
            }
        }

        function selectCreature(creature) {
            selectedCreature = creature;
            const data = creatureDB[creature.id];

            cardIcon.innerText = data.icon;
            cardName.innerText = data.name;
            cardHabitat.innerText = data.habitat;
            cardHabitat.className = `habitat-badge ${data.habitatClass}`;
            cardDesc.innerText = data.desc;

            cardTags.innerHTML = data.tags.map(t => `<span class="info-tag">${t}</span>`).join('');
            infoCard.classList.add('show');

            // 생물 위치로 카메라이동 부드럽게 집중
            const targetPos = creature.group.position.clone();
            controls.target.copy(targetPos);
            camera.position.set(targetPos.x, targetPos.y + 2.5, targetPos.z + 4.5);
        }

        document.getElementById('btn-close-card').addEventListener('click', () => {
            infoCard.classList.remove('show');
            selectedCreature = null;
        });

        window.addEventListener('pointerdown', onPointerDown);

        // --- 6. 시점 컨트롤 버튼 이벤트 ---
        document.getElementById('btn-cam-forest').addEventListener('click', () => {
            controls.target.set(-6, 1, 0);
            camera.position.set(-6, 7, 11);
        });

        document.getElementById('btn-cam-river').addEventListener('click', () => {
            controls.target.set(5, 0, 0);
            camera.position.set(5, 6, 10);
        });

        document.getElementById('btn-cam-all').addEventListener('click', () => {
            controls.target.set(0, 1, 0);
            camera.position.set(0, 10, 18);
        });

        document.getElementById('btn-focus-reset').addEventListener('click', () => {
            infoCard.classList.remove('show');
            controls.target.set(0, 1, 0);
            camera.position.set(0, 10, 18);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 7. 메인 실시간 애니메이션 루프 ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // 모든 생물 입체 애니메이션 프레임 업데이트
            creatures.forEach(c => c.update(time));

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
