<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>단순 조화 진동 3D</title>
    <!-- Three.js 및 OrbitControls 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        @font-face {
            font-family: 'SeoulNamsanL';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanL.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'SeoulNamsanL', -apple-system, sans-serif;
            background-color: #f2f2f7;
            color: #1c1c1e;
            touch-action: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Apple visionOS Glassmorphic UI */
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            z-index: 10;
        }

        /* 좌측 상단 헤더 */
        .top-left-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            color: #1c1c1e;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tag-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
        }

        .tag-pill {
            background: rgba(0, 122, 255, 0.15);
            color: #007aff;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
        }

        /* 우측 상단 데이터 표시 */
        .top-right-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .data-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 20px;
        }

        .data-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .data-label {
            font-size: 11px;
            color: #8e8e93;
            font-weight: bold;
        }

        .data-value {
            font-size: 15px;
            font-weight: bold;
            color: #1c1c1e;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            transition: all 0.2s;
        }

        /* 중앙 안내 툴팁 */
        .center-tooltip {
            position: absolute;
            top: 12%;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 18px;
            font-size: 13px;
            color: #8e8e93;
            border-radius: 30px;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.5s ease;
        }

        /* 하단 제어 바 */
        .bottom-control-bar {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            z-index: 10;
        }

        .control-tab-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 14px;
            min-width: 68px;
            border-radius: 14px;
            border: none;
            background: transparent;
            color: #1c1c1e;
            font-size: 12px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-tab-btn.active {
            background: #007aff;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }

        /* 물리 조절 서브 패널 */
        .sub-panel {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            padding: 20px;
            width: 310px;
            display: none;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }

        .sub-panel.show { display: flex; }

        .slider-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #007aff;
        }

        /* 다크 모드 */
        body.dark-mode {
            background-color: #121212;
            color: #f2f2f7;
        }

        body.dark-mode .glass-panel {
            background: rgba(30, 30, 30, 0.75);
            border-color: rgba(255, 255, 255, 0.15);
            color: #f2f2f7;
        }

        body.dark-mode .data-value, body.dark-mode .back-btn {
            color: #f2f2f7;
        }

        body.dark-mode .icon-btn {
            background: rgba(40, 40, 40, 0.75);
            color: #fff;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="top-left-bar">
        <a href="../index.html" class="glass-panel back-btn">
            <span>⬅</span> 메인
        </a>
        <div class="glass-panel tag-badge">
            <span>단순 조화 진동 3D</span>
            <span class="tag-pill">visionOS</span>
        </div>
    </div>

    <div class="top-right-bar">
        <div class="glass-panel data-card">
            <div class="data-item">
                <span class="data-label">변위 (x)</span>
                <span class="data-value" id="val-disp" style="color:#007aff;">0.00 m</span>
            </div>
            <div class="data-item">
                <span class="data-label">속도 (v)</span>
                <span class="data-value" id="val-vel" style="color:#34c759;">0.00 m/s</span>
            </div>
            <div class="data-item">
                <span class="data-label">이론 주기 (T)</span>
                <span class="data-value" id="val-period" style="color:#ff9500;">2.00 s</span>
            </div>
        </div>
        <button class="icon-btn glass-panel" id="theme-toggle">🌙</button>
    </div>

    <div class="glass-panel center-tooltip" id="guide-tooltip">
        ✨ 나무도막을 드래그해서 우측으로 당겼다가 놓아보세요!
    </div>

    <div class="glass-panel sub-panel" id="physics-panel">
        <div class="slider-row">
            <div class="slider-header">
                <span>용수철 상수 (k)</span>
                <span id="txt-k">10.0 N/m</span>
            </div>
            <input type="range" id="sld-k" min="2" max="30" step="0.5" value="10">
        </div>
        <div class="slider-row">
            <div class="slider-header">
                <span>물체 질량 (m)</span>
                <span id="txt-m">1.00 kg</span>
            </div>
            <input type="range" id="sld-m" min="0.2" max="5.0" step="0.1" value="1.0">
        </div>
    </div>

    <div class="glass-panel bottom-control-bar">
        <button class="control-tab-btn" id="btn-toggle-physics">
            <span>⚙️</span>
            <span>물리 조절</span>
        </button>
        <button class="control-tab-btn" id="btn-reset">
            <span>🔄</span>
            <span>초기화</span>
        </button>
        <button class="control-tab-btn" id="btn-align">
            <span>📷</span>
            <span>시점정렬</span>
        </button>
    </div>

    <script>
        // --- 1. Three.js 기본 씬 & 카메라 & 렌더러 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf2f2f7);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.2, 5.0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 0, 0);
        controls.maxPolarAngle = Math.PI / 2;

        // --- 2. 조명 설정 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(3, 5, 4);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // --- 3. 바닥 및 고정 벽면 렌더링 ---
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(20, 20),
            new THREE.MeshStandardMaterial({ color: 0xe5e5ea, roughness: 0.8 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.4;
        floor.receiveShadow = true;
        scene.add(floor);

        const gridHelper = new THREE.GridHelper(20, 20, 0xd1d1d6, 0xe5e5ea);
        gridHelper.position.y = -0.39;
        scene.add(gridHelper);

        // 왼쪽 고정 벽면
        const wallX = -2.2;
        const wallMesh = new THREE.Mesh(
            new THREE.BoxGeometry(0.3, 1.8, 1.8),
            new THREE.MeshStandardMaterial({ color: 0x8e8e93, metalness: 0.3, roughness: 0.5 })
        );
        wallMesh.position.set(wallX, 0.5, 0);
        wallMesh.castShadow = true;
        wallMesh.receiveShadow = true;
        scene.add(wallMesh);

        // --- 4. 물리 변수 및 나무도막 메쉬 ---
        let k = 10.0;          // 용수철 상수 (N/m)
        let m = 1.0;           // 질량 (kg)
        let posX = 0.0;        // 현재 변위 (m)
        let velX = 0.0;        // 현재 속도 (m/s)
        const eqX = 0.0;       // 평형 상태 도막 중심 X좌표
        const boxSize = 0.6;   // 정육각형 나무도막 한 변
        let isDragging = false;

        // 밝은 갈색 나무 질감 메쉬
        const woodMat = new THREE.MeshStandardMaterial({ color: 0xd35400, roughness: 0.5, metalness: 0.1 });
        const blockMesh = new THREE.Mesh(
            new THREE.BoxGeometry(boxSize, boxSize, boxSize),
            woodMat
        );
        blockMesh.position.set(eqX, -0.4 + (boxSize / 2), 0);
        blockMesh.castShadow = true;
        blockMesh.receiveShadow = true;
        scene.add(blockMesh);

        // --- 5. 동적 3D 용수철 렌더링 ---
        let springMesh = null;
        const springMat = new THREE.MeshStandardMaterial({ color: 0x555555, metalness: 0.8, roughness: 0.2 });

        function updateSpring() {
            if (springMesh) scene.remove(springMesh);

            const startX = wallX + 0.15;
            const endX = blockMesh.position.x - (boxSize / 2);
            const springLength = endX - startX;

            const turns = 18;
            const radius = 0.12;
            const samples = 250;
            const points = [];

            for (let i = 0; i <= samples; i++) {
                const t = i / samples;
                const angle = t * turns * Math.PI * 2;
                const x = startX + t * springLength;
                const y = Math.sin(angle) * radius;
                const z = Math.cos(angle) * radius;
                points.push(new THREE.Vector3(x, y, z));
            }

            const curve = new THREE.CatmullRomCurve3(points);
            const geo = new THREE.TubeGeometry(curve, 200, 0.015, 8, false);
            springMesh = new THREE.Mesh(geo, springMat);
            springMesh.position.y = -0.4 + (boxSize / 2);
            springMesh.castShadow = true;
            scene.add(springMesh);
        }

        // --- 6. PC 마우스 & 모바일 터치 드래그 (Pointer Events) ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
        const planeIntersect = new THREE.Vector3();

        function updatePointerPos(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        }

        function onPointerDown(e) {
            updatePointerPos(e);
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(blockMesh);

            if (intersects.length > 0) {
                isDragging = true;
                controls.enabled = false;
                velX = 0;
                document.getElementById('guide-tooltip').style.opacity = '0';
            }
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            updatePointerPos(e);
            raycaster.setFromCamera(mouse, camera);

            if (raycaster.ray.intersectPlane(dragPlane, planeIntersect)) {
                let targetX = planeIntersect.x;
                const minX = wallX + 0.15 + 0.3 + (boxSize / 2);
                const maxX = 2.2;
                targetX = Math.max(minX, Math.min(maxX, targetX));

                posX = targetX - eqX;
                blockMesh.position.x = targetX;
                updateSpring();
            }
        }

        function onPointerUp() {
            if (isDragging) {
                isDragging = false;
                controls.enabled = true;
            }
        }

        window.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);

        // --- 7. 단진동 물리 시뮬레이션 엔진 ---
        function updatePhysics(dt) {
            if (!isDragging) {
                // 단진동 운동 방정식: F = -k * x -> a = -(k / m) * x
                const accX = -(k / m) * posX;
                velX += accX * dt;
                
                // 마찰 감쇠
                velX *= 0.998;
                posX += velX * dt;

                blockMesh.position.x = eqX + posX;
                updateSpring();
            }

            // 실시간 물리 수치 UI 표시
            document.getElementById('val-disp').innerText = posX.toFixed(2) + ' m';
            document.getElementById('val-vel').innerText = velX.toFixed(2) + ' m/s';
            
            const period = 2 * Math.PI * Math.sqrt(m / k);
            document.getElementById('val-period').innerText = period.toFixed(2) + ' s';
        }

        // --- 8. 패널 조작 및 컨트롤 ---
        const btnTogglePhysics = document.getElementById('btn-toggle-physics');
        const physicsPanel = document.getElementById('physics-panel');

        btnTogglePhysics.addEventListener('click', () => {
            physicsPanel.classList.toggle('show');
            btnTogglePhysics.classList.toggle('active');
        });

        document.getElementById('sld-k').addEventListener('input', (e) => {
            k = parseFloat(e.target.value);
            document.getElementById('txt-k').innerText = k.toFixed(1) + ' N/m';
        });

        document.getElementById('sld-m').addEventListener('input', (e) => {
            m = parseFloat(e.target.value);
            document.getElementById('txt-m').innerText = m.toFixed(2) + ' kg';
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            posX = 0.0;
            velX = 0.0;
            blockMesh.position.x = eqX;
            updateSpring();
        });

        document.getElementById('btn-align').addEventListener('click', () => {
            camera.position.set(0, 1.2, 5.0);
            controls.target.set(0, 0, 0);
        });

        document.getElementById('theme-toggle').addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            scene.background.setHex(isDark ? 0x121212 : 0xf2f2f7);
            floor.material.color.setHex(isDark ? 0x1c1c1e : 0xe5e5ea);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 초기 용수철 생성
        updateSpring();

        // --- 9. 메인 애니메이션 루프 ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.03);
            updatePhysics(dt);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
