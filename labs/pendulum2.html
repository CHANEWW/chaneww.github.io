<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>단진자 3D - visionOS / Apple HIG Style</title>
    <!-- Three.js 및 OrbitControls 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        @font-face {
            font-family: 'SF Pro Display';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanL.woff') format('woff');
            font-weight: normal;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard', sans-serif;
            background-color: #e5e5ea;
            color: #1c1c1e;
        }

        /* 3D Canvas 영역 */
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Apple visionOS Glassmorphism UI 스타일 공통 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
            z-index: 10;
        }

        /* 좌측 상단 배지 및 뒤로가기 */
        .top-left-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            color: #1c1c1e;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.85);
            transform: translateY(-1px);
        }

        .tag-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
        }

        .tag-pill {
            background: rgba(0, 122, 255, 0.15);
            color: #007aff;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
        }

        /* 우측 상단 데이터 패널 */
        .top-right-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .data-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 20px;
        }

        .data-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .data-label {
            font-size: 11px;
            color: #8e8e93;
            font-weight: 500;
        }

        .data-value {
            font-size: 15px;
            font-weight: 700;
            color: #1c1c1e;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px);
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: scale(1.05);
        }

        /* 중앙 안내 툴팁 */
        .center-tooltip {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 18px;
            font-size: 13px;
            color: #8e8e93;
            border-radius: 30px;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.5s ease;
        }

        /* 하단 메인 컨트롤바 */
        .bottom-control-bar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            z-index: 10;
        }

        .control-tab-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 16px;
            min-width: 72px;
            border-radius: 14px;
            border: none;
            background: transparent;
            color: #1c1c1e;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-tab-btn.active {
            background: #007aff;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }

        .control-tab-btn:hover:not(.active) {
            background: rgba(0, 0, 0, 0.05);
        }

        .tab-icon {
            font-size: 18px;
            margin-bottom: 2px;
        }

        /* 서브 컨트롤 팝업 패널 */
        .sub-panel {
            position: absolute;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            padding: 20px;
            width: 320px;
            display: none;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }

        .sub-panel.show {
            display: flex;
        }

        .slider-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #007aff;
        }

        /* 다크모드 대응 */
        body.dark-mode {
            background-color: #121212;
            color: #f2f2f7;
        }

        body.dark-mode .glass-panel {
            background: rgba(30, 30, 30, 0.65);
            border-color: rgba(255, 255, 255, 0.1);
            color: #f2f2f7;
        }

        body.dark-mode .data-value, body.dark-mode .back-btn {
            color: #f2f2f7;
        }

        body.dark-mode .icon-btn {
            background: rgba(40, 40, 40, 0.65);
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- 3D Viewport Canvas -->
    <div id="canvas-container"></div>

    <!-- 좌측 상단: 메인 이동 & visionOS 타이틀 -->
    <div class="top-left-bar">
        <a href="../index.html" class="glass-panel back-btn">
            <span>⬅</span> 메인
        </a>
        <div class="glass-panel tag-badge">
            <span>단진자 3D</span>
            <span class="tag-pill">visionOS</span>
        </div>
    </div>

    <!-- 우측 상단: 물리 실시간 측정 데이터 및 테마 버튼 -->
    <div class="top-right-bar">
        <div class="glass-panel data-card">
            <div class="data-item">
                <span class="data-label">각도</span>
                <span class="data-value" id="val-angle">0.0°</span>
            </div>
            <div class="data-item">
                <span class="data-label">주기</span>
                <span class="data-value" id="val-period">1.42s</span>
            </div>
            <div class="data-item">
                <span class="data-label">속도</span>
                <span class="data-value" id="val-speed">0.00m/s</span>
            </div>
        </div>
        <button class="icon-btn glass-panel" id="theme-toggle" title="다크/라이트 모드">🌙</button>
    </div>

    <!-- 중앙 가이드 툴팁 -->
    <div class="glass-panel center-tooltip" id="guide-tooltip">
        ✨ 추를 마우스나 터치로 직접 끌어서 놓아보세요
    </div>

    <!-- 슬라이더/물리 설정 서브 팝업 패널 -->
    <div class="glass-panel sub-panel" id="physics-panel">
        <div class="slider-row">
            <div class="slider-header">
                <span>줄 길이 (L)</span>
                <span id="txt-length">1.5 m</span>
            </div>
            <input type="range" id="sld-length" min="0.5" max="3.0" step="0.1" value="1.5">
        </div>
        <div class="slider-row">
            <div class="slider-header">
                <span>중력 가속도 (g)</span>
                <span id="txt-gravity">9.8 m/s²</span>
            </div>
            <input type="range" id="sld-gravity" min="0" max="20" step="0.1" value="9.8">
        </div>
        <div class="slider-row">
            <div class="slider-header">
                <span>추 질량 (m)</span>
                <span id="txt-mass">1.0 kg</span>
            </div>
            <input type="range" id="sld-mass" min="0.2" max="3.0" step="0.1" value="1.0">
        </div>
    </div>

    <!-- 하단 visionOS 탭 스타일 컨트롤 바 -->
    <div class="glass-panel bottom-control-bar">
        <button class="control-tab-btn active" id="btn-play">
            <span class="tab-icon" id="icon-play">⏸</span>
            <span id="lbl-play">일시정지</span>
        </button>
        <button class="control-tab-btn" id="btn-toggle-physics">
            <span class="tab-icon">⚙️</span>
            <span>물리 조절</span>
        </button>
        <button class="control-tab-btn" id="btn-reset">
            <span class="tab-icon">🔄</span>
            <span>초기화</span>
        </button>
        <button class="control-tab-btn" id="btn-align">
            <span class="tab-icon">📷</span>
            <span>시점정렬</span>
        </button>
    </div>

    <script>
        // --- 1. Three.js 기본 씬 설정 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf2f2f7);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 4.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.1; // 바닥 아래로 카메라 이동 방지

        // --- 2. 조명 설정 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(3, 5, 3);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 15;
        scene.add(dirLight);

        // --- 3. 3D 스탠드 및 단진자 객체 생성 ---
        // 바닥 격자 및 그린 메쉬
        const floorGeo = new THREE.PlaneGeometry(20, 20);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xe5e5ea, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -1.5;
        floor.receiveShadow = true;
        scene.add(floor);

        const gridHelper = new THREE.GridHelper(20, 20, 0xd1d1d6, 0xe5e5ea);
        gridHelper.position.y = -1.49;
        scene.add(gridHelper);

        // 지지대 스탠드
        const standGroup = new THREE.Group();
        const metalMat = new THREE.MeshStandardMaterial({ color: 0x2c2c2e, metalness: 0.8, roughness: 0.2 });

        const basePole = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 2.8, 32), metalMat);
        basePole.position.set(0.8, -0.1, 0);
        basePole.castShadow = true;
        standGroup.add(basePole);

        const topCross = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.2, 32), metalMat);
        topCross.rotation.z = Math.PI / 2;
        topCross.position.set(0.3, 1.25, 0);
        topCross.castShadow = true;
        standGroup.add(topCross);

        scene.add(standGroup);

        // 단진자 매달린 피벗 그룹
        const pivotGroup = new THREE.Group();
        pivotGroup.position.set(0, 1.25, 0);
        scene.add(pivotGroup);

        // 실(Cylinder)
        let rodLength = 1.5;
        const rodGeo = new THREE.CylinderGeometry(0.008, 0.008, rodLength, 16);
        rodGeo.translate(0, -rodLength / 2, 0); // 피벗 기준으로 회전축 이동
        const rodMat = new THREE.MeshBasicMaterial({ color: 0x1c1c1e });
        const rodMesh = new THREE.Mesh(rodGeo, rodMat);
        pivotGroup.add(rodMesh);

        // 추(Sphere)
        const bobRadius = 0.15;
        const bobGeo = new THREE.SphereGeometry(bobRadius, 32, 32);
        const bobMat = new THREE.MeshPhysicalMaterial({ color: 0xff3b30, roughness: 0.1, metalness: 0.1, clearcoat: 0.8 });
        const bobMesh = new THREE.Mesh(bobGeo, bobMat);
        bobMesh.position.set(0, -rodLength, 0);
        bobMesh.castShadow = true;
        pivotGroup.add(bobMesh);

        // --- 4. 힘 화살표 벡터 (중력, 장력, 복원력) ---
        const gravityArrow = new THREE.ArrowHelper(new THREE.Vector3(0, -1, 0), new THREE.Vector3(), 0.5, 0x34c759, 0.1, 0.06);
        const tensionArrow = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(), 0.5, 0xff9500, 0.1, 0.06);
        const restoreArrow = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(), 0.5, 0x007aff, 0.1, 0.06);
        scene.add(gravityArrow);
        scene.add(tensionArrow);
        scene.add(restoreArrow);

        // --- 5. 단진자 물리 수식 엔진 ---
        let angle = Math.PI / 6; // 시작 각도 (30도)
        let angularVelocity = 0;
        let angularAcceleration = 0;
        let gravity = 9.8;
        let mass = 1.0;
        let isRunning = true;
        let isDragging = false;

        const clock = new THREE.Clock();

        function updatePhysics(dt) {
            if (!isRunning || isDragging) return;

            // 단진자 운동 방정식: d²θ/dt² = -(g/L) * sin(θ)
            angularAcceleration = -(gravity / rodLength) * Math.sin(angle);
            angularVelocity += angularAcceleration * dt;
            angularVelocity *= 0.999; // 공기 저항 감쇠
            angle += angularVelocity * dt;

            // 피벗 그룹 회전 연산
            pivotGroup.rotation.z = angle;

            // 추의 세계 좌표 계산
            const bobWorldPos = new THREE.Vector3();
            bobMesh.getWorldPosition(bobWorldPos);

            // 화살표 위치 및 방향 갱신
            gravityArrow.position.copy(bobWorldPos);
            gravityArrow.setLength(0.4 + mass * 0.1);

            tensionArrow.position.copy(bobWorldPos);
            const tensionDir = new THREE.Vector3().subVectors(pivotGroup.position, bobWorldPos).normalize();
            tensionArrow.setDirection(tensionDir);
            tensionArrow.setLength(0.4 + Math.cos(angle) * 0.3);

            restoreArrow.position.copy(bobWorldPos);
            const restoreDir = new THREE.Vector3(Math.cos(angle), -Math.sin(angle), 0).normalize();
            if (angle > 0) restoreDir.negate();
            restoreArrow.setDirection(restoreDir);
            restoreArrow.setLength(Math.abs(Math.sin(angle)) * 0.8);

            // UI 데이터 업데이트
            document.getElementById('val-angle').innerText = (angle * (180 / Math.PI)).toFixed(1) + '°';
            const period = (2 * Math.PI * Math.sqrt(rodLength / gravity)).toFixed(2);
            document.getElementById('val-period').innerText = period + 's';
            const speed = Math.abs(angularVelocity * rodLength).toFixed(2);
            document.getElementById('val-speed').innerText = speed + 'm/s';
        }

        // --- 6. 드래그 앤 드롭 인터랙션 (Raycasting) ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);

        function onPointerDown(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(bobMesh);

            if (intersects.length > 0) {
                isDragging = true;
                controls.enabled = false; // 드래그 시 카메라 회전 비활성화
                document.getElementById('guide-tooltip').style.opacity = '0';
            }
        }

        function onPointerMove(e) {
            if (!isDragging) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersectionPoint = new THREE.Vector3();
            raycaster.ray.intersectPlane(dragPlane, intersectionPoint);

            if (intersectionPoint) {
                const dx = intersectionPoint.x - pivotGroup.position.x;
                const dy = intersectionPoint.y - pivotGroup.position.y;
                angle = Math.atan2(-dx, -dy);
                angle = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, angle)); // 최대 80도 제한
                
                pivotGroup.rotation.z = angle;
                angularVelocity = 0; // 드래그 중에는 속도 초기화

                document.getElementById('val-angle').innerText = (angle * (180 / Math.PI)).toFixed(1) + '°';
            }
        }

        function onPointerUp() {
            if (isDragging) {
                isDragging = false;
                controls.enabled = true;
            }
        }

        window.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);

        // --- 7. UI 조작 이벤트 처리 ---
        // 일시정지 / 재개
        const btnPlay = document.getElementById('btnPlay');
        btnPlay.addEventListener('click', () => {
            isRunning = !isRunning;
            document.getElementById('icon-play').innerText = isRunning ? '⏸' : '▶';
            document.getElementById('lbl-play').innerText = isRunning ? '일시정지' : '시작';
            btnPlay.classList.toggle('active', isRunning);
        });

        // 물리 설정 패널 토글
        const btnTogglePhysics = document.getElementById('btn-toggle-physics');
        const physicsPanel = document.getElementById('physics-panel');
        btnTogglePhysics.addEventListener('click', () => {
            physicsPanel.classList.toggle('show');
            btnTogglePhysics.classList.toggle('active');
        });

        // 슬라이더 변경 감지
        document.getElementById('sld-length').addEventListener('input', (e) => {
            rodLength = parseFloat(e.target.value);
            document.getElementById('txt-length').innerText = rodLength.toFixed(1) + ' m';
            rodMesh.scale.set(1, rodLength / 1.5, 1);
            bobMesh.position.y = -rodLength;
        });

        document.getElementById('sld-gravity').addEventListener('input', (e) => {
            gravity = parseFloat(e.target.value);
            document.getElementById('txt-gravity').innerText = gravity.toFixed(1) + ' m/s²';
        });

        document.getElementById('sld-mass').addEventListener('input', (e) => {
            mass = parseFloat(e.target.value);
            document.getElementById('txt-mass').innerText = mass.toFixed(1) + ' kg';
            const newScale = Math.cbrt(mass);
            bobMesh.scale.set(newScale, newScale, newScale);
        });

        // 초기화 버튼
        document.getElementById('btn-reset').addEventListener('click', () => {
            angle = Math.PI / 6;
            angularVelocity = 0;
            pivotGroup.rotation.z = angle;
        });

        // 시점 정렬
        document.getElementById('btn-align').addEventListener('click', () => {
            camera.position.set(0, 1.5, 4.5);
            controls.target.set(0, 0, 0);
        });

        // 라이트/다크 테마 토글
        const themeBtn = document.getElementById('theme-toggle');
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            themeBtn.innerText = isDark ? '☀️' : '🌙';
            scene.background.setHex(isDark ? 0x121212 : 0xf2f2f7);
            floorMat.color.setHex(isDark ? 0x1c1c1e : 0xe5e5ea);
        });

        // 창 크기 조절 대응
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 8. 애니메이션 루프 ---
        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            updatePhysics(dt);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
