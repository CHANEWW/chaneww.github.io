<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>진자 운동 실험</title>
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 8px 16px;
            background-color: #2c3e50;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
        canvas {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin: 20px auto;
            display: block;
        }
        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background-color: #3498db;
            color: white;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <a href="../index.html" class="back-btn">⬅ 메인 화면으로 돌아가기</a>
    
    <h2>⏱️ 진자 운동 가상 실험실</h2>
    
    <div class="controls">
        <label>실의 길이 조절: <input type="range" id="lengthSlider" min="50" max="250" value="150"></label>
        <br><br>
        <button onclick="startSim()">실험 시작</button>
        <button onclick="stopSim()">정지</button>
    </div>

    <canvas id="simCanvas" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const lengthSlider = document.getElementById('lengthSlider');
        
        let length = parseInt(lengthSlider.value);
        let angle = Math.PI / 4; // 시작 각도 (45도)
        let angularVelocity = 0;
        let angularAcceleration = 0;
        const gravity = 0.5; // 중력 가속도 임의값
        let isRunning = false;
        let animationId;

        // 진자 그리기 함수
        function drawPendulum() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const originX = canvas.width / 2;
            const originY = 50;
            
            // 현재 실의 길이에 따른 추의 위치 계산
            const bobX = originX + length * Math.sin(angle);
            const bobY = originY + length * Math.cos(angle);
            
            // 실 그리기
            ctx.beginPath();
            ctx.moveTo(originX, originY);
            ctx.lineTo(bobX, bobY);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // 추 그리기
            ctx.beginPath();
            ctx.arc(bobX, bobY, 20, 0, Math.PI * 2);
            ctx.fillStyle = '#e74c3c';
            ctx.fill();
            ctx.stroke();
        }

        // 물리 엔진 업데이트 함수
        function updatePhysics() {
            if (isRunning) {
                // 단진자 운동 방정식: a = -(g/L) * sin(theta)
                angularAcceleration = -(gravity / length) * Math.sin(angle);
                angularVelocity += angularAcceleration;
                // 공기 저항 (마찰) 추가
                angularVelocity *= 0.995; 
                angle += angularVelocity;
            }
        }

        // 애니메이션 루프
        function animate() {
            updatePhysics();
            drawPendulum();
            animationId = requestAnimationFrame(animate);
        }

        // 슬라이더 조절 시 실시간 반영
        lengthSlider.addEventListener('input', function() {
            length = parseInt(this.value);
            if (!isRunning) drawPendulum();
        });

        // 시작/정지 버튼 제어
        function startSim() {
            if (!isRunning) {
                isRunning = true;
            }
        }
        function stopSim() {
            isRunning = false;
        }

        // 초기 화면 그리기 시작
        drawPendulum();
        animate();
    </script>
</body>
</html>
