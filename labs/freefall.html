<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>자유 낙하 운동 3D</title>
    <!-- Three.js 및 OrbitControls 라이브러리 로드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        @font-face {
            font-family: 'SeoulNamsanL';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanL.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'SeoulNamsanL', -apple-system, sans-serif;
            background-color: #f2f2f7;
            color: #1c1c1e;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Apple visionOS Glassmorphic UI */
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            z-index: 10;
        }

        /* 좌측 상단 헤더 */
        .top-left-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            color: #1c1c1e;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tag-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
        }

        .tag-pill {
            background: rgba(0, 122, 255, 0.15);
            color: #007aff;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
        }

        /* 우측 상단 실시간 데이터 표시 카드 */
        .top-right-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .data-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 20px;
        }

        .data-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .data-label {
            font-size: 11px;
            color: #8e8e93;
            font-weight: bold;
        }

        .data-value {
            font-size: 15px;
            font-weight: bold;
            color: #1c1c1e;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            transition: all 0.2s;
        }

        /* 중앙 안내 메시지 */
        .center-tooltip {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 18px;
            font-size: 13px;
            color: #8e8e93;
            border-radius: 30px;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.5s ease;
        }

        /* 하단 제어 바 */
        .bottom-control-bar {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            z-index: 10;
        }

        .control-tab-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 14px;
            min-width: 68px;
            border-radius: 14px;
            border: none;
            background: transparent;
            color: #1c1c1e;
            font-size: 12px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-tab-btn.active {
            background: #007aff;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }

        /* 서브 물리 설정 패널 */
        .sub-panel {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            padding: 20px;
            width: 300px;
            display: none;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }

        .sub-panel.show { display: flex; }

        .checkbox-row {
            display: flex;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
        }
        .checkbox-row label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        /* 다크 모드 */
        body.dark-mode {
            background-color: #121212;
            color: #f2f2f7;
        }

        body.dark-mode .glass-panel {
            background: rgba(30, 30, 30, 0.75);
            border-color: rgba(255, 255, 255, 0.15);
            color: #f2f2f7;
        }

        body.dark-mode .data-value, body.dark-mode .back-btn {
            color: #f2f2f7;
        }

        body.dark-mode .icon-btn {
            background: rgba(40, 40, 40, 0.75);
            color: #fff;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- 좌측 상단 헤더 -->
    <div class="top-left-bar">
        <a href="../index.html" class="glass-panel back-btn">
            <span>⬅</span> 메인
        </a>
        <div class="glass-panel tag-badge">
            <span>자유 낙하 운동 3D</span>
            <span class="tag-pill">visionOS</span>
        </div>
    </div>

    <!-- 우측 상단 실시간 데이터 패널 -->
    <div class="top-right-bar">
        <div class="glass-panel data-card">
            <div class="data-item">
                <span class="data-label">위치 (높이)</span>
                <span class="data-value" id="val-pos" style="color:#007aff;">0.00 m</span>
            </div>
            <div class="data-item">
                <span class="data-label">속력</span>
                <span class="data-value" id="val-vel" style="color:#34c759;">0.00 m/s</span>
            </div>
            <div class="data-item">
                <span class="data-label">가속도</span>
                <span class="data-value" id="val-acc" style="color:#ff9500;">9.80 m/s²</span>
            </div>
        </div>
        <button class="icon-btn glass-panel" id="theme-toggle">🌙</button>
    </div>

    <!-- 중앙 안내 툴팁 -->
    <div class="glass-panel center-tooltip" id="guide-tooltip">
        ⚽ 축구공을 클릭/터치한 상태로 위로 끌어올린 후 손을 떼세요
    </div>

    <!-- 물리 조절 서브 패널 -->
    <div class="glass-panel sub-panel" id="physics-panel">
        <div class="checkbox-row">
            <label><input type="checkbox" id="chk-gravity-arrow" checked> 🔴 중력 화살표 표시</label>
        </div>
    </div>

    <!-- 하단 제어 바 -->
    <div class="glass-panel bottom-control-bar">
        <button class="control-tab-btn" id="btn-toggle-physics">
            <span>⚙️</span>
            <span>물리 조절</span>
        </button>
        <button class="control-tab-btn" id="btn-reset">
            <span>🔄</span>
            <span>초기화</span>
        </button>
        <button class="control-tab-btn" id="btn-align">
            <span>📷</span>
            <span>시점정렬</span>
        </button>
    </div>

    <script>
        // --- 1. Three.js 기본 씬 & 카메라 & 렌더러 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf2f2f7);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 4, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 3, 0);

        // --- 2. 조명 설정 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(5, 12, 8);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // --- 3. 바닥 및 눈금 기둥 생성 ---
        const floorY = 0; // 바닥 높이 기준 (0m)
        const ballRadius = 0.4; // 축구공 반지름 (m)

        // 바닥 격자 및 메쉬
        const floorGeo = new THREE.PlaneGeometry(16, 16);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xe5e5ea, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = floorY;
        floor.receiveShadow = true;
        scene.add(floor);

        const gridHelper = new THREE.GridHelper(16, 16, 0xd1d1d6, 0xe5e5ea);
        gridHelper.position.y = floorY + 0.01;
        scene.add(gridHelper);

        // 높이 측정을 위한 미터 단위 눈금 자 (스탠드 기둥)
        const poleGeo = new THREE.CylinderGeometry(0.05, 0.05, 8, 16);
        const poleMat = new THREE.MeshStandardMaterial({ color: 0x8e8e93 });
        const pole = new THREE.Mesh(poleGeo, poleMat);
        pole.position.set(-2, 4, 0);
        scene.add(pole);

        // --- 4. 축구공 (Soccer Ball) 3D 텍스처 메쉬 생성 ---
        function createSoccerBallTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 512, 256);
            
            ctx.fillStyle = '#1c1c1e';
            for (let y = 30; y <= 256; y += 80) {
                for (let x = (y % 160 === 30 ? 30 : 110); x <= 512; x += 160) {
                    ctx.beginPath();
                    for (let i = 0; i < 5; i++) {
                        const angle = (i * 72 - 18) * Math.PI / 180;
                        const px = x + 25 * Math.cos(angle);
                        const py = y + 25 * Math.sin(angle);
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    ctx.fill();
                }
            }
            return new THREE.CanvasTexture(canvas);
        }

        const ballGeo = new THREE.SphereGeometry(ballRadius, 32, 32);
        const ballMat = new THREE.MeshStandardMaterial({
            map: createSoccerBallTexture(),
            roughness: 0.3,
            metalness: 0.1
        });
        const ball = new THREE.Mesh(ballGeo, ballMat);
        ball.castShadow = true;
        scene.add(ball);

        // --- 5. 빨간색 중력 화살표 헬퍼 ---
        const gravityArrow = new THREE.ArrowHelper(
            new THREE.Vector3(0, -1, 0),
            ball.position,
            1.2,
            0xff3b30,
            0.25,
            0.15
        );
        scene.add(gravityArrow);

        // --- 6. 물리 상태 변수 ---
        const g = 9.80; // 중력가속도 (m/s²)
        let posY = floorY + ballRadius; // 바닥에 접한 초기 위치
        let velY = 0; // 초기 속력
        let isFalling = false;
        let isDragging = false;
        let dragOffsetY = 0;

        ball.position.set(0, posY, 0);

        // --- 7. 마우스/터치 드래그 연동 (Raycasting) ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
        const planeIntersect = new THREE.Vector3();

        function getMousePos(e) {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
        }

        function onPointerDown(e) {
            getMousePos(e);
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(ball);

            if (intersects.length > 0) {
                isDragging = true;
                isFalling = false;
                velY = 0;
                controls.enabled = false; // 드래그 중 화면 회전 멈춤
                raycaster.ray.intersectPlane(dragPlane, planeIntersect);
                dragOffsetY = ball.position.y - planeIntersect.y;
                document.getElementById('guide-tooltip').style.opacity = '0';
            }
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            getMousePos(e);
            raycaster.setFromCamera(mouse, camera);
            if (raycaster.ray.intersectPlane(dragPlane, planeIntersect)) {
                let newY = planeIntersect.y + dragOffsetY;
                // 바닥 최하단 ~ 상단 한계 높이 제한 (0.4m ~ 7.5m)
                newY = Math.max(floorY + ballRadius, Math.min(7.5, newY));
                ball.position.y = newY;
                posY = newY;
            }
        }

        function onPointerUp() {
            if (isDragging) {
                isDragging = false;
                controls.enabled = true;
                // 공이 바닥보다 떠있는 위치에서 손을 놓았을 때 자유 낙하 개시
                if (ball.position.y > floorY + ballRadius + 0.001) {
                    isFalling = true;
                    velY = 0; // 자유 낙하 초기 속도 = 0 m/s
                }
            }
        }

        window.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        window.addEventListener('touchstart', onPointerDown, { passive: false });
        window.addEventListener('touchmove', onPointerMove, { passive: false });
        window.addEventListener('touchend', onPointerUp);

        // --- 8. 물리 시뮬레이션 및 데이터 업데이트 루프 ---
        const clock = new THREE.Clock();

        function updatePhysics() {
            const dt = clock.getDelta();

            // 자유 낙하 운동 연산 (v = v0 + gt, y = y0 - vt)
            if (isFalling && !isDragging) {
                velY += g * dt; // 속력 증가
                posY -= velY * dt; // 위치 감소

                // 바닥에 충돌했을 때 완전 정지
                if (posY <= floorY + ballRadius) {
                    posY = floorY + ballRadius;
                    velY = 0;
                    isFalling = false;
                }
                ball.position.y = posY;
            }

            // 바닥 기준 물체 중심까지의 위치(높이 m)
            const heightFromFloor = ball.position.y - floorY;

            // 오른쪽 상단 실시간 데이터 반영
            document.getElementById('val-pos').innerText = heightFromFloor.toFixed(2) + ' m';
            document.getElementById('val-vel').innerText = velY.toFixed(2) + ' m/s';
            document.getElementById('val-acc').innerText = (heightFromFloor > ballRadius + 0.001 || isFalling ? g.toFixed(2) : '0.00') + ' m/s²';

            // 빨간색 중력 화살표 위치 및 표시 여부
            gravityArrow.position.copy(ball.position);
            const showArrow = document.getElementById('chk-gravity-arrow').checked;
            gravityArrow.visible = showArrow;
        }

        // --- 9. UI 이벤트 리스너 ---
        const btnTogglePhysics = document.getElementById('btn-toggle-physics');
        const physicsPanel = document.getElementById('physics-panel');
        btnTogglePhysics.addEventListener('click', () => {
            physicsPanel.classList.toggle('show');
            btnTogglePhysics.classList.toggle('active');
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            isFalling = false;
            isDragging = false;
            velY = 0;
            posY = floorY + ballRadius;
            ball.position.set(0, posY, 0);
            document.getElementById('guide-tooltip').style.opacity = '1';
        });

        document.getElementById('btn-align').addEventListener('click', () => {
            camera.position.set(0, 4, 10);
            controls.target.set(0, 3, 0);
        });

        document.getElementById('theme-toggle').addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            scene.background.setHex(isDark ? 0x121212 : 0xf2f2f7);
            floor.material.color.setHex(isDark ? 0x1c1c1e : 0xe5e5ea);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 10. 메인 랜더링 애니메이션 루프 ---
        function animate() {
            requestAnimationFrame(animate);
            updatePhysics();
            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
