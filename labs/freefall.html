<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>자유 낙하 운동 3D</title>
    <!-- Three.js 및 OrbitControls 라이브러리 로드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        @font-face {
            font-family: 'SeoulNamsanL';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanL.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'SeoulNamsanL', -apple-system, sans-serif;
            background-color: #f2f2f7;
            color: #1c1c1e;
            touch-action: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            touch-action: none;
        }

        /* Apple visionOS Glassmorphic UI */
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            z-index: 10;
        }

        /* 좌측 상단 헤더 및 지구/달 선택 탭 */
        .top-left-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            color: #1c1c1e;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tag-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
        }

        .tag-pill {
            background: rgba(0, 122, 255, 0.15);
            color: #007aff;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
        }

        /* 환경 (지구 / 달) 세그먼트 컨트롤 */
        .env-toggle-group {
            display: flex;
            padding: 3px;
            border-radius: 14px;
        }

        .env-btn {
            padding: 6px 14px;
            font-size: 13px;
            font-weight: bold;
            border: none;
            background: transparent;
            color: #8e8e93;
            cursor: pointer;
            border-radius: 11px;
            transition: all 0.2s;
        }

        .env-btn.active {
            background: #ffffff;
            color: #007aff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        /* 우측 상단 실시간 데이터 및 그래프 영역 */
        .top-right-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 12px;
            z-index: 10;
        }

        .data-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 20px;
        }

        .data-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .data-label {
            font-size: 11px;
            color: #8e8e93;
            font-weight: bold;
        }

        .data-value {
            font-size: 15px;
            font-weight: bold;
            color: #1c1c1e;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            transition: all 0.2s;
        }

        /* 그래프 패널 */
        .graph-panel {
            padding: 12px 16px;
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .graph-header {
            font-size: 12px;
            font-weight: bold;
            color: #1c1c1e;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        canvas.graph-canvas {
            width: 100%;
            height: 70px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        /* 중앙 안내 툴팁 */
        .center-tooltip {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 18px;
            font-size: 13px;
            color: #8e8e93;
            border-radius: 30px;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.5s ease;
        }

        /* 하단 제어 바 */
        .bottom-control-bar {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            z-index: 10;
        }

        .control-tab-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 14px;
            min-width: 68px;
            border-radius: 14px;
            border: none;
            background: transparent;
            color: #1c1c1e;
            font-size: 12px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-tab-btn.active {
            background: #007aff;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }

        /* 서브 물리 설정 패널 */
        .sub-panel {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            padding: 20px;
            width: 300px;
            display: none;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .sub-panel.show { display: flex; }

        .checkbox-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: bold;
        }

        .checkbox-row label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        /* 다크 모드 */
        body.dark-mode {
            background-color: #121212;
            color: #f2f2f7;
        }

        body.dark-mode .glass-panel {
            background: rgba(30, 30, 30, 0.75);
            border-color: rgba(255, 255, 255, 0.15);
            color: #f2f2f7;
        }

        body.dark-mode .data-value, body.dark-mode .back-btn, body.dark-mode .graph-header {
            color: #f2f2f7;
        }

        body.dark-mode .icon-btn {
            background: rgba(40, 40, 40, 0.75);
            color: #fff;
        }

        body.dark-mode .env-btn.active {
            background: #3a3a3c;
            color: #0a84ff;
        }

        body.dark-mode canvas.graph-canvas {
            background: rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- 좌측 상단 헤더 & 지구/달 전환 -->
    <div class="top-left-bar">
        <a href="../index.html" class="glass-panel back-btn">
            <span>⬅</span> 메인
        </a>
        <div class="glass-panel tag-badge">
            <span>자유 낙하 운동 3D</span>
            <span class="tag-pill">visionOS</span>
        </div>
        <div class="glass-panel env-toggle-group">
            <button class="env-btn active" id="btn-env-earth">🌍 지구</button>
            <button class="env-btn" id="btn-env-moon">🌕 달</button>
        </div>
    </div>

    <!-- 우측 상단 실시간 데이터 및 그래프 -->
    <div class="top-right-bar">
        <div style="display: flex; gap: 10px;">
            <div class="glass-panel data-card">
                <div class="data-item">
                    <span class="data-label">위치 (높이)</span>
                    <span class="data-value" id="val-pos" style="color:#007aff;">0.40 m</span>
                </div>
                <div class="data-item">
                    <span class="data-label">속력</span>
                    <span class="data-value" id="val-vel" style="color:#34c759;">0.00 m/s</span>
                </div>
                <div class="data-item">
                    <span class="data-label">가속도</span>
                    <span class="data-value" id="val-acc" style="color:#ff9500;">0.00 m/s²</span>
                </div>
            </div>
            <button class="icon-btn glass-panel" id="theme-toggle">🌙</button>
        </div>

        <!-- 실시간 2D 그래프 패널 -->
        <div class="glass-panel graph-panel">
            <div class="graph-header">
                <span>위치-시간 (y-t)</span>
                <span style="color:#007aff;">m</span>
            </div>
            <canvas id="canvas-pos-graph" class="graph-canvas" width="250" height="70"></canvas>

            <div class="graph-header">
                <span>속도-시간 (v-t)</span>
                <span style="color:#34c759;">m/s</span>
            </div>
            <canvas id="canvas-vel-graph" class="graph-canvas" width="250" height="70"></canvas>

            <div class="graph-header">
                <span>가속도-시간 (a-t)</span>
                <span style="color:#ff9500;">m/s²</span>
            </div>
            <canvas id="canvas-acc-graph" class="graph-canvas" width="250" height="70"></canvas>
        </div>
    </div>

    <!-- 중앙 안내 툴팁 -->
    <div class="glass-panel center-tooltip" id="guide-tooltip">
        ⚽ 축구공을 클릭/터치한 상태로 위로 끌어올린 후 손을 떼세요
    </div>

    <!-- 물리 조절 서브 패널 -->
    <div class="glass-panel sub-panel" id="physics-panel">
        <div class="checkbox-row">
            <label><input type="checkbox" id="chk-gravity-arrow" checked> 🔴 중력 화살표</label>
            <label><input type="checkbox" id="chk-velocity-arrow" checked> 🟢 속력 화살표</label>
        </div>
    </div>

    <!-- 하단 제어 바 -->
    <div class="glass-panel bottom-control-bar">
        <button class="control-tab-btn" id="btn-toggle-physics">
            <span>⚙️</span>
            <span>물리 조절</span>
        </button>
        <button class="control-tab-btn" id="btn-reset">
            <span>🔄</span>
            <span>초기화</span>
        </button>
        <button class="control-tab-btn" id="btn-align">
            <span>📷</span>
            <span>시점정렬</span>
        </button>
    </div>

    <script>
        // --- 1. Three.js 기본 씬 & 카메라 & 렌더러 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf2f2f7);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3.5, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 2.5, 0);

        // --- 2. 조명 설정 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(5, 12, 8);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // --- 3. 바닥 및 눈금 격자 생성 ---
        const floorY = 0; // 바닥 높이 기준 (0m)
        const ballRadius = 0.4; // 축구공 반지름 (m)

        const floorGeo = new THREE.PlaneGeometry(20, 20);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xe5e5ea, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = floorY;
        floor.receiveShadow = true;
        scene.add(floor);

        const gridHelper = new THREE.GridHelper(20, 20, 0xd1d1d6, 0xe5e5ea);
        gridHelper.position.y = floorY + 0.01;
        scene.add(gridHelper);

        // --- 4. 축구공 3D 메쉬 생성 ---
        function createSoccerBallTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 512, 256);
            
            ctx.fillStyle = '#1c1c1e';
            for (let y = 30; y <= 256; y += 80) {
                for (let x = (y % 160 === 30 ? 30 : 110); x <= 512; x += 160) {
                    ctx.beginPath();
                    for (let i = 0; i < 5; i++) {
                        const angle = (i * 72 - 18) * Math.PI / 180;
                        const px = x + 25 * Math.cos(angle);
                        const py = y + 25 * Math.sin(angle);
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    ctx.fill();
                }
            }
            return new THREE.CanvasTexture(canvas);
        }

        const ballGeo = new THREE.SphereGeometry(ballRadius, 32, 32);
        const ballMat = new THREE.MeshStandardMaterial({
            map: createSoccerBallTexture(),
            roughness: 0.3,
            metalness: 0.1
        });
        const ball = new THREE.Mesh(ballGeo, ballMat);
        ball.castShadow = true;
        scene.add(ball);

        // --- 5. 3D 힘 및 속력 벡터 화살표 ---
        // 🔴 빨간색 중력 화살표
        const gravityArrow = new THREE.ArrowHelper(
            new THREE.Vector3(0, -1, 0),
            ball.position,
            1.2,
            0xff3b30,
            0.25,
            0.15
        );
        scene.add(gravityArrow);

        // 🟢 초록색 속력 화살표
        const velocityArrow = new THREE.ArrowHelper(
            new THREE.Vector3(0, -1, 0),
            ball.position,
            0.1,
            0x34c759,
            0.25,
            0.15
        );
        scene.add(velocityArrow);

        // --- 6. 물리 및 환경 상태 변수 ---
        let currentEnv = 'earth'; // 'earth' or 'moon'
        let g = 9.80; // 지구: 9.80 m/s², 달: 1.63 m/s²
        let posY = floorY + ballRadius;
        let velY = 0;
        let isFalling = false;
        let isDragging = false;
        let dragOffsetY = 0;

        ball.position.set(0, posY, 0);

        // --- 7. 실시간 그래프 기록용 데이터 변수 ---
        let fallTime = 0;
        const graphData = []; // { t, pos, vel, acc } 저장 array
        const maxGraphTime = 2.0; // 그래프 X축 최대 시간 (2초)

        const cvsPos = document.getElementById('canvas-pos-graph');
        const cvsVel = document.getElementById('canvas-vel-graph');
        const cvsAcc = document.getElementById('canvas-acc-graph');

        function clearAndDrawGraphGrid(canvas, color, maxY, unit) {
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;

            ctx.clearRect(0, 0, w, h);

            // 가로 및 세로 안내선
            ctx.strokeStyle = 'rgba(142, 142, 147, 0.2)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(30, 10); ctx.lineTo(30, h - 15);
            ctx.moveTo(30, h - 15); ctx.lineTo(w - 10, h - 15);
            ctx.stroke();

            // 최대 Y축 눈금 표시
            ctx.fillStyle = '#8e8e93';
            ctx.font = '9px sans-serif';
            ctx.fillText(maxY.toFixed(1), 2, 12);
            ctx.fillText('0', 18, h - 13);
            ctx.fillText(maxGraphTime + 's', w - 22, h - 3);

            if (graphData.length < 2) return;

            // 데이터 곡선 그리기
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.beginPath();

            for (let i = 0; i < graphData.length; i++) {
                const d = graphData[i];
                const x = 30 + (d.t / maxGraphTime) * (w - 40);
                let val = 0;
                if (canvas === cvsPos) val = d.pos;
                else if (canvas === cvsVel) val = d.vel;
                else if (canvas === cvsAcc) val = d.acc;

                const y = (h - 15) - (val / maxY) * (h - 25);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        function renderGraphs() {
            const maxPosScale = 8.0;
            const maxVelScale = currentEnv === 'earth' ? 15.0 : 5.0;
            const maxAccScale = currentEnv === 'earth' ? 12.0 : 3.0;

            clearAndDrawGraphGrid(cvsPos, '#007aff', maxPosScale, 'm');
            clearAndDrawGraphGrid(cvsVel, '#34c759', maxVelScale, 'm/s');
            clearAndDrawGraphGrid(cvsAcc, '#ff9500', maxAccScale, 'm/s²');
        }

        // --- 8. 포인터(마우스/터치) 드래그 연동 ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
        const planeIntersect = new THREE.Vector3();

        function updateMousePos(e) {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
        }

        function resetSimulation() {
            isFalling = false;
            isDragging = false;
            velY = 0;
            fallTime = 0;
            posY = floorY + ballRadius;
            ball.position.set(0, posY, 0);
            graphData.length = 0; // 그래프 데이터 초기화
            renderGraphs();
            document.getElementById('guide-tooltip').style.opacity = '1';
        }

        function onPointerDown(e) {
            updateMousePos(e);
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(ball);

            if (intersects.length > 0) {
                isDragging = true;
                isFalling = false;
                velY = 0;
                fallTime = 0;
                graphData.length = 0; // 새로 잡았을 때 이전 그래프 초기화
                controls.enabled = false;
                raycaster.ray.intersectPlane(dragPlane, planeIntersect);
                dragOffsetY = ball.position.y - planeIntersect.y;
                document.getElementById('guide-tooltip').style.opacity = '0';
            }
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            updateMousePos(e);
            raycaster.setFromCamera(mouse, camera);
            if (raycaster.ray.intersectPlane(dragPlane, planeIntersect)) {
                let newY = planeIntersect.y + dragOffsetY;
                newY = Math.max(floorY + ballRadius, Math.min(8.0, newY));
                ball.position.y = newY;
                posY = newY;
            }
        }

        function onPointerUp() {
            if (isDragging) {
                isDragging = false;
                controls.enabled = true;
                if (ball.position.y > floorY + ballRadius + 0.001) {
                    isFalling = true;
                    velY = 0;
                    fallTime = 0;
                    graphData.length = 0;
                }
            }
        }

        window.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);

        // --- 9. 물리 시뮬레이션 및 데이터 업데이트 루프 ---
        const clock = new THREE.Clock();

        function updatePhysics() {
            const dt = clock.getDelta();

            if (isFalling && !isDragging) {
                fallTime += dt;
                velY += g * dt;
                posY -= velY * dt;

                // 바닥 충돌 시 완전 정지 (그래프는 마지막 상태로 보존)
                if (posY <= floorY + ballRadius) {
                    posY = floorY + ballRadius;
                    velY = 0;
                    isFalling = false;
                }
                ball.position.y = posY;

                // 실시간 그래프 데이터 기록 (낙하 진행 중일 때만 추가)
                const currentHeight = posY - floorY;
                graphData.push({
                    t: fallTime,
                    pos: currentHeight,
                    vel: velY,
                    acc: g
                });
                renderGraphs();
            }

            const heightFromFloor = ball.position.y - floorY;

            // 오른쪽 상단 실시간 데이터 반영
            document.getElementById('val-pos').innerText = heightFromFloor.toFixed(2) + ' m';
            document.getElementById('val-vel').innerText = velY.toFixed(2) + ' m/s';
            document.getElementById('val-acc').innerText = (heightFromFloor > ballRadius + 0.001 || isFalling ? g.toFixed(2) : '0.00') + ' m/s²';

            // 중력 및 속력 화살표 위치 및 크기 조절
            gravityArrow.position.copy(ball.position);
            velocityArrow.position.copy(ball.position);

            const showGravity = document.getElementById('chk-gravity-arrow').checked;
            const showVelocity = document.getElementById('chk-velocity-arrow').checked;

            gravityArrow.visible = showGravity;
            velocityArrow.visible = showVelocity && velY > 0.05;

            // 속력이 빨라질수록 초록색 속력 화살표 길이를 실시간 연동 (스케일 조정)
            velocityArrow.setLength(Math.min(3.5, velY * 0.25), 0.25, 0.15);
        }

        // --- 10. 지구 / 달 환경 버튼 제어 ---
        const btnEarth = document.getElementById('btn-env-earth');
        const btnMoon = document.getElementById('btn-env-moon');

        btnEarth.addEventListener('click', () => {
            currentEnv = 'earth';
            g = 9.80;
            btnEarth.classList.add('active');
            btnMoon.classList.remove('active');
            resetSimulation();
        });

        btnMoon.addEventListener('click', () => {
            currentEnv = 'moon';
            g = 1.63;
            btnMoon.classList.add('active');
            btnEarth.classList.remove('active');
            resetSimulation();
        });

        // --- 11. 기타 UI 버튼 이벤트 ---
        const btnTogglePhysics = document.getElementById('btn-toggle-physics');
        const physicsPanel = document.getElementById('physics-panel');
        btnTogglePhysics.addEventListener('click', () => {
            physicsPanel.classList.toggle('show');
            btnTogglePhysics.classList.toggle('active');
        });

        document.getElementById('btn-reset').addEventListener('click', resetSimulation);

        document.getElementById('btn-align').addEventListener('click', () => {
            camera.position.set(0, 3.5, 12);
            controls.target.set(0, 2.5, 0);
        });

        document.getElementById('theme-toggle').addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            scene.background.setHex(isDark ? 0x121212 : 0xf2f2f7);
            floor.material.color.setHex(isDark ? 0x1c1c1e : 0xe5e5ea);
            renderGraphs();
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 초기 그래프 그리드 출력
        renderGraphs();

        // --- 12. 메인 애니메이션 루프 ---
        function animate() {
            requestAnimationFrame(animate);
            updatePhysics();
            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
