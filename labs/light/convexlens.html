<!DOCTYPE html>
<html lang="ko" data-mzoom="1.15">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>볼록 렌즈에 의한 상 3D</title>
    <!-- Three.js 및 OrbitControls 3D 엔진 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        @font-face {
            font-family: 'SeoulNamsan';
            src: local('SeoulNamsan M'), local('SeoulNamsanM'), local('서울남산체 M'),
                 url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'SeoulNamsan', -apple-system, sans-serif;
            background-color: #f2f2f7;
            color: #1c1c1e;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            z-index: 10;
        }

        .top-left-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            color: #1c1c1e;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tag-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
        }

        .tag-pill {
            background: rgba(0, 122, 255, 0.15);
            color: #007aff;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
        }

        .top-right-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .data-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 20px;
        }

        .data-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .data-label {
            font-size: 11px;
            color: #8e8e93;
            font-weight: bold;
        }

        .data-value {
            font-size: 15px;
            font-weight: bold;
            color: #1c1c1e;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            transition: all 0.2s;
        }

        .center-tooltip {
            position: absolute;
            top: 12%;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 18px;
            font-size: 13px;
            color: #8e8e93;
            border-radius: 30px;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.5s ease;
            white-space: nowrap;
        }

        .bottom-control-bar {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            z-index: 10;
        }

        .control-tab-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 14px;
            min-width: 68px;
            border-radius: 14px;
            border: none;
            background: transparent;
            color: #1c1c1e;
            font-size: 12px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-tab-btn.active {
            background: #007aff;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }

        .sub-panel {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            padding: 20px;
            width: 340px;
            display: none;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }

        .sub-panel.show { display: flex; }

        .slider-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #007aff;
        }

        .panel-note {
            font-size: 11px;
            color: #8e8e93;
            line-height: 1.6;
            font-weight: bold;
        }

        .formula {
            text-align: center;
            font-size: 15px;
            font-weight: bold;
            color: #007aff;
            letter-spacing: 0.5px;
            padding: 6px 0;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        }

        /* 우측 하단 상 정보 패널 */
        .info-panel {
            position: absolute;
            right: 20px;
            bottom: 96px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 10;
            min-width: 168px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            font-size: 12px;
            font-weight: bold;
        }

        .info-row span:first-child { color: #8e8e93; }

        body.dark-mode {
            background-color: #121212;
            color: #f2f2f7;
        }

        body.dark-mode .glass-panel {
            background: rgba(30, 30, 30, 0.78);
            border-color: rgba(255, 255, 255, 0.15);
            color: #f2f2f7;
        }

        body.dark-mode .data-value, body.dark-mode .back-btn,
        body.dark-mode .control-tab-btn {
            color: #f2f2f7;
        }

        body.dark-mode .icon-btn {
            background: rgba(40, 40, 40, 0.75);
            color: #fff;
        }

        body.dark-mode .info-row span:first-child { color: #9aa0a6; }

        .bottom-right-bar {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }
        button.back-btn, button.tag-badge {
            font-family: inherit;
            border: none;
        }

        @media (max-width: 768px) {
            .bottom-right-bar { bottom: 15px; right: 15px; }
            .center-tooltip { display: none; }
            .bottom-control-bar { bottom: 14px; }
            .control-tab-btn { min-width: 52px; padding: 6px 8px; font-size: 11px; }
            .sub-panel { width: 300px; bottom: 76px; }
            .data-card { gap: 9px; padding: 8px 12px; }
            .data-value { font-size: 13px; }
            .info-panel { right: 12px; bottom: 72px; padding: 8px 10px; min-width: 140px; }
            .info-row { font-size: 11px; }
        }
    













/* @@MOBILE-BASE v1@@ */
/* ============================================================
   모바일 반응형 보정 (세로/가로) — 자동 생성 블록
   ============================================================ */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
img, canvas { max-width: 100%; }

/* ---------- 모바일 세로 (폭 900px 이하) ---------- */
@media (max-width: 900px) {
    /* 1행: [메인][제목]  ...  [전체화면 아이콘] */
    .top-left-bar {
        top: max(8px, env(safe-area-inset-top)) !important;
        left: 8px !important;
        right: 56px !important;
        gap: 6px !important;
        flex-wrap: nowrap !important;
        align-items: center !important;
        overflow: hidden;
    }
    .top-left-bar .back-btn,
    .top-left-bar > a {
        flex: 0 0 auto;
        padding: 6px 10px !important;
        font-size: 12px !important;
        gap: 4px !important;
        white-space: nowrap;
    }
    .top-left-bar .tag-badge {
        flex: 0 1 auto;
        min-width: 0;
        padding: 6px 10px !important;
        font-size: 12px !important;
        gap: 5px !important;
        white-space: nowrap;
        overflow: hidden;
    }
    .top-left-bar .tag-badge > span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .tag-pill { font-size: 9px !important; padding: 1px 6px !important; flex: 0 0 auto; }

    /* 2행: [데이터 카드 .............][테마] */
    .top-right-bar {
        top: calc(max(8px, env(safe-area-inset-top)) + 40px) !important;
        left: 8px !important;
        right: 8px !important;
        gap: 6px !important;
        justify-content: flex-end !important;
        flex-wrap: nowrap !important;
    }
    .data-card {
        flex: 1 1 0%;
        min-width: 0;
        gap: 4px !important;
        padding: 6px 8px !important;
        justify-content: space-around !important;
        overflow: hidden;
    }
    .data-card { flex-direction: row !important; align-items: center !important; flex-wrap: nowrap !important; }
    .data-item { min-width: 0; flex-direction: column !important; align-items: center !important; gap: 0 !important; }
    .data-item > * { white-space: nowrap; }
    .voltmeter-display { font-size: 24px !important; }
    .data-label { font-size: 9px !important; white-space: nowrap; line-height: 1.2; }
    .data-value { font-size: 12.5px !important; white-space: nowrap; line-height: 1.25; }
    .icon-btn { width: 34px !important; height: 34px !important; min-width: 34px; font-size: 15px !important; flex: 0 0 auto; }

    /* 전체화면: 1행 우측 아이콘 버튼 (글자는 숨김) */
    .bottom-right-bar {
        top: max(8px, env(safe-area-inset-top)) !important;
        bottom: auto !important;
        right: 8px !important;
        left: auto !important;
        z-index: 20;
    }
    .bottom-right-bar button,
    .bottom-right-bar .back-btn {
        padding: 6px 9px !important;
        font-size: 14px !important;
        gap: 4px !important;
        line-height: 1;
    }
    .bottom-right-bar #fullscreenText,
    .bottom-right-bar .fs-text { display: none !important; }

    /* 안내 문구 */
    .center-tooltip, #guide-tooltip {
        top: calc(max(8px, env(safe-area-inset-top)) + 88px) !important;
        left: 8px !important;
        right: 8px !important;
        transform: none !important;
        margin: 0 auto;
        width: auto !important;
        max-width: none !important;
        font-size: 11.5px !important;
        padding: 7px 12px !important;
        white-space: normal !important;
        line-height: 1.45;
        text-align: center;
        z-index: 15 !important;
    }

    /* 하단 컨트롤 바: 화면 폭 전체, 한 줄 유지 */
    .bottom-control-bar {
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        transform: none !important;
        width: 100% !important;
        border-radius: 18px 18px 0 0 !important;
        padding: 6px 6px calc(6px + env(safe-area-inset-bottom)) !important;
        gap: 2px !important;
        justify-content: space-around !important;
        flex-wrap: nowrap !important;
        overflow: visible;
    }
    .control-tab-btn {
        flex: 1 1 0 !important;
        min-width: 0 !important;
        padding: 5px 2px !important;
        font-size: 10.5px !important;
        gap: 1px !important;
        border-radius: 12px !important;
        white-space: nowrap !important;
        line-height: 1.15;
    }
    .control-tab-btn span { white-space: nowrap !important; }
    .control-tab-btn span:first-child { font-size: 15px !important; line-height: 1.1; }

    /* 슬라이더 등 서브 패널 */
    .sub-panel {
        left: 8px !important;
        right: 8px !important;
        bottom: calc(76px + env(safe-area-inset-bottom)) !important;
        transform: none !important;
        width: auto !important;
        max-width: none !important;
        max-height: 46vh;
        overflow-y: auto;
        padding: 13px 14px !important;
        gap: 10px !important;
        -webkit-overflow-scrolling: touch;
    }
    .sub-panel-title { font-size: 11px !important; }
    .slider-header { font-size: 11px !important; }
    .control-row { gap: 5px !important; flex-wrap: wrap; }
    .toggle-btn, .mode-btn, .quick-btn, .example-item, .preset-btn { font-size: 11px !important; }
    input[type="range"] { height: 22px; }

    /* 팝업(모달)이 화면을 넘지 않도록 */
    .modal-overlay { padding: 12px !important; align-items: center !important; }
    .modal-card {
        max-height: 88vh !important;
        overflow-y: auto !important;
        width: auto !important;
        max-width: 100% !important;
        padding: 16px !important;
        -webkit-overflow-scrolling: touch;
    }
    .modal-title { font-size: 15px !important; }
    .modal-body { font-size: 12px !important; }
    .example-title { font-size: 11.5px !important; }
    .example-desc { font-size: 11px !important; line-height: 1.5 !important; }
}

@media (max-width: 430px) {
    /* 아주 좁은 화면에서는 장식용 배지를 숨겨 제목 자리를 확보 */
    .tag-pill { display: none !important; }
}

/* ---------- 모바일 가로 (높이 500px 이하) ---------- */
@media (max-height: 500px) and (orientation: landscape) {
    .top-left-bar {
        top: max(6px, env(safe-area-inset-top)) !important;
        left: 6px !important;
        right: auto !important;
        max-width: 46vw;
        gap: 5px !important;
    }
    .top-left-bar .back-btn,

    }

    .top-right-bar {
        top: max(6px, env(safe-area-inset-top)) !important;
        right: 88px !important;
        left: auto !important;
        gap: 5px !important;
    }
    .data-card { padding: 4px 9px !important; gap: 9px !important; flex: 0 0 auto; }
    .data-label { font-size: 8.5px !important; }
    .data-value { font-size: 11.5px !important; }
    .icon-btn { width: 28px !important; height: 28px !important; min-width: 28px; font-size: 13px !important; }

    .bottom-right-bar {
        top: max(6px, env(safe-area-inset-top)) !important;
        bottom: auto !important;
        right: 6px !important;
        z-index: 20;
    }

    .bottom-right-bar .back-btn { padding: 4px 8px !important; font-size: 13px !important; }
    .bottom-right-bar #fullscreenText,
    .bottom-right-bar .fs-text { display: none !important; }

    .center-tooltip, #guide-tooltip {
        top: auto !important;
        bottom: 56px !important;
        left: 50% !important;
        right: auto !important;
        transform: translateX(-50%) !important;
        width: max-content !important;
        max-width: 44vw !important;
        font-size: 10px !important;
        padding: 4px 9px !important;
        line-height: 1.3;
    }

    /* 가로 모드에서 각종 패널을 구석으로 모아 3D 화면을 가리지 않게 한다 */
    .side-panel { top: 44px !important; right: 8px !important; left: auto !important; width: 214px !important; padding: 7px 9px !important; gap: 4px !important; }
    .side-title { font-size: 10.5px !important; }
    .side-scale { font-size: 8.5px !important; }
    .meter-panel { left: 8px !important; bottom: 40px !important; top: auto !important; width: 190px !important; padding: 6px 8px !important; gap: 3px !important; }
    .meter-title { font-size: 9.5px !important; }
    .action-panel { top: auto !important; bottom: 40px !important; right: 8px !important; left: auto !important; grid-template-columns: repeat(2, 44px) !important; gap: 4px !important; }
    .side-btn { width: 44px !important; height: 44px !important; font-size: 8.5px !important; border-radius: 12px !important; gap: 1px !important; }
    .energy-panel { left: 8px !important; bottom: 40px !important; top: auto !important; width: 176px !important; padding: 6px 8px !important; gap: 4px !important; }
    .energy-title, .panel-note { font-size: 9px !important; line-height: 1.3 !important; }
    .info-panel { right: 8px !important; bottom: 40px !important; top: auto !important; min-width: 128px !important; padding: 6px 8px !important; gap: 2px !important; }
    .info-row { font-size: 9.5px !important; gap: 8px !important; }
    .view-panel { left: 8px !important; bottom: 40px !important; top: auto !important; padding: 6px 8px !important; }
    .phase-panel { left: 8px !important; bottom: 40px !important; top: auto !important; padding: 6px 8px !important; }
    .graph-panel { max-height: 40vh; width: 182px !important; }
    .legend, .panel-note { font-size: 9px !important; }

    .bottom-control-bar {
        left: 50% !important;
        right: auto !important;
        bottom: 4px !important;
        transform: translateX(-50%) !important;
        width: auto !important;
        max-width: calc(100vw - 12px);
        border-radius: 14px !important;
        padding: 4px 8px !important;
        gap: 3px !important;
    }
    .control-tab-btn {
        flex: 0 0 auto !important;
        min-width: 46px !important;
        padding: 3px 9px !important;
        font-size: 10px !important;
        gap: 3px !important;
        align-items: center !important;
        justify-content: center !important;
    }
    .control-tab-btn span:first-child { font-size: 13px !important; }

        overflow-y: auto;

        gap: 6px !important;

    .sub-panel .slider-row { gap: 3px !important; }
    .slider-header { font-size: 10.5px !important; }

    .modal-overlay { padding: 8px !important; }
    .modal-card {
        max-height: 94vh !important;
        overflow-y: auto !important;
        width: auto !important;
        max-width: min(460px, 96vw) !important;
        padding: 12px 14px !important;
    }
    .modal-title { font-size: 14px !important; }
    .modal-body { font-size: 11.5px !important; }
    .example-desc { font-size: 11px !important; line-height: 1.45 !important; }
}

/* ---------- 몰입(의사 전체화면) 모드 ---------- */

                <span id="txt-a">30 cm</span>
            </div>
            <input type="range" id="sld-a" min="5" max="60" step="1" value="30">
        </div>
        <div class="slider-row">
            <div class="slider-header">
                <span>렌즈의 초점 거리 (f)</span>
                <span id="txt-f">10 cm</span>
            </div>
            <input type="range" id="sld-f" min="5" max="20" step="1" value="10">
        </div>
        <div class="formula" id="formula-text">1/f = 1/a + 1/b</div>
        <div class="panel-note">
            렌즈 공식과 배율 m = b/a 로 상의 위치와 크기를 계산합니다. 물체가 초점거리보다 가까우면(a &lt; f) 빛이 모이지 않아 허상이 생깁니다.
        </div>
    </div>

    <div class="glass-panel bottom-control-bar">
        <button class="control-tab-btn" id="btn-toggle-physics">
            <span>⚙️</span>
            <span>설정 조절</span>
        </button>
        <button class="control-tab-btn" id="btn-reset">
            <span>🔄</span>
            <span>초기화</span>
        </button>
        <button class="control-tab-btn" id="btn-view">
            <span>📷</span>
            <span id="view-text">옆에서 보기</span>
        </button>
    </div>

    <!-- Fullscreen / Windowed Mode Button -->
    <div class="bottom-right-bar">
        <button id="fullscreenBtn" class="glass-panel back-btn">
            <span id="fullscreenIcon">⛶</span>
            <span id="fullscreenText">전체화면</span>
        </button>
    </div>

    <script>
        // --- 1. 씬 설정 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf2f2f7);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0.8, 3.0, 11.6);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.target.set(0.3, 1.5, 0);
        controls.maxPolarAngle = Math.PI / 2 + 0.02;
        controls.minDistance = 3;
        controls.maxDistance = 26;

        // --- 2. 조명 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
        dirLight.position.set(4, 8, 6);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.left = -10;
        dirLight.shadow.camera.right = 10;
        dirLight.shadow.camera.top = 10;
        dirLight.shadow.camera.bottom = -10;
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0xbfd8ff, 0.35);
        fillLight.position.set(-6, 4, -5);
        scene.add(fillLight);

        // --- 3. 바닥과 광학대 ---
        const AXIS_Y = 1.4;   // 광축 높이
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(40, 40),
            new THREE.MeshStandardMaterial({ color: 0xe5e5ea, roughness: 0.95 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.02;
        floor.receiveShadow = true;
        scene.add(floor);

        const rail = new THREE.Mesh(
            new THREE.BoxGeometry(16, 0.12, 0.55),
            new THREE.MeshStandardMaterial({ color: 0x2c3e50, metalness: 0.5, roughness: 0.4 })
        );
        rail.position.set(0, 0.06, 0);
        rail.receiveShadow = true;
        scene.add(rail);

        // 광축 (점선)
        const axisPts = [new THREE.Vector3(-9, AXIS_Y, 0), new THREE.Vector3(9, AXIS_Y, 0)];
        const axisGeo = new THREE.BufferGeometry().setFromPoints(axisPts);
        const axisLine = new THREE.Line(axisGeo, new THREE.LineDashedMaterial({
            color: 0x9aa4b2, dashSize: 0.24, gapSize: 0.18, transparent: true, opacity: 0.9
        }));
        axisLine.computeLineDistances();
        scene.add(axisLine);

        // --- 4. 볼록 렌즈 ---
        const LENS_R = 1.15;
        const lensGroup = new THREE.Group();

        const lensMat = new THREE.MeshPhysicalMaterial({
            color: 0x8cc6ff,
            transparent: true,
            opacity: 0.5,
            roughness: 0.03,
            metalness: 0.0,
            clearcoat: 1.0,
            clearcoatRoughness: 0.05,
            side: THREE.DoubleSide,
            depthWrite: false
        });
        const lensMesh = new THREE.Mesh(new THREE.SphereGeometry(LENS_R, 64, 48), lensMat);
        lensMesh.scale.set(0.17, 1, 1);
        lensGroup.add(lensMesh);

        const lensFace = new THREE.Mesh(
            new THREE.CircleGeometry(LENS_R * 0.95, 64),
            new THREE.MeshBasicMaterial({ color: 0xbfe0ff, transparent: true, opacity: 0.14, side: THREE.DoubleSide })
        );
        lensFace.rotation.y = Math.PI / 2;
        lensGroup.add(lensFace);

        const lensRim = new THREE.Mesh(
            new THREE.TorusGeometry(LENS_R, 0.022, 16, 64),
            new THREE.MeshStandardMaterial({ color: 0xd6dee8, metalness: 0.5, roughness: 0.35 })
        );
        lensGroup.add(lensRim);

        // 렌즈 지지대
        const lensPole = new THREE.Mesh(
            new THREE.CylinderGeometry(0.045, 0.045, 1.4, 20),
            new THREE.MeshStandardMaterial({ color: 0x8d99ab, metalness: 0.8, roughness: 0.25 })
        );
        lensPole.position.y = -0.7;
        lensGroup.add(lensPole);

        const lensBase = new THREE.Mesh(
            new THREE.CylinderGeometry(0.26, 0.3, 0.1, 32),
            new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.5 })
        );
        lensBase.position.y = -1.42;
        lensGroup.add(lensBase);

        lensGroup.position.set(0, AXIS_Y, 0);
        scene.add(lensGroup);

        // --- 5. 화살표(물체 / 상) ---
        const OBJ_H = 1.2;

        function makeArrow(color, opacity, dashed) {
            const g = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.45,
                metalness: 0.1,
                transparent: opacity < 1,
                opacity: opacity,
                emissive: dashed ? new THREE.Color(color) : new THREE.Color(0x000000),
                emissiveIntensity: dashed ? 0.25 : 0
            });
            const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, OBJ_H * 0.78, 20), mat);
            shaft.position.y = OBJ_H * 0.39;
            shaft.castShadow = true;
            g.add(shaft);

            const head = new THREE.Mesh(new THREE.ConeGeometry(0.13, OBJ_H * 0.22, 24), mat);
            head.position.y = OBJ_H * 0.89;
            head.castShadow = true;
            g.add(head);

            return g;
        }

        const objectArrow = makeArrow(0xff8c1a, 1, false);
        scene.add(objectArrow);

        // 광학대 지지대
        function makeSupport() {
            const g = new THREE.Group();
            const pole = new THREE.Mesh(
                new THREE.CylinderGeometry(0.035, 0.035, AXIS_Y - 0.12, 16),
                new THREE.MeshStandardMaterial({ color: 0x8d99ab, metalness: 0.8, roughness: 0.25 })
            );
            pole.position.y = 0.12 + (AXIS_Y - 0.12) / 2;
            g.add(pole);
            const foot = new THREE.Mesh(
                new THREE.CylinderGeometry(0.22, 0.26, 0.1, 28),
                new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.5 })
            );
            foot.position.y = 0.12;
            g.add(foot);
            return g;
        }

        const objectSupport = makeSupport();
        scene.add(objectSupport);
        const imageSupport = makeSupport();
        imageSupport.visible = false;
        scene.add(imageSupport);

        const imageArrow = makeArrow(0x007aff, 0.72, true);
        imageArrow.visible = false;
        scene.add(imageArrow);

        // 물체 빛 번짐
        function makeGlowTexture(color) {
            const c = document.createElement('canvas');
            c.width = 128; c.height = 128;
            const ctx = c.getContext('2d');
            const g = ctx.createRadialGradient(64, 64, 4, 64, 64, 62);
            g.addColorStop(0, color);
            g.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 128, 128);
            return new THREE.CanvasTexture(c);
        }

        // --- 6. 텍스트 라벨 ---
        function makeLabel(text, color, scale) {
            const c = document.createElement('canvas');
            c.width = 256; c.height = 96;
            const ctx = c.getContext('2d');
            ctx.fillStyle = 'rgba(255,255,255,0.85)';
            const r = 24;
            ctx.beginPath();
            ctx.moveTo(r, 6);
            ctx.lineTo(256 - r, 6);
            ctx.quadraticCurveTo(250, 6, 250, 6 + r * 0.6);
            ctx.lineTo(250, 90 - r * 0.6);
            ctx.quadraticCurveTo(250, 90, 256 - r, 90);
            ctx.lineTo(r, 90);
            ctx.quadraticCurveTo(6, 90, 6, 90 - r * 0.6);
            ctx.lineTo(6, 6 + r * 0.6);
            ctx.quadraticCurveTo(6, 6, r, 6);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = color || '#1c1c1e';
            ctx.font = 'bold 46px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 128, 50);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
                map: new THREE.CanvasTexture(c), transparent: true, depthTest: false
            }));
            const s = scale || 1;
            sprite.scale.set(1.15 * s, 0.43 * s, 1);
            return sprite;
        }

        const objectLabel = makeLabel('물체', '#c25e00');
        scene.add(objectLabel);

        const imageLabel = makeLabel('상', '#0057c2');
        imageLabel.visible = false;
        scene.add(imageLabel);

        // 초점 표시
        const focalMarkers = new THREE.Group();
        scene.add(focalMarkers);

        function buildFocalMarkers(f) {
            while (focalMarkers.children.length) {
                const m = focalMarkers.children.pop();
                if (m.geometry) m.geometry.dispose();
                if (m.material && m.material.map) m.material.map.dispose();
                focalMarkers.remove(m);
            }
            const dotMat = new THREE.MeshStandardMaterial({ color: 0xff3b30, roughness: 0.4 });
            const dotGeo = new THREE.SphereGeometry(0.055, 16, 16);

            [
                { x: -f, t: 'F' }, { x: -2 * f, t: '2F' },
                { x: f, t: 'F′' }, { x: 2 * f, t: '2F′' }
            ].forEach(item => {
                if (Math.abs(item.x) > 8.6) return;
                const dot = new THREE.Mesh(dotGeo, dotMat);
                dot.position.set(item.x, AXIS_Y, 0);
                focalMarkers.add(dot);

                const lb = makeLabel(item.t, '#a02020', 0.72);
                lb.position.set(item.x, AXIS_Y - 0.42, 0);
                focalMarkers.add(lb);
            });
        }

        // --- 7. 광선 (얇은 원기둥으로 표현) ---
        const rayGroup = new THREE.Group();
        scene.add(rayGroup);

        const RAY_MAT = new THREE.MeshBasicMaterial({ color: 0xffb300, transparent: true, opacity: 0.85 });
        const RAY_DASH_MAT = new THREE.MeshBasicMaterial({ color: 0x7fa8ff, transparent: true, opacity: 0.6 });
        const RAY_RADIUS = 0.016;

        function clearRays() {
            while (rayGroup.children.length) {
                const m = rayGroup.children.pop();
                if (m.geometry) m.geometry.dispose();
                rayGroup.remove(m);
            }
        }

        function addRaySegment(p1, p2, dashed) {
            const dir = new THREE.Vector3().subVectors(p2, p1);
            const len = dir.length();
            if (len < 0.001) return;

            if (dashed) {
                // 점선 느낌을 위해 짧은 조각 여러 개
                const pieces = Math.max(2, Math.floor(len / 0.22));
                for (let i = 0; i < pieces; i++) {
                    const t0 = i / pieces;
                    const t1 = Math.min(1, (i + 0.55) / pieces);
                    const a = p1.clone().lerp(p2, t0);
                    const b = p1.clone().lerp(p2, t1);
                    const segDir = new THREE.Vector3().subVectors(b, a);
                    const segLen = segDir.length();
                    const geo = new THREE.CylinderGeometry(RAY_RADIUS * 0.85, RAY_RADIUS * 0.85, segLen, 6);
                    const mesh = new THREE.Mesh(geo, RAY_DASH_MAT);
                    mesh.position.copy(a).addScaledVector(segDir, 0.5);
                    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), segDir.clone().normalize());
                    rayGroup.add(mesh);
                }
            } else {
                const geo = new THREE.CylinderGeometry(RAY_RADIUS, RAY_RADIUS, len, 8);
                const mesh = new THREE.Mesh(geo, RAY_MAT);
                mesh.position.copy(p1).addScaledVector(dir, 0.5);
                mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
                rayGroup.add(mesh);
            }
        }

        // --- 8. 상태 ---
        const SCALE = 0.1;              // 1 cm = 0.1 월드 단위
        let a_cm = 30;                  // 물체 거리
        let f_cm = 10;                  // 초점 거리
        let b_cm = 15;                  // 상 거리 (계산값)
        let mag = -0.5;                 // 배율 (부호 포함)
        let isVirtual = false;
        let noImage = false;
        let dirty = true;

        function compute() {
            if (Math.abs(a_cm - f_cm) < 0.35) {
                noImage = true;
                b_cm = Infinity;
                mag = Infinity;
                isVirtual = false;
                return;
            }
            noImage = false;
            b_cm = (a_cm * f_cm) / (a_cm - f_cm);
            mag = -b_cm / a_cm;
            isVirtual = b_cm < 0;
        }

        // --- 9. 장면 갱신 ---
        function updateScene() {
            compute();

            const a = a_cm * SCALE;
            const f = f_cm * SCALE;
            const b = isFinite(b_cm) ? b_cm * SCALE : 0;

            // 물체
            objectArrow.position.set(-a, AXIS_Y, 0);
            objectLabel.position.set(-a, AXIS_Y + OBJ_H + 0.42, 0);
            objectSupport.position.set(-a, 0, 0);

            // 상
            clearRays();
            buildFocalMarkers(f);

            const imgVisible = !noImage && Math.abs(b) < 8.4 && Math.abs(mag) > 0.001;
            imageArrow.visible = imgVisible;
            imageLabel.visible = imgVisible;
            imageSupport.visible = imgVisible && !isVirtual;
            imageSupport.position.set(isFinite(b) ? b : 0, 0, 0);

            if (imgVisible) {
                const s = Math.min(Math.abs(mag), 7);
                imageArrow.position.set(b, AXIS_Y, 0);
                imageArrow.scale.set(1, s, 1);
                imageArrow.rotation.z = mag < 0 ? Math.PI : 0;
                imageArrow.traverse(o => {
                    if (o.isMesh && o.material) {
                        o.material.opacity = isVirtual ? 0.45 : 0.72;
                        o.material.transparent = true;
                    }
                });
                imageLabel.position.set(b, mag < 0 ? (AXIS_Y - OBJ_H * s - 0.58) : (AXIS_Y + OBJ_H * s + 0.34), 0);

                // 광선 그리기
                const O = new THREE.Vector3(-a, AXIS_Y + OBJ_H, 0);
                const L1 = new THREE.Vector3(0, AXIS_Y + OBJ_H, 0);   // 평행 광선이 렌즈에 닿는 점
                const L2 = new THREE.Vector3(0, AXIS_Y, 0);           // 렌즈 중심
                const IMG = new THREE.Vector3(b, AXIS_Y + OBJ_H * mag, 0);

                // 1) 평행 광선: 물체 -> 렌즈 -> 초점을 지나 상
                addRaySegment(O, L1, false);
                const refr1 = new THREE.Vector3(f, AXIS_Y - (AXIS_Y + OBJ_H), 0).normalize();
                if (b > 0) {
                    addRaySegment(L1, IMG, false);
                    addRaySegment(IMG, IMG.clone().addScaledVector(refr1, 3.5), false);
                } else {
                    // 허상: 렌즈를 지난 빛은 퍼져 나가고, 거꾸로 연장하면 상이 생긴다
                    addRaySegment(L1, L1.clone().addScaledVector(refr1, 9), false);
                    addRaySegment(L1, IMG, true);
                }

                // 2) 렌즈 중심을 지나는 광선 (중심에서는 진행 방향이 바뀌지 않음)
                addRaySegment(O, L2, false);
                const refr2 = new THREE.Vector3().subVectors(L2, O).normalize();
                if (b > 0) {
                    addRaySegment(L2, IMG, false);
                    addRaySegment(IMG, IMG.clone().addScaledVector(refr2, 3.5), false);
                } else {
                    addRaySegment(L2, L2.clone().addScaledVector(refr2, 9), false);
                    addRaySegment(L2, IMG, true);
                }

                // 3) 앞쪽 초점을 지나는 광선 (물체가 초점 밖일 때)
                if (b > 0 && a > f) {
                    const yAtLens = AXIS_Y - OBJ_H * f / (a - f);
                    const L3 = new THREE.Vector3(0, yAtLens, 0);
                    addRaySegment(O, L3, false);
                    const outEnd = new THREE.Vector3(9, yAtLens, 0);
                    addRaySegment(L3, outEnd, false);
                }
            }

            // 데이터 표시
            const bText = isFinite(b_cm) ? Math.abs(b_cm).toFixed(1) + ' cm' : '∞';
            document.getElementById('val-b').innerText = bText;
            document.getElementById('val-m').innerText = isFinite(mag) ? Math.abs(mag).toFixed(2) + '배' : '—';
            document.getElementById('val-b').style.color = isVirtual ? '#34c759' : '#007aff';

            document.getElementById('info-a').innerText = a_cm + ' cm';
            document.getElementById('info-f').innerText = f_cm + ' cm';

            const typeEl = document.getElementById('info-type');
            if (noImage) {
                typeEl.innerText = '상 없음 (평행)';
                typeEl.style.color = '#8e8e93';
            } else if (isVirtual) {
                typeEl.innerText = '허상';
                typeEl.style.color = '#34c759';
            } else {
                typeEl.innerText = '실상';
                typeEl.style.color = '#007aff';
            }

            const dirEl = document.getElementById('info-dir');
            if (noImage) { dirEl.innerText = '—'; dirEl.style.color = '#8e8e93'; }
            else if (mag > 0) { dirEl.innerText = '정립'; dirEl.style.color = '#34c759'; }
            else { dirEl.innerText = '도립'; dirEl.style.color = '#ff9500'; }
        }

        // --- 10. UI ---
        const btnTogglePhysics = document.getElementById('btn-toggle-physics');
        const physicsPanel = document.getElementById('physics-panel');
        btnTogglePhysics.addEventListener('click', () => {
            physicsPanel.classList.toggle('show');
            btnTogglePhysics.classList.toggle('active');
        });

        document.getElementById('sld-a').addEventListener('input', (e) => {
            a_cm = parseFloat(e.target.value);
            document.getElementById('txt-a').innerText = a_cm + ' cm';
            dirty = true;
        });

        document.getElementById('sld-f').addEventListener('input', (e) => {
            f_cm = parseFloat(e.target.value);
            document.getElementById('txt-f').innerText = f_cm + ' cm';
            dirty = true;
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            a_cm = 30;
            f_cm = 10;
            document.getElementById('sld-a').value = 30;
            document.getElementById('sld-f').value = 10;
            document.getElementById('txt-a').innerText = '30 cm';
            document.getElementById('txt-f').innerText = '10 cm';
            camera.position.set(0.8, 3.0, 11.6);
            controls.target.set(0.3, 1.5, 0);
            dirty = true;
        });

        let sideView = true;
        document.getElementById('btn-view').addEventListener('click', () => {
            sideView = !sideView;
            if (sideView) {
                camera.position.set(0.8, 3.0, 11.6);
                document.getElementById('view-text').innerText = '옆에서 보기';
            } else {
                camera.position.set(4.2, 5.2, 9.4);
                document.getElementById('view-text').innerText = '비스듬히 보기';
            }
            controls.target.set(0.3, 1.5, 0);
        });

        document.getElementById('theme-toggle').addEventListener('click', (e) => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            e.currentTarget.innerText = isDark ? '☀️' : '🌙';
            scene.background.setHex(isDark ? 0x121212 : 0xf2f2f7);
            floor.material.color.setHex(isDark ? 0x1c1c1e : 0xe5e5ea);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 11. 루프 ---
        function animate() {
            requestAnimationFrame(animate);
            if (dirty) {
                dirty = false;
                updateScene();
            }
            controls.update();
            renderer.render(scene, camera);
        }

        updateScene();
        animate();

        /* ---------- Fullscreen / Windowed Mode Logic ---------- */
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const fullscreenIcon = document.getElementById('fullscreenIcon');
        const fullscreenText = document.getElementById('fullscreenText');

        function updateFullscreenUI() {
            const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
            if (fullscreenIcon) fullscreenIcon.innerText = isFS ? '🗗' : '⛶';
            if (fullscreenText) fullscreenText.innerText = isFS ? '창모드' : '전체화면';
        }

        if (fullscreenBtn) {
            fullscreenBtn.addEventListener('click', () => {
                try {
                    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                        const req = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
                        if (req) req.call(document.documentElement);
                    } else {
                        const exit = document.exitFullscreen || document.webkitExitFullscreen;
                        if (exit) exit.call(document);
                    }
                } catch (err) {
                    console.error('전체화면 모드를 전환할 수 없습니다:', err);
                }
            });
        }

        document.addEventListener('fullscreenchange', updateFullscreenUI);
        document.addEventListener('webkitfullscreenchange', updateFullscreenUI);
    </script>














<!-- @@MOBILE-JS v1@@ -->
<script>
/* ============ 모바일 화면 재조정 + 전체화면 대체 동작 (자동 생성) ============ */
(function () {
    var docEl = document.documentElement;
    var btn = document.getElementById('fullscreenBtn');
    var icon = document.getElementById('fullscreenIcon');
    var text = document.getElementById('fullscreenText');

    function realFs() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement ||
                  document.mozFullScreenElement || document.msFullscreenElement);
    }
    function pseudo() { return docEl.classList.contains('pseudo-fs'); }
    function setUI() {
        var on = realFs() || pseudo();
        if (icon) icon.textContent = on ? '🗗' : '⛶';
        if (text) text.textContent = on ? '창모드' : '전체화면';
        if (btn) btn.setAttribute('aria-label', on ? '창모드로 전환' : '전체화면으로 전환');
        document.body.classList.toggle('is-fullscreen', on);
    }
    function toast(msg) {
        var t = document.getElementById('ux-toast');
        if (!t) {
            t = document.createElement('div');
            t.id = 'ux-toast';
            t.style.cssText = 'position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);' +
                'background:rgba(28,28,30,.88);color:#fff;font-size:12px;line-height:1.4;padding:9px 14px;border-radius:14px;' +
                'z-index:9999;max-width:86vw;text-align:center;pointer-events:none;transition:opacity .3s;' +
                'font-family:inherit;box-shadow:0 8px 24px rgba(0,0,0,.25)';
            document.body.appendChild(t);
        }
        t.textContent = msg;
        t.style.opacity = '1';
        clearTimeout(t._t);
        t._t = setTimeout(function () { t.style.opacity = '0'; }, 2600);
    }

    if (btn) {
        btn.addEventListener('click', function () {
            var wasReal = realFs();
            var wasPseudo = pseudo();
            setTimeout(function () {
                if (wasReal) { setUI(); return; }          // 진짜 전체화면에서 나온 경우
                if (wasPseudo) { docEl.classList.remove('pseudo-fs'); setUI(); return; }  // 몰입 모드 해제
                if (!realFs()) {                            // 전체화면 API가 동작하지 않는 환경
                    docEl.classList.add('pseudo-fs');
                    try { window.scrollTo(0, 1); } catch (e) {}
                    toast('이 브라우저는 전체화면을 지원하지 않아 상단 정보를 숨긴 몰입 모드로 표시합니다');
                }
                setUI();
            }, 380);
        }, false);
    }
    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
        document.addEventListener(ev, setUI);
    });

    /* 좁은 화면에서는 3D 장면이 잘리지 않도록 시야각을 넓혀 전체가 들어오게 한다 */
    function mobileFit() {
        try {
            if (typeof camera === 'undefined' || !camera || !camera.isPerspectiveCamera) return;
            if (!camera.userData) camera.userData = {};
            if (!camera.userData.baseFov) camera.userData.baseFov = camera.fov;
            var w = window.innerWidth, h = window.innerHeight, f = 1;
            var k = 0.62;
            var attr = document.documentElement.getAttribute('data-mzoom');
            if (attr) { var v = parseFloat(attr); if (!isNaN(v) && v > 0) k = v; }
            if (w < h) f = 1 + (1 - w / h) * k;
            else if (h <= 500) f = 1 + k * 0.16;
            camera.fov = Math.min(88, camera.userData.baseFov * f);
            camera.updateProjectionMatrix();
        } catch (e) {}
    }
    mobileFit();

    /* 화면 회전·주소창 변화·전체화면 전환 후 렌더러 크기 재계산 */
    var rt = null;
    function refit() {
        clearTimeout(rt);
        rt = setTimeout(function () {
            mobileFit();
            try { window.dispatchEvent(new Event('resize')); } catch (e) {}
        }, 240);
    }
    window.addEventListener('orientationchange', refit);
    window.addEventListener('pageshow', refit);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) refit(); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', refit);

    setUI();
})();
</script>
<!-- @@/MOBILE-JS@@ -->
</body>
</html>
