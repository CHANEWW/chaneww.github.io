<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>옴의 법칙 3D</title>
    <!-- Three.js 및 OrbitControls 3D 엔진 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        @font-face {
            font-family: 'SeoulNamsanL';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanL.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'SeoulNamsanL', -apple-system, sans-serif;
            background-color: #f2f2f7;
            color: #1c1c1e;
            touch-action: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            touch-action: none;
        }

        /* Apple visionOS Glassmorphic UI */
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            z-index: 10;
        }

        /* 좌측 상단 헤더 */
        .top-left-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            color: #1c1c1e;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tag-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
        }

        .tag-pill {
            background: rgba(0, 122, 255, 0.15);
            color: #007aff;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
        }

        /* 우측 상단 데이터 패널 */
        .top-right-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .data-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 20px;
        }

        .data-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .data-label {
            font-size: 11px;
            color: #8e8e93;
            font-weight: bold;
        }

        .data-value {
            font-size: 15px;
            font-weight: bold;
            color: #1c1c1e;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            transition: all 0.2s;
        }

        /* 중앙 안내 툴팁 */
        .center-tooltip {
            position: absolute;
            top: 12%;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 18px;
            font-size: 13px;
            color: #8e8e93;
            border-radius: 30px;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.5s ease;
        }

        /* 서브 물리 설정 패널 */
        .sub-panel {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            padding: 18px 24px;
            width: 350px;
            display: none;
            flex-direction: column;
            gap: 14px;
            z-index: 10;
        }

        .sub-panel.show { display: flex; }

        .control-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 13px;
            font-weight: bold;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: rgba(0, 0, 0, 0.1);
            height: 6px;
            border-radius: 3px;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #007aff;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,122,255,0.4);
        }

        .btn-group {
            display: flex;
            gap: 6px;
            margin-top: 2px;
        }

        .toggle-btn {
            flex: 1;
            padding: 8px;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            background: rgba(255, 255, 255, 0.5);
            color: #1c1c1e;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .toggle-btn.active-on {
            background: #34c759;
            color: white;
            border-color: #34c759;
        }

        .toggle-btn.active-off {
            background: #ff3b30;
            color: white;
            border-color: #ff3b30;
        }

        .toggle-btn.selected {
            background: #007aff;
            color: white;
            border-color: #007aff;
        }

        /* 하단 제어 바 */
        .bottom-control-bar {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            z-index: 10;
        }

        .control-tab-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 14px;
            min-width: 68px;
            border-radius: 14px;
            border: none;
            background: transparent;
            color: #1c1c1e;
            font-size: 12px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-tab-btn.active {
            background: #007aff;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }

        /* 다크 모드 */
        body.dark-mode {
            background-color: #121212;
            color: #f2f2f7;
        }

        body.dark-mode .glass-panel {
            background: rgba(30, 30, 30, 0.75);
            border-color: rgba(255, 255, 255, 0.15);
            color: #f2f2f7;
        }

        body.dark-mode .data-value, body.dark-mode .back-btn {
            color: #f2f2f7;
        }

        body.dark-mode .icon-btn {
            background: rgba(40, 40, 40, 0.75);
            color: #fff;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- 좌측 상단 헤더 -->
    <div class="top-left-bar">
        <a href="../index.html" class="glass-panel back-btn">
            <span>⬅</span> 메인
        </a>
        <div class="glass-panel tag-badge">
            <span>옴의 법칙 3D</span>
            <span class="tag-pill">visionOS</span>
        </div>
    </div>

    <!-- 우측 상단 실시간 데이터 패널 -->
    <div class="top-right-bar">
        <div class="glass-panel data-card">
            <div class="data-item">
                <span class="data-label">전압 (V)</span>
                <span class="data-value" id="val-voltage" style="color:#007aff;">6.0 V</span>
            </div>
            <div class="data-item">
                <span class="data-label">저항 (R)</span>
                <span class="data-value" id="val-resistance" style="color:#ff9500;">10.0 Ω</span>
            </div>
            <div class="data-item">
                <span class="data-label">전류 (I)</span>
                <span class="data-value" id="val-current" style="color:#34c759;">0.60 A</span>
            </div>
            <div class="data-item">
                <span class="data-label">전력 (P)</span>
                <span class="data-value" id="val-power" style="color:#ff2d55;">3.60 W</span>
            </div>
        </div>
        <button class="icon-btn glass-panel" id="theme-toggle">🌙</button>
    </div>

    <!-- 중앙 안내 툴팁 -->
    <div class="glass-panel center-tooltip" id="guide-tooltip">
        💡 스위치를 클릭하여 회로를 연결하거나 열 수 있습니다.
    </div>

    <!-- 서브 조절 패널 -->
    <div class="glass-panel sub-panel" id="physics-panel">
        <div class="control-row">
            <div class="control-header">
                <span>전원 전압 (V)</span>
                <span id="txt-voltage" style="color:#007aff;">6.0 V</span>
            </div>
            <input type="range" id="sld-voltage" min="1" max="12" step="0.5" value="6">
        </div>
        <div class="control-row">
            <div class="control-header">
                <span>전구/저항값 (R)</span>
                <span id="txt-resistance" style="color:#ff9500;">10.0 Ω</span>
            </div>
            <input type="range" id="sld-resistance" min="2" max="30" step="1" value="10">
        </div>
        <div class="control-row">
            <span>스위치 개폐</span>
            <div class="btn-group">
                <button class="toggle-btn active-off" id="btn-switch-toggle">스위치 열림 (OFF)</button>
            </div>
        </div>
        <div class="control-row">
            <span>전지 극성 전환</span>
            <div class="btn-group">
                <button class="toggle-btn" id="btn-battery-reverse">전지 방향 반전 (현재: 정방향)</button>
            </div>
        </div>
        <div class="control-row">
            <span>흐름 시각화 선택</span>
            <div class="btn-group">
                <button class="toggle-btn selected" id="btn-mode-electron">전자 흐름 (-)</button>
                <button class="toggle-btn" id="btn-mode-current">전류 방향 (➔)</button>
            </div>
        </div>
    </div>

    <!-- 하단 제어 바 -->
    <div class="glass-panel bottom-control-bar">
        <button class="control-tab-btn" id="btn-toggle-physics">
            <span>⚙️</span>
            <span>회로 설정</span>
        </button>
        <button class="control-tab-btn" id="btn-reset">
            <span>🔄</span>
            <span>초기화</span>
        </button>
        <button class="control-tab-btn" id="btn-align">
            <span>📷</span>
            <span>시점정렬</span>
        </button>
    </div>

    <script>
        // --- 1. Three.js 기본 씬 & 카메라 설정 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf2f2f7);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3.2, 4.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2.1;

        // --- 2. 조명 연출 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(4, 6, 3);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- 3. 바닥 및 원점 격자 스페이스 ---
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(20, 20),
            new THREE.MeshStandardMaterial({ color: 0xe5e5ea, roughness: 0.8 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.5;
        floor.receiveShadow = true;
        scene.add(floor);

        const gridHelper = new THREE.GridHelper(20, 20, 0xd1d1d6, 0xe5e5ea);
        gridHelper.position.y = -0.49;
        scene.add(gridHelper);

        // --- 4. 회로 변수 및 상태 ---
        let voltage = 6.0;
        let resistance = 10.0;
        let isClosed = false;
        let isBatteryReversed = false; // 전지 극성 상태
        let viewMode = 'electron';    // 'electron' 또는 'current'

        // 사각 회로 정점 정의 (시계 방향 순서: 좌하(전구) -> 좌상 -> 우상(스위치) -> 우하)
        // 아래쪽 패스(3 -> 0)에 전지가 위치함
        const pathPoints = [
            new THREE.Vector3(-1.8, 0, -1.0), // 0: 좌측 상단
            new THREE.Vector3(1.8, 0, -1.0),  // 1: 우측 상단
            new THREE.Vector3(1.8, 0, 1.0),   // 2: 우측 하단
            new THREE.Vector3(-1.8, 0, 1.0)   // 3: 좌측 하단
        ];

        // --- 5. 3D 회로 구성 요소 모델링 ---
        const circuitGroup = new THREE.Group();
        scene.add(circuitGroup);

        // (1) 구리 도선 패스 생성 함수
        function createWireSegment(p1, p2) {
            const dir = new THREE.Vector3().subVectors(p2, p1);
            const len = dir.length();
            const wireGeo = new THREE.CylinderGeometry(0.02, 0.02, len, 16);
            const wireMat = new THREE.MeshStandardMaterial({ color: 0xb87333, metalness: 0.8, roughness: 0.3 });
            const mesh = new THREE.Mesh(wireGeo, wireMat);
            mesh.position.copy(p1).add(p2).multiplyScalar(0.5);
            mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
            return mesh;
        }

        circuitGroup.add(createWireSegment(pathPoints[0], pathPoints[1]));
        circuitGroup.add(createWireSegment(pathPoints[1], pathPoints[2]));
        circuitGroup.add(createWireSegment(pathPoints[2], pathPoints[3]));
        circuitGroup.add(createWireSegment(pathPoints[3], pathPoints[0]));

        // (2) 직류 전원 (DC Battery) - 회로 아래쪽(시선의 가까운 쪽, pathPoints[3]과 pathPoints[2] 사이)에 배치
        const batteryGroup = new THREE.Group();
        batteryGroup.position.set(0, 0, 1.0);

        const batBodyGeo = new THREE.CylinderGeometry(0.18, 0.18, 0.7, 24);
        const batBodyMat = new THREE.MeshStandardMaterial({ color: 0x1c1c1e, roughness: 0.5 });
        const batBody = new THREE.Mesh(batBodyGeo, batBodyMat);
        batBody.rotation.z = Math.PI / 2;
        batteryGroup.add(batBody);

        const batPosCapGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.1, 16);
        const batPosCapMat = new THREE.MeshStandardMaterial({ color: 0xff3b30, metalness: 0.8 });
        const batPosCap = new THREE.Mesh(batPosCapGeo, batPosCapMat);
        batPosCap.rotation.z = Math.PI / 2;
        batPosCap.position.x = 0.38;
        batteryGroup.add(batPosCap);

        circuitGroup.add(batteryGroup);

        // (3) 나이프 스위치 (Switch) - 오른쪽 회로 변(pathPoints[1]과 pathPoints[2] 사이)에 배치
        const switchGroup = new THREE.Group();
        switchGroup.position.copy(pathPoints[1]).add(pathPoints[2]).multiplyScalar(0.5);

        // 스위치 베이스
        const swBaseGeo = new THREE.BoxGeometry(0.2, 0.06, 0.5);
        const swBaseMat = new THREE.MeshStandardMaterial({ color: 0x8e8e93, roughness: 0.4 });
        const swBase = new THREE.Mesh(swBaseGeo, swBaseMat);
        switchGroup.add(swBase);

        // 단자 고정대 2개 (남/북 측)
        const termGeo = new THREE.BoxGeometry(0.08, 0.12, 0.08);
        const termMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, metalness: 0.9, roughness: 0.2 });
        const term1 = new THREE.Mesh(termGeo, termMat);
        term1.position.set(0, 0.08, -0.18);
        const term2 = new THREE.Mesh(termGeo, termMat);
        term2.position.set(0, 0.08, 0.18);
        switchGroup.add(term1);
        switchGroup.add(term2);

        // 스위치 암 (피벗 중심: 남쪽 단자 term2 위치)
        const swPivot = new THREE.Group();
        swPivot.position.set(0, 0.1, 0.18); // 남쪽 단자 피벗

        const swArmGeo = new THREE.BoxGeometry(0.04, 0.03, 0.38);
        const swArmMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, metalness: 0.9, roughness: 0.2 });
        const swArm = new THREE.Mesh(swArmGeo, swArmMat);
        swArm.position.set(0, 0, -0.19); // 피벗축 기준으로 북쪽으로 뻗음

        // 손잡이
        const handleGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.12, 16);
        const handleMat = new THREE.MeshStandardMaterial({ color: 0xff3b30, roughness: 0.3 });
        const handle = new THREE.Mesh(handleGeo, handleMat);
        handle.position.set(0, 0.08, -0.35);
        swArm.add(handle);

        swPivot.add(swArm);
        switchGroup.add(swPivot);

        circuitGroup.add(switchGroup);

        // (4) 전구 / 저항 (Bulb & Resistor) - 왼쪽 회로 변(pathPoints[0]과 pathPoints[3] 사이)에 배치
        const bulbGroup = new THREE.Group();
        bulbGroup.position.copy(pathPoints[0]).add(pathPoints[3]).multiplyScalar(0.5);

        const socketGeo = new THREE.CylinderGeometry(0.14, 0.16, 0.12, 24);
        const socketMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3c, metalness: 0.5 });
        const socketMesh = new THREE.Mesh(socketGeo, socketMat);
        bulbGroup.add(socketMesh);

        const glassGeo = new THREE.SphereGeometry(0.18, 24, 24);
        const glassMat = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.6,
            roughness: 0.1
        });
        const glassMesh = new THREE.Mesh(glassGeo, glassMat);
        glassMesh.position.y = 0.18;
        bulbGroup.add(glassMesh);

        const filamentGeo = new THREE.SphereGeometry(0.05, 12, 12);
        const filamentMat = new THREE.MeshStandardMaterial({
            color: 0xffcc00,
            emissive: 0xffaa00,
            emissiveIntensity: 0.0
        });
        const filamentMesh = new THREE.Mesh(filamentGeo, filamentMat);
        filamentMesh.position.y = 0.18;
        bulbGroup.add(filamentMesh);

        const bulbLight = new THREE.PointLight(0xffaa00, 0, 4);
        bulbLight.position.y = 0.18;
        bulbGroup.add(bulbLight);

        circuitGroup.add(bulbGroup);

        // --- 6. 전자/전류 시각화용 입자 생성 ---
        const numParticles = 28;

        // (1) 전자 텍스처 캔버스 생성 (- 마크)
        function createElectronTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#007aff';
            ctx.beginPath();
            ctx.arc(64, 64, 60, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#1c1c1e';
            ctx.fillRect(32, 54, 64, 20);

            return new THREE.CanvasTexture(canvas);
        }

        const electronTex = createElectronTexture();
        const electronGeo = new THREE.SphereGeometry(0.045, 16, 16);
        const electronMat = new THREE.MeshBasicMaterial({ map: electronTex });

        const electrons = [];
        for (let i = 0; i < numParticles; i++) {
            const mesh = new THREE.Mesh(electronGeo, electronMat);
            mesh.rotation.x = -Math.PI / 2; // - 마크가 위로 보이도록 회전
            scene.add(mesh);
            electrons.push({ mesh, progress: i / numParticles });
        }

        // (2) 전류 방향 화살표 입자 생성
        function createArrowMesh() {
            const group = new THREE.Group();
            const stemGeo = new THREE.CylinderGeometry(0.015, 0.015, 0.08, 8);
            const headGeo = new THREE.ConeGeometry(0.04, 0.06, 8);
            const mat = new THREE.MeshBasicMaterial({ color: 0xff3b30 });

            const stem = new THREE.Mesh(stemGeo, mat);
            stem.rotation.x = Math.PI / 2;
            const head = new THREE.Mesh(headGeo, mat);
            head.rotation.x = -Math.PI / 2;
            head.position.z = -0.06;

            group.add(stem);
            group.add(head);
            return group;
        }

        const currents = [];
        for (let i = 0; i < numParticles; i++) {
            const mesh = createArrowMesh();
            scene.add(mesh);
            currents.push({ mesh, progress: i / numParticles });
        }

        // 회로 트랙 상의 위치 및 진행 방향 반환 함수
        function getCircuitTrackInfo(t) {
            t = (t % 1 + 1) % 1;
            const seg = t * 4;
            const idx = Math.floor(seg);
            const subT = seg - idx;
            const pA = pathPoints[idx];
            const pB = pathPoints[(idx + 1) % 4];
            const pos = new THREE.Vector3().lerpVectors(pA, pB, subT);
            const dir = new THREE.Vector3().subVectors(pB, pA).normalize();
            return { pos, dir };
        }

        // --- 7. 인터랙션 및 상태 제어 ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function getMousePos(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        }

        function toggleSwitchState(closed) {
            isClosed = closed !== undefined ? closed : !isClosed;
            const btn = document.getElementById('btn-switch-toggle');
            if (isClosed) {
                // 스위치 ON: X축 회전 각도를 0으로 만들어 전선과 수평하게 연결
                swPivot.rotation.x = 0;
                btn.className = 'toggle-btn active-on';
                btn.innerText = '스위치 닫힘 (ON)';
            } else {
                // 스위치 OFF: 대각선 위로 들려 올려 연결 해제
                swPivot.rotation.x = Math.PI / 4;
                btn.className = 'toggle-btn active-off';
                btn.innerText = '스위치 열림 (OFF)';
            }
        }

        function onPointerDown(e) {
            getMousePos(e);
            raycaster.setFromCamera(mouse, camera);

            // 스위치 부품 클릭 감지
            const intersects = raycaster.intersectObjects([swArm, handle, swBase, term1, term2], true);
            if (intersects.length > 0) {
                toggleSwitchState();
                const tooltip = document.getElementById('guide-tooltip');
                if (tooltip) tooltip.style.opacity = '0';
            }
        }

        window.addEventListener('pointerdown', onPointerDown);

        // --- 8. UI 컨트롤 이벤트 ---
        const btnTogglePhysics = document.getElementById('btn-toggle-physics');
        const physicsPanel = document.getElementById('physics-panel');
        btnTogglePhysics.addEventListener('click', () => {
            physicsPanel.classList.toggle('show');
            btnTogglePhysics.classList.toggle('active');
        });

        const sldVoltage = document.getElementById('sld-voltage');
        const sldResistance = document.getElementById('sld-resistance');

        sldVoltage.addEventListener('input', (e) => {
            voltage = parseFloat(e.target.value);
            document.getElementById('txt-voltage').innerText = voltage.toFixed(1) + ' V';
            document.getElementById('val-voltage').innerText = voltage.toFixed(1) + ' V';
        });

        sldResistance.addEventListener('input', (e) => {
            resistance = parseFloat(e.target.value);
            document.getElementById('txt-resistance').innerText = resistance.toFixed(1) + ' Ω';
            document.getElementById('val-resistance').innerText = resistance.toFixed(1) + ' Ω';
        });

        document.getElementById('btn-switch-toggle').addEventListener('click', () => toggleSwitchState());

        // 전지 방향 반전 버튼
        document.getElementById('btn-battery-reverse').addEventListener('click', () => {
            isBatteryReversed = !isBatteryReversed;
            batteryGroup.rotation.y = isBatteryReversed ? Math.PI : 0;
            const btn = document.getElementById('btn-battery-reverse');
            btn.innerText = isBatteryReversed ? '전지 방향 반전 (현재: 역방향)' : '전지 방향 반전 (현재: 정방향)';
        });

        // 흐름 시각화 선택 (전자 / 전류)
        const btnElectron = document.getElementById('btn-mode-electron');
        const btnCurrent = document.getElementById('btn-mode-current');

        btnElectron.addEventListener('click', () => {
            viewMode = 'electron';
            btnElectron.classList.add('selected');
            btnCurrent.classList.remove('selected');
        });

        btnCurrent.addEventListener('click', () => {
            viewMode = 'current';
            btnCurrent.classList.add('selected');
            btnElectron.classList.remove('selected');
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            voltage = 6.0;
            resistance = 10.0;
            sldVoltage.value = 6;
            sldResistance.value = 10;
            document.getElementById('txt-voltage').innerText = '6.0 V';
            document.getElementById('val-voltage').innerText = '6.0 V';
            document.getElementById('txt-resistance').innerText = '10.0 Ω';
            document.getElementById('val-resistance').innerText = '10.0 Ω';
            
            isBatteryReversed = false;
            batteryGroup.rotation.y = 0;
            document.getElementById('btn-battery-reverse').innerText = '전지 방향 반전 (현재: 정방향)';

            viewMode = 'electron';
            btnElectron.classList.add('selected');
            btnCurrent.classList.remove('selected');

            toggleSwitchState(false);
        });

        document.getElementById('btn-align').addEventListener('click', () => {
            camera.position.set(0, 3.2, 4.5);
            controls.target.set(0, 0, 0);
        });

        document.getElementById('theme-toggle').addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            scene.background.setHex(isDark ? 0x121212 : 0xf2f2f7);
            floor.material.color.setHex(isDark ? 0x1c1c1e : 0xe5e5ea);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 초기 스위치 각도 설정 (OFF)
        toggleSwitchState(false);

        // --- 9. 시뮬레이션 및 연산 애니메이션 루프 ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // 1. 옴의 법칙 및 전력 연산
            const current = isClosed ? (voltage / resistance) : 0;
            const power = isClosed ? (voltage * current) : 0; // P = V * I

            document.getElementById('val-current').innerText = current.toFixed(2) + ' A';
            document.getElementById('val-power').innerText = power.toFixed(2) + ' W';

            // 2. 전력 계산 기반 전구 밝기 조절
            // 기준 전력 3.6W일 때 적정 밝기, 최대 72W 범위에 맞춰 커브 적용
            const brightness = isClosed ? Math.min(1.0, power / 15.0) : 0;
            filamentMat.emissiveIntensity = brightness * 3.0;
            bulbLight.intensity = brightness * 3.5;

            // 3. 전자 / 전류 이동 연산
            // 속도는 전류 크기에 비례
            const flowSpeed = current * 0.12;

            // 전지 방향에 따른 전자 이동 방향 (정방향일 때 -극인 좌측에서 출구)
            const electronDirection = isBatteryReversed ? -1 : 1;
            // 전류 방향은 전자의 이동 방향과 항상 반대
            const currentDirection = -electronDirection;

            // (1) 전자 애니메이션
            electrons.forEach((e) => {
                if (isClosed && viewMode === 'electron') {
                    e.progress += delta * flowSpeed * electronDirection;
                    const track = getCircuitTrackInfo(e.progress);
                    e.mesh.position.copy(track.pos);
                    e.mesh.position.y += 0.04;
                    e.mesh.visible = true;
                } else {
                    e.mesh.visible = false;
                }
            });

            // (2) 전류 화살표 애니메이션
            currents.forEach((c) => {
                if (isClosed && viewMode === 'current') {
                    c.progress += delta * flowSpeed * currentDirection;
                    const track = getCircuitTrackInfo(c.progress);
                    c.mesh.position.copy(track.pos);
                    c.mesh.position.y += 0.04;

                    // 화살표가 이동 방향을 바라보도록 설정
                    const lookTarget = track.pos.clone().add(track.dir.clone().multiplyScalar(currentDirection));
                    lookTarget.y += 0.04;
                    c.mesh.lookAt(lookTarget);

                    c.mesh.visible = true;
                } else {
                    c.mesh.visible = false;
                }
            });

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
