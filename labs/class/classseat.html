<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>자리 배치 추첨 3D</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <!-- Three.js 및 OrbitControls 라이브러리 -->
    <script src="../common/lib/three.min.js"></script>
    <script src="../common/lib/OrbitControls.js"></script>
    <style>
        @font-face {
            font-family: 'SeoulNamsan';
            src: local('SeoulNamsan M'), local('SeoulNamsanM'), local('서울남산체 M'),
                 url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'SeoulNamsan', -apple-system, sans-serif;
            background-color: #f2f2f7;
            color: #1c1c1e;
            touch-action: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            touch-action: none;
        }

        /* Apple visionOS Glassmorphic UI */
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            z-index: 10;
        }

        .top-left-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            color: #1c1c1e;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tag-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
        }

        .tag-pill {
            background: rgba(0, 122, 255, 0.15);
            color: #007aff;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
        }

        .top-right-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .data-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 20px;
        }

        .data-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .data-label {
            font-size: 11px;
            color: #8e8e93;
            font-weight: bold;
        }

        .data-value {
            font-size: 15px;
            font-weight: bold;
            color: #1c1c1e;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            transition: all 0.2s;
        }

        .center-tooltip {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 18px;
            font-size: 13px;
            color: #8e8e93;
            border-radius: 30px;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.5s ease;
            text-align: center;
        }

        .bottom-control-bar {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            z-index: 10;
        }

        .control-tab-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 14px;
            min-width: 72px;
            border-radius: 14px;
            border: none;
            background: transparent;
            color: #1c1c1e;
            font-size: 12px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-tab-btn.active, .control-tab-btn.primary {
            background: #007aff;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }

        .control-tab-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* 서브 패널 */
        .sub-panel { right: 20px;
            position: absolute;
            bottom: 72px;
            left: auto;
            transform: none;
            padding: 20px;
            width: 320px;
            display: none;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .sub-panel.show { display: flex; }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: bold;
        }

        input[type="number"], input[type="text"] {
            padding: 5px 8px;
            border-radius: 8px;
            border: 1px solid #c7c7cc;
            font-size: 13px;
            text-align: center;
            outline: none;
            background: rgba(255, 255, 255, 0.8);
        }

        input[type="number"] { width: 70px; }
        input[type="text"] { width: 120px; }

        .divider {
            height: 1px;
            background: rgba(0,0,0,0.1);
            margin: 4px 0;
        }

        /* 카운트다운 오버레이 */
        #countdown-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
        }

        #countdown-text {
            font-size: 180px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        @keyframes popIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .pop-anim {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        body.dark-mode {
            background-color: #121212;
            color: #f2f2f7;
        }

        body.dark-mode .glass-panel {
            background: rgba(30, 30, 30, 0.75);
            border-color: rgba(255, 255, 255, 0.15);
            color: #f2f2f7;
        }

        body.dark-mode .data-value, body.dark-mode .back-btn {
            color: #f2f2f7;
        }

        body.dark-mode input[type="number"], body.dark-mode input[type="text"] {
            background: rgba(50, 50, 50, 0.8);
            color: #fff;
            border-color: #555;
        }
    
        /* Bottom Right Bar (Fullscreen) */
        .bottom-right-bar {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }
        button.back-btn, button.tag-badge {
            font-family: inherit;
            border: none;
        }
        @media (max-width: 768px) {
            .bottom-right-bar {
                bottom: 15px;
                right: 15px;
            }
        }
    

/* @@MOBILE-BASE v1@@ */
/* ============================================================
   모바일 반응형 보정 (세로/가로) — 자동 생성 블록
   ============================================================ */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
img, canvas { max-width: 100%; }

/* ---------- 모바일 세로 (폭 900px 이하) ---------- */
@media (max-width: 900px) {
    /* 1행: [메인][제목]  ...  [전체화면 아이콘] */
    .top-left-bar {
        top: max(8px, env(safe-area-inset-top)) !important;
        left: 8px !important;
        right: 56px !important;
        gap: 6px !important;
        flex-wrap: nowrap !important;
        align-items: center !important;
        overflow: hidden;
    }
    .top-left-bar .back-btn,
    .top-left-bar > a {
        flex: 0 0 auto;
        padding: 6px 10px !important;
        font-size: 12px !important;
        gap: 4px !important;
        white-space: nowrap;
    }
    .top-left-bar .tag-badge {
        flex: 0 1 auto;
        min-width: 0;
        padding: 6px 10px !important;
        font-size: 12px !important;
        gap: 5px !important;
        white-space: nowrap;
        overflow: hidden;
    }
    .top-left-bar .tag-badge > span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .tag-pill { font-size: 9px !important; padding: 1px 6px !important; flex: 0 0 auto; }

    /* 2행: [데이터 카드 .............][테마] */
    .top-right-bar {
        top: calc(max(8px, env(safe-area-inset-top)) + 40px) !important;
        left: 8px !important;
        right: 8px !important;
        gap: 6px !important;
        justify-content: flex-end !important;
        flex-wrap: nowrap !important;
    }
    .data-card {
        flex: 1 1 0%;
        min-width: 0;
        gap: 4px !important;
        padding: 6px 8px !important;
        justify-content: space-around !important;
        overflow: hidden;
    }
    .data-card { flex-direction: row !important; align-items: center !important; flex-wrap: nowrap !important; }
    .data-item { min-width: 0; flex-direction: column !important; align-items: center !important; gap: 0 !important; }
    .data-item > * { white-space: nowrap; }
    .voltmeter-display { font-size: 24px !important; }
    .data-label { font-size: 9px !important; white-space: nowrap; line-height: 1.2; }
    .data-value { font-size: 12.5px !important; white-space: nowrap; line-height: 1.25; }
    .icon-btn { width: 34px !important; height: 34px !important; min-width: 34px; font-size: 15px !important; flex: 0 0 auto; }

    /* 전체화면: 1행 우측 아이콘 버튼 (글자는 숨김) */
    .bottom-right-bar {
        top: max(8px, env(safe-area-inset-top)) !important;
        bottom: auto !important;
        right: 8px !important;
        left: auto !important;
        z-index: 20;
    }
    .bottom-right-bar button,
    .bottom-right-bar .back-btn {
        padding: 6px 9px !important;
        font-size: 14px !important;
        gap: 4px !important;
        line-height: 1;
    }
    .bottom-right-bar #fullscreenText,
    .bottom-right-bar .fs-text { display: none !important; }

    /* 안내 문구 */
    .center-tooltip, #guide-tooltip {
        top: calc(max(8px, env(safe-area-inset-top)) + 88px) !important;
        left: 8px !important;
        right: 8px !important;
        transform: none !important;
        margin: 0 auto;
        width: auto !important;
        max-width: none !important;
        font-size: 11.5px !important;
        padding: 7px 12px !important;
        white-space: normal !important;
        line-height: 1.45;
        text-align: center;
        z-index: 15 !important;
    }

    /* 하단 컨트롤 바: 화면 폭 전체, 한 줄 유지 */
    .bottom-control-bar {
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        transform: none !important;
        width: 100% !important;
        border-radius: 18px 18px 0 0 !important;
        padding: 6px 6px calc(6px + env(safe-area-inset-bottom)) !important;
        gap: 2px !important;
        justify-content: space-around !important;
        flex-wrap: nowrap !important;
        overflow: visible;
    }
    .control-tab-btn {
        flex: 1 1 0 !important;
        min-width: 0 !important;
        padding: 5px 2px !important;
        font-size: 10.5px !important;
        gap: 1px !important;
        border-radius: 12px !important;
        white-space: nowrap !important;
        line-height: 1.15;
    }
    .control-tab-btn span { white-space: nowrap !important; }
    .control-tab-btn span:first-child { font-size: 15px !important; line-height: 1.1; }

    /* 슬라이더 등 서브 패널 */
    .sub-panel {
        left: 8px !important;
        right: 8px !important;
        bottom: calc(76px + env(safe-area-inset-bottom)) !important;
        transform: none !important;
        width: auto !important;
        max-width: none !important;
        max-height: 46vh;
        overflow-y: auto;
        padding: 13px 14px !important;
        gap: 10px !important;
        -webkit-overflow-scrolling: touch;
    }
    .sub-panel-title { font-size: 11px !important; }
    .slider-header { font-size: 11px !important; }
    .control-row { gap: 5px !important; flex-wrap: wrap; }
    .toggle-btn, .mode-btn, .quick-btn, .example-item, .preset-btn { font-size: 11px !important; }
    input[type="range"] { height: 22px; }

    /* 팝업(모달)이 화면을 넘지 않도록 */
    .modal-overlay { padding: 12px !important; align-items: center !important; }
    .modal-card {
        max-height: 88vh !important;
        overflow-y: auto !important;
        width: auto !important;
        max-width: 100% !important;
        padding: 16px !important;
        -webkit-overflow-scrolling: touch;
    }
    .modal-title { font-size: 15px !important; }
    .modal-body { font-size: 12px !important; }
    .example-title { font-size: 11.5px !important; }
    .example-desc { font-size: 11px !important; line-height: 1.5 !important; }
}

@media (max-width: 430px) {
    /* 아주 좁은 화면에서는 장식용 배지를 숨겨 제목 자리를 확보 */
    .tag-pill { display: none !important; }
}

    <script>
        // --- 1. Three.js 기본 씬 & 카메라 & 렌더러 설정 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf2f2f7);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 11, -1);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 0, -3.5);

        // --- 2. 조명 설정 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
        dirLight.position.set(4, 10, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // --- 3. 바닥 및 칠판 연출 ---
        const floorGeo = new THREE.PlaneGeometry(24, 24);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xd7ccc8, roughness: 0.6 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.01;
        floor.receiveShadow = true;
        scene.add(floor);

        const boardGroup = new THREE.Group();
        const boardFrame = new THREE.Mesh(
            new THREE.BoxGeometry(7, 2.2, 0.1),
            new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.3 })
        );
        const boardSurface = new THREE.Mesh(
            new THREE.PlaneGeometry(6.8, 2.0),
            new THREE.MeshStandardMaterial({ color: 0x1e4620, roughness: 0.8 })
        );
        boardSurface.position.z = 0.055;
        boardGroup.add(boardFrame);
        boardGroup.add(boardSurface);

        const boardCanvas = document.createElement('canvas');
        boardCanvas.width = 1024;
        boardCanvas.height = 256;
        const bCtx = boardCanvas.getContext('2d');
        function drawBoardText() {
            bCtx.clearRect(0, 0, boardCanvas.width, boardCanvas.height);
            bCtx.fillStyle = '#ffffff';
            bCtx.font = 'bold 80px "SeoulNamsan", sans-serif';
            bCtx.textAlign = 'center';
            bCtx.fillText('칠 판 (정 면)', 512, 150);
        }
        drawBoardText();

        const boardTex = new THREE.CanvasTexture(boardCanvas);
        if (document.fonts && document.fonts.load) {
            document.fonts.load('bold 80px "SeoulNamsan"').then(function () {
                drawBoardText(); boardTex.needsUpdate = true;
            }, function () {});
        }
        const boardTextMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(3.5, 0.875),
            new THREE.MeshBasicMaterial({ map: boardTex, transparent: true })
        );
        boardTextMesh.position.z = 0.06;
        boardGroup.add(boardTextMesh);

        boardGroup.position.set(0, 2.2, -6.5);
        scene.add(boardGroup);

        // --- 4. 책상 및 자리 생성 모듈 ---
        let rows = 5;
        let cols = 6;
        let deskSlots = [];

        const topMat = new THREE.MeshStandardMaterial({ color: 0xe0a96d, roughness: 0.4 });
        const legMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.5 });
        const chairMat = new THREE.MeshStandardMaterial({ color: 0x8d5b4c, roughness: 0.5 });
        const ghostMat = new THREE.MeshBasicMaterial({ color: 0x007aff, wireframe: true, transparent: true, opacity: 0.15 });

        function createDeskMesh() {
            const group = new THREE.Group();

            const topMesh = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.05, 0.55), topMat);
            topMesh.position.y = 0.7;
            topMesh.castShadow = true;
            topMesh.name = "deskTop";
            group.add(topMesh);

            const legGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.7, 16);
            const legPositions = [
                [-0.35, 0.35, -0.22], [0.35, 0.35, -0.22],
                [-0.35, 0.35, 0.22], [0.35, 0.35, 0.22]
            ];
            legPositions.forEach(pos => {
                const leg = new THREE.Mesh(legGeo, legMat);
                leg.position.set(...pos);
                leg.castShadow = true;
                group.add(leg);
            });

            const chairSeat = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.04, 0.42), chairMat);
            chairSeat.position.set(0, 0.42, 0.5);
            chairSeat.castShadow = true;
            group.add(chairSeat);

            const chairBack = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.35, 0.04), chairMat);
            chairBack.position.set(0, 0.62, 0.69);
            chairBack.castShadow = true;
            group.add(chairBack);

            return group;
        }

        // 책상을 가득 채우는 둥근 사각형 텍스처
        function createNumberTexture(num) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 352;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#f39c12';
            const r = 40; 
            ctx.beginPath();
            ctx.moveTo(10 + r, 10);
            ctx.lineTo(502 - r, 10);
            ctx.quadraticCurveTo(502, 10, 502, 10 + r);
            ctx.lineTo(502, 342 - r);
            ctx.quadraticCurveTo(502, 342, 502 - r, 342);
            ctx.lineTo(10 + r, 342);
            ctx.quadraticCurveTo(10, 342, 10, 342 - r);
            ctx.lineTo(10, 10 + r);
            ctx.quadraticCurveTo(10, 10, 10 + r, 10);
            ctx.fill();

            ctx.lineWidth = 14;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 180px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(num + '', 256, 176 + 12);

            return new THREE.CanvasTexture(canvas);
        }

        function renderClassroom() {
            deskSlots.forEach(slot => {
                if (slot.deskGroup) scene.remove(slot.deskGroup);
                if (slot.ghostMesh) scene.remove(slot.ghostMesh);
            });
            deskSlots = [];

            const spacingX = 1.2;
            const spacingZ = 1.2;
            const startX = -((cols - 1) * spacingX) / 2;
            const startZ = -3.5 + (rows * spacingZ) / 2;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const posX = startX + c * spacingX;
                    const posZ = startZ - r * spacingZ;

                    const deskGroup = createDeskMesh();
                    deskGroup.position.set(posX, 0, posZ);
                    scene.add(deskGroup);

                    const ghostMesh = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.02, 0.6), ghostMat);
                    ghostMesh.position.set(posX, 0.01, posZ);
                    ghostMesh.visible = false;
                    scene.add(ghostMesh);

                    deskSlots.push({
                        id: r * cols + c,
                        active: true,
                        deskGroup: deskGroup,
                        ghostMesh: ghostMesh,
                        number: null,
                        numMesh: null
                    });
                }
            }

            document.getElementById('input-end-num').value = rows * cols;
            updateSeatCountUI();
        }

        function updateSeatCountUI() {
            const activeCount = deskSlots.filter(s => s.active).length;
            document.getElementById('val-total').innerText = activeCount + '석';
        }

        renderClassroom();

        // --- 5. 레이캐스팅 클릭 (책상 삭제/생성 토글) ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function onPointerDown(e) {
            if (e.target.closest('.glass-panel') || e.target.closest('#countdown-overlay')) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            let interactableObjects = [];
            deskSlots.forEach(slot => {
                if (slot.active) {
                    interactableObjects.push(...slot.deskGroup.children);
                } else {
                    interactableObjects.push(slot.ghostMesh);
                }
            });

            const intersects = raycaster.intersectObjects(interactableObjects, true);

            if (intersects.length > 0) {
                const hitObj = intersects[0].object;
                const targetSlot = deskSlots.find(slot => {
                    if (slot.active) {
                        return slot.deskGroup.children.includes(hitObj) || hitObj.parent === slot.deskGroup;
                    } else {
                        return slot.ghostMesh === hitObj;
                    }
                });

                if (targetSlot) {
                    targetSlot.active = !targetSlot.active;
                    targetSlot.deskGroup.visible = targetSlot.active;
                    targetSlot.ghostMesh.visible = !targetSlot.active;

                    // [수정된 부분] 
                    // 책상을 비활성화하더라도 기존에 생성된 번호 메쉬와 데이터(number)를 지우지 않고 유지합니다.
                    // deskGroup.visible 속성에 종속되므로 화면에서 사라졌다가 다시 활성화 시 그대로 나타납니다.

                    updateSeatCountUI();
                    recountAssigned();
                }
            }
        }
        window.addEventListener('pointerdown', onPointerDown);

        // --- 6. 카운트다운 및 자리 추첨 ---
        let isDrawing = false;
        
        function drawSeats() {
            const activeSlots = deskSlots.filter(s => s.active);
            if (activeSlots.length === 0 || isDrawing) return;

            isDrawing = true;
            document.getElementById('btn-draw').disabled = true;

            const overlay = document.getElementById('countdown-overlay');
            const cdText = document.getElementById('countdown-text');
            overlay.style.display = 'flex';

            let count = 3;
            cdText.innerText = count;
            
            cdText.classList.remove('pop-anim');
            void cdText.offsetWidth; 
            cdText.classList.add('pop-anim');

            const interval = setInterval(() => {
                count--;
                if (count > 0) {
                    cdText.innerText = count;
                    cdText.classList.remove('pop-anim');
                    void cdText.offsetWidth;
                    cdText.classList.add('pop-anim');
                } else {
                    clearInterval(interval);
                    overlay.style.display = 'none';
                    executeDraw(); 
                    document.getElementById('btn-draw').disabled = false;
                    isDrawing = false;
                }
            }, 1000);
        }

        function executeDraw() {
            const startNum = parseInt(document.getElementById('input-start-num').value) || 1;
            const endNum = parseInt(document.getElementById('input-end-num').value) || (rows * cols);
            
            const excludeInput = document.getElementById('input-exclude-nums').value;
            const excludeNums = excludeInput.split(/[\s,]+/)
                                           .map(n => parseInt(n.trim()))
                                           .filter(n => !isNaN(n));

            let pool = [];
            for (let i = startNum; i <= endNum; i++) {
                if (!excludeNums.includes(i)) pool.push(i);
            }

            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }

            const activeSlots = deskSlots.filter(s => s.active);

            activeSlots.forEach((slot, idx) => {
                if (slot.numMesh) {
                    slot.deskGroup.remove(slot.numMesh);
                    slot.numMesh = null;
                }

                if (idx < pool.length) {
                    const num = pool[idx];
                    slot.number = num;

                    const tex = createNumberTexture(num);
                    const numGeo = new THREE.PlaneGeometry(0.75, 0.50);
                    const numMat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
                    const numMesh = new THREE.Mesh(numGeo, numMat);

                    numMesh.rotation.x = -Math.PI / 2;
                    numMesh.position.set(0, 0.73, 0);
                    numMesh.scale.set(0.01, 0.01, 0.01);
                    
                    slot.deskGroup.add(numMesh);
                    slot.numMesh = numMesh;
                } else {
                    slot.number = null;
                }
            });

            recountAssigned();
            document.getElementById('guide-tooltip').style.opacity = '0';
        }

        function recountAssigned() {
            const assignedCount = deskSlots.filter(s => s.active && s.number !== null).length;
            document.getElementById('val-assigned').innerText = assignedCount + '석';
        }

        function resetSeats() {
            if (isDrawing) return;
            deskSlots.forEach(slot => {
                if (slot.numMesh) {
                    slot.deskGroup.remove(slot.numMesh);
                    slot.numMesh = null;
                }
                slot.number = null;
            });
            document.getElementById('val-assigned').innerText = '0석';
            document.getElementById('guide-tooltip').style.opacity = '1';
        }

        // --- 7. UI 제어 및 이벤트 ---
        document.getElementById('btn-draw').addEventListener('click', drawSeats);
        document.getElementById('btn-reset').addEventListener('click', resetSeats);

        const btnToggleConfig = document.getElementById('btn-toggle-config');
        const configPanel = document.getElementById('config-panel');
        btnToggleConfig.addEventListener('click', () => {
            configPanel.classList.toggle('show');
            btnToggleConfig.classList.toggle('active');
        });

        document.getElementById('input-cols').addEventListener('change', (e) => {
            cols = parseInt(e.target.value);
            renderClassroom();
            resetSeats();
        });

        document.getElementById('input-rows').addEventListener('change', (e) => {
            rows = parseInt(e.target.value);
            renderClassroom();
            resetSeats();
        });

        document.getElementById('btn-align').addEventListener('click', () => {
            camera.position.set(0, 11, -1);
            controls.target.set(0, 0, -3.5);
        });

        document.getElementById('theme-toggle').addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            scene.background.setHex(isDark ? 0x121212 : 0xf2f2f7);
            floorMat.color.setHex(isDark ? 0x2c2c2e : 0xd7ccc8);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 8. 애니메이션 루프 ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            deskSlots.forEach(slot => {
                if (slot.numMesh && slot.numMesh.scale.x < 0.999) {
                    slot.numMesh.scale.lerp(new THREE.Vector3(1, 1, 1), 0.15);
                }
            });

            renderer.render(scene, camera);
        }

        animate();
    
        /* ---------- Fullscreen / Windowed Mode Logic ---------- */
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const fullscreenIcon = document.getElementById('fullscreenIcon');
        const fullscreenText = document.getElementById('fullscreenText');

        function updateFullscreenUI() {
            const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
            if (fullscreenIcon) fullscreenIcon.innerText = isFS ? '🗗' : '⛶';
            if (fullscreenText) fullscreenText.innerText = isFS ? '창모드' : '전체화면';
        }

        if (fullscreenBtn) {
            fullscreenBtn.addEventListener('click', () => {
                try {
                    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                        const req = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
                        if (req) req.call(document.documentElement);
                    } else {
                        const exit = document.exitFullscreen || document.webkitExitFullscreen;
                        if (exit) exit.call(document);
                    }
                } catch (err) {
                    console.error('전체화면 모드를 전환할 수 없습니다:', err);
                }
            });
        }

        document.addEventListener('fullscreenchange', updateFullscreenUI);
        document.addEventListener('webkitfullscreenchange', updateFullscreenUI);
    </script>

<script>
/* ============ 모바일 화면 재조정 + 전체화면 대체 동작 (자동 생성) ============ */
(function () {
    var docEl = document.documentElement;
    var btn = document.getElementById('fullscreenBtn');
    var icon = document.getElementById('fullscreenIcon');
    var text = document.getElementById('fullscreenText');

    function realFs() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement ||
                  document.mozFullScreenElement || document.msFullscreenElement);
    }
    function pseudo() { return docEl.classList.contains('pseudo-fs'); }
    function setUI() {
        var on = realFs() || pseudo();
        if (icon) icon.textContent = on ? '🗗' : '⛶';
        if (text) text.textContent = on ? '창모드' : '전체화면';
        if (btn) btn.setAttribute('aria-label', on ? '창모드로 전환' : '전체화면으로 전환');
        document.body.classList.toggle('is-fullscreen', on);
    }
    function toast(msg) {
        var t = document.getElementById('ux-toast');
        if (!t) {
            t = document.createElement('div');
            t.id = 'ux-toast';
            t.style.cssText = 'position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);' +
                'background:rgba(28,28,30,.88);color:#fff;font-size:12px;line-height:1.4;padding:9px 14px;border-radius:14px;' +
                'z-index:9999;max-width:86vw;text-align:center;pointer-events:none;transition:opacity .3s;' +
                'font-family:inherit;box-shadow:0 8px 24px rgba(0,0,0,.25)';
            document.body.appendChild(t);
        }
        t.textContent = msg;
        t.style.opacity = '1';
        clearTimeout(t._t);
        t._t = setTimeout(function () { t.style.opacity = '0'; }, 2600);
    }

    if (btn) {
        btn.addEventListener('click', function () {
            var wasReal = realFs();
            var wasPseudo = pseudo();
            setTimeout(function () {
                if (wasReal) { setUI(); return; }          // 진짜 전체화면에서 나온 경우
                if (wasPseudo) { docEl.classList.remove('pseudo-fs'); setUI(); return; }  // 몰입 모드 해제
                if (!realFs()) {                            // 전체화면 API가 동작하지 않는 환경
                    docEl.classList.add('pseudo-fs');
                    try { window.scrollTo(0, 1); } catch (e) {}
                    toast('이 브라우저는 전체화면을 지원하지 않아 상단 정보를 숨긴 몰입 모드로 표시합니다');
                }
                setUI();
            }, 380);
        }, false);
    }
    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
        document.addEventListener(ev, setUI);
    });

    /* 좁은 화면에서는 3D 장면이 잘리지 않도록 시야각을 넓혀 전체가 들어오게 한다 */
    function mobileFit() {
        try {
            if (typeof camera === 'undefined' || !camera || !camera.isPerspectiveCamera) return;
            if (!camera.userData) camera.userData = {};
            if (!camera.userData.baseFov) camera.userData.baseFov = camera.fov;
            var w = window.innerWidth, h = window.innerHeight, f = 1;
            var k = 0.62;
            var attr = document.documentElement.getAttribute('data-mzoom');
            if (attr) { var v = parseFloat(attr); if (!isNaN(v) && v > 0) k = v; }
            if (w < h) f = 1 + (1 - w / h) * k;
            else if (h <= 500) f = 1 + k * 0.16;
            camera.fov = Math.min(88, camera.userData.baseFov * f);
            camera.updateProjectionMatrix();
        } catch (e) {}
    }
    mobileFit();

    /* 화면 회전·주소창 변화·전체화면 전환 후 렌더러 크기 재계산 */
    var rt = null;
    function refit() {
        clearTimeout(rt);
        rt = setTimeout(function () {
            mobileFit();
            try { window.dispatchEvent(new Event('resize')); } catch (e) {}
        }, 240);
    }
    window.addEventListener('orientationchange', refit);
    window.addEventListener('pageshow', refit);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) refit(); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', refit);

    setUI();
})();
</script>
