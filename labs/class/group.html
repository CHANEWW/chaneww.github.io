<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>모둠 뽑기</title>
    <!-- Three.js 및 OrbitControls 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        @font-face {
            font-family: 'SeoulNamsan';
            src: local('SeoulNamsan M'), local('SeoulNamsanM'), local('서울남산체 M'),
                 url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'SeoulNamsan', -apple-system, sans-serif;
            background-color: #f2f2f7;
            color: #1c1c1e;
            touch-action: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            touch-action: none;
        }

        /* Apple visionOS Glassmorphic UI */
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            z-index: 10;
        }

        .top-left-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            color: #1c1c1e;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tag-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
        }

        .tag-pill {
            background: rgba(0, 122, 255, 0.15);
            color: #007aff;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
        }

        .top-right-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .data-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 18px;
        }

        .data-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .data-label {
            font-size: 11px;
            color: #8e8e93;
            font-weight: bold;
        }

        .data-value {
            font-size: 15px;
            font-weight: bold;
            color: #1c1c1e;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            transition: all 0.2s;
        }

        .center-tooltip {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 18px;
            font-size: 13px;
            color: #8e8e93;
            border-radius: 30px;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.5s ease;
            text-align: center;
            max-width: 90vw;
        }

        .bottom-control-bar {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            z-index: 10;
        }

        .control-tab-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 14px;
            min-width: 68px;
            border-radius: 14px;
            border: none;
            background: transparent;
            color: #1c1c1e;
            font-size: 12px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-tab-btn.active, .control-tab-btn.primary {
            background: #007aff;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }

        .control-tab-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* 서브 패널 */
        .sub-panel {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            padding: 20px;
            width: 330px;
            max-width: 92vw;
            display: none;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .sub-panel.show { display: flex; }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: bold;
        }

        input[type="number"], input[type="text"] {
            padding: 5px 8px;
            border-radius: 8px;
            border: 1px solid #c7c7cc;
            font-size: 13px;
            text-align: center;
            outline: none;
            background: rgba(255, 255, 255, 0.8);
            font-family: inherit;
        }

        input[type="number"] { width: 70px; }
        input[type="text"] { width: 120px; }

        .divider {
            height: 1px;
            background: rgba(0,0,0,0.1);
            margin: 4px 0;
        }

        .hint {
            font-size: 11px;
            color: #8e8e93;
            font-weight: normal;
            line-height: 1.5;
        }

        /* 결과 패널 */
        .result-panel {
            position: absolute;
            top: 80px;
            right: 20px;
            width: 240px;
            max-height: 55vh;
            overflow-y: auto;
            padding: 14px 16px;
            display: none;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
            touch-action: pan-y;
        }

        .result-panel.show { display: flex; }

        .result-title {
            font-size: 13px;
            font-weight: bold;
        }

        .group-row {
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding-bottom: 8px;
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(0,0,0,0.08);
        }

        .group-row:last-child { border-bottom: none; margin-bottom: 0; }

        .group-name {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: bold;
        }

        .group-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .group-nums {
            font-size: 13px;
            line-height: 1.5;
            word-break: keep-all;
        }

        .num-removed {
            text-decoration: line-through;
            opacity: 0.4;
        }

        /* 카운트다운 오버레이 */
        #countdown-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
        }

        #countdown-text {
            font-size: 180px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        @keyframes popIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .pop-anim {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        body.dark-mode {
            background-color: #121212;
            color: #f2f2f7;
        }

        body.dark-mode .glass-panel {
            background: rgba(30, 30, 30, 0.75);
            border-color: rgba(255, 255, 255, 0.15);
            color: #f2f2f7;
        }

        body.dark-mode .data-value, body.dark-mode .back-btn {
            color: #f2f2f7;
        }

        body.dark-mode .control-tab-btn:not(.primary):not(.active) {
            color: #f2f2f7;
        }

        body.dark-mode .group-row {
            border-bottom-color: rgba(255,255,255,0.12);
        }

        body.dark-mode input[type="number"], body.dark-mode input[type="text"] {
            background: rgba(50, 50, 50, 0.8);
            color: #fff;
            border-color: #555;
        }
    
        /* Bottom Right Bar (Fullscreen) */
        .bottom-right-bar {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }
        button.back-btn, button.tag-badge {
            font-family: inherit;
            border: none;
        }
        @media (max-width: 768px) {
            .bottom-right-bar {
                bottom: 15px;
                right: 15px;
            }
        }
    













/* @@MOBILE-BASE v1@@ */
/* ============================================================
   모바일 반응형 보정 (세로/가로) — 자동 생성 블록
   ============================================================ */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
img, canvas { max-width: 100%; }

/* ---------- 모바일 세로 (폭 900px 이하) ---------- */
@media (max-width: 900px) {
    /* 1행: [메인][제목]  ...  [전체화면 아이콘] */
    .top-left-bar {
        top: max(8px, env(safe-area-inset-top)) !important;
        left: 8px !important;
        right: 56px !important;
        gap: 6px !important;
        flex-wrap: nowrap !important;
        align-items: center !important;
        overflow: hidden;
    }
    .top-left-bar .back-btn,
    .top-left-bar > a {
        flex: 0 0 auto;
        padding: 6px 10px !important;
        font-size: 12px !important;
        gap: 4px !important;
        white-space: nowrap;
    }
    .top-left-bar .tag-badge {
        flex: 0 1 auto;
        min-width: 0;
        padding: 6px 10px !important;
        font-size: 12px !important;
        gap: 5px !important;
        white-space: nowrap;
        overflow: hidden;
    }
    .top-left-bar .tag-badge > span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .tag-pill { font-size: 9px !important; padding: 1px 6px !important; flex: 0 0 auto; }

    /* 2행: [데이터 카드 .............][테마] */
    .top-right-bar {
        top: calc(max(8px, env(safe-area-inset-top)) + 40px) !important;
        left: 8px !important;
        right: 8px !important;
        gap: 6px !important;
        justify-content: flex-end !important;
        flex-wrap: nowrap !important;
    }
    .data-card {
        flex: 1 1 0%;
        min-width: 0;
        gap: 4px !important;
        padding: 6px 8px !important;
        justify-content: space-around !important;
        overflow: hidden;
    }
    .data-card { flex-direction: row !important; align-items: center !important; flex-wrap: nowrap !important; }
    .data-item { min-width: 0; flex-direction: column !important; align-items: center !important; gap: 0 !important; }
    .data-item > * { white-space: nowrap; }
    .voltmeter-display { font-size: 24px !important; }
    .data-label { font-size: 9px !important; white-space: nowrap; line-height: 1.2; }
    .data-value { font-size: 12.5px !important; white-space: nowrap; line-height: 1.25; }
    .icon-btn { width: 34px !important; height: 34px !important; min-width: 34px; font-size: 15px !important; flex: 0 0 auto; }

    /* 전체화면: 1행 우측 아이콘 버튼 (글자는 숨김) */
    .bottom-right-bar {
        top: max(8px, env(safe-area-inset-top)) !important;
        bottom: auto !important;
        right: 8px !important;
        left: auto !important;
        z-index: 20;
    }
    .bottom-right-bar button,
    .bottom-right-bar .back-btn {
        padding: 6px 9px !important;
        font-size: 14px !important;
        gap: 4px !important;
        line-height: 1;
    }
    .bottom-right-bar #fullscreenText,
    .bottom-right-bar .fs-text { display: none !important; }

    /* 안내 문구 */
    .center-tooltip, #guide-tooltip {
        top: calc(max(8px, env(safe-area-inset-top)) + 88px) !important;
        left: 8px !important;
        right: 8px !important;
        transform: none !important;
        margin: 0 auto;
        width: auto !important;
        max-width: none !important;
        font-size: 11.5px !important;
        padding: 7px 12px !important;
        white-space: normal !important;
        line-height: 1.45;
        text-align: center;
        z-index: 15 !important;
    }

    /* 하단 컨트롤 바: 화면 폭 전체, 한 줄 유지 */
    .bottom-control-bar {
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        transform: none !important;
        width: 100% !important;
        border-radius: 18px 18px 0 0 !important;
        padding: 6px 6px calc(6px + env(safe-area-inset-bottom)) !important;
        gap: 2px !important;
        justify-content: space-around !important;
        flex-wrap: nowrap !important;
        overflow: visible;
    }
    .control-tab-btn {
        flex: 1 1 0 !important;
        min-width: 0 !important;
        padding: 5px 2px !important;
        font-size: 10.5px !important;
        gap: 1px !important;
        border-radius: 12px !important;
        white-space: nowrap !important;
        line-height: 1.15;
    }
    .control-tab-btn span { white-space: nowrap !important; }
    .control-tab-btn span:first-child { font-size: 15px !important; line-height: 1.1; }

    /* 슬라이더 등 서브 패널 */
    .sub-panel {
        left: 8px !important;
        right: 8px !important;
        bottom: calc(76px + env(safe-area-inset-bottom)) !important;
        transform: none !important;
        width: auto !important;
        max-width: none !important;
        max-height: 46vh;
        overflow-y: auto;
        padding: 13px 14px !important;
        gap: 10px !important;
        -webkit-overflow-scrolling: touch;
    }
    .sub-panel-title { font-size: 11px !important; }
    .slider-header { font-size: 11px !important; }
    .control-row { gap: 5px !important; flex-wrap: wrap; }
    .toggle-btn, .mode-btn, .quick-btn, .example-item, .preset-btn { font-size: 11px !important; }
    input[type="range"] { height: 22px; }

    /* 팝업(모달)이 화면을 넘지 않도록 */
    .modal-overlay { padding: 12px !important; align-items: center !important; }
    .modal-card {
        max-height: 88vh !important;
        overflow-y: auto !important;
        width: auto !important;
        max-width: 100% !important;
        padding: 16px !important;
        -webkit-overflow-scrolling: touch;
    }
    .modal-title { font-size: 15px !important; }
    .modal-body { font-size: 12px !important; }
    .example-title { font-size: 11.5px !important; }
    .example-desc { font-size: 11px !important; line-height: 1.5 !important; }
}

@media (max-width: 430px) {
    /* 아주 좁은 화면에서는 장식용 배지를 숨겨 제목 자리를 확보 */
    .tag-pill { display: none !important; }
}

/* ---------- 모바일 가로 (높이 500px 이하) ---------- */
@media (max-height: 500px) and (orientation: landscape) {
    .top-left-bar {
        top: max(6px, env(safe-area-inset-top)) !important;
        left: 6px !important;
        right: auto !important;
        max-width: 46vw;
        gap: 5px !important;
    }
    .top-left-bar .back-btn,
    .top-left-bar > a,
    .top-left-bar .tag-badge {
        padding: 4px 9px !important;
        font-size: 11px !important;
        height: 30px;
    }
    .tag-pill { display: none !important; }

    .top-right-bar {
        top: max(6px, env(safe-area-inset-top)) !important;
        right: 88px !important;
        left: auto !important;
        gap: 5px !important;
    }
    .data-card { padding: 4px 9px !important; gap: 9px !important; flex: 0 0 auto; }
    .data-label { font-size: 8.5px !important; }
    .data-value { font-size: 11.5px !important; }
    .icon-btn { width: 28px !important; height: 28px !important; min-width: 28px; font-size: 13px !important; }

    .bottom-right-bar {
        top: max(6px, env(safe-area-inset-top)) !important;
        bottom: auto !important;
        right: 6px !important;

    }
    .bottom-right-bar button,
    .bottom-right-bar .back-btn { padding: 4px 8px !important; font-size: 13px !important; }
    .bottom-right-bar #fullscreenText,
    .bottom-right-bar .fs-text { display: none !important; }

    .center-tooltip, #guide-tooltip {
        top: auto !important;
        bottom: 56px !important;
        left: 50% !important;
        right: auto !important;
        transform: translateX(-50%) !important;
        width: max-content !important;
        max-width: 44vw !important;
        font-size: 10px !important;
        padding: 4px 9px !important;
        line-height: 1.3;
    }

    /* 가로 모드에서 각종 패널을 구석으로 모아 3D 화면을 가리지 않게 한다 */
    .side-panel { top: 44px !important; right: 8px !important; left: auto !important; width: 214px !important; padding: 7px 9px !important; gap: 4px !important; }
    .side-title { font-size: 10.5px !important; }
    .side-scale { font-size: 8.5px !important; }
    .meter-panel { left: 8px !important; bottom: 40px !important; top: auto !important; width: 190px !important; padding: 6px 8px !important; gap: 3px !important; }

    .action-panel { top: auto !important; bottom: 40px !important; right: 8px !important; left: auto !important; grid-template-columns: repeat(2, 44px) !important; gap: 4px !important; }
    .side-btn { width: 44px !important; height: 44px !important; font-size: 8.5px !important; border-radius: 12px !important; gap: 1px !important; }
    .energy-panel { left: 8px !important; bottom: 40px !important; top: auto !important; width: 176px !important; padding: 6px 8px !important; gap: 4px !important; }
    .energy-title, .panel-note { font-size: 9px !important; line-height: 1.3 !important; }
    .info-panel { right: 8px !important; bottom: 40px !important; top: auto !important; min-width: 128px !important; padding: 6px 8px !important; gap: 2px !important; }
    .info-row { font-size: 9.5px !important; gap: 8px !important; }
    .view-panel { left: 8px !important; bottom: 40px !important; top: auto !important; padding: 6px 8px !important; }
    .phase-panel { left: 8px !important; bottom: 40px !important; top: auto !important; padding: 6px 8px !important; }
    .graph-panel { max-height: 40vh; width: 182px !important; }
    .legend, .panel-note { font-size: 9px !important; }

    .bottom-control-bar {
        left: 50% !important;
        right: auto !important;
        bottom: 4px !important;
        transform: translateX(-50%) !important;
        width: auto !important;
        max-width: calc(100vw - 12px);
        border-radius: 14px !important;
        padding: 4px 8px !important;
        gap: 3px !important;
    }
    .control-tab-btn {
        flex: 0 0 auto !important;
        min-width: 46px !important;

    }

    .sub-panel {

        max-height: 94vh !important;

        max-width: min(460px, 96vw) !important;
        padding: 12px 14px !important;

}

/* ---------- 몰입(의사 전체화면) 모드 ---------- */

html.pseudo-fs .center-tooltip,
html.pseudo-fs #guide-tooltip { display: none !important; }

html.pseudo-fs #fullscreenBtn,
html.pseudo-fs .bottom-right-bar { display: flex !important; }

body.is-fullscreen #webgl-container { width: 100vw !important; height: 100vh !important; }

    <!-- 우측 상단 데이터 패널 -->
    <div class="top-right-bar">
        <div class="glass-panel data-card">

    <div class="glass-panel center-tooltip" id="guide-tooltip">

            ※ 모둠 수/모둠 인원을 바꾸면 좌석이 새로 만들어집니다.<br>
            ※ 3D 화면에서 책상을 클릭하면 제거되고, 빈 자리(+)를 클릭하면 다시 생깁니다. 추첨 후에도 같은 방식으로 번호를 유지한 채 숨기고 복원할 수 있어요.

    <!-- 하단 제어 바 -->
    <div class="glass-panel bottom-control-bar">

    <!-- Fullscreen / Windowed Mode Button -->
    <div class="bottom-right-bar">
        <button id="fullscreenBtn" class="glass-panel back-btn">
            <span id="fullscreenIcon">⛶</span>
            <span id="fullscreenText">전체화면</span>

    <script>
        // --- 1. Three.js 기본 씬 & 카메라 & 렌더러 설정 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf2f2f7);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 11, -1);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 0, -3.5);

        // --- 2. 조명 설정 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
        dirLight.position.set(4, 10, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.left = -25;
        dirLight.shadow.camera.right = 25;
        dirLight.shadow.camera.top = 25;
        dirLight.shadow.camera.bottom = -25;
        scene.add(dirLight);

        // --- 3. 바닥 및 칠판 연출 (바닥 격자 없음) ---
        const floorGeo = new THREE.PlaneGeometry(120, 120);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xd7ccc8, roughness: 0.6 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.01;
        floor.receiveShadow = true;
        scene.add(floor);

        const boardGroup = new THREE.Group();
        const boardFrame = new THREE.Mesh(
            new THREE.BoxGeometry(7, 2.2, 0.1),
            new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.3 })
        );
        const boardSurface = new THREE.Mesh(
            new THREE.PlaneGeometry(6.8, 2.0),
            new THREE.MeshStandardMaterial({ color: 0x1e4620, roughness: 0.8 })
        );
        boardSurface.position.z = 0.055;
        boardGroup.add(boardFrame);
        boardGroup.add(boardSurface);

        const boardCanvas = document.createElement('canvas');
        boardCanvas.width = 1024;
        boardCanvas.height = 256;
        const bCtx = boardCanvas.getContext('2d');
        bCtx.fillStyle = '#ffffff';
        bCtx.font = 'bold 80px sans-serif';
        bCtx.textAlign = 'center';
        bCtx.fillText('칠 판 (정 면)', 512, 150);

        const boardTex = new THREE.CanvasTexture(boardCanvas);
        const boardTextMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(3.5, 0.875),
            new THREE.MeshBasicMaterial({ map: boardTex, transparent: true })
        );
        boardTextMesh.position.z = 0.06;
        boardGroup.add(boardTextMesh);

        boardGroup.position.set(0, 2.2, -6.5);
        scene.add(boardGroup);

        // --- 4. 모둠 책상 생성 모듈 ---
        let layoutObjs = [];   // 씬에 추가된 모든 오브젝트 (재생성 시 제거)
        let groupSlots = [];   // groupSlots[g] = [{active, deskGroup, ghost, numMesh, number, colorHex}, ...]
        let layoutInfo = { centerX: 0, centerZ: -3.5, width: 8, depth: 6 };
        let hasDrawn = false;  // 추첨을 한 번이라도 했는지
        let leftoverNums = []; // 좌석 부족으로 배정되지 못한 번호

        const legMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.5 });
        const chairMat = new THREE.MeshStandardMaterial({ color: 0x8d5b4c, roughness: 0.5 });

        function groupHue(g) {
            return (g * 0.618033988749895) % 1; // 황금비 기반으로 서로 구분되는 색상
        }

        function groupColorHex(g) {
            const c = new THREE.Color();
            c.setHSL(groupHue(g), 0.75, 0.52);
            return '#' + c.getHexString();
        }

        function createDeskMesh(topColor) {
            const group = new THREE.Group();

            const topMat = new THREE.MeshStandardMaterial({ color: topColor, roughness: 0.4 });
            const topMesh = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.05, 0.55), topMat);
            topMesh.position.y = 0.7;
            topMesh.castShadow = true;
            group.add(topMesh);

            const legGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.7, 16);
            const legPositions = [
                [-0.35, 0.35, -0.22], [0.35, 0.35, -0.22],
                [-0.35, 0.35, 0.22], [0.35, 0.35, 0.22]
            ];
            legPositions.forEach(pos => {
                const leg = new THREE.Mesh(legGeo, legMat);
                leg.position.set(...pos);
                leg.castShadow = true;
                group.add(leg);
            });

            const chairSeat = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.04, 0.42), chairMat);
            chairSeat.position.set(0, 0.42, 0.5);
            chairSeat.castShadow = true;
            group.add(chairSeat);

            const chairBack = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.35, 0.04), chairMat);
            chairBack.position.set(0, 0.62, 0.69);
            chairBack.castShadow = true;
            group.add(chairBack);

            return group;
        }

        // 책상을 가득 채우는 둥근 사각형 번호 텍스처 (모둠 색상)
        function createNumberTexture(num, colorHex) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 352;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = colorHex;
            const r = 40;
            ctx.beginPath();
            ctx.moveTo(10 + r, 10);
            ctx.lineTo(502 - r, 10);
            ctx.quadraticCurveTo(502, 10, 502, 10 + r);
            ctx.lineTo(502, 342 - r);
            ctx.quadraticCurveTo(502, 342, 502 - r, 342);
            ctx.lineTo(10 + r, 342);
            ctx.quadraticCurveTo(10, 342, 10, 342 - r);
            ctx.lineTo(10, 10 + r);
            ctx.quadraticCurveTo(10, 10, 10 + r, 10);
            ctx.fill();

            ctx.lineWidth = 14;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 180px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(num + '', 256, 176 + 12);

            return new THREE.CanvasTexture(canvas);
        }

        // 제거된 자리 표시용 텍스처 (점선 테두리 + '+')
        function createGhostTexture(colorHex) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 200;
            const ctx = canvas.getContext('2d');
            const r = 28;

            ctx.beginPath();
            ctx.moveTo(10 + r, 10);
            ctx.lineTo(246 - r, 10);
            ctx.quadraticCurveTo(246, 10, 246, 10 + r);
            ctx.lineTo(246, 190 - r);
            ctx.quadraticCurveTo(246, 190, 246 - r, 190);
            ctx.lineTo(10 + r, 190);
            ctx.quadraticCurveTo(10, 190, 10, 190 - r);
            ctx.lineTo(10, 10 + r);
            ctx.quadraticCurveTo(10, 10, 10 + r, 10);
            ctx.closePath();

            ctx.globalAlpha = 0.18;
            ctx.fillStyle = colorHex;
            ctx.fill();

            ctx.globalAlpha = 0.9;
            ctx.lineWidth = 8;
            ctx.strokeStyle = colorHex;
            ctx.setLineDash([18, 12]);
            ctx.stroke();

            ctx.setLineDash([]);
            ctx.fillStyle = colorHex;
            ctx.font = 'bold 110px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('+', 128, 104);

            return new THREE.CanvasTexture(canvas);
        }

        // 모둠 이름표 스프라이트
        function createGroupLabel(g, colorHex) {
            const canvas = document.createElement('canvas');
            canvas.width = 320;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            const r = 56;
            ctx.fillStyle = colorHex;
            ctx.beginPath();
            ctx.moveTo(10 + r, 10);
            ctx.lineTo(310 - r, 10);
            ctx.quadraticCurveTo(310, 10, 310, 10 + r);
            ctx.lineTo(310, 118 - r);
            ctx.quadraticCurveTo(310, 118, 310 - r, 118);
            ctx.lineTo(10 + r, 118);
            ctx.quadraticCurveTo(10, 118, 10, 118 - r);
            ctx.lineTo(10, 10 + r);
            ctx.quadraticCurveTo(10, 10, 10 + r, 10);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 60px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText((g + 1) + '모둠', 160, 68);

            const tex = new THREE.CanvasTexture(canvas);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
            sprite.scale.set(1.3, 0.52, 1);
            return sprite;
        }

        function clearLayout() {
            layoutObjs.forEach(o => scene.remove(o));
            layoutObjs = [];
            groupSlots = [];
        }

        function buildLayout(G, M) {
            clearLayout();

            const gCols = Math.min(G, Math.ceil(Math.sqrt(G * 1.6)));
            const gRows = Math.ceil(G / gCols);

            const deskCols = M >= 2 ? 2 : 1;
            const deskRows = Math.ceil(M / deskCols);
            const deskSpacingX = 0.95;
            const deskSpacingZ = 1.2;

            const clusterW = (deskCols - 1) * deskSpacingX + 0.8;
            const clusterD = (deskRows - 1) * deskSpacingZ + 0.55 + 0.5; // 의자 포함
            const spacingX = clusterW + 1.0;
            const spacingZ = clusterD + 1.0;

            const zFront = -3.6;

            for (let g = 0; g < G; g++) {
                const gc = g % gCols;
                const gr = Math.floor(g / gCols);
                const cx = (gc - (gCols - 1) / 2) * spacingX;
                const cz = zFront + gr * spacingZ;

                const hue = groupHue(g);
                const topColor = new THREE.Color().setHSL(hue, 0.55, 0.74);
                const colorHex = groupColorHex(g);
                const ghostTex = createGhostTexture(colorHex);

                // 모둠 바닥 영역 표시 (단색, 격자 아님)
                const area = new THREE.Mesh(
                    new THREE.PlaneGeometry(clusterW + 0.6, clusterD + 0.5),
                    new THREE.MeshBasicMaterial({ color: new THREE.Color(colorHex), transparent: true, opacity: 0.22 })
                );
                area.rotation.x = -Math.PI / 2;
                area.position.set(cx, 0.005, cz + (deskRows - 1) * deskSpacingZ / 2 + 0.15);
                scene.add(area);
                layoutObjs.push(area);

                // 모둠 이름표
                const label = createGroupLabel(g, colorHex);
                label.position.set(cx, 1.35, cz - 0.55);
                scene.add(label);
                layoutObjs.push(label);

                const slots = [];
                for (let k = 0; k < M; k++) {
                    const col = k % deskCols;
                    const row = Math.floor(k / deskCols);
                    const lx = (col - (deskCols - 1) / 2) * deskSpacingX;
                    const lz = row * deskSpacingZ;
                    const px = cx + lx;
                    const pz = cz + lz;

                    const deskGroup = createDeskMesh(topColor);
                    deskGroup.position.set(px, 0, pz);
                    scene.add(deskGroup);
                    layoutObjs.push(deskGroup);

                    // 제거된 자리를 클릭해서 되살릴 수 있도록 하는 표시 (평평한 + 패드)
                    const ghost = new THREE.Mesh(
                        new THREE.PlaneGeometry(0.95, 0.75),
                        new THREE.MeshBasicMaterial({ map: ghostTex, transparent: true, side: THREE.DoubleSide, depthWrite: false })
                    );
                    ghost.rotation.x = -Math.PI / 2;
                    ghost.position.set(px, 0.03, pz + 0.1);
                    ghost.visible = false;
                    scene.add(ghost);
                    layoutObjs.push(ghost);

                    const slot = { active: true, deskGroup, ghost, numMesh: null, number: null, colorHex, group: g };
                    deskGroup.userData.slot = slot;
                    ghost.userData.slot = slot;
                    slots.push(slot);
                }
                groupSlots.push(slots);
            }

            const totalW = (gCols - 1) * spacingX + clusterW + 0.6;
            const totalD = (gRows - 1) * spacingZ + clusterD + 0.5;
            layoutInfo = {
                centerX: 0,
                centerZ: zFront + (totalD - 1) / 2 - 0.2,
                width: totalW,
                depth: totalD
            };

            // 칠판 위치/크기 조정
            boardGroup.position.set(0, 2.2, zFront - 2.6);
            const sc = Math.max(1, totalW / 9);
            boardGroup.scale.set(sc, sc, 1);

            alignCamera();
        }

        function alignCamera() {
            const aspect = window.innerWidth / window.innerHeight;
            const tanHalf = Math.tan((45 / 2) * Math.PI / 180);
            const needDepth = ((layoutInfo.depth + 5) / 2) / tanHalf;
            const needWidth = ((layoutInfo.width + 3) / 2) / (tanHalf * aspect);
            const h = Math.max(8, needDepth, needWidth);
            const tz = layoutInfo.centerZ;
            camera.position.set(layoutInfo.centerX, h, tz + h * 0.14);
            controls.target.set(layoutInfo.centerX, 0, tz - 0.4);
            controls.update();
        }

        // --- 5. 입력값 처리 ---
        const elGroups = document.getElementById('input-groups');
        const elMembers = document.getElementById('input-members');
        const elTotal = document.getElementById('input-total');
        const elExclude = document.getElementById('input-exclude-nums');
        const tooltip = document.getElementById('guide-tooltip');
        const GUIDE_TEXT = "💡 좌석(또는 빈 자리)을 클릭하면 제거/추가됩니다 | 모둠 구성을 맞춘 뒤 '🎲 모둠 추첨'을 눌러 주세요";

        function clampInt(v, min, max, def) {
            let n = parseInt(v);
            if (isNaN(n)) n = def;
            return Math.max(min, Math.min(max, n));
        }

        function readSettings() {
            const G = clampInt(elGroups.value, 1, 20, 7);
            const M = clampInt(elMembers.value, 1, 12, 4);
            const N = clampInt(elTotal.value, 1, 200, G * M);
            elGroups.value = G;
            elMembers.value = M;
            elTotal.value = N;

            const excludeNums = elExclude.value
                .split(/[\s,]+/)
                .map(n => parseInt(n.trim()))
                .filter(n => !isNaN(n));

            const pool = [];
            for (let i = 1; i <= N; i++) {
                if (!excludeNums.includes(i)) pool.push(i);
            }
            return { G, M, N, pool, excludeNums };
        }

        function showTip(msg, autoHide) {
            tooltip.innerText = msg;
            tooltip.style.opacity = '1';
            clearTimeout(showTip._t);
            if (autoHide) {
                showTip._t = setTimeout(() => { tooltip.style.opacity = '0'; }, autoHide);
            }
        }

        // 상단 정보 + 결과표를 현재 상태에 맞게 갱신
        function updateCounts() {
            const s = readSettings();
            let activeSeats = 0;
            let assigned = 0;
            groupSlots.forEach(slots => {
                slots.forEach(slot => {
                    if (slot.active) {
                        activeSeats++;
                        if (slot.number !== null) assigned++;
                    }
                });
            });
            document.getElementById('val-groups').innerText = groupSlots.length + '모둠';
            document.getElementById('val-seats').innerText = activeSeats + '석';
            document.getElementById('val-total').innerText = s.pool.length + '명';
            document.getElementById('val-assigned').innerText = assigned + '명';
            if (hasDrawn) refreshResult();
        }

        function rebuildFromInputs() {
            if (isDrawing) return;
            const s = readSettings();
            hasDrawn = false;
            leftoverNums = [];
            buildLayout(s.G, s.M);
            hideResultPanel();
            document.getElementById('result-list').innerHTML = '';
            updateCounts();
        }

        function hideResultPanel() {
            document.getElementById('result-panel').classList.remove('show');
            document.getElementById('btn-result').classList.remove('active');
        }

        // --- 6. 좌석 클릭 (제거 / 복원) ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let downInfo = null;

        function findSlot(obj) {
            let o = obj;
            while (o) {
                if (o.userData && o.userData.slot) return o.userData.slot;
                o = o.parent;
            }
            return null;
        }

        function toggleSeat(slot) {
            slot.active = !slot.active;
            slot.deskGroup.visible = slot.active;
            slot.ghost.visible = !slot.active;

            // 번호는 그대로 유지. 복원될 때 번호가 다시 톡 나타나도록 애니메이션만 초기화
            if (slot.active && slot.numMesh) {
                slot.numMesh.scale.set(0.01, 0.01, 0.01);
            }
            updateCounts();
        }

        function handleSeatClick(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const targets = [];
            groupSlots.forEach(slots => {
                slots.forEach(slot => {
                    targets.push(slot.active ? slot.deskGroup : slot.ghost);
                });
            });

            const hits = raycaster.intersectObjects(targets, true);
            if (hits.length > 0) {
                const slot = findSlot(hits[0].object);
                if (slot) toggleSeat(slot);
            }
        }

        // 드래그(화면 회전)와 클릭을 구분하기 위해 pointerup 시점에 판정
        renderer.domElement.addEventListener('pointerdown', (e) => {
            downInfo = { x: e.clientX, y: e.clientY, t: performance.now() };
        });
        renderer.domElement.addEventListener('pointerup', (e) => {
            if (!downInfo || isDrawing) { downInfo = null; return; }
            const moved = Math.hypot(e.clientX - downInfo.x, e.clientY - downInfo.y);
            const elapsed = performance.now() - downInfo.t;
            downInfo = null;
            if (moved < 6 && elapsed < 600) handleSeatClick(e);
        });

        // --- 7. 카운트다운 및 모둠 추첨 ---
        let isDrawing = false;

        function drawGroups() {
            if (isDrawing) return;

            const s = readSettings();
            const activeSlots = [];
            groupSlots.forEach(slots => slots.forEach(slot => { if (slot.active) activeSlots.push(slot); }));

            if (s.pool.length === 0) {
                showTip('⚠️ 배정할 번호가 없습니다. 전체 번호 수/제외 번호를 확인해 주세요.', 3500);
                return;
            }
            if (activeSlots.length === 0) {
                showTip('⚠️ 활성 좌석이 없습니다. 빈 자리(+)를 눌러 좌석을 만들어 주세요.', 3500);
                return;
            }

            isDrawing = true;
            document.getElementById('btn-draw').disabled = true;

            const overlay = document.getElementById('countdown-overlay');
            const cdText = document.getElementById('countdown-text');
            overlay.style.display = 'flex';

            let count = 3;
            cdText.innerText = count;

            cdText.classList.remove('pop-anim');
            void cdText.offsetWidth;
            cdText.classList.add('pop-anim');

            const interval = setInterval(() => {
                count--;
                if (count > 0) {
                    cdText.innerText = count;
                    cdText.classList.remove('pop-anim');
                    void cdText.offsetWidth;
                    cdText.classList.add('pop-anim');
                } else {
                    clearInterval(interval);
                    overlay.style.display = 'none';
                    executeDraw(s);
                    document.getElementById('btn-draw').disabled = false;
                    isDrawing = false;
                }
            }, 1000);
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function clearNumbers() {
            groupSlots.forEach(slots => {
                slots.forEach(slot => {
                    if (slot.numMesh) {
                        slot.deskGroup.remove(slot.numMesh);
                        slot.numMesh = null;
                    }
                    slot.number = null;
                });
            });
        }

        function executeDraw(s) {
            // 이전 번호 제거
            clearNumbers();

            const numbers = shuffleArray(s.pool.slice());

            // 현재 활성 좌석만 대상 (좌석 순서도 섞어서 빈 좌석이 특정 모둠에 몰리지 않게)
            const activeSlots = [];
            groupSlots.forEach(slots => slots.forEach(slot => { if (slot.active) activeSlots.push(slot); }));
            shuffleArray(activeSlots);

            const assignCount = Math.min(numbers.length, activeSlots.length);

            for (let i = 0; i < assignCount; i++) {
                const slot = activeSlots[i];
                const num = numbers[i];
                slot.number = num;

                const tex = createNumberTexture(num, slot.colorHex);
                const numMesh = new THREE.Mesh(
                    new THREE.PlaneGeometry(0.75, 0.50),
                    new THREE.MeshBasicMaterial({ map: tex, transparent: true })
                );
                numMesh.rotation.x = -Math.PI / 2;
                numMesh.position.set(0, 0.73, 0);
                numMesh.scale.set(0.01, 0.01, 0.01);

                slot.deskGroup.add(numMesh);
                slot.numMesh = numMesh;
            }

            leftoverNums = numbers.slice(assignCount).sort((a, b) => a - b);
            hasDrawn = true;

            updateCounts();

            const panel = document.getElementById('result-panel');
            panel.classList.add('show');
            document.getElementById('btn-result').classList.add('active');

            if (leftoverNums.length > 0) {
                showTip('⚠️ 좌석이 부족해 ' + leftoverNums.length + '명(' + leftoverNums.join(', ') + ')은 배정되지 않았어요. 빈 자리(+)를 눌러 좌석을 늘린 뒤 다시 추첨해 주세요.', 7000);
            } else if (activeSlots.length > numbers.length) {
                showTip('ℹ️ 좌석이 ' + (activeSlots.length - numbers.length) + '개 남아 번호 없는 빈 좌석이 생겼어요.', 5000);
            } else {
                tooltip.style.opacity = '0';
            }
        }

        // 결과표: 현재 좌석 상태를 반영 (제거된 좌석의 번호는 취소선으로 표시)
        function refreshResult() {
            const list = document.getElementById('result-list');
            list.innerHTML = '';

            groupSlots.forEach((slots, g) => {
                const withNum = slots.filter(sl => sl.number !== null).sort((a, b) => a.number - b.number);
                const activeCnt = withNum.filter(sl => sl.active).length;

                const row = document.createElement('div');
                row.className = 'group-row';

                const name = document.createElement('div');
                name.className = 'group-name';
                const dot = document.createElement('span');
                dot.className = 'group-dot';
                dot.style.background = groupColorHex(g);
                name.appendChild(dot);
                name.appendChild(document.createTextNode((g + 1) + '모둠 (' + activeCnt + '명)'));

                const nums = document.createElement('div');
                nums.className = 'group-nums';
                if (withNum.length === 0) {
                    nums.innerText = '-';
                } else {
                    withNum.forEach((sl, idx) => {
                        const sp = document.createElement('span');
                        sp.innerText = sl.number;
                        if (!sl.active) sp.className = 'num-removed';
                        nums.appendChild(sp);
                        if (idx < withNum.length - 1) nums.appendChild(document.createTextNode(', '));
                    });
                }

                row.appendChild(name);
                row.appendChild(nums);
                list.appendChild(row);
            });

            if (leftoverNums.length > 0) {
                const row = document.createElement('div');
                row.className = 'group-row';
                const name = document.createElement('div');
                name.className = 'group-name';
                name.innerText = '⚠️ 미배정 (' + leftoverNums.length + '명)';
                const nums = document.createElement('div');
                nums.className = 'group-nums';
                nums.innerText = leftoverNums.join(', ');
                row.appendChild(name);
                row.appendChild(nums);
                list.appendChild(row);
            }
        }

        // 초기화: 번호를 지우고 모든 좌석을 복원
        function resetGroups() {
            if (isDrawing) return;
            clearNumbers();
            groupSlots.forEach(slots => {
                slots.forEach(slot => {
                    slot.active = true;
                    slot.deskGroup.visible = true;
                    slot.ghost.visible = false;
                });
            });
            hasDrawn = false;
            leftoverNums = [];
            hideResultPanel();
            document.getElementById('result-list').innerHTML = '';
            updateCounts();
            showTip(GUIDE_TEXT);
        }

        // --- 8. UI 제어 및 이벤트 ---
        document.getElementById('btn-draw').addEventListener('click', drawGroups);
        document.getElementById('btn-reset').addEventListener('click', resetGroups);

        const btnToggleConfig = document.getElementById('btn-toggle-config');
        const configPanel = document.getElementById('config-panel');
        btnToggleConfig.addEventListener('click', () => {
            configPanel.classList.toggle('show');
            btnToggleConfig.classList.toggle('active');
        });

        const btnResult = document.getElementById('btn-result');
        const resultPanel = document.getElementById('result-panel');
        btnResult.addEventListener('click', () => {
            if (!hasDrawn) {
                showTip('아직 추첨 결과가 없습니다. 먼저 모둠 추첨을 해 주세요.', 2500);
                return;
            }
            resultPanel.classList.toggle('show');
            btnResult.classList.toggle('active');
        });

        // 모둠 수 / 모둠 인원 변경 → 좌석 새로 구성
        [elGroups, elMembers].forEach(el => {
            el.addEventListener('change', rebuildFromInputs);
        });
        // 전체 번호 수 / 제외 번호 변경 → 좌석 구성은 유지하고 정보만 갱신
        [elTotal, elExclude].forEach(el => {
            el.addEventListener('change', updateCounts);
        });

        document.getElementById('btn-align').addEventListener('click', alignCamera);

        document.getElementById('theme-toggle').addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            scene.background.setHex(isDark ? 0x121212 : 0xf2f2f7);
            floorMat.color.setHex(isDark ? 0x2c2c2e : 0xd7ccc8);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 초기 구성
        rebuildFromInputs();

        // --- 9. 애니메이션 루프 ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            groupSlots.forEach(slots => {
                slots.forEach(slot => {
                    if (slot.numMesh && slot.numMesh.scale.x < 0.999) {
                        slot.numMesh.scale.lerp(new THREE.Vector3(1, 1, 1), 0.15);
                    }
                });
            });

            renderer.render(scene, camera);
        }

        animate();
    
        /* ---------- Fullscreen / Windowed Mode Logic ---------- */
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const fullscreenIcon = document.getElementById('fullscreenIcon');
        const fullscreenText = document.getElementById('fullscreenText');

        function updateFullscreenUI() {
            const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
            if (fullscreenIcon) fullscreenIcon.innerText = isFS ? '🗗' : '⛶';
            if (fullscreenText) fullscreenText.innerText = isFS ? '창모드' : '전체화면';
        }

        if (fullscreenBtn) {
            fullscreenBtn.addEventListener('click', () => {
                try {
                    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                        const req = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
                        if (req) req.call(document.documentElement);
                    } else {
                        const exit = document.exitFullscreen || document.webkitExitFullscreen;
                        if (exit) exit.call(document);
                    }
                } catch (err) {
                    console.error('전체화면 모드를 전환할 수 없습니다:', err);
                }
            });
        }

        document.addEventListener('fullscreenchange', updateFullscreenUI);
        document.addEventListener('webkitfullscreenchange', updateFullscreenUI);
    </script>

<script>
/* ============ 모바일 화면 재조정 + 전체화면 대체 동작 (자동 생성) ============ */
(function () {
    var docEl = document.documentElement;
    var btn = document.getElementById('fullscreenBtn');
    var icon = document.getElementById('fullscreenIcon');
    var text = document.getElementById('fullscreenText');

    function realFs() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement ||
                  document.mozFullScreenElement || document.msFullscreenElement);
    }
    function pseudo() { return docEl.classList.contains('pseudo-fs'); }
    function setUI() {
        var on = realFs() || pseudo();
        if (icon) icon.textContent = on ? '🗗' : '⛶';
        if (text) text.textContent = on ? '창모드' : '전체화면';
        if (btn) btn.setAttribute('aria-label', on ? '창모드로 전환' : '전체화면으로 전환');
        document.body.classList.toggle('is-fullscreen', on);
    }
    function toast(msg) {
        var t = document.getElementById('ux-toast');
        if (!t) {
            t = document.createElement('div');
            t.id = 'ux-toast';
            t.style.cssText = 'position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);' +
                'background:rgba(28,28,30,.88);color:#fff;font-size:12px;line-height:1.4;padding:9px 14px;border-radius:14px;' +
                'z-index:9999;max-width:86vw;text-align:center;pointer-events:none;transition:opacity .3s;' +
                'font-family:inherit;box-shadow:0 8px 24px rgba(0,0,0,.25)';
            document.body.appendChild(t);
        }
        t.textContent = msg;
        t.style.opacity = '1';
        clearTimeout(t._t);
        t._t = setTimeout(function () { t.style.opacity = '0'; }, 2600);
    }

    if (btn) {
        btn.addEventListener('click', function () {
            var wasReal = realFs();
            var wasPseudo = pseudo();
            setTimeout(function () {
                if (wasReal) { setUI(); return; }          // 진짜 전체화면에서 나온 경우
                if (wasPseudo) { docEl.classList.remove('pseudo-fs'); setUI(); return; }  // 몰입 모드 해제
                if (!realFs()) {                            // 전체화면 API가 동작하지 않는 환경
                    docEl.classList.add('pseudo-fs');
                    try { window.scrollTo(0, 1); } catch (e) {}
                    toast('이 브라우저는 전체화면을 지원하지 않아 상단 정보를 숨긴 몰입 모드로 표시합니다');
                }
                setUI();
            }, 380);
        }, false);
    }
    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
        document.addEventListener(ev, setUI);
    });

    /* 좁은 화면에서는 3D 장면이 잘리지 않도록 시야각을 넓혀 전체가 들어오게 한다 */
    function mobileFit() {
        try {
            if (typeof camera === 'undefined' || !camera || !camera.isPerspectiveCamera) return;
            if (!camera.userData) camera.userData = {};
            if (!camera.userData.baseFov) camera.userData.baseFov = camera.fov;
            var w = window.innerWidth, h = window.innerHeight, f = 1;
            var k = 0.62;
            var attr = document.documentElement.getAttribute('data-mzoom');
            if (attr) { var v = parseFloat(attr); if (!isNaN(v) && v > 0) k = v; }
            if (w < h) f = 1 + (1 - w / h) * k;
            else if (h <= 500) f = 1 + k * 0.16;
            camera.fov = Math.min(88, camera.userData.baseFov * f);
            camera.updateProjectionMatrix();
        } catch (e) {}
    }
    mobileFit();

    /* 화면 회전·주소창 변화·전체화면 전환 후 렌더러 크기 재계산 */
    var rt = null;
    function refit() {
        clearTimeout(rt);
        rt = setTimeout(function () {
            mobileFit();
            try { window.dispatchEvent(new Event('resize')); } catch (e) {}
        }, 240);
    }
    window.addEventListener('orientationchange', refit);
    window.addEventListener('pageshow', refit);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) refit(); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', refit);

    setUI();
})();
</script>
