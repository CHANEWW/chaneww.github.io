<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>행운의 추첨기 3D</title>
    <!-- Three.js 및 OrbitControls 라이브러리 -->
    <script src="../common/lib/three.min.js"></script>
    <script src="../common/lib/OrbitControls.js"></script>
    <style>
        @font-face {
            font-family: 'SeoulNamsan';
            src: local('SeoulNamsan M'), local('SeoulNamsanM'), local('서울남산체 M'),
                 url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'SeoulNamsan', -apple-system, sans-serif;
            background-color: #f2f2f7;
            color: #1c1c1e;
            touch-action: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            touch-action: none;
        }

        /* Apple visionOS Glassmorphic UI */
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            z-index: 10;
        }

        a.glass-panel {
            text-decoration: none;
            color: inherit;
            transition: background 0.2s;
        }
        
        a.glass-panel:hover {
            background: rgba(255, 255, 255, 0.9);
        }

        .top-left-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .tag-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
        }

        .tag-pill {
            background: rgba(255, 59, 48, 0.15);
            color: #ff3b30;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
        }

        .top-right-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .data-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 20px;
        }

        .data-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .data-label {
            font-size: 11px;
            color: #8e8e93;
            font-weight: bold;
        }

        .data-value {
            font-size: 15px;
            font-weight: bold;
            color: #1c1c1e;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            transition: all 0.2s;
        }

        .center-tooltip {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 22px;
            font-size: 14px;
            font-weight: bold;
            color: #1c1c1e;
            border-radius: 30px;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.5s ease;
            text-align: center;
        }

        .bottom-control-bar {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            z-index: 10;
        }

        .control-tab-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 18px;
            min-width: 80px;
            border-radius: 14px;
            border: none;
            background: transparent;
            color: #1c1c1e;
            font-size: 13px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-tab-btn.active, .control-tab-btn.primary {
            background: #ff3b30;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(255, 59, 48, 0.3);
        }
        
        .control-tab-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 서브 패널 (설정) */
        .sub-panel {
            position: absolute;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            padding: 20px;
            width: 320px;
            display: none;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .sub-panel.show { display: flex; }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: bold;
        }

        input[type="number"], input[type="text"] {
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid #c7c7cc;
            font-size: 13px;
            text-align: center;
            outline: none;
            background: rgba(255, 255, 255, 0.8);
            font-family: inherit;
        }

        input[type="number"] { width: 70px; }
        input[type="text"] { width: 140px; }

        .divider {
            height: 1px;
            background: rgba(0,0,0,0.1);
            margin: 4px 0;
        }

        body.dark-mode {
            background-color: #121212;
            color: #f2f2f7;
        }

        body.dark-mode .glass-panel {
            background: rgba(30, 30, 30, 0.75);
            border-color: rgba(255, 255, 255, 0.15);
            color: #f2f2f7;
        }

        body.dark-mode a.glass-panel:hover {
            background: rgba(50, 50, 50, 0.9);
        }

        body.dark-mode .data-value, body.dark-mode .center-tooltip {
            color: #f2f2f7;
        }

        body.dark-mode input[type="number"], body.dark-mode input[type="text"] {
            background: rgba(50, 50, 50, 0.8);
            color: #fff;
            border-color: #555;
        }
    
        /* Bottom Right Bar (Fullscreen) */
        .bottom-right-bar {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }
        button.back-btn, button.tag-badge {
            font-family: inherit;
            border: none;
        }
        @media (max-width: 768px) {
            .bottom-right-bar {
                bottom: 15px;
                right: 15px;
            }
        }
    













/* @@MOBILE-BASE v1@@ */
/* ============================================================
   모바일 반응형 보정 (세로/가로) — 자동 생성 블록
   ============================================================ */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
img, canvas { max-width: 100%; }

/* ---------- 모바일 세로 (폭 900px 이하) ---------- */
@media (max-width: 900px) {
    /* 1행: [메인][제목]  ...  [전체화면 아이콘] */
    .top-left-bar {
        top: max(8px, env(safe-area-inset-top)) !important;
        left: 8px !important;
        right: 56px !important;
        gap: 6px !important;
        flex-wrap: nowrap !important;
        align-items: center !important;
        overflow: hidden;
    }
    .top-left-bar .back-btn,
    .top-left-bar > a {
        flex: 0 0 auto;
        padding: 6px 10px !important;
        font-size: 12px !important;
        gap: 4px !important;
        white-space: nowrap;
    }
    .top-left-bar .tag-badge {
        flex: 0 1 auto;
        min-width: 0;
        padding: 6px 10px !important;
        font-size: 12px !important;
        gap: 5px !important;
        white-space: nowrap;
        overflow: hidden;
    }
    .top-left-bar .tag-badge > span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .tag-pill { font-size: 9px !important; padding: 1px 6px !important; flex: 0 0 auto; }

    /* 2행: [데이터 카드 .............][테마] */
    .top-right-bar {
        top: calc(max(8px, env(safe-area-inset-top)) + 40px) !important;
        left: 8px !important;
        right: 8px !important;
        gap: 6px !important;
        justify-content: flex-end !important;
        flex-wrap: nowrap !important;
    }
    .data-card {
        flex: 1 1 0%;
        min-width: 0;
        gap: 4px !important;
        padding: 6px 8px !important;
        justify-content: space-around !important;
        overflow: hidden;
    }
    .data-card { flex-direction: row !important; align-items: center !important; flex-wrap: nowrap !important; }
    .data-item { min-width: 0; flex-direction: column !important; align-items: center !important; gap: 0 !important; }
    .data-item > * { white-space: nowrap; }
    .voltmeter-display { font-size: 24px !important; }
    .data-label { font-size: 9px !important; white-space: nowrap; line-height: 1.2; }
    .data-value { font-size: 12.5px !important; white-space: nowrap; line-height: 1.25; }
    .icon-btn { width: 34px !important; height: 34px !important; min-width: 34px; font-size: 15px !important; flex: 0 0 auto; }

    /* 전체화면: 1행 우측 아이콘 버튼 (글자는 숨김) */
    .bottom-right-bar {
        top: max(8px, env(safe-area-inset-top)) !important;
        bottom: auto !important;
        right: 8px !important;
        left: auto !important;
        z-index: 20;
    }
    .bottom-right-bar button,
    .bottom-right-bar .back-btn {
        padding: 6px 9px !important;
        font-size: 14px !important;
        gap: 4px !important;
        line-height: 1;
    }
    .bottom-right-bar #fullscreenText,
    .bottom-right-bar .fs-text { display: none !important; }

    /* 안내 문구 */
    .center-tooltip, #guide-tooltip {
        top: calc(max(8px, env(safe-area-inset-top)) + 88px) !important;
        left: 8px !important;
        right: 8px !important;
        transform: none !important;
        margin: 0 auto;
        width: auto !important;
        max-width: none !important;
        font-size: 11.5px !important;
        padding: 7px 12px !important;
        white-space: normal !important;
        line-height: 1.45;
        text-align: center;
        z-index: 15 !important;
    }

    /* 하단 컨트롤 바: 화면 폭 전체, 한 줄 유지 */
    .bottom-control-bar {
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        transform: none !important;
        width: 100% !important;
        border-radius: 18px 18px 0 0 !important;
        padding: 6px 6px calc(6px + env(safe-area-inset-bottom)) !important;
        gap: 2px !important;
        justify-content: space-around !important;
        flex-wrap: nowrap !important;
        overflow: visible;
    }
    .control-tab-btn {
        flex: 1 1 0 !important;
        min-width: 0 !important;
        padding: 5px 2px !important;
        font-size: 10.5px !important;
        gap: 1px !important;
        border-radius: 12px !important;
        white-space: nowrap !important;
        line-height: 1.15;
    }
    .control-tab-btn span { white-space: nowrap !important; }
    .control-tab-btn span:first-child { font-size: 15px !important; line-height: 1.1; }

    /* 슬라이더 등 서브 패널 */
    .sub-panel {
        left: 8px !important;
        right: 8px !important;
        bottom: calc(76px + env(safe-area-inset-bottom)) !important;
        transform: none !important;
        width: auto !important;
        max-width: none !important;
        max-height: 46vh;
        overflow-y: auto;
        padding: 13px 14px !important;
        gap: 10px !important;
        -webkit-overflow-scrolling: touch;
    }
    .sub-panel-title { font-size: 11px !important; }
    .slider-header { font-size: 11px !important; }
    .control-row { gap: 5px !important; flex-wrap: wrap; }
    .toggle-btn, .mode-btn, .quick-btn, .example-item, .preset-btn { font-size: 11px !important; }
    input[type="range"] { height: 22px; }

    /* 팝업(모달)이 화면을 넘지 않도록 */
    .modal-overlay { padding: 12px !important; align-items: center !important; }
    .modal-card {
        max-height: 88vh !important;
        overflow-y: auto !important;
        width: auto !important;
        max-width: 100% !important;
        padding: 16px !important;
        -webkit-overflow-scrolling: touch;
    }
    .modal-title { font-size: 15px !important; }
    .modal-body { font-size: 12px !important; }
    .example-title { font-size: 11.5px !important; }
    .example-desc { font-size: 11px !important; line-height: 1.5 !important; }
}

@media (max-width: 430px) {
    /* 아주 좁은 화면에서는 장식용 배지를 숨겨 제목 자리를 확보 */
    .tag-pill { display: none !important; }
}

/* ---------- 모바일 가로 (높이 500px 이하) ---------- */
@media (max-height: 500px) and (orientation: landscape) {
    .top-left-bar {
        top: max(6px, env(safe-area-inset-top)) !important;
        left: 6px !important;
        right: auto !important;
        max-width: 46vw;
        gap: 5px !important;
    }
    .top-left-bar .back-btn,
    .top-left-bar > a,
    .top-left-bar .tag-badge {
        padding: 4px 9px !important;
        font-size: 11px !important;
        height: 30px;
    }
    .tag-pill { display: none !important; }

    .top-right-bar {
        top: max(6px, env(safe-area-inset-top)) !important;
        right: 88px !important;
        left: auto !important;
        gap: 5px !important;
    }
    .data-card { padding: 4px 9px !important; gap: 9px !important; flex: 0 0 auto; }
    .data-label { font-size: 8.5px !important; }
    .data-value { font-size: 11.5px !important; }
    .icon-btn { width: 28px !important; height: 28px !important; min-width: 28px; font-size: 13px !important; }

    .bottom-right-bar {
        top: max(6px, env(safe-area-inset-top)) !important;
        bottom: auto !important;
        right: 6px !important;
        z-index: 20;
    }
    .bottom-right-bar button,
    .bottom-right-bar .back-btn { padding: 4px 8px !important; font-size: 13px !important; }
    .bottom-right-bar #fullscreenText,
    .bottom-right-bar .fs-text { display: none !important; }

    .center-tooltip, #guide-tooltip {
        top: auto !important;
        bottom: 56px !important;
        left: 50% !important;
        right: auto !important;
        transform: translateX(-50%) !important;
        width: max-content !important;
        max-width: 44vw !important;
        font-size: 10px !important;
        padding: 4px 9px !important;
        line-height: 1.3;
    }

    /* 가로 모드에서 각종 패널을 구석으로 모아 3D 화면을 가리지 않게 한다 */
    .side-panel { top: 44px !important; right: 8px !important; left: auto !important; width: 214px !important; padding: 7px 9px !important; gap: 4px !important; }
    .side-title { font-size: 10.5px !important; }
    .side-scale { font-size: 8.5px !important; }
    .meter-panel { left: 8px !important; bottom: 40px !important; top: auto !important; width: 190px !important; padding: 6px 8px !important; gap: 3px !important; }
    .meter-title { font-size: 9.5px !important; }
    .action-panel { top: auto !important; bottom: 40px !important; right: 8px !important; left: auto !important; grid-template-columns: repeat(2, 44px) !important; gap: 4px !important; }
    .side-btn { width: 44px !important; height: 44px !important; font-size: 8.5px !important; border-radius: 12px !important; gap: 1px !important; }
    .energy-panel { left: 8px !important; bottom: 40px !important; top: auto !important; width: 176px !important; padding: 6px 8px !important; gap: 4px !important; }
    .energy-title, .panel-note { font-size: 9px !important; line-height: 1.3 !important; }
    .info-panel { right: 8px !important; bottom: 40px !important; top: auto !important; min-width: 128px !important; padding: 6px 8px !important; gap: 2px !important; }
    .info-row { font-size: 9.5px !important; gap: 8px !important; }
    .view-panel { left: 8px !important; bottom: 40px !important; top: auto !important; padding: 6px 8px !important; }
    .phase-panel { left: 8px !important; bottom: 40px !important; top: auto !important; padding: 6px 8px !important; }
    .graph-panel { max-height: 40vh; width: 182px !important; }
    .legend, .panel-note { font-size: 9px !important; }

    .bottom-control-bar {
        left: 50% !important;
        right: auto !important;
        bottom: 4px !important;
        transform: translateX(-50%) !important;
        width: auto !important;
        max-width: calc(100vw - 12px);
        border-radius: 14px !important;
        padding: 4px 8px !important;
        gap: 3px !important;
    }
    .control-tab-btn {
        flex: 0 0 auto !important;
        min-width: 46px !important;
        padding: 3px 9px !important;
        font-size: 10px !important;
        gap: 3px !important;
        align-items: center !important;
        justify-content: center !important;
    }
    .control-tab-btn span:first-child { font-size: 13px !important; }

    .sub-panel {
        left: 50% !important;
        right: auto !important;
        bottom: 96px !important;
        transform: translateX(-50%) !important;
        width: min(400px, calc(100vw - 24px)) !important;
        max-width: min(400px, calc(100vw - 24px)) !important;
        max-height: 62vh;
        overflow-y: auto;
        padding: 9px 12px !important;
        gap: 6px !important;
    }
    .sub-panel .slider-row { gap: 3px !important; }
    .slider-header { font-size: 10.5px !important; }

    .modal-overlay { padding: 8px !important; }
    .modal-card {
        max-height: 94vh !important;
        overflow-y: auto !important;
        width: auto !important;
        max-width: min(460px, 96vw) !important;
        padding: 12px 14px !important;
    }
    .modal-title { font-size: 14px !important; }
    .modal-body { font-size: 11.5px !important; }
    .example-desc { font-size: 11px !important; line-height: 1.45 !important; }
}

/* ---------- 몰입(의사 전체화면) 모드 ---------- */
html.pseudo-fs .top-left-bar .tag-badge,
html.pseudo-fs .top-right-bar,
html.pseudo-fs .center-tooltip,
html.pseudo-fs #guide-tooltip { display: none !important; }
html.pseudo-fs .top-left-bar { right: 56px !important; }
html.pseudo-fs #fullscreenBtn,
html.pseudo-fs .bottom-right-bar { display: flex !important; }

/* ---------- 전체화면 시 캔버스 채움 ---------- */
body.is-fullscreen #canvas-container,
body.is-fullscreen #webgl-container { width: 100vw !important; height: 100vh !important; }

<body>

    <div id="canvas-container"></div>

    <!-- 좌측 상단 헤더 -->
    <div class="top-left-bar">
        <!-- 메인으로 돌아가기 버튼 -->
        <a href="/index.html" class="glass-panel tag-badge">
            ⬅ 메인
        </a>
        <div class="glass-panel tag-badge">
            <span>행운의 추첨기 3D</span>
            <span class="tag-pill">visionOS</span>
        </div>
        <button class="glass-panel back-btn qr-btn" id="qrBtn" type="button" title="QR 코드" aria-label="QR 코드 보기"><span class="qr-btn-icon" aria-hidden="true">📱</span> <span class="qr-btn-label">QRcode</span></button>
    </div>

    <!-- 우측 상단 데이터 패널 -->
    <div class="top-right-bar">
        <div class="glass-panel data-card">
            <div class="data-item">
                <span class="data-label">참가 인원</span>
                <span class="data-value" id="val-total">30명</span>
            </div>
            <div class="data-item">
                <span class="data-label">뽑힌 인원</span>
                <span class="data-value" id="val-drawn" style="color:#ff3b30;">0명</span>
            </div>
        </div>
        <button class="icon-btn glass-panel" id="theme-toggle">🌙</button>
    </div>

    <!-- 중앙 안내 툴팁 -->
    <div class="glass-panel center-tooltip" id="guide-tooltip">
        🎯 3D 뷰포트를 드래그해 보세요! <br><span style="font-size:12px; color:#8e8e93; font-weight:normal;">(하단의 '추첨 시작'을 누르면 구슬이 섞입니다)</span>
    </div>

    <!-- 서브 설정 패널 -->
    <div class="glass-panel sub-panel" id="config-panel">
        <div class="control-row">
            <span>총 참가 인원 (1~100)</span>
            <input type="number" id="input-total" min="2" max="100" value="30">
        </div>
        <div class="control-row">
            <span>한 번에 뽑을 인원</span>
            <input type="number" id="input-pick-count" min="1" max="10" value="1">
        </div>
        <div class="divider"></div>
        <div class="control-row">
            <span>결석/제외 번호 (쉼표 구분)</span>
            <input type="text" id="input-exclude" placeholder="예: 4, 13, 24">
        </div>
        <button id="btn-apply-settings" style="margin-top:5px; padding:8px; border-radius:10px; border:none; background:#1c1c1e; color:#fff; font-weight:bold; cursor:pointer;">
            설정 적용 및 리셋
        </button>
    </div>

    <!-- 하단 제어 바 -->
    <div class="glass-panel bottom-control-bar">

            <span style="font-size: 16px;">🎲</span>

            <span>추첨 설정</span>

        <button class="control-tab-btn" id="btn-reset">
            <span style="font-size: 16px;">🔄</span>

        <button class="control-tab-btn" id="btn-align">

    <!-- Fullscreen / Windowed Mode Button -->
    <div class="bottom-right-bar">
        <button id="fullscreenBtn" class="glass-panel tag-badge">
            <span id="fullscreenIcon">⛶</span>
            <span id="fullscreenText">전체화면</span>
        </button>
    </div>

    <script>
        // --- 1. Three.js 씬, 카메라, 렌더러 설정 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf2f2f7);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 4.5, 16);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 2.5, 0);
        controls.maxDistance = 20;

        // --- 2. 조명 설정 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
        dirLight.position.set(5, 10, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0xffffff, 0.5, 20);
        pointLight.position.set(0, 3, 0); // 유리구 내부 중앙 조명
        scene.add(pointLight);

        // --- 3. 바닥 및 스튜디오 환경 ---
        const floorGeo = new THREE.PlaneGeometry(30, 30);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xd7ccc8, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = 0;
        floor.receiveShadow = true;
        scene.add(floor);

        // --- 4. 3D 뽑기 기계 (유리구 & 받침대) ---
        const machineGroup = new THREE.Group();
        
        // 받침대
        const baseGeo = new THREE.CylinderGeometry(2.2, 2.5, 0.8, 32);
        const baseMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50, metalness: 0.7, roughness: 0.2 });
        const baseMesh = new THREE.Mesh(baseGeo, baseMat);
        baseMesh.position.y = 0.4;
        baseMesh.castShadow = true;
        baseMesh.receiveShadow = true;
        machineGroup.add(baseMesh);

        // 유리구 (Gacha Globe)
        const globeRadius = 3.5;
        const globeGeo = new THREE.SphereGeometry(globeRadius, 32, 32);
        const glassMat = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            metalness: 0.1,
            roughness: 0.1,
            transparent: true,
            opacity: 0.25,
            transmission: 0.95, // 유리 질감 극대화
            thickness: 0.5,
            side: THREE.DoubleSide
        });
        const globeMesh = new THREE.Mesh(globeGeo, glassMat);
        globeMesh.position.y = 4.3; // 받침대 위
        machineGroup.add(globeMesh);

        scene.add(machineGroup);

        // --- 5. 구슬 (참가자) 생성 모듈 ---
        let balls = [];
        let drawnBalls = [];
        const ballRadius = 0.35;
        
        // 팝하고 귀여운 구슬 색상 배열
        const colors = [
            0xff3b30, 0xff9500, 0xffcc00, 0x4cd964, 0x5ac8fa, 
            0x007aff, 0x5856d6, 0xff2d55, 0x00c7be, 0xaf52de
        ];

        // 캔버스를 이용해 숫자 텍스처(Sprite) 생성 함수
        function createNumberSprite(num) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 70px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0,0,0,0.6)';
            ctx.shadowBlur = 6;
            ctx.fillText(num.toString(), 64, 68);

            const tex = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: tex, transparent: true });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(1.2, 1.2, 1.2);
            return sprite;
        }

        function createBalls(total, excludeArr) {
            // 기존 구슬 삭제
            balls.forEach(b => scene.remove(b.mesh));
            balls = [];
            drawnBalls = [];

            let activeCount = 0;

            for (let i = 1; i <= total; i++) {
                if (excludeArr.includes(i)) continue;

                const group = new THREE.Group();

                // 구슬 메쉬
                const color = colors[activeCount % colors.length];
                const ballMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3, metalness: 0.2 });
                const ballMesh = new THREE.Mesh(new THREE.SphereGeometry(ballRadius, 32, 32), ballMat);
                ballMesh.castShadow = true;
                group.add(ballMesh);

                // 숫자 스프라이트
                const sprite = createNumberSprite(i);
                sprite.position.z = ballRadius + 0.05; // 구슬 표면 바로 앞
                group.add(sprite);
                // 양면으로 보이게 뒤쪽에도 추가
                const spriteBack = createNumberSprite(i);
                spriteBack.position.z = -(ballRadius + 0.05);
                group.add(spriteBack);

                // 유리구 내부 임의의 위치에 배치
                const r = Math.random() * (globeRadius - ballRadius - 0.5);
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;
                const px = r * Math.sin(phi) * Math.cos(theta);
                const py = 4.3 + r * Math.cos(phi);
                const pz = r * Math.sin(phi) * Math.sin(theta);
                
                group.position.set(px, py, pz);
                scene.add(group);

                balls.push({
                    id: i,
                    mesh: group,
                    position: new THREE.Vector3(px, py, pz),
                    velocity: new THREE.Vector3(
                        (Math.random() - 0.5) * 5,
                        (Math.random() - 0.5) * 5,
                        (Math.random() - 0.5) * 5
                    ),
                    isDrawn: false,
                    targetPos: new THREE.Vector3()
                });

                activeCount++;
            }

            document.getElementById('val-total').innerText = activeCount + '명';
            document.getElementById('val-drawn').innerText = '0명';
            document.getElementById('guide-tooltip').innerHTML = "🎯 3D 뷰포트를 드래그해 보세요! <br><span style='font-size:12px; color:#8e8e93; font-weight:normal;'>(하단의 '추첨 시작'을 누르면 구슬이 섞입니다)</span>";
            document.getElementById('guide-tooltip').style.opacity = '1';
        }

        // 초기 생성 (기본 30명)
        createBalls(30, []);

        // --- 6. 자체 3D 물리 엔진 & 상태 머신 ---
        let simState = 'idle'; // 'idle', 'shuffling', 'drawing'
        let shuffleTimer = 0;
        
        function updatePhysics(dt) {
            // dt가 너무 크면 뚫고 나갈 수 있으므로 제한
            if (dt > 0.05) dt = 0.05;

            // 구슬 이동 및 구체 내부 충돌 처리
            balls.forEach(b => {
                if (b.isDrawn) return; // 이미 뽑힌 구슬은 물리 연산 제외

                // 중력 적용
                b.velocity.y -= 9.8 * dt;

                // 섞기 모드일 때 회오리(토네이도) 강제 힘 부여
                if (simState === 'shuffling') {
                    // Y축 기준 회전하는 힘
                    const swirl = new THREE.Vector3(-b.position.z, 0, b.position.x).normalize().multiplyScalar(40);
                    // 중앙 상단으로 띄우는 힘
                    const lift = new THREE.Vector3(0, 35, 0);
                    // 중심으로 살짝 모으는 힘
                    const centerPull = new THREE.Vector3(-b.position.x, 0, -b.position.z).normalize().multiplyScalar(10);
                    
                    b.velocity.add(swirl.add(lift).add(centerPull).multiplyScalar(dt));
                }

                // 속도 감쇠 (공기/마찰)
                b.velocity.multiplyScalar(simState === 'shuffling' ? 0.98 : 0.95);

                // 위치 업데이트
                b.position.add(b.velocity.clone().multiplyScalar(dt));

                // 유리구(경계)와 충돌 처리 (중심: 0, 4.3, 0)
                const center = new THREE.Vector3(0, 4.3, 0);
                const diff = b.position.clone().sub(center);
                const dist = diff.length();
                const maxDist = globeRadius - ballRadius;

                if (dist > maxDist) {
                    const normal = diff.normalize();
                    // 밖으로 나간 만큼 안으로 밀어넣기
                    b.position.copy(center).add(normal.clone().multiplyScalar(maxDist));
                    // 속도 반사 (탄성 충돌)
                    b.velocity.reflect(normal).multiplyScalar(0.7); 
                }
            });

            // 구슬 간의 충돌 (간단한 AABB O(n^2) 판별 후 거리 판별)
            for (let i = 0; i < balls.length; i++) {
                if (balls[i].isDrawn) continue;
                for (let j = i + 1; j < balls.length; j++) {
                    if (balls[j].isDrawn) continue;
                    
                    const b1 = balls[i];
                    const b2 = balls[j];
                    const diff = b1.position.clone().sub(b2.position);
                    const d2 = diff.lengthSq();
                    const minDist = ballRadius * 2;

                    if (d2 < minDist * minDist) {
                        const d = Math.sqrt(d2);
                        const normal = diff.clone().normalize();
                        const overlap = minDist - d;
                        
                        // 위치 보정 (겹침 방지)
                        b1.position.add(normal.clone().multiplyScalar(overlap * 0.5));
                        b2.position.sub(normal.clone().multiplyScalar(overlap * 0.5));

                        // 속도 교환 (단순화된 탄성 충돌)
                        const v1 = b1.velocity.clone();
                        const v2 = b2.velocity.clone();
                        b1.velocity.copy(v2).multiplyScalar(0.85);
                        b2.velocity.copy(v1).multiplyScalar(0.85);
                    }
                }
            }

            // Mesh 위치 동기화 및 렌더링
            balls.forEach(b => {
                if (!b.isDrawn) {
                    b.mesh.position.copy(b.position);
                    
                    // 속도 방향에 맞춰 약간 구르는 느낌으로 회전
                    if (b.velocity.lengthSq() > 0.1) {
                        const axis = new THREE.Vector3(b.velocity.z, 0, -b.velocity.x).normalize();
                        const angularSpeed = b.velocity.length() * dt * 2;
                        b.mesh.rotateOnWorldAxis(axis, angularSpeed);
                    }
                } else {
                    // 뽑힌 구슬: 카메라 앞 지정된 위치(targetPos)로 부드럽게 날아감 (Lerp)
                    b.mesh.position.lerp(b.targetPos, dt * 3);
                    // 스케일을 2배로 키워 눈에 잘 띄게
                    b.mesh.scale.lerp(new THREE.Vector3(2.5, 2.5, 2.5), dt * 3);
                    // 항상 정면을 바라보도록 회전 (텍스처가 잘 보이게)
                    b.mesh.quaternion.slerp(new THREE.Quaternion().setFromEuler(new THREE.Euler(0, 0, 0)), dt * 3);
                }
            });
        }

        // --- 7. 추첨 (Draw) 로직 ---
        const btnDraw = document.getElementById('btn-draw');
        const tooltip = document.getElementById('guide-tooltip');

        function startDraw() {
            const pickCount = parseInt(document.getElementById('input-pick-count').value) || 1;
            const availableBalls = balls.filter(b => !b.isDrawn);
            
            if (availableBalls.length === 0) {
                tooltip.innerHTML = "모든 인원이 뽑혔습니다! <br>다시 하려면 '전체 초기화'를 눌러주세요.";
                tooltip.style.opacity = '1';
                return;
            }

            const actualPickCount = Math.min(pickCount, availableBalls.length);

            // 상태 변경: 섞기(토네이도) 시작
            simState = 'shuffling';
            btnDraw.disabled = true;
            tooltip.innerHTML = "🌪️ 섞는 중... 두구두구두구!";
            tooltip.style.opacity = '1';

            // 2.5초 후 당첨자 발표
            setTimeout(() => {
                simState = 'drawing';
                
                // 배열 무작위 셔플 (Fisher-Yates)
                for (let i = availableBalls.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [availableBalls[i], availableBalls[j]] = [availableBalls[j], availableBalls[i]];
                }

                // 뽑힌 구슬 상태 변경 및 타겟 위치 설정
                for (let i = 0; i < actualPickCount; i++) {
                    const selected = availableBalls[i];
                    selected.isDrawn = true;
                    drawnBalls.push(selected);
                    
                    const idx = drawnBalls.length - 1;
                    // 카메라 앞에 가로로 정렬되게 타겟 좌표 설정
                    const cols = 5; // 한 줄에 5명씩
                    const row = Math.floor(idx / cols);
                    const col = idx % cols;
                    
                    const startX = -((Math.min(drawnBalls.length, cols) - 1) * 2.2) / 2;
                    selected.targetPos.set(
                        (col * 2.2) - (cols-1)*1.1, // X
                        6.5 - (row * 2.2), // Y
                        6.0  // Z (카메라와 유리구 사이)
                    );
                }

                document.getElementById('val-drawn').innerText = drawnBalls.length + '명';
                
                // 안내 문구 변경 및 버튼 활성화
                const drawnNumbers = drawnBalls.slice(-actualPickCount).map(b => b.id).join(', ');
                tooltip.innerHTML = `🎉 <b>${drawnNumbers}번</b> 당첨! 🎉`;
                
                setTimeout(() => { btnDraw.disabled = false; }, 500);

            }, 2500);
        }

        btnDraw.addEventListener('click', startDraw);

        // --- 8. UI 제어 및 기타 설정 ---
        const btnToggleConfig = document.getElementById('btn-toggle-config');
        const configPanel = document.getElementById('config-panel');
        btnToggleConfig.addEventListener('click', () => {
            configPanel.classList.toggle('show');
            btnToggleConfig.classList.toggle('active');
        });

        document.getElementById('btn-apply-settings').addEventListener('click', () => {
            const total = parseInt(document.getElementById('input-total').value) || 30;
            const excludeStr = document.getElementById('input-exclude').value;
            const excludeArr = excludeStr.split(/[\s,]+/).map(n => parseInt(n.trim())).filter(n => !isNaN(n));
            
            createBalls(total, excludeArr);
            simState = 'idle';
            configPanel.classList.remove('show');
            btnToggleConfig.classList.remove('active');
            btnDraw.disabled = false;
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            const total = parseInt(document.getElementById('input-total').value) || 30;
            const excludeStr = document.getElementById('input-exclude').value;
            const excludeArr = excludeStr.split(/[\s,]+/).map(n => parseInt(n.trim())).filter(n => !isNaN(n));
            
            createBalls(total, excludeArr);
            simState = 'idle';
            btnDraw.disabled = false;
        });

        document.getElementById('btn-align').addEventListener('click', () => {
            camera.position.set(0, 4.5, 16);
            controls.target.set(0, 2.5, 0);
        });

        document.getElementById('theme-toggle').addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            scene.background.setHex(isDark ? 0x121212 : 0xf2f2f7);
            floorMat.color.setHex(isDark ? 0x2c2c2e : 0xd7ccc8);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 9. 애니메이션 루프 ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            
            updatePhysics(dt);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    
        /* ---------- Fullscreen / Windowed Mode Logic ---------- */
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const fullscreenIcon = document.getElementById('fullscreenIcon');
        const fullscreenText = document.getElementById('fullscreenText');

        function updateFullscreenUI() {
            const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
            if (fullscreenIcon) fullscreenIcon.innerText = isFS ? '🗗' : '⛶';
            if (fullscreenText) fullscreenText.innerText = isFS ? '창모드' : '전체화면';
        }

        if (fullscreenBtn) {
            fullscreenBtn.addEventListener('click', () => {
                try {
                    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                        const req = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
                        if (req) req.call(document.documentElement);
                    } else {
                        const exit = document.exitFullscreen || document.webkitExitFullscreen;
                        if (exit) exit.call(document);
                    }
                } catch (err) {
                    console.error('전체화면 모드를 전환할 수 없습니다:', err);
                }
            });
        }

        document.addEventListener('fullscreenchange', updateFullscreenUI);
        document.addEventListener('webkitfullscreenchange', updateFullscreenUI);
    </script>














<!-- @@MOBILE-JS v1@@ -->
<script>
/* ============ 모바일 화면 재조정 + 전체화면 대체 동작 (자동 생성) ============ */
(function () {
    var docEl = document.documentElement;
    var btn = document.getElementById('fullscreenBtn');
    var icon = document.getElementById('fullscreenIcon');
    var text = document.getElementById('fullscreenText');

    function realFs() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement ||
                  document.mozFullScreenElement || document.msFullscreenElement);
    }
    function pseudo() { return docEl.classList.contains('pseudo-fs'); }
    function setUI() {
        var on = realFs() || pseudo();
        if (icon) icon.textContent = on ? '🗗' : '⛶';
        if (text) text.textContent = on ? '창모드' : '전체화면';
        if (btn) btn.setAttribute('aria-label', on ? '창모드로 전환' : '전체화면으로 전환');
        document.body.classList.toggle('is-fullscreen', on);
    }
    function toast(msg) {
        var t = document.getElementById('ux-toast');
        if (!t) {
            t = document.createElement('div');
            t.id = 'ux-toast';
            t.style.cssText = 'position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);' +
                'background:rgba(28,28,30,.88);color:#fff;font-size:12px;line-height:1.4;padding:9px 14px;border-radius:14px;' +
                'z-index:9999;max-width:86vw;text-align:center;pointer-events:none;transition:opacity .3s;' +
                'font-family:inherit;box-shadow:0 8px 24px rgba(0,0,0,.25)';
            document.body.appendChild(t);
        }
        t.textContent = msg;
        t.style.opacity = '1';
        clearTimeout(t._t);
        t._t = setTimeout(function () { t.style.opacity = '0'; }, 2600);
    }

    if (btn) {
        btn.addEventListener('click', function () {
            var wasReal = realFs();
            var wasPseudo = pseudo();
            setTimeout(function () {
                if (wasReal) { setUI(); return; }          // 진짜 전체화면에서 나온 경우
                if (wasPseudo) { docEl.classList.remove('pseudo-fs'); setUI(); return; }  // 몰입 모드 해제
                if (!realFs()) {                            // 전체화면 API가 동작하지 않는 환경
                    docEl.classList.add('pseudo-fs');
                    try { window.scrollTo(0, 1); } catch (e) {}
                    toast('이 브라우저는 전체화면을 지원하지 않아 상단 정보를 숨긴 몰입 모드로 표시합니다');
                }
                setUI();
            }, 380);
        }, false);
    }
    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
        document.addEventListener(ev, setUI);
    });

    /* 좁은 화면에서는 3D 장면이 잘리지 않도록 시야각을 넓혀 전체가 들어오게 한다 */
    function mobileFit() {
        try {
            if (typeof camera === 'undefined' || !camera || !camera.isPerspectiveCamera) return;
            if (!camera.userData) camera.userData = {};
            if (!camera.userData.baseFov) camera.userData.baseFov = camera.fov;
            var w = window.innerWidth, h = window.innerHeight, f = 1;
            var k = 0.62;
            var attr = document.documentElement.getAttribute('data-mzoom');
            if (attr) { var v = parseFloat(attr); if (!isNaN(v) && v > 0) k = v; }
            if (w < h) f = 1 + (1 - w / h) * k;
            else if (h <= 500) f = 1 + k * 0.16;
            camera.fov = Math.min(88, camera.userData.baseFov * f);
            camera.updateProjectionMatrix();
        } catch (e) {}
    }
    mobileFit();

    /* 화면 회전·주소창 변화·전체화면 전환 후 렌더러 크기 재계산 */
    var rt = null;
    function refit() {
        clearTimeout(rt);
        rt = setTimeout(function () {
            mobileFit();
            try { window.dispatchEvent(new Event('resize')); } catch (e) {}
        }, 240);
    }
    window.addEventListener('orientationchange', refit);
    window.addEventListener('pageshow', refit);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) refit(); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', refit);

    setUI();
})();
</script>
