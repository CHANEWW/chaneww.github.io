<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>전기 회로 3D</title>
<style>
@font-face{font-family:'SeoulNamsanL';src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanL.woff') format('woff');font-weight:normal;font-style:normal}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;color:#1c1c1e;background:#f4f7f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","SeoulNamsanL",sans-serif; transition: background 0.3s, color 0.3s;}

/* 캔버스 */
canvas{position:fixed;inset:0;touch-action:none;display:block;z-index:1}

/* UI 공통 유리 스타일 */
.ui-card{background:rgba(255,255,255,0.75);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.8);border-radius:18px;box-shadow:0 8px 32px rgba(0,0,0,0.06);z-index:100;position:fixed; transition: all 0.3s;}

/* 좌측 상단 헤더 영역 */
#top-left-wrap { position:fixed; top:16px; left:20px; display:flex; align-items:stretch; gap:10px; z-index:100; height:42px; }

.back-btn { display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.75); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.8); font-family:inherit; font-size:15px; font-weight:600; color:#111; cursor:pointer; padding:0 18px; border-radius:999px; box-shadow:0 8px 32px rgba(0,0,0,0.06); transition:all .2s; text-decoration:none; }
.back-btn:hover { background:rgba(255,255,255,0.9); transform:translateY(-1px); }

#header { position:relative; top:0; left:0; display:flex; align-items:center; gap:10px; padding:0 18px; border-radius:999px; }

.title-text{font-size:15px;font-weight:600;color:#111}
.badge-tag{background:#e8f0fe;color:#3b82f6;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}

/* 우측 상단 야간모드 토글 버튼 */
#bTheme{top:16px;right:20px;padding:8px 16px;border:none;font-weight:700;color:#333;cursor:pointer;font-size:13px;transition:background .2s; border-radius:999px;}
#bTheme:hover{background:rgba(0,0,0,0.05)}

/* 우측 상단 내부저항 설정 컨트롤 카드 */
#battRCard {
  position:fixed; right:20px; top:112px; z-index:100;
  padding:12px 16px; display:flex; flex-direction:column; gap:6px;
  width:200px; border-radius:18px;
}
#battRCard label { font-size:12px; font-weight:700; color:#444; display:flex; justify-content:space-between; align-items:center; }
#battRCard span { color:#2c3e50; font-weight:800; font-size:13px; }
#battRCard input[type=range] { width:100%; accent-color:#2c3e50; cursor:pointer; }

/* 다크 모드 스타일 재정의 */
body.dark { background: #1c1c1e; color: #fff; }
body.dark .ui-card { background: rgba(40,40,40,0.75); border: 1px solid rgba(255,255,255,0.1); box-shadow:0 8px 32px rgba(0,0,0,0.4); }
body.dark .title-text { color: #fff; }
body.dark .back-btn { background: rgba(40,40,40,0.75); color: #fff; box-shadow: 0 8px 32px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); }
body.dark .back-btn:hover { background: rgba(60,60,60,0.85); }
body.dark #bTheme { color: #eee; }
body.dark #bTheme:hover { background: rgba(255,255,255,0.1); }
body.dark .pbtn { background: rgba(60,60,60,0.6); color: #eee; }
body.dark .pbtn:hover { background: #555; }
body.dark .seg { background: rgba(255,255,255,0.1); }
body.dark .seg label { color: #bbb; }
body.dark .seg label:has(input:checked) { background: #444; color: #fff; }
body.dark .cbtn { background: rgba(60,60,60,0.8); color: #eee; }
body.dark .cbtn:hover { background: #555; }
body.dark #pop h4, body.dark #pv { color: #fff; }
body.dark .ctl-group { color: #ddd; }
body.dark #boardHelp { background: rgba(40,40,40,0.78); color:#aaa; }
body.dark #battRCard label { color:#bbb; }
body.dark #battRCard span { color:#3b82f6; }

/* 중앙 상단 힌트 */
#hint{top:25%;left:50%;transform:translate(-50%, -50%);padding:14px 28px;font-size:16px;font-weight:700;color:#fff;background:rgba(0,0,0,0.7);border-radius:999px;pointer-events:none;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,0.15);transition:opacity 0.3s ease;z-index:1000;position:fixed;}

/* 좌측 부품 팔레트 */
#palette{left:20px;top:50%;transform:translateY(-50%);padding:12px 8px;display:flex;flex-direction:column;gap:8px;width:88px;border-radius:24px;max-height:86vh;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#palette::-webkit-scrollbar{display:none}
.pbtn{touch-action:none;border:none;background:rgba(255,255,255,0.6);border-radius:16px;padding:10px 4px;color:#333;font:inherit;font-size:12px;font-weight:700;cursor:grab;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 2px 8px rgba(0,0,0,0.04);transition:all .15s ease;user-select:none;flex-shrink:0}
.pbtn b{font-size:22px;line-height:1}
.pbtn:hover{background:#fff;transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,0.08)}
.pbtn:active{cursor:grabbing;transform:scale(0.95)}

/* 드래그 고스트 요소 */
#dragGhost{position:fixed;pointer-events:none;z-index:9999;display:none;min-width:112px;padding:18px 20px;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border:2px solid #3b82f6;border-radius:20px;box-shadow:0 16px 40px rgba(0,0,0,.2);font-size:15px;font-weight:800;color:#111;text-align:center;transform:translate(-50%,-55%);user-select:none}
#dragGhost b{display:block;font-size:38px;line-height:1.25;margin-bottom:5px}
#trash{margin-top:8px;padding:12px 4px;border:2px dashed #f87171;border-radius:16px;background:rgba(254,226,226,.72);color:#b91c1c;text-align:center;font-size:12px;font-weight:800;transition:.15s;user-select:none;flex-shrink:0}
#trash b{display:block;font-size:25px;margin-bottom:3px}
#trash.over{background:#ef4444;color:#fff;border-color:#b91c1c;transform:scale(1.04)}
@media(max-width:768px){#trash{padding:9px 2px;font-size:10px}#trash b{font-size:22px}}
#boardHelp{position:fixed;right:20px;top:72px;z-index:5;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.78);color:#64748b;font-size:12px;pointer-events:none}

/* 하단 컨트롤 바 */
#bar{bottom:20px;left:50%;transform:translateX(-50%);padding:10px 24px;display:flex;gap:16px;align-items:center;justify-content:center;border-radius:999px}
.ctl-group{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#444}
.seg{display:flex;background:rgba(0,0,0,0.06);border-radius:999px;padding:3px}
.seg label{padding:6px 14px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;color:#666;transition:all .2s}
.seg input{display:none}
.seg label:has(input:checked){background:#fff;color:#111;box-shadow:0 2px 8px rgba(0,0,0,0.1)}

.cbtn{border:none;background:rgba(255,255,255,0.8);color:#333;border-radius:999px;padding:8px 16px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:0 2px 8px rgba(0,0,0,0.05);transition:all .2s}
.cbtn:hover{background:#fff;transform:translateY(-1px)}
.cbtn:active{transform:scale(0.96)}

/* 부품 설정 팝업 */
#pop{display:none;width:220px;padding:16px;border-radius:24px;z-index:200}
#pop h4{margin:0 0 6px;font-size:14px;color:#111}
#pop input[type=range]{width:100%;margin:8px 0 12px;accent-color:#2c3e50}
#pv{font-size:20px;font-weight:900;color:#2c3e50;margin-bottom:4px}
.btn-del{width:100%;border:none;background:#fee2e2;color:#ef4444;border-radius:12px;padding:8px;font-weight:700;cursor:pointer}
.btn-del:hover{background:#fca5a5;color:#fff}

@media(max-width:768px){
  #top-left-wrap { left:12px; gap:8px; height:38px; }
  .back-btn { padding:0 14px; font-size:13px; }
  #header { padding:0 14px; }
  #palette{width:76px;padding:8px 6px}.pbtn{font-size:11px;padding:8px 2px}
  .title-text{font-size:13px}
  #hint{display:none}
  #battRCard{width:160px; right:12px; top:110px; padding:8px 12px;}
}
</style>
</head>
<body>

<!-- 상단 헤더 영역 -->
<div id="top-left-wrap">
  <a href="/index.html" class="back-btn">⬅ 메인</a>
  <div id="header" class="ui-card">
    <span class="title-text">전기 회로 3D</span>
    <span class="badge-tag">visionOS</span>
  </div>
</div>

<!-- 우측 상단 야간/주간 모드 버튼 -->
<button id="bTheme" class="ui-card">🌙 야간 모드</button>

<!-- 우측 상단 전지 내부 저항 설정 카드 (시작 0.00 Ω 설정) -->
<div id="battRCard" class="ui-card">
  <label>⚡ 전지 내부저항 <span id="battRVal">0.00 Ω</span></label>
  <input type="range" id="battRInput" min="0" max="5" step="0.01" value="0">
</div>

<!-- 중앙 힌트 -->
<div id="hint">💡 왼쪽 부품을 화면으로 끌어다 놓아 회로를 구성하세요</div>

<!-- 좌측 팔레트 -->
<div id="palette" class="ui-card"><div id="trash"><b>🗑️</b>휴지통</div></div>

<!-- 드래그 고스트 -->
<div id="dragGhost"></div>
<div id="boardHelp">빈 공간 드래그: 화면 회전 · 부품 드래그: 이동 · 스위치 클릭: 열기/닫기</div>

<!-- 팝업 메뉴 -->
<div id="pop" class="ui-card">
  <h4 id="pt">부품 설정</h4>
  <div id="pv">0</div>
  <input type="range" id="ps">
  <button class="btn-del" id="pd">삭제</button>
</div>

<!-- 하단 컨트롤 바 -->
<div id="bar" class="ui-card">
  <div class="seg">
    <label><input type="radio" name="mode" value="current">전류 흐름</label>
    <label><input type="radio" name="mode" value="electron" checked>전자 이동</label>
  </div>

  <div class="ctl-group">
    <label style="cursor:pointer;"><input type="checkbox" id="cLight" checked style="accent-color:#2c3e50;"> 전구 빛</label>
  </div>

  <button class="cbtn" id="bEx">⚡ 예제 회로</button>
  <button class="cbtn" id="bRst">🔄 초기화</button>
  <button class="cbtn" id="bCam">🎥 시점정렬</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const RA=[];for(let i=1;i<=10;i++)RA.push(i);
for(let i=2;i<=10;i++)RA.push(i*10);
for(let i=2;i<=10;i++)RA.push(i*100);
for(let i=2;i<=10;i++)RA.push(i*1000);

let batteryInternalR = 0.0;

$('#battRInput').addEventListener('input', e => {
  batteryInternalR = parseFloat(e.target.value);
  $('#battRVal').textContent = batteryInternalR.toFixed(2) + ' Ω';
});

const TYPES={
  resist:{n:'저항',ic:'〰',R:10},
  bulb:{n:'전구',ic:'💡',R:10},
  wire:{n:'도선',ic:'━',R:0},
  sw:{n:'스위치',ic:'⏻',R:0},
  batt:{n:'전지',ic:'🔋',V:1.5},
  vMeter:{n:'전압계',ic:'V',R:1e8}, 
  iMeter:{n:'전류계',ic:'A',R:0}
};

const isMeter = t => t==='vMeter'||t==='iMeter';

const mod=(a,b)=>((a%b)+b)%b;

/* 포맷팅 함수: 0.1mA / 0.1mV 미만 미세 누설 오치는 0으로 깔끔하게 정리 */
function fmt(v,u){
  const a=Math.abs(v);
  if(a<1e-4)return '0 '+u;
  for(const[s,p]of[[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m']])
    if(a>=s)return(+(v/s).toPrecision(3))+' '+p+u;
  return '0 '+u;
}

/* 3D 렌더러 & 씬 기본 설정 */
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const cv=renderer.domElement;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(38,1,.1,100);
let yaw=0,pitch=.82,dist=15;

function updateCam(){
  camera.position.set(dist*Math.sin(yaw)*Math.cos(pitch),dist*Math.sin(pitch),dist*Math.cos(yaw)*Math.cos(pitch)+.3);
  camera.lookAt(0,0,0);
}
function resize(){
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();

/* 조명 */
const hemiLight = new THREE.HemisphereLight(0xffffff,0xdde3ea,1.1);
scene.add(hemiLight);
const sun=new THREE.DirectionalLight(0xffffff,0.8);
sun.position.set(5,12,7);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-10,right:10,top:8,bottom:-8,near:1,far:30});
sun.shadow.radius=3;
scene.add(sun);

/* 작업판 및 테두리 */
const boardMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.82,metalness:0});
const board=new THREE.Mesh(new THREE.PlaneGeometry(16,9.5),boardMat);
board.rotation.x=-Math.PI/2;
board.position.set(0,0,0);
board.receiveShadow=true;
board.name='circuit-board';
scene.add(board);

const edge=new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(16,.12,9.5)),
  new THREE.LineBasicMaterial({color:0xcbd5e1})
);
edge.position.y=-.06;
scene.add(edge);

/* 화염 / 불꽃 파티클 시스템 생성 (쇼트된 전지 여러 개 지원) */
const FIRE_PARTICLES = 120;
const MAX_FIRE_LIGHTS = 6;
const fireGeo = new THREE.BufferGeometry();
const firePos = new Float32Array(FIRE_PARTICLES * 3);
const fireSizes = new Float32Array(FIRE_PARTICLES);
const fireAlphas = new Float32Array(FIRE_PARTICLES);
const fireVelocities = [];

for(let i=0; i<FIRE_PARTICLES; i++){
  firePos[i*3] = 0; firePos[i*3+1] = -100; firePos[i*3+2] = 0;
  fireSizes[i] = Math.random() * 0.3 + 0.15;
  fireAlphas[i] = 0;
  fireVelocities.push({
    x: (Math.random() - 0.5) * 0.04,
    y: Math.random() * 0.05 + 0.03,
    z: (Math.random() - 0.5) * 0.04,
    life: Math.random()
  });
}

fireGeo.setAttribute('position', new THREE.BufferAttribute(firePos, 3));
fireGeo.setAttribute('size', new THREE.BufferAttribute(fireSizes, 1));
fireGeo.setAttribute('alpha', new THREE.BufferAttribute(fireAlphas, 1));

const fireMat = new THREE.ShaderMaterial({
  uniforms: { color: { value: new THREE.Color(0xff3300) } },
  vertexShader: `
    attribute float size;
    attribute float alpha;
    varying float vAlpha;
    void main() {
      vAlpha = alpha;
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * (320.0 / -mvPosition.z);
      gl_Position = projectionMatrix * mvPosition;
    }
  `,
  fragmentShader: `
    uniform vec3 color;
    varying float vAlpha;
    void main() {
      float r = length(gl_PointCoord - vec2(0.5));
      if (r > 0.5) discard;
      float intensity = smoothstep(0.5, 0.0, r);
      vec3 finalColor = mix(vec3(1.0, 0.95, 0.3), color, r * 1.8);
      gl_FragColor = vec4(finalColor, intensity * vAlpha);
    }
  `,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});

const fireParticleSystem = new THREE.Points(fireGeo, fireMat);
fireParticleSystem.frustumCulled = false;
scene.add(fireParticleSystem);

const fireLights = [];
for(let i=0; i<MAX_FIRE_LIGHTS; i++){
  const l = new THREE.PointLight(0xff4400, 0, 5);
  scene.add(l);
  fireLights.push(l);
}

/* 다크 모드 제어 로직 */
let isDark = false;
$('#bTheme').addEventListener('click', () => {
  isDark = !isDark;
  document.body.classList.toggle('dark', isDark);
  $('#bTheme').innerHTML = isDark ? '☀️ 주간 모드' : '🌙 야간 모드';
  
  boardMat.color.setHex(isDark ? 0x222222 : 0xffffff);
  edge.material.color.setHex(isDark ? 0x555555 : 0xcbd5e1);
  hemiLight.intensity = isDark ? 0.25 : 1.1;
  sun.intensity = isDark ? 0.3 : 0.8;
});

/* 계기판(전압계/전류계) 그리기 */
function drawMeterFace(ctx, text, colorStr){
  ctx.clearRect(0,0,512,512);
  ctx.fillStyle='#ffffff';
  ctx.beginPath();ctx.arc(256,256,240,0,Math.PI*2);ctx.fill();
  ctx.lineWidth=16;ctx.strokeStyle='#e2e8f0';ctx.stroke();

  let size=130;
  ctx.font='bold '+size+'px -apple-system,BlinkMacSystemFont,sans-serif';
  const maxW=360;
  const w=ctx.measureText(text).width;
  if(w>maxW){
    size=Math.floor(size*maxW/w);
    ctx.font='bold '+size+'px -apple-system,BlinkMacSystemFont,sans-serif';
  }
  ctx.fillStyle=colorStr;
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  // 수치 텍스트 위치를 지름(중심 256) 근처에서 위쪽(195)으로 이동하여 가시성 확보
  ctx.fillText(text,256,195);
}

function createMeterTexture(text, colorStr){
  const canvas=document.createElement('canvas');
  canvas.width=512; canvas.height=512;
  const ctx=canvas.getContext('2d');
  drawMeterFace(ctx,text,colorStr);
  const tex=new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter;
  tex.generateMipmaps = false;
  tex.needsUpdate=true;
  return tex;
}

function createTerminalTexture(text, colorStr){
  const canvas=document.createElement('canvas');
  canvas.width=512; canvas.height=512;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle=colorStr;
  ctx.font='bold 380px -apple-system,BlinkMacSystemFont,sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(text, 256, 256);
  
  const tex=new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter;
  tex.generateMipmaps = false;
  tex.needsUpdate=true;
  return tex;
}

/* 부품 값 라벨 */
function createLabel(){
  const canvas=document.createElement('canvas');
  canvas.width=256; canvas.height=96;
  const tex=new THREE.CanvasTexture(canvas);
  tex.minFilter=THREE.LinearFilter;
  tex.generateMipmaps=false;
  const m=new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false,depthWrite:false});
  const s=new THREE.Sprite(m);
  s.scale.set(1.8,.675,1);
  s.renderOrder=10;
  scene.add(s);
  return s;
}
function drawLabel(sprite,text,colorStr){
  const canvas=sprite.material.map.image;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,256,96);
  const x=6,y=8,w=244,h=80,r=26;
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
  ctx.fillStyle='rgba(255,255,255,0.94)';ctx.fill();
  ctx.lineWidth=5;ctx.strokeStyle=colorStr;ctx.stroke();

  let size=46;
  ctx.font='bold '+size+'px -apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif';
  const wd=ctx.measureText(text).width;
  if(wd>210){
    size=Math.floor(size*210/wd);
    ctx.font='bold '+size+'px -apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif';
  }
  ctx.fillStyle=colorStr;
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(text,128,50);
  sprite.material.map.needsUpdate=true;
}
function labelInfo(p){

function removePart(p){
  if(!p)return;
  scene.remove(p.g);
  p.g.traverse(o=>{
    if(o.geometry)o.geometry.dispose();
    if(o.material){
      if(Array.isArray(o.material))o.material.forEach(m=>m.dispose());
      else o.material.dispose();
    }
  });
  if(p.meterTex) p.meterTex.dispose();
  if(p.lbl){
    scene.remove(p.lbl);
    if(p.lbl.material.map)p.lbl.material.map.dispose();
    p.lbl.material.dispose();
  }
  const idx=parts.indexOf(p);if(idx>=0)parts.splice(idx,1);
  if(sel===p)select(null);
}

/* MNA 기반 회로망 해석 */
function simulate(){
  const pts=[];
  const id=(x,z)=>{
    for(let i=0;i<pts.length;i++)if(Math.hypot(pts[i][0]-x,pts[i][1]-z)<.16)return i;
    pts.push([x,z]);return pts.length-1;
  };
  parts.forEach(p=>{
    p.n0=id(p.x[0],p.z[0]);
    p.n1=id(p.x[1],p.z[1]);
    p.I=0; p.dv=0; p.closed=false; p.isShort=false;
  });

  const numNodes = pts.length;
  if(numNodes === 0) return;
  
  const nodeDegree = new Array(numNodes).fill(0);
  parts.forEach(p=>{ nodeDegree[p.n0]++; nodeDegree[p.n1]++; });
  parts.forEach(p=>{
    p.conn0 = nodeDegree[p.n0] > 1;
    p.conn1 = nodeDegree[p.n1] > 1;
    p.fullyConnected = p.conn0 && p.conn1; 
  });

  const batteries = parts.filter(p=>p.type==='batt');
  const numBatts = batteries.length;
  
  if(numBatts === 0) {
    parts.forEach(p=>{
      if(isMeter(p.type)) updateMeterDisplay(p, 0);
    });
    return;
  }

  const N = numNodes;
  const M = numBatts;
  const size = N + M;

  const A = Array.from({length: size}, () => new Float64Array(size));
  const Z = new Float64Array(size);

  for(let j=0; j<N; j++){ A[j][j] += 1e-9; }

  const WIRE_R = 1e-4;

  parts.forEach(p=>{
    if(p.type === 'batt') return; 
    if(p.type === 'sw' && p.open) return;
    let R = p.R;
    if(p.type === 'wire' || p.type === 'iMeter' || p.type === 'sw') R = WIRE_R;
    const G = 1 / R;
    const u = p.n0, v = p.n1;

    if(isFinite(G) && G > 0){
      A[u][u] += G; A[v][v] += G;
      A[u][v] -= G; A[v][u] -= G;
    }
  });

  batteries.forEach((b, k)=>{
    const idx = N + k;
    const u = b.n0; const v = b.n1; 
    A[u][idx] += 1; A[v][idx] -= 1;
    A[idx][u] += 1; A[idx][v] -= 1;
    
    A[idx][idx] -= batteryInternalR;
    Z[idx] = b.V;
  });

  for(let j=0; j<size; j++){ A[0][j] = 0; A[j][0] = 0; }
  A[0][0] = 1; Z[0] = 0;

  const X = solveLinearSystem(A, Z, size);

  if(!X) {
    parts.forEach(p=>{
      if(isMeter(p.type)) updateMeterDisplay(p, 0);
    });
    return;
  }

  const nodeV = X.subarray(0, N);

  parts.forEach(p=>{
    if(p.type==='batt'){
      const k = batteries.indexOf(p);
      p.I = X[N + k]; 
      p.dv = p.V - Math.abs(p.I) * batteryInternalR;
      p.closed = Math.abs(p.I) > 1e-4;
      
      if(p.closed && Math.abs(p.I) >= 3.0) {
        p.isShort = true;
      }
    } else {
      if (!p.fullyConnected) {
        p.dv = 0;
        p.I = 0;
      } else {
        const v0 = nodeV[p.n0];
        const v1 = nodeV[p.n1];
        p.dv = v0 - v1;
        
        let R = p.R;
        if(p.type === 'wire' || p.type === 'iMeter' || p.type === 'sw') R = WIRE_R;
        
        if(p.type === 'vMeter') p.I = 0;
        else if(p.type === 'sw' && p.open) p.I = 0;
        else p.I = p.dv / R;
      }
      p.closed = Math.abs(p.I) > 1e-4;
    }

    /* 계산상 생기는 극미세 누설 오차 수치(1e-5 미만) 강제 클램핑 처리 */
    if(Math.abs(p.I) < 1e-5) p.I = 0;
    if(Math.abs(p.dv) < 1e-5) p.dv = 0;

    if(p.type === 'vMeter'){
      updateMeterDisplay(p, p.dv);
    } else if(p.type === 'iMeter'){
      updateMeterDisplay(p, p.I);
    }
  });
}

function solveLinearSystem(A, B, n) {
  const M = Array.from({length: n}, (_, i) => {
    const row = new Float64Array(n + 1);
    row.set(A[i]); row[n] = B[i]; return row;
  });

  for(let i=0; i<n; i++) {
    let maxRow = i;
    for(let k=i+1; k<n; k++) {
      if(Math.abs(M[k][i]) > Math.abs(M[maxRow][i])) maxRow = k;
    }
    const temp = M[i]; M[i] = M[maxRow]; M[maxRow] = temp;

    if(Math.abs(M[i][i]) < 1e-11) return null; 

    for(let k=i+1; k<n; k++) {
      const c = -M[k][i] / M[i][i];
      for(let j=i; j<=n; j++) {
        if(i === j) M[k][j] = 0;
        else M[k][j] += c * M[i][j];
      }
    }
  }

  const x = new Float64Array(n);
  for(let i=n-1; i>=0; i--) {
    x[i] = M[i][n] / M[i][i];
    for(let k=i-1; k>=0; k--) {
      M[k][n] -= M[k][i] * x[i];
    }
  }
  return x;
}

function updateMeterDisplay(p, val){
  if(!p.meterTex) return;
  const unit = p.type==='vMeter' ? 'V' : 'A';
  
  let textStr = fmt(val, unit);
  if(textStr.startsWith('-0 ')) textStr = '0 ' + unit;
  
  if(p.lastText === textStr) return;
  p.lastText = textStr;
  
  const colorStr = p.type==='vMeter' ? '#3b82f6' : '#10b981';
  const canvas = p.meterTex.image;
  const ctx = canvas.getContext('2d');
  drawMeterFace(ctx, textStr, colorStr);
  p.meterTex.needsUpdate = true;
}

/* 불꽃 파티클 애니메이션: 쇼트된 전지 모두에서 불꽃 발생 */
function updateFireAnimation(shortBatteries){
  const positions = fireGeo.attributes.position.array;
  const alphas = fireGeo.attributes.alpha.array;
  const n = shortBatteries.length;

  if(n === 0){
    fireLights.forEach(l => l.intensity = 0);
    for(let i=0; i<FIRE_PARTICLES; i++) alphas[i] = 0;
    fireGeo.attributes.alpha.needsUpdate = true;
    return;
  }

  /* 전지별 불빛 */
  fireLights.forEach((l, i)=>{
    if(i < n){
      const b = shortBatteries[i];
      l.position.set((b.x[0]+b.x[1])/2, 0.4, (b.z[0]+b.z[1])/2);
      l.intensity = 3.0 + Math.random() * 3.0;
    } else {
      l.intensity = 0;
    }
  });

  /* 파티클을 전지들에 나눠서 배정 */
  for(let i=0; i<FIRE_PARTICLES; i++){
    const v = fireVelocities[i];
    const batt = shortBatteries[i % n];
    const cx = (batt.x[0] + batt.x[1]) / 2;
    const cz = (batt.z[0] + batt.z[1]) / 2;
    v.life -= 0.04;

    if(v.life <= 0){
      v.life = 1.0;
      positions[i*3] = cx + (Math.random() - 0.5) * 0.5;
      positions[i*3+1] = 0.15;
      positions[i*3+2] = cz + (Math.random() - 0.5) * 0.5;
      v.x = (Math.random() - 0.5) * 0.04;
      v.y = Math.random() * 0.06 + 0.035;
      v.z = (Math.random() - 0.5) * 0.04;
    } else {
      positions[i*3] += v.x;
      positions[i*3+1] += v.y;
      positions[i*3+2] += v.z;
    }

    alphas[i] = Math.sin(Math.max(v.life,0) * Math.PI);
  }

  fireGeo.attributes.position.needsUpdate = true;
  fireGeo.attributes.alpha.needsUpdate = true;
}

function updatePart(p){
  const dx=p.x[1]-p.x[0],dz=p.z[1]-p.z[0],L=Math.hypot(dx,dz);
  p.L=L;
  p.g.position.set(p.x[0],.08,p.z[0]);p.g.rotation.y=-Math.atan2(dz,dx);
  p.lead.scale.x=L;p.lead.position.x=L/2;p.j[1].position.x=L;p.mid.position.x=L/2;
  
  if(isMeter(p.type) && p.displayPlane){
    p.displayPlane.quaternion.copy(camera.quaternion);
    p.displayPlane.quaternion.premultiply(p.g.quaternion.clone().invert());
  }

  if(p.j[0].material) p.j[0].material.color.setHex(p.conn0 ? 0x9ca3af : 0xef4444);
  if(p.j[1].material) p.j[1].material.color.setHex(p.conn1 ? 0x9ca3af : 0xef4444);

  if(p.type==='sw'){
    const h=L/2;
    const sl=Math.max(h-.45,.001);
    p.stubs[0].scale.x=sl; p.stubs[0].position.x=-(h+.45)/2;
    p.stubs[1].scale.x=sl; p.stubs[1].position.x=(h+.45)/2;
    const target=p.open?.7:0;
    p.leverAngle+=(target-p.leverAngle)*.25;
    p.lever.rotation.z=p.leverAngle;
  }

  if(p.lbl){
    const info=labelInfo(p);
    if(info){
      const key=info.t+'|'+info.c;
      if(p.lblText!==key){ p.lblText=key; drawLabel(p.lbl,info.t,info.c); }
    }
    p.lbl.position.set((p.x[0]+p.x[1])/2,.25,(p.z[0]+p.z[1])/2+.95);
  }

  const modeEl=document.querySelector('input[name=mode]:checked');
  const electron=modeEl?modeEl.value==='electron':true;
  const I=p.I;
  const on=Math.abs(I) > 1e-4;

  const speedFactor = Math.min(Math.abs(I), 100);
  p.ph += on ? Math.sign(I) * (0.02 + speedFactor * 0.15) : 0;
  
  const mesh=electron?p.el:p.ar;
  (electron?p.ar:p.el).visible=false;
  mesh.visible=on;
  
  const S=.8;
  const off=electron?mod(-p.ph,S):mod(p.ph,S);
  let c=0;
  
  if(on){
    for(let k=0;k<48;k++){
      const x=k*S+off;if(x>L)break;
      tmp.position.set(x,0,0);
      tmp.rotation.set(0, (electron ? I < 0 : I >= 0) ? 0 : Math.PI, 0);
      tmp.updateMatrix();
      mesh.setMatrixAt(c++,tmp.matrix);
    }
  }
  mesh.count=c;mesh.instanceMatrix.needsUpdate=true;
  
  if(p.type==='bulb'){
    const lit=p.closed && $('#cLight').checked;
    const power = Math.abs(p.dv * p.I); 
    const brightness = lit ? Math.min(Math.sqrt(power) * 1.5, 6.0) : 0;
    
    p.fil.material.emissiveIntensity = brightness * 3.0;
    p.fil.material.color.set(lit ? 0xffea00 : 0xa39171);
    p.fil.material.emissive.set(lit ? 0xffbb00 : 0x000000);
    
    if(p.bulbLight) p.bulbLight.intensity = brightness * 2.5;
    if(p.glow){
      p.glow.material.opacity = lit ? Math.min(0.2 + brightness * 0.2, 1.0) : 0;
      p.glow.scale.setScalar(lit ? 1.0 + brightness * 0.3 : 1);
    }
  }
}

/* 포인터 조작 */
const rc=new THREE.Raycaster(),pl=new THREE.Plane(new THREE.Vector3(0,1,0),-.015),v2=new THREE.Vector2();
function wp(e){
  v2.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);
  rc.setFromCamera(v2,camera);
  const t=new THREE.Vector3();
  return rc.ray.intersectPlane(pl,t)?t:null;
}
function segDist(px,pz,p){
  const ax=p.x[0],az=p.z[0],bx=p.x[1],bz=p.z[1],dx=bx-ax,dz=bz-az;
  const l2=dx*dx+dz*dz||1e-9;
  let t=((px-ax)*dx+(pz-az)*dz)/l2;t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-ax-t*dx,pz-az-t*dz);
}

let drag=null,orbit=false,moved=false,down={x:0,y:0},activePointer=null;

/* 화면 줌 제어 */
let isPinching = false;

cv.addEventListener('wheel', e => {
  e.preventDefault();
  dist = Math.max(5, Math.min(40, dist + e.deltaY * 0.02));
  updateCam();
}, { passive: false });

let pinchDist = 0;
let pinchStartCamDist = 15;
cv.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    isPinching = true;
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchDist = Math.hypot(dx, dy);
    pinchStartCamDist = dist;
  }
}, { passive: false });

cv.addEventListener('touchmove', e => {
  if (e.touches.length === 2 && pinchDist > 0) {
    e.preventDefault();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const currentDist = Math.hypot(dx, dy);
    dist = Math.max(5, Math.min(40, pinchStartCamDist * (pinchDist / currentDist)));
    updateCam();
  }
}, { passive: false });

cv.addEventListener('touchend', e => {
  if (e.touches.length < 2) {
    isPinching = false;
    pinchDist = 0;
  }
});

cv.addEventListener('contextmenu',e=>e.preventDefault());

cv.addEventListener('pointerdown',e=>{
  if(e.target!==cv || draggingType) return;
  activePointer=e.pointerId;
  cv.setPointerCapture?.(e.pointerId);
  moved=false;down={x:e.clientX,y:e.clientY};
  const w=wp(e);
  if(!w){orbit=true;return;}

  let best=.55,hit=null;
  parts.forEach(p=>[0,1].forEach(i=>{
    const d=Math.hypot(w.x-p.x[i],w.z-p.z[i]);
    if(d<best){best=d;hit=[p,i];}
  }));
  if(hit){
    const hx=hit[0].x[hit[1]],hz=hit[0].z[hit[1]];
    const list=[];
    parts.forEach(p=>[0,1].forEach(i=>{
      if(Math.hypot(p.x[i]-hx,p.z[i]-hz)<.05)list.push([p,i]);
    }));
    drag={kind:'joint',list,ox:w.x-hx,oz:w.z-hz};
    select(null);return;
  }
  for(let k=parts.length-1;k>=0;k--){
    const p=parts[k];
    if(segDist(w.x,w.z,p)<.48){
      drag={kind:'part',p,sx:w.x,sz:w.z,x0:p.x.slice(),z0:p.z.slice()};
      return;
    }
  }
  orbit=true;
});

cv.addEventListener('pointermove',e=>{
  if (isPinching) return;
  if(activePointer!==null && e.pointerId!==activePointer)return;
  if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>5)moved=true;
  if(orbit){
    yaw-=(e.movementX||0)*.005;
    pitch=Math.max(.25,Math.min(1.42,pitch+(e.movementY||0)*.005));
    updateCam();return;
  }
  if(!drag||!moved)return;
  const tr=document.querySelector('#trash'),r=tr.getBoundingClientRect();
  tr.classList.toggle('over',e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom);
  const w=wp(e);if(!w)return;
  if(drag.kind==='joint'){
    drag.list.forEach(([p,i])=>{p.x[i]=w.x-drag.ox;p.z[i]=w.z-drag.oz;});
  }else{
    const p=drag.p,dx=w.x-drag.sx,dz=w.z-drag.sz;
    for(let i=0;i<2;i++){p.x[i]=drag.x0[i]+dx;p.z[i]=drag.z0[i]+dz;}
  }
});

function magnetSnap(){
  const SNAP_RADIUS=.72;
  parts.forEach(p=>{
    for(let i=0;i<2;i++){
      const x=p.x[i],z=p.z[i];
      let best=SNAP_RADIUS,target=null;
      parts.forEach(q=>{
        if(q===p)return;
        for(let j=0;j<2;j++){
          const d=Math.hypot(x-q.x[j],z-q.z[j]);
          if(d<best){best=d;target=[q,j];}
        }
      });
      if(target){p.x[i]=target[0].x[target[1]];p.z[i]=target[0].z[target[1]];}
    }
  });
}

function finishCanvasPointer(e){
  if(activePointer!==null && e.pointerId!==activePointer)return;
  const trash=document.querySelector('#trash');
  const overTrash=trash&&e.clientX>=trash.getBoundingClientRect().left&&e.clientX<=trash.getBoundingClientRect().right&&
    e.clientY>=trash.getBoundingClientRect().top&&e.clientY<=trash.getBoundingClientRect().bottom;
  if(drag&&drag.kind==='part'&&moved&&overTrash){
    removePart(drag.p);
    trash.classList.remove('over');
  }else{
    if(drag&&moved)magnetSnap();
    if(!moved){
      if(drag&&drag.kind==='part'){
        if(drag.p.type==='sw'){ drag.p.open=!drag.p.open; select(null); }
        else if(['resist','bulb','batt'].includes(drag.p.type)) select(drag.p);
      }
      else if(!drag)select(null);
    }
  }
  drag=null;orbit=false;activePointer=null;
}
cv.addEventListener('pointerup',finishCanvasPointer);
cv.addEventListener('pointercancel',finishCanvasPointer);
cv.addEventListener('pointerleave',()=>{if(!drag)$('#trash').classList.remove('over');});

/* 팔레트 상호작용 */
const pal=$('#palette');
const ghost=$('#dragGhost');
let draggingType=null,dragPointerId=null;
let palPending=null; // 터치 시작 후 아직 '스크롤'/'드래그'가 결정되지 않은 상태
function moveGhost(x,y){
  ghost.style.left=x+'px';ghost.style.top=y+'px';
}
function startPaletteDrag(k,e){
  const hintEl = document.getElementById('hint');
  if(hintEl) hintEl.style.opacity = '0';
  draggingType=k;dragPointerId=e.pointerId;
  ghost.innerHTML='<b>'+TYPES[k].ic+'</b>'+TYPES[k].n;
  ghost.style.display='block';
  moveGhost(e.clientX,e.clientY);
}
Object.keys(TYPES).forEach(k=>{
  const b=document.createElement('button');
  b.type='button';b.className='pbtn';
  b.innerHTML='<b>'+TYPES[k].ic+'</b>'+TYPES[k].n;
  b.addEventListener('pointerdown',e=>{
    e.preventDefault();e.stopPropagation();
    if(e.pointerType==='mouse'){
      startPaletteDrag(k,e);
    }else{
      /* 터치/펜: 위아래로 움직이면 목록 스크롤, 오른쪽(화면 쪽)으로 끌면 부품 드래그 */
      palPending={k,id:e.pointerId,sx:e.clientX,sy:e.clientY,sc:pal.scrollTop,mode:null};
    }
  });
  pal.insertBefore(b,$('#trash'));
});

window.addEventListener('pointermove',e=>{
  /* 터치: 스크롤/드래그 판별 */
  if(palPending && e.pointerId===palPending.id){
    const P=palPending;
    const dx=e.clientX-P.sx, dy=e.clientY-P.sy;
    const r=pal.getBoundingClientRect();
    const outside=e.clientX>r.right+6||e.clientX<r.left-6||e.clientY<r.top-30||e.clientY>r.bottom+30;
    const canScroll=pal.scrollHeight>pal.clientHeight+2;

    if(!P.mode){
      if(Math.hypot(dx,dy)<8 && !outside) return;
      if(outside || !canScroll || Math.abs(dx)>Math.abs(dy)) P.mode='drag';
      else P.mode='scroll';
    }
    if(P.mode==='drag'){
      const k=P.k;
      palPending=null;
      startPaletteDrag(k,e);
      return;
    }
    if(P.mode==='scroll'){
      pal.scrollTop=P.sc-dy;
      /* 스크롤 중 팔레트 밖으로 벗어나면 부품 드래그로 전환 */
      if(e.clientX>r.right+6){
        const k=P.k;
        palPending=null;
        startPaletteDrag(k,e);
      }
    }
    return;
  }
  if(!draggingType||e.pointerId!==dragPointerId)return;
  moveGhost(e.clientX,e.clientY);
});

window.addEventListener('pointerup',e=>{
  if(palPending && e.pointerId===palPending.id){ palPending=null; return; }
  if(!draggingType||e.pointerId!==dragPointerId)return;
  const type=draggingType;
  ghost.style.display='none';
  const paletteRect=pal.getBoundingClientRect();
  const insidePalette=e.clientX>=paletteRect.left&&e.clientX<=paletteRect.right&&
    e.clientY>=paletteRect.top&&e.clientY<=paletteRect.bottom;
  const w=wp(e);
  if(!insidePalette&&w&&Math.abs(w.x)<=7.8&&Math.abs(w.z)<=4.55){
    const half=isMeter(type)?1.0:.85;
    const p=addPart(type,w.x-half,w.z,w.x+half,w.z);
    select(p);
  }
  draggingType=null;dragPointerId=null;
});
window.addEventListener('pointercancel',()=>{
  palPending=null;
  draggingType=null;dragPointerId=null;ghost.style.display='none';
});

$('#bRst').onclick=()=>{while(parts.length)removePart(parts[0]);select(null)};
$('#bCam').onclick=()=>{yaw=0;pitch=.85;dist=14;updateCam()};

$('#bEx').onclick=()=>{
  $('#bRst').click();
  addPart('batt',-2.5,-1.5,-0.5,-1.5);
  addPart('bulb',-0.5,-1.5,1.5,-1.5);
  addPart('wire',1.5,-1.5,1.5,1.5);
  addPart('wire',1.5,1.5,-2.5,1.5);
  addPart('wire',-2.5,1.5,-2.5,-1.5);
};

/* 메인 렌더 루프 */
function frame(){
  requestAnimationFrame(frame);
  simulate();
  parts.forEach(updatePart);

  const shortBatteries = parts.filter(p => p.type === 'batt' && p.isShort);
  updateFireAnimation(shortBatteries);

  if(sel&&parts.includes(sel)){
    const mx=(sel.x[0]+sel.x[1])/2,mz=(sel.z[0]+sel.z[1])/2;
    const v=new THREE.Vector3(mx,.08,mz).project(camera);
    const sx=(v.x*.5+.5)*innerWidth,sy=(-v.y*.5+.5)*innerHeight;
    pop.style.left=Math.max(10,Math.min(innerWidth-230,sx-110))+'px';
    pop.style.top=Math.max(10,Math.min(innerHeight-200,sy+35))+'px';
  }
  renderer.render(scene,camera);
}

$('#bCam').click();
frame();
</script>
