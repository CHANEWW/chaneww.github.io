<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>플랑크 상수 측정 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        @font-face {
            font-family: 'SeoulNamsan';
            src: local('SeoulNamsan M'), local('SeoulNamsanM'), local('서울남산체 M'),
                 url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --glass-bg: rgba(255, 255, 255, 0.72);
            --glass-border: rgba(255, 255, 255, 0.45);
            --glass-blur: blur(20px) saturate(180%);
            --text-color: #1c1c1e;
            --card-radius: 20px;
        }

        body.dark-mode {
            --glass-bg: rgba(30, 30, 35, 0.75);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-color: #f2f2f7;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            font-family: 'SeoulNamsan', -apple-system, sans-serif;
            background-color: #f2f2f7;
            color: var(--text-color);
            transition: background-color 0.4s ease;
        }

        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--card-radius);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            z-index: 10;
            transition: all 0.3s ease;
        }

        .top-left-bar { position: absolute; top: 20px; left: 20px; display: flex; gap: 12px; z-index: 10; }
        .back-btn { padding: 10px 18px; color: var(--text-color); text-decoration: none; font-weight: bold; font-size: 14px; cursor: pointer; }
        .tag-badge { padding: 10px 16px; font-weight: bold; font-size: 14px; }
        .tag-pill { background: #007aff; color: white; padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-left: 6px; }

        .top-right-bar { position: absolute; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; z-index: 10; }
        .data-card { padding: 18px 24px; min-width: 250px; display: flex; flex-direction: column; gap: 12px; }
        .data-label { font-size: 13px; font-weight: bold; opacity: 0.8; }
        
        .voltmeter-display {
            font-size: 52px;
            font-weight: 800;
            font-family: 'SF Mono', Consolas, monospace;
            text-align: center;
            color: #ff3b30;
            text-shadow: 0 0 15px rgba(255, 59, 48, 0.4);
            margin: 5px 0;
            letter-spacing: -1px;
        }

        .icon-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; border: none; border-radius: 50%; color: var(--text-color); }
        .center-tooltip { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); padding: 10px 22px; font-size: 13px; font-weight: bold; pointer-events: none; }

        .sub-panel {
            position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
            padding: 20px 30px; display: flex; flex-direction: column; gap: 18px;
            width: 90%; max-width: 480px; z-index: 10;
        }
        .control-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: bold; }
        
        .btn-group { display: flex; gap: 8px; }
        .color-btn {
            padding: 8px 18px; border-radius: 12px; border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.4); font-weight: bold; cursor: pointer; transition: 0.2s;
            color: var(--text-color);
        }
        .color-btn.active[data-color="red"] { background: #ff3b30; color: white; border-color: #ff3b30; }
        .color-btn.active[data-color="green"] { background: #34c759; color: white; border-color: #34c759; }
        .color-btn.active[data-color="blue"] { background: #007aff; color: white; border-color: #007aff; }

        input[type=range] { width: 220px; cursor: pointer; accent-color: #007aff; }

        .bottom-control-bar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; padding: 6px; border-radius: 30px; z-index: 10; }
        .control-tab-btn { padding: 10px 18px; border: none; background: transparent; color: var(--text-color); font-size: 13px; font-weight: bold; border-radius: 20px; cursor: pointer; transition: 0.2s; }
        .control-tab-btn:hover { background: rgba(0,0,0,0.05); }
        .control-tab-btn.active { background: #007aff; color: #fff; }
    
        /* Bottom Right Bar (Fullscreen) */
        .bottom-right-bar {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }
        button.back-btn, button.tag-badge {
            font-family: inherit;
            border: none;
        }
        @media (max-width: 768px) {
            .bottom-right-bar {
                bottom: 15px;
                right: 15px;
            }
        }
    













/* @@MOBILE-BASE v1@@ */
/* ============================================================
   모바일 반응형 보정 (세로/가로) — 자동 생성 블록
   ============================================================ */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
img, canvas { max-width: 100%; }

/* ---------- 모바일 세로 (폭 900px 이하) ---------- */
@media (max-width: 900px) {
    /* 1행: [메인][제목]  ...  [전체화면 아이콘] */
    .top-left-bar {
        top: max(8px, env(safe-area-inset-top)) !important;
        left: 8px !important;
        right: 56px !important;
        gap: 6px !important;
        flex-wrap: nowrap !important;
        align-items: center !important;
        overflow: hidden;
    }
    .top-left-bar .back-btn,
    .top-left-bar > a {
        flex: 0 0 auto;
        padding: 6px 10px !important;
        font-size: 12px !important;
        gap: 4px !important;
        white-space: nowrap;
    }
    .top-left-bar .tag-badge {
        flex: 0 1 auto;
        min-width: 0;
        padding: 6px 10px !important;
        font-size: 12px !important;
        gap: 5px !important;
        white-space: nowrap;
        overflow: hidden;
    }
    .top-left-bar .tag-badge > span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .tag-pill { font-size: 9px !important; padding: 1px 6px !important; flex: 0 0 auto; }

    /* 2행: [데이터 카드 .............][테마] */
    .top-right-bar {
        top: calc(max(8px, env(safe-area-inset-top)) + 40px) !important;
        left: 8px !important;
        right: 8px !important;
        gap: 6px !important;
        justify-content: flex-end !important;
        flex-wrap: nowrap !important;
    }
    .data-card {
        flex: 1 1 0%;
        min-width: 0;
        gap: 4px !important;
        padding: 6px 8px !important;
        justify-content: space-around !important;
        overflow: hidden;
    }
    .data-card { flex-direction: row !important; align-items: center !important; flex-wrap: nowrap !important; }
    .data-item { min-width: 0; flex-direction: column !important; align-items: center !important; gap: 0 !important; }
    .data-item > * { white-space: nowrap; }
    .voltmeter-display { font-size: 24px !important; }
    .data-label { font-size: 9px !important; white-space: nowrap; line-height: 1.2; }
    .data-value { font-size: 12.5px !important; white-space: nowrap; line-height: 1.25; }
    .icon-btn { width: 34px !important; height: 34px !important; min-width: 34px; font-size: 15px !important; flex: 0 0 auto; }

    /* 전체화면: 1행 우측 아이콘 버튼 (글자는 숨김) */
    .bottom-right-bar {
        top: max(8px, env(safe-area-inset-top)) !important;
        bottom: auto !important;
        right: 8px !important;
        left: auto !important;
        z-index: 20;
    }
    .bottom-right-bar button,
    .bottom-right-bar .back-btn {
        padding: 6px 9px !important;
        font-size: 14px !important;
        gap: 4px !important;
        line-height: 1;
    }
    .bottom-right-bar #fullscreenText,
    .bottom-right-bar .fs-text { display: none !important; }

    /* 안내 문구 */
    .center-tooltip, #guide-tooltip {
        top: calc(max(8px, env(safe-area-inset-top)) + 88px) !important;
        left: 8px !important;
        right: 8px !important;
        transform: none !important;
        margin: 0 auto;
        width: auto !important;
        max-width: none !important;
        font-size: 11.5px !important;
        padding: 7px 12px !important;
        white-space: normal !important;
        line-height: 1.45;
        text-align: center;
        z-index: 15 !important;
    }

    /* 하단 컨트롤 바: 화면 폭 전체, 한 줄 유지 */
    .bottom-control-bar {
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        transform: none !important;
        width: 100% !important;
        border-radius: 18px 18px 0 0 !important;
        padding: 6px 6px calc(6px + env(safe-area-inset-bottom)) !important;
        gap: 2px !important;
        justify-content: space-around !important;
        flex-wrap: nowrap !important;
        overflow: visible;
    }
    .control-tab-btn {
        flex: 1 1 0 !important;
        min-width: 0 !important;
        padding: 5px 2px !important;
        font-size: 10.5px !important;
        gap: 1px !important;
        border-radius: 12px !important;
        white-space: nowrap !important;
        line-height: 1.15;
    }
    .control-tab-btn span { white-space: nowrap !important; }
    .control-tab-btn span:first-child { font-size: 15px !important; line-height: 1.1; }

    /* 슬라이더 등 서브 패널 */
    .sub-panel {
        left: 8px !important;
        right: 8px !important;
        bottom: calc(76px + env(safe-area-inset-bottom)) !important;
        transform: none !important;
        width: auto !important;
        max-width: none !important;
        max-height: 46vh;
        overflow-y: auto;
        padding: 13px 14px !important;
        gap: 10px !important;
        -webkit-overflow-scrolling: touch;
    }
    .sub-panel-title { font-size: 11px !important; }
    .slider-header { font-size: 11px !important; }
    .control-row { gap: 5px !important; flex-wrap: wrap; }
    .toggle-btn, .mode-btn, .quick-btn, .example-item, .preset-btn { font-size: 11px !important; }
    input[type="range"] { height: 22px; }

    /* 팝업(모달)이 화면을 넘지 않도록 */
    .modal-overlay { padding: 12px !important; align-items: center !important; }
    .modal-card {
        max-height: 88vh !important;
        overflow-y: auto !important;
        width: auto !important;
        max-width: 100% !important;
        padding: 16px !important;
        -webkit-overflow-scrolling: touch;
    }
    .modal-title { font-size: 15px !important; }
    .modal-body { font-size: 12px !important; }
    .example-title { font-size: 11.5px !important; }
    .example-desc { font-size: 11px !important; line-height: 1.5 !important; }
}

@media (max-width: 430px) {
    /* 아주 좁은 화면에서는 장식용 배지를 숨겨 제목 자리를 확보 */
    .tag-pill { display: none !important; }
}

/* ---------- 모바일 가로 (높이 500px 이하) ---------- */
@media (max-height: 500px) and (orientation: landscape) {
    .top-left-bar {
        top: max(6px, env(safe-area-inset-top)) !important;
        left: 6px !important;
        right: auto !important;
        max-width: 46vw;
        gap: 5px !important;
    }
    .top-left-bar .back-btn,
    .top-left-bar > a,
    .top-left-bar .tag-badge {
        padding: 4px 9px !important;
        font-size: 11px !important;
        height: 30px;
    }
    .tag-pill { display: none !important; }

    .top-right-bar {
        top: max(6px, env(safe-area-inset-top)) !important;
        right: 88px !important;
        left: auto !important;
        gap: 5px !important;
    }
    .data-card { padding: 4px 9px !important; gap: 9px !important; flex: 0 0 auto; }
    .data-label { font-size: 8.5px !important; }
    .data-value { font-size: 11.5px !important; }
    .icon-btn { width: 28px !important; height: 28px !important; min-width: 28px; font-size: 13px !important; }

    .bottom-right-bar {
        top: max(6px, env(safe-area-inset-top)) !important;
        bottom: auto !important;
        right: 6px !important;
        z-index: 20;
    }
    .bottom-right-bar button,
    .bottom-right-bar .back-btn { padding: 4px 8px !important; font-size: 13px !important; }
    .bottom-right-bar #fullscreenText,
    .bottom-right-bar .fs-text { display: none !important; }

    .center-tooltip, #guide-tooltip {
        top: auto !important;
        bottom: 56px !important;
        left: 50% !important;
        right: auto !important;
        transform: translateX(-50%) !important;
        width: max-content !important;
        max-width: 44vw !important;
        font-size: 10px !important;
        padding: 4px 9px !important;
        line-height: 1.3;
    }

    /* 가로 모드에서 각종 패널을 구석으로 모아 3D 화면을 가리지 않게 한다 */
    .side-panel { top: 44px !important; right: 8px !important; left: auto !important; width: 214px !important; padding: 7px 9px !important; gap: 4px !important; }
    .side-title { font-size: 10.5px !important; }
    .side-scale { font-size: 8.5px !important; }
    .meter-panel { left: 8px !important; bottom: 40px !important; top: auto !important; width: 190px !important; padding: 6px 8px !important; gap: 3px !important; }
    .meter-title { font-size: 9.5px !important; }
    .action-panel { top: auto !important; bottom: 40px !important; right: 8px !important; left: auto !important; grid-template-columns: repeat(2, 44px) !important; gap: 4px !important; }
    .side-btn { width: 44px !important; height: 44px !important; font-size: 8.5px !important; border-radius: 12px !important; gap: 1px !important; }
    .energy-panel { left: 8px !important; bottom: 40px !important; top: auto !important; width: 176px !important; padding: 6px 8px !important; gap: 4px !important; }
    .energy-title, .panel-note { font-size: 9px !important; line-height: 1.3 !important; }
    .info-panel { right: 8px !important; bottom: 40px !important; top: auto !important; min-width: 128px !important; padding: 6px 8px !important; gap: 2px !important; }
    .info-row { font-size: 9.5px !important; gap: 8px !important; }
    .view-panel { left: 8px !important; bottom: 40px !important; top: auto !important; padding: 6px 8px !important; }
    .phase-panel { left: 8px !important; bottom: 40px !important; top: auto !important; padding: 6px 8px !important; }
    .graph-panel { max-height: 40vh; width: 182px !important; }
    .legend, .panel-note { font-size: 9px !important; }

    .bottom-control-bar {
        left: 50% !important;
        right: auto !important;
        bottom: 4px !important;
        transform: translateX(-50%) !important;
        width: auto !important;
        max-width: calc(100vw - 12px);
        border-radius: 14px !important;
        padding: 4px 8px !important;
        gap: 3px !important;
    }
    .control-tab-btn {
        flex: 0 0 auto !important;
        min-width: 46px !important;
        padding: 3px 7px !important;
        font-size: 10px !important;
        gap: 0 !important;
    }
    .control-tab-btn span:first-child { font-size: 13px !important; }

    .sub-panel {
        left: 50% !important;
        right: auto !important;
        bottom: 96px !important;
        transform: translateX(-50%) !important;
        width: min(400px, calc(100vw - 24px)) !important;
        max-width: min(400px, calc(100vw - 24px)) !important;
        max-height: 62vh;
        overflow-y: auto;
        padding: 9px 12px !important;
        gap: 6px !important;
    }
    .sub-panel .slider-row { gap: 3px !important; }
    .slider-header { font-size: 10.5px !important; }

    .modal-overlay { padding: 8px !important; }
    .modal-card {
        max-height: 94vh !important;
        overflow-y: auto !important;
        width: auto !important;
        max-width: min(460px, 96vw) !important;
        padding: 12px 14px !important;
    }
    .modal-title { font-size: 14px !important; }
    .modal-body { font-size: 11.5px !important; }
    .example-desc { font-size: 11px !important; line-height: 1.45 !important; }
}

/* ---------- 몰입(의사 전체화면) 모드 ---------- */
html.pseudo-fs .top-left-bar .tag-badge,
html.pseudo-fs .top-right-bar,
html.pseudo-fs .center-tooltip,
html.pseudo-fs #guide-tooltip { display: none !important; }
html.pseudo-fs .top-left-bar { right: 56px !important; }
html.pseudo-fs #fullscreenBtn,
html.pseudo-fs .bottom-right-bar { display: flex !important; }

/* ---------- 전체화면 시 캔버스 채움 ---------- */
body.is-fullscreen #canvas-container,
body.is-fullscreen #webgl-container { width: 100vw !important; height: 100vh !important; }


@media (max-width: 900px) and (min-height: 501px) {
    #guide-tooltip { top: calc(max(8px, env(safe-area-inset-top)) + 130px) !important; }
    .data-card { font-size: 11px !important; }
    .data-label { font-size: 9px !important; }
    .color-btn { font-size: 11px !important; padding: 5px 10px !important; }
    .btn-group { gap: 4px !important; }
}

</style>

</head>
<body>

    <div id="canvas-container"></div>

    <div class="top-left-bar">
        <a href="/index.html" class="glass-panel back-btn">⬅ 메인</a>
        <div class="glass-panel tag-badge">플랑크 상수 측정 3D<span class="tag-pill">visionOS</span></div>
    </div>

    <div class="top-right-bar">
        <div class="glass-panel data-card">
            <span class="data-label">전압센서 (LED 양단 전압)</span>
            <div class="voltmeter-display" id="ui-voltmeter">0.0 V</div>
            <div style="display: flex; justify-content: space-between; font-size: 12px; opacity: 0.7; font-weight: bold;">
                <span>상태: <span id="ui-led-status">소등</span></span>
                <span>회로 저항: 1200 Ω</span>
            </div>
        </div>
        <button class="icon-btn glass-panel" id="theme-toggle">🌙</button>
    </div>

    <div class="glass-panel center-tooltip" id="guide-tooltip">
        💡 전압을 천천히 높여 LED에 불이 켜지는 순간의 전압(문턱 전압)을 측정하세요.
    </div>

    <div class="glass-panel sub-panel" id="physics-panel">
        <div class="control-row">
            <span>LED 색상 (파장 선택)</span>
            <div class="btn-group">
                <button class="color-btn active" data-color="red">Red</button>
                <button class="color-btn" data-color="green">Green</button>
                <button class="color-btn" data-color="blue">Blue</button>
            </div>
        </div>
        <div class="control-row">
            <span>전원장치 전압 조절</span>
            <div style="display: flex; align-items: center; gap: 10px;">
                <input type="range" id="sld-voltage" min="0" max="4.0" step="0.1" value="0">
                <span id="txt-source-voltage" style="width: 45px; text-align: right; color: #007aff;">0.0 V</span>
            </div>
        </div>
    </div>

    <div class="glass-panel bottom-control-bar">
        <button class="control-tab-btn" id="btn-toggle-electron">⚡ 전자 흐름 보기</button>
        <button class="control-tab-btn" id="btn-align">📷 시점정렬</button>
    </div>

    
    <!-- Fullscreen / Windowed Mode Button -->
    <div class="bottom-right-bar">
        <button id="fullscreenBtn" class="glass-panel back-btn">
            <span id="fullscreenIcon">⛶</span>
            <span id="fullscreenText">전체화면</span>
        </button>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf2f2f7);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3.5, 6.0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0.5, 0.5, 0);
        controls.maxPolarAngle = Math.PI / 2 - 0.05;

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(5, 10, 4);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(25, 25), new THREE.MeshStandardMaterial({ color: 0xe5e5ea, roughness: 0.8 }));
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const ledParams = {
            'red': { vth: 1.9, color: 0xff3b30, hex: '#ff3b30' },
            'green': { vth: 2.3, color: 0x34c759, hex: '#34c759' },
            'blue': { vth: 2.7, color: 0x007aff, hex: '#007aff' }
        };
        let currentLed = 'red';
        let sourceVoltage = 0.0;
        const RESISTANCE = 1200;
        let showElectrons = false;

        const circuitGroup = new THREE.Group();
        scene.add(circuitGroup);

        function addMesh(geo, mat, x, y, z) {
            const m = new THREE.Mesh(geo, mat);

        addMesh(new THREE.CylinderGeometry(0.06, 0.06, 0.1), new THREE.MeshStandardMaterial({ color: 0xff3b30 }), -2.5, 0.85, -0.4);

        function createResistorTexture() {
            const cvs = document.createElement('canvas'); cvs.width = 128; cvs.height = 512;
            const ctx = cvs.getContext('2d');
            ctx.fillStyle = '#e3c99a'; ctx.fillRect(0, 0, 128, 512);   // 베이지 바탕
            ctx.fillStyle = '#7b3f00'; ctx.fillRect(0, 70, 128, 36);   // 갈색 (1)
            ctx.fillStyle = '#e02020'; ctx.fillRect(0, 126, 128, 36);  // 빨강 (2)
            ctx.fillStyle = '#e02020'; ctx.fillRect(0, 182, 128, 36);  // 빨강 (x100)
            ctx.fillStyle = '#d4af37'; ctx.fillRect(0, 400, 128, 36);  // 금색 (±5%)
            return new THREE.CanvasTexture(cvs);
        }
        const resMat = new THREE.MeshStandardMaterial({ map: createResistorTexture(), roughness: 0.9 });
        const resistor = addMesh(new THREE.CylinderGeometry(0.06, 0.06, 0.42, 24), resMat, 0, 0.2, -1.2);
        resistor.rotation.z = Math.PI / 2;
        addMesh(new THREE.CylinderGeometry(0.015, 0.015, 1.6, 8), new THREE.MeshStandardMaterial({ color: 0x999999, metalness:0.8 }), 0, 0.2, -1.2).rotation.z = Math.PI/2; 

        // (3) LED (우측) - 리드선 하단 끝을 전선과 연결
        const ledGroup = new THREE.Group();
        ledGroup.position.set(3.5, 0.4, 0);
        circuitGroup.add(ledGroup);

        const ledHeadMat = new THREE.MeshPhysicalMaterial({
            color: ledParams.red.color, opacity: 0.7, transparent: true,
            roughness: 0.15, emissive: ledParams.red.color, emissiveIntensity: 0
        });
        const ledHead = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.3, 32), ledHeadMat);
        const ledDome = new THREE.Mesh(new THREE.SphereGeometry(0.2, 32, 16, 0, Math.PI*2, 0, Math.PI/2), ledHeadMat);
        ledDome.position.y = 0.15;

        ledHead.position.y = 0.3;
        ledGroup.add(ledHead);
        
        const ledLight = new THREE.PointLight(ledParams.red.color, 0, 6.0);
        ledLight.position.y = 0.5;
        ledGroup.add(ledLight);

        // 발광 후광(글로우)
        function createGlowTexture() {
            const c = document.createElement('canvas'); c.width = c.height = 128;
            const g = c.getContext('2d');
            const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.3, 'rgba(255,255,255,0.45)');

            return new THREE.CanvasTexture(c);
        }
        const glowMat = new THREE.SpriteMaterial({
            map: createGlowTexture(), color: ledParams.red.color, transparent: true,

        });
        const ledGlow = new THREE.Sprite(glowMat);

        // 리드선 위쪽은 LED 머리 바닥(local y=0.15)에 닿고, 아래쪽은 전선 접속점까지 연장
        const anode = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.43), metalMat);
        anode.position.set(-0.08, -0.065, 0); ledGroup.add(anode);   // 월드 x=3.42, 바닥 y=0.12
        const cathode = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.37), metalMat);
        cathode.position.set(0.08, -0.035, 0); ledGroup.add(cathode); // 월드 x=3.58, 바닥 y=0.18

        const ANODE_B = [3.42, 0.26, 0];   // 전압센서 + 전선
        const CATH_A  = [3.58, 0.22, 0];   // 전원 - 전선
        const CATH_B  = [3.58, 0.32, 0];   // 전압센서 - 전선

        // (4) 전압센서 (3D 멀티미터 장비)

        meterBody.rotation.x = -Math.PI / 6;

        const vCanvas = document.createElement('canvas'); vCanvas.width = 512; vCanvas.height = 256;
        const vCtx = vCanvas.getContext('2d');

        function createWire(pts, color) {
            const curve = new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(...p)));
            const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 64, 0.018, 8, false), new THREE.MeshStandardMaterial({ color: color, roughness:0.5 }));
            circuitGroup.add(tube);

        }
        function addJoint(p, color) {
            const j = new THREE.Mesh(new THREE.SphereGeometry(0.04, 12, 12), new THREE.MeshStandardMaterial({ color: color, metalness: 0.3, roughness: 0.4 }));
            j.position.set(...p);

        }
        
        const wirePsuToRes = createWire([[-2.5, 0.9, -0.4], [-1.5, 0.2, -1.2], [-0.8, 0.2, -1.2]], 0xff3b30);
        const wireResToLed = createWire([[0.8, 0.2, -1.2], [2.0, 0.2, -0.5], ANODE_A], 0xff3b30);
        const wireLedToPsu = createWire([CATH_A, [1.5, 0.1, 0.8], [-2.5, 0.9, 0.4]], 0x1c1c1e);
        
        createWire([[0.2, 0.3, 1.4], [1.0, 0.1, 1.0], ANODE_B], 0xff3b30); 
        createWire([[0.8, 0.3, 1.4], [1.5, 0.1, 0.5], CATH_B], 0x1c1c1e); 
        addJoint(ANODE_A, 0xff3b30); addJoint(ANODE_B, 0xff3b30);
        addJoint(CATH_A, 0x1c1c1e);  addJoint(CATH_B, 0x1c1c1e);

        // --- 4. 자유 전자 흐름 파티클 (전원 - → LED 음극 → LED 양극 → 저항 → 전원 +) ---
        const pathPts = [];
        const pushCurve = (curve, reverse) => {
            const pts = curve.getPoints(40);
            if (reverse) pts.reverse();
            pts.forEach(p => pathPts.push(p));
        };
        pushCurve(wireLedToPsu, true);                              // 전원(-) → LED 음극
        pathPts.push(new THREE.Vector3(3.5, 0.62, 0));              // LED 내부 통과
        pushCurve(wireResToLed, true);                              // LED 양극 → 저항
        for (let i = 1; i <= 10; i++) pathPts.push(new THREE.Vector3(0.8 - 1.6 * i / 10, 0.2, -1.2)); // 저항 통과
        pushCurve(wirePsuToRes, true);                              // 저항 → 전원(+)
        const electronCurve = new THREE.CatmullRomCurve3(pathPts);
        const electrons = [];
        const eGeo = new THREE.SphereGeometry(0.045, 10, 10);
        const eMat = new THREE.MeshBasicMaterial({ color: 0x007aff });
        for(let i=0; i<36; i++) {
            const mesh = new THREE.Mesh(eGeo, eMat);
            mesh.visible = false;
            circuitGroup.add(mesh);
            electrons.push({ mesh: mesh, progress: i / 36 });
        }

        // --- 5. 이벤트 핸들러 ---
        const uiVoltMeter = document.getElementById('ui-voltmeter');
        const uiLedStatus = document.getElementById('ui-led-status');
        const sldVoltage = document.getElementById('sld-voltage');
        const txtSourceVol = document.getElementById('txt-source-voltage');
        const btnToggleElectron = document.getElementById('btn-toggle-electron');

        btnToggleElectron.addEventListener('click', () => {
            showElectrons = !showElectrons;
            btnToggleElectron.classList.toggle('active', showElectrons);
            btnToggleElectron.innerText = showElectrons ? '⚡ 전자 흐름 숨기기' : '⚡ 전자 흐름 보기';
            if (!showElectrons) electrons.forEach(e => e.mesh.visible = false);
        });

        sldVoltage.addEventListener('input', (e) => {
            sourceVoltage = parseFloat(e.target.value);
            txtSourceVol.innerText = sourceVoltage.toFixed(1) + ' V';
        });

        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                const target = e.target;
                target.classList.add('active');
                currentLed = target.dataset.color;
                
                const hexColor = ledParams[currentLed].color;
                ledHeadMat.color.setHex(hexColor);
                ledHeadMat.emissive.setHex(hexColor);
                ledLight.color.setHex(hexColor);
                glowMat.color.setHex(hexColor);

            });
        });

        document.getElementById('btn-align').addEventListener('click', () => {
            camera.position.set(0, 3.5, 6.0);
            controls.target.set(0.5, 0.5, 0);
        });

        document.getElementById('theme-toggle').addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            scene.background.setHex(isDark ? 0x121212 : 0xf2f2f7);
            floor.material.color.setHex(isDark ? 0x1c1c1e : 0xe5e5ea);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 6. 시뮬레이션 메인 연산 ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            const vth = ledParams[currentLed].vth;
            let v_led = 0;
            let current = 0;

            if (sourceVoltage <= vth) {
                v_led = sourceVoltage;
                current = 0;
            } else {
                v_led = vth + (sourceVoltage - vth) * 0.05; 
                current = (sourceVoltage - v_led) / RESISTANCE; 
            }

            const voltStr = v_led.toFixed(1);
            
            if (uiVoltMeter.innerText !== voltStr + ' V') {
                uiVoltMeter.innerText = voltStr + ' V';
                drawMeter3D(voltStr);
            }

            const isLit = current > 1e-9;
            uiLedStatus.innerText = isLit ? '빛 방출 중 💡' : '소등';
            
            // 밝기: 켜지는 순간부터 확실히 보이도록 기본 밝기 + 전류 비례
            const brightness = isLit ? Math.min(1.0, 0.45 + current * 1200) : 0;
            ledHeadMat.opacity = isLit ? 1.0 : 0.7;
            ledHeadMat.emissiveIntensity = brightness * 2.5;
            ledLight.intensity = brightness * 4.0;
            glowMat.opacity = brightness * 0.95;

        function updateFullscreenUI() {

            if (fullscreenIcon) fullscreenIcon.innerText = isFS ? '🗗' : '⛶';

        }

        if (fullscreenBtn) {

                try {

                        const req = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
                        if (req) req.call(document.documentElement);
                    } else {
                        const exit = document.exitFullscreen || document.webkitExitFullscreen;
                        if (exit) exit.call(document);
                    }
                } catch (err) {
                    console.error('전체화면 모드를 전환할 수 없습니다:', err);
                }
            });
        }

        document.addEventListener('fullscreenchange', updateFullscreenUI);
        document.addEventListener('webkitfullscreenchange', updateFullscreenUI);
    </script>

<script>
/* ============ 모바일 화면 재조정 + 전체화면 대체 동작 (자동 생성) ============ */
(function () {
    var docEl = document.documentElement;
    var btn = document.getElementById('fullscreenBtn');
    var icon = document.getElementById('fullscreenIcon');
    var text = document.getElementById('fullscreenText');

    function realFs() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement ||
                  document.mozFullScreenElement || document.msFullscreenElement);
    }
    function pseudo() { return docEl.classList.contains('pseudo-fs'); }
    function setUI() {
        var on = realFs() || pseudo();
        if (icon) icon.textContent = on ? '🗗' : '⛶';
        if (text) text.textContent = on ? '창모드' : '전체화면';
        if (btn) btn.setAttribute('aria-label', on ? '창모드로 전환' : '전체화면으로 전환');
        document.body.classList.toggle('is-fullscreen', on);
    }
    function toast(msg) {
        var t = document.getElementById('ux-toast');
        if (!t) {
            t = document.createElement('div');
            t.id = 'ux-toast';
            t.style.cssText = 'position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);' +
                'background:rgba(28,28,30,.88);color:#fff;font-size:12px;line-height:1.4;padding:9px 14px;border-radius:14px;' +
                'z-index:9999;max-width:86vw;text-align:center;pointer-events:none;transition:opacity .3s;' +
                'font-family:inherit;box-shadow:0 8px 24px rgba(0,0,0,.25)';
            document.body.appendChild(t);
        }
        t.textContent = msg;
        t.style.opacity = '1';
        clearTimeout(t._t);
        t._t = setTimeout(function () { t.style.opacity = '0'; }, 2600);
    }

    if (btn) {
        btn.addEventListener('click', function () {
            var wasReal = realFs();
            var wasPseudo = pseudo();
            setTimeout(function () {
                if (wasReal) { setUI(); return; }          // 진짜 전체화면에서 나온 경우
                if (wasPseudo) { docEl.classList.remove('pseudo-fs'); setUI(); return; }  // 몰입 모드 해제
                if (!realFs()) {                            // 전체화면 API가 동작하지 않는 환경
                    docEl.classList.add('pseudo-fs');
                    try { window.scrollTo(0, 1); } catch (e) {}
                    toast('이 브라우저는 전체화면을 지원하지 않아 상단 정보를 숨긴 몰입 모드로 표시합니다');
                }
                setUI();
            }, 380);
        }, false);
    }
    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
        document.addEventListener(ev, setUI);
    });

    /* 좁은 화면에서는 3D 장면이 잘리지 않도록 시야각을 넓혀 전체가 들어오게 한다 */
    function mobileFit() {
        try {
            if (typeof camera === 'undefined' || !camera || !camera.isPerspectiveCamera) return;
            if (!camera.userData) camera.userData = {};
            if (!camera.userData.baseFov) camera.userData.baseFov = camera.fov;
            var w = window.innerWidth, h = window.innerHeight, f = 1;
            var k = 0.62;
            var attr = document.documentElement.getAttribute('data-mzoom');
            if (attr) { var v = parseFloat(attr); if (!isNaN(v) && v > 0) k = v; }
            if (w < h) f = 1 + (1 - w / h) * k;
            else if (h <= 500) f = 1 + k * 0.16;
            camera.fov = Math.min(88, camera.userData.baseFov * f);
            camera.updateProjectionMatrix();
        } catch (e) {}
    }
    mobileFit();

    /* 화면 회전·주소창 변화·전체화면 전환 후 렌더러 크기 재계산 */
    var rt = null;
    function refit() {
        clearTimeout(rt);
        rt = setTimeout(function () {
            mobileFit();
            try { window.dispatchEvent(new Event('resize')); } catch (e) {}
        }, 240);
    }
    window.addEventListener('orientationchange', refit);
    window.addEventListener('pageshow', refit);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) refit(); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', refit);

    setUI();
})();
</script>
