<!DOCTYPE html>
<html lang="ko" data-mzoom="1.2">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>거리에 따른 빛의 세기 3D</title>
    <!-- Three.js & OrbitControls Libraries -->
    <script src="../../common/lib/three.min.js"></script>
    <script src="../../common/lib/OrbitControls.js"></script>
    <style>
        @font-face {
            font-family: 'SeoulNamsan';
            src: local('SeoulNamsan M'), local('SeoulNamsanM'), local('서울남산체 M'),
                 url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'SeoulNamsan', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #07090e;
            color: #ffffff;
            touch-action: none;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Light Mode Theme Styles */
        body.light-mode {
            background-color: #f2f4f8;
            color: #1c1c1e;
        }

        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* visionOS Glassmorphism Pill Base */
        .glass-pill {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 999px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            z-index: 10;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        body.light-mode .glass-pill {
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid rgba(0, 0, 0, 0.12);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        /* visionOS Glass Card Base */
        .glass-panel {
            background: rgba(25, 30, 45, 0.85);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.45);
            z-index: 10;
        }

        body.light-mode .glass-panel {
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(0, 0, 0, 0.15);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
            color: #1c1c1e;
        }

        /* Top Left Header Bar */
        .top-left-header {
            position: absolute;
            top: 18px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }
        /* <button> 태그에서도 <a> 태그(메인 버튼)와 동일한 폰트 적용 */
        button.back-btn {
            font-family: inherit;
        }
        body.light-mode .back-btn { color: #1c1c1e; }
        .back-btn:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.22);
        }

        .title-capsule {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 18px;
        }
        .title-text {
            font-size: 15px;
            font-weight: bold;
            letter-spacing: -0.3px;
        }
        .vision-badge {
            background: #007aff;
            color: #ffffff;
            font-size: 11px;
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 12px;
            letter-spacing: 0.3px;
        }

        /* Top Right Data Bar & Theme Switcher */
        .top-right-bar {
            position: absolute;
            top: 18px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 8px 20px;
        }
        .data-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }
        .data-label { color: rgba(255, 255, 255, 0.7); }
        body.light-mode .data-label { color: rgba(0, 0, 0, 0.6); }
        .data-val { font-size: 16px; font-weight: bold; }
        .data-val.highlight { color: #ffcc00; }
        body.light-mode .data-val.highlight { color: #d97706; }
        .unit { font-size: 12px; color: rgba(255, 255, 255, 0.8); }
        body.light-mode .unit { color: rgba(0, 0, 0, 0.7); }
        .data-divider {
            width: 1px;
            height: 16px;
            background: rgba(255, 255, 255, 0.25);
        }
        body.light-mode .data-divider { background: rgba(0, 0, 0, 0.15); }

        .theme-btn {
            background: transparent;
            border: none;
            font-size: 16px;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 50%;
            transition: transform 0.2s ease;
        }
        .theme-btn:hover { transform: scale(1.2); }

        /* Center Top Floating Tooltip */
        .center-tooltip {
            position: absolute;
            top: 72px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 22px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.95);
            pointer-events: none;
            white-space: nowrap;
        }
        body.light-mode .center-tooltip { color: #1c1c1e; }

        /* Bottom Center Control Bar */
        .bottom-control-bar {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
        }

        .control-tab-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 20px;
            border: none;
            background: transparent;
            color: inherit;
            font-size: 13px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease;
            white-space: nowrap;
        }
        .control-tab-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }
        body.light-mode .control-tab-btn:hover {
            background: rgba(0, 0, 0, 0.08);
        }

        /* Floating Sub-panel for Light Settings */
        .sub-panel { right: 20px;
            position: absolute;
            bottom: 84px;
            left: auto;
            transform: none;
            width: 300px;
            padding: 18px;
            display: none;
            flex-direction: column;
            gap: 14px;
        }
        .sub-panel.show { display: flex; }
        .sub-panel-title {
            font-size: 13px;
            font-weight: bold;
            color: #64d2ff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        body.light-mode .sub-panel-title { color: #007aff; }

        .btn-toggle {
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(0, 122, 255, 0.85);
            color: white;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-toggle:hover { background: rgba(0, 122, 255, 1); }
        .btn-toggle.off {
            background: rgba(235, 69, 89, 0.85);
        }
        .btn-toggle.off:hover { background: rgba(235, 69, 89, 1); }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
        }
        input[type=range] {
            width: 100%;
            height: 6px;
            accent-color: #007aff;
            cursor: pointer;
        }

        /* Bottom Right Fullscreen Floating Bar */
        .bottom-right-bar {
            position: absolute;
            bottom: 24px;
            right: 20px;
            z-index: 10;
        }

        @media (max-width: 768px) {
            .center-tooltip { display: none; }
            .top-left-header { top: 12px; left: 12px; }
            .top-right-bar { top: 12px; right: 12px; padding: 6px 14px; font-size: 12px; }
            .title-text { font-size: 13px; }
            .back-btn { padding: 6px 12px; font-size: 12px; }
            .bottom-control-bar { bottom: 16px; padding: 4px 8px; }
            .bottom-right-bar { bottom: 16px; right: 12px; }
        }
    

/* @@MOBILE-BASE v1@@ */
/* ============================================================
   모바일 반응형 보정 (세로/가로) — 자동 생성 블록
   ============================================================ */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
img, canvas { max-width: 100%; }

/* ---------- 모바일 세로 (폭 900px 이하) ---------- */
@media (max-width: 900px) {
    /* 1행: [메인][제목]  ...  [전체화면 아이콘] */
    .top-left-bar {
        top: max(8px, env(safe-area-inset-top)) !important;
        left: 8px !important;
        right: 56px !important;
        gap: 6px !important;
        flex-wrap: nowrap !important;
        align-items: center !important;
        overflow: hidden;
    }
    .top-left-bar .back-btn,
    .top-left-bar > a {
        flex: 0 0 auto;
        padding: 6px 10px !important;
        font-size: 12px !important;
        gap: 4px !important;
        white-space: nowrap;
    }
    .top-left-bar .tag-badge {
        flex: 0 1 auto;
        min-width: 0;
        padding: 6px 10px !important;
        font-size: 12px !important;
        gap: 5px !important;
        white-space: nowrap;
        overflow: hidden;
    }
    .top-left-bar .tag-badge > span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .tag-pill { font-size: 9px !important; padding: 1px 6px !important; flex: 0 0 auto; }

    /* 2행: [데이터 카드 .............][테마] */
    .top-right-bar {
        top: calc(max(8px, env(safe-area-inset-top)) + 40px) !important;
        left: 8px !important;
        right: 8px !important;
        gap: 6px !important;
        justify-content: flex-end !important;
        flex-wrap: nowrap !important;
    }
    .data-card {
        flex: 1 1 0%;
        min-width: 0;
        gap: 4px !important;
        padding: 6px 8px !important;
        justify-content: space-around !important;
        overflow: hidden;
    }
    .data-card { flex-direction: row !important; align-items: center !important; flex-wrap: nowrap !important; }
    .data-item { min-width: 0; flex-direction: column !important; align-items: center !important; gap: 0 !important; }
    .data-item > * { white-space: nowrap; }
    .voltmeter-display { font-size: 24px !important; }
    .data-label { font-size: 9px !important; white-space: nowrap; line-height: 1.2; }
    .data-value { font-size: 12.5px !important; white-space: nowrap; line-height: 1.25; }
    .icon-btn { width: 34px !important; height: 34px !important; min-width: 34px; font-size: 15px !important; flex: 0 0 auto; }

    /* 전체화면: 1행 우측 아이콘 버튼 (글자는 숨김) */
    .bottom-right-bar {
        top: max(8px, env(safe-area-inset-top)) !important;
        bottom: auto !important;
        right: 8px !important;
        left: auto !important;
        z-index: 20;
    }
    .bottom-right-bar button,
    .bottom-right-bar .back-btn {
        padding: 6px 9px !important;
        font-size: 14px !important;
        gap: 4px !important;
        line-height: 1;
    }
    .bottom-right-bar #fullscreenText,
    .bottom-right-bar .fs-text { display: none !important; }

    /* 안내 문구 */
    .center-tooltip, #guide-tooltip {
        top: calc(max(8px, env(safe-area-inset-top)) + 88px) !important;
        left: 8px !important;
        right: 8px !important;
        transform: none !important;
        margin: 0 auto;
        width: auto !important;
        max-width: none !important;
        font-size: 11.5px !important;
        padding: 7px 12px !important;
        white-space: normal !important;
        line-height: 1.45;
        text-align: center;
        z-index: 15 !important;
    }

    /* 하단 컨트롤 바: 화면 폭 전체, 한 줄 유지 */
    .bottom-control-bar {
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        transform: none !important;
        width: 100% !important;
        border-radius: 18px 18px 0 0 !important;
        padding: 6px 6px calc(6px + env(safe-area-inset-bottom)) !important;
        gap: 2px !important;
        justify-content: space-around !important;
        flex-wrap: nowrap !important;
        overflow: visible;
    }
    .control-tab-btn {
        flex: 1 1 0 !important;
        min-width: 0 !important;
        padding: 5px 2px !important;
        font-size: 10.5px !important;
        gap: 1px !important;
        border-radius: 12px !important;
        white-space: nowrap !important;
        line-height: 1.15;
    }
    .control-tab-btn span { white-space: nowrap !important; }
    .control-tab-btn span:first-child { font-size: 15px !important; line-height: 1.1; }

    /* 슬라이더 등 서브 패널 */
    .sub-panel {
        left: 8px !important;
        right: 8px !important;
        bottom: calc(76px + env(safe-area-inset-bottom)) !important;
        transform: none !important;
        width: auto !important;
        max-width: none !important;
        max-height: 46vh;
        overflow-y: auto;
        padding: 13px 14px !important;
        gap: 10px !important;
        -webkit-overflow-scrolling: touch;
    }
    .sub-panel-title { font-size: 11px !important; }
    .slider-header { font-size: 11px !important; }
    .control-row { gap: 5px !important; flex-wrap: wrap; }
    .toggle-btn, .mode-btn, .quick-btn, .example-item, .preset-btn { font-size: 11px !important; }
    input[type="range"] { height: 22px; }

    /* 팝업(모달)이 화면을 넘지 않도록 */
    .modal-overlay { padding: 12px !important; align-items: center !important; }
    .modal-card {
        max-height: 88vh !important;
        overflow-y: auto !important;
        width: auto !important;
        max-width: 100% !important;
        padding: 16px !important;
        -webkit-overflow-scrolling: touch;
    }
    .modal-title { font-size: 15px !important; }
    .modal-body { font-size: 12px !important; }
    .example-title { font-size: 11.5px !important; }
    .example-desc { font-size: 11px !important; line-height: 1.5 !important; }
}

@media (max-width: 430px) {
    /* 아주 좁은 화면에서는 장식용 배지를 숨겨 제목 자리를 확보 */
    .tag-pill { display: none !important; }
}

        }

        // 3D Table & Ruler (0m ~ 5m)
        function createTableAndRuler() {
            // Main Table Surface
            const tableGeo = new THREE.BoxGeometry(6.8, 0.16, 2.4);
            const tableMat = new THREE.MeshStandardMaterial({
                color: 0x161b26,
                roughness: 0.4,
                metalness: 0.2
            });
            tableMesh = new THREE.Mesh(tableGeo, tableMat);
            tableMesh.position.set(2.4, -0.08, 0);
            tableMesh.receiveShadow = true;
            scene.add(tableMesh);

            // Ruler Group
            rulerGroup = new THREE.Group();
            const rulerLength = 5.2; // meters
            const rulerGeo = new THREE.BoxGeometry(rulerLength, 0.015, 0.35);
            const rulerMat = new THREE.MeshStandardMaterial({ color: 0xe5e5ea, roughness: 0.3 });
            const rulerMesh = new THREE.Mesh(rulerGeo, rulerMat);
            rulerMesh.position.set(rulerLength / 2 - 0.1, 0.008, 0.55);
            rulerMesh.receiveShadow = true;
            rulerGroup.add(rulerMesh);

            // Ruler Tick Mark Sub-divisions (0.1m, 0.5m, 1.0m)
            for (let m = 0; m <= 50; m++) {
                let posM = m * 0.1;
                let isMajor = (m % 10 === 0);
                let isMedium = (m % 5 === 0);

                let lineLen = isMajor ? 0.22 : (isMedium ? 0.15 : 0.09);
                let lineThickness = isMajor ? 0.014 : 0.007;

                const lineGeo = new THREE.BoxGeometry(lineThickness, 0.018, lineLen);
                const lineMat = new THREE.MeshBasicMaterial({ color: isMajor ? 0xef4444 : (isMedium ? 0x1f2937 : 0x6b7280) });
                const line = new THREE.Mesh(lineGeo, lineMat);
                line.position.set(posM, 0.012, 0.55 + (0.28 - lineLen) / 2 - 0.08);
                rulerGroup.add(line);
            }

            scene.add(rulerGroup);
        }

        // Lux Meter Sensor (X = 0.0m, Sensor Dome facing Right +X)
        function createLuxMeter() {
            luxMeterGroup = new THREE.Group();
            luxMeterGroup.position.set(meterX, 0, 0);

            // Base Unit Body
            const bodyGeo = new THREE.BoxGeometry(0.32, 0.14, 0.44);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.4, metalness: 0.3 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.set(0, 0.07, 0);
            body.castShadow = true;
            luxMeterGroup.add(body);

            // Light Sensor Cylinder Head (Rotated -90deg Z so dome faces Right +X)
            const sensorBaseGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.1, 32);
            sensorBaseGeo.rotateZ(-Math.PI / 2);
            const sensorBaseMat = new THREE.MeshStandardMaterial({ color: 0x374151, roughness: 0.3 });
            const sensorBase = new THREE.Mesh(sensorBaseGeo, sensorBaseMat);
            sensorBase.position.set(0.18, 0.8, 0); // Height matching bulb (0.8m)
            luxMeterGroup.add(sensorBase);

            // Sensor White Photodome (Facing Right +X towards lamp)
            const domeGeo = new THREE.SphereGeometry(0.075, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
            domeGeo.rotateZ(Math.PI / 2); // Convex dome facing Right (+X)
            const domeMat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                roughness: 0.1,
                emissive: 0x444422,
                emissiveIntensity: 0.5
            });
            const dome = new THREE.Mesh(domeGeo, domeMat);
            dome.position.set(0.23, 0.8, 0);
            luxMeterGroup.add(dome);

            // Vertical Mounting Rod
            const poleGeo = new THREE.CylinderGeometry(0.018, 0.018, 0.72, 16);
            const poleMat = new THREE.MeshStandardMaterial({ color: 0x9ca3af, metalness: 0.8, roughness: 0.2 });
            const pole = new THREE.Mesh(poleGeo, poleMat);
            pole.position.set(0.12, 0.42, 0);
            luxMeterGroup.add(pole);

            // LCD Display Window
            const dispGeo = new THREE.PlaneGeometry(0.24, 0.14);
            dispGeo.rotateX(-Math.PI / 2);
            const dispMat = new THREE.MeshBasicMaterial({ color: 0x062814 });
            const disp = new THREE.Mesh(dispGeo, dispMat);
            disp.position.set(-0.02, 0.142, 0.08);
            luxMeterGroup.add(disp);

            scene.add(luxMeterGroup);
        }

        // Movable Stand Light (Facing Left -X towards Lux Meter)
        function createStandLight() {
            standGroup = new THREE.Group();
            standGroup.position.set(standX, 0, 0);

            // Stand Circular Base
            const baseGeo = new THREE.CylinderGeometry(0.22, 0.24, 0.05, 32);
            const baseMat = new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.3, metalness: 0.5 });
            const base = new THREE.Mesh(baseGeo, baseMat);
            base.position.y = 0.025;
            base.castShadow = true;
            standGroup.add(base);

            // Stand Pole
            const poleGeo = new THREE.CylinderGeometry(0.022, 0.022, 0.8, 16);
            const poleMat = new THREE.MeshStandardMaterial({ color: 0xd1d5db, metalness: 0.9, roughness: 0.1 });
            const pole = new THREE.Mesh(poleGeo, poleMat);
            pole.position.set(0, 0.42, 0);
            pole.castShadow = true;
            standGroup.add(pole);

            // Lamp Shade Cone (Facing Left -X towards Lux meter)
            const shadeGeo = new THREE.ConeGeometry(0.2, 0.26, 32, 1, true);
            shadeGeo.rotateZ(-Math.PI / 2); // Angle left towards -X
            const shadeMat = new THREE.MeshStandardMaterial({ color: 0x111827, side: THREE.DoubleSide, roughness: 0.3 });
            const shade = new THREE.Mesh(shadeGeo, shadeMat);
            shade.position.set(-0.1, 0.8, 0);
            shade.castShadow = true;
            standGroup.add(shade);

            // Illuminated Bulb Mesh
            const bulbGeo = new THREE.SphereGeometry(0.065, 16, 16);
            const bulbMat = new THREE.MeshBasicMaterial({ color: 0xfff4cc });
            bulbMesh = new THREE.Mesh(bulbGeo, bulbMat);
            bulbMesh.position.set(-0.13, 0.8, 0);
            standGroup.add(bulbMesh);

            // PointLight at Bulb
            pointLight = new THREE.PointLight(0xffea9f, 3, 10);
            pointLight.position.set(-0.15, 0.8, 0);
            pointLight.castShadow = true;
            standGroup.add(pointLight);

            // Light Ray Cone Visualizer
            // Geometry setup: Apex at (0,0,0) (bulb), base expanding outwards to Left (-X)
            const coneGeo = new THREE.ConeGeometry(0.35, 1.0, 32, 1, true);
            coneGeo.translate(0, -0.5, 0); // Apex at (0,0,0), base at (0, -1, 0)
            coneGeo.rotateZ(-Math.PI / 2); // Rotate so Apex is at (0,0,0) and Base extends to -X (Left)!

            const coneMat = new THREE.MeshBasicMaterial({
                color: 0xfffae6,
                transparent: true,
                opacity: 0.22,
                side: THREE.DoubleSide,
                depthWrite: false
            });
            lightCone = new THREE.Mesh(coneGeo, coneMat);
            lightCone.position.set(-0.15, 0.8, 0); // Local origin at bulb
            standGroup.add(lightCone);

            scene.add(standGroup);
        }

        // Inverse Square Law Physics Calculations ($E = \frac{I}{r^2}$)
        function updatePhysics() {
            // Distance r from Lux meter sensor (0m mark) to Stand X position
            let dist = Math.max(0.2, standGroup.position.x - meterX);

            let currentLux = 0;
            if (isPowerOn) {
                // E = (Base * PowerRatio) / r^2
                currentLux = (baseIntensity * (powerPercent / 100)) / (dist * dist);
                pointLight.intensity = (powerPercent / 100) * 3.5;
                bulbMesh.material.color.setHex(0xfff4cc);

                lightCone.visible = true;
                // Scale cone: X scale controls length to reach sensor, Y & Z scale control cone expansion radius
                lightCone.scale.set(dist, dist, dist);
                lightCone.material.opacity = Math.min(0.3, (powerPercent / 100) * 0.22);
            } else {
                currentLux = 0;
                pointLight.intensity = 0;
                bulbMesh.material.color.setHex(0x333333);
                lightCone.visible = false;
            }

            // Update Real-Time Data UI
            document.getElementById('distVal').innerText = dist.toFixed(2);
            document.getElementById('luxVal').innerText = currentLux.toFixed(1);
        }

        // Event Handling (Pointer Dragging, UI Panels, Theme, Fullscreen)
        function setupEvents() {
            window.addEventListener('resize', onWindowResize);

            const powerBtn = document.getElementById('powerBtn');
            const powerSlider = document.getElementById('powerSlider');
            const powerVal = document.getElementById('powerVal');
            const btnPowerPanel = document.getElementById('btnPowerPanel');
            const subPanel = document.getElementById('subPanel');
            const btnReset = document.getElementById('btnReset');
            const btnAlignView = document.getElementById('btnAlignView');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const fullscreenIcon = document.getElementById('fullscreenIcon');
            const fullscreenText = document.getElementById('fullscreenText');
            const themeBtn = document.getElementById('themeBtn');

            // Light Settings Sub-panel Toggle
            btnPowerPanel.addEventListener('click', (e) => {
                e.stopPropagation();
                subPanel.classList.toggle('show');
            });

            // Close sub-panel when clicking outside
            document.addEventListener('click', (e) => {
                if (!subPanel.contains(e.target) && e.target !== btnPowerPanel && !btnPowerPanel.contains(e.target)) {
                    subPanel.classList.remove('show');
                }
            });

            // Power Switch ON/OFF Toggle
            powerBtn.addEventListener('click', () => {
                isPowerOn = !isPowerOn;
                if (isPowerOn) {
                    powerBtn.innerText = '💡 전원 켜짐 (ON)';
                    powerBtn.classList.remove('off');
                } else {
                    powerBtn.innerText = '🔌 전원 꺼짐 (OFF)';
                    powerBtn.classList.add('off');
                }
                updatePhysics();
            });

            // Power Level Slider
            powerSlider.addEventListener('input', (e) => {
                powerPercent = parseFloat(e.target.value);
                powerVal.innerText = powerPercent + ' %';
                updatePhysics();
            });

            // Reset Button
            btnReset.addEventListener('click', () => {
                standGroup.position.x = 1.0;
                isPowerOn = true;
                powerPercent = 100;
                powerSlider.value = 100;
                powerVal.innerText = '100 %';
                powerBtn.innerText = '💡 전원 켜짐 (ON)';
                powerBtn.classList.remove('off');

                // Camera Position Reset
                resetCamera();

                updatePhysics();
            });

            // Align View Camera Button
            btnAlignView.addEventListener('click', () => {
                resetCamera();
            });

            // Theme Switcher (Dark / Light Mode)
            themeBtn.addEventListener('click', () => {
                isDarkMode = !isDarkMode;
                if (isDarkMode) {
                    document.body.classList.remove('light-mode');
                    themeBtn.innerText = '🌙';
                    scene.background.setHex(0x07090e);
                    scene.fog.color.setHex(0x07090e);
                    tableMesh.material.color.setHex(0x161b26);
                } else {
                    document.body.classList.add('light-mode');
                    themeBtn.innerText = '☀️';
                    scene.background.setHex(0xf2f4f8);
                    scene.fog.color.setHex(0xf2f4f8);
                    tableMesh.material.color.setHex(0xd1d5db);
                }
            });

            // Fullscreen API & Toggle State
            function updateFullscreenUI() {
                const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
                fullscreenIcon.innerText = isFS ? '🗗' : '⛶';
                fullscreenText.innerText = isFS ? '창모드' : '전체화면';
            }

            fullscreenBtn.addEventListener('click', () => {
                try {
                    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                        const req = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
                        if (req) {
                            const res = req.call(document.documentElement);
                            if (res && typeof res.catch === 'function') {
                                res.catch(err => {
                                    console.warn('전체화면 권한이 제한되어 있습니다:', err);
                                });
                            }
                        }
                    } else {
                        const exit = document.exitFullscreen || document.webkitExitFullscreen;
                        if (exit) {
                            const res = exit.call(document);
                            if (res && typeof res.catch === 'function') {
                                res.catch(err => {
                                    console.warn('창모드 전환 권한이 제한되어 있습니다:', err);
                                });
                            }
                        }
                    }
                } catch (err) {
                    console.warn('전체화면 모드를 실행할 수 없습니다:', err);
                }
            });

            document.addEventListener('fullscreenchange', updateFullscreenUI);
            document.addEventListener('webkitfullscreenchange', updateFullscreenUI);

            // Pointer Event Dragging (Stand Light Drag & OrbitControls Override)
            function onPointerDown(e) {
                if (e.target.closest('.glass-pill') || e.target.closest('.glass-panel')) return;

                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(standGroup.children, true);

                if (intersects.length > 0) {
                    isDraggingStand = true;
                    controls.enabled = false; // Pause camera rotation while dragging stand
                    container.style.cursor = 'grabbing';
                }
            }

            function onPointerMove(e) {
                if (!isDraggingStand) return;

                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const targetPos = new THREE.Vector3();
                raycaster.ray.intersectPlane(dragPlane, targetPos);

                if (targetPos) {
                    // Restrict Stand Position Range (0.3m ~ 5.0m)
                    standGroup.position.x = Math.max(0.3, Math.min(5.0, targetPos.x));
                    updatePhysics();
                }
            }

            function onPointerUp() {
                if (isDraggingStand) {
                    isDraggingStand = false;
                    controls.enabled = true; // Resume 360-degree OrbitControls camera rotation
                    container.style.cursor = 'default';
                }
            }

            window.addEventListener('pointerdown', onPointerDown);
            window.addEventListener('pointermove', onPointerMove);
            window.addEventListener('pointerup', onPointerUp);
            window.addEventListener('pointercancel', onPointerUp);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>

<script>
/* ============ 모바일 화면 재조정 + 전체화면 대체 동작 (자동 생성) ============ */
(function () {
    var docEl = document.documentElement;
    var btn = document.getElementById('fullscreenBtn');
    var icon = document.getElementById('fullscreenIcon');
    var text = document.getElementById('fullscreenText');

    function realFs() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement ||
                  document.mozFullScreenElement || document.msFullscreenElement);
    }
    function pseudo() { return docEl.classList.contains('pseudo-fs'); }
    function setUI() {
        var on = realFs() || pseudo();
        if (icon) icon.textContent = on ? '🗗' : '⛶';
        if (text) text.textContent = on ? '창모드' : '전체화면';
        if (btn) btn.setAttribute('aria-label', on ? '창모드로 전환' : '전체화면으로 전환');
        document.body.classList.toggle('is-fullscreen', on);
    }
    function toast(msg) {
        var t = document.getElementById('ux-toast');
        if (!t) {
            t = document.createElement('div');
            t.id = 'ux-toast';
            t.style.cssText = 'position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);' +
                'background:rgba(28,28,30,.88);color:#fff;font-size:12px;line-height:1.4;padding:9px 14px;border-radius:14px;' +
                'z-index:9999;max-width:86vw;text-align:center;pointer-events:none;transition:opacity .3s;' +
                'font-family:inherit;box-shadow:0 8px 24px rgba(0,0,0,.25)';
            document.body.appendChild(t);
        }
        t.textContent = msg;
        t.style.opacity = '1';
        clearTimeout(t._t);
        t._t = setTimeout(function () { t.style.opacity = '0'; }, 2600);
    }

    if (btn) {
        btn.addEventListener('click', function () {
            var wasReal = realFs();
            var wasPseudo = pseudo();
            setTimeout(function () {
                if (wasReal) { setUI(); return; }          // 진짜 전체화면에서 나온 경우
                if (wasPseudo) { docEl.classList.remove('pseudo-fs'); setUI(); return; }  // 몰입 모드 해제
                if (!realFs()) {                            // 전체화면 API가 동작하지 않는 환경
                    docEl.classList.add('pseudo-fs');
                    try { window.scrollTo(0, 1); } catch (e) {}
                    toast('이 브라우저는 전체화면을 지원하지 않아 상단 정보를 숨긴 몰입 모드로 표시합니다');
                }
                setUI();
            }, 380);
        }, false);
    }
    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
        document.addEventListener(ev, setUI);
    });

    /* 좁은 화면에서는 3D 장면이 잘리지 않도록 시야각을 넓혀 전체가 들어오게 한다 */
    function mobileFit() {
        try {
            if (typeof camera === 'undefined' || !camera || !camera.isPerspectiveCamera) return;
            if (!camera.userData) camera.userData = {};
            if (!camera.userData.baseFov) camera.userData.baseFov = camera.fov;
            var w = window.innerWidth, h = window.innerHeight, f = 1;
            var k = 0.62;
            var attr = document.documentElement.getAttribute('data-mzoom');
            if (attr) { var v = parseFloat(attr); if (!isNaN(v) && v > 0) k = v; }
            if (w < h) f = 1 + (1 - w / h) * k;
            else if (h <= 500) f = 1 + k * 0.16;
            camera.fov = Math.min(88, camera.userData.baseFov * f);
            camera.updateProjectionMatrix();
        } catch (e) {}
    }
    mobileFit();

    /* 화면 회전·주소창 변화·전체화면 전환 후 렌더러 크기 재계산 */
    var rt = null;
    function refit() {
        clearTimeout(rt);
        rt = setTimeout(function () {
            mobileFit();
            try { window.dispatchEvent(new Event('resize')); } catch (e) {}
        }, 240);
    }
    window.addEventListener('orientationchange', refit);
    window.addEventListener('pageshow', refit);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) refit(); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', refit);

    setUI();
})();
</script>
