<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>정전기 유도 3D</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <!-- Three.js 및 OrbitControls 3D 엔진 라이브러리 -->
    <script src="../../common/lib/three.min.js"></script>
    <script src="../../common/lib/OrbitControls.js"></script>
    <style>
        @font-face {
            font-family: 'SeoulNamsan';
            src: local('SeoulNamsan M'), local('SeoulNamsanM'), local('서울남산체 M'),
                 url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'SeoulNamsan', -apple-system, sans-serif;
            background-color: #f2f2f7;
            color: #1c1c1e;
            touch-action: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            touch-action: none;
        }

        /* Apple visionOS Glassmorphic UI */
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            z-index: 10;
        }

        /* 좌측 상단 헤더 */
        .top-left-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            color: #1c1c1e;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tag-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
        }

        .tag-pill {
            background: rgba(0, 122, 255, 0.15);
            color: #007aff;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
        }

        /* 우측 상단 실시간 데이터 카드 */
        .top-right-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .data-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 20px;
        }

        .data-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .data-label {
            font-size: 11px;
            color: #8e8e93;
            font-weight: bold;
        }

        .data-value {
            font-size: 15px;
            font-weight: bold;
            color: #1c1c1e;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            transition: all 0.2s;
        }

        /* 중앙 안내 툴팁 */
        .center-tooltip {
            position: absolute;
            top: 12%;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 18px;
            font-size: 13px;
            color: #8e8e93;
            border-radius: 30px;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.5s ease;
        }

        /* 서브 조절 패널 */
        .sub-panel { right: 20px;
            position: absolute;
            bottom: 72px;
            left: auto;
            transform: none;
            padding: 16px 20px;
            width: 320px;
            display: none;
            flex-direction: column;
            gap: 14px;
            z-index: 10;
        }

        .sub-panel.show { display: flex; }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: bold;
        }

        .btn-group {
            display: flex;
            gap: 6px;
        }

        .toggle-btn {
            padding: 6px 14px;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            background: rgba(255, 255, 255, 0.5);
            color: #1c1c1e;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .toggle-btn.active-neg {
            background: #ff3b30;
            color: white;
            border-color: #ff3b30;
        }
        .toggle-btn.active-pos {
            background: #007aff;
            color: white;
            border-color: #007aff;
        }

        /* 하단 제어 바 */
        .bottom-control-bar {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            z-index: 10;
        }

        .control-tab-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 14px;
            min-width: 68px;
            border-radius: 14px;
            border: none;
            background: transparent;
            color: #1c1c1e;
            font-size: 12px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-tab-btn.active {
            background: #007aff;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }

        /* 다크 모드 */
        body.dark-mode {
            background-color: #121212;
            color: #f2f2f7;
        }

        body.dark-mode .glass-panel {
            background: rgba(30, 30, 30, 0.75);
            border-color: rgba(255, 255, 255, 0.15);
            color: #f2f2f7;
        }

        body.dark-mode .data-value, body.dark-mode .back-btn {
            color: #f2f2f7;
        }

        body.dark-mode .icon-btn {
            background: rgba(40, 40, 40, 0.75);
            color: #fff;
        }
    
        /* Bottom Right Bar (Fullscreen) */
        .bottom-right-bar {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }
        button.back-btn, button.tag-badge {
            font-family: inherit;
            border: none;
        }
        @media (max-width: 768px) {
            .bottom-right-bar {
                bottom: 15px;
                right: 15px;
            }
        }
    

/* @@MOBILE-BASE v1@@ */
/* ============================================================
   모바일 반응형 보정 (세로/가로) — 자동 생성 블록
   ============================================================ */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
img, canvas { max-width: 100%; }

/* ---------- 모바일 세로 (폭 900px 이하) ---------- */
@media (max-width: 900px) {
    /* 1행: [메인][제목]  ...  [전체화면 아이콘] */
    .top-left-bar {
        top: max(8px, env(safe-area-inset-top)) !important;
        left: 8px !important;
        right: 56px !important;
        gap: 6px !important;
        flex-wrap: nowrap !important;
        align-items: center !important;
        overflow: hidden;
    }
    .top-left-bar .back-btn,
    .top-left-bar > a {
        flex: 0 0 auto;
        padding: 6px 10px !important;
        font-size: 12px !important;
        gap: 4px !important;
        white-space: nowrap;
    }
    .top-left-bar .tag-badge {
        flex: 0 1 auto;
        min-width: 0;
        padding: 6px 10px !important;
        font-size: 12px !important;
        gap: 5px !important;
        white-space: nowrap;
        overflow: hidden;
    }
    .top-left-bar .tag-badge > span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .tag-pill { font-size: 9px !important; padding: 1px 6px !important; flex: 0 0 auto; }

    /* 2행: [데이터 카드 .............][테마] */
    .top-right-bar {
        top: calc(max(8px, env(safe-area-inset-top)) + 40px) !important;
        left: 8px !important;
        right: 8px !important;
        gap: 6px !important;
        justify-content: flex-end !important;
        flex-wrap: nowrap !important;
    }
    .data-card {
        flex: 1 1 0%;
        min-width: 0;
        gap: 4px !important;
        padding: 6px 8px !important;
        justify-content: space-around !important;
        overflow: hidden;
    }
    .data-card { flex-direction: row !important; align-items: center !important; flex-wrap: nowrap !important; }
    .data-item { min-width: 0; flex-direction: column !important; align-items: center !important; gap: 0 !important; }
    .data-item > * { white-space: nowrap; }
    .voltmeter-display { font-size: 24px !important; }
    .data-label { font-size: 9px !important; white-space: nowrap; line-height: 1.2; }
    .data-value { font-size: 12.5px !important; white-space: nowrap; line-height: 1.25; }
    .icon-btn { width: 34px !important; height: 34px !important; min-width: 34px; font-size: 15px !important; flex: 0 0 auto; }

    /* 전체화면: 1행 우측 아이콘 버튼 (글자는 숨김) */
    .bottom-right-bar {
        top: max(8px, env(safe-area-inset-top)) !important;
        bottom: auto !important;
        right: 8px !important;
        left: auto !important;
        z-index: 20;
    }
    .bottom-right-bar button,
    .bottom-right-bar .back-btn {
        padding: 6px 9px !important;
        font-size: 14px !important;
        gap: 4px !important;
        line-height: 1;
    }
    .bottom-right-bar #fullscreenText,
    .bottom-right-bar .fs-text { display: none !important; }

    /* 안내 문구 */
    .center-tooltip, #guide-tooltip {
        top: calc(max(8px, env(safe-area-inset-top)) + 88px) !important;
        left: 8px !important;
        right: 8px !important;
        transform: none !important;
        margin: 0 auto;
        width: auto !important;
        max-width: none !important;
        font-size: 11.5px !important;
        padding: 7px 12px !important;
        white-space: normal !important;
        line-height: 1.45;
        text-align: center;
        z-index: 15 !important;
    }

    /* 하단 컨트롤 바: 화면 폭 전체, 한 줄 유지 */
    .bottom-control-bar {
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        transform: none !important;
        width: 100% !important;
        border-radius: 18px 18px 0 0 !important;
        padding: 6px 6px calc(6px + env(safe-area-inset-bottom)) !important;
        gap: 2px !important;
        justify-content: space-around !important;
        flex-wrap: nowrap !important;
        overflow: visible;
    }
    .control-tab-btn {
        flex: 1 1 0 !important;
        min-width: 0 !important;
        padding: 5px 2px !important;
        font-size: 10.5px !important;
        gap: 1px !important;
        border-radius: 12px !important;
        white-space: nowrap !important;
        line-height: 1.15;
    }
    .control-tab-btn span { white-space: nowrap !important; }
    .control-tab-btn span:first-child { font-size: 15px !important; line-height: 1.1; }

    /* 슬라이더 등 서브 패널 */
    .sub-panel {
        left: 8px !important;
        right: 8px !important;
        bottom: calc(76px + env(safe-area-inset-bottom)) !important;
        transform: none !important;
        width: auto !important;
        max-width: none !important;
        max-height: 46vh;
        overflow-y: auto;
        padding: 13px 14px !important;
        gap: 10px !important;
        -webkit-overflow-scrolling: touch;
    }
    .sub-panel-title { font-size: 11px !important; }
    .slider-header { font-size: 11px !important; }
    .control-row { gap: 5px !important; flex-wrap: wrap; }
    .toggle-btn, .mode-btn, .quick-btn, .example-item, .preset-btn { font-size: 11px !important; }
    input[type="range"] { height: 22px; }

    /* 팝업(모달)이 화면을 넘지 않도록 */
    .modal-overlay { padding: 12px !important; align-items: center !important; }
    .modal-card {
        max-height: 88vh !important;
        overflow-y: auto !important;
        width: auto !important;
        max-width: 100% !important;
        padding: 16px !important;
        -webkit-overflow-scrolling: touch;
    }
    .modal-title { font-size: 15px !important; }
    .modal-body { font-size: 12px !important; }
    .example-title { font-size: 11.5px !important; }
    .example-desc { font-size: 11px !important; line-height: 1.5 !important; }
}

@media (max-width: 430px) {
    /* 아주 좁은 화면에서는 장식용 배지를 숨겨 제목 자리를 확보 */
    .tag-pill { display: none !important; }
}

    <script>
        // --- 1. Three.js 기본 씬 & 카메라 연출 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf2f2f7);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0.2, 3.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.05;

        // --- 2. 조명 설정 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
        dirLight.position.set(2.5, 4, 3);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // --- 3. 바닥 스페이스 ---
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(20, 20),
            new THREE.MeshStandardMaterial({ color: 0xe5e5ea, roughness: 0.8 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.9;
        floor.receiveShadow = true;
        scene.add(floor);

        // --- 4. 입체감과 사실감을 극대화한 3D 검전기(Flask Jar Electroscope) 메쉬 생성 ---
        const electroscopeGroup = new THREE.Group();

        // 고광택 금속 재질 (황동/크롬 금속 원판 및 중심 막대)
        const shinyMetalMat = new THREE.MeshStandardMaterial({
            color: 0xdfdfeb,
            metalness: 0.88,
            roughness: 0.22
        });
        // 금박(Gold Leaf) 특화 골드 메탈릭 재질
        const goldLeafMat = new THREE.MeshStandardMaterial({
            color: 0xf5b041,
            metalness: 0.85,
            roughness: 0.28
        });
        // 안정적인 원형 받침대 재질 (다크 슬레이트)
        const standBaseMat = new THREE.MeshStandardMaterial({
            color: 0x24292e,
            roughness: 0.65,
            metalness: 0.25
        });

        // (0) 하단 원형 안정 받침대
        const baseMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.48, 0.52, 0.04, 36), standBaseMat);
        baseMesh.position.y = -0.44;
        baseMesh.receiveShadow = true;
        electroscopeGroup.add(baseMesh);

        // (1) 상단 평평한 금속 원판 및 테두리 베벨링 링 (입체감 부여)
        const discMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.30, 0.30, 0.02, 36), shinyMetalMat);
        discMesh.position.y = 0.65;
        discMesh.castShadow = true;
        electroscopeGroup.add(discMesh);

        const discRim = new THREE.Mesh(new THREE.TorusGeometry(0.30, 0.012, 12, 36), shinyMetalMat);
        discRim.rotation.x = Math.PI / 2;
        discRim.position.y = 0.65;
        electroscopeGroup.add(discRim);

        // (2) 중앙 금속 막대
        const rodMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.95, 20), shinyMetalMat);
        rodMesh.position.y = 0.15;
        rodMesh.castShadow = true;
        electroscopeGroup.add(rodMesh);

        // (3) 검은색 고무 마개
        const corkMat = new THREE.MeshStandardMaterial({ color: 0x1c1c1e, roughness: 0.7 });
        const corkMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.16, 0.18, 32), corkMat);
        corkMesh.position.y = 0.48;
        corkMesh.castShadow = true;
        electroscopeGroup.add(corkMesh);

        // (4) 입체 플라스크 모양 유리병 LatheGeometry
        const flaskPoints = [];
        flaskPoints.push(new THREE.Vector2(0.12, 0.48));
        flaskPoints.push(new THREE.Vector2(0.13, 0.40));
        flaskPoints.push(new THREE.Vector2(0.14, 0.30));
        flaskPoints.push(new THREE.Vector2(0.28, 0.10));
        flaskPoints.push(new THREE.Vector2(0.42, -0.15));
        flaskPoints.push(new THREE.Vector2(0.44, -0.38));
        flaskPoints.push(new THREE.Vector2(0.40, -0.42));
        flaskPoints.push(new THREE.Vector2(0.0, -0.42));

        const glassGeo = new THREE.LatheGeometry(flaskPoints, 48);
        const glassMat = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.28,
            roughness: 0.06,
            transmission: 0.92,
            thickness: 0.18
        });
        const glassMesh = new THREE.Mesh(glassGeo, glassMat);
        glassMesh.castShadow = true;
        electroscopeGroup.add(glassMesh);

        // 유리 주둥이 상단 입체 림
        const glassRim = new THREE.Mesh(new THREE.TorusGeometry(0.125, 0.012, 12, 36), glassMat);
        glassRim.rotation.x = Math.PI / 2;
        glassRim.position.y = 0.48;
        electroscopeGroup.add(glassRim);

        // (5) 금속박
        const leafGroupLeft = new THREE.Group();
        const leafGroupRight = new THREE.Group();

        const leafGeo = new THREE.BoxGeometry(0.065, 0.26, 0.0035);
        leafGeo.translate(0, -0.13, 0);

        const leafLeft = new THREE.Mesh(leafGeo, goldLeafMat);
        const leafRight = new THREE.Mesh(leafGeo, goldLeafMat);

        leafGroupLeft.add(leafLeft);
        leafGroupRight.add(leafRight);

        leafGroupLeft.position.set(-0.016, -0.22, 0);
        leafGroupRight.position.set(0.016, -0.22, 0);

        electroscopeGroup.add(leafGroupLeft);
        electroscopeGroup.add(leafGroupRight);

        electroscopeGroup.position.set(0, -0.1, 0);
        scene.add(electroscopeGroup);

        // --- 4.5 사람의 손 모형 (손가락 접지 장치) 생성 ---
        const handGroup = new THREE.Group();
        const skinMat = new THREE.MeshStandardMaterial({ color: 0xffd1b3, roughness: 0.5, metalness: 0.08 });
        const sleeveMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.7 });

        // 소매 (팔목)
        const sleeve = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.09, 0.28, 16), sleeveMat);
        sleeve.rotation.z = Math.PI / 2;
        sleeve.position.set(-0.24, 0, 0);
        handGroup.add(sleeve);

        // 손바닥
        const palm = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.10, 0.08), skinMat);
        palm.position.set(-0.08, 0, 0);
        handGroup.add(palm);

        // 검지 손가락 (금속판 터치용)
        const indexFinger = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.015, 0.16, 12), skinMat);
        indexFinger.rotation.z = Math.PI / 2;
        indexFinger.position.set(0.08, 0.02, 0);
        handGroup.add(indexFinger);

        // 접힌 손가락들
        const foldedFingers = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.08, 0.07), skinMat);
        foldedFingers.position.set(-0.02, -0.02, 0);
        handGroup.add(foldedFingers);

        // 방전/접지 스파크 파티클 효과
        const sparkMat = new THREE.MeshBasicMaterial({ color: 0x00f2fe, transparent: true, opacity: 0 });
        const sparkMesh = new THREE.Mesh(new THREE.SphereGeometry(0.045, 12, 12), sparkMat);
        sparkMesh.position.set(0.16, 0.02, 0);
        handGroup.add(sparkMesh);

        handGroup.position.set(-0.88, 0.55, 0);
        scene.add(handGroup);

        // --- 5. 3D 대전체(Charged Rod) 생성 ---
        const chargedRodGroup = new THREE.Group();
        const rodBodyGeo = new THREE.CylinderGeometry(0.035, 0.035, 0.7, 24);
        rodBodyGeo.rotateZ(Math.PI / 2);

        let rodMat = new THREE.MeshStandardMaterial({ color: 0xff3b30, roughness: 0.3 });
        const chargedRodMesh = new THREE.Mesh(rodBodyGeo, rodMat);
        chargedRodMesh.castShadow = true;
        chargedRodGroup.add(chargedRodMesh);

        chargedRodGroup.position.set(1.0, 0.68, 0);
        scene.add(chargedRodGroup);

        // --- 텍스트 텍스처 생성 함수 (검은색 +, - 텍스처) ---
        function createTextSprite(text, scale = 0.035) {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            ctx.clearRect(0, 0, 64, 64);
            ctx.fillStyle = '#000000';
            ctx.font = 'bold 52px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 32, 34);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture, depthTest: false });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(scale, scale, 1);
            return sprite;
        }

        // --- 6. 전하 입자 (1:1 중성, 균일 양전하, 자유 전자 통로 이동 연산) ---
        const particlesGroup = new THREE.Group();
        scene.add(particlesGroup);

        const TOTAL_PAIRS = 30;
        const posParticles = [];
        const negParticles = [];

        const posLocations = [];
        for (let i = 0; i < TOTAL_PAIRS; i++) {
            let x, y, z;
            if (i < 12) {
                const r = Math.sqrt(Math.random()) * 0.22;
                const theta = Math.random() * Math.PI * 2;
                x = Math.cos(theta) * r;
                y = 0.55;
                z = Math.sin(theta) * r;
            } else if (i < 22) {
                x = (Math.random() - 0.5) * 0.015;
                y = 0.44 - (i - 12) * 0.065;
                z = (Math.random() - 0.5) * 0.015;
            } else {
                const side = (i % 2 === 0) ? -1 : 1;
                x = side * 0.03;
                y = -0.24 - Math.random() * 0.18;
                z = (Math.random() - 0.5) * 0.015;
            }
            posLocations.push(new THREE.Vector3(x, y, z));
        }

        const posGeo = new THREE.SphereGeometry(0.014, 12, 12);
        const posMat = new THREE.MeshBasicMaterial({ color: 0xff2d55 });

        posLocations.forEach(loc => {
            const pGroup = new THREE.Group();
            const sphere = new THREE.Mesh(posGeo, posMat);
            const label = createTextSprite('+');
            pGroup.add(sphere);
            pGroup.add(label);

            pGroup.position.copy(loc);
            particlesGroup.add(pGroup);
            posParticles.push(pGroup);
        });

        const negGeo = new THREE.SphereGeometry(0.014, 12, 12);
        const negMat = new THREE.MeshBasicMaterial({ color: 0x007aff });

        for (let i = 0; i < TOTAL_PAIRS; i++) {
            const nGroup = new THREE.Group();
            const sphere = new THREE.Mesh(negGeo, negMat);
            const label = createTextSprite('-');
            nGroup.add(sphere);
            nGroup.add(label);

            nGroup.position.copy(posLocations[i]);
            particlesGroup.add(nGroup);
            negParticles.push({
                group: nGroup,
                basePos: posLocations[i].clone(),
                currentPos: posLocations[i].clone(),
                vx: (Math.random() - 0.5) * 0.002,
                vy: (Math.random() - 0.5) * 0.002,
                vz: (Math.random() - 0.5) * 0.002
            });
        }

        const rodChargeGroup = new THREE.Group();
        chargedRodGroup.add(rodChargeGroup);

        let rodRemainingRatio = 1.0;

        function updateRodParticles(polarity, remainingRatio = 1.0) {
            rodRemainingRatio = Math.max(0, Math.min(1.0, remainingRatio));
            while (rodChargeGroup.children.length > 0) rodChargeGroup.remove(rodChargeGroup.children[0]);
            const mat = new THREE.MeshBasicMaterial({ color: polarity === 'neg' ? 0x007aff : 0xff2d55 });
            const geo = new THREE.SphereGeometry(0.012, 8, 8);
            const signText = polarity === 'neg' ? '-' : '+';

            const totalCols = 11;
            // 남아있는 전하는 접촉 부위(팁: x = -0.3) 반대편인 오른쪽(x = +0.3)부터 남김
            const keepCols = Math.max(0, Math.min(totalCols, Math.round(totalCols * rodRemainingRatio)));

            let colIndex = 0;
            let activeCount = 0;
            for (let i = 0.3; i >= -0.301; i -= 0.06) {
                if (colIndex < keepCols) {
                    const p1Group = new THREE.Group();
                    p1Group.add(new THREE.Mesh(geo, mat));
                    p1Group.add(createTextSprite(signText, 0.03));
                    p1Group.position.set(i, 0.04, 0);

                    const p2Group = new THREE.Group();
                    p2Group.add(new THREE.Mesh(geo, mat));
                    p2Group.add(createTextSprite(signText, 0.03));
                    p2Group.position.set(i, -0.04, 0);

                    rodChargeGroup.add(p1Group);
                    rodChargeGroup.add(p2Group);
                    activeCount += 2;
                }
                colIndex++;
            }

            const valRodCharge = document.getElementById('val-rod-charge');
            if (valRodCharge) {
                if (activeCount === 22) {
                    valRodCharge.innerText = `22개 (보유)`;
                    valRodCharge.style.color = polarity === 'neg' ? '#ff3b30' : '#007aff';
                } else {
                    valRodCharge.innerText = `${activeCount}개 (이동 후 잔여)`;
                    valRodCharge.style.color = '#ff9500';
                }
            }
        }
        updateRodParticles('neg', 1.0);

        // --- 6-1. 전하 실시간 이동 파티클 스트림 시스템 ---
        const transferParticlesGroup = new THREE.Group();
        scene.add(transferParticlesGroup);

        let activeTransferParticles = [];
        let isTransferring = false;
        let rodDischarged = false; // 접촉 후 대전체 방전 상태

        function startElectronTransferAnimation(direction) {
            // direction: 'rod-to-disc' (음전하 대전체 접촉) 또는 'disc-to-rod' (양전하 대전체 접촉)
            while (transferParticlesGroup.children.length > 0) transferParticlesGroup.remove(transferParticlesGroup.children[0]);
            activeTransferParticles = [];
            isTransferring = true;

            const count = 12; // 12개 전자가 순차적으로 이동 (대전체에는 10개 잔여)
            const geo = new THREE.SphereGeometry(0.018, 12, 12);
            const mat = new THREE.MeshBasicMaterial({ color: 0x007aff }); // 전자는 항상 선명한 파란색 (-)
            const glowGeo = new THREE.SphereGeometry(0.026, 8, 8);
            const glowMat = new THREE.MeshBasicMaterial({ color: 0x64d2ff, transparent: true, opacity: 0.55 });

            const rodTipLocal = new THREE.Vector3(-0.35, 0, 0);
            const rodTipWorld = rodTipLocal.applyMatrix4(chargedRodGroup.matrixWorld);
            const discWorld = new THREE.Vector3(0, 0.65, 0);

            for (let i = 0; i < count; i++) {
                const pGroup = new THREE.Group();
                pGroup.add(new THREE.Mesh(geo, mat));
                pGroup.add(new THREE.Mesh(glowGeo, glowMat));
                pGroup.add(createTextSprite('-', 0.038));

                transferParticlesGroup.add(pGroup);

                const delay = i * 0.08; // 80ms 간격 순차 출발 (~1.0초 연속 스트림)
                const duration = 0.55;  // 비행 시간

                activeTransferParticles.push({
                    group: pGroup,
                    from: direction === 'rod-to-disc' ? rodTipWorld.clone() : discWorld.clone(),
                    to: direction === 'rod-to-disc' ? discWorld.clone() : rodTipWorld.clone(),
                    delay: delay,
                    duration: duration,
                    elapsed: 0,
                    arcHeight: 0.06 + Math.random() * 0.07,
                    arcZ: (Math.random() - 0.5) * 0.05,
                    chargeDeducted: false,
                    done: false,
                    index: i
                });
            }
        }

        function updateTransferParticles(dt) {
            if (activeTransferParticles.length === 0) return;
            let allDone = true;

            const rodTipLocal = new THREE.Vector3(-0.35, 0, 0);
            const curRodTipWorld = rodTipLocal.applyMatrix4(chargedRodGroup.matrixWorld);
            const discWorld = new THREE.Vector3(0, 0.65, 0);

            for (let i = 0; i < activeTransferParticles.length; i++) {
                const tp = activeTransferParticles[i];
                if (tp.done) continue;
                allDone = false;
                tp.elapsed += dt;

                if (tp.elapsed < tp.delay) {
                    tp.group.visible = false;
                    continue;
                }

                tp.group.visible = true;
                const progress = Math.min(1.0, (tp.elapsed - tp.delay) / tp.duration);

                // 대전체 위치가 실시간으로 변해도 경로 끝점 자동 추적
                if (tp.from.x > discWorld.x) tp.from.copy(curRodTipWorld);
                else tp.to.copy(curRodTipWorld);

                const curX = THREE.MathUtils.lerp(tp.from.x, tp.to.x, progress);
                const curY = THREE.MathUtils.lerp(tp.from.y, tp.to.y, progress) + Math.sin(progress * Math.PI) * tp.arcHeight;
                const curZ = THREE.MathUtils.lerp(tp.from.z, tp.to.z, progress) + Math.sin(progress * Math.PI) * tp.arcZ;

                tp.group.position.set(curX, curY, curZ);

                // 이동 중 크기 펄스 효과
                const scale = 0.9 + Math.sin(progress * Math.PI) * 0.45;
                tp.group.scale.set(scale, scale, scale);

                // 비행 중간 지점에서 대전체 전하 감소 차감 반영 (대전체에서 전자가 사라지는 연출)
                if (progress >= 0.45 && !tp.chargeDeducted) {
                    tp.chargeDeducted = true;
                    sparkMat.opacity = 1.0;
                    const remainingRatio = 1.0 - (0.55 * ((tp.index + 1) / activeTransferParticles.length));
                    updateRodParticles(currentPolarity, remainingRatio);
                }

                if (progress >= 1.0) {
                    tp.done = true;
                    tp.group.visible = false;
                }
            }

            if (allDone) {
                isTransferring = false;
                while (transferParticlesGroup.children.length > 0) transferParticlesGroup.remove(transferParticlesGroup.children[0]);
                activeTransferParticles = [];
            }
        }

        // --- 7. 표준 Pointer Event 기반 드래그 인터랙션 ---
        let currentPolarity = 'neg';
        let isDragging = false;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
        const planeIntersect = new THREE.Vector3();
        let dragOffset = new THREE.Vector3();

        let isDraggingRod = false;
        let isDraggingHand = false;

        function updateMousePos(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        }

        function onPointerDown(e) {
            updateMousePos(e);
            raycaster.setFromCamera(mouse, camera);
            
            const handIntersects = raycaster.intersectObjects(handGroup.children, true);
            if (handIntersects.length > 0) {
                isDraggingHand = true;
                controls.enabled = false;
                if (raycaster.ray.intersectPlane(dragPlane, planeIntersect)) {
                    dragOffset.copy(handGroup.position).sub(planeIntersect);
                }
                showTooltip('🖐️ 손가락 모형을 드래그하여 검전기 금속판에 직접 접촉시켜 보세요.');
                return;
            }

            const rodIntersects = raycaster.intersectObjects(chargedRodGroup.children, true);
            if (rodIntersects.length > 0) {
                isDraggingRod = true;
                controls.enabled = false;
                if (raycaster.ray.intersectPlane(dragPlane, planeIntersect)) {
                    dragOffset.copy(chargedRodGroup.position).sub(planeIntersect);
                }
                const tooltip = document.getElementById('guide-tooltip');
                if (tooltip) tooltip.style.opacity = '0';
            }
        }

        function onPointerMove(e) {
            if (!isDraggingRod && !isDraggingHand) return;
            updateMousePos(e);
            raycaster.setFromCamera(mouse, camera);
            
            if (raycaster.ray.intersectPlane(dragPlane, planeIntersect)) {
                let targetPos = planeIntersect.add(dragOffset);
                targetPos.z = 0;

                if (isDraggingHand) {
                    targetPos.x = Math.max(-1.4, Math.min(-0.25, targetPos.x));
                    targetPos.y = Math.max(0.2, Math.min(0.9, targetPos.y));
                    handGroup.position.copy(targetPos);

                    // 손가락 끝 위치와 금속판(-0.30, 0.65) 거리 판정
                    const fingerTipX = handGroup.position.x + 0.16;
                    const fingerTipY = handGroup.position.y + 0.02;
                    const distToDisc = Math.hypot(fingerTipX - (-0.30), fingerTipY - 0.65);

                    if (distToDisc < 0.20 || fingerTipX >= -0.32) {
                        if (!isHandGrounded) {
                            isHandGrounded = true;
                            sparkMat.opacity = 1.0;
                            netCharge = 0;
                            showTooltip('🖐️ 손가락 직접 접지: 손가락이 금속판에 닿아 여분의 전자가 방전되었습니다! (30:30 중성)');
                            const btnGround = document.getElementById('btn-ground-hand');
                            if (btnGround) btnGround.classList.add('active');
                            const btnSubGround = document.getElementById('btn-sub-ground');
                            if (btnSubGround) btnSubGround.classList.add('active');
                        }
                    } else {
                        if (isHandGrounded) {
                            isHandGrounded = false;
                            const btnGround = document.getElementById('btn-ground-hand');
                            if (btnGround) btnGround.classList.remove('active');
                            const btnSubGround = document.getElementById('btn-sub-ground');
                            if (btnSubGround) btnSubGround.classList.remove('active');
                        }
                    }
                } else if (isDraggingRod) {
                    targetPos.x = Math.max(-1.6, Math.min(1.6, targetPos.x));
                    targetPos.y = Math.max(-0.3, Math.min(1.1, targetPos.y));
                    chargedRodGroup.position.copy(targetPos);
                }
            }
        }

        function onPointerUp() {
            if (isDraggingRod || isDraggingHand) {
                isDraggingRod = false;
                isDraggingHand = false;
                controls.enabled = true;
            }
        }

        window.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);

        // --- 8. 물리 시뮬레이션 & 전하 통로 내 이동 연산 루프 ---
        let targetLeafAngle = 0;
        let currentLeafAngle = 0;
        let netCharge = 0;          // 잔류 전하량 (0: 중성, -14: 음전하 잔류 대전, +14: 양전하 잔류 대전)
        let isHandGrounded = false;  // 손가락 접지 상태
        let isRodContact = false;   // 대전체 접촉 상태

        function showTooltip(msg) {
            const tip = document.getElementById('guide-tooltip');
            if (tip) {
                tip.innerText = msg;
                tip.style.opacity = '1';
            }
        }

        function applyContactCharging() {
            if (isRodContact || rodDischarged) return;
            isRodContact = true;
            rodDischarged = true;
            sparkMat.opacity = 1.0;

            if (currentPolarity === 'neg') {
                netCharge = -14;
                showTooltip('⚡ 대전체 접촉: 대전체 표면의 전자(-)들이 금속판으로 실시간 이동합니다! (대전체 전하 감소 22개 ➔ 10개, 검전기 음전하 대전)');
                startElectronTransferAnimation('rod-to-disc');
            } else {
                netCharge = 14;
                showTooltip('⚡ 대전체 접촉: 금속판의 전자(-)들이 대전체로 이동하여 대전체의 양전하를 일부 중화시키고, 검전기는 양전하로 대전되었습니다!');
                startElectronTransferAnimation('disc-to-rod');
            }
        }

        function triggerContactRod() {
            chargedRodGroup.position.set(0.32, 0.68, 0);
            applyContactCharging();
        }

        function triggerSeparateRod() {
            isRodContact = false;
            chargedRodGroup.position.set(1.10, 0.68, 0);
            showTooltip('↔ 대전체 분리: 대전체를 멀리 치워도 이미 이동한 전하 때문에 검전기는 대전 상태를 유지하여 금속박이 벌어져 있습니다.');
        }

        function triggerGroundHand() {
            isHandGrounded = !isHandGrounded;
            const btnGround = document.getElementById('btn-ground-hand');
            const btnSubGround = document.getElementById('btn-sub-ground');
            if (btnGround) btnGround.classList.toggle('active', isHandGrounded);
            if (btnSubGround) btnSubGround.classList.toggle('active', isHandGrounded);

            if (isHandGrounded) {
                sparkMat.opacity = 1.0;
                netCharge = 0;
                showTooltip('🖐️ 손가락 접지: 여분의 전자가 손을 통해 대지로 방전되어 검전기가 중성(30:30)으로 복원되었습니다!');
            } else {
                showTooltip('🖐️ 손가락 접지 해제: 중성 상태를 유지합니다.');
            }
        }

        function updatePhysics() {
            const discTopPos = new THREE.Vector3(0, 0.65, 0);
            const distance = chargedRodGroup.position.distanceTo(discTopPos);

            // 대전체가 금속판에 근접/접촉 시 (0.35m 이하) 자동 접촉 대전 감지 지원
            if (distance < 0.35 && !isRodContact) {
                applyContactCharging();
            } else if (distance >= 0.40 && isRodContact) {
                isRodContact = false;
            }

            let inductionFactor = Math.max(0, Math.min(1, (1.3 - distance) / 1.1));
            inductionFactor = Math.pow(inductionFactor, 1.8);

            // 금속박 각도 계산: 잔류 전하량과 정전기 유도 효과의 물리적 중첩
            const residualFactor = Math.abs(netCharge) / 14.0;
            let totalSpread = residualFactor * (Math.PI / 4.2);
            if (netCharge !== 0) {
                const samePolarity = (netCharge < 0 && currentPolarity === 'neg') || (netCharge > 0 && currentPolarity === 'pos');
                if (samePolarity) {
                    totalSpread += inductionFactor * (Math.PI / 5.0);
                } else {
                    totalSpread = Math.max(0.02, totalSpread - inductionFactor * (Math.PI / 5.2));
                }
            } else {
                totalSpread += inductionFactor * (Math.PI / 4.0);
            }

            targetLeafAngle = Math.min(Math.PI / 3.2, totalSpread);
            currentLeafAngle += (targetLeafAngle - currentLeafAngle) * 0.1;

            leafGroupLeft.rotation.z = -currentLeafAngle;
            leafGroupRight.rotation.z = currentLeafAngle;

            // 전하 이동 편향 (migrationShift)
            const migrationShift = (currentPolarity === 'neg' ? -1 : 1) * inductionFactor * 0.52;

            // 손가락 접지 애니메이션 보간 (직접 마우스/터치 드래그 중이 아닐 때만 자동 이동)
            if (!isDraggingHand) {
                const targetHandX = isHandGrounded ? -0.44 : -0.88;
                handGroup.position.x += (targetHandX - handGroup.position.x) * 0.15;
            }
            if (sparkMat.opacity > 0) sparkMat.opacity = Math.max(0, sparkMat.opacity - 0.04);

            negParticles.forEach((np) => {
                np.vx += (Math.random() - 0.5) * 0.0004;
                np.vy += (Math.random() - 0.5) * 0.0004;
                np.vx *= 0.92;
                np.vy *= 0.92;

                let targetY = np.basePos.y + migrationShift + np.vy;
                targetY = Math.max(-0.42, Math.min(0.56, targetY));

                np.currentPos.y += (targetY - np.currentPos.y) * 0.08;
                np.group.position.y = np.currentPos.y;

                // --- 금속 도체 내부로만 전하 이동 범위 제약 (원판, 막대, 박 통로) ---
                const y = np.currentPos.y;
                let boundaryX = 0.015; // 기본 금속막대 통로 폭
                let boundaryZ = 0.015;

                if (y > 0.52) {
                    // 상단 금속 원판 내부 범위
                    const discRadius = 0.22;
                    boundaryX = discRadius;
                    boundaryZ = discRadius;
                } else if (y < -0.22) {
                    // 하단 금속박 내부 범위
                    const leafHeightRatio = (-0.22 - y) / 0.2;
                    const side = np.basePos.x < 0 ? -1 : 1;
                    const spreadX = side * (0.015 + Math.sin(currentLeafAngle) * leafHeightRatio * 0.18);
                    
                    np.group.position.x = spreadX + np.vx * 0.5;
                    np.group.position.z = Math.max(-0.01, Math.min(0.01, np.basePos.z + np.vz * 0.2));
                    return;
                }

                // 금속막대 및 원판 내부 중심축 제한 연산
                np.group.position.x = Math.max(-boundaryX, Math.min(boundaryX, np.basePos.x + np.vx));
                np.group.position.z = Math.max(-boundaryZ, Math.min(boundaryZ, np.basePos.z + np.vz));
            });

            document.getElementById('val-distance').innerText = distance.toFixed(2) + ' m';
            document.getElementById('val-leaf-angle').innerText = (currentLeafAngle * (180 / Math.PI)).toFixed(1) + '°';

            // 전하 비율 표시 업데이트
            const valRatio = document.getElementById('val-ratio');
            if (valRatio) {
                if (netCharge < 0) {
                    valRatio.innerText = `30 : ${30 - netCharge} (음전하 대전)`;
                    valRatio.style.color = '#007aff';
                } else if (netCharge > 0) {
                    valRatio.innerText = `30 : ${30 - netCharge} (양전하 대전)`;
                    valRatio.style.color = '#ff3b30';
                } else {
                    valRatio.innerText = '30 : 30 (중성)';
                    valRatio.style.color = '#34c759';
                }
            }
        }

        // --- 9. 버튼 조작 이벤트 ---
        const btnTogglePhysics = document.getElementById('btn-toggle-physics');
        const physicsPanel = document.getElementById('physics-panel');
        btnTogglePhysics.addEventListener('click', () => {
            physicsPanel.classList.toggle('show');
            btnTogglePhysics.classList.toggle('active');
        });

        const btnNeg = document.getElementById('btn-neg');
        const btnPos = document.getElementById('btn-pos');
        const txtRodType = document.getElementById('val-rod-type');

        function setPolarity(pol) {
            currentPolarity = pol;
            rodDischarged = false;
            if (pol === 'neg') {
                btnNeg.className = 'toggle-btn active-neg';
                btnPos.className = 'toggle-btn';
                txtRodType.innerText = '음전하 (-)';
                txtRodType.style.color = '#ff3b30';
                rodMat.color.setHex(0xff3b30);
            } else {
                btnNeg.className = 'toggle-btn';
                btnPos.className = 'toggle-btn active-pos';
                txtRodType.innerText = '양전하 (+)';
                txtRodType.style.color = '#007aff';
                rodMat.color.setHex(0x007aff);
            }
            updateRodParticles(pol, 1.0);
        }

        btnNeg.addEventListener('click', () => setPolarity('neg'));
        btnPos.addEventListener('click', () => setPolarity('pos'));

        let showParticles = true;
        const btnToggleParticles = document.getElementById('btn-toggle-particles');
        btnToggleParticles.addEventListener('click', () => {
            showParticles = !showParticles;
            particlesGroup.visible = showParticles;
            btnToggleParticles.innerText = showParticles ? '표시함' : '숨김';
            btnToggleParticles.classList.toggle('active-pos', showParticles);
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            chargedRodGroup.position.set(1.0, 0.68, 0);
            handGroup.position.set(-0.88, 0.55, 0);
            netCharge = 0;
            isHandGrounded = false;
            isRodContact = false;
            rodDischarged = false;
            sparkMat.opacity = 0;
            const btnGround = document.getElementById('btn-ground-hand');
            const btnSubGround = document.getElementById('btn-sub-ground');
            if (btnGround) btnGround.classList.remove('active');
            if (btnSubGround) btnSubGround.classList.remove('active');
            while (transferParticlesGroup.children.length > 0) transferParticlesGroup.remove(transferParticlesGroup.children[0]);
            activeTransferParticles = [];
            setPolarity('neg');
            showTooltip('🔄 검전기 및 대전체 상태가 초기화되었습니다. (대전체 전하 22개 완전 복원)');
        });

        // 대전체 접촉 및 손가락 접지 버튼 연결
        const btnContactRod = document.getElementById('btn-contact-rod');
        if (btnContactRod) btnContactRod.addEventListener('click', triggerContactRod);
        const btnGroundHand = document.getElementById('btn-ground-hand');
        if (btnGroundHand) btnGroundHand.addEventListener('click', triggerGroundHand);
        const btnSubContact = document.getElementById('btn-sub-contact');
        if (btnSubContact) btnSubContact.addEventListener('click', triggerContactRod);
        const btnSubSeparate = document.getElementById('btn-sub-separate');
        if (btnSubSeparate) btnSubSeparate.addEventListener('click', triggerSeparateRod);
        const btnSubGround = document.getElementById('btn-sub-ground');
        if (btnSubGround) btnSubGround.addEventListener('click', triggerGroundHand);

        document.getElementById('btn-align').addEventListener('click', () => {
            camera.position.set(0, 0.2, 3.2);
            controls.target.set(0, 0, 0);
        });

        document.getElementById('theme-toggle').addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            scene.background.setHex(isDark ? 0x121212 : 0xf2f2f7);
            floor.material.color.setHex(isDark ? 0x1c1c1e : 0xe5e5ea);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 10. 메인 애니메이션 루프 ---
        let lastTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            const dt = Math.min(0.05, (now - lastTime) / 1000);
            lastTime = now;

            updatePhysics();
            updateTransferParticles(dt);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    
        /* ---------- Fullscreen / Windowed Mode Logic ---------- */
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const fullscreenIcon = document.getElementById('fullscreenIcon');
        const fullscreenText = document.getElementById('fullscreenText');

        function updateFullscreenUI() {
            const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
            if (fullscreenIcon) fullscreenIcon.innerText = isFS ? '🗗' : '⛶';
            if (fullscreenText) fullscreenText.innerText = isFS ? '창모드' : '전체화면';
        }

        if (fullscreenBtn) {
            fullscreenBtn.addEventListener('click', () => {
                try {
                    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                        const req = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
                        if (req) req.call(document.documentElement);
                    } else {
                        const exit = document.exitFullscreen || document.webkitExitFullscreen;
                        if (exit) exit.call(document);
                    }
                } catch (err) {
                    console.error('전체화면 모드를 전환할 수 없습니다:', err);
                }
            });
        }

        document.addEventListener('fullscreenchange', updateFullscreenUI);
        document.addEventListener('webkitfullscreenchange', updateFullscreenUI);
    </script>

<script>
/* ============ 모바일 화면 재조정 + 전체화면 대체 동작 (자동 생성) ============ */
(function () {
    var docEl = document.documentElement;
    var btn = document.getElementById('fullscreenBtn');
    var icon = document.getElementById('fullscreenIcon');
    var text = document.getElementById('fullscreenText');

    function realFs() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement ||
                  document.mozFullScreenElement || document.msFullscreenElement);
    }
    function pseudo() { return docEl.classList.contains('pseudo-fs'); }
    function setUI() {
        var on = realFs() || pseudo();
        if (icon) icon.textContent = on ? '🗗' : '⛶';
        if (text) text.textContent = on ? '창모드' : '전체화면';
        if (btn) btn.setAttribute('aria-label', on ? '창모드로 전환' : '전체화면으로 전환');
        document.body.classList.toggle('is-fullscreen', on);
    }
    function toast(msg) {
        var t = document.getElementById('ux-toast');
        if (!t) {
            t = document.createElement('div');
            t.id = 'ux-toast';
            t.style.cssText = 'position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);' +
                'background:rgba(28,28,30,.88);color:#fff;font-size:12px;line-height:1.4;padding:9px 14px;border-radius:14px;' +
                'z-index:9999;max-width:86vw;text-align:center;pointer-events:none;transition:opacity .3s;' +
                'font-family:inherit;box-shadow:0 8px 24px rgba(0,0,0,.25)';
            document.body.appendChild(t);
        }
        t.textContent = msg;
        t.style.opacity = '1';
        clearTimeout(t._t);
        t._t = setTimeout(function () { t.style.opacity = '0'; }, 2600);
    }

    if (btn) {
        btn.addEventListener('click', function () {
            var wasReal = realFs();
            var wasPseudo = pseudo();
            setTimeout(function () {
                if (wasReal) { setUI(); return; }          // 진짜 전체화면에서 나온 경우
                if (wasPseudo) { docEl.classList.remove('pseudo-fs'); setUI(); return; }  // 몰입 모드 해제
                if (!realFs()) {                            // 전체화면 API가 동작하지 않는 환경
                    docEl.classList.add('pseudo-fs');
                    try { window.scrollTo(0, 1); } catch (e) {}
                    toast('이 브라우저는 전체화면을 지원하지 않아 상단 정보를 숨긴 몰입 모드로 표시합니다');
                }
                setUI();
            }, 380);
        }, false);
    }
    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
        document.addEventListener(ev, setUI);
    });

    /* 좁은 화면에서는 3D 장면이 잘리지 않도록 시야각을 넓혀 전체가 들어오게 한다 */
    function mobileFit() {
        try {
            if (typeof camera === 'undefined' || !camera || !camera.isPerspectiveCamera) return;
            if (!camera.userData) camera.userData = {};
            if (!camera.userData.baseFov) camera.userData.baseFov = camera.fov;
            var w = window.innerWidth, h = window.innerHeight, f = 1;
            var k = 0.62;
            var attr = document.documentElement.getAttribute('data-mzoom');
            if (attr) { var v = parseFloat(attr); if (!isNaN(v) && v > 0) k = v; }
            if (w < h) f = 1 + (1 - w / h) * k;
            else if (h <= 500) f = 1 + k * 0.16;
            camera.fov = Math.min(88, camera.userData.baseFov * f);
            camera.updateProjectionMatrix();
        } catch (e) {}
    }
    mobileFit();

    /* 화면 회전·주소창 변화·전체화면 전환 후 렌더러 크기 재계산 */
    var rt = null;
    function refit() {
        clearTimeout(rt);
        rt = setTimeout(function () {
            mobileFit();
            try { window.dispatchEvent(new Event('resize')); } catch (e) {}
        }, 240);
    }
    window.addEventListener('orientationchange', refit);
    window.addEventListener('pageshow', refit);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) refit(); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', refit);

    setUI();
})();
</script>
