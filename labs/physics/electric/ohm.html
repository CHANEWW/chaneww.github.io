<!DOCTYPE html>
<html lang="ko" data-mzoom="1.0">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>옴의 법칙 3D</title>
    <!-- Three.js 및 OrbitControls 3D 엔진 라이브러리 -->
    <script src="../../common/lib/three.min.js"></script>
    <script src="../../common/lib/OrbitControls.js"></script>
    <style>
        @font-face {
            font-family: 'SeoulNamsan';
            src: local('SeoulNamsan M'), local('SeoulNamsanM'), local('서울남산체 M'),
                 url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'SeoulNamsan', -apple-system, sans-serif;
            background-color: #f2f2f7;
            color: #1c1c1e;
            touch-action: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            touch-action: none;
        }

        /* Apple visionOS Glassmorphic UI */
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            z-index: 10;
        }

        /* 좌측 상단 헤더 */
        .top-left-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            color: #1c1c1e;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tag-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
        }

        .tag-pill {
            background: rgba(0, 122, 255, 0.15);
            color: #007aff;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
        }

        /* 우측 상단 데이터 패널 */
        .top-right-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .data-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 20px;
        }

        .data-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .data-label {
            font-size: 11px;
            color: #8e8e93;
            font-weight: bold;
        }

        .data-value {
            font-size: 15px;
            font-weight: bold;
            color: #1c1c1e;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            transition: all 0.2s;
        }

        /* 중앙 안내 툴팁 */
        .center-tooltip {
            position: absolute;
            top: 12%;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 18px;
            font-size: 13px;
            color: #8e8e93;
            border-radius: 30px;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.5s ease;
        }

        /* 부품별 직접 설정 팝업 카드 */
        .config-popover {
            position: absolute;
            display: none;
            flex-direction: column;
            gap: 8px;
            padding: 14px 18px;
            width: 200px;
            z-index: 100;
            box-shadow: 0 12px 36px rgba(0,0,0,0.15);
        }
        .config-popover h4 {
            margin: 0;
            font-size: 13px;
            font-weight: bold;
            color: #1c1c1e;
        }
        .config-popover .pop-val {
            font-size: 18px;
            font-weight: 900;
            color: #007aff;
            margin: 2px 0;
        }
        .config-popover input[type=range] {
            width: 100%;
            margin: 4px 0;
        }

        /* 서브 물리 설정 패널 (우측 하단 배치) */
        .sub-panel {
            position: absolute;
            bottom: 95px;
            right: 20px;
            padding: 18px 22px;
            width: 320px;
            display: none;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .sub-panel.show { display: flex; }

        .control-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 13px;
            font-weight: bold;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: rgba(0, 0, 0, 0.1);
            height: 6px;
            border-radius: 3px;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #007aff;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,122,255,0.4);
        }

        .btn-group {
            display: flex;
            gap: 6px;
            margin-top: 2px;
        }

        .toggle-btn {
            flex: 1;
            padding: 8px;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            background: rgba(255, 255, 255, 0.5);
            color: #1c1c1e;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .toggle-btn.active-on {
            background: #34c759;
            color: white;
            border-color: #34c759;
        }

        .toggle-btn.active-off {
            background: #ff3b30;
            color: white;
            border-color: #ff3b30;
        }

        .toggle-btn.selected {
            background: #007aff;
            color: white;
            border-color: #007aff;
        }

        /* 하단 제어 바 */
        .bottom-control-bar {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            z-index: 10;
        }

        .control-tab-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 14px;
            min-width: 68px;
            border-radius: 14px;
            border: none;
            background: transparent;
            color: #1c1c1e;
            font-size: 12px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-tab-btn.active {
            background: #007aff;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }

        /* 다크 모드 */
        body.dark-mode {
            background-color: #121212;
            color: #f2f2f7;
        }

        body.dark-mode .glass-panel {
            background: rgba(30, 30, 30, 0.75);
            border-color: rgba(255, 255, 255, 0.15);
            color: #f2f2f7;
        }

        body.dark-mode .data-value, body.dark-mode .back-btn {
            color: #f2f2f7;
        }

        body.dark-mode .icon-btn {
            background: rgba(40, 40, 40, 0.75);
            color: #fff;
        }
        body.dark-mode .config-popover h4 {
            color: #f2f2f7;
        }
    
        /* Bottom Right Bar (Fullscreen) */
        .bottom-right-bar {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }
        button.back-btn, button.tag-badge {
            font-family: inherit;
            border: none;
        }
        @media (max-width: 768px) {
            .bottom-right-bar {
                bottom: 15px;
                right: 15px;
            }
        }
    













/* @@MOBILE-BASE v1@@ */
/* ============================================================
   모바일 반응형 보정 (세로/가로) — 자동 생성 블록
   ============================================================ */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
img, canvas { max-width: 100%; }

/* ---------- 모바일 세로 (폭 900px 이하) ---------- */
@media (max-width: 900px) {
    /* 1행: [메인][제목]  ...  [전체화면 아이콘] */
    .top-left-bar {
        top: max(8px, env(safe-area-inset-top)) !important;
        left: 8px !important;
        right: 56px !important;
        gap: 6px !important;
        flex-wrap: nowrap !important;
        align-items: center !important;
        overflow: hidden;
    }
    .top-left-bar .back-btn,
    .top-left-bar > a {
        flex: 0 0 auto;
        padding: 6px 10px !important;
        font-size: 12px !important;
        gap: 4px !important;
        white-space: nowrap;
    }
    .top-left-bar .tag-badge {
        flex: 0 1 auto;
        min-width: 0;
        padding: 6px 10px !important;
        font-size: 12px !important;
        gap: 5px !important;
        white-space: nowrap;
        overflow: hidden;
    }
    .top-left-bar .tag-badge > span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .tag-pill { font-size: 9px !important; padding: 1px 6px !important; flex: 0 0 auto; }

    /* 2행: [데이터 카드 .............][테마] */
    .top-right-bar {
        top: calc(max(8px, env(safe-area-inset-top)) + 40px) !important;
        left: 8px !important;
        right: 8px !important;
        gap: 6px !important;
        justify-content: flex-end !important;
        flex-wrap: nowrap !important;
    }
    .data-card {
        flex: 1 1 0%;
        min-width: 0;
        gap: 4px !important;
        padding: 6px 8px !important;
        justify-content: space-around !important;
        overflow: hidden;
    }
    .data-card { flex-direction: row !important; align-items: center !important; flex-wrap: nowrap !important; }
    .data-item { min-width: 0; flex-direction: column !important; align-items: center !important; gap: 0 !important; }
    .data-item > * { white-space: nowrap; }
    .voltmeter-display { font-size: 24px !important; }
    .data-label { font-size: 9px !important; white-space: nowrap; line-height: 1.2; }
    .data-value { font-size: 12.5px !important; white-space: nowrap; line-height: 1.25; }
    .icon-btn { width: 34px !important; height: 34px !important; min-width: 34px; font-size: 15px !important; flex: 0 0 auto; }

    /* 전체화면: 1행 우측 아이콘 버튼 (글자는 숨김) */
    .bottom-right-bar {
        top: max(8px, env(safe-area-inset-top)) !important;
        bottom: auto !important;
        right: 8px !important;
        left: auto !important;
        z-index: 20;
    }
    .bottom-right-bar button,
    .bottom-right-bar .back-btn {
        padding: 6px 9px !important;
        font-size: 14px !important;
        gap: 4px !important;
        line-height: 1;
    }
    .bottom-right-bar #fullscreenText,
    .bottom-right-bar .fs-text { display: none !important; }

    /* 안내 문구 */
    .center-tooltip, #guide-tooltip {
        top: calc(max(8px, env(safe-area-inset-top)) + 88px) !important;
        left: 8px !important;
        right: 8px !important;
        transform: none !important;
        margin: 0 auto;
        width: auto !important;
        max-width: none !important;
        font-size: 11.5px !important;
        padding: 7px 12px !important;
        white-space: normal !important;
        line-height: 1.45;
        text-align: center;
        z-index: 15 !important;
    }

    /* 하단 컨트롤 바: 화면 폭 전체, 한 줄 유지 */
    .bottom-control-bar {
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        transform: none !important;
        width: 100% !important;
        border-radius: 18px 18px 0 0 !important;
        padding: 6px 6px calc(6px + env(safe-area-inset-bottom)) !important;
        gap: 2px !important;
        justify-content: space-around !important;
        flex-wrap: nowrap !important;
        overflow: visible;
    }
    .control-tab-btn {
        flex: 1 1 0 !important;
        min-width: 0 !important;
        padding: 5px 2px !important;
        font-size: 10.5px !important;
        gap: 1px !important;
        border-radius: 12px !important;
        white-space: nowrap !important;
        line-height: 1.15;
    }
    .control-tab-btn span { white-space: nowrap !important; }
    .control-tab-btn span:first-child { font-size: 15px !important; line-height: 1.1; }

    /* 슬라이더 등 서브 패널 */
    .sub-panel {
        left: 8px !important;
        right: 8px !important;
        bottom: calc(76px + env(safe-area-inset-bottom)) !important;
        transform: none !important;
        width: auto !important;
        max-width: none !important;
        max-height: 46vh;
        overflow-y: auto;
        padding: 13px 14px !important;
        gap: 10px !important;
        -webkit-overflow-scrolling: touch;
    }
    .sub-panel-title { font-size: 11px !important; }
    .slider-header { font-size: 11px !important; }
    .control-row { gap: 5px !important; flex-wrap: wrap; }
    .toggle-btn, .mode-btn, .quick-btn, .example-item, .preset-btn { font-size: 11px !important; }
    input[type="range"] { height: 22px; }

    /* 팝업(모달)이 화면을 넘지 않도록 */
    .modal-overlay { padding: 12px !important; align-items: center !important; }
    .modal-card {
        max-height: 88vh !important;
        overflow-y: auto !important;
        width: auto !important;
        max-width: 100% !important;
        padding: 16px !important;
        -webkit-overflow-scrolling: touch;
    }
    .modal-title { font-size: 15px !important; }
    .modal-body { font-size: 12px !important; }
    .example-title { font-size: 11.5px !important; }
    .example-desc { font-size: 11px !important; line-height: 1.5 !important; }
}

@media (max-width: 430px) {
    /* 아주 좁은 화면에서는 장식용 배지를 숨겨 제목 자리를 확보 */
    .tag-pill { display: none !important; }
}

/* ---------- 모바일 가로 (높이 500px 이하) ---------- */
@media (max-height: 500px) and (orientation: landscape) {
    .top-left-bar {
        top: max(6px, env(safe-area-inset-top)) !important;
        left: 6px !important;
        right: auto !important;
        max-width: 46vw;
        gap: 5px !important;
    }
    .top-left-bar .back-btn,
    .top-left-bar > a,
    .top-left-bar .tag-badge {
        padding: 4px 9px !important;
        font-size: 11px !important;
        height: 30px;
    }
    .tag-pill { display: none !important; }

    .top-right-bar {
        top: max(6px, env(safe-area-inset-top)) !important;
        right: 88px !important;
        left: auto !important;
        gap: 5px !important;
    }
    .data-card { padding: 4px 9px !important; gap: 9px !important; flex: 0 0 auto; }
    .data-label { font-size: 8.5px !important; }
    .data-value { font-size: 11.5px !important; }
    .icon-btn { width: 28px !important; height: 28px !important; min-width: 28px; font-size: 13px !important; }

    .bottom-right-bar {
        top: max(6px, env(safe-area-inset-top)) !important;
        bottom: auto !important;
        right: 6px !important;
        z-index: 20;
    }
    .bottom-right-bar button,
    .bottom-right-bar .back-btn { padding: 4px 8px !important; font-size: 13px !important; }
    .bottom-right-bar #fullscreenText,
    .bottom-right-bar .fs-text { display: none !important; }

    .center-tooltip, #guide-tooltip {
        top: auto !important;
        bottom: 56px !important;
        left: 50% !important;
        right: auto !important;
        transform: translateX(-50%) !important;
        width: max-content !important;
        max-width: 44vw !important;
        font-size: 10px !important;
        padding: 4px 9px !important;
        line-height: 1.3;
    }

    /* 가로 모드에서 각종 패널을 구석으로 모아 3D 화면을 가리지 않게 한다 */
    .side-panel { top: 44px !important; right: 8px !important; left: auto !important; width: 214px !important; padding: 7px 9px !important; gap: 4px !important; }
    .side-title { font-size: 10.5px !important; }
    .side-scale { font-size: 8.5px !important; }
    .meter-panel { left: 8px !important; bottom: 40px !important; top: auto !important; width: 190px !important; padding: 6px 8px !important; gap: 3px !important; }
    .meter-title { font-size: 9.5px !important; }
    .action-panel { top: auto !important; bottom: 40px !important; right: 8px !important; left: auto !important; grid-template-columns: repeat(2, 44px) !important; gap: 4px !important; }
    .side-btn { width: 44px !important; height: 44px !important; font-size: 8.5px !important; border-radius: 12px !important; gap: 1px !important; }
    .energy-panel { left: 8px !important; bottom: 40px !important; top: auto !important; width: 176px !important; padding: 6px 8px !important; gap: 4px !important; }
    .energy-title, .panel-note { font-size: 9px !important; line-height: 1.3 !important; }
    .info-panel { right: 8px !important; bottom: 40px !important; top: auto !important; min-width: 128px !important; padding: 6px 8px !important; gap: 2px !important; }
    .info-row { font-size: 9.5px !important; gap: 8px !important; }
    .view-panel { left: 8px !important; bottom: 40px !important; top: auto !important; padding: 6px 8px !important; }
    .phase-panel { left: 8px !important; bottom: 40px !important; top: auto !important; padding: 6px 8px !important; }
    .graph-panel { max-height: 40vh; width: 182px !important; }
    .legend, .panel-note { font-size: 9px !important; }

    .bottom-control-bar {
        left: 50% !important;
        right: auto !important;
        bottom: 4px !important;
        transform: translateX(-50%) !important;
        width: auto !important;
        max-width: calc(100vw - 12px);
        border-radius: 14px !important;
        padding: 4px 8px !important;
        gap: 3px !important;
    }
    .control-tab-btn {
        flex: 0 0 auto !important;
        min-width: 46px !important;
        padding: 3px 9px !important;
        font-size: 10px !important;
        gap: 3px !important;
        align-items: center !important;
        justify-content: center !important;
    }
    .control-tab-btn span:first-child { font-size: 13px !important; }

    .sub-panel {
        left: 50% !important;
        right: auto !important;
        bottom: 96px !important;
        transform: translateX(-50%) !important;
        width: min(400px, calc(100vw - 24px)) !important;
        max-width: min(400px, calc(100vw - 24px)) !important;
        max-height: 62vh;
        overflow-y: auto;
        padding: 9px 12px !important;
        gap: 6px !important;
    }
    .sub-panel .slider-row { gap: 3px !important; }
    .slider-header { font-size: 10.5px !important; }

    .modal-overlay { padding: 8px !important; }
    .modal-card {
        max-height: 94vh !important;
        overflow-y: auto !important;
        width: auto !important;
        max-width: min(460px, 96vw) !important;
        padding: 12px 14px !important;
    }
    .modal-title { font-size: 14px !important; }
    .modal-body { font-size: 11.5px !important; }
    .example-desc { font-size: 11px !important; line-height: 1.45 !important; }
}

/* ---------- 몰입(의사 전체화면) 모드 ---------- */
html.pseudo-fs .top-left-bar .tag-badge,
html.pseudo-fs .top-right-bar,
html.pseudo-fs .center-tooltip,
html.pseudo-fs #guide-tooltip { display: none !important; }
html.pseudo-fs .top-left-bar { right: 56px !important; }
html.pseudo-fs #fullscreenBtn,
html.pseudo-fs .bottom-right-bar { display: flex !important; }

body.is-fullscreen #webgl-container { width: 100vw !important; height: 100vh !important; }

            </div>
            <div class="data-item">
                <span class="data-label">저항 (R)</span>
                <span class="data-value" id="val-resistance" style="color:#ff9500;">10.0 Ω</span>
            </div>
            <div class="data-item">
                <span class="data-label">전류 (I)</span>
                <span class="data-value" id="val-current" style="color:#34c759;">0.60 A</span>
            </div>
            <div class="data-item">
                <span class="data-label">전력 (P)</span>
                <span class="data-value" id="val-power" style="color:#ff2d55;">3.60 W</span>
            </div>
        </div>
        <button class="icon-btn glass-panel" id="theme-toggle">🌙</button>
    </div>

    <!-- 중앙 안내 툴팁 -->
    <div class="glass-panel center-tooltip" id="guide-tooltip">
        💡 스위치를 클릭하여 회로를 켜거나, 전지·전구를 클릭해 값을 설정하세요.
    </div>

    <!-- 부품 클릭 설정 팝업 카드 -->
    <div class="glass-panel config-popover" id="config-popover">
        <h4 id="pop-title">전지 설정</h4>
        <div class="pop-val" id="pop-value-text">6.0 V</div>
        <input type="range" id="pop-slider" min="1" max="12" step="0.5" value="6">
    </div>

    <!-- 서브 조절 패널 (우측 하단 배치) -->
    <div class="glass-panel sub-panel" id="physics-panel">
        <div class="control-row">
            <div class="control-header">
                <span>전원 전압 (V)</span>
                <span id="txt-voltage" style="color:#007aff;">6.0 V</span>
            </div>
            <input type="range" id="sld-voltage" min="1" max="12" step="0.5" value="6">
        </div>
        <div class="control-row">
            <div class="control-header">
                <span>전구/저항값 (R)</span>
                <span id="txt-resistance" style="color:#ff9500;">10.0 Ω</span>
            </div>
            <input type="range" id="sld-resistance" min="2" max="30" step="1" value="10">
        </div>
        <div class="control-row">
            <span>스위치 개폐</span>
            <div class="btn-group">
                <button class="toggle-btn active-off" id="btn-switch-toggle">스위치 열림 (OFF)</button>
            </div>
        </div>
        <div class="control-row">
            <span>전지 극성 전환</span>
            <div class="btn-group">
                <button class="toggle-btn" id="btn-battery-reverse">전지 방향 반전 (현재: 정방향)</button>
            </div>
        </div>
        <div class="control-row">
            <span>흐름 시각화 선택</span>
            <div class="btn-group">
                <button class="toggle-btn selected" id="btn-mode-electron">전자 흐름 (-)</button>
                <button class="toggle-btn" id="btn-mode-current">전류 방향 (➔)</button>
            </div>
        </div>
    </div>

    <!-- 하단 제어 바 -->
    <div class="glass-panel bottom-control-bar">
        <button class="control-tab-btn" id="btn-toggle-physics">
            <span>⚙️</span>
            <span>회로 설정</span>
        </button>
        <button class="control-tab-btn" id="btn-reset">
            <span>🔄</span>
            <span>초기화</span>
        </button>
        <button class="control-tab-btn" id="btn-align">
            <span>📷</span>
            <span>시점정렬</span>
        </button>
    </div>

    
    <!-- Fullscreen / Windowed Mode Button -->
    <div class="bottom-right-bar">
        <button id="fullscreenBtn" class="glass-panel back-btn">
            <span id="fullscreenIcon">⛶</span>
            <span id="fullscreenText">전체화면</span>
        </button>
    </div>

    <script>
        // --- 1. Three.js 기본 씬 & 카메라 설정 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf2f2f7);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3.2, 4.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2.1;

        // --- 2. 조명 연출 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(4, 6, 3);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- 3. 바닥 (격자 무늬 제거) ---
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(20, 20),
            new THREE.MeshStandardMaterial({ color: 0xe5e5ea, roughness: 0.8 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.5;
        floor.receiveShadow = true;
        scene.add(floor);

        // --- 4. 회로 변수 및 상태 ---
        let voltage = 6.0;
        let resistance = 10.0;
        let isClosed = false;
        let isBatteryReversed = false;
        let viewMode = 'electron';

        const pathPoints = [
            new THREE.Vector3(-1.8, 0, -1.0),
            new THREE.Vector3(1.8, 0, -1.0),
            new THREE.Vector3(1.8, 0, 1.0),
            new THREE.Vector3(-1.8, 0, 1.0)
        ];

        // --- 5. 3D 회로 구성 요소 모델링 ---
        const circuitGroup = new THREE.Group();
        scene.add(circuitGroup);

        function createWireSegment(p1, p2) {
            const dir = new THREE.Vector3().subVectors(p2, p1);
            const len = dir.length();
            const wireGeo = new THREE.CylinderGeometry(0.02, 0.02, len, 16);
            const wireMat = new THREE.MeshStandardMaterial({ color: 0xb87333, metalness: 0.8, roughness: 0.3 });
            const mesh = new THREE.Mesh(wireGeo, wireMat);
            mesh.position.copy(p1).add(p2).multiplyScalar(0.5);
            mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
            return mesh;
        }

        circuitGroup.add(createWireSegment(pathPoints[0], pathPoints[1]));
        circuitGroup.add(createWireSegment(pathPoints[1], pathPoints[2]));
        circuitGroup.add(createWireSegment(pathPoints[2], pathPoints[3]));
        circuitGroup.add(createWireSegment(pathPoints[3], pathPoints[0]));

        // --- 양각 형태의 선명한 + / - 극성 텍스처 생성 함수 ---
        function createTerminalTexture(text, colorStr) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; 
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            ctx.lineWidth = 45;
            ctx.strokeStyle = colorStr === '#ef4444' ? '#b91c1c' : '#1d4ed8';
            ctx.fillStyle = colorStr;
            ctx.font = '900 380px -apple-system,BlinkMacSystemFont,sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            ctx.strokeText(text, 256, 256);
            ctx.fillText(text, 256, 256);
            
            const tex = new THREE.CanvasTexture(canvas);
            tex.minFilter = THREE.LinearFilter;
            tex.generateMipmaps = false;
            tex.needsUpdate = true;
            return tex;
        }

        // 전기회로 실험실 표준형 전지(Battery) 모델링 - 전구와 비슷한 크기로 축소
        const batteryGroup = new THREE.Group();

        const batMid = new THREE.Group();
        // 본체통 (어두운 회색)
        const batBodyMesh = new THREE.Mesh(
            new THREE.CylinderGeometry(0.3, 0.3, 1.0, 28).rotateZ(Math.PI/2),
            new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.3, metalness: 0.4 })
        );
        batBodyMesh.castShadow = true;
        batMid.add(batBodyMesh);

        // 양극 돌출부 (노란색/금속성)
        const batCapMesh = new THREE.Mesh(
            new THREE.CylinderGeometry(0.305, 0.305, 0.45, 28).rotateZ(Math.PI/2),
            new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.8, roughness: 0.2 })
        );
        batCapMesh.position.x = -0.48;
        batMid.add(batCapMesh);

        const batTipMesh = new THREE.Mesh(
            new THREE.CylinderGeometry(0.12, 0.12, 0.12, 28).rotateZ(Math.PI/2),
            new THREE.MeshStandardMaterial({ color: 0xe5e7eb, metalness: 0.9 })
        );
        batTipMesh.position.x = -0.78;
        batMid.add(batTipMesh);

        // 양각 + / - 기호 부착 (왼쪽이 +, 오른쪽이 -)
        const pTex = createTerminalTexture('+', '#ef4444');
        const mTex = createTerminalTexture('-', '#3b82f6');
        const pMat = new THREE.MeshBasicMaterial({ map: pTex, transparent: true, side: THREE.DoubleSide });
        const mMat = new THREE.MeshBasicMaterial({ map: mTex, transparent: true, side: THREE.DoubleSide });

        const pLabel = new THREE.Mesh(new THREE.PlaneGeometry(0.38, 0.38), pMat);
        pLabel.rotation.x = -Math.PI / 2; 
        pLabel.position.set(-0.5, 0.32, 0); 
        batMid.add(pLabel);

        const mLabel = new THREE.Mesh(new THREE.PlaneGeometry(0.38, 0.38), mMat);
        mLabel.rotation.x = -Math.PI / 2; 
        mLabel.position.set(0.4, 0.32, 0); 
        batMid.add(mLabel);

        // 크기 50%로 축소 후 중앙 정렬 (빨간 구슬 및 리드선 삭제됨)
        batMid.scale.set(0.5, 0.5, 0.5);
        batMid.position.x = 0.085;
        batteryGroup.add(batMid);
        batteryGroup.position.set(0, 0.08, 1.0);
        scene.add(batteryGroup);

        // 스위치 배치
        const switchGroup = new THREE.Group();
        switchGroup.position.copy(pathPoints[1]).add(pathPoints[2]).multiplyScalar(0.5);

        const swBaseGeo = new THREE.BoxGeometry(0.2, 0.06, 0.5);
        const swBaseMat = new THREE.MeshStandardMaterial({ color: 0x8e8e93, roughness: 0.4 });
        const swBase = new THREE.Mesh(swBaseGeo, swBaseMat);
        switchGroup.add(swBase);

        const termGeo = new THREE.BoxGeometry(0.08, 0.12, 0.08);
        const termMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, metalness: 0.9, roughness: 0.2 });
        const term1 = new THREE.Mesh(termGeo, termMat);
        term1.position.set(0, 0.08, -0.18);
        const term2 = new THREE.Mesh(termGeo, termMat);
        term2.position.set(0, 0.08, 0.18);
        switchGroup.add(term1);
        switchGroup.add(term2);

        const swPivot = new THREE.Group();
        swPivot.position.set(0, 0.08, 0.18);

        const swArmGeo = new THREE.BoxGeometry(0.04, 0.03, 0.36);
        const swArmMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, metalness: 0.9, roughness: 0.2 });
        const swArm = new THREE.Mesh(swArmGeo, swArmMat);
        swArm.position.set(0, 0.015, -0.18);

        const handleGeo = new THREE.CylinderGeometry(0.035, 0.035, 0.14, 16);
        const handleMat = new THREE.MeshStandardMaterial({ color: 0xff3b30, roughness: 0.3 });
        const handle = new THREE.Mesh(handleGeo, handleMat);
        handle.position.set(0, 0.07, -0.15);
        swArm.add(handle);

        swPivot.add(swArm);
        switchGroup.add(swPivot);

        circuitGroup.add(switchGroup);

        // 전구 배치
        const bulbGroup = new THREE.Group();
        bulbGroup.position.copy(pathPoints[0]).add(pathPoints[3]).multiplyScalar(0.5);

        const socketGeo = new THREE.CylinderGeometry(0.14, 0.16, 0.12, 24);
        const socketMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3c, metalness: 0.5 });
        const socketMesh = new THREE.Mesh(socketGeo, socketMat);
        bulbGroup.add(socketMesh);

        const glassGeo = new THREE.SphereGeometry(0.18, 24, 24);
        const glassMat = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.6,
            roughness: 0.1
        });
        const glassMesh = new THREE.Mesh(glassGeo, glassMat);
        glassMesh.position.y = 0.18;
        bulbGroup.add(glassMesh);

        const filamentGeo = new THREE.SphereGeometry(0.05, 12, 12);
        const filamentMat = new THREE.MeshStandardMaterial({
            color: 0xffcc00,
            emissive: 0xffaa00,
            emissiveIntensity: 0.0
        });
        const filamentMesh = new THREE.Mesh(filamentGeo, filamentMat);
        filamentMesh.position.y = 0.18;
        bulbGroup.add(filamentMesh);

        const bulbLight = new THREE.PointLight(0xffaa00, 0, 4);
        bulbLight.position.y = 0.18;
        bulbGroup.add(bulbLight);

        circuitGroup.add(bulbGroup);

        // --- 6. 전자/전류 시각화 입자 생성 ---
        const numParticles = 28;

        function createSingleMinusTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#007aff';
            ctx.beginPath();
            ctx.arc(64, 64, 60, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#1c1c1e';
            ctx.beginPath();
            ctx.roundRect ? ctx.roundRect(32, 54, 64, 20, 6) : ctx.fillRect(32, 54, 64, 20);
            ctx.fill();

            return new THREE.CanvasTexture(canvas);
        }

        const electronTex = createSingleMinusTexture();
        const electronGeo = new THREE.SphereGeometry(0.045, 16, 16);
        const electronMat = new THREE.MeshBasicMaterial({ map: electronTex });

        const electrons = [];
        for (let i = 0; i < numParticles; i++) {
            const mesh = new THREE.Mesh(electronGeo, electronMat);
            mesh.rotation.x = -Math.PI / 2;
            scene.add(mesh);
            electrons.push({ mesh, progress: i / numParticles });
        }

        function createArrowMesh() {
            const group = new THREE.Group();
            const stemGeo = new THREE.CylinderGeometry(0.015, 0.015, 0.08, 8);
            const headGeo = new THREE.ConeGeometry(0.045, 0.07, 8);
            const mat = new THREE.MeshBasicMaterial({ color: 0xff3b30 });

            const head = new THREE.Mesh(headGeo, mat);
            head.rotation.x = Math.PI / 2;
            head.position.z = 0.035;

            const stem = new THREE.Mesh(stemGeo, mat);
            stem.rotation.x = Math.PI / 2;
            stem.position.z = -0.035;

            group.add(stem);
            group.add(head);
            return group;
        }

        const currents = [];
        for (let i = 0; i < numParticles; i++) {
            const mesh = createArrowMesh();
            scene.add(mesh);
            currents.push({ mesh, progress: i / numParticles });
        }

        function getCircuitTrackInfo(t) {
            t = (t % 1 + 1) % 1;
            const seg = t * 4;
            const idx = Math.floor(seg);
            const subT = seg - idx;
            const pA = pathPoints[idx];
            const pB = pathPoints[(idx + 1) % 4];
            const pos = new THREE.Vector3().lerpVectors(pA, pB, subT);
            const dir = new THREE.Vector3().subVectors(pB, pA).normalize();
            return { pos, dir };
        }

        // --- 7. 인터랙션 및 팝업 제어 ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let selectedPart = null; // 'battery' 또는 'bulb'

        const popover = document.getElementById('config-popover');
        const popTitle = document.getElementById('pop-title');
        const popValText = document.getElementById('pop-value-text');
        const popSlider = document.getElementById('pop-slider');

        function getMousePos(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        }

        function toggleSwitchState(closed) {
            isClosed = closed !== undefined ? closed : !isClosed;
            const btn = document.getElementById('btn-switch-toggle');
            if (isClosed) {
                swPivot.rotation.x = 0;
                btn.className = 'toggle-btn active-on';
                btn.innerText = '스위치 닫힘 (ON)';
            } else {
                swPivot.rotation.x = Math.PI / 4;
                btn.className = 'toggle-btn active-off';
                btn.innerText = '스위치 열림 (OFF)';
            }
        }

        function handleSceneClick(e) {
            getMousePos(e);
            raycaster.setFromCamera(mouse, camera);

            // 1. 스위치 클릭 검사
            const swIntersects = raycaster.intersectObjects([swArm, handle, swBase, term1, term2], true);
            if (swIntersects.length > 0) {
                toggleSwitchState();
                popover.style.display = 'none';
                selectedPart = null;
                const tooltip = document.getElementById('guide-tooltip');
                if (tooltip) tooltip.style.opacity = '0';
                return;
            }

            // 2. 전지(Battery) 클릭 검사
            const batIntersects = raycaster.intersectObjects(batteryGroup.children, true);
            if (batIntersects.length > 0) {
                selectedPart = 'battery';
                popTitle.innerText = '전지 전압 설정';
                popSlider.min = '1';
                popSlider.max = '12';
                popSlider.step = '0.5';
                popSlider.value = voltage;
                popValText.innerText = voltage.toFixed(1) + ' V';
                popover.style.display = 'flex';
                return;
            }

            // 3. 전구(Bulb) 클릭 검사
            const bulbIntersects = raycaster.intersectObjects(bulbGroup.children, true);
            if (bulbIntersects.length > 0) {
                selectedPart = 'bulb';
                popTitle.innerText = '저항값 설정';
                popSlider.min = '2';
                popSlider.max = '30';
                popSlider.step = '1';
                popSlider.value = resistance;
                popValText.innerText = resistance.toFixed(1) + ' Ω';
                popover.style.display = 'flex';
                return;
            }

            // 빈 공간을 (드래그 없이) 클릭했을 때만 팝업 닫기
            popover.style.display = 'none';
            selectedPart = null;
        }

        // 3D 캔버스에서만 클릭 판정, 드래그(회전)는 클릭으로 취급하지 않음
        // → 팝업 슬라이더를 조작해도 팝업이 닫히지 않음
        let downX = 0, downY = 0, downValid = false;
        renderer.domElement.addEventListener('pointerdown', (e) => {
            downX = e.clientX;
            downY = e.clientY;
            downValid = true;
        });
        renderer.domElement.addEventListener('pointerup', (e) => {
            if (!downValid) return;
            downValid = false;
            const moved = Math.hypot(e.clientX - downX, e.clientY - downY);
            if (moved < 6) handleSceneClick(e);
        });

        // 팝업 내부 조작이 아래로 전달되지 않도록 차단
        ['pointerdown', 'pointerup', 'click'].forEach(evt => {
            popover.addEventListener(evt, (e) => e.stopPropagation());
        });

        // 팝업 슬라이더 조작 이벤트
        popSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            if (selectedPart === 'battery') {
                voltage = val;
                popValText.innerText = voltage.toFixed(1) + ' V';
                document.getElementById('txt-voltage').innerText = voltage.toFixed(1) + ' V';
                document.getElementById('val-voltage').innerText = voltage.toFixed(1) + ' V';
                sldVoltage.value = voltage;
            } else if (selectedPart === 'bulb') {
                resistance = val;
                popValText.innerText = resistance.toFixed(1) + ' Ω';
                document.getElementById('txt-resistance').innerText = resistance.toFixed(1) + ' Ω';
                document.getElementById('val-resistance').innerText = resistance.toFixed(1) + ' Ω';
                sldResistance.value = resistance;
            }
        });

        // --- 8. UI 컨트롤 이벤트 ---
        const btnTogglePhysics = document.getElementById('btn-toggle-physics');
        const physicsPanel = document.getElementById('physics-panel');
        btnTogglePhysics.addEventListener('click', () => {
            physicsPanel.classList.toggle('show');
            btnTogglePhysics.classList.toggle('active');
        });

        const sldVoltage = document.getElementById('sld-voltage');
        const sldResistance = document.getElementById('sld-resistance');

        sldVoltage.addEventListener('input', (e) => {
            voltage = parseFloat(e.target.value);
            document.getElementById('txt-voltage').innerText = voltage.toFixed(1) + ' V';
            document.getElementById('val-voltage').innerText = voltage.toFixed(1) + ' V';
            if (selectedPart === 'battery') {
                popValText.innerText = voltage.toFixed(1) + ' V';
                popSlider.value = voltage;
            }
        });

        sldResistance.addEventListener('input', (e) => {
            resistance = parseFloat(e.target.value);
            document.getElementById('txt-resistance').innerText = resistance.toFixed(1) + ' Ω';
            document.getElementById('val-resistance').innerText = resistance.toFixed(1) + ' Ω';
            if (selectedPart === 'bulb') {
                popValText.innerText = resistance.toFixed(1) + ' Ω';
                popSlider.value = resistance;
            }
        });

        document.getElementById('btn-switch-toggle').addEventListener('click', () => toggleSwitchState());

        document.getElementById('btn-battery-reverse').addEventListener('click', () => {
            isBatteryReversed = !isBatteryReversed;
            batteryGroup.rotation.y = isBatteryReversed ? Math.PI : 0;
            const btn = document.getElementById('btn-battery-reverse');
            btn.innerText = isBatteryReversed ? '전지 방향 반전 (현재: 역방향)' : '전지 방향 반전 (현재: 정방향)';
        });

        const btnElectron = document.getElementById('btn-mode-electron');
        const btnCurrent = document.getElementById('btn-mode-current');

        btnElectron.addEventListener('click', () => {
            viewMode = 'electron';
            btnElectron.classList.add('selected');
            btnCurrent.classList.remove('selected');
        });

        btnCurrent.addEventListener('click', () => {
            viewMode = 'current';
            btnCurrent.classList.add('selected');
            btnElectron.classList.remove('selected');
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            voltage = 6.0;
            resistance = 10.0;
            sldVoltage.value = 6;
            sldResistance.value = 10;
            document.getElementById('txt-voltage').innerText = '6.0 V';
            document.getElementById('val-voltage').innerText = '6.0 V';
            document.getElementById('txt-resistance').innerText = '10.0 Ω';
            document.getElementById('val-resistance').innerText = '10.0 Ω';
            
            isBatteryReversed = false;
            batteryGroup.rotation.y = 0;
            document.getElementById('btn-battery-reverse').innerText = '전지 방향 반전 (현재: 정방향)';

            viewMode = 'electron';
            btnElectron.classList.add('selected');
            btnCurrent.classList.remove('selected');

            toggleSwitchState(false);
            popover.style.display = 'none';
            selectedPart = null;
        });

        document.getElementById('btn-align').addEventListener('click', () => {
            camera.position.set(0, 3.2, 4.5);
            controls.target.set(0, 0, 0);
        });

        document.getElementById('theme-toggle').addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            scene.background.setHex(isDark ? 0x121212 : 0xf2f2f7);
            floor.material.color.setHex(isDark ? 0x1c1c1e : 0xe5e5ea);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        toggleSwitchState(false);

        // --- 9. 시뮬레이션 애니메이션 루프 ---
        const clock = new THREE.Clock();
        const tempV3 = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            const current = isClosed ? (voltage / resistance) : 0;
            const power = isClosed ? (voltage * current) : 0;

            document.getElementById('val-current').innerText = current.toFixed(2) + ' A';
            document.getElementById('val-power').innerText = power.toFixed(2) + ' W';

            const brightness = isClosed ? Math.min(1.0, power / 15.0) : 0;
            filamentMat.emissiveIntensity = brightness * 3.0;
            bulbLight.intensity = brightness * 3.5;

            const flowSpeed = current * 0.12;

            // 경로(progress 증가) 방향 = 전지 (+)극에서 나가는 전류(conventional current) 방향
            // 전자는 그 반대 방향으로 이동
            const currentDirection = isBatteryReversed ? -1 : 1;
            const electronDirection = -currentDirection;

            // (1) 전자 애니메이션
            electrons.forEach((e) => {
                if (isClosed && viewMode === 'electron') {
                    e.progress += delta * flowSpeed * electronDirection;
                    const track = getCircuitTrackInfo(e.progress);
                    e.mesh.position.copy(track.pos);
                    e.mesh.position.y += 0.04;
                    e.mesh.visible = true;
                } else {
                    e.mesh.visible = false;
                }
            });

            // (2) 전류 화살표 애니메이션
            currents.forEach((c) => {
                if (isClosed && viewMode === 'current') {
                    c.progress += delta * flowSpeed * currentDirection;
                    const track = getCircuitTrackInfo(c.progress);
                    c.mesh.position.copy(track.pos);
                    c.mesh.position.y += 0.04;

                    const lookTarget = track.pos.clone().add(track.dir.clone().multiplyScalar(currentDirection));
                    lookTarget.y += 0.04;
                    c.mesh.lookAt(lookTarget);

                    c.mesh.visible = true;
                } else {
                    c.mesh.visible = false;
                }
            });

            // 선택된 부품이 있을 때 팝업창 위치를 3D 좌표에 실시간 고정
            if (selectedPart) {
                let targetPos = selectedPart === 'battery' ? batteryGroup.position : bulbGroup.position;
                tempV3.copy(targetPos);
                tempV3.y += 0.5;
                tempV3.project(camera);
                const sx = (tempV3.x * 0.5 + 0.5) * window.innerWidth;
                const sy = (-tempV3.y * 0.5 + 0.5) * window.innerHeight;
                popover.style.left = Math.max(20, Math.min(window.innerWidth - 220, sx - 100)) + 'px';
                popover.style.top = Math.max(20, Math.min(window.innerHeight - 150, sy - 110)) + 'px';
            }

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    
        /* ---------- Fullscreen / Windowed Mode Logic ---------- */
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const fullscreenIcon = document.getElementById('fullscreenIcon');
        const fullscreenText = document.getElementById('fullscreenText');

        function updateFullscreenUI() {
            const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
            if (fullscreenIcon) fullscreenIcon.innerText = isFS ? '🗗' : '⛶';
            if (fullscreenText) fullscreenText.innerText = isFS ? '창모드' : '전체화면';
        }

        if (fullscreenBtn) {
            fullscreenBtn.addEventListener('click', () => {
                try {
                    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                        const req = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
                        if (req) req.call(document.documentElement);
                    } else {
                        const exit = document.exitFullscreen || document.webkitExitFullscreen;
                        if (exit) exit.call(document);
                    }
                } catch (err) {
                    console.error('전체화면 모드를 전환할 수 없습니다:', err);
                }
            });
        }

        document.addEventListener('fullscreenchange', updateFullscreenUI);
        document.addEventListener('webkitfullscreenchange', updateFullscreenUI);
    </script>

<script>
/* ============ 모바일 화면 재조정 + 전체화면 대체 동작 (자동 생성) ============ */
(function () {
    var docEl = document.documentElement;
    var btn = document.getElementById('fullscreenBtn');
    var icon = document.getElementById('fullscreenIcon');
    var text = document.getElementById('fullscreenText');

    function realFs() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement ||
                  document.mozFullScreenElement || document.msFullscreenElement);
    }
    function pseudo() { return docEl.classList.contains('pseudo-fs'); }
    function setUI() {
        var on = realFs() || pseudo();
        if (icon) icon.textContent = on ? '🗗' : '⛶';
        if (text) text.textContent = on ? '창모드' : '전체화면';
        if (btn) btn.setAttribute('aria-label', on ? '창모드로 전환' : '전체화면으로 전환');
        document.body.classList.toggle('is-fullscreen', on);
    }
    function toast(msg) {
        var t = document.getElementById('ux-toast');
        if (!t) {
            t = document.createElement('div');
            t.id = 'ux-toast';
            t.style.cssText = 'position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);' +
                'background:rgba(28,28,30,.88);color:#fff;font-size:12px;line-height:1.4;padding:9px 14px;border-radius:14px;' +
                'z-index:9999;max-width:86vw;text-align:center;pointer-events:none;transition:opacity .3s;' +
                'font-family:inherit;box-shadow:0 8px 24px rgba(0,0,0,.25)';
            document.body.appendChild(t);
        }
        t.textContent = msg;
        t.style.opacity = '1';
        clearTimeout(t._t);
        t._t = setTimeout(function () { t.style.opacity = '0'; }, 2600);
    }

    if (btn) {
        btn.addEventListener('click', function () {
            var wasReal = realFs();
            var wasPseudo = pseudo();
            setTimeout(function () {
                if (wasReal) { setUI(); return; }          // 진짜 전체화면에서 나온 경우
                if (wasPseudo) { docEl.classList.remove('pseudo-fs'); setUI(); return; }  // 몰입 모드 해제
                if (!realFs()) {                            // 전체화면 API가 동작하지 않는 환경
                    docEl.classList.add('pseudo-fs');
                    try { window.scrollTo(0, 1); } catch (e) {}
                    toast('이 브라우저는 전체화면을 지원하지 않아 상단 정보를 숨긴 몰입 모드로 표시합니다');
                }
                setUI();
            }, 380);
        }, false);
    }
    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
        document.addEventListener(ev, setUI);
    });

    /* 좁은 화면에서는 3D 장면이 잘리지 않도록 시야각을 넓혀 전체가 들어오게 한다 */
    function mobileFit() {
        try {
            if (typeof camera === 'undefined' || !camera || !camera.isPerspectiveCamera) return;
            if (!camera.userData) camera.userData = {};
            if (!camera.userData.baseFov) camera.userData.baseFov = camera.fov;
            var w = window.innerWidth, h = window.innerHeight, f = 1;
            var k = 0.62;
            var attr = document.documentElement.getAttribute('data-mzoom');
            if (attr) { var v = parseFloat(attr); if (!isNaN(v) && v > 0) k = v; }
            if (w < h) f = 1 + (1 - w / h) * k;
            else if (h <= 500) f = 1 + k * 0.16;
            camera.fov = Math.min(88, camera.userData.baseFov * f);
            camera.updateProjectionMatrix();
        } catch (e) {}
    }
    mobileFit();

    /* 화면 회전·주소창 변화·전체화면 전환 후 렌더러 크기 재계산 */
    var rt = null;
    function refit() {
        clearTimeout(rt);
        rt = setTimeout(function () {
            mobileFit();
            try { window.dispatchEvent(new Event('resize')); } catch (e) {}
        }, 240);
    }
    window.addEventListener('orientationchange', refit);
    window.addEventListener('pageshow', refit);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) refit(); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', refit);

    setUI();
})();
</script>
