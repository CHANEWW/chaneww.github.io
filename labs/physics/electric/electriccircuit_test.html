<!DOCTYPE html>
<!--
  ============================================================================
  Science Virtual LAB · 전기 회로 3D (테스트)  —  수행평가 [풀 보안 v2]
  ============================================================================
  제출함 스프레드시트:
  https://docs.google.com/spreadsheets/d/1g6wvP20IaFOK4as0GixHQWRPXCCZA_bVOv140Ez4z64/edit
  Apps Script v2 전문은 이 파일 아래쪽 <script type="text/plain" id="svlCodeSrc">
/* ============================================================================
   Science Virtual LAB · 전기 회로 3D (테스트) — 수행평가 제출함  [v2 풀 보안]

   ▣ 이 코드를 쓰는 곳
     구글 스프레드시트 [Science Virtual LAB] 전기회로 수행평가 제출함
     → [확장 프로그램] → [Apps Script] → 기존 Code.gs 전체를 지우고 이 내용을 붙여넣기 → 저장
     → [배포] → [배포 관리] → 연필(편집) → 버전: "새 버전" → [배포]
       (URL은 그대로 유지됩니다. 새 배포를 만들면 URL이 바뀌니 반드시 '배포 관리 → 새 버전'으로!)

   ▣ 시트 구조
     · '시험관리' 탭 (첫 번째 탭)
        A 반 | B 상태(열림/닫힘) | C 입장코드(PIN) | D 마감시각(선택) | E 문제 내용 | F 1인1회제출
        H1:I6 교사용 사용법 / H8 교사 마스터 코드 · I8 값
     · '1반'~'14반' 탭
        A 번호 | B 이름 | C 제출한 사진 | D 제출날짜 및 시간
        E 점수(ARRAYFORMULA·절대 건드리지 않음) | F 회로 요약(비고)
        G 채점 이유(ARRAYFORMULA·절대 건드리지 않음) | H 학년·보안로그

   ▣ 보안 규칙 (서버에서 강제)
     · '시험관리'에서 그 반이 '열림'일 때만 입장·제출할 수 있습니다.
     · 입장코드(PIN)가 반별 값과 같아야 합니다.
     · 마감시각이 지나면 입장·제출이 막힙니다.
     · 1인1회제출 = '예'이면 같은 번호는 다시 제출할 수 없습니다.
     · 문제 내용은 이 스크립트/시트에만 있고, 학생 화면(HTML)에는 들어 있지 않습니다.
     · E열·G열에는 ARRAYFORMULA가 걸려 있으므로 절대 쓰지 않고,
       A~D · F · H 열에만 기록합니다. (E/G에 쓰면 #REF! 로 채점표가 깨집니다)
   ============================================================================ */

var SHEET_ID = '1g6wvP20IaFOK4as0GixHQWRPXCCZA_bVOv140Ez4z64';
var FOLDER_NAME = '전기회로 수행평가 제출';
var ADMIN_TAB = '시험관리';
var TZ = 'Asia/Seoul';
var CLASS_MAX = 14;
var NUM_MAX = 40;

/* ---------------------------------------------------------------- 응답 도우미 */
function json_(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj))
    .setMimeType(ContentService.MimeType.JSON);
}
/* JSONP 지원: callback=함수명 이 오면 자바스크립트로 감싸 돌려준다.
   (정적 페이지에서 CORS 없이 안전하게 호출하기 위한 통로 — 읽기 전용 요청만 해당) */
function jsonOut_(obj, cb) {
  var body = JSON.stringify(obj);
  if (cb && /^[A-Za-z_$][A-Za-z0-9_$.]{0,60}$/.test(cb)) {
    return ContentService.createTextOutput(cb + '(' + body + ');')
      .setMimeType(ContentService.MimeType.JAVASCRIPT);
  }
  return json_(obj);
}
function fail_(code, reason) {
  return { ok: false, code: code, reason: reason };
}
function pad2_(n) {
  n = String(n);
  return n.length < 2 ? '0' + n : n;
}
function str_(v) {
  return v === null || v === undefined ? '' : String(v).trim();
}

/* ================================================================== doGet ==== */
function doGet(e) {
  var p = (e && e.parameter) || {};
  var action = str_(p.action);
  var cb = str_(p.callback);
  var out;
  try {
    if (action === 'enter') out = handleEnter_(p);
    else if (action === 'teacher_list') out = handleTeacherList_(p);
    else if (action === 'teacher_set') out = handleTeacherSet_(p);
    else if (action === 'ping') out = { ok: true, v: 2, serverTime: nowHms_() };
    else out = fail_('BAD_ACTION', '알 수 없는 요청입니다.');
  } catch (err) {
    out = fail_('SERVER', '서버 오류: ' + errText_(err));
  }
  return jsonOut_(out, cb);
}

function errText_(err) {
  if (!err) return 'unknown';
  return String(err.message || err);
}
function nowHms_() {
  return Utilities.formatDate(new Date(), TZ, 'HH:mm:ss');
}

/* ------------------------------------------------------- 시트 접근 도우미 ---- */
function book_() {
  return SpreadsheetApp.openById(SHEET_ID);
}
function adminSheet_() {
  var sh = book_().getSheetByName(ADMIN_TAB);
  if (!sh) throw new Error("'" + ADMIN_TAB + "' 탭이 없습니다. 시트를 확인해 주세요.");
  return sh;
}
function masterCode_(sh) {
  return str_(sh.getRange('I8').getValue());
}
/* 시험관리 A2:F15 읽기 → [{cls:'1반', status, pin, deadlineRaw, problem, oneTime, row:2}, ...] */
function readAdminRows_(sh) {
  var vals = sh.getRange(2, 1, CLASS_MAX, 6).getValues();
  var out = [];
  for (var i = 0; i < vals.length; i++) {
    var r = vals[i];
    out.push({
      row: i + 2,
      cls: str_(r[0]),
      status: str_(r[1]),
      pin: str_(r[2]),
      deadlineRaw: r[3],
      problem: str_(r[4]),
      oneTime: str_(r[5])
    });
  }
  return out;
}
function findAdminRow_(sh, cls) {
  var want = str_(cls).replace(/반$/, '') + '반';
  var rows = readAdminRows_(sh);
  for (var i = 0; i < rows.length; i++) {
    if (rows[i].cls === want) return rows[i];
  }
  return null;
}

/* ----------------------------------------------------------- 마감시각 파싱 ---- */
/* 'HH:MM' / 'YYYY-MM-DD HH:MM' / Date 셀값 / 오전·오후 표기 모두 처리.
   반환: {kind:'none'} | {kind:'time', hm:'15:30'} | {kind:'date', key:'2026-11-28 15:30'} */
function parseDeadline_(v) {
  if (v === null || v === undefined || v === '') return { kind: 'none' };
  if (Object.prototype.toString.call(v) === '[object Date]') {
    if (isNaN(v.getTime())) return { kind: 'none' };
    var y = Number(Utilities.formatDate(v, TZ, 'yyyy'));
    if (y < 1900) return { kind: 'time', hm: Utilities.formatDate(v, TZ, 'HH:mm') };
    return { kind: 'date', key: Utilities.formatDate(v, TZ, 'yyyy-MM-dd HH:mm') };
  }
  var raw = str_(v);
  if (!raw) return { kind: 'none' };
  var hm = raw.match(/(\d{1,2})\s*:\s*(\d{1,2})/);
  if (!hm) return { kind: 'none' };
  var h = parseInt(hm[1], 10), mi = parseInt(hm[2], 10);
  if (!(h >= 0 && h <= 23 && mi >= 0 && mi <= 59)) return { kind: 'none' };
  if (/오후|PM/i.test(raw) && h < 12) h += 12;
  if (/오전|AM/i.test(raw) && h === 12) h = 0;
  var hmStr = pad2_(h) + ':' + pad2_(mi);
  var d = raw.match(/(\d{4})\s*[-./년]\s*(\d{1,2})\s*[-./월]\s*(\d{1,2})/);
  if (d) return { kind: 'date', key: d[1] + '-' + pad2_(d[2]) + '-' + pad2_(d[3]) + ' ' + hmStr };
  return { kind: 'time', hm: hmStr };
}
/* 마감이 지났으면 true */
function deadlinePassed_(v) {
  var d = parseDeadline_(v);
  if (d.kind === 'none') return false;
  var now = new Date();
  if (d.kind === 'time') {
    return Utilities.formatDate(now, TZ, 'HH:mm') >= d.hm;
  }
  return Utilities.formatDate(now, TZ, 'yyyy-MM-dd HH:mm') >= d.key;
}
/* 교사 화면에 보여줄 정규화 문자열 */
function deadlineText_(v) {
  var d = parseDeadline_(v);
  if (d.kind === 'none') return '';
  return d.kind === 'time' ? d.hm : d.key;
}

/* ------------------------------------------------------------ 중복 제출 확인 -- */
/* 해당 반 탭 A열(번호)을 훑어 이미 제출한 번호인지 확인 */
function alreadySubmitted_(clsTab, num, name) {
  var sh = book_().getSheetByName(clsTab);
  if (!sh) return false;
  var maxRows = sh.getMaxRows();
  if (maxRows < 2) return false;
  var vals = sh.getRange(1, 1, Math.min(maxRows, 2000), 2).getValues();
  var wantNum = str_(num);
  var wantName = str_(name);
  for (var i = 1; i < vals.length; i++) {
    var a = str_(vals[i][0]);
    if (!a) continue;
    if (a === wantNum) return true;
    if (wantName && a === wantNum && str_(vals[i][1]) === wantName) return true;
  }
  return false;
}

/* ================================================================ 입장(enter) */
function handleEnter_(p) {
  var grade = str_(p.grade);
  var cls = str_(p.cls).replace(/반$/, '');
  var num = str_(p.num);
  var name = str_(p.name);
  var pin = str_(p.pin);

  if (!/^[1-3]$/.test(grade)) return fail_('BAD_INPUT', '학년을 선택해 주세요.');
  if (!/^\d{1,2}$/.test(cls) || +cls < 1 || +cls > CLASS_MAX) return fail_('BAD_INPUT', '반을 선택해 주세요.');
  if (!/^\d{1,2}$/.test(num) || +num < 1 || +num > NUM_MAX) return fail_('BAD_INPUT', '번호를 확인해 주세요.');
  if (!name || name.length > 20) return fail_('BAD_INPUT', '이름을 입력해 주세요.');

  var sh = adminSheet_();
  var row = findAdminRow_(sh, cls);
  if (!row) return fail_('SETUP', "'시험관리' 탭에 " + cls + "반 행이 없습니다. 시트를 확인해 주세요.");

  if (row.status !== '열림') {
    return fail_('CLOSED', '현재 ' + cls + '반 응시 시간이 아닙니다. 선생님이 시험을 열 때까지 기다려 주세요.');
  }
  if (str_(row.pin) !== pin) {
    return fail_('BAD_PIN', '입장 코드가 올바르지 않습니다.');
  }
  if (deadlinePassed_(row.deadlineRaw)) {
    return fail_('EXPIRED', '응시 마감 시간이 지났습니다.');
  }
  var oneTime = row.oneTime === '예';
  if (oneTime && alreadySubmitted_(cls + '반', num, name)) {
    return fail_('ALREADY_SUBMITTED', '이미 제출 완료된 학번입니다.');
  }
  return {
    ok: true,
    grade: grade,
    cls: cls,
    num: num,
    name: name,
    problem: row.problem,
    deadline: deadlineText_(row.deadlineRaw),
    serverTime: nowHms_(),
    oneTime: oneTime,
    version: 2
  };
}

/* ============================================================== 교사 목록 조회 */
function checkMaster_(p) {
  var sh = adminSheet_();
  var master = masterCode_(sh);
  if (!master) return fail_('NO_MASTER', '교사 마스터 코드가 비어 있습니다. 시험관리 I8 셀을 확인해 주세요.');
  if (str_(p.master) !== master) return fail_('BAD_MASTER', '교사 마스터 코드가 올바르지 않습니다.');
  return { ok: true, sh: sh };
}
function handleTeacherList_(p) {
  var chk = checkMaster_(p);
  if (!chk.ok) return chk;
  var rows = readAdminRows_(chk.sh);
  var out = [];
  for (var i = 0; i < rows.length; i++) {
    out.push({
      cls: rows[i].cls,
      status: rows[i].status,
      pin: rows[i].pin,
      deadline: deadlineText_(rows[i].deadlineRaw),
      problem: rows[i].problem,
      oneTime: rows[i].oneTime
    });
  }
  return { ok: true, classes: out, serverTime: nowHms_(), version: 2 };
}

/* ============================================================== 교사 설정 변경 */
function handleTeacherSet_(p) {
  var chk = checkMaster_(p);
  if (!chk.ok) return chk;
  var sh = chk.sh;
  var row = findAdminRow_(sh, p.cls);
  if (!row) return fail_('NO_ROW', "시험관리 탭에 " + str_(p.cls) + " 행이 없습니다.");

  var has = function (k) { return Object.prototype.hasOwnProperty.call(p, k); };

  if (has('status')) {
    var st = str_(p.status);
    if (st !== '열림' && st !== '닫힘') return fail_('BAD_INPUT', "상태는 '열림' 또는 '닫힘'만 가능합니다.");
    sh.getRange(row.row, 2).setValue(st);
  }
  if (has('pin')) {
    var pin = str_(p.pin).slice(0, 8);
    sh.getRange(row.row, 3).setNumberFormat('@').setValue(pin);
  }
  if (has('deadline')) {
    var dl = str_(p.deadline).slice(0, 32);
    var cell = sh.getRange(row.row, 4).setNumberFormat('@');
    cell.clearContent();
    if (dl) cell.setValue(dl);
  }
  if (has('problem')) {
    sh.getRange(row.row, 5).setValue(str_(p.problem).slice(0, 1000));
  }
  if (has('oneTime')) {
    var ot = str_(p.oneTime);
    if (ot !== '예' && ot !== '아니오') return fail_('BAD_INPUT', "1인1회제출은 '예' 또는 '아니오'만 가능합니다.");
    sh.getRange(row.row, 6).setValue(ot);
  }

  SpreadsheetApp.flush();
  var after = findAdminRow_(sh, p.cls);
  return {
    ok: true,
    cls: after.cls,
    status: after.status,
    pin: after.pin,
    deadline: deadlineText_(after.deadlineRaw),
    problem: after.problem,
    oneTime: after.oneTime,
    serverTime: nowHms_()
  };
}

/* ================================================================= doPost ==== */
function doPost(e) {
  try {
    var raw = (e && e.postData && e.postData.contents) || (e && e.parameter && e.parameter.payload) || '{}';
    var d = JSON.parse(raw);

    /* 교사 미리보기: 기록하지 않고 성공만 돌려준다 */
    if (d.teacherPreview === true) {
      return json_({ ok: true, preview: true });
    }

    var cls = str_(d.className).replace(/반$/, '');
    var num = str_(d.studentNum);
    var name = str_(d.studentName);
    var grade = str_(d.grade);

    /* ---- 서버 재검증 (학생 제출은 예외 없음) ---- */
    var sh = adminSheet_();
    var row = findAdminRow_(sh, cls);
    if (!row) return json_({ ok: false, code: 'SETUP', error: "'시험관리' 탭에 " + cls + "반 행이 없습니다." });
    if (row.status !== '열림') {
      return json_({ ok: false, code: 'CLOSED', error: '현재 ' + cls + '반 응시 시간이 아닙니다. 제출이 마감되었습니다.' });
    }
    if (str_(row.pin) !== str_(d.pin)) {
      return json_({ ok: false, code: 'BAD_PIN', error: '입장 코드가 확인되지 않아 제출할 수 없습니다.' });
    }
    if (deadlinePassed_(row.deadlineRaw)) {
      return json_({ ok: false, code: 'EXPIRED', error: '응시 마감 시간이 지나 제출할 수 없습니다.' });
    }
    if (row.oneTime === '예' && alreadySubmitted_(cls + '반', num, name)) {
      return json_({ ok: false, code: 'ALREADY_SUBMITTED', error: '이미 제출 완료된 학번입니다. 재제출할 수 없습니다.' });
    }

    /* ---- 사진 저장 ---- */
    var photo = '';
    var b64 = String(d.imageBase64 || '').split(',')[1] || '';
    var tabName = cls + '반';
    if (b64) {
      var gLabel = grade ? grade + '학년_' : '';
      var fname = gLabel + cls + '반_' + num + '번_' + name + '_' + str_(d.fileStamp) + '.png';
      var file = getFolder_(FOLDER_NAME).createFile(
        Utilities.newBlob(Utilities.base64Decode(b64), 'image/png', fname)
      );
      photo = '=HYPERLINK("' + file.getUrl() + '","📷 사진 열기")';
    }

    /* ---- 기록 (E·G열 ARRAYFORMULA 보호 + 동시 제출 잠금) ---- */
    var lock = LockService.getScriptLock();
    if (!lock.tryLock(30000)) {
      return json_({ ok: false, code: 'BUSY', error: '제출이 몰려 잠시 지연되고 있습니다. 잠시 후 다시 눌러 주세요.' });
    }
    try {
      var clsSh = book_().getSheetByName(tabName);
      if (!clsSh) return json_({ ok: false, code: 'SETUP', error: tabName + ' 시트 탭이 없습니다.' });

      /* 잠금 안에서 중복 한 번 더 확인 (동시 제출 방지) */
      if (row.oneTime === '예' && alreadySubmitted_(tabName, num, name)) {
        return json_({ ok: false, code: 'ALREADY_SUBMITTED', error: '이미 제출 완료된 학번입니다. 재제출할 수 없습니다.' });
      }

      var r = nextRow_(clsSh);
      clsSh.getRange(r, 1, 1, 4).setValues([[num, name, photo, str_(d.timestamp)]]);
      clsSh.getRange(r, 6).setValue(str_(d.summary));
      clsSh.getRange(r, 8).setValue(str_(d.securityLog));
    } finally {
      try { lock.releaseLock(); } catch (ignore) {}
    }

    return json_({ ok: true, tab: tabName, time: nowHms_() });
  } catch (err) {
    return json_({ ok: false, code: 'SERVER', error: '서버 오류: ' + errText_(err) });
  }
}

/* A열에서 마지막으로 값이 있는 행 다음 행 번호 (ARRAYFORMULA E/G열과 무관) */
function nextRow_(sh) {
  var maxRows = sh.getMaxRows();
  var vals = sh.getRange(1, 1, maxRows, 1).getValues();
  var last = 0;
  for (var i = 0; i < vals.length; i++) {
    if (str_(vals[i][0]) !== '') last = i + 1;
  }
  var r = Math.max(2, last + 1);
  if (r > maxRows) {
    sh.insertRowsAfter(maxRows, r - maxRows + 20);
  }
  return r;
}

/* 제출 사진 폴더 */
function getFolder_(n) {
  var it = DriveApp.getFoldersByName(n);
  return it.hasNext() ? it.next() : DriveApp.createFolder(n);
}
</script>

    <script>
const $=s=>document.querySelector(s);
const RA=[];for(let i=1;i<=10;i++)RA.push(i);
for(let i=2;i<=10;i++)RA.push(i*10);
for(let i=2;i<=10;i++)RA.push(i*100);
for(let i=2;i<=10;i++)RA.push(i*1000);

let batteryInternalR = 0.0;

$('#battRInput').addEventListener('input', e => {
  batteryInternalR = parseFloat(e.target.value);
  $('#battRVal').textContent = batteryInternalR.toFixed(2) + ' Ω';
});

const TYPES={
  resist:{n:'저항',ic:'〰',R:10},
  bulb:{n:'전구',ic:'💡',R:10},
  wire:{n:'도선',ic:'━',R:0},
  sw:{n:'스위치',ic:'⏻',R:0},
  batt:{n:'전지',ic:'🔋',V:1.5},
  vMeter:{n:'전압계',ic:'V',R:1e8}, 
  iMeter:{n:'전류계',ic:'A',R:0}
};

const isMeter = t => t==='vMeter'||t==='iMeter';

const mod=(a,b)=>((a%b)+b)%b;

/* 포맷팅 함수 */
function fmt(v,u){
  const a=Math.abs(v);
  if(a<1e-4)return '0 '+u;
  for(const[s,p]of[[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m']])
    if(a>=s)return(+(v/s).toPrecision(3))+' '+p+u;
  return '0 '+u;
}

/* 3D 렌더러 & 씬 기본 설정 */
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.shadowMap.enabled=true;

function updateCam(){
  const cx = camTarget.x + dist*Math.sin(yaw)*Math.cos(pitch);
  const cy = camTarget.y + dist*Math.sin(pitch);
  const cz = camTarget.z + dist*Math.cos(yaw)*Math.cos(pitch)+.3;
  camera.position.set(cx, cy, cz);
  camera.lookAt(camTarget);
  camera.updateMatrixWorld();
}

/* 계기판 텍스처 생성 */
function drawMeterFace(ctx, text, colorStr){
  ctx.clearRect(0,0,512,512);
  ctx.fillStyle='#ffffff';
  ctx.beginPath();ctx.arc(256,256,240,0,Math.PI*2);ctx.fill();
  ctx.lineWidth=16;ctx.strokeStyle='#e2e8f0';ctx.stroke();

  let size=130;
  ctx.font='bold '+size+'px "SeoulNamsan",-apple-system,BlinkMacSystemFont,sans-serif';
  const maxW=360;
  const w=ctx.measureText(text).width;
  if(w>maxW){
    size=Math.floor(size*maxW/w);
    ctx.font='bold '+size+'px "SeoulNamsan",-apple-system,BlinkMacSystemFont,sans-serif';
  }
  ctx.fillStyle=colorStr;
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(text,256,195);
}

function createMeterTexture(text, colorStr){
  const canvas=document.createElement('canvas');
  canvas.width=512; canvas.height=512;
  const ctx=canvas.getContext('2d');
  drawMeterFace(ctx,text,colorStr);
  const tex=new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter;
  tex.generateMipmaps = false;
  tex.needsUpdate=true;
  return tex;
}

function createTerminalTexture(text, colorStr){
  const canvas=document.createElement('canvas');
  canvas.width=512; canvas.height=512;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle=colorStr;
  ctx.font='bold 380px "SeoulNamsan",-apple-system,BlinkMacSystemFont,sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(text, 256, 256);
  
  const tex=new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter;
  tex.generateMipmaps = false;
  tex.needsUpdate=true;
  return tex;
}

function drawLabel(sprite,text,colorStr){
  const canvas=sprite.material.map.image;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,256,96);
  const x=6,y=8,w=244,h=80,r=26;
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
  ctx.fillStyle='rgba(255,255,255,0.94)';ctx.fill();
  ctx.lineWidth=5;ctx.strokeStyle=colorStr;ctx.stroke();

  let size=46;
  const LABEL_FONT='"SeoulNamsan",-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif';
  ctx.font='bold '+size+'px '+LABEL_FONT;
  const wd=ctx.measureText(text).width;
  if(wd>210){
    size=Math.floor(size*210/wd);
    ctx.font='bold '+size+'px '+LABEL_FONT;
  }
  ctx.fillStyle=colorStr;
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(text,128,50);
  sprite.material.map.needsUpdate=true;
}

/* MNA 기반 회로망 해석 */
function simulate(){
  const pts=[];
  const id=(x,z)=>{
    for(let i=0;i<pts.length;i++)if(Math.hypot(pts[i][0]-x,pts[i][1]-z)<.16)return i;
    pts.push([x,z]);return pts.length-1;
  };
  parts.forEach(p=>{
    p.n0=id(p.x[0],p.z[0]);
    p.n1=id(p.x[1],p.z[1]);
    p.I=0; p.dv=0; p.closed=false; p.isShort=false;
  });

  const numNodes = pts.length;
  if(numNodes === 0) return;
  
  const nodeDegree = new Array(numNodes).fill(0);
  parts.forEach(p=>{ nodeDegree[p.n0]++; nodeDegree[p.n1]++; });
  parts.forEach(p=>{
    p.conn0 = nodeDegree[p.n0] > 1;
    p.conn1 = nodeDegree[p.n1] > 1;
    p.fullyConnected = p.conn0 && p.conn1; 
  });

  const batteries = parts.filter(p=>p.type==='batt');
  const numBatts = batteries.length;
  
  if(numBatts === 0) {
    parts.forEach(p=>{
      if(isMeter(p.type)) updateMeterDisplay(p, 0);
    });
    return;
  }

  const N = numNodes;
  const M = numBatts;
  const size = N + M;

  const A = Array.from({length: size}, () => new Float64Array(size));
  const Z = new Float64Array(size);

  for(let j=0; j<N; j++){ A[j][j] += 1e-9; }

  /* 도선·전류계·닫힌 스위치의 기생 저항.
     1e-4 Ω는 1.5V + 1Ω 직렬 회로에서 총저항을 1.0003~1.0004 Ω으로 만들어
     전류가 1.4995 A로 계산되는 0.05% 오차를 냈다. 1 μΩ(1e-6)으로 낮춰
     도선 6개까지 붙여도 오차를 0.001% 미만으로 유지한다.
     (전압계 R=1e8 Ω, 대각 1e-9 항과 함께 쓰는 MNA 정밀도는 단락·개방·직병렬·내부저항
      조건에서 검증했다: 최대 상대오차 8e-6, 전압계 지시값 오차 없음) */
  const WIRE_R = 1e-6;

  parts.forEach(p=>{
    if(p.type === 'batt') return; 
    if(p.type === 'sw' && p.open) return;
    let R = p.R;
    if(p.type === 'wire' || p.type === 'iMeter' || p.type === 'sw') R = WIRE_R;
    const G = 1 / R;
    const u = p.n0, v = p.n1;

    if(isFinite(G) && G > 0){
      A[u][u] += G; A[v][v] += G;
      A[u][v] -= G; A[v][u] -= G;
    }
  });

  batteries.forEach((b, k)=>{
    const idx = N + k;
    const u = b.n0; const v = b.n1; 
    A[u][idx] += 1; A[v][idx] -= 1;
    A[idx][u] += 1; A[idx][v] -= 1;
    
    A[idx][idx] -= batteryInternalR;
    Z[idx] = b.V;
  });

  for(let j=0; j<size; j++){ A[0][j] = 0; A[j][0] = 0; }
  A[0][0] = 1; Z[0] = 0;

  const X = solveLinearSystem(A, Z, size);

  if(!X) {
    parts.forEach(p=>{
      if(isMeter(p.type)) updateMeterDisplay(p, 0);
    });
    return;
  }

  const nodeV = X.subarray(0, N);

  parts.forEach(p=>{
    if(p.type==='batt'){
      const k = batteries.indexOf(p);
      p.I = X[N + k]; 
      p.dv = p.V - Math.abs(p.I) * batteryInternalR;
      p.closed = Math.abs(p.I) > 1e-4;
      
      /* 단락 판정: 부하 저항이 거의 없는 직결 루프이거나, 부하 없이 과도한 전류가 흐를 때만.
         정상적인 옴의 법칙 실험(1~3Ω + 6~12V)에서 3A를 넘는다고 단락으로 오인하지 않는다. */
      const rLoad = Math.abs(p.dv / (p.I || 1e-9));
      if(p.closed && (rLoad < 0.2 || Math.abs(p.I) >= 25.0)) {
        p.isShort = true;
      }
    } else {
      if (!p.fullyConnected) {
        p.dv = 0;
        p.I = 0;
      } else {
        const v0 = nodeV[p.n0];
        const v1 = nodeV[p.n1];
        p.dv = v0 - v1;
        
        let R = p.R;
        if(p.type === 'wire' || p.type === 'iMeter' || p.type === 'sw') R = WIRE_R;
        
        if(p.type === 'vMeter') p.I = 0;
        else if(p.type === 'sw' && p.open) p.I = 0;
        else p.I = p.dv / R;
      }
      p.closed = Math.abs(p.I) > 1e-4;
    }

    if(Math.abs(p.I) < 1e-5) p.I = 0;
    if(Math.abs(p.dv) < 1e-5) p.dv = 0;

    if(p.type === 'vMeter'){
      updateMeterDisplay(p, p.dv);
    } else if(p.type === 'iMeter'){
      updateMeterDisplay(p, p.I);
    }
  });
}

function solveLinearSystem(A, B, n) {
  const M = Array.from({length: n}, (_, i) => {
    const row = new Float64Array(n + 1);
    row.set(A[i]); row[n] = B[i]; return row;
  });

  for(let i=0; i<n; i++) {
    let maxRow = i;
    for(let k=i+1; k<n; k++) {
      if(Math.abs(M[k][i]) > Math.abs(M[maxRow][i])) maxRow = k;
    }
    const temp = M[i]; M[i] = M[maxRow]; M[maxRow] = temp;

    if(Math.abs(M[i][i]) < 1e-11) return null; 

    for(let k=i+1; k<n; k++) {
      const c = -M[k][i] / M[i][i];
      for(let j=i; j<=n; j++) {
        if(i === j) M[k][j] = 0;
        else M[k][j] += c * M[i][j];
      }
    }
  }

  const x = new Float64Array(n);
  for(let i=n-1; i>=0; i--) {
    x[i] = M[i][n] / M[i][i];
    for(let k=i-1; k>=0; k--) {
      M[k][n] -= M[k][i] * x[i];
    }
  }
  return x;
}

function updateMeterDisplay(p, val){

  p.meterTex.needsUpdate = true;
}

/* 불꽃 파티클 애니메이션 */
function updateFireAnimation(shortBatteries){
  const positions = fireGeo.attributes.position.array;
  const alphas = fireGeo.attributes.alpha.array;
  const n = shortBatteries.length;

  if(n === 0){
    fireLights.forEach(l => l.intensity = 0);
    for(let i=0; i<FIRE_PARTICLES; i++) alphas[i] = 0;
    fireGeo.attributes.alpha.needsUpdate = true;
    return;
  }

  fireLights.forEach((l, i)=>{
    if(i < n){
      const b = shortBatteries[i];
      l.position.set((b.x[0]+b.x[1])/2, 0.4, (b.z[0]+b.z[1])/2);
      l.intensity = 3.0 + Math.random() * 3.0;
    } else {
      l.intensity = 0;
    }
  });

  for(let i=0; i<FIRE_PARTICLES; i++){
    const v = fireVelocities[i];
    const batt = shortBatteries[i % n];
    const cx = (batt.x[0] + batt.x[1]) / 2;
    const cz = (batt.z[0] + batt.z[1]) / 2;
    v.life -= 0.04;

    if(v.life <= 0){
      v.life = 1.0;
      positions[i*3] = cx + (Math.random() - 0.5) * 0.5;
      positions[i*3+1] = 0.15;
      positions[i*3+2] = cz + (Math.random() - 0.5) * 0.5;
      v.x = (Math.random() - 0.5) * 0.04;
      v.y = Math.random() * 0.06 + 0.035;
      v.z = (Math.random() - 0.5) * 0.04;
    } else {
      positions[i*3] += v.x;
      positions[i*3+1] += v.y;
      positions[i*3+2] += v.z;
    }

    alphas[i] = Math.sin(Math.max(v.life,0) * Math.PI);
  }

  fireGeo.attributes.position.needsUpdate = true;
  fireGeo.attributes.alpha.needsUpdate = true;
}

function updatePart(p){
  const dx=p.x[1]-p.x[0],dz=p.z[1]-p.z[0],L=Math.hypot(dx,dz);
  p.L=L;
  p.g.position.set(p.x[0],.08,p.z[0]);p.g.rotation.y=-Math.atan2(dz,dx);
  p.lead.scale.x=L;p.lead.position.x=L/2;p.j[1].position.x=L;p.mid.position.x=L/2;
  
  if(isMeter(p.type) && p.displayPlane){
    p.displayPlane.quaternion.copy(camera.quaternion);
    p.displayPlane.quaternion.premultiply(p.g.quaternion.clone().invert());
  }

  if(p.j[0].material) p.j[0].material.color.setHex(p.conn0 ? 0x9ca3af : 0xef4444);
  if(p.j[1].material) p.j[1].material.color.setHex(p.conn1 ? 0x9ca3af : 0xef4444);

  if(p.type==='sw'){
    const h=L/2;
    const sl=Math.max(h-.45,.001);
    p.stubs[0].scale.x=sl; p.stubs[0].position.x=-(h+.45)/2;
    p.stubs[1].scale.x=sl; p.stubs[1].position.x=(h+.45)/2;
    const target=p.open?.7:0;
    p.leverAngle+=(target-p.leverAngle)*.25;
    p.lever.rotation.z=p.leverAngle;
  }

  if(p.lbl){
    const info=labelInfo(p);
    if(info){
      const key=info.t+'|'+info.c;
      if(p.lblText!==key){ p.lblText=key; drawLabel(p.lbl,info.t,info.c); }
    }
    p.lbl.position.set((p.x[0]+p.x[1])/2,.25,(p.z[0]+p.z[1])/2+.95);
  }

  const modeEl=document.querySelector('input[name=mode]:checked');
  const electron=modeEl?modeEl.value==='electron':true;
  const I=p.I;
  const on=Math.abs(I) > 1e-4;

  const speedFactor = Math.min(Math.abs(I), 100);
  p.ph += on ? Math.sign(I) * (0.02 + speedFactor * 0.15) : 0;
  
  const mesh=electron?p.el:p.ar;
  (electron?p.ar:p.el).visible=false;
  mesh.visible=on;
  
  const S=.8;
  const off=electron?mod(-p.ph,S):mod(p.ph,S);
  let c=0;
  
  if(on){
    for(let k=0;k<48;k++){
      const x=k*S+off;if(x>L)break;
      tmp.position.set(x,0,0);
      tmp.rotation.set(0, (electron ? I < 0 : I >= 0) ? 0 : Math.PI, 0);
      tmp.updateMatrix();
      mesh.setMatrixAt(c++,tmp.matrix);
    }
  }
  mesh.count=c;mesh.instanceMatrix.needsUpdate=true;
  
  if(p.type==='bulb'){
    const lit=p.closed && $('#cLight').checked;
    const power = Math.abs(p.dv * p.I); 
    const brightness = lit ? Math.min(Math.sqrt(power) * 1.5, 6.0) : 0;
    
    p.fil.material.emissiveIntensity = brightness * 3.0;
    p.fil.material.color.set(lit ? 0xffea00 : 0xa39171);
    p.fil.material.emissive.set(lit ? 0xffbb00 : 0x000000);
    
    if(p.bulbLight) p.bulbLight.intensity = brightness * 2.5;
    if(p.glow){
      p.glow.material.opacity = lit ? Math.min(0.2 + brightness * 0.2, 1.0) : 0;
      p.glow.scale.setScalar(lit ? 1.0 + brightness * 0.3 : 1);
    }
  }
}

/* 포인터 조작 */
const rc=new THREE.Raycaster(),pl=new THREE.Plane(new THREE.Vector3(0,1,0),-.015),v2=new THREE.Vector2();
function wp(e){
  v2.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);
  rc.setFromCamera(v2,camera);
  const t=new THREE.Vector3();
  return rc.ray.intersectPlane(pl,t)?t:null;
}
function segDist(px,pz,p){
  const ax=p.x[0],az=p.z[0],bx=p.x[1],bz=p.z[1],dx=bx-ax,dz=bz-az;
  const l2=dx*dx+dz*dz||1e-9;
  let t=((px-ax)*dx+(pz-az)*dz)/l2;t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-ax-t*dx,pz-az-t*dz);
}

let drag=null,orbit=false,moved=false,down={x:0,y:0},activePointer=null;

/* 화면 줌 및 화면 이동 (Pan) 제어 */
let isPinching = false;
let isTwoFinger = false;
let pinchDist = 0;
let pinchStartCamDist = 15;
let twoFingerStart = { x: 0, y: 0 };
let camTargetStart = new THREE.Vector3();

cv.addEventListener('wheel', e => {
  e.preventDefault();
  dist = Math.max(5, Math.min(40, dist + e.deltaY * 0.02));
  updateCam();
}, { passive: false });

cv.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    isTwoFinger = true;
    isPinching = true;
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchDist = Math.hypot(dx, dy);
    pinchStartCamDist = dist;
    twoFingerStart.x = 0.5 * (e.touches[0].clientX + e.touches[1].clientX);
    twoFingerStart.y = 0.5 * (e.touches[0].clientY + e.touches[1].clientY);
    camTargetStart.copy(camTarget);
  }
}, { passive: false });

cv.addEventListener('touchmove', e => {
  if (e.touches.length === 2 && isTwoFinger) {
    e.preventDefault();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const currentDist = Math.hypot(dx, dy);
    if (pinchDist > 0 && currentDist > 0) {
      dist = Math.max(5, Math.min(40, pinchStartCamDist * (pinchDist / currentDist)));
    }

    const midX = 0.5 * (e.touches[0].clientX + e.touches[1].clientX);
    const midY = 0.5 * (e.touches[0].clientY + e.touches[1].clientY);
    const deltaX = midX - twoFingerStart.x;
    const deltaY = midY - twoFingerStart.y;

    const targetDist = dist * Math.tan((38 / 2) * Math.PI / 180);
    const factor = (2 * targetDist) / innerHeight;

    const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
    const up = new THREE.Vector3(-Math.sin(yaw) * Math.sin(pitch), Math.cos(pitch), -Math.cos(yaw) * Math.sin(pitch));

    const moveVector = new THREE.Vector3()
      .addScaledVector(right, -deltaX * factor)
      .addScaledVector(up, deltaY * factor);

    camTarget.copy(camTargetStart).add(moveVector);
    updateCam();
  }
}, { passive: false });

cv.addEventListener('touchend', e => {
  if (e.touches.length < 2) {
    isTwoFinger = false;
    isPinching = false;
    pinchDist = 0;
  }
});

cv.addEventListener('contextmenu',e=>e.preventDefault());

let isPanning = false;
let panStart = { x: 0, y: 0 };

cv.addEventListener('pointerdown',e=>{
  if(e.target!==cv || draggingType) return;
  activePointer=e.pointerId;
  cv.setPointerCapture?.(e.pointerId);
  moved=false;down={x:e.clientX,y:e.clientY};

  // PC 화면 이동(Pan): 마우스 우클릭(2), 휠 클릭(1), 또는 Shift + 좌클릭(0)
  if(e.button === 2 || e.button === 1 || (e.button === 0 && e.shiftKey)) {
    isPanning = true;
    panStart = { x: e.clientX, y: e.clientY };
    camTargetStart.copy(camTarget);
    return;
  }

  const w=wp(e);
  if(!w){orbit=true;return;}

  let best=.55,hit=null;
  parts.forEach(p=>[0,1].forEach(i=>{
    const d=Math.hypot(w.x-p.x[i],w.z-p.z[i]);
    if(d<best){best=d;hit=[p,i];}
  }));
  if(hit){
    const hx=hit[0].x[hit[1]],hz=hit[0].z[hit[1]];
    const list=[];
    parts.forEach(p=>[0,1].forEach(i=>{
      if(Math.hypot(p.x[i]-hx,p.z[i]-hz)<.05)list.push([p,i]);
    }));
    drag={kind:'joint',list,ox:w.x-hx,oz:w.z-hz};
    select(null);return;
  }
  for(let k=parts.length-1;k>=0;k--){
    const p=parts[k];
    if(segDist(w.x,w.z,p)<.48){
      drag={kind:'part',p,sx:w.x,sz:w.z,x0:p.x.slice(),z0:p.z.slice()};
      return;
    }
  }
  orbit=true;
});

cv.addEventListener('pointermove',e=>{
  if (isTwoFinger) return;
  if(activePointer!==null && e.pointerId!==activePointer)return;
  if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>5)moved=true;

  if(isPanning){
    const deltaX = e.clientX - panStart.x;
    const deltaY = e.clientY - panStart.y;
    const targetDist = dist * Math.tan((38 / 2) * Math.PI / 180);
    const factor = (2 * targetDist) / innerHeight;

    const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
    const up = new THREE.Vector3(-Math.sin(yaw) * Math.sin(pitch), Math.cos(pitch), -Math.cos(yaw) * Math.sin(pitch));

    const moveVector = new THREE.Vector3()
      .addScaledVector(right, -deltaX * factor)
      .addScaledVector(up, deltaY * factor);

    camTarget.copy(camTargetStart).add(moveVector);
    updateCam();
    return;
  }

  if(orbit){
    yaw-=(e.movementX||0)*.005;
    pitch=Math.max(.25,Math.min(1.42,pitch+(e.movementY||0)*.005));
    updateCam();return;
  }
  if(!drag||!moved)return;
  const tr=document.querySelector('#trash'),r=tr.getBoundingClientRect();
  tr.classList.toggle('over',e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom);
  const w=wp(e);if(!w)return;
  if(drag.kind==='joint'){
    drag.list.forEach(([p,i])=>{p.x[i]=w.x-drag.ox;p.z[i]=w.z-drag.oz;});
  }else{
    const p=drag.p,dx=w.x-drag.sx,dz=w.z-drag.sz;
    for(let i=0;i<2;i++){p.x[i]=drag.x0[i]+dx;p.z[i]=drag.z0[i]+dz;}
  }
});

function magnetSnap(){
  const SNAP_RADIUS=.72;
  parts.forEach(p=>{
    for(let i=0;i<2;i++){
      const x=p.x[i],z=p.z[i];
      let best=SNAP_RADIUS,target=null;
      parts.forEach(q=>{
        if(q===p)return;
        for(let j=0;j<2;j++){
          const d=Math.hypot(x-q.x[j],z-q.z[j]);
          if(d<best){best=d;target=[q,j];}
        }
      });
      if(target){p.x[i]=target[0].x[target[1]];p.z[i]=target[0].z[target[1]];}
    }
  });
}

function finishCanvasPointer(e){
  if(activePointer!==null && e.pointerId!==activePointer)return;
  const trash=document.querySelector('#trash');
  const overTrash=trash&&e.clientX>=trash.getBoundingClientRect().left&&e.clientX<=trash.getBoundingClientRect().right&&
    e.clientY>=trash.getBoundingClientRect().top&&e.clientY<=trash.getBoundingClientRect().bottom;
  if(drag&&drag.kind==='part'&&moved&&overTrash){
    removePart(drag.p);
    trash.classList.remove('over');
  }else{
    if(drag&&moved)magnetSnap();
    if(!moved){
      if(drag&&drag.kind==='part'){
        if(drag.p.type==='sw'){ drag.p.open=!drag.p.open; select(null); }
        else if(['resist','bulb','batt'].includes(drag.p.type)) select(drag.p);
      }
      else if(!drag)select(null);
    }
  }
  drag=null;orbit=false;isPanning=false;activePointer=null;
}
cv.addEventListener('pointerup',finishCanvasPointer);
cv.addEventListener('pointercancel',finishCanvasPointer);
cv.addEventListener('pointerleave',()=>{if(!drag)$('#trash').classList.remove('over');});

const pal=$('#palette');
const leverTrack=$('#leverTrack');
const leverThumb=$('#leverThumb');
const ghost=$('#dragGhost');
let draggingType=null,dragPointerId=null;
let palPending=null;

/* 레버 thumb 위치 및 팔레트 스크롤 위치 동기화 */
function updateLeverFromScroll(){
  const maxScroll = pal.scrollHeight - pal.clientHeight;
  if(maxScroll <= 0){
    leverThumb.style.top = '0px';
    return;
  }
  const trackHeight = leverTrack.clientHeight - leverThumb.clientHeight;
  const ratio = pal.scrollTop / maxScroll;
  leverThumb.style.top = (ratio * trackHeight) + 'px';
}
pal.addEventListener('scroll', updateLeverFromScroll);

/* 레버 조작(버튼 및 드래그) */
$('#leverUp').addEventListener('click', () => { pal.scrollTop -= 60; });
$('#leverDown').addEventListener('click', () => { pal.scrollTop += 60; });

let leverDragging = false, leverPointerId = null;
leverTrack.addEventListener('pointerdown', e => {
  leverDragging = true;
  leverPointerId = e.pointerId;
  leverTrack.setPointerCapture(e.pointerId);
  moveLeverByPointer(e);
});
leverTrack.addEventListener('pointermove', e => {
  if(leverDragging && e.pointerId === leverPointerId){
    moveLeverByPointer(e);
  }
});
function stopLeverDrag(e){
  if(leverDragging && e.pointerId === leverPointerId){
    leverDragging = false;
    leverPointerId = null;
  }
}
leverTrack.addEventListener('pointerup', stopLeverDrag);
leverTrack.addEventListener('pointercancel', stopLeverDrag);

function moveLeverByPointer(e){
  const rect = leverTrack.getBoundingClientRect();
  const thumbH = leverThumb.clientHeight;
  const trackH = rect.height - thumbH;
  let offsetY = e.clientY - rect.top - thumbH / 2;
  offsetY = Math.max(0, Math.min(trackH, offsetY));
  
  const ratio = offsetY / (trackH || 1);
  const maxScroll = pal.scrollHeight - pal.clientHeight;
  pal.scrollTop = ratio * maxScroll;
  leverThumb.style.top = offsetY + 'px';
}

function moveGhost(x,y){
  ghost.style.left=x+'px';ghost.style.top=y+'px';
}
function startPaletteDrag(k,e){
  const hintEl = document.getElementById('hint');
  if(hintEl) hintEl.style.opacity = '0';
  draggingType=k;dragPointerId=e.pointerId;
  ghost.innerHTML='<b>'+TYPES[k].ic+'</b>'+TYPES[k].n;
  ghost.style.display='block';
  moveGhost(e.clientX,e.clientY);
}
Object.keys(TYPES).forEach(k=>{
  const b=document.createElement('button');
  b.type='button';b.className='pbtn';
  b.innerHTML='<b>'+TYPES[k].ic+'</b>'+TYPES[k].n;
  b.addEventListener('pointerdown',e=>{
    e.preventDefault();e.stopPropagation();
    if(e.pointerType==='mouse'){
      startPaletteDrag(k,e);
    }else{
      palPending={k,id:e.pointerId,sx:e.clientX,sy:e.clientY,sc:pal.scrollTop,mode:null};
    }
  });
  pal.insertBefore(b,$('#trash'));
});

window.addEventListener('pointermove',e=>{
  if(palPending && e.pointerId===palPending.id){
    const P=palPending;
    const dx=e.clientX-P.sx, dy=e.clientY-P.sy;
    const r=pal.getBoundingClientRect();
    const outside=e.clientX>r.right+6||e.clientX<r.left-6||e.clientY<r.top-30||e.clientY>r.bottom+30;
    const canScroll=pal.scrollHeight>pal.clientHeight+2;

    if(!P.mode){
      if(Math.hypot(dx,dy)<8 && !outside) return;
      if(outside || !canScroll || Math.abs(dx)>Math.abs(dy)) P.mode='drag';
      else P.mode='scroll';
    }
    if(P.mode==='drag'){
      const k=P.k;
      palPending=null;
      startPaletteDrag(k,e);
      return;
    }
    if(P.mode==='scroll'){
      pal.scrollTop=P.sc-dy;
      if(e.clientX>r.right+6){
        const k=P.k;
        palPending=null;
        startPaletteDrag(k,e);
      }
    }
    return;
  }
  if(!draggingType||e.pointerId!==dragPointerId)return;
  moveGhost(e.clientX,e.clientY);
});

window.addEventListener('pointerup',e=>{
  if(palPending && e.pointerId===palPending.id){ palPending=null; return; }
  if(!draggingType||e.pointerId!==dragPointerId)return;
  const type=draggingType;
  ghost.style.display='none';
  const paletteRect=$('#palette-container').getBoundingClientRect();
  const insidePalette=e.clientX>=paletteRect.left&&e.clientX<=paletteRect.right&&
    e.clientY>=paletteRect.top&&e.clientY<=paletteRect.bottom;

  if(!insidePalette&&w&&Math.abs(w.x)<=7.8&&Math.abs(w.z)<=4.55){
    const half=isMeter(type)?1.0:.85;
    const p=addPart(type,w.x-half,w.z,w.x+half,w.z);
    select(p);
  }
  draggingType=null;dragPointerId=null;
});

  palPending=null;
  draggingType=null;dragPointerId=null;ghost.style.display='none';
});

    st.grade = s.grade || ''; st.cls = s.cls; st.num = s.num; st.name = s.name;
    document.body.classList.add('svl-exam');
    examActive = true;
    renderBadge(); renderProblemBar(); startWatermark(); startExamTimer(); startWatch();
    return true;
  }

  /* ---------- 문제 배너 · 남은 시간 ---------- */
  function renderProblemBar() {
    if (!session) return;
    const txt = String(session.problem || '').trim();
    examProblem.textContent = txt || '문제가 비어 있습니다. 선생님께 알려 주세요.';
    examBar.classList.add('on');
    examProblem.hidden = false;
    examChev.textContent = '▴';
    examBarBtn.setAttribute('aria-expanded', 'true');
    updateExamTimer();
  }
  examBarBtn.addEventListener('click', function () {
    const open = examProblem.hidden;
    examProblem.hidden = !open;
    examChev.textContent = open ? '▴' : '▾';
    examBarBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  function parseDeadline(v) {
    const t = String(v || '').trim();
    if (!t) return null;
    let m = t.match(/^(\d{4})-(\d{2})-(\d{2})[ T](\d{1,2}):(\d{2})$/);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], 0, 0);
    m = t.match(/^(\d{1,2}):(\d{2})$/);
    if (m) { const d = new Date(); d.setHours(+m[1], +m[2], 0, 0); return d; }
    return null;
  }
  function updateExamTimer() {
    if (!session || !examTimer) return;
    if (!session.deadline) { examTimer.textContent = '⏳ 마감 미지정'; examTimer.className = 'eb-timer'; return; }
    const dl = parseDeadline(session.deadline);
    if (!dl) { examTimer.textContent = '⏳ ' + session.deadline; examTimer.className = 'eb-timer'; return; }
    const ms = dl.getTime() - Date.now();
    if (ms <= 0) {
      examTimer.textContent = '⏰ 마감됨'; examTimer.className = 'eb-timer over';
      if (!examExpired) {
        examExpired = true;
        toast('⏰ 응시 마감 시간이 지났습니다 — 제출이 서버에서 차단됩니다');
      }
      return;
    }
    const sec = Math.floor(ms / 1000), mm = Math.floor(sec / 60), ss = sec % 60;
    examTimer.textContent = '⏳ ' + pad2(mm) + ':' + pad2(ss);
    examTimer.className = 'eb-timer' + (mm < 5 ? ' warn' : '');
  }
  function startExamTimer() {
    if (examTimerId) clearInterval(examTimerId);
    updateExamTimer();
    examTimerId = setInterval(updateExamTimer, 1000);
  }

  /* ---------- 실시간 학번 워터마크 ---------- */
  function wmString() {
    const d = new Date();
    const who = (session && session.teacherPreview)
      ? '교사 미리보기'
      : [gradeTxt(st.grade), st.cls ? st.cls + '반' : '', st.num ? st.num + '번' : '', st.name].filter(Boolean).join(' ');
    const t = pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
    return who + ' · ' + t + (blurCount ? ' · 이탈 ' + blurCount + '회' : '');
  }
  function wmTick() {
    if (!wmBox) return;
    const t = wmString();
    const kids = wmBox.children;
    for (let i = 0; i < kids.length; i++) kids[i].textContent = t;
  }
  function startWatermark() {
    if (!wmBox) return;
    if (!wmBox.childElementCount) {
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 3; c++) {
          const sp = document.createElement('span');

          sp.style.top = ((r + 0.5) * 20) + '%';

        }
      }
    }
    wmBox.classList.add('on');
    wmTick();
    if (wmTimer) clearInterval(wmTimer);
    wmTimer = setInterval(wmTick, 1000);
  }

  /* ---------- 화면 이탈 감시 ---------- */
  function quiet(ms) { quietUntil = Date.now() + (ms || 4000); }
  function bumpBlur() {
    if (!examActive) return;
    const now = Date.now();
    if (now < quietUntil) return;
    if (now - lastBlurAt < 900) return;
    lastBlurAt = now;
    blurCount++;
    toast('⚠️ 화면을 벗어났습니다 (' + blurCount + '회) — 제출 기록에 함께 전송됩니다');
    wmTick();
  }
  function startWatch() {
    if (watchOn) return;
    watchOn = true;
    document.addEventListener('visibilitychange', function () { if (document.hidden) bumpBlur(); });
    window.addEventListener('blur', bumpBlur);
    window.addEventListener('pagehide', bumpBlur);
  }

  /* ---------- 복사 · 저장 · 인쇄 · 개발자도구 억제 ---------- */
  function warnGuard(msg) {
    const now = Date.now();
    if (now - lastWarnAt < 2200) return;
    lastWarnAt = now;
    toast(msg || '🔒 시험 중에는 복사·저장·인쇄를 사용할 수 없습니다');
  }
  document.addEventListener('keydown', function (e) {
    if (!examActive) return;
    const k = String(e.key || '').toLowerCase();
    const meta = e.ctrlKey || e.metaKey;
    let hit = false;
    if (k === 'f12' || k === 'printscreen') hit = true;
    else if (meta && ['c', 's', 'p', 'u', 'x', 'a'].indexOf(k) >= 0) hit = true;
    else if (meta && e.shiftKey && ['i', 'j', 'c', 'k'].indexOf(k) >= 0) hit = true;
    if (hit) { e.preventDefault(); e.stopPropagation(); warnGuard(); }
  }, true);
  document.addEventListener('contextmenu', function (e) {
    if (!examActive) return;
    e.preventDefault(); warnGuard('🔒 우클릭 메뉴는 사용할 수 없습니다');
  }, true);
  ['copy', 'cut', 'dragstart'].forEach(function (ev) {
    document.addEventListener(ev, function (e) { if (examActive) { e.preventDefault(); warnGuard(); } }, true);
  });
  window.addEventListener('beforeprint', function () { if (examActive) warnGuard('🔒 시험 중에는 인쇄할 수 없습니다'); });

  /* ---------- 1인 1회 제출 잠금 ---------- */
  function submittedInfo() {
    const o = parseJSON(readSS(SUB_KEY));

     교사용 관리 패널 (?teacher=1)

      const save = async function (extra) {

        } else {

  if (el('svlTAllClose')) el('svlTAllClose').addEventListener('click', async function () {

    quiet(6000);
    if (!window.confirm('모든 반을 닫을까요? (학생 입장·제출이 즉시 차단됩니다)')) return;

    let n = 0;
    for (const c of teacherList) {

    const r2 = await apiCall({ action: 'teacher_list', master: masterCode });
    if (r2 && r2.ok) { teacherList = r2.classes || []; renderTeacherList(); }
  });

  async function copyCodeGs() {

  if (el('svlTCopy')) el('svlTCopy').addEventListener('click', copyCodeGs);
  if (gateCopyBtn) gateCopyBtn.addEventListener('click', copyCodeGs);

  if (el('svlTPreview')) el('svlTPreview').addEventListener('click', function () {
    const first = teacherList.filter(c => c.problem)[0];
    beginSession({
      school: st.school || DEF_SCHOOL, grade: st.grade || '2', cls: st.cls || '1', num: st.num || '0', name: '교사 미리보기',
      pin: '', problem: first ? first.problem : '(교사 미리보기) 학생이 입장할 때 이 자리에 서버의 문제가 표시됩니다.',
      deadline: '', oneTime: false, enterAt: '', teacherPreview: true
    });
    tMask.classList.remove('on');
    toast('👀 교사 미리보기 — 제출은 시트에 기록되지 않습니다');
