<!DOCTYPE html>
<!--
  ============================================================================
  Science Virtual LAB · 전기 회로 3D (테스트)  —  수행평가 학생 정보 입력 & 캡처 제출
  ============================================================================
  제출함 스프레드시트: https://docs.google.com/spreadsheets/d/1g6wvP20IaFOK4as0GixHQWRPXCCZA_bVOv140Ez4z64/edit

  [교사 1회 설정 — Apps Script 웹앱 배포]
  1) 위 스프레드시트 → [확장 프로그램] → [Apps Script]
  2) 아래 코드 전체를 붙여넣고 저장
  3) [배포] → [새 배포] → 유형: 웹 앱 / 다음 사용자로 실행: 나 / 액세스 권한: 모든 사용자 → [배포] → 웹 앱 URL 복사
  4) 이 실험실 주소 뒤에 ?hook=복사한URL 을 붙여 한 번 열면 학생 기기에 저장되어 이후 자동 전송됩니다.
     예) .../electriccircuit_test.html?hook=https://script.google.com/macros/s/AKfy.../exec
     (주소창에 ?school=OO중학교 를 붙이면 워터마크의 학교명이 바뀝니다.)

  ---- 아래 [Apps Script 코드] 블록 전체를 붙여넣으세요 ----
  const SHEET_ID = '1g6wvP20IaFOK4as0GixHQWRPXCCZA_bVOv140Ez4z64';
  const FOLDER_NAME = '전기회로 수행평가 제출';

  function doPost(e) {
    try {
      const data = JSON.parse((e.postData && e.postData.contents) || e.parameter.payload);
      const sh = SpreadsheetApp.openById(SHEET_ID).getSheets()[0];
      let url = '';
      const b64 = String(data.imageBase64 || '').split(',')[1] || '';
      if (b64) {
        const folder = getFolder_(FOLDER_NAME);
        const name = data.className + '반_' + data.studentNum + '번_' + data.studentName + '_' + data.fileStamp + '.png';
        url = folder.createFile(Utilities.newBlob(Utilities.base64Decode(b64), 'image/png', name)).getUrl();
      }
      sh.appendRow([data.timestamp, data.className, data.studentNum, data.studentName,
                    data.summary, url, data.partsDetail, '', '']);
      // 시트에 사진을 바로 보이게 하려면 아래 줄의 주석을 푸세요 (사진이 셀 위에 겹쳐 보입니다)
      // if (b64) sh.insertImage(Utilities.newBlob(Utilities.base64Decode(b64), 'image/png', name), 6, sh.getLastRow());
      return ContentService.createTextOutput(JSON.stringify({ ok: true, url: url }))
        .setMimeType(ContentService.MimeType.JSON);
    } catch (err) {
      return ContentService.createTextOutput(JSON.stringify({ ok: false, error: String(err) }))
        .setMimeType(ContentService.MimeType.JSON);
    }
  }

  function getFolder_(n) {
    const it = DriveApp.getFoldersByName(n);
    return it.hasNext() ? it.next() : DriveApp.createFolder(n);
  }
  ---- 코드 끝 ----
============================================================================
-->

    <script>
const $=s=>document.querySelector(s);
const RA=[];for(let i=1;i<=10;i++)RA.push(i);
for(let i=2;i<=10;i++)RA.push(i*10);
for(let i=2;i<=10;i++)RA.push(i*100);
for(let i=2;i<=10;i++)RA.push(i*1000);

let batteryInternalR = 0.0;

$('#battRInput').addEventListener('input', e => {
  batteryInternalR = parseFloat(e.target.value);
  $('#battRVal').textContent = batteryInternalR.toFixed(2) + ' Ω';
});

const TYPES={
  resist:{n:'저항',ic:'〰',R:10},
  bulb:{n:'전구',ic:'💡',R:10},
  wire:{n:'도선',ic:'━',R:0},
  sw:{n:'스위치',ic:'⏻',R:0},
  batt:{n:'전지',ic:'🔋',V:1.5},
  vMeter:{n:'전압계',ic:'V',R:1e8}, 
  iMeter:{n:'전류계',ic:'A',R:0}
};

const isMeter = t => t==='vMeter'||t==='iMeter';

const mod=(a,b)=>((a%b)+b)%b;

/* 포맷팅 함수 */
function fmt(v,u){
  const a=Math.abs(v);
  if(a<1e-4)return '0 '+u;
  for(const[s,p]of[[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m']])
    if(a>=s)return(+(v/s).toPrecision(3))+' '+p+u;
  return '0 '+u;
}

/* 3D 렌더러 & 씬 기본 설정 */
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const cv=renderer.domElement;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(38,1,.1,100);
let yaw=0,pitch=.82,dist=15;
const camTarget=new THREE.Vector3(0,0,0);

function updateCam(){
  const cx = camTarget.x + dist*Math.sin(yaw)*Math.cos(pitch);
  const cy = camTarget.y + dist*Math.sin(pitch);
  const cz = camTarget.z + dist*Math.cos(yaw)*Math.cos(pitch)+.3;
  camera.position.set(cx, cy, cz);
  camera.lookAt(camTarget);
  camera.updateMatrixWorld();
}
function resize(){
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();

/* 조명 */
const hemiLight = new THREE.HemisphereLight(0xffffff,0xdde3ea,1.1);
scene.add(hemiLight);
const sun=new THREE.DirectionalLight(0xffffff,0.8);
sun.position.set(5,12,7);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-10,right:10,top:8,bottom:-8,near:1,far:30});
sun.shadow.radius=3;
scene.add(sun);

/* 작업판 및 테두리 */
const boardMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.82,metalness:0});
const board=new THREE.Mesh(new THREE.PlaneGeometry(16,9.5),boardMat);
board.rotation.x=-Math.PI/2;
board.position.set(0,0,0);
board.receiveShadow=true;
board.name='circuit-board';
scene.add(board);

const edge=new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(16,.12,9.5)),
  new THREE.LineBasicMaterial({color:0xcbd5e1})
);
edge.position.y=-.06;
scene.add(edge);

/* 화염 파티클 시스템 */
const FIRE_PARTICLES = 120;
const MAX_FIRE_LIGHTS = 6;
const fireGeo = new THREE.BufferGeometry();
const firePos = new Float32Array(FIRE_PARTICLES * 3);
const fireSizes = new Float32Array(FIRE_PARTICLES);
const fireAlphas = new Float32Array(FIRE_PARTICLES);
const fireVelocities = [];

for(let i=0; i<FIRE_PARTICLES; i++){
  firePos[i*3] = 0; firePos[i*3+1] = -100; firePos[i*3+2] = 0;
  fireSizes[i] = Math.random() * 0.3 + 0.15;
  fireAlphas[i] = 0;
  fireVelocities.push({
    x: (Math.random() - 0.5) * 0.04,
    y: Math.random() * 0.05 + 0.03,
    z: (Math.random() - 0.5) * 0.04,
    life: Math.random()
  });
}

fireGeo.setAttribute('position', new THREE.BufferAttribute(firePos, 3));
fireGeo.setAttribute('size', new THREE.BufferAttribute(fireSizes, 1));
fireGeo.setAttribute('alpha', new THREE.BufferAttribute(fireAlphas, 1));

const fireMat = new THREE.ShaderMaterial({
  uniforms: { color: { value: new THREE.Color(0xff3300) } },
  vertexShader: `
    attribute float size;
    attribute float alpha;
    varying float vAlpha;
    void main() {
      vAlpha = alpha;
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * (320.0 / -mvPosition.z);
      gl_Position = projectionMatrix * mvPosition;
    }
  `,
  fragmentShader: `
    uniform vec3 color;
    varying float vAlpha;
    void main() {
      float r = length(gl_PointCoord - vec2(0.5));
      if (r > 0.5) discard;
      float intensity = smoothstep(0.5, 0.0, r);
      vec3 finalColor = mix(vec3(1.0, 0.95, 0.3), color, r * 1.8);
      gl_FragColor = vec4(finalColor, intensity * vAlpha);
    }
  `,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});

const fireParticleSystem = new THREE.Points(fireGeo, fireMat);
fireParticleSystem.frustumCulled = false;
scene.add(fireParticleSystem);

const fireLights = [];
for(let i=0; i<MAX_FIRE_LIGHTS; i++){
  const l = new THREE.PointLight(0xff4400, 0, 5);
  scene.add(l);
  fireLights.push(l);
}

/* 다크 모드 제어 로직 */
let isDark = false;
$('#bTheme').addEventListener('click', () => {
  isDark = !isDark;
  document.body.classList.toggle('dark', isDark);
  $('#bTheme').innerHTML = isDark ? '☀️' : '🌙';
  
  boardMat.color.setHex(isDark ? 0x222222 : 0xffffff);
  edge.material.color.setHex(isDark ? 0x555555 : 0xcbd5e1);
  hemiLight.intensity = isDark ? 0.25 : 1.1;
  sun.intensity = isDark ? 0.3 : 0.8;
});

/* 계기판 텍스처 생성 */
function drawMeterFace(ctx, text, colorStr){
  ctx.clearRect(0,0,512,512);
  ctx.fillStyle='#ffffff';
  ctx.beginPath();ctx.arc(256,256,240,0,Math.PI*2);ctx.fill();
  ctx.lineWidth=16;ctx.strokeStyle='#e2e8f0';ctx.stroke();

  let size=130;
  ctx.font='bold '+size+'px "SeoulNamsan",-apple-system,BlinkMacSystemFont,sans-serif';
  const maxW=360;
  const w=ctx.measureText(text).width;
  if(w>maxW){
    size=Math.floor(size*maxW/w);
    ctx.font='bold '+size+'px "SeoulNamsan",-apple-system,BlinkMacSystemFont,sans-serif';
  }
  ctx.fillStyle=colorStr;
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(text,256,195);
}

function createMeterTexture(text, colorStr){
  const canvas=document.createElement('canvas');
  canvas.width=512; canvas.height=512;
  const ctx=canvas.getContext('2d');
  drawMeterFace(ctx,text,colorStr);
  const tex=new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter;
  tex.generateMipmaps = false;
  tex.needsUpdate=true;
  return tex;
}

function createTerminalTexture(text, colorStr){
  const canvas=document.createElement('canvas');
  canvas.width=512; canvas.height=512;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle=colorStr;
  ctx.font='bold 380px "SeoulNamsan",-apple-system,BlinkMacSystemFont,sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(text, 256, 256);

function drawLabel(sprite,text,colorStr){
  const canvas=sprite.material.map.image;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,256,96);
  const x=6,y=8,w=244,h=80,r=26;
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
  ctx.fillStyle='rgba(255,255,255,0.94)';ctx.fill();
  ctx.lineWidth=5;ctx.strokeStyle=colorStr;ctx.stroke();

  let size=46;
  const LABEL_FONT='"SeoulNamsan",-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif';
  ctx.font='bold '+size+'px '+LABEL_FONT;
  const wd=ctx.measureText(text).width;
  if(wd>210){
    size=Math.floor(size*210/wd);
    ctx.font='bold '+size+'px '+LABEL_FONT;
  }
  ctx.fillStyle=colorStr;
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(text,128,50);
  sprite.material.map.needsUpdate=true;
}

function removePart(p){

      if(Array.isArray(o.material))o.material.forEach(m=>m.dispose());

/* MNA 기반 회로망 해석 */
function simulate(){
  const pts=[];
  const id=(x,z)=>{
    for(let i=0;i<pts.length;i++)if(Math.hypot(pts[i][0]-x,pts[i][1]-z)<.16)return i;
    pts.push([x,z]);return pts.length-1;
  };
  parts.forEach(p=>{
    p.n0=id(p.x[0],p.z[0]);
    p.n1=id(p.x[1],p.z[1]);
    p.I=0; p.dv=0; p.closed=false; p.isShort=false;
  });

  const numNodes = pts.length;
  if(numNodes === 0) return;
  
  const nodeDegree = new Array(numNodes).fill(0);
  parts.forEach(p=>{ nodeDegree[p.n0]++; nodeDegree[p.n1]++; });
  parts.forEach(p=>{
    p.conn0 = nodeDegree[p.n0] > 1;
    p.conn1 = nodeDegree[p.n1] > 1;
    p.fullyConnected = p.conn0 && p.conn1; 
  });

  const batteries = parts.filter(p=>p.type==='batt');
  const numBatts = batteries.length;
  
  if(numBatts === 0) {
    parts.forEach(p=>{
      if(isMeter(p.type)) updateMeterDisplay(p, 0);
    });
    return;
  }

  const N = numNodes;
  const M = numBatts;
  const size = N + M;

  const A = Array.from({length: size}, () => new Float64Array(size));
  const Z = new Float64Array(size);

  for(let j=0; j<N; j++){ A[j][j] += 1e-9; }

  const WIRE_R = 1e-4;

  parts.forEach(p=>{
    if(p.type === 'batt') return; 
    if(p.type === 'sw' && p.open) return;
    let R = p.R;
    if(p.type === 'wire' || p.type === 'iMeter' || p.type === 'sw') R = WIRE_R;
    const G = 1 / R;
    const u = p.n0, v = p.n1;

    if(isFinite(G) && G > 0){
      A[u][u] += G; A[v][v] += G;
      A[u][v] -= G; A[v][u] -= G;
    }
  });

  batteries.forEach((b, k)=>{
    const idx = N + k;
    const u = b.n0; const v = b.n1; 
    A[u][idx] += 1; A[v][idx] -= 1;
    A[idx][u] += 1; A[idx][v] -= 1;
    
    A[idx][idx] -= batteryInternalR;
    Z[idx] = b.V;
  });

  for(let j=0; j<size; j++){ A[0][j] = 0; A[j][0] = 0; }
  A[0][0] = 1; Z[0] = 0;

  const X = solveLinearSystem(A, Z, size);

  if(!X) {
    parts.forEach(p=>{
      if(isMeter(p.type)) updateMeterDisplay(p, 0);
    });
    return;
  }

  const nodeV = X.subarray(0, N);

  parts.forEach(p=>{
    if(p.type==='batt'){
      const k = batteries.indexOf(p);
      p.I = X[N + k]; 
      p.dv = p.V - Math.abs(p.I) * batteryInternalR;
      p.closed = Math.abs(p.I) > 1e-4;
      
      if(p.closed && Math.abs(p.I) >= 3.0) {
        p.isShort = true;
      }
    } else {
      if (!p.fullyConnected) {
        p.dv = 0;
        p.I = 0;
      } else {
        const v0 = nodeV[p.n0];
        const v1 = nodeV[p.n1];
        p.dv = v0 - v1;
        
        let R = p.R;
        if(p.type === 'wire' || p.type === 'iMeter' || p.type === 'sw') R = WIRE_R;
        
        if(p.type === 'vMeter') p.I = 0;
        else if(p.type === 'sw' && p.open) p.I = 0;
        else p.I = p.dv / R;
      }
      p.closed = Math.abs(p.I) > 1e-4;
    }

    if(Math.abs(p.I) < 1e-5) p.I = 0;
    if(Math.abs(p.dv) < 1e-5) p.dv = 0;

    if(p.type === 'vMeter'){
      updateMeterDisplay(p, p.dv);
    } else if(p.type === 'iMeter'){
      updateMeterDisplay(p, p.I);
    }
  });
}

function solveLinearSystem(A, B, n) {
  const M = Array.from({length: n}, (_, i) => {
    const row = new Float64Array(n + 1);
    row.set(A[i]); row[n] = B[i]; return row;
  });

  for(let i=0; i<n; i++) {
    let maxRow = i;
    for(let k=i+1; k<n; k++) {
      if(Math.abs(M[k][i]) > Math.abs(M[maxRow][i])) maxRow = k;
    }
    const temp = M[i]; M[i] = M[maxRow]; M[maxRow] = temp;

    if(Math.abs(M[i][i]) < 1e-11) return null; 

    for(let k=i+1; k<n; k++) {
      const c = -M[k][i] / M[i][i];
      for(let j=i; j<=n; j++) {
        if(i === j) M[k][j] = 0;
        else M[k][j] += c * M[i][j];
      }
    }
  }

  const x = new Float64Array(n);
  for(let i=n-1; i>=0; i--) {
    x[i] = M[i][n] / M[i][i];
    for(let k=i-1; k>=0; k--) {
      M[k][n] -= M[k][i] * x[i];
    }
  }
  return x;
}

function updateMeterDisplay(p, val){
  if(!p.meterTex) return;
  const unit = p.type==='vMeter' ? 'V' : 'A';
  
  let textStr = fmt(val, unit);
  if(textStr.startsWith('-0 ')) textStr = '0 ' + unit;
  
  if(p.lastText === textStr) return;
  p.lastText = textStr;
  
  const colorStr = p.type==='vMeter' ? '#3b82f6' : '#10b981';
  const canvas = p.meterTex.image;
  const ctx = canvas.getContext('2d');
  drawMeterFace(ctx, textStr, colorStr);
  p.meterTex.needsUpdate = true;
}

/* 불꽃 파티클 애니메이션 */
function updateFireAnimation(shortBatteries){
  const positions = fireGeo.attributes.position.array;
  const alphas = fireGeo.attributes.alpha.array;
  const n = shortBatteries.length;

  if(n === 0){
    fireLights.forEach(l => l.intensity = 0);
    for(let i=0; i<FIRE_PARTICLES; i++) alphas[i] = 0;
    fireGeo.attributes.alpha.needsUpdate = true;
    return;
  }

  fireLights.forEach((l, i)=>{
    if(i < n){
      const b = shortBatteries[i];
      l.position.set((b.x[0]+b.x[1])/2, 0.4, (b.z[0]+b.z[1])/2);
      l.intensity = 3.0 + Math.random() * 3.0;
    } else {
      l.intensity = 0;
    }
  });

  for(let i=0; i<FIRE_PARTICLES; i++){
    const v = fireVelocities[i];
    const batt = shortBatteries[i % n];
    const cx = (batt.x[0] + batt.x[1]) / 2;
    const cz = (batt.z[0] + batt.z[1]) / 2;
    v.life -= 0.04;

    if(v.life <= 0){
      v.life = 1.0;
      positions[i*3] = cx + (Math.random() - 0.5) * 0.5;
      positions[i*3+1] = 0.15;
      positions[i*3+2] = cz + (Math.random() - 0.5) * 0.5;
      v.x = (Math.random() - 0.5) * 0.04;
      v.y = Math.random() * 0.06 + 0.035;
      v.z = (Math.random() - 0.5) * 0.04;
    } else {
      positions[i*3] += v.x;
      positions[i*3+1] += v.y;
      positions[i*3+2] += v.z;
    }

    alphas[i] = Math.sin(Math.max(v.life,0) * Math.PI);
  }

  fireGeo.attributes.position.needsUpdate = true;
  fireGeo.attributes.alpha.needsUpdate = true;
}

function updatePart(p){
  const dx=p.x[1]-p.x[0],dz=p.z[1]-p.z[0],L=Math.hypot(dx,dz);
  p.L=L;
  p.g.position.set(p.x[0],.08,p.z[0]);p.g.rotation.y=-Math.atan2(dz,dx);
  p.lead.scale.x=L;p.lead.position.x=L/2;p.j[1].position.x=L;p.mid.position.x=L/2;
  
  if(isMeter(p.type) && p.displayPlane){
    p.displayPlane.quaternion.copy(camera.quaternion);
    p.displayPlane.quaternion.premultiply(p.g.quaternion.clone().invert());
  }

  if(p.j[0].material) p.j[0].material.color.setHex(p.conn0 ? 0x9ca3af : 0xef4444);
  if(p.j[1].material) p.j[1].material.color.setHex(p.conn1 ? 0x9ca3af : 0xef4444);

  if(p.type==='sw'){
    const h=L/2;
    const sl=Math.max(h-.45,.001);
    p.stubs[0].scale.x=sl; p.stubs[0].position.x=-(h+.45)/2;
    p.stubs[1].scale.x=sl; p.stubs[1].position.x=(h+.45)/2;
    const target=p.open?.7:0;
    p.leverAngle+=(target-p.leverAngle)*.25;
    p.lever.rotation.z=p.leverAngle;
  }

  if(p.lbl){
    const info=labelInfo(p);
    if(info){
      const key=info.t+'|'+info.c;
      if(p.lblText!==key){ p.lblText=key; drawLabel(p.lbl,info.t,info.c); }
    }
    p.lbl.position.set((p.x[0]+p.x[1])/2,.25,(p.z[0]+p.z[1])/2+.95);
  }

  const modeEl=document.querySelector('input[name=mode]:checked');
  const electron=modeEl?modeEl.value==='electron':true;
  const I=p.I;
  const on=Math.abs(I) > 1e-4;

  const speedFactor = Math.min(Math.abs(I), 100);
  p.ph += on ? Math.sign(I) * (0.02 + speedFactor * 0.15) : 0;
  
  const mesh=electron?p.el:p.ar;
  (electron?p.ar:p.el).visible=false;
  mesh.visible=on;
  
  const S=.8;
  const off=electron?mod(-p.ph,S):mod(p.ph,S);
  let c=0;
  
  if(on){
    for(let k=0;k<48;k++){
      const x=k*S+off;if(x>L)break;
      tmp.position.set(x,0,0);
      tmp.rotation.set(0, (electron ? I < 0 : I >= 0) ? 0 : Math.PI, 0);
      tmp.updateMatrix();
      mesh.setMatrixAt(c++,tmp.matrix);
    }
  }
  mesh.count=c;mesh.instanceMatrix.needsUpdate=true;
  
  if(p.type==='bulb'){
    const lit=p.closed && $('#cLight').checked;
    const power = Math.abs(p.dv * p.I); 
    const brightness = lit ? Math.min(Math.sqrt(power) * 1.5, 6.0) : 0;
    
    p.fil.material.emissiveIntensity = brightness * 3.0;
    p.fil.material.color.set(lit ? 0xffea00 : 0xa39171);
    p.fil.material.emissive.set(lit ? 0xffbb00 : 0x000000);
    
    if(p.bulbLight) p.bulbLight.intensity = brightness * 2.5;
    if(p.glow){
      p.glow.material.opacity = lit ? Math.min(0.2 + brightness * 0.2, 1.0) : 0;
      p.glow.scale.setScalar(lit ? 1.0 + brightness * 0.3 : 1);
    }
  }
}

const rc=new THREE.Raycaster(),pl=new THREE.Plane(new THREE.Vector3(0,1,0),-.015),v2=new THREE.Vector2();
function wp(e){
  v2.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);
  rc.setFromCamera(v2,camera);
  const t=new THREE.Vector3();
  return rc.ray.intersectPlane(pl,t)?t:null;
}
function segDist(px,pz,p){
  const ax=p.x[0],az=p.z[0],bx=p.x[1],bz=p.z[1],dx=bx-ax,dz=bz-az;
  const l2=dx*dx+dz*dz||1e-9;
  let t=((px-ax)*dx+(pz-az)*dz)/l2;t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-ax-t*dx,pz-az-t*dz);
}

let drag=null,orbit=false,moved=false,down={x:0,y:0},activePointer=null;

/* 화면 줌 및 화면 이동 (Pan) 제어 */
let isPinching = false;
let isTwoFinger = false;
let pinchDist = 0;
let pinchStartCamDist = 15;
let twoFingerStart = { x: 0, y: 0 };
let camTargetStart = new THREE.Vector3();

cv.addEventListener('wheel', e => {
  e.preventDefault();
  dist = Math.max(5, Math.min(40, dist + e.deltaY * 0.02));
  updateCam();
}, { passive: false });

cv.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    isTwoFinger = true;
    isPinching = true;
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchDist = Math.hypot(dx, dy);
    pinchStartCamDist = dist;
    twoFingerStart.x = 0.5 * (e.touches[0].clientX + e.touches[1].clientX);
    twoFingerStart.y = 0.5 * (e.touches[0].clientY + e.touches[1].clientY);
    camTargetStart.copy(camTarget);
  }
}, { passive: false });

cv.addEventListener('touchmove', e => {
  if (e.touches.length === 2 && isTwoFinger) {
    e.preventDefault();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const currentDist = Math.hypot(dx, dy);
    if (pinchDist > 0 && currentDist > 0) {
      dist = Math.max(5, Math.min(40, pinchStartCamDist * (pinchDist / currentDist)));
    }

    const midX = 0.5 * (e.touches[0].clientX + e.touches[1].clientX);
    const midY = 0.5 * (e.touches[0].clientY + e.touches[1].clientY);
    const deltaX = midX - twoFingerStart.x;
    const deltaY = midY - twoFingerStart.y;

    const targetDist = dist * Math.tan((38 / 2) * Math.PI / 180);
    const factor = (2 * targetDist) / innerHeight;

    const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
    const up = new THREE.Vector3(-Math.sin(yaw) * Math.sin(pitch), Math.cos(pitch), -Math.cos(yaw) * Math.sin(pitch));

    const moveVector = new THREE.Vector3()
      .addScaledVector(right, -deltaX * factor)
      .addScaledVector(up, deltaY * factor);

    camTarget.copy(camTargetStart).add(moveVector);
    updateCam();
  }
}, { passive: false });

cv.addEventListener('touchend', e => {
  if (e.touches.length < 2) {
    isTwoFinger = false;
    isPinching = false;
    pinchDist = 0;
  }
});

cv.addEventListener('contextmenu',e=>e.preventDefault());

let isPanning = false;
let panStart = { x: 0, y: 0 };

cv.addEventListener('pointerdown',e=>{
  if(e.target!==cv || draggingType) return;
  activePointer=e.pointerId;
  cv.setPointerCapture?.(e.pointerId);
  moved=false;down={x:e.clientX,y:e.clientY};

  // PC 화면 이동(Pan): 마우스 우클릭(2), 휠 클릭(1), 또는 Shift + 좌클릭(0)
  if(e.button === 2 || e.button === 1 || (e.button === 0 && e.shiftKey)) {
    isPanning = true;
    panStart = { x: e.clientX, y: e.clientY };
    camTargetStart.copy(camTarget);
    return;
  }

  const w=wp(e);
  if(!w){orbit=true;return;}

  let best=.55,hit=null;
  parts.forEach(p=>[0,1].forEach(i=>{
    const d=Math.hypot(w.x-p.x[i],w.z-p.z[i]);
    if(d<best){best=d;hit=[p,i];}
  }));
  if(hit){
    const hx=hit[0].x[hit[1]],hz=hit[0].z[hit[1]];
    const list=[];
    parts.forEach(p=>[0,1].forEach(i=>{
      if(Math.hypot(p.x[i]-hx,p.z[i]-hz)<.05)list.push([p,i]);
    }));
    drag={kind:'joint',list,ox:w.x-hx,oz:w.z-hz};
    select(null);return;
  }
  for(let k=parts.length-1;k>=0;k--){
    const p=parts[k];
    if(segDist(w.x,w.z,p)<.48){
      drag={kind:'part',p,sx:w.x,sz:w.z,x0:p.x.slice(),z0:p.z.slice()};
      return;
    }
  }
  orbit=true;
});

cv.addEventListener('pointermove',e=>{
  if (isTwoFinger) return;
  if(activePointer!==null && e.pointerId!==activePointer)return;
  if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>5)moved=true;

  if(isPanning){
    const deltaX = e.clientX - panStart.x;
    const deltaY = e.clientY - panStart.y;
    const targetDist = dist * Math.tan((38 / 2) * Math.PI / 180);
    const factor = (2 * targetDist) / innerHeight;

    const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
    const up = new THREE.Vector3(-Math.sin(yaw) * Math.sin(pitch), Math.cos(pitch), -Math.cos(yaw) * Math.sin(pitch));

    const moveVector = new THREE.Vector3()
      .addScaledVector(right, -deltaX * factor)
      .addScaledVector(up, deltaY * factor);

    camTarget.copy(camTargetStart).add(moveVector);
    updateCam();
    return;
  }

  if(orbit){
    yaw-=(e.movementX||0)*.005;
    pitch=Math.max(.25,Math.min(1.42,pitch+(e.movementY||0)*.005));
    updateCam();return;
  }
  if(!drag||!moved)return;
  const tr=document.querySelector('#trash'),r=tr.getBoundingClientRect();
  tr.classList.toggle('over',e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom);
  const w=wp(e);if(!w)return;
  if(drag.kind==='joint'){
    drag.list.forEach(([p,i])=>{p.x[i]=w.x-drag.ox;p.z[i]=w.z-drag.oz;});
  }else{
    const p=drag.p,dx=w.x-drag.sx,dz=w.z-drag.sz;
    for(let i=0;i<2;i++){p.x[i]=drag.x0[i]+dx;p.z[i]=drag.z0[i]+dz;}
  }
});

function magnetSnap(){
  const SNAP_RADIUS=.72;
  parts.forEach(p=>{
    for(let i=0;i<2;i++){
      const x=p.x[i],z=p.z[i];
      let best=SNAP_RADIUS,target=null;
      parts.forEach(q=>{
        if(q===p)return;
        for(let j=0;j<2;j++){
          const d=Math.hypot(x-q.x[j],z-q.z[j]);
          if(d<best){best=d;target=[q,j];}
        }
      });
      if(target){p.x[i]=target[0].x[target[1]];p.z[i]=target[0].z[target[1]];}
    }
  });
}

function finishCanvasPointer(e){
  if(activePointer!==null && e.pointerId!==activePointer)return;
  const trash=document.querySelector('#trash');
  const overTrash=trash&&e.clientX>=trash.getBoundingClientRect().left&&e.clientX<=trash.getBoundingClientRect().right&&
    e.clientY>=trash.getBoundingClientRect().top&&e.clientY<=trash.getBoundingClientRect().bottom;
  if(drag&&drag.kind==='part'&&moved&&overTrash){
    removePart(drag.p);
    trash.classList.remove('over');
  }else{
    if(drag&&moved)magnetSnap();
    if(!moved){
      if(drag&&drag.kind==='part'){
        if(drag.p.type==='sw'){ drag.p.open=!drag.p.open; select(null); }
        else if(['resist','bulb','batt'].includes(drag.p.type)) select(drag.p);
      }
      else if(!drag)select(null);
    }
  }
  drag=null;orbit=false;isPanning=false;activePointer=null;
}
cv.addEventListener('pointerup',finishCanvasPointer);
cv.addEventListener('pointercancel',finishCanvasPointer);
cv.addEventListener('pointerleave',()=>{if(!drag)$('#trash').classList.remove('over');});

/* 팔레트 및 수직 레버 제어 로직 */
const pal=$('#palette');

const leverThumb=$('#leverThumb');

let draggingType=null,dragPointerId=null;
let palPending=null;

/* 레버 thumb 위치 및 팔레트 스크롤 위치 동기화 */
function updateLeverFromScroll(){
  const maxScroll = pal.scrollHeight - pal.clientHeight;
  if(maxScroll <= 0){
    leverThumb.style.top = '0px';
    return;
  }
  const trackHeight = leverTrack.clientHeight - leverThumb.clientHeight;
  const ratio = pal.scrollTop / maxScroll;
  leverThumb.style.top = (ratio * trackHeight) + 'px';
}
pal.addEventListener('scroll', updateLeverFromScroll);

/* 레버 조작(버튼 및 드래그) */
$('#leverUp').addEventListener('click', () => { pal.scrollTop -= 60; });
$('#leverDown').addEventListener('click', () => { pal.scrollTop += 60; });

let leverDragging = false, leverPointerId = null;
leverTrack.addEventListener('pointerdown', e => {
  leverDragging = true;
  leverPointerId = e.pointerId;
  leverTrack.setPointerCapture(e.pointerId);
  moveLeverByPointer(e);
});
leverTrack.addEventListener('pointermove', e => {
  if(leverDragging && e.pointerId === leverPointerId){
    moveLeverByPointer(e);
  }
});
function stopLeverDrag(e){
  if(leverDragging && e.pointerId === leverPointerId){
    leverDragging = false;
    leverPointerId = null;
  }
}
leverTrack.addEventListener('pointerup', stopLeverDrag);
leverTrack.addEventListener('pointercancel', stopLeverDrag);

function moveLeverByPointer(e){
  const rect = leverTrack.getBoundingClientRect();
  const thumbH = leverThumb.clientHeight;
  const trackH = rect.height - thumbH;
  let offsetY = e.clientY - rect.top - thumbH / 2;
  offsetY = Math.max(0, Math.min(trackH, offsetY));
  
  const ratio = offsetY / (trackH || 1);
  const maxScroll = pal.scrollHeight - pal.clientHeight;
  pal.scrollTop = ratio * maxScroll;
  leverThumb.style.top = offsetY + 'px';
}

function moveGhost(x,y){
  ghost.style.left=x+'px';ghost.style.top=y+'px';
}
function startPaletteDrag(k,e){
  const hintEl = document.getElementById('hint');
  if(hintEl) hintEl.style.opacity = '0';
  draggingType=k;dragPointerId=e.pointerId;
  ghost.innerHTML='<b>'+TYPES[k].ic+'</b>'+TYPES[k].n;
  ghost.style.display='block';
  moveGhost(e.clientX,e.clientY);
}
Object.keys(TYPES).forEach(k=>{
  const b=document.createElement('button');
  b.type='button';b.className='pbtn';
  b.innerHTML='<b>'+TYPES[k].ic+'</b>'+TYPES[k].n;
  b.addEventListener('pointerdown',e=>{
    e.preventDefault();e.stopPropagation();
    if(e.pointerType==='mouse'){
      startPaletteDrag(k,e);
    }else{
      palPending={k,id:e.pointerId,sx:e.clientX,sy:e.clientY,sc:pal.scrollTop,mode:null};
    }
  });
  pal.insertBefore(b,$('#trash'));
});

window.addEventListener('pointermove',e=>{
  if(palPending && e.pointerId===palPending.id){
    const P=palPending;
    const dx=e.clientX-P.sx, dy=e.clientY-P.sy;
    const r=pal.getBoundingClientRect();
    const outside=e.clientX>r.right+6||e.clientX<r.left-6||e.clientY<r.top-30||e.clientY>r.bottom+30;
    const canScroll=pal.scrollHeight>pal.clientHeight+2;

    if(!P.mode){
      if(Math.hypot(dx,dy)<8 && !outside) return;
      if(outside || !canScroll || Math.abs(dx)>Math.abs(dy)) P.mode='drag';
      else P.mode='scroll';
    }
    if(P.mode==='drag'){
      const k=P.k;
      palPending=null;
      startPaletteDrag(k,e);
      return;
    }
    if(P.mode==='scroll'){
      pal.scrollTop=P.sc-dy;
      if(e.clientX>r.right+6){
        const k=P.k;
        palPending=null;
        startPaletteDrag(k,e);
      }
    }
    return;
  }
  if(!draggingType||e.pointerId!==dragPointerId)return;
  moveGhost(e.clientX,e.clientY);
});

window.addEventListener('pointerup',e=>{
  if(palPending && e.pointerId===palPending.id){ palPending=null; return; }
  if(!draggingType||e.pointerId!==dragPointerId)return;
  const type=draggingType;
  ghost.style.display='none';
  const paletteRect=$('#palette-container').getBoundingClientRect();
  const insidePalette=e.clientX>=paletteRect.left&&e.clientX<=paletteRect.right&&
    e.clientY>=paletteRect.top&&e.clientY<=paletteRect.bottom;

    const half=isMeter(type)?1.0:.85;
    const p=addPart(type,w.x-half,w.z,w.x+half,w.z);
    select(p);
  }
  draggingType=null;dragPointerId=null;
});
window.addEventListener('pointercancel',()=>{
  palPending=null;
  draggingType=null;dragPointerId=null;ghost.style.display='none';
});

<script>
/* ============ 모바일 화면 재조정 + 전체화면 대체 동작 (자동 생성) ============ */
(function () {
    var docEl = document.documentElement;
    var btn = document.getElementById('fullscreenBtn');
    var icon = document.getElementById('fullscreenIcon');
    var text = document.getElementById('fullscreenText');

    function realFs() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement ||
                  document.mozFullScreenElement || document.msFullscreenElement);
    }
    function pseudo() { return docEl.classList.contains('pseudo-fs'); }
    function setUI() {
        var on = realFs() || pseudo();
        if (icon) icon.textContent = on ? '🗗' : '⛶';
        if (text) text.textContent = on ? '창모드' : '전체화면';
        if (btn) btn.setAttribute('aria-label', on ? '창모드로 전환' : '전체화면으로 전환');
        document.body.classList.toggle('is-fullscreen', on);
    }
    function toast(msg) {
        var t = document.getElementById('ux-toast');
        if (!t) {
            t = document.createElement('div');
            t.id = 'ux-toast';
            t.style.cssText = 'position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);' +
                'background:rgba(28,28,30,.88);color:#fff;font-size:12px;line-height:1.4;padding:9px 14px;border-radius:14px;' +
                'z-index:9999;max-width:86vw;text-align:center;pointer-events:none;transition:opacity .3s;' +
                'font-family:inherit;box-shadow:0 8px 24px rgba(0,0,0,.25)';
            document.body.appendChild(t);
        }
        t.textContent = msg;
        t.style.opacity = '1';
        clearTimeout(t._t);
        t._t = setTimeout(function () { t.style.opacity = '0'; }, 2600);
    }

    if (btn) {
        btn.addEventListener('click', function () {
            var wasReal = realFs();
            var wasPseudo = pseudo();
            setTimeout(function () {
                if (wasReal) { setUI(); return; }          // 진짜 전체화면에서 나온 경우
                if (wasPseudo) { docEl.classList.remove('pseudo-fs'); setUI(); return; }  // 몰입 모드 해제
                if (!realFs()) {                            // 전체화면 API가 동작하지 않는 환경
                    docEl.classList.add('pseudo-fs');
                    try { window.scrollTo(0, 1); } catch (e) {}
                    toast('이 브라우저는 전체화면을 지원하지 않아 상단 정보를 숨긴 몰입 모드로 표시합니다');
                }
                setUI();
            }, 380);
        }, false);
    }
    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
        document.addEventListener(ev, setUI);
    });

    /* 좁은 화면에서는 3D 장면이 잘리지 않도록 시야각을 넓혀 전체가 들어오게 한다 */
    function mobileFit() {
        try {
            if (typeof camera === 'undefined' || !camera || !camera.isPerspectiveCamera) return;
            if (!camera.userData) camera.userData = {};
            if (!camera.userData.baseFov) camera.userData.baseFov = camera.fov;
            var w = window.innerWidth, h = window.innerHeight, f = 1;
            var k = 0.62;
            var attr = document.documentElement.getAttribute('data-mzoom');
            if (attr) { var v = parseFloat(attr); if (!isNaN(v) && v > 0) k = v; }
            if (w < h) f = 1 + (1 - w / h) * k;
            else if (h <= 500) f = 1 + k * 0.16;
            camera.fov = Math.min(88, camera.userData.baseFov * f);
            camera.updateProjectionMatrix();
        } catch (e) {}
    }
    mobileFit();

    /* 화면 회전·주소창 변화·전체화면 전환 후 렌더러 크기 재계산 */
    var rt = null;
    function refit() {
        clearTimeout(rt);
        rt = setTimeout(function () {
            mobileFit();
            try { window.dispatchEvent(new Event('resize')); } catch (e) {}
        }, 240);
    }
    window.addEventListener('orientationchange', refit);
    window.addEventListener('pageshow', refit);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) refit(); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', refit);

    const btnTogglePal = document.getElementById('btn-toggle-palette');
    const palCont = document.getElementById('palette-container');
    if (btnTogglePal && palCont) {
        btnTogglePal.addEventListener('click', function () {
            const isCol = palCont.classList.toggle('collapsed');
            btnTogglePal.innerText = isCol ? '📦 도구함 열기' : '◀ 도구 숨기기';
            btnTogglePal.title = isCol ? '부품 도구함 펼치기' : '부품 도구함 접기';
        });
    }

    const btnToggleLight = document.getElementById('btnToggleLight');
    const cLight = document.getElementById('cLight');
    if (btnToggleLight && cLight) {
        btnToggleLight.addEventListener('click', function () {
            cLight.checked = !cLight.checked;
            btnToggleLight.classList.toggle('active', cLight.checked);
            btnToggleLight.querySelector('span:last-child').textContent = cLight.checked ? '전구 빛 (켜짐)' : '전구 빛 (꺼짐)';
        });
    }

    setUI();
})();

   ① 제출함 스프레드시트 → [확장 프로그램] → [Apps Script]
   ② 이 파일 맨 위 주석에 있는 doPost 코드를 붙여넣고 저장
   ③ [배포] → [새 배포] → 유형 '웹 앱' / 실행: 나 / 액세스: 모든 사용자 → [배포] → URL 복사
   ④ 이 실험실 주소 뒤에 ?hook=복사한URL 을 붙여 한 번 열면 학생 기기에 저장됩니다.
      예) electriccircuit_test.html?hook=https://script.google.com/macros/s/AKfy.../exec
   ⑤ (선택) ?school=OO중학교 → 워터마크 학교명 변경,  ?teacher=1 → 제출 주소 설정 버튼 표시
   ========================================================================== */
(function () {
  'use strict';
  /* 웹앱 URL을 주소창 없이 코드에 직접 넣고 싶으면 아래 따옴표 안에 붙여넣으세요. */
  const SUBMIT_WEBHOOK_URL = '';
  const DEF_SCHOOL = '문산중학교';
  const LS = { cls: 'svl_circuit_class', num: 'svl_circuit_num', name: 'svl_circuit_name', hook: 'svl_circuit_hook', school: 'svl_circuit_school' };
  const readLS = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
  const writeLS = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

  const params = new URLSearchParams(location.search);
  if (params.get('hook')) writeLS(LS.hook, params.get('hook').trim());
  if (params.get('school')) writeLS(LS.school, params.get('school').trim());
  /* ?cls=2&num=15&name=김철수 → 입력 모달을 미리 채워서 연다 (수업 전 테스트용) */
  const prefill = { cls: params.get('cls') || '', num: params.get('num') || '', name: params.get('name') || '' };
  const webhook = () => (readLS(LS.hook) || SUBMIT_WEBHOOK_URL || '').trim();
  const schoolName = () => readLS(LS.school) || DEF_SCHOOL;

  const st = { cls: readLS(LS.cls), num: readLS(LS.num), name: readLS(LS.name) };
  const el = id => document.getElementById(id);
  const stuMask = el('svlStudentMask'), clsSel = el('svlClass'), numIn = el('svlNum'), nameIn = el('svlName'),
        startBtn = el('svlStartBtn'), badge = el('svlStudentBadge'), badgeText = el('svlBadgeText'),
        subMask = el('svlSubmitMask'), subSub = el('svlSubSub'), shotImg = el('svlShotImg'), loadingEl = el('svlLoading'),
        chips = el('svlInfoChips'), summaryBox = el('svlSummary'), submitBtn = el('svlSubmitBtn'),
        saveBtn = el('svlSaveBtn'), closeBtn = el('svlCloseBtn'), statusEl = el('svlStatus'),
        capBtn = el('svlCaptureBtn'), cfgBtn = el('svlCfgBtn');

  /* ---------- 반 선택지 ---------- */
  (function () {
    const frag = document.createDocumentFragment();
    const o0 = document.createElement('option'); o0.value = ''; o0.textContent = '반 선택'; frag.appendChild(o0);
    for (let i = 1; i <= 15; i++) { const o = document.createElement('option'); o.value = String(i); o.textContent = i + '반'; frag.appendChild(o); }
    clsSel.appendChild(frag);
  })();
  if (params.get('teacher') === '1') cfgBtn.style.display = 'block';

  /* ---------- 토스트 ---------- */
  let toastTimer = null;
  function toast(msg) {
    let t = el('svlToast');
    if (!t) { t = document.createElement('div'); t.id = 'svlToast'; document.body.appendChild(t); }
    t.textContent = msg; t.classList.add('on');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2600);
  }

  /* ---------- 학생 정보 ---------- */
  const hasStudent = () => !!(st.cls && st.num && st.name);
  function renderBadge() {
    if (hasStudent()) { badgeText.textContent = '🎓 ' + st.cls + '반 ' + st.num + '번 ' + st.name; badge.classList.add('on'); }
    else badge.classList.remove('on');
  }
  function syncStart() {
    const n = parseInt(numIn.value, 10);
    startBtn.disabled = !(clsSel.value && n >= 1 && n <= 40 && nameIn.value.trim().length > 0);
  }
  function openStudentModal() {
    clsSel.value = st.cls || prefill.cls; numIn.value = st.num || prefill.num; nameIn.value = st.name || prefill.name;
    stuMask.classList.add('on'); syncStart();
    setTimeout(() => { try { (st.cls ? (st.num ? nameIn : numIn) : clsSel).focus({ preventScroll: true }); } catch (e) {} }, 160);
  }
  function closeStudentModal() { stuMask.classList.remove('on'); }
  clsSel.addEventListener('change', syncStart);
  numIn.addEventListener('input', syncStart);
  nameIn.addEventListener('input', syncStart);
  nameIn.addEventListener('keydown', e => { if (e.key === 'Enter' && !startBtn.disabled) startBtn.click(); });
  numIn.addEventListener('keydown', e => { if (e.key === 'Enter') nameIn.focus(); });
  startBtn.addEventListener('click', function () {
    const n = parseInt(numIn.value, 10);
    if (!(clsSel.value && n >= 1 && n <= 40 && nameIn.value.trim())) return;
    st.cls = clsSel.value; st.num = String(n); st.name = nameIn.value.trim();
    writeLS(LS.cls, st.cls); writeLS(LS.num, st.num); writeLS(LS.name, st.name);
    renderBadge(); closeStudentModal();
    toast('👋 ' + st.cls + '반 ' + st.num + '번 ' + st.name + ' — 회로를 만들고 [📸 회로 캡처 및 제출]을 눌러주세요');
  });
  badge.addEventListener('click', openStudentModal);

  /* ---------- 회로 분석 ---------- */
  const numOf = t => parts.filter(p => p.type === t).length;
  function analyze() {
    const battN = numOf('batt'), bulbN = numOf('bulb'), wireN = numOf('wire'), resN = numOf('resist'),
          vN = numOf('vMeter'), iN = numOf('iMeter');
    const sws = parts.filter(p => p.type === 'sw');
    const swClosed = sws.filter(p => !p.open).length, swOpen = sws.length - swClosed;
    const bulbs = parts.filter(p => p.type === 'bulb');
    const litN = bulbs.filter(p => p.closed).length;
    const shortN = parts.filter(p => p.type === 'batt' && p.isShort).length;
    const vSum = parts.filter(p => p.type === 'batt').reduce((s, p) => s + (p.V || 0), 0);
    const flowing = parts.some(p => p.type !== 'batt' && Math.abs(p.I) > 1e-4);

    let summary;
    if (!parts.length) {
      summary = '회로가 비어 있음 (부품 0개)';
    } else {
      const bits = ['전지 ' + battN + '개', '전구 ' + bulbN + '개' + (bulbN ? '(점등 ' + litN + '개)' : '')];
      if (resN) bits.push('저항 ' + resN + '개');
      bits.push('도선 ' + wireN + '개');
      if (sws.length) bits.push('스위치 ' + sws.length + '개(닫힘 ' + swClosed + '·열림 ' + swOpen + ')');
      if (vN) bits.push('전압계 ' + vN + '개');
      if (iN) bits.push('전류계 ' + iN + '개');
      bits.push(shortN ? '⚠️ 단락 발생' : (battN ? (flowing ? '전류 흐름 있음' : '전류 흐름 없음') : '전지 없음'));
      summary = bits.join(' · ');
    }
    const rList = arr => { const s = arr.map(p => Math.round(p.R)); return s.length ? (new Set(s).size === 1 ? s[0] : s.join('/')) + 'Ω' : '-'; };
    const detail = [
      '전지×' + battN + (battN ? '(' + vSum.toFixed(1) + 'V)' : ''),
      '전구×' + bulbN + (bulbN ? '(' + rList(bulbs) + ')' : ''),
      '저항×' + resN + (resN ? '(' + rList(parts.filter(p => p.type === 'resist')) + ')' : ''),
      '도선×' + wireN,
      '스위치×' + sws.length + (sws.length ? '(닫힘 ' + swClosed + '/열림 ' + swOpen + ')' : ''),
      '전압계×' + vN,
      '전류계×' + iN
    ].join(', ');
    return { summary: summary, detail: detail, count: parts.length };
  }

  /* ---------- 시각 ---------- */
  function stamp() {
    const d = new Date(), p = n => String(n).padStart(2, '0');
    const date = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
    const time = p(d.getHours()) + ':' + p(d.getMinutes());
    return { text: date + ' ' + time, file: date.replace(/-/g, '') + '_' + p(d.getHours()) + p(d.getMinutes()) };
  }
  function fileName() { return st.cls + '반_' + st.num + '번_' + st.name + '_전기회로.png'; }
  function roundRect(c, x, y, w, h, r) {
    c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }
  function fitText(c, text, maxW) {
    if (c.measureText(text).width <= maxW) return text;
    let t = text;
    while (t.length > 1 && c.measureText(t + '…').width > maxW) t = t.slice(0, -1);
    return t + '…';
  }

  /* 3D 화면 캡처 → 하단 공식 워터마크 바 합성 */
  function composeShot(info) {
    renderer.render(scene, camera);
    const raw = renderer.domElement.toDataURL('image/png');
    return new Promise(function (resolve, reject) {
      const img = new Image();
      img.onload = function () {
        try {
          const FONT = "'SeoulNamsan',-apple-system,'Noto Sans KR',sans-serif";
          const MAXW = 1400;
          const k = Math.min(1, MAXW / img.width);
          const w = Math.max(360, Math.round(img.width * k)), h = Math.round(img.height * k);
          const fs1 = Math.max(18, Math.round(w * 0.0215));
          const fs2 = Math.max(13, Math.round(w * 0.0150));
          const fs3 = Math.max(12, Math.round(w * 0.0135));
          const padX = Math.round(w * 0.026);
          const barH = Math.round(fs1 * 1.45 + fs2 * 1.5 + fs3 * 1.5 + w * 0.038);
          const t = stamp(), info2 = info || analyze();

          const cvs = document.createElement('canvas');
          cvs.width = w; cvs.height = h + barH;
          const c = cvs.getContext('2d');
          c.fillStyle = isDark ? '#1c1c1e' : '#f4f7f6';
          c.fillRect(0, 0, w, cvs.height);
          c.drawImage(img, 0, 0, w, h);

          /* 이미지 좌상단 워터마크 pill */
          const tag = '⚡ Science Virtual LAB · 전기 회로 수행평가';
          const fsTag = Math.max(11, Math.round(w * 0.0125));
          c.font = '800 ' + fsTag + 'px ' + FONT;
          const tw = c.measureText(tag).width + fsTag * 1.6, th = fsTag * 2.0;
          c.fillStyle = 'rgba(15,23,42,.72)';
          roundRect(c, padX, padX, tw, th, th / 2); c.fill();
          c.fillStyle = '#fff'; c.textBaseline = 'middle'; c.textAlign = 'left';
          c.fillText(tag, padX + fsTag * 0.8, padX + th / 2 + 1);

          /* 하단 워터마크 바 */
          const y0 = h;
          const grd = c.createLinearGradient(0, y0, 0, y0 + barH);
          grd.addColorStop(0, 'rgba(17,32,64,.97)'); grd.addColorStop(1, 'rgba(9,18,38,.97)');
          c.fillStyle = grd; c.fillRect(0, y0, w, barH);
          c.fillStyle = '#3b82f6'; c.fillRect(0, y0, w, Math.max(4, Math.round(w * 0.0028)));

          const maxW = w - padX * 2;
          c.textAlign = 'left'; c.textBaseline = 'alphabetic';
          /* 1행: 학교 · 반 · 번호 · 이름 */
          c.fillStyle = '#ffffff'; c.font = '800 ' + fs1 + 'px ' + FONT;
          c.fillText(fitText(c, schoolName() + ' · ' + st.cls + '반 ' + st.num + '번 ' + st.name, maxW), padX, y0 + barH * 0.34);
          /* 2행: 일시 | 회로 분석 */
          c.fillStyle = 'rgba(255,255,255,.88)'; c.font = '700 ' + fs2 + 'px ' + FONT;
          c.fillText(fitText(c, t.text + '  |  ' + info2.summary, maxW), padX, y0 + barH * 0.63);
          /* 3행: 세부 부품 */
          c.fillStyle = 'rgba(147,197,253,.92)'; c.font = '600 ' + fs3 + 'px ' + FONT;
          c.fillText(fitText(c, '회로 세부: ' + info2.detail, maxW), padX, y0 + barH * 0.86);

          resolve(cvs.toDataURL('image/png'));
        } catch (err) { reject(err); }
      };
      img.onerror = reject;
      img.src = raw;
    });
  }

  function downloadImage(dataUrl, name) {
    const a = document.createElement('a');
    a.href = dataUrl; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => a.remove(), 400);
  }

  /* ---------- 제출 모달 ---------- */
  let shotData = '', lastInfo = null, lastStamp = null;
  function setStatus(kind, msg) { statusEl.className = 'svl-status' + (kind ? ' ' + kind : ''); statusEl.textContent = msg || ''; }

  function openSubmitModal() {
    subMask.classList.add('on');
    setStatus('', '');
    submitBtn.disabled = true; submitBtn.textContent = '🚀 제출하기';
  }
  function closeSubmitModal() { subMask.classList.remove('on'); }
  closeBtn.addEventListener('click', closeSubmitModal);

  capBtn.addEventListener('click', async function () {
    if (!hasStudent()) { openStudentModal(); toast('먼저 반·번호·이름을 입력해 주세요'); return; }
    shotData = ''; lastInfo = analyze(); lastStamp = stamp();
    shotImg.removeAttribute('src'); shotImg.style.display = 'none';
    loadingEl.textContent = '🖼 캡처 준비 중…'; loadingEl.style.display = 'flex';
    openSubmitModal();
    chips.innerHTML = '';
    [st.cls + '반', st.num + '번', st.name].forEach(function (v) {
      const s = document.createElement('span'); s.className = 'svl-chip'; s.textContent = v; chips.appendChild(s);
    });
    summaryBox.innerHTML = '<b>회로 분석</b><br>' + lastInfo.summary + '<br><span style="opacity:.72;font-weight:600">' + lastInfo.detail + '</span>';
    subSub.textContent = '캡처한 회로와 분석 결과를 확인한 뒤 제출하세요.';
    try {
      shotData = await composeShot(lastInfo);
      shotImg.src = shotData; shotImg.style.display = 'block'; loadingEl.style.display = 'none';
      submitBtn.disabled = false;
    } catch (err) {
      loadingEl.textContent = '⚠️ 캡처에 실패했습니다. 다시 시도해 주세요.';
      setStatus('err', '캡처 실패: ' + (err && err.message ? err.message : err));
    }
  });

  saveBtn.addEventListener('click', function () {
    if (!shotData) { setStatus('info', '아직 캡처가 준비되지 않았습니다.'); return; }
    downloadImage(shotData, fileName());
    setStatus('info', '💾 이미지가 저장되었습니다 — ' + fileName());
  });

  submitBtn.addEventListener('click', async function () {
    if (!shotData) return;
    const url = webhook();
    /* 제출 주소가 아직 없으면: 기기 저장 + 안내 (학교 와이파이 단절 대비) */
    if (!url) {
      downloadImage(shotData, fileName());
      subSub.textContent = '제출 주소가 아직 설정되지 않아 이미지로 저장했습니다.';
      setStatus('info', '✅ 제출용 회로 이미지가 저장되었습니다! 선생님께 이 파일을 보내 주세요.');
      return;
    }
    const payload = {
      timestamp: lastStamp.text + ':00',
      className: st.cls, studentNum: st.num, studentName: st.name,
      summary: lastInfo.summary, partsCount: lastInfo.count, partsDetail: lastInfo.detail,
      imageBase64: shotData, fileStamp: lastStamp.file, school: schoolName()
    };
    submitBtn.disabled = true; submitBtn.textContent = '📤 전송 중…'; setStatus('info', '선생님께 전송하고 있습니다…');
    try {
      const res = await fetch(url, { method: 'POST', body: JSON.stringify(payload) });
      let body = null; try { body = await res.json(); } catch (e) {}
      if (res.ok && (!body || body.ok !== false)) {
        submitBtn.textContent = '✅ 제출 완료';
        setStatus('ok', '✅ 제출 완료! (' + lastStamp.text + ')' + (body && body.url ? ' 이미지도 함께 저장되었습니다.' : ''));
        subSub.textContent = '선생님께 제출되었습니다. 필요하면 이미지를 한 번 더 저장해 두세요.';
      } else {
        throw new Error((body && body.error) || ('HTTP ' + res.status));
      }
    } catch (err) {
      submitBtn.disabled = false; submitBtn.textContent = '🔁 다시 제출하기';
      setStatus('err', '⚠️ 전송에 실패했습니다. [💾 이미지 저장]으로 이미지를 저장해 선생님께 보내 주세요.');
    }
  });

  cfgBtn.addEventListener('click', function () {
    const cur = webhook();
    const v = window.prompt('Apps Script 웹앱 URL을 붙여넣으세요 (예: https://script.google.com/macros/s/…/exec)', cur);
    if (v === null) return;
    writeLS(LS.hook, v.trim());
    toast(v.trim() ? '✅ 제출 주소가 저장되었습니다' : '제출 주소를 비웠습니다');
  });

  /* ---------- 시작 ---------- */
  renderBadge();
  if (!hasStudent()) openStudentModal();
})();
</script>
