  /* ---------- 시작 ---------- */
  renderBadge();
  if (!restoreSession()) openGate();
  if (TEACHER_MODE) setTimeout(openTeacher, 250);

  /* ---------- 회로 분석 ---------- */
  const numOf = t => parts.filter(p => p.type === t).length;
  function analyze() {
    const battN = numOf('batt'), bulbN = numOf('bulb'), wireN = numOf('wire'), resN = numOf('resist'),
          vN = numOf('vMeter'), iN = numOf('iMeter');
    const sws = parts.filter(p => p.type === 'sw');
    const swClosed = sws.filter(p => !p.open).length, swOpen = sws.length - swClosed;
    const bulbs = parts.filter(p => p.type === 'bulb');
    const litN = bulbs.filter(p => p.closed).length;
    const shortN = parts.filter(p => p.type === 'batt' && p.isShort).length;
    const vSum = parts.filter(p => p.type === 'batt').reduce((s, p) => s + (p.V || 0), 0);
    const flowing = parts.some(p => p.type !== 'batt' && Math.abs(p.I) > 1e-4);

    let summary;
    if (!parts.length) {
      summary = '회로가 비어 있음 (부품 0개)';
    } else {
      const bits = ['전지 ' + battN + '개', '전구 ' + bulbN + '개' + (bulbN ? '(점등 ' + litN + '개)' : '')];
      if (resN) bits.push('저항 ' + resN + '개');
      bits.push('도선 ' + wireN + '개');
      if (sws.length) bits.push('스위치 ' + sws.length + '개(닫힘 ' + swClosed + '·열림 ' + swOpen + ')');
      if (vN) bits.push('전압계 ' + vN + '개');
      if (iN) bits.push('전류계 ' + iN + '개');
      bits.push(shortN ? '⚠️ 단락 발생' : (battN ? (flowing ? '전류 흐름 있음' : '전류 흐름 없음') : '전지 없음'));
      summary = bits.join(' · ');
    }
    const rList = arr => { const s = arr.map(p => Math.round(p.R)); return s.length ? (new Set(s).size === 1 ? s[0] : s.join('/')) + 'Ω' : '-'; };
    let detail = [
      '전지×' + battN + (battN ? '(' + vSum.toFixed(1) + 'V)' : ''),
      '전구×' + bulbN + (bulbN ? '(' + rList(bulbs) + ')' : ''),
      '저항×' + resN + (resN ? '(' + rList(parts.filter(p => p.type === 'resist')) + ')' : ''),
      '도선×' + wireN,
      '스위치×' + sws.length + (sws.length ? '(닫힘 ' + swClosed + '/열림 ' + swOpen + ')' : ''),
      '전압계×' + vN,
      '전류계×' + iN
    ].join(', ');
    const detailRaw = detail;
    const repLine = repSummaryLine();
    if (repLine) { summary += ' | ' + repLine; detail += ' | ' + repLine; }
    return { summary: summary, detail: detail, detailRaw: detailRaw, count: parts.length };
  }

  /* ---------- 시각 ---------- */
  function stamp() {
    const d = new Date(), p = n => String(n).padStart(2, '0');
    const date = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
    const time = p(d.getHours()) + ':' + p(d.getMinutes());
    return { text: date + ' ' + time, file: date.replace(/-/g, '') + '_' + p(d.getHours()) + p(d.getMinutes()) };
  }
  function fileName() {
    return (st.grade ? gradeTxt(st.grade) + '_' : '') + st.cls + '반_' + st.num + '번_' + st.name + '_전기회로.png';
  }
  function roundRect(c, x, y, w, h, r) {
    c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }
  function fitText(c, text, maxW) {
    if (c.measureText(text).width <= maxW) return text;
    let t = text;
    while (t.length > 1 && c.measureText(t + '…').width > maxW) t = t.slice(0, -1);
    return t + '…';
  }

  /* ==================================================================
     📝 탐구 기록장 — 측정 데이터 · V–I 그래프 · 결론 (우측 접이식 드로어)
     ================================================================== */
  const RFONT = "'SeoulNamsan',-apple-system,'Noto Sans KR',sans-serif";
  const REP_KEY = 'svl_circuit_report_v1', REP_MAX = 20;
  const repState = { rows: [], conclusion: '', owner: '' };
  let repOpen = false, repSaveTimer = null;

  /* ---------- 숫자 · 단위 표기 ---------- */
  function repNf(x, d) {
    if (typeof x !== 'number' || !isFinite(x)) return '—';
    if (Math.abs(x) >= 10000) return String(Math.round(x));
    let s = x.toFixed(d == null ? 2 : d);
    if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    return s === '-0' ? '0' : s;
  }
  function repVTxt(v) { return repNf(v, 2) + ' V'; }
  function repRTxt(r) { return repNf(r, 1) + ' Ω'; }
  function repITxt(i) {
    const a = Math.abs(i);
    if (a < 5e-5) return '0 mA';
    if (a < 0.9995) return repNf(i * 1000, 1) + ' mA';
    return repNf(i, 3) + ' A';
  }
  function repIShort(i) {
    const a = Math.abs(i);
    if (a < 5e-5) return '0A';
    if (a < 0.9995) return repNf(i * 1000, 1) + 'mA';
    return repNf(i, 3) + 'A';
  }

  /* ---------- 저장 · 복원 ---------- */
  function repLoad() {
    try {
      const raw = localStorage.getItem(REP_KEY);
      if (!raw) return;
      const o = JSON.parse(raw);
      if (!o || typeof o !== 'object') return;
      repState.rows = (Array.isArray(o.rows) ? o.rows : []).filter(function (r) {
        return r && isFinite(r.v) && isFinite(r.r) && isFinite(r.i);
      }).slice(0, REP_MAX).map(function (r) { return { v: +r.v, r: +r.r, i: +r.i }; });
      repState.conclusion = typeof o.conclusion === 'string' ? o.conclusion.slice(0, 600) : '';
      repState.owner = typeof o.owner === 'string' ? o.owner : '';
    } catch (e) {}
  }
  function repSave() {
    try {
      localStorage.setItem(REP_KEY, JSON.stringify({ rows: repState.rows, conclusion: repState.conclusion, owner: repState.owner }));
    } catch (e) {}
  }
  function repSaveSoon() { clearTimeout(repSaveTimer); repSaveTimer = setTimeout(repSave, 400); }
  function repOwnerId() { return (st.cls || '') + '|' + (st.num || '') + '|' + (st.name || ''); }
  function repSyncOwner(id) {
    if (!id) return;
    if (repState.owner && repState.owner !== id && (repState.rows.length || repState.conclusion)) {
      repState.rows = []; repState.conclusion = '';
      const ta = el('svlRbConclusion'); if (ta) ta.value = '';
    }
    repState.owner = id; repSave();
  }

  /* ---------- 현재 회로 측정값 ---------- */
  function repMeasure() {
    const bats = parts.filter(function (p) { return p.type === 'batt'; });
    /* 전류계가 연결되어 있으면 계측기 눈금값을 그대로 쓴다 (단락 표시와 무관하게 실제 계산값) */
    const iMeters = parts.filter(function (p) { return p.type === 'iMeter' && Math.abs(p.I || 0) > 1e-4; });
    let I = 0;
    if (iMeters.length) {
      iMeters.forEach(function (p) { const a = Math.abs(p.I); if (a > I) I = a; });
    } else {
      bats.forEach(function (p) { const a = Math.abs(p.I || 0); if (a > I) I = a; });
    }
    /* 전압계가 연결되어 있으면 계측기 눈금값, 없으면 전지의 단자전압(p.dv) 합 */
    let V = 0;
    parts.filter(function (p) { return p.type === 'vMeter' && Math.abs(p.dv || 0) > 1e-4; })
      .forEach(function (p) { const a = Math.abs(p.dv); if (a > V) V = a; });
    if (!(V > 1e-3)) {
      V = bats.reduce(function (s, p) { return s + Math.abs(p.dv || 0); }, 0);
    }
    const extR = parts.filter(function (p) { return p.type === 'resist' || p.type === 'bulb'; })
      .reduce(function (s, p) { return s + (p.R || 0); }, 0);
    const flowing = I > 1e-4;
    return {
      V: V, I: I, R: (flowing && V > 1e-4) ? V / I : extR,
      flowing: flowing, bats: bats.length,
      short: bats.some(function (p) { return p.isShort; })
    };
  }

  /* 저장용 반올림: 전압·전류는 1 mV / 1 mA 단위로 정돈해
     도선 기생저항이 만드는 1.4995000 A 같은 꼬리를 남기지 않는다.
     0.01 A 미만의 극소 전류(예: 1.5V / 1000Ω = 0.0015 A)는
     3자리로 자르면 0.002 A가 되어 버리므로 유효숫자 4자리로 남긴다. */
  function repRound(x, tiny) {
    if (typeof x !== 'number' || !isFinite(x)) return 0;
    const a = Math.abs(x);
    if (a === 0) return 0;
    if (tiny && a < 0.01) return Number(x.toPrecision(4));
    return Math.round(x * 1000) / 1000;
  }
  function repAdd() {
    const m = repMeasure();
    if (!m.bats) { toast('🔋 회로에 전지를 먼저 연결해 주세요'); return; }
    if (!m.flowing) { toast('⚡ 전류가 흐르지 않아요 — 스위치와 도선 연결을 확인하세요'); return; }
    if (repState.rows.length >= REP_MAX) { toast('기록은 최대 ' + REP_MAX + '회까지 저장됩니다'); return; }
    repState.rows.push({
      v: repRound(m.V),
      r: Math.round(m.R * 100) / 100,
      i: repRound(m.I, true)
    });
    repSave(); repRender(); repLive();
    toast('📝 ' + repState.rows.length + '회차 측정값을 기록했습니다');
  }

  /* ---------- V–I 그래프 ---------- */
  function repSlope() {
    const rows = repState.rows;
    if (rows.length < 2) return 0;
    let svv = 0, svi = 0;
    rows.forEach(function (r) { svv += r.v * r.v; svi += r.v * r.i; });
    if (!(svv > 0) || !(Math.abs(svi) > 1e-12)) return 0;
    const k = svi / svv;
    return k > 0 ? k : 0;
  }
  function repNiceCeil(v) {
    if (!(v > 0)) return 0;
    const e = Math.pow(10, Math.floor(Math.log(v) / Math.LN10));
    const n = v / e;
    const steps = [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
    for (let i = 0; i < steps.length; i++) if (n <= steps[i] + 1e-9) return steps[i] * e;
    return 10 * e;
  }
  function repWrapText(c, text, maxW, maxLines) {
    const lines = [];
    let truncated = false;
    const paras = String(text).replace(/\r/g, '').split('\n');
    for (let pi = 0; pi < paras.length; pi++) {
      const para = paras[pi];
      if (!para.trim()) { if (lines.length) lines.push(''); continue; }
      let line = '';
      for (let i = 0; i < para.length; i++) {
        const ch = para[i];
        if (c.measureText(line + ch).width <= maxW) { line += ch; continue; }
        const sp = line.lastIndexOf(' ');
        if (sp > 0) { lines.push(line.slice(0, sp)); line = line.slice(sp + 1) + ch; }
        else { if (line) lines.push(line); line = ch; }
        if (lines.length >= maxLines) { truncated = true; break; }
      }
      if (truncated) break;
      if (line) lines.push(line);
      if (lines.length >= maxLines) { if (pi < paras.length - 1) truncated = true; break; }
    }
    if (lines.length > maxLines) { lines.length = maxLines; truncated = true; }
    if (truncated && lines.length) {
      let last = lines[lines.length - 1];
      while (last.length > 1 && c.measureText(last + '…').width > maxW) last = last.slice(0, -1);
      lines[lines.length - 1] = last + '…';
    }
    return lines;
  }
  /* 전압(X)–전류(Y) 그래프: 데이터 점 + 원점을 지나는 비례 추세선 */
  function drawVIRChart(c, x0, y0, cw, ch, rows, dark, fs) {
    const fsz = Math.max(8, fs || 11);
    const ink = dark ? '#cbd5e1' : '#334155';
    const ink2 = dark ? '#94a3b8' : '#64748b';
    const gridC = dark ? 'rgba(148,163,184,.20)' : 'rgba(15,23,42,.09)';
    const axisC = dark ? 'rgba(148,163,184,.55)' : 'rgba(15,23,42,.38)';
    const ptC = dark ? '#60a5fa' : '#2563eb';
    const fitC = dark ? '#5eead4' : '#0f766e';

    let maxV = 0, maxI = 0;
    rows.forEach(function (r) {
      if (r.v > maxV) maxV = r.v;
      const a = Math.abs(r.i); if (a > maxI) maxI = a;
    });
    const unit = maxI >= 0.9995 ? 'A' : 'mA', sc = unit === 'A' ? 1 : 1000;
    const xMax = repNiceCeil(maxV * 1.06) || 1;
    const yMax = repNiceCeil(maxI * sc * 1.08) || (unit === 'A' ? 1 : 100);

    const padL = Math.min(Math.round(fsz * 3.0), Math.round(cw * 0.13));
    const padR = Math.min(Math.round(fsz * 1.2), Math.round(cw * 0.05));
    const padT = Math.min(Math.round(fsz * 2.6), Math.round(ch * 0.17));
    const padB = Math.min(Math.round(fsz * 2.5), Math.round(ch * 0.2));
    const pw = Math.max(18, cw - padL - padR), ph = Math.max(18, ch - padT - padB);
    const X = x0 + padL, Y = y0 + ch - padB;

    c.save();
    c.font = '700 ' + fsz + 'px ' + RFONT;
    for (let i = 0; i <= 2; i++) {
      const yy = Y - ph * i / 2;
      c.strokeStyle = gridC; c.lineWidth = 1;
      c.beginPath(); c.moveTo(X, yy); c.lineTo(X + pw, yy); c.stroke();
      c.fillStyle = ink2; c.textAlign = 'right'; c.textBaseline = 'middle';
      c.fillText(repNf(yMax * i / 2, 2), X - Math.round(fsz * 0.45), yy);
    }
    for (let i = 0; i <= 2; i++) {
      const xx = X + pw * i / 2;
      c.strokeStyle = gridC; c.lineWidth = 1;
      c.beginPath(); c.moveTo(xx, Y); c.lineTo(xx, Y - ph); c.stroke();
      c.fillStyle = ink2; c.textAlign = 'center'; c.textBaseline = 'top';
      c.fillText(repNf(xMax * i / 2, 2), xx, Y + Math.round(fsz * 0.4));
    }
    c.strokeStyle = axisC; c.lineWidth = 1;
    c.beginPath(); c.moveTo(X, Y - ph); c.lineTo(X, Y); c.lineTo(X + pw, Y); c.stroke();

    c.fillStyle = ink; c.textAlign = 'center'; c.textBaseline = 'top';
    c.fillText('전압 (V)', X + pw / 2, Y + Math.round(fsz * 1.6));
    c.textAlign = 'right'; c.textBaseline = 'bottom';
    c.fillText('전류 (' + unit + ')', X + pw, y0 + Math.round(fsz * 1.05));

    if (rows.length >= 2) {
      let svv = 0, svi = 0;
      rows.forEach(function (r) { svv += r.v * r.v; svi += r.v * r.i; });
      const k = svv > 0 ? svi / svv : 0;
      if (k > 0) {
        let xEnd = xMax, yEnd = k * xMax * sc;
        if (yEnd > yMax) { xEnd = yMax / (k * sc); yEnd = yMax; }
        if (xEnd > 0) {
          c.strokeStyle = fitC; c.lineWidth = Math.max(1.4, fsz * 0.17);
          if (c.setLineDash) c.setLineDash([Math.max(3, Math.round(fsz * 0.7)), Math.max(2, Math.round(fsz * 0.5))]);
          c.beginPath(); c.moveTo(X, Y); c.lineTo(X + pw * (xEnd / xMax), Y - ph * (yEnd / yMax)); c.stroke();
          if (c.setLineDash) c.setLineDash([]);
        }
      }
    } else {
      c.fillStyle = ink2; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.font = '700 ' + Math.round(fsz * 0.95) + 'px ' + RFONT;
      c.fillText('측정 2회 이상이면 추세선이 그려집니다', X + pw / 2, Y - ph / 2);
    }

    rows.forEach(function (r) {
      const px = X + pw * (Math.min(r.v, xMax) / xMax);
      const py = Y - ph * (Math.min(Math.abs(r.i) * sc, yMax) / yMax);
      c.beginPath(); c.arc(px, py, Math.max(2.2, fsz * 0.30), 0, Math.PI * 2);
      c.fillStyle = ptC; c.fill();
      c.lineWidth = Math.max(1, fsz * 0.13);
      c.strokeStyle = dark ? '#111827' : '#ffffff'; c.stroke();
    });
    c.restore();
  }

  /* ---------- 드로어 화면 ---------- */
  function repChart() {
    const cv = el('svlRbChart');
    if (!cv) return;
    const rect = cv.getBoundingClientRect();
    const W = Math.max(140, Math.round(rect.width || 320));
    const H = Math.max(70, Math.round(rect.height || 132));
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) {
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, H);
    drawVIRChart(c, 0, 0, W, H, repState.rows, isDark, Math.max(8, Math.round(W * 0.028)));
    repFit();
  }
  function repFit() {
    const box = el('svlRbFit');
    if (!box) return;
    const rows = repState.rows;
    if (rows.length < 2) { box.textContent = rows.length === 1 ? '측정을 2회 이상 기록하면 추세선이 나타납니다' : ''; return; }
    const k = repSlope();
    if (!k) { box.textContent = '추세선을 그릴 수 없습니다 (전압이 모두 같은지 확인하세요)'; return; }
    let prop = true;
    rows.forEach(function (r) {
      if (Math.abs(r.i - k * r.v) > Math.abs(r.i) * 0.08 + 1e-4) prop = false;
    });
    box.textContent = '기울기 ≈ ' + repNf(k, 4) + ' A/V · 합성 저항 ≈ ' + repNf(1 / k, 1) + ' Ω' + (prop ? ' · 전류 ∝ 전압' : '');
  }
  function repCell(val, step, onChange, getVal) {
    const td = document.createElement('td');
    const inp = document.createElement('input');
    inp.type = 'number'; inp.step = step; inp.min = '0'; inp.inputMode = 'decimal';
    inp.value = repNf(val, 3);
    inp.addEventListener('input', function () {
      const v = parseFloat(inp.value);
      if (isFinite(v)) onChange(v);
    });
    /* 빈 칸으로 두고 나가면 마지막 정상값으로 되돌린다 */
    inp.addEventListener('blur', function () {
      if (!isFinite(parseFloat(inp.value))) inp.value = repNf(getVal ? getVal() : val, 3);
    });
    td.appendChild(inp);
    return td;
  }
  function repRender() {
    const tb = el('svlRbTbody');
    if (!tb) return;
    tb.innerHTML = '';
    repState.rows.forEach(function (r, i) {
      const tr = document.createElement('tr');
      const td0 = document.createElement('td'); td0.textContent = String(i + 1); tr.appendChild(td0);
      tr.appendChild(repCell(r.v, '0.1', function (v) { r.v = Math.max(0, v); repSaveSoon(); repChart(); },
        function () { return r.v; }));
      tr.appendChild(repCell(r.r, '1', function (v) { r.r = Math.max(0, v); repSaveSoon(); repChart(); },
        function () { return r.r; }));
      const tdi = document.createElement('td');
      const inp = document.createElement('input');
      inp.type = 'number'; inp.step = '0.001'; inp.min = '0'; inp.inputMode = 'decimal';
      inp.value = repNf(r.i, 4);
      const u = document.createElement('span');
      u.className = 'svl-rb-iu';
      u.textContent = repNf(r.i * 1000, 1) + ' mA';
      inp.addEventListener('input', function () {
        const v = parseFloat(inp.value);
        if (isFinite(v)) {
          r.i = Math.max(0, v);
          u.textContent = repNf(r.i * 1000, 1) + ' mA';
          repSaveSoon(); repChart();
        }
      });
      inp.addEventListener('blur', function () {
        if (!isFinite(parseFloat(inp.value))) { inp.value = repNf(r.i, 4); u.textContent = repNf(r.i * 1000, 1) + ' mA'; }
      });
      tdi.appendChild(inp); tdi.appendChild(u); tr.appendChild(tdi);
      const tdd = document.createElement('td');
      const del = document.createElement('button');
      del.type = 'button'; del.className = 'svl-rb-del'; del.textContent = '✕';
      del.setAttribute('aria-label', (i + 1) + '회차 측정값 삭제');
      del.addEventListener('click', function () {
        repState.rows.splice(i, 1);
        repSave(); repRender(); repLive();
      });
      tdd.appendChild(del); tr.appendChild(tdd);
      tb.appendChild(tr);
    });
    const empty = el('svlRbEmpty');
    if (empty) empty.style.display = repState.rows.length ? 'none' : 'block';
    const cnt = el('svlRbCount');
    if (cnt) cnt.textContent = repState.rows.length + '회';
    repChart();
  }
  function repLive() {
    const m = repMeasure();
    const ev = el('svlRbV'), er = el('svlRbR'), ei = el('svlRbI'), fl = el('svlRbFlow'), add = el('svlRbAdd');
    if (ev) ev.textContent = repVTxt(m.V);
    if (er) er.textContent = repRTxt(m.R);
    if (ei) ei.textContent = repITxt(m.I);
    if (fl) {
      fl.className = 'svl-rb-flow' + (m.short ? ' warn' : (m.flowing ? ' on' : ''));
      fl.textContent = m.short ? '⚠️ 단락 · ' + (m.flowing ? '전류 흐름' : '전류 없음') : (m.flowing ? '⚡ 전류 흐름' : '전류 없음');
    }
    if (add) add.disabled = !(m.flowing && m.bats > 0);
  }
  function repTaCount() {
    const ta = el('svlRbConclusion'), cnt = el('svlRbTaCount');
    if (cnt) cnt.textContent = (ta ? ta.value.length : 0) + ' / 600';
  }
  function repSetOpen(on) {
    repOpen = !!on;
    const d = el('svlReportDrawer'), bd = el('svlReportBackdrop'), btn = el('svlReportBtn');
    if (d) { d.classList.toggle('on', repOpen); d.setAttribute('aria-hidden', repOpen ? 'false' : 'true'); }
    if (bd) bd.classList.toggle('on', repOpen);
    if (btn) {
      btn.classList.toggle('active', repOpen);
      btn.setAttribute('aria-expanded', repOpen ? 'true' : 'false');
      btn.innerHTML = repOpen ? '<span>✕</span><span>기록장 닫기</span>' : '<span>📝</span><span>탐구 기록장</span>';
    }
    if (repOpen) { repRender(); repLive(); repTaCount(); }
  }

  /* ---------- 제출 · 저장용 요약 문장 ---------- */
  function repSummaryLine() {
    const rows = repState.rows || [];
    const concl = (repState.conclusion || '').replace(/\s+/g, ' ').trim();
    if (!rows.length && !concl) return '';
    const out = [];
    if (rows.length) {
      let s = rows.map(function (r) { return repNf(r.v, 2) + 'V/' + repIShort(r.i); }).join(', ');
      if (s.length > 240) s = rows.slice(0, 8).map(function (r) { return repNf(r.v, 2) + 'V/' + repIShort(r.i); }).join(', ') + ' …';
      out.push('V-I ' + rows.length + '회 측정 완료 (' + s + ')');
    }
    if (concl) out.push('결론: ' + (concl.length > 240 ? concl.slice(0, 240) + '…' : concl));
    return out.join(' | ');
  }

  /* ---------- 드로어 초기화 ---------- */
  (function repInit() {
    repLoad();
    if (hasStudent()) repSyncOwner(repOwnerId());
    const ta = el('svlRbConclusion');
    if (ta) {
      ta.value = repState.conclusion || '';
      ta.addEventListener('input', function () {
        repState.conclusion = ta.value.slice(0, 600);
        repTaCount(); repSaveSoon();
      });
    }
    const btn = el('svlReportBtn'), d = el('svlReportDrawer'), close = el('svlReportClose'), bd = el('svlReportBackdrop');
    if (btn) btn.addEventListener('click', function () { repSetOpen(!repOpen); });
    if (close) close.addEventListener('click', function () { repSetOpen(false); });
    if (bd) bd.addEventListener('click', function () { repSetOpen(false); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && repOpen) repSetOpen(false); });
    const add = el('svlRbAdd');
    if (add) add.addEventListener('click', repAdd);
    const addRow = el('svlRbAddRow');
    if (addRow) addRow.addEventListener('click', function () {
      if (repState.rows.length >= REP_MAX) { toast('기록은 최대 ' + REP_MAX + '회까지 저장됩니다'); return; }
      repState.rows.push({ v: 0, r: 0, i: 0 });
      repSave(); repRender();
      const tb = el('svlRbTbody');
      const lastRow = tb && tb.lastElementChild;
      const firstInp = lastRow && lastRow.querySelector('input');
      if (firstInp) { try { firstInp.focus(); firstInp.select(); } catch (e) {} }
    });
    const clr = el('svlRbClear');
    if (clr) clr.addEventListener('click', function () {
      if (!repState.rows.length && !repState.conclusion) return;
      quiet(6000);
      if (!window.confirm('기록한 측정값과 결론을 모두 지울까요?')) return;
      repState.rows = []; repState.conclusion = '';
      if (ta) ta.value = '';
      repSave(); repRender(); repLive(); repTaCount();
      toast('기록을 비웠습니다');
    });
    Array.prototype.forEach.call(document.querySelectorAll('.svl-rb-tpl button'), function (b) {
      b.addEventListener('click', function () {
        if (!ta) return;
        const t = b.getAttribute('data-tpl') === 'R'
          ? '전압이 일정할 때 저항이 2배, 3배가 되면 전류는 1/2, 1/3로 감소한다. → 전류는 저항에 반비례한다 (I = V/R)'
          : '전압이 2배, 3배가 되면 전류도 2배, 3배로 비례하여 증가한다. → 전류는 전압에 비례한다 (옴의 법칙 V = IR)';
        ta.value = (ta.value.trim() ? ta.value.trim() + ' ' : '') + t;
        ta.value = ta.value.slice(0, 600);
        repState.conclusion = ta.value;
        repTaCount(); repSave();
      });
    });
    const shot = el('svlRbShot');
    if (shot) shot.addEventListener('click', function () { repSetOpen(false); capBtn.click(); });
    window.addEventListener('resize', function () { if (repOpen) repChart(); });
    setInterval(function () { if (repOpen) repLive(); }, 320);
    repRender(); repTaCount();
    if (d) d.setAttribute('aria-hidden', 'true');
  })();

  /* ---------- 수행평가 리포트: 표 · 그래프 패널 ---------- */
  function drawRepTable(c, x0, y0, tw, th, rows, dark, o) {
    const thS = o.thS, tbS = o.tbS, rowH = o.rowH;
    const ink = dark ? '#e5edf9' : '#0f172a';
    const ink2 = dark ? '#a8b6cb' : '#475569';
    const gridC = dark ? 'rgba(148,163,184,.30)' : 'rgba(15,23,42,.16)';
    const headBg = dark ? 'rgba(96,165,250,.18)' : 'rgba(37,99,235,.10)';
    const altBg = dark ? 'rgba(255,255,255,.035)' : 'rgba(15,23,42,.022)';
    const rr = Math.round(rowH * 0.35);
    const frac = [0.15, 0.28, 0.28, 0.29];
    const xs = [x0];
    frac.forEach(function (f) { xs.push(xs[xs.length - 1] + tw * f); });

    const shown = Math.min(rows.length, 6);
    const bodyRows = rows.length ? shown : 1;
    const gridRows = 1 + bodyRows + (rows.length > shown ? 1 : 0);
    const boxH = gridRows * rowH;
    const ty = y0 + Math.max(0, Math.round((th - boxH) / 2));

    c.save();
    roundRect(c, x0, ty, tw, boxH, rr);
    c.fillStyle = dark ? 'rgba(255,255,255,.03)' : '#ffffff'; c.fill();
    c.restore();
    c.save();
    roundRect(c, x0, ty, tw, boxH, rr); c.clip();
    c.fillStyle = headBg; c.fillRect(x0, ty, tw, rowH);
    c.font = '800 ' + thS + 'px ' + RFONT;
    c.fillStyle = ink2; c.textAlign = 'center'; c.textBaseline = 'middle';
    const heads = ['회차', '전압 (V)', '저항 (Ω)', '전류'];
    for (let i = 0; i < 4; i++) c.fillText(heads[i], (xs[i] + xs[i + 1]) / 2, ty + rowH / 2);

    for (let i = 0; i < shown; i++) {
      const yy = ty + rowH * (i + 1);
      if (i % 2 === 1) { c.fillStyle = altBg; c.fillRect(x0, yy, tw, rowH); }
      const r = rows[i];
      const vals = [String(i + 1), repNf(r.v, 2), repNf(r.r, 1), repITxt(r.i)];
      for (let ci = 0; ci < 4; ci++) {
        c.fillStyle = ci === 0 ? ink2 : ink;
        c.font = (ci === 0 ? '800 ' : '700 ') + tbS + 'px ' + RFONT;
        c.fillText(vals[ci], (xs[ci] + xs[ci + 1]) / 2, yy + rowH / 2);
      }
    }
    if (!rows.length) {
      c.fillStyle = ink2; c.font = '700 ' + tbS + 'px ' + RFONT;
      c.fillText('측정 기록 없음', x0 + tw / 2, ty + rowH * 1.5);
    }
    if (rows.length > shown) {
      c.fillStyle = ink2; c.font = '700 ' + Math.round(tbS * 0.92) + 'px ' + RFONT;
      c.fillText('… 외 ' + (rows.length - shown) + '회', x0 + tw / 2, ty + rowH * (shown + 1.5));
    }
    c.strokeStyle = gridC; c.lineWidth = 1;
    c.beginPath();
    for (let i = 1; i < 4; i++) { c.moveTo(xs[i], ty); c.lineTo(xs[i], ty + boxH); }
    for (let i = 0; i <= gridRows; i++) { c.moveTo(x0, ty + rowH * i); c.lineTo(x0 + tw, ty + rowH * i); }
    c.stroke();
    c.restore();
    c.save();
    roundRect(c, x0, ty, tw, boxH, rr);
    c.strokeStyle = gridC; c.lineWidth = 1; c.stroke();
    c.restore();
  }
  function drawRepChartPanel(c, x0, y0, cw, ch, rows, dark, o) {
    const fs = o.fs;
    const rr = Math.round(fs * 1.1);
    const capH = Math.round(fs * 2.4);
    c.save();
    roundRect(c, x0, y0, cw, ch, rr);
    c.fillStyle = dark ? 'rgba(255,255,255,.03)' : '#ffffff'; c.fill();
    c.strokeStyle = dark ? 'rgba(148,163,184,.30)' : 'rgba(15,23,42,.16)';
    c.lineWidth = 1; c.stroke();
    c.restore();
    const pad = Math.round(fs * 0.9);
    drawVIRChart(c, x0 + pad, y0 + pad, cw - pad * 2, ch - pad * 2 - capH, rows, dark, fs);
    const k = repSlope();
    let cap = '';
    if (k) cap = '추세선 기울기 ≈ ' + repNf(k, 4) + ' A/V  ·  합성 저항 ≈ ' + repNf(1 / k, 1) + ' Ω';
    else if (rows.length < 2) cap = '측정을 2회 이상 기록하면 추세선이 그려집니다';
    if (cap) {
      c.save();
      c.font = '800 ' + Math.round(fs * 0.95) + 'px ' + RFONT;
      c.fillStyle = k ? (dark ? '#5eead4' : '#0f766e') : (dark ? '#94a3b8' : '#64748b');
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(cap, x0 + cw / 2, y0 + ch - capH / 2 - pad * 0.2);
      c.restore();
    }
  }

  /* 3D 화면 캡처 → [탐구 기록 카드: 측정 표 · V-I 그래프 · 결론] + 하단 공식 워터마크 바 합성 */
  function composeShot(info) {
    renderer.render(scene, camera);
    const raw = renderer.domElement.toDataURL('image/png');
    return new Promise(function (resolve, reject) {
      const img = new Image();
      img.onload = function () {
        try {
          const FONT = RFONT;
          const MAXW = 1500;
          const k = Math.min(1, MAXW / img.width);
          const w = Math.max(380, Math.round(img.width * k)), h = Math.round(img.height * k);
          const fs1 = Math.max(18, Math.round(w * 0.0210));
          const fs2 = Math.max(13, Math.round(w * 0.0146));
          const fs3 = Math.max(12, Math.round(w * 0.0132));
          const padX = Math.round(w * 0.026);
          const barH = Math.round(fs1 * 1.45 + fs2 * 1.5 + fs3 * 1.5 + w * 0.038);
          const t = stamp(), info2 = info || analyze();
          const dark = !!isDark;
          const rows = repState.rows.slice(0, REP_MAX);
          const concl = (repState.conclusion || '').trim();
          const hasRep = rows.length > 0 || concl.length > 0;

          /* ---- 리포트 영역 치수 ---- */
          const meas = document.createElement('canvas').getContext('2d');
          const innerW = w - padX * 2;
          const headS = Math.max(14, Math.round(w * 0.0172));
          const subS = Math.max(10, Math.round(w * 0.0118));
          const thS = Math.max(10, Math.round(w * 0.0116));
          const tbS = Math.max(11, Math.round(w * 0.0126));
          const coS = Math.max(12, Math.round(w * 0.0142));
          const rowH = Math.max(20, Math.round(w * 0.0272));
          const gapS = Math.max(12, Math.round(w * 0.0178));
          const repPadY = Math.round(w * 0.026);
          const shownRows = Math.min(rows.length, 6);
          const noteRow = rows.length > 6 ? 1 : 0;
          const tableH = (1 + Math.max(2, shownRows) + noteRow) * rowH;
          const blockH = Math.max(tableH, Math.round(rowH * 5.0));
          meas.font = '600 ' + coS + 'px ' + FONT;
          const coLines = concl ? repWrapText(meas, concl, innerW - Math.round(w * 0.040), 6) : [];
          const coLineH = Math.round(coS * 1.62);
          const coBoxH = Math.max(coLineH, coLines.length * coLineH) + Math.round(coS * 0.8);
          const coBlockH = Math.round(coS * 1.9) + coBoxH + Math.round(coS * 0.3);
          const repH = repPadY + Math.round(headS * 1.9) + gapS + blockH + gapS + coBlockH + repPadY;

          const cvs = document.createElement('canvas');
          cvs.width = w; cvs.height = h + (hasRep ? repH : 0) + barH;
          const c = cvs.getContext('2d');
          c.fillStyle = dark ? '#1c1c1e' : '#f4f7f6';
          c.fillRect(0, 0, w, cvs.height);
          c.drawImage(img, 0, 0, w, h);

          /* 캡처 본에도 학번·시각 대각선 워터마크 각인 (유출 시 출처 노출) */
          c.save();
          c.globalAlpha = dark ? 0.10 : 0.085;
          c.fillStyle = dark ? '#ffffff' : '#0f172a';
          c.font = '800 ' + Math.max(13, Math.round(w * 0.016)) + 'px ' + FONT;
          c.textAlign = 'center'; c.textBaseline = 'middle';
          const wmTxt = ((session && session.teacherPreview) ? '교사 미리보기'
            : [gradeTxt(st.grade), st.cls + '반', st.num + '번', st.name].filter(Boolean).join(' ')) + ' · ' + t.text;
          for (let wi = -2; wi < 6; wi++) {
            for (let wj = 0; wj < 3; wj++) {
              c.save();
              c.translate(w * (0.18 + wj * 0.32), h * (0.12 + wi * 0.18));
              c.rotate(-0.42);
              c.fillText(wmTxt, 0, 0);
              c.restore();
            }
          }
          c.restore();
          c.textAlign = 'left'; c.textBaseline = 'alphabetic';

          /* 이미지 좌상단 워터마크 pill */
          const tag = '⚡ Science Virtual LAB · 전기 회로 수행평가';
          const fsTag = Math.max(11, Math.round(w * 0.0125));
          c.font = '800 ' + fsTag + 'px ' + FONT;
          const tw2 = c.measureText(tag).width + fsTag * 1.6, th2 = fsTag * 2.0;
          c.fillStyle = 'rgba(15,23,42,.72)';
          roundRect(c, padX, padX, tw2, th2, th2 / 2); c.fill();
          c.fillStyle = '#fff'; c.textBaseline = 'middle'; c.textAlign = 'left';
          c.fillText(tag, padX + fsTag * 0.8, padX + th2 / 2 + 1);

          /* ---- 📝 탐구 기록 카드 ---- */
          if (hasRep) {
            c.fillStyle = dark ? '#141821' : '#ffffff';
            c.fillRect(0, h, w, repH);
            c.fillStyle = '#2563eb';
            c.fillRect(0, h, w, Math.max(3, Math.round(w * 0.0026)));
            let y = h + repPadY;
            c.textAlign = 'left'; c.textBaseline = 'alphabetic';
            c.fillStyle = '#2563eb';
            roundRect(c, padX, y + Math.round(headS * 0.08), Math.max(3, Math.round(headS * 0.17)),
              Math.round(headS * 0.95), Math.max(2, Math.round(headS * 0.08)));
            c.fill();
            c.font = '800 ' + headS + 'px ' + FONT;
            c.fillStyle = dark ? '#f1f5f9' : '#0b1220';
            const ttl = '탐구 기록장';
            c.fillText(ttl, padX + Math.round(headS * 0.45), y + headS);
            const ttlW = c.measureText(ttl).width;
            c.font = '700 ' + subS + 'px ' + FONT;
            c.fillStyle = dark ? '#93c5fd' : '#1d4ed8';
            c.fillText('측정 ' + rows.length + '회 · 전압–전류 관계 · 탐구 결론',
              padX + Math.round(headS * 0.45) + ttlW + Math.round(headS * 0.5), y + headS);
            y += Math.round(headS * 1.9);

            const colGap = Math.round(w * 0.026);
            const tableW = Math.round((innerW - colGap) * 0.47);
            const chartW = innerW - colGap - tableW;
            drawRepTable(c, padX, y, tableW, blockH, rows, dark, { thS: thS, tbS: tbS, rowH: rowH });
            drawRepChartPanel(c, padX + tableW + colGap, y, chartW, blockH, rows, dark,
              { fs: Math.max(10, Math.round(w * 0.0118)) });
            y += blockH + gapS;

            c.textAlign = 'left'; c.textBaseline = 'alphabetic';
            c.font = '800 ' + Math.round(coS * 0.94) + 'px ' + FONT;
            c.fillStyle = dark ? '#93c5fd' : '#1d4ed8';
            c.fillText('탐구 결론', padX, y + Math.round(coS * 0.95));
            const boxY = y + Math.round(coS * 1.45);
            c.fillStyle = dark ? 'rgba(96,165,250,.10)' : 'rgba(37,99,235,.055)';
            roundRect(c, padX, boxY, innerW, coBoxH, Math.round(coS * 0.55)); c.fill();
            c.fillStyle = dark ? '#60a5fa' : '#2563eb';
            c.fillRect(padX, boxY + Math.round(coS * 0.4), Math.max(3, Math.round(w * 0.0022)),
              coBoxH - Math.round(coS * 0.8));
            c.textAlign = 'left'; c.textBaseline = 'middle';
            if (!coLines.length) {
              c.font = '600 ' + coS + 'px ' + FONT;
              c.fillStyle = dark ? '#94a3b8' : '#94a3b8';
              c.fillText('결론이 작성되지 않았습니다.', padX + Math.round(w * 0.021), boxY + coBoxH / 2);
            } else {
              c.font = '600 ' + coS + 'px ' + FONT;
              c.fillStyle = dark ? '#e2e8f0' : '#1e293b';
              coLines.forEach(function (ln, i2) {
                c.fillText(ln, padX + Math.round(w * 0.021), boxY + Math.round(coS * 0.4) + coLineH * (i2 + 0.5));
              });
            }
          }

          /* 하단 워터마크 바 */
          const y0 = h + (hasRep ? repH : 0);
          const grd = c.createLinearGradient(0, y0, 0, y0 + barH);
          grd.addColorStop(0, 'rgba(17,32,64,.97)'); grd.addColorStop(1, 'rgba(9,18,38,.97)');
          c.fillStyle = grd; c.fillRect(0, y0, w, barH);
          c.fillStyle = '#3b82f6'; c.fillRect(0, y0, w, Math.max(4, Math.round(w * 0.0028)));

          const maxW = w - padX * 2;
          c.textAlign = 'left'; c.textBaseline = 'alphabetic';
          /* 1행: 학교 · 학년 · 반 · 번호 · 이름   (오른쪽: 보안로그) */
          c.fillStyle = '#ffffff'; c.font = '800 ' + fs1 + 'px ' + FONT;
          c.fillText(fitText(c, schoolName() + ' · ' + studentLabel(), maxW * 0.62), padX, y0 + barH * 0.34);
          c.textAlign = 'right'; c.fillStyle = 'rgba(147,197,253,.95)'; c.font = '700 ' + fs2 + 'px ' + FONT;
          c.fillText(fitText(c, securityLog(), maxW * 0.36), w - padX, y0 + barH * 0.34);
          c.textAlign = 'left';
          /* 2행: 일시 | 회로 분석 */
          c.fillStyle = 'rgba(255,255,255,.88)'; c.font = '700 ' + fs2 + 'px ' + FONT;
          c.fillText(fitText(c, t.text + '  |  ' + info2.summary, maxW), padX, y0 + barH * 0.63);
          /* 3행: 세부 부품 */
          c.fillStyle = 'rgba(147,197,253,.92)'; c.font = '600 ' + fs3 + 'px ' + FONT;
          c.fillText(fitText(c, '회로 세부: ' + (info2.detailRaw || info2.detail), maxW), padX, y0 + barH * 0.86);

          resolve(cvs.toDataURL('image/png'));
        } catch (err) { reject(err); }
      };
      img.onerror = reject;
      img.src = raw;
    });
  }

  function downloadImage(dataUrl, name) {
    const a = document.createElement('a');
    a.href = dataUrl; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => a.remove(), 400);
  }

  /* ---------- 제출 모달 ---------- */
  let shotData = '', lastInfo = null, lastStamp = null;
  function setStatus(kind, msg) { statusEl.className = 'svl-status' + (kind ? ' ' + kind : ''); statusEl.textContent = msg || ''; }

  function openSubmitModal() {
    subMask.classList.add('on');
    setStatus('', '');
    submitBtn.disabled = true; submitBtn.textContent = '🚀 제출하기';
  }
  function closeSubmitModal() { subMask.classList.remove('on'); }
  closeBtn.addEventListener('click', closeSubmitModal);

  capBtn.addEventListener('click', async function () {
    if (!hasStudent()) { openGate(); toast('먼저 학년·반·번호·이름·입장 코드를 입력해 주세요'); return; }
    if (submittedInfo()) { toast('✅ 이미 제출이 완료된 학번입니다 — 재제출할 수 없습니다'); }
    shotData = ''; lastInfo = analyze(); lastStamp = stamp();
    shotImg.removeAttribute('src'); shotImg.style.display = 'none';
    loadingEl.textContent = '🖼 캡처 준비 중…'; loadingEl.style.display = 'flex';
    openSubmitModal();
    chips.innerHTML = '';
    [st.school, gradeTxt(st.grade), st.cls + '반', st.num + '번', st.name].filter(Boolean).forEach(function (v) {
      const s = document.createElement('span'); s.className = 'svl-chip'; s.textContent = v; chips.appendChild(s);
    });
    summaryBox.innerHTML = '<b>회로 분석</b><br>' + lastInfo.summary + '<br><span style="opacity:.72;font-weight:600">' + (lastInfo.detailRaw || lastInfo.detail) + '</span>';
    subSub.textContent = '캡처한 회로와 탐구 기록(측정값·그래프·결론)을 확인한 뒤 제출하세요.';
    try {
      shotData = await composeShot(lastInfo);
      shotImg.src = shotData; shotImg.style.display = 'block'; loadingEl.style.display = 'none';
      if (submittedInfo()) { updateSubmitLock(); }
      else { submitBtn.disabled = false; submitBtn.textContent = '🚀 제출하기'; }
    } catch (err) {
      loadingEl.textContent = '⚠️ 캡처에 실패했습니다. 다시 시도해 주세요.';
      setStatus('err', '캡처 실패: ' + (err && err.message ? err.message : err));
    }
  });

  saveBtn.addEventListener('click', function () {
    if (!shotData) { setStatus('info', '아직 캡처가 준비되지 않았습니다.'); return; }
    downloadImage(shotData, fileName());
    setStatus('info', '💾 이미지가 저장되었습니다 — ' + fileName());
  });

  submitBtn.addEventListener('click', async function () {
    if (!shotData) return;
    const url = webhook();
    /* 제출 주소가 아직 없으면: 기기 저장 + 안내 (학교 와이파이 단절 대비) */
    if (!url) {
      downloadImage(shotData, fileName());
      subSub.textContent = '제출 주소가 아직 설정되지 않아 이미지로 저장했습니다.';
      setStatus('info', '✅ 제출용 회로 이미지가 저장되었습니다! 선생님께 이 파일을 보내 주세요.');
      return;
    }
    if (submittedInfo()) {
      setStatus('err', '🔒 이미 제출이 완료된 학번입니다. 재제출할 수 없습니다.');
      submitBtn.disabled = true; submitBtn.textContent = '✅ 제출 완료';
      return;
    }
    const payload = {
      timestamp: lastStamp.text + ':00',
      grade: st.grade, gradeLabel: gradeTxt(st.grade),
      className: st.cls, studentNum: st.num, studentName: st.name,
      pin: session ? session.pin : '',
      summary: lastInfo.summary, partsCount: lastInfo.count, partsDetail: lastInfo.detail,
      imageBase64: shotData, fileStamp: lastStamp.file, school: schoolName(),
      securityLog: securityLog(), teacherPreview: !!(session && session.teacherPreview)
    };
    submitBtn.disabled = true; submitBtn.textContent = '📤 전송 중…'; setStatus('info', '선생님께 전송하고 있습니다…');
    try {
      const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
      let body = null; try { body = await res.json(); } catch (e) {}
      if (res.ok && (!body || body.ok !== false)) {
        submitBtn.textContent = '✅ 제출 완료';
        submitBtn.disabled = true;
        writeSS(SUB_KEY, JSON.stringify({ at: lastStamp.text, cls: st.cls, num: st.num, name: st.name, grade: st.grade }));
        setStatus('ok', '✅ 제출 완료! (' + lastStamp.text + ')' + (body && body.tab ? ' · ' + body.tab + ' 시트에 기록되었습니다.' : '') +
          (body && body.preview ? ' · (교사 미리보기·기록 안 됨)' : ''));
        subSub.textContent = '제출이 완료되었습니다. 이 학번은 재제출이 잠겼습니다. 필요하면 이미지를 한 번 더 저장해 두세요.';
      } else {
        throw new Error((body && body.error) || ('HTTP ' + res.status));
      }
    } catch (err) {
      /* 전송이 확인되지 않으면 이미지를 자동 저장해 제출을 잃지 않게 한다 */
      downloadImage(shotData, fileName());
      submitBtn.disabled = false; submitBtn.textContent = '🔁 다시 제출하기';
      setStatus('err', '⚠️ 전송을 확인하지 못해 이미지를 저장했습니다. 선생님께 이 파일을 보내 주세요.');
    }
  });

  cfgBtn.addEventListener('click', function () {
    quiet(6000);
    const cur = webhook();
    const v = window.prompt('Apps Script 웹앱 URL을 붙여넣으세요 (예: https://script.google.com/macros/s/…/exec)', cur);
    if (v === null) return;
    writeLS(LS.hook, v.trim());
    toast(v.trim() ? '✅ 제출 주소가 저장되었습니다' : '제출 주소를 비웠습니다');
  });

})();
</script>

<script type="text/plain" id="svlCodeSrc">
/* ============================================================================
   Science Virtual LAB · 전기 회로 3D (테스트) — 수행평가 제출함  [v2 풀 보안]

   ▣ 이 코드를 쓰는 곳
     구글 스프레드시트 [Science Virtual LAB] 전기회로 수행평가 제출함
     → [확장 프로그램] → [Apps Script] → 기존 Code.gs 전체를 지우고 이 내용을 붙여넣기 → 저장
     → [배포] → [배포 관리] → 연필(편집) → 버전: "새 버전" → [배포]
       (URL은 그대로 유지됩니다. 새 배포를 만들면 URL이 바뀌니 반드시 '배포 관리 → 새 버전'으로!)

   ▣ 시트 구조
     · '시험관리' 탭 (첫 번째 탭)
        A 반 | B 상태(열림/닫힘) | C 입장코드(PIN) | D 마감시각(선택) | E 문제 내용 | F 1인1회제출
        H1:I6 교사용 사용법 / H8 교사 마스터 코드 · I8 값
     · '1반'~'14반' 탭
        A 번호 | B 이름 | C 제출한 사진 | D 제출날짜 및 시간
        E 점수(ARRAYFORMULA·절대 건드리지 않음) | F 회로 요약(비고)
        G 채점 이유(ARRAYFORMULA·절대 건드리지 않음) | H 학년·보안로그

   ▣ 보안 규칙 (서버에서 강제)
     · '시험관리'에서 그 반이 '열림'일 때만 입장·제출할 수 있습니다.
     · 입장코드(PIN)가 반별 값과 같아야 합니다.
     · 마감시각이 지나면 입장·제출이 막힙니다.
     · 1인1회제출 = '예'이면 같은 번호는 다시 제출할 수 없습니다.
     · 문제 내용은 이 스크립트/시트에만 있고, 학생 화면(HTML)에는 들어 있지 않습니다.
     · E열·G열에는 ARRAYFORMULA가 걸려 있으므로 절대 쓰지 않고,
       A~D · F · H 열에만 기록합니다. (E/G에 쓰면 #REF! 로 채점표가 깨집니다)
   ============================================================================ */

var SHEET_ID = '1g6wvP20IaFOK4as0GixHQWRPXCCZA_bVOv140Ez4z64';
var FOLDER_NAME = '전기회로 수행평가 제출';
var ADMIN_TAB = '시험관리';
var TZ = 'Asia/Seoul';
var CLASS_MAX = 14;
var NUM_MAX = 40;

/* ---------------------------------------------------------------- 응답 도우미 */
function json_(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj))
    .setMimeType(ContentService.MimeType.JSON);
}
function fail_(code, reason) {
  return { ok: false, code: code, reason: reason };
}
function pad2_(n) {
  n = String(n);
  return n.length < 2 ? '0' + n : n;
}
function str_(v) {
  return v === null || v === undefined ? '' : String(v).trim();
}

/* ================================================================== doGet ==== */
function doGet(e) {
  var p = (e && e.parameter) || {};
  var action = str_(p.action);
  try {
    if (action === 'enter') return json_(handleEnter_(p));
    if (action === 'teacher_list') return json_(handleTeacherList_(p));
    if (action === 'teacher_set') return json_(handleTeacherSet_(p));
    if (action === 'ping') {
      return json_({ ok: true, v: 2, serverTime: nowHms_() });
    }
    return json_(fail_('BAD_ACTION', '알 수 없는 요청입니다.'));
  } catch (err) {
    return json_(fail_('SERVER', '서버 오류: ' + errText_(err)));
  }
}

function errText_(err) {
  if (!err) return 'unknown';
  return String(err.message || err);
}
function nowHms_() {
  return Utilities.formatDate(new Date(), TZ, 'HH:mm:ss');
}

/* ------------------------------------------------------- 시트 접근 도우미 ---- */
function book_() {
  return SpreadsheetApp.openById(SHEET_ID);
}
function adminSheet_() {
  var sh = book_().getSheetByName(ADMIN_TAB);
  if (!sh) throw new Error("'" + ADMIN_TAB + "' 탭이 없습니다. 시트를 확인해 주세요.");
  return sh;
}
function masterCode_(sh) {
  return str_(sh.getRange('I8').getValue());
}
/* 시험관리 A2:F15 읽기 → [{cls:'1반', status, pin, deadlineRaw, problem, oneTime, row:2}, ...] */
function readAdminRows_(sh) {
  var vals = sh.getRange(2, 1, CLASS_MAX, 6).getValues();
  var out = [];
  for (var i = 0; i < vals.length; i++) {
    var r = vals[i];
    out.push({
      row: i + 2,
      cls: str_(r[0]),
      status: str_(r[1]),
      pin: str_(r[2]),
      deadlineRaw: r[3],
      problem: str_(r[4]),
      oneTime: str_(r[5])
    });
  }
  return out;
}
function findAdminRow_(sh, cls) {
  var want = str_(cls).replace(/반$/, '') + '반';
  var rows = readAdminRows_(sh);
  for (var i = 0; i < rows.length; i++) {
    if (rows[i].cls === want) return rows[i];
  }
  return null;
}

/* ----------------------------------------------------------- 마감시각 파싱 ---- */
/* 'HH:MM' / 'YYYY-MM-DD HH:MM' / Date 셀값 / 오전·오후 표기 모두 처리.
   반환: {kind:'none'} | {kind:'time', hm:'15:30'} | {kind:'date', key:'2026-11-28 15:30'} */
function parseDeadline_(v) {
  if (v === null || v === undefined || v === '') return { kind: 'none' };
  if (Object.prototype.toString.call(v) === '[object Date]') {
    if (isNaN(v.getTime())) return { kind: 'none' };
    var y = Number(Utilities.formatDate(v, TZ, 'yyyy'));
    if (y < 1900) return { kind: 'time', hm: Utilities.formatDate(v, TZ, 'HH:mm') };
    return { kind: 'date', key: Utilities.formatDate(v, TZ, 'yyyy-MM-dd HH:mm') };
  }
  var raw = str_(v);
  if (!raw) return { kind: 'none' };
  var hm = raw.match(/(\d{1,2})\s*:\s*(\d{1,2})/);
  if (!hm) return { kind: 'none' };
  var h = parseInt(hm[1], 10), mi = parseInt(hm[2], 10);
  if (!(h >= 0 && h <= 23 && mi >= 0 && mi <= 59)) return { kind: 'none' };
  if (/오후|PM/i.test(raw) && h < 12) h += 12;
  if (/오전|AM/i.test(raw) && h === 12) h = 0;
  var hmStr = pad2_(h) + ':' + pad2_(mi);
  var d = raw.match(/(\d{4})\s*[-./년]\s*(\d{1,2})\s*[-./월]\s*(\d{1,2})/);
  if (d) return { kind: 'date', key: d[1] + '-' + pad2_(d[2]) + '-' + pad2_(d[3]) + ' ' + hmStr };
  return { kind: 'time', hm: hmStr };
}
/* 마감이 지났으면 true */
function deadlinePassed_(v) {
  var d = parseDeadline_(v);
  if (d.kind === 'none') return false;
  var now = new Date();
  if (d.kind === 'time') {
    return Utilities.formatDate(now, TZ, 'HH:mm') >= d.hm;
  }
  return Utilities.formatDate(now, TZ, 'yyyy-MM-dd HH:mm') >= d.key;
}
/* 교사 화면에 보여줄 정규화 문자열 */
function deadlineText_(v) {
  var d = parseDeadline_(v);
  if (d.kind === 'none') return '';
  return d.kind === 'time' ? d.hm : d.key;
}

/* ------------------------------------------------------------ 중복 제출 확인 -- */
/* 해당 반 탭 A열(번호)을 훑어 이미 제출한 번호인지 확인 */
function alreadySubmitted_(clsTab, num, name) {
  var sh = book_().getSheetByName(clsTab);
  if (!sh) return false;
  var maxRows = sh.getMaxRows();
  if (maxRows < 2) return false;
  var vals = sh.getRange(1, 1, Math.min(maxRows, 2000), 2).getValues();
  var wantNum = str_(num);
  var wantName = str_(name);
  for (var i = 1; i < vals.length; i++) {
    var a = str_(vals[i][0]);
    if (!a) continue;
    if (a === wantNum) return true;
    if (wantName && a === wantNum && str_(vals[i][1]) === wantName) return true;
  }
  return false;
}

/* ================================================================ 입장(enter) */
function handleEnter_(p) {
  var grade = str_(p.grade);
  var cls = str_(p.cls).replace(/반$/, '');
  var num = str_(p.num);
  var name = str_(p.name);
  var pin = str_(p.pin);

  if (!/^[1-3]$/.test(grade)) return fail_('BAD_INPUT', '학년을 선택해 주세요.');
  if (!/^\d{1,2}$/.test(cls) || +cls < 1 || +cls > CLASS_MAX) return fail_('BAD_INPUT', '반을 선택해 주세요.');
  if (!/^\d{1,2}$/.test(num) || +num < 1 || +num > NUM_MAX) return fail_('BAD_INPUT', '번호를 확인해 주세요.');
  if (!name || name.length > 20) return fail_('BAD_INPUT', '이름을 입력해 주세요.');

  var sh = adminSheet_();
  var row = findAdminRow_(sh, cls);
  if (!row) return fail_('SETUP', "'시험관리' 탭에 " + cls + "반 행이 없습니다. 시트를 확인해 주세요.");

  if (row.status !== '열림') {
    return fail_('CLOSED', '현재 ' + cls + '반 응시 시간이 아닙니다. 선생님이 시험을 열 때까지 기다려 주세요.');
  }
  if (str_(row.pin) !== pin) {
    return fail_('BAD_PIN', '입장 코드가 올바르지 않습니다.');
  }
  if (deadlinePassed_(row.deadlineRaw)) {
    return fail_('EXPIRED', '응시 마감 시간이 지났습니다.');
  }
  var oneTime = row.oneTime === '예';
  if (oneTime && alreadySubmitted_(cls + '반', num, name)) {
    return fail_('ALREADY_SUBMITTED', '이미 제출 완료된 학번입니다.');
  }
  return {
    ok: true,
    grade: grade,
    cls: cls,
    num: num,
    name: name,
    problem: row.problem,
    deadline: deadlineText_(row.deadlineRaw),
    serverTime: nowHms_(),
    oneTime: oneTime,
    version: 2
  };
}

/* ============================================================== 교사 목록 조회 */
function checkMaster_(p) {
  var sh = adminSheet_();
  var master = masterCode_(sh);
  if (!master) return fail_('NO_MASTER', '교사 마스터 코드가 비어 있습니다. 시험관리 I8 셀을 확인해 주세요.');
  if (str_(p.master) !== master) return fail_('BAD_MASTER', '교사 마스터 코드가 올바르지 않습니다.');
  return { ok: true, sh: sh };
}
function handleTeacherList_(p) {
  var chk = checkMaster_(p);
  if (!chk.ok) return chk;
  var rows = readAdminRows_(chk.sh);
  var out = [];
  for (var i = 0; i < rows.length; i++) {
    out.push({
      cls: rows[i].cls,
      status: rows[i].status,
      pin: rows[i].pin,
      deadline: deadlineText_(rows[i].deadlineRaw),
      problem: rows[i].problem,
      oneTime: rows[i].oneTime
    });
  }
  return { ok: true, classes: out, serverTime: nowHms_(), version: 2 };
}

/* ============================================================== 교사 설정 변경 */
function handleTeacherSet_(p) {
  var chk = checkMaster_(p);
  if (!chk.ok) return chk;
  var sh = chk.sh;
  var row = findAdminRow_(sh, p.cls);
  if (!row) return fail_('NO_ROW', "시험관리 탭에 " + str_(p.cls) + " 행이 없습니다.");

  var has = function (k) { return Object.prototype.hasOwnProperty.call(p, k); };

  if (has('status')) {
    var st = str_(p.status);
    if (st !== '열림' && st !== '닫힘') return fail_('BAD_INPUT', "상태는 '열림' 또는 '닫힘'만 가능합니다.");
    sh.getRange(row.row, 2).setValue(st);
  }
  if (has('pin')) {
    var pin = str_(p.pin).slice(0, 8);
    sh.getRange(row.row, 3).setNumberFormat('@').setValue(pin);
  }
  if (has('deadline')) {
    var dl = str_(p.deadline).slice(0, 32);
    var cell = sh.getRange(row.row, 4).setNumberFormat('@');
    cell.clearContent();
    if (dl) cell.setValue(dl);
  }
  if (has('problem')) {
    sh.getRange(row.row, 5).setValue(str_(p.problem).slice(0, 1000));
  }
  if (has('oneTime')) {
    var ot = str_(p.oneTime);
    if (ot !== '예' && ot !== '아니오') return fail_('BAD_INPUT', "1인1회제출은 '예' 또는 '아니오'만 가능합니다.");
    sh.getRange(row.row, 6).setValue(ot);
  }

  SpreadsheetApp.flush();
  var after = findAdminRow_(sh, p.cls);
  return {
    ok: true,
    cls: after.cls,
    status: after.status,
    pin: after.pin,
    deadline: deadlineText_(after.deadlineRaw),
    problem: after.problem,
    oneTime: after.oneTime,
    serverTime: nowHms_()
  };
}

/* ================================================================= doPost ==== */
function doPost(e) {
  try {
    var raw = (e && e.postData && e.postData.contents) || (e && e.parameter && e.parameter.payload) || '{}';
    var d = JSON.parse(raw);

    /* 교사 미리보기: 기록하지 않고 성공만 돌려준다 */
    if (d.teacherPreview === true) {
      return json_({ ok: true, preview: true });
    }

    var cls = str_(d.className).replace(/반$/, '');
    var num = str_(d.studentNum);
    var name = str_(d.studentName);
    var grade = str_(d.grade);

    /* ---- 서버 재검증 (학생 제출은 예외 없음) ---- */
    var sh = adminSheet_();
    var row = findAdminRow_(sh, cls);
    if (!row) return json_({ ok: false, code: 'SETUP', error: "'시험관리' 탭에 " + cls + "반 행이 없습니다." });
    if (row.status !== '열림') {
      return json_({ ok: false, code: 'CLOSED', error: '현재 ' + cls + '반 응시 시간이 아닙니다. 제출이 마감되었습니다.' });
    }
    if (str_(row.pin) !== str_(d.pin)) {
      return json_({ ok: false, code: 'BAD_PIN', error: '입장 코드가 확인되지 않아 제출할 수 없습니다.' });
    }
    if (deadlinePassed_(row.deadlineRaw)) {
      return json_({ ok: false, code: 'EXPIRED', error: '응시 마감 시간이 지나 제출할 수 없습니다.' });
    }
    if (row.oneTime === '예' && alreadySubmitted_(cls + '반', num, name)) {
      return json_({ ok: false, code: 'ALREADY_SUBMITTED', error: '이미 제출 완료된 학번입니다. 재제출할 수 없습니다.' });
    }

    /* ---- 사진 저장 ---- */
    var photo = '';
    var b64 = String(d.imageBase64 || '').split(',')[1] || '';
    var tabName = cls + '반';
    if (b64) {
      var gLabel = grade ? grade + '학년_' : '';
      var fname = gLabel + cls + '반_' + num + '번_' + name + '_' + str_(d.fileStamp) + '.png';
      var file = getFolder_(FOLDER_NAME).createFile(
        Utilities.newBlob(Utilities.base64Decode(b64), 'image/png', fname)
      );
      photo = '=HYPERLINK("' + file.getUrl() + '","📷 사진 열기")';
    }

    /* ---- 기록 (E·G열 ARRAYFORMULA 보호 + 동시 제출 잠금) ---- */
    var lock = LockService.getScriptLock();
    if (!lock.tryLock(30000)) {
      return json_({ ok: false, code: 'BUSY', error: '제출이 몰려 잠시 지연되고 있습니다. 잠시 후 다시 눌러 주세요.' });
    }
    try {
      var clsSh = book_().getSheetByName(tabName);
      if (!clsSh) return json_({ ok: false, code: 'SETUP', error: tabName + ' 시트 탭이 없습니다.' });

      /* 잠금 안에서 중복 한 번 더 확인 (동시 제출 방지) */
      if (row.oneTime === '예' && alreadySubmitted_(tabName, num, name)) {
        return json_({ ok: false, code: 'ALREADY_SUBMITTED', error: '이미 제출 완료된 학번입니다. 재제출할 수 없습니다.' });
      }

      var r = nextRow_(clsSh);
      clsSh.getRange(r, 1, 1, 4).setValues([[num, name, photo, str_(d.timestamp)]]);
      clsSh.getRange(r, 6).setValue(str_(d.summary));
      clsSh.getRange(r, 8).setValue(str_(d.securityLog));
    } finally {
      try { lock.releaseLock(); } catch (ignore) {}
    }

    return json_({ ok: true, tab: tabName, time: nowHms_() });
  } catch (err) {
    return json_({ ok: false, code: 'SERVER', error: '서버 오류: ' + errText_(err) });
  }
}

/* A열에서 마지막으로 값이 있는 행 다음 행 번호 (ARRAYFORMULA E/G열과 무관) */
function nextRow_(sh) {
  var maxRows = sh.getMaxRows();
  var vals = sh.getRange(1, 1, maxRows, 1).getValues();
  var last = 0;
  for (var i = 0; i < vals.length; i++) {
    if (str_(vals[i][0]) !== '') last = i + 1;
  }
  var r = Math.max(2, last + 1);
  if (r > maxRows) {
    sh.insertRowsAfter(maxRows, r - maxRows + 20);
  }
  return r;
}

/* 제출 사진 폴더 */
function getFolder_(n) {
  var it = DriveApp.getFoldersByName(n);
  return it.hasNext() ? it.next() : DriveApp.createFolder(n);
}
</script>
