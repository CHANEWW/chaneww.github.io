<!DOCTYPE html>
<html lang="ko" data-mzoom="0.95">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>우주 체육대회 중력 비교 3D</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preload" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff" as="font" type="font/woff" crossorigin>
<script src="../../common/lib/three.min.js"></script>
<script>if(!window.THREE){document.write('<scr'+'ipt src="../../common/lib/three.min.js"><\/scr'+'ipt>');}</script>
<script src="../../common/lib/OrbitControls.js"></script>
<script>if(!(window.THREE&&THREE.OrbitControls)){document.write('<scr'+'ipt src="../../common/lib/OrbitControls.js"><\/scr'+'ipt>');}</script>
<link rel="stylesheet" href="../../common/ui-layout.css">
<link rel="stylesheet" href="../../common/qr-modal.css">
<style>
@font-face{
  font-family:'SeoulNamsan';
  src:local('SeoulNamsan M'),local('SeoulNamsanM'),local('서울남산체 M'),
      url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff') format('woff');
  font-weight:400;font-style:normal;font-display:swap;
}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;padding:0;width:100%;height:100%;overflow:hidden;
  font-family:'SeoulNamsan',-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color:#16202e;background:radial-gradient(120% 100% at 50% 0%,#f7fbff 0%,#e6eff9 46%,#d3e2f2 100%);
  touch-action:none;transition:background .35s ease,color .35s ease;
}
body.dark-mode{color:#eef4ff;background:radial-gradient(120% 100% at 50% 0%,#16223a 0%,#0d1524 52%,#05080e 100%)}
#canvas-container{position:fixed;inset:0;z-index:1;touch-action:none}
#canvas-container canvas{display:block}

.glass-panel{
  background:rgba(255,255,255,.82);backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(255,255,255,.68);border-radius:18px;
  box-shadow:0 10px 28px rgba(15,23,42,.10);transition:background .35s,border-color .35s,color .35s;
}
body.dark-mode .glass-panel{background:rgba(18,28,46,.86);border-color:rgba(255,255,255,.13);box-shadow:0 10px 30px rgba(0,0,0,.5)}

/* ---------- 좌상단 ---------- */
.top-left-bar{position:fixed;top:16px;left:18px;display:flex;align-items:center;gap:9px;z-index:40;max-width:calc(100vw - 120px)}
.back-btn{
  display:flex;align-items:center;gap:6px;padding:9px 16px;font-size:14px;font-weight:700;font-family:inherit;
  color:#16202e;text-decoration:none;border:none;border-radius:999px;cursor:pointer;white-space:nowrap;
  background:rgba(255,255,255,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.68);box-shadow:0 10px 28px rgba(15,23,42,.10);transition:transform .18s,background .35s;
}
body.dark-mode .back-btn{color:#eef4ff;background:rgba(18,28,46,.86);border-color:rgba(255,255,255,.13)}
.back-btn:active{transform:scale(.97)}
.tag-badge{display:flex;align-items:center;gap:8px;padding:9px 16px;font-size:14px;font-weight:700;border-radius:999px;min-width:0;overflow:hidden}
.tag-badge .title-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vision-badge{flex:0 0 auto;background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;letter-spacing:.2px}

/* ---------- 우상단 ---------- */
.icon-btn{
  width:38px;height:38px;min-width:38px;border-radius:50%;border:1px solid rgba(255,255,255,.68);
  display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;cursor:pointer;font-family:inherit;
  color:#16202e;background:rgba(255,255,255,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 8px 22px rgba(15,23,42,.10);transition:background .35s,border-color .35s;
}
body.dark-mode .icon-btn{color:#eef4ff;background:rgba(18,28,46,.86);border-color:rgba(255,255,255,.13)}
.data-card{display:flex;align-items:center;gap:13px;padding:9px 15px;border-radius:16px}
.data-item{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.data-label{font-size:10.5px;font-weight:700;color:#64748b;white-space:nowrap;line-height:1.2}
body.dark-mode .data-label{color:#9db0cb}
.data-value{font-size:14px;font-weight:800;color:#16202e;white-space:nowrap;line-height:1.25}
body.dark-mode .data-value{color:#eef4ff}

/* ---------- 중앙 안내 ---------- */
.center-tooltip{
  position:fixed;top:78px;left:50%;transform:translateX(-50%);padding:8px 18px;border-radius:999px;
  font-size:12.5px;font-weight:700;color:#475569;pointer-events:none;z-index:15;white-space:nowrap;
  max-width:calc(100vw - 40px);overflow:hidden;text-overflow:ellipsis;
  background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
body.dark-mode .center-tooltip{color:#cbd5e1;background:rgba(18,28,46,.78);border-color:rgba(255,255,255,.12)}

/* ---------- 좌측 결과 패널 ---------- */
.res-panel{position:fixed;left:18px;bottom:76px;width:262px;padding:11px 12px;z-index:20;border-radius:18px;display:flex;flex-direction:column;gap:6px}
.res-title{font-size:12px;font-weight:800;color:#334155;letter-spacing:-.2px;display:flex;align-items:center;justify-content:space-between;gap:6px}
body.dark-mode .res-title{color:#cbd5e1}
.res-table{display:flex;flex-direction:column;gap:4px}
.res-row{display:grid;grid-template-columns:52px 1fr 1fr 1fr;gap:4px;align-items:center;font-size:10.5px;font-weight:800;color:#334155}
body.dark-mode .res-row{color:#cbd5e1}
.res-row.head{color:#8fa0b8;font-size:9.5px;font-weight:800;border-bottom:1px solid rgba(15,23,42,.08);padding-bottom:3px}
body.dark-mode .res-row.head{color:#8fa4c2;border-bottom-color:rgba(255,255,255,.1)}
.res-row .pn{display:flex;align-items:center;gap:4px;white-space:nowrap;font-size:10px}
.res-row .pn i{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.res-row .num{text-align:right;font-size:10px;font-weight:800;white-space:nowrap;color:#0a84ff}
body.dark-mode .res-row .num{color:#7cc0ff}
.res-note{font-size:9.5px;font-weight:700;color:#8fa0b8;line-height:1.45;word-break:keep-all}
body.dark-mode .res-note{color:#8fa4c2}

/* ---------- 우측 조절 패널 ---------- */
body #side-ctrl.side-ctrl-panel{width:250px !important;padding:12px !important;gap:9px !important}
.panel-header{display:flex;align-items:center;justify-content:space-between;gap:6px;padding-bottom:6px;border-bottom:1px solid rgba(15,23,42,.08);width:100%}
body.dark-mode .panel-header{border-bottom-color:rgba(255,255,255,.12)}
.panel-title{font-size:12px !important;font-weight:800 !important;color:#475569 !important}
body.dark-mode .panel-title{color:#94a3b8 !important}
.ctrl-block{display:flex;flex-direction:column;gap:6px;width:100%}
.ctrl-cap{font-size:10.5px;font-weight:800;color:#64748b;letter-spacing:-.1px}
body.dark-mode .ctrl-cap{color:#9db0cb}
.mode-row{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;width:100%}
.mode-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;padding:5px 2px;
  border-radius:12px;border:1px solid rgba(15,23,42,.09);background:rgba(255,255,255,.9);color:#334155;
  font-family:inherit;font-size:10px;font-weight:800;cursor:pointer;transition:all .18s;line-height:1.2;word-break:keep-all;text-align:center;
}
.mode-btn .mb-ico{font-size:16px;line-height:1}
body.dark-mode .mode-btn{background:rgba(30,42,62,.9);border-color:rgba(255,255,255,.12);color:#cbd5e1}
.mode-btn.active{background:#0a84ff;border-color:#0a84ff;color:#fff;box-shadow:0 4px 12px rgba(10,132,255,.35)}
.ctrl-row{display:flex;flex-direction:column;gap:3px;width:100%}
.ctrl-row-header{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.ctrl-label{font-size:11px;font-weight:700;color:#475569;white-space:nowrap;line-height:1.25}
body.dark-mode .ctrl-label{color:#cbd5e1}
.ctrl-val{font-size:11.5px;font-weight:800;color:#0a84ff;white-space:nowrap;line-height:1.25}
body.dark-mode .ctrl-val{color:#7cc0ff}
.ctrl-slider{width:100%;height:6px;border-radius:999px;background:#dbe4ef;outline:none;-webkit-appearance:none;appearance:none;cursor:pointer;margin:4px 0}
body.dark-mode .ctrl-slider{background:#334155}
.ctrl-slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#0a84ff;box-shadow:0 2px 6px rgba(10,132,255,.45);cursor:pointer}
.ctrl-slider::-moz-range-thumb{width:15px;height:15px;border:none;border-radius:50%;background:#0a84ff}
.ctrl-slider:disabled{opacity:.4}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}
.mini-btn{
  padding:9px 4px;border-radius:11px;border:1px solid rgba(15,23,42,.09);background:rgba(255,255,255,.9);
  color:#334155;font-family:inherit;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap;transition:all .16s;
}
body.dark-mode .mini-btn{background:rgba(30,42,62,.9);border-color:rgba(255,255,255,.12);color:#cbd5e1}
.mini-btn.on{background:#0a84ff;border-color:#0a84ff;color:#fff}
.wide-btn{
  width:100%;padding:10px 8px;border-radius:12px;border:none;background:linear-gradient(135deg,#ff9f0a,#ff375f);
  color:#fff;font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer;transition:transform .18s;
  box-shadow:0 4px 14px rgba(255,55,95,.3);white-space:nowrap;
}
.wide-btn:active{transform:scale(.98)}
.panel-note{font-size:10px;font-weight:700;color:#64748b;line-height:1.45;word-break:keep-all}
body.dark-mode .panel-note{color:#9db0cb}

/* ---------- 하단 ---------- */
.bottom-right-bar{position:fixed;right:18px;bottom:18px;display:flex;align-items:center;gap:10px;z-index:40}

/* ---------- 모바일 세로 ---------- */
@media (max-width:900px){
  .top-left-bar{top:max(8px,env(safe-area-inset-top));left:8px;gap:6px;max-width:calc(100vw - 178px)}
  .back-btn{padding:7px 11px;font-size:12px}
  .tag-badge{padding:7px 11px;font-size:12px}
  .vision-badge{display:none}
  .icon-btn{width:32px;height:32px;min-width:32px;font-size:14px}
  .data-card{gap:10px;padding:6px 10px;border-radius:14px}
  .data-label{font-size:9px}
  .data-value{font-size:12px}
  .center-tooltip{display:none}
  .res-panel{
    left:8px;right:8px;top:calc(max(8px,env(safe-area-inset-top)) + 104px);bottom:auto;
    width:auto;padding:6px 9px;gap:3px;border-radius:14px;
  }
  .res-title{font-size:10px}
  .res-row{font-size:9px;grid-template-columns:44px 1fr 1fr 1fr}
  .res-row .pn{font-size:8.5px}
  .res-row .num{font-size:8.5px}
  .res-note{display:none}
  body #side-ctrl.side-ctrl-panel{
    right:8px !important;width:226px !important;
    bottom:calc(66px + env(safe-area-inset-bottom)) !important;
    max-height:min(48vh,380px) !important;padding:9px !important;gap:6px !important;
  }
  .ctrl-cap{font-size:9.5px}
  .mode-btn{min-height:44px;font-size:9px}
  .mode-btn .mb-ico{font-size:14px}
  .ctrl-label{font-size:10px}
  .ctrl-val{font-size:10.5px}
  .panel-note{font-size:9px}
  .mini-btn{font-size:10px;padding:7px 3px}
  .wide-btn{padding:8px;font-size:11px}
  .bottom-right-bar{right:8px;bottom:calc(8px + env(safe-area-inset-bottom))}
  #fullscreenText{display:none}
}
/* ---------- 모바일 가로 ---------- */
@media (max-height:520px) and (orientation:landscape){
  .top-left-bar{top:max(6px,env(safe-area-inset-top));left:6px;gap:5px;max-width:46vw}
  .back-btn{padding:5px 9px;font-size:11px}
  .tag-badge{padding:5px 9px;font-size:11px}
  .vision-badge{display:none}
  .icon-btn{width:28px;height:28px;min-width:28px;font-size:13px}
  .data-card{gap:8px;padding:4px 9px;border-radius:12px}
  .data-label{font-size:8.5px}
  .data-value{font-size:11px}
  .center-tooltip{display:none}
  .res-panel{left:auto;right:calc(236px + 8px);top:auto;bottom:calc(44px + env(safe-area-inset-bottom));width:210px;padding:6px 8px;gap:2px}
  .res-note{display:none}
  .res-row{font-size:8.5px;grid-template-columns:40px 1fr 1fr 1fr}
  body #side-ctrl.side-ctrl-panel{
    right:8px !important;width:226px !important;
    bottom:calc(44px + env(safe-area-inset-bottom)) !important;
    max-height:calc(100vh - 92px) !important;padding:8px !important;gap:5px !important;
  }
  .panel-note{display:none}
  .mode-btn{min-height:38px;font-size:8.5px}
  .bottom-right-bar{right:8px;bottom:calc(6px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div id="canvas-container"></div>

<div class="top-left-bar">
  <a href="/index.html" class="back-btn" onclick="var r=document.referrer;if(history.length>1&&r&&r.indexOf(location.origin+'/')===0&&/(\/|index(_3d)?\.html)(\?|#|$)/.test(r)){history.back();return false;}"><span>⬅</span> 메인</a>
  <div class="glass-panel tag-badge">
    <span class="title-text">우주 체육대회 중력 비교 3D</span>
    <span class="vision-badge">visionOS</span>
  </div>
  <button class="back-btn qr-btn" id="qrBtn" type="button" title="QR 코드" aria-label="QR 코드 보기"><span class="qr-btn-icon" aria-hidden="true">📱</span><span class="qr-btn-label">QR code</span></button>
</div>

<div class="top-right-bar">
  <div class="tr-util">
    <button class="icon-btn" id="theme-toggle" type="button" title="주간/야간 모드" aria-label="주간/야간 모드 전환">🌙</button>
  </div>
  <div class="glass-panel data-card">
    <div class="data-item"><span class="data-label">종목</span><span class="data-value" id="val-event" style="color:#0a84ff">공 던지기</span></div>
    <div class="data-item"><span class="data-label">초기 속력</span><span class="data-value" id="val-v0">10.0 m/s</span></div>
    <div class="data-item"><span class="data-label">각도</span><span class="data-value" id="val-ang">45°</span></div>
  </div>
</div>

<div class="glass-panel center-tooltip" id="guide-tooltip">💡 같은 힘으로 던져도 행성마다 중력이 달라 궤적이 이렇게 달라집니다</div>

<div class="glass-panel bottom-control-bar">
  <button class="control-tab-btn" id="btn-reset" type="button"><span>🔄</span><span>초기화</span></button>
  <button class="control-tab-btn" id="btn-cam" type="button"><span>🎥</span><span>시점정렬</span></button>
</div>

<div class="glass-panel res-panel" id="res-panel">
  <div class="res-title"><span>📊 기록 비교</span><span id="res-event" style="color:#0a84ff;font-size:10px">공 던지기</span></div>
  <div class="res-table">
    <div class="res-row head"><span>행성</span><span class="num">최고 높이</span><span class="num" id="h2">이동 거리</span><span class="num" id="h3">체공 시간</span></div>
    <div id="res-body"></div>
  </div>
  <div class="res-note" id="res-note">세로·가로를 같은 축척으로 그렸습니다. 달에서는 같은 힘으로 던져도 훨씬 멀리, 높이 날아갑니다.</div>
</div>

<div class="glass-panel side-ctrl-panel" id="side-ctrl">
  <div class="panel-header"><span class="panel-title">🏅 종목과 조건</span></div>
  <div class="ctrl-block">
    <span class="ctrl-cap">종목 선택</span>
    <div class="mode-row" id="mode-row">
      <button class="mode-btn active" type="button" data-mode="throw"><span class="mb-ico">⚾</span>공 던지기</button>
      <button class="mode-btn" type="button" data-mode="free"><span class="mb-ico">🏀</span>자유투</button>
      <button class="mode-btn" type="button" data-mode="jump"><span class="mb-ico">🏃</span>높이뛰기</button>
    </div>
  </div>
  <div class="ctrl-block" id="cond-block">
    <div class="ctrl-row">
      <div class="ctrl-row-header"><span class="ctrl-label" id="lbl-v0">던지는 빠르기</span><span class="ctrl-val" id="val-s1">10.0 m/s</span></div>
      <input type="range" class="ctrl-slider" id="rng-v0" min="4" max="12" step="0.2" value="10">
    </div>
    <div class="ctrl-row">
      <div class="ctrl-row-header"><span class="ctrl-label">던지는 각도</span><span class="ctrl-val" id="val-s2">45°</span></div>
      <input type="range" class="ctrl-slider" id="rng-ang" min="20" max="80" step="1" value="45">
    </div>
  </div>
  <button class="wide-btn" id="btn-launch" type="button">🚀 동시에 출발!</button>
  <div class="row2">
    <button class="mini-btn on" id="btn-speed" type="button">⏩ 배속 ×1</button>
    <button class="mini-btn" id="btn-trail" type="button">🛤️ 궤적 보기</button>
  </div>
  <div class="panel-note" id="panel-note">네 행성에서 같은 속력·각도로 동시에 던집니다.</div>
</div>

<script>
/* =====================================================================
   우주 체육대회 중력 비교 3D — lab script
   ===================================================================== */
(function () {
'use strict';
var $ = function (s) { return document.querySelector(s); };
var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };

var LANES = [
  { id: 'moon', name: '달', g: 1.62, ratio: '1/6 g', color: 0x7e8ea3, ui: '#6f7f94' },
  { id: 'mars', name: '화성', g: 3.72, ratio: '0.38 g', color: 0xd9532a, ui: '#d9532a' },
  { id: 'earth', name: '지구', g: 9.81, ratio: '1 g', color: 0x2274d4, ui: '#2274d4' },
  { id: 'jupiter', name: '목성', g: 24.79, ratio: '2.53 g', color: 0xb57a45, ui: '#b57a45' }
];
var MODES = {
  throw: { name: '공 던지기', v0: 10, ang: 45, v0min: 4, v0max: 12, v0step: 0.2 },
  free: { name: '자유투', v0: 9.82, ang: 52, v0min: 9.82, v0max: 9.82, v0step: 0.1 },
  jump: { name: '높이뛰기', v0: 3.2, ang: 90, v0min: 2, v0max: 4.6, v0step: 0.1 }
};

var state = { mode: 'throw', v0: 10, ang: 45, running: false, speed: 1, trail: true };
var HOOP_D = 4.6, HOOP_H = 3.05, BAR_H = 1.2;

/* ---------------------------------------------------------------
   1. three.js 기본
   --------------------------------------------------------------- */
var container = $('#canvas-container');
var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(40, 1, 0.1, 400);
var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
if (THREE.sRGBEncoding) renderer.outputEncoding = THREE.sRGBEncoding;
container.appendChild(renderer.domElement);
var controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 6;
controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI * 0.49;
controls.target.set(0, 3.6, 0);

var hemi = new THREE.HemisphereLight(0xffffff, 0xcbd8e6, 0.62);
scene.add(hemi);
var keyL = new THREE.DirectionalLight(0xffffff, 0.85);
keyL.position.set(6, 16, 10);
keyL.castShadow = true;
keyL.shadow.mapSize.width = 1024;
keyL.shadow.mapSize.height = 1024;
keyL.shadow.camera.left = -12;
keyL.shadow.camera.right = 12;
keyL.shadow.camera.top = 12;
keyL.shadow.camera.bottom = -12;
keyL.shadow.camera.near = 1;
keyL.shadow.camera.far = 60;
scene.add(keyL);

/* ---------------------------------------------------------------
   2. 라벨
   --------------------------------------------------------------- */
function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function makeLabel(text, opts) {
  opts = opts || {};
  var fs = opts.fontSize || 40;
  var color = opts.color || '#16202e';
  var bg = opts.bg || 'rgba(255,255,255,0.92)';
  var border = opts.border || 'rgba(15,23,42,0.12)';
  var padX = 22, padY = 12;
  var font = '700 ' + fs + 'px "SeoulNamsan", -apple-system, "Malgun Gothic", sans-serif';
  var cv = document.createElement('canvas');
  var ctx = cv.getContext('2d');
  ctx.font = font;
  var tw = ctx.measureText(text).width;
  cv.width = Math.ceil(tw + padX * 2);
  cv.height = Math.ceil(fs + padY * 2);
  var tex = new THREE.CanvasTexture(cv);
  if (THREE.sRGBEncoding) tex.encoding = THREE.sRGBEncoding;
  function draw() {
    var c2 = cv.getContext('2d');
    c2.clearRect(0, 0, cv.width, cv.height);
    roundRect(c2, 2, 2, cv.width - 4, cv.height - 4, Math.min(cv.height / 2, 18));
    c2.fillStyle = bg; c2.fill();
    c2.lineWidth = 3; c2.strokeStyle = border; c2.stroke();
    c2.font = font; c2.fillStyle = color;
    c2.textAlign = 'center'; c2.textBaseline = 'middle';
    c2.fillText(text, cv.width / 2, cv.height / 2 + 1);
    tex.needsUpdate = true;
  }
  draw();
  var sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: true, depthWrite: false }));
  var h = opts.h || 0.4;
  sprite.scale.set(h * cv.width / cv.height, h, 1);
  if (document.fonts && document.fonts.load) {
    document.fonts.load('700 ' + fs + 'px "SeoulNamsan"').then(function () {
      var c3 = cv.getContext('2d');
      c3.font = font;
      var tw2 = c3.measureText(text).width;
      if (Math.abs(tw2 - tw) > 1) {
        cv.width = Math.ceil(tw2 + padX * 2);
        sprite.scale.set(h * cv.width / cv.height, h, 1);
      }
      draw();
    }, function () {});
  }
  return sprite;
}

/* 동적 라벨 */
function dynLabel(opts) {
  opts = opts || {};
  var h = opts.h || 0.34;
  var fs = 46;
  var cv = document.createElement('canvas');
  cv.width = 512; cv.height = 128;
  var tex = new THREE.CanvasTexture(cv);
  if (THREE.sRGBEncoding) tex.encoding = THREE.sRGBEncoding;
  var spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false, depthWrite: false }));
  spr.scale.set(h * 4, h, 1);
  spr.renderOrder = 900;
  var cur = { text: '', color: '#16202e', bg: 'rgba(255,255,255,0.94)', border: 'rgba(15,23,42,0.12)' };
  function draw() {
    var c = cv.getContext('2d');
    c.clearRect(0, 0, cv.width, cv.height);
    roundRect(c, 3, 3, cv.width - 6, cv.height - 6, 30);
    c.fillStyle = cur.bg; c.fill();
    c.lineWidth = 4; c.strokeStyle = cur.border; c.stroke();
    c.font = '700 ' + fs + 'px "SeoulNamsan", sans-serif';
    c.fillStyle = cur.color;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(cur.text, cv.width / 2, cv.height / 2 + 2);
    tex.needsUpdate = true;
  }
  if (document.fonts && document.fonts.load) document.fonts.load('700 ' + fs + 'px "SeoulNamsan"').then(draw, function () {});
  return {
    sprite: spr,
    set: function (text, color, bg, border) {
      cur.text = text;
      cur.color = color || '#16202e';
      cur.bg = bg || 'rgba(255,255,255,0.94)';
      cur.border = border || 'rgba(15,23,42,0.12)';
      draw();
    }
  };
}

function disposeGroup(g) {
  g.traverse(function (o) {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      var ms = Array.isArray(o.material) ? o.material : [o.material];
      ms.forEach(function (m) { if (m.map) m.map.dispose(); m.dispose(); });
    }
  });
}

function personFigure(mat1, mat2) {
  var g = new THREE.Group();
  var head = new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 12), mat2);
  head.position.y = 1.52;
  head.castShadow = true;
  g.add(head);
  var torso = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.09, 0.5, 12), mat1);
  torso.position.y = 1.15;
  torso.castShadow = true;
  g.add(torso);
  var legM = new THREE.MeshStandardMaterial({ color: 0x33415c, roughness: 0.8 });
  for (var s = -1; s <= 1; s += 2) {
    var leg = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.04, 0.8, 10), legM);
    leg.position.set(s * 0.06, 0.42, 0);

    arm.position.set(s * 0.15, 1.2, 0);
    arm.rotation.z = s * 0.22;
    arm.castShadow = true;
    g.add(arm);

}

function buildScene() {
  /* 이전 트랙 제거 */
  while (world.children.length) {
    var ch = world.children.pop();
    disposeGroup(ch);
  }
  tracks = [];

  var mode = state.mode;
  var S, spread, baseY;
  if (mode === 'jump') {
    S = 2.0;            // 세로 배율 (단위/미터)
    spread = 2.55;      // 좌우 간격
    baseY = 0;
  } else if (mode === 'free') {
    S = 0.62;
    spread = 2.6;
    baseY = 7.9;
  } else {
    S = 0.108;
    spread = 2.6;
    baseY = 7.9;
  }

  LANES.forEach(function (L, i) {
    var tg = new THREE.Group();
    var lane = { def: L, group: tg, S: S };

    if (mode === 'jump') {
      tg.position.set((i - 1.5) * spread, 0, 0);
    } else {
      tg.position.set(0, baseY - i * spread, 0);
      /* 바닥 트랙 */
      var floorW = mode === 'free' ? 11.4 : 11.4;
      var floor = new THREE.Mesh(new THREE.BoxGeometry(floorW, 0.1, 0.9),
        new THREE.MeshStandardMaterial({ color: L.color, roughness: 0.85, metalness: 0.05 }));
      floor.position.set(floorW / 2 - 0.4, -0.05, 0);
      floor.receiveShadow = true;
      tg.add(floor);
      var lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35 });
      var stepM = mode === 'free' ? 2 : 10;   // 10 m 간격 눈금
      for (var d = 0; d * S <= floorW; d += stepM) {
        var ps = [new THREE.Vector3(d * S - 0.15, 0.02, -0.45), new THREE.Vector3(d * S - 0.15, 0.02, 0.45)];
        tg.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(ps), lineMat));
      }
    }

    /* 행성 이름 */
    var nameLbl = makeLabel(L.name + '  ' + L.ratio, { h: 0.42, color: L.ui, bg: 'rgba(255,255,255,0.94)' });
    if (mode === 'jump') {
      nameLbl.position.set(0, 7.6, 0);
    } else {
      nameLbl.position.set(-1.35, 0.35, 0);
    }
    tg.add(nameLbl);

    /* 사람 */
    var shirt = new THREE.MeshStandardMaterial({ color: L.color, roughness: 0.7 });
    var skin = new THREE.MeshStandardMaterial({ color: 0xffc9a0, roughness: 0.65 });
    var fig = personFigure(shirt, skin);
    if (mode === 'jump') {
      var pad = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.12, 1.4),
        new THREE.MeshStandardMaterial({ color: L.color, roughness: 0.85 }));
      pad.position.y = -0.06;
      pad.receiveShadow = true;
      tg.add(pad);
      fig.position.set(0, 0, 0);
      fig.scale.setScalar(1.0);
      tg.add(fig);
      lane.fig = fig;
    } else {
      fig.position.set(-0.15, 0, 0);
      fig.scale.setScalar(mode === 'free' ? 0.22 : 0.2);
      tg.add(fig);
    }

    /* 볼 */
    var ball = new THREE.Mesh(new THREE.SphereGeometry(0.16, 18, 14),
      new THREE.MeshStandardMaterial({ color: L.id === 'earth' ? 0xff8a3d : 0xffd166, roughness: 0.55, emissive: 0x000000 }));
    ball.castShadow = true;
    ball.visible = false;
    tg.add(ball);
    lane.ball = ball;

    /* 궤적 라인 */
    var arcGeo = new THREE.BufferGeometry();
    arcGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(180 * 3), 3));
    var arc = new THREE.Line(arcGeo, new THREE.LineBasicMaterial({ color: L.color, transparent: true, opacity: 0.85 }));
    tg.add(arc);
    lane.arc = arc;

    /* 최고 높이 표시 */
    var markMat = new THREE.LineDashedMaterial({ color: L.color, dashSize: 0.09, gapSize: 0.07, transparent: true, opacity: 0.8 });
    var markGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 1, 0)]);
    var mark = new THREE.Line(markGeo, markMat);
    mark.computeLineDistances();
    mark.visible = false;
    tg.add(mark);
    lane.mark = mark;

    var hl = dynLabel({ h: 0.3 });
    hl.sprite.visible = false;
    tg.add(hl.sprite);
    lane.hlabel = hl;

    /* 자유투 골대 */
    if (mode === 'free') {
      var hoop = new THREE.Group();
      var ring = new THREE.Mesh(new THREE.TorusGeometry(0.23 * (HOOP_H / 3.05), 0.02, 8, 40),
        new THREE.MeshStandardMaterial({ color: 0xff6b35, roughness: 0.5, metalness: 0.3 }));
      ring.rotation.x = Math.PI / 2;
      hoop.add(ring);
      var board = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.6, 0.06),
        new THREE.MeshStandardMaterial({ color: 0xe8eef6, roughness: 0.5 }));
      board.position.set(0, 0.3, -0.24);
      hoop.add(board);
      hoop.position.set(HOOP_D * S, HOOP_H * S, 0);
      tg.add(hoop);
      lane.hoop = hoop;
    }

    /* 높이뛰기 바 */
    if (mode === 'jump') {
      var bar = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 1.5, 10),
        new THREE.MeshStandardMaterial({ color: 0xff6b35, roughness: 0.5 }));
      bar.rotation.z = Math.PI / 2;
      bar.position.set(0, BAR_H * S, 0.45);
      bar.castShadow = true;
      tg.add(bar);
      for (var s2 = -1; s2 <= 1; s2 += 2) {
        var post = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, BAR_H * S + 0.5, 8),
          new THREE.MeshStandardMaterial({ color: 0xb9c6d6, roughness: 0.5, metalness: 0.3 }));
        post.position.set(s2 * 0.75, (BAR_H * S + 0.5) / 2, 0.45);
        tg.add(post);
      }
      if (i === 0) {
        var lbl = makeLabel('기준 1.2 m', { h: 0.28, color: '#b45309', bg: 'rgba(255,247,237,0.95)' });
        lbl.position.set(1.6, BAR_H * S, 0.45);
        tg.add(lbl);
      }
    }

    world.add(tg);
    tracks.push(lane);
  });

  applyParams();
}

/* ---------------------------------------------------------------
   4. 물리 계산
   --------------------------------------------------------------- */
function calcLane(L, mode, v0, ang) {
  var th = ang * Math.PI / 180;
  var g = L.g;
  var vy = v0 * Math.sin(th), vx = v0 * Math.cos(th);
  if (mode === 'jump') {
    var h = vy * vy / (2 * g);
    var t = vy / g;
    return { H: h, R: 0, T: 2 * t, pass: h >= BAR_H, vy: vy, vx: 0 };
  }
  var H, R, T, pass = null;
  if (mode === 'free') {
    /* x = HOOP_D 에서의 높이 */
    var tAt = HOOP_D / vx;
    var yAt = vy * tAt - 0.5 * g * tAt * tAt;
    var tGround = (vy + Math.sqrt(Math.max(0, vy * vy + 2 * g * 0))) / g;
    H = vy * vy / (2 * g);
    R = vx * (2 * vy / g);
    T = 2 * vy / g;
    pass = (yAt > HOOP_H - 0.12 && yAt < HOOP_H + 0.36) ? 'in' : (yAt >= HOOP_H + 0.36 ? 'over' : 'short');
    if (tAt > T) pass = 'short';
    return { H: H, R: R, T: T, pass: pass, yAt: yAt, vy: vy, vx: vx };
  }
  H = vy * vy / (2 * g);
  R = vx * (2 * vy / g);
  T = 2 * vy / g;
  return { H: H, R: R, T: T, pass: null, vy: vy, vx: vx };
}

/* ---------------------------------------------------------------
   5. 파라미터 적용 (궤적 · 라벨)
   --------------------------------------------------------------- */
var results = {};
function applyParams() {
  var mode = state.mode, v0 = state.v0, ang = state.ang;
  results = {};
  tracks.forEach(function (lane) {
    var L = lane.def, S = lane.S;
    var r = calcLane(L, mode, v0, ang);
    results[L.id] = r;

    /* 궤적 */
    var pts = [];
    if (mode === 'jump') {
      var N = 40;
      for (var i = 0; i <= N; i++) {
        var t = (r.T) * i / N;
        var y = r.vy * t - 0.5 * L.g * t * t;
        pts.push(new THREE.Vector3(0, Math.max(0, y) * S, 0));
      }
    } else {
      var N2 = 90;
      var tEnd = r.T;
      for (var k = 0; k <= N2; k++) {
        var tt = tEnd * k / N2;
        var x = r.vx * tt;
        var yy = r.vy * tt - 0.5 * L.g * tt * tt;
        pts.push(new THREE.Vector3(x * S - 0.15, Math.max(0, yy) * S, 0));
      }
    }
    var arr = lane.arc.geometry.attributes.position.array;
    var lim = Math.min(pts.length, arr.length / 3);
    for (var j = 0; j < lim; j++) {
      arr[j * 3] = pts[j].x;
      arr[j * 3 + 1] = pts[j].y;
      arr[j * 3 + 2] = pts[j].z;
    }
    lane.arc.geometry.setDrawRange(0, limAt(pts, S, mode));
    lane.arc.geometry.attributes.position.needsUpdate = true;
    lane.arc.visible = state.trail;

    /* 최고 높이 표시 */
    var apX = mode === 'jump' ? 0 : (r.vx * (r.vy / L.g)) * S;
    var apY = r.H * S;
    lane.mark.visible = true;
    var mp = lane.mark.geometry.attributes.position.array;
    mp[0] = apX; mp[1] = 0; mp[2] = 0;
    mp[3] = apX; mp[4] = apY; mp[5] = 0;
    lane.mark.geometry.attributes.position.needsUpdate = true;
    lane.mark.computeLineDistances();

    var txt = r.H >= 10 ? r.H.toFixed(0) + ' m' : r.H.toFixed(1) + ' m';
    lane.hlabel.set('최고 ' + txt, L.ui, 'rgba(255,255,255,0.95)');
    lane.hlabel.sprite.position.set(apX, apY + 0.42, 0);
    lane.hlabel.sprite.visible = true;
  });
  renderResults();
}
function limAt(pts, S, mode) { return pts.length; }

/* ---------------------------------------------------------------
   6. 결과 표
   --------------------------------------------------------------- */
function renderResults() {
  var mode = state.mode;
  var html = '';
  var unit1 = 'm', unit2 = 'm', unit3 = 's';
  if (mode === 'jump') {
    $('#h2').textContent = '기준 통과';
    $('#h3').textContent = '체공 시간';
  } else if (mode === 'free') {
    $('#h2').textContent = '골대 통과';
    $('#h3').textContent = '체공 시간';
  } else {
    $('#h2').textContent = '이동 거리';
    $('#h3').textContent = '체공 시간';
  }
  LANES.forEach(function (L) {
    var r = results[L.id] || { H: 0, R: 0, T: 0 };
    var c2;
    if (mode === 'jump') {
      c2 = r.pass ? '<span style="color:#1e9e5a">성공</span>' : '<span style="color:#e5484d">실패</span>';
    } else if (mode === 'free') {
      c2 = r.pass === 'in' ? '<span style="color:#1e9e5a">성공</span>' :
           (r.pass === 'over' ? '<span style="color:#e5484d">넘음</span>' : '<span style="color:#e5484d">못 미침</span>');
    } else {
      c2 = r.R.toFixed(1) + ' m';
    }
    var h = r.H >= 10 ? r.H.toFixed(0) : r.H.toFixed(1);
    var t = r.T.toFixed(2);
    html += '<div class="res-row"><span class="pn"><i style="background:' + L.ui + '"></i>' + L.name + '</span>' +
      '<span class="num">' + h + ' m</span>' +
      '<span class="num">' + c2 + '</span>' +
      '<span class="num">' + t + ' s</span></div>';
  });
  $('#res-body').innerHTML = html;
  $('#res-event').textContent = MODES[mode].name;
  var note = $('#res-note');
  if (mode === 'jump') note.textContent = '도약 속력이 같아도 중력이 작은 달에서는 같은 힘으로 3 m 넘게 뛰어오릅니다.';
  else if (mode === 'free') note.textContent = '지구에서 골대에 맞춘 슛을 달에서 그대로 던지면 골대를 훨씬 넘어갑니다.';
  else note.textContent = '세로·가로를 같은 축척으로 그렸습니다. 달에서는 같은 힘으로 던져도 훨씬 멀리, 높이 날아갑니다.';
}

/* ---------------------------------------------------------------
   7. 발사 애니메이션
   --------------------------------------------------------------- */
var flight = { t: 0, on: false, maxT: 1 };
function launch() {
  applyParams();
  flight.t = 0;
  flight.on = true;
  var maxT = 0;
  LANES.forEach(function (L) {
    var r = results[L.id];
    maxT = Math.max(maxT, r.T);
    var lane = tracks.filter(function (x) { return x.def.id === L.id; })[0];
    if (state.mode === 'jump') {
      lane.ball.visible = false;
      if (lane.fig) lane.fig.position.y = 0;
    } else {
      lane.ball.visible = true;
      lane.ball.position.set(0, 1.1, 0);
    }
  });
  flight.maxT = maxT;
  $('#btn-launch').textContent = '🚀 발사 중…';
}
function updateFlight(dt) {
  if (!flight.on) return;
  flight.t += dt * state.speed;
  var done = true;
  tracks.forEach(function (lane) {
    var L = lane.def, r = results[L.id], S = lane.S;
    var t = flight.t;
    if (t < r.T) done = false;
    var tc = Math.min(t, r.T);
    if (state.mode === 'jump') {
      var y = r.vy * tc - 0.5 * L.g * tc * tc;
      if (lane.fig) lane.fig.position.y = Math.max(0, y) * S;
    } else {
      var x = r.vx * tc;
      var yy = r.vy * tc - 0.5 * L.g * tc * tc;
      lane.ball.position.set(x * S - 0.15, Math.max(0, yy) * S + 0.12, 0);
    }
  });
  if (done) {
    flight.on = false;
    $('#btn-launch').textContent = '🚀 동시에 출발!';
  }
}

/* ---------------------------------------------------------------
   8. 카메라
   --------------------------------------------------------------- */
var FIT = { w: 6.0, h: 5.4 };
function fitDistance() {
  var vfov = camera.fov * Math.PI / 180;
  var dH = FIT.h / Math.tan(vfov / 2);
  var dW = FIT.w / (Math.tan(vfov / 2) * Math.max(camera.aspect, 0.28));
  return Math.max(dH, dW) * 1.04;
}
function alignCamera(reset) {
  if (reset) controls.target.set(0, state.mode === 'jump' ? 3.6 : 4.5, 0);
  var dir = new THREE.Vector3(0.02, 0.56, 1).normalize();
  camera.position.copy(controls.target).addScaledVector(dir, fitDistance());
  controls.update();
}
window.__LAB_CAM__ = camera;

/* 종목별 화면 맞춤 */
function applyFit() {
  if (state.mode === 'jump') {
    FIT.w = 4.9; FIT.h = 4.9;
    controls.target.set(0, 3.6, 0);
  } else if (state.mode === 'free') {
    FIT.w = 7.8; FIT.h = 7.4;
    controls.target.set(5.2, 4.6, 0);
  } else {
    FIT.w = 7.8; FIT.h = 7.4;
    controls.target.set(5.2, 4.6, 0);
  }
  alignCamera(false);
}

  $('#val-event').textContent = M.name;
  var notes = {
    throw: '네 행성에서 같은 속력·각도로 동시에 던집니다.',
    free: '지구 기준 자유투 거리 4.6 m, 골대 3.05 m · 같은 슛을 네 행성에서 던져 봅니다.',
    jump: '같은 도약 속력으로 수직으로 뛰었을 때의 높이를 비교합니다 · 기준 1.2 m'
  };
  $('#panel-note').textContent = notes[m];
  $$('.mode-btn').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-mode') === m); });
  buildScene();
  applyFit();
  flight.on = false;
  $('#btn-launch').textContent = '🚀 동시에 출발!';
}
$$('.mode-btn').forEach(function (b) {
  b.addEventListener('click', function () { setMode(b.getAttribute('data-mode')); });
});
$('#rng-v0').addEventListener('input', function (e) {
  state.v0 = parseFloat(e.target.value);
  $('#val-s1').textContent = state.v0.toFixed(1) + ' m/s';
  $('#val-v0').textContent = state.v0.toFixed(1) + ' m/s';
  flight.on = false;
  applyParams();
});
$('#rng-ang').addEventListener('input', function (e) {
  state.ang = parseFloat(e.target.value);
  $('#val-s2').textContent = state.ang + '°';
  $('#val-ang').textContent = state.ang + '°';
  flight.on = false;
  applyParams();
});
$('#btn-launch').addEventListener('click', launch);
$('#btn-speed').addEventListener('click', function (e) {
  state.speed = state.speed >= 3 ? 1 : state.speed + 1;
  e.currentTarget.textContent = '⏩ 배속 ×' + state.speed;
  e.currentTarget.classList.toggle('on', state.speed > 1);
});
$('#btn-trail').addEventListener('click', function (e) {
  state.trail = !state.trail;
  tracks.forEach(function (l) { l.arc.visible = state.trail; });
  e.currentTarget.classList.toggle('on', state.trail);
});
$('#btn-reset').addEventListener('click', function () {
  setMode('throw');
});
$('#btn-cam').addEventListener('click', function () { applyFit(); });

$('#theme-toggle').addEventListener('click', function (e) {
  var dark = document.body.classList.toggle('dark-mode');
  e.currentTarget.textContent = dark ? '☀️' : '🌙';
  hemi.intensity = dark ? 0.45 : 0.62;
  keyL.intensity = dark ? 0.55 : 0.9;
});

/* ---------------------------------------------------------------
   10. 루프
   --------------------------------------------------------------- */
var clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  var dt = Math.min(clock.getDelta(), 0.05);
  updateFlight(dt);
  controls.update();
  renderer.render(scene, camera);
}
function resize() {
  var w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  alignCamera(false);
}
window.addEventListener('resize', resize);

/* 부트 */
setMode('throw');
resize();
animate();

})();
</script>

<!-- Fullscreen / Windowed Mode Button -->
<div class="bottom-right-bar">
  <button id="fullscreenBtn" class="glass-panel back-btn" type="button" aria-label="전체화면으로 전환">
    <span id="fullscreenIcon">⛶</span><span id="fullscreenText">전체화면</span>
  </button>
</div>

<script>
/* ============ 전체화면 / 창모드 (표준 + 모바일 몰입 모드 폴백) ============ */
(function () {
    var docEl = document.documentElement;
    var btn = document.getElementById('fullscreenBtn');
    var icon = document.getElementById('fullscreenIcon');
    var text = document.getElementById('fullscreenText');

    function realFs() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement ||
                  document.mozFullScreenElement || document.msFullscreenElement);
    }
    function pseudo() { return docEl.classList.contains('pseudo-fs'); }
    function setUI() {
        var on = realFs() || pseudo();
        if (icon) icon.textContent = on ? '🗗' : '⛶';
        if (text) text.textContent = on ? '창모드' : '전체화면';
        if (btn) btn.setAttribute('aria-label', on ? '창모드로 전환' : '전체화면으로 전환');
        document.body.classList.toggle('is-fullscreen', on);
    }
    function toast(msg) {
        var t = document.getElementById('ux-toast');
        if (!t) {
            t = document.createElement('div');
            t.id = 'ux-toast';
            t.style.cssText = 'position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);' +
                'background:rgba(28,28,30,.88);color:#fff;font-size:12px;line-height:1.4;padding:9px 14px;border-radius:14px;' +
                'z-index:9999;max-width:86vw;text-align:center;pointer-events:none;transition:opacity .3s;' +
                'font-family:inherit;box-shadow:0 8px 24px rgba(0,0,0,.25)';
            document.body.appendChild(t);
        }
        t.textContent = msg;
        t.style.opacity = '1';
        clearTimeout(t._t);
        t._t = setTimeout(function () { t.style.opacity = '0'; }, 2600);
    }

    if (btn) {
        btn.addEventListener('click', function () {
            var wasReal = realFs();
            var wasPseudo = pseudo();
            try {
                if (!wasReal) {
                    var req = docEl.requestFullscreen || docEl.webkitRequestFullscreen ||
                              docEl.webkitRequestFullScreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
                    if (req) req.call(docEl);
                } else {
                    var exit = document.exitFullscreen || document.webkitExitFullscreen ||
                               document.webkitCancelFullScreen || document.mozCancelFullScreen || document.msExitFullscreen;
                    if (exit) exit.call(document);
                }
            } catch (e) {}
            setTimeout(function () {
                if (wasReal) { setUI(); return; }
                if (wasPseudo) { docEl.classList.remove('pseudo-fs'); setUI(); return; }
                if (!realFs()) {
                    docEl.classList.add('pseudo-fs');
                    try { window.scrollTo(0, 1); } catch (e) {}
                    toast('이 브라우저는 전체화면을 지원하지 않아 상단 정보를 숨긴 몰입 모드로 표시합니다');
                }
                setUI();
            }, 420);
        }, false);
    }
    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
        document.addEventListener(ev, function () { setUI(); refit(); });
    });

    function theCam() {
        try { if (window.__LAB_CAM__ && window.__LAB_CAM__.isPerspectiveCamera) return window.__LAB_CAM__; } catch (e) {}
        return null;
    }
    function mobileFit() {
        var cam = theCam();
        if (!cam) return;
        try {
            if (!cam.userData) cam.userData = {};
            if (!cam.userData.baseFov) cam.userData.baseFov = cam.fov;
            var w = window.innerWidth, h = window.innerHeight, f = 1;
            var k = 0.62;
            var attr = docEl.getAttribute('data-mzoom');
            if (attr) { var v = parseFloat(attr); if (!isNaN(v) && v > 0) k = v; }
            if (w < h) f = 1 + (1 - w / h) * k;
            else if (h <= 520) f = 1 + k * 0.18;
            cam.fov = Math.min(88, cam.userData.baseFov * f);
            cam.updateProjectionMatrix();
        } catch (e) {}
    }
    mobileFit();

    var rt = null;
    function refit() {
        clearTimeout(rt);
        rt = setTimeout(function () {
            mobileFit();
            try { window.dispatchEvent(new Event('resize')); } catch (e) {}
        }, 240);
    }
    window.addEventListener('orientationchange', refit);
    window.addEventListener('pageshow', refit);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) refit(); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', refit);
    setUI();
})();
</script>
