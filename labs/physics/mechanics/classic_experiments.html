<div id="ux-toast"></div>

<script>
/* ============ 공통 3D 기반 (씬·카메라·조명·테마·라벨·전체화면) ============ */
window.SVL = (function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var LIGHT_BG = 0xeef4fb, DARK_BG = 0x070d16;

    var container = $('canvas-container');
    var scene = new THREE.Scene();
    scene.background = new THREE.Color(LIGHT_BG);
    scene.fog = new THREE.Fog(LIGHT_BG, 34, 70);

    var camera = new THREE.PerspectiveCamera(46, window.innerWidth / Math.max(1, window.innerHeight), 0.1, 320);
    camera.position.set(6.2, 6.4, 13.2);

    var renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    var controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enablePan = true;
    controls.screenSpacePanning = true;
    controls.minDistance = 4;
    controls.maxDistance = 36;
    controls.minPolarAngle = Math.PI * 0.05;
    controls.maxPolarAngle = Math.PI * 0.56;
    controls.target.set(0, 2.0, 0);
    controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
    if (THREE.TOUCH) { controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN }; }

    var hemi = new THREE.HemisphereLight(0xffffff, 0xc3d3e6, 0.88);
    scene.add(hemi);
    var key = new THREE.DirectionalLight(0xffffff, 1.05);
    key.position.set(7, 13, 9);
    scene.add(key);
    var fill = new THREE.DirectionalLight(0xdfefff, 0.4);
    fill.position.set(-8, 5, -6);
    scene.add(fill);

    /* ---- 2D 캔버스 라벨 ---- */
    var labelList = [];
    var LAB_DPR = 2, LAB_H = 128, LAB_FONT = 52, LAB_PAD = 44, LAB_MAXW = 1536;
    function drawLabel(cv, text, color) {
        var g = cv.getContext('2d');
        var S = LAB_DPR, W = cv.width / S, H = cv.height / S;
        g.setTransform(S, 0, 0, S, 0, 0);
        g.clearRect(0, 0, W, H);
        g.font = 'bold ' + LAB_FONT + "px 'SeoulNamsan', -apple-system, sans-serif";
        g.textAlign = 'center'; g.textBaseline = 'middle';
        var tw = Math.min(W - 24, g.measureText(text).width * 1.12 + LAB_PAD);
        var x0 = (W - tw) / 2, r = 28;
        g.fillStyle = 'rgba(255,255,255,0.93)';
        g.beginPath();
        g.moveTo(x0 + r, 22); g.lineTo(x0 + tw - r, 22);
        g.quadraticCurveTo(x0 + tw, 22, x0 + tw, 22 + r);
        g.lineTo(x0 + tw, 106 - r);
        g.quadraticCurveTo(x0 + tw, 106, x0 + tw - r, 106);
        g.lineTo(x0 + r, 106);
        g.quadraticCurveTo(x0, 106, x0, 106 - r);
        g.lineTo(x0, 22 + r);
        g.quadraticCurveTo(x0, 22, x0 + r, 22);
        g.closePath(); g.fill();
        g.fillStyle = color || '#123';
        g.fillText(text, W / 2, 66);
    }
    function layoutLabel(spr) {
        var L = spr.userData.label;
        if (!L) return;
        var cv = L.cv, g = cv.getContext('2d');
        var f = (window.innerWidth < 900) ? 1.45 : 1;
        g.setTransform(LAB_DPR, 0, 0, LAB_DPR, 0, 0);
        g.font = 'bold ' + LAB_FONT + "px 'SeoulNamsan', -apple-system, sans-serif";
        var tw = g.measureText(L.text).width;
        var W = Math.max(LAB_FONT * 1.8 + LAB_PAD, Math.min(LAB_MAXW, tw * 1.18 + LAB_PAD + 20));
        var pw = Math.round(W * LAB_DPR), ph = Math.round(LAB_H * LAB_DPR);
        if (cv.width !== pw) cv.width = pw;
        if (cv.height !== ph) cv.height = ph;
        drawLabel(cv, L.text, L.color);
        if (L.tex) L.tex.needsUpdate = true;
        spr.scale.set(L.ww * (W / 512) * f, L.ww * 0.25 * f, 1);
    }
    function makeLabel(text, color, w) {
        var cv = document.createElement('canvas');
        cv.width = 512; cv.height = LAB_H;
        var tex = new THREE.CanvasTexture(cv);
        tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter; tex.generateMipmaps = false;
        var spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
        var ww = w || 1.5;
        spr.userData.label = { cv: cv, tex: tex, text: text, color: color, ww: ww };
        labelList.push(spr);
        layoutLabel(spr);
        return spr;
    }
    function relabelAll() { for (var i = 0; i < labelList.length; i++) layoutLabel(labelList[i]); }
    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () { setTimeout(relabelAll, 30); }).catch(function () { });
    }
    window.addEventListener('load', function () { setTimeout(relabelAll, 150); });

    var hintEl = $('centerTooltip');
    var hintTimer = null;
    function setHint(text, sticky) {
        if (!hintEl) return;
        hintEl.textContent = text;
        hintEl.classList.remove('hidden');
        if (hintTimer) clearTimeout(hintTimer);
        hintTimer = null;
        if (!sticky) hintTimer = setTimeout(function () { hintEl.classList.add('hidden'); }, 7000);
    }

    var isDark = false;
    var themeCbs = [];
    var bgCbs = [];
    function applyTheme() {
        document.body.classList.toggle('dark-mode', isDark);
        hemi.intensity = isDark ? 0.45 : 0.88;
        key.intensity = isDark ? 0.8 : 1.05;
        fill.intensity = isDark ? 0.3 : 0.4;
        $('themeBtn').textContent = isDark ? '☀️' : '🌙';
        for (var i = 0; i < bgCbs.length; i++) { try { bgCbs[i](); } catch (e) { } }
        for (var j = 0; j < themeCbs.length; j++) { try { themeCbs[j](isDark); } catch (e) { } }
    }
    function setBg(lightHex, darkHex) {
        var c = isDark ? darkHex : lightHex;
        scene.background = new THREE.Color(c);
        scene.fog = new THREE.Fog(c, 34, 70);
    }
    $('themeBtn').addEventListener('click', function () { isDark = !isDark; applyTheme(); });

    var svlFit = null;
    function onResize() {
        renderer.setSize(window.innerWidth, window.innerHeight);
        camera.aspect = window.innerWidth / Math.max(1, window.innerHeight);
        camera.updateProjectionMatrix();
        if (typeof svlFit === 'function') svlFit();
    }
    window.addEventListener('resize', onResize);

    var hooks = { reset: null, align: null, fit: null };
    $('btnReset').addEventListener('click', function () { if (hooks.reset) hooks.reset(); });
    $('btnAlign').addEventListener('click', function () {
        if (hooks.align) hooks.align(); else if (hooks.fit) hooks.fit();
        setHint('🎥 시점을 정면으로 정렬했습니다.', false);
    });

    var frameCbs = [];
    var last = performance.now();
    function frame(now) {
        requestAnimationFrame(frame);
        var dt = Math.min(0.06, (now - last) / 1000);
        last = now;
        for (var i = 0; i < frameCbs.length; i++) { try { frameCbs[i](dt, now); } catch (e) { } }
        controls.update();
        renderer.render(scene, camera);
    }
    requestAnimationFrame(frame);

    function toast(msg) {
        var t = $('ux-toast');
        if (!t) return;
        t.textContent = msg; t.classList.add('show');
        clearTimeout(t._t); t._t = setTimeout(function () { t.classList.remove('show'); }, 2800);
    }

    /* ---- 전체화면 / 몰입 모드 (표준 SVL.initFullscreen) ---- */
    var fsInited = false;
    function initFullscreen(btnId, iconId, textId) {
        if (fsInited) return; fsInited = true;
        var docEl = document.documentElement;
        var btn = $(btnId || 'fullscreenBtn'), icon = $(iconId || 'fullscreenIcon'), text = $(textId || 'fullscreenText');
        function realFs() {
            return !!(document.fullscreenElement || document.webkitFullscreenElement ||
                document.mozFullScreenElement || document.msFullscreenElement);
        }
        function pseudo() { return docEl.classList.contains('pseudo-fs'); }
        function setUI() {
            var on = realFs() || pseudo();
            if (icon) icon.textContent = on ? '🗗' : '⛶';
            if (text) text.textContent = on ? '창모드' : '전체화면';
            if (btn) {
                btn.setAttribute('aria-pressed', on ? 'true' : 'false');
                btn.setAttribute('aria-label', on ? '창모드로 전환' : '전체화면으로 전환');
            }
            document.body.classList.toggle('is-fullscreen', on);
            setTimeout(function () { try { window.dispatchEvent(new Event('resize')); } catch (e) { } }, 160);
        }
        if (btn) {
            btn.addEventListener('click', function () {
                if (realFs()) {
                    var exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
                    try { if (exit) { var q = exit.call(document); if (q && q.catch) q.catch(function () { }); } } catch (e) { }
                    setUI(); return;
                }
                if (pseudo()) { docEl.classList.remove('pseudo-fs'); setUI(); return; }
                var req = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.msRequestFullscreen;
                if (!req) { docEl.classList.add('pseudo-fs'); setUI(); toast('이 브라우저는 전체화면을 지원하지 않아 상단 정보를 숨긴 몰입 모드로 표시합니다'); return; }
                try {
                    var p = req.call(docEl);
                    if (p && typeof p.then === 'function') p.then(setUI, function () { docEl.classList.add('pseudo-fs'); setUI(); });
                    else setTimeout(setUI, 400);
                } catch (e) { docEl.classList.add('pseudo-fs'); setUI(); }
            }, false);
        }
        ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
            document.addEventListener(ev, setUI);
        });
        document.addEventListener('keydown', function (e) {
            if ((e.key === 'Escape' || e.key === 'Esc') && pseudo() && !realFs()) { docEl.classList.remove('pseudo-fs'); setUI(); }
        });
        setUI();
    }

    return {
        $: $, scene: scene, camera: camera, renderer: renderer, controls: controls,
        hemi: hemi, key: key, fill: fill,
        makeLabel: makeLabel, setHint: setHint, relabel: relabelAll, toast: toast,
        setBg: setBg, initFullscreen: initFullscreen,
        onTheme: function (fn) { themeCbs.push(fn); },
        onBg: function (fn) { bgCbs.push(fn); },
        onFrame: function (fn) { frameCbs.push(fn); },
        isDark: function () { return isDark; },
        hooks: hooks,
        setFit: function (fn) { hooks.fit = fn; svlFit = fn; },
        setReset: function (fn) { hooks.reset = fn; },
        setAlign: function (fn) { hooks.align = fn; }
    };
})();
</script>

<script>
/* ==========================================================================
   그때 그 시절의 실험 — 과학사 고전 실험 5종 (오른쪽 탭 전환)
   ========================================================================== */
(function () {
    'use strict';
    var S = window.SVL, $ = S.$, scene = S.scene, camera = S.camera, controls = S.controls;
    var G = 9.8;

    /* ---------------- 공통 재질·도우미 ---------------- */
    function woodMat(c) { return new THREE.MeshStandardMaterial({ color: c || 0xb98a56, roughness: 0.78, metalness: 0.04 }); }
    function brassMat() { return new THREE.MeshStandardMaterial({ color: 0xdcb63f, roughness: 0.36, metalness: 0.42, emissive: 0x2a1d00, emissiveIntensity: 0.4 }); }
    function glassMat(op) {
        return new THREE.MeshStandardMaterial({
            color: 0xd9eefc, roughness: 0.08, metalness: 0.0,
            transparent: true, opacity: op === undefined ? 0.24 : op, depthWrite: false,
            side: THREE.DoubleSide
        });
    }
    function disposeGroup(g) {
        g.traverse(function (o) {
            if (o.geometry) o.geometry.dispose();
            if (o.material) {
                if (Array.isArray(o.material)) o.material.forEach(function (m) { m.dispose(); });
                else o.material.dispose();
            }
        });
    }
    /* 화면이 좁으면(모바일) 같은 시점을 뒤로 물러나 전체가 보이게 한다 */
    function viewFrom(px, py, pz, tx, ty, tz, radius) {
        var t = new THREE.Vector3(tx, ty, tz);
        var p = new THREE.Vector3(px, py, pz);
        var aspect = window.innerWidth / Math.max(1, window.innerHeight);
        var dir = p.clone().sub(t);
        var dist = dir.length();
        if (aspect < 1 && radius) {
            /* 세로 화면: 가로 시야가 좁아지므로 장면 지름이 화면 폭에 들어오는 거리까지 물러난다 */
            var vfov = camera.fov * Math.PI / 180;
            var hfov = 2 * Math.atan(Math.tan(vfov / 2) * aspect);
            var need = radius / Math.sin(Math.min(vfov, hfov) / 2) * 1.06;
            dist = Math.max(dist, need);
        }
        camera.position.copy(dir.normalize().multiplyScalar(dist).add(t));
        controls.target.copy(t);
        controls.update();
    }

    var EXPS = [];
    var cur = 0;

    /* ---------------- 패널 UI ---------------- */
    var tabsEl = $('expTabs'), ctrlEl = $('expControls'), storyEl = $('expStory'),
        readEl = $('expReadout'), noteEl = $('expNote');

    function fmtNum(v, d) { return (Math.round(v * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d); }

    function buildTabs() {
        tabsEl.innerHTML = '';
        EXPS.forEach(function (e, i) {
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'exp-tab' + (i === cur ? ' active' : '');
            b.dataset.idx = String(i);
            b.innerHTML = '<span class="et-year">' + e.year + '</span><span class="et-name">' + e.icon + ' ' + e.tabName + '</span>';
            b.addEventListener('click', function () { selectExp(i); });
            tabsEl.appendChild(b);
        });
    }

    function buildControls(api) {
        ctrlEl.innerHTML = '';
        (api.controls || []).forEach(function (c) {
            if (c.type === 'buttons') {
                var row = document.createElement('div');
                row.className = 'btn-row';
                c.items.forEach(function (it) {
                    var b = document.createElement('button');
                    b.type = 'button';
                    b.className = it.cls || (it.main ? 'btn-main' : 'btn-ghost');
                    b.textContent = it.label;
                    b.addEventListener('click', function () {
                        haptic(12);
                        if (it.action) it.action();
                        api.refresh && api.refresh();
                    });
                    row.appendChild(b);
                });
                ctrlEl.appendChild(row);
                return;
            }
            var wrap = document.createElement('div');
            wrap.className = 'slider-row';
            var head = document.createElement('div');
            head.className = 'slider-head';
            var nm = document.createElement('span'); nm.className = 'slider-name'; nm.textContent = c.label;
            var vl = document.createElement('span'); vl.className = 'slider-val';
            var inp = document.createElement('input');
            inp.type = 'range'; inp.className = 'ctrl-slider';
            inp.min = c.min; inp.max = c.max; inp.step = c.step;
            inp.value = api.state[c.key];
            inp.setAttribute('aria-label', c.label);
            function sync() { vl.textContent = c.fmt ? c.fmt(api.state[c.key]) : api.state[c.key]; }
            sync();
            inp.addEventListener('input', function () {
                api.state[c.key] = parseFloat(inp.value);
                sync();
                if (c.on) c.on(api.state[c.key]);
                api.refresh && api.refresh();
            });
            inp.addEventListener('change', function () { haptic(8); });
            head.appendChild(nm); head.appendChild(vl);
            wrap.appendChild(head); wrap.appendChild(inp);
            ctrlEl.appendChild(wrap);
            c.el = inp; c.sync = sync;
        });
    }

    function renderPanel() {
        var e = EXPS[cur], api = e.api;
        storyEl.innerHTML = e.story;
        buildControls(api);
        noteEl.innerHTML = e.note || '';
        api.refresh && api.refresh();
        Array.prototype.forEach.call(tabsEl.children, function (b, i) {
            b.classList.toggle('active', i === cur);
        });
    }

    function setDataCard(items) {
        var ids = [['d1l', 'd1v'], ['d2l', 'd2v'], ['d3l', 'd3v']];
        items.forEach(function (it, i) {
            if (!ids[i]) return;
            $(ids[i][0]).textContent = it.k;
            $(ids[i][1]).textContent = it.v;
        });
    }

    function selectExp(i) {
        if (i === cur && EXPS[i].api) return;
        cur = i;
        EXPS.forEach(function (e, k) {
            if (e.api) e.api.group.visible = (k === i);
        });
        if (!EXPS[i].api) EXPS[i].api = EXPS[i].build();
        EXPS[i].api.group.visible = true;
        EXPS[i].api.onShow && EXPS[i].api.onShow();
        renderPanel();
        S.setBg(EXPS[i].bgLight || 0xeef4fb, EXPS[i].bgDark || 0x070d16);
        if (window.innerWidth <= 900) document.body.classList.remove('side-open');
        if (EXPS[i].api.align) EXPS[i].api.align();
        S.setHint(EXPS[i].hint, false);
    }

    /* 햅틱(진동) — 지원 기기에서만 짧게, 미지원·iOS Safari에서는 조용히 무시 */
    var HAPTIC_KEY = 'svlHaptic';
    var hapticOn = true;
    try { var hs = localStorage.getItem(HAPTIC_KEY); if (hs === '0') hapticOn = false; } catch (e) { }
    function haptic(ms) {
        try {
            if (window.SVLHaptic) { window.SVLHaptic.tap(Math.max(8, Math.min(25, ms || 12))); return; }
            if (!hapticOn || !navigator.vibrate) return;
            if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            navigator.vibrate(Math.max(8, Math.min(25, ms || 12)));
        } catch (e) { }
    }

    /* ======================================================================
       1) 갈릴레이의 경사면과 낙하 실험 (1604)
       ====================================================================== */
    function buildGalileo() {
        var group = new THREE.Group(); scene.add(group);
        var st = { angle: 12, mass: 60, bell: 6.0, running: false, t: 0, s: 0 };
        var rampLen = 12.0, usable = 11.4;
        var records = [];

        /* 작업대 */
        var bench = new THREE.Mesh(new THREE.BoxGeometry(16, 0.5, 6.4), woodMat(0x8f6338));
        bench.position.set(-1.2, 0.75, 0);
        group.add(bench);
        [-9.2, 6.8].forEach(function (x) {
            [-2.4, 2.4].forEach(function (z) {
                var leg = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.5, 0.5), woodMat(0x744c26));
                leg.position.set(-1.2 + x, 0.25, z);
                group.add(leg);
            });
        });

        /* 경사면 (오른쪽 끝이 경첩) */
        var ramp = new THREE.Group();
        ramp.position.set(3.4, 1.0, 0);
        group.add(ramp);
        var board = new THREE.Mesh(new THREE.BoxGeometry(rampLen, 0.2, 1.5), woodMat(0xbe9159));
        board.position.set(-rampLen / 2, 0, 0);
        ramp.add(board);
        /* 홈(레일) */
        [-0.34, 0.34].forEach(function (z) {
            var rail = new THREE.Mesh(new THREE.BoxGeometry(rampLen, 0.07, 0.09), woodMat(0x9c6b33));
            rail.position.set(-rampLen / 2, 0.13, z);
            ramp.add(rail);
        });
        /* 눈금 */
        for (var d = 1; d <= 11; d++) {
            var tick = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.03, d % 5 === 0 ? 1.3 : 0.4),
                new THREE.MeshStandardMaterial({ color: d % 5 === 0 ? 0x334155 : 0x7a5220, roughness: 0.7 }));
            tick.position.set(-rampLen + 0.6 + d, 0.12, 0);
            ramp.add(tick);
        }
        /* 받침대(기둥) */
        var postH = 0.1;
        var post = new THREE.Mesh(new THREE.BoxGeometry(0.3, 2.6, 0.9), woodMat(0x8a5f2c));
        post.position.set(-rampLen / 2 - 0.4, 0.0, 0);
        post.visible = false;
        ramp.add(post);

        /* 구슬 */
        var ballMat = new THREE.MeshStandardMaterial({ color: 0xc98a3c, roughness: 0.3, metalness: 0.45, emissive: 0x1a0f00, emissiveIntensity: 0.35 });
        var ball = new THREE.Mesh(new THREE.SphereGeometry(0.18, 24, 18), ballMat);
        ball.position.set(-rampLen + 0.6, 0.35, 0);
        ramp.add(ball);

        /* 구간 종 (도달하면 울린다) */
        var bellGrp = new THREE.Group();
        ramp.add(bellGrp);
        var bell = new THREE.Mesh(new THREE.ConeGeometry(0.24, 0.34, 18, 1, false), brassMat());
        bell.rotation.x = Math.PI;
        bell.position.y = 0.42;
        bellGrp.add(bell);
        var bellBall = new THREE.Mesh(new THREE.SphereGeometry(0.055, 10, 8), brassMat());
        bellBall.position.y = 0.28;
        bellGrp.add(bellBall);
        var bellRing = new THREE.Mesh(new THREE.RingGeometry(0.3, 0.42, 32),
            new THREE.MeshBasicMaterial({ color: 0xfacc15, transparent: true, opacity: 0, side: THREE.DoubleSide }));
        bellRing.position.y = 0.45;
        bellGrp.add(bellRing);

        /* 물시계 */
        var clock = new THREE.Group();
        clock.position.set(-4.6, 1.0, 2.2);
        group.add(clock);
        var jar = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.5, 1.5, 22, 1, true), glassMat(0.3));
        jar.position.y = 0.75;
        clock.add(jar);
        var water = new THREE.Mesh(new THREE.CylinderGeometry(0.56, 0.46, 1.4, 22),
            new THREE.MeshStandardMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.72, roughness: 0.2 }));
        water.position.y = 0.72;
        clock.add(water);
        var tap = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.5, 10), brassMat());
        tap.rotation.z = Math.PI / 2;
        tap.position.set(0, 0.16, 0.62);
        clock.add(tap);

        var drop = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.4, 10),
            new THREE.MeshStandardMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.6 }));
        drop.position.set(0, 0.0, 0.9);
        drop.visible = false;
        clock.add(drop);

        /* 라벨 */
        var lb1 = S.makeLabel('구간 종', '#8a5f2c', 1.5); lb1.position.set(0, 1.5, 0); bellGrp.add(lb1);
        var lb2 = S.makeLabel('물시계 (시간 측정)', '#0369a1', 2.4); lb2.position.set(0, 2.2, 0); clock.add(lb2);
        var lb3 = S.makeLabel('나무 경사면', '#8a5f2c', 1.9); lb3.position.set(-6, 1.1, 1.0); ramp.add(lb3);

        /* 상태 적용 */
        function applyRamp() {
            var th = st.angle * Math.PI / 180;
            ramp.rotation.z = -th;
            /* 높은 쪽 받침대 */
            var topY = Math.sin(th) * (rampLen - 0.6);
            post.visible = true;
            post.scale.y = Math.max(0.12, topY / 2.6);
            post.position.set(-rampLen + 0.5, -topY / 2 + 0.02, 0);
            /* 구슬·종 위치 */
            placeBall(st.s);
            bellGrp.position.set(-rampLen + 0.6 + st.bell, 0.12, 0);
        }
        function placeBall(s) {
            var x = -rampLen + 0.6 + Math.max(0, Math.min(usable, s));
            ball.position.set(x, 0.34, 0);
        }
        function accel() { return (5 / 7) * G * Math.sin(st.angle * Math.PI / 180); }

        function record(s, t) {
            records.push({ s: s, t: t });
            if (records.length > 6) records.shift();
            drawGraph();
        }

        /* 그래프 (t² – s) */
        var cv = $('graphCanvas');
        function drawGraph() {
            var g = cv.getContext('2d');
            var W = cv.width, H = cv.height;
            var dark = S.isDark();
            g.clearRect(0, 0, W, H);
            g.fillStyle = dark ? '#0f172a' : '#f8fafc';
            g.fillRect(0, 0, W, H);
            var padL = 46, padB = 34, padT = 16, padR = 12;
            var a = accel();
            var maxT2 = Math.max(1, Math.pow(Math.sqrt(2 * usable / a), 2)) * 1.1;
            var maxS = usable * 1.06;
            function X(t2) { return padL + (t2 / maxT2) * (W - padL - padR); }
            function Y(s) { return H - padB - (s / maxS) * (H - padB - padT); }
            g.strokeStyle = dark ? 'rgba(255,255,255,0.22)' : 'rgba(15,23,42,0.18)';
            g.lineWidth = 2;
            g.beginPath(); g.moveTo(padL, padT); g.lineTo(padL, H - padB); g.lineTo(W - padR, H - padB); g.stroke();
            g.fillStyle = dark ? '#94a3b8' : '#64748b';
            g.font = 'bold 20px SeoulNamsan, sans-serif';
            g.fillText('t² (s²)', W - padR - 90, H - padB + 26);
            g.fillText('s (m)', padL - 38, padT + 6);
            g.fillText('0', padL - 16, H - padB + 6);
            g.fillText(maxT2.toFixed(1), W - padR - 24, H - padB + 22);
            g.fillText(maxS.toFixed(0), padL - 40, padT + 22);
            /* 이론 직선 s = ½ a t² */
            g.strokeStyle = '#f59e0b';
            g.lineWidth = 3;
            g.beginPath(); g.moveTo(X(0), Y(0)); g.lineTo(X(maxT2), Y(Math.min(maxS, 0.5 * a * maxT2))); g.stroke();
            /* 측정 점 */
            records.forEach(function (r) {
                var t2 = r.t * r.t;
                if (t2 > maxT2) return;
                g.fillStyle = '#2563eb';
                g.beginPath(); g.arc(X(t2), Y(r.s), 8, 0, Math.PI * 2); g.fill();
                g.strokeStyle = '#fff'; g.lineWidth = 2.5; g.stroke();
            });
        }

        var api = {
            group: group, state: st,
            controls: [
                {
                    key: 'angle', label: '경사각', min: 5, max: 25, step: 1,
                    fmt: function (v) { return v + '°'; },
                    on: function () { applyRamp(); api.refresh(); }
                },
                {
                    key: 'mass', label: '구슬 질량', min: 20, max: 120, step: 10,
                    fmt: function (v) { return v + ' g'; },
                    on: function (v) { ball.scale.setScalar(0.74 + v / 260); }
                },
                {
                    key: 'bell', label: '구간 종 위치', min: 1, max: 11, step: 0.5,
                    fmt: function (v) { return v.toFixed(1) + ' m'; },
                    on: function () { bellGrp.position.set(-rampLen + 0.6 + st.bell, 0.12, 0); }
                },
                {
                    type: 'buttons',
                    items: [
                        {
                            label: '▶ 구슬 놓기', main: true, action: function () {
                                if (st.running) return;
                                st.running = true; st.t = 0; st.s = 0; st.passed = false;
                                drop.visible = true;
                                S.setHint('⚖️ 물시계로 시간을 재며 구슬이 굴러갑니다. 종을 지날 때와 바닥에 닿을 때 거리를 기록하세요.', false);
                            }
                        },
                        {
                            label: '📈 기록 보기', action: function () {
                                $('subPanel').classList.add('show'); drawGraph();
                            }
                        }
                    ]
                }
            ],
            refresh: function () {
                var a = accel();
                readEl.innerHTML =
                    '<div class="ro-row"><span class="ro-k">이론 가속도 a = 5/7·g·sinθ</span><span class="ro-v">' + fmtNum(a, 2) + ' m/s²</span></div>' +
                    '<div class="ro-row"><span class="ro-k">지난 시간</span><span class="ro-v">' + fmtNum(st.t, 2) + ' s</span></div>' +
                    '<div class="ro-row"><span class="ro-k">이동 거리</span><span class="ro-v">' + fmtNum(st.s, 2) + ' m</span></div>' +
                    (records.length ? records.slice(-3).map(function (r) {
                        return '<div class="ro-row"><span class="ro-k">s=' + fmtNum(r.s, 1) + ' m → t</span><span class="ro-v">' + fmtNum(r.t, 2) + ' s (s÷t²=' + fmtNum(r.s / (r.t * r.t), 2) + ')</span></div>';
                    }).join('') : '<div class="ro-row"><span class="ro-k">측정 기록</span><span class="ro-v">구슬을 놓아 보세요</span></div>');
                setDataCard([
                    { k: '연도', v: '1604' },
                    { k: '가속도', v: fmtNum(a, 2) + ' m/s²' },
                    { k: '상태', v: st.running ? '구르는 중' : '대기' }
                ]);
            },
            update: function (dt) {
                bellRing.material.opacity = Math.max(0, bellRing.material.opacity - dt * 1.6);
                if (!st.running) return;
                var a = accel();
                st.t += dt;
                st.s = 0.5 * a * st.t * st.t;
                if (!st.passed && st.s >= st.bell) {
                    st.passed = true;
                    bellRing.material.opacity = 0.95;
                    haptic(18);
                }
                if (st.s >= usable) {
                    st.s = usable; st.running = false;
                    drop.visible = false;
                    record(usable, st.t);
                    haptic(20);
                }
                ball.rotation.z -= (st.s - (ball.userData.prevS || 0)) / 0.18;
                ball.userData.prevS = st.s;
                placeBall(st.s);
                /* 물시계 수위 */
                var tFull = Math.sqrt(2 * usable / a);
                var lvl = Math.max(0.02, 1 - st.t / tFull);
                water.scale.y = lvl;
                water.position.y = 0.1 + 0.7 * lvl;
                if (!api._lastT || st.t - api._lastT > 0.08) { api._lastT = st.t; api.refresh(); }
            },
            reset: function () {
                st.running = false; st.t = 0; st.s = 0; st.passed = false;
                ball.userData.prevS = 0;
                water.scale.y = 1; water.position.y = 0.72;
                drop.visible = false;
                placeBall(0);
                bellRing.material.opacity = 0;
                api.refresh();
            },
            align: function () {
                viewFrom(6.0, 6.6, 13.6, -1.4, 2.6, 0, 9.0);
                controls.update();
            },
            onShow: function () { applyRamp(); api.refresh(); },
            drawGraph: drawGraph
        };
        applyRamp();
        ball.scale.setScalar(0.74 + st.mass / 260);
        /* 종 위치 초기화는 applyRamp에서 */
        group.visible = false;
        return api;
    }

    /* ======================================================================
       2) 토리첼리의 수은 기압계 (1643)
       ====================================================================== */
    function buildTorricelli() {
        var group = new THREE.Group(); scene.add(group);
        var st = { pressure: 760, tilt: 0 };
        var U = 0.06;            /* 1 cm = 0.06 unit → 100 cm = 6 unit */
        var TUBE_L = 6.0;        /* 1 m 유리관 */

        /* 받침 테이블 */
        var table = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.6, 0.24, 40), woodMat(0xa9793f));
        table.position.set(0, 0.72, 0);
        group.add(table);
        var stem = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.44, 0.72, 20), woodMat(0x8a5f2c));
        stem.position.set(0, 0.36, 0);
        group.add(stem);

        /* 수은 수조 */
        var dishGlass = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 0.62, 34, 1, true), glassMat(0.28));
        dishGlass.position.set(0, 1.15, 0);
        group.add(dishGlass);
        var hgMat = new THREE.MeshStandardMaterial({ color: 0x8b99a8, roughness: 0.18, metalness: 0.55, emissive: 0x131a22, emissiveIntensity: 0.5 });
        var dishHg = new THREE.Mesh(new THREE.CylinderGeometry(1.44, 1.44, 0.5, 34), hgMat);
        dishHg.position.set(0, 1.09, 0);
        group.add(dishHg);

        /* 유리관 (아래가 열려 수조에 잠김) */
        var tubePivot = new THREE.Group();
        tubePivot.position.set(0, 1.45, 0);
        group.add(tubePivot);
        var tube = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, TUBE_L, 24, 1, true), glassMat(0.14));
        tube.position.set(0, TUBE_L / 2, 0);
        tubePivot.add(tube);
        /* 수은 기둥 */
        var hgCol = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1, 20), hgMat);
        hgCol.position.set(0, 0.5, 0);
        tubePivot.add(hgCol);
        /* 진공 영역 표시 */
        var vac = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1, 20),
            new THREE.MeshBasicMaterial({ color: 0x60a5fa, transparent: true, opacity: 0.22, depthWrite: false }));
        vac.position.set(0, 0.5, 0);
        tubePivot.add(vac);

        /* 눈금자 */
        var ruler = new THREE.Group();
        ruler.position.set(1.5, 1.45, 0.2);
        group.add(ruler);
        var rulerBody = new THREE.Mesh(new THREE.BoxGeometry(0.3, TUBE_L + 0.2, 0.06), woodMat(0xf0e6c8));
        rulerBody.position.set(0, TUBE_L / 2, 0);
        ruler.add(rulerBody);
        for (var cm = 0; cm <= 100; cm += 10) {
            var isBig = cm % 50 === 0 || cm === 76;
            var tick = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.012, 0.02),
                new THREE.MeshBasicMaterial({ color: cm === 76 ? 0xdc2626 : 0x3f3f46 }));
            tick.position.set(-0.06, cm * U, 0.035);
            ruler.add(tick);
            if (isBig) {
                var lb = S.makeLabel(cm + ' cm', cm === 76 ? '#b91c1c' : '#3f3f46', 1.35);
                lb.position.set(-0.05, cm * U, 0.1);
                ruler.add(lb);
            }
        }
        /* 76 cm 기준선 */
        var redLine = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.018, 0.018),
            new THREE.MeshBasicMaterial({ color: 0xdc2626 }));
        redLine.position.set(-0.15, 76 * U, 0.04);
        ruler.add(redLine);

        var lbVac = S.makeLabel('토리첼리 진공', '#1d4ed8', 2.0);
        lbVac.position.set(0, 1, 0);
        tubePivot.add(lbVac);
        var lbHg = S.makeLabel('수은 기둥', '#475569', 1.7);
        lbHg.position.set(-0.9, 1, 0);
        tubePivot.add(lbHg);
        var lbAir = S.makeLabel('대기압이 수은을 밀어 올림', '#0369a1', 1.9);
        lbAir.position.set(-0.4, 0.9, 2.2);
        group.add(lbAir);

        function apply() {
            var h_mm = st.pressure;                       /* mmHg */
            var h = (h_mm / 10) * U;                      /* 수직 높이(unit) — 1 cm = U */
            var phi = st.tilt * Math.PI / 180;
            var needAlong = h / Math.cos(phi);             /* 관을 따라 필요한 수은 길이 */
            var full = needAlong >= TUBE_L;
            var along = Math.min(TUBE_L, needAlong);

            tubePivot.rotation.z = -phi;
            hgCol.scale.y = along;
            hgCol.position.y = along / 2;
            hgCol.visible = true;

            var vacLen = TUBE_L - along;
            vac.scale.y = Math.max(0.001, vacLen);
            vac.position.y = along + vacLen / 2;
            vac.visible = vacLen > 0.02;

            lbVac.visible = vacLen > 0.4;
            lbVac.position.set(0, along + vacLen / 2, 0.36);
            lbHg.visible = along > 0.6;
            lbHg.position.set(-0.95, along * 0.55, 0.2);

            api.readout = {
                h: h_mm, along: along / U * 10, full: full, vac: vacLen / U * 10
            };
            api.refresh();
        }

        var api = {
            group: group, state: st,
            controls: [
                {
                    key: 'pressure', label: '외부 기압', min: 700, max: 790, step: 1,
                    fmt: function (v) { return v + ' mmHg'; },
                    on: apply
                },
                {
                    key: 'tilt', label: '관 기울기', min: 0, max: 60, step: 1,
                    fmt: function (v) { return v + '°'; },
                    on: apply
                },
                {
                    type: 'buttons',
                    items: [
                        {
                            label: '🌤 표준 대기압(760)', main: true, action: function () {
                                st.pressure = 760; st.tilt = 0; syncSliders(); apply();
                            }
                        },
                        {
                            label: '⛰ 고산(700)', action: function () {
                                st.pressure = 700; syncSliders(); apply();
                            }
                        }
                    ]
                }
            ],
            refresh: function () {
                var r = api.readout || { h: 760, along: 760, vac: 240, full: false };
                readEl.innerHTML =
                    '<div class="ro-row"><span class="ro-k">수은 기둥 수직 높이</span><span class="ro-v">' + fmtNum(r.h, 0) + ' mm (' + fmtNum(r.h / 10, 1) + ' cm)</span></div>' +
                    '<div class="ro-row"><span class="ro-k">관을 따라간 수은 길이</span><span class="ro-v">' + fmtNum(Math.min(r.along, 1000), 0) + ' mm</span></div>' +
                    '<div class="ro-row ' + (r.full ? 'bad' : 'good') + '"><span class="ro-k">진공(빈 공간)</span><span class="ro-v">' + (r.full ? '관이 가득 참' : fmtNum(r.vac, 0) + ' mm') + '</span></div>' +
                    '<div class="ro-row"><span class="ro-k">기압 환산</span><span class="ro-v">' + fmtNum(r.h * 1013.25 / 760, 0) + ' hPa</span></div>';
                setDataCard([
                    { k: '연도', v: '1643' },
                    { k: '수은 높이', v: fmtNum(r.h, 0) + ' mm' },
                    { k: '진공', v: r.full ? '없음' : '있음' }
                ]);
            },
            update: function () { },
            reset: function () {
                st.pressure = 760; st.tilt = 0; syncSliders(); apply();
            },
            align: function () {
                viewFrom(6.4, 4.6, 11.0, 0, 4.2, 0, 4.8);
                controls.update();
            },
            onShow: function () { apply(); }
        };
        function syncSliders() {
            api.controls.forEach(function (c) {
                if (c.el) { c.el.value = st[c.key]; c.sync(); }
            });
        }
        api.sync = syncSliders;
        api.readout = null;
        apply();
        group.visible = false;
        return api;
    }

    /* ======================================================================
       3) 뉴턴의 프리즘 빛 분산 (1666)
       ====================================================================== */
    function buildNewton() {
        var group = new THREE.Group(); scene.add(group);
        var st = { angle: 0, slit: 1.0, composite: false, zoom: 1 };

        var COLORS = [
            { n: '빨강', nm: 700, hex: 0xff2d2d, w: 0x7f0000 },
            { n: '주황', nm: 620, hex: 0xff8a1f, w: 0x7a3d00 },
            { n: '노랑', nm: 580, hex: 0xffe11a, w: 0x7a6a00 },
            { n: '초록', nm: 530, hex: 0x3ddc5a, w: 0x00601a },
            { n: '파랑', nm: 470, hex: 0x2f7dff, w: 0x002a7f },
            { n: '남색', nm: 445, hex: 0x3b3bff, w: 0x000f7f },
            { n: '보라', nm: 410, hex: 0x9b4dff, w: 0x3d0078 }
        ];

        /* 방 바닥 */
        var floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 22),
            new THREE.MeshStandardMaterial({ color: 0x2a2f3a, roughness: 0.95 }));
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = 0;
        group.add(floor);

        /* 창문(틈) 벽 */
        var wallMat = new THREE.MeshStandardMaterial({ color: 0x39414f, roughness: 0.9 });
        var wall = new THREE.Mesh(new THREE.BoxGeometry(0.4, 9, 14), wallMat);
        wall.position.set(-7.4, 4.5, 0);
        group.add(wall);
        var slit = new THREE.Mesh(new THREE.BoxGeometry(0.45, 2.4, 0.35),
            new THREE.MeshBasicMaterial({ color: 0xfffbe8 }));
        slit.position.set(-7.35, 4.4, 0);
        group.add(slit);
        var lbWin = S.makeLabel('창문 틈으로 들어온 햇빛', '#fde68a', 2.6);
        lbWin.position.set(-4.4, 7.3, 1.8);
        group.add(lbWin);

        /* 입사 백색광 */
        var inBeam = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, 6.6, 12),
            new THREE.MeshBasicMaterial({ color: 0xfff9e6, transparent: true, opacity: 0.94 }));
        inBeam.rotation.z = Math.PI / 2;
        inBeam.position.set(-3.9, 4.4, 0);
        group.add(inBeam);

        /* 프리즘 1 */
        var prismMat = new THREE.MeshStandardMaterial({
            color: 0xcfe9ff, roughness: 0.08, metalness: 0.1, transparent: true, opacity: 0.34,
            side: THREE.DoubleSide
        });
        var prism1 = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 2.6, 3), prismMat);
        prism1.position.set(-0.9, 4.4, 0);
        group.add(prism1);
        var prismEdge = new THREE.LineSegments(new THREE.EdgesGeometry(prism1.geometry),
            new THREE.LineBasicMaterial({ color: 0x93c5fd, transparent: true, opacity: 0.85 }));
        prismEdge.position.copy(prism1.position);
        group.add(prismEdge);

        /* 스크린 */
        var screen = new THREE.Mesh(new THREE.PlaneGeometry(4.6, 5.4),
            new THREE.MeshStandardMaterial({ color: 0xf5f5f4, roughness: 0.95 }));
        screen.rotation.y = -Math.PI / 2;
        screen.position.set(6.2, 3.9, 0);
        group.add(screen);

        /* 스크린 위 스펙트럼 (캔버스 텍스처) */
        var specCv = document.createElement('canvas');
        specCv.width = 64; specCv.height = 512;
        var specTex = new THREE.CanvasTexture(specCv);
        var specMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 3.0),
            new THREE.MeshBasicMaterial({ map: specTex, transparent: true }));
        specMesh.rotation.y = -Math.PI / 2;
        specMesh.position.set(6.18, 4.05, 0);
        group.add(specMesh);

        function paintSpectrum(width, white) {
            var g = specCv.getContext('2d');
            g.clearRect(0, 0, 64, 512);
            if (white) {
                g.fillStyle = '#ffffff';
                g.fillRect(18, 210, 28, 92);
            } else {
                var hh = Math.max(30, Math.min(470, width));
                var y0 = 256 - hh / 2;
                COLORS.forEach(function (c, i) {
                    g.fillStyle = '#' + ('000000' + c.hex.toString(16)).slice(-6);
                    g.fillRect(10, y0 + i * (hh / COLORS.length), 44, hh / COLORS.length + 1);
                });
            }
            specTex.needsUpdate = true;
        }

        /* 광선 묶음 */
        var beamGroup = new THREE.Group();
        group.add(beamGroup);
        var beams = [];
        COLORS.forEach(function (c) {
            var m = new THREE.MeshBasicMaterial({ color: c.hex, transparent: true, opacity: 0.85 });
            var b = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 1, 8), m);
            beamGroup.add(b);
            beams.push({ mesh: b, color: c });
        });

        /* 합성용 프리즘 2 */
        var prism2 = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.0, 2.6, 3), prismMat.clone());
        prism2.position.set(3.0, 4.4, 0);
        prism2.visible = false;
        group.add(prism2);
        var prism2Edge = new THREE.LineSegments(new THREE.EdgesGeometry(prism2.geometry),
            new THREE.LineBasicMaterial({ color: 0x6ee7b7, transparent: true, opacity: 0.9 }));
        prism2Edge.position.copy(prism2.position);
        prism2Edge.visible = false;
        group.add(prism2Edge);
        var outBeam = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 3.2, 12),
            new THREE.MeshBasicMaterial({ color: 0xfff9e6, transparent: true, opacity: 0.9 }));
        outBeam.rotation.z = Math.PI / 2;
        outBeam.position.set(4.9, 3.9, 0);
        outBeam.visible = false;
        group.add(outBeam);

        var lbP1 = S.makeLabel('삼각 유리 프리즘', '#93c5fd', 2.2);
        lbP1.position.set(-0.9, 6.4, 0);
        group.add(lbP1);
        var lbP2 = S.makeLabel('두 번째 프리즘 (합성)', '#a7f3d0', 2.4);
        lbP2.position.set(3.0, 6.4, 0);
        group.add(lbP2);
        var lbScreen = S.makeLabel('스크린', '#e2e8f0', 1.3);
        lbScreen.position.set(6.2, 7.0, 0);
        group.add(lbScreen);
        var lbSpec = S.makeLabel('무지개 스펙트럼', '#fde68a', 2.2);
        lbSpec.position.set(5.2, 5.6, 3.0);
        group.add(lbSpec);

        /* 물리: 코시 공식으로 굴절률 → 최소편차각 */
        function nOf(nm) {
            var um = nm / 1000;
            return 1.5046 + 0.00420 / (um * um);
        }
        function deviation(nm) {
            var A = Math.PI / 3;                       /* 꼭지각 60° */
            var n = nOf(nm);
            var t = Math.min(0.999, n * Math.sin(A / 2));
            return 2 * Math.asin(t) - A;               /* 라디안, 최소편차 근사 */
        }
        var EXG = 6;   /* 화면에서 잘 보이도록 색 벡터를 6배로 확대 (확대 모드에서는 12배) */

        function setBeam(mesh, from, to) {
            var dir = new THREE.Vector3().subVectors(to, from);
            var len = dir.length();
            if (len < 0.001) { mesh.visible = false; return; }
            mesh.visible = true;
            mesh.position.copy(from).addScaledVector(dir, 0.5);
            mesh.scale.set(1, len, 1);
            mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
        }

        function apply() {
            EXG = 6 * (st.zoom || 1);
            var rotY = st.angle * Math.PI / 180;
            prism1.rotation.y = rotY;
            prism2.rotation.y = -rotY;
            var base = -6 * Math.PI / 180;    /* 기준 편차(아래쪽) */
            var exitPt = new THREE.Vector3(-0.25, 4.28, 0);
            var d0 = deviation(580), dV = deviation(410);
            var spread = (dV - d0) * EXG;
            var comp = st.composite;
            prism2.visible = comp;
            prism2Edge.visible = comp;
            prism1.rotation.y = rotY; prismEdge.rotation.y = rotY;
            prism2.rotation.y = -rotY; prism2Edge.rotation.y = -rotY;
            lbP2.visible = comp;
            outBeam.visible = comp;
            specMesh.visible = true;

            beams.forEach(function (b) {
                var nm = b.color.nm;
                var dev = base - (deviation(nm) - d0) * EXG - spread / 2;
                var from = exitPt.clone();
                if (comp) {
                    setBeam(b.mesh, from, new THREE.Vector3(3.0, 4.32, 0));
                } else {
                    setBeam(b.mesh, from, new THREE.Vector3(6.15, 4.28 + Math.tan(dev) * 6.3, 0));
                }
                b.mesh.scale.x = 0.7 + st.slit * 0.5;
                b.mesh.scale.z = b.mesh.scale.x;
            });
            if (comp) {
                setBeam(outBeam, new THREE.Vector3(3.75, 4.15, 0), new THREE.Vector3(6.15, 3.95, 0));
                paintSpectrum(0, true);
                specMesh.position.set(6.18, 3.9, 0);
                lbSpec.userData.label.text = '다시 합쳐진 백색광';
            } else {
                paintSpectrum(Math.max(60, 250 * (0.55 + st.slit * 0.45)), false);
                specMesh.position.set(6.18, 4.05, 0);
                lbSpec.userData.label.text = '무지개 스펙트럼';
            }
            S.relabel();
            api.spreadDeg = spread * 180 / Math.PI;
            api.refresh();
        }

        var api = {
            group: group, state: st,
            controls: [
                {
                    key: 'angle', label: '프리즘 각도', min: 0, max: 40, step: 1,
                    fmt: function (v) { return v + '°'; },
                    on: apply
                },
                {
                    key: 'slit', label: '창문 틈 폭', min: 0.5, max: 3, step: 0.1,
                    fmt: function (v) { return v.toFixed(1) + ' mm'; },
                    on: apply
                },
                {
                    type: 'buttons',
                    items: [
                        {
                            label: '🔀 두 번째 프리즘 켜기', main: true, action: function () {
                                st.composite = !st.composite; apply();
                                S.setHint(st.composite
                                    ? '✅ 갈라진 7색 빛을 두 번째 프리즘으로 다시 모으면 백색광이 됩니다. 색은 없어지지 않고 다시 섞일 뿐입니다.'
                                    : '🌈 프리즘 하나로 햇빛이 7색으로 갈라집니다. 색마다 꺾이는 정도가 다르기 때문입니다.', false);
                            }
                        },
                        {
                            label: '🔍 분산 확대', action: function () {
                                st.zoom = st.zoom === 1 ? 2 : 1; apply();
                                S.setHint(st.zoom === 2 ? '🔍 화면에 보이도록 색 벌어짐을 12배로 크게 표시합니다.' : '🔍 색 벌어짐을 6배 표시로 되돌렸습니다.', false);
                            }
                        }
                    ]
                }
            ],
            refresh: function () {
                var deg = api.spreadDeg || 0;
                readEl.innerHTML =
                    '<div class="ro-row"><span class="ro-k">프리즘 꼭지각</span><span class="ro-v">60°</span></div>' +
                    '<div class="ro-row"><span class="ro-k">색 벌어짐 (표시 ×' + (6 * st.zoom) + ')</span><span class="ro-v">' + fmtNum(deg, 1) + '°</span></div>' +
                    '<div class="ro-row"><span class="ro-k">굴절률 n (700 nm)</span><span class="ro-v">' + fmtNum(nOf(700), 4) + '</span></div>' +
                    '<div class="ro-row"><span class="ro-k">굴절률 n (410 nm)</span><span class="ro-v">' + fmtNum(nOf(410), 4) + '</span></div>' +
                    '<div class="ro-row ' + (st.composite ? 'good' : '') + '"><span class="ro-k">두 번째 프리즘</span><span class="ro-v">' + (st.composite ? '켜짐 · 백색광 합성' : '꺼짐') + '</span></div>';
                setDataCard([
                    { k: '연도', v: '1666' },
                    { k: '색 벌어짐', v: fmtNum(deg, 1) + '°' },
                    { k: '상태', v: st.composite ? '백색광 합성' : '7색 분산' }
                ]);
            },
            update: function () { },
            reset: function () {
                st.angle = 0; st.slit = 1.0; st.composite = false; st.zoom = 1;
                api.controls.forEach(function (c) { if (c.el) { c.el.value = st[c.key]; c.sync(); } });
                apply(); S.setBg(0x0b0f16, 0x04070c);
            },
            align: function () {
                viewFrom(3.4, 8.4, 15.4, 1.8, 4.2, 0, 7.6);
                controls.update();
            },
            onShow: function () { apply(); }
        };
        api.spreadDeg = 0;
        apply();
        group.visible = false;
        return api;
    }

    /* ======================================================================
       4) 파스퇴르의 백조목 플라스크 (1859)
       ====================================================================== */
    function buildPasteur() {
        var group = new THREE.Group(); scene.add(group);
        var st = { days: 0, broken: false };

        /* 실험대 */
        var bench = new THREE.Mesh(new THREE.BoxGeometry(12, 0.4, 5), woodMat(0x9c6b33));
        bench.position.set(0, 0.94, 0);
        group.add(bench);
        [-4.6, 4.6].forEach(function (x) {
            [-1.7, 1.7].forEach(function (z) {
                var leg = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.9, 0.36), woodMat(0x7c5226));
                leg.position.set(x, 0.3, z);
                group.add(leg);
            });
        });

        function makeFlask(x, swan) {
            var f = new THREE.Group();
            f.position.set(x, 1.14, 0);
            group.add(f);
            var bodyMat = glassMat(0.26);
            var body = new THREE.Mesh(new THREE.SphereGeometry(0.82, 30, 22), bodyMat);
            body.scale.set(1, 0.92, 1);
            body.position.y = 0.82;
            f.add(body);
            var base = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.46, 0.24, 22), bodyMat);
            base.position.y = 0.1;
            f.add(base);
            var broth = new THREE.Mesh(new THREE.SphereGeometry(0.72, 26, 18),
                new THREE.MeshStandardMaterial({ color: 0xf0c14b, roughness: 0.35, transparent: true, opacity: 0.78 }));
            broth.scale.set(1, 0.72, 1);
            broth.position.y = 0.62;
            f.add(broth);

            /* 목 */
            var neck;
            if (swan) {
                var curve = new THREE.CatmullRomCurve3([
                    new THREE.Vector3(0, 1.42, 0),
                    new THREE.Vector3(0.02, 2.10, 0),
                    new THREE.Vector3(0.62, 2.52, 0),
                    new THREE.Vector3(1.20, 2.30, 0),
                    new THREE.Vector3(1.05, 1.72, 0),
                    new THREE.Vector3(1.55, 1.42, 0),
                    new THREE.Vector3(2.05, 1.62, 0)
                ]);
                neck = new THREE.Mesh(new THREE.TubeGeometry(curve, 80, 0.105, 12, false), glassMat(0.3));
                f.add(neck);
                f.userData.neckCurve = curve;
            } else {
                neck = new THREE.Mesh(new THREE.CylinderGeometry(0.105, 0.13, 1.6, 14), bodyMat);
                neck.position.set(0, 2.1, 0);
                f.add(neck);
            }
            f.userData.neck = neck;
            f.userData.broth = broth;
            f.userData.body = body;
            f.userData.broken = false;
            return f;
        }

        var swanFlask = makeFlask(-2.4, true);
        var straightFlask = makeFlask(2.4, false);

        /* 먼지(미생물) 입자 */
        function makeDust(count, color) {
            var arr = [];
            var g = new THREE.Group();
            group.add(g);
            for (var i = 0; i < count; i++) {
                var m = new THREE.Mesh(new THREE.SphereGeometry(0.028, 6, 5),
                    new THREE.MeshBasicMaterial({ color: color || 0x8b5e3c, transparent: true, opacity: 0.85 }));
                m.visible = false;
                g.add(m);
                arr.push({ mesh: m, t: Math.random(), speed: 0.06 + Math.random() * 0.08, lane: (Math.random() - 0.5) * 0.1 });
            }
            return { group: g, list: arr };
        }
        var dustSwan = makeDust(26, 0x8b5e3c);
        var dustStraight = makeDust(18, 0x8b5e3c);
        var dustPile = new THREE.Mesh(new THREE.SphereGeometry(0.20, 14, 10),
            new THREE.MeshStandardMaterial({ color: 0x8b5e3c, roughness: 0.9 }));
        dustPile.position.set(-2.4 + 1.42, 1.14 + 1.62, 0);
        dustPile.visible = false;
        group.add(dustPile);

        /* 라벨 */
        var lbSwan = S.makeLabel('백조목 플라스크', '#0369a1', 2.3);
        lbSwan.position.set(-2.4, 4.2, 0);
        group.add(lbSwan);
        var lbStraight = S.makeLabel('목을 꺾은(곧은) 플라스크', '#0369a1', 3.0);
        lbStraight.position.set(2.4, 4.2, 0);
        group.add(lbStraight);
        var lbPile = S.makeLabel('먼지가 S자 굽이에 가라앉음', '#7c2d12', 3.0);
        lbPile.position.set(-2.4 + 1.42, 1.14 + 2.30, 0);
        group.add(lbPile);

        function turbidity(days) {
            /* 0 → 맑음, 1 → 탁함 */
            if (days <= 0) return 0;
            return Math.max(0, Math.min(1, (days - 1) / 5));
        }
        function applyBroth() {
            var swanT = st.broken ? turbidity(st.days) : 0;
            var strT = turbidity(st.days);
            var clear = new THREE.Color(0xf0c14b), muddy = new THREE.Color(0xe4e0cf);
            swanFlask.userData.broth.material.color.copy(clear).lerp(muddy, swanT);
            swanFlask.userData.broth.material.opacity = 0.78 + swanT * 0.18;
            straightFlask.userData.broth.material.color.copy(clear).lerp(muddy, strT);
            straightFlask.userData.broth.material.opacity = 0.78 + strT * 0.18;
            dustPile.visible = !st.broken && st.days > 0;
            lbPile.visible = !st.broken && st.days > 0;
            if (swanFlask.userData.neck) swanFlask.userData.neck.visible = !st.broken;
            api.refresh();
        }

        function updateDust(dt) {
            var curve = swanFlask.userData.neckCurve;
            dustSwan.list.forEach(function (p) {
                if (st.broken) { p.mesh.visible = false; return; }
                p.t += dt * p.speed;
                if (p.t > 1) p.t = 0;
                var at = new THREE.Vector3();
                curve.getPoint(Math.min(0.62, p.t), at);
                p.mesh.visible = true;
                p.mesh.position.set(-2.4 + at.x + p.lane, 1.14 + at.y - 0.15, p.lane * 2);
                p.mesh.material.opacity = 0.35 + 0.5 * Math.sin(p.t * Math.PI);
            });
            dustStraight.list.forEach(function (p) {
                p.t += dt * p.speed;
                if (p.t > 1) p.t = 0;
                var y = 1.14 + 3.0 - p.t * 1.6;
                p.mesh.visible = true;
                p.mesh.position.set(2.4 + p.lane, y, p.lane * 2);
                p.mesh.material.opacity = 0.3 + 0.55 * Math.sin(p.t * Math.PI);
            });
        }

        var api = {
            group: group, state: st,
            controls: [
                {
                    key: 'days', label: '경과 일수', min: 0, max: 30, step: 1,
                    fmt: function (v) { return v + '일'; },
                    on: applyBroth
                },
                {
                    type: 'buttons',
                    items: [
                        {
                            label: '🔥 가열 멸균', main: true, action: function () {
                                st.days = 0; syncDays(); applyBroth();
                                S.setHint('🔥 육수를 끓여 모든 미생물을 없앴습니다. 이제 공기 중 먼지만 들어올 수 있습니다.', false);
                            }
                        },
                        {
                            label: '✂️ 백조목 자르기', cls: 'btn-ghost warn', action: function () {
                                st.broken = true; applyBroth();
                                S.setHint('✂️ S자 굽이를 잘라내자 먼지가 곧장 육수로 떨어집니다. 며칠 뒤 육수가 탁해집니다.', false);
                            }
                        }
                    ]
                }
            ],
            refresh: function () {
                var swanT = st.broken ? turbidity(st.days) : 0;
                var strT = turbidity(st.days);
                function word(t) { return t < 0.25 ? '맑음' : (t < 0.7 ? '조금 탁함' : '탁함'); }
                readEl.innerHTML =
                    '<div class="ro-row ' + (swanT < 0.25 ? 'good' : 'bad') + '"><span class="ro-k">백조목 플라스크</span><span class="ro-v">' + (st.broken ? '목 잘림 · ' : '') + word(swanT) + '</span></div>' +
                    '<div class="ro-row ' + (strT < 0.25 ? 'good' : 'bad') + '"><span class="ro-k">곧은 목 플라스크</span><span class="ro-v">' + word(strT) + '</span></div>' +
                    '<div class="ro-row"><span class="ro-k">먼지가 닿는가</span><span class="ro-v">' + (st.broken ? 'S굽이 없음 · 닿음' : 'S굽이에서 멈춤 · 안 닿음') + '</span></div>' +
                    '<div class="ro-row"><span class="ro-k">자연 발생설</span><span class="ro-v">' + (strT > 0.7 && swanT < 0.25 ? '반박됨' : '—') + '</span></div>';
                setDataCard([
                    { k: '연도', v: '1859' },
                    { k: '경과', v: st.days + '일' },
                    { k: '백조목', v: word(swanT) }
                ]);
            },
            update: function (dt) { updateDust(dt); },
            reset: function () {
                st.days = 0; st.broken = false; syncDays(); applyBroth();
                S.setBg(0xeef4fb, 0x070d16);
            },
            align: function () {
                viewFrom(0.6, 5.0, 11.6, 0, 2.4, 0, 5.2);
                controls.update();
            },
            onShow: function () { applyBroth(); }
        };
        function syncDays() {
            api.controls.forEach(function (c) { if (c.key === 'days' && c.el) { c.el.value = st.days; c.sync(); } });
        }
        applyBroth();
        group.visible = false;
        return api;
    }

    /* ======================================================================
       5) 러더퍼드의 알파입자 산란 (1911)
       ====================================================================== */
    function buildRutherford() {
        var group = new THREE.Group(); scene.add(group);
        var st = { det: 90, thick: 0.4 };
        var particles = [];
        var stats = { total: 0, straight: 0, large: 0, detected: 0 };

        /* 바닥 판 */
        var bed = new THREE.Mesh(new THREE.CylinderGeometry(3.4, 3.4, 0.14, 48),
            new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.92, transparent: true, opacity: 0.55 }));
        bed.position.y = -0.08;
        group.add(bed);

        /* 라듐 선원 (납 상자) */
        var src = new THREE.Group();
        src.position.set(-4.4, 0.9, 0);
        group.add(src);
        var lead = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.0, 1.0),
            new THREE.MeshStandardMaterial({ color: 0x4b5563, roughness: 0.65, metalness: 0.5 }));
        src.add(lead);
        var mouth = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.5, 12),
            new THREE.MeshStandardMaterial({ color: 0x065f46, emissive: 0x22c55e, emissiveIntensity: 0.8, roughness: 0.4 }));
        mouth.rotation.z = Math.PI / 2;
        mouth.position.set(0.6, 0, 0);
        src.add(mouth);
        var lbSrc = S.makeLabel('라듐 선원 (α 입자)', '#86efac', 2.6);
        lbSrc.position.set(0, 1.5, 0);
        src.add(lbSrc);

        /* 금박 */
        var foil = new THREE.Mesh(new THREE.PlaneGeometry(2.8, 2.8),
            new THREE.MeshBasicMaterial({
                color: 0xffe08a, transparent: true, opacity: 0.52, side: THREE.DoubleSide
            }));
        foil.rotation.y = Math.PI / 2;
        foil.position.set(0, 1.4, 0);
        group.add(foil);
        var foilGrid = new THREE.LineSegments(
            new THREE.EdgesGeometry(new THREE.PlaneGeometry(2.8, 2.8)),
            new THREE.LineBasicMaterial({ color: 0xfbbf24 }));
        foilGrid.rotation.y = Math.PI / 2;
        foilGrid.position.copy(foil.position);
        group.add(foilGrid);
        var lbFoil = S.makeLabel('아주 얇은 금박', '#fbbf24', 2.2);
        lbFoil.position.set(0, 3.2, 0);
        group.add(lbFoil);

        /* 황화아연 형광 스크린 (회전하는 검출기) */
        var detGroup = new THREE.Group();
        detGroup.position.set(0, 1.4, 0);
        group.add(detGroup);
        var detArm = new THREE.Group();
        detGroup.add(detArm);
        var segMat = new THREE.MeshStandardMaterial({ color: 0x7dd3fc, emissive: 0x0ea5e9, emissiveIntensity: 0.4, roughness: 0.5 });
        var seg = new THREE.Mesh(new THREE.BoxGeometry(0.16, 1.4, 0.5), segMat);
        seg.position.set(3.1, 0, 0);
        detArm.add(seg);
        var armBar = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 3.1, 8),
            new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.7, roughness: 0.4 }));
        armBar.rotation.z = Math.PI / 2;
        armBar.position.set(1.55, 0, 0);
        detArm.add(armBar);
        var lbDet = S.makeLabel('황화아연 형광 스크린', '#7dd3fc', 2.4);
        lbDet.position.set(3.1, 2.1, 0);
        detArm.add(lbDet);

        /* 링 가이드 */
        var grid = new THREE.GridHelper(18, 18, 0x94a3b8, 0xcbd5e1);
        grid.material.transparent = true; grid.material.opacity = 0.35;
        grid.position.y = 0.01;
        group.add(grid);

        var ring = new THREE.Mesh(new THREE.TorusGeometry(3.1, 0.018, 6, 96),
            new THREE.MeshBasicMaterial({ color: 0x94a3b8, transparent: true, opacity: 0.5 }));
        ring.rotation.x = Math.PI / 2;
        ring.position.set(0, 1.4, 0);
        group.add(ring);

        var flash = new THREE.Mesh(new THREE.SphereGeometry(0.3, 14, 10),
            new THREE.MeshBasicMaterial({ color: 0xa5f3fc, transparent: true, opacity: 0 }));
        flash.position.set(3.1, 1.4, 0);
        detGroup.add(flash);

        /* 입자 풀 */
        var POOL = 44;
        for (var i = 0; i < POOL; i++) {
            var m = new THREE.Mesh(new THREE.SphereGeometry(0.075, 8, 6),
                new THREE.MeshBasicMaterial({ color: 0x86efac, transparent: true, opacity: 0.9 }));
            m.visible = false;
            group.add(m);
            particles.push({ mesh: m, live: false, pos: new THREE.Vector3(), dir: new THREE.Vector3(), life: 0, trail: null });
        }
        var emitAcc = 0;

        function launch() {
            var p = null;
            for (var k = 0; k < particles.length; k++) { if (!particles[k].live) { p = particles[k]; break; } }
            if (!p) return;
            p.live = true; p.life = 0; p.counted = false;
            p.pos.set(-3.9, 1.4, 0);
            p.dir.set(1, 0, 0);
            p.mesh.visible = true;
            stats.total++;
            /* 충돌 변수 b */
            var hit = Math.random() < 0.22;      /* 표시용으로 큰 각도 산란을 실제보다 자주 섞는다 */
            p.deflectPending = true;
            p.wantLarge = hit;
            p.impact = hit ? (Math.random() < 0.15 ? 'back' : 'side') : 'none';
        }

        function scatterDir(p) {
            var phi = (Math.random() - 0.5) * Math.PI;   /* 방위각 */
            var theta;
            if (p.impact === 'back') theta = (150 + Math.random() * 30) * Math.PI / 180;
            else theta = (35 + Math.random() * 55) * Math.PI / 180;
            if (p.wantLarge) stats.large++;
            else { theta = (Math.random() * 3) * Math.PI / 180; stats.straight++; }
            /* +X 축에서 theta만큼 꺾인 방향 */
            p.dir.set(Math.cos(theta), Math.sin(theta) * Math.cos(phi), Math.sin(theta) * Math.sin(phi)).normalize();
        }

        function updateParticles(dt) {
            emitAcc += dt;
            var gap = 0.055;
            while (emitAcc > gap) { emitAcc -= gap; launch(); }
            var detA = st.det * Math.PI / 180;
            particles.forEach(function (p) {
                if (!p.live) return;
                p.life += dt;
                if (p.deflectPending && p.pos.x >= 0) {
                    p.deflectPending = false;
                    scatterDir(p);
                }
                p.pos.addScaledVector(p.dir, dt * 7.5);
                p.mesh.position.copy(p.pos);
                var d = Math.hypot(p.pos.x, p.pos.z);
                /* 검출기 각도 창(±9°)에 들어오면 계수 */
                var ang = Math.atan2(p.pos.y - 1.4, p.pos.x);
                if (!p.counted && p.pos.x > 0.2 && Math.abs(((ang - detA + Math.PI * 3) % (Math.PI * 2)) - Math.PI) < 0.16 && d > 2.4) {
                    p.counted = true;
                    stats.detected++;
                    flash.material.opacity = 0.9;
                }
                if (p.life > 1.6 || p.pos.length() > 9) {
                    p.live = false; p.mesh.visible = false;
                }
            });
            flash.material.opacity = Math.max(0, flash.material.opacity - dt * 2.2);
            segMat.emissiveIntensity = 0.45 + flash.material.opacity * 1.6;
        }

        function apply() {
            detArm.rotation.z = st.det * Math.PI / 180;
            var ra = st.det * Math.PI / 180;
            flash.position.set(3.1 * Math.cos(ra), 3.1 * Math.sin(ra), 0);
            api.refresh();
        }

        var api = {
            group: group, state: st,
            controls: [
                {
                    key: 'det', label: '검출기 회전', min: 0, max: 170, step: 5,
                    fmt: function (v) { return v + '°'; },
                    on: apply
                },
                {
                    key: 'thick', label: '금박 두께', min: 0.1, max: 1.0, step: 0.1,
                    fmt: function (v) { return v.toFixed(1) + ' μm'; },
                    on: function () { }
                },
                {
                    type: 'buttons',
                    items: [
                        {
                            label: '↺ 계수 초기화', main: true, action: function () {
                                stats.total = stats.straight = stats.large = stats.detected = 0; api.refresh();
                            }
                        },
                        {
                            label: '📊 큰 각도 보기', action: function () {
                                st.det = 140; api.controls[0].el.value = 140; api.controls[0].sync(); apply();
                                S.setHint('💥 140° 근처에서도 아주 드물게 입자가 튕겨 나옵니다. 이것이 원자 중심의 작고 무거운 핵을 알려 주었습니다.', false);
                            }
                        }
                    ]
                }
            ],
            refresh: function () {
                var pct = stats.total ? (stats.large / stats.total * 100) : 0;
                readEl.innerHTML =
                    '<div class="ro-row"><span class="ro-k">검출기 각도</span><span class="ro-v">' + st.det + '°</span></div>' +
                    '<div class="ro-row"><span class="ro-k">보낸 α 입자</span><span class="ro-v">' + stats.total + '개</span></div>' +
                    '<div class="ro-row"><span class="ro-k">검출기 검출 수</span><span class="ro-v">' + stats.detected + '개</span></div>' +
                    '<div class="ro-row"><span class="ro-k">큰 각도(35°↑) 산란</span><span class="ro-v">' + stats.large + '개 (' + fmtNum(pct, 1) + '%)</span></div>' +
                    '<div class="ro-row"><span class="ro-k">거의 직진</span><span class="ro-v">' + stats.straight + '개</span></div>';
                setDataCard([
                    { k: '연도', v: '1911' },
                    { k: '검출 각도', v: st.det + '°' },
                    { k: '큰 각도', v: fmtNum(pct, 1) + '%' }
                ]);
            },
            update: function (dt) {
                updateParticles(dt);
                if (!api._last || performance.now() - api._last > 320) { api._last = performance.now(); api.refresh(); }
            },
            reset: function () {
                st.det = 90; st.thick = 0.4;
                api.controls.forEach(function (c) { if (c.el) { c.el.value = st[c.key]; c.sync(); } });
                stats.total = stats.straight = stats.large = stats.detected = 0;
                particles.forEach(function (p) { p.live = false; p.mesh.visible = false; });
                apply();
            },
            align: function () {
                viewFrom(1.2, 6.4, 11.6, 0, 1.5, 0, 5.4);
                controls.update();
            },
            onShow: function () { apply(); }
        };
        apply();
        group.visible = false;
        return api;
    }

    /* ---------------- 실험 정의 ---------------- */
    EXPS = [
        {
            id: 'galileo', year: 1604, icon: '🎢', tabName: '갈릴레이 경사면',
            story: '<b>1604 · 갈릴레이</b> — 시계가 귀했던 시절, 물시계로 시간을 재며 나무 경사면에 구슬을 굴렸습니다. 같은 시간 동안 늘어난 거리가 1:3:5로 커진다는 것을 보고 “낙하는 물체는 등가속도로 움직인다”를 밝혔습니다.',
            note: '굴러가는 구슬은 미끄러지는 물체보다 느리게 가속합니다(속이 꽉 찬 공 a = 5/7·g·sinθ). 질량을 바꿔도 가속도는 그대로입니다.',
            hint: '🎢 경사각을 바꾸고 [구슬 놓기]를 눌러 보세요. 물시계의 수위가 흐른 시간을 보여 줍니다.',
            build: buildGalileo
        },
        {
            id: 'torricelli', year: 1643, icon: '🌡️', tabName: '토리첼리 기압계',
            story: '<b>1643 · 토리첼리</b> — 1 m 유리관을 수은으로 가득 채워 뒤집어 세웠더니, 수은이 76 cm만큼만 내려와 멈췄습니다. 위쪽 빈 공간은 “토리첼리 진공”이라 불렸고, 이로써 공기에도 무게가 있음을 처음 보였습니다.',
            note: '관을 기울여도 수은 기둥의 <b>수직 높이</b>는 그대로입니다. 관을 따라가는 수은 길이만 길어집니다.',
            hint: '🌡️ 관을 기울여 보세요. 높이는 변하지 않습니다. 기압을 낮추면 수은 기둥이 내려갑니다.',
            bgLight: 0xeaf1ee, bgDark: 0x06110c,
            build: buildTorricelli
        },
        {
            id: 'newton', year: 1666, icon: '🌈', tabName: '뉴턴 프리즘',
            story: '<b>1666 · 뉴턴</b> — 암실 창문 틈으로 들어온 햇빛을 삼각 프리즘에 통과시키자 무지개가 생겼습니다. 두 번째 프리즘으로 다시 모으면 백색광으로 돌아온다는 것을 보여, 색이 유리가 만든 것이 아니라 빛 자체의 성질임을 밝혔습니다.',
            note: '색마다 꺾이는 정도(분산)가 달라 색이 갈라집니다. 화면에서 잘 보이도록 색 벌어짐은 실제의 6배로 표시했습니다.',
            hint: '🌈 프리즘 각도와 창문 틈 폭을 바꿔 보세요. 두 번째 프리즘을 켜면 7색이 다시 백색광이 됩니다.',
            bgLight: 0x0b0f16, bgDark: 0x04070c,
            build: buildNewton
        },
        {
            id: 'pasteur', year: 1859, icon: '🧪', tabName: '파스퇴르 백조목',
            story: '<b>1859 · 파스퇴르</b> — 목을 백조처럼 S자로 굽힌 플라스크를 만들어 육수를 끓였습니다. 공기는 드나들지만 먼지는 S굽이에 걸려 육수가 썩지 않았습니다. 생명이 저절로 생긴다는 자연 발생설을 뒤집은 실험입니다.',
            note: 'S자 굽이를 잘라 내면 먼지가 곧장 육수에 닿아 며칠 만에 탁해집니다.',
            hint: '🧪 경과 일수를 넘겨 보세요. S굽이를 자르면 곧은 목 플라스크처럼 탁해집니다.',
            build: buildPasteur
        },
        {
            id: 'rutherford', year: 1911, icon: '⚛️', tabName: '러더퍼드 산란',
            story: '<b>1911 · 러더퍼드</b> — α 입자를 얇은 금박에 쏘았습니다. 대부분은 그대로 통과했지만 아주 드물게 크게 휘거나 되튀어 나왔습니다. “마치 대포알이 종잇장에 맞고 튕겨 나온 것 같다”며 원자 중심의 작고 무거운 원자핵을 제안했습니다.',
            note: '실제로는 8000개 중 1개꼴로 크게 산란합니다. 관찰이 쉽도록 큰 각도 산란을 훨씬 자주 섞어 보여 줍니다.',
            hint: '⚛️ 검출기를 돌려 각도마다 몇 개가 잡히는지 세어 보세요. 대부분은 직진합니다.',
            bgLight: 0xeef4fb, bgDark: 0x05080f,
            build: buildRutherford
        }
    ];

    /* ---------------- 초기화 ---------------- */
    buildTabs();
    selectExp(0);

    S.onFrame(function (dt) {
        var api = EXPS[cur] && EXPS[cur].api;
        if (api && api.update) api.update(dt);
    });
    S.setReset(function () {
        var api = EXPS[cur] && EXPS[cur].api;
        if (api && api.reset) api.reset();
        S.setHint('🔄 처음 상태로 되돌렸습니다.', false);
    });
    S.setAlign(function () {
        var api = EXPS[cur] && EXPS[cur].api;
        if (api && api.align) api.align();
    });

    /* 테마가 바뀌면 지금 실험의 배경색을 다시 적용 */
    S.onBg(function () {
        var e = EXPS[cur];
        if (e) S.setBg(e.bgLight || 0xeef4fb, e.bgDark || 0x070d16);
        if (EXPS[cur].id === 'galileo' && EXPS[cur].api.drawGraph) EXPS[cur].api.drawGraph();
    });

    /* 모바일 서랍 열기/닫기 */
    $('panelFab').addEventListener('click', function () {
        document.body.classList.toggle('side-open');
        haptic(10);
    });
    $('panelClose').addEventListener('click', function () {
        document.body.classList.remove('side-open');
    });
    $('subClose').addEventListener('click', function () {
        $('subPanel').classList.remove('show');
    });
    /* 가로 모드에서 접힌 패널을 열 수 있게 */
    window.addEventListener('resize', function () {
        if (window.innerWidth > 900) document.body.classList.remove('side-open');
    });

    S.initFullscreen();
})();
</script>
