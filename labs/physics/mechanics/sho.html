<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>단순 조화 진자 3D</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <!-- iOS Web App 전용 메타 태그 (홈 화면 추가 시 전체화면 실행) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Three.js 및 OrbitControls 3D 엔진 라이브러리 -->
    <script src="../../common/lib/three.min.js"></script>
    <script src="../../common/lib/OrbitControls.js"></script>
    <style>
        @font-face {
            font-family: 'SeoulNamsan';
            src: local('SeoulNamsan M'), local('SeoulNamsanM'), local('서울남산체 M'),
                 url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        /* 서울남산체 웹폰트 정의 (온라인 연결 시 적용) */
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            /* 1순위: 서울남산체 / 오프라인 또는 로딩 실패 시: 시스템 기본 고딕 폰트 fallback */
            font-family: 'SeoulNamsan', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            background-color: #f2f2f7;
            color: #1c1c1e;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Apple visionOS Glassmorphic UI */
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            z-index: 10;
        }

        .top-left-bar {
            position: absolute;
            top: calc(20px + env(safe-area-inset-top));
            left: calc(20px + env(safe-area-inset-left));
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            color: #1c1c1e;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tag-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
        }

        .tag-pill {
            background: rgba(0, 122, 255, 0.15);
            color: #007aff;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
        }

        .top-right-bar {
            position: absolute;
            top: calc(20px + env(safe-area-inset-top));
            right: calc(20px + env(safe-area-inset-right));
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .data-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 20px;
        }

        .data-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .data-label {
            font-size: 11px;
            color: #8e8e93;
            font-weight: bold;
        }

        .data-value {
            font-size: 15px;
            font-weight: bold;
            color: #1c1c1e;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            transition: all 0.2s;
        }

        .center-tooltip {
            position: absolute;
            top: 12%;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 18px;
            font-size: 13px;
            color: #8e8e93;
            border-radius: 30px;
            pointer-events: none;
            z-index: 5;
            white-space: nowrap;
        }

        .bottom-control-bar {
            position: absolute;
            bottom: calc(25px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            z-index: 10;
        }

        .control-tab-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 14px;
            min-width: 68px;
            border-radius: 14px;
            border: none;
            background: transparent;
            color: #1c1c1e;
            font-size: 12px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-tab-btn.active {
            background: #007aff;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }

        .sub-panel { right: 20px;
            position: absolute;
            bottom: calc(100px + env(safe-area-inset-bottom));
            left: auto;
            transform: none;
            padding: 20px;
            width: 300px;
            display: none;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }

        .sub-panel.show { display: flex; }

        /* 좌측 하단 역학적 에너지 막대 패널 */
        .energy-panel {
            position: absolute;
            left: 20px;
            bottom: calc(96px + env(safe-area-inset-bottom));
            width: 252px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 10;
        }
        .energy-panel.hidden { display: none; }
        .energy-panel.peek-off { display: none; }
        .energy-title {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 6px;
            font-size: 12px;
            font-weight: bold;
            color: #1c1c1e;
        }
        .energy-title small { font-size: 10px; font-weight: bold; color: #8e8e93; }
        .bar-row { display: flex; flex-direction: column; gap: 3px; }
        .bar-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            font-size: 11.5px;
            font-weight: bold;
            color: #3a3a3c;
        }
        .bar-head .bv { font-variant-numeric: tabular-nums; font-weight: bold; }
        .bar-track {
            width: 100%;
            height: 10px;
            background: rgba(0, 0, 0, 0.07);
            border-radius: 6px;
            overflow: hidden;
        }
        .bar-fill { height: 100%; width: 0%; border-radius: 6px; transition: width 0.08s linear; }
        .bar-fill.pe { background: linear-gradient(90deg, #5aa9ff, #007aff); }
        .bar-fill.ke { background: linear-gradient(90deg, #ffc46b, #ff9500); }
        .bar-fill.me { background: linear-gradient(90deg, #b6bcc6, #8e8e93); }
        body.dark-mode .energy-panel { background: rgba(28, 28, 30, 0.82); }
        body.dark-mode .energy-title, body.dark-mode .bar-head { color: #f2f2f7; }
        body.dark-mode .energy-title small { color: #a1a1a6; }
        body.dark-mode .bar-track { background: rgba(255, 255, 255, 0.14); }

        .slider-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #007aff;
        }

        /* 다크모드 대응 */
        body.dark-mode {
            background-color: #121212;
            color: #f2f2f7;
        }

        body.dark-mode .glass-panel {
            background: rgba(30, 30, 30, 0.7);
            border-color: rgba(255, 255, 255, 0.15);
            color: #f2f2f7;
        }

        body.dark-mode .data-value, body.dark-mode .back-btn {
            color: #f2f2f7;
        }

        body.dark-mode .icon-btn {
            background: rgba(40, 40, 40, 0.7);
            color: #fff;
        }
    
        /* Bottom Right Bar (Fullscreen) */
        .bottom-right-bar {
            position: absolute;
            bottom: calc(20px + env(safe-area-inset-bottom));
            right: calc(20px + env(safe-area-inset-right));
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }
        button.back-btn, button.tag-badge {
            font-family: inherit;
            border: none;
        }

        /* 모바일 가로모드 세부 스타일 튜닝 */
        @media screen and (max-height: 520px) and (orientation: landscape) {
            .top-left-bar { top: 10px; left: 10px; gap: 6px; }
            .top-right-bar { top: 10px; right: 10px; gap: 6px; }
            .back-btn, .tag-badge { padding: 6px 12px; font-size: 12px; }
            .data-card { padding: 6px 12px; gap: 10px; }
            .data-label { font-size: 9px; }
            .data-value { font-size: 13px; }
            .icon-btn { width: 34px; height: 34px; font-size: 14px; }
            .bottom-control-bar { bottom: 12px; padding: 4px; gap: 4px; }
            .control-tab-btn { padding: 6px 10px; min-width: 54px; font-size: 10px; border-radius: 10px; }
            .bottom-right-bar { bottom: 10px; right: 10px; }
            .sub-panel { bottom: 70px; padding: 12px; width: 260px; gap: 8px; }
            .slider-header { font-size: 11px; }
            .center-tooltip { top: 15%; font-size: 11px; padding: 6px 14px; }
        }
    

/* @@MOBILE-BASE v1@@ */
/* ============================================================
   모바일 반응형 보정 (세로/가로) — 자동 생성 블록
   ============================================================ */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
img, canvas { max-width: 100%; }

/* ---------- 모바일 세로 (폭 900px 이하) ---------- */
@media (max-width: 900px) {
    /* 1행: [메인][제목]  ...  [전체화면 아이콘] */
    .top-left-bar {
        top: max(8px, env(safe-area-inset-top)) !important;
        left: 8px !important;
        right: 56px !important;
        gap: 6px !important;
        flex-wrap: nowrap !important;
        align-items: center !important;
        overflow: hidden;
    }
    .top-left-bar .back-btn,
    .top-left-bar > a {
        flex: 0 0 auto;
        padding: 6px 10px !important;
        font-size: 12px !important;
        gap: 4px !important;
        white-space: nowrap;
    }
    .top-left-bar .tag-badge {
        flex: 0 1 auto;
        min-width: 0;
        padding: 6px 10px !important;
        font-size: 12px !important;
        gap: 5px !important;
        white-space: nowrap;
        overflow: hidden;
    }
    .top-left-bar .tag-badge > span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .tag-pill { font-size: 9px !important; padding: 1px 6px !important; flex: 0 0 auto; }

    /* 2행: [데이터 카드 .............][테마] */
    .top-right-bar {
        top: calc(max(8px, env(safe-area-inset-top)) + 40px) !important;
        left: 8px !important;
        right: 8px !important;
        gap: 6px !important;
        justify-content: flex-end !important;
        flex-wrap: nowrap !important;
    }
    .data-card {
        flex: 1 1 0%;
        min-width: 0;
        gap: 4px !important;
        padding: 6px 8px !important;
        justify-content: space-around !important;
        overflow: hidden;
    }
    .data-card { flex-direction: row !important; align-items: center !important; flex-wrap: nowrap !important; }
    .data-item { min-width: 0; flex-direction: column !important; align-items: center !important; gap: 0 !important; }
    .data-item > * { white-space: nowrap; }
    .voltmeter-display { font-size: 24px !important; }
    .data-label { font-size: 9px !important; white-space: nowrap; line-height: 1.2; }
    .data-value { font-size: 12.5px !important; white-space: nowrap; line-height: 1.25; }
    .icon-btn { width: 34px !important; height: 34px !important; min-width: 34px; font-size: 15px !important; flex: 0 0 auto; }

    /* 전체화면: 1행 우측 아이콘 버튼 (글자는 숨김) */
    .bottom-right-bar {
        top: max(8px, env(safe-area-inset-top)) !important;
        bottom: auto !important;
        right: 8px !important;
        left: auto !important;
        z-index: 20;
    }
    .bottom-right-bar button,
    .bottom-right-bar .back-btn {
        padding: 6px 9px !important;
        font-size: 14px !important;
        gap: 4px !important;
        line-height: 1;
    }
    .bottom-right-bar #fullscreenText,
    .bottom-right-bar .fs-text { display: none !important; }

    /* 안내 문구 */
    .center-tooltip, #guide-tooltip {
        top: calc(max(8px, env(safe-area-inset-top)) + 88px) !important;
        left: 8px !important;
        right: 8px !important;
        transform: none !important;
        margin: 0 auto;
        width: auto !important;
        max-width: none !important;
        font-size: 11.5px !important;
        padding: 7px 12px !important;
        white-space: normal !important;
        line-height: 1.45;
        text-align: center;
        z-index: 15 !important;
    }

    /* 하단 컨트롤 바: 화면 폭 전체, 한 줄 유지 */
    .bottom-control-bar {
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        transform: none !important;
        width: 100% !important;
        border-radius: 18px 18px 0 0 !important;
        padding: 6px 6px calc(6px + env(safe-area-inset-bottom)) !important;
        gap: 2px !important;
        justify-content: space-around !important;
        flex-wrap: nowrap !important;
        overflow: visible;
    }
    .control-tab-btn {
        flex: 1 1 0 !important;
        min-width: 0 !important;
        padding: 5px 2px !important;
        font-size: 10.5px !important;
        gap: 1px !important;
        border-radius: 12px !important;
        white-space: nowrap !important;
        line-height: 1.15;
    }
    .control-tab-btn span { white-space: nowrap !important; }
    .control-tab-btn span:first-child { font-size: 15px !important; line-height: 1.1; }

    /* 슬라이더 등 서브 패널 */
    .sub-panel {
        left: 8px !important;
        right: 8px !important;
        bottom: calc(76px + env(safe-area-inset-bottom)) !important;
        transform: none !important;
        width: auto !important;
        max-width: none !important;
        max-height: 46vh;
        overflow-y: auto;
        padding: 13px 14px !important;
        gap: 10px !important;
        -webkit-overflow-scrolling: touch;
    }
    .sub-panel-title { font-size: 11px !important; }
    .slider-header { font-size: 11px !important; }
    .energy-panel {
        left: 8px !important;
        bottom: calc(58px + env(safe-area-inset-bottom)) !important;
        width: 142px !important;
        padding: 7px 9px !important;
        gap: 5px !important;
        border-radius: 14px !important;
    }
    .energy-title { font-size: 9.5px !important; }
    .energy-title small { display: none !important; }
    .bar-head { font-size: 9px !important; white-space: nowrap; }
    .bar-track { height: 7px !important; }
    .control-row { gap: 5px !important; flex-wrap: wrap; }
    .toggle-btn, .mode-btn, .quick-btn, .example-item, .preset-btn { font-size: 11px !important; }
    input[type="range"] { height: 22px; }

    /* 팝업(모달)이 화면을 넘지 않도록 */
    .modal-overlay { padding: 12px !important; align-items: center !important; }
    .modal-card {
        max-height: 88vh !important;
        overflow-y: auto !important;
        width: auto !important;
        max-width: 100% !important;
        padding: 16px !important;
        -webkit-overflow-scrolling: touch;
    }
    .modal-title { font-size: 15px !important; }
    .modal-body { font-size: 12px !important; }
    .example-title { font-size: 11.5px !important; }
    .example-desc { font-size: 11px !important; line-height: 1.5 !important; }
}

@media (max-width: 430px) {
    /* 아주 좁은 화면에서는 장식용 배지를 숨겨 제목 자리를 확보 */
    .tag-pill { display: none !important; }
}

            var d = I18N[cur] || I18N.ko;
            var v = d[key];
            if (v == null) v = I18N.ko[key];
            return v == null ? key : v;
        }
        window.SVL_T = T;
        window.T = T;   /* 다른 스크립트(3D·스톱워치·전체화면)에서도 같은 사전을 쓴다 */

        var btn = document.getElementById('svl-lang-btn');
        var menu = document.getElementById('svl-lang-menu');
        var nameEl = document.getElementById('svl-lang-name');

        function isOpen() { return menu && menu.classList.contains('open'); }
        function openMenu() {
            menu.classList.add('open');
            document.body.classList.add('svl-lang-open');
            btn.setAttribute('aria-expanded', 'true');
        }
        function closeMenu() {
            menu.classList.remove('open');
            document.body.classList.remove('svl-lang-open');
            btn.setAttribute('aria-expanded', 'false');
        }

        /* 값이 바뀌는 문구만 지금 상태에 맞춰 다시 쓴다 */
        function refreshDynamic() {
            var running = false, energyShown = true;
            try { running = (typeof isRunning === 'undefined') ? false : isRunning; } catch (e) { running = false; }
            try { energyShown = (typeof energyOn === 'undefined') ? true : energyOn; } catch (e) { energyShown = true; }
            var lblPlay = document.getElementById('lbl-play');
            if (lblPlay) lblPlay.textContent = running ? T('pause') : T('start');
            var lblEnergy = document.getElementById('lbl-energy');
            if (lblEnergy) lblEnergy.textContent = energyShown ? T('hideEnergy') : T('showEnergy');
            if (window.svlFsLabels) window.svlFsLabels();
            if (window.svlSwLabels) window.svlSwLabels();
        }

        function applyLang(code, save) {
            if (!I18N[code]) code = 'ko';
            cur = code;

            Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (el) {
                el.textContent = T(el.getAttribute('data-i18n'));
            });
            Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-aria]'), function (el) {
                el.setAttribute('aria-label', T(el.getAttribute('data-i18n-aria')));
            });
            Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-title]'), function (el) {
                el.title = T(el.getAttribute('data-i18n-title'));
            });

            document.title = T('docTitle');
            document.documentElement.lang = code;

            if (nameEl) nameEl.textContent = LANGS[code];
            if (btn) {
                btn.setAttribute('aria-label', T('langAria'));
                btn.title = T('langAria');
            }
            if (menu) {
                menu.setAttribute('aria-label', T('langAria'));
                Array.prototype.forEach.call(menu.querySelectorAll('button'), function (b) {
                    var on = b.getAttribute('data-code') === code;
                    b.classList.toggle('active', on);
                    b.setAttribute('aria-selected', on ? 'true' : 'false');
                });
            }

            /* 공통 제안하기 버튼(feedback.js) 문구 */
            var fbBtn = document.getElementById('feedback-btn');
            if (fbBtn) {
                var fbLbl = fbBtn.querySelector('.fb-open-label');
                if (fbLbl) fbLbl.textContent = T('feedback');
                fbBtn.setAttribute('aria-label', T('feedback'));
                fbBtn.title = T('feedback');
            }

            refreshDynamic();
            if (save) { try { localStorage.setItem('svlLang', code); } catch (e) {} }
        }
        window.svlApplyLang = applyLang;

        if (btn && menu) {
            btn.addEventListener('click', function (e) {
                e.stopPropagation();
                if (isOpen()) closeMenu(); else openMenu();
            });
            menu.addEventListener('click', function (e) {
                e.stopPropagation();
                var b = e.target.closest ? e.target.closest('button[data-code]') : null;
                if (!b) return;
                applyLang(b.getAttribute('data-code'), true);
                closeMenu();
            });
            document.addEventListener('click', function () { if (isOpen()) closeMenu(); });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && isOpen()) { closeMenu(); if (btn.focus) btn.focus(); }
            });
        }

        /* 저장된 언어 불러오기 — 새로고침해도 유지되고 메인 페이지와도 같은 언어 */
        var saved = null;
        try { saved = localStorage.getItem('svlLang'); } catch (e) {}
        applyLang(saved && I18N[saved] ? saved : 'ko', false);

        /* defer 스크립트(feedback.js)가 버튼을 만든 뒤 한 번 더 반영 */
        document.addEventListener('DOMContentLoaded', function () {
            var s = null;
            try { s = localStorage.getItem('svlLang'); } catch (e) {}
            applyLang(s && I18N[s] ? s : cur, false);
        });
    })();

    <script>
        // 1. 3D Scene / Camera / Renderer
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf2f2f7);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 4.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.05;

        // 2. Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(3, 5, 3);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // 3. 3D Stand & Floor
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(20, 20),
            new THREE.MeshStandardMaterial({ color: 0xe5e5ea, roughness: 0.8 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -1.5;
        floor.receiveShadow = true;
        scene.add(floor);

        const standGroup = new THREE.Group();
        const metalMat = new THREE.MeshStandardMaterial({ color: 0x1c1c1e, metalness: 0.8, roughness: 0.2 });

        const basePole = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 2.8, 32), metalMat);
        basePole.position.set(0.8, -0.1, 0);
        basePole.castShadow = true;
        standGroup.add(basePole);

        const topCross = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.2, 32), metalMat);
        topCross.rotation.z = Math.PI / 2;
        topCross.position.set(0.3, 1.25, 0);
        topCross.castShadow = true;
        standGroup.add(topCross);

        scene.add(standGroup);

        // 4. Pendulum Objects
        const pivotGroup = new THREE.Group();
        pivotGroup.position.set(0, 1.25, 0);
        scene.add(pivotGroup);

        let rodLength = 1.5;
        const rodGeo = new THREE.CylinderGeometry(0.008, 0.008, rodLength, 16);
        rodGeo.translate(0, -rodLength / 2, 0);
        const rodMesh = new THREE.Mesh(rodGeo, new THREE.MeshBasicMaterial({ color: 0x1c1c1e }));
        pivotGroup.add(rodMesh);

        const bobGeo = new THREE.SphereGeometry(0.15, 32, 32);
        const bobMat = new THREE.MeshPhysicalMaterial({ color: 0xff3b30, roughness: 0.1, metalness: 0.2, clearcoat: 0.8 });
        const bobMesh = new THREE.Mesh(bobGeo, bobMat);
        bobMesh.position.set(0, -rodLength, 0);
        bobMesh.castShadow = true;
        pivotGroup.add(bobMesh);

        // 5. Physics Simulation Logic
        let angle = Math.PI / 6;
        let angularVelocity = 0;
        let angularAcceleration = 0;
        let gravity = 9.8;
        let mass = 1.0;
        let isRunning = false;   /* 처음에는 정지 상태 — ▶ 시작 버튼을 눌러야 운동을 시작한다 */
        let isDragging = false;

        const clock = new THREE.Clock();

        function updatePhysics(dt) {
            if (!isRunning || isDragging) return;

            angularAcceleration = -(gravity / rodLength) * Math.sin(angle);
            angularVelocity += angularAcceleration * dt;
            angularVelocity *= 0.999;
            angle += angularVelocity * dt;

            pivotGroup.rotation.z = angle;

            document.getElementById('val-angle').innerText = (angle * (180 / Math.PI)).toFixed(1) + '°';
            document.getElementById('val-period').innerText = (2 * Math.PI * Math.sqrt(rodLength / gravity)).toFixed(2) + 's';
            document.getElementById('val-speed').innerText = Math.abs(angularVelocity * rodLength).toFixed(2) + 'm/s';
        }

        /* ---- 역학적 에너지 : 위치 에너지 ↔ 운동 에너지 실시간 막대 ---- */
        let energyOn = true;
        let energyRef = 0.001;
        const peBar = document.getElementById('pe-bar');
        const keBar = document.getElementById('ke-bar');
        const meBar = document.getElementById('me-bar');
        const peVal = document.getElementById('pe-val');
        const keVal = document.getElementById('ke-val');
        const meVal = document.getElementById('me-val');
        const energyPanel = document.getElementById('energy-panel');
        const energyBtn = document.getElementById('btn-energy-toggle');
        const energyLbl = document.getElementById('lbl-energy');

        function updateEnergy() {
            const speed = Math.abs(angularVelocity) * rodLength;
            const pe = mass * gravity * rodLength * (1 - Math.cos(angle));
            const ke = 0.5 * mass * speed * speed;
            const me = pe + ke;
            if (me > energyRef) energyRef = me;
            if (!energyOn) return;
            const denom = Math.max(energyRef, 0.001);
            const pct = function (v) { return Math.min(100, (v / denom) * 100).toFixed(1) + '%'; };
            peBar.style.width = pct(pe);
            keBar.style.width = pct(ke);
            meBar.style.width = pct(me);
            peVal.innerText = pe.toFixed(2) + ' J';
            keVal.innerText = ke.toFixed(2) + ' J';
            meVal.innerText = me.toFixed(2) + ' J';
        }

        function setEnergyVisible(on) {
            energyOn = on;
            energyPanel.classList.toggle('hidden', !on);
            energyBtn.classList.toggle('active', on);
            energyBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
            energyLbl.innerText = on ? T('hideEnergy') : T('showEnergy');
            if (on) updateEnergy();
        }
        energyBtn.addEventListener('click', function () { setEnergyVisible(!energyOn); });

        // 6. Touch & Drag Controls
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);

        function onPointerDown(e) {
            // 피드백 모달이 열려 있을 때는 3D 조작을 막는다
            var fbOverlay = document.getElementById('feedback-overlay');
            if (fbOverlay && fbOverlay.classList.contains('show')) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(bobMesh);

            if (intersects.length > 0) {
                isDragging = true;
                controls.enabled = false;
                document.getElementById('guide-tooltip').style.opacity = '0';
            }
        }

        function onPointerMove(e) {
            if (!isDragging) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersectionPoint = new THREE.Vector3();
            raycaster.ray.intersectPlane(dragPlane, intersectionPoint);

            if (intersectionPoint) {
                const dx = intersectionPoint.x - pivotGroup.position.x;
                const dy = intersectionPoint.y - pivotGroup.position.y;

                angle = Math.atan2(dx, -dy);
                angle = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, angle));

                pivotGroup.rotation.z = angle;
                angularVelocity = 0;
                document.getElementById('val-angle').innerText = (angle * (180 / Math.PI)).toFixed(1) + '°';
            }
        }

        function onPointerUp() {
            if (isDragging) {
                isDragging = false;
                controls.enabled = true;
            }
        }

        window.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);

        // 7. Event Listeners
        const btnPlay = document.getElementById('btn-play');

        /* 실행 상태 버튼(▶ 시작 / ⏸ 일시정지) 표시를 현재 상태에 맞춘다 */
        function setRunning(on) {
            isRunning = on;
            document.getElementById('icon-play').innerText = on ? '⏸' : '▶';
            document.getElementById('lbl-play').innerText = on ? T('pause') : T('start');
            btnPlay.classList.toggle('active', on);
        }

        /* 정지 중에 길이·중력을 바꿔도 주기 값이 바로 보이게 */
        function updatePeriodReadout() {
            document.getElementById('val-period').innerText = (2 * Math.PI * Math.sqrt(rodLength / gravity)).toFixed(2) + 's';
        }

        /* 정지 상태에서도 진자 그림·수치가 현재 각도/길이와 일치하도록 맞춘다 */
        function syncStaticState() {
            angularVelocity = 0;
            pivotGroup.rotation.z = angle;
            document.getElementById('val-angle').innerText = (angle * (180 / Math.PI)).toFixed(1) + '°';
            updatePeriodReadout();
            document.getElementById('val-speed').innerText = '0.00m/s';
        }

        btnPlay.addEventListener('click', () => {
            setRunning(!isRunning);
        });

        const btnTogglePhysics = document.getElementById('btn-toggle-physics');
        const physicsPanel = document.getElementById('physics-panel');
        btnTogglePhysics.addEventListener('click', () => {
            physicsPanel.classList.toggle('show');
            btnTogglePhysics.classList.toggle('active');
            /* 좁은 화면에서는 슬라이더 패널과 겹치지 않도록 에너지 막대를 잠시 숨긴다 */
            const peekOff = physicsPanel.classList.contains('show') && window.innerWidth <= 900;
            energyPanel.classList.toggle('peek-off', peekOff);
        });

        document.getElementById('sld-length').addEventListener('input', (e) => {
            rodLength = parseFloat(e.target.value);
            document.getElementById('txt-length').innerText = rodLength.toFixed(1) + ' m';
            rodMesh.scale.set(1, rodLength / 1.5, 1);
            bobMesh.position.y = -rodLength;
            updatePeriodReadout();
        });

        document.getElementById('sld-gravity').addEventListener('input', (e) => {
            gravity = parseFloat(e.target.value);
            document.getElementById('txt-gravity').innerText = gravity.toFixed(1) + ' m/s²';
            updatePeriodReadout();
        });

        document.getElementById('sld-mass').addEventListener('input', (e) => {
            mass = parseFloat(e.target.value);
            document.getElementById('txt-mass').innerText = mass.toFixed(1) + ' kg';
            const s = Math.cbrt(mass);
            bobMesh.scale.set(s, s, s);
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            angle = Math.PI / 6;
            angularVelocity = 0;
            /* 초기화도 처음 화면과 같은 '정지 상태'로 돌린다 (조정 후 ▶ 시작) */
            setRunning(false);
            syncStaticState();
            energyRef = 0.001;
            updateEnergy();
        });

        document.getElementById('btn-align').addEventListener('click', () => {
            camera.position.set(0, 1.5, 4.5);
            controls.target.set(0, 0, 0);
        });

        document.getElementById('theme-toggle').addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            scene.background.setHex(isDark ? 0x121212 : 0xf2f2f7);
            floor.material.color.setHex(isDark ? 0x1c1c1e : 0xe5e5ea);
            document.getElementById('theme-toggle').textContent = isDark ? '☀️' : '🌙';
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 8. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            /* 첫 프레임의 큰 시간 간격으로 진자가 튀거나 에너지가 어긋나지 않도록 제한 */
            updatePhysics(Math.min(clock.getDelta(), 0.033));
            updateEnergy();
            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        /* 첫 화면: 정지 상태를 그림·수치·버튼 모두에 반영 */
        setRunning(false);
        syncStaticState();

        /* ---------- Fullscreen / Safari Handling Logic ---------- */
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const fullscreenIcon = document.getElementById('fullscreenIcon');
        const fullscreenText = document.getElementById('fullscreenText');

        function updateFullscreenUI() {
            const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
            if (fullscreenIcon) fullscreenIcon.innerText = isFS ? '🗗' : '⛶';
            if (fullscreenText) fullscreenText.innerText = isFS ? T('windowed') : T('fullscreen');
        }

        if (fullscreenBtn) {
            fullscreenBtn.addEventListener('click', () => {
                const docEl = document.documentElement;
                const canFullscreen = docEl.requestFullscreen || docEl.webkitRequestFullscreen;

                if (!canFullscreen) {
                    alert(T('iosFs1'));
                    return;
                }

                try {
                    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                        const req = docEl.requestFullscreen || docEl.webkitRequestFullscreen;
                        if (req) {
                            const promise = req.call(docEl);
                            if (promise && promise.catch) {
                                promise.catch(err => {
                                    alert(T('iosFs2'));
                                });
                            }
                        }
                    } else {
                        const exit = document.exitFullscreen || document.webkitExitFullscreen;
                        if (exit) exit.call(document);
                    }
                } catch (err) {
                    alert(T('fsFail'));
                }
            });
        }

        document.addEventListener('fullscreenchange', updateFullscreenUI);
        document.addEventListener('webkitfullscreenchange', updateFullscreenUI);
    </script>

<script>
/* ============ 모바일 화면 재조정 + 전체화면 대체 동작 (자동 생성) ============ */
(function () {
    var docEl = document.documentElement;
    var btn = document.getElementById('fullscreenBtn');
    var icon = document.getElementById('fullscreenIcon');
    var text = document.getElementById('fullscreenText');

    function realFs() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement ||
                  document.mozFullScreenElement || document.msFullscreenElement);
    }
    function pseudo() { return docEl.classList.contains('pseudo-fs'); }
    function setUI() {
        var on = realFs() || pseudo();
        if (icon) icon.textContent = on ? '🗗' : '⛶';
        if (text) text.textContent = on ? T('windowed') : T('fullscreen');
        if (btn) btn.setAttribute('aria-label', on ? T('fsOff') : T('fsOn'));
        document.body.classList.toggle('is-fullscreen', on);
    }
    window.svlFsLabels = setUI;
    function toast(msg) {
        var t = document.getElementById('ux-toast');
        if (!t) {
            t = document.createElement('div');
            t.id = 'ux-toast';
            t.style.cssText = 'position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);' +
                'background:rgba(28,28,30,.88);color:#fff;font-size:12px;line-height:1.4;padding:9px 14px;border-radius:14px;' +
                'z-index:9999;max-width:86vw;text-align:center;pointer-events:none;transition:opacity .3s;' +
                'font-family:inherit;box-shadow:0 8px 24px rgba(0,0,0,.25)';
            document.body.appendChild(t);
        }
        t.textContent = msg;
        t.style.opacity = '1';
        clearTimeout(t._t);
        t._t = setTimeout(function () { t.style.opacity = '0'; }, 2600);
    }

    if (btn) {
        btn.addEventListener('click', function () {
            var wasReal = realFs();
            var wasPseudo = pseudo();
            setTimeout(function () {
                if (wasReal) { setUI(); return; }          // 진짜 전체화면에서 나온 경우
                if (wasPseudo) { docEl.classList.remove('pseudo-fs'); setUI(); return; }  // 몰입 모드 해제
                if (!realFs()) {                            // 전체화면 API가 동작하지 않는 환경
                    docEl.classList.add('pseudo-fs');
                    try { window.scrollTo(0, 1); } catch (e) {}
                    toast(T('pseudoFs'));
                }
                setUI();
            }, 380);
        }, false);
    }
    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
        document.addEventListener(ev, setUI);
    });

    /* 좁은 화면에서는 3D 장면이 잘리지 않도록 시야각을 넓혀 전체가 들어오게 한다 */
    function mobileFit() {
        try {
            if (typeof camera === 'undefined' || !camera || !camera.isPerspectiveCamera) return;
            if (!camera.userData) camera.userData = {};
            if (!camera.userData.baseFov) camera.userData.baseFov = camera.fov;
            var w = window.innerWidth, h = window.innerHeight, f = 1;
            var k = 0.62;
            var attr = document.documentElement.getAttribute('data-mzoom');
            if (attr) { var v = parseFloat(attr); if (!isNaN(v) && v > 0) k = v; }
            if (w < h) f = 1 + (1 - w / h) * k;
            else if (h <= 500) f = 1 + k * 0.16;
            camera.fov = Math.min(88, camera.userData.baseFov * f);
            camera.updateProjectionMatrix();
        } catch (e) {}
    }
    mobileFit();

    /* 화면 회전·주소창 변화·전체화면 전환 후 렌더러 크기 재계산 */
    var rt = null;
    function refit() {
        clearTimeout(rt);
        rt = setTimeout(function () {
            mobileFit();
            try { window.dispatchEvent(new Event('resize')); } catch (e) {}
        }, 240);
    }
    window.addEventListener('orientationchange', refit);
    window.addEventListener('pageshow', refit);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) refit(); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', refit);

    setUI();
})();
</script>

   ⏱ 스톱워치 (시작/정지/리셋/랩타임, 최근 5건 구간 기록)

(function () {

    var laps = [];          // { interval, cumulative }
    var rafId = null;

    function nowMs() { return (window.performance && performance.now) ? performance.now() : Date.now(); }
    function pad(n) { return (n < 10 ? '0' : '') + n; }
    function fmt(ms) {
        ms = Math.max(0, Math.floor(ms));
        var m = Math.floor(ms / 60000),
            sec = Math.floor((ms % 60000) / 1000),
            cs = Math.floor((ms % 1000) / 10);
        return pad(m) + ':' + pad(sec) + '.' + pad(cs);
    }
    function currentMs() { return running ? elapsed + (nowMs() - startTime) : elapsed; }
    function render() { display.textContent = fmt(currentMs()); }
    function tick() { render(); rafId = requestAnimationFrame(tick); }

    function updateToggle() {
        document.getElementById('sw-toggle-icon').textContent = running ? '❚❚' : '▶';
        document.getElementById('sw-toggle-label').textContent = running ? T('stop') : T('start');
        toggleBtn.classList.toggle('running', running);
        toggleBtn.setAttribute('aria-label', running ? T('swStopAria') : T('swStartAria'));
    }
    /* 언어를 바꿔도 스톱워치 문구가 현재 상태에 맞게 유지되도록 밖에 연결한다 */
    window.svlSwLabels = function () { updateToggle(); renderLaps(); };

    function renderLaps() {
        if (!laps.length) {
            lapsEl.classList.remove('has-items');
            lapsEl.innerHTML = '';
            return;
        }
        lapsEl.classList.add('has-items');
        // 최근 5건, 최신이 위로
        var recent = laps.slice(-5).reverse();
        var html = '';
        for (var i = 0; i < recent.length; i++) {
            var n = laps.length - i;
            html += '<li><span class="sw-lap-label">' + T('lapN').replace('{n}', n) + '</span>' +
                    '<span class="sw-lap-times"><b>' + fmt(recent[i].interval) + '</b> · ' + T('cum') + fmt(recent[i].cumulative) + '</span></li>';
        }
        lapsEl.innerHTML = html;
    }

    function start() {
        if (running) return;
        running = true;
        startTime = nowMs();
        lapBtn.disabled = false;
        updateToggle();
        rafId = requestAnimationFrame(tick);
    }
    function stop() {
        if (!running) return;
        running = false;
        elapsed += nowMs() - startTime;
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
        lapBtn.disabled = true;
        updateToggle();
        render();
    }
    function reset() {
        running = false;
        elapsed = 0;
        startTime = 0;
        laps = [];
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
        lapBtn.disabled = true;
        updateToggle();
        render();
        renderLaps();
    }
    function lap() {
        if (!running) return;
        var total = currentMs();
        var prev = laps.length ? laps[laps.length - 1].cumulative : 0;
        laps.push({ interval: total - prev, cumulative: total });
        renderLaps();
    }

    toggleBtn.addEventListener('click', function () { running ? stop() : start(); });
    resetBtn.addEventListener('click', reset);
    lapBtn.addEventListener('click', lap);
    render();
})();
</script>
