<!DOCTYPE html>
<html lang="ko" data-mzoom="0.9">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>호흡 운동의 원리 3D</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <!-- Three.js 및 OrbitControls 3D 엔진 라이브러리 -->
    <script src="../../common/lib/three.min.js"></script>
    <script src="../../common/lib/OrbitControls.js"></script>
    <style>
        @font-face {
            font-family: 'SeoulNamsan';
            src: local('SeoulNamsan M'), local('SeoulNamsanM'), local('서울남산체 M'),
                 url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'SeoulNamsan', -apple-system, sans-serif;
            background-color: #f2f2f7;
            color: #1c1c1e;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Apple visionOS Glassmorphic UI */
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            z-index: 10;
        }

        .top-left-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            color: #1c1c1e;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tag-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
        }

        .tag-pill {
            background: rgba(0, 122, 255, 0.15);
            color: #007aff;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
        }

        .top-right-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 12;
        }

        .data-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 20px;
        }

        .data-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .data-label {
            font-size: 11px;
            color: #8e8e93;
            font-weight: bold;
        }

        .data-value {
            font-size: 15px;
            font-weight: bold;
            color: #1c1c1e;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            transition: all 0.2s;
        }

        .center-tooltip {
            position: absolute;
            top: 16%;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 18px;
            font-size: 13px;
            color: #8e8e93;
            border-radius: 30px;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.5s ease;
            white-space: nowrap;
        }

        .center-tooltip.hidden {
            opacity: 0;
        }

        /* 우측 상단 표시 바로 아래: 가로막 조작 패널 */
        .side-panel {
            position: absolute;
            right: 20px;
            top: 88px;
            width: 248px;
            padding: 14px 16px 13px;
            display: flex;
            flex-direction: column;
            gap: 9px;
            z-index: 11;
        }

        .side-title {
            font-size: 13px;
            font-weight: bold;
            color: #1c1c1e;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .side-title span:last-child {
            font-size: 12px;
            color: #007aff;
        }

        .side-scale {
            display: flex;
            justify-content: space-between;
            font-size: 10.5px;
            font-weight: bold;
            color: #8e8e93;
            margin-top: -4px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #007aff;
        }

        /* 우측 컴팩트 정사각 기능 버튼 */
        .action-panel {
            position: absolute;
            right: 20px;
            top: 198px;
            display: grid;
            grid-template-columns: repeat(2, 62px);
            gap: 8px;
            z-index: 11;
        }

        .side-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            width: 62px;
            height: 62px;
            padding: 6px 4px;
            border-radius: 17px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            background: rgba(255, 255, 255, 0.75);
            color: #1c1c1e;
            font-family: inherit;
            font-size: 9.5px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            line-height: 1.15;
            text-align: center;
        }

        .side-btn span:first-child {
            font-size: 15px;
        }

        .side-btn:hover { background: #ffffff; }

        .side-btn.active {
            background: #007aff;
            color: #ffffff;
            border-color: #007aff;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.28);
        }

        /* 좌측 하단 계기 패널 */
        .meter-panel {
            position: absolute;
            left: 20px;
            bottom: 24px;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 9px;
            z-index: 10;
            width: 252px;
        }

        .meter-title {
            font-size: 12px;
            font-weight: bold;
            color: #8e8e93;
        }

        .bar-row {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .bar-head {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: bold;
        }

        .bar-track {
            width: 100%;
            height: 11px;
            background: rgba(0, 0, 0, 0.07);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 6px;
            transition: width 0.08s linear;
        }

        .bar-fill.thorax { background: linear-gradient(90deg, #8ab6ff, #007aff); }
        .bar-fill.lung { background: linear-gradient(90deg, #ffb3c1, #ff5c8a); }
        .bar-fill.press { background: linear-gradient(90deg, #ffd27f, #ff9500); }

        body.dark-mode {
            background-color: #121212;
            color: #f2f2f7;
        }

        body.dark-mode .glass-panel {
            background: rgba(30, 30, 30, 0.78);
            border-color: rgba(255, 255, 255, 0.15);
            color: #f2f2f7;
        }

        body.dark-mode .data-value, body.dark-mode .back-btn,
        body.dark-mode .side-btn, body.dark-mode .side-title {
            color: #f2f2f7;
        }

        body.dark-mode .side-btn {
            background: rgba(60, 64, 78, 0.8);
            border-color: rgba(255, 255, 255, 0.1);
        }

        body.dark-mode .side-btn.active {
            background: #007aff;
            color: #fff;
        }

        body.dark-mode .icon-btn {
            background: rgba(40, 40, 40, 0.75);
            color: #fff;
        }

        body.dark-mode .bar-track { background: rgba(255, 255, 255, 0.12); }

        .bottom-right-bar {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }
        button.back-btn, button.tag-badge {
            font-family: inherit;
            border: none;
        }

        @media (max-width: 768px) {
            .bottom-right-bar { bottom: 14px; right: 12px; }
            .center-tooltip { display: none; }
            .top-left-bar { left: 12px; top: 12px; gap: 6px; }
            .back-btn { padding: 7px 12px; font-size: 12px; }
            .tag-badge { padding: 7px 12px; font-size: 12px; }
            .top-right-bar { top: 12px; right: 12px; gap: 6px; }
            .data-card { gap: 8px; padding: 7px 10px; }
            .data-label { font-size: 9px; }
            .data-value { font-size: 11.5px; }
            .icon-btn { width: 34px; height: 34px; }
            .meter-panel { display: none; }
            .side-panel {
                right: 12px;
                left: 12px;
                top: auto;
                bottom: 112px;
                width: auto;
                padding: 9px 12px;
                gap: 6px;
            }
            .action-panel {
                right: 12px;
                left: 12px;
                top: auto;
                bottom: 54px;
                width: auto;
                display: flex;
                flex-direction: row;
                gap: 6px;
            }
            .action-panel .side-btn {
                flex: 1;
                width: auto;
                height: 54px;
                font-size: 9.5px;
            }
            .action-panel .side-btn span:first-child { font-size: 14px; }
        }
    













/* @@MOBILE-BASE v1@@ */
/* ============================================================
   모바일 반응형 보정 (세로/가로) — 자동 생성 블록
   ============================================================ */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
img, canvas { max-width: 100%; }

/* ---------- 모바일 세로 (폭 900px 이하) ---------- */
@media (max-width: 900px) {
    /* 1행: [메인][제목]  ...  [전체화면 아이콘] */
    .top-left-bar {
        top: max(8px, env(safe-area-inset-top)) !important;
        left: 8px !important;
        right: 56px !important;
        gap: 6px !important;
        flex-wrap: nowrap !important;
        align-items: center !important;
        overflow: hidden;
    }
    .top-left-bar .back-btn,
    .top-left-bar > a {
        flex: 0 0 auto;
        padding: 6px 10px !important;
        font-size: 12px !important;
        gap: 4px !important;
        white-space: nowrap;
    }
    .top-left-bar .tag-badge {
        flex: 0 1 auto;
        min-width: 0;
        padding: 6px 10px !important;
        font-size: 12px !important;
        gap: 5px !important;
        white-space: nowrap;
        overflow: hidden;
    }
    .top-left-bar .tag-badge > span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .tag-pill { font-size: 9px !important; padding: 1px 6px !important; flex: 0 0 auto; }

    /* 2행: [데이터 카드 .............][테마] */
    .top-right-bar {
        top: calc(max(8px, env(safe-area-inset-top)) + 40px) !important;
        left: 8px !important;
        right: 8px !important;
        gap: 6px !important;
        justify-content: flex-end !important;
        flex-wrap: nowrap !important;
    }
    .data-card {
        flex: 1 1 0%;
        min-width: 0;
        gap: 4px !important;
        padding: 6px 8px !important;
        justify-content: space-around !important;
        overflow: hidden;
    }
    .data-card { flex-direction: row !important; align-items: center !important; flex-wrap: nowrap !important; }
    .data-item { min-width: 0; flex-direction: column !important; align-items: center !important; gap: 0 !important; }
    .data-item > * { white-space: nowrap; }
    .voltmeter-display { font-size: 24px !important; }
    .data-label { font-size: 9px !important; white-space: nowrap; line-height: 1.2; }
    .data-value { font-size: 12.5px !important; white-space: nowrap; line-height: 1.25; }
    .icon-btn { width: 34px !important; height: 34px !important; min-width: 34px; font-size: 15px !important; flex: 0 0 auto; }

    /* 전체화면: 1행 우측 아이콘 버튼 (글자는 숨김) */
    .bottom-right-bar {
        top: max(8px, env(safe-area-inset-top)) !important;
        bottom: auto !important;
        right: 8px !important;
        left: auto !important;
        z-index: 20;
    }
    .bottom-right-bar button,
    .bottom-right-bar .back-btn {
        padding: 6px 9px !important;
        font-size: 14px !important;
        gap: 4px !important;
        line-height: 1;
    }
    .bottom-right-bar #fullscreenText,
    .bottom-right-bar .fs-text { display: none !important; }

    /* 안내 문구 */
    .center-tooltip, #guide-tooltip {
        top: calc(max(8px, env(safe-area-inset-top)) + 88px) !important;
        left: 8px !important;
        right: 8px !important;
        transform: none !important;
        margin: 0 auto;
        width: auto !important;
        max-width: none !important;
        font-size: 11.5px !important;
        padding: 7px 12px !important;
        white-space: normal !important;
        line-height: 1.45;
        text-align: center;
        z-index: 15 !important;
    }

    /* 하단 컨트롤 바: 화면 폭 전체, 한 줄 유지 */
    .bottom-control-bar {
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        transform: none !important;
        width: 100% !important;
        border-radius: 18px 18px 0 0 !important;
        padding: 6px 6px calc(6px + env(safe-area-inset-bottom)) !important;
        gap: 2px !important;
        justify-content: space-around !important;
        flex-wrap: nowrap !important;
        overflow: visible;
    }
    .control-tab-btn {
        flex: 1 1 0 !important;
        min-width: 0 !important;
        padding: 5px 2px !important;
        font-size: 10.5px !important;
        gap: 1px !important;
        border-radius: 12px !important;
        white-space: nowrap !important;
        line-height: 1.15;
    }
    .control-tab-btn span { white-space: nowrap !important; }
    .control-tab-btn span:first-child { font-size: 15px !important; line-height: 1.1; }

    /* 슬라이더 등 서브 패널 */
    .sub-panel {
        left: 8px !important;
        right: 8px !important;
        bottom: calc(76px + env(safe-area-inset-bottom)) !important;
        transform: none !important;
        width: auto !important;
        max-width: none !important;
        max-height: 46vh;
        overflow-y: auto;
        padding: 13px 14px !important;
        gap: 10px !important;
        -webkit-overflow-scrolling: touch;
    }
    .sub-panel-title { font-size: 11px !important; }
    .slider-header { font-size: 11px !important; }
    .control-row { gap: 5px !important; flex-wrap: wrap; }
    .toggle-btn, .mode-btn, .quick-btn, .example-item, .preset-btn { font-size: 11px !important; }
    input[type="range"] { height: 22px; }

    /* 팝업(모달)이 화면을 넘지 않도록 */
    .modal-overlay { padding: 12px !important; align-items: center !important; }
    .modal-card {
        max-height: 88vh !important;
        overflow-y: auto !important;
        width: auto !important;
        max-width: 100% !important;
        padding: 16px !important;
        -webkit-overflow-scrolling: touch;
    }
    .modal-title { font-size: 15px !important; }
    .modal-body { font-size: 12px !important; }
    .example-title { font-size: 11.5px !important; }
    .example-desc { font-size: 11px !important; line-height: 1.5 !important; }
}

@media (max-width: 430px) {
    /* 아주 좁은 화면에서는 장식용 배지를 숨겨 제목 자리를 확보 */
    .tag-pill { display: none !important; }
}

/* ---------- 모바일 가로 (높이 500px 이하) ---------- */
@media (max-height: 500px) and (orientation: landscape) {
    .top-left-bar {
        top: max(6px, env(safe-area-inset-top)) !important;
        left: 6px !important;
        right: auto !important;
        max-width: 46vw;
        gap: 5px !important;
    }
    .top-left-bar .back-btn,
    .top-left-bar > a,
    .top-left-bar .tag-badge {
        padding: 4px 9px !important;
        font-size: 11px !important;
        height: 30px;
    }
    .tag-pill { display: none !important; }

    .top-right-bar {
        top: max(6px, env(safe-area-inset-top)) !important;
        right: 88px !important;
        left: auto !important;
        gap: 5px !important;
    }
    .data-card { padding: 4px 9px !important; gap: 9px !important; flex: 0 0 auto; }
    .data-label { font-size: 8.5px !important; }
    .data-value { font-size: 11.5px !important; }
    .icon-btn { width: 28px !important; height: 28px !important; min-width: 28px; font-size: 13px !important; }

    .bottom-right-bar {
        top: max(6px, env(safe-area-inset-top)) !important;
        bottom: auto !important;
        right: 6px !important;
        z-index: 20;
    }
    .bottom-right-bar button,
    .bottom-right-bar .back-btn { padding: 4px 8px !important; font-size: 13px !important; }
    .bottom-right-bar #fullscreenText,
    .bottom-right-bar .fs-text { display: none !important; }

    .center-tooltip, #guide-tooltip {
        top: auto !important;
        bottom: 56px !important;
        left: 50% !important;
        right: auto !important;
        transform: none !important;
        width: max-content !important;
        max-width: 44vw !important;
        font-size: 10px !important;
        padding: 4px 9px !important;
        line-height: 1.3;
    }

    /* 가로 모드에서 각종 패널을 구석으로 모아 3D 화면을 가리지 않게 한다 */
    .side-panel { top: 44px !important; right: 8px !important; left: auto !important; width: 214px !important; padding: 7px 9px !important; gap: 4px !important; }
    .side-title { font-size: 10.5px !important; }
    .side-scale { font-size: 8.5px !important; }
    .meter-panel { left: 8px !important; bottom: 40px !important; top: auto !important; width: 190px !important; padding: 6px 8px !important; gap: 3px !important; }
    .meter-title { font-size: 9.5px !important; }
    .action-panel { top: auto !important; bottom: 40px !important; right: 8px !important; left: auto !important; grid-template-columns: repeat(2, 44px) !important; gap: 4px !important; }
    .side-btn { width: 44px !important; height: 44px !important; font-size: 8.5px !important; border-radius: 12px !important; gap: 1px !important; }
    .energy-panel { left: 8px !important; bottom: 40px !important; top: auto !important; width: 176px !important; padding: 6px 8px !important; gap: 4px !important; }
    .energy-title, .panel-note { font-size: 9px !important; line-height: 1.3 !important; }
    .info-panel { right: 8px !important; bottom: 40px !important; top: auto !important; min-width: 128px !important; padding: 6px 8px !important; gap: 2px !important; }
    .info-row { font-size: 9.5px !important; gap: 8px !important; }
    .view-panel { left: 8px !important; bottom: 40px !important; top: auto !important; padding: 6px 8px !important; }
    .phase-panel { left: 8px !important; bottom: 40px !important; top: auto !important; padding: 6px 8px !important; }
    .graph-panel { max-height: 40vh; width: 182px !important; }
    .legend, .panel-note { font-size: 9px !important; }

    .bottom-control-bar {
        left: 50% !important;
        right: auto !important;
        bottom: 4px !important;
        transform: none !important;
        width: auto !important;
        max-width: calc(100vw - 12px);
        border-radius: 14px !important;
        padding: 4px 8px !important;
        gap: 3px !important;
    }
    .control-tab-btn {
        flex: 0 0 auto !important;
        min-width: 46px !important;
        padding: 3px 9px !important;
        font-size: 10px !important;
        gap: 3px !important;
        align-items: center !important;
        justify-content: center !important;
    }
    .control-tab-btn span:first-child { font-size: 13px !important; }

    .sub-panel {
        left: 50% !important;
        right: auto !important;
        bottom: 72px !important;
        transform: none !important;
        width: min(400px, calc(100vw - 24px)) !important;
        max-width: min(400px, calc(100vw - 24px)) !important;
        max-height: 62vh;
        overflow-y: auto;
        padding: 9px 12px !important;
        gap: 6px !important;
    }
    .sub-panel .slider-row { gap: 3px !important; }
    .slider-header { font-size: 10.5px !important; }

    .modal-overlay { padding: 8px !important; }
    .modal-card {
        max-height: 94vh !important;
        overflow-y: auto !important;
        width: auto !important;
        max-width: min(460px, 96vw) !important;
        padding: 12px 14px !important;
    }
    .modal-title { font-size: 14px !important; }
    .modal-body { font-size: 11.5px !important; }
    .example-desc { font-size: 11px !important; line-height: 1.45 !important; }
}

/* ---------- 몰입(의사 전체화면) 모드 ---------- */
html.pseudo-fs .top-left-bar .tag-badge,
html.pseudo-fs .top-right-bar,
html.pseudo-fs .center-tooltip,
html.pseudo-fs #guide-tooltip { display: none !important; }
html.pseudo-fs .top-left-bar { right: 56px !important; }
html.pseudo-fs #fullscreenBtn,
html.pseudo-fs .bottom-right-bar { display: flex !important; }

/* ---------- 전체화면 시 캔버스 채움 ---------- */
body.is-fullscreen #canvas-container,
body.is-fullscreen #webgl-container { width: 100vw !important; height: 100vh !important; }

    <!-- 좌측 하단 계기 패널 -->

    <div class="bottom-right-bar">

        </button>
    </div>

    <script>
        // --- 1. 씬 설정 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf2f2f7);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 120);
        camera.position.set(0, 2.6, 8.4);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.target.set(0, 1.5, 0);
        controls.maxPolarAngle = Math.PI / 2 + 0.03;
        controls.minDistance = 4;
        controls.maxDistance = 22;

        // --- 2. 조명 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.68);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(4, 9, 7);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.left = -8;
        dirLight.shadow.camera.right = 8;
        dirLight.shadow.camera.top = 8;
        dirLight.shadow.camera.bottom = -8;
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0xd6e6ff, 0.35);
        fillLight.position.set(-6, 4, -5);
        scene.add(fillLight);

        // --- 3. 바닥 ---
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(40, 40),
            new THREE.MeshStandardMaterial({ color: 0xe8ecf2, roughness: 0.95 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = 0;
        floor.receiveShadow = true;
        scene.add(floor);

        // --- 4. 텍스트 라벨 ---
        const LABEL_FONT = '"SeoulNamsan", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif';
        const labelRegistry = [];
        function makeLabel(text, color, scale) {
            const c = document.createElement('canvas');
            c.width = 320; c.height = 96;
            const ctx = c.getContext('2d');
            ctx.fillStyle = 'rgba(255,255,255,0.88)';
            const r = 24;
            ctx.beginPath();
            ctx.moveTo(r, 6);
            ctx.lineTo(320 - r, 6);
            ctx.quadraticCurveTo(314, 6, 314, 6 + r * 0.6);
            ctx.lineTo(314, 90 - r * 0.6);
            ctx.quadraticCurveTo(314, 90, 320 - r, 90);
            ctx.lineTo(r, 90);
            ctx.quadraticCurveTo(6, 90, 6, 90 - r * 0.6);
            ctx.lineTo(6, 6 + r * 0.6);
            ctx.quadraticCurveTo(6, 6, r, 6);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = color || '#1c1c1e';
            ctx.font = 'bold 40px ' + LABEL_FONT;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 160, 50);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
                map: new THREE.CanvasTexture(c), transparent: true, depthTest: false
            }));
            const s = scale || 1;
            sprite.scale.set(1.75 * s, 0.525 * s, 1);
            labelRegistry.push({ canvas: c, ctx: ctx, text: text, color: color || '#1c1c1e', sprite: sprite });
            return sprite;
        }

        /* 서울남산체 로드가 늦어도 3D 라벨이 서울남산체로 다시 그려지도록 */
        function redrawLabels() {
            labelRegistry.forEach(function (L) {
                const cx = L.ctx, w = L.canvas.width;
                cx.clearRect(0, 0, L.canvas.width, L.canvas.height);
                cx.fillStyle = 'rgba(255,255,255,0.88)';
                const r = 24;
                cx.beginPath();
                cx.moveTo(r, 6);
                cx.lineTo(w - r, 6);
                cx.quadraticCurveTo(w - 6, 6, w - 6, 6 + r * 0.6);
                cx.lineTo(w - 6, 90 - r * 0.6);
                cx.quadraticCurveTo(w - 6, 90, w - r, 90);
                cx.lineTo(r, 90);
                cx.quadraticCurveTo(6, 90, 6, 90 - r * 0.6);
                cx.lineTo(6, 6 + r * 0.6);
                cx.quadraticCurveTo(6, 6, r, 6);
                cx.closePath();
                cx.fill();
                cx.fillStyle = L.color;
                cx.font = 'bold 40px ' + LABEL_FONT;
                cx.textAlign = 'center';
                cx.textBaseline = 'middle';
                cx.fillText(L.text, w / 2, 50);
                if (L.sprite && L.sprite.material && L.sprite.material.map) L.sprite.material.map.needsUpdate = true;
            });
        }
        if (document.fonts && document.fonts.load) {
            document.fonts.load('bold 40px "SeoulNamsan"').then(redrawLabels, function () {});
            if (document.fonts.ready) document.fonts.ready.then(redrawLabels, function () {});
        }
        window.addEventListener('load', function () { setTimeout(redrawLabels, 400); });

        // =====================================================
        //  왼쪽: 사람의 흉강 모형
        // =====================================================
        const HUMAN_X = -2.55;
        const humanGroup = new THREE.Group();
        humanGroup.position.set(HUMAN_X, 0, 0);
        scene.add(humanGroup);

        // 몸통 실루엣 (라테스 곡면)
        const torsoProfile = [
            [0.5, 0.0], [0.62, 0.2], [0.68, 0.5], [0.72, 0.85],
            [0.78, 1.2], [0.8, 1.5], [0.76, 1.8], [0.62, 2.05],
            [0.42, 2.2], [0.24, 2.3], [0.22, 2.45]
        ].map(p => new THREE.Vector2(p[0], p[1]));

        const torsoMat = new THREE.MeshPhysicalMaterial({
            color: 0xffd3b6,
            transparent: true,
            opacity: 0.2,
            roughness: 0.4,
            metalness: 0.0,
            side: THREE.DoubleSide,
            depthWrite: false
        });
        const torso = new THREE.Mesh(new THREE.LatheGeometry(torsoProfile, 48), torsoMat);
        torso.position.y = 0.18;
        humanGroup.add(torso);

        // 실루엣: 어깨 · 목 · 머리
        [-1, 1].forEach(side => {
            const shoulder = new THREE.Mesh(new THREE.SphereGeometry(0.27, 24, 18), torsoMat);
            shoulder.position.set(side * 0.56, 2.06, 0);
            shoulder.scale.set(1, 0.85, 0.9);
            humanGroup.add(shoulder);
        });

        const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.2, 0.24, 20), torsoMat);
        neck.position.set(0, 2.55, 0);
        humanGroup.add(neck);

        const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 28, 20), torsoMat);
        head.position.set(0, 2.9, 0.02);
        head.scale.set(0.92, 1.1, 0.95);
        humanGroup.add(head);

        // 척추
        const boneMat = new THREE.MeshStandardMaterial({ color: 0xf1ead8, roughness: 0.6 });
        const spine = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 1.1, 16), boneMat);
        spine.position.set(0, 1.55, -0.52);
        humanGroup.add(spine);

        // 갈비뼈 그룹 (척추에서 시작해 옆구리를 돌아 흉골로 이어지는 곡면 늑골)
        const ribCage = new THREE.Group();
        humanGroup.add(ribCage);

        function buildRibCage() {
            const RIB_PAIRS = 7;
            const ribs = [];

            for (let i = 0; i < RIB_PAIRS; i++) {
                const frac = i / (RIB_PAIRS - 1);              // 0 = 위쪽 갈비, 1 = 아래쪽 갈비
                const yBack = 1.98 - frac * 0.58;               // 척추 쪽 높이
                const rMax = 0.33 + Math.sin(Math.PI * (0.18 + 0.62 * frac)) * 0.15;
                const drop = 0.06 + frac * 0.11;                // 앞쪽이 뒤쪽보다 낮게 처짐
                const zBack = 0.4;
                const zFront = 0.45 + frac * 0.03;

                [-1, 1].forEach(side => {
                    const pts = [];
                    const N = 16;
                    for (let k = 0; k <= N; k++) {
                        const u = -Math.PI / 2 + (k / N) * Math.PI;   // 뒤(-90°) -> 옆(0°) -> 앞(+90°)
                        const tt = k / N;
                        const x = side * rMax * Math.cos(u) * (0.95 + 0.05 * Math.sin(Math.PI * tt));
                        const z = (zFront - zBack) / 2 + (zFront + zBack) / 2 * Math.sin(u);
                        const smooth = tt * tt * (3 - 2 * tt);
                        const y = yBack - drop * smooth - 0.02 * Math.sin(Math.PI * tt);
                        pts.push(new THREE.Vector3(x, y, z));
                    }
                    const curve = new THREE.CatmullRomCurve3(pts);
                    const geo = new THREE.TubeGeometry(curve, 44, 0.025, 6, false);
                    const rib = new THREE.Mesh(geo, boneMat);
                    rib.castShadow = true;
                    ribCage.add(rib);
                    ribs.push(rib);
                });
            }

            // 갈비사이(늑간) 느낌의 얇은 결합 조직
            for (let i = 0; i < RIB_PAIRS - 1; i++) {
                const frac = i / (RIB_PAIRS - 1);
                const y = 1.95 - frac * 0.58 - 0.05;
                const r = 0.33 + Math.sin(Math.PI * (0.18 + 0.62 * frac)) * 0.15;
                [-1, 1].forEach(side => {
                    const arc = new THREE.Mesh(
                        new THREE.TorusGeometry(r * 0.96, 0.008, 6, 28, Math.PI * 0.9),
                        new THREE.MeshStandardMaterial({ color: 0xe6d4c4, roughness: 0.8, transparent: true, opacity: 0.55 })
                    );
                    arc.rotation.x = Math.PI / 2 + 0.08;
                    arc.rotation.z = side > 0 ? -Math.PI * 0.05 : Math.PI * 1.05;
                    arc.position.set(0, y, 0.02);
                    ribCage.add(arc);
                });
            }

            return ribs;
        }

        const ribMeshes = buildRibCage();

        // 복장뼈
        const sternum = new THREE.Mesh(new THREE.BoxGeometry(0.085, 0.6, 0.045), boneMat);
        sternum.position.set(0, 1.66, 0.47);
        humanGroup.add(sternum);

        // 폐 (위는 좁고 아래로 넓어지는 모양)
        const lungMat = new THREE.MeshStandardMaterial({
            color: 0xff8d9e, roughness: 0.42, metalness: 0.0, transparent: true, opacity: 0.9
        });

        const lungProfile = [
            [0.02, 0.0], [0.08, 0.05], [0.135, 0.14], [0.18, 0.26],
            [0.215, 0.4], [0.24, 0.55], [0.245, 0.68], [0.225, 0.79],
            [0.17, 0.87], [0.09, 0.91], [0.0, 0.92]
        ].map(p => new THREE.Vector2(p[0], p[1]));

        const lungGeo = new THREE.LatheGeometry(lungProfile, 40);
        lungGeo.translate(0, -0.46, 0);   // 중심을 원점에

        function makeLung(side) {
            const g = new THREE.Group();
            const mesh = new THREE.Mesh(lungGeo, lungMat);
            mesh.scale.set(1, 1, 0.76);       // 앞뒤로 납작하게
            mesh.castShadow = true;
            g.add(mesh);
            g.position.set(side * 0.25, 1.72, 0.01);
            g.rotation.z = side * -0.05;
            g.rotation.y = side * 0.12;
            humanGroup.add(g);
            return g;
        }

        const lungL = makeLung(-1);
        const lungR = makeLung(1);

        // 기관과 기관지
        const airwayMat = new THREE.MeshStandardMaterial({ color: 0xd8ecff, roughness: 0.3, transparent: true, opacity: 0.9 });
        const trachea = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.55, 16), airwayMat);
        trachea.position.set(0, 2.12, 0.03);
        humanGroup.add(trachea);

        const mouth = new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 12), airwayMat);
        mouth.position.set(0, 2.42, 0.03);
        humanGroup.add(mouth);

        [-1, 1].forEach(side => {
            const bronchi = new THREE.Mesh(new THREE.CylinderGeometry(0.038, 0.038, 0.42, 12), airwayMat);
            bronchi.position.set(side * 0.16, 1.79, 0.03);
            bronchi.rotation.z = side * 0.55;
            humanGroup.add(bronchi);
        });

        // 가로막 (돔 모양)
        const diaMat = new THREE.MeshStandardMaterial({
            color: 0xd9534f, roughness: 0.55, metalness: 0.0,
            transparent: true, opacity: 0.95
        });
        const diaphragm = new THREE.Mesh(
            new THREE.SphereGeometry(0.46, 40, 20, 0, Math.PI * 2, 0, Math.PI / 2),
            diaMat
        );
        diaphragm.position.set(0, 0.95, 0.02);
        diaphragm.scale.set(1, 0.8, 1);
        humanGroup.add(diaphragm);

        // 사람 라벨
        const humanLabel = makeLabel('사람의 흉강', '#0057c2', 0.95);
        humanLabel.position.set(HUMAN_X, 3.62, 0);
        scene.add(humanLabel);

        const diaLabel = makeLabel('가로막', '#b03b3b', 0.7);
        diaLabel.position.set(HUMAN_X + 1.0, 0.8, 0.1);
        scene.add(diaLabel);

        // =====================================================
        //  오른쪽: 페트병 호흡 운동 모형
        // =====================================================
        const MODEL_X = 2.55;
        const modelGroup = new THREE.Group();
        modelGroup.position.set(MODEL_X, 0, 0);
        scene.add(modelGroup);

        const JAR_BOTTOM = 1.0;

        // 받침 링 + 다리
        const standMat = new THREE.MeshStandardMaterial({ color: 0x8d99ab, metalness: 0.6, roughness: 0.35 });
        const standGroup = new THREE.Group();
        modelGroup.add(standGroup);

        const standRing = new THREE.Mesh(new THREE.TorusGeometry(0.64, 0.035, 12, 48), standMat);
        standRing.rotation.x = Math.PI / 2;
        standRing.position.y = JAR_BOTTOM;
        standGroup.add(standRing);

        for (let i = 0; i < 3; i++) {
            const a = (i / 3) * Math.PI * 2 + 0.4;
            const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, JAR_BOTTOM, 12), standMat);
            leg.position.set(Math.cos(a) * 0.58, JAR_BOTTOM / 2, Math.sin(a) * 0.58);
            standGroup.add(leg);
        }

        // 유리관(종 모양 통) — 몸체가 실제로 불룩해질 수 있도록 세로로 촘촘히 나눕니다
        const jarProfile = (function () {
            const pts = [[0.6, 0.0], [0.64, 0.06]];
            for (let y = 0.14; y < 1.33; y += 0.08) pts.push([0.64, +y.toFixed(3)]);
            pts.push([0.64, 1.34], [0.58, 1.44], [0.34, 1.54], [0.2, 1.6]);
            return pts.map(p => new THREE.Vector2(p[0], p[1]));
        })();

        const jarMat = new THREE.MeshPhysicalMaterial({
            color: 0xbfe0ff,
            transparent: true,
            opacity: 0.24,
            roughness: 0.05,
            metalness: 0.0,
            side: THREE.DoubleSide,
            depthWrite: false
        });

        const jarGroup = new THREE.Group();
        modelGroup.add(jarGroup);

        const jar = new THREE.Mesh(new THREE.LatheGeometry(jarProfile, 48), jarMat);
        jar.position.y = JAR_BOTTOM;
        jarGroup.add(jar);

        /* 통(페트병)만 가운데가 빵빵하게 부풀도록 : 아래 테두리와 목 부분은 고정 */
        const JAR_H = 1.6;
        const jarPosAttr = jar.geometry.attributes.position;
        const jarBasePos = Float32Array.from(jarPosAttr.array);
        function updateJarBulge(t) {
            const amp = 0.55 * t;                 // 들숨 때 최대 반경 +55% (페트병 몸체 변화가 한눈에 체감되도록 확대)
            const arr = jarPosAttr.array;
            for (let i = 0; i < arr.length; i += 3) {
                const v = Math.min(1, Math.max(0, jarBasePos[i + 1] / JAR_H));
                const s = Math.sin(Math.PI * Math.min(1, Math.max(0, (v - 0.02) / 0.94)));
                const f = 1 + amp * Math.pow(Math.max(0, s), 1.1);
                arr[i] = jarBasePos[i] * f;
                arr[i + 2] = jarBasePos[i + 2] * f;
            }
            jarPosAttr.needsUpdate = true;
            jar.geometry.computeVertexNormals();
            jar.geometry.computeBoundingSphere();
        }

        // 마개
        const stopper = new THREE.Mesh(
            new THREE.CylinderGeometry(0.19, 0.2, 0.16, 32),
            new THREE.MeshStandardMaterial({ color: 0x5b6779, roughness: 0.5 })
        );
        stopper.position.y = JAR_BOTTOM + 1.62;
        modelGroup.add(stopper);

        // Y자 유리관
        const tubeMat = new THREE.MeshStandardMaterial({ color: 0xdfe9f5, roughness: 0.25, metalness: 0.1, transparent: true, opacity: 0.95 });
        const tubeMain = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.52, 16), tubeMat);
        tubeMain.position.y = JAR_BOTTOM + 1.35;
        modelGroup.add(tubeMain);

        [-1, 1].forEach(side => {
            const branch = new THREE.Mesh(new THREE.CylinderGeometry(0.038, 0.038, 0.36, 14), tubeMat);
            branch.position.set(side * 0.16, JAR_BOTTOM + 1.05, 0);
            branch.rotation.z = side * 0.6;
            modelGroup.add(branch);
        });

        // 풍선(폐) - Y자관 끝에 묶인 고무풍선 모양
        const balloonMat = new THREE.MeshStandardMaterial({
            color: 0xff7f95, roughness: 0.38, metalness: 0.0,
            transparent: false, opacity: 1.0, side: THREE.DoubleSide
        });
        const balloonTieMat = new THREE.MeshStandardMaterial({ color: 0xc0392b, roughness: 0.6 });

        const balloonProfile = [
            [0.0, -0.96], [0.09, -0.92], [0.165, -0.85], [0.215, -0.75],
            [0.235, -0.63], [0.225, -0.5], [0.19, -0.36], [0.135, -0.23],
            [0.085, -0.13], [0.052, -0.06], [0.038, -0.015], [0.0, 0.0]
        ].map(p => new THREE.Vector2(p[0], p[1]));

        const balloonGeo = new THREE.LatheGeometry(balloonProfile, 36);

        function makeBalloon(side) {
            const g = new THREE.Group();
            const body = new THREE.Mesh(balloonGeo, balloonMat);
            body.castShadow = true;
            g.add(body);

            // 묶은 목 부분
            const tie = new THREE.Mesh(new THREE.TorusGeometry(0.045, 0.016, 8, 20), balloonTieMat);
            tie.rotation.x = Math.PI / 2;
            tie.position.y = -0.035;
            g.add(tie);

            g.position.set(side * 0.26, JAR_BOTTOM + 1.18, 0);
            g.rotation.z = side * 0.05;
            g.rotation.y = side * 0.15;
            modelGroup.add(g);
            return g;
        }

        const balloonL = makeBalloon(-1);
        const balloonR = makeBalloon(1);
        // 살짝 비대칭으로 자연스럽게
        balloonL.scale.set(1.04, 1, 1.04);
        balloonR.scale.set(0.97, 1, 0.97);

        // 고무막 (가로막 역할)
        //   · 가장자리(반지름 R)는 통 하단 테두리에 묶여 고정 → 변위 0
        //   · 중심부(반지름 0)만 손잡이를 따라 아래로 늘어나 텐트(원뿔)형으로 변형
        const MEM_R = 0.642;        // 통 하단 테두리 반경
        const MEM_RINGS = 28;       // 반경 방향 분할
        const MEM_SEGS = 72;        // 원주 방향 분할
        const MEM_DEPTH = 0.46;     // 들숨 시 중심부가 내려가는 최대 깊이
        const MEM_DOME = 0.045;     // 날숨 시 살짝 위로 볼록해지는 정도

        // 반경비 u(0=중심, 1=가장자리)에 대한 인장 형상.
        // 테두리에서는 접선이 수평으로 붙어 있고, 중심으로 갈수록 뾰족하게 당겨지는 곡면.
        function membraneShape(u) {
            return Math.pow(1 - u, 1.3);
        }

        const membraneMat = new THREE.MeshStandardMaterial({
            color: 0xe74c3c, roughness: 0.42, metalness: 0.04, side: THREE.DoubleSide
        });

        const membraneGroup = new THREE.Group();
        modelGroup.add(membraneGroup);

        const membraneGeo = new THREE.BufferGeometry();
        const memVertCount = (MEM_RINGS + 1) * (MEM_SEGS + 1);
        membraneGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(memVertCount * 3), 3));
        membraneGeo.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(memVertCount * 2), 2));
        const memIndex = [];
        for (let i = 0; i < MEM_RINGS; i++) {
            for (let j = 0; j < MEM_SEGS; j++) {
                const a = (MEM_SEGS + 1) * i + j;
                const b = a + MEM_SEGS + 1;
                memIndex.push(a, b, a + 1, a + 1, b, b + 1);
            }
        }
        membraneGeo.setIndex(memIndex);

        const membrane = new THREE.Mesh(membraneGeo, membraneMat);
        membrane.castShadow = true;
        membraneGroup.add(membrane);

        // 통 하단 테두리에 고무막을 단단히 묶어 둔 띠
        const membraneRim = new THREE.Mesh(
            new THREE.TorusGeometry(MEM_R, 0.026, 12, 72),
            new THREE.MeshStandardMaterial({ color: 0xc0392b, roughness: 0.5 })
        );
        membraneRim.rotation.x = Math.PI / 2;
        membraneRim.position.y = JAR_BOTTOM;
        membraneGroup.add(membraneRim);

        // 중심부를 잡아당기는 손잡이
        const membraneHandle = new THREE.Mesh(new THREE.SphereGeometry(0.1, 20, 16), membraneMat);
        membraneGroup.add(membraneHandle);

        const handleRod = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 1, 10), membraneMat);
        membraneGroup.add(handleRod);

        // 고무막 형상과 손잡이 위치 갱신 (t: 0 = 날숨, 1 = 들숨)
        function updateMembrane(t) {
            const apexDy = MEM_DOME * (1 - t) * (1 - t) - MEM_DEPTH * t;
            const pos = membrane.geometry.attributes.position.array;
            const uv = membrane.geometry.attributes.uv.array;
            let v = 0, uvI = 0;
            for (let i = 0; i <= MEM_RINGS; i++) {
                const u = i / MEM_RINGS;
                const r = MEM_R * u;
                const dy = apexDy * membraneShape(u);
                for (let j = 0; j <= MEM_SEGS; j++) {
                    const ang = (j / MEM_SEGS) * Math.PI * 2;
                    const cx = Math.cos(ang), cz = Math.sin(ang);
                    pos[v] = r * cx;
                    pos[v + 1] = JAR_BOTTOM + dy;
                    pos[v + 2] = r * cz;
                    uv[uvI] = 0.5 + 0.5 * u * cx;
                    uv[uvI + 1] = 0.5 + 0.5 * u * cz;
                    v += 3; uvI += 2;
                }
            }
            membrane.geometry.attributes.position.needsUpdate = true;
            membrane.geometry.attributes.uv.needsUpdate = true;
            membrane.geometry.computeVertexNormals();
            membrane.geometry.computeBoundingSphere();

            // 손잡이는 항상 고무막 중심(꼭짓점)에 매달려 함께 움직인다
            const apexY = JAR_BOTTOM + apexDy;
            handleRod.scale.set(1, 0.11, 1);
            handleRod.position.y = apexY - 0.055;
            membraneHandle.position.y = apexY - 0.17;
        }

        // 모형 라벨
        const modelLabel = makeLabel('페트병 호흡 모형', '#7a3bbb', 0.95);
        modelLabel.position.set(MODEL_X, 3.32, 0);
        scene.add(modelLabel);

        const memLabel = makeLabel('빨간 고무막', '#b03b3b', 0.66);
        memLabel.position.set(MODEL_X - 1.05, 0.95, 0.1);
        scene.add(memLabel);

        /* ---------- 화면 비율에 맞춰 두 모형이 화면 안에 모두 들어오도록 시점 조정 ---------- */
        let baseDist = 8.4, baseY = 2.6;
        let lastPortrait = null;
        function fitScene(force) {
            const w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight);
            const portrait = w < h * 0.95;
            const s = portrait ? 0.74 : 1;               // 세로 화면에서는 두 모형을 가까이 모은다
            humanGroup.position.x = HUMAN_X * s;
            modelGroup.position.x = MODEL_X * s;
            humanLabel.position.x = HUMAN_X * s;
            modelLabel.position.x = MODEL_X * s;
            diaLabel.position.x = HUMAN_X * s + 1.0;
            memLabel.position.x = MODEL_X * s - 1.05;

            // 필요한 가로 반폭(라벨 폭 포함)에 맞춰 카메라 거리 계산
            const halfW = 2.55 * s + 1.0;
            camera.aspect = w / h;
            camera.fov = 45;
            const hHalf = Math.atan(Math.tan(camera.fov * Math.PI / 360) * camera.aspect);
            let dist = halfW / Math.tan(hHalf);
            dist = Math.max(8.4, Math.min(20, dist));
            baseDist = dist;
            baseY = portrait ? 2.4 : 2.6;
            camera.updateProjectionMatrix();

            if (force || lastPortrait !== portrait) {
                camera.position.set(0, baseY, baseDist);
                controls.target.set(0, 1.5, 0);
                lastPortrait = portrait;
            }
        }
        window.__fitBreathingScene = function () { fitScene(false); };
        fitScene(true);
        window.addEventListener('resize', function () { fitScene(false); });
        window.addEventListener('orientationchange', function () { setTimeout(function () { fitScene(true); }, 260); });

        // =====================================================
        //  공기 흐름 입자
        // =====================================================
        const airPoints = [];
        const airGeo = new THREE.SphereGeometry(0.035, 8, 6);
        const airMat = new THREE.MeshBasicMaterial({ color: 0x4fc3f7, transparent: true, opacity: 0.0 });
        for (let i = 0; i < 10; i++) {
            const p = new THREE.Mesh(airGeo, airMat);
            p.position.set(0, 2.3 - i * 0.05, 0.03);
            humanGroup.add(p);
            airPoints.push({ mesh: p, phase: i / 10 });
        }

        // =====================================================
        //  상태
        // =====================================================
        let breath = 0;
        let targetBreath = 0;
        let autoBreath = true;
        let autoPhase = 0;
        let syncMode = false;
        let isDark = false;
        let dragging = false;
        let dragStartY = 0;
        let dragStartBreath = 0;
        let prevBreath = 0;
        let flowDir = 0;
        let smoothedLungDelta = 0;

        // 폐 내부 압력(대기압 기준) 눈금 상수
        //  FLOW_REF      : 자동 호흡 1주기(7.8초)에서 나오는 최대 흐름 속도(0.5·ω·0.25 ≈ 0.101).
        //                  이 속도를 기준으로 정규화해 자동/수동 모두 같은 압력 폭으로 보이게 한다.
        //  LUNG_DT_MAX   : 기준 속도에서의 압력 변화량 → 들숨 약 -8.8 hPa / 날숨 약 +8.8 hPa (완화 지연 감안)
        //  LUNG_DT_LIMIT : 손으로 더 빨리 조작해도 넘지 않는 최대 변화량(±9.0 hPa)
        const FLOW_REF = 0.101;
        const LUNG_DT_MAX = 8.8;
        const LUNG_DT_LIMIT = 9.0;

        const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        const hitPoint = new THREE.Vector3();

        // --- 호흡 자세 적용 ---
        function applyBreath(t) {
            // 사람: 갈비뼈가 바깥/위로 크게 들리고 가로막이 내려감 (부피 변화가 외관상 확연히 티가 나도록 확대)
            ribCage.scale.set(1 + 0.38 * t, 1, 1 + 0.48 * t);
            ribCage.rotation.x = -0.13 * t;      // 앞쪽 갈비가 위로 들림(펌프 손잡이 운동)
            ribCage.position.y = 0.05 * t;

            diaphragm.position.y = 0.95 - 0.30 * t;
            diaphragm.scale.set(1 + 0.09 * t, 0.8 - 0.55 * t, 1 + 0.09 * t);

            const lungScale = 1 + 0.32 * t;
            lungL.scale.set(lungScale, lungScale * 1.10, lungScale);
            lungR.scale.set(lungScale, lungScale * 1.10, lungScale);
            lungL.position.y = 1.72 - 0.08 * t;
            lungR.position.y = 1.72 - 0.08 * t;

            torso.scale.set(1 + 0.16 * t, 1, 1 + 0.24 * t);

            // 모형: 고무막 가장자리는 통에 고정된 채 중심부만 아래로 늘어남 + 풍선 팽창
            updateMembrane(t);

            const inflate = 0.72 + 0.38 * t;
            balloonL.scale.set(1.06 * inflate, inflate * 1.05, 1.06 * inflate);
            balloonR.scale.set(0.98 * inflate, inflate * 1.05, 0.98 * inflate);

            // 흉강 동기화: 동기화 모드에서만 통(페트병)이 흉강과 똑같이 부풀고,
            // 일반 모드에서는 통이 전혀 변형되지 않아야 한다(동기화 버튼의 의미 유지)
            if (syncMode) {
                updateJarBulge(t);
            } else {
                updateJarBulge(0);
            }
            jarGroup.scale.set(1, 1, 1);
            stopper.scale.set(1, 1, 1);
            membraneGroup.scale.set(1, 1, 1);
            standGroup.scale.set(1, 1, 1);
        }

        function updateReadouts() {
            const t = breath;
            const thoraxPct = 100 + 40 * t;
            const lungLiters = 2.0 + 2.2 * t;          // 날숨 2.00 L ↔ 들숨 4.20 L
            const pressDelta = -10.0 * t;               // 흉강 내 압력: 1013.0 → 1003.0 hPa
            const pressure = 1013 + pressDelta;

            // 폐 내부 압력: 가로막 조작 속도에 따른 감압/가압을 가시적으로 선명하게 표현 (최대 ±8.8 hPa)
            // 조작을 멈추었을 때 급격히 사라지지 않고 서서히 대기압(1013 hPa)으로 평형 복귀하도록 완화
            const lungDelta = -smoothedLungDelta;
            const lungPressure = 1013.0 + lungDelta;

            document.getElementById('val-thorax').innerText = thoraxPct.toFixed(1) + '%';
            const elLung = document.getElementById('val-lung');
            if (elLung) elLung.innerText = lungLiters.toFixed(2) + ' L';

            document.getElementById('val-press').innerText = pressure.toFixed(1) + ' hPa';
            const elLungPress = document.getElementById('val-lung-press');
            if (elLungPress) elLungPress.innerText = lungPressure.toFixed(1) + ' hPa';

            document.getElementById('val-flow').innerText =
                flowDir > 0.02 ? '들숨 (공기 유입)' : (flowDir < -0.02 ? '날숨 (공기 배출)' : '정지');
            document.getElementById('val-flow').style.color =
                flowDir > 0.02 ? '#34c759' : (flowDir < -0.02 ? '#ff9500' : '#8e8e93');

            document.getElementById('bar-thorax').style.width = Math.min(100, t * 100) + '%';
            document.getElementById('bar-lung').style.width = Math.min(100, t * 100) + '%';
            document.getElementById('bar-press').style.width = Math.min(100, Math.abs(pressDelta) / 10.0 * 100) + '%';
            const barLungPress = document.getElementById('bar-lung-press');
            if (barLungPress) barLungPress.style.width = Math.min(100, Math.abs(lungDelta) / LUNG_DT_MAX * 100) + '%';

            document.getElementById('bar-thorax-val').innerText = thoraxPct.toFixed(0) + '%';
            document.getElementById('bar-lung-val').innerText = lungLiters.toFixed(2) + ' L';
            document.getElementById('bar-press-val').innerText = pressDelta.toFixed(1) + ' hPa';
            const barLungPressVal = document.getElementById('bar-lung-press-val');
            if (barLungPressVal) {
                const sign = lungDelta > 0.05 ? '+' : '';
                barLungPressVal.innerText = sign + lungDelta.toFixed(1) + ' hPa';
            }

            document.getElementById('txt-dia').innerText =
                t < 0.15 ? '날숨' : (t > 0.85 ? '들숨' : (flowDir >= 0 ? '들숨 중' : '날숨 중'));

            const flowAbs = Math.min(1, Math.abs(flowDir) * 2.2);
            airMat.opacity = 0.15 + 0.75 * flowAbs;
            airPoints.forEach(p => {
                let phase = (p.phase + performance.now() * 0.0004 * flowDir * 4) % 1;
                if (phase < 0) phase += 1;
                p.mesh.position.y = 2.28 - phase * 0.55;
                p.mesh.position.x = Math.sin(phase * 6) * 0.02;
            });
        }

        // --- UI ---
        const sldDia = document.getElementById('sld-dia');
        sldDia.addEventListener('input', (e) => {
            autoBreath = false;
            updateAutoUI();
            targetBreath = parseFloat(e.target.value) / 100;
        });

        function updateAutoUI() {
            document.getElementById('auto-text').innerText = autoBreath ? '자동 호흡' : '수동 조작';
            document.getElementById('auto-icon').innerText = autoBreath ? '⏸' : '▶';
            document.getElementById('btn-auto').classList.toggle('active', autoBreath);
        }

        document.getElementById('btn-auto').addEventListener('click', () => {
            autoBreath = !autoBreath;
            if (autoBreath) {
                autoPhase = Math.acos(Math.max(-1, Math.min(1, 1 - 2 * breath)));
            } else {
                targetBreath = breath;
                sldDia.value = Math.round(breath * 100);
            }
            updateAutoUI();
        });

        function updateSyncUI() {
            document.getElementById('btn-compare').classList.toggle('active', syncMode);

            if (syncMode) {
                document.getElementById('guide-tooltip').innerText =
                    '🫁 동기화 모드: 들숨이면 통도 사람의 흉강과 똑같이 부풀어 오릅니다';
            } else {
                document.getElementById('guide-tooltip').innerText =
                    '💡 빨간 고무막을 아래로 당기면 풍선으로 된 폐가 부풀어 오릅니다';
            }
        }

        document.getElementById('btn-compare').addEventListener('click', () => {
            syncMode = !syncMode;
            updateSyncUI();
            applyBreath(breath);
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            breath = 0;
            targetBreath = 0;
            autoBreath = true;
            autoPhase = 0;
            sldDia.value = 0;
            updateAutoUI();
            if (syncMode) { syncMode = false; updateSyncUI(); }
            camera.position.set(0, baseY, baseDist);
            controls.target.set(0, 1.5, 0);
            wideView = false;
            document.getElementById('view-text').innerText = '정면 시점';
            applyBreath(0);
        });

        let wideView = false;
        document.getElementById('btn-view').addEventListener('click', () => {
            wideView = !wideView;
            if (wideView) {
                camera.position.set(0, baseY * 1.65, baseDist * 0.8);
                controls.target.set(0, 1.45, 0);
                document.getElementById('view-text').innerText = '비스듬 시점';
            } else {
                camera.position.set(0, baseY, baseDist);
                controls.target.set(0, 1.5, 0);
                document.getElementById('view-text').innerText = '정면 시점';
            }
        });

        document.getElementById('theme-toggle').addEventListener('click', (e) => {
            isDark = !isDark;
            document.body.classList.toggle('dark-mode', isDark);
            e.currentTarget.innerText = isDark ? '☀️' : '🌙';
            scene.background.setHex(isDark ? 0x121212 : 0xf2f2f7);
            floor.material.color.setHex(isDark ? 0x1c1c1e : 0xe8ecf2);
        });

        // --- 안내 팁: 첫 조작이 시작되면 자동으로 사라짐 ---
        const guideTooltip = document.getElementById('guide-tooltip');
        function hideGuideTip() {
            if (guideTooltip) guideTooltip.classList.add('hidden');
        }
        sldDia.addEventListener('input', hideGuideTip);
        document.querySelectorAll('.action-panel .side-btn').forEach(btn => {
            btn.addEventListener('click', hideGuideTip);
        });
        renderer.domElement.addEventListener('pointerdown', hideGuideTip);

        // --- 고무막 드래그 ---
        function setPointer(e) {
            pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
            pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
        }

        renderer.domElement.addEventListener('pointerdown', (e) => {
            setPointer(e);
            raycaster.setFromCamera(pointer, camera);
            const hits = raycaster.intersectObjects([membrane, membraneHandle, handleRod], false);
            if (hits.length > 0) {
                dragging = true;
                autoBreath = false;
                updateAutoUI();
                controls.enabled = false;
                dragStartBreath = breath;
                raycaster.ray.intersectPlane(dragPlane, hitPoint);
                dragStartY = hitPoint.y;
            }
        });

        renderer.domElement.addEventListener('pointermove', (e) => {
            if (!dragging) return;
            setPointer(e);
            raycaster.setFromCamera(pointer, camera);
            if (raycaster.ray.intersectPlane(dragPlane, hitPoint)) {
                const delta = (dragStartY - hitPoint.y) / 0.46;
                targetBreath = Math.max(0, Math.min(1, dragStartBreath + delta));
                sldDia.value = Math.round(targetBreath * 100);
            }
        });

        window.addEventListener('pointerup', () => {
            if (dragging) {
                dragging = false;
                controls.enabled = true;
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 루프 ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);

            if (autoBreath) {
                autoPhase += dt * (Math.PI * 2 / 7.8); // 1주기 약 7.8초 (학생들의 시선에 맞춰 천천히 관찰할 수 있도록 감속)
                breath = 0.5 - 0.5 * Math.cos(autoPhase);
                sldDia.value = Math.round(breath * 100);
            } else {
                breath += (targetBreath - breath) * Math.min(1, dt * 7);
            }

            flowDir = (breath - prevBreath) / Math.max(dt, 0.0001) * 0.25;
            prevBreath = breath;
            flowDir = Math.max(-1, Math.min(1, flowDir));

            // 폐 내부 압력 동적 감압/가압 계산
            //  · 흐름 속도를 자동 호흡 기준(FLOW_REF)으로 정규화해 자동/수동 모두 ±8.8 hPa까지 보이게 하고,
            //    손으로 더 빨리 움직일 때는 ±9.0 hPa에서 멈춘다.
            //  · 오를 때는 빠르게(약 0.1초) 따라가 숫자가 떨리지 않게 하고,
            //  · 힘을 빼면 약 1.6초에 걸쳐 천천히 대기압으로 돌아와 학생이 수치를 충분히 읽을 수 있게 한다.
            const rawLungDelta = Math.max(-LUNG_DT_LIMIT, Math.min(LUNG_DT_LIMIT,
                (flowDir / FLOW_REF) * LUNG_DT_MAX));
            if (Math.abs(rawLungDelta) >= Math.abs(smoothedLungDelta)) {
                smoothedLungDelta += (rawLungDelta - smoothedLungDelta) * Math.min(1, dt * 12.0);
            } else {
                smoothedLungDelta += (rawLungDelta - smoothedLungDelta) * Math.min(1, dt * 0.62);
            }

            applyBreath(breath);
            updateReadouts();
            controls.update();
            renderer.render(scene, camera);
        }

        applyBreath(0);
        updateReadouts();
        animate();

        /* ---------- Fullscreen / Windowed Mode Logic ---------- */
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const fullscreenIcon = document.getElementById('fullscreenIcon');
        const fullscreenText = document.getElementById('fullscreenText');

        function updateFullscreenUI() {
            const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
            if (fullscreenIcon) fullscreenIcon.innerText = isFS ? '🗗' : '⛶';
            if (fullscreenText) fullscreenText.innerText = isFS ? '창모드' : '전체화면';
        }

        if (fullscreenBtn) {
            fullscreenBtn.addEventListener('click', () => {
                try {
                    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                        const req = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
                        if (req) req.call(document.documentElement);
                    } else {
                        const exit = document.exitFullscreen || document.webkitExitFullscreen;
                        if (exit) exit.call(document);
                    }
                } catch (err) {
                    console.error('전체화면 모드를 전환할 수 없습니다:', err);
                }
            });
        }

        document.addEventListener('fullscreenchange', updateFullscreenUI);
        document.addEventListener('webkitfullscreenchange', updateFullscreenUI);
    </script>

<script>
/* ============ 모바일 화면 재조정 + 전체화면 대체 동작 (자동 생성) ============ */
(function () {
    var docEl = document.documentElement;
    var btn = document.getElementById('fullscreenBtn');
    var icon = document.getElementById('fullscreenIcon');
    var text = document.getElementById('fullscreenText');

    function realFs() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement ||
                  document.mozFullScreenElement || document.msFullscreenElement);
    }
    function pseudo() { return docEl.classList.contains('pseudo-fs'); }
    function setUI() {
        var on = realFs() || pseudo();
        if (icon) icon.textContent = on ? '🗗' : '⛶';
        if (text) text.textContent = on ? '창모드' : '전체화면';
        if (btn) btn.setAttribute('aria-label', on ? '창모드로 전환' : '전체화면으로 전환');
        document.body.classList.toggle('is-fullscreen', on);
    }
    function toast(msg) {
        var t = document.getElementById('ux-toast');
        if (!t) {
            t = document.createElement('div');
            t.id = 'ux-toast';
            t.style.cssText = 'position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);' +
                'background:rgba(28,28,30,.88);color:#fff;font-size:12px;line-height:1.4;padding:9px 14px;border-radius:14px;' +
                'z-index:9999;max-width:86vw;text-align:center;pointer-events:none;transition:opacity .3s;' +
                'font-family:inherit;box-shadow:0 8px 24px rgba(0,0,0,.25)';
            document.body.appendChild(t);
        }
        t.textContent = msg;
        t.style.opacity = '1';
        clearTimeout(t._t);
        t._t = setTimeout(function () { t.style.opacity = '0'; }, 2600);
    }

    if (btn) {
        btn.addEventListener('click', function () {
            var wasReal = realFs();
            var wasPseudo = pseudo();
            setTimeout(function () {
                if (wasReal) { setUI(); return; }          // 진짜 전체화면에서 나온 경우
                if (wasPseudo) { docEl.classList.remove('pseudo-fs'); setUI(); return; }  // 몰입 모드 해제
                if (!realFs()) {                            // 전체화면 API가 동작하지 않는 환경
                    docEl.classList.add('pseudo-fs');
                    try { window.scrollTo(0, 1); } catch (e) {}
                    toast('이 브라우저는 전체화면을 지원하지 않아 상단 정보를 숨긴 몰입 모드로 표시합니다');
                }
                setUI();
            }, 380);
        }, false);
    }
    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
        document.addEventListener(ev, setUI);
    });

    /* 좁은 화면에서는 두 모형이 잘리지 않도록 장면과 시점을 함께 재조정 */
    function mobileFit() {
        try {
            if (typeof window.__fitBreathingScene === 'function') { window.__fitBreathingScene(); return; }
            if (typeof camera === 'undefined' || !camera || !camera.isPerspectiveCamera) return;
            if (!camera.userData) camera.userData = {};
            if (!camera.userData.baseFov) camera.userData.baseFov = camera.fov;
            var w = window.innerWidth, h = window.innerHeight, f = 1;
            var k = 0.62;
            var attr = document.documentElement.getAttribute('data-mzoom');
            if (attr) { var v = parseFloat(attr); if (!isNaN(v) && v > 0) k = v; }
            if (w < h) f = 1 + (1 - w / h) * k;
            else if (h <= 500) f = 1 + k * 0.16;
            camera.fov = Math.min(88, camera.userData.baseFov * f);
            camera.updateProjectionMatrix();
        } catch (e) {}
    }
    mobileFit();

    /* 화면 회전·주소창 변화·전체화면 전환 후 렌더러 크기 재계산 */
    var rt = null;
    function refit() {
        clearTimeout(rt);
        rt = setTimeout(function () {
            mobileFit();
            try { window.dispatchEvent(new Event('resize')); } catch (e) {}
        }, 240);
    }
    window.addEventListener('orientationchange', refit);
    window.addEventListener('pageshow', refit);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) refit(); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', refit);

    setUI();
})();
</script>
