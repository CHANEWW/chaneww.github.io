<style>
/* ============================================================
   Science Virtual LAB — 공통 기반 스타일 (base.css)
   ============================================================ */
@font-face {
    font-family: 'SeoulNamsan';
    src: local('SeoulNamsan M'), local('SeoulNamsanM'), local('서울남산체 M'),
         url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff') format('woff');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'SeoulNamsan', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;

#canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

/* ---------- visionOS 글래스모피즘 ---------- */

/* ---------- 상단 좌측 ---------- */
.top-left-bar {
    position: absolute;

    left: 20px;

    align-items: center;
    gap: 10px;
    z-index: 10;
}
.back-btn {
    display: inline-flex;

    gap: 6px;
    padding: 9px 15px;

    text-decoration: none;

    font-weight: bold;
    font-size: 13.5px;
    cursor: pointer;

}
.back-btn:hover { transform: translateY(-1px); background: rgba(255, 255, 255, 0.95); }
.tag-badge {

}
.tag-pill {

    padding: 2px 7px;

    font-weight: 800;
    letter-spacing: 0.2px;
}
.qr-btn-icon { font-size: 14px; line-height: 1; }
.qr-btn-label { font-size: 12.5px; }

/* ---------- 상단 우측 ---------- */
.top-right-bar {
    position: absolute;
    top: 16px;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 10;
}
.tr-util { display: flex; align-items: center; gap: 8px; }
.icon-btn {
    width: 40px;
    height: 40px;
    display: inline-flex;
    align-items: center;

    border-radius: 50%;

    font-size: 16px;
    padding: 0;

}
.icon-btn:hover { transform: translateY(-1px); background: rgba(255, 255, 255, 0.95); }
.data-card {

.data-item { display: flex; flex-direction: column; align-items: center; line-height: 1.15; }

}

/* ---------- 중앙 힌트 ---------- */
.center-tooltip {

    line-height: 1.5;
    letter-spacing: -0.2px;
    transition: opacity 0.35s ease;
    max-width: min(700px, calc(100vw - 460px));
    word-break: keep-all;
}
.center-tooltip.hidden { opacity: 0; }

/* ---------- 하단 중앙 ---------- */
.bottom-ctrl-bar {
    position: absolute;
    bottom: 22px;
    left: 50%;

    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-radius: 999px;
    z-index: 40;
}
.action-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 999px;

.action-btn:hover { background: #fff; transform: translateY(-1px); }

/* ---------- 우측 하단 전체화면 ---------- */
.bottom-right-bar { position: absolute; bottom: 22px; right: 20px; z-index: 45; }
.fullscreen-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 14px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    font-weight: 800;
    color: #1c1c1e;
    white-space: nowrap;
}

/* ---------- 우측 조절 패널 ---------- */
.side-ctrl-panel {
    position: absolute;
    right: 20px;
    bottom: 76px;
    width: 232px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 60;
    border-radius: 18px;
    max-height: calc(100vh - 150px);
}
.panel-title {
    font-size: 12px;
    font-weight: 800;
    color: #475569;
    letter-spacing: -0.2px;
    text-align: center;
    padding-bottom: 6px;
    border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    flex: 0 0 auto;
}
.panel-body {
    display: flex;
    flex-direction: column;
    gap: 7px;
    overflow-y: auto;
    min-height: 0;
    -webkit-overflow-scrolling: touch;
}
.tab-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; }
.tab-row.three { grid-template-columns: repeat(3, 1fr); }
.ctrl-tab-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 7px 1px;
    border-radius: 12px;
    border: 1px solid rgba(0, 0, 0, 0.08);

    font-family: inherit;
    font-size: 9.5px;
    font-weight: 800;
    line-height: 1.15;
    cursor: pointer;
    white-space: nowrap;
    letter-spacing: -0.3px;
    transition: all 0.2s ease;
}
.ctrl-tab-btn .t-ico { font-size: 14px; line-height: 1; }
.ctrl-tab-btn:hover { background: #ffffff; }
.ctrl-tab-btn.active {
    background: #007aff;
    border-color: #007aff;
    color: #ffffff;
    box-shadow: 0 4px 12px rgba(0, 122, 255, 0.28);
}
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
/* 긴 번역어가 두 칸 안에서 줄바꿈되게 해 패널 밖으로 넘치지 않게 한다(스페인어·영어) */
.seg { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.seg.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.seg .seg-btn { white-space: normal; line-height: 1.15; word-break: keep-all; overflow-wrap: anywhere; }
.seg.three { grid-template-columns: repeat(3, 1fr); }
.seg-btn {
    padding: 8px 1px;
    border-radius: 12px;
    border: 1px solid rgba(0, 0, 0, 0.08);
    background: rgba(255, 255, 255, 0.9);
    color: #334155;
    font-family: inherit;
    font-size: 10.5px;
    font-weight: 800;
    cursor: pointer;
    white-space: nowrap;
    letter-spacing: -0.3px;
    transition: all 0.2s ease;
}
.seg-btn:hover { background: #ffffff; }
.seg-btn.active { background: #0f172a; border-color: #0f172a; color: #ffffff; }
.btn-start {
    width: 100%;
    padding: 11px 8px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, #0ea5e9, #2563eb);
    color: #ffffff;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 900;
    letter-spacing: -0.2px;
    cursor: pointer;
    box-shadow: 0 5px 16px rgba(37, 99, 235, 0.28);
    transition: all 0.2s ease;
    white-space: nowrap;
}
.btn-start:hover { transform: translateY(-1px); }
.btn-start.on { background: linear-gradient(135deg, #22c55e, #0d9488); box-shadow: 0 5px 16px rgba(13, 148, 136, 0.26); }
.btn-start.off { background: linear-gradient(135deg, #94a3b8, #64748b); box-shadow: 0 5px 16px rgba(100, 116, 139, 0.24); }
.ctrl-row { display: flex; align-items: center; gap: 4px; }
.ctrl-row .lbl {
    flex: 0 0 30px;
    font-size: 9.5px;
    font-weight: 800;
    color: #64748b;
    letter-spacing: -0.3px;
    white-space: nowrap;
}
.mini {
    flex: 1 1 0;
    min-width: 0;
    padding: 6px 0;
    border-radius: 9px;
    border: 1px solid rgba(0, 0, 0, 0.08);
    background: rgba(255, 255, 255, 0.9);
    color: #334155;
    font-family: inherit;
    font-size: 10.5px;
    font-weight: 800;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.18s ease;
}
.mini:hover { background: #ffffff; }
.mini.active { background: #0f172a; border-color: #0f172a; color: #ffffff; }
.slider-row { display: flex; flex-direction: column; gap: 3px; }
.slider-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.slider-name { font-size: 10px; font-weight: 800; color: #64748b; letter-spacing: -0.3px; white-space: nowrap; }
.slider-val {
    font-size: 10.5px;
    font-weight: 900;
    color: #2563eb;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
}
input[type="range"].ctrl-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 999px;
    background: #e2e8f0;
    outline: none;
    cursor: pointer;
    margin: 0;
}
input[type="range"].ctrl-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #3b82f6;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(59, 130, 246, 0.4);
    border: 2px solid #fff;
}
input[type="range"].ctrl-slider::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #3b82f6;
    border: 2px solid #fff;
    cursor: pointer;
}
.state-badge {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    padding: 7px 8px;
    border-radius: 12px;
    background: rgba(2, 132, 199, 0.09);
    border: 1px dashed rgba(2, 132, 199, 0.28);
    font-size: 10.5px;
    font-weight: 800;
    color: #0369a1;
    letter-spacing: -0.3px;
    text-align: center;
    overflow: hidden;
}
.state-badge .sb-note { font-size: 8.5px; font-weight: 700; opacity: 0.8; white-space: nowrap; }

/* ---------- 도킹 서브 패널 ---------- */
.sub-panel {
    position: absolute;
    right: 264px;
    bottom: 76px;
    width: 340px;
    max-height: 78vh;
    overflow-y: auto;
    display: none;
    flex-direction: column;
    gap: 10px;
    padding: 13px 15px;
    border-radius: 18px;
    z-index: 55;
    -webkit-overflow-scrolling: touch;
}
.sub-panel.show { display: flex; }
@media (min-width: 901px) {
    body .sub-panel.left { left: 20px !important; right: auto !important; top: auto !important; bottom: 76px !important; width: 330px !important; max-width: 330px !important; max-height: 58vh !important; }
}
.sub-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding-bottom: 5px;
    border-bottom: 1px solid rgba(0, 0, 0, 0.06);
}
.sub-panel-title { font-size: 12.5px; font-weight: 800; color: #1e293b; letter-spacing: -0.3px; }
.sub-close {
    background: rgba(0, 0, 0, 0.06);
    border: none;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 11px;
    font-weight: bold;
    color: #64748b;
    font-family: inherit;
    flex: 0 0 24px;
}
.graph-canvas {
    width: 100%;
    height: 190px;
    display: block;
    border-radius: 12px;
    background: rgba(248, 250, 252, 0.9);
}
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 9.5px; font-weight: 800; color: #64748b; }
.legend i { display: inline-block; width: 14px; height: 8px; border-radius: 3px; margin-right: 4px; vertical-align: middle; }
.note { font-size: 9.5px; color: #7c8899; line-height: 1.45; letter-spacing: -0.2px; }

/* ---------- 다크 모드 ---------- */
body.dark-mode { background-color: #0b1220; color: #e2e8f0; }
body.dark-mode .glass-panel {
    background-color: rgba(22, 30, 45, 0.92);

/* ---------- 이 실험 전용 ---------- */
.gauge-wrap { display: flex; flex-direction: column; gap: 3px; }
.gauge-bar { height: 8px; border-radius: 999px; background: rgba(148, 163, 184, 0.26); overflow: hidden; }

.gauge-line { display: flex; align-items: center; justify-content: space-between; font-size: 9.5px; font-weight: 800; color: #64748b; }

   모바일 반응형 보정 (세로/가로) — 공통 블록
   ============================================================ */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
img, canvas { max-width: 100%; }

<script>
(function () {
    'use strict';

    var $ = function (id) { return document.getElementById(id); };
    function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
    function lerp(a, b, t) { return a + (b - a) * t; }

    var LIGHT_BG = 0xeaf1f2;

    /* ============================================================
       상태
       ============================================================ */
    var state = {
        mode: 'stoma',
        light: 0.60,
        wind: 0.30,
        hum: 0.50,

    };

    var TUBES = [
        { name: '잎 있음', color: '#059669', factor: 1.0 },

        { name: '바세린', color: '#f59e0b', factor: 0.04 },
        { name: '비닐봉지', color: '#3b82f6', factor: 0.11 }
    ];
    var MAX_ML = 38, RUN_SECONDS = 120;

    /* ============================================================
       Three.js 세팅
       ============================================================ */
    var container = $('canvas-container');
    var scene = new THREE.Scene();
    scene.background = new THREE.Color(LIGHT_BG);

    var camera = new THREE.PerspectiveCamera(45, window.innerWidth / Math.max(1, window.innerHeight), 0.1, 300);
    var renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    var controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enablePan = true;
    controls.screenSpacePanning = true;
    controls.minDistance = 2.4;
    controls.maxDistance = 24;
    controls.minPolarAngle = Math.PI * 0.06;
    controls.maxPolarAngle = Math.PI * 0.52;
    controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
    if (THREE.TOUCH) { controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN }; }

    var hemi = new THREE.HemisphereLight(0xffffff, 0xd7e6d9, 0.55);
    scene.add(hemi);
    var key = new THREE.DirectionalLight(0xffffff, 0.92);
    key.position.set(5, 16, 8);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.left = -9;
    key.shadow.camera.right = 9;
    key.shadow.camera.top = 9;
    key.shadow.camera.bottom = -9;
    key.shadow.camera.near = 1;
    key.shadow.camera.far = 40;
    key.shadow.radius = 3;
    scene.add(key);
    var fill = new THREE.DirectionalLight(0xffffff, 0.3);
    fill.position.set(-6, 4, -5);
    scene.add(fill);

    var benchMat = new THREE.MeshStandardMaterial({ color: 0xdce9e4, roughness: 0.94, metalness: 0.02 });
    var bench = new THREE.Mesh(new THREE.PlaneGeometry(70, 46), benchMat);
    bench.rotation.x = -Math.PI / 2;
    bench.receiveShadow = true;
    scene.add(bench);

    /* ============================================================
       A. 잎 뒷면 · 기공
       ============================================================ */
    var groupLeaf = new THREE.Group();
    groupLeaf.position.y = 0.55;
    scene.add(groupLeaf);

    var LEAF_RX = 3.1, LEAF_RY = 0.52, LEAF_RZ = 2.1;
    var leafMat = new THREE.MeshStandardMaterial({ color: 0x3f8f56, roughness: 0.8, metalness: 0.0 });
    var leaf = new THREE.Mesh(new THREE.SphereGeometry(1, 56, 36), leafMat);
    leaf.scale.set(LEAF_RX, LEAF_RY, LEAF_RZ);
    leaf.position.y = 0.0;
    leaf.castShadow = true;
    leaf.receiveShadow = true;
    groupLeaf.add(leaf);

    function surfaceY(x, z) {
        var t = 1 - (x * x) / (LEAF_RX * LEAF_RX) - (z * z) / (LEAF_RZ * LEAF_RZ);
        if (t < 0) t = 0;
        return LEAF_RY * Math.sqrt(t);
    }

    /* 표피 세포(볼록한 세포) */
    var cellMat = new THREE.MeshStandardMaterial({ color: 0x469a60, roughness: 0.88, metalness: 0.0 });
    var cellGeo = new THREE.SphereGeometry(1, 14, 10);
    var STOMA_POS = [[-0.95, 0.15], [0.35, -0.62], [1.15, 0.55]];

    (function buildEpidermis() {
        var placed = 0, tries = 0;
        while (placed < 74 && tries < 900) {
            tries++;
            var a = Math.random() * Math.PI * 2;
            var r = Math.sqrt(Math.random()) * 0.86;
            var x = Math.cos(a) * LEAF_RX * r * 0.92;
            var z = Math.sin(a) * LEAF_RZ * r * 0.92;
            var nearStoma = false;
            for (var i = 0; i < STOMA_POS.length; i++) {
                var dx = x - STOMA_POS[i][0], dz = z - STOMA_POS[i][1];
                if (dx * dx + dz * dz < 0.62 * 0.62) { nearStoma = true; break; }
            }
            if (nearStoma) continue;
            var m = new THREE.Mesh(cellGeo, cellMat);
            var sy = 0.10 + Math.random() * 0.04;
            m.scale.set(0.20 + Math.random() * 0.11, sy, 0.22 + Math.random() * 0.12);
            m.position.set(x, surfaceY(x, z) - 0.02, z);
            m.rotation.y = Math.random() * Math.PI;
            m.castShadow = true;
            groupLeaf.add(m);
            placed++;
        }
    })();

    /* 기공(공변세포 2개 + 기공 틈) */
    var stomas = [];
    function buildStoma(x, z, scaleBase) {
        var g = new THREE.Group();
        var y = surfaceY(x, z);
        g.position.set(x, y + 0.02, z);

        var poreMat = new THREE.MeshBasicMaterial({ color: 0x0b2b18, transparent: true, opacity: 0.92 });
        var pore = new THREE.Mesh(new THREE.CircleGeometry(0.5, 30), poreMat);
        pore.rotation.x = -Math.PI / 2;
        pore.scale.set(0.30, 0.62, 1);
        pore.position.y = 0.012;
        g.add(pore);

        var guardMat = new THREE.MeshStandardMaterial({ color: 0x2f8f52, roughness: 0.55, metalness: 0.05 });
        var geo = new THREE.SphereGeometry(1, 20, 14);
        var left = new THREE.Mesh(geo, guardMat);
        var right = new THREE.Mesh(geo, guardMat);
        left.scale.set(0.20, 0.12, 0.52);
        right.scale.set(0.20, 0.12, 0.52);
        left.castShadow = true;
        right.castShadow = true;
        g.add(left);
        g.add(right);

        var tag = makeLabel('기공', '#166534', 0.85);
        tag.position.set(0, 0.5, 0);
        g.add(tag);

        g.scale.setScalar(scaleBase);
        groupLeaf.add(g);
        stomas.push({ group: g, left: left, right: right, pore: pore, x: x, z: z, y: y });
    }
    buildStoma(STOMA_POS[0][0], STOMA_POS[0][1], 1.0);
    buildStoma(STOMA_POS[1][0], STOMA_POS[1][1], 0.82);
    buildStoma(STOMA_POS[2][0], STOMA_POS[2][1], 0.9);

    /* 라벨 */
    function makeLabel(text, color, w) {
        var cv = document.createElement('canvas');
        cv.width = 512; cv.height = 128;
        var g2 = cv.getContext('2d');
        g2.clearRect(0, 0, 512, 128);
        g2.font = "bold 58px 'SeoulNamsan', -apple-system, sans-serif";
        g2.textAlign = 'center';
        g2.textBaseline = 'middle';
        var tw = Math.min(470, g2.measureText(text).width + 44);
        var x0 = (512 - tw) / 2;
        g2.fillStyle = 'rgba(255,255,255,0.92)';
        var r = 30;
        g2.beginPath();
        g2.moveTo(x0 + r, 22);
        g2.lineTo(x0 + tw - r, 22);
        g2.quadraticCurveTo(x0 + tw, 22, x0 + tw, 22 + r);
        g2.lineTo(x0 + tw, 106 - r);
        g2.quadraticCurveTo(x0 + tw, 106, x0 + tw - r, 106);
        g2.lineTo(x0 + r, 106);
        g2.quadraticCurveTo(x0, 106, x0, 106 - r);
        g2.lineTo(x0, 22 + r);
        g2.quadraticCurveTo(x0, 22, x0 + r, 22);
        g2.closePath();
        g2.fill();
        g2.fillStyle = color;
        g2.fillText(text, 256, 66);
        var tex = new THREE.CanvasTexture(cv);
        tex.minFilter = THREE.LinearFilter;
        var spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
        spr.scale.set(w, w * 0.25, 1);
        return spr;
    }

    /* 수증기 입자 */
    var VAPOR_N = 150;
    var vaporGeo = new THREE.BufferGeometry();
    var vaporPos = new Float32Array(VAPOR_N * 3);
    var vaporData = [];
    for (var vi = 0; vi < VAPOR_N; vi++) {
        vaporPos[vi * 3] = 0;
        vaporPos[vi * 3 + 1] = -20;
        vaporPos[vi * 3 + 2] = 0;
        vaporData.push({ life: 0, vx: 0, vy: 0, vz: 0, x: 0, y: -20, z: 0 });
    }
    vaporGeo.setAttribute('position', new THREE.BufferAttribute(vaporPos, 3));

    function dotTexture() {
        var c = document.createElement('canvas');
        c.width = 64; c.height = 64;
        var g2 = c.getContext('2d');
        var grd = g2.createRadialGradient(32, 32, 2, 32, 32, 30);
        grd.addColorStop(0, 'rgba(255,255,255,0.95)');
        grd.addColorStop(0.45, 'rgba(226,244,255,0.62)');
        grd.addColorStop(1, 'rgba(226,244,255,0)');
        g2.fillStyle = grd;
        g2.fillRect(0, 0, 64, 64);
        return new THREE.CanvasTexture(c);
    }
    var vaporMat = new THREE.PointsMaterial({
        size: 0.24, map: dotTexture(), transparent: true, opacity: 0.95,
        depthWrite: false, color: 0x66c1e8, sizeAttenuation: true, blending: THREE.NormalBlending
    });
    var vapor = new THREE.Points(vaporGeo, vaporMat);
    vapor.frustumCulled = false;
    groupLeaf.add(vapor);

    function spawnVapor(idx) {
        var s = stomas[idx % stomas.length];
        var d = vaporData[idx];
        var sc = s.group.scale.x;
        d.x = s.x + (Math.random() - 0.5) * 0.16 * sc;
        d.z = s.z + (Math.random() - 0.5) * 0.3 * sc;
        d.y = s.y + 0.12;
        d.vx = (Math.random() - 0.5) * 0.18;
        d.vy = 0.28 + Math.random() * 0.35;
        d.vz = (Math.random() - 0.5) * 0.18;
        d.life = 1.5 + Math.random() * 1.2;
    }

    /* ============================================================
       B. 비교 실험: 눈금실린더 4개
       ============================================================ */
    var groupTubes = new THREE.Group();
    groupTubes.visible = false;
    scene.add(groupTubes);

    var glassMat = new THREE.MeshPhysicalMaterial({
        color: 0xeaf7ff, transparent: true, opacity: 0.22, roughness: 0.06, metalness: 0,
        clearcoat: 1, side: THREE.DoubleSide, depthWrite: false
    });
    var waterMat = new THREE.MeshPhysicalMaterial({ color: 0x7cc8f0, transparent: true, opacity: 0.55, roughness: 0.12, depthWrite: false });
    var stemMat = new THREE.MeshStandardMaterial({ color: 0x3f8f52, roughness: 0.7 });
    var leafSmallMat = new THREE.MeshStandardMaterial({ color: 0x54b06c, roughness: 0.7 });
    var vaselineMat = new THREE.MeshPhysicalMaterial({ color: 0xd8f3c9, roughness: 0.12, metalness: 0.0, clearcoat: 1, transparent: true, opacity: 0.55 });
    var bagMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.15, metalness: 0, transparent: true, opacity: 0.20, side: THREE.DoubleSide });

    var TUBE_H = 2.6, TUBE_R = 0.34, WATER_BOTTOM = 0.09, MAX_WATER_H = 2.1;
    var tubeRefs = [];

    function buildCylinder(idx, x) {
        var g = new THREE.Group();
        g.position.set(x, 0, 0);

        var wall = new THREE.Mesh(new THREE.CylinderGeometry(TUBE_R, TUBE_R, TUBE_H, 30, 1, true), glassMat);
        wall.position.y = WATER_BOTTOM + TUBE_H / 2;
        g.add(wall);
        var bottom = new THREE.Mesh(new THREE.CylinderGeometry(TUBE_R, TUBE_R, 0.06, 30), glassMat);
        bottom.position.y = WATER_BOTTOM + 0.03;
        g.add(bottom);
        var rimMat = new THREE.MeshBasicMaterial({ color: 0x9fb8c9, transparent: true, opacity: 0.85 });
        var rimTop = new THREE.Mesh(new THREE.TorusGeometry(TUBE_R + 0.012, 0.02, 8, 40), rimMat);
        rimTop.rotation.x = Math.PI / 2;
        rimTop.position.y = WATER_BOTTOM + TUBE_H;
        g.add(rimTop);
        var rimBase = new THREE.Mesh(new THREE.TorusGeometry(TUBE_R + 0.012, 0.018, 8, 40), rimMat);
        rimBase.rotation.x = Math.PI / 2;
        rimBase.position.y = WATER_BOTTOM + 0.03;
        g.add(rimBase);

        var water = new THREE.Mesh(new THREE.CylinderGeometry(TUBE_R - 0.02, TUBE_R - 0.02, 1, 28), waterMat);
        g.add(water);

        // 눈금 표시
        var tickMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 });
        for (var i = 0; i <= 10; i++) {
            var ty = WATER_BOTTOM + (MAX_WATER_H / 10) * i;
            var tick = new THREE.Mesh(new THREE.BoxGeometry(i % 5 === 0 ? 0.15 : 0.08, 0.008, 0.008), tickMat);
            tick.position.set(-TUBE_R + 0.09, ty, TUBE_R - 0.02);
            g.add(tick);
        }

        // 식물(줄기 + 잎)
        var plant = new THREE.Group();
        var stem = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.034, 2.75, 10), stemMat);
        stem.position.y = 1.5;
        stem.castShadow = true;
        plant.add(stem);

        if (idx !== 1) {
            for (var k = 0; k < 3; k++) {
                var lf = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 10), idx === 2 ? vaselineMat : leafSmallMat);
                lf.scale.set(0.19, 0.026, 0.115);
                lf.position.set((k % 2 === 0 ? 0.19 : -0.19), 2.5 + k * 0.22, 0.02);
                lf.rotation.z = (k % 2 === 0 ? 0.35 : -0.35);
                lf.rotation.y = k * 0.8;
                lf.castShadow = true;
                plant.add(lf);
            }
        }
        g.add(plant);

        if (idx === 3) {
            var bag = new THREE.Mesh(new THREE.CylinderGeometry(0.47, 0.47, 1.0, 26, 1, true), bagMat);
            bag.position.y = 3.1;
            g.add(bag);
            var bagTop = new THREE.Mesh(new THREE.SphereGeometry(0.47, 22, 12, 0, Math.PI * 2, 0, Math.PI / 2), bagMat);
            bagTop.position.y = 3.6;
            bagTop.scale.y = 0.38;
            g.add(bagTop);
        }

        // 라벨
        var tag = makeLabel(TUBES[idx].name, TUBES[idx].color, 1.32);
        tag.position.set(0, 3.75, 0);
        g.add(tag);

        groupTubes.add(g);
        tubeRefs.push({ group: g, water: water, plant: plant });
    }
    for (var ti = 0; ti < 4; ti++) {
        buildCylinder(ti, -3.0 + ti * 2.0);
    }

    function updateTubeWater() {
        for (var i = 0; i < 4; i++) {
            var ml = state.levels[i];
            var h = Math.max(0.02, (ml / MAX_ML) * MAX_WATER_H);
            var w = tubeRefs[i].water;
            w.scale.y = h;
            w.position.y = WATER_BOTTOM + h / 2;
        }
    }

    /* ============================================================
       카메라
       ============================================================ */
    var CAM_TARGET = new THREE.Vector3(0, 0.5, 0);
    function fitCamera() {
        var aspect = window.innerWidth / Math.max(1, window.innerHeight);
        var portrait = aspect < 1;
        var vfov = camera.fov * Math.PI / 180;
        var needW, needH;
        if (state.mode === 'stoma') {
            CAM_TARGET.set(0, 0.78, 0);
            needW = portrait ? 5.6 : 7.4;
            needH = portrait ? 5.8 : 5.8;
        } else {
            if (portrait) {
                CAM_TARGET.set(0, 0.62, 0);
                needW = 7.2;
                needH = 7.4;
            } else {
                CAM_TARGET.set(0, 1.9, 0);
                needW = 12.8;
                needH = 8.6;
            }
        }
        var dW = (needW / 2) / (Math.tan(vfov / 2) * aspect);
        var dH = (needH / 2) / Math.tan(vfov / 2);
        var dist = Math.max(dW, dH);
        var mz = parseFloat(document.documentElement.getAttribute('data-mzoom')) || 1;
        dist = clamp(dist / mz, 2.4, 24);
        if (state.mode === 'compare') {
            for (var li = 0; li < tubeRefs.length; li++) {
                if (portrait) {
                    tubeRefs[li].group.position.set(li % 2 === 0 ? -1.15 : 1.15, 0, li < 2 ? 1.15 : -1.15);
                } else {
                    tubeRefs[li].group.position.set(-3.0 + li * 2.0, 0, 0);
                }
            }
        }
        var dir = new THREE.Vector3(0, state.mode === 'stoma' ? 0.95 : 0.34, state.mode === 'stoma' ? 0.9 : 1).normalize().multiplyScalar(dist);
        camera.position.copy(CAM_TARGET).add(dir);
        controls.target.copy(CAM_TARGET);
        controls.minDistance = state.mode === 'stoma' ? 1.6 : 3;
        controls.update();
    }
    window.svlFitCamera = fitCamera;

    /* ============================================================
       계산
       ============================================================ */
    function autoOpen() {
        return clamp(0.10 + 0.66 * state.light - 0.52 * state.hum + 0.14 * state.wind, 0.03, 1);
    }
    function transpirationRate() {
        var lightF = 0.35 + 0.65 * state.light;
        var windF = 0.45 + 0.55 * state.wind;
        var humF = 1.15 - 0.9 * state.hum;
        return clamp(state.open * lightF * windF * humF, 0, 1.1);
    }

    /* ============================================================
       HUD
       ============================================================ */
    var hintTimer = null;
    var hintBase = '💡 빛이 강하고 바람이 불수록 기공이 열려 증산이 활발해집니다.';
    function setHint(msg, keep) {
        var el = $('centerTooltip');
        el.textContent = msg;
        el.classList.remove('hidden');
        if (hintTimer) clearTimeout(hintTimer);
        if (!keep) hintTimer = setTimeout(function () { el.classList.add('hidden'); }, 7000);
    }

    function fmtTime(s) {
        var m = Math.floor(s / 60);
        var sec = Math.floor(s % 60);
        if (m > 0) return m + '분 ' + (sec < 10 ? '0' : '') + sec + '초';
        return sec + '초';
    }

    function updateHud() {
        var rp = Math.round(state.rate * 100);
        $('valRate').textContent = Math.min(100, rp) + ' %';
        $('valOpen').textContent = Math.round(state.open * 100) + ' %';
        $('valTime').textContent = fmtTime(state.t);
        $('lightVal').textContent = Math.round(state.light * 100) + ' %';
        $('windVal').textContent = Math.round(state.wind * 100) + ' %';
        $('humVal').textContent = Math.round(state.hum * 100) + ' %';
        $('openVal').textContent = Math.round(state.open * 100) + ' %';
        $('vaporVal').textContent = Math.round(state.rate * 100);
        $('vaporBar').style.width = Math.min(100, state.rate * 100) + '%';

        var name = $('sbName'), note = $('sbNote');

            name.textContent = '기공이 거의 닫힘';
            note.textContent = '증산이 매우 적습니다';
        } else if (state.open < 0.55) {

            note.textContent = '증산이 천천히 일어납니다';
        } else {

            name.textContent = state.running ? '비교 실험 진행 중' : (state.t > 0 ? '비교 실험 멈춤' : '비교 실험 준비');
            note.textContent = '잎 있음 · 없음 · 바세린 · 비닐봉지';

    (function buildMiniTable() {

            html += '<div class="mini-row"><span class="dot" style="background:' + TUBES[i].color + '"></span>' +

    /* ============================================================
       그래프
       ============================================================ */
    var gcv = $('graphCanvas');
    var gctx = gcv.getContext('2d');

    function layoutGraph() {
        var rect = gcv.getBoundingClientRect();
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var w = Math.max(120, Math.round(rect.width));
        var h = Math.max(90, Math.round(rect.height));
        if (gcv.width !== Math.round(w * dpr) || gcv.height !== Math.round(h * dpr)) {
            gcv.width = Math.round(w * dpr);
            gcv.height = Math.round(h * dpr);
        }
        gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        return { w: w, h: h };
    }

    function drawGraph() {
        var d = layoutGraph();
        var w = d.w, h = d.h;
        var padL = 32, padR = 8, padT = 10, padB = 22;
        gctx.clearRect(0, 0, w, h);

        var dark = state.dark;
        gctx.strokeStyle = dark ? 'rgba(148,163,184,0.22)' : 'rgba(100,116,139,0.18)';
        gctx.lineWidth = 1;
        gctx.font = "10px 'SeoulNamsan', sans-serif";
        gctx.fillStyle = dark ? '#94a3b8' : '#64748b';
        gctx.textAlign = 'right';
        gctx.textBaseline = 'middle';

        var plotW = w - padL - padR;
        var plotH = h - padT - padB;
        for (var i = 0; i <= 4; i++) {
            var y = padT + plotH * (i / 4);
            gctx.beginPath();
            gctx.moveTo(padL, y);
            gctx.lineTo(w - padR, y);
            gctx.stroke();
            var val = Math.round(40 - 10 * i);
            gctx.fillText(val + '', padL - 6, y);
        }
        gctx.textAlign = 'center';
        gctx.textBaseline = 'top';
        for (var t = 0; t <= RUN_SECONDS; t += 30) {
            var x = padL + plotW * (t / RUN_SECONDS);
            gctx.fillText(t + 's', x, h - padB + 5);
        }

        gctx.save();
        gctx.beginPath();
        gctx.rect(padL, padT, plotW, plotH);
        gctx.clip();
        for (var s = 0; s < 4; s++) {
            var pts = state.series[s];
            if (pts.length < 2) continue;
            gctx.beginPath();
            gctx.strokeStyle = TUBES[s].color;
            gctx.lineWidth = 2;
            gctx.lineJoin = 'round';
            for (var k = 0; k < pts.length; k++) {
                var px = padL + plotW * (pts[k][0] / RUN_SECONDS);
                var py = padT + plotH * (1 - pts[k][1] / 40);
                if (k === 0) gctx.moveTo(px, py);
                else gctx.lineTo(px, py);
            }
            gctx.stroke();
        }
        gctx.restore();

        if (state.mode === 'compare' && state.series[0].length < 2) {
            gctx.fillStyle = dark ? '#94a3b8' : '#94a3b8';
            gctx.textAlign = 'center';
            gctx.textBaseline = 'middle';
            gctx.font = "11px 'SeoulNamsan', sans-serif";
            gctx.fillText('▶ 실험 시작을 누르면 그래프가 그려집니다', padL + plotW / 2, padT + plotH / 2);
        }
    }

    function reset() {
        state.t = 0;
        state.running = false;
        state.levels = [35, 35, 35, 35];
        state.series = [[], [], [], []];
        state.lastSample = -1;
        state.open = state.auto ? autoOpen() : state.open;
        $('openRange').value = Math.round(state.open * 100);
        $('btnRun').textContent = '▶ 실험 시작';
        $('btnRun').className = 'btn-start';
        updateTubeWater();
        for (var i = 0; i < vaporData.length; i++) { vaporData[i].life = 0; vaporData[i].y = -20; }
        updateHud();
        drawGraph();

    window.addEventListener('resize', function () {
        camera.aspect = window.innerWidth / Math.max(1, window.innerHeight);
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);

    /* ============================================================
       시뮬레이션 루프
       ============================================================ */
    var vaporAcc = 0;
    var lastT = performance.now();
    var lastHud = 0;
    var lastGraphDraw = 0;
    var clock = 0;

    function frame(now) {
        requestAnimationFrame(frame);
        var dt = Math.min((now - lastT) / 1000, 0.06);
        lastT = now;
        clock += dt;

        // 기공 자동 반응
        if (state.auto) {
            var target = autoOpen();
            state.open = lerp(state.open, target, clamp(dt * 4.5, 0, 1));
            if (now - lastHud > 220) $('openRange').value = Math.round(state.open * 100);
        }
        state.rate = transpirationRate();

        // 공변세포 모양
        for (var i = 0; i < stomas.length; i++) {
            var s = stomas[i];
            var op = state.open;
            var bulge = 1 + 0.16 * op;
            var halfW = 0.20 * bulge;
            var px = 0.25 * op + halfW;
            s.left.position.x = -px;
            s.right.position.x = px;
            s.left.position.y = 0.06;
            s.right.position.y = 0.06;
            s.left.scale.set(halfW, 0.12 * bulge, 0.52);
            s.right.scale.set(halfW, 0.12 * bulge, 0.52);
            s.pore.scale.set(0.25 + 0.35 * op, 0.5, 1);
            s.pore.material.opacity = 0.55 + 0.35 * (1 - op);
        }

        // 수증기 입자
        if (state.mode === 'stoma') {
            vaporAcc += state.rate * 42 * dt;
            while (vaporAcc >= 1) {
                for (var k = 0; k < vaporData.length; k++) {
                    if (vaporData[k].life <= 0) { spawnVapor(k); break; }
                }
                vaporAcc -= 1;
            }
        }
        var posAttr = vaporGeo.attributes.position;
        for (var n = 0; n < vaporData.length; n++) {
            var d = vaporData[n];
            if (d.life > 0) {
                d.life -= dt;
                d.x += (d.vx + state.wind * 0.9) * dt;
                d.y += d.vy * dt;
                d.z += d.vz * dt;
                d.vy += 0.04 * dt;
                if (d.life <= 0) d.y = -20;
                posAttr.array[n * 3] = d.x;
                posAttr.array[n * 3 + 1] = d.y;
                posAttr.array[n * 3 + 2] = d.z;
            } else {
                posAttr.array[n * 3 + 1] = -20;
            }
        }
        posAttr.needsUpdate = true;

        // 비교 실험 진행
        if (state.mode === 'compare' && state.running) {
            var step = dt * state.speed;
            state.t = Math.min(RUN_SECONDS, state.t + step);
            for (var q = 0; q < 4; q++) {
                var loss = 1.5 * state.rate * TUBES[q].factor * step;
                state.levels[q] = Math.max(0, state.levels[q] - loss);
            }
            updateTubeWater();
            if (state.t - state.lastSample >= 1 || state.lastSample < 0) {
                state.lastSample = state.t;
                for (var r = 0; r < 4; r++) state.series[r].push([state.t, state.levels[r]]);
            }
            if (state.t >= RUN_SECONDS) {
                state.running = false;
                $('btnRun').textContent = '▶ 다시 시작';
                $('btnRun').className = 'btn-start';
                setHint('✅ 실험 종료! 잎이 있는 실린더의 물만 크게 줄었습니다. 잎의 증산 작용으로 물이 빠져나간 것입니다.', true);
            }
        }

        if (now - lastHud > 150) { lastHud = now; updateHud(); }
        if (state.graphOpen && now - lastGraphDraw > 120) { lastGraphDraw = now; drawGraph(); }

        controls.update();
        renderer.render(scene, camera);
    }

    /* ============================================================
       시작
       ============================================================ */
    state.open = autoOpen();
    $('openRange').value = Math.round(state.open * 100);
    setMode('stoma');
    updateTubeWater();
    updateHud();
    drawGraph();
    setHint(hintBase, false);
    requestAnimationFrame(frame);

    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () { fitCamera(); drawGraph(); });
    }
})();
</script>
<script>
/* ============ 전체화면 / 창모드 + 모바일 화면 재조정 (공통) ============ */
(function () {
    'use strict';
    var docEl = document.documentElement;
    var btn = document.getElementById('fullscreenBtn');
    var icon = document.getElementById('fullscreenIcon');
    var text = document.getElementById('fullscreenText');
    var started = false;

    function realFs() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement ||
                  document.mozFullScreenElement || document.msFullscreenElement);
    }
    function pseudo() { return docEl.classList.contains('pseudo-fs'); }

    function toast(msg) {
        var t = document.getElementById('ux-toast');
        if (!t) {
            t = document.createElement('div');
            t.id = 'ux-toast';
            t.style.cssText = 'position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);' +
                'background:rgba(28,28,30,.88);color:#fff;font-size:12px;line-height:1.4;padding:9px 14px;border-radius:14px;' +
                'z-index:9999;max-width:86vw;text-align:center;pointer-events:none;transition:opacity .3s;' +
                'font-family:inherit;box-shadow:0 8px 24px rgba(0,0,0,.25)';
            document.body.appendChild(t);
        }
        t.textContent = msg;
        t.style.opacity = '1';
        clearTimeout(t._t);
        t._t = setTimeout(function () { t.style.opacity = '0'; }, 2600);
    }

    function setUI() {
        var on = realFs() || pseudo();
        if (icon) icon.textContent = on ? '\uD83D\uDDD7' : '\u26F6';
        if (text) text.textContent = on ? '창모드' : '전체화면';
        if (btn) {
            btn.setAttribute('aria-label', on ? '창모드로 전환' : '전체화면으로 전환');
            btn.title = on ? '창모드로 전환' : '전체화면으로 전환';
        }
        document.body.classList.toggle('is-fullscreen', on);
        setTimeout(function () {
            try { window.dispatchEvent(new Event('resize')); } catch (e) {}
            if (typeof window.svlFitCamera === 'function') window.svlFitCamera();
        }, 140);
        setTimeout(function () {
            try { window.dispatchEvent(new Event('resize')); } catch (e) {}
            if (typeof window.svlFitCamera === 'function') window.svlFitCamera();
        }, 420);
    }

    function onKey(e) {
        if (e.key !== 'Escape' && e.key !== 'Esc') return;
        if (pseudo() && !realFs()) { docEl.classList.remove('pseudo-fs'); setUI(); }
    }

    if (btn) {
        btn.addEventListener('click', function () {
            if (realFs()) {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                else if (document.msExitFullscreen) document.msExitFullscreen();
                return;
            }
            if (pseudo()) { docEl.classList.remove('pseudo-fs'); setUI(); return; }
            var req = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.msRequestFullscreen;
            if (req) {
                try {
                    var r = req.call(docEl);
                    if (r && typeof r.catch === 'function') r.catch(function () { docEl.classList.add('pseudo-fs'); setUI(); });
                } catch (err) {
                    docEl.classList.add('pseudo-fs');
                }
            } else {
                docEl.classList.add('pseudo-fs');
                try { window.scrollTo(0, 1); } catch (e) {}
                toast('이 브라우저는 전체화면을 지원하지 않아 상단 정보를 숨긴 몰입 모드로 표시합니다');
            }
            setUI();
        }, false);
    }

    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
        document.addEventListener(ev, setUI);
    });
    document.addEventListener('keydown', onKey);

    /* 회전·주소창 변화·전체화면 전환 후 3D 카메라/렌더러 재계산 */
    var rt = null;
    function refit() {
        clearTimeout(rt);
        rt = setTimeout(function () {
            try { window.dispatchEvent(new Event('resize')); } catch (e) {}
            if (typeof window.svlFitCamera === 'function') window.svlFitCamera();
        }, 240);
    }
    window.addEventListener('orientationchange', refit);
    window.addEventListener('pageshow', refit);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) refit(); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', refit);

    setUI();
    started = true;
})();

</script>
