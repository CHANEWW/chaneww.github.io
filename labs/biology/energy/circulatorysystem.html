<!DOCTYPE html>
<html lang="ko" data-mzoom="0.62">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>순환계와 혈액의 순환 3D</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <!-- Three.js 및 OrbitControls 라이브러리 -->
    <script src="../../common/lib/three.min.js"></script>
    <script src="../../common/lib/OrbitControls.js"></script>
    <style>
        @font-face {
            font-family: 'SeoulNamsan';
            src: local('SeoulNamsan M'), local('SeoulNamsanM'), local('서울남산체 M'),
                 url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'SeoulNamsan', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
            background-color: #eef2f8;
            color: #1c1c1e;
            transition: background-color 0.35s ease, color 0.35s ease;
            -webkit-user-select: none;
            user-select: none;
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
            touch-action: none;
        }
        #canvas-container canvas { display: block; touch-action: none; }

        /* ---------- visionOS 유리 패널 ---------- */
        .glass-panel {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(22px) saturate(180%);
            -webkit-backdrop-filter: blur(22px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.55);
            box-shadow: 0 10px 32px rgba(20, 30, 50, 0.10);
            border-radius: 20px;
        }

        /* ---------- 좌측 상단 헤더 ---------- */
        .top-left-bar {
            position: fixed;
            top: 18px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 9px;
            z-index: 30;
        }
        .back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 9px 16px;
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            color: #1c1c1e;
            text-decoration: none;
            cursor: pointer;
            border: none;
            white-space: nowrap;
            transition: transform 0.18s ease, background 0.2s ease;
        }
        .back-btn:hover { transform: translateY(-1px); background: rgba(255, 255, 255, 0.92); }
        .tag-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 16px;
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
        }
        .tag-pill {
            background: rgba(230, 57, 70, 0.13);
            color: #d92b38;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10.5px;
            font-weight: bold;
            letter-spacing: 0.2px;
        }

        /* ---------- 우측 상단 데이터 ---------- */
        .top-right-bar {
            position: fixed;
            top: 16px;
            right: 20px;
            z-index: 40;
        }
        .icon-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            font-family: inherit;
            font-size: 16px;
            color: #1c1c1e;
            box-shadow: 0 8px 26px rgba(20, 30, 50, 0.10);
            transition: transform 0.18s ease;
        }
        .icon-btn:hover { transform: translateY(-1px); }

        .data-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 8px 18px;
            border-radius: 18px;
        }
        .data-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
        }
        .data-label {
            font-size: 10px;
            color: #8e8e93;
            font-weight: bold;
            letter-spacing: -0.1px;
            white-space: nowrap;
        }
        .data-value {
            font-size: 14px;
            font-weight: bold;
            color: #1c1c1e;
            white-space: nowrap;
            transition: color 0.25s ease;
        }
        .data-sep {
            width: 1px;
            height: 26px;
            background: rgba(0, 0, 0, 0.10);
        }

        /* ---------- 안내 툴팁 ---------- */
        .center-tooltip {
            position: fixed;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 18px;
            font-size: 12.5px;
            font-weight: bold;
            color: #5c6470;
            border-radius: 999px;
            pointer-events: none;
            z-index: 25;
            transition: opacity 0.6s ease;
            white-space: nowrap;
            max-width: calc(100vw - 40px);
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .center-tooltip.hidden { opacity: 0; }

        /* ---------- 조절 패널 ---------- */
        .side-ctrl-panel { gap: 7px !important; }
        .mode-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            width: 100%;
        }
        .mode-chip {
            padding: 7px 2px;
            border-radius: 11px;
            border: 1px solid rgba(0, 0, 0, 0.07);
            background: rgba(255, 255, 255, 0.72);
            color: #3c4250;
            font-family: inherit;
            font-size: 10.5px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.18s ease;
        }
        .mode-chip:hover { background: #ffffff; }
        .mode-chip.active {
            background: linear-gradient(135deg, #ff5d68, #e63946);
            border-color: #e63946;
            color: #fff;
            box-shadow: 0 4px 12px rgba(230, 57, 70, 0.32);
        }

        .side-ctrl-panel .control-tab-btn { position: relative; }
        .side-ctrl-panel .control-tab-btn.active {
            background: linear-gradient(135deg, #ff5d68, #e63946) !important;
            border-color: #e63946 !important;
            color: #fff !important;
            box-shadow: 0 4px 14px rgba(230, 57, 70, 0.30) !important;
        }

        .sub-panel {
            position: fixed;
            display: none;
            flex-direction: column;
            gap: 12px;
            padding: 14px 16px !important;
            z-index: 55;
        }
        .sub-panel.show { display: flex; }
        .sub-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .sub-panel-title {
            font-size: 12px;
            font-weight: bold;
            color: #334155;
            letter-spacing: -0.2px;
        }
        .sub-close {
            border: none;
            background: rgba(0, 0, 0, 0.06);
            color: #5c6470;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
            flex: 0 0 auto;
        }
        .slider-block {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 220px;
        }
        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11.5px;
            font-weight: bold;
            color: #475569;
        }
        .slider-header span:last-child { color: #e63946; font-size: 12px; }
        .slider-block input[type="range"] {
            width: 100%;
            height: 20px;
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            cursor: pointer;
            margin: 0;
        }
        .slider-block input[type="range"]::-webkit-slider-runnable-track {
            height: 6px;
            border-radius: 999px;
            background: linear-gradient(90deg, #ffd0d4, #f4a3aa);
        }
        .slider-block input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 17px;
            height: 17px;
            margin-top: -5.5px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid #e63946;
            box-shadow: 0 2px 6px rgba(230, 57, 70, 0.35);
        }
        .slider-note {
            font-size: 10px;
            font-weight: bold;
            color: #94a3b8;
            line-height: 1.45;
            word-break: keep-all;
        }
        .phase-meter {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 8px 10px;
            border-radius: 12px;
            background: rgba(230, 57, 70, 0.07);
            border: 1px solid rgba(230, 57, 70, 0.12);
        }
        .phase-meter .pm-top {
            display: flex;
            justify-content: space-between;
            font-size: 10.5px;
            font-weight: bold;
            color: #64748b;
        }
        .pm-track {
            height: 7px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
        }
        .pm-seg { height: 100%; }
        .pm-seg.a { background: #ffb020; }
        .pm-seg.v { background: #e63946; }
        .pm-seg.d { background: #9aa7b8; }

        #boardHelp {
            position: fixed;
            left: 20px;
            bottom: 26px;
            z-index: 5;
            padding: 7px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.62);
            color: #7a8390;
            font-size: 11px;
            font-weight: bold;
            pointer-events: none;
            backdrop-filter: blur(10px);
        }

        #hover-tip {
            position: fixed;
            z-index: 200;
            padding: 5px 11px;
            border-radius: 10px;
            background: rgba(28, 28, 30, 0.88);
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.12s ease;
            white-space: nowrap;
        }
        #hover-tip.show { opacity: 1; }

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 700;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(18, 22, 30, 0.36);
            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);
        }
        .modal-overlay.show { display: flex; }
        .modal-card {
            width: min(600px, 94vw);
            max-height: 84vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 20px 22px;
            display: flex;
            flex-direction: column;
            gap: 13px;
            border-radius: 22px;
        }
        .modal-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }
        .modal-title {
            font-size: 16px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            gap: 4px;
            line-height: 1.35;
        }
        .modal-badge {
            font-size: 10.5px;
            font-weight: bold;
            letter-spacing: 0.2px;
            color: #e63946;
        }
        .modal-close-btn {
            border: none;
            background: rgba(0, 0, 0, 0.06);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-family: inherit;
            font-size: 13px;
            color: inherit;
            cursor: pointer;
            flex: 0 0 auto;
        }
        .modal-body { display: flex; flex-direction: column; gap: 9px; }
        .info-item {
            padding: 11px 13px;
            border-radius: 13px;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        .info-title {
            font-size: 12.5px;
            font-weight: bold;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .info-desc {
            font-size: 12.5px;
            line-height: 1.62;
            color: #4a505c;
            font-weight: bold;
            word-break: keep-all;
        }
        .info-desc b { color: #d92b38; }
        .blood-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 7px;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 10.5px;
            font-weight: bold;
        }
        .blood-tag.art { background: rgba(230, 57, 70, 0.12); color: #cf2230; }
        .blood-tag.vein { background: rgba(29, 78, 216, 0.12); color: #1d4ed8; }
        .blood-tag.mix { background: rgba(120, 120, 128, 0.14); color: #5c6470; }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .dot.red { background: #e63946; }
        .dot.blue { background: #1d4ed8; }

        body.dark-mode { background-color: #0f1218; color: #f2f2f7; }
        body.dark-mode .glass-panel {
            background: rgba(30, 34, 42, 0.80);
            border-color: rgba(255, 255, 255, 0.10);
            color: #f2f2f7;
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.45);
        }
        body.dark-mode .back-btn,
        body.dark-mode .tag-badge,
        body.dark-mode .data-value,
        body.dark-mode .sub-panel-title { color: #f2f2f7; }
        body.dark-mode .icon-btn { background: rgba(38, 42, 52, 0.85); color: #f2f2f7; }
        body.dark-mode .data-label { color: #9aa3b2; }
        body.dark-mode .data-sep { background: rgba(255, 255, 255, 0.14); }
        body.dark-mode .mode-chip {
            background: rgba(52, 58, 70, 0.85);
            border-color: rgba(255, 255, 255, 0.10);
            color: #dbe2ee;
        }
        body.dark-mode .mode-chip.active { background: linear-gradient(135deg, #ff5d68, #e63946); color: #fff; }
        body.dark-mode .side-ctrl-panel .control-tab-btn,
        body.dark-mode .side-ctrl-panel .side-btn {
            background: rgba(52, 58, 70, 0.88) !important;
            color: #eef2f8 !important;
            border-color: rgba(255, 255, 255, 0.10) !important;
        }
        body.dark-mode .side-ctrl-panel .control-tab-btn.active {
            background: linear-gradient(135deg, #ff5d68, #e63946) !important;
            color: #fff !important;
        }
        body.dark-mode .slider-header { color: #b9c2d0; }
        body.dark-mode .slider-note { color: #8b95a5; }
        body.dark-mode .slider-block input[type="range"]::-webkit-slider-runnable-track {
            background: linear-gradient(90deg, #5a2b31, #7d3a42);
        }
        body.dark-mode .phase-meter { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.09); }
        body.dark-mode .phase-meter .pm-top { color: #9aa3b2; }
        body.dark-mode .pm-track { background: rgba(255, 255, 255, 0.12); }
        body.dark-mode .center-tooltip { color: #c3cbd8; }
        body.dark-mode #boardHelp { background: rgba(30, 34, 42, 0.7); color: #9aa3b2; }
        body.dark-mode .info-item { background: rgba(255, 255, 255, 0.06); border-color: rgba(255, 255, 255, 0.08); }
        body.dark-mode .info-desc { color: #c3cbd8; }
        body.dark-mode .info-desc b { color: #ff7a84; }
        body.dark-mode .modal-close-btn { background: rgba(255, 255, 255, 0.12); color: #f2f2f7; }
        body.dark-mode .sub-close { background: rgba(255, 255, 255, 0.12); color: #dbe2ee; }
        body.dark-mode .blood-tag.art { background: rgba(255, 93, 104, 0.18); color: #ff8f97; }
        body.dark-mode .blood-tag.vein { background: rgba(96, 140, 255, 0.18); color: #9db9ff; }

        @media (max-width: 900px) {
            .top-left-bar { top: max(8px, env(safe-area-inset-top)); left: 8px; gap: 6px; right: 52px; }
            .back-btn { padding: 7px 11px; font-size: 12px; }
            .tag-badge { padding: 7px 11px; font-size: 12px; gap: 5px; }
            .tag-pill { font-size: 9px; padding: 1px 6px; }
            .top-right-bar { top: calc(max(8px, env(safe-area-inset-top)) + 40px); right: 8px; left: 8px; }
            .data-card { padding: 5px 10px; gap: 8px; border-radius: 14px; }
            .data-label { font-size: 8.5px; }
            .data-value { font-size: 11.5px; }
            .data-sep { height: 20px; }
            .center-tooltip { top: calc(max(8px, env(safe-area-inset-top)) + 86px); font-size: 10.5px; padding: 6px 12px; }
            #boardHelp { display: none; }
            .sub-panel { padding: 11px 13px !important; gap: 9px; }
            .slider-block { min-width: 0; }
            .modal-card { padding: 16px; gap: 10px; max-height: 86vh; }
            .modal-title { font-size: 14.5px; }
            .info-desc { font-size: 11.8px; }
            .info-title { font-size: 12px; }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            .top-left-bar { top: max(6px, env(safe-area-inset-top)); left: 6px; right: auto; }
            .back-btn, .tag-badge { padding: 5px 9px; font-size: 11px; }
            .tag-pill { display: none; }
            .top-right-bar { top: max(6px, env(safe-area-inset-top)); right: 6px; left: auto; }
            .data-card { padding: 4px 9px; gap: 7px; }
            .data-label { font-size: 8px; }
            .data-value { font-size: 10.5px; }
            .center-tooltip { top: calc(max(6px, env(safe-area-inset-top)) + 34px); font-size: 10px; padding: 4px 10px; }
            .sub-panel { max-height: 60vh; }
            .modal-card { max-height: 92vh; padding: 12px 14px; }
        }

        html.pseudo-fs .center-tooltip { display: none !important; }
        body.is-fullscreen #canvas-container { width: 100vw !important; height: 100vh !important; }
    </style>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preload" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff" as="font" type="font/woff" crossorigin>
    <link rel="stylesheet" href="../../common/qr-modal.css">
    <link rel="stylesheet" href="../../common/ui-layout.css">
    <style>
        body .side-ctrl-panel > .ctrl-grid > .control-tab-btn.active {
            background: linear-gradient(135deg, #ff5d68, #e63946) !important;
            border-color: #e63946 !important;
            color: #fff !important;
            box-shadow: 0 4px 14px rgba(230, 57, 70, 0.30) !important;
        }
        body .bottom-control-bar .control-tab-btn { color: #1c1c1e; }
        body.dark-mode .bottom-control-bar .control-tab-btn { color: #f2f2f7; }

        @media (max-height: 500px) and (orientation: landscape) {
            body .side-ctrl-panel {
                right: 6px !important;
                bottom: 46px !important;
                width: 178px !important;
                max-height: calc(100vh - 54px) !important;
                padding: 6px !important;
                gap: 4px !important;
                border-radius: 14px !important;
            }
            body .side-ctrl-panel .panel-title {
                font-size: 9.5px !important;
                margin-bottom: 0 !important;
                padding-bottom: 2px !important;
            }
            body .side-ctrl-panel .ctrl-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 4px !important; }
            body .side-ctrl-panel .control-tab-btn {
                min-height: 36px !important;
                padding: 2px 1px !important;
                font-size: 9px !important;
                gap: 1px !important;
                border-radius: 10px !important;
            }
            body .side-ctrl-panel .control-tab-btn span:first-child { font-size: 12px !important; }
            .mode-grid { gap: 3px !important; }
            .mode-chip { font-size: 9px !important; padding: 4px 1px !important; border-radius: 8px !important; }
            .bottom-control-bar { bottom: 4px !important; padding: 3px 8px !important; }
            .bottom-control-bar .control-tab-btn { padding: 4px 10px !important; font-size: 10px !important; }
            .data-card { gap: 7px !important; padding: 4px 9px !important; }
            .data-label { font-size: 8px !important; }
            .data-value { font-size: 10.5px !important; }
            .center-tooltip { top: calc(max(6px, env(safe-area-inset-top)) + 38px) !important; font-size: 9.5px !important; padding: 3px 9px !important; }
            #boardHelp { display: none !important; }
        }

        @media (max-width: 480px) and (min-height: 501px) {
            body .side-ctrl-panel {
                width: min(202px, calc(100vw - 16px)) !important;
                padding: 7px !important;
                gap: 5px !important;
            }
            .mode-chip { font-size: 10px !important; padding: 5px 1px !important; }
            .center-tooltip { top: calc(max(8px, env(safe-area-inset-top)) + 106px) !important; }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="top-left-bar">
        <a href="/index.html" class="glass-panel back-btn" onclick="var r=document.referrer;if(history.length>1&&r&&r.indexOf(location.origin+'/')===0&&/(\/|index(_3d)?\.html)(\?|#|$)/.test(r)){history.back();return false;}">
            <span>⬅</span> 메인
        </a>
        <div class="glass-panel tag-badge">
            <span>순환계 3D</span>
            <span class="tag-pill">visionOS</span>
        </div>
        <button class="glass-panel back-btn qr-btn" id="qrBtn" type="button" title="QR 코드" aria-label="QR 코드 보기"><span class="qr-btn-icon" aria-hidden="true">📱</span> <span class="qr-btn-label">QR code</span></button>
    </div>

    <div class="top-right-bar">
        <div class="tr-util">
            <button class="icon-btn" id="theme-toggle" title="야간 모드" aria-label="야간 모드">🌙</button>
        </div>
        <div class="glass-panel data-card">
            <div class="data-item">
                <span class="data-label">심장 주기</span>
                <span class="data-value" id="val-phase" style="color:#ff9500;">이완기</span>
            </div>
            <div class="data-sep"></div>
            <div class="data-item">
                <span class="data-label">심박수</span>
                <span class="data-value" id="val-bpm">72 BPM</span>
            </div>
            <div class="data-sep"></div>
            <div class="data-item">
                <span class="data-label">혈류</span>
                <span class="data-value" id="val-flow" style="color:#34c759;">심방 → 심실</span>
            </div>
        </div>
    </div>

    <div class="glass-panel center-tooltip" id="guide">💡 심장을 드래그해 돌려 보고, 부위를 눌러 설명을 확인하세요</div>
    <div id="boardHelp">드래그: 회전 · 두 손가락/휠: 확대 · 우클릭·Shift+드래그: 이동</div>

    <div class="glass-panel side-ctrl-panel" id="sidePanel">
        <div class="panel-title">🎛 순환 조절</div>
        <div class="mode-grid">
            <button class="mode-chip active" data-mode="all">전체 순환</button>

                <span>⚙️</span>

                <span>🔪</span>

    <div class="glass-panel sub-panel" id="subPanel">
        <div class="sub-head">
            <span class="sub-panel-title">🫀 심장 박동 조절</span>
            <button class="sub-close" id="subClose" aria-label="닫기">✕</button>
        </div>
        <div class="slider-block">
            <div class="slider-header"><span>심박수</span><span id="bpmVal">72 BPM</span></div>
            <input type="range" id="bpmSlider" min="40" max="150" step="1" value="72">
        </div>
        <div class="slider-block">
            <div class="slider-header"><span>혈류 속도</span><span id="speedVal">1.0×</span></div>
            <input type="range" id="speedSlider" min="30" max="200" step="5" value="100">
        </div>
        <div class="phase-meter">
            <div class="pm-top"><span>심장 주기</span><span id="pm-phase">이완기</span></div>
            <div class="pm-track">
                <div class="pm-seg a" style="width:10%;"></div>
                <div class="pm-seg v" style="width:32%;"></div>
                <div class="pm-seg d" style="width:58%;"></div>
            </div>
        </div>
        <div class="slider-note">심방 수축 → 심실 수축 → 이완기가 한 주기로 반복됩니다.</div>
    </div>

    <div class="glass-panel bottom-control-bar">
        <button class="control-tab-btn" id="btn-reset">
            <span>🔄</span>
            <span>초기화</span>
        </button>
        <button class="control-tab-btn" id="btn-view">
            <span>🎥</span>
            <span>정면정렬</span>
        </button>

    <div class="bottom-right-bar">
        <button id="fullscreenBtn" class="glass-panel back-btn">
            <span id="fullscreenIcon">⛶</span>
            <span id="fullscreenText">전체화면</span>
        </button>
    </div>

    <div id="hover-tip"></div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="glass-panel modal-card">
            <div class="modal-header">
                <div class="modal-title">
                    <span id="modal-title">순환계</span>
                    <span class="modal-badge" id="modal-badge">심장과 혈액의 순환</span>
                </div>
                <button class="modal-close-btn" id="modal-close" aria-label="닫기">✕</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

<script>
        /* ============================================================
           순환계 3D — 해부학 정밀 3D 모델링 (실제 4배 확대 해부학 심장형상)
           ============================================================ */

        const HY = 1.15;
        const COL_ART  = 0xef2d3b; // 동맥혈 (선홍색)
        const COL_VEIN = 0x1d52d8; // 정맥혈 (파란색)
        const C_MUSCLE = 0x9e2a2b; // 심근 겉면 색상
        const C_MUSCLE_D = 0x721c24; // 단면 절단면 심근 색상

        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const lerp = (a, b, t) => a + (b - a) * t;
        const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 200);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.localClippingEnabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.075;
        controls.rotateSpeed = 0.85;
        controls.zoomSpeed = 0.9;
        controls.minDistance = 3.4;
        controls.maxDistance = 24;
        controls.maxPolarAngle = Math.PI * 0.86;
        controls.minPolarAngle = 0.18;
        controls.enablePan = true;
        controls.target.set(0.05, 1.36, 0);

        function baseDistance() {
            const a = window.innerWidth / window.innerHeight;
            let d = 8.7;
            if (a < 0.75) d = 10.0;
            else if (a < 1.05) d = 9.6;
            return d;
        }
        const HOME_POS = new THREE.Vector3();
        const HOME_TARGET = new THREE.Vector3(0.05, 1.36, 0);
        function setHome() {
            const d = baseDistance();
            HOME_POS.set(2.15, 2.35, d * 0.97);
            camera.position.copy(HOME_POS);
            controls.target.copy(HOME_TARGET);
            controls.update();
        }
        setHome();

        scene.add(new THREE.HemisphereLight(0xffffff, 0x8fa4bc, 0.50));
        scene.add(new THREE.AmbientLight(0xffffff, 0.20));

        const key = new THREE.DirectionalLight(0xffffff, 0.90);
        key.position.set(5.5, 9, 8);
        scene.add(key);

        const rim = new THREE.DirectionalLight(0xcfe0ff, 0.35);
        rim.position.set(-7, 4, -6);
        scene.add(rim);

        const fill = new THREE.DirectionalLight(0xffe6e0, 0.25);
        fill.position.set(-2, -4, 6);
        scene.add(fill);

        const CUT_PLANE = new THREE.Plane(new THREE.Vector3(0, 0, -1), 0.0);
        let crossSection = true;
        const clippedMats = [];
        const sectionFaces = [];

        function useClip(mat) {
            mat.clippingPlanes = crossSection ? [CUT_PLANE] : null;
            mat.clipShadows = false;
            clippedMats.push(mat);
            return mat;
        }

        function muscleMaterial() {
            return useClip(new THREE.MeshStandardMaterial({
                color: C_MUSCLE, roughness: 0.45, metalness: 0.08,
                emissive: 0x3a0d12, emissiveIntensity: 0.18, side: THREE.DoubleSide
            }));
        }
        function sectionMaterial(hex) {
            return new THREE.MeshStandardMaterial({
                color: hex || C_MUSCLE_D, roughness: 0.75, metalness: 0.02,
                side: THREE.DoubleSide, emissive: 0x1e0508, emissiveIntensity: 0.05
            });
        }
        const poolTex = (function () {
            const c = document.createElement('canvas');
            c.width = c.height = 128;
            const g = c.getContext('2d');
            const grd = g.createRadialGradient(64, 56, 6, 64, 64, 76);
            grd.addColorStop(0, '#ffffff');
            grd.addColorStop(0.55, '#f0e6e6');
            grd.addColorStop(1, '#b9a6a6');
            g.fillStyle = grd;
            g.fillRect(0, 0, 128, 128);
            return new THREE.CanvasTexture(c);
        })();
        function bloodFaceMaterial(hex) {
            return new THREE.MeshStandardMaterial({
                color: hex, roughness: 0.40, metalness: 0.05,
                emissive: hex, emissiveIntensity: 0.42, side: THREE.DoubleSide,
                map: poolTex
            });
        }
        function bloodMaterial(hex) {
            return useClip(new THREE.MeshStandardMaterial({
                color: hex, roughness: 0.30, metalness: 0.02,
                emissive: hex, emissiveIntensity: 0.55, side: THREE.BackSide,
                polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1
            }));
        }

        /* 3D 심장 메인 그룹 (해부학적 경사각 적용) */
        const heartGroup = new THREE.Group();
        heartGroup.position.set(0, HY, 0);
        heartGroup.rotation.z = -0.14; // 심첨부 왼쪽 경사 반영
        heartGroup.scale.set(1.15, 1.15, 1.15);
        scene.add(heartGroup);

        const pickables = [];
        const hittableMats = [];
        function registerPick(mesh, infoId) {
            mesh.userData.info = infoId;
            pickables.push(mesh);
        }

        function latheOf(profile, seg) {
            return new THREE.LatheGeometry(profile.map(p => new THREE.Vector2(p[0], p[1])), seg || 56);
        }
        function sectionOf(profile) {
            const sh = new THREE.Shape();
            profile.forEach((p, i) => { if (i === 0) sh.moveTo(p[0], p[1]); else sh.lineTo(p[0], p[1]); });
            for (let i = profile.length - 1; i >= 0; i--) sh.lineTo(-profile[i][0], profile[i][1]);
            return sh;
        }

        /* 실제 해부학적 심실 캐비티 커브 프로필 (우심실: 얇은 벽, 좌심실: 두꺼운 심근벽과 뾰족한 심첨) */
        const RV_CAV = [[0, 0.20], [0.38, 0.12], [0.52, -0.05], [0.56, -0.32], [0.52, -0.65], [0.42, -0.92], [0.22, -1.12], [0, -1.22]];
        const LV_CAV = [[0, 0.38], [0.36, 0.18], [0.48, -0.05], [0.52, -0.38], [0.48, -0.72], [0.38, -1.02], [0.20, -1.24], [0, -1.38]];

        function wallProfile(cav, t) {
            const outer = cav.map((p, i) => {
                if (p[0] < 1e-4 && i === 0) return [0, p[1] + t * 0.35];
                if (p[0] < 1e-4) return [0, p[1] - t * 0.85];
                return [p[0] + t, p[1]];
            });
            return outer.concat(cav.slice().reverse());
        }

        function makePapillary(base, tip, rBase, rTip, parent) {
            const dir = new THREE.Vector3().subVectors(tip, base);
            const len = dir.length();
            const g = new THREE.Group(); g.position.copy(base);
            const m = new THREE.Mesh(new THREE.CylinderGeometry(rTip, rBase, len, 16, 1), muscleMaterial());
            m.position.y = len / 2;
            const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
            g.quaternion.copy(q); g.add(m);
            registerPick(m, 'chordae'); parent.add(g);
            return { group: g, tip: tip.clone() };
        }
        function makeChordae(tip, targetPts, parent) {
            const chordMat = new THREE.MeshStandardMaterial({ color: 0xfffaf0, roughness: 0.25, emissive: 0x4a3b2c, emissiveIntensity: 0.20, side: THREE.DoubleSide });
            targetPts.forEach(tgt => {
                const mid = new THREE.Vector3((tip.x + tgt.x)*0.5 + (Math.random()-0.5)*0.015, (tip.y + tgt.y)*0.5, (tip.z + tgt.z)*0.5 + (Math.random()-0.5)*0.015);
                const curve = new THREE.CatmullRomCurve3([tip, mid, tgt]);
                const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 10, 0.009, 6, false), chordMat);
                registerPick(tube, 'chordae'); parent.add(tube);
            });
        }

        function makeVentricle(cfg) {
            const g = new THREE.Group();
            g.position.set(cfg.x, cfg.y, cfg.z || 0);
            g.name = cfg.info;

            const wallProfilePts = wallProfile(cfg.cav, cfg.wall);
            const wall = new THREE.Mesh(latheOf(wallProfilePts, 64), muscleMaterial());
            g.add(wall);
            registerPick(wall, cfg.info);

            const secShape = sectionOf(wallProfilePts);
            const face = new THREE.Mesh(new THREE.ShapeGeometry(secShape, 32), sectionMaterial(C_MUSCLE_D));
            face.position.z = -0.006;
            face.userData.shared = true;
            g.add(face);
            sectionFaces.push(face);

            const outlinePts = secShape.getPoints(44).map(p2 => new THREE.Vector3(p2.x, p2.y, -0.004));
            const outline = new THREE.LineLoop(
                new THREE.BufferGeometry().setFromPoints(outlinePts),
                new THREE.LineBasicMaterial({ color: 0x3d0e12, transparent: true, opacity: 0.85 })
            );
            g.add(outline);
            sectionFaces.push(outline);

            const blood = new THREE.Mesh(latheOf(cfg.cav, 64), bloodMaterial(cfg.blood));
            g.add(blood);
            registerPick(blood, cfg.info);

            const pool = new THREE.Mesh(new THREE.ShapeGeometry(sectionOf(cfg.cav), 24), bloodFaceMaterial(cfg.blood));
            pool.position.z = -0.005;
            g.add(pool);
            sectionFaces.push(pool);
            registerPick(pool, cfg.info);

            hittableMats.push({ mesh: wall, mat: wall.material });
            g.userData.base = { x: cfg.x, y: cfg.y, z: cfg.z || 0 };
            return g;
        }

        /* 우심실: 좌심실을 감싸는 초승달 형태, 얇은 벽(0.072) */
        const rvGroup = makeVentricle({ x: -0.56, y: 0, z: 0, cav: RV_CAV, wall: 0.072, blood: COL_VEIN, info: 'rv' });
        rvGroup.scale.set(1.15, 1.0, 0.86);
        heartGroup.add(rvGroup);

        /* 좌심실: 우심실보다 3배 두꺼운 심근벽(0.245) 및 원추형 심첨 */
        const lvGroup = makeVentricle({ x: 0.52, y: 0, z: 0, cav: LV_CAV, wall: 0.245, blood: COL_ART, info: 'lv' });
        lvGroup.scale.set(1.0, 1.08, 1.12);
        heartGroup.add(lvGroup);

        /* 유두근 및 건삭 입체 튜브 연결 */
        const papLV1 = makePapillary(new THREE.Vector3(0.18,-0.75,0.12), new THREE.Vector3(0.12,-0.32,0.08), 0.080, 0.040, lvGroup);
        const papLV2 = makePapillary(new THREE.Vector3(0.26,-0.70,-0.12), new THREE.Vector3(0.18,-0.28,-0.08), 0.075, 0.038, lvGroup);
        makeChordae(papLV1.tip, [new THREE.Vector3(0.00,0.15,0.12), new THREE.Vector3(0.06,0.14,0.14), new THREE.Vector3(0.12,0.14,0.10)], lvGroup);
        makeChordae(papLV2.tip, [new THREE.Vector3(0.02,0.15,-0.02), new THREE.Vector3(0.08,0.14,-0.05), new THREE.Vector3(0.14,0.14,-0.02)], lvGroup);

        const papRV1 = makePapillary(new THREE.Vector3(-0.18,-0.68,0.10), new THREE.Vector3(-0.12,-0.28,0.08), 0.070, 0.036, rvGroup);
        const papRV2 = makePapillary(new THREE.Vector3(-0.22,-0.64,-0.10), new THREE.Vector3(-0.16,-0.25,-0.08), 0.068, 0.034, rvGroup);
        makeChordae(papRV1.tip, [new THREE.Vector3(-0.18,0.11,0.08), new THREE.Vector3(-0.12,0.11,0.12)], rvGroup);
        makeChordae(papRV2.tip, [new THREE.Vector3(-0.16,0.11,-0.04), new THREE.Vector3(-0.10,0.11,-0.06)], rvGroup);

        /* 심실중격 */
        const septumGroup = new THREE.Group();
        heartGroup.add(septumGroup);

        const septumShape = new THREE.Shape();
        septumShape.moveTo(-0.16, 0.22); septumShape.lineTo(0.20, 0.22); septumShape.lineTo(0.21, -0.20);
        septumShape.lineTo(0.20, -0.65); septumShape.lineTo(0.18, -1.02); septumShape.lineTo(0.14, -1.35);
        septumShape.lineTo(-0.10, -1.28); septumShape.lineTo(-0.14, -0.98); septumShape.lineTo(-0.16, -0.55);
        septumShape.closePath();

        const septumFace = new THREE.Mesh(new THREE.ShapeGeometry(septumShape, 28), sectionMaterial(C_MUSCLE_D));
        septumFace.position.z = -0.006;
        septumGroup.add(septumFace);
        sectionFaces.push(septumFace);
        registerPick(septumFace, 'septum');

        const sExtrude = new THREE.ExtrudeGeometry(septumShape, { depth: 0.44, bevelEnabled: true, bevelSegments: 3, steps: 1, bevelSize: 0.03, bevelThickness: 0.03 });
        const sBody = new THREE.Mesh(sExtrude, muscleMaterial());
        sBody.position.z = -0.01;
        septumGroup.add(sBody);
        registerPick(sBody, 'septum');

        /* 심첨부 */
        const apexGroup = new THREE.Group();
        apexGroup.position.set(0.18, -1.35, 0.0);
        const apexMesh = new THREE.Mesh(new THREE.ConeGeometry(0.26, 0.36, 32), muscleMaterial());
        apexMesh.rotation.set(Math.PI, 0, -0.18);
        apexGroup.add(apexMesh);
        registerPick(apexMesh, 'lv');
        heartGroup.add(apexGroup);

        /* 심방 및 심이(Auricle) 주머니 */
        function makeAtrium(cfg) {
            const g = new THREE.Group();
            g.position.set(cfg.x, cfg.y, 0);
            g.name = cfg.info;
            const R = cfg.R, t = cfg.t;

            const wall = new THREE.Mesh(new THREE.SphereGeometry(R, 44, 30), muscleMaterial());
            wall.scale.set(1.08, 1.0, 1.0);
            g.add(wall);
            registerPick(wall, cfg.info);

            const ring = new THREE.Mesh(new THREE.RingGeometry(R - t, R, 44, 1), sectionMaterial(C_MUSCLE_D));
            ring.position.z = -0.006;
            g.add(ring);
            sectionFaces.push(ring);

            const blood = new THREE.Mesh(new THREE.SphereGeometry(R - t, 40, 26), bloodMaterial(cfg.blood));
            blood.scale.set(1.08, 1, 1);
            g.add(blood);
            registerPick(blood, cfg.info);

            const pool = new THREE.Mesh(new THREE.CircleGeometry(R - t, 48), bloodFaceMaterial(cfg.blood));
            pool.scale.set(1.08, 1, 1);
            pool.position.z = -0.005;
            g.add(pool);
            sectionFaces.push(pool);

            hittableMats.push({ mesh: wall, mat: wall.material });
            g.userData.base = { x: cfg.x, y: cfg.y, z: 0 };
            return g;
        }

        const raGroup = makeAtrium({ x: -0.74, y: 0.62, R: 0.46, t: 0.065, blood: COL_VEIN, info: 'ra' });
        raGroup.scale.set(1.06, 0.94, 1.08);
        heartGroup.add(raGroup);

        const laGroup = makeAtrium({ x: 0.74, y: 0.64, R: 0.42, t: 0.058, blood: COL_ART, info: 'la' });
        laGroup.scale.set(1.10, 0.96, 0.96);
        heartGroup.add(laGroup);

        /* 판막 (삼첨판 3엽, 이첨판 2엽, 반월판) */
        const valves = [];
        function makeValve(cfg) {
            const g = new THREE.Group();
            g.position.set(cfg.x, cfg.y, cfg.z || 0);
            g.rotation.x = -Math.PI / 2;
            const sleeve = new THREE.Mesh(new THREE.CylinderGeometry(cfg.r * 1.10, cfg.r * 1.02, 0.11, 36, 1, true), muscleMaterial());
            sleeve.position.y = -0.02; g.add(sleeve);
            const ring = new THREE.Mesh(new THREE.TorusGeometry(cfg.r, cfg.r*0.055, 8, 40), new THREE.MeshStandardMaterial({ color: 0xf0dbc2, roughness: 0.5, emissive: 0x2a1a10, emissiveIntensity: 0.18 }));
            g.add(ring);
            const leafMat = new THREE.MeshStandardMaterial({ color: 0xfbf0e4, roughness: 0.38, side: THREE.DoubleSide, transparent: true, opacity: 0.90, emissive: 0x4a3222, emissiveIntensity: 0.16 });
            const hinges = [];
            for (let i=0; i<cfg.n; i++) {
                const arm = new THREE.Group(); arm.rotation.z = (i*Math.PI*2)/cfg.n;
                const hinge = new THREE.Group(); arm.add(hinge);
                const leaf = new THREE.Mesh(new THREE.CircleGeometry(cfg.r*0.88, 12, 0.08, (Math.PI*2)/cfg.n - 0.16), leafMat);
                hinge.add(leaf); g.add(arm); hinges.push(hinge);
            }
            g.userData = { hinges: hinges, open: cfg.openSign, angle: 0 };
            g.traverse(o => { if (o.isMesh) registerPick(o, cfg.info); });
            valves.push(g); heartGroup.add(g);
        }
        makeValve({ x:-0.60, y:0.18, z:0.055, r:0.27, n:3, openSign:-1, info:'tricuspid' });
        makeValve({ x:0.62, y:0.22, z:0.055, r:0.25, n:2, openSign:-1, info:'mitral' });
        makeValve({ x:-0.24, y:0.24, z:0.06, r:0.14, n:3, openSign:1, info:'pvalve' });
        makeValve({ x:0.20, y:0.26, z:-0.02, r:0.13, n:3, openSign:1, info:'avalve' });

        /* 관상동맥(LAD, RCA) 가지 */
        const coronaryGroup = new THREE.Group();
        heartGroup.add(coronaryGroup);
        function addCoronary(pts, radius, hex, info) {
            const curve = new THREE.CatmullRomCurve3(pts);
            const mat = useClip(new THREE.MeshStandardMaterial({ color: hex, roughness: 0.35, emissive: hex, emissiveIntensity: 0.25 }));
            const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 32, radius, 10, false), mat);
            coronaryGroup.add(mesh);
            registerPick(mesh, info);
        }
