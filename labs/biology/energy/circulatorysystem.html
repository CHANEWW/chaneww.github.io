<!DOCTYPE html>
<html lang="ko" data-mzoom="0.62">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>순환계와 혈액의 순환 3D</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <script src="../../common/lib/three.min.js"></script>
    <script src="../../common/lib/OrbitControls.js"></script>
    <style>
        @font-face {
            font-family: 'SeoulNamsan';
            src: local('SeoulNamsan M'), local('SeoulNamsanM'), local('서울남산체 M'),
                 url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff') format('woff');
            font-weight: 400; font-style: normal; font-display: swap;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            font-family: 'SeoulNamsan', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
            background-color: #eef2f8; color: #1c1c1e;
            transition: background-color 0.35s ease, color 0.35s ease;
            -webkit-user-select: none; user-select: none;
        }
        #canvas-container { position: fixed; inset: 0; z-index: 1; touch-action: none; }
        #canvas-container canvas { display: block; touch-action: none; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(22px) saturate(180%);
            -webkit-backdrop-filter: blur(22px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.55);
            box-shadow: 0 10px 32px rgba(20, 30, 50, 0.10);
            border-radius: 20px;
        }

        .top-left-bar {
            position: fixed; top: 18px; left: 20px; display: flex; align-items: center; gap: 9px; z-index: 30;
        }
        .back-btn {
            display: flex; align-items: center; gap: 6px; padding: 9px 16px;
            font-family: inherit; font-size: 14px; font-weight: bold; color: #1c1c1e;
            text-decoration: none; cursor: pointer; border: none; white-space: nowrap;
            transition: transform 0.18s ease, background 0.2s ease;
        }
        .back-btn:hover { transform: translateY(-1px); background: rgba(255, 255, 255, 0.92); }
        .tag-badge {
            display: flex; align-items: center; gap: 8px; padding: 9px 16px; font-size: 14px; font-weight: bold; white-space: nowrap;
        }
        .tag-pill {
            background: rgba(230, 57, 70, 0.13); color: #d92b38; padding: 2px 8px; border-radius: 10px; font-size: 10.5px; font-weight: bold;
        }

        .top-right-bar { position: fixed; top: 16px; right: 20px; z-index: 40; display: flex; gap: 10px; align-items: center; }
        .icon-btn {
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; cursor: pointer; border: none; background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            font-size: 16px; color: #1c1c1e; box-shadow: 0 8px 26px rgba(20, 30, 50, 0.10); transition: transform 0.18s ease;
        }
        .icon-btn:hover { transform: translateY(-1px); }
        .data-card { display: flex; align-items: center; gap: 14px; padding: 8px 18px; border-radius: 18px; }
        .data-item { display: flex; flex-direction: column; align-items: center; gap: 1px; }
        .data-label { font-size: 10px; color: #8e8e93; font-weight: bold; white-space: nowrap; }
        .data-value { font-size: 14px; font-weight: bold; color: #1c1c1e; white-space: nowrap; transition: color 0.25s ease; }
        .data-sep { width: 1px; height: 26px; background: rgba(0, 0, 0, 0.10); }

        .center-tooltip {
            position: fixed; top: 15%; left: 50%; transform: translateX(-50%);
            padding: 8px 18px; font-size: 12.5px; font-weight: bold; color: #5c6470;
            border-radius: 999px; pointer-events: none; z-index: 25; transition: opacity 0.6s ease; white-space: nowrap;
        }
        .center-tooltip.hidden { opacity: 0; }

        .side-ctrl-panel {
            position: fixed; right: 20px; top: 80px; width: 220px; z-index: 50;
            padding: 14px; display: flex; flex-direction: column; gap: 9px;
        }
        .panel-title { font-size: 13px; font-weight: bold; color: #475569; text-align: center; margin-bottom: 2px; }
        .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 100%; }
        .mode-chip {
            padding: 8px 4px; border-radius: 11px; border: 1px solid rgba(0, 0, 0, 0.07);
            background: rgba(255, 255, 255, 0.72); color: #3c4250; font-family: inherit; font-size: 11px; font-weight: bold;
            cursor: pointer; text-align: center; transition: all 0.18s ease;
        }
        .mode-chip:hover { background: #ffffff; }
        .mode-chip.active {
            background: linear-gradient(135deg, #ff5d68, #e63946); border-color: #e63946; color: #fff;
            box-shadow: 0 4px 12px rgba(230, 57, 70, 0.32);
        }

        .ctrl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 100%; }
        .control-tab-btn {
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
            padding: 10px 4px; border-radius: 14px; border: 1px solid rgba(0, 0, 0, 0.07);
            background: rgba(255, 255, 255, 0.75); font-family: inherit; font-size: 11px; font-weight: bold; color: #2c3e50;
            cursor: pointer; transition: all 0.18s ease;
        }
        .control-tab-btn span:first-child { font-size: 16px; }
        .control-tab-btn.active {
            background: linear-gradient(135deg, #ff5d68, #e63946) !important; border-color: #e63946 !important;
            color: #fff !important; box-shadow: 0 4px 14px rgba(230, 57, 70, 0.30) !important;
        }
        .full-btn { grid-column: span 2; }

        .sub-panel {
            position: fixed; right: 250px; top: 180px; display: none; flex-direction: column; gap: 12px;
            padding: 14px 16px; z-index: 55; width: 230px;
        }
        .sub-panel.show { display: flex; }
        .sub-head { display: flex; align-items: center; justify-content: space-between; }
        .sub-panel-title { font-size: 12px; font-weight: bold; color: #334155; }
        .sub-close { border: none; background: rgba(0,0,0,0.06); color: #5c6470; width: 22px; height: 22px; border-radius: 50%; cursor: pointer; }

        .slider-block { display: flex; flex-direction: column; gap: 5px; }
        .slider-header { display: flex; justify-content: space-between; font-size: 11px; font-weight: bold; color: #475569; }
        .slider-block input[type="range"] { width: 100%; accent-color: #e63946; cursor: pointer; }

        .bottom-right-bar { position: fixed; bottom: 20px; right: 20px; z-index: 40; }
        #boardHelp { position: fixed; left: 20px; bottom: 20px; z-index: 5; padding: 7px 12px; border-radius: 12px; background: rgba(255, 255, 255, 0.62); color: #7a8390; font-size: 11px; font-weight: bold; pointer-events: none; backdrop-filter: blur(10px); }

        body.dark-mode { background-color: #0f1218; color: #f2f2f7; }
        body.dark-mode .glass-panel { background: rgba(30, 34, 42, 0.80); border-color: rgba(255, 255, 255, 0.10); color: #f2f2f7; }
        body.dark-mode .icon-btn { background: rgba(38, 42, 52, 0.85); color: #f2f2f7; }
        body.dark-mode .mode-chip, body.dark-mode .control-tab-btn { background: rgba(52, 58, 70, 0.85); color: #dbe2ee; border-color: rgba(255,255,255,0.1); }
        body.dark-mode .data-value { color: #f2f2f7; }
    </style>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="../../common/qr-modal.css">
    <link rel="stylesheet" href="../../common/ui-layout.css">
</head>
<body>

    <div id="canvas-container"></div>

    <div class="top-left-bar">
        <a href="/index.html" class="glass-panel back-btn">
            <span>⬅</span> 메인
        </a>
        <div class="glass-panel tag-badge">
            <span>순환계 3D</span>
            <span class="tag-pill">visionOS</span>
        </div>
        <button class="glass-panel back-btn qr-btn" id="qrBtn" type="button" title="QR 코드"><span class="qr-btn-icon">📱</span> <span class="qr-btn-label">QR code</span></button>
    </div>

    <div class="top-right-bar">
        <button class="icon-btn" id="theme-toggle" title="야간 모드">🌙</button>
        <div class="glass-panel data-card">
            <div class="data-item">
                <span class="data-label">심장 주기</span>
                <span class="data-value" id="val-phase" style="color:#ff9500;">수축/이완</span>
            </div>
            <div class="data-sep"></div>
            <div class="data-item">
                <span class="data-label">심박수</span>
                <span class="data-value" id="val-bpm">72 BPM</span>
            </div>
            <div class="data-sep"></div>
            <div class="data-item">
                <span class="data-label">혈류</span>
                <span class="data-value" id="val-flow" style="color:#34c759;">정상 순환</span>
            </div>
        </div>
    </div>

    <div class="glass-panel center-tooltip" id="guide">💡 화면을 드래그하여 심장과 순환계를 회전시켜 보세요</div>
    <div id="boardHelp">드래그: 회전 · 휠/지침: 확대/축소 · 우클릭: 이동</div>

    <!-- visionOS 스타일 순환 조절 패널 (우측 카드 형태) -->
    <div class="glass-panel side-ctrl-panel" id="sidePanel">
        <div class="panel-title">🎛 순환 조절</div>
        <div class="mode-grid">
            <button class="mode-chip active" data-mode="all">전체 순환</button>
            <button class="mode-chip" data-mode="sys">온몸순환</button>
            <button class="mode-chip" data-mode="pulm">폐순환</button>
            <button class="mode-chip" data-mode="heart">심장 집중</button>
        </div>
        <div class="ctrl-grid">
            <button class="control-tab-btn active" id="btn-play">
                <span id="play-icon">⏸</span>
                <span id="play-text">일시정지</span>
            </button>
            <button class="control-tab-btn" id="btn-bpm">
                <span>⚙️</span>
                <span>심박 조절</span>
            </button>
            <button class="control-tab-btn active" id="btn-cut">
                <span>🔪</span>
                <span>심장 단면</span>
            </button>
            <button class="control-tab-btn active" id="btn-label">
                <span>🏷️</span>
                <span>3D 라벨</span>
            </button>
        </div>
    </div>

    <div class="glass-panel sub-panel" id="subPanel">
        <div class="sub-head">
            <span class="sub-panel-title">🫀 심장 박동 조절</span>
            <button class="sub-close" id="subClose">✕</button>
        </div>
        <div class="slider-block">
            <div class="slider-header"><span>속도 / 심박수</span><span id="bpmVal">1.0×</span></div>
            <input type="range" id="speedSlider" min="0.3" max="2.0" step="0.1" value="1.0">
        </div>
    </div>

    <div class="bottom-right-bar">
        <button id="fullscreenBtn" class="glass-panel back-btn">
            <span id="fullscreenIcon">⛶</span>
            <span id="fullscreenText">전체화면</span>
        </button>
    </div>

<script>
(function(){
    const container = document.getElementById('canvas-container');
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.localClippingEnabled = true;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#eef2f8');

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 300);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, -1, 0);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x8a9fb0, 0.85));
    const dl = new THREE.DirectionalLight(0xffffff, 0.8); dl.position.set(8, 12, 16); scene.add(dl);
    const dl2 = new THREE.DirectionalLight(0xbcd4ff, 0.35); dl2.position.set(-10, -4, -8); scene.add(dl2);

    function resize() {
        const w = window.innerWidth, h = window.innerHeight;
        renderer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        if (!resize.done) {
            const d = 26 * Math.max(1, 0.8 / camera.aspect);
            camera.position.set(d * 0.2, d * 0.08, d * 0.98);
            resize.done = true;
        }
    }
    window.addEventListener('resize', resize); resize();

    // 색상 정의
    const BLUE = new THREE.Color('#2f7fe0'), RED = new THREE.Color('#e5483f'), MIX = new THREE.Color('#9a6bb8');
    const V = (x, y, z) => new THREE.Vector3(x, y, z);

    // 심장 및 주요 지점 좌표
    const RA = V(-1.1, 0.5, 0.3), RV = V(-0.45, -1.3, 0.5), LA = V(1.2, 0.8, -0.5), LV = V(0.8, -1.3, -0.1);
    const A_L = V(-3.4, 6.0, 0.1), A_R = V(3.4, 6.0, 0.1), B_A = V(4.0, -6.8, 0.2), B_V = V(-4.0, -6.8, 0.2);

    const P = (pts, c0, c1, r, circ) => ({ pts, c0, c1, r, circ });
    const S = {
        ra_rv: P([RA, V(-0.9, -0.4, 0.4), RV], BLUE, BLUE, 0, 'pulm'),
        trunk: P([RV, V(-0.2, -0.1, 0.8), V(-0.1, 1.4, 0.7)], BLUE, BLUE, 0.27, 'pulm'),
        pa: P([V(-0.1, 1.4, 0.7), V(-1.8, 2.3, 0.5), V(-4.2, 2.7, 0.3), V(-4.7, 4.5, 0.2), A_L], BLUE, BLUE, 0.24, 'pulm'),
        pv: P([A_R, V(4.6, 4.4, -0.9), V(3.0, 2.6, -1.2), V(1.6, 1.4, -0.9), LA], RED, RED, 0.22, 'pulm'),
        la_lv: P([LA, V(1.1, -0.2, -0.3), LV], RED, RED, 0, 'sys'),
        ao: P([LV, V(0.55, 0.4, 0), V(0.3, 1.8, 0), V(1.2, 3.1, 0.1), V(3.2, 2.8, 0.4), V(5.0, 0.6, 0.2), V(5.2, -3.0, 0.2), V(4.6, -5.8, 0.2), B_A], RED, RED, 0.3, 'sys'),
        vc: P([B_V, V(-5.0, -4.5, 0.2), V(-5.1, -1.0, 0.0), V(-4.6, 0.9, -0.3), V(-3.0, 1.6, -0.4), V(-1.9, 0.9, -0.1), RA], BLUE, BLUE, 0.27, 'sys')
    };

    let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    const K = 5, lungCaps = [], bodyCaps = [];
    for (let k = 0; k < K; k++) {
        const lp = [A_L], bp = [B_A];
        for (let j = 1; j < 6; j++) {
            const f = j / 6;
            lp.push(V(-3.4 + 6.8 * f + (rnd() - 0.5) * 0.6, 6.3 + 1.7 * Math.sin(Math.PI * f) * (0.3 + rnd()) + (rnd() - 0.5) * 0.6, (rnd() - 0.5) * 1.2));
            bp.push(V(4.0 - 8.0 * f + (rnd() - 0.5) * 0.6, -6.8 - 2.7 * Math.sin(Math.PI * f) * (0.3 + 0.7 * rnd()) + (rnd() - 0.5) * 0.6, (rnd() - 0.5) * 1.2));
        }
        lp.push(A_R); bp.push(B_V);
        lungCaps.push(P(lp, BLUE, RED, 0.05, 'pulm'));
        bodyCaps.push(P(bp, RED, BLUE, 0.05, 'sys'));
    }
    const allSegs = Object.values(S).concat(lungCaps, bodyCaps);
    allSegs.forEach(s => { s.curve = new THREE.CatmullRomCurve3(s.pts); s.len = s.curve.getLength(); });

    // 혈관 메쉬
    const tubes = [];
    allSegs.forEach(s => {
        if (!s.r) return;
        const col = (s.c0 === s.c1) ? s.c0 : MIX;
        const m = new THREE.Mesh(new THREE.TubeGeometry(s.curve, 70, s.r, 14, false),
            new THREE.MeshPhongMaterial({ color: col, transparent: true, opacity: s.r > 0.1 ? 0.5 : 0.38, depthWrite: false, side: THREE.DoubleSide, shininess: 70 }));
        scene.add(m); tubes.push({ m, circ: s.circ, base: s.r > 0.1 ? 0.5 : 0.38 });
    });

    // 심장 껍질(앞/뒤 분리) 및 심실중격 — 단면 모드에서 실제로 잘라 볼 수 있도록 두 겹으로 만든다
    const CUT_Z = 0.42;
    const clipBackHalf = new THREE.Plane(new THREE.Vector3(0, 0, -1), CUT_Z);   // z <= CUT_Z (뒤쪽 절반 유지)
    const clipFrontHalf = new THREE.Plane(new THREE.Vector3(0, 0, 1), -CUT_Z);  // z >= CUT_Z (앞쪽 절반 유지)
    const shellGeo = new THREE.SphereGeometry(1, 40, 30);
    function makeShellMat(opacity) {
        return new THREE.MeshPhongMaterial({ color: 0xf0cdb4, transparent: true, opacity: opacity, depthWrite: false, shininess: 30, side: THREE.DoubleSide });
    }
    const shell = new THREE.Mesh(shellGeo, makeShellMat(0.85));
    shell.position.set(0.1, -0.9, 0); shell.scale.set(2.7, 3.0, 1.6); shell.rotation.z = 0.2; scene.add(shell);
    const shellFront = new THREE.Mesh(shellGeo, makeShellMat(0.12));
    shellFront.position.copy(shell.position); shellFront.scale.copy(shell.scale); shellFront.rotation.copy(shell.rotation);
    shellFront.visible = false; scene.add(shellFront);

    // 단면에서 잘린 테두리 — 진짜로 잘라 봤다는 것이 한눈에 보이게
    const cutEdge = (function () {
        const rr = Math.sqrt(1 - CUT_Z * CUT_Z);
        const pts = [];
        for (let i = 0; i <= 96; i++) {
            const a = i / 96 * Math.PI * 2;
            pts.push(new THREE.Vector3(Math.cos(a) * rr, Math.sin(a) * rr, CUT_Z));
        }
        const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0xc08a6a, transparent: true, opacity: 0.9 }));
        shell.add(line);
        return line;
    })();

    const septum = new THREE.Mesh(new THREE.BoxGeometry(0.14, 3.0, 1.3), new THREE.MeshPhongMaterial({ color: 0xf3dccb, transparent: true, opacity: 0.75, side: THREE.DoubleSide }));
    septum.position.set(0.1, -0.6, 0.1); septum.rotation.z = 0.18; scene.add(septum);

    const chambers = [];
    function chamber(c, sc, col, rz, kind) {
        const m = new THREE.Mesh(new THREE.SphereGeometry(1, 40, 28),
            new THREE.MeshPhongMaterial({ color: col, transparent: true, opacity: 0.5, depthWrite: false, shininess: 80, side: THREE.DoubleSide }));
        m.position.copy(c); m.scale.set(...sc); m.rotation.z = rz; scene.add(m);
        chambers.push({ m, base: V(...sc), kind });
    }
    chamber(RA, [0.8, 0.85, 0.75], BLUE, 0, 'a');
    chamber(LA, [0.75, 0.7, 0.7], RED, 0, 'a');
    chamber(RV, [0.95, 1.4, 0.8], BLUE, 0.2, 'v');
    chamber(LV, [1.0, 1.65, 0.95], RED, 0.25, 'v');

    // =====================================================
    //  판막(방실판막 · 반월판) — 심장 주기에 맞춰 실제로 여닫힌다
    // =====================================================
    const valveLeafTex = (function () {
        const cv = document.createElement('canvas');
        cv.width = 128; cv.height = 128;
        const g = cv.getContext('2d');
        g.beginPath();
        g.moveTo(6, 4);
        g.bezierCurveTo(18, 72, 42, 116, 64, 124);
        g.bezierCurveTo(86, 116, 110, 72, 122, 4);
        g.closePath();
        const grd = g.createLinearGradient(0, 0, 0, 128);
        grd.addColorStop(0, '#ffdfd0');
        grd.addColorStop(0.55, '#f6c7b2');
        grd.addColorStop(1, '#dd9a80');
        g.fillStyle = grd; g.fill();
        g.lineWidth = 5; g.strokeStyle = 'rgba(176,106,82,0.95)'; g.stroke();
        return new THREE.CanvasTexture(cv);
    })();
    const valveLeafMat = new THREE.MeshPhongMaterial({ map: valveLeafTex, alphaTest: 0.45, side: THREE.DoubleSide, shininess: 70 });
    const valveRingMat = new THREE.MeshPhongMaterial({ color: 0xd4694f, shininess: 45, side: THREE.DoubleSide });
    const valves = [];

    function buildValve(name, pos, dir, R, count, maxAngle) {
        const g = new THREE.Group();
        g.position.copy(pos);
        g.quaternion.setFromUnitVectors(V(0, 1, 0), dir.clone().normalize());
        scene.add(g);

        const ring = new THREE.Mesh(new THREE.TorusGeometry(R, 0.045, 10, 40), valveRingMat);
        ring.rotation.x = Math.PI / 2;
        g.add(ring);

        const flaps = [];
        const W = 2 * R * Math.sin(Math.PI / count) * 1.32;
        const L = R * 0.98;
        for (let i = 0; i < count; i++) {
            const th = i * 2 * Math.PI / count;
            const pivot = new THREE.Group();
            pivot.position.set(R * Math.cos(th), 0, R * Math.sin(th));
            pivot.rotation.y = -th;
            g.add(pivot);
            const flap = new THREE.Group();
            pivot.add(flap);
            const geo = new THREE.PlaneGeometry(W, L, 4, 4);
            geo.translate(0, L / 2, 0);
            const m = new THREE.Mesh(geo, valveLeafMat);
            m.rotation.y = Math.PI / 2;
            flap.add(m);
            flaps.push(flap);
        }
        const v = { name, g, flaps, R, maxAngle: maxAngle || Math.PI / 2 * 0.96, open: 0 };
        valves.push(v);
        return v;
    }

    // 방실판막: 심방 → 심실 (심실 수축 때 닫혀 역류를 막음)
    const vTricuspid = buildValve('삼첨판', V(-0.78, -0.42, 0.42), V(0.65, -1.8, 0.2), 0.40, 3);
    const vMitral = buildValve('이첨판', V(1.00, -0.30, -0.30), V(-0.40, -2.1, 0.40), 0.42, 2);
    // 반월판: 심실 → 동맥 (심실 수축 때 열려 혈액을 내보냄)
    const vPulm = buildValve('폐동맥판', V(-0.26, 0.02, 0.76), V(0.25, 1.2, 0.3), 0.24, 3);
    const vAortic = buildValve('대동맥판', V(0.62, -0.32, -0.06), V(-0.25, 1.7, 0.1), 0.24, 3);

    // =====================================================
    //  3D 명칭 라벨 (스프라이트 + 지시선)
    // =====================================================
    const labelGroup = new THREE.Group();
    scene.add(labelGroup);
    const LABELS = [];
    let labelsVisible = true;

    function labelTexture(text, color, bg, fs) {
        const lines = String(text).split('\n');
        const cv = document.createElement('canvas');
        let ctx = cv.getContext('2d');
        const font = "bold " + fs + "px 'SeoulNamsan', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif";
        ctx.font = font;
        let tw = 0;
        lines.forEach(l => { tw = Math.max(tw, ctx.measureText(l).width); });
        cv.width = Math.ceil(tw + fs * 0.8);
        cv.height = Math.round(fs * 1.42 * lines.length);
        ctx = cv.getContext('2d');
        ctx.font = font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        if (bg) {
            const r = Math.round(fs * 0.3), w = cv.width, h = cv.height;
            ctx.fillStyle = bg;
            ctx.beginPath();
            ctx.moveTo(r, 0); ctx.lineTo(w - r, 0); ctx.quadraticCurveTo(w, 0, w, r);
            ctx.lineTo(w, h - r); ctx.quadraticCurveTo(w, h, w - r, h);
            ctx.lineTo(r, h); ctx.quadraticCurveTo(0, h, 0, h - r);
            ctx.lineTo(0, r); ctx.quadraticCurveTo(0, 0, r, 0);
            ctx.fill();
        }
        ctx.fillStyle = color;
        lines.forEach((l, i) => ctx.fillText(l, cv.width / 2, cv.height * (i + 0.5) / lines.length + fs * 0.04));
        return cv;
    }

    function addLabel(text, anchor, pos, opt) {
        opt = opt || {};
        const fs = opt.fs || 104;
        const wpp = 0.0052 * (opt.scale || 0.72);
        const cv = labelTexture(text, opt.color || '#122233', opt.bg || 'rgba(255,255,255,0.9)', fs);
        const tex = new THREE.CanvasTexture(cv);
        tex.minFilter = THREE.LinearFilter;
        const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false, depthWrite: false }));
        sp.scale.set(cv.width * wpp, cv.height * wpp, 1);
        sp.position.copy(pos);
        sp.renderOrder = 60;
        labelGroup.add(sp);

        let line = null;
        if (anchor) {
            const dir = pos.clone().sub(anchor);
            if (dir.length() > 0.001) {
                const shrink = (cv.height * wpp) * 0.5 + 0.04;
                const end = pos.clone().sub(dir.clone().normalize().multiplyScalar(Math.min(shrink, dir.length() * 0.85)));
                const g = new THREE.BufferGeometry().setFromPoints([anchor.clone(), end]);
                line = new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0x90a2b6, transparent: true, opacity: 0.75, depthTest: false }));
                line.renderOrder = 55;
                labelGroup.add(line);
            }
        }
        LABELS.push({ sp, base: sp.scale.clone(), line: line, valveOnly: !!opt.valveOnly, args: { text: text, color: opt.color || '#122233', bg: opt.bg || 'rgba(255,255,255,0.9)', fs: fs, scale: opt.scale || 0.72 } });
        return sp;
    }

    // 웹폰트가 늦게 로드되면 라벨 텍스처를 다시 그린다
    function refreshLabelTextures() {
        LABELS.forEach(r => {
            const a = r.args;
            const cv = labelTexture(a.text, a.color, a.bg, a.fs);
            const tex = new THREE.CanvasTexture(cv);
            tex.minFilter = THREE.LinearFilter;
            r.sp.material.map = tex;
            r.sp.material.needsUpdate = true;
            const wpp = 0.0052 * a.scale;
            r.base.set(cv.width * wpp, cv.height * wpp, 1);
            r.sp.scale.copy(r.base);
        });
    }
    if (document.fonts && document.fonts.load) {
        document.fonts.load("bold 104px 'SeoulNamsan'").then(refreshLabelTextures, function () {});
        if (document.fonts.ready) document.fonts.ready.then(refreshLabelTextures, function () {});
    }

    // 심방·심실·대혈관 이름
    addLabel('우심방', RA, V(-3.05, 1.45, 0.3));
    addLabel('우심실', RV, V(-3.15, -2.15, 0.6));
    addLabel('좌심방', LA, V(3.05, 1.7, -0.5));
    addLabel('좌심실', LV, V(3.25, -2.2, -0.2));
    addLabel('대동맥', V(3.2, 2.8, 0.4), V(4.4, 4.3, 0.5));
    addLabel('폐동맥', V(-1.8, 2.3, 0.5), V(-2.7, 4.3, 0.6));
    addLabel('대정맥', V(-4.6, 0.9, -0.3), V(-6.2, 2.1, -0.3));
    addLabel('폐정맥', V(3.0, 2.6, -1.2), V(5.9, 2.4, -1.7));

    // 판막 이름 (단면 모드에서만)
    addLabel('삼첨판\n방실판막', V(-0.78, -0.42, 0.42), V(-1.9, -3.25, 1.2), { fs: 84, scale: 0.58, valveOnly: true, color: '#7a2b1e' });
    addLabel('이첨판\n방실판막', V(1.0, -0.3, -0.3), V(1.95, -3.25, 1.2), { fs: 84, scale: 0.58, valveOnly: true, color: '#7a2b1e' });
    addLabel('폐동맥판\n반월판', V(-0.26, 0.02, 0.76), V(-1.55, 2.5, 2.0), { fs: 84, scale: 0.58, valveOnly: true, color: '#7a2b1e' });
    addLabel('대동맥판\n반월판', V(0.62, -0.32, -0.06), V(1.75, 2.35, 2.0), { fs: 84, scale: 0.58, valveOnly: true, color: '#7a2b1e' });


    // 폐 및 전신 인체 모형
    const mat = (c, o) => new THREE.MeshPhongMaterial({ color: c, transparent: o < 1, opacity: o, shininess: 40 });
    [-1, 1].forEach(s => {
        const m = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 24), mat(0xe8935a, 0.85));
        m.position.set(s * 1.0, 6.9, 0); m.scale.set(0.95, 1.6, 0.8); m.rotation.z = -s * 0.12; scene.add(m);
    });

    const skin = mat(0xf6d7cb, 0.92);
    function part(geo, x, y, z, rz, sc) { const m = new THREE.Mesh(geo, skin); m.position.set(x, y, z); m.rotation.z = rz || 0; if (sc) m.scale.set(...sc); scene.add(m); }
    part(new THREE.SphereGeometry(0.38, 20, 16), 0, -6.5, 0);
    part(new THREE.SphereGeometry(1, 20, 16), 0, -7.8, 0, 0, [0.62, 1.15, 0.32]);

    // 혈액 입자 시스템
    const mainA = [S.ra_rv, S.trunk, S.pa], mainB = [S.pv, S.la_lv, S.ao];
    const routes = [];
    for (let i = 0; i < K; i++) for (let j = 0; j < K; j++) {
        const segs = [...mainA, lungCaps[i], ...mainB, bodyCaps[j], S.vc];
        routes.push({ segs, total: segs.reduce((a, s) => a + s.len, 0) });
    }
    const N = 260;
    const inst = new THREE.InstancedMesh(new THREE.SphereGeometry(0.11, 12, 12), new THREE.MeshPhongMaterial({ shininess: 90 }), N);
    inst.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(N * 3), 3);
    scene.add(inst);
    
    const parts = [];
    for (let i = 0; i < N; i++) {
        const r = routes[Math.floor(Math.random() * routes.length)];
        parts.push({ r, u: Math.random() * r.total, v: 0.85 + Math.random() * 0.3, off: V((Math.random() - 0.5) * 0.16, (Math.random() - 0.5) * 0.16, (Math.random() - 0.5) * 0.16) });
    }
    const dummy = new THREE.Object3D(), tmp = new THREE.Color();

    // 상태 관리
    let mode = 'all', playing = true, speed = 1.0, cross = true;

    // UI 이벤트 연결
    document.querySelectorAll('[data-mode]').forEach(b => {
        b.onclick = () => {
            document.querySelectorAll('[data-mode]').forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            mode = b.dataset.mode;
            tubes.forEach(t => {
                const on = (mode === 'all' || t.circ === mode || mode === 'heart');
                t.m.material.opacity = on ? t.base : 0.07;
            });
        };
    });

    const btnPlay = document.getElementById('btn-play');
    btnPlay.onclick = () => {
        playing = !playing;
        document.getElementById('play-icon').textContent = playing ? '⏸' : '▶';
        document.getElementById('play-text').textContent = playing ? '일시정지' : '재생';
        btnPlay.classList.toggle('active', playing);
    };

    const btnBpm = document.getElementById('btn-bpm');
    const subPanel = document.getElementById('subPanel');
    btnBpm.onclick = () => {
        const isShow = subPanel.classList.toggle('show');
        btnBpm.classList.toggle('active', isShow);
    };
    document.getElementById('subClose').onclick = () => {
        subPanel.classList.remove('show');
        btnBpm.classList.remove('active');
    };

    document.getElementById('speedSlider').oninput = (e) => {
        speed = parseFloat(e.target.value);
        document.getElementById('bpmVal').textContent = speed.toFixed(1) + '×';
        document.getElementById('val-bpm').textContent = Math.round(72 * speed) + ' BPM';
    };

    const btnCut = document.getElementById('btn-cut');
    btnCut.onclick = () => {
        cross = !cross;
        applyCross();
    };

    const btnLabel = document.getElementById('btn-label');
    btnLabel.onclick = () => {
        labelsVisible = !labelsVisible;
        btnLabel.classList.toggle('active', labelsVisible);
        updateLabelVisibility();
    };

    document.getElementById('theme-toggle').onclick = () => {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        scene.background = new THREE.Color(isDark ? '#0f1218' : '#eef2f8');
    };

    // 애니메이션 루프
    const bump = (x, a, b) => (x >= a && x < b) ? Math.sin(Math.PI * (x - a) / (b - a)) : 0;
    let t = 0, last = performance.now();

    // 판막 진행 각도 적용 (0 = 활짝 열림, 1 = 완전히 닫힘)
    function setValveOpen(v, o) {
        // 다 열린 상태에서도 판막이 완전히 옆으로 누운 채 사라지지 않도록 최소 각도(0.3rad)를 둔다
        const a = 0.30 + (v.maxAngle - 0.30) * (1 - o);
        v.flaps.forEach(f => { f.rotation.z = a; });
    }

    // 심장 주기에 따른 판막 개폐: 심실 수축(0.22~0.6)에 방실판막은 닫히고 반월판은 열린다.
    function updateValves(ph, dt, instant) {
        const ven = bump(ph, 0.22, 0.6);
        const avTarget = 0.08 + 0.92 * (1 - ven);   // 이완기·심방 수축기에 열림
        const slTarget = 0.06 + 0.94 * ven;         // 심실 수축기에 열림
        const k = instant ? 1 : Math.min(1, dt * 12);
        [vTricuspid, vMitral].forEach(v => { v.open += (avTarget - v.open) * k; setValveOpen(v, v.open); });
        [vPulm, vAortic].forEach(v => { v.open += (slTarget - v.open) * k; setValveOpen(v, v.open); });
    }

    function updateLabelVisibility() {
        LABELS.forEach(r => {
            const on = labelsVisible && (!r.valveOnly || cross);
            r.sp.visible = on;
            if (r.line) r.line.visible = on;
        });
    }

    // 단면(심장을 실제로 잘라 내부 구조를 보여주는 모드)
    function applyCross() {
        btnCut.classList.toggle('active', cross);
        septum.visible = cross;
        shell.material.clippingPlanes = cross ? [clipBackHalf] : null;
        shell.material.opacity = cross ? 0.42 : 0.85;
        shell.material.needsUpdate = true;
        shellFront.visible = cross;
        shellFront.material.clippingPlanes = cross ? [clipFrontHalf] : null;
        shellFront.material.needsUpdate = true;
        cutEdge.visible = cross;
        chambers.forEach(c => { c.m.material.opacity = cross ? 0.62 : 0.5; });
        valves.forEach(v => { v.g.visible = cross; });
        if (cross) updateValves(t % 1, 0, true);
        updateLabelVisibility();
    }

    function animate(now) {
        requestAnimationFrame(animate);
        const dt = Math.max(0, Math.min((now - last) / 1000, 0.05));
        last = now;

        if (playing) t += dt * speed;
        const ph = t % 1, atr = bump(ph, 0, 0.22), ven = bump(ph, 0.22, 0.6);

        chambers.forEach(c => {
            const k = 1 - 0.14 * (c.kind === 'a' ? atr : ven);
            c.m.scale.set(c.base.x * k, c.base.y * k, c.base.z * k);
        });

        const hs = 1 - 0.025 * ven;
        shell.scale.set(2.7 * hs, 3.0 * hs, 1.6 * hs);
        shellFront.scale.copy(shell.scale);

        if (cross) updateValves(ph, dt, false);

        // 라벨: 줌을 해도 같은 크기로 읽히도록 카메라 거리에 보정 (좁은 화면은 조금 작게)
        const camDist = camera.position.distanceTo(controls.target);
        const narrow = window.innerWidth < 600 ? 0.8 : 1;
        const lf = Math.min(1.9, Math.max(0.8, camDist / 26)) * narrow;
        LABELS.forEach(r => { if (r.sp.visible) r.sp.scale.copy(r.base).multiplyScalar(lf); });

        const phaseEl = document.getElementById('val-phase');
        if (ph < 0.22) { phaseEl.textContent = '심방 수축'; phaseEl.style.color = '#ff9500'; }
        else if (ph < 0.6) { phaseEl.textContent = '심실 수축'; phaseEl.style.color = '#e63946'; }
        else { phaseEl.textContent = '이완기'; phaseEl.style.color = '#8e8e93'; }

        const flow = playing ? (0.6 + 1.0 * ven + 0.4 * atr) : 0;
        parts.forEach((p, i) => {
            p.u = (p.u + dt * speed * 3.6 * p.v * flow) % p.r.total;
            let u = p.u, s = p.r.segs[0];
            for (const sg of p.r.segs) { if (u <= sg.len) { s = sg; break; } u -= sg.len; }
            const f = Math.min(u / s.len, 1);
            dummy.position.copy(s.curve.getPointAt(f)).add(p.off);
            dummy.scale.setScalar((mode === 'all' || s.circ === mode || mode === 'heart') ? 1 : 0.2);
            dummy.updateMatrix(); inst.setMatrixAt(i, dummy.matrix);
            tmp.copy(s.c0).lerp(s.c1, s.c0 === s.c1 ? 0 : f); inst.setColorAt(i, tmp);
        });

        inst.instanceMatrix.needsUpdate = true;
        inst.instanceColor.needsUpdate = true;
        controls.update();
        renderer.render(scene, camera);
    }
    applyCross();
    requestAnimationFrame(animate);
})();
</script>
<script src="../../common/feedback.js" defer></script>
<script src="../../common/ui-layout.js" defer></script>
<script src="../../common/lib/qrcode.min.js" defer></script>
<script src="../../common/qr-modal.js" defer></script>
