<!DOCTYPE html>
<html lang="ko" data-mzoom="0.62">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>순환계와 혈액의 순환 3D</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <!-- Three.js 및 OrbitControls 3D 엔진 라이브러리 -->
    <script src="../../common/lib/three.min.js"></script>
    <script src="../../common/lib/OrbitControls.js"></script>
    <style>
        @font-face {
            font-family: 'SeoulNamsan';
            src: local('SeoulNamsan M'), local('SeoulNamsanM'), local('서울남산체 M'),
                 url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'SeoulNamsan', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
            background-color: #eef2f8;
            color: #1c1c1e;
            transition: background-color 0.35s ease, color 0.35s ease;
            -webkit-user-select: none;
            user-select: none;
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
            touch-action: none;
        }
        #canvas-container canvas { display: block; touch-action: none; }

        /* ---------- visionOS 유리 패널 ---------- */
        .glass-panel {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(22px) saturate(180%);
            -webkit-backdrop-filter: blur(22px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.55);
            box-shadow: 0 10px 32px rgba(20, 30, 50, 0.10);
            border-radius: 20px;
        }

        /* ---------- 좌측 상단 헤더 ---------- */
        .top-left-bar {
            position: fixed;
            top: 18px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 9px;
            z-index: 30;
        }
        .back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 9px 16px;
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            color: #1c1c1e;
            text-decoration: none;
            cursor: pointer;
            border: none;
            white-space: nowrap;
            transition: transform 0.18s ease, background 0.2s ease;
        }
        .back-btn:hover { transform: translateY(-1px); background: rgba(255, 255, 255, 0.92); }
        .tag-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 16px;
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
        }
        .tag-pill {
            background: rgba(230, 57, 70, 0.13);
            color: #d92b38;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10.5px;
            font-weight: bold;
            letter-spacing: 0.2px;
        }

        /* ---------- 우측 상단 유틸 + 실시간 데이터 ---------- */
        .top-right-bar {
            position: fixed;
            top: 16px;
            right: 20px;
            z-index: 40;
        }
        .icon-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            font-family: inherit;
            font-size: 16px;
            color: #1c1c1e;
            box-shadow: 0 8px 26px rgba(20, 30, 50, 0.10);
            transition: transform 0.18s ease;
        }
        .icon-btn:hover { transform: translateY(-1px); }

        .data-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 8px 18px;
            border-radius: 18px;
        }
        .data-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
        }
        .data-label {
            font-size: 10px;
            color: #8e8e93;
            font-weight: bold;
            letter-spacing: -0.1px;
            white-space: nowrap;
        }
        .data-value {
            font-size: 14px;
            font-weight: bold;
            color: #1c1c1e;
            white-space: nowrap;
            transition: color 0.25s ease;
        }
        .data-sep {
            width: 1px;
            height: 26px;
            background: rgba(0, 0, 0, 0.10);
        }

        /* ---------- 중앙 안내 ---------- */
        .center-tooltip {
            position: fixed;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 18px;
            font-size: 12.5px;
            font-weight: bold;
            color: #5c6470;
            border-radius: 999px;
            pointer-events: none;
            z-index: 25;
            transition: opacity 0.6s ease;
            white-space: nowrap;
            max-width: calc(100vw - 40px);
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .center-tooltip.hidden { opacity: 0; }

        /* ---------- 우측 조절 패널 ---------- */
        .side-ctrl-panel { gap: 7px !important; }
        .mode-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            width: 100%;
        }
        .mode-chip {
            padding: 7px 2px;
            border-radius: 11px;
            border: 1px solid rgba(0, 0, 0, 0.07);
            background: rgba(255, 255, 255, 0.72);
            color: #3c4250;
            font-family: inherit;
            font-size: 10.5px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.18s ease;
        }
        .mode-chip:hover { background: #ffffff; }
        .mode-chip.active {
            background: linear-gradient(135deg, #ff5d68, #e63946);
            border-color: #e63946;
            color: #fff;
            box-shadow: 0 4px 12px rgba(230, 57, 70, 0.32);
        }

        .side-ctrl-panel .control-tab-btn { position: relative; }
        .side-ctrl-panel .control-tab-btn.active {
            background: linear-gradient(135deg, #ff5d68, #e63946) !important;
            border-color: #e63946 !important;
            color: #fff !important;
            box-shadow: 0 4px 14px rgba(230, 57, 70, 0.30) !important;
        }

        /* ---------- 서브 패널 (심박 조절) ---------- */
        .sub-panel {
            position: fixed;
            display: none;
            flex-direction: column;
            gap: 12px;
            padding: 14px 16px !important;
            z-index: 55;
        }
        .sub-panel.show { display: flex; }
        .sub-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .sub-panel-title {
            font-size: 12px;
            font-weight: bold;
            color: #334155;
            letter-spacing: -0.2px;
        }
        .sub-close {
            border: none;
            background: rgba(0, 0, 0, 0.06);
            color: #5c6470;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
            flex: 0 0 auto;
        }
        .slider-block {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 220px;
        }
        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11.5px;
            font-weight: bold;
            color: #475569;
        }
        .slider-header span:last-child { color: #e63946; font-size: 12px; }
        .slider-block input[type="range"] {
            width: 100%;
            height: 20px;
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            cursor: pointer;
            margin: 0;
        }
        .slider-block input[type="range"]::-webkit-slider-runnable-track {
            height: 6px;
            border-radius: 999px;
            background: linear-gradient(90deg, #ffd0d4, #f4a3aa);
        }
        .slider-block input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 17px;
            height: 17px;
            margin-top: -5.5px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid #e63946;
            box-shadow: 0 2px 6px rgba(230, 57, 70, 0.35);
        }
        .slider-block input[type="range"]::-moz-range-track {
            height: 6px;
            border-radius: 999px;
            background: #f4a3aa;
        }
        .slider-block input[type="range"]::-moz-range-thumb {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid #e63946;
        }
        .slider-note {
            font-size: 10px;
            font-weight: bold;
            color: #94a3b8;
            line-height: 1.45;
            word-break: keep-all;
        }
        .phase-meter {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 8px 10px;
            border-radius: 12px;
            background: rgba(230, 57, 70, 0.07);
            border: 1px solid rgba(230, 57, 70, 0.12);
        }
        .phase-meter .pm-top {
            display: flex;
            justify-content: space-between;
            font-size: 10.5px;
            font-weight: bold;
            color: #64748b;
        }
        .pm-track {
            height: 7px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
        }
        .pm-seg { height: 100%; }
        .pm-seg.a { background: #ffb020; }
        .pm-seg.v { background: #e63946; }
        .pm-seg.d { background: #9aa7b8; }

        /* ---------- 하단 안내 문구 ---------- */
        #boardHelp {
            position: fixed;
            left: 20px;
            bottom: 26px;
            z-index: 5;
            padding: 7px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.62);
            color: #7a8390;
            font-size: 11px;
            font-weight: bold;
            pointer-events: none;
            backdrop-filter: blur(10px);
        }

        /* ---------- 호버 툴팁 ---------- */
        #hover-tip {
            position: fixed;
            z-index: 200;
            padding: 5px 11px;
            border-radius: 10px;
            background: rgba(28, 28, 30, 0.88);
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.12s ease;
            white-space: nowrap;
        }
        #hover-tip.show { opacity: 1; }

        /* ---------- 모달 ---------- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 700;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(18, 22, 30, 0.36);
            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);
        }
        .modal-overlay.show { display: flex; }
        .modal-card {
            width: min(600px, 94vw);
            max-height: 84vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 20px 22px;
            display: flex;
            flex-direction: column;
            gap: 13px;
            border-radius: 22px;
        }
        .modal-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }
        .modal-title {
            font-size: 16px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            gap: 4px;
            line-height: 1.35;
        }
        .modal-badge {
            font-size: 10.5px;
            font-weight: bold;
            letter-spacing: 0.2px;
            color: #e63946;
        }
        .modal-close-btn {
            border: none;
            background: rgba(0, 0, 0, 0.06);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-family: inherit;
            font-size: 13px;
            color: inherit;
            cursor: pointer;
            flex: 0 0 auto;
        }
        .modal-body { display: flex; flex-direction: column; gap: 9px; }
        .info-item {
            padding: 11px 13px;
            border-radius: 13px;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        .info-title {
            font-size: 12.5px;
            font-weight: bold;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .info-desc {
            font-size: 12.5px;
            line-height: 1.62;
            color: #4a505c;
            font-weight: bold;
            word-break: keep-all;
        }
        .info-desc b { color: #d92b38; }
        .blood-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 7px;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 10.5px;
            font-weight: bold;
        }
        .blood-tag.art { background: rgba(230, 57, 70, 0.12); color: #cf2230; }
        .blood-tag.vein { background: rgba(29, 78, 216, 0.12); color: #1d4ed8; }
        .blood-tag.mix { background: rgba(120, 120, 128, 0.14); color: #5c6470; }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .dot.red { background: #e63946; }
        .dot.blue { background: #1d4ed8; }

        /* ---------- 다크 모드 ---------- */
        body.dark-mode { background-color: #0f1218; color: #f2f2f7; }
        body.dark-mode .glass-panel {
            background: rgba(30, 34, 42, 0.80);
            border-color: rgba(255, 255, 255, 0.10);
            color: #f2f2f7;
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.45);
        }
        body.dark-mode .back-btn,
        body.dark-mode .tag-badge,
        body.dark-mode .data-value,
        body.dark-mode .sub-panel-title { color: #f2f2f7; }
        body.dark-mode .icon-btn { background: rgba(38, 42, 52, 0.85); color: #f2f2f7; }
        body.dark-mode .data-label { color: #9aa3b2; }
        body.dark-mode .data-sep { background: rgba(255, 255, 255, 0.14); }
        body.dark-mode .mode-chip {
            background: rgba(52, 58, 70, 0.85);
            border-color: rgba(255, 255, 255, 0.10);
            color: #dbe2ee;
        }
        body.dark-mode .mode-chip.active { background: linear-gradient(135deg, #ff5d68, #e63946); color: #fff; }
        body.dark-mode .side-ctrl-panel .control-tab-btn,
        body.dark-mode .side-ctrl-panel .side-btn {
            background: rgba(52, 58, 70, 0.88) !important;
            color: #eef2f8 !important;
            border-color: rgba(255, 255, 255, 0.10) !important;
        }
        body.dark-mode .side-ctrl-panel .control-tab-btn.active {
            background: linear-gradient(135deg, #ff5d68, #e63946) !important;
            color: #fff !important;
        }
        body.dark-mode .slider-header { color: #b9c2d0; }
        body.dark-mode .slider-note { color: #8b95a5; }
        body.dark-mode .slider-block input[type="range"]::-webkit-slider-runnable-track {
            background: linear-gradient(90deg, #5a2b31, #7d3a42);
        }
        body.dark-mode .phase-meter { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.09); }
        body.dark-mode .phase-meter .pm-top { color: #9aa3b2; }
        body.dark-mode .pm-track { background: rgba(255, 255, 255, 0.12); }
        body.dark-mode .center-tooltip { color: #c3cbd8; }
        body.dark-mode #boardHelp { background: rgba(30, 34, 42, 0.7); color: #9aa3b2; }
        body.dark-mode .info-item { background: rgba(255, 255, 255, 0.06); border-color: rgba(255, 255, 255, 0.08); }
        body.dark-mode .info-desc { color: #c3cbd8; }
        body.dark-mode .info-desc b { color: #ff7a84; }
        body.dark-mode .modal-close-btn { background: rgba(255, 255, 255, 0.12); color: #f2f2f7; }
        body.dark-mode .sub-close { background: rgba(255, 255, 255, 0.12); color: #dbe2ee; }
        body.dark-mode .blood-tag.art { background: rgba(255, 93, 104, 0.18); color: #ff8f97; }
        body.dark-mode .blood-tag.vein { background: rgba(96, 140, 255, 0.18); color: #9db9ff; }

        /* ---------- 반응형 ---------- */
        @media (max-width: 900px) {
            .top-left-bar {
                top: max(8px, env(safe-area-inset-top));
                left: 8px;
                gap: 6px;
                right: 52px;
            }
            .back-btn { padding: 7px 11px; font-size: 12px; }
            .tag-badge { padding: 7px 11px; font-size: 12px; gap: 5px; }
            .tag-pill { font-size: 9px; padding: 1px 6px; }
            .top-right-bar {
                top: calc(max(8px, env(safe-area-inset-top)) + 40px);
                right: 8px;
                left: 8px;
            }
            .data-card { padding: 5px 10px; gap: 8px; border-radius: 14px; }
            .data-label { font-size: 8.5px; }
            .data-value { font-size: 11.5px; }
            .data-sep { height: 20px; }
            .center-tooltip { top: calc(max(8px, env(safe-area-inset-top)) + 86px); font-size: 10.5px; padding: 6px 12px; }
            #boardHelp { display: none; }
            .sub-panel { padding: 11px 13px !important; gap: 9px; }
            .slider-block { min-width: 0; }
            .modal-card { padding: 16px; gap: 10px; max-height: 86vh; }
            .modal-title { font-size: 14.5px; }
            .info-desc { font-size: 11.8px; }
            .info-title { font-size: 12px; }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            .top-left-bar { top: max(6px, env(safe-area-inset-top)); left: 6px; right: auto; }
            .back-btn, .tag-badge { padding: 5px 9px; font-size: 11px; }
            .tag-pill { display: none; }
            .top-right-bar { top: max(6px, env(safe-area-inset-top)); right: 6px; left: auto; }
            .data-card { padding: 4px 9px; gap: 7px; }
            .data-label { font-size: 8px; }
            .data-value { font-size: 10.5px; }
            .center-tooltip { top: calc(max(6px, env(safe-area-inset-top)) + 34px); font-size: 10px; padding: 4px 10px; }
            .sub-panel { max-height: 60vh; }
            .modal-card { max-height: 92vh; padding: 12px 14px; }
        }

        html.pseudo-fs .center-tooltip { display: none !important; }
        body.is-fullscreen #canvas-container { width: 100vw !important; height: 100vh !important; }
    </style>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preload" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff" as="font" type="font/woff" crossorigin>
    <link rel="stylesheet" href="../../common/qr-modal.css">
    <link rel="stylesheet" href="../../common/ui-layout.css">
    <style>
        /* 공통 레이아웃(ui-layout.css) 뒤에서 확정하는 색상 규칙 */
        body .side-ctrl-panel > .ctrl-grid > .control-tab-btn.active {
            background: linear-gradient(135deg, #ff5d68, #e63946) !important;
            border-color: #e63946 !important;
            color: #fff !important;
            box-shadow: 0 4px 14px rgba(230, 57, 70, 0.30) !important;
        }
        body .bottom-control-bar .control-tab-btn {
            color: #1c1c1e;
        }
        body.dark-mode .bottom-control-bar .control-tab-btn { color: #f2f2f7; }

        /* 가로 모드(높이 500px 이하) 컴팩트 배치 */
        @media (max-height: 500px) and (orientation: landscape) {
            body .side-ctrl-panel {
                right: 6px !important;
                bottom: 46px !important;
                width: 178px !important;
                max-height: calc(100vh - 54px) !important;
                padding: 6px !important;
                gap: 4px !important;
                border-radius: 14px !important;
            }
            body .side-ctrl-panel .panel-title {
                font-size: 9.5px !important;
                margin-bottom: 0 !important;
                padding-bottom: 2px !important;
            }
            body .side-ctrl-panel .ctrl-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 4px !important; }
            body .side-ctrl-panel .control-tab-btn {
                min-height: 36px !important;
                padding: 2px 1px !important;
                font-size: 9px !important;
                gap: 1px !important;
                border-radius: 10px !important;
            }
            body .side-ctrl-panel .control-tab-btn span:first-child { font-size: 12px !important; }
            .mode-grid { gap: 3px !important; }
            .mode-chip { font-size: 9px !important; padding: 4px 1px !important; border-radius: 8px !important; }
            .bottom-control-bar { bottom: 4px !important; padding: 3px 8px !important; }
            .bottom-control-bar .control-tab-btn { padding: 4px 10px !important; font-size: 10px !important; }
            .data-card { gap: 7px !important; padding: 4px 9px !important; }
            .data-label { font-size: 8px !important; }
            .data-value { font-size: 10.5px !important; }
            .center-tooltip { top: calc(max(6px, env(safe-area-inset-top)) + 38px) !important; font-size: 9.5px !important; padding: 3px 9px !important; }
            #boardHelp { display: none !important; }
        }

        /* 세로 모바일: 조절 패널을 조금 더 좁게 */
        @media (max-width: 480px) and (min-height: 501px) {
            body .side-ctrl-panel {
                width: min(202px, calc(100vw - 16px)) !important;
                padding: 7px !important;
                gap: 5px !important;
            }
            .mode-chip { font-size: 10px !important; padding: 5px 1px !important; }
            .center-tooltip { top: calc(max(8px, env(safe-area-inset-top)) + 106px) !important; }
        }
    </style>
</head>
<body>

    <!-- 3D 캔버스 -->
    <div id="canvas-container"></div>

    <!-- 좌측 상단 -->
    <div class="top-left-bar">

    <div id="boardHelp">드래그: 회전 · 두 손가락/휠: 확대 · 우클릭·Shift+드래그: 이동</div>

    <!-- 우측 조절 패널 -->

    <!-- 서브 패널: 심박·혈류 조절 -->

        </div>
        <div class="slider-block">
            <div class="slider-header"><span>혈류 속도</span><span id="speedVal">1.0×</span></div>
            <input type="range" id="speedSlider" min="30" max="200" step="5" value="100">
        </div>
        <div class="phase-meter">
            <div class="pm-top"><span>심장 주기</span><span id="pm-phase">이완기</span></div>
            <div class="pm-track">
                <div class="pm-seg a" style="width:10%;"></div>

        <div class="slider-note">심방 수축 → 심실 수축 → 이완기가 한 주기로 반복됩니다.</div>

    <!-- 하단 중앙 캡슐 -->
    <div class="glass-panel bottom-control-bar">

    <!-- 전체화면 -->
    <div class="bottom-right-bar">

    <!-- 호버 툴팁 -->

    <!-- 모달 -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="glass-panel modal-card">
            <div class="modal-header">
                <div class="modal-title">
                    <span id="modal-title">순환계</span>
                    <span class="modal-badge" id="modal-badge">심장과 혈액의 순환</span>
                </div>
                <button class="modal-close-btn" id="modal-close" aria-label="닫기">✕</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

<script>
        /* ============================================================
           순환계 3D — Three.js 씬 / 심장 구조 / 혈관 / 혈류 입자
           ============================================================ */

        /* ---------- 0. 기본 상수 ---------- */
        const HY = 1.15;                       // 심장 그룹 기준 높이
        const COL_ART  = 0xf0303e;             // 동맥혈(산소 풍부) 선홍색
        const COL_VEIN = 0x1d4ed8;             // 정맥혈(산소 부족) 짙은 파랑
        const COL_ART_CSS  = '#e63946';
        const COL_VEIN_CSS = '#1d4ed8';
        const C_MUSCLE = 0x8d333c;             // 심근
        const C_MUSCLE_D = 0x9c4a52;           // 단면 심근
        const C_VALVE = 0xffe6c8;              // 판막

        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const lerp = (a, b, t) => a + (b - a) * t;
        const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };

        /* ---------- 1. 렌더러 · 씬 · 카메라 ---------- */
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 200);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.localClippingEnabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.075;
        controls.rotateSpeed = 0.85;
        controls.zoomSpeed = 0.9;
        controls.minDistance = 3.4;
        controls.maxDistance = 24;
        controls.maxPolarAngle = Math.PI * 0.86;
        controls.minPolarAngle = 0.18;
        controls.enablePan = true;
        controls.target.set(0.05, 1.36, 0);

        /* 화면 비율에 맞춘 기본 시점 거리 */
        function baseDistance() {
            const a = window.innerWidth / window.innerHeight;
            let d = 8.7;
            if (a < 0.75) d = 10.0;
            else if (a < 1.05) d = 9.6;
            return d;
        }
        const HOME_POS = new THREE.Vector3();
        const HOME_TARGET = new THREE.Vector3(0.05, 1.36, 0);
        function setHome() {
            const d = baseDistance();
            HOME_POS.set(2.15, 2.35, d * 0.97);
            camera.position.copy(HOME_POS);
            controls.target.copy(HOME_TARGET);
            controls.update();
        }
        setHome();

        /* ---------- 2. 조명 ---------- */
        scene.add(new THREE.HemisphereLight(0xffffff, 0x9fb0c4, 0.42));
        scene.add(new THREE.AmbientLight(0xffffff, 0.10));

        const key = new THREE.DirectionalLight(0xffffff, 0.78);
        key.position.set(5.5, 9, 8);
        scene.add(key);

        const rim = new THREE.DirectionalLight(0xcfe0ff, 0.22);
        rim.position.set(-7, 4, -6);
        scene.add(rim);

        const fill = new THREE.DirectionalLight(0xffe6e0, 0.12);
        fill.position.set(-2, -4, 6);
        scene.add(fill);

        /* ---------- 3. 단면 클리핑 평면 ---------- */
        // z > 0 (관측자 쪽) 을 잘라낸다 → 심장 내부가 훤히 보이는 단면
        const CUT_PLANE = new THREE.Plane(new THREE.Vector3(0, 0, -1), 0.0);
        let crossSection = true;
        const clippedMats = [];      // 단면 ON/OFF 시 갱신할 재질
        const sectionFaces = [];     // 단면 절단면(두께) 메시

        function useClip(mat) {
            mat.clippingPlanes = crossSection ? [CUT_PLANE] : null;
            mat.clipShadows = false;
            clippedMats.push(mat);
            return mat;
        }

        /* ---------- 4. 공통 재질 ---------- */
        function muscleMaterial() {
            return useClip(new THREE.MeshStandardMaterial({
                color: C_MUSCLE, roughness: 0.52, metalness: 0.06,
                emissive: 0x3a0d12, emissiveIntensity: 0.22, side: THREE.DoubleSide
            }));
        }
        function sectionMaterial(hex) {
            return new THREE.MeshStandardMaterial({
                color: hex || C_MUSCLE_D, roughness: 0.86, metalness: 0.0,
                side: THREE.DoubleSide, emissive: 0x1e0508, emissiveIntensity: 0.05
            });
        }
        const poolTex = (function () {
            const c = document.createElement('canvas');
            c.width = c.height = 128;
            const g = c.getContext('2d');
            const grd = g.createRadialGradient(64, 56, 6, 64, 64, 76);
            grd.addColorStop(0, '#ffffff');
            grd.addColorStop(0.55, '#f0e6e6');
            grd.addColorStop(1, '#b9a6a6');
            g.fillStyle = grd;
            g.fillRect(0, 0, 128, 128);
            const t = new THREE.CanvasTexture(c);
            return t;
        })();
        function bloodFaceMaterial(hex) {
            return new THREE.MeshStandardMaterial({
                color: hex, roughness: 0.58, metalness: 0.0,
                emissive: hex, emissiveIntensity: 0.38, side: THREE.DoubleSide,
                map: poolTex
            });
        }
        function bloodMaterial(hex) {
            return useClip(new THREE.MeshStandardMaterial({
                color: hex, roughness: 0.34, metalness: 0.02,
                emissive: hex, emissiveIntensity: 0.52, side: THREE.BackSide,
                polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1
            }));
        }

        /* ---------- 5. 심장 ---------- */
        const heartGroup = new THREE.Group();
        heartGroup.position.set(0, HY, 0);
        heartGroup.scale.set(1.12, 1.12, 1.12);
        scene.add(heartGroup);

        const pickables = [];            // {mesh, info}
        const hittableMats = [];         // 호버 하이라이트용
        function registerPick(mesh, infoId) {
            mesh.userData.info = infoId;
            pickables.push(mesh);
        }

        /* 라테이션(회전체) 프로파일 → 형상 */
        function latheOf(profile, seg) {
            return new THREE.LatheGeometry(profile.map(p => new THREE.Vector2(p[0], p[1])), seg || 48);
        }
        /* 프로파일을 xy평면 단면 폴리곤으로 */
        function sectionOf(profile) {
            const sh = new THREE.Shape();
            profile.forEach((p, i) => { if (i === 0) sh.moveTo(p[0], p[1]); else sh.lineTo(p[0], p[1]); });
            for (let i = profile.length - 1; i >= 0; i--) sh.lineTo(-profile[i][0], profile[i][1]);
            return sh;
        }
        /* 심실: 혈액이 차는 속공간 프로파일 (위 → 아래 정점) */
        const RV_CAV = [[0, 0.10], [0.34, 0.06], [0.48, -0.04], [0.52, -0.30], [0.50, -0.60], [0.40, -0.88], [0.22, -1.05], [0, -1.15]];
        const LV_CAV = [[0, 0.10], [0.31, 0.06], [0.44, -0.04], [0.47, -0.36], [0.45, -0.68], [0.36, -0.94], [0.20, -1.13], [0, -1.26]];

        /* 벽 두께를 준 닫힌 회전체 프로파일 */
        function wallProfile(cav, t) {
            const outer = cav.map((p, i) => {
                if (p[0] < 1e-4 && i === 0) return [0, p[1] + t * 0.35];
                if (p[0] < 1e-4) return [0, p[1] - t * 0.85];
                return [p[0] + t, p[1]];
            });
            return outer.concat(cav.slice().reverse());
        }

        /* 심실 하나 생성 : 벽(근육) + 혈액 + 단면(두께) */
        function makeVentricle(cfg) {
            const g = new THREE.Group();
            g.position.set(cfg.x, cfg.y, cfg.z || 0);
            g.name = cfg.info;

            const wallProfilePts = wallProfile(cfg.cav, cfg.wall);
            const wall = new THREE.Mesh(latheOf(wallProfilePts, 56), muscleMaterial());
            g.add(wall);
            registerPick(wall, cfg.info);

            // 단면 두께(근육 절단면)
            const secShape = sectionOf(wallProfilePts);
            const face = new THREE.Mesh(new THREE.ShapeGeometry(secShape, 28), sectionMaterial(C_MUSCLE_D));
            face.position.z = -0.006;
            face.userData.shared = true;
            g.add(face);
            sectionFaces.push(face);

            const outlinePts = secShape.getPoints(40).map(p2 => new THREE.Vector3(p2.x, p2.y, -0.004));
            const outline = new THREE.LineLoop(
                new THREE.BufferGeometry().setFromPoints(outlinePts),
                new THREE.LineBasicMaterial({ color: 0x4a1418, transparent: true, opacity: 0.75 })
            );
            g.add(outline);
            sectionFaces.push(outline);

            // 혈액(속공간 안쪽면)
            const blood = new THREE.Mesh(latheOf(cfg.cav, 56), bloodMaterial(cfg.blood));
            g.add(blood);
            registerPick(blood, cfg.info);

            // 단면의 혈액면(평평한 혈액층)
            const pool = new THREE.Mesh(new THREE.ShapeGeometry(sectionOf(cfg.cav), 20), bloodFaceMaterial(cfg.blood));
            pool.position.z = -0.005;
            g.add(pool);
            sectionFaces.push(pool);
            registerPick(pool, cfg.info);

            hittableMats.push({ mesh: wall, mat: wall.material });

            // 박동용 기준값
            g.userData.base = { x: cfg.x, y: cfg.y, z: cfg.z || 0 };
            return g;
        }

        const rvGroup = makeVentricle({ x: -0.52, y: 0, z: 0, cav: RV_CAV, wall: 0.075, blood: COL_VEIN, info: 'rv' });
        heartGroup.add(rvGroup);
        const lvGroup = makeVentricle({ x: 0.54, y: 0, z: 0, cav: LV_CAV, wall: 0.215, blood: COL_ART, info: 'lv' });
        heartGroup.add(lvGroup);

        /* 심방 하나 생성 : 벽(구) + 혈액 + 단면(고리) */
        function makeAtrium(cfg) {
            const g = new THREE.Group();
            g.position.set(cfg.x, cfg.y, 0);
            g.name = cfg.info;
            const R = cfg.R, t = cfg.t;

            const wall = new THREE.Mesh(new THREE.SphereGeometry(R, 44, 30), muscleMaterial());
            wall.scale.set(1.06, 1.0, 1.0);
            g.add(wall);
            registerPick(wall, cfg.info);

            const ring = new THREE.Mesh(new THREE.RingGeometry(R - t, R, 44, 1), sectionMaterial(C_MUSCLE_D));
            ring.position.z = -0.006;
            g.add(ring);
            sectionFaces.push(ring);

            [R - t, R].forEach(rr => {
                const pts = [];
                for (let i = 0; i <= 64; i++) {
                    const a = (i / 64) * Math.PI * 2;
                    pts.push(new THREE.Vector3(Math.cos(a) * rr * 1.06, Math.sin(a) * rr, -0.004));
                }
                const ol = new THREE.LineLoop(
                    new THREE.BufferGeometry().setFromPoints(pts),
                    new THREE.LineBasicMaterial({ color: 0x4a1418, transparent: true, opacity: 0.75 })
                );
                g.add(ol);
                sectionFaces.push(ol);
            });

            const blood = new THREE.Mesh(new THREE.SphereGeometry(R - t, 40, 26), bloodMaterial(cfg.blood));
            blood.scale.set(1.06, 1, 1);
            g.add(blood);
            registerPick(blood, cfg.info);

            const pool = new THREE.Mesh(new THREE.CircleGeometry(R - t, 48), bloodFaceMaterial(cfg.blood));
            pool.scale.set(1.06, 1, 1);
            pool.position.z = -0.005;
            g.add(pool);
            sectionFaces.push(pool);
            registerPick(pool, cfg.info);

            hittableMats.push({ mesh: wall, mat: wall.material });
            g.userData.base = { x: cfg.x, y: cfg.y, z: 0 };
            return g;
        }

        const raGroup = makeAtrium({ x: -0.72, y: 0.56, R: 0.44, t: 0.065, blood: COL_VEIN, info: 'ra' });
        heartGroup.add(raGroup);
        const laGroup = makeAtrium({ x: 0.72, y: 0.58, R: 0.40, t: 0.058, blood: COL_ART, info: 'la' });
        heartGroup.add(laGroup);

        /* ---------- 6. 판막 ---------- */
        const valves = [];
        function makeValve(cfg) {
            const g = new THREE.Group();
            g.position.set(cfg.x, cfg.y, cfg.z || 0);
            g.rotation.x = -Math.PI / 2;      // 고리를 수평으로

            const sleeve = new THREE.Mesh(
                new THREE.CylinderGeometry(cfg.r * 1.10, cfg.r * 1.02, 0.11, 36, 1, true),
                muscleMaterial()
            );
            sleeve.position.y = -0.02;
            g.add(sleeve);

            const ringMat = new THREE.MeshStandardMaterial({ color: 0xf0dbc2, roughness: 0.5, metalness: 0.08, emissive: 0x2a1a10, emissiveIntensity: 0.18, side: THREE.DoubleSide });
            const ring = new THREE.Mesh(new THREE.TorusGeometry(cfg.r, cfg.r * 0.055, 8, 40), ringMat);
            g.add(ring);

            const leafMat = new THREE.MeshStandardMaterial({
                color: 0xf6d9c4, roughness: 0.42, metalness: 0.02, side: THREE.DoubleSide,
                transparent: true, opacity: 0.88, emissive: 0x3a2415, emissiveIntensity: 0.14
            });

            const hinges = [];
            for (let i = 0; i < cfg.n; i++) {
                const arm = new THREE.Group();
                arm.rotation.z = (i * Math.PI * 2) / cfg.n;
                const hinge = new THREE.Group();
                arm.add(hinge);
                const leaf = new THREE.Mesh(
                    new THREE.CircleGeometry(cfg.r * 0.88, 10, 0.08, (Math.PI * 2) / cfg.n - 0.16),
                    leafMat
                );
                hinge.add(leaf);
                g.add(arm);
                hinges.push(hinge);
            }
            g.userData = { hinges: hinges, open: cfg.openSign, angle: 0 };
            g.traverse(o => { if (o.isMesh) registerPick(o, cfg.info); });
            valves.push(g);
            heartGroup.add(g);
            return g;
        }

        makeValve({ x: -0.60, y: 0.115, z: 0.055, r: 0.265, n: 3, openSign: -1, info: 'tricuspid' });   // 삼첨판
        makeValve({ x: 0.62, y: 0.16, z: 0.055, r: 0.24, n: 2, openSign: -1, info: 'mitral' });        // 이첨판
        makeValve({ x: -0.24, y: 0.155, z: 0.06, r: 0.135, n: 3, openSign: 1, info: 'pvalve' });     // 폐동맥판
        makeValve({ x: 0.20, y: 0.165, z: -0.02, r: 0.128, n: 3, openSign: 1, info: 'avalve' });     // 대동맥판

        /* ---------- 7. 혈관 ---------- */
        function vesselCurve(pts) {
            return new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(p[0], p[1], p[2])), false, 'catmullrom', 0.4);
        }
        function makeVessel(pts, radius, hex, info, segs) {
            const curve = vesselCurve(pts);
            const mat = new THREE.MeshStandardMaterial({
                color: hex, roughness: 0.34, metalness: 0.05,
                emissive: hex, emissiveIntensity: 0.16
            });
            const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, segs || 64, radius, 16, false), mat);
            mesh.userData.baseColor = new THREE.Color(hex);
            mesh.userData.baseEmissive = 0.16;
            if (info) registerPick(mesh, info);
            scene.add(mesh);
            return mesh;
        }

        const vesselMeshes = [];  // {mesh, circuit}
        function addVessel(mesh, circuit) { vesselMeshes.push({ mesh: mesh, circuit: circuit }); return mesh; }

        /* 폐동맥 (정맥혈) : 우심실 → 폐 */
        addVessel(makeVessel([
            [-0.24, 1.26, 0.06], [-0.28, 1.55, 0.10], [-0.30, 1.95, 0.02],
            [-0.28, 2.28, -0.18], [-0.06, 2.46, -0.34], [0.45, 2.56, -0.44],
            [1.05, 2.66, -0.52], [1.60, 2.85, -0.55]
        ], 0.092, COL_VEIN, 'pa', 70), 'pulmonary');

        /* ---------- 8. 폐 ---------- */
        const lungGroup = new THREE.Group();

        /* 폐 모세혈관 그물 (파랑 → 빨강) */
        function capillaryNet(opts) {
            const g = new THREE.Group();
            const n = opts.count;
            for (let i = 0; i < n; i++) {
                const t = i / (n - 1);
                const x0 = lerp(opts.a[0], opts.b[0], t);
                const y0 = lerp(opts.a[1], opts.b[1], t);
                const cx = x0 + (opts.jitter ? (Math.sin(i * 2.1) * opts.jitter) : 0);
                const pts = [];
                const steps = 5;
                for (let k = 0; k <= steps; k++) {
                    const u = k / steps;
                    const yy = lerp(y0 - opts.h, y0 + opts.h, u);
                    const xx = cx + Math.sin(u * Math.PI * 2 + i) * 0.045;
                    pts.push(new THREE.Vector3(xx, yy, opts.z + Math.cos(u * Math.PI + i) * 0.05));
                }
                const colorHex = t < 0.5 ? COL_VEIN : COL_ART;
                const mat = new THREE.MeshStandardMaterial({
                    color: colorHex, roughness: 0.4, emissive: colorHex, emissiveIntensity: 0.3,
                    transparent: true, opacity: 0.75
                });
                const curve = new THREE.CatmullRomCurve3(pts);
                const m = new THREE.Mesh(new THREE.TubeGeometry(curve, 18, opts.r || 0.017, 6, false), mat);
                g.add(m);
            }
            scene.add(g);
            return g;
        }

        /* ---------- 10. 혈류 입자 ---------- */

        const LOOP_PTS = [

        const LUT_N = 900;

        /* 제어점의 u(0~1) 찾기 */
        function uOfPoint(px, py, pz) {
            let best = 0, bd = Infinity;
            const v = new THREE.Vector3(px, py, pz);
            for (let i = 0; i < LUT_N; i++) {
                const d = LUT[i].distanceToSquared(v);
                if (d < bd) { bd = d; best = i; }
            }
            return best / (LUT_N - 1);
        }
        const U = {
            ra:      uOfPoint(-0.72, 1.74, 0.00),

        /* 구간 게이트 목록 (u 순서대로) */
        const SEGS = [
            { a: U.ra,      b: U.paValve, kind: 'inout' },   // 우심방 → 우심실
            { a: U.paValve, b: U.lungIn,  kind: 'out' },     // 우심실 → 폐동맥
            { a: U.lungIn,  b: U.lungOut, kind: 'lung' },    // 폐 모세혈관
            { a: U.lungOut, b: U.la,      kind: 'in' },      // 폐정맥 → 좌심방
            { a: U.la,      b: U.aoValve, kind: 'inout' },   // 좌심방 → 좌심실
            { a: U.aoValve, b: U.bodyIn,  kind: 'out' },     // 좌심실 → 대동맥
            { a: U.bodyIn,  b: U.bodyOut, kind: 'body' },    // 온몸 모세혈관
            { a: U.bodyOut, b: 1.0,       kind: 'in' },      // 대정맥 → 우심방
            { a: 0,         b: U.ra,      kind: 'in' }
        ];
        function kindAt(u) {
            for (let i = 0; i < SEGS.length; i++) {
                if (u >= SEGS[i].a && u <= SEGS[i].b) return SEGS[i].kind;
            }
            return 'in';
        }

        /* 색상 타임라인 : u → 색 */
        const cArt = new THREE.Color(COL_ART);
        const cVein = new THREE.Color(COL_VEIN);
        const _tmpC = new THREE.Color();
        function colorAt(u) {
            // 폐에서 정맥혈 → 동맥혈
            if (u >= U.lungIn && u <= U.lungOut) {
                const t = smooth((u - U.lungIn) / Math.max(0.001, U.lungOut - U.lungIn));
                return _tmpC.copy(cVein).lerp(cArt, t);
            }
            // 온몸에서 동맥혈 → 정맥혈
            if (u >= U.bodyIn && u <= U.bodyOut) {
                const t = smooth((u - U.bodyIn) / Math.max(0.001, U.bodyOut - U.bodyIn));
                return _tmpC.copy(cArt).lerp(cVein, t);
            }
            // 그 사이 구간 판정
            const afterLung = (u > U.lungOut && u < U.bodyIn);
            return afterLung ? _tmpC.copy(cArt) : _tmpC.copy(cVein);
        }
        for (let i = 0; i < LUT_N; i++) LUT_C.push(colorAt(LUT_U[i]).clone());

        /* 입자 버퍼 */
        const P_COUNT = 260;
        const pGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(P_COUNT * 3);
        const pCol = new Float32Array(P_COUNT * 3);

        pGeo.setAttribute('aSize', new THREE.BufferAttribute(pSize, 1));
        pGeo.setAttribute('aAlpha', new THREE.BufferAttribute(pAlpha, 1));

        const pMat = new THREE.ShaderMaterial({
            uniforms: { uScale: { value: 1.0 }, uOpacity: { value: 1.0 } },
            vertexShader: [
                'attribute float aSize;',
                'attribute vec3 aColor;',
                'attribute float aAlpha;',
                'uniform float uScale;',
                'varying vec3 vColor;',
                'varying float vAlpha;',
                'void main() {',
                '  vColor = aColor;',
                '  vAlpha = aAlpha;',
                '  vec4 mv = modelViewMatrix * vec4(position, 1.0);',
                '  gl_PointSize = aSize * uScale * (300.0 / max(0.001, -mv.z));',
                '  gl_Position = projectionMatrix * mv;',
                '}'
            ].join('\n'),
            fragmentShader: [
                'varying vec3 vColor;',
                'varying float vAlpha;',
                'uniform float uOpacity;',
                'void main() {',
                '  vec2 d = gl_PointCoord - vec2(0.5);',
                '  float r = length(d);',
                '  if (r > 0.5) discard;',
                '  float a = vAlpha * uOpacity * smoothstep(0.5, 0.26, r);',
                '  if (a < 0.01) discard;',
                '  gl_FragColor = vec4(vColor, a);',
                '}'
            ].join('\n'),

            depthWrite: false,

        });
        const particles = new THREE.Points(pGeo, pMat);
        particles.frustumCulled = false;
        scene.add(particles);

        const parts = [];
        for (let i = 0; i < P_COUNT; i++) {
            parts.push({
                u: i / P_COUNT + (Math.random() - 0.5) * 0.0016,
                sp: 0.85 + Math.random() * 0.35,
                size: 0.7 + Math.random() * 0.75,
                phase: Math.random() * Math.PI * 2
            });
        }

        /* 위치·색·크기 갱신 */
        function posAt(u) {
            let uu = u % 1;
            if (uu < 0) uu += 1;
            const f = uu * (LUT_N - 1);
            const i0 = Math.floor(f), i1 = Math.min(LUT_N - 1, i0 + 1);
            const t = f - i0;
            const a = LUT[i0], b = LUT[i1];
            _p3.set(lerp(a.x, b.x, t), lerp(a.y, b.y, t), lerp(a.z, b.z, t));
            return _p3;
        }
        const _p3 = new THREE.Vector3();

        function colorLUTAt(u) {
            let uu = u % 1;
            if (uu < 0) uu += 1;
            const f = uu * (LUT_N - 1);
            const i0 = Math.floor(f), i1 = Math.min(LUT_N - 1, i0 + 1);
            const t = f - i0;
            return _c3.copy(LUT_C[i0]).lerp(LUT_C[i1], t);
        }
        const _c3 = new THREE.Color();

        /* ---------- 11. 상태 ---------- */
        const state = {
            playing: true,
            bpm: 72,
            speed: 1.0,
            mode: 'all',
            labels: true,
            cross: true,
            dark: false,

        };

        /* ---------- 12. 3D 라벨 ---------- */
        const LABEL_FONT = '"SeoulNamsan", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif';
        const labelGroup = new THREE.Group();
        scene.add(labelGroup);
        const labels = [];

        function drawLabelSprite(L) {
            const c = L.canvas, ctx = c.getContext('2d');
            const fs = L.fs;
            ctx.clearRect(0, 0, c.width, c.height);
            const padX = 24, r = 26;
            const bg = L.dark ? 'rgba(32,36,44,0.88)' : 'rgba(255,255,255,0.92)';
            const brd = L.dark ? 'rgba(255,255,255,0.16)' : 'rgba(20,30,50,0.10)';
            ctx.fillStyle = bg;
            ctx.strokeStyle = brd;
            ctx.lineWidth = 2;
            const x = 3, y = 10, w = c.width - 6, h = c.height - 20;
            ctx.beginPath();
            if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); }
            else {
                ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = L.dark ? '#f2f5fa' : (L.color || '#1c1c1e');
            ctx.font = 'bold ' + fs + 'px ' + LABEL_FONT;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(L.text, c.width / 2, c.height / 2 - 1);
            if (L.sprite.material.map) L.sprite.material.map.needsUpdate = true;
        }

        function makeLabel(cfg) {
            const fs = cfg.fs || 46;
            const meas = document.createElement('canvas').getContext('2d');
            meas.font = 'bold ' + fs + 'px ' + LABEL_FONT;
            const tw = meas.measureText(cfg.t).width;
            const c = document.createElement('canvas');
            c.width = Math.ceil(tw + 54);
            c.height = Math.ceil(fs * 2.1);

            const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false, depthWrite: false }));

            const L = { text: cfg.t, color: cfg.color, fs: fs, canvas: c, sprite: spr, dark: state.dark, kind: cfg.k };

        }

        const LABEL_DEFS = [
            { t: '우심방', p: [-1.80, 2.10, 0.30], k: 'chamber', color: '#1d4ed8' },
            { t: '우심실', p: [-1.48, 0.70, 0.30], k: 'chamber', color: '#1d4ed8' },
            { t: '좌심방', p: [1.78, 2.06, 0.30], k: 'chamber', color: '#d42a37' },
            { t: '좌심실', p: [1.56, 0.66, 0.30], k: 'chamber', color: '#d42a37' },
            { t: '대동맥', p: [1.98, 2.74, 0.34], k: 'vessel', color: '#d42a37' },

        /* ---------- 13. 심박 사이클 ---------- */
        const ATRIAL_END = 0.10;
        const SYSTOLE_END = 0.42;
        function sysPulse(p) {
            const a = smooth((p - (ATRIAL_END - 0.012)) / 0.030);
            const b = smooth((SYSTOLE_END + 0.030 - p) / 0.030);
            return Math.min(a, b);
        }
        function atrPulse(p) {
            const a = smooth((p + 0.012) / 0.020);
            const b = smooth((ATRIAL_END + 0.012 - p) / 0.020);
            return Math.min(a, b);
        }
        const G = { in: 0.6, av: 0.6, out: 0.1, cap: 0.6 };
        function updateGates(p) {
            const sys = sysPulse(p), atr = atrPulse(p);
            G.in = 0.12 + 0.92 * (1 - sys);
            G.av = 0.55 * (1 - sys) + 1.15 * atr;
            G.out = 0.03 + 2.15 * sys;
            G.cap = 0.55;
        }
        function gateFor(kind) {
            if (kind === 'in') return G.in;
            if (kind === 'inout') return G.av;
            if (kind === 'out') return G.out;
            return G.cap;
        }

        /* ---------- 14. 심장 박동 애니메이션 ---------- */
        const bloodMeshes = pickables.filter(m => ['ra', 'rv', 'la', 'lv'].indexOf(m.userData.info) >= 0 && m.material.side === THREE.BackSide);
        bloodMeshes.forEach(m => { m.material.userData.baseEm = m.material.emissiveIntensity; });

        function updateHeart(p, dt) {
            const sys = sysPulse(p), atr = atrPulse(p);
            const aS = 1 - 0.060 * atr;
            const vS = 1 - 0.075 * sys;
            raGroup.scale.set(aS, aS, 1);
            laGroup.scale.set(aS, aS, 1);
            rvGroup.scale.set(vS, vS, 1);
            lvGroup.scale.set(vS, vS, 1);
            heartGroup.position.y = HY + 0.022 * sys;

            const k = 1 - Math.pow(0.0001, dt);
            valves.forEach(v => {
                const isAV = v.userData.open < 0;
                const target = isAV ? (1 - sys) * 0.95 : sys;
                v.userData.angle += (target - v.userData.angle) * k;
                v.userData.hinges.forEach(h => { h.rotation.x = v.userData.open * 1.18 * v.userData.angle; });
            });

            bloodMeshes.forEach(m => {
                const isV = (m.userData.info === 'rv' || m.userData.info === 'lv');
                const base = m.material.userData.baseEm || 0.3;
                m.material.emissiveIntensity = base + (isV ? 0.30 * sys : 0.22 * atr);
            });
        }

        /* ---------- 15. 혈류 입자 갱신 ---------- */
        const _tmpColor = new THREE.Color();
        function inPulmonary(u) {
            return (u >= U.ra - 0.02 && u <= U.la + 0.02);
        }
        function inHeartRange(u) {
            return (u >= U.ra - 0.03 && u <= U.paValve + 0.03) || (u >= U.la - 0.03 && u <= U.aoValve + 0.03);
        }
        function alphaFor(u) {
            const m = state.mode;
            if (m === 'heart') return inHeartRange(u) ? 1 : 0.10;
            if (m === 'systemic') return inPulmonary(u) ? 0.10 : 1;
            if (m === 'pulmonary') return inPulmonary(u) ? 1 : 0.10;
            return 1;
        }

        function updateParticles(dt) {
            const base = 0.105 * state.speed;
            for (let i = 0; i < P_COUNT; i++) {
                const pt = parts[i];
                const k = kindAt(pt.u);
                pt.u += base * gateFor(k) * pt.sp * dt;
                if (pt.u >= 1) pt.u -= 1;
                const pos = posAt(pt.u);
                pPos[i * 3] = pos.x;
                pPos[i * 3 + 1] = pos.y;
                pPos[i * 3 + 2] = pos.z;
                const c = colorLUTAt(pt.u);
                // 채널을 살짝 밝게
                pCol[i * 3] = Math.min(1, c.r * 1.12 + 0.06);
                pCol[i * 3 + 1] = Math.min(1, c.g * 1.12 + 0.04);
                pCol[i * 3 + 2] = Math.min(1, c.b * 1.12 + 0.04);
                pSize[i] = 0.135 * pt.size;
                pAlpha[i] = alphaFor(pt.u);
            }
            pGeo.attributes.position.needsUpdate = true;
            pGeo.attributes.aColor.needsUpdate = true;
            pGeo.attributes.aSize.needsUpdate = true;
            pGeo.attributes.aAlpha.needsUpdate = true;
        }

        /* ---------- 16. 단면 / 모드 / 라벨 표시 ---------- */
        function applyCrossSection() {
            clippedMats.forEach(m => {
                m.clippingPlanes = state.cross ? [CUT_PLANE] : null;
                m.needsUpdate = true;
            });
            sectionFaces.forEach(f => { f.visible = state.cross; });
        }

        const vesselBase = [];
        vesselMeshes.forEach(v => {
            const m = v.mesh.material;
            vesselBase.push({ mesh: v.mesh, op: m.opacity, em: m.emissiveIntensity, tr: m.transparent, dw: m.depthWrite });
        });
        const organBase = lungMats.map(o => ({ mat: o.mat, op: o.base, em: o.mat.emissiveIntensity }));

        function setDim(mesh, f) {
            const m = mesh.material;
            const b = vesselBase.find(v => v.mesh === mesh);
            if (!b) return;
            m.transparent = b.tr || f < 0.995;
            m.opacity = b.op * f;
            m.emissiveIntensity = b.em * f;
            m.depthWrite = f > 0.5 ? b.dw : false;
        }
        function setOrganDim(f) {
            organBase.forEach(o => {
                o.mat.opacity = o.op * f;
                o.mat.emissiveIntensity = o.em * f;
                o.mat.depthWrite = false;
            });
        }

        function applyMode(mode) {
            state.mode = mode;
            const pulmDim = (mode === 'systemic');
            const sysDim = (mode === 'pulmonary');
            const allDim = (mode === 'heart');

            vesselMeshes.forEach(v => {
                let f = 1;
                if (allDim) f = 0.16;
                else if (pulmDim && v.circuit === 'pulmonary') f = 0.14;
                else if (sysDim && v.circuit === 'systemic') f = 0.14;
                setDim(v.mesh, f);
            });

            setOrganDim(allDim ? 0.25 : (pulmDim ? 0.28 : (sysDim ? 0.28 : 1)));

            capEntries.forEach(e => {
                const dim = allDim || (pulmDim && e.circuit === 'pulmonary') || (sysDim && e.circuit === 'systemic');
                e.list.forEach(o => { o.mat.opacity = o.op * (dim ? 0.16 : 1); });
            });

            // 모드별 라벨
            labels.forEach((L, i) => {
                const def = LABEL_DEFS[i];
                if (!state.labels) { L.sprite.visible = false; return; }
                if (def.k === 'valve') { L.sprite.visible = false; return; }
                if (def.k === 'organ') { L.sprite.visible = !allDim; return; }
                if (def.k === 'chamber') { L.sprite.visible = true; return; }
                if (def.k === 'vessel') {
                    const pulm = (def.t === '폐동맥' || def.t === '폐정맥');
                    L.sprite.visible = allDim ? false : !((pulm && pulmDim) || (!pulm && sysDim));
                }
            });
        }

            if (fly.t >= 1) fly = null;

            if (!d) return;
            const tag = d.blood === 'art'
                ? '<span class="blood-tag art"><i class="dot red"></i>' + d.bloodText + '</span>'
                : d.blood === 'vein'
                    ? '<span class="blood-tag vein"><i class="dot blue"></i>' + d.bloodText + '</span>'
                    : '<span class="blood-tag mix">' + d.bloodText + '</span>';
            openModal(d.icon + ' ' + d.name, d.sub,
                '<div class="info-item"><div class="info-desc">' + d.desc + '</div>' + tag + '</div>');
        }

        $('btn-help').addEventListener('click', () => {
            openModal('💡 순환계의 원리', '심장 · 판막 · 두 개의 순환', [
                '<div class="info-item"><div class="info-title">🫀 심장은 두 개의 펌프</div>',
                '<div class="info-desc">심장은 <b>오른심장</b>(우심방·우심실)과 <b>왼심장</b>(좌심방·좌심실)으로 나뉩니다. 오른심장은 폐로, 왼심장은 온몸으로 피를 보냅니다. 그래서 심장은 하나이지만 <b>펌프 두 개</b>가 나란히 있는 셈입니다.</div></div>',
                '<div class="info-item"><div class="info-title">🚪 판막은 한 방향 문</div>',
                '<div class="info-desc">심방과 심실 사이의 <b>삼첨판·이첨판</b>, 심실과 동맥 사이의 <b>폐동맥판·대동맥판</b>이 있습니다. 심실이 수축할 때 심방 쪽 문이 닫혀 피가 거꾸로 흐르지 못합니다. 관찰해 보면 두 문은 <b>동시에 반대로</b> 움직입니다.</div></div>',
                '<div class="info-item"><div class="info-title">🔁 온몸순환 (대순환)</div>',
                '<div class="info-desc">좌심실 → 대동맥 → 온몸의 모세혈관 → 대정맥 → 우심방. 온몸에 <b>산소를 공급</b>하고 이산화탄소를 받아 옵니다.</div></div>',
                '<div class="info-item"><div class="info-title">🫁 폐순환 (소순환)</div>',
                '<div class="info-desc">우심실 → 폐동맥 → 폐 → 폐정맥 → 좌심방. 폐에서 <b>이산화탄소를 내보내고 산소를 받아</b> 옵니다.</div></div>',
                '<div class="info-item"><div class="info-title">🎨 동맥혈과 정맥혈의 색</div>',
                '<div class="info-desc"><b>동맥혈</b>은 산소가 많아 <span style="color:#d42a37;font-weight:bold">선홍색</span>, <b>정맥혈</b>은 산소가 적고 이산화탄소가 많아 <span style="color:#1d4ed8;font-weight:bold">짙은 파랑</span>으로 표시했습니다. 혈액은 모세혈관을 지날 때마다 색이 바뀝니다.</div></div>',
                '<div class="info-item"><div class="info-title">💓 심장 박동은 세 단계</div>',
                '<div class="info-desc"><b>심방 수축</b> → <b>심실 수축</b> → <b>이완기</b>가 반복됩니다. 심방이 피를 내려보내면 심실이 강하게 수축해 동맥으로 뿜고, 이완기에는 정맥에서 심방으로 피가 다시 채워집니다. 심박수를 바꾸면 이 주기가 빨라지거나 느려집니다.</div></div>',
                '<div class="info-item"><div class="info-title">💪 좌심실 벽이 두꺼운 이유</div>',
                '<div class="info-desc">좌심실은 온몸에 피를 밀어내야 해서 <b>우심실보다 벽이 약 3배 두껍습니다</b>. 단면으로 보면 두 심실의 벽 두께 차이를 바로 확인할 수 있습니다.</div></div>'
            ].join(''));
        });

        /* ---------- 20. 클릭 · 호버 ---------- */
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        const byInfo = {};
        pickables.forEach(m => {
            const id = m.userData.info;
            (byInfo[id] = byInfo[id] || []).push(m);
            if (!m.material.userData.baseEm) m.material.userData.baseEm = m.material.emissiveIntensity || 0;
        });

        function setHover(id) {
            Object.keys(byInfo).forEach(k => {
                byInfo[k].forEach(m => {
                    const mat = m.material;
                    if (!mat.userData.baseEm) mat.userData.baseEm = mat.emissiveIntensity || 0;
                    mat.emissiveIntensity = (k === id) ? mat.userData.baseEm + 0.55 : mat.userData.baseEm;
                });
            });
        }

        const hoverTip = $('hover-tip');
        let hoverId = null;
        let downPos = null;

        function pickAt(clientX, clientY) {
            pointer.x = (clientX / window.innerWidth) * 2 - 1;
            pointer.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            const hits = raycaster.intersectObjects(pickables, false);
            for (let i = 0; i < hits.length; i++) {
                const o = hits[i].object;
                if (o.userData && o.userData.info) return o.userData.info;
            }
            return null;
        }

        const canvasEl = renderer.domElement;
        canvasEl.addEventListener('pointerdown', e => { downPos = { x: e.clientX, y: e.clientY }; });
        canvasEl.addEventListener('pointermove', e => {
            const id = pickAt(e.clientX, e.clientY);
            if (id !== hoverId) {
                hoverId = id;
                setHover(id);
                canvasEl.style.cursor = id ? 'pointer' : 'grab';
            }
            if (id && INFO[id]) {
                hoverTip.textContent = INFO[id].name.split(' (')[0] + ' · 눌러서 설명 보기';
                hoverTip.classList.add('show');
                hoverTip.style.left = Math.min(window.innerWidth - 190, e.clientX + 16) + 'px';
                hoverTip.style.top = Math.max(8, e.clientY - 34) + 'px';
            } else {
                hoverTip.classList.remove('show');
            }
        });
        canvasEl.addEventListener('pointerleave', () => {
            hoverId = null;
            setHover(null);
            hoverTip.classList.remove('show');
        });
        canvasEl.addEventListener('pointerup', e => {
            if (!downPos) return;
            const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
            downPos = null;
            if (moved > 8) return;
            const id = pickAt(e.clientX, e.clientY);
            if (id) {
                openInfo(id);
                hoverTip.classList.remove('show');
            }
        });
        canvasEl.style.cursor = 'grab';

        /* ---------- 21. 리사이즈 · 모바일 시야각 ---------- */
        const BASE_FOV = 42;
        function resize() {
            const w = window.innerWidth, h = window.innerHeight;
            renderer.setSize(w, h);
            camera.aspect = w / h;
            let k = parseFloat(document.documentElement.getAttribute('data-mzoom'));
            if (isNaN(k)) k = 0.9;
            let f = 1;
            if (w < h) f = 1 + (1 - w / h) * k;
            else if (h <= 500) f = 1 + k * 0.18;
            camera.fov = Math.min(86, BASE_FOV * f);
            camera.updateProjectionMatrix();
        }
        window.addEventListener('resize', resize);
        window.addEventListener('orientationchange', () => setTimeout(resize, 260));
        resize();

        /* ---------- 22. 메인 루프 ---------- */
        const clock = new THREE.Clock();
        let lastPhaseName = '';
        let lastFlowName = '';
        const phaseEl = $('val-phase');
        const flowEl = $('val-flow');

        function updateReadout() {
            const p = state.phase;
            let name, flow, color;
            if (p < ATRIAL_END) {
                name = '심방 수축'; flow = '심방 → 심실'; color = '#ff9500';
            } else if (p < SYSTOLE_END) {
                name = '심실 수축'; flow = '대동맥·폐동맥 분출'; color = '#e63946';
            } else {
                name = '이완기'; flow = '정맥 → 심방'; color = '#8e8e93';
            }
            if (name !== lastPhaseName) {
                lastPhaseName = name;
                phaseEl.textContent = name;
                phaseEl.style.color = color;
                const pm = $('pm-phase');
                if (pm) pm.textContent = name;
            }
            if (flow !== lastFlowName) {
                lastFlowName = flow;
                flowEl.textContent = flow;
                flowEl.style.color = color;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(0.05, clock.getDelta());
            if (state.playing) {
                state.t += dt;
                const period = 60 / state.bpm;
                state.phase = (state.t % period) / period;
            }
            updateGates(state.phase);
            updateHeart(state.phase, dt);
            updateParticles(state.playing ? dt : 0);
            updateFly(dt);
            updateReadout();
            const camD = camera.position.distanceTo(controls.target);
            const showValves = state.labels && (camD < 8.4 || state.mode === 'heart');
            labels.forEach((L, i) => {
                if (LABEL_DEFS[i].k === 'valve') L.sprite.visible = showValves;
            });
            controls.update();
            renderer.render(scene, camera);
        }

        /* ---------- 23. 초기화 실행 ---------- */
        setBpm(72);
        setSpeed(1.0);
        applyCrossSection();
        applyMode('all');
        labelGroup.visible = true;
        updateParticles(0);
        animate();

        /* ---------- 24. 전체화면 / 몰입 모드 ---------- */
        (function () {
            const docEl = document.documentElement;
            const btn = document.getElementById('fullscreenBtn');
            const icon = document.getElementById('fullscreenIcon');
            const text = document.getElementById('fullscreenText');
            function realFs() {
                return !!(document.fullscreenElement || document.webkitFullscreenElement ||
                    document.mozFullScreenElement || document.msFullscreenElement);
            }
            function pseudo() { return docEl.classList.contains('pseudo-fs'); }
            function setUI() {
                const on = realFs() || pseudo();
                if (icon) icon.textContent = on ? '🗗' : '⛶';
                if (text) text.textContent = on ? '창모드' : '전체화면';
                if (btn) btn.setAttribute('aria-label', on ? '창모드로 전환' : '전체화면으로 전환');
                document.body.classList.toggle('is-fullscreen', on);
            }
            function toast(msg) {
                let t = document.getElementById('ux-toast');
                if (!t) {
                    t = document.createElement('div');
                    t.id = 'ux-toast';
                    t.style.cssText = 'position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);' +
                        'background:rgba(28,28,30,.88);color:#fff;font-size:12px;line-height:1.4;padding:9px 14px;border-radius:14px;' +
                        'z-index:9999;max-width:86vw;text-align:center;pointer-events:none;transition:opacity .3s;' +
                        'font-family:inherit;box-shadow:0 8px 24px rgba(0,0,0,.25)';
                    document.body.appendChild(t);
                }
                t.textContent = msg;
                t.style.opacity = '1';
                clearTimeout(t._t);
                t._t = setTimeout(function () { t.style.opacity = '0'; }, 2600);
            }
            if (btn) {
                btn.addEventListener('click', function () {
                    const wasReal = realFs(), wasPseudo = pseudo();
                    setTimeout(function () {
                        if (wasReal) { setUI(); return; }
                        if (wasPseudo) { docEl.classList.remove('pseudo-fs'); setUI(); return; }
                        if (!realFs()) {
                            docEl.classList.add('pseudo-fs');
                            try { window.scrollTo(0, 1); } catch (e) {}
                            toast('이 브라우저는 전체화면을 지원하지 않아 상단 정보를 숨긴 몰입 모드로 표시합니다');
                        }
                        setUI();
                    }, 380);
                }, false);
            }
            ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
                document.addEventListener(ev, function () { setUI(); setTimeout(resize, 120); });
            });
            setUI();
        })();
</script>
<script src="../../common/feedback.js" defer></script>
<script src="../../common/ui-layout.js" defer></script>
<script src="../../common/lib/qrcode.min.js" defer></script>
<script src="../../common/qr-modal.js" defer></script>
</body>
