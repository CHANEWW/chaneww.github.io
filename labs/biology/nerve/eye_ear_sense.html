.ctrl-row { display: flex; align-items: center; gap: 4px; }

}

/* ---------- 다크 모드 ---------- */

<script>
(function () {
    'use strict';

    var $ = function (id) { return document.getElementById(id); };
    function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
    function lerp(a, b, t) { return a + (b - a) * t; }

    var LIGHT_BG = 0xeef2f8;
    var DARK_BG = 0x0b1220;

    /* ============================================================
       상태
       ============================================================ */
    var state = {
        tab: 'eye',
        far: true,
        bright: true,
        vision: 'normal',
        glass: 'none',
        dark: false,
        yawTarget: 0,
        tiltTarget: 0,
        yaw: 0,
        tilt: 0,
        shake: 0,
        blurPct: 0,
        v: 1.85,
        flowH: 0,
        flowHv: 0,
        flowA: 0,
        flowAv: 0,
        flowP: 0,
        flowPv: 0,
        eyeObjZ: 6.2,
        pupil: 0.26
    };

    /* ============================================================
       Three.js
       ============================================================ */
    var container = $('canvas-container');
    var scene = new THREE.Scene();
    scene.background = new THREE.Color(LIGHT_BG);

    var camera = new THREE.PerspectiveCamera(45, window.innerWidth / Math.max(1, window.innerHeight), 0.1, 300);
    var renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    var controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enablePan = true;
    controls.screenSpacePanning = true;
    controls.minDistance = 1.8;
    controls.maxDistance = 22;
    controls.minPolarAngle = Math.PI * 0.08;
    controls.maxPolarAngle = Math.PI * 0.56;
    controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
    if (THREE.TOUCH) { controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN }; }

    var hemi = new THREE.HemisphereLight(0xffffff, 0xd9e3ee, 0.9);
    scene.add(hemi);
    var key = new THREE.DirectionalLight(0xffffff, 1.05);
    key.position.set(4, 9, 7);
    scene.add(key);
    var fill = new THREE.DirectionalLight(0xffffff, 0.32);
    fill.position.set(-6, 3, -4);
    scene.add(fill);

    function makeLabel(text, color, w) {
        var cv = document.createElement('canvas');
        cv.width = 512; cv.height = 128;
        var g = cv.getContext('2d');
        g.clearRect(0, 0, 512, 128);
        g.font = "bold 56px 'SeoulNamsan', -apple-system, sans-serif";
        g.textAlign = 'center';
        g.textBaseline = 'middle';
        var tw = Math.min(480, g.measureText(text).width + 40);
        var x0 = (512 - tw) / 2;
        g.fillStyle = 'rgba(255,255,255,0.93)';
        var r = 30;
        g.beginPath();
        g.moveTo(x0 + r, 20);
        g.lineTo(x0 + tw - r, 20);
        g.quadraticCurveTo(x0 + tw, 20, x0 + tw, 20 + r);
        g.lineTo(x0 + tw, 108 - r);
        g.quadraticCurveTo(x0 + tw, 108, x0 + tw - r, 108);
        g.lineTo(x0 + r, 108);
        g.quadraticCurveTo(x0, 108, x0, 108 - r);
        g.lineTo(x0, 20 + r);
        g.quadraticCurveTo(x0, 20, x0 + r, 20);
        g.closePath();
        g.fill();
        g.fillStyle = color;
        g.fillText(text, 256, 66);
        var tex = new THREE.CanvasTexture(cv);
        tex.minFilter = THREE.LinearFilter;
        var spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
        spr.scale.set(w, w * 0.25, 1);
        return spr;
    }

    /* ============================================================
       A. 눈 모형
       ============================================================ */
    var groupEye = new THREE.Group();
    scene.add(groupEye);

    var LZ = 0.35;                 // 수정체 위치
    var RETINA = { normal: 1.85, myopia: 1.97, hyperopia: 1.73 };
    var EYE_R = { normal: 1.60, myopia: 1.70, hyperopia: 1.50 };

    var scleraMat = new THREE.MeshPhysicalMaterial({
        color: 0xf2fbff, transparent: true, opacity: 0.16, roughness: 0.05, metalness: 0,

    sclera.position.set(0, 0, 0);
    groupEye.add(sclera);

    var irisGroup = new THREE.Group();
    var irisMat = new THREE.MeshStandardMaterial({ color: 0x6b4a2f, roughness: 0.5, metalness: 0.05, side: THREE.DoubleSide });
    var iris = new THREE.Mesh(new THREE.RingGeometry(0.26, 0.62, 44), irisMat);
    irisGroup.add(iris);
    var pupilMat = new THREE.MeshBasicMaterial({ color: 0x05070c });
    var pupil = new THREE.Mesh(new THREE.CircleGeometry(0.26, 40), pupilMat);
    pupil.position.z = -0.004;

    var corneaMat = new THREE.MeshPhysicalMaterial({ color: 0xd9f4ff, transparent: true, opacity: 0.28, roughness: 0.03, clearcoat: 1, depthWrite: false });
    var cornea = new THREE.Mesh(new THREE.SphereGeometry(0.66, 30, 20, 0, Math.PI * 2, 0, Math.PI * 0.42), corneaMat);
    cornea.rotation.x = Math.PI / 2;
    cornea.position.z = 0.02;
    irisGroup.add(cornea);
    irisGroup.position.set(0, 0, 1.28);
    groupEye.add(irisGroup);

    var lensMat = new THREE.MeshPhysicalMaterial({
        color: 0xa9e3ff, transparent: true, opacity: 0.55, roughness: 0.08, metalness: 0,
        clearcoat: 1, depthWrite: false
    });

    lensMesh.scale.set(0.40, 0.44, 0.15);
    lensMesh.position.set(0, 0, LZ);
    groupEye.add(lensMesh);

    /* 망막 (캔버스 텍스처) */
    var retinaCv = document.createElement('canvas');
    retinaCv.width = 256; retinaCv.height = 256;
    var retinaCtx = retinaCv.getContext('2d');
    var retinaTex = new THREE.CanvasTexture(retinaCv);
    var retinaMat = new THREE.MeshBasicMaterial({ map: retinaTex, transparent: true, side: THREE.DoubleSide });
    var retinaScreen = new THREE.Mesh(new THREE.CircleGeometry(0.62, 44), retinaMat);
    groupEye.add(retinaScreen);

    var retinaBack = new THREE.Mesh(
        new THREE.SphereGeometry(1, 32, 24),
        new THREE.MeshStandardMaterial({ color: 0xd98da0, roughness: 0.85, side: THREE.BackSide, transparent: true, opacity: 0.16, depthWrite: false })
    );
    groupEye.add(retinaBack);

    /* 결상점 */
    var focusDot = new THREE.Mesh(new THREE.SphereGeometry(0.045, 14, 10), new THREE.MeshBasicMaterial({ color: 0xffd166 }));
    groupEye.add(focusDot);
    var focusGlow = new THREE.PointLight(0xffd166, 0.9, 2.4);
    groupEye.add(focusGlow);

    /* 광선 */
    var rayMatA = new THREE.LineBasicMaterial({ color: 0xf59e0b, transparent: true, opacity: 0.95 });
    var rayMatB = new THREE.LineBasicMaterial({ color: 0xf97316, transparent: true, opacity: 0.75 });
    var rayMatC = new THREE.LineBasicMaterial({ color: 0xef4444, transparent: true, opacity: 0.45 });
    function makeRay(mat) {
        var geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(4 * 3), 3));
        var line = new THREE.Line(geo, mat);
        line.frustumCulled = false;
        groupEye.add(line);
        return line;
    }
    var ray1 = makeRay(rayMatA);
    var ray2 = makeRay(rayMatB);
    var ray0 = makeRay(rayMatC);

    /* 보는 대상(화살표) */
    var eyeObj = new THREE.Group();
    var arrowMat = new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.5 });
    var arrowBody = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.7, 12), arrowMat);
    arrowBody.position.y = 0.35;
    eyeObj.add(arrowBody);
    var arrowHead = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.3, 16), arrowMat);
    arrowHead.position.y = 0.85;
    eyeObj.add(arrowHead);
    var objLabel = makeLabel('보는 물체', '#1d4ed8', 1.35);
    objLabel.position.set(0, 1.25, 0);
    eyeObj.add(objLabel);
    groupEye.add(eyeObj);

    /* 안경 렌즈 */
    var glassMat = new THREE.MeshPhysicalMaterial({
        color: 0xbfe6ff, transparent: true, opacity: 0.30, roughness: 0.03, metalness: 0,
        clearcoat: 1, side: THREE.DoubleSide, depthWrite: false
    });
    var glassLens = new THREE.Mesh(new THREE.SphereGeometry(1, 28, 18), glassMat);
    glassLens.scale.set(0.52, 0.58, 0.09);
    // 안경은 각막 정점(최대 z≈2.08, 근시)보다 항상 바깥쪽에 둔다
    var GLASS_Z = 2.16;
    glassLens.position.set(0, 0, GLASS_Z);
    glassLens.visible = false;
    groupEye.add(glassLens);
    var glassLabelCv = makeLabel('오목렌즈', '#0284c7', 1.4);
    glassLabelCv.position.set(-0.06, -0.92, GLASS_Z - 0.02);

    var earShell = new THREE.Mesh(new THREE.TorusGeometry(0.26, 0.075, 10, 22, Math.PI * 1.55), skinMat);

    earShell.rotation.z = 0.5;
    headGroup.add(earShell);

    var innerEar = new THREE.Group();
    innerEar.position.set(0.38, 0.06, -0.06);

    var CANAL_R = 0.62;
    var canalMatH = new THREE.MeshPhysicalMaterial({
        color: 0x7cc4e8, transparent: true, opacity: 0.75, roughness: 0.15, clearcoat: 1, side: THREE.DoubleSide, depthWrite: false
    });
    var canalMatV = new THREE.MeshPhysicalMaterial({
        color: 0xeba7b8, transparent: true, opacity: 0.72, roughness: 0.15, clearcoat: 1, side: THREE.DoubleSide, depthWrite: false
    });

    var canals = [];
    function buildCanal(rotX, rotY, axis, mat) {
        var g = new THREE.Group();
        g.rotation.x = rotX;
        g.rotation.y = rotY;
        var tube = new THREE.Mesh(new THREE.TorusGeometry(CANAL_R, 0.1, 10, 56, Math.PI * 1.58), mat);
        g.add(tube);

        var parts = [];
        var pGeo = new THREE.SphereGeometry(0.026, 8, 6);
        var pMat = new THREE.MeshBasicMaterial({ color: 0x1d6fd8 });
        for (var i = 0; i < 24; i++) {
            var pt = new THREE.Mesh(pGeo, pMat);
            g.add(pt);
            parts.push({ mesh: pt, base: (i / 24) * Math.PI * 1.58 });
        }
        innerEar.add(g);
        canals.push({ group: g, axis: axis, particles: parts, flow: 0, vel: 0 });
        return g;
    }
    var cH = buildCanal(Math.PI / 2 - 0.22, 0, 'H', canalMatH);   // 수평반고리관
    cH.position.set(0, -0.12, 0);
    var cA = buildCanal(0.12, 0, 'A', canalMatV);                 // 수직반고리관(앞)
    cA.position.set(0, 0.04, -0.05);
    var cP = buildCanal(0.1, Math.PI / 2, 'P', canalMatV);        // 수직반고리관(뒤)
    cP.position.set(0, 0.02, 0.05);

    /* 전정기관 · 이석 */

    vestibule.position.set(0, -0.04, 0);

    var macula = new THREE.Mesh(new THREE.CircleGeometry(0.15, 24), new THREE.MeshStandardMaterial({ color: 0xf0a6b8, roughness: 0.7, side: THREE.DoubleSide }));
    macula.rotation.x = -Math.PI / 2;
    macula.position.set(0, -0.17, 0);

    var otoliths = [];
    var otGeo = new THREE.SphereGeometry(0.042, 10, 8);
    var otMat = new THREE.MeshStandardMaterial({ color: 0xf3c14b, roughness: 0.3, metalness: 0.3 });
    for (var oi = 0; oi < 7; oi++) {
        var o = new THREE.Mesh(otGeo, otMat);
        var ang = (oi / 7) * Math.PI * 2;
        var rr = 0.05 + (oi % 3) * 0.035;
        o.userData.base = new THREE.Vector3(Math.cos(ang) * rr, 0, Math.sin(ang) * rr);
        o.position.copy(o.userData.base);
        innerEar.add(o);
        otoliths.push(o);

    /* 달팽이관 */
    (function buildCochlea() {
        var pts = [];
        for (var i = 0; i <= 90; i++) {
            var t = i / 90;
            var ang = t * Math.PI * 3.6;
            var rad = 0.30 * (1 - t * 0.78);
            pts.push(new THREE.Vector3(Math.cos(ang) * rad, -0.06 - t * 0.14, Math.sin(ang) * rad + 0.4));
        }
        var curve = new THREE.CatmullRomCurve3(pts);
        var geo = new THREE.TubeGeometry(curve, 110, 0.055, 8, false);
        var cochlea = new THREE.Mesh(geo, new THREE.MeshPhysicalMaterial({
            color: 0xf6b26b, transparent: true, opacity: 0.8, roughness: 0.2, clearcoat: 1, depthWrite: false
        }));
        innerEar.add(cochlea);
    })();

    /* ============================================================
       카메라
       ============================================================ */
    var CAM_TARGET = new THREE.Vector3(0, 0.1, 0);
    function fitCamera() {
        var aspect = window.innerWidth / Math.max(1, window.innerHeight);
        var portrait = aspect < 1;
        var vfov = camera.fov * Math.PI / 180;
        var needW, needH;
        if (state.tab === 'eye') {
            CAM_TARGET.set(portrait ? 0 : 0.78, 0.05, 1.55);
            needW = portrait ? 7.8 : 9.8;
            needH = portrait ? 6.4 : 5.0;
        } else {
            CAM_TARGET.set(0.34, 0.1, 0.1);
            needW = portrait ? 5.2 : 5.6;
            needH = portrait ? 5.0 : 5.0;
        }
        var dW = (needW / 2) / (Math.tan(vfov / 2) * aspect);
        var dH = (needH / 2) / Math.tan(vfov / 2);
        var dist = Math.max(dW, dH);
        var mz = parseFloat(document.documentElement.getAttribute('data-mzoom')) || 1;
        dist = clamp(dist / mz, 1.8, 22);
        var dir = new THREE.Vector3(state.tab === 'eye' ? 0.88 : 0, state.tab === 'eye' ? 0.34 : 0.22, state.tab === 'eye' ? 0.72 : 1).normalize().multiplyScalar(dist);
        camera.position.copy(CAM_TARGET).add(dir);
        controls.target.copy(CAM_TARGET);
        controls.update();
    }
    window.svlFitCamera = fitCamera;

    /* ============================================================
       눈 계산 · 렌더
       ============================================================ */
    function retinaLen() { return RETINA[state.vision]; }
    function eyeRadius() { return EYE_R[state.vision]; }

    function optics() {
        var d = state.far ? 60 : 3.2;
        var rl = retinaLen();
        var pMin = 1 / 1.85;
        var pMax = 1 / 1.85 + 1 / 3.2;
        var pReq = 1 / d + 1 / rl;
        var pg = 0;
        if (state.glass === 'concave') pg = -0.0162;
        else if (state.glass === 'convex') pg = 0.0375;
        var pEye = clamp(pReq - pg, pMin, pMax);
        var pSys = pEye + pg;
        var denom = pSys - 1 / d;
        if (denom <= 0.0001) denom = 0.0001;
        var v = 1 / denom;
        var blur = Math.abs(v - rl);
        return { d: d, rl: rl, v: v, blur: blur, pMin: pMin, pMax: pMax, pEye: pEye, pg: pg };
    }

    function drawRetina(blurPx) {
        var w = retinaCv.width, h = retinaCv.height;
        retinaCtx.clearRect(0, 0, w, h);
        // 망막 바탕
        retinaCtx.fillStyle = 'rgba(214,122,146,0.35)';
        retinaCtx.beginPath();
        retinaCtx.arc(w / 2, h / 2, w / 2 - 2, 0, Math.PI * 2);
        retinaCtx.fill();

        // 상(화살표) — 초점이 맞으면 선명, 아니면 번짐
        retinaCtx.save();
        retinaCtx.translate(w / 2, h / 2);
        retinaCtx.strokeStyle = 'rgba(255,238,170,' + (blurPx > 40 ? 0.55 : 0.96) + ')';
        retinaCtx.fillStyle = retinaCtx.strokeStyle;
        retinaCtx.lineWidth = 8;
        retinaCtx.lineCap = 'round';
        if (blurPx > 1) {
            retinaCtx.shadowColor = 'rgba(255,238,170,0.9)';
            retinaCtx.shadowBlur = blurPx * 2.2;
        }
        retinaCtx.beginPath();
        retinaCtx.moveTo(0, 44);
        retinaCtx.lineTo(0, -30);
        retinaCtx.stroke();
        retinaCtx.beginPath();
        retinaCtx.moveTo(-20, -12);
        retinaCtx.lineTo(0, -40);
        retinaCtx.lineTo(20, -12);
        retinaCtx.stroke();
        retinaCtx.restore();
        retinaTex.needsUpdate = true;
    }

    function setRayPoints(line, pts) {
        var arr = line.geometry.attributes.position.array;
        for (var i = 0; i < 4; i++) {
            var p = pts[i] || pts[pts.length - 1];
            arr[i * 3] = p.x;
            arr[i * 3 + 1] = p.y;
            arr[i * 3 + 2] = p.z;
        }
        line.geometry.attributes.position.needsUpdate = true;
        line.geometry.computeBoundingSphere();
    }

    function updateEyeModel() {
        var o = optics();
        state.v = o.v;
        state.blurPct = clamp(o.blur * 640, 0, 100);

        var r = eyeRadius();
        sclera.scale.setScalar(r);
        var retinaZ = LZ - o.rl;
        retinaScreen.position.set(0, 0, retinaZ);
        retinaBack.scale.setScalar(r * 0.95);
        eyeLabel.position.set(0, -0.78, retinaZ + 0.1);

        // 동공 크기
        var pupilR = state.bright ? 0.20 : 0.44;
        state.pupil = pupilR;
        pupil.geometry.dispose();
        pupil.geometry = new THREE.CircleGeometry(pupilR, 40);
        var irisInner = pupilR + 0.02;
        iris.geometry.dispose();
        iris.geometry = new THREE.RingGeometry(irisInner, 0.62, 44);
        irisGroup.position.z = r * 0.80;
        irisGroup.scale.setScalar(r / 1.6 * 1.0);

        // 수정체 두께(가까운 곳 → 두꺼움)
        var accom = clamp((o.pEye - (1 / 1.85)) / (1 / 3.2), 0, 1);
        lensMesh.scale.set(0.40, 0.44, 0.13 + 0.06 * accom);

        // 대상 위치 (가까운 곳: 각막 앞끝 z≈1.96~2.08과 안경 앞면 z≈2.30 밖으로 확실히 떨어뜨림)
        var visZ = state.far ? 2.9 : 2.42;
        eyeObj.position.set(0, 0, visZ);
        var hObj = 1.0;

        // 안경
        var hasGlass = state.glass !== 'none';
        glassLens.visible = hasGlass;
        glassLabelCv.visible = state.glass === 'concave';
        glassLabelCx.visible = state.glass === 'convex';
        if (hasGlass) {
            glassLens.scale.set(0.52, 0.58, state.glass === 'concave' ? 0.05 : 0.14);
        }

        // 결상점
        var imgZ = LZ - o.v;
        focusDot.position.set(0, 0, imgZ);
        focusGlow.position.set(0, 0, imgZ);

        // 망막 상의 흐림 표현
        drawRetina(clamp(o.blur * 900, 1, 110));

        // 광선 3개
        var A = new THREE.Vector3(-0.32, 0, LZ);
        var B = new THREE.Vector3(0.32, 0, LZ);
        var tip = new THREE.Vector3(0, hObj, visZ);
        var I = new THREE.Vector3(0, 0, imgZ);

        function rayThrough(lensPt) {
            var dirZ = imgZ - lensPt.z;
            if (Math.abs(dirZ) < 0.0001) dirZ = -0.0001;
            var k = (retinaZ - imgZ) / dirZ;
            var hit = new THREE.Vector3(lensPt.x + (0 - lensPt.x) * k, 0, retinaZ);
            return hit;
        }
        setRayPoints(ray1, [tip, A, I, rayThrough(A)]);
        setRayPoints(ray2, [tip, B, I, rayThrough(B)]);
        setRayPoints(ray0, [tip, new THREE.Vector3(0, 0, LZ), new THREE.Vector3(0, 0, retinaZ), new THREE.Vector3(0, 0, retinaZ)]);

        if (document.body.classList.contains('tab-eye')) {
            $('valA').textContent = state.far ? '먼 곳' : '가까운 곳';
            $('valB').textContent = Math.round(state.blurPct) + ' %';
            $('valC').textContent = state.bright ? '작음' : '큼';
            $('blurPct').textContent = Math.round(state.blurPct) + ' %';
            $('blurBar').style.width = state.blurPct + '%';

            var name = $('sbName'), note = $('sbNote');
            if (state.blurPct < 12) {
                name.textContent = '또렷하게 보임';
                note.textContent = '망막에 정확히 상이 맺힘';
            } else {
                var where = o.v < o.rl ? '망막 앞' : '망막 뒤';
                name.textContent = '흐리게 보임';
                note.textContent = '상이 ' + where + '에 맺힘 · ' + Math.round(state.blurPct) + '%';
            }
        }
        return o;
    }

    /* ============================================================
       귀 계산 · 렌더
       ============================================================ */
    function updateEarModel(dt) {
        // 목표 회전으로 부드럽게 이동
        var ty = state.yawTarget + Math.sin(state.shake) * 26;
        var tt = state.tiltTarget;
        var prevYaw = state.yaw, prevTilt = state.tilt;
        state.yaw = lerp(state.yaw, ty, clamp(dt * 9, 0, 1));
        state.tilt = lerp(state.tilt, tt, clamp(dt * 9, 0, 1));

        var dYaw = (state.yaw - prevYaw) * Math.PI / 180;
        var dTilt = (state.tilt - prevTilt) * Math.PI / 180;

        headGroup.rotation.y = state.yaw * Math.PI / 180;
        headGroup.rotation.z = state.tilt * Math.PI / 180;

        // 림프액 흐름(관성)
        canals[0].vel -= dYaw * 20;     // 수평관: 좌우 회전
        canals[1].vel -= dTilt * 20;    // 수직관(앞): 기울임
        canals[2].vel -= dTilt * 20;    // 수직관(뒤)

        var maxFlow = 0;
        for (var c = 0; c < canals.length; c++) {
            var cn = canals[c];
            cn.vel += (-cn.flow * 16 - cn.vel * 5) * dt;
            cn.flow += cn.vel * dt;
            cn.flow = clamp(cn.flow, -0.7, 0.7);
            maxFlow = Math.max(maxFlow, Math.abs(cn.flow));
            for (var i = 0; i < cn.particles.length; i++) {
                var p = cn.particles[i];
                var a = p.base + cn.flow;
                p.mesh.position.set(Math.cos(a) * CANAL_R, Math.sin(a) * CANAL_R, 0);
            }
        }

        // 이석: 기울면 낮은 쪽으로 쏠림
        var gx = Math.sin(state.tilt * Math.PI / 180) * 0.13;
        var gz = 0;
        for (var k = 0; k < otoliths.length; k++) {
            var o = otoliths[k];
            var bx = o.userData.base.x + gx;
            var bz = o.userData.base.z + gz;
            o.position.x = lerp(o.position.x, bx, clamp(dt * 6, 0, 1));
            o.position.z = lerp(o.position.z, bz, clamp(dt * 6, 0, 1));
            o.position.y = -0.2 + Math.abs(gx) * 0.05;
        }

        var flowPct = clamp(maxFlow * 140, 0, 100);
        if (document.body.classList.contains('tab-ear')) {
            $('valA').textContent = Math.round(state.yaw) + '°';
            $('valB').textContent = Math.round(state.tilt) + '°';
            $('valC').textContent = Math.round(flowPct) + ' %';
            $('yawVal').textContent = Math.round(state.yaw) + '°';
            $('tiltVal').textContent = Math.round(state.tilt) + '°';

            var name = $('earName'), note = $('earNote');
            var held = Math.abs(state.yaw) > 6 || Math.abs(state.tilt) > 6;
            if (flowPct < 6) {
                if (held) {
                    name.textContent = '머리 고정';
                    note.textContent = '림프액은 멈추고 이석이 기울기를 감지합니다';
                } else {
                    name.textContent = '림프액 정지';
                    note.textContent = '머리를 움직이면 림프액이 흐릅니다';
                }
            } else if (Math.abs(dYaw) > Math.abs(dTilt) || Math.abs(state.yaw) > 20) {
                name.textContent = '수평반고리관 감지';
                note.textContent = '좌우 회전을 감지합니다';
            } else {
                name.textContent = '수직반고리관·이석 감지';
                note.textContent = '기울어진 방향을 감지합니다';
            }
        }
    }

    /* ============================================================
       탭 전환 · UI
       ============================================================ */
    function setTab(tab) {
        state.tab = tab;
        var isEye = tab === 'eye';
        groupEye.visible = isEye;
        groupEar.visible = !isEye;
        document.body.classList.toggle('tab-eye', isEye);
        document.body.classList.toggle('tab-ear', !isEye);
        $('tabEye').classList.toggle('active', isEye);
        $('tabEar').classList.toggle('active', !isEye);
        $('panelTitle').textContent = isEye ? '⚙️ 눈의 원근 조절' : '⚙️ 귀의 평형감각';
        $('lblA').textContent = isEye ? '대상 거리' : '머리 회전';
        $('lblB').textContent = isEye ? '흐림 정도' : '기울임';
        $('lblC').textContent = isEye ? '동공' : '림프액 흐름';
        $('valC').textContent = isEye ? (state.bright ? '작음' : '큼') : '0 %';
        if (isEye) {
            updateEyeModel();
            setHint('💡 먼 곳과 가까운 곳을 오가며 수정체 두께와 망막 상의 변화를 살펴보세요.');
        } else {
            setHint('💡 머리를 좌우로 돌리면 수평반고리관의 림프액이, 기울이면 이석이 움직입니다.');
        }
        fitCamera();
    }
    $('tabEye').addEventListener('click', function () { setTab('eye'); });
    $('tabEar').addEventListener('click', function () { setTab('ear'); });

    function setFar(far) {
        state.far = far;
        $('btnFar').classList.toggle('active', far);
        $('btnNear').classList.toggle('active', !far);
        updateEyeModel();
        setHint(far ? '🏔 먼 곳을 볼 때는 수정체가 얇아집니다.' : '📖 가까운 곳을 볼 때는 모양체근이 수축해 수정체가 두꺼워집니다.');
    }
    $('btnFar').addEventListener('click', function () { setFar(true); });
    $('btnNear').addEventListener('click', function () { setFar(false); });

    function setBright(b) {
        state.bright = b;
        $('btnBright').classList.toggle('active', b);
        $('btnDark').classList.toggle('active', !b);
        updateEyeModel();
        setHint(b ? '☀️ 밝을 때는 홍채가 동공을 좁힙니다.' : '🌑 어두울 때는 동공이 커져 더 많은 빛을 받아들입니다.');
    }
    $('btnBright').addEventListener('click', function () { setBright(true); });
    $('btnDark').addEventListener('click', function () { setBright(false); });

    function setVision(v) {
        state.vision = v;
        $('btnNormal').classList.toggle('active', v === 'normal');
        $('btnMyopia').classList.toggle('active', v === 'myopia');
        $('btnHyper').classList.toggle('active', v === 'hyperopia');
        updateEyeModel();
        if (v === 'myopia') setHint('👁 근시: 안구가 길어 상이 망막 앞에 맺힙니다. 먼 곳이 흐립니다.');
        else if (v === 'hyperopia') setHint('👁 원시: 안구가 짧아 상이 망막 뒤에 맺힙니다. 가까운 곳이 흐립니다.');
        else setHint('👁 정상 눈: 상이 망막 위에 정확히 맺힙니다.');
    }
    $('btnNormal').addEventListener('click', function () { setVision('normal'); });
    $('btnMyopia').addEventListener('click', function () { setVision('myopia'); });
    $('btnHyper').addEventListener('click', function () { setVision('hyperopia'); });

    function setGlass(g) {
        state.glass = g;
        $('btnNoGlass').classList.toggle('active', g === 'none');
        $('btnConcave').classList.toggle('active', g === 'concave');
        $('btnConvex').classList.toggle('active', g === 'convex');
        updateEyeModel();
        if (g === 'concave') setHint('🔍 오목렌즈: 빛을 퍼지게 해 근시의 결상점을 망막으로 옮깁니다.');
        else if (g === 'convex') setHint('🔍 볼록렌즈: 빛을 모아 원시의 결상점을 망막으로 옮깁니다.');
        else setHint('안경을 벗었습니다.');
    }

    $('btnConcave').addEventListener('click', function () { setGlass('concave'); });
    $('btnConvex').addEventListener('click', function () { setGlass('convex'); });

    $('yawRange').addEventListener('input', function (e) {

    $('tiltRange').addEventListener('input', function (e) {

        if (state.tab !== 'ear') setTab('ear');

    $('btnShake').addEventListener('click', function () {

        setHint('🔄 머리를 좌우로 흔들면 반고리관 속 림프액이 관성으로 뒤처지며 흐릅니다.');

    $('themeBtn').addEventListener('click', function () {

        fill.intensity = state.dark ? 0.16 : 0.32;
        $('themeBtn').textContent = state.dark ? '☀️' : '🌙';
        $('themeBtn').title = state.dark ? '주간 모드로 전환' : '야간 모드로 전환';
    });

    var hintTimer = null;
    function setHint(msg, keep) {
        var el = $('centerTooltip');
        el.textContent = msg;
        el.classList.remove('hidden');
        if (hintTimer) clearTimeout(hintTimer);
        if (!keep) hintTimer = setTimeout(function () { el.classList.add('hidden'); }, 7000);
    }

    function reset() {
        state.far = true;
        state.bright = true;
        state.vision = 'normal';
        state.glass = 'none';
        state.yawTarget = 0;
        state.tiltTarget = 0;
        state.yaw = 0;
        state.tilt = 0;
        state.shake = 0;
        for (var i = 0; i < canals.length; i++) { canals[i].flow = 0; canals[i].vel = 0; }
        $('yawRange').value = 0;
        $('tiltRange').value = 0;
        setFar(true);
        setBright(true);
        setVision('normal');
        setGlass('none');
        setHint(state.tab === 'eye' ? '💡 먼 곳과 가까운 곳을 오가며 수정체 두께와 망막 상의 변화를 살펴보세요.' : '💡 머리를 좌우로 돌리면 수평반고리관의 림프액이, 기울이면 이석이 움직입니다.', false);
    }
    $('btnReset').addEventListener('click', reset);
    $('btnAlign').addEventListener('click', fitCamera);

    window.addEventListener('resize', function () {
        camera.aspect = window.innerWidth / Math.max(1, window.innerHeight);
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        fitCamera();
    });

    /* ============================================================
       루프
       ============================================================ */
    var lastT = performance.now();
    function frame(now) {
        requestAnimationFrame(frame);
        var dt = Math.min((now - lastT) / 1000, 0.06);
        lastT = now;

        if (state.tab === 'eye') {
            // 수정체 미세 맥동
            var pulse = 1 + Math.sin(now * 0.0015) * 0.006;
            lensMesh.scale.x = 0.40 * pulse;
            lensMesh.scale.y = 0.44 * pulse;
        } else {
            if (state.shake > 0) {
                state.shake += dt * 7.2;
                if (state.shake > Math.PI * 2.6) state.shake = 0;
            }
            updateEarModel(dt);
        }
        controls.update();
        renderer.render(scene, camera);
    }

    /* ============================================================
       시작
       ============================================================ */
    setTab('eye');
    updateEyeModel();
    updateEarModel(0.016);
    requestAnimationFrame(frame);

    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () { fitCamera(); });
    }
})();
</script>
<script>
/* ============ 전체화면 / 창모드 + 모바일 화면 재조정 (공통) ============ */
(function () {
    'use strict';
    var docEl = document.documentElement;
    var btn = document.getElementById('fullscreenBtn');
    var icon = document.getElementById('fullscreenIcon');
    var text = document.getElementById('fullscreenText');
    var started = false;

    function realFs() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement ||
                  document.mozFullScreenElement || document.msFullscreenElement);
    }
    function pseudo() { return docEl.classList.contains('pseudo-fs'); }

    function toast(msg) {
        var t = document.getElementById('ux-toast');
        if (!t) {
            t = document.createElement('div');
            t.id = 'ux-toast';
            t.style.cssText = 'position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);' +
                'background:rgba(28,28,30,.88);color:#fff;font-size:12px;line-height:1.4;padding:9px 14px;border-radius:14px;' +
                'z-index:9999;max-width:86vw;text-align:center;pointer-events:none;transition:opacity .3s;' +
                'font-family:inherit;box-shadow:0 8px 24px rgba(0,0,0,.25)';
            document.body.appendChild(t);
        }
        t.textContent = msg;
        t.style.opacity = '1';
        clearTimeout(t._t);
        t._t = setTimeout(function () { t.style.opacity = '0'; }, 2600);
    }

    function setUI() {
        var on = realFs() || pseudo();
        if (icon) icon.textContent = on ? '\uD83D\uDDD7' : '\u26F6';
        if (text) text.textContent = on ? '창모드' : '전체화면';
        if (btn) {
            btn.setAttribute('aria-label', on ? '창모드로 전환' : '전체화면으로 전환');
            btn.title = on ? '창모드로 전환' : '전체화면으로 전환';
        }
        document.body.classList.toggle('is-fullscreen', on);
        setTimeout(function () {
            try { window.dispatchEvent(new Event('resize')); } catch (e) {}
            if (typeof window.svlFitCamera === 'function') window.svlFitCamera();
        }, 140);
        setTimeout(function () {
            try { window.dispatchEvent(new Event('resize')); } catch (e) {}
            if (typeof window.svlFitCamera === 'function') window.svlFitCamera();
        }, 420);
    }

    function onKey(e) {
        if (e.key !== 'Escape' && e.key !== 'Esc') return;
        if (pseudo() && !realFs()) { docEl.classList.remove('pseudo-fs'); setUI(); }
    }

    if (btn) {
        btn.addEventListener('click', function () {
            if (realFs()) {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                else if (document.msExitFullscreen) document.msExitFullscreen();
                return;
            }
            if (pseudo()) { docEl.classList.remove('pseudo-fs'); setUI(); return; }
            var req = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.msRequestFullscreen;
            if (req) {
                try {
                    var r = req.call(docEl);
                    if (r && typeof r.catch === 'function') r.catch(function () { docEl.classList.add('pseudo-fs'); setUI(); });
                } catch (err) {
                    docEl.classList.add('pseudo-fs');
                }
            } else {
                docEl.classList.add('pseudo-fs');
                try { window.scrollTo(0, 1); } catch (e) {}
                toast('이 브라우저는 전체화면을 지원하지 않아 상단 정보를 숨긴 몰입 모드로 표시합니다');
            }
            setUI();
        }, false);
    }

    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
        document.addEventListener(ev, setUI);
    });
    document.addEventListener('keydown', onKey);

    /* 회전·주소창 변화·전체화면 전환 후 3D 카메라/렌더러 재계산 */
    var rt = null;
    function refit() {
        clearTimeout(rt);
        rt = setTimeout(function () {
            try { window.dispatchEvent(new Event('resize')); } catch (e) {}
            if (typeof window.svlFitCamera === 'function') window.svlFitCamera();
        }, 240);
    }
    window.addEventListener('orientationchange', refit);
    window.addEventListener('pageshow', refit);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) refit(); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', refit);

    setUI();
    started = true;
})();

</script>
