<style>
@font-face {
    font-family: 'SeoulNamsan';
    src: local('SeoulNamsan M'), local('SeoulNamsanM'), local('서울남산체 M'),
         url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff') format('woff');
    font-weight: 400; font-style: normal; font-display: swap;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    font-family: 'SeoulNamsan', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: #eaf3ea; color: #1c1c1e; -webkit-user-select: none; user-select: none;
    transition: background-color 0.4s ease;
}
#canvas-container { position: absolute; inset: 0; z-index: 1; transition: filter 0.45s ease; }
#canvas-container canvas { display: block; touch-action: none; }
#eyeOverlay { position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: 0; transition: opacity 0.4s ease; }
body.mode-fly #eyeOverlay, body.mode-bee #eyeOverlay { opacity: 1; }

.glass-panel {
    background: rgba(255, 255, 255, 0.78);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.85);
    box-shadow: 0 8px 32px rgba(15, 23, 42, 0.08);
    border-radius: 18px;
    transition: background 0.3s ease, border-color 0.3s ease;
}
body.dark-mode .glass-panel {
    background: rgba(20, 26, 34, 0.82);
    border-color: rgba(255, 255, 255, 0.14);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
}

.top-left-bar { position: absolute; top: 16px; left: 20px; display: flex; align-items: center; gap: 10px; z-index: 10; }
.back-btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 9px 15px; border-radius: 999px;
    text-decoration: none; color: #1c1c1e; font-weight: bold; font-size: 13.5px; cursor: pointer;
    transition: transform 0.2s ease, background 0.2s ease; border: none; font-family: inherit; white-space: nowrap;
}
.back-btn:hover { transform: translateY(-1px); background: rgba(255, 255, 255, 0.95); }
body.dark-mode .back-btn { color: #f1f5f9; }
.tag-badge { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; font-weight: bold; font-size: 14px; white-space: nowrap; }
.tag-pill { background: rgba(0, 122, 255, 0.14); color: #007aff; font-size: 10px; padding: 2px 7px; border-radius: 999px; font-weight: 800; }
.qr-btn-icon { font-size: 14px; line-height: 1; }
.qr-btn-label { font-size: 12.5px; }

.top-right-bar { position: absolute; top: 16px; right: 20px; display: flex; align-items: center; gap: 10px; z-index: 10; }
.tr-util { display: flex; align-items: center; gap: 8px; }
.icon-btn {
    width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center;
    border-radius: 50%; cursor: pointer; font-size: 16px; padding: 0; line-height: 1; flex: 0 0 40px;
    border: none; color: #1c1c1e; font-family: inherit; transition: all 0.2s ease;
}
.icon-btn:hover { transform: translateY(-1px); background: rgba(255, 255, 255, 0.95); }
body.dark-mode .icon-btn { color: #e2e8f0; }
.data-card { display: inline-flex; align-items: center; gap: 14px; padding: 7px 16px; border-radius: 16px; }
.data-item { display: flex; flex-direction: column; align-items: center; line-height: 1.15; }
.data-label { font-size: 9.5px; color: #64748b; font-weight: bold; white-space: nowrap; }
.data-value { font-size: 13.5px; font-weight: 900; color: #0284c7; margin-top: 1px; font-variant-numeric: tabular-nums; white-space: nowrap; }
body.dark-mode .data-value { color: #38bdf8; }
.data-sep { width: 1px; height: 22px; background: rgba(0, 0, 0, 0.08); }
body.dark-mode .data-sep { background: rgba(255, 255, 255, 0.14); }

.center-tooltip {
    position: absolute; top: 84px; left: 46%; transform: translateX(-50%);
    padding: 8px 18px; border-radius: 16px; font-size: 11.5px; font-weight: bold; color: #334155;
    pointer-events: none; z-index: 10; white-space: normal; text-align: center; line-height: 1.5;
    max-width: min(660px, calc(100vw - 470px)); word-break: keep-all; transition: opacity 0.35s ease;
}
.center-tooltip.hidden { opacity: 0; }
body.dark-mode .center-tooltip { color: #cbd5e1; }

.bottom-ctrl-bar {
    position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; z-index: 40;
}
.action-btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 999px;
    border: 1px solid rgba(0, 0, 0, 0.08); background: rgba(255, 255, 255, 0.92); color: #1c1c1e;
    font-family: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; white-space: nowrap;
    transition: all 0.2s ease; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
}
body.dark-mode .action-btn { background: rgba(50, 50, 54, 0.92); color: #f2f2f7; border-color: rgba(255, 255, 255, 0.12); }

.bottom-right-bar { position: absolute; bottom: 22px; right: 20px; z-index: 45; }
.fullscreen-btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 999px;
    border: none; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 800; color: #1c1c1e; white-space: nowrap;
}
body.dark-mode .fullscreen-btn { color: #e2e8f0; }

.side-ctrl-panel {
    position: absolute; right: 20px; bottom: 76px; width: 232px; padding: 12px;
    display: flex; flex-direction: column; gap: 8px; z-index: 60; border-radius: 18px;
    max-height: calc(100vh - 150px);
}
.panel-title { font-size: 12px; font-weight: 800; color: #475569; text-align: center; padding-bottom: 6px; border-bottom: 1px solid rgba(0, 0, 0, 0.06); flex: 0 0 auto; }
body.dark-mode .panel-title { color: #94a3b8; border-bottom-color: rgba(255, 255, 255, 0.1); }
.panel-body { display: flex; flex-direction: column; gap: 7px; overflow-y: auto; min-height: 0; -webkit-overflow-scrolling: touch; }
.eye-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.eye-btn {
    display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 7px 2px; border-radius: 12px;
    border: 1px solid rgba(0, 0, 0, 0.08); background: rgba(255, 255, 255, 0.9); color: #334155;
    font-family: inherit; font-size: 10.5px; font-weight: 800; cursor: pointer; white-space: nowrap; transition: all 0.18s ease;
}
.eye-btn i { font-style: normal; font-size: 15px; line-height: 1.1; }
.eye-btn:hover { background: #fff; }
.eye-btn.active { background: #0f172a; border-color: #0f172a; color: #fff; }
body.dark-mode .eye-btn { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.14); color: #cbd5e1; }
body.dark-mode .eye-btn.active { background: #38bdf8; border-color: #38bdf8; color: #06263d; }
.eye-grid .eye-btn:last-child:nth-child(odd) { grid-column: 1 / -1; }
.slider-row { display: flex; flex-direction: column; gap: 3px; }
.slider-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.slider-name { font-size: 10px; font-weight: 800; color: #64748b; white-space: nowrap; }
.slider-val { font-size: 10.5px; font-weight: 900; color: #2563eb; font-variant-numeric: tabular-nums; white-space: nowrap; }
body.dark-mode .slider-name { color: #94a3b8; }
body.dark-mode .slider-val { color: #7dd3fc; }
input[type="range"].ctrl-slider { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 999px; background: #e2e8f0; outline: none; cursor: pointer; margin: 0; }
input[type="range"].ctrl-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: #3b82f6; cursor: pointer; box-shadow: 0 2px 6px rgba(59, 130, 246, 0.4); border: 2px solid #fff;
}
body.dark-mode input[type="range"].ctrl-slider { background: #334155; }
.sense-badge {
    display: flex; flex-direction: column; gap: 1px; padding: 7px 9px; border-radius: 12px;
    background: rgba(2, 132, 199, 0.09); border: 1px dashed rgba(2, 132, 199, 0.28);
    font-size: 10.5px; font-weight: 800; color: #0369a1; text-align: center;
}
.sense-badge .sb-note { font-size: 8.5px; font-weight: 700; opacity: 0.85; }
body.dark-mode .sense-badge { background: rgba(56, 189, 248, 0.12); border-color: rgba(56, 189, 248, 0.3); color: #7dd3fc; }
.btn-ghost {
    width: 100%; padding: 9px 8px; border-radius: 12px; border: 1px dashed rgba(37, 99, 235, 0.35);
    background: rgba(37, 99, 235, 0.07); color: #1d4ed8; font-family: inherit; font-size: 11.5px;
    font-weight: 800; cursor: pointer; white-space: nowrap;
}
body.dark-mode .btn-ghost { color: #93c5fd; border-color: rgba(147, 197, 253, 0.4); background: rgba(59, 130, 246, 0.14); }

.sub-panel {
    position: absolute; right: 264px; bottom: 76px; width: 322px; max-height: 74vh; overflow-y: auto;
    display: none; flex-direction: column; gap: 9px; padding: 13px 15px; border-radius: 18px; z-index: 55;
    -webkit-overflow-scrolling: touch;
}
.sub-panel.show { display: flex; }
.sub-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-bottom: 5px; border-bottom: 1px solid rgba(0, 0, 0, 0.06); }
.sub-panel-title { font-size: 12.5px; font-weight: 800; color: #1e293b; }
body.dark-mode .sub-panel-title { color: #e2e8f0; }
.sub-close { background: rgba(0, 0, 0, 0.06); border: none; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; font-size: 11px; font-weight: bold; color: #64748b; font-family: inherit; flex: 0 0 24px; }
body.dark-mode .sub-close { background: rgba(255, 255, 255, 0.12); color: #cbd5e1; }
.graph-canvas { width: 100%; height: 168px; display: block; border-radius: 12px; background: rgba(248, 250, 252, 0.92); }
body.dark-mode .graph-canvas { background: rgba(15, 23, 42, 0.55); }
.legend { display: flex; flex-wrap: wrap; gap: 9px; font-size: 9px; font-weight: 800; color: #64748b; }
body.dark-mode .legend { color: #94a3b8; }
.legend i { display: inline-block; width: 12px; height: 7px; border-radius: 3px; margin-right: 4px; vertical-align: middle; }
.data-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 10.5px; font-weight: 700; }
.data-row .dr-name { color: #64748b; white-space: nowrap; }
.data-row .dr-val { color: #0f172a; font-weight: 900; text-align: right; }
body.dark-mode .data-row .dr-name { color: #94a3b8; }
body.dark-mode .data-row .dr-val { color: #e2e8f0; }
.note { font-size: 9.5px; color: #7c8899; line-height: 1.5; }
body.dark-mode .note { color: #94a3b8; }
.hr { height: 1px; background: rgba(0, 0, 0, 0.06); }
body.dark-mode .hr { background: rgba(255, 255, 255, 0.1); }

#ux-toast {
    position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.9); color: #fff; font-size: 12.5px; font-weight: 800; line-height: 1.4;
    padding: 10px 16px; border-radius: 14px; z-index: 9999; max-width: 86vw; text-align: center;
    pointer-events: none; opacity: 0; transition: opacity 0.3s ease;
}
#ux-toast.show { opacity: 1; }

@media (max-width: 900px) {
    .top-left-bar { top: max(8px, env(safe-area-inset-top)) !important; left: 8px !important; right: 56px !important; gap: 6px !important; align-items: center !important; overflow: hidden; }
    .top-left-bar .back-btn, .top-left-bar > a { flex: 0 0 auto; padding: 6px 10px !important; font-size: 12px !important; gap: 4px !important; }
    .top-left-bar .tag-badge { flex: 0 1 auto; min-width: 0; padding: 6px 10px !important; font-size: 12px !important; }
    .top-left-bar .tag-badge > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
    .top-left-bar .qr-btn { display: none !important; }
    .top-right-bar { top: calc(max(8px, env(safe-area-inset-top)) + 44px) !important; left: 8px !important; right: 8px !important; gap: 6px !important; justify-content: flex-end !important; flex-wrap: nowrap !important; }
    .data-card { flex: 1 1 0%; min-width: 0; gap: 4px !important; padding: 6px 8px !important; justify-content: space-around !important; overflow: hidden; flex-direction: row !important; align-items: center !important; }
    .data-item { min-width: 0; flex-direction: column !important; align-items: center !important; gap: 0 !important; }
    .data-label { font-size: 9px !important; }
    .data-value { font-size: 12.5px !important; }
    .icon-btn { width: 34px !important; height: 34px !important; min-width: 34px; font-size: 15px !important; flex: 0 0 auto; }
    .bottom-right-bar { top: max(8px, env(safe-area-inset-top)) !important; bottom: auto !important; right: 8px !important; left: auto !important; z-index: 20; }
    .bottom-right-bar .fullscreen-btn { padding: 6px 9px !important; font-size: 14px !important; line-height: 1; }
    .bottom-right-bar #fullscreenText { display: none !important; }
    .center-tooltip { top: calc(max(8px, env(safe-area-inset-top)) + 148px) !important; left: 8px !important; right: 8px !important; transform: none !important; max-width: none !important; font-size: 10.5px !important; padding: 6px 11px !important; white-space: normal !important; line-height: 1.45; text-align: center; z-index: 15 !important; }
    .bottom-ctrl-bar { left: 8px !important; right: 8px !important; bottom: calc(6px + env(safe-area-inset-bottom)) !important; transform: none !important; width: auto !important; border-radius: 16px !important; padding: 6px !important; gap: 5px !important; justify-content: center !important; flex-wrap: nowrap !important; }
    .action-btn { font-size: 11.5px !important; padding: 7px 12px !important; }
    .side-ctrl-panel { right: 8px !important; bottom: calc(62px + env(safe-area-inset-bottom)) !important; width: 178px !important; padding: 9px !important; gap: 6px !important; max-height: calc(100vh - 200px) !important; }
    .panel-title { font-size: 10.5px !important; padding-bottom: 4px !important; }
    .eye-btn { font-size: 9.5px !important; padding: 6px 1px; }
    .eye-btn i { font-size: 13px; }
    .slider-name { font-size: 9px !important; }
    .slider-val { font-size: 9.5px !important; }
    .sense-badge { font-size: 9.5px; padding: 5px; }
    .sense-badge .sb-note { font-size: 8px; }
    .btn-ghost { padding: 7px 6px; font-size: 10.5px; }
    .sub-panel { left: 8px !important; right: 8px !important; bottom: calc(62px + env(safe-area-inset-bottom)) !important; width: auto !important; max-width: none !important; max-height: 42vh !important; padding: 11px 12px !important; gap: 7px !important; }
    .graph-canvas { height: 124px !important; }
    .data-row { font-size: 10px; }
    .legend { font-size: 8px; }
}
@media (max-width: 430px) { .tag-pill { display: none !important; } }
@media (max-height: 500px) and (orientation: landscape) {
    /* 가로 화면: 데이터 카드는 조절 패널과 겹치므로 숨기고 패널 값으로 확인 */
    .top-right-bar .data-card { display: none !important; }

    .top-left-bar { top: max(6px, env(safe-area-inset-top)) !important; left: 6px !important; max-width: 46vw; gap: 5px; }
    .top-left-bar .back-btn, .top-left-bar > a, .top-left-bar .tag-badge { padding: 4px 9px !important; font-size: 11px !important; height: 30px; }
    .tag-pill { display: none !important; }
    .top-right-bar { top: max(6px, env(safe-area-inset-top)) !important; right: 88px !important; left: auto !important; gap: 5px !important; }
    .data-card { padding: 4px 9px !important; gap: 9px !important; flex: 0 0 auto; }
    .data-label { font-size: 8.5px !important; }
    .data-value { font-size: 11.5px !important; }
    .icon-btn { width: 28px !important; height: 28px !important; min-width: 28px; font-size: 13px !important; }
    .bottom-right-bar { top: max(6px, env(safe-area-inset-top)) !important; bottom: auto !important; right: 6px !important; z-index: 20; }
    .bottom-right-bar .fullscreen-btn { padding: 4px 8px !important; font-size: 13px !important; }
    .bottom-right-bar #fullscreenText { display: none !important; }
    .center-tooltip { top: auto !important; bottom: 52px !important; left: 50% !important; right: auto !important; transform: translateX(-50%) !important; width: max-content !important; max-width: 44vw !important; font-size: 10px !important; padding: 4px 9px !important; }
    .side-ctrl-panel { top: 44px !important; right: 8px !important; bottom: auto !important; width: 198px !important; padding: 7px 9px !important; gap: 4px !important; max-height: calc(100vh - 56px) !important; }
    .panel-title { font-size: 10px !important; padding-bottom: 2px !important; }
    .eye-btn { font-size: 9px !important; padding: 4px 1px; }
    .eye-btn i { font-size: 11px; }
    .slider-name { font-size: 8.5px !important; }
    .slider-val { font-size: 9px !important; }
    .btn-ghost { padding: 5px 6px; font-size: 9.5px; }
    .bottom-ctrl-bar { left: 50% !important; right: auto !important; bottom: 4px !important; transform: translateX(-50%) !important; width: auto !important; max-width: calc(100vw - 12px); border-radius: 14px !important; padding: 4px 8px !important; gap: 3px !important; }
    .action-btn { font-size: 10px !important; padding: 4px 9px !important; }
    .sub-panel { left: 8px !important; right: auto !important; bottom: 40px !important; width: 240px !important; max-height: 54vh !important; padding: 8px 10px !important; gap: 5px !important; }
    .graph-canvas { height: 92px !important; }
    .data-row { font-size: 9px; }
    .note { display: none; }
}
html.pseudo-fs .top-left-bar .tag-badge,
html.pseudo-fs .center-tooltip { display: none !important; }
html.pseudo-fs .top-right-bar { display: flex !important; }
html.pseudo-fs #fullscreenBtn,
html.pseudo-fs .bottom-right-bar { display: flex !important; }
body.is-fullscreen #canvas-container { width: 100vw !important; height: 100vh !important; }

<body class="mode-human">
<div id="canvas-container"></div>
<canvas id="eyeOverlay"></canvas>

<div class="top-left-bar">
    <a href="../../../index.html" class="back-btn glass-panel" aria-label="메인 페이지로 이동" onclick="var r=document.referrer;if(history.length>1&&r&&r.indexOf(location.origin+'/')===0&&/(\/|index(_3d)?\.html)(\?|#|$)/.test(r)){history.back();return false;}"><span>⬅</span> 메인</a>
    <div class="tag-badge glass-panel">
        <span>동물 시야 체험기 3D</span>
        <span class="tag-pill">visionOS</span>
    </div>
    <button class="back-btn glass-panel qr-btn" id="qrBtn" type="button" title="QR 코드" aria-label="QR 코드 보기">
        <span class="qr-btn-icon" aria-hidden="true">📱</span><span class="qr-btn-label">QR code</span>
    </button>
</div>

<div class="top-right-bar">
    <div class="tr-util">
        <button class="icon-btn glass-panel svl-util" id="themeBtn" type="button" title="야간 모드 전환" aria-label="야간 모드 전환">🌙</button>
    </div>
    <div class="data-card glass-panel">
        <div class="data-item"><span class="data-label">지금 보는 눈</span><span class="data-value" id="dEye">사람</span></div>
        <div class="data-sep"></div>
        <div class="data-item"><span class="data-label">색 감각</span><span class="data-value" id="dColor">삼색각</span></div>
        <div class="data-sep"></div>
        <div class="data-item"><span class="data-label">파장</span><span class="data-value" id="dWave">전체</span></div>
    </div>
</div>

<div class="center-tooltip glass-panel" id="centerTooltip">👀 오른쪽에서 눈을 바꾸면 같은 꽃밭이 전혀 다르게 보입니다.</div>

<div class="bottom-ctrl-bar glass-panel">
    <button class="action-btn" id="btnReset" type="button" title="처음 상태로 되돌리기">🔄 초기화</button>
    <button class="action-btn" id="btnAlign" type="button" title="시점 정렬">🎥 시점정렬</button>
</div>

<div class="bottom-right-bar">
    <button class="fullscreen-btn glass-panel" id="fullscreenBtn" type="button" aria-label="전체화면으로 전환">
        <span id="fullscreenIcon">⛶</span><span id="fullscreenText">전체화면</span>

<script>
/* ============ 공통 3D 기반 (씬·카메라·조명·테마·반응형) ============ */
window.SVL = (function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var LIGHT_BG = 0xcfe6fb, DARK_BG = 0x0a1119;

    var container = $('canvas-container');
    var scene = new THREE.Scene();
    scene.background = new THREE.Color(LIGHT_BG);
    scene.fog = new THREE.Fog(LIGHT_BG, 16, 46);

    var camera = new THREE.PerspectiveCamera(52, window.innerWidth / Math.max(1, window.innerHeight), 0.05, 200);
    camera.position.set(2.2, 2.4, 7.4);

    var renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    var controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enablePan = false;
    controls.minDistance = 2.2;
    controls.maxDistance = 16;
    controls.minPolarAngle = Math.PI * 0.12;
    controls.maxPolarAngle = Math.PI * 0.56;
    controls.target.set(0, 0.95, 0);

    var fill = new THREE.DirectionalLight(0xd8ecff, 0.35);
    fill.position.set(-6, 4, -5);
    scene.add(fill);

    /* ---- 라벨 ---- */
    var labelList = [];
    var LAB_DPR = 2, LAB_H = 128, LAB_FONT = 54, LAB_PAD = 46, LAB_MAXW = 1536;
    function drawLabel(cv, text, color) {
        var g = cv.getContext('2d');
        var S = LAB_DPR, W = cv.width / S, H = cv.height / S;
        g.setTransform(S, 0, 0, S, 0, 0);
        g.clearRect(0, 0, W, H);
        g.font = 'bold ' + LAB_FONT + "px 'SeoulNamsan', -apple-system, sans-serif";
        g.textAlign = 'center'; g.textBaseline = 'middle';
        var tw = Math.min(W - 12, g.measureText(text).width + LAB_PAD);
        var x0 = (W - tw) / 2, r = 30;
        g.fillStyle = 'rgba(255,255,255,0.94)';
        g.beginPath();
        g.moveTo(x0 + r, 22); g.lineTo(x0 + tw - r, 22);
        g.quadraticCurveTo(x0 + tw, 22, x0 + tw, 22 + r);
        g.lineTo(x0 + tw, 106 - r);
        g.quadraticCurveTo(x0 + tw, 106, x0 + tw - r, 106);
        g.lineTo(x0 + r, 106);
        g.quadraticCurveTo(x0, 106, x0, 106 - r);
        g.lineTo(x0, 22 + r);
        g.quadraticCurveTo(x0, 22, x0 + r, 22);
        g.closePath(); g.fill();
        g.fillStyle = color || '#123';
        g.fillText(text, W / 2, 66);
    }
    function layoutLabel(spr) {
        var L = spr.userData.label;
        if (!L) return;
        var cv = L.cv, g = cv.getContext('2d');
        var f = (window.innerWidth < 900) ? 1.6 : 1;
        g.setTransform(LAB_DPR, 0, 0, LAB_DPR, 0, 0);
        g.font = 'bold ' + LAB_FONT + "px 'SeoulNamsan', -apple-system, sans-serif";
        var tw = g.measureText(L.text).width;
        var W = Math.max(LAB_FONT * 1.6 + LAB_PAD, Math.min(LAB_MAXW, tw + LAB_PAD + 14));
        var pw = Math.round(W * LAB_DPR), ph = Math.round(LAB_H * LAB_DPR);
        if (cv.width !== pw) cv.width = pw;
        if (cv.height !== ph) cv.height = ph;
        drawLabel(cv, L.text, L.color);
        if (L.tex) L.tex.needsUpdate = true;
        spr.scale.set(L.ww * (W / 512) * f, L.ww * 0.25 * f, 1);
    }
    function makeLabel(text, color, w) {
        var cv = document.createElement('canvas');
        cv.width = 512; cv.height = LAB_H;
        var tex = new THREE.CanvasTexture(cv);
        tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter; tex.generateMipmaps = false;
        var spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));

        spr.userData.label = { cv: cv, tex: tex, text: text, color: color, ww: ww };
        labelList.push(spr);
        layoutLabel(spr);
        return spr;
    }
    function relabelAll() { for (var i = 0; i < labelList.length; i++) layoutLabel(labelList[i]); }
    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () { setTimeout(relabelAll, 30); }).catch(function () { });
    }
    window.addEventListener('load', function () { setTimeout(relabelAll, 150); });

    /* ---- 힌트 ---- */
    var hintEl = $('centerTooltip');
    var hintTimer = null;
    function setHint(text, sticky) {
        if (!hintEl) return;
        hintEl.textContent = text;
        hintEl.classList.remove('hidden');
        if (hintTimer) clearTimeout(hintTimer);
        if (!hintTimer || !sticky) {
            if (hintTimer) clearTimeout(hintTimer);
            if (!sticky) hintTimer = setTimeout(function () { hintEl.classList.add('hidden'); }, 5600);
            else hintTimer = null;
        }
    }

    /* ---- 테마 ---- */
    var isDark = false;
    var themeCbs = [];
    function applyTheme() {
        document.body.classList.toggle('dark-mode', isDark);
        $('themeBtn').textContent = isDark ? '☀️' : '🌙';
        for (var i = 0; i < themeCbs.length; i++) { try { themeCbs[i](isDark); } catch (e) { } }
    }
    $('themeBtn').addEventListener('click', function () { isDark = !isDark; applyTheme(); });

    /* ---- 크기 ---- */
    var svlFit = null;
    function onResize() {
        renderer.setSize(window.innerWidth, window.innerHeight);
        camera.aspect = window.innerWidth / Math.max(1, window.innerHeight);
        camera.updateProjectionMatrix();
        if (typeof svlFit === 'function') svlFit();
    }
    window.addEventListener('resize', onResize);

    var hooks = { reset: null, align: null, fit: null };
    $('btnReset').addEventListener('click', function () { if (hooks.reset) hooks.reset(); });
    $('btnAlign').addEventListener('click', function () {
        if (hooks.align) hooks.align(); else if (hooks.fit) hooks.fit();
        setHint('🎥 시점을 정렬했습니다.', false);
    });

    var frameCbs = [];
    var last = performance.now();
    function frame(now) {
        requestAnimationFrame(frame);
        var dt = Math.min(0.06, (now - last) / 1000);
        last = now;
        for (var i = 0; i < frameCbs.length; i++) { try { frameCbs[i](dt, now); } catch (e) { } }
        controls.update();
        renderer.render(scene, camera);
    }
    requestAnimationFrame(frame);

    return {
        $: $, scene: scene, camera: camera, renderer: renderer, controls: controls,
        hemi: hemi, sun: sun, fill: fill,
        makeLabel: makeLabel, setHint: setHint, relabel: relabelAll,
        onTheme: function (fn) { themeCbs.push(fn); },
        onFrame: function (fn) { frameCbs.push(fn); },
        isDark: function () { return isDark; },
        hooks: hooks,
        setFit: function (fn) { hooks.fit = fn; svlFit = fn; },
        setReset: function (fn) { hooks.reset = fn; },
        setAlign: function (fn) { hooks.align = fn; }
    };
})();
</script>

        var w = ov.width = Math.floor(window.innerWidth * Math.min(2, window.devicePixelRatio || 1));
        var h = ov.height = Math.floor(window.innerHeight * Math.min(2, window.devicePixelRatio || 1));
        og.clearRect(0, 0, w, h);
        var mode = STATE.eye;
        if (mode !== 'bee' && mode !== 'fly') return;
        var R = (mode === 'bee') ? Math.max(16, w / 62) : Math.max(26, w / 34);
        var hexH = R * Math.sqrt(3);
        og.strokeStyle = (mode === 'bee') ? 'rgba(10,22,34,0.13)' : 'rgba(6,14,24,0.22)';
        og.lineWidth = Math.max(1, R * 0.04);
        for (var row = -1; row * hexH < h + hexH; row++) {
            for (var col = -1; col * R * 1.5 < w + R * 2; col++) {
                var cx = col * R * 1.5;
                var cy = row * hexH + (col % 2 ? hexH / 2 : 0);
                og.beginPath();
                for (var i = 0; i < 6; i++) {
                    var a = Math.PI / 180 * (60 * i - 30);
                    var px = cx + Math.cos(a) * R, py = cy + Math.sin(a) * R;
                    if (i === 0) og.moveTo(px, py); else og.lineTo(px, py);

                og.closePath();

        /* 가장자리 비네트 */

        var hsl = color.getHSL({});

        if (hsl.s < 0.18) return 0;                 /* 무채색 */
        if (h < 20 || h > 330) return 660;          /* 빨강 */

            b.classList.toggle('active', b.getAttribute('data-eye') === mode);
        });

        /* 재질 색 변환 */
        var wave = WAVES[STATE.wave];
        for (var i = 0; i < mats.length; i++) {
            var m = mats[i];
            var base = m.userData.base;

            if (mode === 'snake') {

                c = applyTransform(base, mode);

            /* 벌의 눈에는 꽃잎이 어둡게, UV 무늬가 도드라지게 보인다 */
            if (mode === 'bee' && m.userData.uvDim) c.multiplyScalar(0.24);
            /* 파장 필터: 그 파장을 반사하는 물체만 밝게 남긴다 */
            if (wave > 0 && mode !== 'snake') {
                var dw = domWave(base);
                var match = (dw === 0) ? 0.45 : Math.max(0, 1 - Math.abs(dw - wave) / 90);
                var k = 0.28 + 0.85 * match;

            }
            m.color.copy(c);
            /* 열화상은 스스로 빛나는 화면처럼 보여야 한다 */
            if (m.emissive) {

                    m.emissiveIntensity = 1.0;
                } else {

    /* ---------- 파장 스펙트럼 그래프 ---------- */
    function drawSpectrum() {
        var cv = $('specCanvas');
        var g = cv.getContext('2d');
        var W = cv.width, H = cv.height;
        var dark = S.isDark();
        g.clearRect(0, 0, W, H);
        var padL = 44, padR = 16, padT = 18, padB = 46;
        var x0 = padL, x1 = W - padR, y0 = padT, y1 = H - padB;
        var minW = 300, maxW = 950;
        function X(wl) { return x0 + (wl - minW) / (maxW - minW) * (x1 - x0); }
        function Y(v) { return y1 - v * (y1 - y0); }

        /* 가시광 띠 */
        var grad = g.createLinearGradient(X(380), 0, X(750), 0);
        grad.addColorStop(0, '#7b2ff7');
        grad.addColorStop(0.18, '#2b6cff');
        grad.addColorStop(0.38, '#00c2a8');
        grad.addColorStop(0.55, '#8ee02a');
        grad.addColorStop(0.72, '#ffd400');
        grad.addColorStop(0.87, '#ff8a00');
        grad.addColorStop(1, '#e01b1b');
        g.globalAlpha = 0.9;
        g.fillStyle = grad;
        g.fillRect(X(380), y1 + 8, X(750) - X(380), 12);
        g.globalAlpha = 1;
        /* 자외선·적외선 영역 */
        g.fillStyle = 'rgba(139,92,246,0.22)';
        g.fillRect(X(300), y1 + 8, X(380) - X(300), 12);
        g.fillStyle = 'rgba(239,68,68,0.22)';
        g.fillRect(X(750), y1 + 8, X(950) - X(750), 12);
        g.font = "700 10px 'SeoulNamsan', sans-serif";
        g.fillStyle = dark ? '#94a3b8' : '#64748b';
        g.textAlign = 'center';
        g.fillText('자외선', (X(300) + X(380)) / 2, y1 + 34);
        g.fillText('가시광선', (X(380) + X(750)) / 2, y1 + 34);
        g.fillText('적외선', (X(750) + X(950)) / 2, y1 + 34);

        /* 축 */
        g.strokeStyle = dark ? 'rgba(148,163,184,0.35)' : 'rgba(100,116,139,0.35)';
        g.lineWidth = 1;
        g.beginPath(); g.moveTo(x0, y1); g.lineTo(x1, y1); g.stroke();
        g.beginPath(); g.moveTo(x0, y0); g.lineTo(x0, y1); g.stroke();
        g.textAlign = 'right';
        g.fillStyle = dark ? '#94a3b8' : '#64748b';
        [0, 0.5, 1].forEach(function (v) {
            g.fillText(Math.round(v * 100) + '%', x0 - 6, Y(v) + 3);
        });

        /* 눈금 */
        g.textAlign = 'center';
        [300, 400, 500, 600, 700, 800, 900].forEach(function (wl) {
            g.fillStyle = dark ? '#64748b' : '#94a3b8';
            g.fillText(wl, X(wl), y1 + 46 - 12);
        });

        /* 원추세포 감도 곡선 */
        var eye = EYES[STATE.eye];
        eye.cones.forEach(function (cone, ci) {
            g.beginPath();
            var w = cone.wide || 62;
            for (var wl = minW; wl <= maxW; wl += 3) {
                var d = (wl - cone.l) / w;
                var v = Math.exp(-0.5 * d * d) * 0.95;
                if (v < 0.01) v = 0;
                var px = X(wl), py = Y(v);
                if (wl === minW) g.moveTo(px, py); else g.lineTo(px, py);
            }
            g.strokeStyle = cone.c;
            g.lineWidth = 2.4;
            g.stroke();
            g.lineTo(X(maxW), y1); g.lineTo(X(minW), y1); g.closePath();
            g.fillStyle = cone.c.replace(')', ',0.13)').replace('rgb', 'rgba');
            g.globalAlpha = 0.14;
            g.fillStyle = cone.c;
            g.fill();
            g.globalAlpha = 1;
            /* 이름표 */
            g.fillStyle = cone.c;
            g.textAlign = 'center';
            g.font = "800 10px 'SeoulNamsan', sans-serif";
            g.fillText(cone.n, X(cone.l), Y(0.99) - 4 - (ci % 2) * 13);
        });

        /* 필터 밴드 */
        var wave = (STATE.eye === 'snake') ? 0 : WAVES[STATE.wave];
        if (wave > 0) {
            g.fillStyle = 'rgba(14,165,233,0.22)';
            g.fillRect(X(wave - 25), y0, X(wave + 25) - X(wave - 25), y1 - y0);
            g.strokeStyle = 'rgba(14,165,233,0.9)';
            g.lineWidth = 1.4;
            g.beginPath(); g.moveTo(X(wave), y0); g.lineTo(X(wave), y1); g.stroke();
        }

        /* 범례 */
        $('legend').innerHTML = eye.cones.map(function (c) {
            return '<span><i style="background:' + c.c + '"></i>' + c.n + ' ' + c.l + ' nm</span>';
        }).join('') + (wave > 0 ? '<span><i style="background:#0ea5e9"></i>필터 ' + wave + ' nm</span>' : '');
    }

    function updateWaveLabel() {
        var wave = WAVES[STATE.wave];
        $('vWave').textContent = wave ? wave + ' nm' : '전체';
        $('dWave').textContent = wave ? wave + ' nm' : '전체';
    }

    /* ---------- 슬라이더 ---------- */
    $('rLight').addEventListener('input', function () {
        STATE.light = parseFloat(this.value) / 100;
        $('vLight').textContent = Math.round(STATE.light * 100) + ' %';
        applyEye(STATE.eye);
    });
    $('rTemp').addEventListener('input', function () {
        STATE.temp = parseFloat(this.value);
        $('vTemp').textContent = STATE.temp + ' ℃';
        if (STATE.eye === 'snake') applyEye(STATE.eye);
        else mouseHeat.material.opacity = 0;
    });
    $('rWave').addEventListener('input', function () {
        STATE.wave = parseInt(this.value, 10);
        updateWaveLabel();
        applyEye(STATE.eye);
    });

    document.querySelectorAll('[data-eye]').forEach(function (b) {
        b.addEventListener('click', function () { STATE.eye = b.getAttribute('data-eye'); applyEye(STATE.eye); });
    });

    $('btnGraph').addEventListener('click', function () {
        var p = $('graphPanel');
        p.classList.toggle('show');
        $('btnGraph').textContent = p.classList.contains('show') ? '📊 파장 감도 그래프 닫기' : '📊 파장 감도 그래프 보기';
        if (p.classList.contains('show')) drawSpectrum();
    });
    $('graphClose').addEventListener('click', function () {
        $('graphPanel').classList.remove('show');
        $('btnGraph').textContent = '📊 파장 감도 그래프 보기';
    });

    /* 테마가 바뀌면 장면 배경도 다시 계산 */
    S.onTheme(function (dark) {
        document.body.classList.toggle('dark-mode', dark);
        applyEye(STATE.eye);
    });

    /* ---------- 움직이는 벌 · 파리 잔상 ---------- */
    var t = 0;
    S.onFrame(function (dt) {
        t += dt;
        var R = 1.9;
        bee.position.set(Math.cos(t * 0.55) * R, 1.15 + Math.sin(t * 1.7) * 0.28, Math.sin(t * 0.75) * R + 0.6);
        bee.rotation.y = -t * 0.55 + Math.PI / 2;
        bee.visible = true;

        /* 파리 모드: 빠른 먹이의 잔상 */
        var showGhosts = (STATE.eye === 'fly');
        for (var i = 0; i < ghosts.length; i++) {
            ghosts[i].visible = showGhosts;
            if (showGhosts) {
                var back = -(i + 1) * 0.22;
                var tt = t - (i + 1) * 0.05;
                ghosts[i].position.set(Math.cos(tt * 0.55) * R, 1.15 + Math.sin(tt * 1.7) * 0.28, Math.sin(tt * 0.75) * R + 0.6);
                ghosts[i].material.opacity = 0.28 - i * 0.07;
            }
        }

        /* 꽃이 살짝 흔들린다 */
        for (var f = 0; f < flowers.length; f++) {
            flowers[f].rotation.z = Math.sin(t * 0.9 + f) * 0.02;
        }
    });

    /* ---------- 시점 ---------- */
    S.setAlign(function () {
        camera.position.copy(camWanted);
        controls.update();
    });
    S.setFit(function () { S.setAlign(); });
    S.setReset(function () {
        STATE.eye = 'human'; STATE.light = 1; STATE.temp = 24; STATE.wave = 0;
        $('rLight').value = 100; $('rTemp').value = 24; $('rWave').value = 0;
        $('vLight').textContent = '100 %'; $('vTemp').textContent = '24 ℃';
        $('graphPanel').classList.remove('show');
        $('btnGraph').textContent = '📊 파장 감도 그래프 보기';
        applyEye('human');
        camera.position.copy(camWanted);
        controls.update();
        S.setHint('🔄 사람의 눈으로 되돌렸습니다.', false);
    });

    /* ---------- 시작 ---------- */
    applyEye('human');
    if (window.innerWidth > 900) {
        $('graphPanel').classList.add('show');
        $('btnGraph').textContent = '📊 파장 감도 그래프 닫기';
    }
    setTimeout(drawSpectrum, 120);
    S.setHint('👀 오른쪽에서 눈을 바꾸면 같은 꽃밭이 전혀 다르게 보입니다.', true);

    /* 검증용 */
    window.__vision = {
        get state() {
            return {
                eye: STATE.eye, light: STATE.light, temp: STATE.temp, wave: WAVES[STATE.wave],
                uv: uvMarks.filter(function (g) { return g.visible; }).length,
                overlayAlpha: getComputedStyle($('eyeOverlay')).opacity,
                dEye: $('dEye').textContent, dColor: $('dColor').textContent,
                fov: camera.fov
            };
        },
        set: function (o) {
            if (o.eye) { STATE.eye = o.eye; applyEye(o.eye); }
            if (o.wave !== undefined) { STATE.wave = o.wave; $('rWave').value = o.wave; applyEye(STATE.eye); }
            if (o.temp !== undefined) { STATE.temp = o.temp; $('rTemp').value = o.temp; $('vTemp').textContent = o.temp + ' ℃'; applyEye(STATE.eye); }
            if (o.light !== undefined) { STATE.light = o.light; $('rLight').value = o.light * 100; applyEye(STATE.eye); }
        }
    };
})();
</script>
<script>
/* ============ 전체화면 / 창모드 (공통) ============ */
(function () {
    'use strict';
    var docEl = document.documentElement;
    var btn = document.getElementById('fullscreenBtn');
    var icon = document.getElementById('fullscreenIcon');
    var text = document.getElementById('fullscreenText');
    function realFs() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement ||
            document.mozFullScreenElement || document.msFullscreenElement);
    }
    function pseudo() { return docEl.classList.contains('pseudo-fs'); }
    function toast(msg) {
        var t = document.getElementById('ux-toast');
        if (!t) return;
        t.textContent = msg; t.classList.add('show');
        clearTimeout(t._t); t._t = setTimeout(function () { t.classList.remove('show'); }, 2600);
    }
    function setUI() {
        var on = realFs() || pseudo();
        if (icon) icon.textContent = on ? '🗗' : '⛶';
        if (text) text.textContent = on ? '창모드' : '전체화면';
        if (btn) btn.setAttribute('aria-label', on ? '창모드로 전환' : '전체화면으로 전환');
        document.body.classList.toggle('is-fullscreen', on);
        setTimeout(function () { try { window.dispatchEvent(new Event('resize')); } catch (e) { } }, 160);
    }
    function onKey(e) {
        if (e.key !== 'Escape' && e.key !== 'Esc') return;
        if (pseudo() && !realFs()) { docEl.classList.remove('pseudo-fs'); setUI(); }
    }
    if (btn) {
        btn.addEventListener('click', function () {
            if (realFs()) {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                else if (document.msExitFullscreen) document.msExitFullscreen();
                return;
            }
            if (pseudo()) { docEl.classList.remove('pseudo-fs'); setUI(); return; }
            var req = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.msRequestFullscreen;
            if (req) {
                try {
                    var r = req.call(docEl);
                    if (r && typeof r.catch === 'function') r.catch(function () { docEl.classList.add('pseudo-fs'); setUI(); });
                } catch (err) { docEl.classList.add('pseudo-fs'); }
            } else {
                docEl.classList.add('pseudo-fs');
                try { window.scrollTo(0, 1); } catch (e) { }
                toast('이 브라우저는 전체화면을 지원하지 않아 상단 정보를 숨긴 몰입 모드로 표시합니다');
            }
            setUI();
        }, false);
    }
    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
        document.addEventListener(ev, setUI);
    });
    document.addEventListener('keydown', onKey);
    var rt = null;
    function refit() {
        clearTimeout(rt);
        rt = setTimeout(function () { try { window.dispatchEvent(new Event('resize')); } catch (e) { } }, 240);
    }
    window.addEventListener('orientationchange', refit);
    window.addEventListener('pageshow', refit);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) refit(); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', refit);
    setUI();
})();
</script>
