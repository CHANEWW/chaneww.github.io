@font-face{font-family:'SeoulNamsan';src:local('SeoulNamsan M'),local('SeoulNamsanM'),local('서울남산체 M'),url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff') format('woff');font-weight:400;font-style:normal;font-display:swap}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
body,html{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:'SeoulNamsan',-apple-system,sans-serif;background:#bfe0f2;color:#f2f2f7;touch-action:none}
#canvas-container{width:100%;height:100%;position:absolute;top:0;left:0;z-index:1}
.glass-panel{background:rgba(15,28,45,.5);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.25);border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:10}
.top-left-bar{position:absolute;top:20px;left:20px;display:flex;align-items:center;gap:10px;z-index:10}
.back-btn{display:flex;align-items:center;gap:6px;padding:10px 18px;font-size:14px;font-weight:bold;color:#fff;text-decoration:none;cursor:pointer;transition:all .2s ease}
.tag-badge{display:flex;align-items:center;gap:8px;padding:10px 18px;font-size:14px;font-weight:bold}
.tag-pill{background:rgba(52,199,89,.3);color:#34c759;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:bold}
.top-right-bar{position:absolute;top:20px;right:20px;display:flex;align-items:center;gap:10px;z-index:10}
.data-card{display:flex;align-items:center;gap:16px;padding:10px 20px}
.data-item{display:flex;flex-direction:column;align-items:center}
.data-label{font-size:11px;color:rgba(255,255,255,.65);font-weight:bold}
.data-value{font-size:15px;font-weight:bold;color:#30d158}
.icon-btn{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;border:none;color:#fff;transition:all .2s}
.center-tooltip{position:absolute;top:85px;left:50%;transform:translateX(-50%);padding:8px 20px;font-size:13px;color:rgba(255,255,255,.92);border-radius:30px;pointer-events:none;z-index:5;white-space:nowrap}
.info-card{position:absolute;bottom:90px;left:50%;transform:translateX(-50%) translateY(30px);width:360px;max-width:92vw;padding:22px;display:flex;flex-direction:column;gap:12px;opacity:0;pointer-events:none;transition:all .4s cubic-bezier(.16,1,.3,1);z-index:20}
.info-card.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.info-header{display:flex;justify-content:space-between;align-items:center}
.info-title{font-size:20px;font-weight:bold;color:#fff;display:flex;align-items:center;gap:8px}
.habitat-badge{font-size:11px;padding:3px 8px;border-radius:8px;font-weight:bold;margin-right:18px}
.habitat-forest{background:rgba(52,199,89,.25);color:#30d158}
.habitat-river{background:rgba(10,132,255,.25);color:#64d2ff}
.info-desc{font-size:13.5px;line-height:1.5;color:rgba(255,255,255,.88)}
.info-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.info-tag{font-size:11px;background:rgba(255,255,255,.12);padding:4px 10px;border-radius:12px;color:rgba(255,255,255,.75)}
.close-btn{position:absolute;top:14px;right:16px;background:none;border:none;color:rgba(255,255,255,.6);font-size:18px;cursor:pointer}
.bottom-control-bar{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px 14px;z-index:10}
.control-tab-btn{display:flex;align-items:center;gap:6px;padding:10px 16px;border-radius:14px;border:none;background:transparent;color:#fff;font-size:13px;font-weight:bold;font-family:inherit;cursor:pointer;transition:all .2s}
.control-tab-btn:hover,.control-tab-btn.active{background:rgba(255,255,255,.2)}
.bottom-right-bar{position:absolute;bottom:24px;right:20px;z-index:10}
button.back-btn{font-family:inherit;border:none}
@media (max-width:700px){.center-tooltip{display:none}.tag-badge span:first-child{font-size:12px}.data-card{padding:8px 12px;gap:10px}.bottom-right-bar{bottom:16px;right:12px}}

<script>
/* ---------- 기본 씬 ---------- */
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe0f2);
scene.fog = new THREE.FogExp2(0xbfe0f2, 0.014);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 500);
camera.position.set(0, 10, 18);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI / 2 - 0.03; controls.minDistance = 2; controls.maxDistance = 45;
controls.target.set(0, 1, 0);

scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x5a7a4a, 0.65));
scene.add(new THREE.AmbientLight(0xffffff, 0.3));
const sun = new THREE.DirectionalLight(0xfff3dd, 1.0);
sun.position.set(12, 22, 10); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0005;
Object.assign(sun.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22, near: 1, far: 70 });
scene.add(sun);

/* ---------- 도우미 ---------- */
const R = (a, b) => a + Math.random() * (b - a);
const M = (c, r = .75) => new THREE.MeshStandardMaterial({ color: c, roughness: r });
const SPH = new THREE.SphereGeometry(1, 16, 12), CYL = new THREE.CylinderGeometry(1, 1, 1, 10), CON = new THREE.ConeGeometry(1, 1, 10);
function add(p, geo, mat, x, y, z, sx, sy, sz) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.scale.set(sx, sy, sz); m.castShadow = true; p.add(m); return m;
}
const sph = (p, m, x, y, z, rx, ry = rx, rz = rx) => add(p, SPH, m, x, y, z, rx, ry, rz);
const cyl = (p, m, x, y, z, r, h) => add(p, CYL, m, x, y, z, r, h, r);
const con = (p, m, x, y, z, r, h) => add(p, CON, m, x, y, z, r, h, r);
const BLK = M(0x111111, .3), WHT = M(0xf4f4f0, .6);
const eyes = (p, x, y, z, s) => [-1, 1].forEach(k => sph(p, BLK, k * x, y, z, s));

/* ---------- 지형 ---------- */
const terrain = new THREE.Group(); scene.add(terrain);
function box(w, h, d, x, y, z, color, rough = .9) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M(color, rough)); m.position.set(x, y, z); m.receiveShadow = true; terrain.add(m); return m;

    y0: 0, y1: 0, hd: R(0, 6.3), wait: R(0, 3), wp: 0, ph: R(0, 6.3), vel: 0, s: 1, anim: null, ff: 16 }, o);
  m.g.scale.setScalar(c.s * R(.93, 1.07));

  m.g.position.set(R(zone[0], zone[1]), R(c.y0, c.y1), R(zone[2], zone[3]));
  m.g.rotation.y = c.hd; m.g.userData.cid = creatures.length;

function step(c, dt, t) {
  let mv = false;
  const p = c.g.position;
  if (c.wait > 0) c.wait -= dt;
  else {
    const dx = c.tx - p.x, dz = c.tz - p.z, d = Math.hypot(dx, dz);
    if (d < .35) { c.wait = R(c.w0, c.w1); pick(c); }
    else {
      let df = Math.atan2(dx, dz) - c.hd; df = Math.atan2(Math.sin(df), Math.cos(df));
      const mt = c.turn * dt; c.hd += Math.max(-mt, Math.min(mt, df));
      if (Math.abs(df) < 1.0 || c.fly) {
        const sp = c.speed * (c.sf ? c.sf(t, c) : 1);
        p.x += Math.sin(c.hd) * sp * dt; p.z += Math.cos(c.hd) * sp * dt; c.vel = sp; mv = true;
      }
    }
  }
  c.g.rotation.y = c.hd;
  if (c.anim) c.anim(c, t, dt, mv);
}

        const res = req.call(document.documentElement);

            console.warn('전체화면 권한이 제한되어 있습니다:', err);

});
