<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>부력과 중력 평형 3D - visionOS / Apple HIG Style</title>
    <!-- Three.js 및 OrbitControls 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        @font-face {
            font-family: 'SeoulNamsanL';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanL.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'SeoulNamsanL', -apple-system, sans-serif;
            background-color: #f2f2f7;
            color: #1c1c1e;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Apple visionOS Glassmorphic UI */
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            z-index: 10;
        }

        /* 좌측 상단 헤더 */
        .top-left-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            color: #1c1c1e;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tag-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
        }

        .tag-pill {
            background: rgba(0, 122, 255, 0.15);
            color: #007aff;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
        }

        /* 우측 상단 실시간 데이터 표시 카드 */
        .top-right-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .data-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 20px;
        }

        .data-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .data-label {
            font-size: 11px;
            color: #8e8e93;
            font-weight: bold;
        }

        .data-value {
            font-size: 15px;
            font-weight: bold;
            color: #1c1c1e;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            transition: all 0.2s;
        }

        /* 중앙 안내 메세지 */
        .center-tooltip {
            position: absolute;
            top: 12%;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 18px;
            font-size: 13px;
            color: #8e8e93;
            border-radius: 30px;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.5s ease;
        }

        /* 하단 제어 바 */
        .bottom-control-bar {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            z-index: 10;
        }

        .control-tab-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 14px;
            min-width: 68px;
            border-radius: 14px;
            border: none;
            background: transparent;
            color: #1c1c1e;
            font-size: 12px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-tab-btn.active {
            background: #007aff;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }

        /* 서브 물리 설정 패널 */
        .sub-panel {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            padding: 20px;
            width: 320px;
            display: none;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }

        .sub-panel.show { display: flex; }

        .slider-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #007aff;
            cursor: pointer;
        }

        .checkbox-row {
            display: flex;
            justify-content: space-around;
            font-size: 13px;
            font-weight: bold;
            padding-top: 5px;
        }
        .checkbox-row label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        /* 다크 모드 */
        body.dark-mode {
            background-color: #121212;
            color: #f2f2f7;
        }

        body.dark-mode .glass-panel {
            background: rgba(30, 30, 30, 0.75);
            border-color: rgba(255, 255, 255, 0.15);
            color: #f2f2f7;
        }

        body.dark-mode .data-value, body.dark-mode .back-btn {
            color: #f2f2f7;
        }

        body.dark-mode .icon-btn {
            background: rgba(40, 40, 40, 0.75);
            color: #fff;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- 좌측 상단 헤더 -->
    <div class="top-left-bar">
        <a href="../index.html" class="glass-panel back-btn">
            <span>⬅</span> 메인
        </a>
        <div class="glass-panel tag-badge">
            <span>부력 3D</span>
            <span class="tag-pill">visionOS</span>
        </div>
    </div>

    <!-- 우측 상단 실시간 데이터 패널 (Fg, Fb 기호 제거 후 순수 명칭 적용) -->
    <div class="top-right-bar">
        <div class="glass-panel data-card">
            <div class="data-item">
                <span class="data-label">중력가속도</span>
                <span class="data-value" id="val-g" style="color:#ff3b30;">10.0 m/s²</span>
            </div>
            <div class="data-item">
                <span class="data-label">중력</span>
                <span class="data-value" id="val-fg" style="color:#e53935;">12.2 N</span>
            </div>
            <div class="data-item">
                <span class="data-label">부력</span>
                <span class="data-value" id="val-fb" style="color:#1e88e5;">12.2 N</span>
            </div>
            <div class="data-item">
                <span class="data-label">잠긴 깊이</span>
                <span class="data-value" id="val-depth" style="color:#34c759;">50.0 %</span>
            </div>
        </div>
        <button class="icon-btn glass-panel" id="theme-toggle">🌙</button>
    </div>

    <!-- 중앙 안내 툴팁 -->
    <div class="glass-panel center-tooltip" id="guide-tooltip">
        ⚓ 배를 마우스/터치로 잡아서 물속으로 깊이 넣어보세요
    </div>

    <!-- 물리 조절 서브 패널 -->
    <div class="glass-panel sub-panel" id="physics-panel">
        <div class="slider-row">
            <div class="slider-header">
                <span>중력가속도 (g)</span>
                <span id="txt-g">10.0 m/s²</span>
            </div>
            <input type="range" id="sld-g" min="0" max="10" step="0.1" value="10.0">
        </div>
        <div class="checkbox-row">
            <label><input type="checkbox" id="chk-gravity" checked> 🔴 중력 표시</label>
            <label><input type="checkbox" id="chk-buoyancy" checked> 🔵 부력 표시</label>
        </div>
    </div>

    <!-- 하단 제어 바 -->
    <div class="glass-panel bottom-control-bar">
        <button class="control-tab-btn" id="btn-toggle-physics">
            <span>⚙️</span>
            <span>물리 조절</span>
        </button>
        <button class="control-tab-btn" id="btn-reset">
            <span>🔄</span>
            <span>초기화</span>
        </button>
        <button class="control-tab-btn" id="btn-align">
            <span>📷</span>
            <span>시점정렬</span>
        </button>
    </div>

    <script>
        // --- 1. Three.js 기본 씬 & 카메라 & 렌더러 설정 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf2f2f7);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.8, 4.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.05;

        // --- 2. 조명 설정 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(3, 5, 3);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // --- 3. 바닥, 수조, 물 메쉬 생성 ---
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(20, 20),
            new THREE.MeshStandardMaterial({ color: 0xe5e5ea, roughness: 0.8 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -1.8;
        floor.receiveShadow = true;
        scene.add(floor);

        const gridHelper = new THREE.GridHelper(20, 20, 0xd1d1d6, 0xe5e5ea);
        gridHelper.position.y = -1.79;
        scene.add(gridHelper);

        // 투명 수조 박스
        const tankGeo = new THREE.BoxGeometry(3.2, 2.2, 2.2);
        const tankMat = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.2,
            roughness: 0.1,
            transmission: 0.9,
            thickness: 0.5
        });
        const tank = new THREE.Mesh(tankGeo, tankMat);
        tank.position.set(0, -0.4, 0);
        scene.add(tank);

        const tankEdges = new THREE.LineSegments(
            new THREE.EdgesGeometry(tankGeo),
            new THREE.LineBasicMaterial({ color: 0x8e8e93, linewidth: 2 })
        );
        tankEdges.position.copy(tank.position);
        scene.add(tankEdges);

        // 바닷물 메쉬
        const waterLevelY = -0.4;
        const waterGeo = new THREE.BoxGeometry(3.16, 1.1, 2.16);
        const waterMat = new THREE.MeshStandardMaterial({
            color: 0x006994,
            transparent: true,
            opacity: 0.6,
            roughness: 0.1
        });
        const water = new THREE.Mesh(waterGeo, waterMat);
        water.position.set(0, waterLevelY - 0.55, 0);
        scene.add(water);

        // --- 4. 배 모델 생성 (반투명 처리로 화살표 가시성 개선) ---
        const boatGroup = new THREE.Group();
        
        const hullGeo = new THREE.BoxGeometry(1.8, 0.8, 1.2);
        const hullMat = new THREE.MeshStandardMaterial({
            color: 0xd7ccc8,
            roughness: 0.4,
            transparent: true,
            opacity: 0.55
        });
        const hullMesh = new THREE.Mesh(hullGeo, hullMat);
        hullMesh.castShadow = true;
        boatGroup.add(hullMesh);

        const cabinGeo = new THREE.BoxGeometry(0.8, 0.5, 0.7);
        const cabinMat = new THREE.MeshStandardMaterial({
            color: 0x5d4037,
            roughness: 0.5,
            transparent: true,
            opacity: 0.65
        });
        const cabinMesh = new THREE.Mesh(cabinGeo, cabinMat);
        cabinMesh.position.set(0, 0.65, 0);
        cabinMesh.castShadow = true;
        boatGroup.add(cabinMesh);

        boatGroup.position.set(0, waterLevelY, 0);
        scene.add(boatGroup);

        // --- 5. 힘 화살표 헬퍼 ---
        const gravityArrow = new THREE.ArrowHelper(new THREE.Vector3(0, -1, 0), boatGroup.position, 1, 0xe53935, 0.15, 0.1);
        const buoyancyArrow = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), boatGroup.position, 1, 0x1e88e5, 0.15, 0.1);
        scene.add(gravityArrow);
        scene.add(buoyancyArrow);

        // --- 6. 물리 변수 ---
        let currentG = 10.0;
        const boatHeight = 0.8;
        let boatVy = 0;
        const baseGravityForce = 12.2;
        const baseWaterDensity = baseGravityForce / (boatHeight / 2);
        const damping = 0.05;

        let isDragging = false;
        let dragOffsetY = 0;

        // --- 7. 마우스 및 터치 드래그 연동 (Raycasting) ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
        const planeIntersect = new THREE.Vector3();

        function getMousePos(e) {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
        }

        function onPointerDown(e) {
            getMousePos(e);
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(hullMesh);

            if (intersects.length > 0) {
                isDragging = true;
                controls.enabled = false;
                raycaster.ray.intersectPlane(dragPlane, planeIntersect);
                dragOffsetY = boatGroup.position.y - planeIntersect.y;
                boatVy = 0;
                document.getElementById('guide-tooltip').style.opacity = '0';
            }
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            getMousePos(e);
            raycaster.setFromCamera(mouse, camera);
            if (raycaster.ray.intersectPlane(dragPlane, planeIntersect)) {
                let newY = planeIntersect.y + dragOffsetY;
                newY = Math.max(-1.1, Math.min(0.4, newY));
                boatGroup.position.y = newY;
            }
        }

        function onPointerUp() {
            if (isDragging) {
                isDragging = false;
                controls.enabled = true;
            }
        }

        window.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        window.addEventListener('touchstart', onPointerDown, { passive: false });
        window.addEventListener('touchmove', onPointerMove, { passive: false });
        window.addEventListener('touchend', onPointerUp);

        // --- 8. 물리 시뮬레이션 및 데이터 업데이트 루프 ---
        function updatePhysics(dt) {
            const gRatio = currentG / 10.0;
            const bottomOfBoat = boatGroup.position.y - boatHeight / 2;
            const submergedDepth = Math.max(0, Math.min(boatHeight, waterLevelY - bottomOfBoat));
            const depthPercent = (submergedDepth / boatHeight) * 100;

            const Fg = baseGravityForce * gRatio;
            const Fb = baseWaterDensity * submergedDepth * gRatio;

            if (!isDragging) {
                const Fnet = Fb - Fg; // 위쪽 방향 양수
                const acceleration = Fnet / 1.2;
                boatVy += acceleration * dt;
                boatVy *= (1 - damping);
                boatGroup.position.y += boatVy * dt;

                if (boatGroup.position.y < -1.1) { boatGroup.position.y = -1.1; boatVy = 0; }
                if (boatGroup.position.y > 0.4) { boatGroup.position.y = 0.4; boatVy = 0; }
            }

            // 화살표 갱신
            gravityArrow.position.copy(boatGroup.position);
            buoyancyArrow.position.copy(boatGroup.position);

            const scaleFactor = 0.045;
            gravityArrow.setLength(Math.max(0.01, Fg * scaleFactor), 0.12, 0.08);
            buoyancyArrow.setLength(Math.max(0.01, Fb * scaleFactor), 0.12, 0.08);

            gravityArrow.visible = document.getElementById('chk-gravity').checked && currentG > 0;
            buoyancyArrow.visible = document.getElementById('chk-buoyancy').checked && submergedDepth > 0;

            // UI 텍스트 갱신
            document.getElementById('val-g').innerText = currentG.toFixed(1) + ' m/s²';
            document.getElementById('val-fg').innerText = Fg.toFixed(1) + ' N';
            document.getElementById('val-fb').innerText = Fb.toFixed(1) + ' N';
            document.getElementById('val-depth').innerText = depthPercent.toFixed(1) + ' %';
        }

        // --- 9. UI 이벤트 리스너 ---
        const btnTogglePhysics = document.getElementById('btn-toggle-physics');
        const physicsPanel = document.getElementById('physics-panel');
        btnTogglePhysics.addEventListener('click', () => {
            physicsPanel.classList.toggle('show');
            btnTogglePhysics.classList.toggle('active');
        });

        document.getElementById('sld-g').addEventListener('input', (e) => {
            currentG = parseFloat(e.target.value);
            document.getElementById('txt-g').innerText = currentG.toFixed(1) + ' m/s²';
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            currentG = 10.0;
            document.getElementById('sld-g').value = 10.0;
            document.getElementById('txt-g').innerText = '10.0 m/s²';
            boatGroup.position.set(0, waterLevelY, 0);
            boatVy = 0;
        });

        document.getElementById('btn-align').addEventListener('click', () => {
            camera.position.set(0, 1.8, 4.5);
            controls.target.set(0, 0, 0);
        });

        document.getElementById('theme-toggle').addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            scene.background.setHex(isDark ? 0x121212 : 0xf2f2f7);
            floor.material.color.setHex(isDark ? 0x1c1c1e : 0xe5e5ea);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 10. 애니메이션 루프 ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            updatePhysics(clock.getDelta() * 3);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
