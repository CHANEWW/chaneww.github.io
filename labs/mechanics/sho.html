<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>단순 조화 진자 3D</title>
    <!-- Three.js 및 OrbitControls 3D 엔진 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        @font-face {
            font-family: 'SeoulNamsanL';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanL.woff') format('woff');
            font-weight: normal;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            font-family: 'SeoulNamsanL', -apple-system, sans-serif;
            background-color: #f2f2f7;
            color: #1c1c1e;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            height: 100dvh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Apple visionOS Glassmorphic UI */
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            z-index: 10;
        }

        .top-left-bar {
            position: absolute;
            top: calc(env(safe-area-inset-top, 0px) + 16px);
            left: calc(env(safe-area-inset-left, 0px) + 16px);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: bold;
            color: #1c1c1e;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .tag-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
        }

        .tag-pill {
            background: rgba(0, 122, 255, 0.15);
            color: #007aff;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
        }

        .top-right-bar {
            position: absolute;
            top: calc(env(safe-area-inset-top, 0px) + 16px);
            right: calc(env(safe-area-inset-right, 0px) + 16px);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }

        .data-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 8px 16px;
        }

        .data-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .data-label {
            font-size: 10px;
            color: #8e8e93;
            font-weight: bold;
        }

        .data-value {
            font-size: 14px;
            font-weight: bold;
            color: #1c1c1e;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            transition: all 0.2s;
            font-size: 14px;
            flex-shrink: 0;
        }

        .center-tooltip {
            position: absolute;
            top: 14%;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 16px;
            font-size: 12px;
            color: #6e6e73;
            border-radius: 30px;
            pointer-events: none;
            z-index: 5;
            white-space: nowrap;
            transition: opacity 0.3s ease;
        }

        .bottom-control-bar {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px;
            z-index: 10;
            max-width: 95vw;
        }

        .control-tab-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px 12px;
            min-width: 60px;
            border-radius: 12px;
            border: none;
            background: transparent;
            color: #1c1c1e;
            font-size: 11px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .control-tab-btn.active {
            background: #007aff;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }

        .sub-panel {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 75px);
            left: 50%;
            transform: translateX(-50%);
            padding: 16px;
            width: 290px;
            max-width: 90vw;
            display: none;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .sub-panel.show { display: flex; }

        .slider-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #007aff;
            height: 6px;
        }

        /* 다크모드 대응 */
        body.dark-mode {
            background-color: #121212;
            color: #f2f2f7;
        }

        body.dark-mode .glass-panel {
            background: rgba(30, 30, 30, 0.75);
            border-color: rgba(255, 255, 255, 0.15);
            color: #f2f2f7;
        }

        body.dark-mode .data-value, body.dark-mode .back-btn {
            color: #f2f2f7;
        }

        body.dark-mode .icon-btn {
            background: rgba(40, 40, 40, 0.75);
            color: #fff;
        }
    
        /* Bottom Right Bar (Fullscreen) */
        .bottom-right-bar {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
            right: calc(env(safe-area-inset-right, 0px) + 16px);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }
        button.back-btn, button.tag-badge {
            font-family: inherit;
            border: none;
        }

        /* 모바일 가로모드 전용 핏팅 (세로 높이가 낮은 화면) */
        @media screen and (max-height: 520px) {
            .top-left-bar {
                top: calc(env(safe-area-inset-top, 0px) + 8px);
                left: calc(env(safe-area-inset-left, 0px) + 10px);
                gap: 6px;
            }

            .top-right-bar {
                top: calc(env(safe-area-inset-top, 0px) + 8px);
                right: calc(env(safe-area-inset-right, 0px) + 10px);
                gap: 6px;
            }

            .bottom-control-bar {
                bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
                padding: 4px;
                gap: 4px;
            }

            .bottom-right-bar {
                bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
                right: calc(env(safe-area-inset-right, 0px) + 10px);
            }

            .back-btn, .tag-badge {
                padding: 5px 10px;
                font-size: 11px;
                border-radius: 12px;
            }

            .tag-pill {
                font-size: 9px;
                padding: 1px 5px;
            }

            .data-card {
                padding: 5px 12px;
                gap: 10px;
                border-radius: 12px;
            }

            .data-label {
                font-size: 9px;
            }

            .data-value {
                font-size: 12px;
            }

            .icon-btn {
                width: 32px;
                height: 32px;
                font-size: 12px;
            }

            .control-tab-btn {
                padding: 4px 8px;
                min-width: 50px;
                font-size: 10px;
                border-radius: 10px;
            }

            .center-tooltip {
                top: 10px;
                font-size: 11px;
                padding: 4px 12px;
            }

            .sub-panel {
                bottom: calc(env(safe-area-inset-bottom, 0px) + 55px);
                padding: 10px 14px;
                width: 250px;
                gap: 8px;
                border-radius: 14px;
            }

            .slider-header {
                font-size: 11px;
            }
        }

        /* 스마트폰 화면 폭이 매우 좁을 때 태그 비활성화 처리 */
        @media screen and (max-width: 480px) and (orientation: portrait) {
            .tag-badge {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="top-left-bar">
        <a href="/index.html" class="glass-panel back-btn">
            <span>⬅</span> 메인
        </a>
        <div class="glass-panel tag-badge">
            <span>단순 조화 진자 3D</span>
            <span class="tag-pill">visionOS</span>
        </div>
    </div>

    <div class="top-right-bar">
        <div class="glass-panel data-card">
            <div class="data-item">
                <span class="data-label">각도</span>
                <span class="data-value" id="val-angle">0.0°</span>
            </div>
            <div class="data-item">
                <span class="data-label">주기</span>
                <span class="data-value" id="val-period">1.42s</span>
            </div>
            <div class="data-item">
                <span class="data-label">속도</span>
                <span class="data-value" id="val-speed">0.00m/s</span>
            </div>
        </div>
        <button class="icon-btn glass-panel" id="theme-toggle" aria-label="테마 전환">🌙</button>
    </div>

    <div class="glass-panel center-tooltip" id="guide-tooltip">
        ✨ 추를 마우스나 터치로 직접 끌어서 놓아보세요
    </div>

    <div class="glass-panel sub-panel" id="physics-panel">
        <div class="slider-row">
            <div class="slider-header">
                <span>실 길이 (L)</span>
                <span id="txt-length">1.5 m</span>
            </div>
            <input type="range" id="sld-length" min="0.5" max="3.0" step="0.1" value="1.5">
        </div>
        <div class="slider-row">
            <div class="slider-header">
                <span>중력 가속도 (g)</span>
                <span id="txt-gravity">9.8 m/s²</span>
            </div>
            <input type="range" id="sld-gravity" min="0" max="20" step="0.1" value="9.8">
        </div>
        <div class="slider-row">
            <div class="slider-header">
                <span>추 질량 (m)</span>
                <span id="txt-mass">1.0 kg</span>
            </div>
            <input type="range" id="sld-mass" min="0.2" max="3.0" step="0.1" value="1.0">
        </div>
    </div>

    <div class="glass-panel bottom-control-bar">
        <button class="control-tab-btn active" id="btn-play">
            <span id="icon-play">⏸</span>
            <span id="lbl-play">일시정지</span>
        </button>
        <button class="control-tab-btn" id="btn-toggle-physics">
            <span>⚙️</span>
            <span>물리 조절</span>
        </button>
        <button class="control-tab-btn" id="btn-reset">
            <span>🔄</span>
            <span>초기화</span>
        </button>
        <button class="control-tab-btn" id="btn-align">
            <span>📷</span>
            <span>시점정렬</span>
        </button>
    </div>

    <!-- Fullscreen / Windowed Mode Button -->
    <div class="bottom-right-bar">
        <button id="fullscreenBtn" class="glass-panel back-btn">
            <span id="fullscreenIcon">⛶</span>
            <span id="fullscreenText">전체화면</span>
        </button>
    </div>

    <script>
        // 1. 3D Scene / Camera / Renderer
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf2f2f7);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 4.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.05;

        // 2. Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(3, 5, 3);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // 3. 3D Stand & Floor
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(20, 20),
            new THREE.MeshStandardMaterial({ color: 0xe5e5ea, roughness: 0.8 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -1.5;
        floor.receiveShadow = true;
        scene.add(floor);

        const standGroup = new THREE.Group();
        const metalMat = new THREE.MeshStandardMaterial({ color: 0x1c1c1e, metalness: 0.8, roughness: 0.2 });

        const basePole = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 2.8, 32), metalMat);
        basePole.position.set(0.8, -0.1, 0);
        basePole.castShadow = true;
        standGroup.add(basePole);

        const topCross = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.2, 32), metalMat);
        topCross.rotation.z = Math.PI / 2;
        topCross.position.set(0.3, 1.25, 0);
        topCross.castShadow = true;
        standGroup.add(topCross);

        scene.add(standGroup);

        // 4. Pendulum Objects
        const pivotGroup = new THREE.Group();
        pivotGroup.position.set(0, 1.25, 0);
        scene.add(pivotGroup);

        let rodLength = 1.5;
        const rodGeo = new THREE.CylinderGeometry(0.008, 0.008, rodLength, 16);
        rodGeo.translate(0, -rodLength / 2, 0);
        const rodMesh = new THREE.Mesh(rodGeo, new THREE.MeshBasicMaterial({ color: 0x1c1c1e }));
        pivotGroup.add(rodMesh);

        const bobGeo = new THREE.SphereGeometry(0.15, 32, 32);
        const bobMat = new THREE.MeshPhysicalMaterial({ color: 0xff3b30, roughness: 0.1, metalness: 0.2, clearcoat: 0.8 });
        const bobMesh = new THREE.Mesh(bobGeo, bobMat);
        bobMesh.position.set(0, -rodLength, 0);
        bobMesh.castShadow = true;
        pivotGroup.add(bobMesh);

        // 5. Physics Simulation Logic
        let angle = Math.PI / 6;
        let angularVelocity = 0;
        let angularAcceleration = 0;
        let gravity = 9.8;
        let mass = 1.0;
        let isRunning = true;
        let isDragging = false;

        const clock = new THREE.Clock();

        function updatePhysics(dt) {
            if (!isRunning || isDragging) return;

            angularAcceleration = -(gravity / rodLength) * Math.sin(angle);
            angularVelocity += angularAcceleration * dt;
            angularVelocity *= 0.999; // 공기 저항 감쇠
            angle += angularVelocity * dt;

            pivotGroup.rotation.z = angle;

            document.getElementById('val-angle').innerText = (angle * (180 / Math.PI)).toFixed(1) + '°';
            document.getElementById('val-period').innerText = (2 * Math.PI * Math.sqrt(rodLength / gravity)).toFixed(2) + 's';
            document.getElementById('val-speed').innerText = Math.abs(angularVelocity * rodLength).toFixed(2) + 'm/s';
        }

        // 6. Touch & Drag Controls (Raycasting & Mobile Touch Support)
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);

        function updatePointerPosition(clientX, clientY) {
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
        }

        function handlePointerStart(clientX, clientY) {
            updatePointerPosition(clientX, clientY);

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(bobMesh);

            if (intersects.length > 0) {
                isDragging = true;
                controls.enabled = false;
                document.getElementById('guide-tooltip').style.opacity = '0';
            }
        }

        function handlePointerMove(clientX, clientY) {
            if (!isDragging) return;

            updatePointerPosition(clientX, clientY);

            raycaster.setFromCamera(mouse, camera);
            const intersectionPoint = new THREE.Vector3();
            raycaster.ray.intersectPlane(dragPlane, intersectionPoint);

            if (intersectionPoint) {
                const dx = intersectionPoint.x - pivotGroup.position.x;
                const dy = intersectionPoint.y - pivotGroup.position.y;

                angle = Math.atan2(dx, -dy);
                angle = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, angle));

                pivotGroup.rotation.z = angle;
                angularVelocity = 0;
                document.getElementById('val-angle').innerText = (angle * (180 / Math.PI)).toFixed(1) + '°';
            }
        }

        function handlePointerEnd() {
            if (isDragging) {
                isDragging = false;
                controls.enabled = true;
            }
        }

        // Pointer / Touch 이벤트 연동
        window.addEventListener('pointerdown', (e) => handlePointerStart(e.clientX, e.clientY));
        window.addEventListener('pointermove', (e) => handlePointerMove(e.clientX, e.clientY));
        window.addEventListener('pointerup', handlePointerEnd);

        // 7. Event Listeners
        const btnPlay = document.getElementById('btn-play');
        btnPlay.addEventListener('click', () => {
            isRunning = !isRunning;
            document.getElementById('icon-play').innerText = isRunning ? '⏸' : '▶';
            document.getElementById('lbl-play').innerText = isRunning ? '일시정지' : '시작';
            btnPlay.classList.toggle('active', isRunning);
        });

        const btnTogglePhysics = document.getElementById('btn-toggle-physics');
        const physicsPanel = document.getElementById('physics-panel');
        btnTogglePhysics.addEventListener('click', () => {
            physicsPanel.classList.toggle('show');
            btnTogglePhysics.classList.toggle('active');
        });

        document.getElementById('sld-length').addEventListener('input', (e) => {
            rodLength = parseFloat(e.target.value);
            document.getElementById('txt-length').innerText = rodLength.toFixed(1) + ' m';
            rodMesh.scale.set(1, rodLength / 1.5, 1);
            bobMesh.position.y = -rodLength;
        });

        document.getElementById('sld-gravity').addEventListener('input', (e) => {
            gravity = parseFloat(e.target.value);
            document.getElementById('txt-gravity').innerText = gravity.toFixed(1) + ' m/s²';
        });

        document.getElementById('sld-mass').addEventListener('input', (e) => {
            mass = parseFloat(e.target.value);
            document.getElementById('txt-mass').innerText = mass.toFixed(1) + ' kg';
            const s = Math.cbrt(mass);
            bobMesh.scale.set(s, s, s);
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            angle = Math.PI / 6;
            angularVelocity = 0;
            pivotGroup.rotation.z = angle;
        });

        document.getElementById('btn-align').addEventListener('click', () => {
            camera.position.set(0, 1.5, 4.5);
            controls.target.set(0, 0, 0);
        });

        document.getElementById('theme-toggle').addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            scene.background.setHex(isDark ? 0x121212 : 0xf2f2f7);
            floor.material.color.setHex(isDark ? 0x1c1c1e : 0xe5e5ea);
        });

        function onWindowResize() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        }

        window.addEventListener('resize', onWindowResize);
        window.addEventListener('orientationchange', () => setTimeout(onWindowResize, 200));

        // 8. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            updatePhysics(clock.getDelta());
            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        /* ---------- 모바일 크로스브라우저 전체화면 지원 ---------- */
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const fullscreenIcon = document.getElementById('fullscreenIcon');
        const fullscreenText = document.getElementById('fullscreenText');

        function isFullscreenActive() {
            return !!(
                document.fullscreenElement ||
                document.webkitFullscreenElement ||
                document.mozFullScreenElement ||
                document.msFullscreenElement
            );
        }

        function updateFullscreenUI() {
            const isFS = isFullscreenActive();
            if (fullscreenIcon) fullscreenIcon.innerText = isFS ? '🗗' : '⛶';
            if (fullscreenText) fullscreenText.innerText = isFS ? '창모드' : '전체화면';
        }

        if (fullscreenBtn) {
            fullscreenBtn.addEventListener('click', () => {
                const docEl = document.documentElement;

                if (!isFullscreenActive()) {
                    // 전체화면 요청
                    if (docEl.requestFullscreen) {
                        docEl.requestFullscreen().catch(() => fallbackMobileFullscreen());
                    } else if (docEl.webkitRequestFullscreen) {
                        docEl.webkitRequestFullscreen();
                    } else if (docEl.mozRequestFullScreen) {
                        docEl.mozRequestFullScreen();
                    } else if (docEl.msRequestFullscreen) {
                        docEl.msRequestFullscreen();
                    } else {
                        fallbackMobileFullscreen();
                    }
                } else {
                    // 전체화면 해제
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    } else if (document.mozCancelFullScreen) {
                        document.mozCancelFullScreen();
                    } else if (document.msExitFullscreen) {
                        document.msExitFullscreen();
                    }
                }
            });
        }

        // iOS Safari 등 API 미지원 디바이스 대안 처리
        function fallbackMobileFullscreen() {
            if (document.body.classList.contains('pseudo-fullscreen')) {
                document.body.classList.remove('pseudo-fullscreen');
                if (fullscreenIcon) fullscreenIcon.innerText = '⛶';
                if (fullscreenText) fullscreenText.innerText = '전체화면';
            } else {
                document.body.classList.add('pseudo-fullscreen');
                if (fullscreenIcon) fullscreenIcon.innerText = '🗗';
                if (fullscreenText) fullscreenText.innerText = '창모드';
                window.scrollTo(0, 1);
            }
            onWindowResize();
        }

        document.addEventListener('fullscreenchange', updateFullscreenUI);
        document.addEventListener('webkitfullscreenchange', updateFullscreenUI);
        document.addEventListener('mozfullscreenchange', updateFullscreenUI);
        document.addEventListener('MSFullscreenChange', updateFullscreenUI);
    </script>
</body>
</html>
