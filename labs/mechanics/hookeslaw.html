<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>추와 용수철 3D</title>
    <!-- Three.js 및 OrbitControls 3D 엔진 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        @font-face {
            font-family: 'SeoulNamsan';
            src: local('SeoulNamsan M'), local('SeoulNamsanM'), local('서울남산체 M'),
                 url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'SeoulNamsan', -apple-system, sans-serif;
            background-color: #f2f2f7;
            color: #1c1c1e;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Apple visionOS Glassmorphic UI */
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            z-index: 10;
        }

        /* 좌측 상단 헤더 */
        .top-left-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            color: #1c1c1e;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tag-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
        }

        .tag-pill {
            background: rgba(0, 122, 255, 0.15);
            color: #007aff;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
        }

        /* 우측 상단 실시간 데이터 표시 카드 */
        .top-right-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .data-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 20px;
        }

        .data-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .data-label {
            font-size: 11px;
            color: #8e8e93;
            font-weight: bold;
        }

        .data-value {
            font-size: 15px;
            font-weight: bold;
            color: #1c1c1e;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            transition: all 0.2s;
        }

        /* 중앙 안내 메세지 */
        .center-tooltip {
            position: absolute;
            top: 12%;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 18px;
            font-size: 13px;
            color: #8e8e93;
            border-radius: 30px;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.5s ease;
        }

        /* 하단 제어 바 */
        .bottom-control-bar {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            z-index: 10;
        }

        .control-tab-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 14px;
            min-width: 68px;
            border-radius: 14px;
            border: none;
            background: transparent;
            color: #1c1c1e;
            font-size: 12px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-tab-btn.active {
            background: #007aff;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }

        /* 서브 물리 설정 패널 */
        .sub-panel {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            padding: 20px;
            width: 300px;
            display: none;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }

        .sub-panel.show { display: flex; }

        .slider-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #007aff;
        }

        /* 다크 모드 */
        body.dark-mode {
            background-color: #121212;
            color: #f2f2f7;
        }

        body.dark-mode .glass-panel {
            background: rgba(30, 30, 30, 0.75);
            border-color: rgba(255, 255, 255, 0.15);
            color: #f2f2f7;
        }

        body.dark-mode .data-value, body.dark-mode .back-btn {
            color: #f2f2f7;
        }

        body.dark-mode .icon-btn {
            background: rgba(40, 40, 40, 0.75);
            color: #fff;
        }
    
        /* Bottom Right Bar (Fullscreen) */
        .bottom-right-bar {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }
        button.back-btn, button.tag-badge {
            font-family: inherit;
            border: none;
        }
        @media (max-width: 768px) {
            .bottom-right-bar {
                bottom: 15px;
                right: 15px;
            }
        }
    













/* @@MOBILE-BASE v1@@ */
/* ============================================================
   모바일 반응형 보정 (세로/가로) — 자동 생성 블록
   ============================================================ */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
img, canvas { max-width: 100%; }

/* ---------- 모바일 세로 (폭 900px 이하) ---------- */

        top: max(8px, env(safe-area-inset-top)) !important;
        left: 8px !important;
        right: 56px !important;
        gap: 6px !important;
        flex-wrap: nowrap !important;
        align-items: center !important;
        overflow: hidden;
    }
    .top-left-bar .back-btn,
    .top-left-bar > a {
        flex: 0 0 auto;
        padding: 6px 10px !important;
        font-size: 12px !important;
        gap: 4px !important;
        white-space: nowrap;
    }
    .top-left-bar .tag-badge {
        flex: 0 1 auto;
        min-width: 0;
        padding: 6px 10px !important;
        font-size: 12px !important;
        gap: 5px !important;
        white-space: nowrap;
        overflow: hidden;
    }
    .top-left-bar .tag-badge > span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .tag-pill { font-size: 9px !important; padding: 1px 6px !important; flex: 0 0 auto; }

    /* 2행: [데이터 카드 .............][테마] */
    .top-right-bar {
        top: calc(max(8px, env(safe-area-inset-top)) + 40px) !important;
        left: 8px !important;
        right: 8px !important;
        gap: 6px !important;
        justify-content: flex-end !important;
        flex-wrap: nowrap !important;
    }
    .data-card {
        flex: 1 1 0%;
        min-width: 0;
        gap: 4px !important;
        padding: 6px 8px !important;
        justify-content: space-around !important;
        overflow: hidden;
    }
    .data-card { flex-direction: row !important; align-items: center !important; flex-wrap: nowrap !important; }
    .data-item { min-width: 0; flex-direction: column !important; align-items: center !important; gap: 0 !important; }
    .data-item > * { white-space: nowrap; }
    .voltmeter-display { font-size: 24px !important; }
    .data-label { font-size: 9px !important; white-space: nowrap; line-height: 1.2; }
    .data-value { font-size: 12.5px !important; white-space: nowrap; line-height: 1.25; }
    .icon-btn { width: 34px !important; height: 34px !important; min-width: 34px; font-size: 15px !important; flex: 0 0 auto; }

    /* 전체화면: 1행 우측 아이콘 버튼 (글자는 숨김) */
    .bottom-right-bar {
        top: max(8px, env(safe-area-inset-top)) !important;
        bottom: auto !important;
        right: 8px !important;
        left: auto !important;
        z-index: 20;
    }
    .bottom-right-bar button,
    .bottom-right-bar .back-btn {
        padding: 6px 9px !important;
        font-size: 14px !important;
        gap: 4px !important;
        line-height: 1;
    }
    .bottom-right-bar #fullscreenText,
    .bottom-right-bar .fs-text { display: none !important; }

    /* 안내 문구 */
    .center-tooltip, #guide-tooltip {
        top: calc(max(8px, env(safe-area-inset-top)) + 88px) !important;
        left: 8px !important;
        right: 8px !important;
        transform: none !important;
        margin: 0 auto;
        width: auto !important;
        max-width: none !important;
        font-size: 11.5px !important;
        padding: 7px 12px !important;
        white-space: normal !important;
        line-height: 1.45;
        text-align: center;
        z-index: 15 !important;
    }

    /* 하단 컨트롤 바: 화면 폭 전체, 한 줄 유지 */
    .bottom-control-bar {
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        transform: none !important;
        width: 100% !important;
        border-radius: 18px 18px 0 0 !important;
        padding: 6px 6px calc(6px + env(safe-area-inset-bottom)) !important;
        gap: 2px !important;
        justify-content: space-around !important;
        flex-wrap: nowrap !important;
        overflow: visible;
    }
    .control-tab-btn {
        flex: 1 1 0 !important;
        min-width: 0 !important;
        padding: 5px 2px !important;
        font-size: 10.5px !important;
        gap: 1px !important;
        border-radius: 12px !important;
        white-space: nowrap !important;
        line-height: 1.15;
    }
    .control-tab-btn span { white-space: nowrap !important; }
    .control-tab-btn span:first-child { font-size: 15px !important; line-height: 1.1; }

    /* 슬라이더 등 서브 패널 */
    .sub-panel {
        left: 8px !important;
        right: 8px !important;
        bottom: calc(76px + env(safe-area-inset-bottom)) !important;
        transform: none !important;
        width: auto !important;
        max-width: none !important;
        max-height: 46vh;
        overflow-y: auto;
        padding: 13px 14px !important;
        gap: 10px !important;
        -webkit-overflow-scrolling: touch;
    }
    .sub-panel-title { font-size: 11px !important; }
    .slider-header { font-size: 11px !important; }
    .control-row { gap: 5px !important; flex-wrap: wrap; }
    .toggle-btn, .mode-btn, .quick-btn, .example-item, .preset-btn { font-size: 11px !important; }
    input[type="range"] { height: 22px; }

    /* 팝업(모달)이 화면을 넘지 않도록 */
    .modal-overlay { padding: 12px !important; align-items: center !important; }
    .modal-card {
        max-height: 88vh !important;
        overflow-y: auto !important;
        width: auto !important;
        max-width: 100% !important;
        padding: 16px !important;
        -webkit-overflow-scrolling: touch;
    }
    .modal-title { font-size: 15px !important; }
    .modal-body { font-size: 12px !important; }
    .example-title { font-size: 11.5px !important; }
    .example-desc { font-size: 11px !important; line-height: 1.5 !important; }
}

@media (max-width: 430px) {
    /* 아주 좁은 화면에서는 장식용 배지를 숨겨 제목 자리를 확보 */
    .tag-pill { display: none !important; }
}

/* ---------- 모바일 가로 (높이 500px 이하) ---------- */
@media (max-height: 500px) and (orientation: landscape) {
    .top-left-bar {
        top: max(6px, env(safe-area-inset-top)) !important;
        left: 6px !important;
        right: auto !important;
        max-width: 46vw;
        gap: 5px !important;
    }
    .top-left-bar .back-btn,
    .top-left-bar > a,
    .top-left-bar .tag-badge {
        padding: 4px 9px !important;
        font-size: 11px !important;
        height: 30px;
    }
    .tag-pill { display: none !important; }

    .top-right-bar {
        top: max(6px, env(safe-area-inset-top)) !important;
        right: 88px !important;
        left: auto !important;
        gap: 5px !important;
    }
    .data-card { padding: 4px 9px !important; gap: 9px !important; flex: 0 0 auto; }
    .data-label { font-size: 8.5px !important; }
    .data-value { font-size: 11.5px !important; }
    .icon-btn { width: 28px !important; height: 28px !important; min-width: 28px; font-size: 13px !important; }

    .bottom-right-bar {
        top: max(6px, env(safe-area-inset-top)) !important;
        bottom: auto !important;
        right: 6px !important;
        z-index: 20;
    }
    .bottom-right-bar button,
    .bottom-right-bar .back-btn { padding: 4px 8px !important; font-size: 13px !important; }
    .bottom-right-bar #fullscreenText,
    .bottom-right-bar .fs-text { display: none !important; }

    .center-tooltip, #guide-tooltip {
        top: auto !important;
        bottom: 56px !important;
        left: 50% !important;
        right: auto !important;
        transform: translateX(-50%) !important;
        width: max-content !important;
        max-width: 44vw !important;
        font-size: 10px !important;
        padding: 4px 9px !important;
        line-height: 1.3;
    }

    /* 가로 모드에서 각종 패널을 구석으로 모아 3D 화면을 가리지 않게 한다 */
    .side-panel { top: 44px !important; right: 8px !important; left: auto !important; width: 214px !important; padding: 7px 9px !important; gap: 4px !important; }
    .side-title { font-size: 10.5px !important; }
    .side-scale { font-size: 8.5px !important; }
    .meter-panel { left: 8px !important; bottom: 40px !important; top: auto !important; width: 190px !important; padding: 6px 8px !important; gap: 3px !important; }
    .meter-title { font-size: 9.5px !important; }
    .action-panel { top: auto !important; bottom: 40px !important; right: 8px !important; left: auto !important; grid-template-columns: repeat(2, 44px) !important; gap: 4px !important; }
    .side-btn { width: 44px !important; height: 44px !important; font-size: 8.5px !important; border-radius: 12px !important; gap: 1px !important; }
    .energy-panel { left: 8px !important; bottom: 40px !important; top: auto !important; width: 176px !important; padding: 6px 8px !important; gap: 4px !important; }
    .energy-title, .panel-note { font-size: 9px !important; line-height: 1.3 !important; }
    .info-panel { right: 8px !important; bottom: 40px !important; top: auto !important; min-width: 128px !important; padding: 6px 8px !important; gap: 2px !important; }
    .info-row { font-size: 9.5px !important; gap: 8px !important; }
    .view-panel { left: 8px !important; bottom: 40px !important; top: auto !important; padding: 6px 8px !important; }
    .phase-panel { left: 8px !important; bottom: 40px !important; top: auto !important; padding: 6px 8px !important; }
    .graph-panel { max-height: 40vh; width: 182px !important; }
    .legend, .panel-note { font-size: 9px !important; }

    .bottom-control-bar {
        left: 50% !important;
        right: auto !important;
        bottom: 4px !important;
        transform: translateX(-50%) !important;
        width: auto !important;
        max-width: calc(100vw - 12px);
        border-radius: 14px !important;
        padding: 4px 8px !important;
        gap: 3px !important;
    }
    .control-tab-btn {
        flex: 0 0 auto !important;
        min-width: 46px !important;
        padding: 3px 9px !important;
        font-size: 10px !important;
        gap: 3px !important;
        align-items: center !important;
        justify-content: center !important;
    }
    .control-tab-btn span:first-child { font-size: 13px !important; }

    .sub-panel {
        left: 50% !important;
        right: auto !important;
        bottom: 96px !important;
        transform: translateX(-50%) !important;

        max-width: min(400px, calc(100vw - 24px)) !important;
        max-height: 62vh;
        overflow-y: auto;
        padding: 9px 12px !important;
        gap: 6px !important;
    }
    .sub-panel .slider-row { gap: 3px !important; }
    .slider-header { font-size: 10.5px !important; }

    .modal-overlay { padding: 8px !important; }

        max-height: 94vh !important;
        overflow-y: auto !important;
        width: auto !important;
        max-width: min(460px, 96vw) !important;
        padding: 12px 14px !important;
    }
    .modal-title { font-size: 14px !important; }
    .modal-body { font-size: 11.5px !important; }
    .example-desc { font-size: 11px !important; line-height: 1.45 !important; }
}

/* ---------- 몰입(의사 전체화면) 모드 ---------- */
html.pseudo-fs .top-left-bar .tag-badge,
html.pseudo-fs .top-right-bar,
html.pseudo-fs .center-tooltip,
html.pseudo-fs #guide-tooltip { display: none !important; }
html.pseudo-fs .top-left-bar { right: 56px !important; }
html.pseudo-fs #fullscreenBtn,
html.pseudo-fs .bottom-right-bar { display: flex !important; }

/* ---------- 전체화면 시 캔버스 채움 ---------- */
body.is-fullscreen #canvas-container,
body.is-fullscreen #webgl-container { width: 100vw !important; height: 100vh !important; }

<body>

    <div id="canvas-container"></div>

    <div class="top-left-bar">
        <a href="/index.html" class="glass-panel back-btn">
            <span>⬅</span> 메인
        </a>
        <div class="glass-panel tag-badge">
            <span>추와 용수철 3D</span>
            <span class="tag-pill">visionOS</span>
        </div>
    </div>

    <div class="top-right-bar">
        <div class="glass-panel data-card">
            <div class="data-item">
                <span class="data-label">원래 길이</span>
                <span class="data-value" style="color:#34c759;">50.0 cm</span>
            </div>
            <div class="data-item">
                <span class="data-label">매달린 질량</span>
                <span class="data-value" id="val-mass" style="color:#ff9500;">0 g</span>
            </div>
            <div class="data-item">
                <span class="data-label">현재 전체 길이</span>
                <span class="data-value" id="val-length" style="color:#007aff;">50.0 cm</span>
            </div>
        </div>
        <button class="icon-btn glass-panel" id="theme-toggle">🌙</button>
    </div>

    <div class="glass-panel center-tooltip" id="guide-tooltip">
        ✨ 우측 보관함의 추를 마우스/터치로 용수철 고리에 매달아 보세요
    </div>

    <div class="glass-panel sub-panel" id="physics-panel">
        <div class="slider-row">
            <div class="slider-header">
                <span>용수철 상수 (k)</span>
                <span id="txt-k">5 N/m</span>
            </div>
            <input type="range" id="sld-k" min="1" max="10" step="1" value="5">
        </div>
    </div>

    <div class="glass-panel bottom-control-bar">
        <button class="control-tab-btn" id="btn-toggle-physics">
            <span>⚙️</span>
            <span>물리 조절</span>
        </button>
        <button class="control-tab-btn" id="btn-reset">
            <span>🔄</span>
            <span>초기화</span>
        </button>
        <button class="control-tab-btn" id="btn-align">
            <span>📷</span>
            <span>시점정렬</span>
        </button>
    </div>

    
    <!-- Fullscreen / Windowed Mode Button -->
    <div class="bottom-right-bar">
        <button id="fullscreenBtn" class="glass-panel back-btn">
            <span id="fullscreenIcon">⛶</span>
            <span id="fullscreenText">전체화면</span>
        </button>
    </div>

    <script>
        // --- 1. Three.js 기본 씬 & 카메라 & 렌더러 설정 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf2f2f7);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        // 두 번째 시점 카메라 위치 설정
        camera.position.set(0, 0.3, 4.8);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        // 두 번째 시점 주시 타겟 설정
        controls.target.set(0, -0.2, 0);
        controls.maxPolarAngle = Math.PI / 2 + 0.05;

        // --- 2. 조명 설정 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(3, 5, 3);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // --- 스케일 및 물리 상수 연산 정의 ---
        const ceilingY = 1.35;         // 용수철/스탠드 상단 고정 Y좌표
        const springX = 0;              // 메인 작업 동일 평면 X축 기준선
        const CM_TO_WORLD = 0.012;      // 1cm당 월드 Y축 스케일 (200cm = 2.4m)
        const L0_cm = 50.0;
        let currentL_cm = L0_cm;
        let targetL_cm = L0_cm;
        let vel = 0;
        let springK = 5;

        // --- 3. 바닥 및 스탠드 3D 메쉬 생성 ---
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(20, 20),
            new THREE.MeshStandardMaterial({ color: 0xe5e5ea, roughness: 0.8 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -1.8;
        floor.receiveShadow = true;
        scene.add(floor);

        // 지지대 스탠드 (용수철, 눈금 자와 동일 평면상에 밀착 정렬)
        const standGroup = new THREE.Group();
        const metalMat = new THREE.MeshStandardMaterial({ color: 0x1c1c1e, metalness: 0.8, roughness: 0.2 });

        // 세로 스탠드 기둥 (용수철 우측에 바로 배치하여 동일 Z평면에 위치시킴)
        const standX = 0.28;
        const basePole = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 3.2, 32), metalMat);
        basePole.position.set(standX, -0.25, 0);
        basePole.castShadow = true;
        standGroup.add(basePole);

        // 가로 상단 보 (세로 기둥과 용수철 상단을 가로질러 접촉 맞춤)
        const topCross = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.45, 32), metalMat);
        topCross.rotation.z = Math.PI / 2;
        topCross.position.set(standX / 2, ceilingY + 0.02, 0);
        topCross.castShadow = true;
        standGroup.add(topCross);

        scene.add(standGroup);

        // --- 4. 2m(200cm) 3D 눈금자 생성 ---
        const rulerLengthWorld = 200 * CM_TO_WORLD; // 2.4m
        const rulerGroup = new THREE.Group();
        rulerGroup.position.set(-0.30, ceilingY - (rulerLengthWorld / 2), 0);

        const rulerBody = new THREE.Mesh(
            new THREE.BoxGeometry(0.14, rulerLengthWorld, 0.02),
            new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 })
        );
        rulerGroup.add(rulerBody);

        // 200cm 눈금자 Canvas 텍스처그리기
        const rulerCanvas = document.createElement('canvas');
        rulerCanvas.width = 256;
        rulerCanvas.height = 4096;
        const rCtx = rulerCanvas.getContext('2d');
        
        rCtx.fillStyle = '#ffffff';
        rCtx.fillRect(0, 0, 256, 4096);
        rCtx.fillStyle = '#1c1c1e';
        rCtx.strokeStyle = '#1c1c1e';

        // 0cm ~ 200cm 눈금 표시
        for (let i = 0; i <= 200; i++) {
            let y = (i / 200) * 4000 + 48; // 상단 0cm ~ 하단 200cm
            rCtx.beginPath();
            rCtx.moveTo(256, y);
            
            if (i % 10 === 0) {
                rCtx.lineWidth = 6;
                rCtx.lineTo(256 - 80, y);
                rCtx.font = 'bold 50px sans-serif';
                rCtx.fillText(i + '', 20, y + 18);
            } else if (i % 5 === 0) {
                rCtx.lineWidth = 4;
                rCtx.lineTo(256 - 55, y);
            } else {
                rCtx.lineWidth = 2;
                rCtx.lineTo(256 - 35, y);
            }
            rCtx.stroke();
        }

        const rulerTex = new THREE.CanvasTexture(rulerCanvas);
        const rulerFront = new THREE.Mesh(
            new THREE.PlaneGeometry(0.14, rulerLengthWorld),
            new THREE.MeshBasicMaterial({ map: rulerTex, transparent: true })
        );
        rulerFront.position.set(0, 0, 0.012);
        rulerGroup.add(rulerFront);
        scene.add(rulerGroup);

        // --- 5. 3D 동적 용수철 메쉬 생성 ---
        let springMesh = null;
        const springMat = new THREE.MeshStandardMaterial({ color: 0x7f8c8d, metalness: 0.9, roughness: 0.1 });

        function createSpringGeometry(lengthCm) {
            const lengthWorld = lengthCm * CM_TO_WORLD;
            const turns = 22;
            const radius = 0.07;
            const points = [];
            const samples = 350;

            for (let i = 0; i <= samples; i++) {
                const t = i / samples;
                const angle = t * turns * Math.PI * 2;
                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;
                const y = -t * lengthWorld;
                points.push(new THREE.Vector3(x, y, z));
            }

            const curve = new THREE.CatmullRomCurve3(points);
            return new THREE.TubeGeometry(curve, 250, 0.012, 8, false);
        }

        function updateSpringMesh() {
            if (springMesh) scene.remove(springMesh);
            const geo = createSpringGeometry(currentL_cm);
            springMesh = new THREE.Mesh(geo, springMat);
            springMesh.position.set(springX, ceilingY, 0);
            springMesh.castShadow = true;
            scene.add(springMesh);
        }

        updateSpringMesh();

        // 용수철 상단 접촉 고리
        const topHookMesh = new THREE.Mesh(new THREE.TorusGeometry(0.035, 0.008, 16, 32), springMat);
        topHookMesh.position.set(springX, ceilingY + 0.02, 0);
        topHookMesh.rotation.x = Math.PI / 2;
        scene.add(topHookMesh);

        // 용수철 하단 고리
        const hookGeo = new THREE.TorusGeometry(0.04, 0.008, 16, 32);
        const hookMesh = new THREE.Mesh(hookGeo, springMat);
        scene.add(hookMesh);

        // 수치-눈금 일치 지시 빨간 점선
        const indicatorGeo = new THREE.BufferGeometry();
        const indicatorMat = new THREE.LineDashedMaterial({ color: 0xff3b30, dashSize: 0.04, gapSize: 0.02 });
        const indicatorLine = new THREE.Line(indicatorGeo, indicatorMat);
        scene.add(indicatorLine);

        function updateIndicator() {
            const hookY = ceilingY - (currentL_cm * CM_TO_WORLD);
            hookMesh.position.set(springX, hookY - 0.04, 0);

            const points = [
                new THREE.Vector3(-0.30, hookY, 0.02),
                new THREE.Vector3(springX + 0.1, hookY, 0.02)
            ];
            indicatorGeo.setFromPoints(points);
            indicatorLine.computeLineDistances();
        }

        // --- 6. 3D 추 및 보관함 객체 생성 ---
        const initialWeights = [
            { id: 0, ox: 0.6, oy: -1.2, oz: 0.3 },
            { id: 1, ox: 0.8, oy: -1.2, oz: 0.3 },
            { id: 2, ox: 1.0, oy: -1.2, oz: 0.3 },
            { id: 3, ox: 0.7, oy: -1.2, oz: 0.5 },
            { id: 4, ox: 0.9, oy: -1.2, oz: 0.5 }
        ];

        let weights = [];
        const weightMat = new THREE.MeshStandardMaterial({ color: 0xd35400, metalness: 0.4, roughness: 0.3 });

        function createWeightMesh() {
            const group = new THREE.Group();
            
            // 몸통
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.12, 32), weightMat);
            body.castShadow = true;
            group.add(body);

            // 상단 C 고리
            const topRing = new THREE.Mesh(new THREE.TorusGeometry(0.03, 0.006, 16, 32), weightMat);
            topRing.position.y = 0.08;
            group.add(topRing);

            // 하단 반C 고리 (연쇄 연결용)
            const bottomRing = new THREE.Mesh(new THREE.TorusGeometry(0.03, 0.006, 16, 32), weightMat);
            bottomRing.position.y = -0.08;
            group.add(bottomRing);

            return group;
        }

        // 보관함 상자
        const trayMesh = new THREE.Mesh(
            new THREE.BoxGeometry(0.65, 0.05, 0.45),
            new THREE.MeshStandardMaterial({ color: 0xbdc3c7, roughness: 0.6 })
        );
        trayMesh.position.set(0.8, -1.28, 0.4);
        trayMesh.receiveShadow = true;
        scene.add(trayMesh);

        function initWeights() {
            weights.forEach(w => scene.remove(w.mesh));
            weights = initialWeights.map(w => {
                const mesh = createWeightMesh();
                mesh.position.set(w.ox, w.oy, w.oz);
                scene.add(mesh);
                return {
                    id: w.id, ox: w.ox, oy: w.oy, oz: w.oz,
                    x: w.ox, y: w.oy, z: w.oz,
                    isAttached: false, isDragging: false, mesh: mesh
                };
            });
        }
        initWeights();

        // --- 7. 마우스/터치 드래그 인터랙션 (Raycasting) ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
        let draggedWeight = null;

        function onPointerDown(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const meshes = weights.map(w => w.mesh);
            const intersects = raycaster.intersectObjects(meshes, true);

            if (intersects.length > 0) {
                let hitMesh = intersects[0].object;
                while (hitMesh.parent && hitMesh.parent !== scene) hitMesh = hitMesh.parent;

                draggedWeight = weights.find(w => w.mesh === hitMesh);
                if (draggedWeight) {
                    draggedWeight.isDragging = true;
                    draggedWeight.isAttached = false;
                    controls.enabled = false;
                    document.getElementById('guide-tooltip').style.opacity = '0';
                }
            }
        }

        function onPointerMove(e) {
            if (!draggedWeight) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersection = new THREE.Vector3();
            raycaster.ray.intersectPlane(dragPlane, intersection);

            if (intersection) {
                draggedWeight.mesh.position.copy(intersection);
            }
        }

        function onPointerUp() {
            if (draggedWeight) {
                const pos = draggedWeight.mesh.position;
                const hookY = ceilingY - (currentL_cm * CM_TO_WORLD) - 0.04;

                const distToHook = Math.hypot(pos.x - springX, pos.y - hookY);
                if (distToHook < 0.35) {
                    draggedWeight.isAttached = true;
                } else {
                    draggedWeight.isAttached = false;
                    draggedWeight.mesh.position.set(draggedWeight.ox, draggedWeight.oy, draggedWeight.oz);
                }

                draggedWeight.isDragging = false;
                draggedWeight = null;
                controls.enabled = true;
            }
        }

        window.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);

        // --- 8. 물리 엔진 및 데이터 연산 모션 ---
        function updatePhysics(dt) {
            const attachedWeights = weights.filter(w => w.isAttached && !w.isDragging);
            const massG = attachedWeights.length * 100;

            // F = mg, x(cm) = (F / k) * 100
            const stretchCm = (massG * 0.98) / springK;
            targetL_cm = L0_cm + stretchCm;

            // 탄성 감쇠 애니메이션
            const force = (targetL_cm - currentL_cm) * 12;
            vel = (vel + force * dt) * 0.88;
            currentL_cm += vel * dt;

            updateSpringMesh();
            updateIndicator();

            // 매달린 추 상하 연쇄 배치
            const hookY = ceilingY - (currentL_cm * CM_TO_WORLD) - 0.08;
            attachedWeights.forEach((w, idx) => {
                w.mesh.position.set(springX, hookY - (idx * 0.15), 0);
            });

            // UI 수치 출력
            document.getElementById('val-mass').innerText = massG + ' g';
            document.getElementById('val-length').innerText = currentL_cm.toFixed(1) + ' cm';
        }

        // --- 9. 버튼 및 컨트롤 제어 ---
        const btnTogglePhysics = document.getElementById('btn-toggle-physics');
        const physicsPanel = document.getElementById('physics-panel');
        btnTogglePhysics.addEventListener('click', () => {
            physicsPanel.classList.toggle('show');
            btnTogglePhysics.classList.toggle('active');
        });

        document.getElementById('sld-k').addEventListener('input', (e) => {
            springK = parseFloat(e.target.value);
            document.getElementById('txt-k').innerText = springK + ' N/m';
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            springK = 5;
            document.getElementById('sld-k').value = 5;
            document.getElementById('txt-k').innerText = '5 N/m';
            initWeights();
            vel = 0;
            currentL_cm = L0_cm;
        });

        // 시점정렬 버튼 클릭 시에도 두 번째 시점으로 정렬
        document.getElementById('btn-align').addEventListener('click', () => {
            camera.position.set(0, 0.3, 4.8);
            controls.target.set(0, -0.2, 0);
        });

        document.getElementById('theme-toggle').addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            scene.background.setHex(isDark ? 0x121212 : 0xf2f2f7);
            floor.material.color.setHex(isDark ? 0x1c1c1e : 0xe5e5ea);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 10. 애니메이션 루프 ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            updatePhysics(clock.getDelta());
            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    
        /* ---------- Fullscreen / Windowed Mode Logic ---------- */
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const fullscreenIcon = document.getElementById('fullscreenIcon');
        const fullscreenText = document.getElementById('fullscreenText');

        function updateFullscreenUI() {
            const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
            if (fullscreenIcon) fullscreenIcon.innerText = isFS ? '🗗' : '⛶';
            if (fullscreenText) fullscreenText.innerText = isFS ? '창모드' : '전체화면';
        }

        if (fullscreenBtn) {
            fullscreenBtn.addEventListener('click', () => {
                try {
                    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                        const req = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
                        if (req) req.call(document.documentElement);
                    } else {
                        const exit = document.exitFullscreen || document.webkitExitFullscreen;
                        if (exit) exit.call(document);
                    }
                } catch (err) {
                    console.error('전체화면 모드를 전환할 수 없습니다:', err);
                }
            });
        }

        document.addEventListener('fullscreenchange', updateFullscreenUI);
        document.addEventListener('webkitfullscreenchange', updateFullscreenUI);
    </script>

<script>
/* ============ 모바일 화면 재조정 + 전체화면 대체 동작 (자동 생성) ============ */
(function () {
    var docEl = document.documentElement;
    var btn = document.getElementById('fullscreenBtn');
    var icon = document.getElementById('fullscreenIcon');
    var text = document.getElementById('fullscreenText');

    function realFs() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement ||
                  document.mozFullScreenElement || document.msFullscreenElement);
    }
    function pseudo() { return docEl.classList.contains('pseudo-fs'); }
    function setUI() {
        var on = realFs() || pseudo();
        if (icon) icon.textContent = on ? '🗗' : '⛶';
        if (text) text.textContent = on ? '창모드' : '전체화면';
        if (btn) btn.setAttribute('aria-label', on ? '창모드로 전환' : '전체화면으로 전환');
        document.body.classList.toggle('is-fullscreen', on);
    }
    function toast(msg) {
        var t = document.getElementById('ux-toast');
        if (!t) {
            t = document.createElement('div');
            t.id = 'ux-toast';
            t.style.cssText = 'position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);' +
                'background:rgba(28,28,30,.88);color:#fff;font-size:12px;line-height:1.4;padding:9px 14px;border-radius:14px;' +
                'z-index:9999;max-width:86vw;text-align:center;pointer-events:none;transition:opacity .3s;' +
                'font-family:inherit;box-shadow:0 8px 24px rgba(0,0,0,.25)';
            document.body.appendChild(t);
        }
        t.textContent = msg;
        t.style.opacity = '1';
        clearTimeout(t._t);
        t._t = setTimeout(function () { t.style.opacity = '0'; }, 2600);
    }

    if (btn) {
        btn.addEventListener('click', function () {
            var wasReal = realFs();
            var wasPseudo = pseudo();
            setTimeout(function () {
                if (wasReal) { setUI(); return; }          // 진짜 전체화면에서 나온 경우
                if (wasPseudo) { docEl.classList.remove('pseudo-fs'); setUI(); return; }  // 몰입 모드 해제
                if (!realFs()) {                            // 전체화면 API가 동작하지 않는 환경
                    docEl.classList.add('pseudo-fs');
                    try { window.scrollTo(0, 1); } catch (e) {}
                    toast('이 브라우저는 전체화면을 지원하지 않아 상단 정보를 숨긴 몰입 모드로 표시합니다');
                }
                setUI();
            }, 380);
        }, false);
    }
    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
        document.addEventListener(ev, setUI);
    });

    /* 좁은 화면에서는 3D 장면이 잘리지 않도록 시야각을 넓혀 전체가 들어오게 한다 */
    function mobileFit() {
        try {
            if (typeof camera === 'undefined' || !camera || !camera.isPerspectiveCamera) return;
            if (!camera.userData) camera.userData = {};
            if (!camera.userData.baseFov) camera.userData.baseFov = camera.fov;
            var w = window.innerWidth, h = window.innerHeight, f = 1;
            var k = 0.62;
            var attr = document.documentElement.getAttribute('data-mzoom');
            if (attr) { var v = parseFloat(attr); if (!isNaN(v) && v > 0) k = v; }
            if (w < h) f = 1 + (1 - w / h) * k;
            else if (h <= 500) f = 1 + k * 0.16;
            camera.fov = Math.min(88, camera.userData.baseFov * f);
            camera.updateProjectionMatrix();
        } catch (e) {}
    }
    mobileFit();

    /* 화면 회전·주소창 변화·전체화면 전환 후 렌더러 크기 재계산 */
    var rt = null;
    function refit() {
        clearTimeout(rt);
        rt = setTimeout(function () {
            mobileFit();
            try { window.dispatchEvent(new Event('resize')); } catch (e) {}
        }, 240);
    }
    window.addEventListener('orientationchange', refit);
    window.addEventListener('pageshow', refit);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) refit(); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', refit);

    setUI();
})();
</script>
