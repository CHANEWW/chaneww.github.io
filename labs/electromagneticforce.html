<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>전자기력 3D</title>
    <!-- Three.js 및 OrbitControls 3D 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #f2f2f7;
            color: #1c1c1e;
            touch-action: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Apple visionOS Glassmorphic UI Style */
        .glass-panel {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(25px) saturate(190%);
            -webkit-backdrop-filter: blur(25px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 22px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.08);
            z-index: 10;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* 좌측 상단 헤더 */
        .top-left-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 700;
            color: #1c1c1e;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.92);
            transform: translateY(-1px);
        }

        .tag-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 700;
        }

        .tag-pill {
            background: rgba(0, 122, 255, 0.15);
            color: #007aff;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        /* 우측 상단 실시간 데이터 패널 */
        .top-right-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        .data-card {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 10px 22px;
        }

        .data-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .data-label {
            font-size: 11px;
            color: #8e8e93;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .data-value {
            font-size: 16px;
            font-weight: 800;
            color: #1c1c1e;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(20px);
            font-size: 18px;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.95);
        }

        /* 상단 중앙 안내 문구 */
        .center-tooltip {
            position: absolute;
            top: 96px;
            left: 50%;
            transform: translateX(-50%);
            padding: 9px 20px;
            font-size: 13px;
            font-weight: 600;
            color: #48484a;
            border-radius: 30px;
            pointer-events: none;
            z-index: 5;
            text-align: center;
            max-width: 440px;
            line-height: 1.45;
        }

        /* 오른손 법칙 가이드 패널 (좌측) */
        .righthand-panel {
            position: absolute;
            bottom: 95px;
            left: 20px;
            width: 300px;
            padding: 16px;
            display: none;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }

        .righthand-panel.show { display: flex; }

        .panel-title {
            font-size: 14px;
            font-weight: 800;
            color: #1c1c1e;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            padding-bottom: 8px;
        }

        /* 서브 제어 물리 패널 (우측 하단) */
        .sub-panel {
            position: absolute;
            bottom: 95px;
            right: 20px;
            padding: 20px;
            width: 300px;
            display: none;
            flex-direction: column;
            gap: 14px;
            z-index: 10;
        }

        .sub-panel.show { display: flex; }

        .control-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 13px;
            font-weight: 700;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: rgba(0, 0, 0, 0.1);
            height: 6px;
            border-radius: 3px;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #007aff;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,122,255,0.4);
            transition: all 0.15s ease;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        .btn-group {
            display: flex;
            gap: 6px;
            margin-top: 2px;
        }

        .toggle-btn {
            flex: 1;
            padding: 9px 10px;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            background: rgba(255, 255, 255, 0.55);
            color: #1c1c1e;
            font-weight: 700;
            font-size: 12px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .toggle-btn:hover { background: rgba(255, 255, 255, 0.85); }

        .toggle-btn.power-on {
            background: #34c759;
            color: white;
            border-color: #34c759;
            box-shadow: 0 4px 12px rgba(52, 199, 89, 0.3);
        }

        .toggle-btn.power-off {
            background: #ff3b30;
            color: white;
            border-color: #ff3b30;
            box-shadow: 0 4px 12px rgba(255, 59, 48, 0.3);
        }

        .toggle-btn.selected {
            background: #007aff;
            color: white;
            border-color: #007aff;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }

        /* 하단 컨트롤 바 */
        .bottom-control-bar {
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            z-index: 10;
            white-space: nowrap;
        }

        .control-tab-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 14px;
            min-width: 68px;
            border-radius: 14px;
            border: none;
            background: transparent;
            color: #1c1c1e;
            font-size: 12px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-tab-btn:hover { background: rgba(0, 122, 255, 0.08); }

        .control-tab-btn.active {
            background: #007aff;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.35);
        }

        .vec-chip-group {
            display: flex;
            gap: 4px;
            background: rgba(0, 0, 0, 0.05);
            padding: 4px;
            border-radius: 12px;
        }

        .vec-chip {
            padding: 5px 10px;
            font-size: 11px;
            font-weight: 800;
            font-family: inherit;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            color: #8e8e93;
            background: transparent;
            border: none;
        }

        .vec-chip:hover { color: #1c1c1e; }
        .vec-chip.active-i { background: #ff3b30; color: white; }
        .vec-chip.active-b { background: #007aff; color: white; }
        .vec-chip.active-f { background: #34c759; color: white; }

        /* 다크 모드 스타일 */
        body.dark-mode { background-color: #121212; color: #f2f2f7; }
        body.dark-mode .glass-panel { background: rgba(32, 32, 36, 0.78); border-color: rgba(255, 255, 255, 0.15); color: #f2f2f7; }
        body.dark-mode .data-value, body.dark-mode .back-btn, body.dark-mode .panel-title, body.dark-mode .control-tab-btn { color: #f2f2f7; }
        body.dark-mode .center-tooltip { color: #aeaeb2; }
        body.dark-mode .icon-btn { background: rgba(40, 40, 45, 0.78); color: #fff; }
        body.dark-mode .toggle-btn { background: rgba(255, 255, 255, 0.08); color: #f2f2f7; border-color: rgba(255, 255, 255, 0.1); }
        body.dark-mode .vec-chip:hover { color: #f2f2f7; }
    </style>
</head>
<body>

    <!-- 3D WebGL Canvas Space -->
    <div id="canvas-container"></div>

    <!-- 좌측 상단 헤더 -->
    <div class="top-left-bar">
        <a href="javascript:history.back()" class="glass-panel back-btn">
            <span>⬅</span> 메인
        </a>
        <div class="glass-panel tag-badge">
            <span>전자기력 3D</span>
            <span class="tag-pill">visionOS</span>
        </div>
    </div>

    <!-- 우측 상단 실시간 데이터 패널 -->
    <div class="top-right-bar">
        <div class="glass-panel data-card">
            <div class="data-item">
                <span class="data-label">전원 상태</span>
                <span class="data-value" id="val-power-state" style="color:#ff3b30;">OFF</span>
            </div>
            <div class="data-item">
                <span class="data-label">전압 (V)</span>
                <span class="data-value" id="val-voltage" style="color:#007aff;">6.0 V</span>
            </div>
            <div class="data-item">
                <span class="data-label">전류 (I)</span>
                <span class="data-value" id="val-current" style="color:#ff3b30;">0.00 A</span>
            </div>
            <div class="data-item">
                <span class="data-label">자기장 (B)</span>
                <span class="data-value" id="val-bfield" style="color:#007aff;">0.50 T</span>
            </div>
            <div class="data-item">
                <span class="data-label">자기력 (F)</span>
                <span class="data-value" id="val-force" style="color:#34c759;">0.00 N</span>
            </div>
            <div class="data-item">
                <span class="data-label">그네 편각 (θ)</span>
                <span class="data-value" id="val-angle" style="color:#ff9500;">0.0°</span>
            </div>
        </div>
        <button class="icon-btn glass-panel" id="theme-toggle" title="테마 전환">🌙</button>
    </div>

    <!-- 상단 중앙 안내 -->
    <div class="glass-panel center-tooltip" id="hint"></div>

    <!-- 오른손 법칙 3D 미니 뷰어 패널 (좌측) -->
    <div class="glass-panel righthand-panel" id="righthand-panel">
        <div class="panel-title">
            <span>✋ 오른손 법칙 (3D 시점)</span>
        </div>
        <!-- 3D 캔버스가 들어갈 컨테이너 -->
        <div id="hand-canvas-container" style="position: relative; width: 100%; height: 240px; margin: 10px auto; border-radius: 16px; overflow: hidden; background: rgba(0,0,0,0.04); border: 1px inset rgba(255,255,255,0.5); cursor: grab;">
        </div>
        <div style="font-size: 11px; color: #8e8e93; text-align: center; font-weight: 700;">마우스로 상하좌우 드래그하여 돌려보세요</div>
    </div>

    <!-- 서브 물리 제어 패널 (우측 하단) -->
    <div class="glass-panel sub-panel" id="physics-panel">
        <div class="control-row">
            <span>전원장치 스위치</span>
            <div class="btn-group">
                <button class="toggle-btn power-off" id="btn-power-toggle">⚡ 전원 켜기 (ON)</button>
            </div>
        </div>

        <div class="control-row">
            <div class="control-header">
                <span>공급 전압 조절 (V)</span>
                <span id="txt-voltage" style="color:#007aff;">6.0 V</span>
            </div>
            <input type="range" id="sld-voltage" min="1" max="15" step="0.5" value="6">
        </div>

        <div class="control-row">
            <span>자석 종류 선택</span>
            <div class="btn-group">
                <button class="toggle-btn selected" id="btn-mag-normal">일반 자석 (1.0x)</button>
                <button class="toggle-btn" id="btn-mag-neo">네오디뮴 (2.5x)</button>
            </div>
        </div>

        <div class="control-row">
            <span>자석 설정</span>
            <div class="btn-group">
                <button class="toggle-btn" id="btn-mag-pole">자석의 방향 변경</button>
            </div>
        </div>

        <div class="control-row">
            <span>전원 설정</span>
            <div class="btn-group">
                <button class="toggle-btn" id="btn-power-polarity">전원 극성 변경</button>
            </div>
        </div>
    </div>

    <!-- 하단 제어 바 -->
    <div class="glass-panel bottom-control-bar">
        <button class="control-tab-btn" id="btn-toggle-righthand">
            <span>✋</span>
            <span>오른손 법칙</span>
        </button>
        <button class="control-tab-btn" id="btn-toggle-physics">
            <span>⚙️</span>
            <span>실험 설정</span>
        </button>

        <div class="vec-chip-group">
            <button class="vec-chip active-i" id="chip-i">전류 방향</button>
            <button class="vec-chip active-b" id="chip-b">자기장 방향</button>
            <button class="vec-chip active-f" id="chip-f">힘 방향</button>
        </div>

        <button class="control-tab-btn" id="btn-reset">
            <span>🔄</span>
            <span>초기화</span>
        </button>
        <button class="control-tab-btn" id="btn-align">
            <span>📷</span>
            <span>시점정렬</span>
        </button>
    </div>

    <script>
        // =====================================================
        // 1. Three.js 기본 씬, 카메라, 렌더러 (메인 씬)
        // =====================================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf2f2f7);

        const VIEWS = {
            iso:   { pos: [3.2, 2.2, 5.0],  target: [0, 0.9, 0] }
        };

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(...VIEWS.iso.pos);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2.05;
        controls.minDistance = 2.0;
        controls.maxDistance = 10.0;
        controls.target.set(...VIEWS.iso.target);

        let viewTween = null;
        function goView(name) {
            const v = VIEWS[name];
            viewTween = { pos: new THREE.Vector3(...v.pos), target: new THREE.Vector3(...v.target) };
        }
        controls.addEventListener('start', () => { viewTween = null; });

        // 메인 씬 조명 설정
        scene.add(new THREE.AmbientLight(0xffffff, 0.75));

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
        dirLight.position.set(3.5, 6, 4);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.bias = -0.0001;
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0x90b0ff, 0.35);
        fillLight.position.set(-3, 3, -2);
        scene.add(fillLight);

        // 메인 씬 바닥 및 그리드
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(20, 20),
            new THREE.MeshStandardMaterial({ color: 0xe5e5ea, roughness: 0.8, metalness: 0.1 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.6;
        floor.receiveShadow = true;
        scene.add(floor);

        const gridHelper = new THREE.GridHelper(20, 20, 0xd1d1d6, 0xe5e5ea);
        gridHelper.position.y = -0.59;
        scene.add(gridHelper);

        // =====================================================
        // 2. 실험 상태 변수 설정
        // =====================================================
        let isPowerOn = false;
        let voltage = 6.0;
        const resistance = 2.0;
        let magnetType = 'normal';
        let isMagnetReversed = false;
        let isPowerReversed = false;

        let showI = true, showB = true, showF = true;

        let currentSwingAngle = 0;
        let swingVelocity = 0;
        const damping = 0.93;
        const springK = 0.08;

        const BAR_Y = 2.4;
        const WIRE_LEN = 1.8;
        const WIRE_X = 0.5;
        const MAG_Y = 0.6;
        const ARM = 0.4;
        const TUBE = 0.15;
        const XS = 2.4;
        const ARM_Z0 = -0.6;
        const ARM_Z1 = 0.7;

        // =====================================================
        // 3. 메인 실험 장치 모델링 구현
        // =====================================================
        const labGroup = new THREE.Group();
        scene.add(labGroup);

        const chromeMat  = new THREE.MeshStandardMaterial({ color: 0xc8c8ce, metalness: 0.6, roughness: 0.25 });
        const copperMat  = new THREE.MeshStandardMaterial({ color: 0xd97736, metalness: 0.6, roughness: 0.3 });
        const insulatorMat = new THREE.MeshStandardMaterial({ color: 0x222226, roughness: 0.6 });
        const baseMat    = new THREE.MeshStandardMaterial({ color: 0x3a3a3c, roughness: 0.6 });

        function addMesh(geo, mat, x, y, z, parent) {
            const m = new THREE.Mesh(geo, mat);
            m.position.set(x, y, z);
            m.castShadow = true;
            m.receiveShadow = true;
            (parent || labGroup).add(m);
            return m;
        }

        // 스탠드 & 받침대
        addMesh(new THREE.BoxGeometry(3.4, 0.1, 2.4), baseMat, 0, -0.55, -0.1);

        const RODX = 1.1;
        [-1, 1].forEach((s) => {
            addMesh(new THREE.CylinderGeometry(0.03, 0.03, 3.0, 20), chromeMat, s * RODX, 1.0, 0);
            addMesh(new THREE.CylinderGeometry(0.1, 0.1, 0.04, 24), chromeMat, s * RODX, -0.48, 0);
            addMesh(new THREE.BoxGeometry(0.12, 0.12, 0.12), chromeMat, s * RODX, BAR_Y, 0);
            
            const half = addMesh(new THREE.CylinderGeometry(0.025, 0.025, 0.95, 16), chromeMat, s * 0.625, BAR_Y, 0);
            half.rotation.z = Math.PI / 2;
        });
        addMesh(new THREE.BoxGeometry(0.3, 0.08, 0.08), insulatorMat, 0, BAR_Y, 0);

        // 전기그네 (Swing)
        const swingPivot = new THREE.Group();
        swingPivot.position.set(0, BAR_Y, 0);
        labGroup.add(swingPivot);

        [-1, 1].forEach((s) => {
            const ringGeo = new THREE.TorusGeometry(0.05, 0.012, 12, 28);
            ringGeo.rotateY(Math.PI / 2);
            addMesh(ringGeo, copperMat, s * WIRE_X, 0, 0, swingPivot);
            addMesh(new THREE.CylinderGeometry(0.011, 0.011, WIRE_LEN, 10), copperMat, s * WIRE_X, -WIRE_LEN / 2, 0, swingPivot);
            addMesh(new THREE.SphereGeometry(0.03, 16, 16), copperMat, s * WIRE_X, -WIRE_LEN, 0, swingPivot);
        });
        const swingRod = addMesh(new THREE.CylinderGeometry(0.022, 0.022, WIRE_X * 2, 16), copperMat, 0, -WIRE_LEN, 0, swingPivot);
        swingRod.rotation.z = Math.PI / 2;

        // 말굽자석 (Magnet)
        const magnetGroup = new THREE.Group();
        magnetGroup.position.set(0, MAG_Y, 0);
        labGroup.add(magnetGroup);

        const matGray   = new THREE.MeshStandardMaterial({ color: 0x7a7a80, metalness: 0.5, roughness: 0.35 });
        const matN      = new THREE.MeshStandardMaterial({ color: 0xd32f2f, roughness: 0.4 });
        const matS      = new THREE.MeshStandardMaterial({ color: 0x1976d2, roughness: 0.4 });
        const matSilver = new THREE.MeshStandardMaterial({ color: 0xdcdde2, metalness: 0.55, roughness: 0.22 });

        function armGeo(len) {
            const g = new THREE.CylinderGeometry(TUBE, TUBE, len, 28);
            g.rotateX(Math.PI / 2);
            g.scale(XS, 1, 1);
            return g;
        }

        const bendGeo = new THREE.TorusGeometry(ARM, TUBE, 24, 48, Math.PI);
        bendGeo.rotateZ(Math.PI / 2);

        function makeBadge(text, color, size, alwaysOnTop = true) {

                map: tex,

                depthTest: !alwaysOnTop, 
                depthWrite: !alwaysOnTop 
            }));
            spr.scale.set(size, size, 1);
            if (alwaysOnTop) spr.renderOrder = 1000;
            spr.userData = { c, tex };
            drawBadge(spr, text, color);
            return spr;
        }
        
        function drawBadge(spr, text, color) {

            ctx.fillStyle = color;

            ctx.arc(64, 64, 58, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 6;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 76px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 64, 70);

        // 4. 물리량 화살표 표시 (ThickArrow 클래스)
        // =====================================================
        class ThickArrow {
            constructor(color, shaftR, headR, headL, alwaysOnTop = true) {
                this.headL = headL;
                this.group = new THREE.Group();
                this.mat = new THREE.MeshBasicMaterial({ 
                    color, 
                    transparent: true, 
                    opacity: 1, 
                    depthTest: !alwaysOnTop, 
                    depthWrite: !alwaysOnTop 
                });

                const shaftGeo = new THREE.CylinderGeometry(shaftR, shaftR, 1, 16);
                shaftGeo.translate(0, 0.5, 0);
                const headGeo = new THREE.ConeGeometry(headR, 1, 24);
                headGeo.translate(0, 0.5, 0);

                this.shaft = new THREE.Mesh(shaftGeo, this.mat);
                this.head = new THREE.Mesh(headGeo, this.mat);
                
                if (alwaysOnTop) {
                    this.shaft.renderOrder = 999;
                    this.head.renderOrder = 999;
                }
                
                this.group.add(this.shaft, this.head);
            }
            set(origin, dir, length) {
                this.group.position.copy(origin);
                this.group.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
                const hl = Math.min(this.headL, length * 0.5);
                this.shaft.scale.set(1, Math.max(0.001, length - hl), 1);
                this.head.position.y = length - hl;
                this.head.scale.set(1, hl, 1);
            }
            setVisible(v) { this.group.visible = v; }
            setOpacity(a) { this.mat.opacity = a; }
        }

        let derived = {};
        function derive() {
            const dI = isPowerReversed ? -1 : 1; 
            const dB = isMagnetReversed ? -1 : 1; 
            const I = voltage / resistance;
            const B = (magnetType === 'neodymium') ? 1.25 : 0.50;
            const F = I * 0.2 * B; 
            derived = { dI, dB, dF: dI * dB, I, B, F };
        }

        const el = (id) => document.getElementById(id);

        function refreshUI() {
            derive();
            const d = derived;
            const on = isPowerOn;

            el('val-power-state').innerText = on ? 'ON' : 'OFF';
            el('val-power-state').style.color = on ? '#34c759' : '#ff3b30';
            el('val-voltage').innerText = voltage.toFixed(1) + ' V';
            el('val-current').innerText = (on ? d.I : 0).toFixed(2) + ' A';
            el('val-bfield').innerText = d.B.toFixed(2) + ' T';
            el('val-force').innerText = (on ? d.F : 0).toFixed(2) + ' N';

            el('hint').innerText = on ? '그네가 힘 방향으로 움직입니다.' : '전원을 켜면 전류, 자기장, 힘의 방향에 따라 그네가 움직입니다.';

            updatePolarityVisual();
            drawPSU();
        }

        const _v = new THREE.Vector3();
        const _d = new THREE.Vector3();

        function updateArrows() {
            const d = derived;
            const on = isPowerOn;
            
            // 1. 메인 씬 화살표
            arrowI.setVisible(showI && on);
            badgeI.visible = showI && on;
            
            arrowB.setVisible(showB);
            badgeB.visible = showB;
            
            arrowF.setVisible(showF && on);
            badgeF.visible = showF && on;

            arrowI.set(_v.set(-0.55 * d.dI, -WIRE_LEN, 0), _d.set(d.dI, 0, 0), 1.1);
            badgeI.position.set(0.82 * d.dI, -WIRE_LEN, 0);

            arrowB.set(_v.set(0.27, MAG_Y - 0.65 * d.dB, 0.2), _d.set(0, d.dB, 0), 1.3);
            badgeB.position.set(0.27, MAG_Y + 0.87 * d.dB, 0.2);

            const th = currentSwingAngle;
            const rodY = BAR_Y - WIRE_LEN * Math.cos(th);
            const rodZ = WIRE_LEN * Math.sin(th);
            const lenF = Math.min(1.3, 0.45 + 0.5 * d.F);
            arrowF.set(_v.set(-0.2, rodY, rodZ), _d.set(0, 0, d.dF), lenF);
            badgeF.position.set(-0.2, rodY, rodZ + d.dF * (lenF + 0.22));

            // 2. 미니 씬 3D 손 애니메이션 및 방향 업데이트
            if (typeof handGroup !== 'undefined') {
                const alpha = on ? 1.0 : 0.25;
                handArrowI.setOpacity(alpha); badgeHandI.material.opacity = alpha;
                handArrowF.setOpacity(alpha); badgeHandF.material.opacity = alpha;
                
                // 오른손 법칙 조합에 따른 X,Y,Z 회전 매핑
                let rotX = 0, rotY = 0, rotZ = 0;
                if (d.dI > 0 && d.dB > 0) { rotX = 0; rotY = 0; rotZ = 0; }
                if (d.dI < 0 && d.dB > 0) { rotX = 0; rotY = Math.PI; rotZ = 0; }
                if (d.dI > 0 && d.dB < 0) { rotX = Math.PI; rotY = 0; rotZ = 0; }
                if (d.dI < 0 && d.dB < 0) { rotX = 0; rotY = 0; rotZ = Math.PI; }
                
                // 애니메이션 Slerp 부드러운 전환을 위해 Quaternion 사용
                const targetQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(rotX, rotY, rotZ));
                handGroup.quaternion.slerp(targetQuat, 0.1);
            }
        }

                const hw = handContainer.clientWidth;
                const hh = handContainer.clientHeight;
                if(hw && hh) {
                    handCamera.aspect = hw / hh;
                    handCamera.updateProjectionMatrix();
                    handRenderer.setSize(hw, hh);
                }
            }
        });

        // =====================================================
        // 8. 메인 렌더 애니메이션 루프
        // =====================================================
        let lastAngleText = '';

        function animate() {
            requestAnimationFrame(animate);

            const target = isPowerOn ? 0.3 * Math.tanh((derived.F * derived.dF * 0.25) / 0.3) : 0;
            const acc = (target - currentSwingAngle) * springK;
            swingVelocity = (swingVelocity + acc) * damping;
            currentSwingAngle += swingVelocity;
            swingPivot.rotation.x = -currentSwingAngle;

            updateArrows();

            const angleText = (currentSwingAngle * 180 / Math.PI).toFixed(1) + '°';
            if (angleText !== lastAngleText) {
                el('val-angle').innerText = angleText;
                lastAngleText = angleText;
            }

            if (viewTween) {
                camera.position.lerp(viewTween.pos, 0.1);
                controls.target.lerp(viewTween.target, 0.1);
                if (camera.position.distanceTo(viewTween.pos) < 0.01 && controls.target.distanceTo(viewTween.target) < 0.01) {
                    viewTween = null;
                }
            }

            controls.update();
            renderer.render(scene, camera);

            // 가이드 패널이 열려있을 때만 3D 손 캔버스 렌더링 최적화
            if (righthandPanel.classList.contains('show')) {
                handControls.update();
                handRenderer.render(handScene, handCamera);
            }
        }

        updateMagnetVisuals();
        refreshUI();
        animate();
    </script>
</body>
</html>
