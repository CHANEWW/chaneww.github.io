<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>가상실험실 3D 템플릿</title>
<style>
@font-face{font-family:'SeoulNamsanL';src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanL.woff') format('woff');font-weight:normal;font-style:normal}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;color:#1c1c1e;background:#f4f7f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","SeoulNamsanL",sans-serif; transition: background 0.3s, color 0.3s;}

/* 3D 캔버스 */
canvas{position:fixed;inset:0;touch-action:none;display:block;z-index:1}

/* visionOS 스타일 비주얼 유리 (Glassmorphism) Card */
.ui-card{background:rgba(255,255,255,0.75);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.8);border-radius:18px;box-shadow:0 8px 32px rgba(0,0,0,0.06);z-index:100;position:fixed; transition: all 0.3s;}

/* 좌측 상단 헤더 영역 */
#top-left-wrap { position:fixed; top:16px; left:20px; display:flex; align-items:stretch; gap:10px; z-index:100; height:42px; }
.back-btn { display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.75); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.8); font-family:inherit; font-size:15px; font-weight:600; color:#111; cursor:pointer; padding:0 18px; border-radius:999px; box-shadow:0 8px 32px rgba(0,0,0,0.06); transition:all .2s; text-decoration:none; }
.back-btn:hover { background:rgba(255,255,255,0.9); transform:translateY(-1px); }
#header { position:relative; top:0; left:0; display:flex; align-items:center; gap:10px; padding:0 18px; border-radius:999px; }
.title-text{font-size:15px;font-weight:600;color:#111}
.badge-tag{background:#e8f0fe;color:#3b82f6;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}

/* 우측 상단 야간모드 토글 버튼 */
#bTheme{top:16px;right:20px;padding:8px 16px;border:none;font-weight:700;color:#333;cursor:pointer;font-size:13px;transition:background .2s; border-radius:999px;}
#bTheme:hover{background:rgba(0,0,0,0.05)}

/* 야간(다크) 모드 스타일 */
body.dark { background: #1c1c1e; color: #fff; }
body.dark .ui-card { background: rgba(40,40,40,0.75); border: 1px solid rgba(255,255,255,0.1); box-shadow:0 8px 32px rgba(0,0,0,0.4); }
body.dark .title-text { color: #fff; }
body.dark .back-btn { background: rgba(40,40,40,0.75); color: #fff; box-shadow: 0 8px 32px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); }
body.dark .back-btn:hover { background: rgba(60,60,60,0.85); }
body.dark #bTheme { color: #eee; }
body.dark #bTheme:hover { background: rgba(255,255,255,0.1); }
body.dark .cbtn { background: rgba(60,60,60,0.8); color: #eee; }
body.dark .cbtn:hover { background: #555; }
body.dark #boardHelp { background: rgba(40,40,40,0.78); color:#aaa; }

/* 중앙 상단 힌트 안내창 */
#hint{top:12%;left:50%;transform:translate(-50%, -50%);padding:12px 24px;font-size:14px;font-weight:700;color:#fff;background:rgba(0,0,0,0.72);border-radius:999px;pointer-events:none;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,0.15);transition:opacity 0.3s ease;z-index:1000;position:fixed;}

#boardHelp{position:fixed;right:20px;bottom:80px;z-index:5;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.78);color:#64748b;font-size:12px;pointer-events:none}

/* 하단 컨트롤 바 */
#bar{bottom:20px;left:50%;transform:translateX(-50%);padding:10px 20px;display:flex;gap:12px;align-items:center;justify-content:center;border-radius:999px;}
.cbtn{border:none;background:rgba(255,255,255,0.8);color:#333;border-radius:999px;padding:8px 18px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:0 2px 8px rgba(0,0,0,0.05);transition:all .2s; white-space:nowrap;}
.cbtn:hover{background:#fff;transform:translateY(-1px)}
.cbtn:active{transform:scale(0.96)}

@media(max-width:768px){
  #top-left-wrap { left:12px; gap:8px; height:38px; }
  .back-btn { padding:0 14px; font-size:13px; }
  #header { padding:0 14px; }
  .title-text{font-size:13px}
  #hint{display:none}
  #boardHelp{display:none}
}

        /* Bottom Right Bar (Fullscreen) */
        .bottom-right-bar {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }
        button.back-btn, button.tag-badge {
            font-family: inherit;
            border: none;
        }
        @media (max-width: 768px) {
            .bottom-right-bar {
                bottom: 15px;
                right: 15px;
            }
        }
    </style>
</head>
<body>

<!-- 상단 헤더 영역 -->
<div id="top-left-wrap">
  <a href="/index.html" class="back-btn">⬅ 메인</a>
  <div id="header" class="ui-card">
    <span class="title-text">가상실험실 3D</span>
    <span class="badge-tag">visionOS</span>
  </div>
</div>

<!-- 우측 상단 야간/주간 모드 토글 버튼 -->
<button id="bTheme" class="ui-card">🌙 야간 모드</button>

<!-- 중앙 안내 힌트 -->
<div id="hint">💡 마우스/터치 드래그로 3D 화면을 회전하고 확대/축소하세요</div>
<div id="boardHelp">빈 공간 드래그: 화면 회전 · 휠/핀치: 확대/축소</div>

<!-- 하단 컨트롤 바 -->
<div id="bar" class="ui-card">
  <button class="cbtn" id="bRst">🔄 초기화</button>
  <button class="cbtn" id="bCam">🎥 시점정렬</button>
</div>

<!-- Three.js 3D 엔진 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Fullscreen / Windowed Mode Button -->
    <div class="bottom-right-bar">
        <button id="fullscreenBtn" class="back-btn">
            <span id="fullscreenIcon">⛶</span>
            <span id="fullscreenText">전체화면</span>
        </button>
    </div>

    <script>
const $=s=>document.querySelector(s);

/* ----------------------------------------------------
   1. Three.js 3D 씬, 카메라, 조명 초기 설정
   ---------------------------------------------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const cv = renderer.domElement;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
let yaw = 0, pitch = 0.75, dist = 16;

function updateCam() {
  camera.position.set(dist * Math.sin(yaw) * Math.cos(pitch), dist * Math.sin(pitch), dist * Math.cos(yaw) * Math.cos(pitch) + 0.3);
  camera.lookAt(0, 0.5, 0);
}

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

/* 조명 시스템 */
const hemiLight = new THREE.HemisphereLight(0xffffff, 0xdde3ea, 1.1);
scene.add(hemiLight);

const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(6, 14, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 1, far: 35 });
sun.shadow.radius = 3;
scene.add(sun);

/* 깔끔한 매끄러운 흰색 실험 바닥판 (Grid 및 테두리 제거) */
const boardMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.85, metalness: 0.05 });
const board = new THREE.Mesh(new THREE.PlaneGeometry(16, 10), boardMat);
board.rotation.x = -Math.PI / 2;
board.position.set(0, 0, 0);
board.receiveShadow = true;
scene.add(board);

/* ----------------------------------------------------
   2. 다크모드 테마 제어
   ---------------------------------------------------- */
let isDark = false;
$('#bTheme').addEventListener('click', () => {
  isDark = !isDark;
  document.body.classList.toggle('dark', isDark);
  $('#bTheme').innerHTML = isDark ? '☀️ 주간 모드' : '🌙 야간 모드';
  
  boardMat.color.setHex(isDark ? 0x1e293b : 0xffffff);
  hemiLight.intensity = isDark ? 0.3 : 1.1;
  sun.intensity = isDark ? 0.4 : 0.9;
});

/* ----------------------------------------------------
   3. 사용자 조작 (카메라 회전 & 줌)
   ---------------------------------------------------- */
let orbit = false, activePointer = null;
let isPinching = false, pinchDist = 0, pinchStartCamDist = 16;

cv.addEventListener('wheel', e => {
  e.preventDefault();
  dist = Math.max(6, Math.min(35, dist + e.deltaY * 0.02));
  updateCam();
}, { passive: false });

cv.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    isPinching = true;
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchDist = Math.hypot(dx, dy);
    pinchStartCamDist = dist;
  }
}, { passive: false });

cv.addEventListener('touchmove', e => {
  if (e.touches.length === 2 && pinchDist > 0) {
    e.preventDefault();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const currentDist = Math.hypot(dx, dy);
    dist = Math.max(6, Math.min(35, pinchStartCamDist * (pinchDist / currentDist)));
    updateCam();
  }
}, { passive: false });

cv.addEventListener('touchend', () => { isPinching = false; pinchDist = 0; });
cv.addEventListener('contextmenu', e => e.preventDefault());

cv.addEventListener('pointerdown', e => {
  if (e.target !== cv) return;
  activePointer = e.pointerId;
  cv.setPointerCapture?.(e.pointerId);
  orbit = true;
});

cv.addEventListener('pointermove', e => {
  if (isPinching || !orbit) return;
  if (activePointer !== null && e.pointerId !== activePointer) return;
  yaw -= (e.movementX || 0) * 0.005;
  pitch = Math.max(0.15, Math.min(1.4, pitch + (e.movementY || 0) * 0.005));
  updateCam();
});

function finishPointer(e) {
  if (activePointer !== null && e.pointerId !== activePointer) return;
  orbit = false; activePointer = null;
}
cv.addEventListener('pointerup', finishPointer);
cv.addEventListener('pointercancel', finishPointer);

/* ----------------------------------------------------
   4. 버튼 연동 & 메인 렌더링 루프
   ---------------------------------------------------- */
$('#bRst').onclick = () => {
  // 추후 가상실험 요소 추가 시 초기화 로직 구현
};

$('#bCam').onclick = () => {
  yaw = 0; pitch = 0.75; dist = 16;
  updateCam();
};

function simulate() {
  // 시뮬레이션 알고리즘 구현 공간
}

function frame() {
  requestAnimationFrame(frame);
  simulate();
  renderer.render(scene, camera);
}

$('#bCam').click();
frame();

        /* ---------- Fullscreen / Windowed Mode Logic ---------- */
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const fullscreenIcon = document.getElementById('fullscreenIcon');
        const fullscreenText = document.getElementById('fullscreenText');

        function updateFullscreenUI() {
            const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
            if (fullscreenIcon) fullscreenIcon.innerText = isFS ? '🗗' : '⛶';
            if (fullscreenText) fullscreenText.innerText = isFS ? '창모드' : '전체화면';
        }

        if (fullscreenBtn) {
            fullscreenBtn.addEventListener('click', () => {
                try {
                    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                        const req = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
                        if (req) req.call(document.documentElement);
                    } else {
                        const exit = document.exitFullscreen || document.webkitExitFullscreen;
                        if (exit) exit.call(document);
                    }
                } catch (err) {
                    console.error('전체화면 모드를 전환할 수 없습니다:', err);
                }
            });
        }

        document.addEventListener('fullscreenchange', updateFullscreenUI);
        document.addEventListener('webkitfullscreenchange', updateFullscreenUI);
    </script>
</body>
</html>
