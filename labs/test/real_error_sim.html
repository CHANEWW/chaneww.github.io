<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>현실 오차 시뮬레이션 | Science Virtual LAB</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">

<style>
@font-face{
    font-family:'SeoulNamsan';
    src:local('SeoulNamsan M'),local('SeoulNamsanM'),local('서울남산체 M'),
        url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff') format('woff');
    font-weight:400;font-style:normal;font-display:swap;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
    --bg:#eef2f7; --ink:#14181f; --muted:#64748b; --line:rgba(15,23,42,.10);
    --card:rgba(255,255,255,.92); --solid:#fff; --accent:#0a84ff; --soft:rgba(10,132,255,.12);
    --ok:#10b981; --warn:#f59e0b; --danger:#ef4444; --shadow:0 10px 30px rgba(15,23,42,.10);
}
body.dark{
    --bg:#0e121c; --ink:#eef3fb; --muted:#94a3b8; --line:rgba(255,255,255,.13);
    --card:rgba(26,32,45,.92); --solid:#1a2130; --accent:#4aa3ff; --soft:rgba(74,163,255,.18);
    --ok:#34d399; --shadow:0 10px 30px rgba(0,0,0,.5);
}
html,body{margin:0;padding:0;width:100%;height:100%}
body{
    font-family:'SeoulNamsan',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:var(--ink); background:var(--bg); overflow:hidden; transition:background .3s ease,color .3s ease;
}
.top-nav{
    position:fixed; top:0; left:0; right:0; height:60px; display:flex; align-items:center; gap:10px;
    padding:0 250px 0 16px; z-index:100; background:var(--card);
    backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-bottom:1px solid var(--line);
}
.back-btn{
    display:inline-flex; align-items:center; gap:6px; padding:7px 14px; font-family:inherit; font-size:13px;
    font-weight:800; color:inherit; text-decoration:none; border:1px solid var(--line); border-radius:999px;
    background:var(--solid); transition:transform .16s ease; white-space:nowrap;
}
.back-btn:hover{transform:translateY(-1px)}
.page-title{display:flex; align-items:center; gap:8px; font-size:14.5px; font-weight:800; letter-spacing:-.2px; min-width:0}
.page-title .t{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pill-badge{padding:3px 9px; border-radius:999px; font-size:10.5px; font-weight:800; background:var(--soft); color:var(--accent); white-space:nowrap; flex:0 0 auto}
.top-right-bar{
    position:fixed !important; top:15px !important; right:20px !important;
    display:flex !important; flex-direction:column; align-items:flex-end; gap:8px; z-index:130 !important; pointer-events:none;
}
.top-right-bar > .tr-util{display:flex !important; flex-direction:row; align-items:center; gap:8px; pointer-events:auto}
#bTheme{
    display:inline-flex; align-items:center; justify-content:center; gap:6px; height:40px; padding:0 15px;
    border-radius:20px; cursor:pointer; font-family:inherit; font-size:12.5px; font-weight:800; color:inherit;
    border:1px solid var(--line); background:var(--card); box-shadow:var(--shadow);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); white-space:nowrap; transition:transform .16s ease;
}
#bTheme:hover{transform:translateY(-1px)}

.app{position:fixed; top:60px; left:0; right:0; bottom:0; overflow-y:auto; padding:12px 16px 26px}
.wrap{max-width:1180px; margin:0 auto}

.toolbar{
    display:flex; align-items:center; gap:9px; flex-wrap:wrap; padding:10px 12px; border-radius:18px;
    background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow); margin-bottom:12px;
}
.seg{display:inline-flex; padding:3px; border-radius:12px; background:var(--solid); border:1px solid var(--line); gap:3px}
.seg button{
    border:none; background:transparent; color:inherit; font-family:inherit; font-size:12.5px; font-weight:900;
    padding:8px 12px; border-radius:9px; cursor:pointer; white-space:nowrap; transition:background .16s ease,color .16s ease;
}
.seg button.on{background:var(--accent); color:#fff; box-shadow:0 6px 14px rgba(10,132,255,.28)}
.btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:9px 14px; border-radius:12px;
    border:none; cursor:pointer; font-family:inherit; font-size:12.5px; font-weight:900; color:#fff;
    background:var(--accent); box-shadow:0 8px 18px rgba(10,132,255,.24); transition:transform .16s ease; white-space:nowrap;
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line); box-shadow:none}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none}

.toggles{display:flex; gap:6px; flex-wrap:wrap; margin-left:auto}
.tg{
    display:inline-flex; align-items:center; gap:6px; padding:7px 11px; border-radius:999px; cursor:pointer;
    border:1px solid var(--line); background:var(--solid); font-size:11.5px; font-weight:900; color:var(--muted);
    user-select:none; white-space:nowrap; transition:all .16s ease;
}
.tg .dot{width:9px; height:9px; border-radius:50%; background:rgba(120,140,170,.5); transition:background .16s ease}
.tg.on{color:var(--ink); border-color:rgba(10,132,255,.45); background:var(--soft)}
.tg.on .dot{background:var(--accent)}
.tg.on.warm{border-color:rgba(239,68,68,.4); background:rgba(239,68,68,.10)}
.tg.on.warm .dot{background:#ef4444}

.layout{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:12px; align-items:start}
.stage-card{
    position:relative; border-radius:22px; border:1px solid var(--line); background:var(--card);
    box-shadow:var(--shadow); overflow:hidden; height:min(58vh,510px); min-height:340px;
}
#stage{display:block; width:100%; height:100%; touch-action:none}
.legend{
    position:absolute; left:12px; top:10px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;
    padding:6px 11px; border-radius:999px; background:rgba(255,255,255,.84); border:1px solid var(--line);
    font-size:11px; font-weight:900; box-shadow:0 4px 12px rgba(15,23,42,.08); max-width:calc(100% - 24px);
}
body.dark .legend{background:rgba(24,31,45,.86)}
.legend i{display:inline-block; width:16px; height:0; border-top:3px dashed #0a84ff; vertical-align:middle; margin-right:5px}
.legend i.solid{border-top:3px solid #f59e0b; border-top-style:solid}
.side{display:flex; flex-direction:column; gap:10px; min-width:0}
.card{border-radius:18px; border:1px solid var(--line); background:var(--card); box-shadow:var(--shadow); padding:13px 14px}
.card h3{margin:0 0 9px; font-size:12.5px; font-weight:900; display:flex; align-items:center; gap:6px}
.kv{display:flex; align-items:baseline; justify-content:space-between; gap:8px; padding:5px 0; font-size:12px; font-weight:800; color:var(--muted)}
.kv b{font-size:14px; font-weight:900; color:var(--ink); font-variant-numeric:tabular-nums}
.kv.theory b{color:#0a84ff}
.kv.real b{color:#d97706}
.kv.err b{color:#dc2626; font-size:16px}
body.dark .kv.theory b{color:#7dd3fc}
body.dark .kv.real b{color:#fbbf24}
body.dark .kv.err b{color:#f87171}
.bar-row{display:flex; align-items:center; gap:7px; margin:7px 0; font-size:10.5px; font-weight:900; color:var(--muted)}
.bar-row span{width:74px; flex:0 0 auto}
.bar-row .track{flex:1 1 auto; height:8px; border-radius:999px; background:rgba(120,140,170,.20); overflow:hidden}
.bar-row .track i{display:block; height:100%; border-radius:999px; width:0; transition:width .5s ease}
.bar-row .track i.phys{background:linear-gradient(90deg,#f59e0b,#ef4444)}
.bar-row .track i.meas{background:linear-gradient(90deg,#0ea5e9,#6366f1)}
.bar-row b{width:44px; text-align:right; font-variant-numeric:tabular-nums; color:var(--ink); font-size:11px}
.tip{margin:8px 0 0; font-size:11.5px; font-weight:700; line-height:1.55; color:var(--muted)}
.tip b{color:var(--ink)}
.ctrl{border-radius:18px; border:1px solid var(--line); background:var(--card); box-shadow:var(--shadow); padding:11px 14px; margin-top:10px}
.ctrl-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:4px 0}
.ctrl-row label{font-size:11.5px; font-weight:900; color:var(--muted); min-width:74px}
.ctrl-row input[type=range]{flex:1 1 140px; min-width:110px; accent-color:var(--accent); height:22px}
.val{font-size:12.5px; font-weight:900; min-width:76px; text-align:right; font-variant-numeric:tabular-nums}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{
    border:1px solid var(--line); background:var(--solid); color:inherit; font-family:inherit; font-size:11.5px;
    font-weight:900; padding:7px 11px; border-radius:10px; cursor:pointer; white-space:nowrap;
}
.chip.on{background:var(--accent); color:#fff; border-color:transparent}

#btn-fullscreen{
    position:fixed; right:20px; bottom:calc(18px + env(safe-area-inset-bottom,0px)); z-index:95;
    display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:9px 16px; border-radius:999px;
    border:1px solid var(--line); background:var(--card); box-shadow:0 8px 24px rgba(15,23,42,.16);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    color:inherit; font-family:inherit; font-size:12.5px; font-weight:800; white-space:nowrap; cursor:pointer;
    transition:transform .18s ease;
}
#btn-fullscreen:hover{transform:translateY(-1px)}
body.pseudo-fullscreen .top-nav{transform:translateY(-100%); opacity:0; pointer-events:none}
body.pseudo-fullscreen .app{top:0}
body.pseudo-fullscreen #feedback-btn,body.pseudo-fullscreen .svl-fb-btn{display:none !important}
.fs-toast{
    position:fixed; left:50%; bottom:calc(74px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,8px);
    z-index:2050; max-width:86vw; padding:10px 16px; border-radius:14px; background:rgba(28,28,30,.92);
    color:#fff; font-size:12.5px; font-weight:700; line-height:1.45; text-align:center;
    box-shadow:0 10px 26px rgba(0,0,0,.3); opacity:0; pointer-events:none; transition:opacity .26s ease, transform .26s ease;
}
.fs-toast.show{opacity:1; transform:translate(-50%,0)}

@media (max-width:900px){
    .top-nav{height:52px; padding:0 12px; gap:8px}
    .page-title{font-size:12.5px}
    .back-btn{padding:6px 11px; font-size:12px}
    .top-right-bar{top:calc(max(8px,env(safe-area-inset-top)) + 48px) !important; right:8px !important}
    #bTheme{height:34px; padding:0 11px; font-size:11.5px}
    .app{top:100px; padding:8px 10px 64px}
    .layout{grid-template-columns:minmax(0,1fr)}
    .stage-card{height:min(42vh,340px); min-height:270px}
    .side{order:2}
    .toolbar{padding:8px 9px; gap:7px}
    .seg button{padding:7px 9px; font-size:11px}
    .btn{padding:8px 11px; font-size:11.5px}
    .toggles{margin-left:0; width:100%}
    .tg{font-size:10.5px; padding:6px 9px}
    .ctrl{padding:9px 11px}
    .ctrl-row label{min-width:62px; font-size:11px}
    .val{min-width:64px; font-size:11.5px}
    #btn-fullscreen{bottom:calc(10px + env(safe-area-inset-bottom,0px)); right:10px; padding:8px 13px; font-size:12px}
}
@media (max-height:520px) and (orientation:landscape){
    .stage-card{height:min(70vh,280px); min-height:210px}
}
</style>
</head>
<body>

<nav class="top-nav">
    <a href="../../index.html" class="back-btn" onclick="var r=document.referrer;if(history.length>1&&r&&r.indexOf(location.origin+'/')===0&&/(\/|index(_3d)?\.html)(\?|#|$)/.test(r)){history.back();return false;}"><span>⬅</span> 메인</a>
    <div class="page-title"><span class="t">현실 오차 시뮬레이션</span><span class="pill-badge">확장 기능</span></div>
</nav>

<div class="top-right-bar">
    <div class="tr-util">
        <button id="bTheme" type="button">🌙 야간 모드</button>
    </div>
</div>

<div class="app">
<div class="wrap">

    <div class="toolbar">
        <div class="seg" id="modeSeg">
            <button type="button" data-m="fall" class="on">🍎 자유 낙하</button>
            <button type="button" data-m="pend">⏱️ 진자</button>
            <button type="button" data-m="proj">⚽ 수평 투사</button>
        </div>
        <button class="btn" id="btnRun" type="button">▶ 실험 시작</button>
        <button class="btn ghost" id="btnReset" type="button">🔄 초기화</button>
        <div class="toggles">
            <span class="tg on" id="tgAir" data-k="air"><span class="dot"></span>공기저항</span>
            <span class="tg on warm" id="tgFric" data-k="fric"><span class="dot"></span>마찰</span>
            <span class="tg on warm" id="tgMeas" data-k="meas"><span class="dot"></span>측정 눈금·반응 오차</span>
        </div>
    </div>

    <div class="layout">
        <div>
            <div class="stage-card">
                <canvas id="stage"></canvas>
                <div class="legend">
                    <span><i></i>이상적 이론값</span>
                    <span><i class="solid"></i>현실 오차값</span>
                </div>
            </div>
            <div class="ctrl" id="ctrlFall">
                <div class="ctrl-row">
                    <label>떨어뜨릴 높이</label>
                    <input type="range" id="fH" min="1" max="20" step="0.5" value="5">
                    <span class="val" id="fHV">5.0 m</span>
                </div>
                <div class="ctrl-row">
                    <label>물체</label>
                    <div class="chips" id="objChips">
                        <button type="button" class="chip" data-o="feather">🪶 깃털</button>
                        <button type="button" class="chip" data-o="paper">📄 종이</button>
                        <button type="button" class="chip on" data-o="tennis">🎾 테니스공</button>
                        <button type="button" class="chip" data-o="steel">⚙️ 쇠구슬</button>
                    </div>
                </div>
            </div>
            <div class="ctrl" id="ctrlPend" hidden>
                <div class="ctrl-row">
                    <label>실의 길이</label>
                    <input type="range" id="pL" min="0.3" max="2" step="0.05" value="1">
                    <span class="val" id="pLV">1.00 m</span>
                </div>
                <div class="ctrl-row">
                    <label>흔든 각도</label>
                    <input type="range" id="pA" min="5" max="40" step="1" value="15">
                    <span class="val" id="pAV">15°</span>
                </div>
            </div>
            <div class="ctrl" id="ctrlProj" hidden>
                <div class="ctrl-row">
                    <label>던지는 높이</label>
                    <input type="range" id="rH" min="1" max="20" step="0.5" value="5">
                    <span class="val" id="rHV">5.0 m</span>
                </div>
                <div class="ctrl-row">
                    <label>수평 속력</label>
                    <input type="range" id="rV" min="2" max="15" step="0.5" value="8">
                    <span class="val" id="rVV">8.0 m/s</span>
                </div>
            </div>
        </div>

        <aside class="side">
            <section class="card">
                <h3 id="resTitle">📊 비교 결과</h3>
                <div class="kv theory"><span id="kTheoryL">이론값</span><b id="kTheory">—</b></div>
                <div class="kv real"><span id="kRealL">실험값</span><b id="kReal">—</b></div>
                <div class="kv err"><span>오차율</span><b id="kErr">—</b></div>
                <div style="margin-top:8px">
                    <div class="bar-row"><span>물리 모델</span><span class="track"><i class="phys" id="barPhys"></i></span><b id="valPhys">0%</b></div>
                    <div class="bar-row"><span>측정 오차</span><span class="track"><i class="meas" id="barMeas"></i></span><b id="valMeas">0%</b></div>
                </div>
                <p class="tip" id="tip">토글을 모두 끄면 실험값이 이론값과 똑같아져요.</p>
            </section>

            <section class="card">
                <h3>🔍 지금 켜진 오차 요인</h3>
                <p class="tip" id="factorTxt" style="margin-top:0">공기저항 · 마찰 · 측정 눈금 오차가 모두 켜져 있어요.</p>
            </section>
        </aside>
    </div>

</div>
</div>

<button id="btn-fullscreen" type="button" aria-pressed="false" aria-label="전체화면으로 전환">
    <span class="fs-icon" id="fsIcon">⛶</span><span class="fs-text" id="fsText">전체화면</span>
</button>

<script>
/* ==========================================================
   현실 오차 시뮬레이션 실험실
   - 이상적 이론값(공기저항·마찰·측정오차 없음)과
     현실 오차값을 같은 무대에 겹쳐 그려 오차율(%)을 비교한다.
   ========================================================== */
(function () {
    'use strict';
    var $ = function (s) { return document.querySelector(s); };
    var cv = $('#stage'), ctx = cv.getContext('2d');
    var W = 900, H = 460, DPR = 1;
    var FONT = "'SeoulNamsan', -apple-system, 'Apple SD Gothic Neo', sans-serif";
    var G = 9.81, RHO = 1.225;

    var OBJ = {
        feather: { n: '깃털', m: 0.001, A: 0.004, Cd: 1.30, c: '#cbd5e1' },
        paper: { n: '종이', m: 0.005, A: 0.006, Cd: 1.20, c: '#e2e8f0' },
        tennis: { n: '테니스공', m: 0.057, A: 0.0033, Cd: 0.55, c: '#fde68a' },
        steel: { n: '쇠구슬', m: 0.200, A: 0.0028, Cd: 0.47, c: '#94a3b8' }
    };

    var st = {
        m: 'fall',
        air: true, fric: true, meas: true,
        fall: { h: 5, obj: 'tennis', t: 0, run: 0, idealT: 0, realT: 0, measT: 0 },
        pend: { L: 1, amp: 15, t: 0, run: 0, idealT: 0, realT: 0, measT: 0, periods: 0 },
        proj: { h: 5, v: 8, t: 0, run: 0, idealX: 0, realX: 0, measX: 0 }
    };

    function resize() {
        var box = cv.parentElement.getBoundingClientRect();
        W = Math.max(300, box.width);
        H = Math.max(250, box.height);
        DPR = Math.min(2, window.devicePixelRatio || 1);
        cv.width = Math.round(W * DPR);
        cv.height = Math.round(H * DPR);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    function dark() { return document.body.classList.contains('dark'); }
    function bg() {
        var g = ctx.createLinearGradient(0, 0, 0, H);
        if (dark()) { g.addColorStop(0, '#121a28'); g.addColorStop(1, '#0a0f18'); }
        else { g.addColorStop(0, '#fbfdff'); g.addColorStop(1, '#e8eff7'); }
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
    }
    function roundRect(x, y, w, h, r) {
        r = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }
    function noise(a) { return (Math.random() * 2 - 1) * a; }

    /* ---------- 물리 계산 ---------- */
    function fallSim(h, obj, drag) {
        var o = OBJ[obj];
        var k = 0.5 * RHO * o.Cd * o.A;
        var dt = 0.0005, t = 0, y = h, v = 0;
        var trail = [];
        while (y > 0 && t < 60) {
            var a = drag ? G - (k / o.m) * v * v : G;
            v += a * dt;
            y -= v * dt;
            t += dt;
            if (trail.length < 400 && Math.round(t / dt) % 40 === 0) trail.push({ t: t, y: Math.max(0, y), v: v });
        }
        return { t: t, v: v, trail: trail };
    }
    function pendSim(L, ampDeg, fric) {
        var amp = ampDeg * Math.PI / 180;
        var T0 = 2 * Math.PI * Math.sqrt(L / G);
        // 유한 진폭 보정: T = T0 (1 + θ²/16 + 11θ⁴/3072)
        var corr = 1 + amp * amp / 16 + 11 * Math.pow(amp, 4) / 3072;
        var T = fric ? T0 * corr * 1.004 : T0 * corr;
        return { T0: T0, T: T, corr: corr };
    }
    function projSim(h, v0, drag) {
        var o = OBJ.tennis, k = 0.5 * RHO * o.Cd * o.A;
        var dt = 0.0005, t = 0, x = 0, y = h, vx = v0, vy = 0;
        var pts = [];
        while (y > 0 && t < 60) {
            var sp = Math.hypot(vx, vy);
            var ax = drag ? -(k / o.m) * sp * vx : 0;
            var ay = G - (drag ? (k / o.m) * sp * vy : 0);
            vx += ax * dt;
            vy += ay * dt;
            x += vx * dt;
            y -= vy * dt;
            t += dt;
            if (pts.length < 900 && Math.round(t / dt) % 40 === 0) pts.push({ x: x, y: Math.max(0, y) });
        }
        return { t: t, x: x, pts: pts };
    }

    function fallSamples(h, obj, drag) {
        var o = OBJ[obj], k = 0.5 * RHO * o.Cd * o.A;
        var dt = 0.004, t = 0, y = h, v = 0;
        var arr = [{ t: 0, y: h, v: 0 }];
        while (y > 0 && t < 60) {
            var a = drag ? G - (k / o.m) * v * v : G;
            v += a * dt;
            y -= v * dt;
            t += dt;
            arr.push({ t: t, y: Math.max(0, y), v: v });
        }
        return arr;
    }
    function sampleAt(arr, t) {
        if (!arr || !arr.length) return { y: 0, v: 0 };
        if (t <= 0) return arr[0];
        var lastA = arr[arr.length - 1];
        if (t >= lastA.t) return lastA;
        var di = Math.min(arr.length - 2, Math.floor(t / 0.004));
        var a = arr[di], b = arr[di + 1];
        var f = (t - a.t) / Math.max(1e-6, (b.t - a.t));
        return { y: a.y + (b.y - a.y) * f, v: a.v + (b.v - a.v) * f };
    }

    /* ---------- 실험 실행 준비 ---------- */
    function prepare() {
        if (st.m === 'fall') {
            var f = st.fall;
            var ideal = fallSim(f.h, f.obj, false);
            var real = fallSim(f.h, f.obj, st.air);
            f.idealT = ideal.t;
            f.realT = real.t;
            f.idealS = fallSamples(f.h, f.obj, false);
            f.realS = fallSamples(f.h, f.obj, st.air);
            f.idealV = Math.sqrt(2 * G * f.h);
            f.realV = real.v;
            f.measT = real.t + (st.meas ? Math.abs(noise(0.07)) : 0);
            f.dur = Math.max(ideal.t, real.t) * 1.18 + 0.35;
            f.t = 0; f.run = 1;
        } else if (st.m === 'pend') {
            var p = st.pend;
            var s = pendSim(p.L, p.amp, st.fric);
            p.idealT = s.T0; p.realT = s.T;
            p.measT = s.T + (st.meas ? Math.abs(noise(0.03)) / 5 : 0);
            p.dur = s.T * 6.2;
            p.t = 0; p.run = 1;
        } else {
            var r = st.proj;
            var ri = projSim(r.h, r.v, false);
            var rr = projSim(r.h, r.v, st.air);
            r.idealX = r.v * Math.sqrt(2 * r.h / G);
            r.realX = rr.x;
            r.measX = rr.x + (st.meas ? Math.abs(noise(0.02)) : 0);
            r.idealPts = ri.pts; r.realPts = rr.pts;
            r.idealT = Math.sqrt(2 * r.h / G);
            r.realT = rr.t;
            r.dur = Math.max(r.idealT, r.realT) * 1.15 + 0.3;
            r.t = 0; r.run = 1;
        }
        updatePanel();
    }

    /* ---------- 패널 ---------- */
    function fmt(v, d) { return (isFinite(v) ? v.toFixed(d) : '—'); }
    function updatePanel() {
        var theory, real, measured, unit, label;
        if (st.m === 'fall') {
            label = '낙하 시간'; unit = 's';
            theory = st.fall.idealT; real = st.fall.realT; measured = st.fall.measT;
            $('#kTheoryL').textContent = '이론값 (낙하 시간)';
            $('#kRealL').textContent = '실험값 (측정 시간)';
        } else if (st.m === 'pend') {
            label = '주기'; unit = 's';
            theory = st.pend.idealT; real = st.pend.realT; measured = st.pend.measT;
            $('#kTheoryL').textContent = '이론값 (주기)';
            $('#kRealL').textContent = '실험값 (측정 주기)';
        } else {
            label = '수평 거리'; unit = 'm';
            theory = st.proj.idealX; real = st.proj.realX; measured = st.proj.measX;
            $('#kTheoryL').textContent = '이론값 (수평 거리)';
            $('#kRealL').textContent = '실험값 (측정 거리)';
        }
        if (!theory) return;
        var errP = Math.abs(real - theory) / theory * 100;
        var errM = Math.abs(measured - real) / theory * 100;
        var errT = Math.abs(measured - theory) / theory * 100;
        $('#kTheory').textContent = fmt(theory, 2) + ' ' + unit;
        $('#kReal').textContent = fmt(measured, 2) + ' ' + unit;
        $('#kErr').textContent = errT.toFixed(1) + ' %';
        var maxE = Math.max(6, errT * 1.25);
        $('#barPhys').style.width = Math.min(100, errP / maxE * 100) + '%';
        $('#barMeas').style.width = Math.min(100, errM / maxE * 100) + '%';
        $('#valPhys').textContent = errP.toFixed(1) + '%';
        $('#valMeas').textContent = errM.toFixed(1) + '%';

        var f = [];
        if (st.m === 'pend' ? st.fric : st.air) f.push(st.m === 'pend' ? '마찰(공기·축)' : '공기저항');
        if (st.meas) f.push('측정 눈금·반응 시간');
        $('#factorTxt').textContent = f.length ? f.join(' · ') + ' 이(가) 켜져 있어요.' : '모든 오차 요인이 꺼져 있어요. 이론값과 실험값이 같아요.';
        var tip = $('#tip');
        if (errT < 0.2) tip.innerHTML = '지금은 이론값과 실험값이 거의 같아요. 오차 요인을 하나씩 켜 보며 <b>어떤 요인이 오차를 키우는지</b> 비교해 보세요.';
        else if (errP > errM) tip.innerHTML = '오차의 대부분은 <b>' + (st.m === 'pend' ? '마찰' : '공기저항') + '</b>에서 왔어요. 실제 실험에서는 이론대로 되지 않는 이유를 생각해 보세요.';
        else tip.innerHTML = '오차의 대부분은 <b>측정(눈금·반응 시간)</b>에서 왔어요. 같은 실험을 여러 번 하면 값이 왜 흔들리는지 알 수 있어요.';
    }

    /* ---------- 그리기 ---------- */
    function drawFall() {
        var f = st.fall, h = f.h;
        var topY = 68, floorY = H - 46, span = floorY - topY;
        var pxPerM = span / Math.max(h, 1);

        // 바닥
        ctx.strokeStyle = dark() ? 'rgba(148,163,184,.45)' : 'rgba(100,116,139,.4)';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(30, floorY); ctx.lineTo(W - 24, floorY); ctx.stroke();

        // 자(ruler)
        var rx = 60;
        ctx.save();
        ctx.strokeStyle = dark() ? 'rgba(148,163,184,.7)' : 'rgba(148,163,184,.9)';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(rx, topY); ctx.lineTo(rx, floorY); ctx.stroke();
        ctx.font = '800 10px ' + FONT;
        ctx.fillStyle = dark() ? '#94a3b8' : '#64748b';
        ctx.textAlign = 'right';
        for (var m = 0; m <= h; m += (h > 10 ? 2 : 1)) {
            var yy = floorY - m * pxPerM;
            ctx.beginPath(); ctx.moveTo(rx - 5, yy); ctx.lineTo(rx + 5, yy); ctx.stroke();
            ctx.fillText(m + 'm', rx - 9, yy + 3);
        }
        ctx.restore();

        var t = f.t;
        var yIdeal = Math.max(0, h - 0.5 * G * t * t);
        var yReal = f.realS ? sampleAt(f.realS, t).y : yIdeal;

        var xI = W * 0.46, xR = W * 0.62;
        // 이상 궤적(점선)
        ctx.save();
        ctx.setLineDash([5, 5]);
        ctx.strokeStyle = 'rgba(10,132,255,.55)';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(xI, topY);
        ctx.lineTo(xI, floorY);
        ctx.stroke();
        ctx.restore();

        // 공
        var ballR = f.obj === 'feather' ? 11 : (f.obj === 'paper' ? 12 : 13);
        drawBall(xI, floorY - yIdeal * pxPerM, ballR, OBJ[f.obj].c, '#0a84ff', false);
        drawBall(xR, floorY - yReal * pxPerM, ballR, OBJ[f.obj].c, '#f59e0b', true);

        // 값 라벨
        ctx.save();
        ctx.font = '900 11px ' + FONT;
        ctx.textAlign = 'center';
        ctx.fillStyle = '#0a84ff';
        ctx.fillText('이론', xI, topY - 12);
        ctx.fillStyle = '#f59e0b';
        ctx.fillText('현실', xR, topY - 12);
        ctx.restore();

        // 이론이 착지한 순간, 현실 공의 위치
        if (f.idealT > 0 && f.realT > f.idealT + 0.02 && t >= f.idealT && f.realS) {
            var yAt = sampleAt(f.realS, f.idealT).y;
            var gy = floorY - yAt * pxPerM;
            ctx.save();
            ctx.setLineDash([4, 4]);
            ctx.strokeStyle = 'rgba(245,158,11,.55)';
            ctx.lineWidth = 1.4;
            ctx.beginPath(); ctx.moveTo(xI + 16, gy); ctx.lineTo(xR + 26, gy); ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = '#b45309';
            ctx.font = '900 10.5px ' + FONT;
            ctx.textAlign = 'left';
            ctx.fillText('이론이 착지한 순간, 현실 공은 ' + yAt.toFixed(1) + ' m 위', xR + 30, gy + 4);
            ctx.restore();
        }
        // 시간 표시
        ctx.save();
        ctx.font = '800 11px ' + FONT;
        ctx.textAlign = 'left';
        ctx.fillStyle = dark() ? '#94a3b8' : '#64748b';
        ctx.fillText('이론 ' + f.idealT.toFixed(2) + ' s · 현실 ' + f.realT.toFixed(2) + ' s', 16, H - 18);
        ctx.restore();
    }
    function drawBall(x, y, r, fill, stroke, real) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = fill;
        ctx.fill();
        ctx.lineWidth = 2.4;
        ctx.strokeStyle = stroke;
        ctx.setLineDash(real ? [] : [4, 3]);
        ctx.stroke();
        ctx.restore();
    }

    function drawPend() {
        var p = st.pend;
        var pivotX = W * 0.5, pivotY = 54;
        var maxLen = H - pivotY - 76;
        var pxPerM = maxLen / Math.max(1.15, p.L * 1.35);
        var Lpx = p.L * pxPerM;
        var t = p.t;
        var amp = p.amp * Math.PI / 180;

        // 천장
        ctx.save();
        ctx.strokeStyle = dark() ? 'rgba(148,163,184,.5)' : 'rgba(148,163,184,.8)';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(pivotX - 90, pivotY); ctx.lineTo(pivotX + 90, pivotY); ctx.stroke();
        ctx.fillStyle = dark() ? '#64748b' : '#94a3b8';
        ctx.beginPath(); ctx.arc(pivotX, pivotY, 5, 0, Math.PI * 2); ctx.fill();
        ctx.restore();

        var thI, thR;
        if (p.run > 0 || p.t > 0) {
            thI = amp * Math.cos(2 * Math.PI * t / p.idealT);
            var damp = st.fric ? Math.exp(-0.035 * t) : 1;
            thR = amp * damp * Math.cos(2 * Math.PI * t / p.realT);
        } else {
            thI = amp; thR = amp;
        }

        // 호(궤적)
        ctx.save();
        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = 'rgba(10,132,255,.35)';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.arc(pivotX, pivotY, Lpx, Math.PI / 2 - amp, Math.PI / 2 + amp);
        ctx.stroke();
        ctx.restore();

        function bob(th, color, fill, real, dashed) {
            var bx = pivotX + Lpx * Math.sin(th);
            var by = pivotY + Lpx * Math.cos(th);
            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = 2.2;
            if (dashed) ctx.setLineDash([5, 4]);
            ctx.beginPath(); ctx.moveTo(pivotX, pivotY); ctx.lineTo(bx, by); ctx.stroke();
            ctx.setLineDash([]);
            ctx.beginPath();
            ctx.arc(bx, by, 12, 0, Math.PI * 2);
            ctx.fillStyle = fill;
            ctx.fill();
            ctx.strokeStyle = color;
            ctx.lineWidth = 2.4;
            ctx.stroke();
            ctx.restore();
            return { x: bx, y: by };
        }
        var bi = bob(thI, 'rgba(10,132,255,.85)', 'rgba(10,132,255,.18)', false, true);
        var br = bob(thR, '#f59e0b', 'rgba(245,158,11,.35)', true, false);

        // 라벨
        ctx.save();
        ctx.font = '800 11px ' + FONT;
        ctx.textAlign = 'left';
        ctx.fillStyle = dark() ? '#94a3b8' : '#64748b';
        ctx.fillText('길이 ' + p.L.toFixed(2) + ' m · 각도 ' + p.amp + '°', 16, H - 20);
        ctx.fillText('이론 주기 ' + p.idealT.toFixed(3) + ' s', 16, H - 40);
        ctx.fillStyle = '#d97706';
        ctx.fillText('현실 주기 ' + p.realT.toFixed(3) + ' s', 16, H - 60);
        ctx.restore();
    }

    function drawProj() {
        var r = st.proj;
        var originX = 76, originY = H - 62;
        var groundY = H - 62;
        var pxPerM = Math.min((W - 150) / Math.max(8, r.v * Math.sqrt(2 * r.h / G) * 1.15), (H - 130) / Math.max(4, r.h));

        // 바닥
        ctx.save();
        ctx.strokeStyle = dark() ? 'rgba(148,163,184,.45)' : 'rgba(100,116,139,.45)';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(20, groundY); ctx.lineTo(W - 16, groundY); ctx.stroke();
        ctx.restore();

        // 발사대
        var topY = groundY - r.h * pxPerM;
        ctx.save();
        ctx.fillStyle = dark() ? '#334155' : '#cbd5e1';
        ctx.fillRect(originX - 8, topY, 16, r.h * pxPerM);
        ctx.fillStyle = dark() ? '#475569' : '#94a3b8';
        roundRect(originX - 20, topY - 6, 40, 8, 3);
        ctx.fill();
        ctx.fillStyle = dark() ? '#94a3b8' : '#64748b';
        ctx.font = '800 10px ' + FONT;
        ctx.textAlign = 'right';
        ctx.fillText(r.h.toFixed(1) + ' m', originX - 26, topY + 4);
        ctx.restore();

        // 궤적
        function poly(pts, color, dashed, width) {
            if (!pts || pts.length < 2) return;
            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.setLineDash(dashed ? [6, 5] : []);
            ctx.beginPath();
            for (var i = 0; i < pts.length; i++) {
                var p = pts[i];
                var x = originX + p.x * pxPerM, y = groundY - p.y * pxPerM;
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();
            ctx.restore();
        }
        var t = r.t;
        function cutoff(pts, tt) {
            var out = [{ x: 0, y: r.h }];
            for (var i = 0; i < pts.length; i++) {
                out.push(pts[i]);
            }
            // 시간 제한
            var dur = Math.max(r.idealT, r.realT);
            var frac = dur ? Math.min(1, tt / dur) : 1;
            return out.slice(0, Math.max(2, Math.ceil(out.length * frac)));
        }
        if (r.run > 0 || r.t > 0) {
            poly(cutoff(r.idealPts || [], t), 'rgba(10,132,255,.85)', true, 2.4);
            poly(cutoff(r.realPts || [], t), '#f59e0b', false, 2.6);
        }

        // 낙하 지점
        function mark(xm, color, label, up) {
            var x = originX + xm * pxPerM;
            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = 2.6;
            ctx.beginPath(); ctx.moveTo(x, groundY); ctx.lineTo(x, groundY - 22 - up); ctx.stroke();
            ctx.fillStyle = color;
            ctx.font = '900 11px ' + FONT;
            ctx.textAlign = 'center';
            ctx.fillText(label, x, groundY - 30 - up);
            ctx.restore();
        }
        if (r.run === 0 && r.t > 0) {
            mark(r.idealX, '#0a84ff', '', 12);
            mark(r.realX, '#d97706', '', 0);
        }

        // 구슬
        var ballX = originX + (r.v * t) * pxPerM;
        var ballY = groundY - Math.max(0, r.h - 0.5 * G * t * t) * pxPerM;
        if (r.run > 0) {
            ctx.save();
            ctx.beginPath(); ctx.arc(ballX, ballY, 9, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(245,158,11,.9)'; ctx.fill();
            ctx.strokeStyle = '#b45309'; ctx.lineWidth = 2; ctx.stroke();
            ctx.restore();
        }

        ctx.save();
        ctx.font = '800 11px ' + FONT;
        ctx.textAlign = 'left';
        ctx.fillStyle = dark() ? '#94a3b8' : '#64748b';
        ctx.fillText('높이 ' + r.h.toFixed(1) + ' m · 수평 속력 ' + r.v.toFixed(1) + ' m/s', 16, H - 40);
        if (r.t > 0 && r.idealX > 0) {
            ctx.fillStyle = '#0a84ff';
            ctx.fillText('이론 ' + r.idealX.toFixed(2) + ' m', 16, H - 22);
            ctx.fillStyle = '#d97706';
            ctx.fillText('  ↗ 현실 ' + r.realX.toFixed(2) + ' m', 92, H - 22);
        }
        ctx.restore();
    }

    function draw() {
        bg();
        if (st.m === 'fall') drawFall();
        else if (st.m === 'pend') drawPend();
        else drawProj();

        var cur = st[st.m];
        if (cur.t > 0) {
            ctx.save();
            ctx.fillStyle = dark() ? 'rgba(30,38,54,.85)' : 'rgba(255,255,255,.9)';
            ctx.strokeStyle = 'rgba(148,163,184,.45)';
            ctx.lineWidth = 1.2;
            roundRect(W - 112, 12, 100, 30, 10);
            ctx.fill(); ctx.stroke();
            ctx.fillStyle = dark() ? '#e2e8f0' : '#0f172a';
            ctx.font = '900 13px ' + FONT;
            ctx.textAlign = 'center';
            ctx.fillText('t = ' + cur.t.toFixed(2) + ' s', W - 62, 32);
            ctx.restore();
        }
    }

    /* ---------- 루프 ---------- */
    var last = 0;
    function loop(ts) {
        var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016;
        last = ts;
        var s = st[st.m];
        if (s.run > 0) {
            s.t += dt;
            if (s.t >= s.dur) { s.t = s.dur; s.run = 0; updatePanel(); }
        }
        draw();
        requestAnimationFrame(loop);
    }

    /* ---------- 이벤트 ---------- */
    $('#modeSeg').addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        st.m = b.dataset.m;
        Array.prototype.forEach.call(this.children, function (x) { x.classList.toggle('on', x === b); });
        $('#ctrlFall').hidden = st.m !== 'fall';
        $('#ctrlPend').hidden = st.m !== 'pend';
        $('#ctrlProj').hidden = st.m !== 'proj';
        resetRun();
        prepare();
    });

    function resetRun() {
        ['fall', 'pend', 'proj'].forEach(function (k) { st[k].t = 0; st[k].run = 0; });
        updatePanel();
    }

    $('#btnRun').addEventListener('click', function () { prepare(); });
    $('#btnReset').addEventListener('click', function () {
        resetRun();
        st.fall = { h: 5, obj: 'tennis', t: 0, run: 0, idealT: 0, realT: 0, measT: 0, idealTrail: [], realTrail: [] };
        st.pend = { L: 1, amp: 15, t: 0, run: 0, idealT: 0, realT: 0, measT: 0 };
        st.proj = { h: 5, v: 8, t: 0, run: 0, idealX: 0, realX: 0, measX: 0 };
        $('#fH').value = 5; $('#fHV').textContent = '5.0 m';
        Array.prototype.forEach.call($('#objChips').children, function (c) { c.classList.toggle('on', c.dataset.o === 'tennis'); });
        $('#pL').value = 1; $('#pLV').textContent = '1.00 m';
        $('#pA').value = 15; $('#pAV').textContent = '15°';
        $('#rH').value = 5; $('#rHV').textContent = '5.0 m';
        $('#rV').value = 8; $('#rVV').textContent = '8.0 m/s';
        ['#kTheory', '#kReal', '#kErr'].forEach(function (s) { $(s).textContent = '—'; });
        toast('실험 조건을 처음 상태로 돌렸어요');
    });

    $('#fH').addEventListener('input', function () {
        st.fall.h = parseFloat(this.value);
        $('#fHV').textContent = st.fall.h.toFixed(1) + ' m';
        resetRun(); prepare();
    });
    $('#objChips').addEventListener('click', function (e) {
        var b = e.target.closest('.chip');
        if (!b) return;
        st.fall.obj = b.dataset.o;
        Array.prototype.forEach.call(this.children, function (x) { x.classList.toggle('on', x === b); });
        resetRun(); prepare();
    });
    $('#pL').addEventListener('input', function () {
        st.pend.L = parseFloat(this.value);
        $('#pLV').textContent = st.pend.L.toFixed(2) + ' m';
        resetRun(); prepare();
    });
    $('#pA').addEventListener('input', function () {
        st.pend.amp = parseFloat(this.value);
        $('#pAV').textContent = st.pend.amp + '°';
        resetRun(); prepare();
    });
    $('#rH').addEventListener('input', function () {
        st.proj.h = parseFloat(this.value);
        $('#rHV').textContent = st.proj.h.toFixed(1) + ' m';
        resetRun(); prepare();
    });
    $('#rV').addEventListener('input', function () {
        st.proj.v = parseFloat(this.value);
        $('#rVV').textContent = st.proj.v.toFixed(1) + ' m/s';
        resetRun(); prepare();
    });

    Array.prototype.forEach.call(document.querySelectorAll('.tg'), function (tg) {
        tg.addEventListener('click', function () {
            var k = tg.dataset.k;
            st[k] = !st[k];
            tg.classList.toggle('on', st[k]);
            resetRun(); prepare();
        });
    });

    /* ---------- 테마 · 전체화면 ---------- */
    function applyTheme(d) {
        document.body.classList.toggle('dark', d);
        $('#bTheme').textContent = d ? '☀️ 주간 모드' : '🌙 야간 모드';
        try { localStorage.setItem('svl_error_theme', d ? '1' : '0'); } catch (e) { }
    }
    $('#bTheme').addEventListener('click', function () { applyTheme(!document.body.classList.contains('dark')); });
    try { if (localStorage.getItem('svl_error_theme') === '1') applyTheme(true); } catch (e) { }

    (function () {
        var btn = document.getElementById('btn-fullscreen');
        var iconEl = document.getElementById('fsIcon');
        var textEl = document.getElementById('fsText');
        var root = document.documentElement;
        var PSEUDO = 'pseudo-fullscreen';
        function isRealFs() {
            return !!(document.fullscreenElement || document.webkitFullscreenElement ||
                document.mozFullScreenElement || document.msFullscreenElement);
        }
        function isPseudo() { return document.body.classList.contains(PSEUDO); }
        function syncUI() {
            var on = isRealFs() || isPseudo();
            iconEl.textContent = on ? '🗗' : '⛶';
            textEl.textContent = on ? '창모드' : '전체화면';
            btn.setAttribute('aria-pressed', on ? 'true' : 'false');
            btn.setAttribute('aria-label', on ? '창모드로 전환' : '전체화면으로 전환');
        }
        function toast2(msg) {
            var el = document.getElementById('fs-toast');
            if (!el) {
                el = document.createElement('div');
                el.className = 'fs-toast'; el.id = 'fs-toast';
                document.body.appendChild(el);
            }
            el.textContent = msg; void el.offsetWidth; el.classList.add('show');
            clearTimeout(toast2._t);
            toast2._t = setTimeout(function () { el.classList.remove('show'); }, 2600);
        }
        window.__svlToast = toast2;
        function enterPseudo(hint) {
            if (isRealFs()) return;
            document.body.classList.add(PSEUDO);
            syncUI();
            if (hint) toast2('이 브라우저는 브라우저 전체화면 대신 상단 바를 숨긴 몰입 모드로 표시합니다');
        }
        function requestReal() {
            var req = root.requestFullscreen || root.webkitRequestFullscreen || root.mozRequestFullScreen || root.msRequestFullscreen;
            if (!req) return false;
            try {
                var p = req.call(root);
                if (p && typeof p.then === 'function') p.then(syncUI, function () { enterPseudo(true); });
                else setTimeout(function () { if (!isRealFs() && !isPseudo()) enterPseudo(true); else syncUI(); }, 500);
                return true;
            } catch (err) { return false; }
        }
        btn.addEventListener('click', function () {
            if (isRealFs()) {
                var exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
                try { if (exit) { var q = exit.call(document); if (q && q.catch) q.catch(function () { }); } } catch (err) { }
                syncUI(); return;
            }
            if (isPseudo()) { document.body.classList.remove(PSEUDO); syncUI(); return; }
            if (!requestReal()) enterPseudo(true);
            syncUI();
        });
        ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
            document.addEventListener(ev, function () {
                if (isRealFs()) document.body.classList.remove(PSEUDO);
                syncUI();
            });
        });
        document.addEventListener('keydown', function (e) {
            if ((e.key === 'Escape' || e.key === 'Esc') && isPseudo() && !isRealFs()) {
                document.body.classList.remove(PSEUDO); syncUI();
            }
        });
        window.addEventListener('resize', syncUI);
        syncUI();
    })();

    function toast(msg) { window.__svlToast && window.__svlToast(msg); }

    /* ---------- 시작 ---------- */
    resize();
    window.addEventListener('resize', resize);
    if (window.ResizeObserver) new ResizeObserver(resize).observe(cv.parentElement);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize).catch(function () { });
    prepare();
    requestAnimationFrame(loop);
})();
</script>
<script src="../common/feedback.js" defer></script>
</body>
