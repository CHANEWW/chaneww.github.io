<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>관찰 일지 어휘 정돈 도구 | Science Virtual LAB</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="preload" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff" as="font" type="font/woff" crossorigin>

<style>
@font-face{
    font-family:'SeoulNamsan';
    src:local('SeoulNamsan M'),local('SeoulNamsanM'),local('서울남산체 M'),
        url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff') format('woff');
    font-weight:400;font-style:normal;font-display:swap;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
    --bg:#eef2f7; --ink:#14181f; --muted:#64748b; --line:rgba(15,23,42,.10);
    --card:rgba(255,255,255,.9); --card-solid:#fff; --accent:#0a84ff; --accent-soft:rgba(10,132,255,.12);
    --ok:#10b981; --warn:#f59e0b; --danger:#ef4444; --shadow:0 10px 30px rgba(15,23,42,.10);
}
body.dark{
    --bg:#0e121c; --ink:#eef3fb; --muted:#94a3b8; --line:rgba(255,255,255,.13);
    --card:rgba(26,32,45,.9); --card-solid:#1a2130; --accent:#4aa3ff; --accent-soft:rgba(74,163,255,.18);
    --ok:#34d399; --warn:#fbbf24; --danger:#f87171; --shadow:0 10px 30px rgba(0,0,0,.5);
}
html,body{margin:0;padding:0;width:100%;height:100%}
body{
    font-family:'SeoulNamsan',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:var(--ink); background:var(--bg); overflow:hidden; transition:background .3s ease,color .3s ease;
}
.top-nav{
    position:fixed; top:0; left:0; right:0; height:60px; display:flex; align-items:center; gap:10px;
    padding:0 250px 0 16px; z-index:100; background:var(--card);
    backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-bottom:1px solid var(--line);
}
.back-btn{
    display:inline-flex; align-items:center; gap:6px; padding:7px 14px; font-family:inherit; font-size:13px;
    font-weight:800; color:inherit; text-decoration:none; border:1px solid var(--line); border-radius:999px;
    background:var(--card-solid); transition:transform .16s ease; white-space:nowrap;
}
.back-btn:hover{transform:translateY(-1px)}
.page-title{display:flex; align-items:center; gap:8px; font-size:14.5px; font-weight:800; letter-spacing:-.2px; min-width:0}
.page-title .t{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pill-badge{padding:3px 9px; border-radius:999px; font-size:10.5px; font-weight:800; background:var(--accent-soft); color:var(--accent); white-space:nowrap; flex:0 0 auto}
.top-right-bar{
    position:fixed !important; top:15px !important; right:20px !important;
    display:flex !important; flex-direction:column; align-items:flex-end; gap:8px; z-index:130 !important; pointer-events:none;
}
.top-right-bar > .tr-util{display:flex !important; flex-direction:row; align-items:center; gap:8px; pointer-events:auto}
#bTheme{
    display:inline-flex; align-items:center; justify-content:center; gap:6px; height:40px; padding:0 15px;
    border-radius:20px; cursor:pointer; font-family:inherit; font-size:12.5px; font-weight:800; color:inherit;
    border:1px solid var(--line); background:var(--card); box-shadow:var(--shadow);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); white-space:nowrap; transition:transform .16s ease;
}
#bTheme:hover{transform:translateY(-1px)}

.app{position:fixed; top:60px; left:0; right:0; bottom:0; overflow-y:auto; padding:12px 16px 90px}
.wrap{max-width:1180px; margin:0 auto}
.layout{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:12px; align-items:start}

.card{
    border-radius:20px; border:1px solid var(--line); background:var(--card); box-shadow:var(--shadow);
    padding:15px 16px; margin-bottom:12px;
}
.card-head{display:flex; align-items:center; gap:8px; margin-bottom:11px; flex-wrap:wrap}
.card-head h2{margin:0; font-size:14.5px; font-weight:900; letter-spacing:-.2px}
.card-head .sub{font-size:11.5px; font-weight:700; color:var(--muted)}
.spacer{margin-left:auto}
.btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:9px 15px; border-radius:12px;
    border:none; cursor:pointer; font-family:inherit; font-size:12.5px; font-weight:900; color:#fff;
    background:var(--accent); box-shadow:0 8px 18px rgba(10,132,255,.24); transition:transform .16s ease; white-space:nowrap;
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line); box-shadow:none}
.btn.ok{background:linear-gradient(135deg,#10b981,#059669); box-shadow:0 8px 18px rgba(16,185,129,.26)}
.btn.mini{padding:6px 11px; font-size:11.5px; border-radius:10px}
input[type="text"], input[type="date"], textarea{
    font-family:inherit; font-size:13px; font-weight:700; color:inherit;
    background:var(--card-solid); border:1px solid var(--line); border-radius:10px; padding:8px 10px; outline:none;
}
input:focus, textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.note{font-size:11px; font-weight:700; color:var(--muted); line-height:1.55}

.who{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px}
.who label{display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:900; color:var(--muted)}
.who input[type="text"]{width:118px}
.who input#studentName{width:104px}
.who input#situation{width:230px; max-width:100%}
.seg{display:inline-flex; gap:4px; padding:4px; border-radius:12px; background:var(--card-solid); border:1px solid var(--line)}
.seg button{
    padding:7px 12px; border-radius:9px; border:none; background:transparent; color:var(--muted);
    font-family:inherit; font-size:11.5px; font-weight:900; cursor:pointer; white-space:nowrap;
}
.seg button.on{background:var(--accent); color:#fff}

.cat{margin-bottom:12px}
.cat-head{display:flex; align-items:center; gap:7px; margin:0 0 7px}
.cat-head .ic{font-size:14px}
.cat-head h3{margin:0; font-size:12.5px; font-weight:900; letter-spacing:-.1px}
.cat-head .cnt{font-size:10.5px; font-weight:900; color:var(--accent); background:var(--accent-soft); padding:2px 7px; border-radius:999px}
.cat-head .all{margin-left:auto; font-size:10.5px; font-weight:900; color:var(--muted); background:transparent; border:1px solid var(--line); border-radius:999px; padding:3px 9px; cursor:pointer; font-family:inherit}
.cat-head .all:hover{color:var(--accent); border-color:var(--accent)}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{
    display:inline-flex; align-items:center; gap:5px; padding:7px 11px; border-radius:999px;
    border:1px solid var(--line); background:var(--card-solid); color:var(--ink);
    font-family:inherit; font-size:11.5px; font-weight:800; cursor:pointer; transition:all .15s ease; text-align:left;
}
.chip:hover{border-color:var(--accent); color:var(--accent)}
.chip.on{background:var(--accent); color:#fff; border-color:transparent; box-shadow:0 6px 14px rgba(10,132,255,.25) }
.chip.on::before{content:'✓'; font-size:10px; font-weight:900}
.cat.support .chip.on{background:linear-gradient(135deg,#f59e0b,#d97706); box-shadow:0 6px 14px rgba(245,158,11,.25)}
.cat.support .cat-head h3{color:#b45309}
body.dark .cat.support .cat-head h3{color:#fbbf24}

.preview-box{
    width:100%; min-height:206px; resize:vertical; line-height:1.72; font-size:13px; font-weight:700;
    padding:12px 13px; border-radius:14px; background:var(--card-solid);
}
.meta-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:8px}
.meta{font-size:11px; font-weight:800; color:var(--muted); font-variant-numeric:tabular-nums}
.meta b{color:var(--accent); font-weight:900}
.act-row{display:flex; gap:7px; flex-wrap:wrap; margin-top:10px}
.drafts{margin-top:12px; border-top:1px dashed var(--line); padding-top:10px}
.drafts h3{margin:0 0 7px; font-size:12px; font-weight:900}
.draft{display:flex; align-items:center; gap:8px; padding:8px 9px; border-radius:11px; border:1px solid var(--line); background:var(--card-solid); margin-bottom:6px}
.draft .d-name{font-size:11.5px; font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:96px}
.draft .d-text{flex:1 1 auto; min-width:0; font-size:11px; font-weight:700; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.draft button{
    flex:0 0 auto; width:28px; height:28px; border-radius:8px; border:1px solid var(--line); background:var(--card);
    color:var(--muted); font-family:inherit; font-size:12px; font-weight:900; cursor:pointer;
}
.draft button:hover{color:var(--accent); border-color:var(--accent)}
.tabs-mini{display:flex; gap:6px; margin-bottom:9px}
.tabs-mini button{
    flex:1 1 0; padding:8px 6px; border-radius:11px; border:1px solid var(--line); background:var(--card-solid);
    color:var(--muted); font-family:inherit; font-size:11.5px; font-weight:900; cursor:pointer;
}
.tabs-mini button.on{background:var(--accent); color:#fff; border-color:transparent}

/* 전체화면 */
#btn-fullscreen{
    position:fixed; right:20px; bottom:calc(18px + env(safe-area-inset-bottom,0px)); z-index:95;
    display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:9px 16px; border-radius:999px;
    border:1px solid var(--line); background:var(--card); box-shadow:0 8px 24px rgba(15,23,42,.16);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    color:inherit; font-family:inherit; font-size:12.5px; font-weight:800; white-space:nowrap; cursor:pointer;
    transition:transform .18s ease;
}
#btn-fullscreen:hover{transform:translateY(-1px)}
body.pseudo-fullscreen .top-nav{transform:translateY(-100%); opacity:0; pointer-events:none}
body.pseudo-fullscreen .app{top:0}
body.pseudo-fullscreen #feedback-btn,body.pseudo-fullscreen .svl-fb-btn{display:none !important}
.fs-toast{
    position:fixed; left:50%; bottom:calc(74px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,8px);
    z-index:2050; max-width:86vw; padding:10px 16px; border-radius:14px; background:rgba(28,28,30,.92);
    color:#fff; font-size:12.5px; font-weight:700; line-height:1.45; text-align:center;
    box-shadow:0 10px 26px rgba(0,0,0,.3); opacity:0; pointer-events:none; transition:opacity .26s ease, transform .26s ease;
}
.fs-toast.show{opacity:1; transform:translate(-50%,0)}

@media (max-width:900px){
    .layout{grid-template-columns:minmax(0,1fr)}
    .top-nav{height:52px; padding:0 12px; gap:8px}
    .page-title{font-size:12.5px}
    .back-btn{padding:6px 11px; font-size:12px}
    .top-right-bar{top:calc(max(8px,env(safe-area-inset-top)) + 48px) !important; right:8px !important}
    #bTheme{height:34px; padding:0 11px; font-size:11.5px}
    .app{top:100px; padding:8px 10px 84px}
    .card{padding:12px 12px}
    .chip{font-size:11px; padding:6px 9px}
    .who input#situation{width:100%}
    .preview-box{min-height:180px}
    #btn-fullscreen{bottom:calc(10px + env(safe-area-inset-bottom,0px)); right:10px; padding:8px 13px; font-size:12px}
}
@media (max-width:430px){
    .page-title .pill-badge{display:none}
    .who label{width:100%}
    .who input[type="text"]{flex:1 1 auto; width:auto}
}
@media (max-height:500px) and (orientation:landscape){
    .top-nav{height:44px}
    .app{top:44px}
    .top-right-bar{top:max(6px,env(safe-area-inset-top)) !important; right:88px !important}
}
</style>
</head>
<body>

<nav class="top-nav">
    <a href="../../index.html" class="back-btn" onclick="var r=document.referrer;if(history.length>1&&r&&r.indexOf(location.origin+'/')===0&&/(\/|index(_3d)?\.html)(\?|#|$)/.test(r)){history.back();return false;}"><span>⬅</span> 메인</a>
    <div class="page-title"><span class="t">관찰 일지 어휘 정돈 도구</span><span class="pill-badge">교실 도구</span></div>
</nav>

<div class="top-right-bar">
    <div class="tr-util">
        <button id="bTheme" type="button">🌙 야간 모드</button>
    </div>
</div>

<div class="app">
<div class="wrap">
<div class="layout">

    <!-- ===== 선택 영역 ===== -->
    <section class="card">
        <div class="card-head">
            <h2>✅ 관찰한 모습 고르기</h2>
            <span class="sub">고른 항목이 문장으로 바뀝니다</span>
            <div class="spacer"></div>
            <button class="btn ghost mini" id="btnClear" type="button">전체 해제</button>
        </div>

        <div class="who">
            <label>학생 이름 <input type="text" id="studentName" placeholder="예: 김하늘" maxlength="10"></label>
            <label>관찰 날짜 <input type="date" id="obsDate"></label>
            <label>상황 <input type="text" id="situation" placeholder="예: 전기 회로 실험" maxlength="30"></label>
        </div>

        <div id="cats"></div>

        <p class="note" style="margin-top:2px">‘지원이 필요한 부분’은 상담 일지에 쓰도록 부드럽게 서술했습니다. 기록은 이 브라우저에만 저장됩니다.</p>
    </section>

    <!-- ===== 문안 ===== -->
    <section class="card">
        <div class="card-head">
            <h2>📝 문안 미리보기</h2>
            <span class="sub" id="toneLabel">간결형</span>
        </div>

        <div class="tabs-mini">
            <button class="on" type="button" data-tone="short">간결형 (∼함)</button>
            <button type="button" data-tone="long">서술형 (∼했습니다)</button>
        </div>

        <textarea class="preview-box" id="outText" spellcheck="false" placeholder="왼쪽에서 관찰한 모습을 고르면 여기에 문장이 만들어집니다."></textarea>

        <div class="meta-row">
            <span class="meta">글자 <b id="mChars">0</b>자</span>
            <span class="meta">공백 제외 <b id="mCharsNoSpace">0</b>자</span>
            <span class="meta">바이트 <b id="mBytes">0</b></span>
            <span class="spacer"></span>
            <button class="btn ghost mini" id="btnCopy" type="button">📋 복사</button>
        </div>

        <div class="act-row">
            <button class="btn ok" id="btnSave" type="button">💾 기록 저장</button>
            <button class="btn ghost" id="btnSample" type="button">✨ 예시 채우기</button>
            <button class="btn ghost" id="btnResetAll" type="button">🧹 새로 쓰기</button>
        </div>

        <div class="drafts">
            <h3>🗂 저장한 기록 <span class="note" id="draftCount"></span></h3>
            <div id="draftList"><span class="note">아직 저장한 기록이 없습니다.</span></div>
        </div>

        <p class="note" style="margin-top:10px">만들어진 문장은 초안입니다. 학생의 실제 모습과 다르지 않은지 확인한 뒤, 학교생활기록부 기재 지침에 맞게 다듬어 사용하세요.</p>
    </section>

</div>
</div>
</div>

<button id="btn-fullscreen" type="button" aria-pressed="false" aria-label="전체화면으로 전환">
    <span class="fs-icon" id="fsIcon">⛶</span><span class="fs-text" id="fsText">전체화면</span>
</button>

<script>
/* ==========================================================

                { key: 'hypo', label: '가설 세우고 확인',

                { key: 'grit', label: '조건을 바꿔 다시 시도',

                { key: 'evidence', label: '근거로 해석',

                { key: 'record', label: '단위까지 정확히 기록',

        {

                { key: 'agree', label: '의견 조율',

    var state = { tone: 'short', sel: {}, saved: [] };
    var STORE = 'svl_obslog_drafts';
    var THEME = 'svl_obslog_theme';

    /* ---------------- 선택 항목 그리기 ---------------- */
    function allItems() {
        var out = [];
        CATS.forEach(function (c) { c.items.forEach(function (i) { out.push(i); }); });
        return out;
    }
    function itemByKey(k) {
        var arr = allItems(), i;
        for (i = 0; i < arr.length; i++) if (arr[i].key === k) return arr[i];
        return null;
    }

    function renderCats() {
        var html = '';
        CATS.forEach(function (c) {
            html += '<div class="cat' + (c.support ? ' support' : '') + '" data-cat="' + c.key + '">' +
                '<div class="cat-head">' +
                '<span class="ic">' + c.icon + '</span><h3>' + c.title + '</h3>' +
                '<span class="cnt" data-cnt>' + countIn(c) + '</span>' +
                '<button class="all" type="button" data-all="' + c.key + '">모두 선택</button>' +
                '</div><div class="chips">';
            c.items.forEach(function (i) {
                html += '<button class="chip' + (state.sel[i.key] ? ' on' : '') + '" type="button" data-key="' + i.key + '">' + i.label + '</button>';
            });
            html += '</div></div>';
        });
        $('#cats').innerHTML = html;
        updateCounts();
    }

    function countIn(c) {
        var n = 0;
        c.items.forEach(function (i) { if (state.sel[i.key]) n++; });
        return n;
    }
    function updateCounts() {
        CATS.forEach(function (c) {
            var box = document.querySelector('.cat[data-cat="' + c.key + '"]');
            if (!box) return;
            var cnt = box.querySelector('[data-cnt]');
            var n = countIn(c);
            cnt.textContent = n + '/' + c.items.length;
            cnt.style.opacity = n ? '1' : '.6';
            var allBtn = box.querySelector('[data-all]');
            allBtn.textContent = n === c.items.length ? '모두 해제' : '모두 선택';
        });
    }

    $('#cats').addEventListener('click', function (e) {
        var chip = e.target.closest('.chip');
        if (chip) {
            var k = chip.getAttribute('data-key');
            if (state.sel[k]) delete state.sel[k];
            else state.sel[k] = true;
            chip.classList.toggle('on', !!state.sel[k]);
            updateCounts(); compose();
            return;
        }
        var allBtn = e.target.closest('[data-all]');
        if (allBtn) {
            var cat = null;
            CATS.forEach(function (c) { if (c.key === allBtn.getAttribute('data-all')) cat = c; });
            if (!cat) return;
            var full = countIn(cat) === cat.items.length;
            cat.items.forEach(function (i) {
                if (full) delete state.sel[i.key];
                else state.sel[i.key] = true;
            });
            renderCats(); compose();
        }
    });

    /* ---------------- 문장 조합 ---------------- */
    function joinKo(arr) {
        if (arr.length <= 1) return arr.join('');
        return arr.slice(0, -1).join(' ') + ' ' + arr[arr.length - 1];
    }

    function compose() {
        var name = ($('#studentName').value || '').trim();
        var situation = ($('#situation').value || '').trim();
        var main = [], support = [];
        CATS.forEach(function (c) {
            c.items.forEach(function (i) {
                if (!state.sel[i.key]) return;
                var s = state.tone === 'long' ? i.long : i.short;
                if (c.support) support.push(s);
                else main.push(s);
            });
        });

        var parts = [];
        if (!main.length && !support.length) {
            $('#outText').value = '';
            updateMeta();
            return;
        }

        var who = name ? name + ' 학생은' : '이 학생은';
        var lead = situation ? '‘' + situation + '’ 활동에서 ' : '';
        if (main.length) {
            parts.push(who + ' ' + lead + main.join(' '));
        }
        if (support.length) {
            var conn = support.length > 1 ? '이와 함께 ' : '다만, ';
            parts.push(conn + support.join(' '));
        }
        var text = parts.join(' ');
        $('#outText').value = text;
        updateMeta();
    }

    function updateMeta() {
        var t = $('#outText').value || '';
        var chars = t.length;
        var noSpace = t.replace(/\s/g, '').length;
        $('#mChars').textContent = chars;
        $('#mCharsNoSpace').textContent = noSpace;
        $('#mBytes').textContent = utf8Len(t);
        $('#toneLabel').textContent = state.tone === 'long' ? '서술형' : '간결형';
    }

    function utf8Len(str) {
        var b = 0, i, c;
        for (i = 0; i < str.length; i++) {
            c = str.charCodeAt(i);
            if (c < 0x80) b += 1;
            else if (c < 0x800) b += 2;
            else if (c >= 0xD800 && c <= 0xDBFF) { b += 4; i++; }
            else b += 3;
        }
        return b;
    }

    /* ---------------- 어조 ---------------- */
    Array.prototype.forEach.call(document.querySelectorAll('.tabs-mini button'), function (b) {
        b.addEventListener('click', function () {
            state.tone = b.getAttribute('data-tone');
            Array.prototype.forEach.call(document.querySelectorAll('.tabs-mini button'), function (x) {
                x.classList.toggle('on', x === b);
            });
            compose();
        });
    });

    ['#studentName', '#situation'].forEach(function (sel) {
        $(sel).addEventListener('input', compose);
    });
    $('#outText').addEventListener('input', updateMeta);

    /* ---------------- 버튼 ---------------- */

        toast('선택을 모두 해제했습니다');
    });

        if (!$('#situation').value) $('#situation').value = '전기 회로 실험';
        if (!$('#obsDate').value) $('#obsDate').value = todayStr();
        renderCats(); compose();
        toast('예시를 채웠습니다 — 원하는 항목만 남기고 고쳐 쓰세요');
    });

    $('#btnResetAll').addEventListener('click', function () {
        state.sel = {};
        $('#studentName').value = '';
        $('#situation').value = '';

        $('#outText').value = '';

        toast('새 기록을 시작합니다');
    });

    $('#btnCopy').addEventListener('click', function () {
        var t = $('#outText').value.trim();
        if (!t) { toast('먼저 관찰한 모습을 골라 주세요'); return; }
        copyText(t, '문안을 복사했습니다');
    });

    function copyText(text, okMsg) {
        var done = function () { toast(okMsg || '복사했습니다'); };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done, fallback);
            return;
        }
        fallback();
        function fallback() {
            try {
                var ta = document.createElement('textarea');
                ta.value = text;
                ta.style.cssText = 'position:fixed;left:-9999px;top:0';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
                done();
            } catch (e) { toast('이 브라우저에서는 복사를 지원하지 않습니다'); }
        }
    }

    /* ---------------- 저장 기록 ---------------- */
    function loadSaved() {
        try {
            var raw = localStorage.getItem(STORE);
            if (raw) state.saved = JSON.parse(raw) || [];
        } catch (e) { state.saved = []; }
        if (!Array.isArray(state.saved)) state.saved = [];
        renderSaved();
    }
    function persistSaved() {
        try { localStorage.setItem(STORE, JSON.stringify(state.saved.slice(0, 20))); } catch (e) { }
    }
    function renderSaved() {
        var box = $('#draftList');
        $('#draftCount').textContent = state.saved.length ? '(' + state.saved.length + '개)' : '';
        if (!state.saved.length) {
            box.innerHTML = '<span class="note">아직 저장한 기록이 없습니다.</span>';
            return;
        }
        box.innerHTML = state.saved.map(function (d, i) {
            return '<div class="draft" data-i="' + i + '">' +
                '<span class="d-name">' + esc(d.name || '이름 없음') + '</span>' +
                '<span class="d-text">' + esc((d.text || '').slice(0, 46)) + '</span>' +
                '<button type="button" data-act="copy" aria-label="복사" title="복사">📋</button>' +
                '<button type="button" data-act="load" aria-label="불러오기" title="불러오기">↩</button>' +
                '<button type="button" data-act="del" aria-label="삭제" title="삭제">✕</button>' +
                '</div>';
        }).join('');
    }
    $('#draftList').addEventListener('click', function (e) {
        var btn = e.target.closest('button[data-act]');
        if (!btn) return;
        var row = btn.closest('.draft');
        var i = Number(row.getAttribute('data-i'));
        var d = state.saved[i];
        if (!d) return;
        var act = btn.getAttribute('data-act');
        if (act === 'copy') copyText(d.text || '', '저장한 문안을 복사했습니다');
        else if (act === 'load') {
            $('#studentName').value = d.name || '';
            $('#situation').value = d.situation || '';
            $('#obsDate').value = d.date || todayStr();
            $('#outText').value = d.text || '';
            state.sel = d.sel || {};
            state.tone = d.tone || 'short';
            Array.prototype.forEach.call(document.querySelectorAll('.tabs-mini button'), function (x) {
                x.classList.toggle('on', x.getAttribute('data-tone') === state.tone);
            });
            renderCats(); updateMeta();
            toast('저장한 기록을 불러왔습니다');
        } else if (act === 'del') {
            state.saved.splice(i, 1);
            persistSaved(); renderSaved();
            toast('기록을 지웠습니다');
        }
    });

    $('#btnSave').addEventListener('click', function () {
        var text = ($('#outText').value || '').trim();
        if (!text) { toast('먼저 관찰한 모습을 골라 주세요'); return; }
        state.saved.unshift({
            name: ($('#studentName').value || '').trim(),
            situation: ($('#situation').value || '').trim(),
            date: $('#obsDate').value || todayStr(),
            text: text, tone: state.tone, sel: state.sel,
            ts: Date.now()
        });
        if (state.saved.length > 20) state.saved.length = 20;
        persistSaved(); renderSaved();
        toast('기록을 저장했습니다');
    });

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
            return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c];
        });
    }
    function todayStr() {
        var d = new Date();
        var m = d.getMonth() + 1, day = d.getDate();
        return d.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (day < 10 ? '0' + day : day);
    }

    /* ---------------- 토스트 · 테마 · 전체화면 ---------------- */
    function toast(msg) {
        var el = document.getElementById('fs-toast');
        if (!el) {
            el = document.createElement('div');
            el.className = 'fs-toast'; el.id = 'fs-toast';
            document.body.appendChild(el);
        }
        el.textContent = msg; void el.offsetWidth; el.classList.add('show');
        clearTimeout(toast._t);
        toast._t = setTimeout(function () { el.classList.remove('show'); }, 2600);
    }

    function applyTheme(dark) {
        document.body.classList.toggle('dark', dark);
        $('#bTheme').textContent = dark ? '☀️ 주간 모드' : '🌙 야간 모드';
        try { localStorage.setItem(THEME, dark ? '1' : '0'); } catch (e) { }
    }
    $('#bTheme').addEventListener('click', function () { applyTheme(!document.body.classList.contains('dark')); });
    try { if (localStorage.getItem(THEME) === '1') applyTheme(true); } catch (e) { }

    (function () {
        var btn = document.getElementById('btn-fullscreen');
        var iconEl = document.getElementById('fsIcon');
        var textEl = document.getElementById('fsText');
        var root = document.documentElement;
        var PSEUDO = 'pseudo-fullscreen';
        function isRealFs() {
            return !!(document.fullscreenElement || document.webkitFullscreenElement ||
                document.mozFullScreenElement || document.msFullscreenElement);
        }
        function isPseudo() { return document.body.classList.contains(PSEUDO); }
        function syncUI() {
            var on = isRealFs() || isPseudo();
            iconEl.textContent = on ? '🗗' : '⛶';
            textEl.textContent = on ? '창모드' : '전체화면';
            btn.setAttribute('aria-pressed', on ? 'true' : 'false');
            btn.setAttribute('aria-label', on ? '창모드로 전환' : '전체화면으로 전환');
        }
        function enterPseudo(hint) {
            if (isRealFs()) return;
            document.body.classList.add(PSEUDO);
            syncUI();
            if (hint) toast('이 브라우저는 브라우저 전체화면 대신 상단 바를 숨긴 몰입 모드로 표시합니다');
        }
        function requestReal() {
            var req = root.requestFullscreen || root.webkitRequestFullscreen || root.mozRequestFullScreen || root.msRequestFullscreen;
            if (!req) return false;
            try {
                var p = req.call(root);
                if (p && typeof p.then === 'function') p.then(syncUI, function () { enterPseudo(true); });
                else setTimeout(function () { if (!isRealFs() && !isPseudo()) enterPseudo(true); else syncUI(); }, 500);
                return true;
            } catch (err) { return false; }
        }
        btn.addEventListener('click', function () {
            if (isRealFs()) {
                var exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
                try { if (exit) { var q = exit.call(document); if (q && typeof q.catch === 'function') q.catch(function () { }); } } catch (err) { }
                syncUI(); return;
            }
            if (isPseudo()) { document.body.classList.remove(PSEUDO); syncUI(); return; }
            if (!requestReal()) enterPseudo(true);
            syncUI();
        });
        ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
            document.addEventListener(ev, function () {
                if (isRealFs()) document.body.classList.remove(PSEUDO);
                syncUI();
            });
        });
        document.addEventListener('keydown', function (e) {
            if ((e.key === 'Escape' || e.key === 'Esc') && isPseudo() && !isRealFs()) {
                document.body.classList.remove(PSEUDO); syncUI();
            }
        });
        window.addEventListener('resize', syncUI);
        syncUI();
    })();

    /* ---------------- 시작 ---------------- */
    $('#obsDate').value = todayStr();
    renderCats();
    loadSaved();
    updateMeta();
})();
</script>
<script src="../common/feedback.js" defer></script>
