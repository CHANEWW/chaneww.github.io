<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>2022 개정 교과서 단원 매핑 | Science Virtual LAB</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="preload" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff" as="font" type="font/woff" crossorigin>

<style>
@font-face{
    font-family:'SeoulNamsan';
    src:local('SeoulNamsan M'),local('SeoulNamsanM'),local('서울남산체 M'),
        url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff') format('woff');
    font-weight:400;font-style:normal;font-display:swap;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
    --bg:#eef2f7; --ink:#14181f; --muted:#64748b; --line:rgba(15,23,42,.10);
    --card:rgba(255,255,255,.9); --card-solid:#fff; --accent:#0a84ff; --accent-soft:rgba(10,132,255,.12);
    --ok:#10b981; --warn:#f59e0b; --danger:#ef4444; --shadow:0 10px 30px rgba(15,23,42,.10);
    --phys:#0a84ff; --chem:#10b981; --bio:#8b5cf6; --earth:#f59e0b;
}
body.dark{
    --bg:#0e121c; --ink:#eef3fb; --muted:#94a3b8; --line:rgba(255,255,255,.13);
    --card:rgba(26,32,45,.9); --card-solid:#1a2130; --accent:#4aa3ff; --accent-soft:rgba(74,163,255,.18);
    --ok:#34d399; --warn:#fbbf24; --danger:#f87171; --shadow:0 10px 30px rgba(0,0,0,.5);
    --phys:#4aa3ff; --chem:#34d399; --bio:#a78bfa; --earth:#fbbf24;
}
html,body{margin:0;padding:0;width:100%;height:100%}
body{
    font-family:'SeoulNamsan',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:var(--ink); background:var(--bg); overflow:hidden; transition:background .3s ease,color .3s ease;
}
.top-nav{
    position:fixed; top:0; left:0; right:0; height:60px; display:flex; align-items:center; gap:10px;
    padding:0 250px 0 16px; z-index:100; background:var(--card);
    backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-bottom:1px solid var(--line);
}
.back-btn{
    display:inline-flex; align-items:center; gap:6px; padding:7px 14px; font-family:inherit; font-size:13px;
    font-weight:800; color:inherit; text-decoration:none; border:1px solid var(--line); border-radius:999px;
    background:var(--card-solid); transition:transform .16s ease; white-space:nowrap;
}
.back-btn:hover{transform:translateY(-1px)}
.page-title{display:flex; align-items:center; gap:8px; font-size:14.5px; font-weight:800; letter-spacing:-.2px; min-width:0}
.page-title .t{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pill-badge{padding:3px 9px; border-radius:999px; font-size:10.5px; font-weight:800; background:var(--accent-soft); color:var(--accent); white-space:nowrap; flex:0 0 auto}
.top-right-bar{
    position:fixed !important; top:15px !important; right:20px !important;
    display:flex !important; flex-direction:column; align-items:flex-end; gap:8px; z-index:130 !important; pointer-events:none;
}
.top-right-bar > .tr-util{display:flex !important; flex-direction:row; align-items:center; gap:8px; pointer-events:auto}
#bTheme{
    display:inline-flex; align-items:center; justify-content:center; gap:6px; height:40px; padding:0 15px;
    border-radius:20px; cursor:pointer; font-family:inherit; font-size:12.5px; font-weight:800; color:inherit;
    border:1px solid var(--line); background:var(--card); box-shadow:var(--shadow);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); white-space:nowrap; transition:transform .16s ease;
}
#bTheme:hover{transform:translateY(-1px)}

.app{position:fixed; top:60px; left:0; right:0; bottom:0; overflow-y:auto; padding:12px 16px 90px}
.wrap{max-width:1180px; margin:0 auto}

.filters{
    border-radius:20px; border:1px solid var(--line); background:var(--card); box-shadow:var(--shadow);
    padding:13px 15px; margin-bottom:12px; position:sticky; top:0; z-index:40;
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
}
.search-row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.search-box{position:relative; flex:1 1 240px; min-width:0}
.search-box .ic{position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:13px; opacity:.6}
#q{
    width:100%; font-family:inherit; font-size:13px; font-weight:800; color:inherit;
    background:var(--card-solid); border:1px solid var(--line); border-radius:12px; padding:10px 12px 10px 34px; outline:none;
}
#q:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
#q::placeholder{font-weight:700; color:var(--muted)}
.count-pill{
    font-size:11.5px; font-weight:900; color:var(--accent); background:var(--accent-soft);
    padding:6px 12px; border-radius:999px; white-space:nowrap;
}
.chip-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:10px}
.chip-row .lbl{font-size:11px; font-weight:900; color:var(--muted); min-width:44px}
.chip{
    padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:var(--card-solid);
    color:var(--ink); font-family:inherit; font-size:11.5px; font-weight:900; cursor:pointer;
    transition:all .15s ease; white-space:nowrap;
}
.chip:hover{border-color:var(--accent); color:var(--accent)}
.chip.on{background:var(--accent); color:#fff; border-color:transparent}
.chip.on.phys{background:var(--phys)}
.chip.on.chem{background:var(--chem)}
.chip.on.bio{background:var(--bio)}
.chip.on.earth{background:var(--earth); color:#3b2a00}
body.dark .chip.on.earth{color:#231a00}
.switch{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:800; color:var(--muted); cursor:pointer; user-select:none}
.switch input{width:15px; height:15px; accent-color:var(--accent); cursor:pointer}

.unit-group{margin-bottom:14px}
.unit-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:0 0 8px; padding-left:2px}
.unit-head .bar{width:4px; height:16px; border-radius:2px; background:var(--accent)}
.unit-head h2{margin:0; font-size:14px; font-weight:900; letter-spacing:-.2px}
.unit-head .area{font-size:10.5px; font-weight:900; padding:2px 8px; border-radius:999px}
.area.phys{background:rgba(10,132,255,.14); color:var(--phys)}
.area.chem{background:rgba(16,185,129,.14); color:var(--chem)}
.area.bio{background:rgba(139,92,246,.14); color:var(--bio)}
.area.earth{background:rgba(245,158,11,.16); color:#b45309}
body.dark .area.earth{color:var(--earth)}
.unit-head .n{margin-left:auto; font-size:11px; font-weight:800; color:var(--muted)}
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:9px}
.lab{
    border-radius:14px; border:1px solid var(--line); background:var(--card); padding:11px 12px;
    display:flex; flex-direction:column; gap:7px; transition:transform .15s ease, box-shadow .15s ease;
}
.lab:hover{transform:translateY(-2px); box-shadow:0 10px 24px rgba(15,23,42,.12)}
.lab-top{display:flex; align-items:flex-start; gap:6px}
.lab-title{font-size:13px; font-weight:900; letter-spacing:-.2px; line-height:1.35; flex:1 1 auto}
.badge-deep{
    flex:0 0 auto; font-size:9.5px; font-weight:900; padding:2px 7px; border-radius:999px;
    background:rgba(120,140,170,.16); color:var(--muted); white-space:nowrap;
}
.lab-sub{font-size:11px; font-weight:800; color:var(--muted); line-height:1.4}
.lab-keys{display:flex; gap:4px; flex-wrap:wrap}
.lab-keys span{font-size:9.5px; font-weight:800; padding:2px 7px; border-radius:999px; background:rgba(120,140,170,.12); color:var(--muted)}
.lab-path{
    font-size:10px; font-weight:800; color:var(--muted); background:var(--card-solid); border:1px dashed var(--line);
    border-radius:8px; padding:5px 7px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-family:'Consolas','Menlo',monospace;
}
.lab-act{display:flex; gap:6px; margin-top:1px}
.lab-act a, .lab-act button{
    flex:1 1 0; display:inline-flex; align-items:center; justify-content:center; gap:4px; padding:7px 8px;
    border-radius:9px; border:1px solid var(--line); background:var(--card-solid); color:inherit;
    font-family:inherit; font-size:11px; font-weight:900; cursor:pointer; text-decoration:none; white-space:nowrap;
}
.lab-act a{background:var(--accent); color:#fff; border-color:transparent}
.lab-act a:hover, .lab-act button:hover{transform:translateY(-1px)}
.empty{
    text-align:center; padding:34px 16px; border-radius:18px; border:1px dashed var(--line);
    background:var(--card); font-size:12.5px; font-weight:800; color:var(--muted); line-height:1.6;
}
.note{font-size:11px; font-weight:700; color:var(--muted); line-height:1.55}
.legend{display:flex; gap:12px; flex-wrap:wrap; margin-top:8px}

/* 전체화면 */
#btn-fullscreen{
    position:fixed; right:20px; bottom:calc(18px + env(safe-area-inset-bottom,0px)); z-index:95;
    display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:9px 16px; border-radius:999px;
    border:1px solid var(--line); background:var(--card); box-shadow:0 8px 24px rgba(15,23,42,.16);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    color:inherit; font-family:inherit; font-size:12.5px; font-weight:800; white-space:nowrap; cursor:pointer;
    transition:transform .18s ease;
}
#btn-fullscreen:hover{transform:translateY(-1px)}
body.pseudo-fullscreen .top-nav{transform:translateY(-100%); opacity:0; pointer-events:none}
body.pseudo-fullscreen .app{top:0}
body.pseudo-fullscreen #feedback-btn,body.pseudo-fullscreen .svl-fb-btn{display:none !important}
.fs-toast{
    position:fixed; left:50%; bottom:calc(74px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,8px);
    z-index:2050; max-width:86vw; padding:10px 16px; border-radius:14px; background:rgba(28,28,30,.92);
    color:#fff; font-size:12.5px; font-weight:700; line-height:1.45; text-align:center;
    box-shadow:0 10px 26px rgba(0,0,0,.3); opacity:0; pointer-events:none; transition:opacity .26s ease, transform .26s ease;
}
.fs-toast.show{opacity:1; transform:translate(-50%,0)}

@media (max-width:900px){
    .top-nav{height:52px; padding:0 12px; gap:8px}
    .page-title{font-size:12.5px}
    .back-btn{padding:6px 11px; font-size:12px}
    .top-right-bar{top:calc(max(8px,env(safe-area-inset-top)) + 48px) !important; right:8px !important}
    #bTheme{height:34px; padding:0 11px; font-size:11.5px}
    .app{top:100px; padding:8px 10px 84px}
    .filters{padding:11px 12px}
    .cards{grid-template-columns:minmax(0,1fr)}
    .chip{font-size:11px; padding:5px 10px}
    .chip-row .lbl{min-width:40px; font-size:10.5px}
    #btn-fullscreen{bottom:calc(10px + env(safe-area-inset-bottom,0px)); right:10px; padding:8px 13px; font-size:12px}
}
@media (max-width:430px){
    .page-title .pill-badge{display:none}
    .count-pill{font-size:11px; padding:5px 10px}
    .unit-head h2{font-size:13px}
}
@media (max-height:500px) and (orientation:landscape){
    .top-nav{height:44px}
    .app{top:44px}
    .top-right-bar{top:max(6px,env(safe-area-inset-top)) !important; right:88px !important}
}
</style>
</head>
<body>

<nav class="top-nav">
    <a href="../../index.html" class="back-btn" onclick="var r=document.referrer;if(history.length>1&&r&&r.indexOf(location.origin+'/')===0&&/(\/|index(_3d)?\.html)(\?|#|$)/.test(r)){history.back();return false;}"><span>⬅</span> 메인</a>
    <div class="page-title"><span class="t">2022 개정 교과서 단원 매핑</span><span class="pill-badge">교실 도구</span></div>
</nav>

<div class="top-right-bar">
    <div class="tr-util">
        <button id="bTheme" type="button">🌙 야간 모드</button>
    </div>
</div>

<div class="app">
<div class="wrap">

    <div class="filters">
        <div class="search-row">
            <div class="search-box">
                <span class="ic">🔎</span>
                <input type="text" id="q" placeholder="단원·키워드로 찾기 (예: 빛과 파동, 용해도, 세포 분열)" autocomplete="off">
            </div>
            <span class="count-pill" id="countPill">0개 실험실</span>

        <div class="chip-row" id="areaRow">
            <span class="lbl">영역</span>
            <button class="chip on" type="button" data-area="all">전체</button>
            <button class="chip phys" type="button" data-area="물리">물리</button>
            <button class="chip chem" type="button" data-area="화학">화학</button>
            <button class="chip bio" type="button" data-area="생명</button>
            <button class="chip earth" type="button" data-area="지구과학">지구과학</button>
        </div>

        <div class="chip-row" id="pubRow">
            <span class="lbl">출판사</span>
            <button class="chip on" type="button" data-pub="all">전체</button>
            <button class="chip" type="button" data-pub="비상">비상</button>
            <button class="chip" type="button" data-pub="미래엔">미래엔</button>
            <button class="chip" type="button" data-pub="천재">천재</button>
            <button class="chip" type="button" data-pub="동아">동아</button>
            <button class="chip" type="button" data-pub="금성">금성</button>
        </div>

        <div class="chip-row" style="margin-top:9px">
            <label class="switch"><input type="checkbox" id="optDeep" checked> 심화·고등 연계 실험실도 함께 보기</label>
            <div class="spacer" style="margin-left:auto"></div>
            <button class="chip" type="button" id="btnReset">필터 초기화</button>
        </div>
    </div>

    <div id="results"></div>

    <p class="note" style="margin-top:14px">
        단원 이름은 2022 개정 과학과 교육과정의 성취기준을 기준으로 정리했습니다. 출판사 표기는 검정 교과서 5종(비상·미래엔·천재·동아·금성)의 공통 수록 여부를 뜻하며, 학년과 단원 위치는 학교 교육과정 편성에 따라 다를 수 있습니다.
        ‘심화·고등 연계’ 표시가 붙은 실험실은 중학교 교과서 범위를 넘는 내용이므로 동아리·과학고·진로 수업에서 활용하세요.
    </p>

</div>
</div>

<button id="btn-fullscreen" type="button" aria-pressed="false" aria-label="전체화면으로 전환">
    <span class="fs-icon" id="fsIcon">⛶</span><span class="fs-text" id="fsText">전체화면</span>
</button>

<script>
/* ==========================================================
   2022 개정 교과서 단원 매핑
   - Science Virtual LAB의 실제 실험실 파일을 단원에 1:1 매핑

    var DATA = [

        { f: '../physics/mechanics/hookeslaw.html', t: '추와 용수철', area: '물리', unit: '힘과 운동', sub: '탄성력과 용수철의 늘어난 길이', keys: ['탄성력', '용수철', '훅 법칙', '무게'] },

        { f: '../physics/mechanics/mechanicalenergy.html', t: '역학적 에너지 보존', area: '물리', unit: '에너지 전환과 보존', sub: '위치 에너지와 운동 에너지의 전환', keys: ['위치에너지', '운동에너지', '에너지 보존', '전환'] },
        { f: '../physics/mechanics/parabola.html', t: '포물선 운동', area: '물리', unit: '힘과 운동', sub: '수평으로 던진 물체의 운동', keys: ['포물선', '수평', '던지기'], deep: true },
        { f: '../physics/mechanics/shm.html', t: '단순 조화 진동', area: '물리', unit: '힘과 운동', sub: '진동의 주기와 진폭', keys: ['진동', '주기', '진폭', '복원력'], deep: true },

    var state = { area: 'all', pub: 'all', q: '', deep: true };

    /* 출판사 수록 정보: 중학교 검정 교과서 범위 안의 실험실은 5종 모두 수록 */
    DATA.forEach(function (d) {
        d.pubs = d.deep ? [] : PUBS_ALL.slice();
    });

    function norm(s) { return String(s || '').toLowerCase().replace(/\s+/g, ''); }

    function matches(d) {
        if (state.area !== 'all' && d.area !== state.area) return false;
        if (state.pub !== 'all' && d.pubs.indexOf(state.pub) < 0) return false;
        if (!state.deep && d.deep) return false;
        if (!state.q) return true;
        var q = norm(state.q);
        var hay = norm(d.t + d.unit + d.sub + d.keys.join('') + d.f + (d.deep ? '심화고등' : ''));
        return hay.indexOf(q) >= 0;
    }

    function render() {
        var list = DATA.filter(matches);
        $('#countPill').textContent = list.length + '개 실험실';

        if (!list.length) {
            $('#results').innerHTML = '<div class="empty">조건에 맞는 실험실이 없습니다.<br>키워드를 줄이거나 ‘전체’를 눌러 보세요.</div>';
            return;
        }

        /* 단원별로 묶기 (영역 → 단원 순서 유지) */
        var order = [], groups = {};
        list.forEach(function (d) {
            var key = d.area + '|' + d.unit;
            if (!groups[key]) { groups[key] = []; order.push(key); }
            groups[key].push(d);
        });

        var html = '';
        order.forEach(function (key) {
            var parts = key.split('|');
            var area = parts[0], unit = parts[1];
            var items = groups[key];
            html += '<div class="unit-group">' +
                '<div class="unit-head">' +
                '<span class="bar" style="background:var(--' + AREA_CLASS[area] + ')"></span>' +
                '<h2>' + esc(unit) + '</h2>' +
                '<span class="area ' + AREA_CLASS[area] + '">' + area + '</span>' +
                '<span class="n">' + items.length + '개</span>' +
                '</div><div class="cards">';
            items.forEach(function (d) {
                html += '<div class="lab">' +
                    '<div class="lab-top">' +
                    '<span class="lab-title">' + esc(d.t) + '</span>' +
                    (d.deep ? '<span class="badge-deep">심화·고등</span>' : '') +
                    '</div>' +
                    '<div class="lab-sub">' + esc(d.sub) + '</div>' +
                    '<div class="lab-keys">' + d.keys.slice(0, 4).map(function (k) { return '<span>' + esc(k) + '</span>'; }).join('') + '</div>' +
                    '<div class="lab-path" title="' + esc(d.f) + '">' + esc(d.f.replace('../', '/labs/')) + '</div>' +
                    '<div class="lab-act">' +
                    '<a href="' + esc(d.f) + '" target="_blank" rel="noopener">▶ 바로 열기</a>' +
                    '<button type="button" data-copy="' + esc(d.f) + '">📋 경로 복사</button>' +
                    '</div></div>';
            });
            html += '</div></div>';
        });
        $('#results').innerHTML = html;
    }

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
            return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c];
        });
    }

    /* ---------------- 이벤트 ---------------- */
    var qTimer = null;
    $('#q').addEventListener('input', function () {
        var v = this.value;
        clearTimeout(qTimer);
        qTimer = setTimeout(function () { state.q = v; render(); }, 120);
    });

    $('#areaRow').addEventListener('click', function (e) {
        var btn = e.target.closest('button[data-area]');
        if (!btn) return;
        state.area = btn.getAttribute('data-area');
        Array.prototype.forEach.call(this.querySelectorAll('button'), function (b) {
            b.classList.toggle('on', b === btn);
        });
        render();
    });

    $('#pubRow').addEventListener('click', function (e) {
        var btn = e.target.closest('button[data-pub]');
        if (!btn) return;
        state.pub = btn.getAttribute('data-pub');
        Array.prototype.forEach.call(this.querySelectorAll('button'), function (b) {
            b.classList.toggle('on', b === btn);
        });
        render();
    });

    $('#optDeep').addEventListener('change', function () {
        state.deep = !!this.checked;
        render();
    });

    $('#btnReset').addEventListener('click', function () {
        state = { area: 'all', pub: 'all', q: '', deep: true };
        $('#q').value = '';
        $('#optDeep').checked = true;
        Array.prototype.forEach.call(document.querySelectorAll('#areaRow button'), function (b) {
            b.classList.toggle('on', b.getAttribute('data-area') === 'all');
        });
        Array.prototype.forEach.call(document.querySelectorAll('#pubRow button'), function (b) {
            b.classList.toggle('on', b.getAttribute('data-pub') === 'all');
        });
        render();
        toast('필터를 초기화했습니다');
    });

    $('#results').addEventListener('click', function (e) {
        var btn = e.target.closest('button[data-copy]');
        if (!btn) return;
        copyText(btn.getAttribute('data-copy'), '실험실 경로를 복사했습니다');
    });

    function copyText(text, okMsg) {
        var done = function () { toast(okMsg || '복사했습니다'); };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done, fallback);
            return;
        }
        fallback();
        function fallback() {
            try {
                var ta = document.createElement('textarea');
                ta.value = text;
                ta.style.cssText = 'position:fixed;left:-9999px;top:0';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
                done();
            } catch (err) { toast('이 브라우저에서는 복사를 지원하지 않습니다'); }
        }
    }

    function toast(msg) {
        var el = document.getElementById('fs-toast');
        if (!el) {
            el = document.createElement('div');
            el.className = 'fs-toast'; el.id = 'fs-toast';
            document.body.appendChild(el);
        }
        el.textContent = msg; void el.offsetWidth; el.classList.add('show');
        clearTimeout(toast._t);
        toast._t = setTimeout(function () { el.classList.remove('show'); }, 2600);
    }

    /* ---------------- 테마 · 전체화면 ---------------- */
    function applyTheme(dark) {
        document.body.classList.toggle('dark', dark);
        $('#bTheme').textContent = dark ? '☀️ 주간 모드' : '🌙 야간 모드';
        try { localStorage.setItem('svl_map_theme', dark ? '1' : '0'); } catch (e) { }
    }
    $('#bTheme').addEventListener('click', function () { applyTheme(!document.body.classList.contains('dark')); });
    try { if (localStorage.getItem('svl_map_theme') === '1') applyTheme(true); } catch (e) { }

    (function () {
        var btn = document.getElementById('btn-fullscreen');
        var iconEl = document.getElementById('fsIcon');
        var textEl = document.getElementById('fsText');
        var root = document.documentElement;
        var PSEUDO = 'pseudo-fullscreen';
        function isRealFs() {
            return !!(document.fullscreenElement || document.webkitFullscreenElement ||
                document.mozFullScreenElement || document.msFullscreenElement);
        }
        function isPseudo() { return document.body.classList.contains(PSEUDO); }
        function syncUI() {
            var on = isRealFs() || isPseudo();
            iconEl.textContent = on ? '🗗' : '⛶';
            textEl.textContent = on ? '창모드' : '전체화면';
            btn.setAttribute('aria-pressed', on ? 'true' : 'false');
            btn.setAttribute('aria-label', on ? '창모드로 전환' : '전체화면으로 전환');
        }
        function enterPseudo(hint) {
            if (isRealFs()) return;
            document.body.classList.add(PSEUDO);
            syncUI();
            if (hint) toast('이 브라우저는 브라우저 전체화면 대신 상단 바를 숨긴 몰입 모드로 표시합니다');
        }
        function requestReal() {
            var req = root.requestFullscreen || root.webkitRequestFullscreen || root.mozRequestFullScreen || root.msRequestFullscreen;
            if (!req) return false;
            try {
                var p = req.call(root);
                if (p && typeof p.then === 'function') p.then(syncUI, function () { enterPseudo(true); });
                else setTimeout(function () { if (!isRealFs() && !isPseudo()) enterPseudo(true); else syncUI(); }, 500);
                return true;
            } catch (err) { return false; }
        }
        btn.addEventListener('click', function () {
            if (isRealFs()) {
                var exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
                try { if (exit) { var q = exit.call(document); if (q && typeof q.catch === 'function') q.catch(function () { }); } } catch (err) { }
                syncUI(); return;
            }
            if (isPseudo()) { document.body.classList.remove(PSEUDO); syncUI(); return; }
            if (!requestReal()) enterPseudo(true);
            syncUI();
        });
        ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
            document.addEventListener(ev, function () {
                if (isRealFs()) document.body.classList.remove(PSEUDO);
                syncUI();
            });
        });
        document.addEventListener('keydown', function (e) {
            if ((e.key === 'Escape' || e.key === 'Esc') && isPseudo() && !isRealFs()) {
                document.body.classList.remove(PSEUDO); syncUI();
            }
        });
        window.addEventListener('resize', syncUI);
        syncUI();
    })();

    /* ---------------- 시작 ---------------- */
    render();
})();
</script>
<script src="../common/feedback.js" defer></script>
