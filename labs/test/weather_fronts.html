<!DOCTYPE html>
<html lang="ko" data-mzoom="1.05">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>온난·한랭 전선과 날씨 3D</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="preload" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff" as="font" type="font/woff" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script src="../common/lib/three.min.js"></script>
<script>if(!window.THREE){document.write('<scr'+'ipt src="../common/lib/three.min.js"><\/scr'+'ipt>');}</script>
<script src="../common/lib/OrbitControls.js"></script>
<script>if(!(window.THREE&&THREE.OrbitControls)){document.write('<scr'+'ipt src="../common/lib/OrbitControls.js"><\/scr'+'ipt>');}</script>
<link rel="stylesheet" href="../common/ui-layout.css">
<style>

@font-face{
  font-family:'SeoulNamsan';
  src:local('SeoulNamsan M'),local('SeoulNamsanM'),local('서울남산체 M'),
      url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff') format('woff');
  font-weight:400;font-style:normal;font-display:swap;
}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;padding:0;width:100%;height:100%;overflow:hidden;
  font-family:'SeoulNamsan',-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color:#16202e;
  background:linear-gradient(180deg,#f8fbff 0%,#e9f1fa 52%,#dbe6f2 100%);
  transition:background .35s ease,color .35s ease;
  touch-action:none;
}
body.dark-mode{color:#eef4ff;background:linear-gradient(180deg,#1a2740 0%,#101a2c 50%,#060a12 100%)}
#canvas-container{position:absolute;inset:0;z-index:1;touch-action:none}
#canvas-container canvas{display:block}

/* ---------- 유리 카드 ---------- */
.glass-panel{
  background:rgba(255,255,255,.80);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(255,255,255,.62);
  border-radius:18px;
  box-shadow:0 10px 28px rgba(15,23,42,.10);
  transition:background .35s ease,border-color .35s ease,color .35s ease;
}
body.dark-mode .glass-panel{background:rgba(18,28,46,.86);border-color:rgba(255,255,255,.13);box-shadow:0 10px 30px rgba(0,0,0,.5)}

/* ---------- 좌상단 : 메인 / 제목 ---------- */
.top-left-bar{position:fixed;top:16px;left:18px;display:flex;align-items:center;gap:10px;z-index:40;max-width:calc(100vw - 112px)}
.back-btn{
  display:flex;align-items:center;gap:6px;padding:9px 16px;font-size:14px;font-weight:700;font-family:inherit;
  color:#16202e;text-decoration:none;border:none;border-radius:999px;cursor:pointer;white-space:nowrap;
  background:rgba(255,255,255,.80);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.62);box-shadow:0 10px 28px rgba(15,23,42,.10);transition:transform .18s,background .35s;
}
body.dark-mode .back-btn{color:#eef4ff;background:rgba(18,28,46,.86);border-color:rgba(255,255,255,.13)}
.back-btn:active{transform:scale(.97)}
.tag-badge{display:flex;align-items:center;gap:8px;padding:9px 16px;font-size:14px;font-weight:700;border-radius:999px;min-width:0;overflow:hidden}
.tag-badge .title-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vision-badge{flex:0 0 auto;background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;letter-spacing:.2px}

/* ---------- 우상단 : 유틸 + 데이터 ---------- */
.icon-btn{
  width:38px;height:38px;min-width:38px;border-radius:50%;border:1px solid rgba(255,255,255,.62);
  display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;cursor:pointer;font-family:inherit;
  color:#16202e;background:rgba(255,255,255,.80);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 8px 22px rgba(15,23,42,.10);transition:background .35s,border-color .35s;
}
body.dark-mode .icon-btn{color:#eef4ff;background:rgba(18,28,46,.86);border-color:rgba(255,255,255,.13)}
.data-card{display:flex;align-items:center;gap:14px;padding:9px 16px;border-radius:16px}
.data-item{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.data-label{font-size:10.5px;font-weight:700;color:#64748b;white-space:nowrap;line-height:1.2}
body.dark-mode .data-label{color:#9db0cb}
.data-value{font-size:14px;font-weight:800;color:#16202e;white-space:nowrap;line-height:1.25}
body.dark-mode .data-value{color:#eef4ff}

/* ---------- 중앙 안내 ---------- */
.center-tooltip{
  position:fixed;top:78px;left:50%;transform:translateX(-50%);padding:8px 18px;border-radius:999px;
  font-size:12.5px;font-weight:700;color:#475569;pointer-events:none;z-index:15;white-space:nowrap;
  max-width:calc(100vw - 40px);overflow:hidden;text-overflow:ellipsis;
  background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
body.dark-mode .center-tooltip{color:#cbd5e1;background:rgba(18,28,46,.78);border-color:rgba(255,255,255,.12)}

/* ---------- 우측 조절 패널 ---------- */
body #side-ctrl.side-ctrl-panel{width:250px !important;padding:12px !important;gap:9px !important}
.panel-header{display:flex;align-items:center;justify-content:space-between;gap:6px;padding-bottom:6px;border-bottom:1px solid rgba(15,23,42,.08);width:100%}
body.dark-mode .panel-header{border-bottom-color:rgba(255,255,255,.12)}
.ctrl-block{display:flex;flex-direction:column;gap:7px;width:100%}
.ctrl-row{display:flex;flex-direction:column;gap:3px;width:100%}
.ctrl-row-header{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.ctrl-label{font-size:11.5px;font-weight:700;color:#475569;white-space:nowrap;line-height:1.25}
body.dark-mode .ctrl-label{color:#cbd5e1}
.ctrl-val{font-size:12px;font-weight:800;color:#0a84ff;white-space:nowrap;line-height:1.25}
.ctrl-slider{
  width:100%;height:6px;border-radius:999px;background:#dbe4ef;outline:none;
  -webkit-appearance:none;appearance:none;cursor:pointer;margin:4px 0;
}
body.dark-mode .ctrl-slider{background:#334155}
.ctrl-slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#0a84ff;box-shadow:0 2px 6px rgba(10,132,255,.45);cursor:pointer}
.ctrl-slider::-moz-range-thumb{width:15px;height:15px;border:none;border-radius:50%;background:#0a84ff}
.panel-note{font-size:10.5px;font-weight:700;color:#64748b;line-height:1.45;letter-spacing:-.1px;word-break:keep-all}
body.dark-mode .panel-note{color:#9db0cb}
.seg-toggle{display:flex;gap:3px;background:rgba(15,23,42,.06);padding:3px;border-radius:11px;width:100%}
body.dark-mode .seg-toggle{background:rgba(0,0,0,.3)}
.seg-btn{
  flex:1 1 0;min-width:0;padding:7px 2px;border:none;border-radius:8px;background:transparent;
  color:#64748b;font-family:inherit;font-size:11.5px;font-weight:800;cursor:pointer;white-space:nowrap;transition:all .18s;
}
body.dark-mode .seg-btn{color:#94a3b8}
.seg-btn.active{background:#0a84ff;color:#fff;box-shadow:0 2px 8px rgba(10,132,255,.35)}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}
.mode-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:44px;padding:6px 3px;
  border-radius:12px;border:1px solid rgba(15,23,42,.09);background:rgba(255,255,255,.9);color:#334155;
  font-family:inherit;font-size:11px;font-weight:800;white-space:nowrap;cursor:pointer;transition:all .18s;
}
body.dark-mode .mode-btn{background:rgba(30,42,62,.9);border-color:rgba(255,255,255,.12);color:#cbd5e1}
.mode-btn .mb-icon{font-size:14px;line-height:1}
.mode-btn.active{background:#0a84ff;border-color:#0a84ff;color:#fff;box-shadow:0 4px 12px rgba(10,132,255,.35)}

/* ---------- 좌측 보조 패널 (그래프 · 정보) ---------- */
.side-left-panel{position:fixed;left:18px;bottom:76px;width:252px;padding:12px;z-index:20;border-radius:18px}
.side-left-panel .panel-title{font-size:12px;font-weight:800;color:#334155;margin:0 0 6px;letter-spacing:-.2px}
body.dark-mode .side-left-panel .panel-title{color:#cbd5e1}
.side-left-panel canvas{display:block;width:100%;height:auto;border-radius:10px}

/* ---------- 하단 ---------- */
.bottom-right-bar{position:fixed;right:18px;bottom:18px;display:flex;align-items:center;gap:10px;z-index:40}

/* ---------- 모바일 세로 ---------- */
@media (max-width:900px){
  .top-left-bar{top:max(8px,env(safe-area-inset-top));left:8px;gap:6px;max-width:calc(100vw - 66px)}
  .back-btn{padding:7px 11px;font-size:12px}
  .tag-badge{padding:7px 11px;font-size:12px}
  .vision-badge{display:none}
  .icon-btn{width:32px;height:32px;min-width:32px;font-size:14px}
  .data-card{gap:9px;padding:6px 10px;border-radius:14px}
  .data-label{font-size:9px}
  .data-value{font-size:12px}
  .center-tooltip{display:none}
  body #side-ctrl.side-ctrl-panel{
    right:8px !important;width:226px !important;
    bottom:calc(64px + env(safe-area-inset-bottom)) !important;
    max-height:min(56vh,420px) !important;padding:9px !important;gap:6px !important;
  }
  .ctrl-label{font-size:10.5px}
  .ctrl-val{font-size:11px}
  .panel-note{font-size:9.5px}
  .mode-btn{min-height:40px;font-size:10px}
  .seg-btn{font-size:10.5px;padding:6px 2px}
  .bottom-right-bar{right:8px;bottom:calc(8px + env(safe-area-inset-bottom))}
  #fullscreenText{display:none}
  .side-left-panel{left:8px;right:auto;top:calc(env(safe-area-inset-top) + 112px);bottom:auto;width:212px;padding:8px;max-height:none;overflow:hidden}
  .side-left-panel .panel-title{font-size:10.5px;margin-bottom:4px}
  .side-left-panel canvas{max-height:106px}
}

/* ---------- 모바일 가로 ---------- */
@media (max-height:520px) and (orientation:landscape){
  .top-left-bar{top:max(6px,env(safe-area-inset-top));left:6px;gap:5px;max-width:46vw}
  .back-btn{padding:5px 9px;font-size:11px}
  .tag-badge{padding:5px 9px;font-size:11px}
  .vision-badge{display:none}
  .icon-btn{width:28px;height:28px;min-width:28px;font-size:13px}
  .data-card{gap:8px;padding:4px 9px;border-radius:12px}
  .data-label{font-size:8.5px}
  .data-value{font-size:11px}
  .center-tooltip{display:none}
  body #side-ctrl.side-ctrl-panel{
    right:8px !important;width:226px !important;
    bottom:calc(46px + env(safe-area-inset-bottom)) !important;
    max-height:calc(100vh - 108px) !important;padding:8px !important;gap:5px !important;
  }
  .ctrl-label{font-size:10px}
  .ctrl-val{font-size:10.5px}
  .panel-note{display:none}
  .mode-btn{min-height:34px;font-size:9.5px}
  .mode-btn .mb-icon{font-size:12px}
  .seg-btn{font-size:10px;padding:5px 2px}
  .side-left-panel{left:6px;bottom:calc(46px + env(safe-area-inset-bottom));width:176px;padding:6px}
  .side-left-panel .panel-title{font-size:9.5px;margin-bottom:3px}
  .bottom-right-bar{right:8px;bottom:calc(6px + env(safe-area-inset-bottom))}
}

/* ===== page ===== */
.legend{display:flex;gap:9px;flex-wrap:wrap;font-size:10px;font-weight:800;color:#475569;width:100%}
body.dark-mode .legend{color:#cbd5e1}
.legend span{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
#chart{width:100%;height:auto;display:block;border-radius:10px;background:rgba(255,255,255,.5)}
body.dark-mode #chart{background:rgba(10,18,32,.55)}

</style>
</head>
<body>
<div id="canvas-container"></div>

<div class="top-left-bar">
  <a href="../../index.html" class="back-btn" onclick="var r=document.referrer;if(history.length>1&&r&&r.indexOf(location.origin+'/')===0&&/(\/|index(_3d)?\.html)(\?|#|$)/.test(r)){history.back();return false;}"><span>⬅</span> 메인</a>
  <div class="glass-panel tag-badge">
    <span class="title-text">온난·한랭 전선과 날씨 3D</span>
    <span class="vision-badge">visionOS</span>
  </div>
</div>

<div class="top-right-bar">
  <div class="tr-util">
    <button class="icon-btn" id="theme-toggle" type="button" title="주간/야간 모드" aria-label="주간/야간 모드 전환">🌙</button>
  </div>
  <div class="glass-panel data-card">
    <div class="data-item"><span class="data-label">관측 지점 기온</span><span class="data-value" id="val-t" style="color:#ef4444">—</span></div>
    <div class="data-item"><span class="data-label">기압</span><span class="data-value" id="val-p" style="color:#3b82f6">—</span></div>
    <div class="data-item"><span class="data-label">강수</span><span class="data-value" id="val-rain" style="color:#0ea5e9">—</span></div>
    <div class="data-item"><span class="data-label">전선</span><span class="data-value" id="val-pos" style="color:#7c3aed">—</span></div>
  </div>
</div>

<div class="glass-panel center-tooltip" id="guide-tooltip">💡 차가운 공기와 따뜻한 공기가 만나면 전선면을 따라 구름과 비가 만들어집니다</div>

<div class="glass-panel bottom-control-bar">
  <button class="control-tab-btn" id="btn-reset" type="button"><span>🔄</span><span>초기화</span></button>
  <button class="control-tab-btn" id="btn-cam" type="button"><span>🎥</span><span>시점정렬</span></button>
</div>

<div class="glass-panel side-left-panel" id="graph-panel">
  <div class="panel-title">📈 전선 통과 전후 기온·기압</div>
  <canvas id="chart" width="460" height="230"></canvas>
</div>

<div class="glass-panel side-ctrl-panel" id="side-ctrl">
  <div class="panel-header"><span class="panel-title">🌧️ 전선 조절</span></div>
  <div class="ctrl-block">
    <div class="mode-grid" id="mode-grid" style="grid-template-columns:1fr 1fr 1fr;">
      <button class="mode-btn active" type="button" data-mode="cold"><span class="mb-icon">⚡</span><span>한랭전선</span></button>
      <button class="mode-btn" type="button" data-mode="warm"><span class="mb-icon">🌥️</span><span>온난전선</span></button>
      <button class="mode-btn" type="button" data-mode="stationary"><span class="mb-icon">☁️</span><span>정체전선</span></button>
    </div>
    <div class="ctrl-row">
      <div class="ctrl-row-header"><span class="ctrl-label">전선 진행</span><span class="ctrl-val" id="txt-prog">통과 전</span></div>
      <input type="range" class="ctrl-slider" id="sld-prog" min="0" max="100" step="1" value="18">
    </div>
    <div class="legend">
      <span><i style="background:#3b82f6"></i>차가운 공기</span>
      <span><i style="background:#f87171"></i>따뜻한 공기</span>
    </div>
    <div class="panel-note" id="note">한랭전선: 찬 공기가 따뜻한 공기를 급하게 밀어 올려 좁은 지역에 강한 소나기가 내립니다.</div>
  </div>
</div>

<script>
/* =====================================================================
   온난·한랭 전선과 날씨 3D  —  lab script
   ===================================================================== */
(function () {
'use strict';

var $ = function (s) { return document.querySelector(s); };

var X0 = -13, X1 = 13, TOP = 9, ZD = 8;
var RAIN_N = 700;

var MODES = {
    cold: {
        slope: 0.62,
        note: '한랭전선: 찬 공기가 따뜻한 공기를 급하게 밀어 올립니다. 전선면이 가파르고 적운형 구름이 발달해 좁은 지역에 세찬 소나기가 내립니다.',
        rain: '소나기',
        clouds: '적운형 구름'
    },
    warm: {
        slope: 0.16,
        note: '온난전선: 따뜻한 공기가 찬 공기 위로 완만하게 올라갑니다. 전선면이 완만해 층운형 구름이 넓게 퍼지고 비가 오래 지속됩니다.',
        rain: '지속적인 비',
        clouds: '층운형 구름'
    },
    stationary: {
        slope: 0.34,
        note: '정체전선: 찬 공기와 따뜻한 공기의 세력이 비슷해 전선이 거의 움직이지 않습니다. 흐린 날씨와 비가 오래 이어집니다.',
        rain: '약한 비',
        clouds: '층운형 구름'
    }
};

var state = { mode: 'cold', prog: 18 };

/* ---------------- 렌더러 · 씬 ---------------- */
var container = $('#canvas-container');
var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(45, 1, 0.5, 400);
var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
if (THREE.sRGBEncoding) renderer.outputEncoding = THREE.sRGBEncoding;
container.appendChild(renderer.domElement);

var controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 10;
controls.maxDistance = 70;
controls.maxPolarAngle = Math.PI * 0.495;
controls.target.set(0, 3.9, 0);

/* ---------------- 조명 ---------------- */
var hemi = new THREE.HemisphereLight(0xffffff, 0xd2dbe8, 0.98);
scene.add(hemi);
var key = new THREE.DirectionalLight(0xffffff, 0.8);
key.position.set(9, 16, 14);
key.castShadow = true;
key.shadow.mapSize.width = 1024;
key.shadow.mapSize.height = 1024;
key.shadow.camera.left = -22;
key.shadow.camera.right = 22;
key.shadow.camera.top = 14;
key.shadow.camera.bottom = -6;
key.shadow.camera.near = 1;
key.shadow.camera.far = 70;
scene.add(key);
var fill = new THREE.DirectionalLight(0xc6dcff, 0.28);
fill.position.set(-10, 8, -8);
scene.add(fill);

/* ---------------- 하늘 배경 ---------------- */
(function backdrop() {
    var c = document.createElement('canvas');
    c.width = 8; c.height = 256;
    var ctx = c.getContext('2d');
    var g = ctx.createLinearGradient(0, 0, 0, 256);
    g.addColorStop(0, '#5ea6e8');
    g.addColorStop(0.62, '#b3d8f5');
    g.addColorStop(1, '#e9f5ff');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 8, 256);
    var tex = new THREE.CanvasTexture(c);
    if (THREE.sRGBEncoding) tex.encoding = THREE.sRGBEncoding;
    var mesh = new THREE.Mesh(new THREE.PlaneGeometry(160, 80),
        new THREE.MeshBasicMaterial({ map: tex, depthWrite: false, depthTest: false }));
    mesh.position.set(0, 22, -26);
    mesh.renderOrder = -20;
    scene.add(mesh);
})();

/* ---------------- 지면 ---------------- */
var soilMat = new THREE.MeshStandardMaterial({ color: 0x8c7f68, roughness: 0.95 });
var groundMat = new THREE.MeshStandardMaterial({ color: 0x74b95c, roughness: 0.95 });

var soil = new THREE.Mesh(new THREE.BoxGeometry(40, 0.8, ZD + 1.2), soilMat);
soil.position.set(0, -0.4, 0);
soil.receiveShadow = true;
scene.add(soil);

var ground = new THREE.Mesh(new THREE.PlaneGeometry(40, ZD + 1.1), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.set(0, 0.01, 0);
ground.receiveShadow = true;
scene.add(ground);

/* ---------------- 공기 덩어리 ---------------- */
var airGroup = new THREE.Group();
scene.add(airGroup);

var coldMat = new THREE.MeshPhysicalMaterial({
    color: 0x3f8ff0, transparent: true, opacity: 0.5, roughness: 0.55,
    metalness: 0.0, depthWrite: false, side: THREE.DoubleSide
});
var warmMat = new THREE.MeshPhysicalMaterial({
    color: 0xff7a55, transparent: true, opacity: 0.34, roughness: 0.6,
    metalness: 0.0, depthWrite: false, side: THREE.DoubleSide
});

var coldMesh = null, warmMesh = null;
var edgeGroup = new THREE.Group();
scene.add(edgeGroup);

function toShape(pts) {
    var sh = new THREE.Shape();
    sh.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) sh.lineTo(pts[i][0], pts[i][1]);
    sh.lineTo(pts[0][0], pts[0][1]);
    return sh;
}

function extrude(pts) {
    var g = new THREE.ExtrudeGeometry(toShape(pts), { depth: ZD, bevelEnabled: false, curveSegments: 1 });
    g.translate(0, 0, -ZD / 2);
    return g;
}

function frontX() {
    if (state.mode === 'stationary') {
        return Math.sin(state.prog / 100 * Math.PI * 2) * 1.1;
    }
    return -9.6 + 19.2 * (state.prog / 100);
}

function rebuildAir() {
    var xf = frontX();
    var s = MODES[state.mode].slope;
    var xTop = xf - TOP / s;          // 전선면이 천장에 닿는 x
    var yAtLeft = Math.min(TOP, s * (xf - X0));
    var coldPts, warmPts, edgePts;

    if (state.mode === 'warm') {
        /* 온난전선: 따뜻한 공기가 왼쪽에서 오른쪽으로 올라탄다.
           전선 앞쪽(오른쪽)은 찬 공기가 가득하고, 왼쪽은 전선면 위가 따뜻한 공기 */
        coldPts = [[X0, 0], [X1, 0], [X1, TOP], [xf, TOP], [xf, 0], [X0, yAtLeft]];
        warmPts = [[X0, yAtLeft], [xf, 0], [xf, TOP], [X0, TOP]];
        if (yAtLeft >= TOP - 0.01) {
            warmPts = [[X0, TOP], [xf, 0], [xf, TOP]];
        }
        edgePts = [new THREE.Vector3(xf, 0, 0.6), new THREE.Vector3(X0, yAtLeft, 0.6)];
    } else {
        /* 한랭전선 · 정체전선: 찬 공기가 왼쪽에서 오른쪽으로 밀고 나간다 */
        coldPts = [[X0, 0], [xf, 0]];
        if (xTop > X0) {
            coldPts.push([xTop, TOP]);
            coldPts.push([X0, TOP]);
        } else {
            coldPts.push([X0, yAtLeft]);
        }
        if (xTop > X0) {
            warmPts = [[xf, 0], [xTop, TOP], [X1, TOP], [X1, 0]];
        } else {
            warmPts = [[xf, 0], [X0, yAtLeft], [X0, TOP], [X1, TOP], [X1, 0]];
        }
        edgePts = [new THREE.Vector3(xf, 0, 0.6), new THREE.Vector3(xf - yAtLeft / s, yAtLeft, 0.6)];
    }

    if (coldMesh) { airGroup.remove(coldMesh); coldMesh.geometry.dispose(); }
    if (warmMesh) { airGroup.remove(warmMesh); warmMesh.geometry.dispose(); }
    coldMesh = new THREE.Mesh(new THREE.ShapeGeometry(toShape(coldPts)), coldMat);
    coldMesh.position.z = 0.55;
    coldMesh.renderOrder = 4;
    warmMesh = new THREE.Mesh(new THREE.ShapeGeometry(toShape(warmPts)), warmMat);
    warmMesh.position.z = 0.2;
    warmMesh.renderOrder = 3;
    airGroup.add(warmMesh, coldMesh);

    /* 전선면 경계선 */
    while (edgeGroup.children.length) {
        var c = edgeGroup.children.pop();
        if (c.geometry) c.geometry.dispose();
        if (c.material) c.material.dispose();
    }
    var edgeMat = new THREE.LineBasicMaterial({ color: 0x1e3a8a, transparent: true, opacity: 0.75 });
    var g = new THREE.BufferGeometry().setFromPoints(edgePts);
    edgeGroup.add(new THREE.Line(g, edgeMat));
}

/* ---------------- 구름 ---------------- */
var cloudGroup = new THREE.Group();
scene.add(cloudGroup);

function clearGroup(g) {
    while (g.children.length) {
        var ch = g.children.pop();
        if (ch.traverse) {
            ch.traverse(function (o) {
                if (o.geometry && !o.geometry.__shared) o.geometry.dispose();
                if (o.material && !o.material.__shared) o.material.dispose();
            });
        }
    }
}

function puff(mat, x, y, z, r) {
    var m = new THREE.Mesh(new THREE.SphereGeometry(r, 14, 10), mat);
    m.position.set(x, y, z);
    return m;
}

function buildClouds() {
    clearGroup(cloudGroup);
    var mode = state.mode;

    if (mode === 'cold') {
        var dark = new THREE.MeshStandardMaterial({ color: 0x6f7a8c, roughness: 1.0 });
        var light = new THREE.MeshStandardMaterial({ color: 0xf2f6fb, roughness: 1.0 });
        for (var i = 0; i < 7; i++) {
            var yy = 3.4 + i * 0.78;
            var w = 2.5 - i * 0.22;
            for (var k = 0; k < 3; k++) {
                var mat = i < 2 ? dark : light;
                var p = puff(mat, -1.1 + (k - 1) * (w * 0.62), yy, (k - 1) * 1.5, w * (0.46 + Math.random() * 0.08));
                cloudGroup.add(p);
            }
        }
        /* 상단 모루 구름 */
        for (var a = 0; a < 4; a++) {
            var an = puff(light, -2.4 - a * 1.15, 8.4 + (a % 2) * 0.28, (a - 1.5) * 1.3, 1.15 - a * 0.12);
            an.scale.y = 0.55;
            cloudGroup.add(an);
        }
    } else if (mode === 'warm') {
        var g1 = new THREE.MeshStandardMaterial({ color: 0xa8b3c2, roughness: 1.0 });
        var g2 = new THREE.MeshStandardMaterial({ color: 0xe9eef5, roughness: 1.0 });
        for (var j = 0; j < 9; j++) {
            var xx = 1.4 + j * 1.45;
            var r = 1.5 + Math.sin(j * 0.9) * 0.35;
            var p1 = puff(j % 2 ? g1 : g2, xx, 4.5 + Math.sin(j * 0.7) * 0.22, 0, r);
            p1.scale.set(1, 0.62, 1.5);
            cloudGroup.add(p1);
            if (j % 2 === 0) {
                var p2 = puff(g2, xx + 0.5, 5.12, 0.6, r * 0.8);
                p2.scale.set(1, 0.6, 1.3);
                cloudGroup.add(p2);
            }
        }
    } else {
        var s1 = new THREE.MeshStandardMaterial({ color: 0x9fabb9, roughness: 1.0 });
        var s2 = new THREE.MeshStandardMaterial({ color: 0xe4eaf2, roughness: 1.0 });
        for (var n = 0; n < 10; n++) {
            var x2 = -4.5 + n * 1.35;
            var rr = 1.35 + Math.sin(n * 1.2) * 0.3;
            var q = puff(n % 2 ? s1 : s2, x2, 4.2 + Math.sin(n * 0.6) * 0.3, (n % 3 - 1) * 1.1, rr);
            q.scale.set(1, 0.58, 1.2);
            cloudGroup.add(q);
        }
    }
}

/* ---------------- 비 ---------------- */
var rainPos = new Float32Array(RAIN_N * 3);

var rainZ = new Float32Array(RAIN_N);
var rainSpeed = new Float32Array(RAIN_N);

    rainOffset[ri] = Math.random();
    rainZ[ri] = (Math.random() - 0.5) * (ZD - 1.2);
    rainSpeed[ri] = 0.55 + Math.random() * 0.5;
    rainPos[ri * 3 + 1] = Math.random() * 5;
}
var rainGeo = new THREE.BufferGeometry();
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
var rainMat = new THREE.PointsMaterial({
    color: 0x2f7fd0, size: 0.2, transparent: true, opacity: 0.85,
    depthWrite: false, sizeAttenuation: true
});
var rain = new THREE.Points(rainGeo, rainMat);
scene.add(rain);

function rainBand() {
    if (state.mode === 'cold') return [-3.4, 0.8];
    if (state.mode === 'warm') return [-0.6, 12.5];
    return [-3.4, 4.4];
}

var obs = new THREE.Group();
(function observer() {
    var body = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.85, 1.0),
        new THREE.MeshStandardMaterial({ color: 0xfaf5ea, roughness: 0.85 }));

/* ---------------- 라벨 ---------------- */
function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

function makeLabel(text, opts) {
    opts = opts || {};
    var fs = opts.fontSize || 42;
    var color = opts.color || '#16202e';
    var bg = opts.bg || 'rgba(255,255,255,0.92)';
    var border = opts.border || 'rgba(15,23,42,0.12)';
    var padX = 26, padY = 15;
    var font = '700 ' + fs + 'px "SeoulNamsan", -apple-system, "Malgun Gothic", sans-serif';

    var cv = document.createElement('canvas');
    var ctx = cv.getContext('2d');
    ctx.font = font;
    var tw = ctx.measureText(text).width;
    cv.width = Math.ceil(tw + padX * 2);
    cv.height = Math.ceil(fs + padY * 2);

    var tex = new THREE.CanvasTexture(cv);
    if (THREE.sRGBEncoding) tex.encoding = THREE.sRGBEncoding;

    function draw() {
        var c2 = cv.getContext('2d');
        c2.clearRect(0, 0, cv.width, cv.height);
        roundRect(c2, 2, 2, cv.width - 4, cv.height - 4, Math.min(cv.height / 2, 22));
        c2.fillStyle = bg;
        c2.fill();
        c2.lineWidth = 3;
        c2.strokeStyle = border;
        c2.stroke();
        c2.font = font;
        c2.fillStyle = color;
        c2.textAlign = 'center';
        c2.textBaseline = 'middle';
        c2.fillText(text, cv.width / 2, cv.height / 2 + 1);
        tex.needsUpdate = true;
    }
    draw();

    var sprite = new THREE.Sprite(new THREE.SpriteMaterial({
        map: tex, transparent: true, depthTest: false, depthWrite: false
    }));
    var hW = opts.h || 0.56;
    sprite.scale.set(hW * cv.width / cv.height, hW, 1);
    sprite.renderOrder = 900;

    if (document.fonts && document.fonts.load) {
        document.fonts.load('700 ' + fs + 'px "SeoulNamsan"').then(function () {
            var c3 = cv.getContext('2d');
            c3.font = font;
            var tw2 = c3.measureText(text).width;
            if (Math.abs(tw2 - tw) > 1) {
                cv.width = Math.ceil(tw2 + padX * 2);
                sprite.scale.set(hW * cv.width / cv.height, hW, 1);
            }
            draw();
        }, function () {});
    }
    return sprite;
}

var lblCold, lblWarm, lblFront, lblCloud, lblRain, lblObs, lblArrow;

function buildLabels() {
    [lblCold, lblWarm, lblFront, lblCloud, lblRain, lblObs, lblArrow].forEach(function (sp) {
        if (sp) {
            scene.remove(sp);
            if (sp.material.map) sp.material.map.dispose();
            sp.material.dispose();
        }
    });
    var M = MODES[state.mode];
    lblCold = makeLabel('차가운 공기', { color: '#dbeafe', bg: 'rgba(37,99,235,0.94)', border: 'rgba(255,255,255,0.4)', h: 0.72 });
    lblWarm = makeLabel('따뜻한 공기', { color: '#fff1ee', bg: 'rgba(239,68,68,0.92)', border: 'rgba(255,255,255,0.4)', h: 0.72 });
    lblFront = makeLabel('전선면', { color: '#1e3a8a', h: 0.46 });
    lblCloud = makeLabel(M.clouds, { color: '#334155', h: 0.5 });
    lblRain = makeLabel(M.rain, { color: '#0369a1', h: 0.5 });
    lblObs = makeLabel('관측 지점', { color: '#7c2d12', h: 0.46 });
    lblArrow = makeLabel(state.mode === 'cold' ? '찬 공기 밀려옴' : (state.mode === 'warm' ? '따뜻한 공기 상승' : '세력 비슷'), { color: '#1e293b', h: 0.42 });
    [lblCold, lblWarm, lblFront, lblCloud, lblRain, lblObs, lblArrow].forEach(function (s) { scene.add(s); });
}

/* ---------------- 흐름 화살표 ---------------- */
var arrowGroup = new THREE.Group();
scene.add(arrowGroup);

function makeArrow(color, len, radius) {
    var g = new THREE.Group();
    var mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.45, metalness: 0.05 });
    var headLen = Math.min(len * 0.36, 0.6);
    var shaft = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, Math.max(len - headLen, 0.05), 9), mat);
    shaft.position.y = (len - headLen) / 2;
    var head = new THREE.Mesh(new THREE.ConeGeometry(radius * 2.5, headLen, 12), mat);
    head.position.y = (len - headLen) + headLen / 2;
    g.add(shaft, head);
    return g;
}

function rebuildArrows() {
    clearGroup(arrowGroup);
    var xf = frontX();
    var s = MODES[state.mode].slope;
    if (state.mode === 'cold') {
        for (var i = 0; i < 3; i++) {
            var a = makeArrow(0x2563eb, 2.2, 0.09);
            a.rotation.z = -Math.PI / 2;
            a.position.set(xf - 7.5 + i * 1.6, 1.15 + i * 0.5, ZD / 2 - 0.4);
            arrowGroup.add(a);
        }
        for (var j = 0; j < 3; j++) {
            var b = makeArrow(0xdc2626, 2.4, 0.09);
            var px = xf - 2.2 - j * 1.9;
            var py = s * (xf - px) + 0.4;
            b.rotation.z = -Math.PI / 2 + Math.atan(s) * 0.9;
            b.position.set(px, py, ZD / 2 - 0.4);
            arrowGroup.add(b);
        }
    } else if (state.mode === 'warm') {
        for (var k = 0; k < 4; k++) {
            var c = makeArrow(0xdc2626, 2.2, 0.08);
            var cx = xf - 1.0 - k * 3.2;
            var cy = s * (xf - cx) + 0.5;
            c.rotation.z = -Math.PI / 2 + 0.62;
            c.position.set(cx, cy, ZD / 2 - 0.4);
            arrowGroup.add(c);
        }
        var d = makeArrow(0x2563eb, 2.0, 0.08);
        d.rotation.z = Math.PI / 2;
        d.position.set(xf + 2.4, 0.9, ZD / 2 - 0.4);
        arrowGroup.add(d);
    } else {
        var e1 = makeArrow(0x2563eb, 2.0, 0.08);
        e1.rotation.z = -Math.PI / 2;
        e1.position.set(xf - 5.4, 1.1, ZD / 2 - 0.4);
        arrowGroup.add(e1);
        var e2 = makeArrow(0xdc2626, 2.0, 0.08);
        e2.rotation.z = Math.PI / 2 + 0.5;
        e2.position.set(xf + 3.4, 1.3, ZD / 2 - 0.4);
        arrowGroup.add(e2);
    }
}

/* ---------------- 계산 ---------------- */
function sig(x) { return 1 / (1 + Math.exp(-x)); }

function timeHours() { return (state.prog - 50) / 50 * 6; }

function tempAt(t) {
    if (state.mode === 'cold') return 23 - 11.5 * sig((t + 0.25) / 0.55);
    if (state.mode === 'warm') return 11 + 11.5 * sig((t - 0.9) / 2.0);
    return 16.8 + 1.7 * Math.sin(t * 0.55);
}

function pressAt(t) {
    if (state.mode === 'cold') {
        return 1013.5 - 5.2 * Math.exp(-Math.pow((t - 0.1) / 1.15, 2)) + 4.4 * sig((t - 0.9) / 1.4);
    }
    if (state.mode === 'warm') return 1016.2 - 7.2 * sig((t - 1.0) / 2.3);
    return 1011.6 + 1.3 * Math.sin(t * 0.45 + 1.1);
}

function rainAmount() {
    var t = timeHours();
    if (state.mode === 'cold') return Math.exp(-Math.pow(t / 1.6, 2));
    if (state.mode === 'warm') return 0.42 + 0.34 * sig(-(t - 2.2) / 3.0);
    return 0.45;
}

/* ---------------- 그래프 ---------------- */
function drawChart() {
    var c = $('#chart');
    if (!c) return;
    var ctx = c.getContext('2d');
    var W = c.width, H = c.height;
    var L = 46, R = 12, TP = 20, B = 30;
    var pw = W - L - R, ph = H - TP - B;
    var dark = document.body.classList.contains('dark-mode');

    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = dark ? 'rgba(255,255,255,0.14)' : 'rgba(15,23,42,0.10)';
    ctx.lineWidth = 1;
    for (var gy = 0; gy <= 4; gy++) {
        var yy = TP + ph * gy / 4;
        ctx.beginPath();
        ctx.moveTo(L, yy);
        ctx.lineTo(L + pw, yy);
        ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(L, TP);
    ctx.lineTo(L, TP + ph);
    ctx.lineTo(L + pw, TP + ph);
    ctx.stroke();

    /* x축 시간 표시 */
    ctx.fillStyle = dark ? '#94a3b8' : '#64748b';
    ctx.font = '600 17px "SeoulNamsan", sans-serif';
    ctx.textAlign = 'center';
    var marks = [[-6, '6시간 전'], [0, '통과'], [6, '6시간 후']];
    for (var i = 0; i < marks.length; i++) {
        var mx = L + pw * (marks[i][0] + 6) / 12;
        ctx.fillText(marks[i][1], mx, H - 8);
    }

    function xOf(t) { return L + pw * (t + 6) / 12; }
    function yOfT(v) { return TP + ph * (1 - (v - 6) / 24); }
    function yOfP(v) { return TP + ph * (1 - (v - 1002) / 24); }

    /* 기온 */
    ctx.beginPath();
    var first = true;
    for (var tt = -6; tt <= 6.001; tt += 0.2) {
        var x = xOf(tt), y = yOfT(tempAt(tt));
        if (first) { ctx.moveTo(x, y); first = false; } else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 3;
    ctx.stroke();

    /* 기압 */
    ctx.beginPath();
    first = true;
    for (var tp = -6; tp <= 6.001; tp += 0.2) {
        var x2 = xOf(tp), y2 = yOfP(pressAt(tp));
        if (first) { ctx.moveTo(x2, y2); first = false; } else ctx.lineTo(x2, y2);
    }
    ctx.strokeStyle = '#3b82f6';
    ctx.lineWidth = 3;
    ctx.stroke();

    /* 현재 위치 */
    var tNow = timeHours();
    var xn = xOf(tNow);
    ctx.setLineDash([6, 5]);
    ctx.strokeStyle = dark ? 'rgba(255,255,255,0.65)' : 'rgba(15,23,42,0.55)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(xn, TP - 4);
    ctx.lineTo(xn, TP + ph);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(xn, yOfT(tempAt(tNow)), 5, 0, 6.3);
    ctx.fill();
    ctx.fillStyle = '#3b82f6';
    ctx.beginPath();
    ctx.arc(xn, yOfP(pressAt(tNow)), 5, 0, 6.3);
    ctx.fill();

    /* 범례 */
    ctx.textAlign = 'left';
    ctx.font = '800 18px "SeoulNamsan", sans-serif';
    ctx.fillStyle = '#ef4444';
    ctx.fillText('기온', 6, TP + 14);
    ctx.fillStyle = '#3b82f6';
    ctx.fillText('기압', 6, TP + 38);
}

/* ---------------- 상태 반영 ---------------- */
function applyState() {
    var xf = frontX();
    cloudGroup.position.x = xf;

    var M = MODES[state.mode];
    var t = timeHours();
    var T = tempAt(t), P = pressAt(t), amt = rainAmount();

    /* 라벨 위치 */
    if (state.mode === 'warm') {
        lblCold.position.set(Math.min(X1 - 3.6, xf + 8.4), 6.2, ZD / 2 + 0.2);
        lblWarm.position.set(Math.max(X0 + 3.4, xf - 7.2), 4.4, ZD / 2 + 0.2);
        lblFront.position.set(xf - 5.2, Math.min(TOP - 0.8, M.slope * 5.2), ZD / 2 + 0.35);
    } else {
        lblCold.position.set(Math.max(X0 + 3.2, xf - 7.6), 2.1, ZD / 2 + 0.2);
        lblWarm.position.set(Math.min(X1 - 3.2, xf + 7.4), 3.4, ZD / 2 + 0.2);
        lblFront.position.set(xf - 4.6, Math.min(TOP - 1.0, M.slope * 4.6), ZD / 2 + 0.35);
    }
    if (state.mode === 'cold') {
        lblCloud.position.set(xf - 1.2, 8.9, 0);
        lblRain.position.set(xf - 2.0, 2.6, ZD / 2 + 0.4);
    } else {
        lblCloud.position.set(xf + 6.5, 6.4, 0);
        lblRain.position.set(xf + 6.5, 3.0, ZD / 2 + 0.4);
    }
    lblCloud.visible = amt > 0.02;
    lblRain.visible = amt > 0.05;
    lblObs.position.set(0, 2.15, ZD / 2 + 1.5);
    lblArrow.position.set(xf - 6.0, 2.0 + (state.mode === 'cold' ? 1.4 : 0.2), ZD / 2 + 0.6);

    /* HUD */
    $('#val-t').textContent = T.toFixed(1) + '℃';
    $('#val-p').textContent = P.toFixed(1) + ' hPa';
    var rainTxt = amt > 0.6 ? '강함' : (amt > 0.25 ? '보통' : (amt > 0.06 ? '약함' : '없음'));
    $('#val-rain').textContent = rainTxt;
    var posTxt = state.mode === 'stationary' ? '머무름'
        : (xf < -1.2 ? '통과 전' : (xf > 1.2 ? '통과 후' : '통과 중'));
    $('#val-pos').textContent = posTxt;
    $('#txt-prog').textContent = posTxt;
    $('#note').textContent = M.note;

    rainMat.opacity = state.mode === 'cold' ? 0.85 : 0.7;
    rainMat.size = state.mode === 'cold' ? 0.22 : 0.17;

    drawChart();
}

function fullRebuild() {
    buildClouds();
    buildLabels();
    rebuildAir();
    rebuildArrows();
    applyState();
    applyLabelScale();
}

/* ---------------- 애니메이션 ---------------- */
var clock = new THREE.Clock();
function animate() {
    requestAnimationFrame(animate);
    var dt = Math.min(clock.getDelta(), 0.05);
    var xf = frontX();
    var band = rainBand();
    var arr = rainGeo.attributes.position.array;
    var arrN = RAIN_N;

    for (var i = 0; i < arrN; i++) {
        arr[i * 3 + 1] -= dt * (6.5 + rainSpeed[i] * 5.5);
        if (arr[i * 3 + 1] < 0.05) {
            arr[i * 3 + 1] = 4.2 + Math.random() * 2.6;
            rainOffset[i] = Math.random();
        }
        arr[i * 3] = xf + band[0] + rainOffset[i] * (band[1] - band[0]);
        arr[i * 3 + 2] = rainZ[i];
    }
    rainGeo.attributes.position.needsUpdate = true;
    rainGeo.setDrawRange(0, arrN);

    controls.update();
    renderer.render(scene, camera);
}

/* ---------------- 카메라 ---------------- */
var FIT_W = 14.8, FIT_H = 6.2;
function fitDistance() {
    var vfov = camera.fov * Math.PI / 180;
    var dH = FIT_H / Math.tan(vfov / 2);
    var fw = camera.aspect < 0.85 ? FIT_W * 0.76 : FIT_W;
    var dW = fw / (Math.tan(vfov / 2) * Math.max(camera.aspect, 0.25));
    return Math.max(dH, dW);
}
function alignCamera(resetTarget) {
    if (resetTarget) controls.target.set(0, 3.9, 0);
    var dir = new THREE.Vector3(0.10, 0.33, 1).normalize();
    camera.position.copy(controls.target).addScaledVector(dir, fitDistance());
    controls.update();
}

/* ---------------- UI ---------------- */
document.querySelectorAll('#mode-grid .mode-btn').forEach(function (b) {
    b.addEventListener('click', function () {
        var mo = b.getAttribute('data-mode');
        if (!MODES[mo] || state.mode === mo) return;
        state.mode = mo;
        document.querySelectorAll('#mode-grid .mode-btn').forEach(function (x) {
            x.classList.toggle('active', x === b);
        });
        fullRebuild();
    });
});

$('#sld-prog').addEventListener('input', function (e) {
    state.prog = parseFloat(e.target.value);
    rebuildAir();
    rebuildArrows();
    applyState();
    applyLabelScale();
});

$('#btn-reset').addEventListener('click', function () {
    state.mode = 'cold';
    state.prog = 18;
    $('#sld-prog').value = 18;
    document.querySelectorAll('#mode-grid .mode-btn').forEach(function (x) {
        x.classList.toggle('active', x.getAttribute('data-mode') === 'cold');
    });
    fullRebuild();
    alignCamera(true);
});

$('#btn-cam').addEventListener('click', function () { alignCamera(false); });

var isDark = false;
$('#theme-toggle').addEventListener('click', function (e) {
    isDark = !isDark;
    document.body.classList.toggle('dark-mode', isDark);
    e.currentTarget.textContent = isDark ? '☀️' : '🌙';
    groundMat.color.setHex(isDark ? 0x2c4a2c : 0x74b95c);
    soilMat.color.setHex(isDark ? 0x3a3226 : 0x8c7f68);
    hemi.intensity = isDark ? 0.55 : 0.98;
    key.intensity = isDark ? 0.5 : 0.8;
    drawChart();
});

var userZoomed = false;
controls.addEventListener('start', function () { userZoomed = true; });

function applyLabelScale() {
    var f = camera.aspect < 0.85 ? 1.65 : 1.0;
    scene.traverse(function (o) {
        if (o.isSprite) {
            if (!o.userData.bs) o.userData.bs = o.scale.clone();
            o.scale.set(o.userData.bs.x * f, o.userData.bs.y * f, 1);
        }
    });
}

function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    applyLabelScale();
    if (!userZoomed) alignCamera(false);
    drawChart();
}

window.addEventListener('resize', resize);
window.__LAB_CAM__ = camera;
resize();
fullRebuild();
alignCamera(false);
animate();

})();

</script>

<!-- Fullscreen / Windowed Mode Button -->
<div class="bottom-right-bar">
  <button id="fullscreenBtn" class="glass-panel back-btn" type="button" aria-label="전체화면으로 전환">
    <span id="fullscreenIcon">⛶</span><span id="fullscreenText">전체화면</span>
  </button>
</div>

<script>
/* ============ 전체화면 / 창모드 (표준 + 모바일 몰입 모드 폴백) ============ */
(function () {
    var docEl = document.documentElement;
    var btn = document.getElementById('fullscreenBtn');
    var icon = document.getElementById('fullscreenIcon');
    var text = document.getElementById('fullscreenText');

    function realFs() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement ||
                  document.mozFullScreenElement || document.msFullscreenElement);
    }
    function pseudo() { return docEl.classList.contains('pseudo-fs'); }
    function setUI() {
        var on = realFs() || pseudo();
        if (icon) icon.textContent = on ? '🗗' : '⛶';
        if (text) text.textContent = on ? '창모드' : '전체화면';
        if (btn) btn.setAttribute('aria-label', on ? '창모드로 전환' : '전체화면으로 전환');
        document.body.classList.toggle('is-fullscreen', on);
    }
    function toast(msg) {
        var t = document.getElementById('ux-toast');
        if (!t) {
            t = document.createElement('div');
            t.id = 'ux-toast';
            t.style.cssText = 'position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);' +
                'background:rgba(28,28,30,.88);color:#fff;font-size:12px;line-height:1.4;padding:9px 14px;border-radius:14px;' +
                'z-index:9999;max-width:86vw;text-align:center;pointer-events:none;transition:opacity .3s;' +
                'font-family:inherit;box-shadow:0 8px 24px rgba(0,0,0,.25)';
            document.body.appendChild(t);
        }
        t.textContent = msg;
        t.style.opacity = '1';
        clearTimeout(t._t);
        t._t = setTimeout(function () { t.style.opacity = '0'; }, 2600);
    }

    if (btn) {
        btn.addEventListener('click', function () {
            var wasReal = realFs();
            var wasPseudo = pseudo();
            try {
                if (!wasReal) {
                    var req = docEl.requestFullscreen || docEl.webkitRequestFullscreen ||
                              docEl.webkitRequestFullScreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
                    if (req) req.call(docEl);
                } else {
                    var exit = document.exitFullscreen || document.webkitExitFullscreen ||
                               document.webkitCancelFullScreen || document.mozCancelFullScreen || document.msExitFullscreen;
                    if (exit) exit.call(document);
                }
            } catch (e) {}
            setTimeout(function () {
                if (wasReal) { setUI(); return; }
                if (wasPseudo) { docEl.classList.remove('pseudo-fs'); setUI(); return; }
                if (!realFs()) {
                    docEl.classList.add('pseudo-fs');
                    try { window.scrollTo(0, 1); } catch (e) {}
                    toast('이 브라우저는 전체화면을 지원하지 않아 상단 정보를 숨긴 몰입 모드로 표시합니다');
                }
                setUI();
            }, 420);
        }, false);
    }
    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
        document.addEventListener(ev, function () { setUI(); refit(); });
    });

    /* 좁은 화면에서는 3D 장면이 잘리지 않도록 시야각을 넓힌다 */
    function theCam() {
        try { if (window.__LAB_CAM__ && window.__LAB_CAM__.isPerspectiveCamera) return window.__LAB_CAM__; } catch (e) {}
        return null;
    }
    function mobileFit() {
        var cam = theCam();
        if (!cam) return;
        try {
            if (!cam.userData) cam.userData = {};
            if (!cam.userData.baseFov) cam.userData.baseFov = cam.fov;
            var w = window.innerWidth, h = window.innerHeight, f = 1;
            var k = 0.62;
            var attr = docEl.getAttribute('data-mzoom');
            if (attr) { var v = parseFloat(attr); if (!isNaN(v) && v > 0) k = v; }
            if (w < h) f = 1 + (1 - w / h) * k;
            else if (h <= 520) f = 1 + k * 0.18;
            cam.fov = Math.min(88, cam.userData.baseFov * f);
            cam.updateProjectionMatrix();
        } catch (e) {}
    }
    mobileFit();

    var rt = null;
    function refit() {
        clearTimeout(rt);
        rt = setTimeout(function () {
            mobileFit();
            try { window.dispatchEvent(new Event('resize')); } catch (e) {}
        }, 240);
    }
    window.addEventListener('orientationchange', refit);
    window.addEventListener('pageshow', refit);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) refit(); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', refit);
    setUI();
})();
</script>
<script src="../common/feedback.js" defer></script>
<script src="../common/ui-layout.js" defer></script>
</body>
