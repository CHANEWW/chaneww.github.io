<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>소크라테스식 탐구 힌트 | Science Virtual LAB</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="preload" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff" as="font" type="font/woff" crossorigin>
<style>
@font-face{
    font-family:'SeoulNamsan';
    src:local('SeoulNamsan M'),local('SeoulNamsanM'),local('서울남산체 M'),
        url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff') format('woff');
    font-weight:400;font-style:normal;font-display:swap;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
    --bg:#eef2f7; --ink:#14181f; --muted:#64748b; --line:rgba(15,23,42,.10);
    --card:rgba(255,255,255,.92); --solid:#fff; --accent:#0a84ff; --soft:rgba(10,132,255,.12);
    --ok:#10b981; --warn:#f59e0b; --danger:#ef4444; --shadow:0 10px 30px rgba(15,23,42,.10);
}
body.dark{
    --bg:#0e121c; --ink:#eef3fb; --muted:#94a3b8; --line:rgba(255,255,255,.13);
    --card:rgba(26,32,45,.92); --solid:#1a2130; --accent:#4aa3ff; --soft:rgba(74,163,255,.18);
    --ok:#34d399; --shadow:0 10px 30px rgba(0,0,0,.5);
}
html,body{margin:0;padding:0;width:100%;height:100%}
body{
    font-family:'SeoulNamsan',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:var(--ink); background:var(--bg); overflow:hidden; transition:background .3s ease,color .3s ease;
}
.top-nav{
    position:fixed; top:0; left:0; right:0; height:60px; display:flex; align-items:center; gap:10px;
    padding:0 250px 0 16px; z-index:100; background:var(--card);
    backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-bottom:1px solid var(--line);
}
.back-btn{
    display:inline-flex; align-items:center; gap:6px; padding:7px 14px; font-family:inherit; font-size:13px;
    font-weight:800; color:inherit; text-decoration:none; border:1px solid var(--line); border-radius:999px;
    background:var(--solid); transition:transform .16s ease; white-space:nowrap;
}
.back-btn:hover{transform:translateY(-1px)}
.page-title{display:flex; align-items:center; gap:8px; font-size:14.5px; font-weight:800; letter-spacing:-.2px; min-width:0}
.page-title .t{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pill-badge{padding:3px 9px; border-radius:999px; font-size:10.5px; font-weight:800; background:var(--soft); color:var(--accent); white-space:nowrap; flex:0 0 auto}
.top-right-bar{
    position:fixed !important; top:15px !important; right:20px !important;
    display:flex !important; flex-direction:column; align-items:flex-end; gap:8px; z-index:130 !important; pointer-events:none;
}
.top-right-bar > .tr-util{display:flex !important; flex-direction:row; align-items:center; gap:8px; pointer-events:auto}
#bTheme{
    display:inline-flex; align-items:center; justify-content:center; gap:6px; height:40px; padding:0 15px;
    border-radius:20px; cursor:pointer; font-family:inherit; font-size:12.5px; font-weight:800; color:inherit;
    border:1px solid var(--line); background:var(--card); box-shadow:var(--shadow);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); white-space:nowrap; transition:transform .16s ease;
}
#bTheme:hover{transform:translateY(-1px)}

.app{position:fixed; top:60px; left:0; right:0; bottom:0; overflow-y:auto; padding:12px 16px 26px}
.wrap{max-width:1180px; margin:0 auto}

.toolbar{
    display:flex; align-items:center; gap:9px; flex-wrap:wrap; padding:10px 12px; border-radius:18px;
    background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow); margin-bottom:12px;
}
.seg{display:inline-flex; padding:3px; border-radius:12px; background:var(--solid); border:1px solid var(--line); gap:3px}
.seg button{
    border:none; background:transparent; color:inherit; font-family:inherit; font-size:12.5px; font-weight:900;
    padding:8px 13px; border-radius:9px; cursor:pointer; white-space:nowrap; transition:background .16s ease,color .16s ease;
}
.seg button.on{background:var(--accent); color:#fff; box-shadow:0 6px 14px rgba(10,132,255,.28)}
.btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:9px 14px; border-radius:12px;
    border:none; cursor:pointer; font-family:inherit; font-size:12.5px; font-weight:900; color:#fff;
    background:var(--accent); box-shadow:0 8px 18px rgba(10,132,255,.24); transition:transform .16s ease; white-space:nowrap;
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line); box-shadow:none}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none}
.note{font-size:11.5px; font-weight:800; color:var(--muted); margin-left:auto; white-space:nowrap}

.layout{display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:12px; align-items:start}
.left{display:flex; flex-direction:column; gap:10px; min-width:0}
.stage-card{
    position:relative; border-radius:22px; border:1px solid var(--line); background:var(--card);
    box-shadow:var(--shadow); overflow:hidden; height:min(44vh,400px); min-height:290px;
}
#stage{display:block; width:100%; height:100%; touch-action:none}
.ctrl{border-radius:18px; border:1px solid var(--line); background:var(--card); box-shadow:var(--shadow); padding:11px 14px}
.ctrl-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:4px 0}
.ctrl-row label{font-size:11.5px; font-weight:900; color:var(--muted); min-width:78px}
.ctrl-row input[type=range]{flex:1 1 150px; min-width:110px; accent-color:var(--accent); height:22px}
.val{font-size:12.5px; font-weight:900; min-width:84px; text-align:right; font-variant-numeric:tabular-nums}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{
    border:1px solid var(--line); background:var(--solid); color:inherit; font-family:inherit; font-size:11.5px;
    font-weight:900; padding:7px 11px; border-radius:10px; cursor:pointer; white-space:nowrap;
}
.chip.on{background:var(--accent); color:#fff; border-color:transparent}
.switch-btn{
    display:inline-flex; align-items:center; gap:8px; padding:8px 14px; border-radius:12px; cursor:pointer;
    border:1px solid var(--line); background:var(--solid); color:inherit; font-family:inherit; font-size:12px; font-weight:900;
}
.switch-btn .knob{width:34px; height:19px; border-radius:999px; background:rgba(120,140,170,.45); position:relative; transition:background .18s ease}
.switch-btn .knob::after{
    content:''; position:absolute; top:2px; left:2px; width:15px; height:15px; border-radius:50%; background:#fff;
    transition:transform .18s ease; box-shadow:0 1px 3px rgba(0,0,0,.25);
}
.switch-btn.on{border-color:rgba(16,185,129,.5); background:rgba(16,185,129,.10)}
.switch-btn.on .knob{background:#10b981}
.switch-btn.on .knob::after{transform:translateX(15px)}

.side{display:flex; flex-direction:column; gap:10px; min-width:0}
.guide{border-radius:20px; border:1px solid var(--line); background:var(--card); box-shadow:var(--shadow); padding:14px}
.guide h3{margin:0 0 4px; font-size:13px; font-weight:900; display:flex; align-items:center; gap:6px}
.guide .sub{margin:0 0 10px; font-size:11px; font-weight:800; color:var(--muted); line-height:1.5}
.state-line{
    font-size:11px; font-weight:800; color:var(--muted); line-height:1.6; padding:8px 10px; border-radius:11px;
    background:rgba(120,140,170,.10); margin-bottom:10px;
}
.ask{
    width:100%; display:flex; align-items:center; justify-content:center; gap:8px; padding:13px 14px;
    border-radius:14px; border:none; cursor:pointer; font-family:inherit; font-size:13.5px; font-weight:900; color:#fff;
    background:linear-gradient(135deg,#6366f1,#0ea5e9); box-shadow:0 10px 22px rgba(99,102,241,.28);
    transition:transform .16s ease; text-align:center; line-height:1.3;
}
.ask:hover{transform:translateY(-1px)}
.ask:active{transform:scale(.98)}
.qcount{font-size:10.5px; font-weight:900; color:var(--muted); margin:9px 0 6px; display:flex; justify-content:space-between}
.qlist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; max-height:36vh; overflow-y:auto}
.qlist li{
    position:relative; padding:10px 12px 10px 34px; border-radius:13px; border:1px solid var(--line);
    background:var(--solid); font-size:12px; font-weight:700; line-height:1.6; animation:slide .3s ease;
}
.qlist li .no{
    position:absolute; left:9px; top:9px; width:18px; height:18px; border-radius:50%; background:var(--soft);
    color:var(--accent); font-size:10.5px; font-weight:900; display:flex; align-items:center; justify-content:center;
}
.qlist li.act{background:rgba(16,185,129,.10); border-color:rgba(16,185,129,.35)}
.qlist li.act .no{background:rgba(16,185,129,.18); color:#059669}
body.dark .qlist li.act .no{color:#34d399}
@keyframes slide{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}
.empty{font-size:11.5px; font-weight:700; color:var(--muted); line-height:1.6; padding:4px 2px}
.write{margin-top:10px; border-top:1px dashed var(--line); padding-top:10px}
.write textarea{
    width:100%; min-height:64px; resize:vertical; padding:9px 11px; border-radius:11px; border:1px solid var(--line);
    background:var(--solid); color:inherit; font-family:inherit; font-size:12px; font-weight:700; line-height:1.55; outline:none;
}
.write textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--soft)}
.write .wrow{display:flex; gap:7px; margin-top:7px; align-items:center}
.write .wrow .msg{font-size:11px; font-weight:800; color:var(--muted); flex:1 1 auto}
.saved{margin-top:8px; font-size:11px; font-weight:800; color:#059669}
body.dark .saved{color:#34d399}

#btn-fullscreen{
    position:fixed; right:20px; bottom:calc(18px + env(safe-area-inset-bottom,0px)); z-index:95;
    display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:9px 16px; border-radius:999px;
    border:1px solid var(--line); background:var(--card); box-shadow:0 8px 24px rgba(15,23,42,.16);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    color:inherit; font-family:inherit; font-size:12.5px; font-weight:800; white-space:nowrap; cursor:pointer;
    transition:transform .18s ease;
}
#btn-fullscreen:hover{transform:translateY(-1px)}
body.pseudo-fullscreen .top-nav{transform:translateY(-100%); opacity:0; pointer-events:none}
body.pseudo-fullscreen .app{top:0}
body.pseudo-fullscreen #feedback-btn,body.pseudo-fullscreen .svl-fb-btn{display:none !important}
.fs-toast{
    position:fixed; left:50%; bottom:calc(74px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,8px);
    z-index:2050; max-width:86vw; padding:10px 16px; border-radius:14px; background:rgba(28,28,30,.92);
    color:#fff; font-size:12.5px; font-weight:700; line-height:1.45; text-align:center;
    box-shadow:0 10px 26px rgba(0,0,0,.3); opacity:0; pointer-events:none; transition:opacity .26s ease, transform .26s ease;
}
.fs-toast.show{opacity:1; transform:translate(-50%,0)}

@media (max-width:1000px){
    .layout{grid-template-columns:minmax(0,1fr)}
    .side{order:2}
    .qlist{max-height:none}
}
@media (max-width:900px){
    .top-nav{height:52px; padding:0 12px; gap:8px}
    .page-title{font-size:12.5px}
    .back-btn{padding:6px 11px; font-size:12px}
    .top-right-bar{top:calc(max(8px,env(safe-area-inset-top)) + 48px) !important; right:8px !important}
    #bTheme{height:34px; padding:0 11px; font-size:11.5px}
    .app{top:100px; padding:8px 10px 64px}
    .stage-card{height:min(38vh,310px); min-height:250px}
    .toolbar{padding:8px 9px; gap:7px}
    .seg button{padding:7px 10px; font-size:11px}
    .btn{padding:8px 11px; font-size:11.5px}
    .note{width:100%; margin-left:0; white-space:normal}
    .ctrl{padding:9px 11px}
    .ctrl-row label{min-width:64px; font-size:11px}
    .val{min-width:66px; font-size:11.5px}
    .guide{padding:12px}
    #btn-fullscreen{bottom:calc(10px + env(safe-area-inset-bottom,0px)); right:10px; padding:8px 13px; font-size:12px}
}
@media (max-height:520px) and (orientation:landscape){
    .stage-card{height:min(64vh,260px); min-height:200px}
}
</style>
</head>
<body>

<nav class="top-nav">
    <a href="../../index.html" class="back-btn" onclick="var r=document.referrer;if(history.length>1&&r&&r.indexOf(location.origin+'/')===0&&/(\/|index(_3d)?\.html)(\?|#|$)/.test(r)){history.back();return false;}"><span>⬅</span> 메인</a>
    <div class="page-title"><span class="t">소크라테스식 탐구 힌트</span><span class="pill-badge">확장 기능</span></div>
</nav>

<div class="top-right-bar">
    <div class="tr-util">
        <button id="bTheme" type="button">🌙 야간 모드</button>
    </div>
</div>

<div class="app">
<div class="wrap">

    <div class="toolbar">
        <div class="seg" id="modeSeg">
            <button type="button" data-m="circ" class="on">🔌 전기 회로</button>
            <button type="button" data-m="sol">💧 용해도</button>
        </div>
        <button class="btn ghost" id="btnReset" type="button">🔄 처음부터</button>
        <span class="note">정답은 알려주지 않아요 · 질문으로 스스로 찾아가요</span>
    </div>

    <div class="layout">
        <div class="left">
            <div class="stage-card">
                <canvas id="stage"></canvas>
            </div>

            <div class="ctrl" id="ctrlCirc">
                <div class="ctrl-row">
                    <label>스위치</label>
                    <button type="button" class="switch-btn" id="btnSwitch"><span class="knob"></span><span id="swTxt">열림</span></button>
                    <span class="val" id="circCur">전류 0.00 A</span>
                </div>
                <div class="ctrl-row">
                    <label>전압</label>
                    <input type="range" id="cV" min="0" max="12" step="0.5" value="6">
                    <span class="val" id="cVV">6.0 V</span>
                </div>
                <div class="ctrl-row">
                    <label>저항</label>
                    <input type="range" id="cR" min="1" max="20" step="1" value="6">
                    <span class="val" id="cRV">6 Ω</span>
                </div>
                <div class="ctrl-row">
                    <label>도선</label>
                    <div class="chips" id="wireChips">
                        <button type="button" class="chip on" data-w="copper">구리</button>
                        <button type="button" class="chip" data-w="iron">철</button>
                        <button type="button" class="chip" data-w="rubber">고무</button>
                    </div>
                </div>
            </div>

            <div class="ctrl" id="ctrlSol" hidden>
                <div class="ctrl-row">
                    <label>물질</label>
                    <div class="chips" id="soluteChips">
                        <button type="button" class="chip on" data-s="kno3">질산칼륨</button>
                        <button type="button" class="chip" data-s="nacl">염화나트륨</button>
                        <button type="button" class="chip" data-s="sugar">설탕</button>
                    </div>
                </div>
                <div class="ctrl-row">
                    <label>물의 온도</label>
                    <input type="range" id="sT" min="0" max="80" step="1" value="20">
                    <span class="val" id="sTV">20 °C</span>
                </div>
                <div class="ctrl-row">
                    <label>물의 양</label>
                    <input type="range" id="sV" min="20" max="100" step="5" value="50">
                    <span class="val" id="sVV">50 mL</span>
                </div>
                <div class="ctrl-row">
                    <label>넣은 양</label>
                    <input type="range" id="sM" min="0" max="160" step="1" value="40">
                    <span class="val" id="sMV">40 g</span>
                </div>
            </div>
        </div>

        <aside class="side">
            <section class="guide">
                <h3>💬 탐구 질문 가이드</h3>
                <p class="sub" id="guideSub">지금 화면의 값을 읽고, 스스로 원인을 찾도록 질문을 하나씩 던져 줄게요.</p>
                <div class="state-line" id="stateLine">—</div>
                <button class="ask" id="btnAsk" type="button">왜 전류가 안 흐를까?</button>
                <div class="qcount"><span id="qLeft">질문 0개</span><span id="qStage"></span></div>
                <ul class="qlist" id="qList"><li class="empty">버튼을 누르면 지금 상태에 맞는 첫 질문이 나와요.</li></ul>

                <div class="write">
                    <textarea id="myNote" maxlength="400" placeholder="질문을 보고 스스로 찾은 원인을 적어 보세요. (정답을 맞히는 곳이 아니라 생각을 남기는 곳이에요)"></textarea>
                    <div class="wrow">
                        <span class="msg" id="noteMsg"></span>
                        <button class="btn ghost" id="btnSave" type="button">📝 기록 남기기</button>
                    </div>
                    <div class="saved" id="savedNote"></div>
                </div>
            </section>
        </aside>
    </div>

</div>
</div>

<button id="btn-fullscreen" type="button" aria-pressed="false" aria-label="전체화면으로 전환">
    <span class="fs-icon" id="fsIcon">⛶</span><span class="fs-text" id="fsText">전체화면</span>
</button>

<script>
/* ==========================================================
   소크라테스식 탐구 힌트 실험실
   - 슬라이더로 미니 실험을 조작하고, 질문 버튼을 누르면
     지금 상태를 읽어 '정답 대신 질문'을 단계별로 제시한다.
   ========================================================== */
(function () {
    'use strict';
    var $ = function (s) { return document.querySelector(s); };
    var cv = $('#stage'), ctx = cv.getContext('2d');
    var W = 800, H = 360, DPR = 1;
    var FONT = "'SeoulNamsan', -apple-system, 'Apple SD Gothic Neo', sans-serif";

    var st = {
        m: 'circ',
        circ: { V: 6, R: 6, closed: false, wire: 'copper', t: 0, dots: [] },
        sol: { solute: 'kno3', T: 20, Vw: 50, m: 40, t: 0 },
        asked: { circ: 0, sol: 0 },
        qs: { circ: [], sol: [] }
    };

    var WIRE = {
        copper: { n: '구리', r: 0.15, c: '#f59e0b' },
        iron: { n: '철', r: 1.6, c: '#94a3b8' },
        rubber: { n: '고무', r: Infinity, c: '#334155' }
    };
    var SOLUTES = {
        kno3: { n: '질산칼륨', f: [[0, 13.3], [10, 20.9], [20, 31.6], [30, 45.8], [40, 63.9], [50, 85.5], [60, 110], [70, 138], [80, 169]], c: '#6366f1' },
        nacl: { n: '염화나트륨', f: [[0, 35.7], [20, 36.0], [40, 36.6], [60, 37.3], [80, 38.4]], c: '#0ea5e9' },
        sugar: { n: '설탕', f: [[0, 179], [20, 204], [40, 238], [60, 287], [80, 362]], c: '#f59e0b' }
    };

    function resize() {
        var box = cv.parentElement.getBoundingClientRect();
        W = Math.max(280, box.width);
        H = Math.max(230, box.height);
        DPR = Math.min(2, window.devicePixelRatio || 1);
        cv.width = Math.round(W * DPR);
        cv.height = Math.round(H * DPR);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    function dark() { return document.body.classList.contains('dark'); }
    function bg() {
        var g = ctx.createLinearGradient(0, 0, 0, H);
        if (dark()) { g.addColorStop(0, '#121a28'); g.addColorStop(1, '#0a0f18'); }
        else { g.addColorStop(0, '#fbfdff'); g.addColorStop(1, '#e9eff7'); }
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
    }
    function roundRect(x, y, w, h, r) {
        r = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }

    /* ---------- 전기 회로 ---------- */
    function circState() {
        var c = st.circ, w = WIRE[c.wire];
        c.broken = !c.closed || !isFinite(w.r) || c.V <= 0;
        c.I = c.broken ? 0 : c.V / (c.R + w.r);
        return c;
    }
    function drawCirc(dt) {
        var c = circState();
        var L = W * 0.16, Rr = W * 0.84;
        var top = H * 0.26, bot = H * 0.74;
        var wireC = WIRE[c.wire].c;

        // 도선
        ctx.save();
        ctx.lineWidth = 4;
        ctx.lineJoin = 'round';
        ctx.strokeStyle = c.wire === 'rubber' ? '#475569' : wireC;
        ctx.beginPath();
        ctx.moveTo(L, top); ctx.lineTo(Rr, top);
        ctx.moveTo(Rr, top); ctx.lineTo(Rr, bot);
        ctx.moveTo(Rr, bot); ctx.lineTo(L, bot);
        ctx.moveTo(L, bot); ctx.lineTo(L, top);
        ctx.stroke();
        ctx.restore();

        // 전지
        ctx.save();
        var by = (top + bot) / 2;
        ctx.fillStyle = dark() ? '#1e293b' : '#fff';
        ctx.strokeStyle = '#0ea5e9';
        ctx.lineWidth = 2.4;
        roundRect(L - 15, by - 32, 30, 64, 8);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#0ea5e9';
        ctx.font = '900 10px ' + FONT;
        ctx.textAlign = 'center';
        ctx.fillText('+', L, by - 16);
        ctx.fillStyle = '#64748b';
        ctx.fillText('−', L, by + 25);
        ctx.fillStyle = dark() ? '#93c5fd' : '#0f172a';
        ctx.font = '900 12px ' + FONT;
        ctx.fillText(c.V.toFixed(1) + 'V', L - 34, by + 4);
        ctx.restore();

        // 스위치 (위쪽)
        var sx = L + (Rr - L) * 0.28;
        ctx.save();
        ctx.lineWidth = 4;
        ctx.strokeStyle = wireC;
        ctx.beginPath();
        ctx.moveTo(sx - 26, top); ctx.lineTo(sx - 6, top);
        ctx.moveTo(sx + 6, top); ctx.lineTo(sx + 26, top);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(sx - 6, top);
        if (c.closed) ctx.lineTo(sx + 6, top);
        else ctx.lineTo(sx + 22, top - 20);
        ctx.stroke();
        ctx.fillStyle = c.closed ? '#10b981' : '#ef4444';
        ctx.beginPath(); ctx.arc(sx - 7, top, 3.6, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(sx + 7, top, 3.6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = dark() ? '#94a3b8' : '#64748b';
        ctx.font = '800 10px ' + FONT;
        ctx.textAlign = 'center';
        ctx.fillText(c.closed ? '스위치 닫힘' : '스위치 열림', sx, top - 30);
        ctx.restore();

        // 전구
        var bx = Rr, byy = (top + bot) / 2;
        var bright = Math.min(1, c.I / 1.4);
        ctx.save();
        if (bright > 0.02) {
            var gr = ctx.createRadialGradient(bx, byy, 2, bx, byy, 46);
            gr.addColorStop(0, 'rgba(253,224,71,' + (0.85 * bright) + ')');
            gr.addColorStop(1, 'rgba(253,224,71,0)');
            ctx.fillStyle = gr;
            ctx.beginPath(); ctx.arc(bx, byy, 46, 0, Math.PI * 2); ctx.fill();
        }
        ctx.beginPath();
        ctx.arc(bx, byy, 22, 0, Math.PI * 2);
        ctx.fillStyle = bright > 0.05 ? 'rgba(253,224,71,' + (0.35 + 0.55 * bright) + ')' : (dark() ? '#1e293b' : '#fff');
        ctx.fill();
        ctx.strokeStyle = bright > 0.05 ? '#f59e0b' : '#94a3b8';
        ctx.lineWidth = 2.4;
        ctx.stroke();
        ctx.strokeStyle = bright > 0.05 ? '#b45309' : '#94a3b8';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(bx - 7, byy + 6); ctx.lineTo(bx - 3, byy - 4); ctx.lineTo(bx + 3, byy + 4); ctx.lineTo(bx + 7, byy - 6);
        ctx.stroke();
        ctx.restore();

        // 저항
        var rx = L + (Rr - L) * 0.66;
        ctx.save();
        ctx.fillStyle = dark() ? '#1e293b' : '#fff';
        ctx.strokeStyle = '#0ea5e9';
        ctx.lineWidth = 2.2;
        roundRect(rx - 34, top - 13, 68, 26, 7);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = dark() ? '#e2e8f0' : '#0f172a';
        ctx.font = '900 11.5px ' + FONT;
        ctx.textAlign = 'center';
        ctx.fillText(c.R + ' Ω', rx, top + 4);
        ctx.restore();

        // 도선 재질 표시
        ctx.save();
        ctx.fillStyle = dark() ? '#94a3b8' : '#64748b';
        ctx.font = '800 10.5px ' + FONT;
        ctx.textAlign = 'left';
        ctx.fillText('도선: ' + WIRE[c.wire].n + (c.wire === 'rubber' ? ' (전기가 통하지 않는 물질)' : ''), 16, H - 14);
        ctx.restore();

        // 전자
        if (c.I > 0.001) {
            c.t += dt * (0.2 + c.I * 0.5);
            var path = [[L, top, Rr, top], [Rr, top, Rr, bot], [Rr, bot, L, bot], [L, bot, L, top]];
            var total = 2 * ((Rr - L) + (bot - top));
            var n = 30;
            for (var i = 0; i < n; i++) {
                var d = ((c.t * 62 + i * (total / n)) % total + total) % total;
                var pt = pointOnPath(path, d);
                ctx.beginPath();
                ctx.fillStyle = 'rgba(14,165,233,.9)';
                ctx.arc(pt[0], pt[1], 3.2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 전류계
        ctx.save();
        ctx.fillStyle = dark() ? 'rgba(20,26,38,.8)' : 'rgba(255,255,255,.92)';
        ctx.strokeStyle = 'rgba(148,163,184,.45)';
        ctx.lineWidth = 1.2;
        var gx = W - 176, gy = H - 54;
        roundRect(gx, gy, 160, 40, 11);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = dark() ? '#94a3b8' : '#64748b';
        ctx.font = '800 10px ' + FONT;
        ctx.textAlign = 'left';
        ctx.fillText('전류계', gx + 10, gy + 15);
        ctx.fillStyle = dark() ? '#e2e8f0' : '#0f172a';
        ctx.font = '900 17px ' + FONT;
        ctx.textAlign = 'right';
        ctx.fillText(c.I.toFixed(2) + ' A', gx + 150, gy + 28);
        ctx.restore();

        $('#circCur').textContent = '전류 ' + c.I.toFixed(2) + ' A';
    }
    function pointOnPath(path, d) {
        for (var i = 0; i < path.length; i++) {
            var s = path[i], len = Math.hypot(s[2] - s[0], s[3] - s[1]);
            if (d <= len) {
                var t = len ? d / len : 0;
                return [s[0] + (s[2] - s[0]) * t, s[1] + (s[3] - s[1]) * t];
            }
            d -= len;
        }
        return [path[0][0], path[0][1]];
    }

    /* ---------- 용해도 ---------- */
    function solubility(solute, T) {
        var f = SOLUTES[solute].f;
        if (T <= f[0][0]) return f[0][1];
        if (T >= f[f.length - 1][0]) return f[f.length - 1][1];
        for (var i = 0; i < f.length - 1; i++) {
            if (T >= f[i][0] && T <= f[i + 1][0]) {
                var r = (T - f[i][0]) / (f[i + 1][0] - f[i][0]);
                return f[i][1] + (f[i + 1][1] - f[i][1]) * r;
            }
        }
        return f[f.length - 1][1];
    }
    function solState() {
        var s = st.sol;
        var maxPer100 = solubility(s.solute, s.T);
        var cap = maxPer100 * s.Vw / 100;
        s.cap = cap;
        s.dissolved = Math.min(s.m, cap);
        s.left = Math.max(0, s.m - cap);
        s.saturated = s.left > 0.001;
        return s;
    }
    function drawSol() {
        var s = solState();
        var solute = SOLUTES[s.solute];

        // 비커
        var bw = Math.min(W * 0.26, 170), bh = Math.min(H * 0.62, 210);
        var bx = 34, by = H * 0.5 - bh * 0.4;
        ctx.save();
        ctx.fillStyle = dark() ? 'rgba(148,163,184,.16)' : 'rgba(226,240,250,.92)';
        ctx.strokeStyle = 'rgba(120,160,190,.9)';
        ctx.lineWidth = 2.4;
        roundRect(bx, by, bw, bh, 12);
        ctx.fill(); ctx.stroke();
        // 물
        var lvl = 0.25 + (s.Vw / 100) * 0.5;
        ctx.save();
        roundRect(bx + 3, by + 3, bw - 6, bh - 6, 10);
        ctx.clip();
        ctx.fillStyle = 'rgba(96,165,250,.35)';
        ctx.fillRect(bx, by + bh * (1 - lvl), bw, bh);
        ctx.fillStyle = 'rgba(255,255,255,.4)';
        ctx.fillRect(bx, by + bh * (1 - lvl), bw, 3);
        // 안 녹은 결정
        if (s.left > 0.5) {
            var cnt = Math.min(26, 3 + Math.round(s.left / 3));
            ctx.fillStyle = solute.c;
            for (var i = 0; i < cnt; i++) {
                var cxr = bx + 16 + ((i * 37) % (bw - 32));
                var cyr = by + bh - 12 - ((i * 13) % 16);
                ctx.globalAlpha = 0.85;
                ctx.beginPath();
                ctx.rect(cxr, cyr, 6, 6);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }
        ctx.restore();
        ctx.restore();

        // 라벨
        ctx.save();
        ctx.fillStyle = dark() ? '#93c5fd' : '#0f172a';
        ctx.font = '900 12px ' + FONT;
        ctx.textAlign = 'center';
        ctx.fillText(s.T + ' °C · 물 ' + s.Vw + ' mL', bx + bw / 2, by + bh + 22);
        ctx.font = '800 10.5px ' + FONT;
        ctx.fillStyle = dark() ? '#94a3b8' : '#64748b';
        ctx.fillText('녹은 양 ' + s.dissolved.toFixed(1) + ' g / 남은 양 ' + s.left.toFixed(1) + ' g', bx + bw / 2, by + bh + 38);
        ctx.restore();

        // 상태 배지
        ctx.save();
        var badge = s.saturated ? '포화 용액 (바닥에 남은 것이 있어요)' : '아직 다 녹았어요';
        ctx.font = '900 11px ' + FONT;
        var tw = ctx.measureText(badge).width + 22;
        ctx.fillStyle = s.saturated ? 'rgba(239,68,68,.12)' : 'rgba(16,185,129,.12)';
        ctx.strokeStyle = s.saturated ? 'rgba(239,68,68,.5)' : 'rgba(16,185,129,.5)';
        ctx.lineWidth = 1.4;
        roundRect(bx, by - 30, tw, 22, 11);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = s.saturated ? '#dc2626' : '#059669';
        ctx.textAlign = 'left';
        ctx.fillText(badge, bx + 11, by - 14);
        ctx.restore();

        // 용해도 곡선
        var cx0 = bx + bw + 46, cy0 = 34, cw = W - cx0 - 24, ch = H - 92;
        if (cw < 120) return;
        ctx.save();
        ctx.fillStyle = dark() ? 'rgba(20,26,38,.6)' : 'rgba(255,255,255,.8)';
        ctx.strokeStyle = 'rgba(148,163,184,.35)';
        ctx.lineWidth = 1.2;
        roundRect(cx0, cy0, cw, ch, 14);
        ctx.fill(); ctx.stroke();

        var x0 = cx0 + 38, x1 = cx0 + cw - 14, yTop = cy0 + 32, yBot = cy0 + ch - 28;
        var maxY = s.solute === 'sugar' ? 400 : 180;
        function px(T) { return x0 + (x1 - x0) * (T / 80); }
        function py(v) { return yBot - (yBot - yTop) * Math.min(1.02, v / maxY); }

        ctx.strokeStyle = dark() ? 'rgba(148,163,184,.22)' : 'rgba(148,163,184,.3)';
        ctx.fillStyle = dark() ? '#94a3b8' : '#64748b';
        ctx.font = '800 9px ' + FONT;
        ctx.textAlign = 'right';
        for (var v = 0; v <= maxY; v += maxY / 4) {
            ctx.beginPath(); ctx.moveTo(x0, py(v)); ctx.lineTo(x1, py(v)); ctx.stroke();
            ctx.fillText(Math.round(v) + '', x0 - 5, py(v) + 3);
        }
        ctx.textAlign = 'center';
        for (var T = 0; T <= 80; T += 20) {
            ctx.fillText(T + '°', px(T), yBot + 14);
        }

        // 곡선
        ctx.strokeStyle = solute.c;
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        for (var t2 = 0; t2 <= 80; t2 += 1) {
            var vv = solubility(s.solute, t2);
            if (t2 === 0) ctx.moveTo(px(t2), py(vv)); else ctx.lineTo(px(t2), py(vv));
        }
        ctx.stroke();

        // 현재 온도 표시
        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = 'rgba(239,68,68,.75)';
        ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.moveTo(px(s.T), yTop); ctx.lineTo(px(s.T), yBot); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(px(s.T), py(s.cap / (s.Vw / 100)), 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = dark() ? '#94a3b8' : '#64748b';
        ctx.font = '800 9.5px ' + FONT;
        ctx.textAlign = 'left';
        ctx.fillText(solute.n + ' 용해도 (물 100 mL에 녹는 g)', cx0 + 12, cy0 + 14);
        ctx.restore();
    }

    /* ---------- 질문 생성 ---------- */
    function circQuestions() {
        var c = circState();
        var q = [];
        var w = WIRE[c.wire];
        if (!isFinite(w.r)) {
            q.push('도선 사이에 ' + w.n + '이(가) 들어 있어요. ' + w.n + ' 속에서 전자가 자유롭게 움직일 수 있을까요?');
            q.push('구리 도선과 고무 도선은 무엇이 다를까요? 전자가 잘 지나가는 물질의 공통점은 무엇일까요?');
            q.push('전구에 불이 들어오는 조건을 도선의 재질과 연결해서 한 문장으로 말해 본다면 어떻게 말할 수 있을까요?');
            q.push('도선 재질을 하나만 바꿔 보고, 바꾸기 전에 전류계 값이 어떻게 될지 먼저 예상해 적어 보세요.');
        } else if (!c.closed) {
            q.push('회로를 손가락으로 한 바퀴 따라가 보세요. 전자가 지나갈 길이 끊긴 곳이 있나요?');
            q.push('스위치의 두 금속 조각은 지금 서로 닿아 있나요? 닿지 않으면 전자는 그 틈을 어떻게 건널 수 있을까요?');
            q.push('전류계가 0을 가리키는 지금과 전류가 흐를 때, 회로에서 달라지는 것은 딱 무엇일까요?');
            q.push('스위치를 움직여 보기 전에 전류계 값이 어떻게 될지 먼저 예상해 적어 보세요.');
        } else if (c.V <= 0) {
            q.push('전압계가 0 V를 가리키고 있어요. 전자를 밀어 줄 힘이 없다면 전자는 움직일까요?');
            q.push('전압과 전류는 어떤 관계일까요? 전압을 두 배로 하면 전류는 어떻게 될지 예상해 보세요.');
            q.push('전압을 조금씩 올리며 전류계 값을 적어 보면 어떤 규칙이 보이나요?');
        } else if (c.I < 0.25) {
            q.push('전류가 흐르긴 하는데 아주 작아요. 회로에서 전자의 흐름을 방해하는 것은 무엇일까요?');
            q.push('저항 ' + c.R + ' Ω과 전압 ' + c.V.toFixed(1) + ' V로 계산하면 전류는 얼마가 되어야 할까요? 직접 계산해 보세요.');
            q.push('저항을 절반으로 줄이면 전류는 어떻게 될까요? 예상하고 확인해 보세요.');
            q.push('전구가 어두운 이유를 전류의 세기와 연결해서 설명해 본다면?');
        } else {
            q.push('전류가 잘 흐르고 있어요. 전구를 더 밝게 만들려면 전압과 저항 중 무엇을 어떻게 바꿔야 할까요?');
            q.push('저항을 키우면 전류와 전구 밝기는 각각 어떻게 될까요? 예상하고 확인해 보세요.');
            q.push('전압을 두 배로 하면 전류와 밝기는 어떻게 될까요? 결과가 예상과 같았나요?');
            q.push('전구가 밝아지는 조건을 전류·전압·저항으로 한 문장씩 설명해 보세요.');
        }
        return q;
    }

    function solQuestions() {
        var s = solState();
        var q = [];
        if (s.saturated) {
            q.push('용액 아래에 남아 있는 알갱이는 무엇일까요? 물속에는 이미 무엇이 얼마나 들어 있을까요?');
            q.push('지금 온도에서 물 ' + s.Vw + ' mL에 최대로 녹을 수 있는 양은 몇 g일까요? 오른쪽 그래프에서 찾아보세요.');
            q.push('온도를 높이면 남은 ' + s.left.toFixed(1) + ' g이 더 녹을까요? 이 물질의 곡선이 어떻게 생겼는지 보고 예상해 보세요.');
            q.push('물을 더 넣는 것과 온도를 높이는 것은 각각 용해도를 어떻게 바꿀까요?');
            q.push('바꿀 조건을 하나만 정해 실험하고, 결과를 적어 보세요.');
        } else {
            q.push('넣은 ' + s.m + ' g이 모두 녹았어요. 이 용액은 포화일까요, 불포화일까요?');
            q.push('포화인지 확인하려면 무엇을 더 넣어 보면 될까요?');
            q.push('지금 온도에서 최대로 녹을 수 있는 양은 몇 g일까요? 그래프에서 찾아 남은 여유를 계산해 보세요.');
            q.push('온도를 낮추면 이 용액에서 무슨 일이 생길지 예상해 보세요.');
        }
        return q;
    }

    function stateLine() {
        if (st.m === 'circ') {
            var c = circState();
            return '지금 상태: 스위치 ' + (c.closed ? '닫힘' : '열림') + ' · 전압 ' + c.V.toFixed(1) + ' V · 저항 ' + c.R +
                ' Ω · 도선 ' + WIRE[c.wire].n + ' · 전류 ' + c.I.toFixed(2) + ' A';
        }
        var s = solState();
        return '지금 상태: ' + SOLUTES[s.solute].n + ' · ' + s.T + ' °C · 물 ' + s.Vw + ' mL · 넣은 양 ' + s.m +
            ' g · 녹은 양 ' + s.dissolved.toFixed(1) + ' g · 남은 양 ' + s.left.toFixed(1) + ' g';
    }

    function resetQs(silent) {
        st.asked.circ = 0; st.asked.sol = 0;
        st.qs.circ = []; st.qs.sol = [];
        $('#qList').innerHTML = '<li class="empty">버튼을 누르면 지금 상태에 맞는 첫 질문이 나와요.</li>';
        $('#qLeft').textContent = '질문 0개';
        $('#qStage').textContent = '';
        $('#stateLine').textContent = stateLine();
        if (!silent) $('#myNote').value = '';
    }

    function guideRefresh() {
        if (st.qs[st.m].length) resetQs(true);
        else $('#stateLine').textContent = stateLine();
    }

    function ask() {
        var key = st.m;
        var all = key === 'circ' ? circQuestions() : solQuestions();
        var i = st.asked[key];
        if (i >= all.length) {
            // 새 사이클
            st.asked[key] = 0; i = 0;
            st.qs[key] = [];
            $('#qList').innerHTML = '';
        }
        var text = all[i];
        var isAct = i === all.length - 1;
        if (i === 0) {
            st.qs[key] = [];
            $('#qList').innerHTML = '';
        }
        st.qs[key].push(text);
        var li = document.createElement('li');
        if (isAct) li.className = 'act';
        li.innerHTML = '<span class="no">' + (i + 1) + '</span>' + text;
        $('#qList').appendChild(li);
        $('#qList').scrollTop = $('#qList').scrollHeight;
        st.asked[key] = i + 1;
        $('#qLeft').textContent = '질문 ' + st.qs[key].length + '개';
        $('#qStage').textContent = isAct ? '마지막 질문 · 이제 직접 해 보세요' : (i + 1) + ' / ' + all.length;
        $('#stateLine').textContent = stateLine();
    }

    /* ---------- 렌더 ---------- */
    var last = 0;
    function loop(ts) {
        var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016;
        last = ts;
        bg();
        if (st.m === 'circ') drawCirc(dt);
        else drawSol();
        requestAnimationFrame(loop);
    }

    /* ---------- 이벤트 ---------- */
    $('#modeSeg').addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        st.m = b.dataset.m;
        Array.prototype.forEach.call(this.children, function (x) { x.classList.toggle('on', x === b); });
        $('#ctrlCirc').hidden = st.m !== 'circ';
        $('#ctrlSol').hidden = st.m !== 'sol';
        var btn = $('#btnAsk');
        btn.textContent = st.m === 'circ' ? '왜 전류가 안 흐를까?' : '왜 더 안 녹을까?';
        $('#guideSub').textContent = st.m === 'circ'
            ? '스위치·전압·저항·도선을 바꿔 보고, 지금 상태를 읽어 주는 질문으로 원인을 찾아가요.'
            : '온도·물의 양·넣은 양을 바꿔 보고, 용해도 그래프와 비교하며 스스로 원인을 찾아가요.';
        resetQs(true);
    });

    $('#btnSwitch').addEventListener('click', function () {
        st.circ.closed = !st.circ.closed;
        this.classList.toggle('on', st.circ.closed);
        $('#swTxt').textContent = st.circ.closed ? '닫힘' : '열림';
        guideRefresh();
    });
    $('#cV').addEventListener('input', function () {
        st.circ.V = parseFloat(this.value);
        $('#cVV').textContent = st.circ.V.toFixed(1) + ' V';
        guideRefresh();
    });
    $('#cR').addEventListener('input', function () {
        st.circ.R = parseFloat(this.value);
        $('#cRV').textContent = st.circ.R + ' Ω';
        guideRefresh();
    });
    $('#wireChips').addEventListener('click', function (e) {
        var b = e.target.closest('.chip');
        if (!b) return;
        st.circ.wire = b.dataset.w;
        Array.prototype.forEach.call(this.children, function (x) { x.classList.toggle('on', x === b); });
        guideRefresh();
    });

    $('#soluteChips').addEventListener('click', function (e) {
        var b = e.target.closest('.chip');
        if (!b) return;
        st.sol.solute = b.dataset.s;
        Array.prototype.forEach.call(this.children, function (x) { x.classList.toggle('on', x === b); });
        guideRefresh();
    });
    $('#sT').addEventListener('input', function () {
        st.sol.T = parseFloat(this.value);
        $('#sTV').textContent = st.sol.T + ' °C';
        guideRefresh();
    });
    $('#sV').addEventListener('input', function () {
        st.sol.Vw = parseFloat(this.value);
        $('#sVV').textContent = st.sol.Vw + ' mL';
        guideRefresh();
    });
    $('#sM').addEventListener('input', function () {
        st.sol.m = parseFloat(this.value);
        $('#sMV').textContent = st.sol.m + ' g';
        guideRefresh();
    });

    $('#btnAsk').addEventListener('click', ask);

    $('#btnSave').addEventListener('click', function () {
        var txt = ($('#myNote').value || '').trim();
        if (!txt) {
            $('#noteMsg').textContent = '먼저 생각을 한 줄이라도 적어 보세요.';
            return;
        }
        var rec = { when: new Date().toISOString(), mode: st.m, state: stateLine(), note: txt, asked: st.qs[st.m].slice(0) };
        var all = [];
        try { all = JSON.parse(localStorage.getItem('svl_socratic_notes') || '[]'); } catch (e) { all = []; }
        all.push(rec);
        if (all.length > 40) all = all.slice(-40);
        try { localStorage.setItem('svl_socratic_notes', JSON.stringify(all)); } catch (e) { }
        $('#noteMsg').textContent = '';
        $('#savedNote').textContent = '📌 기록 ' + all.length + '개 저장됨 · 이 기기에만 보관됩니다.';
        toast('내 생각을 기록으로 남겼어요');
    });

    $('#btnReset').addEventListener('click', function () {
        st.circ = { V: 6, R: 6, closed: false, wire: 'copper', t: 0 };
        st.sol = { solute: 'kno3', T: 20, Vw: 50, m: 40 };
        $('#btnSwitch').classList.remove('on');
        $('#swTxt').textContent = '열림';
        $('#cV').value = 6; $('#cVV').textContent = '6.0 V';
        $('#cR').value = 6; $('#cRV').textContent = '6 Ω';
        Array.prototype.forEach.call($('#wireChips').children, function (x, i) { x.classList.toggle('on', i === 0); });
        Array.prototype.forEach.call($('#soluteChips').children, function (x, i) { x.classList.toggle('on', i === 0); });
        $('#sT').value = 20; $('#sTV').textContent = '20 °C';
        $('#sV').value = 50; $('#sVV').textContent = '50 mL';
        $('#sM').value = 40; $('#sMV').textContent = '40 g';
        resetQs(false);
        toast('처음 상태로 돌아왔어요');
    });

    /* ---------- 테마 · 전체화면 ---------- */
    function applyTheme(d) {
        document.body.classList.toggle('dark', d);
        $('#bTheme').textContent = d ? '☀️ 주간 모드' : '🌙 야간 모드';
        try { localStorage.setItem('svl_soc_theme', d ? '1' : '0'); } catch (e) { }
    }
    $('#bTheme').addEventListener('click', function () { applyTheme(!document.body.classList.contains('dark')); });
    try { if (localStorage.getItem('svl_soc_theme') === '1') applyTheme(true); } catch (e) { }

    (function () {
        var btn = document.getElementById('btn-fullscreen');
        var iconEl = document.getElementById('fsIcon');
        var textEl = document.getElementById('fsText');
        var root = document.documentElement;
        var PSEUDO = 'pseudo-fullscreen';
        function isRealFs() {
            return !!(document.fullscreenElement || document.webkitFullscreenElement ||
                document.mozFullScreenElement || document.msFullscreenElement);
        }
        function isPseudo() { return document.body.classList.contains(PSEUDO); }
        function syncUI() {
            var on = isRealFs() || isPseudo();
            iconEl.textContent = on ? '🗗' : '⛶';
            textEl.textContent = on ? '창모드' : '전체화면';
            btn.setAttribute('aria-pressed', on ? 'true' : 'false');
            btn.setAttribute('aria-label', on ? '창모드로 전환' : '전체화면으로 전환');
        }
        function toast2(msg) {
            var el = document.getElementById('fs-toast');
            if (!el) {
                el = document.createElement('div');
                el.className = 'fs-toast'; el.id = 'fs-toast';
                document.body.appendChild(el);
            }
            el.textContent = msg; void el.offsetWidth; el.classList.add('show');
            clearTimeout(toast2._t);
            toast2._t = setTimeout(function () { el.classList.remove('show'); }, 2600);
        }
        window.__svlToast = toast2;
        function enterPseudo(hint) {
            if (isRealFs()) return;
            document.body.classList.add(PSEUDO);
            syncUI();
            if (hint) toast2('이 브라우저는 브라우저 전체화면 대신 상단 바를 숨긴 몰입 모드로 표시합니다');
        }
        function requestReal() {
            var req = root.requestFullscreen || root.webkitRequestFullscreen || root.mozRequestFullScreen || root.msRequestFullscreen;
            if (!req) return false;
            try {
                var p = req.call(root);
                if (p && typeof p.then === 'function') p.then(syncUI, function () { enterPseudo(true); });
                else setTimeout(function () { if (!isRealFs() && !isPseudo()) enterPseudo(true); else syncUI(); }, 500);
                return true;
            } catch (err) { return false; }
        }
        btn.addEventListener('click', function () {
            if (isRealFs()) {
                var exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
                try { if (exit) { var q = exit.call(document); if (q && q.catch) q.catch(function () { }); } } catch (err) { }
                syncUI(); return;
            }
            if (isPseudo()) { document.body.classList.remove(PSEUDO); syncUI(); return; }
            if (!requestReal()) enterPseudo(true);
            syncUI();
        });
        ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
            document.addEventListener(ev, function () {
                if (isRealFs()) document.body.classList.remove(PSEUDO);
                syncUI();
            });
        });
        document.addEventListener('keydown', function (e) {
            if ((e.key === 'Escape' || e.key === 'Esc') && isPseudo() && !isRealFs()) {
                document.body.classList.remove(PSEUDO); syncUI();
            }
        });
        window.addEventListener('resize', syncUI);
        syncUI();
    })();

    function toast(msg) { window.__svlToast && window.__svlToast(msg); }

    /* ---------- 시작 ---------- */
    resize();
    window.addEventListener('resize', resize);
    if (window.ResizeObserver) new ResizeObserver(resize).observe(cv.parentElement);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize).catch(function () { });
    try {
        var saved = JSON.parse(localStorage.getItem('svl_socratic_notes') || '[]');
        if (saved.length) $('#savedNote').textContent = '📌 기록 ' + saved.length + '개 저장됨 · 이 기기에만 보관됩니다.';
    } catch (e) { }
    $('#stateLine').textContent = stateLine();
    requestAnimationFrame(loop);
})();
</script>
<script src="../common/feedback.js" defer></script>
</body>
</html>
