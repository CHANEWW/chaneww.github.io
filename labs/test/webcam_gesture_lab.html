<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>제스처 조작 실험실 | Science Virtual LAB</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="preload" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff" as="font" type="font/woff" crossorigin>
<style>
@font-face{
    font-family:'SeoulNamsan';
    src:local('SeoulNamsan M'),local('SeoulNamsanM'),local('서울남산체 M'),
        url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff') format('woff');
    font-weight:400;font-style:normal;font-display:swap;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
    --bg:#eef2f7; --ink:#14181f; --muted:#64748b; --line:rgba(15,23,42,.10);
    --card:rgba(255,255,255,.92); --solid:#fff; --accent:#0a84ff; --soft:rgba(10,132,255,.12);
    --ok:#10b981; --warn:#f59e0b; --danger:#ef4444; --shadow:0 10px 30px rgba(15,23,42,.10);
}
body.dark{
    --bg:#0e121c; --ink:#eef3fb; --muted:#94a3b8; --line:rgba(255,255,255,.13);
    --card:rgba(26,32,45,.92); --solid:#1a2130; --accent:#4aa3ff; --soft:rgba(74,163,255,.18);
    --ok:#34d399; --shadow:0 10px 30px rgba(0,0,0,.5);
}
html,body{margin:0;padding:0;width:100%;height:100%}
body{
    font-family:'SeoulNamsan',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:var(--ink); background:var(--bg); overflow:hidden; transition:background .3s ease,color .3s ease;
}
.top-nav{
    position:fixed; top:0; left:0; right:0; height:60px; display:flex; align-items:center; gap:10px;
    padding:0 250px 0 16px; z-index:100; background:var(--card);
    backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-bottom:1px solid var(--line);
}
.back-btn{
    display:inline-flex; align-items:center; gap:6px; padding:7px 14px; font-family:inherit; font-size:13px;
    font-weight:800; color:inherit; text-decoration:none; border:1px solid var(--line); border-radius:999px;
    background:var(--solid); transition:transform .16s ease; white-space:nowrap;
}
.back-btn:hover{transform:translateY(-1px)}
.page-title{display:flex; align-items:center; gap:8px; font-size:14.5px; font-weight:800; letter-spacing:-.2px; min-width:0}
.page-title .t{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pill-badge{padding:3px 9px; border-radius:999px; font-size:10.5px; font-weight:800; background:var(--soft); color:var(--accent); white-space:nowrap; flex:0 0 auto}
.top-right-bar{
    position:fixed !important; top:15px !important; right:20px !important;
    display:flex !important; flex-direction:column; align-items:flex-end; gap:8px; z-index:130 !important; pointer-events:none;
}
.top-right-bar > .tr-util{display:flex !important; flex-direction:row; align-items:center; gap:8px; pointer-events:auto}
#bTheme{
    display:inline-flex; align-items:center; justify-content:center; gap:6px; height:40px; padding:0 15px;
    border-radius:20px; cursor:pointer; font-family:inherit; font-size:12.5px; font-weight:800; color:inherit;
    border:1px solid var(--line); background:var(--card); box-shadow:var(--shadow);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); white-space:nowrap; transition:transform .16s ease;
}
#bTheme:hover{transform:translateY(-1px)}

.app{position:fixed; top:60px; left:0; right:0; bottom:0; overflow-y:auto; padding:12px 16px 26px}
.wrap{max-width:1180px; margin:0 auto}

/* 툴바 */
.toolbar{
    display:flex; align-items:center; gap:9px; flex-wrap:wrap; padding:10px 12px; border-radius:18px;
    background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow); margin-bottom:12px;
}
.seg{display:inline-flex; padding:3px; border-radius:12px; background:var(--solid); border:1px solid var(--line); gap:3px}
.seg button{
    border:none; background:transparent; color:inherit; font-family:inherit; font-size:12.5px; font-weight:900;
    padding:8px 13px; border-radius:9px; cursor:pointer; white-space:nowrap; transition:background .16s ease,color .16s ease;
}
.seg button.on{background:var(--accent); color:#fff; box-shadow:0 6px 14px rgba(10,132,255,.28)}
.btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:9px 14px; border-radius:12px;
    border:none; cursor:pointer; font-family:inherit; font-size:12.5px; font-weight:900; color:#fff;
    background:var(--accent); box-shadow:0 8px 18px rgba(10,132,255,.24); transition:transform .16s ease; white-space:nowrap;
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line); box-shadow:none}
.btn.on{background:linear-gradient(135deg,#10b981,#059669); box-shadow:0 8px 18px rgba(16,185,129,.26)}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none}
.status{font-size:11.5px; font-weight:800; color:var(--muted); margin-left:auto; white-space:nowrap}
.status.live{color:#059669}
body.dark .status.live{color:#34d399}
.status.err{color:var(--danger)}

/* 무대 + 사이드 */
.stage-grid{display:grid; grid-template-columns:minmax(0,1fr) 288px; gap:12px; align-items:start}
.stage-card{
    position:relative; border-radius:22px; border:1px solid var(--line); background:var(--card);
    box-shadow:var(--shadow); overflow:hidden; height:min(62vh,560px); min-height:380px;
}
#stage{display:block; width:100%; height:100%; touch-action:none; cursor:crosshair}
.stage-hint{
    position:absolute; left:12px; bottom:10px; right:12px; font-size:11.5px; font-weight:800; color:var(--muted);
    background:rgba(255,255,255,.7); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    padding:6px 10px; border-radius:10px; pointer-events:none; text-align:center;
}
body.dark .stage-hint{background:rgba(20,26,38,.72); color:#94a3b8}

.side{display:flex; flex-direction:column; gap:10px; min-width:0}
.card{border-radius:18px; border:1px solid var(--line); background:var(--card); box-shadow:var(--shadow); padding:13px 14px}
.card h3{margin:0 0 10px; font-size:12.5px; font-weight:900; letter-spacing:-.2px; display:flex; align-items:center; gap:6px}
.row{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:5px 0; font-size:12px; font-weight:800; color:var(--muted)}
.row b{color:var(--ink); font-variant-numeric:tabular-nums; font-size:13px; font-weight:900}
.row b.hot{color:var(--accent)}
.swatch{width:100%; height:30px; border-radius:10px; border:1px solid var(--line); margin:6px 0 4px; transition:background .25s ease}
.tip{margin:8px 0 0; font-size:11.5px; font-weight:700; line-height:1.55; color:var(--muted)}
.tip b{color:var(--ink)}
.mini{display:grid; grid-template-columns:repeat(3,1fr); gap:5px; margin-top:8px}
.mini button{
    border:1px solid var(--line); background:var(--solid); color:inherit; font-family:inherit; font-size:11px;
    font-weight:900; padding:7px 4px; border-radius:9px; cursor:pointer; white-space:nowrap;
}
.mini button.on{background:var(--accent); color:#fff; border-color:transparent}

.cam-card{position:relative; border-radius:18px; overflow:hidden; border:1px solid var(--line); background:#0b0f16; box-shadow:var(--shadow)}
.cam-card video,.cam-card canvas{display:block; width:100%; aspect-ratio:4/3; object-fit:cover}
.cam-card video{transform:scaleX(-1); opacity:0; position:absolute; inset:0; height:100%}
.cam-card canvas{position:relative; z-index:2; background:#0b0f16}
.cam-label{position:absolute; left:8px; top:8px; z-index:3; font-size:10.5px; font-weight:900; color:#fff; background:rgba(0,0,0,.5); padding:3px 8px; border-radius:999px}
.cam-empty{
    position:absolute; inset:0; z-index:3; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px; color:#8ea3bd; font-size:11.5px; font-weight:800; text-align:center; padding:10px;
}
.cam-empty .big{font-size:26px}

/* 전체화면 */
#btn-fullscreen{
    position:fixed; right:20px; bottom:calc(18px + env(safe-area-inset-bottom,0px)); z-index:95;
    display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:9px 16px; border-radius:999px;
    border:1px solid var(--line); background:var(--card); box-shadow:0 8px 24px rgba(15,23,42,.16);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    color:inherit; font-family:inherit; font-size:12.5px; font-weight:800; white-space:nowrap; cursor:pointer;
    transition:transform .18s ease;
}
#btn-fullscreen:hover{transform:translateY(-1px)}
body.pseudo-fullscreen .top-nav{transform:translateY(-100%); opacity:0; pointer-events:none}
body.pseudo-fullscreen .app{top:0}
body.pseudo-fullscreen #feedback-btn,body.pseudo-fullscreen .svl-fb-btn{display:none !important}
.fs-toast{
    position:fixed; left:50%; bottom:calc(74px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,8px);
    z-index:2050; max-width:86vw; padding:10px 16px; border-radius:14px; background:rgba(28,28,30,.92);
    color:#fff; font-size:12.5px; font-weight:700; line-height:1.45; text-align:center;
    box-shadow:0 10px 26px rgba(0,0,0,.3); opacity:0; pointer-events:none; transition:opacity .26s ease, transform .26s ease;
}
.fs-toast.show{opacity:1; transform:translate(-50%,0)}

@media (max-width:900px){
    .top-nav{height:52px; padding:0 12px; gap:8px}
    .page-title{font-size:12.5px}
    .back-btn{padding:6px 11px; font-size:12px}
    .top-right-bar{top:calc(max(8px,env(safe-area-inset-top)) + 48px) !important; right:8px !important}
    #bTheme{height:34px; padding:0 11px; font-size:11.5px}
    .app{top:100px; padding:8px 10px 64px}
    .stage-grid{grid-template-columns:minmax(0,1fr)}
    .stage-card{height:min(46vh,360px); min-height:300px}
    .cam-card{display:none}
    .stage-hint{right:96px; left:8px; font-size:11px}
    .toolbar{padding:8px 9px; gap:7px}
    .seg button{padding:7px 10px; font-size:11.5px}
    .btn{padding:8px 11px; font-size:11.5px}
    .status{width:100%; margin-left:0; white-space:normal}
    #btn-fullscreen{bottom:calc(10px + env(safe-area-inset-bottom,0px)); right:10px; padding:8px 13px; font-size:12px}
}
@media (max-height:520px) and (orientation:landscape){
    .stage-card{height:min(70vh,300px); min-height:240px}
}
</style>
</head>
<body>

<nav class="top-nav">
    <a href="../../index.html" class="back-btn" onclick="var r=document.referrer;if(history.length>1&&r&&r.indexOf(location.origin+'/')===0&&/(\/|index(_3d)?\.html)(\?|#|$)/.test(r)){history.back();return false;}"><span>⬅</span> 메인</a>
    <div class="page-title"><span class="t">제스처 조작 실험실</span><span class="pill-badge">확장 기능</span></div>
</nav>

<div class="top-right-bar">
    <div class="tr-util">
        <button id="bTheme" type="button">🌙 야간 모드</button>
    </div>
</div>

<div class="app">
<div class="wrap">

    <div class="toolbar">
        <div class="seg" id="modeSeg">
            <button type="button" data-mode="pour" class="on">💧 산·염기 붓기</button>
            <button type="button" data-mode="lens">🔎 볼록렌즈 초점</button>
        </div>
        <button class="btn" id="btnCam" type="button">🎥 웹캠 손 추적 켜기</button>
        <button class="btn ghost" id="btnDrop" type="button">✋ 놓기</button>
        <button class="btn ghost" id="btnReset" type="button">🔄 처음부터</button>
        <span class="status" id="camStatus">터치·마우스로 조작 중 · 비커를 잡아 보세요</span>
    </div>

    <div class="stage-grid">
        <div class="stage-card">
            <canvas id="stage"></canvas>
            <div class="stage-hint" id="stageHint">비커를 누른 채 위로 들면 기울어져 용액이 떨어져요</div>
        </div>

        <aside class="side">
            <div class="cam-card">
                <span class="cam-label" id="camLabel">웹캠 OFF</span>
                <video id="cam" playsinline muted autoplay></video>
                <canvas id="camMask"></canvas>
                <div class="cam-empty" id="camEmpty"><span class="big">🎥</span><span>웹캠을 켜면<br>손의 움직임이 그대로 손이 돼요</span></div>
            </div>

            <section class="card" id="panelPour">
                <h3>💧 비커 상태</h3>
                <div class="seg" id="indSeg" style="width:100%; display:flex">
                    <button type="button" data-ind="btb" class="on" style="flex:1; font-size:11px; padding:7px 4px">BTB</button>
                    <button type="button" data-ind="pp" style="flex:1; font-size:11px; padding:7px 4px">페놀프탈레인</button>
                    <button type="button" data-ind="mo" style="flex:1; font-size:11px; padding:7px 4px">메틸오렌지</button>
                </div>
                <div class="swatch" id="swatch"></div>
                <div class="row"><span>플라스크 pH</span><b id="phVal">1.00</b></div>
                <div class="row"><span>넣은 염기</span><b id="vVal">0 mL</b></div>
                <div class="row"><span>중화점</span><b id="eqVal">아직</b></div>
                <p class="tip" id="pourTip">산 50 mL에 염기를 <b>한 방울씩</b> 떨어뜨려 색이 바뀌는 순간을 찾아보세요.</p>
            </section>

            <section class="card" id="panelLens" hidden>
                <h3>🔎 렌즈 정보</h3>
                <div class="mini" id="fSeg">
                    <button type="button" data-f="10" class="on">f = 10 cm</button>
                    <button type="button" data-f="15">f = 15 cm</button>
                    <button type="button" data-f="20">f = 20 cm</button>
                </div>
                <div class="row"><span>물체 거리</span><b id="doVal">— cm</b></div>
                <div class="row"><span>상 거리</span><b id="diVal">— cm</b></div>
                <div class="row"><span>배율</span><b id="magVal">—</b></div>
                <div class="row"><span>스크린 선명도</span><b id="sharpVal" class="hot">—</b></div>
                <p class="tip" id="lensTip">손을 좌우로 움직여 렌즈를 옮기고, 스크린 위 상이 <b>가장 또렷한 자리</b>를 찾아보세요.</p>
            </section>
        </aside>
    </div>

</div>
</div>

<button id="btn-fullscreen" type="button" aria-pressed="false" aria-label="전체화면으로 전환">
    <span class="fs-icon" id="fsIcon">⛶</span><span class="fs-text" id="fsText">전체화면</span>
</button>

<script>
/* ==========================================================
   제스처 조작 실험실
   - 웹캠 움직임 영역 추적으로 손 커서를 만들고,
     손이 비커에 머무르면 집기(dwell) → 위로 들면 기울어져 붓기
   - 권한·지원이 없으면 터치·마우스 드래그로 동일하게 조작
   ========================================================== */
(function () {
    'use strict';
    var $ = function (s) { return document.querySelector(s); };
    var cv = $('#stage');
    var ctx = cv.getContext('2d');

    var W = 900, H = 520, DPR = 1;
    var FONT = "'SeoulNamsan', -apple-system, 'Apple SD Gothic Neo', sans-serif";

    var mode = 'pour';
    var camOn = false, camStream = null, camReady = false;

    /* ---------- 상태 ---------- */
    var cur = { x: 0, y: 0, tx: 0, ty: 0, live: false, dwell: 0 };
    var beaker = {
        x: 0, y: 0, w: 96, h: 96, tilt: 0, held: false,
        offx: 0, offy: 0, grabY: 0, hover: 0, homeX: 0, homeY: 0
    };
    var flask = { cx: 0, cy: 0, w: 120, h: 170, top: 0, mouth: 60 };
    var tableY = 420;

    var pour = {
        vBase: 0,          // 넣은 염기(mL)
        pH: 1,             // 현재 pH
        drops: [],
        acc: 0,
        indicator: 'btb',
        passed: false,
        splash: 0, spill: 0, t: 0
    };

    var lens = {
        x: 0, ox: 0, sx: 0, axisY: 0, f: 10, pxPerCm: 10,
        objH: 56, sharp: 0, di: 0, do: 0, mag: 0, focusFlash: 0
    };

    /* ---------- 색 도우미 ---------- */
    function hex(c) {
        var n = parseInt(c.slice(1), 16);
        return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }
    function mix(a, b, t) {
        var A = hex(a), B = hex(b);
        t = Math.max(0, Math.min(1, t));
        return 'rgb(' + Math.round(A[0] + (B[0] - A[0]) * t) + ',' +
            Math.round(A[1] + (B[1] - A[1]) * t) + ',' +
            Math.round(A[2] + (B[2] - A[2]) * t) + ')';
    }
    function palette(pH) {
        var ind = pour.indicator;
        if (ind === 'btb') {
            if (pH < 6.0) return mix('#f2d024', '#2fae62', Math.max(0, (pH - 5.0) / 1.0) * 0.55);
            if (pH <= 7.6) return mix('#2fae62', '#2f6fe0', (pH - 6.0) / 1.6);
            return '#2f6fe0';
        }
        if (ind === 'pp') {
            var a = Math.max(0, Math.min(1, (pH - 8.0) / 1.4));
            return 'rgba(' + Math.round(246 - 20 * a) + ',' + Math.round(240 - 180 * a) + ',' + Math.round(250 - 100 * a) + ',' + (0.10 + 0.78 * a) + ')';
        }
        if (pH < 3.1) return '#e8483c';
        if (pH < 4.4) return mix('#e8483c', '#f2a33c', (pH - 3.1) / 1.3);
        return mix('#f2a33c', '#f2d54a', Math.min(1, (pH - 4.4) / 1.1));
    }

    /* ---------- pH 계산 (강산·강염기) ---------- */
    function phOf(vb) {
        var CAS = 0.10, VA = 50;               // 0.10 M HCl 50 mL
        var nH = VA / 1000 * CAS;
        var nOH = vb / 1000 * CAS;
        var V = (VA + vb) / 1000;
        if (nH > nOH) return -Math.log10(Math.max((nH - nOH) / V, 1e-14));
        if (nOH > nH) return 14 + Math.log10(Math.max((nOH - nH) / V, 1e-14));
        return 7;
    }

    /* ---------- 레이아웃 ---------- */
    function layout() {
        tableY = H * 0.82;
        flask.h = Math.min(H * 0.37, 176);
        flask.top = tableY - flask.h;
        flask.cx = W * 0.60;
        flask.mouth = Math.min(W * 0.135, 106);
        beaker.w = Math.min(W * 0.135, 96);
        beaker.h = beaker.w * 1.05;
        beaker.homeX = W * 0.20;
        beaker.homeY = tableY - beaker.h * 0.5;
        if (!beaker.held) { beaker.x = beaker.homeX; beaker.y = beaker.homeY; }

        lens.ox = W * 0.12; lens.sx = W * 0.90; lens.axisY = H * 0.50;
        lens.pxPerCm = (lens.sx - lens.ox) / 70;   // 물체~스크린 = 70 cm
        lens.objH = Math.min(H * 0.12, 60);
        if (!lens.x) lens.x = (lens.ox + lens.sx) / 2;
    }

    function resize() {
        var box = cv.parentElement.getBoundingClientRect();
        W = Math.max(300, box.width);
        H = Math.max(280, box.height);
        DPR = Math.min(2, window.devicePixelRatio || 1);
        cv.width = Math.round(W * DPR);
        cv.height = Math.round(H * DPR);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        layout();
    }

    /* ---------- 비커 그리기 ---------- */
    function drawBeaker() {
        var w = beaker.w, h = beaker.h;
        ctx.save();
        ctx.translate(beaker.x, beaker.y);
        ctx.rotate(beaker.tilt * Math.PI / 180 * 0.9);

        // 그림자
        ctx.save();
        ctx.globalAlpha = 0.16;
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.ellipse(0, h * 0.52, w * 0.52, h * 0.07, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // 유리
        var g = ctx.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2);
        g.addColorStop(0, 'rgba(210,232,246,.55)');
        g.addColorStop(0.5, 'rgba(255,255,255,.32)');
        g.addColorStop(1, 'rgba(190,220,240,.5)');
        ctx.fillStyle = g;
        ctx.strokeStyle = 'rgba(120,160,190,.85)';
        ctx.lineWidth = 2;
        roundRectPath(-w / 2, -h / 2, w, h, 10);
        ctx.fill();
        ctx.stroke();

        // 염기 용액 (아래 62%)
        ctx.save();
        roundRectPath(-w / 2 + 3, -h / 2 + h * 0.38, w - 6, h * 0.62 - 5, 8);
        ctx.clip();
        ctx.fillStyle = 'rgba(74,163,255,.75)';
        ctx.fillRect(-w / 2, -h / 2 + h * 0.38, w, h * 0.62);
        ctx.fillStyle = 'rgba(255,255,255,.35)';
        ctx.fillRect(-w / 2, -h / 2 + h * 0.38, w, 3);
        ctx.restore();

        // 눈금
        ctx.strokeStyle = 'rgba(90,130,160,.5)';
        ctx.lineWidth = 1.4;
        for (var i = 1; i <= 4; i++) {
            var yy = -h / 2 + (h * 0.62 / 5) * i;
            ctx.beginPath();
            ctx.moveTo(w / 2 - 12, yy);
            ctx.lineTo(w / 2 - 3, yy);
            ctx.stroke();
        }

        // 테두리 하이라이트
        ctx.strokeStyle = 'rgba(255,255,255,.7)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-w / 2 + 6, -h / 2 + 8);
        ctx.lineTo(-w / 2 + 6, h / 2 - 8);
        ctx.stroke();
        ctx.restore();

        // 눈금 라벨 없이, 집기 안내 링
        if (!beaker.held && mode === 'pour') {
            var p = beaker.hover / 0.28;
            ctx.save();
            ctx.translate(beaker.x, beaker.y);
            ctx.strokeStyle = 'rgba(10,132,255,.55)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, beaker.w * 0.66, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, p));
            ctx.stroke();
            ctx.restore();
        }
        if (beaker.held) {
            ctx.save();
            ctx.translate(beaker.x, beaker.y);
            ctx.strokeStyle = 'rgba(16,185,129,.85)';
            ctx.lineWidth = 3;
            ctx.setLineDash([6, 5]);
            ctx.beginPath();
            ctx.arc(0, 0, beaker.w * 0.66, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }
    }

    function roundRectPath(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }

    /* ---------- 플라스크 ---------- */
    function flaskPath() {
        var cx = flask.cx, top = flask.top, h = flask.h, m = flask.mouth;
        ctx.beginPath();
        ctx.moveTo(cx - m * 0.45, top);
        ctx.lineTo(cx + m * 0.45, top);
        ctx.lineTo(cx + m * 0.45, top + h * 0.26);
        ctx.lineTo(cx + m, top + h * 0.92);
        ctx.quadraticCurveTo(cx + m, top + h, cx + m * 0.66, top + h);
        ctx.lineTo(cx - m * 0.66, top + h);
        ctx.quadraticCurveTo(cx - m, top + h, cx - m, top + h * 0.92);
        ctx.lineTo(cx - m * 0.45, top + h * 0.26);
        ctx.closePath();
    }

    function drawFlask() {
        var h = flask.h, top = flask.top;
        var lvl = 0.62 + Math.min(0.26, pour.vBase / 100 * 0.26);  // 채워지는 높이

        // 내용물
        ctx.save();
        flaskPath();
        ctx.clip();
        var y0 = top + h * (1 - lvl);
        ctx.fillStyle = palette(pour.pH);
        ctx.globalAlpha = 0.9;
        ctx.fillRect(flask.cx - flask.mouth - 4, y0, flask.mouth * 2 + 8, h);
        ctx.globalAlpha = 1;
        // 표면
        ctx.fillStyle = 'rgba(255,255,255,.35)';
        ctx.beginPath();
        ctx.ellipse(flask.cx, y0, flask.mouth * 0.86, Math.max(5, flask.mouth * 0.10), 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // 유리
        flaskPath();
        var g = ctx.createLinearGradient(flask.cx - flask.mouth, top, flask.cx + flask.mouth, top + h);
        g.addColorStop(0, 'rgba(255,255,255,.42)');
        g.addColorStop(0.45, 'rgba(226,240,250,.24)');
        g.addColorStop(1, 'rgba(255,255,255,.5)');
        ctx.fillStyle = g;
        ctx.fill();
        ctx.strokeStyle = 'rgba(120,160,190,.85)';
        ctx.lineWidth = 2.2;
        ctx.stroke();

        // 눈금
        ctx.save();
        ctx.strokeStyle = 'rgba(90,130,160,.45)';
        ctx.lineWidth = 1.3;
        for (var i = 0; i < 4; i++) {
            var yy = top + h * (0.52 + i * 0.11);
            var half = flask.mouth * (0.74 + i * 0.06);
            ctx.beginPath();
            ctx.moveTo(flask.cx + half - 14, yy);
            ctx.lineTo(flask.cx + half, yy);
            ctx.stroke();
        }
        ctx.restore();
    }

    function drawTable() {
        var g = ctx.createLinearGradient(0, tableY - 10, 0, H);
        g.addColorStop(0, 'rgba(148,163,184,.16)');
        g.addColorStop(1, 'rgba(148,163,184,.05)');
        ctx.fillStyle = g;
        ctx.fillRect(0, tableY, W, H - tableY);
        ctx.strokeStyle = 'rgba(100,116,139,.35)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, tableY);
        ctx.lineTo(W, tableY);
        ctx.stroke();
    }

    function drawReadout() {
        var label = 'pH ' + pour.pH.toFixed(2);
        ctx.save();
        ctx.font = '900 13px ' + FONT;
        var w = Math.max(96, ctx.measureText(label).width + 34);
        var x = W / 2 - w / 2, y = 12;
        roundRectPath(x, y, w, 28, 14);
        ctx.fillStyle = document.body.classList.contains('dark') ? 'rgba(30,38,54,.94)' : 'rgba(255,255,255,.94)';
        ctx.fill();
        ctx.strokeStyle = palette(pour.pH);
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.fillStyle = document.body.classList.contains('dark') ? '#e2e8f0' : '#1f2937';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, W / 2, y + 15);
        if (pour.passed) {
            ctx.font = '900 10.5px ' + FONT;
            ctx.fillStyle = '#059669';
            ctx.fillText('중화점 통과 ✔', W / 2, y + 46);
        }
        ctx.restore();
        ctx.textBaseline = 'alphabetic';
    }

    function spout() {
        var w = beaker.w, h = beaker.h;
        var a = beaker.tilt * Math.PI / 180 * 0.9;
        var px = w / 2 * 0.92, py = -h / 2 * 0.92;
        return {
            x: beaker.x + px * Math.cos(a) - py * Math.sin(a),
            y: beaker.y + px * Math.sin(a) + py * Math.cos(a)
        };
    }

    function drawDrops() {
        for (var i = 0; i < pour.drops.length; i++) {
            var d = pour.drops[i];
            ctx.fillStyle = 'rgba(74,163,255,.92)';
            ctx.beginPath();
            ctx.ellipse(d.x, d.y, 4.2, 6.2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,.6)';
            ctx.beginPath();
            ctx.arc(d.x - 1.2, d.y - 1.6, 1.3, 0, Math.PI * 2);
            ctx.fill();
        }
        if (pour.splash > 0) {
            var lvl = 0.62 + Math.min(0.26, pour.vBase / 100 * 0.26);
            var sy = flask.top + flask.h * (1 - lvl);
            ctx.save();
            ctx.globalAlpha = pour.splash * 0.85;
            ctx.strokeStyle = 'rgba(74,163,255,.95)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(flask.cx, sy, flask.mouth * (0.45 + (1 - pour.splash) * 0.4), 4 + (1 - pour.splash) * 3, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }
    }

    /* ---------- 붓기 시뮬레이션 ---------- */
    function spawnDrop() {
        var s = spout();
        pour.drops.push({ x: s.x, y: s.y, vy: 20, vx: 0 });
    }

    function stepPour(dt) {
        if (!beaker.held) beaker.hover = Math.max(0, beaker.hover - dt);
        if (beaker.held) {
            beaker.tilt = Math.max(0, Math.min(100, (beaker.grabY - cur.y) / (H * 0.30) * 100));
            beaker.x = Math.max(beaker.w * 0.6, Math.min(W - beaker.w * 0.6, cur.x + beaker.offx));
            var maxY = tableY - beaker.h * 0.54;
            if (Math.abs(beaker.x - flask.cx) < flask.mouth * 1.05) maxY = Math.min(maxY, flask.top - beaker.h * 0.78);
            beaker.y = Math.min(maxY, cur.y + beaker.offy);
        } else {
            beaker.tilt = Math.max(0, beaker.tilt - dt * 260);
        }

        if (beaker.held && beaker.tilt > 26) {
            pour.acc += dt * ((beaker.tilt - 26) / 74) * 16;
        } else {
            pour.acc = 0;
        }
        while (pour.acc >= 1) {
            pour.acc -= 1;
            spawnDrop();
        }

        for (var i = pour.drops.length - 1; i >= 0; i--) {
            var d = pour.drops[i];
            d.vy += 1500 * dt;
            d.y += d.vy * dt;
            d.x += d.vx * dt;
            var surf = flask.top + flask.h * (1 - (0.62 + Math.min(0.26, pour.vBase / 100 * 0.26)));
            if (d.y >= surf) {
                if (Math.abs(d.x - flask.cx) < flask.mouth * 0.8) {
                    pour.vBase = Math.min(120, pour.vBase + 1);
                    var old = pour.pH;
                    pour.pH = phOf(pour.vBase);
                    pour.splash = 1;
                    if (old < 7 && pour.pH >= 7 && !pour.passed) {
                        pour.passed = true;
                        toast('중화점을 지났어요! 색이 바뀐 순간을 기억해 두세요');
                    }
                } else {
                    pour.spill++;
                }
                pour.drops.splice(i, 1);
            } else if (d.y > tableY + 40) {
                pour.drops.splice(i, 1);
            }
        }
        pour.splash = Math.max(0, pour.splash - dt * 3);
        pour.t += dt;
    }

    /* ---------- 렌즈 ---------- */
    function lensState() {
        var doCm = (lens.x - lens.ox) / lens.pxPerCm;
        var f = lens.f;
        var di = doCm > f + 0.01 ? 1 / (1 / f - 1 / doCm) : Infinity;
        lens.doCm = doCm;
        lens.di = di;
        lens.imgX = isFinite(di) ? lens.x + di * lens.pxPerCm : Infinity;
        lens.mag = isFinite(di) ? -di / doCm : NaN;
        var off = isFinite(lens.imgX) ? Math.abs(lens.imgX - lens.sx) : 999;
        lens.sharp = Math.max(0, Math.round(100 * (1 - Math.min(1, off / (W * 0.16)))));
        lens.blur = Math.min(16, off * 0.14);
        return lens;
    }

    function drawLensScene() {
        var ax = lens.axisY;
        lensState();
        var scrH = Math.min(H * 0.52, 230);
        var scrW = 46;

        // 광축
        ctx.strokeStyle = 'rgba(148,163,184,.65)';
        ctx.lineWidth = 1.4;
        ctx.setLineDash([7, 6]);
        ctx.beginPath();
        ctx.moveTo(lens.ox - 46, ax);
        ctx.lineTo(W - 14, ax);
        ctx.stroke();
        ctx.setLineDash([]);

        // 스크린 카드
        ctx.save();
        ctx.fillStyle = document.body.classList.contains('dark') ? 'rgba(236,242,250,.92)' : '#fff';
        ctx.strokeStyle = 'rgba(148,163,184,.9)';
        ctx.lineWidth = 2;
        roundRectPath(lens.sx - scrW / 2, ax - scrH / 2, scrW, scrH, 8);
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        // 스크린 위에 맺힌 상(흐림 정도 = 초점 어긋난 정도)
        var ds = Math.max(0, (lens.sx - lens.x) / lens.pxPerCm);
        var ihS = lens.doCm > 0 ? lens.objH * ds / lens.doCm : 0;
        ihS = Math.min(ihS, scrH * 0.48);
        ctx.save();
        roundRectPath(lens.sx - scrW / 2 + 2, ax - scrH / 2 + 2, scrW - 4, scrH - 4, 7);
        ctx.clip();
        if (ctx.filter !== undefined) ctx.filter = 'blur(' + lens.blur.toFixed(2) + 'px)';
        ctx.strokeStyle = lens.blur < 2.4 ? '#dc2626' : 'rgba(220,38,38,.8)';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(lens.sx, ax);
        ctx.lineTo(lens.sx, ax + ihS);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(lens.sx, ax + ihS);
        ctx.lineTo(lens.sx - 9, ax + ihS - 13);
        ctx.lineTo(lens.sx + 9, ax + ihS - 13);
        ctx.closePath();
        ctx.fillStyle = ctx.strokeStyle;
        ctx.fill();
        ctx.restore();
        if (ctx.filter !== undefined) ctx.filter = 'none';

        // 상이 맺히는 실제 위치
        if (isFinite(lens.imgX) && lens.imgX < W + 40) {
            var ih = Math.min(lens.objH * Math.abs(lens.mag), scrH * 0.95);
            ctx.save();
            ctx.strokeStyle = '#dc2626';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(lens.imgX, ax);
            ctx.lineTo(lens.imgX, ax + ih);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(lens.imgX, ax + ih);
            ctx.lineTo(lens.imgX - 7, ax + ih - 11);
            ctx.lineTo(lens.imgX + 7, ax + ih - 11);
            ctx.closePath();
            ctx.fillStyle = '#dc2626';
            ctx.fill();
            ctx.font = '800 10.5px ' + FONT;
            ctx.textAlign = 'center';
            ctx.fillText('상', lens.imgX, ax + ih + 15);
            ctx.restore();
        }

        // 물체(화살표)
        ctx.save();
        ctx.strokeStyle = '#0a84ff';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(lens.ox, ax);
        ctx.lineTo(lens.ox, ax - lens.objH);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(lens.ox, ax - lens.objH);
        ctx.lineTo(lens.ox - 7, ax - lens.objH + 11);
        ctx.lineTo(lens.ox + 7, ax - lens.objH + 11);
        ctx.closePath();
        ctx.fillStyle = '#0a84ff';
        ctx.fill();
        ctx.font = '800 11px ' + FONT;
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(10,132,255,.95)';
        ctx.fillText('물체', lens.ox, ax + 18);
        ctx.restore();

        // 광선
        var tipX = lens.ox, tipY = ax - lens.objH;
        ctx.save();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = 'rgba(245,158,11,.85)';
        ctx.beginPath();
        ctx.moveTo(tipX, tipY);
        ctx.lineTo(lens.x, tipY);
        if (isFinite(lens.imgX)) ctx.lineTo(lens.imgX, ax + lens.objH * Math.abs(lens.mag));
        ctx.stroke();
        ctx.strokeStyle = 'rgba(16,185,129,.85)';
        ctx.beginPath();
        ctx.moveTo(tipX, tipY);
        ctx.lineTo(lens.x, ax);
        if (isFinite(lens.imgX)) ctx.lineTo(lens.imgX, ax + lens.objH * Math.abs(lens.mag));
        ctx.stroke();
        ctx.restore();

        // 초점 표시
        ctx.save();
        [-lens.f, lens.f].forEach(function (f) {
            var fx = lens.x + f * lens.pxPerCm;
            if (fx < 4 || fx > W - 4) return;
            ctx.fillStyle = 'rgba(239,68,68,.95)';
            ctx.beginPath();
            ctx.arc(fx, ax, 3.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.font = '800 10px ' + FONT;
            ctx.textAlign = 'center';
            ctx.fillStyle = 'rgba(239,68,68,.85)';
            ctx.fillText('F', fx, ax - 8);
        });
        ctx.restore();

        // 렌즈
        ctx.save();
        ctx.translate(lens.x, ax);
        var lh = Math.min(H * 0.44, 215);
        var lg = ctx.createLinearGradient(-18, 0, 18, 0);
        lg.addColorStop(0, 'rgba(125,211,252,.6)');
        lg.addColorStop(0.5, 'rgba(224,242,254,.35)');
        lg.addColorStop(1, 'rgba(125,211,252,.6)');
        ctx.fillStyle = lg;
        ctx.strokeStyle = 'rgba(2,132,199,.9)';
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(0, -lh / 2);
        ctx.quadraticCurveTo(24, 0, 0, lh / 2);
        ctx.quadraticCurveTo(-24, 0, 0, -lh / 2);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = 'rgba(2,132,199,.95)';
        ctx.font = '900 11px ' + FONT;
        ctx.textAlign = 'center';
        ctx.fillText('렌즈', 0, -lh / 2 - 11);
        ctx.restore();

        // 스크린 라벨
        ctx.save();
        ctx.fillStyle = 'rgba(100,116,139,.95)';
        ctx.font = '800 11px ' + FONT;
        ctx.textAlign = 'center';
        ctx.fillText('스크린', lens.sx, ax + scrH / 2 + 17);
        ctx.restore();

        // 초점 완성 표시
        if (lens.sharp >= 95) {
            ctx.save();
            ctx.fillStyle = 'rgba(5,150,105,.95)';
            ctx.font = '900 12px ' + FONT;
            ctx.textAlign = 'center';
            ctx.fillText('초점 완성!', lens.sx, ax - scrH / 2 - 14);
            ctx.restore();
        }
    }

    /* ---------- 손 커서 ---------- */
    function drawCursor() {
        if (!cur.live) return;
        if (mode === 'pour' && beaker.held) return;
        ctx.save();
        ctx.translate(cur.x, cur.y);
        ctx.strokeStyle = camOn ? 'rgba(16,185,129,.95)' : 'rgba(10,132,255,.8)';
        ctx.fillStyle = camOn ? 'rgba(16,185,129,.16)' : 'rgba(10,132,255,.12)';
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        ctx.arc(0, 0, 17, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = camOn ? 'rgba(16,185,129,.95)' : 'rgba(10,132,255,.95)';
        ctx.beginPath();
        ctx.arc(0, 0, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    /* ---------- 그리기 ---------- */
    function draw() {
        ctx.clearRect(0, 0, W, H);
        var bg = ctx.createLinearGradient(0, 0, 0, H);
        if (document.body.classList.contains('dark')) {
            bg.addColorStop(0, '#111827');
            bg.addColorStop(1, '#0b1018');
        } else {
            bg.addColorStop(0, '#f7fafc');
            bg.addColorStop(1, '#e8eef6');
        }
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        if (mode === 'pour') {
            drawTable();
            drawFlask();
            drawReadout();
            drawBeaker();
            drawDrops();
            // 안내 텍스트
            ctx.fillStyle = 'rgba(100,116,139,.9)';
            ctx.font = '700 11.5px ' + FONT;
            ctx.textAlign = 'left';
            ctx.fillText('0.10 M HCl 50 mL', 16, 24);
            ctx.textAlign = 'right';
            ctx.fillText('0.10 M NaOH', W - 16, 24);
            ctx.textAlign = 'left';
        } else {
            drawLensScene();
        }
        drawCursor();
    }

    /* ---------- 루프 ---------- */
    var last = 0;
    function loop(ts) {
        var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016;
        last = ts;
        cur.x += (cur.tx - cur.x) * 0.35;
        cur.y += (cur.ty - cur.y) * 0.35;

        if (mode === 'pour') stepPour(dt);
        else {
            if (cur.live) {
                lens.x = Math.max(lens.ox + 30, Math.min(lens.sx - 40, cur.x));
            }
            lensState();
        }
        draw();
        requestAnimationFrame(loop);
    }

    /* ---------- 웹캠 움직임 추적 ---------- */
    var vid = $('#cam'), camCv = $('#camMask'), camCtx = camCv.getContext('2d');
    var proc = document.createElement('canvas');
    proc.width = 96; proc.height = 72;
    var pctx = proc.getContext('2d', { willReadFrequently: true });
    var prevData = null;
    var motionTimer = null;

    function setStatus(txt, cls) {
        var el = $('#camStatus');
        el.textContent = txt;
        el.className = 'status' + (cls ? ' ' + cls : '');
    }

    function camFail(msg) {
        camOn = false;
        $('#btnCam').classList.remove('on');
        $('#btnCam').textContent = '🎥 웹캠 손 추적 켜기';
        $('#camLabel').textContent = '웹캠 OFF';
        $('#camEmpty').style.display = 'flex';
        setStatus(msg + ' · 터치·마우스로 조작', 'err');
    }

    function startCam() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            camFail('이 브라우저는 웹캠을 지원하지 않아요');
            return;
        }
        $('#camEmpty').style.display = 'none';
        $('#camLabel').textContent = '연결 중…';
        setStatus('웹캠 권한을 허용해 주세요');
        navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240, facingMode: 'user' }, audio: false })
            .then(function (stream) {
                camStream = stream;
                vid.srcObject = stream;
                return vid.play().catch(function () { });
            })
            .then(function () {
                camOn = true; camReady = true; prevData = null;
                $('#btnCam').classList.add('on');
                $('#btnCam').textContent = '🎥 웹캠 손 추적 끄기';
                $('#camLabel').textContent = 'LIVE · 움직임 추적';
                setStatus('손을 움직여 커서를 옮기고, 비커 위에 잠시 멈추면 집혀요', 'live');
                if (motionTimer) clearInterval(motionTimer);
                motionTimer = setInterval(trackMotion, 66);
            })
            .catch(function (e) {
                camFail('웹캠을 켤 수 없어요(권한 거부 또는 보안 연결 필요)');
            });
    }

    function stopCam() {
        camOn = false; camReady = false; prevData = null;
        if (motionTimer) { clearInterval(motionTimer); motionTimer = null; }
        if (camStream) {
            camStream.getTracks().forEach(function (t) { t.stop(); });
            camStream = null;
        }
        vid.srcObject = null;
        $('#btnCam').classList.remove('on');
        $('#btnCam').textContent = '🎥 웹캠 손 추적 켜기';
        $('#camLabel').textContent = '웹캠 OFF';
        $('#camEmpty').style.display = 'flex';
        camCtx.clearRect(0, 0, camCv.width, camCv.height);
        setStatus('터치·마우스로 조작 중 · 비커를 잡아 보세요');
    }

    function trackMotion() {
        if (!camOn || !vid.videoWidth) return;
        pctx.save();
        pctx.scale(-1, 1);                   // 거울상
        pctx.drawImage(vid, -96, 0, 96, 72);
        pctx.restore();
        var img = pctx.getImageData(0, 0, 96, 72);
        var d = img.data;

        if (camCv.width !== 96) { camCv.width = 96; camCv.height = 72; }

        var cg = camCtx.createImageData(96, 72);
        var out = cg.data;
        var sx = 0, sy = 0, n = 0, minx = 96, maxx = 0, miny = 72, maxy = 0, sumE = 0;

        if (prevData) {
            for (var i = 0; i < d.length; i += 4) {
                var diff = Math.abs(d[i] - prevData[i]) + Math.abs(d[i + 1] - prevData[i + 1]) + Math.abs(d[i + 2] - prevData[i + 2]);
                var px = (i / 4) % 96, py = Math.floor((i / 4) / 96);
                var lv = 26 + 0.30 * (d[i] + d[i + 1] + d[i + 2]) / 3;   // 어두운 곳은 덜 민감
                var hit = diff > lv;
                out[i] = hit ? 16 : Math.round(d[i] * 0.35 + 18);
                out[i + 1] = hit ? 185 : Math.round(d[i + 1] * 0.35 + 18);
                out[i + 2] = hit ? 129 : Math.round(d[i + 2] * 0.35 + 18);
                out[i + 3] = 255;
                if (hit) {
                    sx += px; sy += py; n++; sumE += diff;
                    if (px < minx) minx = px;
                    if (px > maxx) maxx = px;
                    if (py < miny) miny = py;
                    if (py > maxy) maxy = py;
                }
            }
        } else {
            for (var k = 0; k < d.length; k += 4) {
                out[k] = Math.round(d[k] * 0.35 + 18);
                out[k + 1] = Math.round(d[k + 1] * 0.35 + 18);
                out[k + 2] = Math.round(d[k + 2] * 0.35 + 18);
                out[k + 3] = 255;
            }
        }
        prevData = new Uint8ClampedArray(d);
        camCtx.putImageData(cg, 0, 0);

        // 움직임 영역 표시
        if (n > 46) {
            camCtx.strokeStyle = 'rgba(16,185,129,.95)';
            camCtx.lineWidth = 1.6;
            camCtx.strokeRect(minx - 1, miny - 1, maxx - minx + 2, maxy - miny + 2);
            var cx = sx / n / 96, cy = sy / n / 72;
            if (cur.live) {
                cur.tx = cur.tx * 0.55 + (cx * W) * 0.45;
                cur.ty = cur.ty * 0.55 + (cy * H) * 0.45;
            } else {
                cur.tx = cx * W; cur.ty = cy * H; cur.x = cur.tx; cur.y = cur.ty;
            }
            cur.live = true;
        }
    }

    /* ---------- 조작 이벤트 ---------- */
    function pos(e) {
        var r = cv.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top };
    }

    cv.addEventListener('pointermove', function (e) {
        var p = pos(e);
        if (camOn && cur.live) return;
        cur.tx = p.x; cur.ty = p.y;
        if (!cur.live) { cur.x = p.x; cur.y = p.y; cur.live = true; }
    }, { passive: true });

    cv.addEventListener('pointerdown', function (e) {
        var p = pos(e);
        cur.tx = p.x; cur.ty = p.y;
        if (!camOn || !cur.live) { cur.x = p.x; cur.y = p.y; }
        cur.live = true;
        if (mode === 'pour') {
            var d = Math.hypot(p.x - beaker.x, p.y - beaker.y);
            if (!beaker.held && d < beaker.w * 0.95) grabBeaker();
            else if (beaker.held) { /* 이미 잡음 */ }
        }
        try { cv.setPointerCapture(e.pointerId); } catch (err) { }
    });

    cv.addEventListener('pointerup', function () { if (mode === 'pour') releaseBeaker(); });
    cv.addEventListener('pointercancel', function () { if (mode === 'pour') releaseBeaker(); });
    cv.addEventListener('pointerleave', function () { });

    function grabBeaker() {
        beaker.held = true;
        beaker.offx = beaker.x - cur.x;
        beaker.offy = beaker.y - cur.y;
        beaker.grabY = cur.y;
        beaker.hover = 0;
        setHint('잡았어요 — 위로 들면 기울어져요. 플라스크 위에서 부어 보세요');
    }

    function releaseBeaker() {
        beaker.held = false;
        beaker.tilt = 0;
        if (beaker.y < tableY - beaker.h) {
            beaker.x = beaker.homeX;
            beaker.y = beaker.homeY;
        }
        setHint('비커를 누른 채 위로 들면 기울어져 용액이 떨어져요');
    }

    // 웹캠 모드: 비커 위에 손을 잠시 두면 집기
    var dwellTick = setInterval(function () {
        if (!camOn || mode !== 'pour' || beaker.held || !cur.live) return;
        var d = Math.hypot(cur.x - beaker.x, cur.y - beaker.y);
        if (d < beaker.w * 0.95) {
            beaker.hover += 0.09;
            if (beaker.hover >= 0.28) grabBeaker();
        } else {
            beaker.hover = Math.max(0, beaker.hover - 0.09);
        }
    }, 90);

    function setHint(t) { $('#stageHint').textContent = t; }

    /* ---------- 패널 ---------- */
    function syncPanel() {
        if (mode === 'pour') {
            $('#phVal').textContent = pour.pH.toFixed(2);
            $('#vVal').textContent = pour.vBase.toFixed(0) + ' mL';
            var eq = $('#eqVal');
            if (pour.passed) { eq.textContent = '통과 ✔'; eq.style.color = '#059669'; }
            else { eq.textContent = '아직'; eq.style.color = ''; }
            $('#swatch').style.background = palette(pour.pH);
        } else {
            lensState();
            $('#doVal').textContent = lens.doCm.toFixed(1) + ' cm';
            $('#diVal').textContent = isFinite(lens.di) ? lens.di.toFixed(1) + ' cm' : '상 없음';
            $('#magVal').textContent = isFinite(lens.mag) ? (Math.abs(lens.mag)).toFixed(2) + '배 (도립)' : '—';
            $('#sharpVal').textContent = lens.sharp + '%';
            $('#sharpVal').style.color = lens.sharp > 92 ? '#059669' : '';
        }
    }
    setInterval(syncPanel, 120);

    /* ---------- 모드 · 지시약 · 초점거리 ---------- */
    $('#modeSeg').addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        mode = b.dataset.mode;
        Array.prototype.forEach.call(this.children, function (x) { x.classList.toggle('on', x === b); });
        $('#panelPour').hidden = mode !== 'pour';
        $('#panelLens').hidden = mode !== 'lens';
        if (mode === 'pour') {
            releaseBeaker();
            setHint('비커를 누른 채 위로 들면 기울어져 용액이 떨어져요');
            if (!camOn) setStatus('터치·마우스로 조작 중 · 비커를 잡아 보세요');
        } else {
            setHint('손을 좌우로 움직여 렌즈를 옮기고, 상이 또렷한 자리를 찾아보세요');
            if (!camOn) setStatus('터치·마우스로 조작 중 · 손을 움직여 렌즈를 옮겨요');
            lens.x = Math.max(lens.ox + 30, Math.min(lens.sx - 40, cur.live ? cur.x : (lens.ox + lens.sx) / 2));
        }
        draw();
    });

    $('#indSeg').addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        pour.indicator = b.dataset.ind;
        Array.prototype.forEach.call(this.children, function (x) { x.classList.toggle('on', x === b); });
        syncPanel();
    });

    $('#fSeg').addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        lens.f = parseFloat(b.dataset.f);
        Array.prototype.forEach.call(this.children, function (x) { x.classList.toggle('on', x === b); });
        syncPanel();
    });

    $('#btnCam').addEventListener('click', function () { if (camOn) stopCam(); else startCam(); });
    $('#btnDrop').addEventListener('click', function () { releaseBeaker(); });
    $('#btnReset').addEventListener('click', function () {
        pour.vBase = 0; pour.pH = phOf(0); pour.drops = []; pour.acc = 0; pour.passed = false; pour.spill = 0;
        beaker.held = false; beaker.tilt = 0; beaker.x = beaker.homeX; beaker.y = beaker.homeY; beaker.hover = 0;
        lens.x = (lens.ox + lens.sx) / 2;
        syncPanel();
        toast('처음 상태로 돌아왔어요');
    });

    /* ---------- 테마 · 전체화면 ---------- */
    function applyTheme(dark) {
        document.body.classList.toggle('dark', dark);
        $('#bTheme').textContent = dark ? '☀️ 주간 모드' : '🌙 야간 모드';
        try { localStorage.setItem('svl_gesture_theme', dark ? '1' : '0'); } catch (e) { }
    }
    $('#bTheme').addEventListener('click', function () { applyTheme(!document.body.classList.contains('dark')); });
    try { if (localStorage.getItem('svl_gesture_theme') === '1') applyTheme(true); } catch (e) { }

    (function () {
        var btn = document.getElementById('btn-fullscreen');
        var iconEl = document.getElementById('fsIcon');
        var textEl = document.getElementById('fsText');
        var root = document.documentElement;
        var PSEUDO = 'pseudo-fullscreen';
        function isRealFs() {
            return !!(document.fullscreenElement || document.webkitFullscreenElement ||
                document.mozFullScreenElement || document.msFullscreenElement);
        }
        function isPseudo() { return document.body.classList.contains(PSEUDO); }
        function syncUI() {
            var on = isRealFs() || isPseudo();
            iconEl.textContent = on ? '🗗' : '⛶';
            textEl.textContent = on ? '창모드' : '전체화면';
            btn.setAttribute('aria-pressed', on ? 'true' : 'false');
            btn.setAttribute('aria-label', on ? '창모드로 전환' : '전체화면으로 전환');
        }
        function toast2(msg) {
            var el = document.getElementById('fs-toast');
            if (!el) {
                el = document.createElement('div');
                el.className = 'fs-toast'; el.id = 'fs-toast';
                document.body.appendChild(el);
            }
            el.textContent = msg; void el.offsetWidth; el.classList.add('show');
            clearTimeout(toast2._t);
            toast2._t = setTimeout(function () { el.classList.remove('show'); }, 2600);
        }
        window.__svlToast = toast2;
        function enterPseudo(hint) {
            if (isRealFs()) return;
            document.body.classList.add(PSEUDO);
            syncUI();
            if (hint) toast2('이 브라우저는 브라우저 전체화면 대신 상단 바를 숨긴 몰입 모드로 표시합니다');
        }
        function requestReal() {
            var req = root.requestFullscreen || root.webkitRequestFullscreen || root.mozRequestFullScreen || root.msRequestFullscreen;
            if (!req) return false;
            try {
                var p = req.call(root);
                if (p && typeof p.then === 'function') p.then(syncUI, function () { enterPseudo(true); });
                else setTimeout(function () { if (!isRealFs() && !isPseudo()) enterPseudo(true); else syncUI(); }, 500);
                return true;
            } catch (err) { return false; }
        }
        btn.addEventListener('click', function () {
            if (isRealFs()) {
                var exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
                try { if (exit) { var q = exit.call(document); if (q && q.catch) q.catch(function () { }); } } catch (err) { }
                syncUI(); return;
            }
            if (isPseudo()) { document.body.classList.remove(PSEUDO); syncUI(); return; }
            if (!requestReal()) enterPseudo(true);
            syncUI();
        });
        ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
            document.addEventListener(ev, function () {
                if (isRealFs()) document.body.classList.remove(PSEUDO);
                syncUI();
            });
        });
        document.addEventListener('keydown', function (e) {
            if ((e.key === 'Escape' || e.key === 'Esc') && isPseudo() && !isRealFs()) {
                document.body.classList.remove(PSEUDO); syncUI();
            }
        });
        window.addEventListener('resize', syncUI);
        syncUI();
    })();

    function toast(msg) { window.__svlToast && window.__svlToast(msg); }

    /* ---------- 시작 ---------- */
    pour.pH = phOf(0);
    resize();
    window.addEventListener('resize', resize);
    if (window.ResizeObserver) { new ResizeObserver(resize).observe(cv.parentElement); }
    if (document.fonts && document.fonts.ready) { document.fonts.ready.then(function () { layout(); }).catch(function () { }); }
    syncPanel();
    requestAnimationFrame(loop);
})();
</script>
<script src="../common/feedback.js" defer></script>
</body>
