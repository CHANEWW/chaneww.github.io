<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>QR 학습지 자동 생성기 | Science Virtual LAB</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">

<style>
@font-face{
    font-family:'SeoulNamsan';
    src:local('SeoulNamsan M'),local('SeoulNamsanM'),local('서울남산체 M'),
        url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff') format('woff');
    font-weight:400;font-style:normal;font-display:swap;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
    --bg:#eef2f7; --ink:#14181f; --muted:#64748b; --line:rgba(15,23,42,.10);
    --card:rgba(255,255,255,.9); --card-solid:#fff; --accent:#0a84ff; --accent-soft:rgba(10,132,255,.12);
    --ok:#10b981; --shadow:0 10px 30px rgba(15,23,42,.10);
}
body.dark{
    --bg:#0e121c; --ink:#eef3fb; --muted:#94a3b8; --line:rgba(255,255,255,.13);
    --card:rgba(26,32,45,.9); --card-solid:#1a2130; --accent:#4aa3ff; --accent-soft:rgba(74,163,255,.18);
    --shadow:0 10px 30px rgba(0,0,0,.5);
}
html,body{margin:0;padding:0;width:100%;height:100%}
body{
    font-family:'SeoulNamsan',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:var(--ink); background:var(--bg); overflow:hidden; transition:background .3s ease,color .3s ease;
}
.top-nav{
    position:fixed; top:0; left:0; right:0; height:60px; display:flex; align-items:center; gap:10px;
    padding:0 250px 0 16px; z-index:100; background:var(--card);
    backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-bottom:1px solid var(--line);
}
.back-btn{
    display:inline-flex; align-items:center; gap:6px; padding:7px 14px; font-family:inherit; font-size:13px;
    font-weight:800; color:inherit; text-decoration:none; border:1px solid var(--line); border-radius:999px;
    background:var(--card-solid); transition:transform .16s ease; white-space:nowrap;
}
.back-btn:hover{transform:translateY(-1px)}
.page-title{display:flex; align-items:center; gap:8px; font-size:14.5px; font-weight:800; letter-spacing:-.2px; min-width:0}
.page-title .t{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pill-badge{padding:3px 9px; border-radius:999px; font-size:10.5px; font-weight:800; background:var(--accent-soft); color:var(--accent); white-space:nowrap; flex:0 0 auto}
.top-right-bar{
    position:fixed !important; top:15px !important; right:20px !important;
    display:flex !important; flex-direction:column; align-items:flex-end; gap:8px; z-index:130 !important; pointer-events:none;
}
.top-right-bar > .tr-util{display:flex !important; flex-direction:row; align-items:center; gap:8px; pointer-events:auto}
#bTheme{
    display:inline-flex; align-items:center; justify-content:center; gap:6px; height:40px; padding:0 15px;
    border-radius:20px; cursor:pointer; font-family:inherit; font-size:12.5px; font-weight:800; color:inherit;
    border:1px solid var(--line); background:var(--card); box-shadow:var(--shadow);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); white-space:nowrap; transition:transform .16s ease;
}
#bTheme:hover{transform:translateY(-1px)}

.app{position:fixed; top:60px; left:0; right:0; bottom:0; display:flex; overflow:hidden}
.editor{
    width:400px; flex:0 0 400px; overflow-y:auto; padding:13px 14px 24px;
    border-right:1px solid var(--line); background:var(--card);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
}
.ed-sec{margin-bottom:13px}
.ed-title{font-size:11.5px; font-weight:900; color:var(--muted); letter-spacing:.1px; margin-bottom:7px; display:flex; align-items:center; gap:6px}
.ed-title .n{display:inline-flex; align-items:center; justify-content:center; width:17px; height:17px; border-radius:50%; background:var(--accent); color:#fff; font-size:10px}
.fld{display:flex; flex-direction:column; gap:5px; margin-bottom:8px}
.fld label{font-size:11px; font-weight:800; color:var(--muted)}
.fld input[type="text"],.fld textarea{
    width:100%; padding:9px 11px; border-radius:11px; border:1.5px solid var(--line); background:var(--card-solid);
    color:inherit; font-family:inherit; font-size:13px; font-weight:700; outline:none;
}
.fld input[type="text"]:focus,.fld textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.fld textarea{resize:vertical; min-height:48px; line-height:1.5}
.chk{display:flex; align-items:center; gap:7px; font-size:12px; font-weight:800; cursor:pointer; padding:4px 0}
.chk input{width:16px; height:16px; accent-color:var(--accent)}
.search{
    display:flex; gap:6px; margin-bottom:8px;
}
.search input{
    flex:1 1 auto; padding:8px 11px; border-radius:10px; border:1.5px solid var(--line); background:var(--card-solid);
    color:inherit; font-family:inherit; font-size:12px; font-weight:700; outline:none;
}
.search input:focus{border-color:var(--accent)}
.lab-groups{max-height:260px; overflow-y:auto; border:1px solid var(--line); border-radius:14px; padding:8px 10px; background:var(--card-solid)}
.lab-group{margin-bottom:7px}
.lab-group:last-child{margin-bottom:0}
.lab-gname{font-size:10.5px; font-weight:900; color:var(--accent); padding:2px 0 4px}
.lab-row{display:flex; align-items:center; gap:7px; padding:4px 2px; font-size:12px; font-weight:700; cursor:pointer; border-radius:8px}
.lab-row:hover{background:var(--accent-soft)}
.lab-row input{width:15px; height:15px; accent-color:var(--accent); flex:0 0 auto}
.lab-row span{flex:1 1 auto; line-height:1.3; word-break:keep-all}
.lab-row.on span{font-weight:900}
.lab-row.hide{display:none}
.cnt-chip{
    display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:999px; font-size:10.5px;
    font-weight:900; background:var(--accent-soft); color:var(--accent); margin-left:auto;
}
.cnt-chip.full{background:rgba(239,68,68,.14); color:#dc2626}
.custom-add{display:flex; gap:6px; margin-top:8px}
.custom-add input{flex:1 1 auto; padding:8px 10px; border-radius:10px; border:1.5px solid var(--line); background:var(--card-solid); color:inherit; font-family:inherit; font-size:12px; font-weight:700; outline:none}
.btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:9px 14px; border-radius:11px;
    border:none; cursor:pointer; font-family:inherit; font-size:12px; font-weight:900; color:#fff;
    background:var(--accent); box-shadow:0 8px 18px rgba(10,132,255,.24); transition:transform .16s ease; white-space:nowrap;
}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line); box-shadow:none}
.btn.sm{padding:7px 11px; font-size:11.5px}
.sel-list{display:flex; flex-direction:column; gap:8px}
.sel-item{
    border:1px solid var(--line); border-radius:13px; padding:9px 10px; background:var(--card-solid);
}
.sel-top{display:flex; align-items:center; gap:7px; margin-bottom:5px}
.sel-num{
    flex:0 0 auto; width:19px; height:19px; border-radius:50%; background:var(--accent); color:#fff;
    font-size:10.5px; font-weight:900; display:flex; align-items:center; justify-content:center;
}
.sel-name{flex:1 1 auto; font-size:12px; font-weight:900; line-height:1.3; word-break:keep-all}
.sel-del{
    flex:0 0 auto; width:24px; height:24px; border-radius:8px; border:1px solid var(--line); background:transparent;
    color:var(--muted); font-size:12px; font-weight:900; cursor:pointer; line-height:1;
}
.sel-del:hover{border-color:#ef4444; color:#ef4444}
.sel-item textarea{
    width:100%; padding:7px 9px; border-radius:9px; border:1px solid var(--line); background:var(--card);
    color:inherit; font-family:inherit; font-size:11.5px; font-weight:700; line-height:1.45; outline:none; resize:vertical; min-height:40px;
}
.sel-item textarea:focus{border-color:var(--accent)}
.empty-note{font-size:11.5px; font-weight:700; color:var(--muted); padding:10px 2px; line-height:1.5}

/* ---------- 미리보기 ---------- */
.preview{
    flex:1 1 auto; min-width:0; overflow:auto; padding:18px 16px 60px;
    background:linear-gradient(180deg, rgba(120,140,170,.12), rgba(120,140,170,.03));
}
.prev-head{
    display:flex; align-items:center; gap:9px; margin:0 auto 12px; max-width:794px; flex-wrap:wrap;
}
.prev-head .tt{font-size:12.5px; font-weight:900}
.prev-head .hint{font-size:11px; font-weight:700; color:var(--muted)}
.spacer{margin-left:auto}
.mseg{display:none}
.sheet-wrap{width:100%; display:flex; justify-content:center}
.sheet{
    width:794px; min-height:1123px; flex:0 0 auto; background:#fff; color:#111;
    transform-origin: top center; box-shadow:0 18px 50px rgba(15,23,42,.22);
    padding:40px 44px 32px; position:relative;
    font-family:'SeoulNamsan',-apple-system,"Malgun Gothic",sans-serif;
}
.sh-head{border-bottom:2.5px solid #0f172a; padding-bottom:12px; margin-bottom:16px}
.sh-kicker{font-size:10.5px; font-weight:900; color:#0a84ff; letter-spacing:.6px}
.sh-title{font-size:25px; font-weight:900; letter-spacing:-.8px; margin:5px 0 4px; line-height:1.2}
.sh-sub{font-size:12px; font-weight:700; color:#475569; line-height:1.5}
.sh-student{
    display:flex; gap:14px; flex-wrap:wrap; margin-top:11px; font-size:12px; font-weight:800; color:#111;
}
.sh-student span{border-bottom:1px solid #94a3b8; padding:0 4px 2px; min-width:66px}
.sh-items{display:flex; flex-direction:column; gap:11px}
.sh-item{display:flex; gap:12px; padding:10px 11px; border:1.5px solid #cbd5e1; border-radius:12px; page-break-inside:avoid; break-inside:avoid}
.sh-qr{flex:0 0 auto; width:104px; display:flex; flex-direction:column; align-items:center; gap:3px}
.sh-qr svg{display:block; width:100%; height:auto}
.sh-qr .cap{font-size:8.5px; font-weight:900; color:#334155; letter-spacing:.2px}
.sh-body{flex:1 1 auto; min-width:0}
.sh-name{display:flex; align-items:baseline; gap:6px; font-size:14px; font-weight:900; letter-spacing:-.3px; line-height:1.25}
.sh-name i{
    font-style:normal; flex:0 0 auto; width:18px; height:18px; border-radius:50%; background:#0f172a; color:#fff;
    font-size:10.5px; display:inline-flex; align-items:center; justify-content:center; transform:translateY(-1px);
}
.sh-ques{font-size:11px; font-weight:700; color:#334155; line-height:1.45; margin:4px 0 6px; word-break:keep-all}
.sh-tbl{width:100%; border-collapse:collapse; font-size:10.5px}
.sh-tbl th,.sh-tbl td{border:1px solid #94a3b8; padding:4px 5px; text-align:center; height:19px}
.sh-tbl th{background:#eef2f7; font-weight:900; color:#0f172a; font-size:10px}
.sh-tbl td.lbl{background:#f8fafc; font-weight:900; width:42px; color:#334155}
.sh-concl{margin-top:5px; font-size:10.5px; font-weight:800; color:#334155}
.sh-concl u{text-decoration:none; display:inline-block; border-bottom:1px solid #94a3b8; min-width:100%; height:15px}
.sh-foot{
    position:absolute; left:44px; right:44px; bottom:18px; display:flex; justify-content:space-between;
    font-size:9px; font-weight:800; color:#64748b; border-top:1px solid #cbd5e1; padding-top:6px;
}
.sh-empty{padding:26px; text-align:center; font-size:12.5px; font-weight:800; color:#94a3b8; border:1.5px dashed #cbd5e1; border-radius:12px}

/* 밀도(개수) 조절 */
.sheet.dense .sh-item{padding:8px 9px; gap:9px}
.sheet.dense .sh-qr{width:84px}
.sheet.dense .sh-name{font-size:12.5px}
.sheet.dense .sh-ques{font-size:10px; margin:3px 0 4px}
.sheet.dense .sh-tbl th,.sheet.dense .sh-tbl td{padding:3px 4px; height:17px; font-size:9.5px}
.sheet.dense .sh-title{font-size:22px}
.sheet.dense .sh-items{gap:8px}

/* ---------- 인쇄 ---------- */
@page{ size:A4 portrait; margin:0; }
@media print{
    html,body{width:auto; height:auto; overflow:visible; background:#fff !important}
    .top-nav,.top-right-bar,.editor,.prev-head,#btn-fullscreen,.svl-fb-btn,#feedback-btn,.fs-toast{display:none !important}
    .app{position:static !important; display:block !important; overflow:visible !important; padding:0 !important}
    .preview{overflow:visible !important; padding:0 !important; background:#fff !important}
    .sheet-wrap{display:block !important; width:auto !important; justify-content:flex-start !important}
    .sheet{transform:none !important; box-shadow:none !important; margin:0 !important; width:210mm !important; min-height:297mm !important}
}

/* ---------- 전체화면 ---------- */
#btn-fullscreen{
    position:fixed; right:20px; bottom:calc(18px + env(safe-area-inset-bottom,0px)); z-index:95;
    display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:9px 16px; border-radius:999px;
    border:1px solid var(--line); background:var(--card); box-shadow:0 8px 24px rgba(15,23,42,.16);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    color:inherit; font-family:inherit; font-size:12.5px; font-weight:800; white-space:nowrap; cursor:pointer;
    transition:transform .18s ease;
}
#btn-fullscreen:hover{transform:translateY(-1px)}
body.pseudo-fullscreen .top-nav{transform:translateY(-100%); opacity:0; pointer-events:none}
body.pseudo-fullscreen .app{top:0}
body.pseudo-fullscreen #feedback-btn,body.pseudo-fullscreen .svl-fb-btn{display:none !important}
.fs-toast{
    position:fixed; left:50%; bottom:calc(74px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,8px);
    z-index:2050; max-width:86vw; padding:10px 16px; border-radius:14px; background:rgba(28,28,30,.92);
    color:#fff; font-size:12.5px; font-weight:700; line-height:1.45; text-align:center;
    box-shadow:0 10px 26px rgba(0,0,0,.3); opacity:0; pointer-events:none; transition:opacity .26s ease, transform .26s ease;
}
.fs-toast.show{opacity:1; transform:translate(-50%,0)}

/* ---------- 모바일 ---------- */
@media (max-width:900px){
    .top-nav{height:52px; padding:0 12px; gap:8px}
    .page-title{font-size:12.5px}
    .back-btn{padding:6px 11px; font-size:12px}
    .top-right-bar{top:calc(max(8px,env(safe-area-inset-top)) + 48px) !important; right:8px !important}
    #bTheme{height:34px; padding:0 11px; font-size:11.5px}
    .mseg{display:flex; position:fixed; top:96px; left:0; right:0; z-index:90; gap:6px; padding:0 10px 8px; background:var(--bg)}
    .mseg button{
        flex:1 1 0; padding:9px 8px; border-radius:12px; border:1px solid var(--line); background:var(--card);
        font-family:inherit; font-size:12px; font-weight:800; color:var(--ink); cursor:pointer;
    }
    .mseg button.on{background:var(--accent); color:#fff; border-color:var(--accent); box-shadow:0 6px 16px rgba(10,132,255,.26)}
    .app{top:150px; flex-direction:column; overflow-y:auto; padding-bottom:60px}
    .editor{width:100%; flex:0 0 auto; border-right:none; border-bottom:1px solid var(--line); overflow:visible; padding:11px 11px 14px}
    .preview{padding:12px 8px 40px}
    body.view-prev .editor{display:none}
    body.view-prev .preview{display:block}
    body.view-edit .preview{display:none}
    body.view-edit .editor{display:block}
    .prev-head{max-width:none}
    #btn-fullscreen{bottom:calc(10px + env(safe-area-inset-bottom,0px)); right:10px; padding:8px 13px; font-size:12px}
    .lab-groups{max-height:210px}
}
@media (max-height:500px) and (orientation:landscape){
    .top-nav{height:44px}
    .app{top:44px; flex-direction:row; overflow:hidden}
    .editor{width:320px; flex:0 0 320px; border-right:1px solid var(--line); overflow-y:auto}
    .top-right-bar{top:max(6px,env(safe-area-inset-top)) !important; right:88px !important}
}
</style>
</head>

    <a href="../../index.html" class="back-btn" onclick="var r=document.referrer;if(history.length>1&&r&&r.indexOf(location.origin+'/')===0&&/(\/|index(_3d)?\.html)(\?|#|$)/.test(r)){history.back();return false;}"><span>⬅</span> 메인</a>

</button>

<script>
/* ============================================================
   SVLQR — 외부 라이브러리 없이 동작하는 경량 QR 코드 생성기
   바이트(8bit) 모드 · 오류 정정 수준 M · 버전 1~10 (최대 약 210byte)
   ==SVLQR-START==
   ============================================================ */
(function (root) {
    'use strict';

    var EXP = new Array(512), LOG = new Array(256);
    (function () {
        var x = 1, i;
        for (i = 0; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11d; }
        for (i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
    })();
    function gmul(a, b) { return (a === 0 || b === 0) ? 0 : EXP[LOG[a] + LOG[b]]; }

    var BLOCKS = {
        1: [10, 1, 16, 0, 0], 2: [16, 1, 28, 0, 0], 3: [26, 1, 44, 0, 0],
        4: [18, 2, 32, 0, 0], 5: [24, 2, 43, 0, 0], 6: [16, 4, 27, 0, 0],
        7: [18, 4, 31, 0, 0], 8: [22, 2, 38, 2, 39], 9: [22, 3, 36, 2, 37],
        10: [26, 4, 43, 1, 44]
    };

        { d: '교실 도구', t: '실험 탐구 보고서 생성기', p: 'labs/class/report.html', q: '탐구 결과를 보고서로 정리해 보자.' },
        { d: '교실 도구', t: '모둠별 멀티 스톱워치', p: 'labs/test/multi_stopwatch.html', q: '모둠별로 측정한 시간을 비교해 보자.' }
    ];
    var MAX = 6;
    var sel = [];   /* [{t, url, q}] */

    function urlOf(p) { return BASE.replace(/\/$/, '') + '/' + p; }

    /* ---------- 실험 목록 렌더 ---------- */
    function renderLabs() {
        var groups = {};
        LABS.forEach(function (l, i) { (groups[l.d] = groups[l.d] || []).push({ l: l, i: i }); });
        var html = '';
        Object.keys(groups).forEach(function (d) {
            html += '<div class="lab-group"><div class="lab-gname">' + d + '</div>';
            groups[d].forEach(function (o) {
                var on = sel.some(function (s) { return s.url === urlOf(o.l.p); });
                html += '<label class="lab-row' + (on ? ' on' : '') + '" data-name="' + o.l.t + '">' +
                    '<input type="checkbox" data-p="' + o.l.p + '"' + (on ? ' checked' : '') + '>' +
                    '<span>' + o.l.t + '</span></label>';
            });
            html += '</div>';
        });
        $('#labGroups').innerHTML = html;
        filterLabs($('#inSearch').value);
    }

    function filterLabs(q) {
        q = (q || '').trim().toLowerCase();
        Array.prototype.forEach.call(document.querySelectorAll('.lab-row'), function (row) {
            var hit = !q || row.getAttribute('data-name').toLowerCase().indexOf(q) >= 0;
            row.classList.toggle('hide', !hit);
        });
    }

    /* ---------- 선택 목록 ---------- */
    function renderSel() {
        var html = '';
        if (!sel.length) {
            html = '<div class="empty-note">아직 고른 실험이 없습니다. 위 목록에서 1~6개를 선택하면 오른쪽 학습지에 QR 코드가 생깁니다.</div>';
        }
        sel.forEach(function (s, i) {
            html += '<div class="sel-item" data-i="' + i + '">' +
                '<div class="sel-top">' +
                '<span class="sel-num">' + (i + 1) + '</span>' +
                '<span class="sel-name">' + esc(s.t) + '</span>' +
                '<button class="sel-del" type="button" aria-label="빼기">✕</button>' +
                '</div>' +
                '<textarea data-q placeholder="탐구 질문">' + esc(s.q) + '</textarea>' +
                '</div>';
        });
        $('#selList').innerHTML = html;
        var chip = $('#cntChip');
        chip.textContent = sel.length + ' / ' + MAX;
        chip.classList.toggle('full', sel.length >= MAX);
    }

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
            return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c];
        });
    }

    /* 목록을 다시 그리지 않고 체크 상태만 맞춘다(스크롤·검색어 유지) */
    function syncLabsUI() {
        Array.prototype.forEach.call(document.querySelectorAll('.lab-row'), function (row) {
            var cb = row.querySelector('input[type=checkbox]');
            if (!cb) return;
            var url = urlOf(cb.getAttribute('data-p'));
            var on = sel.some(function (s) { return s.url === url; });
            cb.checked = on;
            row.classList.toggle('on', on);
        });
    }
    function addLab(p) {
        var l = null;
        LABS.forEach(function (x) { if (x.p === p) l = x; });
        if (!l) return;
        var url = urlOf(p);
        if (sel.some(function (s) { return s.url === url; })) return;
        if (sel.length >= MAX) { toast('실험은 최대 ' + MAX + '개까지 넣을 수 있습니다'); syncLabsUI(); return; }
        sel.push({ t: l.t, url: url, q: l.q });
        renderSel();
        syncLabsUI();
        render();
    }
    function removeLab(i) {
        sel.splice(i, 1);
        renderSel();
        syncLabsUI();
        render();
    }

    function toast(msg) {
        var el = document.getElementById('fs-toast');
        if (!el) {
            el = document.createElement('div');
            el.className = 'fs-toast'; el.id = 'fs-toast';
            document.body.appendChild(el);
        }
        el.textContent = msg;
        void el.offsetWidth;
        el.classList.add('show');
        clearTimeout(toast._t);
        toast._t = setTimeout(function () { el.classList.remove('show'); }, 2400);
    }

    /* ---------- 학습지 그리기 ---------- */
    function render() {
        var title = $('#inTitle').value || '과학 탐구 활동지';
        var sub = $('#inSub').value || '';
        var showStudent = $('#optStudent').checked;
        var showTable = $('#optTable').checked;
        var showQ = $('#optQuestion').checked;
        var n = sel.length;
        var dense = n >= 4;

        var sheet = $('#sheet');
        sheet.className = 'sheet' + (dense ? ' dense' : '');

        var html = '';
        html += '<div class="sh-head">' +
            '<div class="sh-kicker">SCIENCE VIRTUAL LAB · chaneww.github.io</div>' +
            '<div class="sh-title">' + esc(title) + '</div>' +
            (sub ? '<div class="sh-sub">' + esc(sub) + '</div>' : '') +
            (showStudent ? '<div class="sh-student"><span>학년 ____</span><span>반 ____</span><span>번호 ____</span><span style="min-width:150px">이름 ____________</span></div>' : '') +
            '</div>';

        if (!n) {
            html += '<div class="sh-empty">왼쪽에서 실험을 1~6개 고르면 이곳에 QR 코드와 활동 칸이 만들어집니다.</div>';
        } else {
            html += '<div class="sh-items">';
            sel.forEach(function (s, i) {
                var qr = '';
                try { qr = SVLQR.toSVG(s.url, { px: 240, quiet: 2 }); } catch (e) { qr = ''; }
                html += '<div class="sh-item">' +
                    '<div class="sh-qr">' + qr + '<div class="cap">QR을 찍으면 열려요</div></div>' +
                    '<div class="sh-body">' +
                    '<div class="sh-name"><i>' + (i + 1) + '</i>' + esc(s.t) + '</div>' +
                    (showQ && s.q ? '<div class="sh-ques">' + esc(s.q) + '</div>' : '') +
                    (showTable ? tableHTML(dense) : '') +
                    '</div></div>';
            });
            html += '</div>';
        }

        html += '<div class="sh-foot"><span>Science Virtual LAB · chaneww.github.io</span><span>가상실험실에서 결과를 확인하고 기록해 보세요.</span></div>';
        sheet.innerHTML = html;
        fitSheet();
        $('#prevHint').textContent = '선택한 실험 ' + n + '개 · ' + (n >= 5 ? '1장(빽빽함)' : '1장');
    }

    function tableHTML(dense) {
        var cols = dense ? 2 : 3;
        var head = '<tr><th>측정</th>';
        for (var i = 1; i <= cols; i++) head += '<th>' + i + '회</th>';
        head += '</tr>';
        return '<table class="sh-tbl">' + head +
            '<tr><td class="lbl">측정값</td>' + new Array(cols + 1).join('<td></td>') + '</tr>' +
            '<tr><td class="lbl">평균</td><td colspan="' + cols + '"></td></tr>' +
            '</table>' +
            '<div class="sh-concl">알게 된 점 <u></u></div>';
    }

    /* ---------- 미리보기 배율 ---------- */
    function fitSheet() {
        var wrap = document.querySelector('.sheet-wrap');
        var sheet = $('#sheet');
        if (!wrap || !sheet) return;
        if (window.matchMedia('(max-width: 900px)').matches || wrap.clientWidth < 820) {
            var s = Math.min(1, (wrap.clientWidth - 6) / 794);
            sheet.style.transform = 'scale(' + s + ')';
            sheet.style.marginBottom = (-1123 * (1 - s)) + 'px';
        } else {
            sheet.style.transform = '';
            sheet.style.marginBottom = '';
        }
    }
    window.addEventListener('resize', fitSheet);

    /* ---------- 이벤트 ---------- */
    $('#labGroups').addEventListener('change', function (e) {
        var cb = e.target.closest('input[type=checkbox]');
        if (!cb) return;
        if (cb.checked) addLab(cb.getAttribute('data-p'));
        else {
            var p = cb.getAttribute('data-p');
            var url = urlOf(p);
            for (var i = 0; i < sel.length; i++) {
                if (sel[i].url === url) { removeLab(i); break; }
            }
        }
    });
    $('#inSearch').addEventListener('input', function () { filterLabs(this.value); });
    $('#selList').addEventListener('click', function (e) {
        var b = e.target.closest('.sel-del');
        if (!b) return;
        removeLab(+b.closest('.sel-item').getAttribute('data-i'));
    });
    $('#selList').addEventListener('input', function (e) {
        var ta = e.target.closest('textarea[data-q]');
        if (!ta) return;
        var i = +ta.closest('.sel-item').getAttribute('data-i');
        sel[i].q = ta.value;
        render();
    });
    $('#btnAddUrl').addEventListener('click', function () {
        var v = $('#inCustomUrl').value.trim();
        if (!v) return;
        if (!/^https?:\/\//i.test(v)) v = 'https://' + v.replace(/^\/+/, '');
        if (sel.length >= MAX) { toast('실험은 최대 ' + MAX + '개까지 넣을 수 있습니다'); return; }
        var name = '직접 추가한 링크';
        try {
            var u = new URL(v);
            name = u.hostname.replace(/^www\./, '') + (u.pathname !== '/' ? u.pathname.replace(/\.html?$/, '').split('/').pop() : '');
        } catch ( err) { }
        sel.push({ t: name, url: v, q: '이 링크에서 무엇을 알아볼까?' });
        $('#inCustomUrl').value = '';
        renderSel();
        render();
    });
    ['#inTitle', '#inSub'].forEach(function (s) {
        $(s).addEventListener('input', render);
    });
    ['#optStudent', '#optTable', '#optQuestion'].forEach(function (s) {
        $(s).addEventListener('change', render);
    });
    $('#btnPrint').addEventListener('click', function () { window.print(); });
    $('#mseg').addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        var v = b.getAttribute('data-v');
        document.body.classList.toggle('view-edit', v === 'edit');
        document.body.classList.toggle('view-prev', v === 'prev');
        Array.prototype.forEach.call($('#mseg').children, function (x) {
            x.classList.toggle('on', x === b);
        });
        $('.app').scrollTo({ top: 0, behavior: 'auto' });
        setTimeout(fitSheet, 80);
    });

    /* ---------- 테마 ---------- */
    function applyTheme(dark) {
        document.body.classList.toggle('dark', dark);
        $('#bTheme').textContent = dark ? '☀️ 주간 모드' : '🌙 야간 모드';
        try { localStorage.setItem('svl_ws_theme', dark ? '1' : '0'); } catch (e) { }
    }
    $('#bTheme').addEventListener('click', function () { applyTheme(!document.body.classList.contains('dark')); });
    try { if (localStorage.getItem('svl_ws_theme') === '1') applyTheme(true); } catch (e) { }

    /* ---------- 전체화면 ---------- */
    (function () {
        var btn = document.getElementById('btn-fullscreen');
        var iconEl = document.getElementById('fsIcon');
        var textEl = document.getElementById('fsText');
        var root = document.documentElement;
        var PSEUDO = 'pseudo-fullscreen';
        function isRealFs() {
            return !!(document.fullscreenElement || document.webkitFullscreenElement ||
                document.mozFullScreenElement || document.msFullscreenElement);
        }
        function isPseudo() { return document.body.classList.contains(PSEUDO); }
        function syncUI() {
            var on = isRealFs() || isPseudo();
            iconEl.textContent = on ? '🗗' : '⛶';
            textEl.textContent = on ? '창모드' : '전체화면';
            btn.setAttribute('aria-pressed', on ? 'true' : 'false');
            btn.setAttribute('aria-label', on ? '창모드로 전환' : '전체화면으로 전환');
            setTimeout(fitSheet, 150);
        }
        function toast2(msg) { toast(msg); }
        function enterPseudo(hint) {
            if (isRealFs()) return;
            document.body.classList.add(PSEUDO);
            syncUI();
            if (hint) toast2('이 브라우저는 브라우저 전체화면 대신 상단 바를 숨긴 몰입 모드로 표시합니다');
        }
        function requestReal() {
            var req = root.requestFullscreen || root.webkitRequestFullscreen || root.mozRequestFullScreen || root.msRequestFullscreen;
            if (!req) return false;
            try {
                var p = req.call(root);
                if (p && typeof p.then === 'function') p.then(syncUI, function () { enterPseudo(true); });
                else setTimeout(function () { if (!isRealFs() && !isPseudo()) enterPseudo(true); else syncUI(); }, 500);
                return true;
            } catch (err) { return false; }
        }
        btn.addEventListener('click', function () {
            if (isRealFs()) {
                var exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
                try { if (exit) { var q = exit.call(document); if (q && typeof q.catch === 'function') q.catch(function () { }); } } catch (err) { }
                syncUI(); return;
            }
            if (isPseudo()) { document.body.classList.remove(PSEUDO); syncUI(); return; }
            if (!requestReal()) enterPseudo(true);
            syncUI();
        });
        ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
            document.addEventListener(ev, function () {
                if (isRealFs()) document.body.classList.remove(PSEUDO);
                syncUI();
            });
        });
        document.addEventListener('keydown', function (e) {
            if ((e.key === 'Escape' || e.key === 'Esc') && isPseudo() && !isRealFs()) {
                document.body.classList.remove(PSEUDO); syncUI();
            }
        });
        window.addEventListener('resize', syncUI);
        syncUI();
    })();

    /* ---------- 시작 : 예시 2개 미리 선택 ---------- */
    renderLabs();
    renderSel();
    render();
    addLab('labs/physics/mechanics/sho.html');
})();
</script>
<script src="../common/feedback.js" defer></script>
</body>
</html>
