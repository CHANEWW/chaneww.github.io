<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>나만의 가상실험실 코딩</title>
<meta name="description" content="자연어 프롬프트로 행성 궤도·진자·자유 낙하 실험을 바꾸면 시뮬레이션과 코드가 동시에 갱신되는 프롬프트 코딩 체험 도구입니다.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="preload" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff" as="font" type="font/woff" crossorigin>
<style>
@font-face {
    font-family: 'SeoulNamsan';
    src: local('SeoulNamsan M'), local('SeoulNamsanM'), local('서울남산체 M'),
         url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff') format('woff');
    font-weight: 400; font-style: normal; font-display: swap;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    font-family: 'SeoulNamsan', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: #eef3fa; color: #16233a;
    -webkit-user-select: none; user-select: none;
    transition: background .3s ease, color .3s ease;
}
body.dark-mode { background: #0e1420; color: #e9eef8; }

:root {
    --bg: #eef3fa;
    --panel: rgba(255,255,255,.82);
    --panel-2: rgba(255,255,255,.94);
    --ink: #16233a;
    --sub: #64748b;
    --line: rgba(20,40,70,.12);
    --chip: rgba(60,110,200,.09);
    --accent: #2563eb;
    --accent-2: #7c3aed;
    --ok: #0f9d6b;
    --warn: #b45309;
    --shadow: 0 10px 32px rgba(20,40,80,.10);
    --code-bg: #0f172a;
    --code-ink: #e2e8f0;
}
body.dark-mode {
    --bg: #0e1420;
    --panel: rgba(24,32,48,.78);
    --panel-2: rgba(28,38,56,.94);
    --ink: #e9eef8;
    --sub: #93a3ba;
    --line: rgba(150,180,230,.16);
    --chip: rgba(110,160,240,.13);
    --accent: #5b9bff;
    --accent-2: #a78bfa;
    --ok: #37d39b;
    --warn: #ffb454;
    --shadow: 0 12px 34px rgba(0,0,0,.42);
    --code-bg: #070c16;
    --code-ink: #dbe6f7;
}

.glass {
    background: var(--panel);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
}

/* ---------- 상단 ---------- */
.top-left-bar { position: fixed; top: 16px; left: 20px; display: flex; align-items: center; gap: 10px; z-index: 60; max-width: calc(100vw - 130px); }
.back-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 15px; border-radius: 999px; text-decoration: none;
    color: var(--ink); font-family: inherit; font-weight: 700; font-size: 13.5px;
    background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow);
    cursor: pointer; white-space: nowrap; transition: transform .18s ease;
}
.back-btn:hover { transform: translateY(-1px); }
.page-title-badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 16px; border-radius: 999px; background: var(--panel);
    border: 1px solid var(--line); box-shadow: var(--shadow);
    font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden;
}
.page-title-badge > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill-badge { background: var(--chip); color: var(--accent); font-size: 10px; font-weight: 800; letter-spacing: .3px; padding: 2px 7px; border-radius: 999px; flex: 0 0 auto; }
.qr-btn { padding: 9px 13px; }
.qr-btn-icon { font-size: 14px; line-height: 1; }
.qr-btn-label { font-size: 12.5px; }

.top-right-bar { position: fixed; top: 16px; right: 20px; display: flex; align-items: center; gap: 10px; z-index: 60; }
.tr-util { display: flex; align-items: center; gap: 8px; }
.icon-btn {
    width: 40px; height: 40px; flex: 0 0 40px; display: inline-flex; align-items: center; justify-content: center;
    border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    font-family: inherit; font-size: 16px; line-height: 1; cursor: pointer; box-shadow: var(--shadow); padding: 0;
    transition: transform .18s ease;
}
.icon-btn:hover { transform: translateY(-1px); }

/* ---------- 레이아웃 ---------- */
.screen {
    position: absolute; inset: 0; padding: 70px 18px 74px; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
}
.layout {
    display: grid;
    grid-template-columns: 336px minmax(0, 1fr) 392px;
    gap: 12px;
    height: calc(100vh - 144px);
    min-height: 470px;
    max-width: 1720px; margin: 0 auto;
}
.pane { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.pane-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px; }
.pane-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 12px 14px; border-bottom: 1px solid var(--line);
}
.pane-title { font-size: 12.5px; font-weight: 800; letter-spacing: .3px; display: flex; align-items: center; gap: 6px; }
.pane-note { font-size: 10.5px; color: var(--sub); }

/* ---------- 장면 탭 ---------- */
.scene-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
.scene-tab {
    padding: 9px 4px; border-radius: 12px; cursor: pointer; font-family: inherit;
    border: 1px solid var(--line); background: transparent; color: var(--sub);
    font-size: 11.5px; font-weight: 800; display: flex; flex-direction: column; align-items: center; gap: 3px;
    transition: all .16s ease;
}
.scene-tab .si { font-size: 17px; line-height: 1; }
.scene-tab.on { background: var(--chip); color: var(--accent); border-color: rgba(80,140,240,.42); }

.block-label { margin: 14px 0 8px; font-size: 11px; font-weight: 800; color: var(--sub); letter-spacing: .4px; display: flex; align-items: center; justify-content: space-between; }
.block-label:first-child { margin-top: 0; }

/* ---------- 프롬프트 ---------- */
.prompt-box { position: relative; }
textarea#prompt {
    width: 100%; min-height: 78px; resize: vertical; padding: 11px 12px;
    border-radius: 13px; border: 1.5px solid var(--line); background: var(--panel-2);
    color: var(--ink); font-family: inherit; font-size: 13px; line-height: 1.6; outline: none;
    -webkit-user-select: text; user-select: text;
    transition: border-color .18s ease, box-shadow .18s ease;
}
textarea#prompt:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
textarea#prompt::placeholder { color: var(--sub); opacity: .85; }
.run-row { display: flex; gap: 7px; margin-top: 8px; }
.run-btn {
    flex: 1; height: 42px; border: none; border-radius: 12px; cursor: pointer;
    font-family: inherit; font-size: 13.5px; font-weight: 800; color: #fff;
    background: linear-gradient(100deg, #2563eb, #7c3aed);
    box-shadow: 0 8px 20px rgba(40,90,220,.28);
    transition: transform .14s ease, filter .14s ease;
}
.run-btn:hover { transform: translateY(-1px); }
.run-btn:active { transform: scale(.98); }
.mic-btn {
    width: 42px; height: 42px; flex: 0 0 42px; border-radius: 12px; cursor: pointer;
    border: 1px solid var(--line); background: var(--chip); color: var(--ink);
    font-family: inherit; font-size: 16px;
}

.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.preset {
    padding: 7px 11px; border-radius: 999px; cursor: pointer; font-family: inherit;
    font-size: 11.5px; font-weight: 700; color: var(--ink);
    background: var(--chip); border: 1px solid transparent;
    transition: all .16s ease;
}
.preset:hover { border-color: var(--accent); transform: translateY(-1px); }

.log { display: flex; flex-direction: column; gap: 5px; margin-top: 4px; min-height: 20px; }
.log-item {
    display: flex; align-items: flex-start; gap: 6px;
    padding: 7px 9px; border-radius: 10px; font-size: 11.5px; line-height: 1.5;
    background: var(--chip); animation: fadeIn .25s ease both;
}
.log-item .li-ico { flex: 0 0 auto; }
.log-item.ok { background: rgba(20,160,110,.14); color: var(--ok); }
.log-item.warn { background: rgba(200,120,20,.14); color: var(--warn); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }

/* ---------- 슬라이더 ---------- */
.slider-row { margin-bottom: 11px; }
.slider-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.slider-name { font-size: 11.5px; font-weight: 700; color: var(--sub); }
.slider-val { font-size: 12px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
input[type="range"] {
    width: 100%; height: 22px; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer;
}
input[type="range"]::-webkit-slider-runnable-track { height: 6px; border-radius: 999px; background: var(--chip); }
input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px; margin-top: -6px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 2px 8px rgba(37,99,235,.4); border: 2px solid #fff;
}
body.dark-mode input[type="range"]::-webkit-slider-thumb { border-color: #0e1420; }
input[type="range"]::-moz-range-track { height: 6px; border-radius: 999px; background: var(--chip); }
input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border: 2px solid #fff; border-radius: 50%; background: var(--accent); }

/* ---------- 무대 ---------- */
.pane-stage { min-height: 0; }
.stage-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.stage-name { font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
.readouts { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.readout {
    display: inline-flex; align-items: baseline; gap: 5px; padding: 5px 10px; border-radius: 999px;
    background: var(--chip); font-size: 11.5px; color: var(--sub);
}
.readout b { font-size: 12.5px; color: var(--ink); font-variant-numeric: tabular-nums; }
.canvas-wrap { position: relative; flex: 1 1 auto; min-height: 240px; margin: 10px 12px 0; border-radius: 14px; overflow: hidden; background: linear-gradient(180deg, rgba(120,160,230,.10), rgba(120,160,230,.02)); }
body.dark-mode .canvas-wrap { background: linear-gradient(180deg, rgba(40,70,130,.22), rgba(10,16,30,.35)); }
canvas#stage { display: block; width: 100%; height: 100%; touch-action: manipulation; }
.canvas-hint {
    position: absolute; left: 10px; bottom: 9px; font-size: 10.5px; color: var(--sub);
    background: var(--panel); padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line);
    pointer-events: none;
}
.play-bar { display: flex; align-items: center; gap: 7px; padding: 10px 12px 12px; flex-wrap: wrap; }
.pbtn {
    padding: 9px 14px; border-radius: 11px; cursor: pointer; font-family: inherit;
    font-size: 12px; font-weight: 800; color: var(--ink); background: var(--chip);
    border: 1px solid var(--line); transition: transform .14s ease;
}
.pbtn:hover { transform: translateY(-1px); }
.pbtn.on { background: rgba(37,99,235,.16); color: var(--accent); border-color: rgba(37,99,235,.4); }
.speed-wrap { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--sub); }
select#speed {
    font-family: inherit; font-size: 11.5px; font-weight: 700; padding: 7px 8px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); outline: none;
}

/* ---------- 미션 ---------- */
.missions { padding: 10px 12px 12px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.mission { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--sub); line-height: 1.45; }
.mission .mk { width: 17px; height: 17px; flex: 0 0 17px; border-radius: 6px; border: 1.5px solid var(--line); display: inline-flex; align-items: center; justify-content: center; font-size: 11px; color: transparent; }
.mission.done { color: var(--ink); }
.mission.done .mk { background: rgba(20,160,110,.18); border-color: rgba(20,160,110,.5); color: var(--ok); }

/* ---------- 코드 패널 ---------- */
.code-wrap { flex: 1 1 auto; min-height: 0; padding: 10px 12px 0; overflow: hidden; display: flex; }
pre#code {
    margin: 0; width: 100%; height: 100%; overflow: auto; border-radius: 12px;
    background: var(--code-bg); color: var(--code-ink);
    padding: 13px 14px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 11.5px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; tab-size: 2;
    -webkit-user-select: text; user-select: text;
}
.c-kw { color: #ff9ecd; }
.c-str { color: #a5e07f; }
.c-num { color: #ffd479; }
.c-com { color: #7f93b0; font-style: italic; }
.c-obj { color: #7cc7ff; }
.code-foot { display: flex; align-items: center; gap: 7px; padding: 10px 12px 12px; flex-wrap: wrap; }
.copy-btn {
    padding: 8px 13px; border-radius: 10px; cursor: pointer; font-family: inherit;
    font-size: 11.5px; font-weight: 800; color: var(--ink); background: var(--chip);
    border: 1px solid var(--line); transition: transform .14s ease;
}
.copy-btn:hover { transform: translateY(-1px); }
.code-note { font-size: 10.5px; color: var(--sub); line-height: 1.5; }

/* ---------- 토스트 ---------- */
#ux-toast {
    position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    z-index: 300; background: rgba(16,22,36,.94); color: #fff; font-size: 12.5px;
    padding: 10px 16px; border-radius: 14px; max-width: 88vw; text-align: center;
    pointer-events: none; opacity: 0; transition: opacity .3s ease; box-shadow: 0 10px 30px rgba(0,0,0,.35);
    line-height: 1.5;
}

/* ---------- 전체화면 ---------- */
.fs-pill-wrap { position: fixed; right: 20px; bottom: 20px; z-index: 70; }
.fs-pill {
    display: inline-flex; align-items: center; gap: 7px; padding: 10px 18px; border-radius: 999px;
    cursor: pointer; background: var(--panel); border: 1px solid var(--line); color: var(--ink);
    font-family: inherit; font-size: 13px; font-weight: 800; box-shadow: var(--shadow); white-space: nowrap;
    transition: transform .18s ease;
}
.fs-pill:hover { transform: translateY(-1px); }

/* ---------- 반응형 ---------- */
@media (max-width: 1360px) {
    .layout { grid-template-columns: 310px minmax(0, 1fr) 344px; }
}
@media (max-width: 1180px) {
    .layout {
        grid-template-columns: 300px minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr) minmax(0, 0.82fr);
        grid-template-areas: "prompt stage" "prompt code";
        height: calc(100vh - 140px);
    }
    .pane-prompt { grid-area: prompt; }
    .pane-stage { grid-area: stage; }
    .pane-code { grid-area: code; }
}
@media (max-width: 900px) {
    .top-left-bar { top: max(8px, env(safe-area-inset-top)); left: 8px; right: 58px; gap: 6px; }
    .top-left-bar .back-btn { padding: 6px 10px; font-size: 12px; }
    .page-title-badge { padding: 6px 10px; font-size: 12px; min-width: 0; }
    .pill-badge { font-size: 9px; padding: 1px 6px; }
    .qr-btn { display: none; }
    .top-right-bar { top: max(8px, env(safe-area-inset-top)); right: 8px; }
    .icon-btn { width: 34px; height: 34px; flex: 0 0 34px; font-size: 15px; }
    .screen { padding: calc(max(8px, env(safe-area-inset-top)) + 50px) 10px 96px; overflow-y: auto; }
    .layout {
        display: flex; flex-direction: column; height: auto; min-height: 0; gap: 10px;
    }
    .pane { overflow: visible; }
    .pane-body { overflow: visible; }
    .pane-stage { order: 1; }
    .pane-prompt { order: 2; }
    .pane-code { order: 3; }
    .canvas-wrap { flex: none; height: 34vh; min-height: 180px; margin: 8px 10px 0; }
    .canvas-hint { display: none; }
    .pane-code pre#code { height: 46vh; min-height: 260px; }
    .code-wrap { display: block; overflow: visible; }
    .stage-head { padding: 10px 12px; }
    .stage-name { font-size: 13px; }
    .readouts { margin-left: 0; width: 100%; }
    .readout { font-size: 10.5px; padding: 4px 8px; }
    .fs-pill-wrap { right: 12px; bottom: calc(14px + env(safe-area-inset-bottom)); }
    .fs-pill { padding: 9px; width: 40px; height: 40px; justify-content: center; font-size: 15px; }
    .fs-pill #fullscreenText { display: none; }
    .scene-tab { font-size: 10.5px; }
}
@media (max-width: 430px) {
    .pill-badge { display: none; }
    .canvas-wrap { height: 30vh; min-height: 168px; }
    .preset { font-size: 10.5px; padding: 6px 9px; }
}
@media (max-height: 560px) and (orientation: landscape) {
    .screen { padding: 50px 10px 56px; }
    .layout { display: flex; height: auto; }
    .canvas-wrap { height: 32vh; min-height: 150px; }
    .fs-pill-wrap { bottom: 8px; right: 8px; }
}

html.pseudo-fs .top-right-bar, html.pseudo-fs .pane-note { display: none !important; }
html.pseudo-fs .fs-pill-wrap { display: flex !important; }
</style>
<link rel="stylesheet" href="../common/qr-modal.css">
<link rel="stylesheet" href="../common/ui-layout.css">
</head>
<body>
<div class="top-left-bar">
    <a href="../../index.html" class="back-btn" onclick="var r=document.referrer;if(history.length>1&&r&&r.indexOf(location.origin+'/')===0&&/(\/|index(_3d)?\.html)(\?|#|$)/.test(r)){history.back();return false;}"><span>⬅</span> 메인</a>
    <div class="page-title-badge">
        <span>나만의 가상실험실 코딩</span>
        <span class="pill-badge">테스트</span>
    </div>
    <button class="back-btn qr-btn" id="qrBtn" type="button" title="QR 코드" aria-label="QR 코드 보기">
        <span class="qr-btn-icon" aria-hidden="true">📱</span><span class="qr-btn-label">QR code</span>
    </button>
</div>
<div class="top-right-bar">
    <div class="tr-util">
        <button class="icon-btn" id="themeBtn" type="button" title="야간 모드 전환" aria-label="야간 모드 전환">🌙</button>
    </div>
</div>

<main class="screen">
    <div class="layout">
        <!-- 프롬프트 -->
        <section class="pane pane-prompt glass">
            <div class="pane-head">
                <div class="pane-title">💬 프롬프트</div>
                <div class="pane-note">말로 실험을 바꿔 보세요</div>
            </div>
            <div class="pane-body">
                <div class="scene-tabs" id="sceneTabs">
                    <button class="scene-tab on" type="button" data-scene="orbit"><span class="si">🪐</span>행성 공전</button>
                    <button class="scene-tab" type="button" data-scene="pendulum"><span class="si">⏱</span>진자</button>
                    <button class="scene-tab" type="button" data-scene="freefall"><span class="si">🪂</span>자유 낙하</button>
                </div>

                <div class="block-label">무엇을 바꿀까요?</div>
                <div class="prompt-box">
                    <textarea id="prompt" rows="3" placeholder="예) 행성 공전 속도 2배로&#10;예) 진자 길이 길게&#10;예) 중력을 달의 1/6로" spellcheck="false"></textarea>
                </div>
                <div class="run-row">
                    <button class="run-btn" id="runBtn" type="button">▶ 실행 (Enter)</button>
                    <button class="mic-btn" id="clearPrompt" type="button" title="입력 지우기" aria-label="입력 지우기">⌫</button>
                </div>

                <div class="block-label">프리셋</div>
                <div class="presets" id="presets"></div>

                <div class="block-label">해석 결과</div>
                <div class="log" id="log">
                    <div class="log-item"><span class="li-ico">💡</span><span>프리셋을 누르거나 문장을 입력해 보세요. 바뀐 값이 바로 시뮬레이션과 코드에 반영됩니다.</span></div>
                </div>

                <div class="block-label">직접 조절</div>
                <div id="sliders"></div>
            </div>
        </section>

        <!-- 무대 -->
        <section class="pane pane-stage glass">
            <div class="stage-head">
                <div class="stage-name" id="stageName">🪐 행성 공전</div>
                <div class="readouts" id="readouts"></div>
            </div>
            <div class="canvas-wrap">
                <canvas id="stage"></canvas>
                <div class="canvas-hint" id="canvasHint">드래그 없이 자동 재생 · 프롬프트로 값을 바꿔 보세요</div>
            </div>
            <div class="play-bar">
                <button class="pbtn on" id="playBtn" type="button">⏸ 일시정지</button>
                <button class="pbtn" id="resetBtn" type="button">🔄 처음부터</button>
                <div class="speed-wrap">
                    <span>재생 속도</span>
                    <select id="speed">
                        <option value="0.25">0.25×</option>
                        <option value="0.5">0.5×</option>
                        <option value="1" selected>1×</option>
                        <option value="2">2×</option>
                    </select>
                </div>
            </div>
            <div class="missions" id="missions"></div>
        </section>

        <!-- 코드 -->
        <section class="pane pane-code glass">
            <div class="pane-head">
                <div class="pane-title">💻 생성 코드</div>
                <div class="pane-note" id="codeLang">JavaScript</div>
            </div>
            <div class="code-wrap">
                <pre id="code"></pre>
            </div>
            <div class="code-foot">
                <button class="copy-btn" id="copyBtn" type="button">📋 코드 복사</button>
                <span class="code-note" id="codeNote">프롬프트를 실행하면 이 코드가 함께 바뀝니다.</span>
            </div>
        </section>
    </div>
</main>

<div class="fs-pill-wrap">
    <button class="fs-pill" id="fullscreenBtn" type="button" aria-label="전체화면으로 전환">
        <span id="fullscreenIcon">⛶</span><span id="fullscreenText">전체화면</span>
    </button>
</div>

<script>
(function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    function qsa(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    function round(v, d) { var p = Math.pow(10, d || 0); return Math.round(v * p) / p; }

    var toastEl = null;
    function toast(msg, ms) {
        if (!toastEl) {
            toastEl = document.createElement('div');
            toastEl.id = 'ux-toast';
            document.body.appendChild(toastEl);
        }
        toastEl.textContent = msg;
        toastEl.style.opacity = '1';
        clearTimeout(toastEl._t);
        toastEl._t = setTimeout(function () { toastEl.style.opacity = '0'; }, ms || 2400);
    }

    /* ============================================================
       파라미터 · 장면 정의
       ============================================================ */
    var P = {
        scene: 'orbit',
        starMass: 1,
        radius: 2,
        speed: 1,
        length: 1.2,
        angle: 30,
        gravity: 9.8,
        damping: 0.02,
        height: 20,
        drag: 0.004
    };

    var SLIDERS = {
        orbit: [
            { key: 'radius', name: '궤도 반지름', min: 0.5, max: 4, step: 0.1, unit: 'AU', d: 1 },
            { key: 'starMass', name: '항성 질량(태양=1)', min: 0.2, max: 3, step: 0.1, unit: '', d: 1 },
            { key: 'speed', name: '공전 속도 배율', min: 0.2, max: 4, step: 0.1, unit: '×', d: 1 }
        ],
        pendulum: [
            { key: 'length', name: '진자 길이', min: 0.3, max: 3, step: 0.05, unit: 'm', d: 2 },
            { key: 'angle', name: '진폭(각도)', min: 5, max: 70, step: 1, unit: '°', d: 0 },
            { key: 'gravity', name: '중력 가속도', min: 1, max: 25, step: 0.1, unit: 'm/s²', d: 1 },
            { key: 'damping', name: '공기 저항', min: 0, max: 0.3, step: 0.005, unit: '', d: 3 }
        ],
        freefall: [
            { key: 'height', name: '낙하 높이', min: 2, max: 50, step: 1, unit: 'm', d: 0 },
            { key: 'gravity', name: '중력 가속도', min: 1, max: 25, step: 0.1, unit: 'm/s²', d: 1 },
            { key: 'drag', name: '공기 저항 계수', min: 0, max: 0.02, step: 0.001, unit: '', d: 3 }
        ]
    };

    var SCENE_INFO = {
        orbit: { name: '행성 공전', icon: '🪐' },
        pendulum: { name: '진자', icon: '⏱' },
        freefall: { name: '자유 낙하', icon: '🪂' }
    };

    /* 미션 정의 */
    var MISSIONS = {
        orbit: [
            { id: 'o1', text: '궤도 반지름을 3 AU 이상으로', test: function () { return P.radius >= 3; } },
            { id: 'o2', text: '항성 질량을 2배(2.0)로', test: function () { return Math.abs(P.starMass - 2) < 0.05; } }
        ],
        pendulum: [
            { id: 'p1', text: '진자 주기를 2.0초 근처로 (1.9~2.1초)', test: function () { var T = 2 * Math.PI * Math.sqrt(P.length / P.gravity); return T >= 1.9 && T <= 2.1; } },
            { id: 'p2', text: '진자 길이를 2 m 이상으로', test: function () { return P.length >= 2; } }
        ],
        freefall: [
            { id: 'f1', text: '낙하 시간을 1.5초 이하로', test: function () { return Math.sqrt(2 * P.height / P.gravity) <= 1.5; } },
            { id: 'f2', text: '중력을 달 중력(1.6)에 가깝게', test: function () { return Math.abs(P.gravity - 1.63) < 0.12; } }
        ]
    };

    /* ============================================================
       자연어 해석
       ============================================================ */
    var NUM_WORD = { '한': 1, '두': 2, '세': 3, '네': 4, '다섯': 5, '여섯': 6, '일곱': 7, '여덟': 8, '아홉': 9, '열': 10 };
    var PLANET_G = { '달': 1.63, '화성': 3.71, '지구': 9.8, '목성': 24.8, '수성': 3.7, '금성': 8.87, '태양': 274 };

    function firstNumber(t) {
        var m = t.match(/(\d+(?:\.\d+)?)/);
        return m ? parseFloat(m[1]) : null;
    }
    function factorOf(t) {
        var m = t.match(/(\d+(?:\.\d+)?)\s*배/);
        if (m) return parseFloat(m[1]);
        var mw = t.match(/(한|두|세|네|다섯|여섯|일곱|여덟|아홉|열)\s*배/);
        if (mw) return NUM_WORD[mw[1]];
        if (/절반|반으로|반\s*정도/.test(t)) return 0.5;
        var f = t.match(/(\d+(?:\.\d+)?)\s*분의\s*(\d+(?:\.\d+)?)/);
        if (f) return parseFloat(f[2]) / parseFloat(f[1]);
        var f2 = t.match(/(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)/);
        if (f2) return parseFloat(f2[1]) / parseFloat(f2[2]);
        return null;
    }
    function has(t, re) { return re.test(t); }

    /* 하나의 문장 조각을 해석해 P에 적용하고 로그 문자열 반환 */
    function applyClause(raw) {
        var t = raw.replace(/[.!?~]/g, ' ').replace(/\s+/g, ' ').trim();
        if (!t) return null;
        var low = t;
        var changes = [];

        /* 장면 전환 */
        if (has(low, /행성|공전|궤도|태양계|항성/)) changes.push({ scene: 'orbit' });
        else if (has(low, /진자|추\s*달|흔들|시계추/)) changes.push({ scene: 'pendulum' });
        else if (has(low, /낙하|떨어|떨|자유\s*낙하/)) changes.push({ scene: 'freefall' });

        /* 중력 */
        if (has(low, /중력|그래비티|\bg\b/i)) {
            var planet = null;
            for (var pk in PLANET_G) { if (low.indexOf(pk) >= 0) { planet = pk; break; } }
            if (planet) {
                var f = factorOf(low);
                var g = PLANET_G[planet];
                if (f !== null && /분의|\//.test(low)) {
                    /* "달의 1/6"처럼 지구 중력의 일부를 말할 때 */
                    g = (planet === '달' ? 9.8 : PLANET_G[planet]) * f;
                }
                changes.push({ key: 'gravity', value: g });
            } else {
                var fc = factorOf(low);
                if (fc !== null && has(low, /배|분의|\//)) {
                    changes.push({ key: 'gravity', mul: fc });
                } else {
                    var n = firstNumber(low);
                    if (n !== null) changes.push({ key: 'gravity', value: n });
                }
            }
        }

        /* 길이 */
        if (has(low, /길이|줄|실\s*길이|목줄/) && !has(low, /공전|궤도/)) {
            var cm = low.match(/(\d+(?:\.\d+)?)\s*(cm|센티)/);
            var mm = low.match(/(\d+(?:\.\d+)?)\s*(m|미터)/);
            var fl = factorOf(low);
            if (cm) changes.push({ key: 'length', value: parseFloat(cm[1]) / 100 });
            else if (mm) changes.push({ key: 'length', value: parseFloat(mm[1]) });
            else if (fl !== null) changes.push({ key: 'length', mul: fl });
            else if (has(low, /길게|늘려|늘리|크게|길어/)) changes.push({ key: 'length', mul: 1.6 });
            else if (has(low, /짧게|줄여|줄이|작게|짧아/)) changes.push({ key: 'length', mul: 0.6 });
        }

        /* 각도 */
        if (has(low, /각도|각을|진폭|벌린|벌려|흔드는?\s*각/)) {
            var ad = low.match(/(\d+(?:\.\d+)?)\s*도/);
            var fa = factorOf(low);
            if (ad) changes.push({ key: 'angle', value: parseFloat(ad[1]) });
            else if (fa !== null) changes.push({ key: 'angle', mul: fa });
            else if (has(low, /크게|넓게|많이/)) changes.push({ key: 'angle', mul: 1.5 });
            else if (has(low, /작게|좁게|적게/)) changes.push({ key: 'angle', mul: 0.6 });
        }

        /* 항성 질량 */
        if (has(low, /항성|별\s*질량|태양\s*질량|중심별|항성의?\s*질량/)) {
            var fm = factorOf(low);
            var qm = low.match(/(?:질량)\s*(?:을|를|이|가)?\s*(\d+(?:\.\d+)?)/);
            if (fm !== null) changes.push({ key: 'starMass', mul: fm });
            else if (qm) changes.push({ key: 'starMass', value: parseFloat(qm[1]) });
        }

        /* 궤도 반지름 */
        if (has(low, /궤도|반지름|궤도\s*거리|공전\s*거리/)) {
            var ra = low.match(/(\d+(?:\.\d+)?)\s*(AU|au|천문단위)/);
            var fr = factorOf(low);
            if (ra) changes.push({ key: 'radius', value: parseFloat(ra[1]) });
            else if (fr !== null) changes.push({ key: 'radius', mul: fr });
            else if (has(low, /멀게|멀리|넓게|크게/)) changes.push({ key: 'radius', mul: 1.5 });
            else if (has(low, /가깝|좁게|작게/)) changes.push({ key: 'radius', mul: 0.65 });
        }

        /* 공전 속도 */
        if (has(low, /공전\s*속|속도|빨리|빠르|느리|느리게|천천히/)) {
            var fs = factorOf(low);
            if (fs !== null) changes.push({ key: 'speed', mul: fs });
            else if (has(low, /빠르|빨리|빨라/)) changes.push({ key: 'speed', mul: 1.8 });
            else if (has(low, /느리|천천/)) changes.push({ key: 'speed', mul: 0.55 });
        }

        /* 높이 */
        if (has(low, /높이|고도|높게|높여/)) {
            var hm = low.match(/(\d+(?:\.\d+)?)\s*(m|미터)/);
            var fh = factorOf(low);
            if (hm) changes.push({ key: 'height', value: parseFloat(hm[1]) });
            else if (fh !== null) changes.push({ key: 'height', mul: fh });
            else if (has(low, /높게|높여|크게/)) changes.push({ key: 'height', mul: 1.5 });
            else if (has(low, /낮게|낮춰|작게/)) changes.push({ key: 'height', mul: 0.6 });
        }

        /* 공기 저항 */
        if (has(low, /공기\s*저항|저항|마찰|감쇠/)) {
            if (P.scene === 'orbit') {
                changes.push({ note: '공기 저항은 진자·자유 낙하 장면에서만 쓰입니다.' });
            } else {
                var fdr = factorOf(low);
                var noDrag = has(low, /없|제거|무시|0/);
                var dkey = (P.scene === 'pendulum') ? 'damping' : 'drag';
                if (noDrag) changes.push({ key: dkey, value: 0 });
                else if (fdr !== null) changes.push({ key: dkey, mul: fdr });
                else changes.push({ note: '공기 저항은 “없애” 또는 “2배”처럼 크기를 말해 주세요.' });
            }
        }

        return changes.length ? changes : null;
    }

    function fmtV(v, unit) {
        if (!unit) return String(v);
        if (unit === '×' || unit === '°') return v + unit;
        return v + ' ' + unit;
    }

    function applyChanges(changes) {
        var logs = [];
        changes.forEach(function (c) {
            if (c.note) { logs.push({ warn: true, text: c.note }); return; }
            if (c.scene) {
                if (P.scene !== c.scene) {
                    P.scene = c.scene;
                    logs.push({ ok: true, text: '장면 전환 → ' + SCENE_INFO[c.scene].name });
                    resetSim();
                }
                return;
            }
            var key = c.key;
            var def = findSlider(key);
            var before = P[key];
            var after = before;
            if (c.mul !== undefined) after = before * c.mul;
            else if (c.value !== undefined) after = c.value;
            if (def) after = clamp(after, def.min, def.max);
            after = round(after, (def && def.d !== undefined) ? def.d : 2);
            P[key] = after;
            var nm = def ? def.name : key;
            var unit = def ? def.unit : '';
            var here = false;
            (SLIDERS[P.scene] || []).forEach(function (sd) { if (sd.key === key) here = true; });
            var suffix = here ? '' : ' · 다른 장면에서 적용됩니다';
            if (Math.abs(after - before) > 1e-9) {
                logs.push({ ok: true, text: nm + ' ' + fmtV(before, unit) + ' → ' + fmtV(after, unit) + suffix });
            } else {
                logs.push({ warn: true, text: nm + ' 값이 이미 ' + fmtV(after, unit) + '입니다' });
            }
        });
        return logs;
    }

    function findSlider(key) {
        var list = SLIDERS[P.scene] || [];
        for (var i = 0; i < list.length; i++) if (list[i].key === key) return list[i];
        /* 다른 장면의 정의에서 범위만 빌려온다 */
        for (var s in SLIDERS) {
            for (var j = 0; j < SLIDERS[s].length; j++) if (SLIDERS[s][j].key === key) return SLIDERS[s][j];
        }
        return null;
    }

    function runPrompt(text) {
        var raw = String(text || '').trim();
        if (!raw) { toast('바꾸고 싶은 내용을 입력해 보세요.'); return; }
        var parts = raw.split(/\s*(?:그리고|,\s*|하고\s+|\.\s+)\s*/).filter(function (x) { return x.trim(); });
        if (!parts.length) parts = [raw];
        var all = [];
        var matched = false;
        parts.forEach(function (seg) {
            var ch = applyClause(seg);
            if (ch) { matched = true; all = all.concat(ch); }
        });
        if (!matched) {
            renderLog([{ warn: true, text: '문장을 이해하지 못했습니다. 예) “진자 길이 2m로”, “중력을 화성으로”, “공전 속도 1.5배”' }]);
            return;
        }
        var logs = applyChanges(all);
        renderLog(logs);
        syncUI();
        resetSim();
    }

    function renderLog(logs) {
        var box = $('log');
        box.innerHTML = logs.map(function (l) {
            var cls = l.ok ? 'log-item ok' : (l.warn ? 'log-item warn' : 'log-item');
            var ico = l.ok ? '✅' : (l.warn ? '⚠️' : '💡');
            return '<div class="' + cls + '"><span class="li-ico">' + ico + '</span><span>' + l.text + '</span></div>';
        }).join('');
    }

    /* ============================================================
       프리셋
       ============================================================ */
    var PRESETS = {
        orbit: [
            '행성 공전 속도 2배로',
            '궤도 반지름을 4 AU로',
            '항성 질량을 2배로',
            '태양 질량을 0.5배로'
        ],
        pendulum: [
            '진자 길이 길게',
            '진자 길이 2m로',
            '진폭을 60도로',
            '중력을 달의 1/6로'
        ],
        freefall: [
            '중력을 달의 1/6로',
            '낙하 높이 45m로',
            '중력을 화성으로',
            '공기 저항 없애'
        ]
    };

    function renderPresets() {
        var list = PRESETS[P.scene] || [];
        $('presets').innerHTML = list.map(function (t) {
            return '<button class="preset" type="button" data-preset="' + t.replace(/"/g, '&quot;') + '">' + t + '</button>';
        }).join('');
    }

    /* ============================================================
       UI 동기화
       ============================================================ */
    function syncUI() {
        qsa('.scene-tab').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-scene') === P.scene); });
        $('stageName').textContent = SCENE_INFO[P.scene].icon + ' ' + SCENE_INFO[P.scene].name;
        renderPresets();
        var list = SLIDERS[P.scene] || [];
        $('sliders').innerHTML = list.map(function (s) {
            var v = P[s.key];
            return '<div class="slider-row">' +
                '<div class="slider-head"><span class="slider-name">' + s.name + '</span>' +
                '<span class="slider-val" id="val-' + s.key + '">' + v + ' ' + s.unit + '</span></div>' +
                '<input type="range" data-key="' + s.key + '" min="' + s.min + '" max="' + s.max + '" step="' + s.step + '" value="' + v + '">' +
                '</div>';
        }).join('');
        renderReadouts();
        renderMissions();
        renderCode();
    }

    function renderReadouts() {
        var out = [];
        if (P.scene === 'orbit') {
            var T = Math.sqrt(Math.pow(P.radius, 3) / P.starMass);
            out.push(['공전 주기', round(T, 2) + ' 년']);
            out.push(['궤도 둘레', round(2 * Math.PI * P.radius, 1) + ' AU']);
            out.push(['속도 배율', round(P.speed, 1) + '×']);
        } else if (P.scene === 'pendulum') {
            var Tp = 2 * Math.PI * Math.sqrt(P.length / P.gravity);
            var vmax = Math.sqrt(2 * P.gravity * P.length * (1 - Math.cos(P.angle * Math.PI / 180)));
            out.push(['주기(근사)', round(Tp, 2) + ' 초']);
            out.push(['최대 속도', round(vmax, 2) + ' m/s']);
        } else {
            var tf = Math.sqrt(2 * P.height / P.gravity);
            out.push(['낙하 시간', round(tf, 2) + ' 초']);
            out.push(['충돌 속도', round(Math.sqrt(2 * P.gravity * P.height), 1) + ' m/s']);
        }
        $('readouts').innerHTML = out.map(function (r) {
            return '<span class="readout">' + r[0] + ' <b>' + r[1] + '</b></span>';
        }).join('');
    }

    function renderMissions() {
        var list = MISSIONS[P.scene] || [];
        $('missions').innerHTML = list.map(function (m) {
            var done = false;
            try { done = m.test(); } catch (e) { done = false; }
            return '<div class="mission' + (done ? ' done' : '') + '"><span class="mk">✓</span><span>' + m.text + '</span></div>';
        }).join('');
    }

    /* ============================================================
       코드 생성
       ============================================================ */
    function genCode() {
        if (P.scene === 'orbit') {
            return '' +
'// 나만의 가상실험실 — 행성 공전\n' +
'const config = {\n' +
'  starMass: ' + round(P.starMass, 1) + ',      // 항성 질량 (태양 = 1)\n' +
'  orbitRadius: ' + round(P.radius, 1) + ',   // 궤도 반지름 (AU)\n' +
'  speedMul: ' + round(P.speed, 1) + '       // 공전 속도 배율\n' +
'};\n\n' +
'// 케플러 제3법칙: T² = a³ / M  (T: 년, a: AU)\n' +
'const period = Math.sqrt(Math.pow(config.orbitRadius, 3) / config.starMass);\n\n' +
'let angle = 0;\n' +
'function update(dt) {\n' +
'  const omega = (2 * Math.PI / period) * config.speedMul;\n' +
'  angle += omega * dt;\n' +
'  const x = Math.cos(angle) * config.orbitRadius;\n' +
'  const y = Math.sin(angle) * config.orbitRadius;\n' +
'  planet.position.set(x, y, 0);\n' +
'}\n';
        }
        if (P.scene === 'pendulum') {
            return '' +
'// 나만의 가상실험실 — 진자\n' +
'const config = {\n' +
'  length: ' + round(P.length, 2) + ',        // 줄 길이 (m)\n' +
'  angleDeg: ' + round(P.angle, 0) + ',      // 처음 벌린 각도 (°)\n' +
'  gravity: ' + round(P.gravity, 1) + ',      // 중력 가속도 (m/s²)\n' +
'  damping: ' + round(P.damping, 3) + '      // 공기 저항\n' +
'};\n\n' +
'// 작은 각 근사: T = 2π√(L/g)\n' +
'const period = 2 * Math.PI * Math.sqrt(config.length / config.gravity);\n\n' +
'let theta = config.angleDeg * Math.PI / 180;\n' +
'let omega = 0;\n' +
'function update(dt) {\n' +
'  const alpha = -(config.gravity / config.length) * Math.sin(theta)\n' +
'                - config.damping * omega;\n' +
'  omega += alpha * dt;\n' +
'  theta += omega * dt;\n' +
'  bob.position.set(Math.sin(theta) * config.length,\n' +
'                  -Math.cos(theta) * config.length, 0);\n' +
'}\n';
        }
        return '' +
'// 나만의 가상실험실 — 자유 낙하\n' +
'const config = {\n' +
'  gravity: ' + round(P.gravity, 1) + ',      // 중력 가속도 (m/s²)\n' +
'  height: ' + round(P.height, 0) + ',       // 낙하 높이 (m)\n' +
'  drag: ' + round(P.drag, 3) + '         // 공기 저항 계수\n' +
'};\n\n' +
'const fallTime = Math.sqrt(2 * config.height / config.gravity);\n\n' +
'let t = 0, v = 0, y = config.height;\n' +
'function update(dt) {\n' +
'  const a = config.gravity - config.drag * v * v;\n' +
'  v += a * dt;\n' +
'  y -= v * dt;\n' +
'  t += dt;\n' +
'  if (y <= 0) { y = 0; running = false; }\n' +
'  ball.position.set(0, y, 0);\n' +
'}\n';
    }

    var TOKEN = /(\/\/[^\n]*)|('[^']*'|"[^"]*")|\b(const|let|var|function|return|if|else|for|while|new)\b|\b(Math|config|planet|bob|ball|theta|omega|angle|period)\b|(\d+(?:\.\d+)?)/g;
    function escHtml(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function highlight(code) {
        return escHtml(code).replace(TOKEN, function (all, com, str, kw, obj, num) {
            if (com) return '<span class="c-com">' + com + '</span>';
            if (str) return '<span class="c-str">' + str + '</span>';
            if (kw) return '<span class="c-kw">' + kw + '</span>';
            if (obj) return '<span class="c-obj">' + obj + '</span>';
            if (num) return '<span class="c-num">' + num + '</span>';
            return all;
        });
    }
    function renderCode() {
        $('code').innerHTML = highlight(genCode());
    }

    /* ============================================================
       시뮬레이션
       ============================================================ */
    var cv = $('stage');
    var ctx = cv.getContext('2d');
    var W = 0, H = 0, DPR = 1;

    var sim = {
        playing: true,
        speed: 1,
        t: 0,
        angle: 0,
        theta: 0,
        omega: 0,
        vy: 0,
        y: 0,
        trail: [],
        landed: false,
        landHold: 0
    };

    function resize() {
        var wrap = cv.parentElement;
        var r = wrap.getBoundingClientRect();
        W = Math.max(120, Math.round(r.width));
        H = Math.max(120, Math.round(r.height));
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * DPR);
        cv.height = Math.round(H * DPR);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }

    function resetSim() {
        sim.t = 0; sim.angle = 0; sim.trail = [];
        var startTheta = P.angle * Math.PI / 180;
        sim.theta = startTheta; sim.omega = 0;
        sim.y = P.height; sim.vy = 0;
        sim.landed = false; sim.landHold = 0;
        draw();
    }

    function css(name) {
        return getComputedStyle(document.body).getPropertyValue(name).trim();
    }

    function draw() {
        if (!W || !H) return;
        ctx.clearRect(0, 0, W, H);
        var ink = css('--ink') || '#16233a';
        var sub = css('--sub') || '#64748b';
        var accent = css('--accent') || '#2563eb';
        var accent2 = css('--accent-2') || '#7c3aed';
        var ok = css('--ok') || '#0f9d6b';
        if (P.scene === 'orbit') drawOrbit(ink, sub, accent, accent2);
        else if (P.scene === 'pendulum') drawPendulum(ink, sub, accent, accent2, ok);
        else drawFreefall(ink, sub, accent, accent2, ok);
    }

    function drawOrbit(ink, sub, accent, accent2) {
        var cx = W * 0.5, cy = H * 0.5;
        var base = Math.min(W, H);
        var rPix = base * (0.14 + (clamp(P.radius, 0.5, 4) - 0.5) / 3.5 * 0.28);
        var starR = 12 + P.starMass * 7;

        /* 궤도 */
        ctx.beginPath();
        ctx.setLineDash([5, 6]);
        ctx.strokeStyle = sub;
        ctx.globalAlpha = 0.55;
        ctx.lineWidth = 1.4;
        ctx.arc(cx, cy, rPix, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha = 1;

        /* 항성 */
        var g = ctx.createRadialGradient(cx, cy, 2, cx, cy, starR * 2.4);
        g.addColorStop(0, 'rgba(255,210,110,0.95)');
        g.addColorStop(0.45, 'rgba(255,170,60,0.45)');
        g.addColorStop(1, 'rgba(255,150,40,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(cx, cy, starR * 2.4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffb84d';
        ctx.beginPath(); ctx.arc(cx, cy, starR, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(120,70,10,.75)';
        ctx.font = '700 11px SeoulNamsan, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('항성', cx, cy + 1);

        /* 행성 궤적 */
        ctx.beginPath();
        for (var i = 0; i < sim.trail.length; i++) {
            var a = sim.trail[i];
            var x = cx + Math.cos(a) * rPix, y = cy + Math.sin(a) * rPix;
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = accent2; ctx.globalAlpha = 0.5; ctx.lineWidth = 2; ctx.stroke(); ctx.globalAlpha = 1;

        /* 행성 */
        var px = cx + Math.cos(sim.angle) * rPix;
        var py = cy + Math.sin(sim.angle) * rPix;
        var pg = ctx.createRadialGradient(px - 3, py - 3, 1, px, py, 13);
        pg.addColorStop(0, '#9fc4ff'); pg.addColorStop(1, accent);
        ctx.fillStyle = pg;
        ctx.beginPath(); ctx.arc(px, py, 10, 0, Math.PI * 2); ctx.fill();

        /* 속도 방향 화살표 */
        var tx = -Math.sin(sim.angle), ty = Math.cos(sim.angle);
        ctx.strokeStyle = accent2; ctx.lineWidth = 2; ctx.beginPath();
        ctx.moveTo(px, py); ctx.lineTo(px + tx * 26, py + ty * 26); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(px + tx * 32, py + ty * 32);
        ctx.lineTo(px + tx * 24 + ty * 5, py + ty * 24 - tx * 5);
        ctx.lineTo(px + tx * 24 - ty * 5, py + ty * 24 + tx * 5);
        ctx.closePath(); ctx.fillStyle = accent2; ctx.fill();

        /* 라벨 */
        ctx.fillStyle = ink; ctx.font = '700 12px SeoulNamsan, sans-serif'; ctx.textAlign = 'left';
        ctx.fillText('반지름 ' + round(P.radius, 1) + ' AU', 12, 20);
        ctx.fillStyle = sub; ctx.font = '400 11px SeoulNamsan, sans-serif';
        ctx.fillText('주기 ' + round(Math.sqrt(Math.pow(P.radius, 3) / P.starMass), 2) + ' 년 · 속도 ' + round(P.speed, 1) + '×', 12, 38);
    }

    function drawPendulum(ink, sub, accent, accent2, ok) {
        var pivotX = W * 0.5, pivotY = H * 0.16;
        var base = Math.min(W * 0.9, H);
        var Lpix = base * (0.18 + (clamp(P.length, 0.3, 3) - 0.3) / 2.7 * 0.52);
        var bobX = pivotX + Math.sin(sim.theta) * Lpix;
        var bobY = pivotY + Math.cos(sim.theta) * Lpix;

        /* 각도 눈금 */
        ctx.strokeStyle = sub; ctx.globalAlpha = 0.35; ctx.lineWidth = 1;
        for (var d = -70; d <= 70; d += 10) {
            var rad = d * Math.PI / 180;
            var r1 = Lpix * 0.42, r2 = Lpix * 0.46;
            ctx.beginPath();
            ctx.moveTo(pivotX + Math.sin(rad) * r1, pivotY + Math.cos(rad) * r1);
            ctx.lineTo(pivotX + Math.sin(rad) * r2, pivotY + Math.cos(rad) * r2);
            ctx.stroke();
        }
        ctx.globalAlpha = 0.25;
        ctx.beginPath();
        ctx.arc(pivotX, pivotY, Lpix * 0.44, Math.PI / 2 - 1.2, Math.PI / 2 + 1.2);
        ctx.stroke();
        ctx.globalAlpha = 1;

        /* 진폭 표시 */
        var ampRad = P.angle * Math.PI / 180;
        ctx.strokeStyle = accent2; ctx.globalAlpha = 0.5; ctx.setLineDash([3, 4]);
        ctx.beginPath(); ctx.moveTo(pivotX, pivotY);
        ctx.lineTo(pivotX + Math.sin(ampRad) * Lpix * 1.16, pivotY + Math.cos(ampRad) * Lpix * 1.16);
        ctx.stroke();
        ctx.beginPath(); ctx.moveTo(pivotX, pivotY);
        ctx.lineTo(pivotX - Math.sin(ampRad) * Lpix * 1.16, pivotY + Math.cos(ampRad) * Lpix * 1.16);
        ctx.stroke();
        ctx.setLineDash([]); ctx.globalAlpha = 1;

        /* 궤적 */
        ctx.beginPath();
        for (var i = 0; i < sim.trail.length; i++) {
            var p = sim.trail[i];
            var x = pivotX + Math.sin(p) * Lpix, y = pivotY + Math.cos(p) * Lpix;
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = accent; ctx.globalAlpha = 0.35; ctx.lineWidth = 2; ctx.stroke(); ctx.globalAlpha = 1;

        /* 줄 */
        ctx.strokeStyle = ink; ctx.globalAlpha = 0.8; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(pivotX, pivotY); ctx.lineTo(bobX, bobY); ctx.stroke();
        ctx.globalAlpha = 1;

        /* 축 */
        ctx.fillStyle = ink;
        ctx.beginPath(); ctx.arc(pivotX, pivotY, 6, 0, Math.PI * 2); ctx.fill();

        /* 추 */
        var bg = ctx.createRadialGradient(bobX - 4, bobY - 4, 2, bobX, bobY, 17);
        bg.addColorStop(0, '#ffd9a8'); bg.addColorStop(1, '#f59e0b');
        ctx.fillStyle = bg;
        ctx.beginPath(); ctx.arc(bobX, bobY, 14, 0, Math.PI * 2); ctx.fill();

        /* 각도값 */
        ctx.fillStyle = ok; ctx.font = '700 12px SeoulNamsan, sans-serif'; ctx.textAlign = 'left';
        ctx.fillText('현재 각도 ' + round(sim.theta * 180 / Math.PI, 1) + '°', 12, 20);
        ctx.fillStyle = sub; ctx.font = '400 11px SeoulNamsan, sans-serif';
        ctx.fillText('길이 ' + round(P.length, 2) + ' m · g ' + round(P.gravity, 1) + ' m/s²', 12, 38);
    }

    function drawFreefall(ink, sub, accent, accent2, ok) {
        var groundY = H * 0.86;
        var topY = H * 0.12;
        var x = W * 0.5;
        var hRatio = clamp(sim.y / Math.max(P.height, 0.001), 0, 1);
        var y = topY + (1 - hRatio) * (groundY - topY);

        /* 눈금 */
        ctx.strokeStyle = sub; ctx.globalAlpha = 0.4; ctx.lineWidth = 1;
        var ticks = 5;
        for (var i = 0; i <= ticks; i++) {
            var ty = topY + (groundY - topY) * i / ticks;
            ctx.beginPath(); ctx.moveTo(W * 0.12, ty); ctx.lineTo(W * 0.2, ty); ctx.stroke();
            ctx.globalAlpha = 0.75;
            ctx.fillStyle = sub; ctx.font = '10.5px SeoulNamsan, sans-serif'; ctx.textAlign = 'right';
            ctx.fillText(round(P.height * (1 - i / ticks), 0) + ' m', W * 0.1, ty + 3);
            ctx.globalAlpha = 0.4;
        }
        ctx.globalAlpha = 1;

        /* 낙하 높이 표시 */
        ctx.strokeStyle = accent; ctx.globalAlpha = 0.25; ctx.setLineDash([4, 5]); ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(W * 0.24, topY); ctx.lineTo(W * 0.34, topY); ctx.stroke();
        ctx.setLineDash([]); ctx.globalAlpha = 1;

        /* 바닥 */
        ctx.strokeStyle = ink; ctx.lineWidth = 2.4;
        ctx.beginPath(); ctx.moveTo(W * 0.12, groundY); ctx.lineTo(W * 0.88, groundY); ctx.stroke();

        /* 궤적 점 */
        for (var k = 0; k < sim.trail.length; k++) {
            var tp = sim.trail[k];
            ctx.fillStyle = accent2; ctx.globalAlpha = 0.18 + 0.5 * (k / Math.max(1, sim.trail.length));
            ctx.beginPath();
            ctx.arc(x, topY + (1 - tp) * (groundY - topY), 3, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;

        /* 착지 표시 */
        if (sim.landed) {
            var pr = 8 + sim.landHold * 34;
            ctx.strokeStyle = ok; ctx.globalAlpha = Math.max(0, 0.55 - sim.landHold * 0.4);
            ctx.lineWidth = 2.4;
            ctx.beginPath(); ctx.ellipse(x, groundY, pr, pr * 0.34, 0, 0, Math.PI * 2); ctx.stroke();
            ctx.globalAlpha = 1;
        }

        /* 공 */
        var bg = ctx.createRadialGradient(x - 5, y - 5, 2, x, y, 20);
        bg.addColorStop(0, '#a7f3d0'); bg.addColorStop(1, '#10b981');
        ctx.fillStyle = bg;
        ctx.beginPath(); ctx.arc(x, y, 13, 0, Math.PI * 2); ctx.fill();

        /* 속도 벡터 */
        if (sim.vy > 0.1) {
            ctx.strokeStyle = accent2; ctx.lineWidth = 2;
            var len = clamp(sim.vy * 3, 8, 60);
            ctx.beginPath(); ctx.moveTo(x + 26, y); ctx.lineTo(x + 26, y + len); ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x + 26, y + len + 7);
            ctx.lineTo(x + 21, y + len - 1);
            ctx.lineTo(x + 31, y + len - 1);
            ctx.closePath(); ctx.fillStyle = accent2; ctx.fill();
        }

        ctx.fillStyle = ink; ctx.font = '700 12px SeoulNamsan, sans-serif'; ctx.textAlign = 'left';
        ctx.fillText('높이 ' + round(sim.y, 1) + ' m', 12, 20);
        ctx.fillStyle = sub; ctx.font = '400 11px SeoulNamsan, sans-serif';
        ctx.fillText('속도 ' + round(sim.vy, 1) + ' m/s · 시간 ' + round(sim.t, 2) + ' s', 12, 38);
    }

    function step(dt) {
        var sdt = dt * sim.speed;
        if (P.scene === 'orbit') {
            var T = Math.sqrt(Math.pow(P.radius, 3) / Math.max(P.starMass, 0.01));
            var omega = (2 * Math.PI / Math.max(T, 0.05)) * P.speed * 0.36;
            sim.angle += omega * sdt;
            sim.trail.push(sim.angle);
            if (sim.trail.length > 140) sim.trail.shift();
        } else if (P.scene === 'pendulum') {
            var steps = 4;
            for (var i = 0; i < steps; i++) {
                var h = sdt / steps;
                var alpha = -(P.gravity / P.length) * Math.sin(sim.theta) - P.damping * sim.omega;
                sim.omega += alpha * h;
                sim.theta += sim.omega * h;
            }
            sim.trail.push(sim.theta);
            if (sim.trail.length > 90) sim.trail.shift();
        } else {
            if (sim.landed) {
                sim.landHold += sdt;
                if (sim.landHold > 1.2) {
                    sim.y = P.height; sim.vy = 0; sim.t = 0;
                    sim.landed = false; sim.landHold = 0; sim.trail = [];
                }
            } else {
                var a = P.gravity - P.drag * sim.vy * sim.vy;
                sim.vy += a * sdt;
                sim.y -= sim.vy * sdt;
                sim.t += sdt;
                if (sim.y <= 0) { sim.y = 0; sim.landed = true; }
            }
            if (sim.trail.length === 0 || sim.t - (sim.trail._last || 0) > 0.08) {
                sim.trail.push(clamp(sim.y / Math.max(P.height, 0.001), 0, 1));
                sim.trail._last = sim.t;
                if (sim.trail.length > 60) sim.trail.shift();
            }
        }
    }

    var last = 0;
    function frame(ts) {
        if (!last) last = ts;
        var dt = Math.min(0.05, (ts - last) / 1000);
        last = ts;
        if (sim.playing) step(dt);
        draw();
        requestAnimationFrame(frame);
    }

    /* ============================================================
       이벤트
       ============================================================ */
    document.addEventListener('click', function (e) {
        var tab = e.target.closest ? e.target.closest('.scene-tab') : null;
        if (tab) {
            var sc = tab.getAttribute('data-scene');
            if (sc !== P.scene) {
                P.scene = sc;
                syncUI();
                resetSim();
                renderLog([{ ok: true, text: SCENE_INFO[sc].name + ' 실험으로 이동했습니다.' }]);
            }
            return;
        }
        var pr = e.target.closest ? e.target.closest('[data-preset]') : null;
        if (pr) {
            var text = pr.getAttribute('data-preset');
            $('prompt').value = text;
            runPrompt(text);
            return;
        }
    });

    document.addEventListener('input', function (e) {
        var r = e.target;
        if (r && r.type === 'range') {
            var key = r.getAttribute('data-key');
            P[key] = parseFloat(r.value);
            var def = findSlider(key);
            var el = $('val-' + key);
            if (el) el.textContent = P[key] + ' ' + (def ? def.unit : '');
            renderReadouts();
            renderMissions();
            renderCode();
            resetSim();
        }
    });

    $('runBtn').addEventListener('click', function () { runPrompt($('prompt').value); });
    $('clearPrompt').addEventListener('click', function () { $('prompt').value = ''; $('prompt').focus(); });
    $('prompt').addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); runPrompt($('prompt').value); }
    });
    $('playBtn').addEventListener('click', function () {
        sim.playing = !sim.playing;
        this.textContent = sim.playing ? '⏸ 일시정지' : '▶ 재생';
        this.classList.toggle('on', sim.playing);
    });
    $('resetBtn').addEventListener('click', function () { resetSim(); toast('🔄 처음 상태로 되돌렸습니다.'); });
    $('speed').addEventListener('change', function () { sim.speed = parseFloat(this.value); });

    $('copyBtn').addEventListener('click', function () {
        var text = genCode();
        function fallback() {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.cssText = 'position:fixed;left:-9999px;top:0';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); toast('📋 코드를 복사했습니다.'); }
            catch (err) { toast('복사가 막혀 있습니다. 코드를 직접 선택해 복사해 주세요.'); }
            document.body.removeChild(ta);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function () { toast('📋 코드를 복사했습니다.'); }, fallback);
        } else fallback();
    });

    /* 테마 */
    var themeBtn = $('themeBtn');
    function applyTheme(dark) {
        document.body.classList.toggle('dark-mode', dark);
        themeBtn.textContent = dark ? '☀️' : '🌙';
        themeBtn.title = dark ? '주간 모드 전환' : '야간 모드 전환';
        themeBtn.setAttribute('aria-label', themeBtn.title);
        draw();
    }
    themeBtn.addEventListener('click', function () {
        applyTheme(!document.body.classList.contains('dark-mode'));
    });

    /* 초기화 */
    window.addEventListener('resize', function () { resize(); draw(); });
    if (window.ResizeObserver) {
        try { new ResizeObserver(function () { resize(); draw(); }).observe(cv.parentElement); } catch (e) {}
    }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { draw(); });

    sim.speed = 1;
    resize();
    syncUI();
    resetSim();
    requestAnimationFrame(frame);
})();
</script>
<script>
/* ============ 전체화면 / 창모드 ============ */
(function () {
    'use strict';
    var docEl = document.documentElement;
    var btn = document.getElementById('fullscreenBtn');
    var icon = document.getElementById('fullscreenIcon');
    var text = document.getElementById('fullscreenText');

    function realFs() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement ||
                  document.mozFullScreenElement || document.msFullscreenElement);
    }
    function pseudo() { return docEl.classList.contains('pseudo-fs'); }
    function toast(msg) {
        var t = document.getElementById('ux-toast');
        if (!t) {
            t = document.createElement('div');
            t.id = 'ux-toast';
            t.style.cssText = 'position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);' +
                'background:rgba(16,22,36,.94);color:#fff;font-size:12px;line-height:1.4;padding:9px 14px;border-radius:14px;' +
                'z-index:9999;max-width:86vw;text-align:center;pointer-events:none;transition:opacity .3s;' +
                'font-family:inherit;box-shadow:0 8px 24px rgba(0,0,0,.25)';
            document.body.appendChild(t);
        }
        t.textContent = msg;
        t.style.opacity = '1';
        clearTimeout(t._t);
        t._t = setTimeout(function () { t.style.opacity = '0'; }, 2600);
    }
    function setUI() {
        var on = realFs() || pseudo();
        if (icon) icon.textContent = on ? '\uD83D\uDDD7' : '\u26F6';
        if (text) text.textContent = on ? '창모드' : '전체화면';
        if (btn) {
            btn.setAttribute('aria-label', on ? '창모드로 전환' : '전체화면으로 전환');
            btn.title = on ? '창모드로 전환' : '전체화면으로 전환';
        }
        document.body.classList.toggle('is-fullscreen', on);
        setTimeout(function () { try { window.dispatchEvent(new Event('resize')); } catch (e) {} }, 150);
    }
    if (btn) {
        btn.addEventListener('click', function () {
            if (realFs()) {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                return;
            }
            if (pseudo()) { docEl.classList.remove('pseudo-fs'); setUI(); return; }
            var req = docEl.requestFullscreen || docEl.webkitRequestFullscreen;
            if (req) {
                try {
                    var r = req.call(docEl);
                    if (r && typeof r.catch === 'function') r.catch(function () { docEl.classList.add('pseudo-fs'); setUI(); });
                } catch (err) { docEl.classList.add('pseudo-fs'); }
            } else {
                docEl.classList.add('pseudo-fs');
                try { window.scrollTo(0, 1); } catch (e) {}
                toast('이 브라우저는 전체화면을 지원하지 않아 상단 정보를 숨긴 몰입 모드로 표시합니다');
            }
            setUI();
        }, false);
    }
    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
        document.addEventListener(ev, setUI);
    });
    document.addEventListener('keydown', function (e) {
        if ((e.key === 'Escape' || e.key === 'Esc') && pseudo() && !realFs()) {
            docEl.classList.remove('pseudo-fs'); setUI();
        }
    });
    setUI();
})();
</script>
