<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>검전기 3D - visionOS / Apple HIG Style</title>
    <!-- Three.js 및 OrbitControls 3D 엔진 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        @font-face {
            font-family: 'SeoulNamsanL';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanL.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'SeoulNamsanL', -apple-system, sans-serif;
            background-color: #f2f2f7;
            color: #1c1c1e;
            touch-action: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            touch-action: none;
        }

        /* Apple visionOS Glassmorphic UI */
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            z-index: 10;
        }

        /* 좌측 상단 헤더 */
        .top-left-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            color: #1c1c1e;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tag-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
        }

        .tag-pill {
            background: rgba(0, 122, 255, 0.15);
            color: #007aff;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
        }

        /* 우측 상단 실시간 데이터 카드 */
        .top-right-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .data-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 20px;
        }

        .data-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .data-label {
            font-size: 11px;
            color: #8e8e93;
            font-weight: bold;
        }

        .data-value {
            font-size: 15px;
            font-weight: bold;
            color: #1c1c1e;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            transition: all 0.2s;
        }

        /* 중앙 안내 툴팁 */
        .center-tooltip {
            position: absolute;
            top: 12%;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 18px;
            font-size: 13px;
            color: #8e8e93;
            border-radius: 30px;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.5s ease;
        }

        /* 서브 조절 패널 */
        .sub-panel {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 20px;
            width: 320px;
            display: none;
            flex-direction: column;
            gap: 14px;
            z-index: 10;
        }

        .sub-panel.show { display: flex; }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: bold;
        }

        .btn-group {
            display: flex;
            gap: 6px;
        }

        .toggle-btn {
            padding: 6px 14px;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            background: rgba(255, 255, 255, 0.5);
            color: #1c1c1e;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .toggle-btn.active-neg {
            background: #ff3b30;
            color: white;
            border-color: #ff3b30;
        }
        .toggle-btn.active-pos {
            background: #007aff;
            color: white;
            border-color: #007aff;
        }

        /* 하단 제어 바 */
        .bottom-control-bar {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            z-index: 10;
        }

        .control-tab-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 14px;
            min-width: 68px;
            border-radius: 14px;
            border: none;
            background: transparent;
            color: #1c1c1e;
            font-size: 12px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-tab-btn.active {
            background: #007aff;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }

        /* 다크 모드 */
        body.dark-mode {
            background-color: #121212;
            color: #f2f2f7;
        }

        body.dark-mode .glass-panel {
            background: rgba(30, 30, 30, 0.75);
            border-color: rgba(255, 255, 255, 0.15);
            color: #f2f2f7;
        }

        body.dark-mode .data-value, body.dark-mode .back-btn {
            color: #f2f2f7;
        }

        body.dark-mode .icon-btn {
            background: rgba(40, 40, 40, 0.75);
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- 좌측 상단 헤더 -->
    <div class="top-left-bar">
        <a href="../index.html" class="glass-panel back-btn">
            <span>⬅</span> 메인
        </a>
        <div class="glass-panel tag-badge">
            <span>검전기 3D</span>
            <span class="tag-pill">visionOS</span>
        </div>
    </div>

    <!-- 우측 상단 실시간 데이터 패널 -->
    <div class="top-right-bar">
        <div class="glass-panel data-card">
            <div class="data-item">
                <span class="data-label">대전체 극성</span>
                <span class="data-value" id="val-rod-type" style="color:#ff3b30;">음전하 (-)</span>
            </div>
            <div class="data-item">
                <span class="data-label">대전체 거리</span>
                <span class="data-value" id="val-distance">1.20 m</span>
            </div>
            <div class="data-item">
                <span class="data-label">금속박 각도</span>
                <span class="data-value" id="val-leaf-angle" style="color:#007aff;">0.0°</span>
            </div>
            <div class="data-item">
                <span class="data-label">전하 비율 (+:-)</span>
                <span class="data-value" id="val-ratio" style="color:#34c759;">30 : 30 (중성)</span>
            </div>
        </div>
        <button class="icon-btn glass-panel" id="theme-toggle">🌙</button>
    </div>

    <!-- 중앙 안내 툴팁 -->
    <div class="glass-panel center-tooltip" id="guide-tooltip">
        ⚡ 대전체를 잡고 왼쪽/오른쪽으로 드래그하여 검전기에 접근시켜 보세요
    </div>

    <!-- 서브 물리 설정 패널 -->
    <div class="glass-panel sub-panel" id="physics-panel">
        <div class="control-row">
            <span>대전체 극성 선택</span>
            <div class="btn-group">
                <button class="toggle-btn active-neg" id="btn-neg">음전하 (-)</button>
                <button class="toggle-btn" id="btn-pos">양전하 (+)</button>
            </div>
        </div>
        <div class="control-row">
            <span>전하 입자 시각화</span>
            <div class="btn-group">
                <button class="toggle-btn active-pos" id="btn-toggle-particles">표시함</button>
            </div>
        </div>
    </div>

    <!-- 하단 제어 바 -->
    <div class="glass-panel bottom-control-bar">
        <button class="control-tab-btn" id="btn-toggle-physics">
            <span>⚙️</span>
            <span>물리 조절</span>
        </button>
        <button class="control-tab-btn" id="btn-reset">
            <span>🔄</span>
            <span>초기화</span>
        </button>
        <button class="control-tab-btn" id="btn-align">
            <span>📷</span>
            <span>시점정렬</span>
        </button>
    </div>

    <script>
        // --- 1. Three.js 기본 씬 & 카메라 연출 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf2f2f7);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0.2, 3.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.05;

        // --- 2. 조명 설정 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
        dirLight.position.set(2.5, 4, 3);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // --- 3. 바닥 및 원점 격자 스페이스 ---
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(20, 20),
            new THREE.MeshStandardMaterial({ color: 0xe5e5ea, roughness: 0.8 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.9;
        floor.receiveShadow = true;
        scene.add(floor);

        const gridHelper = new THREE.GridHelper(20, 20, 0xd1d1d6, 0xe5e5ea);
        gridHelper.position.y = -0.89;
        scene.add(gridHelper);

        // --- 4. 사진 모양의 3D 검전기(Flask Jar Electroscope) 메쉬 생성 ---
        const electroscopeGroup = new THREE.Group();

        // 약간 투명한 회색 금속 재질
        const transMetalMat = new THREE.MeshStandardMaterial({
            color: 0x8a8a93,
            metalness: 0.8,
            roughness: 0.2,
            transparent: true,
            opacity: 0.55
        });

        // (1) 상단 평평한 금속 원판
        const discMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.015, 32), transMetalMat);
        discMesh.position.y = 0.65;
        discMesh.castShadow = true;
        electroscopeGroup.add(discMesh);

        // (2) 중앙 금속 막대
        const rodMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.95, 16), transMetalMat);
        rodMesh.position.y = 0.15;
        rodMesh.castShadow = true;
        electroscopeGroup.add(rodMesh);

        // (3) 검은색 고무 마개
        const corkMat = new THREE.MeshStandardMaterial({ color: 0x1c1c1e, roughness: 0.7 });
        const corkMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.16, 0.18, 32), corkMat);
        corkMesh.position.y = 0.48;
        corkMesh.castShadow = true;
        electroscopeGroup.add(corkMesh);

        // (4) 사진과 같은 모양의 유리병 LatheGeometry
        const flaskPoints = [];
        flaskPoints.push(new THREE.Vector2(0.12, 0.48));
        flaskPoints.push(new THREE.Vector2(0.13, 0.40));
        flaskPoints.push(new THREE.Vector2(0.14, 0.30));
        flaskPoints.push(new THREE.Vector2(0.28, 0.10));
        flaskPoints.push(new THREE.Vector2(0.42, -0.15));
        flaskPoints.push(new THREE.Vector2(0.44, -0.38));
        flaskPoints.push(new THREE.Vector2(0.40, -0.42));
        flaskPoints.push(new THREE.Vector2(0.0, -0.42));

        const glassGeo = new THREE.LatheGeometry(flaskPoints, 48);
        const glassMat = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.22,
            roughness: 0.05,
            transmission: 0.95,
            thickness: 0.15
        });
        const glassMesh = new THREE.Mesh(glassGeo, glassMat);
        glassMesh.castShadow = true;
        electroscopeGroup.add(glassMesh);

        // (5) 금속박
        const leafGroupLeft = new THREE.Group();
        const leafGroupRight = new THREE.Group();

        const leafGeo = new THREE.BoxGeometry(0.06, 0.26, 0.003);
        leafGeo.translate(0, -0.13, 0);

        const leafLeft = new THREE.Mesh(leafGeo, transMetalMat);
        const leafRight = new THREE.Mesh(leafGeo, transMetalMat);

        leafGroupLeft.add(leafLeft);
        leafGroupRight.add(leafRight);

        leafGroupLeft.position.set(-0.015, -0.22, 0);
        leafGroupRight.position.set(0.015, -0.22, 0);

        electroscopeGroup.add(leafGroupLeft);
        electroscopeGroup.add(leafGroupRight);

        electroscopeGroup.position.set(0, -0.1, 0);
        scene.add(electroscopeGroup);

        // --- 5. 3D 대전체(Charged Rod) 생성 ---
        const chargedRodGroup = new THREE.Group();
        const rodBodyGeo = new THREE.CylinderGeometry(0.035, 0.035, 0.7, 24);
        rodBodyGeo.rotateZ(Math.PI / 2);

        let rodMat = new THREE.MeshStandardMaterial({ color: 0xff3b30, roughness: 0.3 });
        const chargedRodMesh = new THREE.Mesh(rodBodyGeo, rodMat);
        chargedRodMesh.castShadow = true;
        chargedRodGroup.add(chargedRodMesh);

        chargedRodGroup.position.set(1.0, 0.68, 0);
        scene.add(chargedRodGroup);

        // --- 6. 전하 입자 (1:1 중성, 균일 양전하, 자유 전자 열운동 연산) ---
        const particlesGroup = new THREE.Group();
        scene.add(particlesGroup);

        const TOTAL_PAIRS = 30;
        const posParticles = [];
        const negParticles = [];

        const posLocations = [];
        for (let i = 0; i < TOTAL_PAIRS; i++) {
            let x, y, z;
            if (i < 12) {
                const r = Math.sqrt(Math.random()) * 0.22;
                const theta = Math.random() * Math.PI * 2;
                x = Math.cos(theta) * r;
                y = 0.55;
                z = Math.sin(theta) * r;
            } else if (i < 22) {
                x = (Math.random() - 0.5) * 0.015;
                y = 0.44 - (i - 12) * 0.065;
                z = (Math.random() - 0.5) * 0.015;
            } else {
                const side = (i % 2 === 0) ? -1 : 1;
                x = side * 0.03;
                y = -0.24 - Math.random() * 0.18;
                z = (Math.random() - 0.5) * 0.015;
            }
            posLocations.push(new THREE.Vector3(x, y, z));
        }

        const posGeo = new THREE.SphereGeometry(0.014, 12, 12);
        const posMat = new THREE.MeshBasicMaterial({ color: 0xff2d55 });

        posLocations.forEach(loc => {
            const p = new THREE.Mesh(posGeo, posMat);
            p.position.copy(loc);
            particlesGroup.add(p);
            posParticles.push(p);
        });

        const negGeo = new THREE.SphereGeometry(0.014, 12, 12);
        const negMat = new THREE.MeshBasicMaterial({ color: 0x007aff });

        for (let i = 0; i < TOTAL_PAIRS; i++) {
            const p = new THREE.Mesh(negGeo, negMat);
            p.position.copy(posLocations[i]);
            particlesGroup.add(p);
            negParticles.push({
                mesh: p,
                basePos: posLocations[i].clone(),
                currentPos: posLocations[i].clone(),
                vx: (Math.random() - 0.5) * 0.002,
                vy: (Math.random() - 0.5) * 0.002,
                vz: (Math.random() - 0.5) * 0.002
            });
        }

        const rodChargeGroup = new THREE.Group();
        chargedRodGroup.add(rodChargeGroup);

        function updateRodParticles(polarity) {
            while (rodChargeGroup.children.length > 0) rodChargeGroup.remove(rodChargeGroup.children[0]);
            const mat = new THREE.MeshBasicMaterial({ color: polarity === 'neg' ? 0x007aff : 0xff2d55 });
            const geo = new THREE.SphereGeometry(0.012, 8, 8);

            for (let i = -0.3; i <= 0.3; i += 0.06) {
                const p1 = new THREE.Mesh(geo, mat);
                p1.position.set(i, 0.04, 0);
                const p2 = new THREE.Mesh(geo, mat);
                p2.position.set(i, -0.04, 0);
                rodChargeGroup.add(p1);
                rodChargeGroup.add(p2);
            }
        }
        updateRodParticles('neg');

        // --- 7. 표준 Pointer Event 기반 드래그 인터랙션 (단진자/용수철과 동일 방식) ---
        let currentPolarity = 'neg';
        let isDragging = false;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
        const planeIntersect = new THREE.Vector3();
        let dragOffset = new THREE.Vector3();

        function updateMousePos(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        }

        function onPointerDown(e) {
            updateMousePos(e);
            raycaster.setFromCamera(mouse, camera);
            
            const intersects = raycaster.intersectObjects(chargedRodGroup.children, true);

            if (intersects.length > 0) {
                isDragging = true;
                controls.enabled = false;
                
                if (raycaster.ray.intersectPlane(dragPlane, planeIntersect)) {
                    dragOffset.copy(chargedRodGroup.position).sub(planeIntersect);
                }

                const tooltip = document.getElementById('guide-tooltip');
                if (tooltip) tooltip.style.opacity = '0';
            }
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            updateMousePos(e);
            raycaster.setFromCamera(mouse, camera);
            
            if (raycaster.ray.intersectPlane(dragPlane, planeIntersect)) {
                let targetPos = planeIntersect.add(dragOffset);
                targetPos.x = Math.max(-1.6, Math.min(1.6, targetPos.x));
                targetPos.y = Math.max(-0.3, Math.min(1.1, targetPos.y));
                targetPos.z = 0;
                chargedRodGroup.position.copy(targetPos);
            }
        }

        function onPointerUp() {
            if (isDragging) {
                isDragging = false;
                controls.enabled = true;
            }
        }

        window.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);

        // --- 8. 물리 시뮬레이션 & 전하 이동 연산 루프 ---
        let targetLeafAngle = 0;
        let currentLeafAngle = 0;

        function updatePhysics() {
            const discWorldPos = new THREE.Vector3(0, 0.55, 0);
            const distance = chargedRodGroup.position.distanceTo(discWorldPos);

            let inductionFactor = Math.max(0, Math.min(1, (1.3 - distance) / 1.1));
            inductionFactor = Math.pow(inductionFactor, 1.8);

            targetLeafAngle = inductionFactor * (Math.PI / 4.0);
            currentLeafAngle += (targetLeafAngle - currentLeafAngle) * 0.1;

            leafGroupLeft.rotation.z = -currentLeafAngle;
            leafGroupRight.rotation.z = currentLeafAngle;

            const migrationShift = (currentPolarity === 'neg' ? -1 : 1) * inductionFactor * 0.52;

            negParticles.forEach((np) => {
                np.vx += (Math.random() - 0.5) * 0.0004;
                np.vy += (Math.random() - 0.5) * 0.0004;
                np.vx *= 0.92;
                np.vy *= 0.92;

                let targetY = np.basePos.y + migrationShift + np.vy;
                targetY = Math.max(-0.42, Math.min(0.56, targetY));

                np.currentPos.y += (targetY - np.currentPos.y) * 0.08;
                np.mesh.position.y = np.currentPos.y;

                if (np.currentPos.y < -0.22) {
                    const leafHeightRatio = (-0.22 - np.currentPos.y) / 0.2;
                    const side = np.basePos.x < 0 ? -1 : 1;
                    const spreadX = side * (0.015 + Math.sin(currentLeafAngle) * leafHeightRatio * 0.18) + np.vx;
                    np.mesh.position.x = spreadX;
                } else {
                    np.mesh.position.x = np.basePos.x + np.vx;
                }
            });

            document.getElementById('val-distance').innerText = distance.toFixed(2) + ' m';
            document.getElementById('val-leaf-angle').innerText = (currentLeafAngle * (180 / Math.PI)).toFixed(1) + '°';
        }

        // --- 9. 버튼 조작 이벤트 ---
        const btnTogglePhysics = document.getElementById('btn-toggle-physics');
        const physicsPanel = document.getElementById('physics-panel');
        btnTogglePhysics.addEventListener('click', () => {
            physicsPanel.classList.toggle('show');
            btnTogglePhysics.classList.toggle('active');
        });

        const btnNeg = document.getElementById('btn-neg');
        const btnPos = document.getElementById('btn-pos');
        const txtRodType = document.getElementById('val-rod-type');

        function setPolarity(pol) {
            currentPolarity = pol;
            if (pol === 'neg') {
                btnNeg.className = 'toggle-btn active-neg';
                btnPos.className = 'toggle-btn';
                txtRodType.innerText = '음전하 (-)';
                txtRodType.style.color = '#ff3b30';
                rodMat.color.setHex(0xff3b30);
            } else {
                btnNeg.className = 'toggle-btn';
                btnPos.className = 'toggle-btn active-pos';
                txtRodType.innerText = '양전하 (+)';
                txtRodType.style.color = '#007aff';
                rodMat.color.setHex(0x007aff);
            }
            updateRodParticles(pol);
        }

        btnNeg.addEventListener('click', () => setPolarity('neg'));
        btnPos.addEventListener('click', () => setPolarity('pos'));

        let showParticles = true;
        const btnToggleParticles = document.getElementById('btn-toggle-particles');
        btnToggleParticles.addEventListener('click', () => {
            showParticles = !showParticles;
            particlesGroup.visible = showParticles;
            btnToggleParticles.innerText = showParticles ? '표시함' : '숨김';
            btnToggleParticles.classList.toggle('active-pos', showParticles);
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            chargedRodGroup.position.set(1.0, 0.68, 0);
            setPolarity('neg');
        });

        document.getElementById('btn-align').addEventListener('click', () => {
            camera.position.set(0, 0.2, 3.2);
            controls.target.set(0, 0, 0);
        });

        document.getElementById('theme-toggle').addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            scene.background.setHex(isDark ? 0x121212 : 0xf2f2f7);
            floor.material.color.setHex(isDark ? 0x1c1c1e : 0xe5e5ea);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 10. 메인 애니메이션 루프 ---
        function animate() {
            requestAnimationFrame(animate);
            updatePhysics();
            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
