<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Science Virtual LAB 3D</title>
    <!-- Three.js 및 OrbitControls 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        @font-face {
            font-family: 'SeoulNamsan';
            src: local('SeoulNamsan M'), local('SeoulNamsanM'), local('서울남산체 M'),
                 url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'SeoulNamsan', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #05050d;
            color: #ffffff;
            touch-action: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* visionOS Glassmorphic UI */
        .glass-panel {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(25px) saturate(200%);
            -webkit-backdrop-filter: blur(25px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 22px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            z-index: 10;
        }

        /* Top Header */
        .top-header {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 30px;
            pointer-events: none;
            z-index: 10;
        }

        .header-title {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: -0.5px;
            margin: 0;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 122, 255, 0.6);
        }

        .header-subtitle {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            margin: 3px 0 0 0;
        }

        /* Central Guide Tooltip */
        .center-tooltip {
            position: absolute;
            top: 105px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 20px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.85);
            border-radius: 30px;
            pointer-events: none;
            z-index: 10;
            text-align: center;
        }

        /* Bottom Right Floating Switch Button */
        .bottom-right-bar {
            position: absolute;
            bottom: 25px;
            right: 25px;
            z-index: 20;
        }

        .mode-switch-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 22px;
            border-radius: 30px;
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: rgba(0, 122, 255, 0.35);
            border: 1px solid rgba(0, 122, 255, 0.6);
            box-shadow: 0 8px 25px rgba(0, 122, 255, 0.4);
        }

        .mode-switch-btn:hover {
            transform: scale(1.06) translateY(-2px);
            background: rgba(0, 122, 255, 0.6);
            box-shadow: 0 12px 30px rgba(0, 122, 255, 0.6);
        }

        /* Bottom Controls */
        .bottom-control-bar {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
            z-index: 10;
        }

        .control-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 16px;
            border: none;
            background: transparent;
            color: #ffffff;
            font-size: 13px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #64d2ff;
        }

                    { title: "행운의 추첨기", icon: "🎲", url: "labs/class/pickme.html" },
                    { title: "모둠 뽑기", icon: "🪑", url: "labs/class/group.html" }
                ]
            }
        ];

        // --- 2. 시작 시점 설정 (여기 값만 바꾸면 시작 각도 조절 가능) ---
        const START_CAM_POS = new THREE.Vector3(0, 3.6, 5.5);   // 카메라 위치 (높이, 뒤로 물러난 정도)
        const START_TARGET  = new THREE.Vector3(0, 1.5, 0);     // 바라보는 지점 (링 중심)

        // --- 3. Three.js 기본 씬 & 카메라 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x05050d, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.copy(START_CAM_POS);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = true;
        controls.minDistance = 0.5;
        controls.maxDistance = 14.0;
        controls.enablePan = false;
        controls.rotateSpeed = 0.5;
        controls.target.copy(START_TARGET);
        controls.update();

        // --- 4. 조명 ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.85));

        const dirLight = new THREE.DirectionalLight(0x64d2ff, 1.2);
        dirLight.position.set(10, 20, 15);
        scene.add(dirLight);

        // --- 5. 우주 배경 & 별 ---
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 2000;
        const starPositions = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount * 3; i++) {
            starPositions[i] = (Math.random() - 0.5) * 180;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.3, transparent: true, opacity: 0.8 });
        scene.add(new THREE.Points(starsGeo, starsMat));

        // --- 6. 발 밑 대형 지구 ---
        function createEarthTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#0b2545';
            ctx.fillRect(0, 0, 1024, 512);

            ctx.fillStyle = '#134074';
            for (let i = 0; i < 40; i++) {
                ctx.beginPath();
                ctx.arc(Math.random() * 1024, Math.random() * 512, Math.random() * 80 + 20, 0, Math.PI * 2);
                ctx.fill();
            }
            return new THREE.CanvasTexture(canvas);
        }

        const earthRadius = 25;
        const earth = new THREE.Mesh(
            new THREE.SphereGeometry(earthRadius, 64, 64),
            new THREE.MeshStandardMaterial({ map: createEarthTexture(), roughness: 0.6, metalness: 0.1 })
        );
        earth.position.set(0, -earthRadius - 2.0, 0);
        scene.add(earth);

        const atmosphere = new THREE.Mesh(
            new THREE.SphereGeometry(earthRadius + 0.3, 64, 64),
            new THREE.MeshBasicMaterial({ color: 0x007aff, transparent: true, opacity: 0.12, side: THREE.BackSide })
        );
        atmosphere.position.copy(earth.position);
        scene.add(atmosphere);

        // --- 7. 카드 텍스처 생성기 ---
        function createCardTexture(category, title, icon, colorHex) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 300;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
            ctx.roundRect(0, 0, 512, 300, 24);
            ctx.fill();

            ctx.fillStyle = colorHex;
            ctx.roundRect(0, 0, 512, 16, [24, 24, 0, 0]);
            ctx.fill();

            ctx.fillStyle = colorHex;
            ctx.font = 'bold 22px "SeoulNamsan", -apple-system, sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText(`• ${category}`, 30, 38);

            ctx.font = '76px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(icon, 256, 140);

            ctx.fillStyle = '#2c3e50';
            let fontSize = 30;
            if (title.length > 8) fontSize = 24;
            if (title.length > 12) fontSize = 20;
            ctx.font = `bold ${fontSize}px 'SeoulNamsan', -apple-system, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(title, 256, 235);

            return new THREE.CanvasTexture(canvas);
        }

        // --- 8. 원형 카드 배치 ---
        const cardsGroup = new THREE.Group();
        const cardMeshes = [];
        const orbitRadius = 8.0;

        const allLabs = [];
        labCategories.forEach(cat => {
            cat.labs.forEach(lab => {
                allLabs.push({
                    category: cat.category,
                    color: cat.color,
                    title: lab.title,
                    icon: lab.icon,
                    url: lab.url
                });
            });
        });

        const totalCards = allLabs.length;
        const angleStep = (Math.PI * 2) / totalCards;

        allLabs.forEach((lab, idx) => {
            const angle = idx * angleStep;
            const x = Math.sin(angle) * orbitRadius;
            const z = -Math.cos(angle) * orbitRadius;
            const baseY = 1.8;

            const cardMesh = new THREE.Mesh(
                new THREE.PlaneGeometry(2.0, 1.17),
                new THREE.MeshStandardMaterial({
                    map: createCardTexture(lab.category, lab.title, lab.icon, lab.color),
                    transparent: true,
                    opacity: 0.92,
                    roughness: 0.2,
                    side: THREE.DoubleSide
                })
            );
            cardMesh.position.set(x, baseY, z);
            cardMesh.lookAt(0, baseY, 0);

            cardMesh.userData = {
                url: lab.url,
                title: lab.title,
                baseY: baseY,
                targetY: baseY,
                targetScale: 1.0,
                currentScale: 1.0
            };

            cardsGroup.add(cardMesh);
            cardMeshes.push(cardMesh);
        });

        scene.add(cardsGroup);

        // 웹폰트 로드 후 카드 텍스처 갱신
        if (document.fonts) {
            document.fonts.ready.then(() => {
                cardMeshes.forEach((mesh, idx) => {
                    const lab = allLabs[idx];
                    mesh.material.map = createCardTexture(lab.category, lab.title, lab.icon, lab.color);
                    mesh.material.needsUpdate = true;
                });
            });
        }

        // --- 9. 마우스/터치 인터랙션 ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function onPointerMove(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(cardMeshes);

            cardMeshes.forEach(mesh => {
                mesh.userData.targetY = mesh.userData.baseY;
                mesh.userData.targetScale = 1.0;
            });

            if (intersects.length > 0) {
                const card = intersects[0].object;
                card.userData.targetY = card.userData.baseY + 0.35;
                card.userData.targetScale = 1.1;
                document.body.style.cursor = 'pointer';
            } else {
                document.body.style.cursor = 'default';
            }
        }

        // 클릭과 드래그 구분: 거의 움직이지 않고 손을 뗐을 때만 이동
        let downX = 0, downY = 0, downValid = false;

        window.addEventListener('pointerdown', (e) => {
            downValid = !(e.target.tagName === 'BUTTON' || e.target.tagName === 'A' || e.target.closest('.glass-panel'));
            downX = e.clientX;
            downY = e.clientY;
        });

        window.addEventListener('pointerup', (e) => {
            if (!downValid) return;
            downValid = false;
            if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return;   // 드래그였다면 무시

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(cardMeshes);

            if (intersects.length > 0) {
                const clickedCard = intersects[0].object;
                const targetUrl = clickedCard.userData.url;
                clickedCard.scale.set(1.2, 1.2, 1.2);
                setTimeout(() => { window.location.href = targetUrl; }, 200);
            }
        });

        window.addEventListener('pointermove', onPointerMove);

        // --- 10. 시점 정렬 ---
        document.getElementById('btn-align').addEventListener('click', () => {
            camera.position.copy(START_CAM_POS);
            controls.target.copy(START_TARGET);
            controls.update();
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 11. 애니메이션 루프 ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            earth.rotation.y += delta * 0.03;

            cardMeshes.forEach(mesh => {
                mesh.position.y += (mesh.userData.targetY - mesh.position.y) * 0.1;
                mesh.userData.currentScale += (mesh.userData.targetScale - mesh.userData.currentScale) * 0.1;
                const s = mesh.userData.currentScale;
                mesh.scale.set(s, s, s);
            });

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>

<script>
/* ============ 모바일 화면 재조정 + 전체화면 대체 동작 (자동 생성) ============ */
(function () {
    var docEl = document.documentElement;
    var btn = document.getElementById('fullscreenBtn');
    var icon = document.getElementById('fullscreenIcon');
    var text = document.getElementById('fullscreenText');

    function realFs() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement ||
                  document.mozFullScreenElement || document.msFullscreenElement);
    }
    function pseudo() { return docEl.classList.contains('pseudo-fs'); }
    function setUI() {
        var on = realFs() || pseudo();
        if (icon) icon.textContent = on ? '🗗' : '⛶';
        if (text) text.textContent = on ? '창모드' : '전체화면';
        if (btn) btn.setAttribute('aria-label', on ? '창모드로 전환' : '전체화면으로 전환');
        document.body.classList.toggle('is-fullscreen', on);
    }
    function toast(msg) {
        var t = document.getElementById('ux-toast');
        if (!t) {
            t = document.createElement('div');
            t.id = 'ux-toast';
            t.style.cssText = 'position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);' +
                'background:rgba(28,28,30,.88);color:#fff;font-size:12px;line-height:1.4;padding:9px 14px;border-radius:14px;' +
                'z-index:9999;max-width:86vw;text-align:center;pointer-events:none;transition:opacity .3s;' +
                'font-family:inherit;box-shadow:0 8px 24px rgba(0,0,0,.25)';
            document.body.appendChild(t);
        }
        t.textContent = msg;
        t.style.opacity = '1';
        clearTimeout(t._t);
        t._t = setTimeout(function () { t.style.opacity = '0'; }, 2600);
    }

    if (btn) {
        btn.addEventListener('click', function () {
            var wasReal = realFs();
            var wasPseudo = pseudo();
            setTimeout(function () {
                if (wasReal) { setUI(); return; }          // 진짜 전체화면에서 나온 경우
                if (wasPseudo) { docEl.classList.remove('pseudo-fs'); setUI(); return; }  // 몰입 모드 해제
                if (!realFs()) {                            // 전체화면 API가 동작하지 않는 환경
                    docEl.classList.add('pseudo-fs');
                    try { window.scrollTo(0, 1); } catch (e) {}
                    toast('이 브라우저는 전체화면을 지원하지 않아 상단 정보를 숨긴 몰입 모드로 표시합니다');
                }
                setUI();
            }, 380);
        }, false);
    }
    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
        document.addEventListener(ev, setUI);
    });

    /* 좁은 화면에서는 3D 장면이 잘리지 않도록 시야각을 넓혀 전체가 들어오게 한다 */
    function mobileFit() {
        try {
            if (typeof camera === 'undefined' || !camera || !camera.isPerspectiveCamera) return;
            if (!camera.userData) camera.userData = {};
            if (!camera.userData.baseFov) camera.userData.baseFov = camera.fov;
            var w = window.innerWidth, h = window.innerHeight, f = 1;
            var k = 0.62;
            var attr = document.documentElement.getAttribute('data-mzoom');
            if (attr) { var v = parseFloat(attr); if (!isNaN(v) && v > 0) k = v; }
            if (w < h) f = 1 + (1 - w / h) * k;
            else if (h <= 500) f = 1 + k * 0.16;
            camera.fov = Math.min(88, camera.userData.baseFov * f);
            camera.updateProjectionMatrix();
        } catch (e) {}
    }
    mobileFit();

    /* 화면 회전·주소창 변화·전체화면 전환 후 렌더러 크기 재계산 */
    var rt = null;
    function refit() {
        clearTimeout(rt);
        rt = setTimeout(function () {
            mobileFit();
            try { window.dispatchEvent(new Event('resize')); } catch (e) {}
        }, 240);
    }
    window.addEventListener('orientationchange', refit);
    window.addEventListener('pageshow', refit);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) refit(); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', refit);

    setUI();
})();
</script>
