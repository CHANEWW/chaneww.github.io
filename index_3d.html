<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Science Virtual LAB 3D</title>
    <!-- Three.js 및 OrbitControls 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        @font-face {
            font-family: 'SeoulNamsan';
            src: local('SeoulNamsan M'), local('SeoulNamsanM'), local('서울남산체 M'),
                 url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'SeoulNamsan', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #05050d;
            color: #ffffff;
            touch-action: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* visionOS Glassmorphic UI */
        .glass-panel {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(25px) saturate(200%);
            -webkit-backdrop-filter: blur(25px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 22px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            z-index: 10;
        }

        /* Top Header */
        .top-header {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 30px;
            pointer-events: none;
            z-index: 10;
        }

        .header-title {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: -0.5px;
            margin: 0;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 122, 255, 0.6);
        }

        .header-subtitle {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            margin: 3px 0 0 0;
        }

        /* Central Guide Tooltip */
        .center-tooltip {
            position: absolute;
            top: 105px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 20px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.85);
            border-radius: 30px;
            pointer-events: none;
            z-index: 10;
            text-align: center;
        }

        /* Bottom Right Floating Switch Button */
        .bottom-right-bar {
            position: absolute;
            bottom: 25px;
            right: 25px;
            z-index: 20;
        }

        .mode-switch-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 22px;
            border-radius: 30px;
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: rgba(0, 122, 255, 0.35);
            border: 1px solid rgba(0, 122, 255, 0.6);
            box-shadow: 0 8px 25px rgba(0, 122, 255, 0.4);
        }

        .mode-switch-btn:hover {
            transform: scale(1.06) translateY(-2px);
            background: rgba(0, 122, 255, 0.6);
            box-shadow: 0 12px 30px rgba(0, 122, 255, 0.6);
        }

        /* Bottom Controls */
        .bottom-control-bar {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
            z-index: 10;
        }

        .control-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 16px;
            border: none;
            background: transparent;
            color: #ffffff;
            font-size: 13px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #64d2ff;
        }

/* ============================================================
   모바일 반응형 보정 (세로/가로) — 자동 생성 블록

html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

/* ---------- 모바일 세로 (폭 900px 이하) ---------- */

    .icon-btn { width: 34px !important; height: 34px !important; min-width: 34px; font-size: 15px !important; flex: 0 0 auto; }

    /* 전체화면: 1행 우측 아이콘 버튼 (글자는 숨김) */
    .bottom-right-bar {

    /* 안내 문구 */
    .center-tooltip, #guide-tooltip {
        top: calc(max(8px, env(safe-area-inset-top)) + 88px) !important;
        left: 8px !important;
        right: 8px !important;
        transform: none !important;

        width: auto !important;

        line-height: 1.45;

    }

    /* 하단 컨트롤 바: 화면 폭 전체, 한 줄 유지 */
    .bottom-control-bar {
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        transform: none !important;

        padding: 6px 6px calc(6px + env(safe-area-inset-bottom)) !important;
        gap: 2px !important;
        justify-content: space-around !important;
        flex-wrap: nowrap !important;

    }
    .control-tab-btn {

    /* 슬라이더 등 서브 패널 */

    input[type="range"] { height: 22px; }

    /* 팝업(모달)이 화면을 넘지 않도록 */
    .modal-overlay { padding: 12px !important; align-items: center !important; }
    .modal-card {
        max-height: 88vh !important;
        overflow-y: auto !important;

    <!-- Top Header -->

    </div>

    <div class="glass-panel center-tooltip">

        const labCategories = [

                    { title: "호흡 운동의 원리", icon: "🫁", url: "labs/biology/breathingexercise.html" },
                    { title: "광합성과 호흡", icon: "🍃", url: "labs/biology/photosynthesis.html" },
                    { title: "소화계 탐험과 영양소 검출", icon: "🍽️", url: "labs/biology/digestion.html" },
                    { title: "자극과 반응", icon: "⚡", url: "labs/biology/sar.html" }

                labs: [
                    { title: "교실 자리 배치", icon: "▦", url: "labs/class/classseat.html" },
                    { title: "행운의 추첨기", icon: "🎲", url: "labs/class/pickme.html" },
                    { title: "모둠 뽑기", icon: "🪑", url: "labs/class/group.html" }
                ]
            }
        ];

        // --- 2. 시작 시점 설정 (여기 값만 바꾸면 시작 각도 조절 가능) ---
        const START_TARGET  = new THREE.Vector3(0, 2.5, 0);     // 바라보는 지점 (4개 층의 중앙 높이)
        // 화면이 좁은 세로 모드(폰)에서는 카드가 작아 보이지 않도록 시작 위치를 살짝 당긴다
        function startCameraPos() {
            return window.innerWidth < 700
                ? new THREE.Vector3(0, 3.2, 4.4)
                : new THREE.Vector3(0, 4.0, 5.8);
        }
        const START_CAM_POS = startCameraPos();   // 카메라 위치 (높이, 뒤로 물러난 정도)

        // --- 3. Three.js 기본 씬 & 카메라 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x05050d, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.copy(START_CAM_POS);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = true;
        controls.minDistance = 2.5;      // 카드에 파고들지 않을 만큼만 가까이
        controls.maxDistance = 26.0;     // 4개 층 전체를 한눈에 볼 수 있을 만큼 멀리
        controls.minPolarAngle = 0.18;   // 천장 위로 넘어가지 않게
        controls.maxPolarAngle = Math.PI * 0.72;  // 층 아래(지구 안쪽)로 내려가지 않게
        controls.enablePan = false;
        controls.target.copy(START_TARGET);
        controls.update();

        // 층 이동 / 시점 정렬 시 부드럽게 카메라를 옮기기 위한 상태
        let camTween = null;

        // --- 좌우 드래그/스와이프 방향 반전 ---
        // 이 버전의 OrbitControls는 rotateLeft를 외부에 공개하지 않으므로,
        // 기본 회전 속도를 0으로 두고 회전을 직접 처리해 좌우 방향만 뒤집는다(카드를 손으로 미는 캐러셀 감각).
        //  - 수평: 기존과 반대 방향
        //  - 수직: 기존과 동일(자연스러운 틸트)
        controls.rotateSpeed = 0;
        const ROTATE_SPEED = 0.55;
        const activePointers = new Map();
        const rotSpherical = new THREE.Spherical();
        const rotOffset = new THREE.Vector3();

        function rotateView(dx, dy) {
            rotOffset.copy(camera.position).sub(controls.target);
            rotSpherical.setFromVector3(rotOffset);
            const k = (2 * Math.PI / renderer.domElement.clientHeight) * ROTATE_SPEED;
            rotSpherical.theta += dx * k;   // 기본(-=)과 반대
            rotSpherical.phi -= dy * k;     // 상하는 기존 그대로
            rotSpherical.phi = Math.max(controls.minPolarAngle, Math.min(controls.maxPolarAngle, rotSpherical.phi));
            rotSpherical.makeSafe();
            rotOffset.setFromSpherical(rotSpherical);
            camera.position.copy(controls.target).add(rotOffset);
            camera.lookAt(controls.target);
        }

        renderer.domElement.addEventListener('pointerdown', (e) => {
            activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        });

        renderer.domElement.addEventListener('pointermove', (e) => {
            const prev = activePointers.get(e.pointerId);
            if (!prev) return;
            if (activePointers.size !== 1) {   // 두 손가락(핀치 줌) 중에는 회전하지 않음
                prev.x = e.clientX;
                prev.y = e.clientY;
                return;
            }
            rotateView(e.clientX - prev.x, e.clientY - prev.y);
            prev.x = e.clientX;
            prev.y = e.clientY;
        });

        ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => {
            renderer.domElement.addEventListener(ev, (e) => activePointers.delete(e.pointerId));
        });

        // --- 4. 조명 ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.85));

        const dirLight = new THREE.DirectionalLight(0x64d2ff, 1.2);
        dirLight.position.set(10, 20, 15);
        scene.add(dirLight);

        // --- 5. 우주 배경 & 별 ---
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 2000;
        const starPositions = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount * 3; i++) {
            starPositions[i] = (Math.random() - 0.5) * 180;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.3, transparent: true, opacity: 0.8 });
        scene.add(new THREE.Points(starsGeo, starsMat));

        // --- 6. 발 밑 대형 지구 ---
        function createEarthTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#0b2545';
            ctx.fillRect(0, 0, 1024, 512);

            ctx.fillStyle = '#134074';
            for (let i = 0; i < 40; i++) {
                ctx.beginPath();
                ctx.arc(Math.random() * 1024, Math.random() * 512, Math.random() * 80 + 20, 0, Math.PI * 2);
                ctx.fill();
            }
            return new THREE.CanvasTexture(canvas);
        }

        const earthRadius = 25;
        const earth = new THREE.Mesh(
            new THREE.SphereGeometry(earthRadius, 64, 64),
            new THREE.MeshStandardMaterial({ map: createEarthTexture(), roughness: 0.6, metalness: 0.1 })
        );
        earth.position.set(0, -earthRadius - 2.0, 0);
        scene.add(earth);

        const atmosphere = new THREE.Mesh(
            new THREE.SphereGeometry(earthRadius + 0.3, 64, 64),
            new THREE.MeshBasicMaterial({ color: 0x007aff, transparent: true, opacity: 0.12, side: THREE.BackSide })
        );
        atmosphere.position.copy(earth.position);
        scene.add(atmosphere);

        // --- 7. 카드 텍스처 생성기 ---
        function createCardTexture(category, title, icon, colorHex) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 300;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
            ctx.roundRect(0, 0, 512, 300, 24);
            ctx.fill();

            ctx.fillStyle = colorHex;
            ctx.roundRect(0, 0, 512, 16, [24, 24, 0, 0]);
            ctx.fill();

            ctx.fillStyle = colorHex;
            ctx.font = 'bold 22px "SeoulNamsan", -apple-system, sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText(`• ${category}`, 30, 38);

            ctx.font = '76px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(icon, 256, 140);

            ctx.fillStyle = '#2c3e50';
            let fontSize = 30;
            if (title.length > 8) fontSize = 24;
            if (title.length > 12) fontSize = 20;
            ctx.font = `bold ${fontSize}px 'SeoulNamsan', -apple-system, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(title, 256, 235);

            return new THREE.CanvasTexture(canvas);
        }

        // --- 8. 다층(1F~4F) 카드 배치 ---
        const cardsGroup = new THREE.Group();
        const cardMeshes = [];
        const orbitRadius = 8.0;
        const CARD_W = 2.0;
        const CARD_H = 1.17;

        // 층 정의
        //  deckY    : 층 바닥(가이드 링) 높이
        //  angleOffset : 위층 카드가 아래층 카드를 완전히 가리지 않게 층마다 각도를 비트는 값(지그재그)
        //  count    : 층별 카드 수 (총 41개 = 11 + 10 + 10 + 10)
        const FLOORS = [
            { label: '1F', deckY: -0.8, color: 0x22d3ee, count: 11, angleOffset: 0.00 },
            { label: '2F', deckY:  1.0, color: 0x7c5cff, count: 10, angleOffset: 0.17 },
            { label: '3F', deckY:  2.8, color: 0xff2d95, count: 10, angleOffset: 0.34 },
            { label: '4F', deckY:  4.6, color: 0xffd60a, count: 10, angleOffset: 0.51 }
        ];
        const CARD_LIFT = CARD_H / 2 + 0.06;   // 층 바닥 위에 카드를 세웠을 때의 중심 높이

        const allLabs = [];
        labCategories.forEach(cat => {
            cat.labs.forEach(lab => {
                allLabs.push({
                    category: cat.category,
                    color: cat.color,
                    title: lab.title,
                    icon: lab.icon,
                    url: lab.url
                });
            });
        });

        const totalCards = allLabs.length;

        // 층별 카드 수 (총 카드 수와 다르면 마지막 층에서 자동 보정)
        const floorCounts = FLOORS.map(f => f.count);
        const countSum = floorCounts.reduce((a, b) => a + b, 0);
        if (countSum !== totalCards) floorCounts[floorCounts.length - 1] += totalCards - countSum;

        // 카테고리 순서를 유지한 채 1층부터 차곡차곡 나눈다
        const floorOfLab = [];
        let cursor = 0;
        floorCounts.forEach((n, fi) => {
            for (let i = 0; i < n && cursor < totalCards; i++, cursor++) floorOfLab[cursor] = fi;
        });
        while (cursor < totalCards) { floorOfLab[cursor] = FLOORS.length - 1; cursor++; }

        const floorSlot = FLOORS.map(() => 0);

        // 앞/뒤 양면 카드용 지오메트리 (안쪽에서도, 바깥에서도 글자가 바로 읽히도록 앞뒤로 한 장씩 붙인다)
        const cardFrontGeo = new THREE.PlaneGeometry(CARD_W, CARD_H);
        const cardBackGeo = new THREE.PlaneGeometry(CARD_W, CARD_H);

        allLabs.forEach((lab, idx) => {
            const fi = floorOfLab[idx];
            const floor = FLOORS[fi];
            const n = Math.max(1, floorCounts[fi]);
            const slot = floorSlot[fi]++;

            // 같은 층 카드는 원 둘레에 고르게(호 길이 약 4.6) 떨어지게 배치 -> 카드(폭 2.0)끼리 겹치지 않음
            const angle = floor.angleOffset + (slot + 0.5) * (Math.PI * 2) / n;
            const x = Math.sin(angle) * orbitRadius;
            const z = -Math.cos(angle) * orbitRadius;
            const baseY = floor.deckY + CARD_LIFT;

            const cardMaterial = new THREE.MeshStandardMaterial({
                map: createCardTexture(lab.category, lab.title, lab.icon, lab.color),
                transparent: true,
                opacity: 1.0,          // 카드가 커진 만큼 뒤 배경이 비쳐 보이지 않게 불투명하게
                roughness: 0.2,
                side: THREE.FrontSide
            });

            const cardGroup = new THREE.Group();
            const frontFace = new THREE.Mesh(cardFrontGeo, cardMaterial);
            const backFace = new THREE.Mesh(cardBackGeo, cardMaterial);
            backFace.rotation.y = Math.PI;      // 바깥을 바라보는 면
            backFace.position.z = -0.004;       // 앞면과의 z-파이팅 방지
            frontFace.userData.card = cardGroup;
            backFace.userData.card = cardGroup;
            cardGroup.add(frontFace);
            cardGroup.add(backFace);

            cardGroup.position.set(x, baseY, z);
            cardGroup.lookAt(0, baseY, 0);

            cardGroup.userData = {
                url: lab.url,
                title: lab.title,
                floor: fi,
                angle: angle,
                baseY: baseY,
                targetY: baseY,
                targetScale: 1.0,
                currentScale: 1.0,
                material: cardMaterial
            };

            cardsGroup.add(cardGroup);
            cardMeshes.push(cardGroup);
        });

        scene.add(cardsGroup);

        // --- 8-1. 층 느낌: 은은하게 빛나는 가이드 링 + 네온 층 표시(1F~4F) ---
        const deckGroup = new THREE.Group();
        const floorRings = [];

        function createFloorLabelSprite(floor) {
            const c = document.createElement('canvas');
            c.width = 256;
            c.height = 128;
            const ctx = c.getContext('2d');
            const css = '#' + floor.color.toString(16).padStart(6, '0');

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = css;
            ctx.shadowBlur = 26;
            ctx.fillStyle = css;
            ctx.font = 'bold 80px "SeoulNamsan", -apple-system, sans-serif';
            ctx.fillText(floor.label, 128, 56);

            // 아래쪽 가는 밑줄 장식
            ctx.shadowBlur = 14;
            ctx.strokeStyle = css;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(92, 104);
            ctx.lineTo(164, 104);
            ctx.stroke();

            const tex = new THREE.CanvasTexture(c);
            tex.anisotropy = 4;
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
                map: tex,
                transparent: true,
                depthWrite: false,
                opacity: 0.95,
                sizeAttenuation: false   // 거리와 상관없이 화면에서 같은 크기로 보이게(가까이 와도 커지지 않음)
            }));
            sprite.scale.set(0.07, 0.035, 1);
            return sprite;
        }

        FLOORS.forEach((floor, fi) => {
            // 바깥 테두리 링 (네온)
            const ringMesh = new THREE.Mesh(
                new THREE.TorusGeometry(orbitRadius, 0.035, 8, 180),
                new THREE.MeshBasicMaterial({
                    color: floor.color,
                    transparent: true,
                    opacity: 0.9,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                })
            );
            ringMesh.rotation.x = Math.PI / 2;
            ringMesh.position.y = floor.deckY;
            deckGroup.add(ringMesh);

            // 안쪽 보조 링
            const haloMesh = new THREE.Mesh(
                new THREE.TorusGeometry(orbitRadius - 0.3, 0.012, 6, 160),
                new THREE.MeshBasicMaterial({
                    color: floor.color,
                    transparent: true,
                    opacity: 0.3,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                })
            );
            haloMesh.rotation.x = Math.PI / 2;
            haloMesh.position.y = floor.deckY;
            deckGroup.add(haloMesh);

            // 층 바닥면 (아주 옅은 발판 느낌)
            const discMesh = new THREE.Mesh(
                new THREE.CircleGeometry(orbitRadius - 0.3, 96),
                new THREE.MeshBasicMaterial({
                    color: floor.color,
                    transparent: true,
                    opacity: 0.022,
                    side: THREE.DoubleSide,
                    depthWrite: false
                })
            );
            discMesh.rotation.x = -Math.PI / 2;
            discMesh.position.y = floor.deckY + 0.002;
            deckGroup.add(discMesh);

            floorRings.push({ ring: ringMesh, halo: haloMesh, disc: discMesh });

            // 층 테두리 네 곳에 층 번호(1F~4F)를 달아 어느 방향에서 돌아봐도 읽히게 스프라이트로 배치
            [0, Math.PI / 2, Math.PI, Math.PI * 1.5].forEach(a => {
                const label = createFloorLabelSprite(floor);
                label.position.set(
                    Math.sin(a) * (orbitRadius + 0.45),
                    floor.deckY - 0.3,
                    -Math.cos(a) * (orbitRadius + 0.45)
                );
                deckGroup.add(label);
            });
        });

        scene.add(deckGroup);

        // 웹폰트 로드 후 카드 텍스처 갱신
        if (document.fonts) {
            document.fonts.ready.then(() => {
                cardMeshes.forEach((card, idx) => {
                    const lab = allLabs[idx];
                    const mat = card.userData.material;
                    if (!lab || !mat) return;
                    mat.map = createCardTexture(lab.category, lab.title, lab.icon, lab.color);
                    mat.needsUpdate = true;
                });
            });
        }

        // --- 9. 마우스/터치 인터랙션 ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function onPointerMove(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(cardsGroup.children, true);

            cardMeshes.forEach(mesh => {
                mesh.userData.targetY = mesh.userData.baseY;
                mesh.userData.targetScale = 1.0;
            });

            if (intersects.length > 0) {
                const card = intersects[0].object.userData.card;
                card.userData.targetY = card.userData.baseY + 0.14;   // 살짝만 떠오르게(카드가 커서 클릭 지점이 벗어나지 않도록)
                card.userData.targetScale = 1.1;
                document.body.style.cursor = 'pointer';
            } else {
                document.body.style.cursor = 'default';
            }
        }

        // 클릭과 드래그 구분: 거의 움직이지 않고 손을 뗐을 때만 이동
        let downX = 0, downY = 0, downValid = false;

        window.addEventListener('pointerdown', (e) => {
            // 사용자가 직접 잡으면 진행 중인 카메라 이동은 멈춘다
            if (camTween && !(e.target.closest && e.target.closest('.glass-panel'))) camTween = null;
            downValid = !(e.target.tagName === 'BUTTON' || e.target.tagName === 'A' || e.target.closest('.glass-panel'));
            downX = e.clientX;
            downY = e.clientY;
        });

        window.addEventListener('pointerup', (e) => {
            if (!downValid) return;
            downValid = false;
            if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return;   // 드래그였다면 무시

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(cardsGroup.children, true);

            if (intersects.length > 0) {
                const clickedCard = intersects[0].object.userData.card;
                const targetUrl = clickedCard.userData.url;
                clickedCard.scale.set(1.2, 1.2, 1.2);
                setTimeout(() => { window.location.href = targetUrl; }, 200);
            }
        });

        window.addEventListener('pointermove', onPointerMove);

        // --- 10. 시점 정렬 & 층별 이동(1F~4F) ---
        function flyTo(pos, target, dur) {
            camTween = {
                t0: performance.now(),
                dur: dur || 900,
                fromPos: camera.position.clone(),
                toPos: pos.clone(),
                fromTgt: controls.target.clone(),
                toTgt: target.clone()
            };
        }

        const floorButtons = Array.prototype.slice.call(document.querySelectorAll('.floor-btn'));

        function setActiveFloor(fi) {
            floorButtons.forEach(btn => {
                btn.classList.toggle('active', Number(btn.dataset.floor) === fi);
            });
        }

        // 해당 층의 카드가 눈높이에 오도록, 지금 보고 있는 방위는 유지한 채로 이동
        function focusFloor(fi) {
            const floor = FLOORS[fi];
            if (!floor) return;
            const targetY = floor.deckY + CARD_LIFT;
            const az = Math.atan2(camera.position.x - controls.target.x, camera.position.z - controls.target.z);
            const distance = 11.8;
            const pos = new THREE.Vector3(
                Math.sin(az) * distance,
                targetY + 1.15,
                Math.cos(az) * distance
            );
            flyTo(pos, new THREE.Vector3(0, targetY, 0), 900);
            setActiveFloor(fi);
        }

        document.getElementById('btn-align').addEventListener('click', () => {
            flyTo(startCameraPos(), START_TARGET, 900);
            setActiveFloor(-1);
        });

        floorButtons.forEach(btn => {
            btn.addEventListener('click', () => focusFloor(Number(btn.dataset.floor)));
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 11. 애니메이션 루프 ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const elapsed = clock.elapsedTime;

            earth.rotation.y += delta * 0.03;

            // 층 가이드 링이 은은하게 명멸
            floorRings.forEach((r, i) => {
                const pulse = 0.5 + 0.5 * Math.sin(elapsed * 1.1 + i * 0.9);
                r.ring.material.opacity = 0.55 + pulse * 0.35;
                r.halo.material.opacity = 0.14 + pulse * 0.22;
                r.disc.material.opacity = 0.018 + pulse * 0.012;
            });

            // 층 이동 / 시점 정렬 부드러운 카메라 보간
            if (camTween) {
                const p = Math.min(1, (performance.now() - camTween.t0) / camTween.dur);
                const k = p < 0.5 ? 2 * p * p : -1 + (4 - 2 * p) * p;   // easeInOutQuad
                camera.position.lerpVectors(camTween.fromPos, camTween.toPos, k);
                controls.target.lerpVectors(camTween.fromTgt, camTween.toTgt, k);
                if (p >= 1) camTween = null;
            }

            cardMeshes.forEach(mesh => {
                mesh.position.y += (mesh.userData.targetY - mesh.position.y) * 0.1;
                mesh.userData.currentScale += (mesh.userData.targetScale - mesh.userData.currentScale) * 0.1;
                const s = mesh.userData.currentScale;
                mesh.scale.set(s, s, s);
            });

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>

<script>
/* ============ 모바일 화면 재조정 + 전체화면 대체 동작 (자동 생성) ============ */
(function () {
    var docEl = document.documentElement;
    var btn = document.getElementById('fullscreenBtn');
    var icon = document.getElementById('fullscreenIcon');
    var text = document.getElementById('fullscreenText');

    function realFs() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement ||
                  document.mozFullScreenElement || document.msFullscreenElement);
    }
    function pseudo() { return docEl.classList.contains('pseudo-fs'); }
    function setUI() {
        var on = realFs() || pseudo();
        if (icon) icon.textContent = on ? '🗗' : '⛶';
        if (text) text.textContent = on ? '창모드' : '전체화면';
        if (btn) btn.setAttribute('aria-label', on ? '창모드로 전환' : '전체화면으로 전환');
        document.body.classList.toggle('is-fullscreen', on);
    }
    function toast(msg) {
        var t = document.getElementById('ux-toast');
        if (!t) {
            t = document.createElement('div');
            t.id = 'ux-toast';
            t.style.cssText = 'position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);' +
                'background:rgba(28,28,30,.88);color:#fff;font-size:12px;line-height:1.4;padding:9px 14px;border-radius:14px;' +
                'z-index:9999;max-width:86vw;text-align:center;pointer-events:none;transition:opacity .3s;' +
                'font-family:inherit;box-shadow:0 8px 24px rgba(0,0,0,.25)';
            document.body.appendChild(t);
        }
        t.textContent = msg;
        t.style.opacity = '1';
        clearTimeout(t._t);
        t._t = setTimeout(function () { t.style.opacity = '0'; }, 2600);
    }

    if (btn) {
        btn.addEventListener('click', function () {
            var wasReal = realFs();
            var wasPseudo = pseudo();
            setTimeout(function () {
                if (wasReal) { setUI(); return; }          // 진짜 전체화면에서 나온 경우
                if (wasPseudo) { docEl.classList.remove('pseudo-fs'); setUI(); return; }  // 몰입 모드 해제
                if (!realFs()) {                            // 전체화면 API가 동작하지 않는 환경
                    docEl.classList.add('pseudo-fs');
                    try { window.scrollTo(0, 1); } catch (e) {}
                    toast('이 브라우저는 전체화면을 지원하지 않아 상단 정보를 숨긴 몰입 모드로 표시합니다');
                }
                setUI();
            }, 380);
        }, false);
    }
    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
        document.addEventListener(ev, setUI);
    });

    /* 좁은 화면에서는 3D 장면이 잘리지 않도록 시야각을 넓혀 전체가 들어오게 한다 */
    function mobileFit() {
        try {
            if (typeof camera === 'undefined' || !camera || !camera.isPerspectiveCamera) return;
            if (!camera.userData) camera.userData = {};
            if (!camera.userData.baseFov) camera.userData.baseFov = camera.fov;
            var w = window.innerWidth, h = window.innerHeight, f = 1;
            var k = 0.62;
            var attr = document.documentElement.getAttribute('data-mzoom');
            if (attr) { var v = parseFloat(attr); if (!isNaN(v) && v > 0) k = v; }
            if (w < h) f = 1 + (1 - w / h) * k;
            else if (h <= 500) f = 1 + k * 0.16;
            camera.fov = Math.min(88, camera.userData.baseFov * f);
            camera.updateProjectionMatrix();
        } catch (e) {}
    }
    mobileFit();

    /* 화면 회전·주소창 변화·전체화면 전환 후 렌더러 크기 재계산 */
    var rt = null;
    function refit() {
        clearTimeout(rt);
        rt = setTimeout(function () {
            mobileFit();
            try { window.dispatchEvent(new Event('resize')); } catch (e) {}
        }, 240);
    }
    window.addEventListener('orientationchange', refit);
    window.addEventListener('pageshow', refit);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) refit(); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', refit);

    setUI();
})();
</script>
