<!DOCTYPE html>
<html lang="ko" data-mzoom="0.3">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Science Virtual LAB 3D</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <!-- Three.js 및 OrbitControls 라이브러리 -->
    <script src="labs/common/lib/three.min.js"></script>
    <script src="labs/common/lib/OrbitControls.js"></script>
    <style>
        @font-face {
            font-family: 'SeoulNamsan';
            src: local('SeoulNamsan M'), local('SeoulNamsanM'), local('서울남산체 M'),
                 url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'SeoulNamsan', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #05050d;
            color: #ffffff;
            touch-action: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* visionOS Glassmorphic UI */
        .glass-panel {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(25px) saturate(200%);
            -webkit-backdrop-filter: blur(25px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 22px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            z-index: 10;
        }

        /* Top Header */
        .top-header {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 30px;
            pointer-events: none;
            z-index: 10;
        }

        .header-title {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: -0.5px;
            margin: 0;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 122, 255, 0.6);
        }

        .header-subtitle {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            margin: 3px 0 0 0;
        }

        /* Central Guide Tooltip */
        .center-tooltip {
            position: absolute;
            top: 105px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 20px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.85);
            border-radius: 30px;
            pointer-events: none;
            z-index: 10;
            text-align: center;
        }

        /* Bottom Right Floating Switch Button */
        .bottom-right-bar {
            position: absolute;
            bottom: 25px;
            right: 25px;
            z-index: 20;
        }

        .mode-switch-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 22px;
            border-radius: 30px;
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: rgba(0, 122, 255, 0.35);
            border: 1px solid rgba(0, 122, 255, 0.6);
            box-shadow: 0 8px 25px rgba(0, 122, 255, 0.4);
        }

        .mode-switch-btn:hover {
            transform: scale(1.06) translateY(-2px);
            background: rgba(0, 122, 255, 0.6);
            box-shadow: 0 12px 30px rgba(0, 122, 255, 0.6);
        }

        /* Bottom Controls */
        .bottom-control-bar {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
            z-index: 10;
        }

        .control-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 16px;
            border: none;
            background: transparent;
            color: #ffffff;
            font-size: 13px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #64d2ff;
        }

/* ============================================================
   모바일 반응형 보정 (세로/가로) — 자동 생성 블록

html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

/* ---------- 모바일 세로 (폭 900px 이하) ---------- */
@media (max-width: 900px) {

        top: max(8px, env(safe-area-inset-top)) !important;
        left: 8px !important;

        align-items: center !important;
        overflow: hidden;
    }

    }
    .top-left-bar .tag-badge {
        flex: 0 1 auto;
        min-width: 0;
        padding: 6px 10px !important;

        overflow: hidden;
    }

    .icon-btn { width: 34px !important; height: 34px !important; min-width: 34px; font-size: 15px !important; flex: 0 0 auto; }

    /* 전체화면: 1행 우측 아이콘 버튼 (글자는 숨김) */
    .bottom-right-bar {

    }

    .bottom-right-bar .fs-text { display: none !important; }

    /* 안내 문구 */
    .center-tooltip, #guide-tooltip {
        top: calc(max(8px, env(safe-area-inset-top)) + 88px) !important;
        left: 8px !important;
        right: 8px !important;
        transform: none !important;

        width: auto !important;
        max-width: none !important;

        line-height: 1.45;
        text-align: center;
        z-index: 15 !important;
    }

    /* 하단 컨트롤 바: 화면 폭 전체, 한 줄 유지 */
    .bottom-control-bar {
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        transform: none !important;
        width: 100% !important;

        padding: 6px 6px calc(6px + env(safe-area-inset-bottom)) !important;
        gap: 2px !important;
        justify-content: space-around !important;
        flex-wrap: nowrap !important;
        overflow: visible;
    }
    .control-tab-btn {
        flex: 1 1 0 !important;

    /* 슬라이더 등 서브 패널 */

    .modal-overlay { padding: 12px !important; align-items: center !important; }
    .modal-card {
        max-height: 88vh !important;

                    { title: "자극과 반응", icon: "⚡", url: "labs/biology/nerve/sar.html" },
                    { title: "배설계와 오줌의 생성", icon: "🫘", url: "labs/biology/energy/excretorysystem.html" },
                    { title: "자연선택 시뮬레이션", icon: "🦋", url: "labs/biology/evolution/natural_selection.html" },
                    { title: "세포 분열", icon: "🔬", url: "labs/biology/reproduction/celldivision.html" }
                ]
            },
            {
                category: "교실 도구",
                color: "#8e8e93",
                labs: [
                    { title: "교실 자리 배치", icon: "▦", url: "labs/class/classseat.html" },
                    { title: "행운의 추첨기", icon: "🎲", url: "labs/class/pickme.html" },
                    { title: "모둠 뽑기", icon: "🪑", url: "labs/class/group.html" }
                ]
            }
        ];

        // --- 2. 시작 시점 설정 (여기 값만 바꾸면 시작 각도 조절 가능) ---
        const START_TARGET  = new THREE.Vector3(0, 2.65, 0);     // 바라보는 지점 (4개 층의 중앙 높이)
        // 화면이 좁은 세로 모드(폰)에서는 카드가 작아 보이지 않도록 시작 위치를 살짝 당긴다
        // (카드가 걸린 원(orbitRadius)보다 안쪽에 서서 안쪽 벽의 카드를 바라보는 구도)
        function startCameraPos() {
            return window.innerWidth < 700
                ? new THREE.Vector3(0, 3.0, 2.6)
                : new THREE.Vector3(0, 3.1, 3.4);
        }
        const START_CAM_POS = startCameraPos();   // 카메라 위치 (높이, 뒤로 물러난 정도)

        // --- 3. Three.js 기본 씬 & 카메라 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x05050d, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.copy(START_CAM_POS);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = true;
        controls.minDistance = 1.0;      // 카드 바로 앞까지 초근접 확대
        controls.maxDistance = 26.0;     // 4개 층 전체를 한눈에 볼 수 있을 만큼 멀리
        controls.minPolarAngle = 0.18;   // 천장 위로 넘어가지 않게
        controls.maxPolarAngle = Math.PI * 0.72;  // 층 아래(지구 안쪽)로 내려가지 않게
        controls.enablePan = false;
        controls.target.copy(START_TARGET);
        controls.update();

        // 층 이동 / 시점 정렬 시 부드럽게 카메라를 옮기기 위한 상태
        let camTween = null;

        // --- 상하/좌우 드래그 방향 반전 ---
        // 이 버전의 OrbitControls는 rotateLeft를 외부에 공개하지 않으므로,
        // 기본 회전 속도를 0으로 두고 회전을 직접 처리해 드래그 방향을 뒤집는다(카드를 손으로 미는 캐러셀 감각).
        //  - 수평: 기본과 반대
        //  - 수직: 기본과 반대(위로 밀면 시점이 아래로 간다)
        controls.rotateSpeed = 0;
        const ROTATE_SPEED = 0.55;
        const activePointers = new Map();
        const rotSpherical = new THREE.Spherical();
        const rotOffset = new THREE.Vector3();

        function rotateView(dx, dy) {
            rotOffset.copy(camera.position).sub(controls.target);
            rotSpherical.setFromVector3(rotOffset);
            const k = (2 * Math.PI / renderer.domElement.clientHeight) * ROTATE_SPEED;
            rotSpherical.theta += dx * k;   // 기본(-=)과 반대
            rotSpherical.phi += dy * k;     // 상하도 기본(-=)과 반대로: 위로 밀면 시점이 올라간다
            rotSpherical.phi = Math.max(controls.minPolarAngle, Math.min(controls.maxPolarAngle, rotSpherical.phi));
            rotSpherical.makeSafe();
            rotOffset.setFromSpherical(rotSpherical);
            camera.position.copy(controls.target).add(rotOffset);
            camera.lookAt(controls.target);
        }

        renderer.domElement.addEventListener('pointerdown', (e) => {
            activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        });

        renderer.domElement.addEventListener('pointermove', (e) => {
            const prev = activePointers.get(e.pointerId);
            if (!prev) return;
            if (activePointers.size !== 1) {   // 두 손가락(핀치 줌) 중에는 회전하지 않음
                prev.x = e.clientX;
                prev.y = e.clientY;
                return;
            }
            rotateView(e.clientX - prev.x, e.clientY - prev.y);
            prev.x = e.clientX;
            prev.y = e.clientY;
        });

        ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => {
            renderer.domElement.addEventListener(ev, (e) => activePointers.delete(e.pointerId));
        });

        // --- 4. 조명 ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.85));

        const dirLight = new THREE.DirectionalLight(0x64d2ff, 1.2);
        dirLight.position.set(10, 20, 15);
        scene.add(dirLight);

        // --- 5. 우주 배경: 다층 항성 + 은하수 성운 ---
        function makeGlowTexture() {
            const S = 128;
            const c = document.createElement('canvas');
            c.width = c.height = S;
            const x = c.getContext('2d');
            const grd = x.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
            grd.addColorStop(0.00, 'rgba(255,255,255,1)');
            grd.addColorStop(0.22, 'rgba(255,255,255,0.72)');
            grd.addColorStop(0.55, 'rgba(255,255,255,0.18)');
            grd.addColorStop(1.00, 'rgba(255,255,255,0)');
            x.fillStyle = grd;
            x.fillRect(0, 0, S, S);
            return new THREE.CanvasTexture(c);
        }
        const glowTex = makeGlowTexture();

        // 성운용 아주 부드러운(대비 낮은) 구름 텍스처
        function makeCloudTexture() {
            const S = 128;
            const c = document.createElement('canvas');
            c.width = c.height = S;
            const x = c.getContext('2d');
            const grd = x.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
            grd.addColorStop(0.00, 'rgba(255,255,255,0.42)');
            grd.addColorStop(0.30, 'rgba(255,255,255,0.26)');
            grd.addColorStop(0.65, 'rgba(255,255,255,0.09)');
            grd.addColorStop(1.00, 'rgba(255,255,255,0)');
            x.fillStyle = grd;
            x.fillRect(0, 0, S, S);
            return new THREE.CanvasTexture(c);
        }
        const cloudTex = makeCloudTexture();

        // 항성 분광형(색온도) 분포: 청백색 O/B → 흰색 A → 황백색 F → 태양형 G → 주황 K → 적색 M
        const STAR_SPECTRA = [
            { w: 0.10, c: [0.72, 0.82, 1.00] },
            { w: 0.20, c: [0.88, 0.93, 1.00] },
            { w: 0.28, c: [1.00, 0.98, 0.92] },
            { w: 0.22, c: [1.00, 0.92, 0.72] },
            { w: 0.14, c: [1.00, 0.80, 0.55] },
            { w: 0.06, c: [1.00, 0.62, 0.45] }
        ];
        function pickStarColor() {
            let r = Math.random(), acc = 0;
            for (let i = 0; i < STAR_SPECTRA.length; i++) {
                acc += STAR_SPECTRA[i].w;
                if (r <= acc) return STAR_SPECTRA[i].c;
            }
            return STAR_SPECTRA[3].c;
        }

        // 별은 밝기 등급(크기)별로 나누고, 등급마다 위상이 다른 두 그룹으로 쪼개어 반짝임(twinkle)을 만든다.
        const starGroups = [];
        const STAR_CLASSES = [
            { count: 420, size: 5.2, opacity: 0.95 },
            { count: 1500, size: 2.9, opacity: 0.9 },
            { count: 2800, size: 1.7, opacity: 0.75 }
        ];
        STAR_CLASSES.forEach((cls, ci) => {
            const per = Math.ceil(cls.count / 2);
            for (let half = 0; half < 2; half++) {
                const n = per;
                const pos = new Float32Array(n * 3);
                const col = new Float32Array(n * 3);
                for (let i = 0; i < n; i++) {
                    const u = Math.random() * 2 - 1;
                    const th = Math.random() * Math.PI * 2;
                    const rr = Math.sqrt(Math.max(0, 1 - u * u));
                    const dist = 120 + Math.random() * 70;
                    pos[i * 3] = Math.cos(th) * rr * dist;
                    pos[i * 3 + 1] = u * dist;
                    pos[i * 3 + 2] = Math.sin(th) * rr * dist;
                    const c = pickStarColor();
                    const b = 0.55 + Math.random() * 0.55;
                    col[i * 3] = Math.min(1, c[0] * b);
                    col[i * 3 + 1] = Math.min(1, c[1] * b);
                    col[i * 3 + 2] = Math.min(1, c[2] * b);
                }
                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
                const mat = new THREE.PointsMaterial({
                    size: cls.size,
                    map: glowTex,
                    vertexColors: true,
                    transparent: true,
                    opacity: cls.opacity,
                    sizeAttenuation: false,   // 거리와 상관없이 같은 크기로 빛나게
                    depthWrite: false,
                    blending: THREE.AdditiveBlending,
                    fog: false
                });
                const pts = new THREE.Points(geo, mat);
                pts.frustumCulled = false;
                scene.add(pts);
                starGroups.push({
                    mat: mat,
                    base: cls.opacity,
                    amp: 0.10 + Math.random() * 0.10,
                    speed: 0.7 + ci * 0.55 + half * 1.9,
                    phase: Math.random() * Math.PI * 2
                });
            }
        });

        // 은하수(성운): 보라 · 시안 · 마젠타 가스 구름 띠
        const GAL_NORMAL = new THREE.Vector3(0.72, 0.46, 0.36).normalize();   // 은하수 띠가 머리 위로 비스듬히 걸치도록
        const GAL_U = new THREE.Vector3().crossVectors(GAL_NORMAL, new THREE.Vector3(0, 0, 1)).normalize();
        const GAL_V = new THREE.Vector3().crossVectors(GAL_NORMAL, GAL_U).normalize();
        const nebulaGroup = new THREE.Group();
        scene.add(nebulaGroup);
        (function buildNebula() {
            const PALETTE = [
                [0.42, 0.28, 1.00],   // 보라
                [0.20, 0.62, 1.00],   // 시안
                [0.85, 0.30, 0.95],   // 마젠타
                [0.30, 0.85, 0.95],
                [0.55, 0.40, 1.00]
            ];
            const LAYERS = [
                { count: 300, size: 110, bright: 0.20, spread: 0.26 },
                { count: 560, size: 46, bright: 0.24, spread: 0.22 },
                { count: 900, size: 16, bright: 0.30, spread: 0.18 },
                { count: 620, size: 7, bright: 0.40, spread: 0.16 }
            ];
            LAYERS.forEach(L => {
                const pos = new Float32Array(L.count * 3);
                const col = new Float32Array(L.count * 3);
                for (let i = 0; i < L.count; i++) {
                    const a = Math.random() * Math.PI * 2;
                    const off = (Math.random() + Math.random() + Math.random() - 1.5) * L.spread;
                    const dir = new THREE.Vector3()
                        .addScaledVector(GAL_U, Math.cos(a))
                        .addScaledVector(GAL_V, Math.sin(a))
                        .addScaledVector(GAL_NORMAL, off)
                        .normalize()
                        .multiplyScalar(125 + Math.random() * 55);
                    pos[i * 3] = dir.x;
                    pos[i * 3 + 1] = dir.y;
                    pos[i * 3 + 2] = dir.z;
                    const c = PALETTE[(Math.random() * PALETTE.length) | 0];
                    const b = L.bright * (0.5 + Math.random());
                    col[i * 3] = c[0] * b;
                    col[i * 3 + 1] = c[1] * b;
                    col[i * 3 + 2] = c[2] * b;
                }
                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
                const mat = new THREE.PointsMaterial({
                    size: L.size,
                    map: cloudTex,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.92,
                    sizeAttenuation: false,
                    depthWrite: false,
                    blending: THREE.AdditiveBlending,
                    fog: false
                });
                const pts = new THREE.Points(geo, mat);
                pts.frustumCulled = false;
                nebulaGroup.add(pts);
            });
        })();

        // --- 6. 발 밑 대형 지구: 지구본 수준의 디테일(대륙·빙하·구름·대기) ---
        function buildEarthTexture() {
            const W = 1024, H = 512;   // 첫 화면용 대체 텍스처(곱 실사 이미지로 교체된다)
            const cv = document.createElement('canvas');

            const px = lon => (lon + 180) / 360 * W;
            const py = lat => (90 - lat) / 180 * H;

            // 심해 → 연해 그라데이션 (극지가 어둡고 적도가 밝다)
            const ocean = g.createLinearGradient(0, 0, 0, H);
            ocean.addColorStop(0.00, '#08203c');

            ocean.addColorStop(0.50, '#1c5f96');

            g.fillStyle = ocean;

            // 바다의 은은한 얼룩(수심 변화 느낌)
            for (let i = 0; i < 46; i++) {
                const x = Math.random() * W;
                const y = H * 0.10 + Math.random() * H * 0.80;
                const r = 70 + Math.random() * 260;
                const rg = g.createRadialGradient(x, y, 0, x, y, r);
                rg.addColorStop(0, 'rgba(96,186,238,0.055)');
                rg.addColorStop(1, 'rgba(96,186,238,0)');
                g.fillStyle = rg;
                g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
            }

            // 7대륙 (경도, 위도)
            const LAND = [
                // 북아메리카
                [[-168,65],[-150,60],[-132,55],[-125,48],[-117,32],[-105,22],[-95,17],[-83,9],[-77,8],[-80,25],[-75,35],[-66,45],[-55,50],[-60,58],[-95,70],[-125,70],[-168,65]],
                // 남아메리카
                [[-81,8],[-75,10],[-60,10],[-50,0],[-35,-5],[-38,-20],[-48,-25],[-58,-35],[-62,-40],[-65,-55],[-75,-50],[-72,-30],[-70,-18],[-81,-5],[-81,8]],
                // 아프리카
                [[-17,15],[0,15],[15,25],[32,30],[40,12],[51,12],[42,-2],[40,-15],[32,-25],[25,-34],[18,-34],[12,-18],[8,4],[-8,5],[-17,15]],
                // 유럽

                // 아시아
                [[30,45],[40,48],[60,45],[80,45],[100,50],[120,50],[135,55],[140,45],[130,35],[122,31],[120,22],[105,20],[100,10],[95,20],[80,8],[70,20],[60,25],[45,30],[35,35],[30,45]],
                // 오세아니아
                [[113,-22],[122,-18],[130,-12],[142,-11],[147,-20],[153,-28],[150,-38],[140,-38],[129,-32],[115,-34],[113,-22]],
                // 그린란드
                [[-45,60],[-20,70],[-20,82],[-45,83],[-58,76],[-55,65],[-45,60]]

            function landPath() {
                g.beginPath();
                LAND.forEach(poly => {
                    poly.forEach((pt, i) => {
                        const x = px(pt[0]), y = py(pt[1]);
                        if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);

            // 육지 기본색
            g.lineJoin = 'round';
            g.fillStyle = '#2f7a52';

            landPath();
            g.fill();
            g.stroke();

            // 육지 안쪽만 칠해지는 지형(사막·열대우림·산맥)
            g.save();
            landPath();
            g.clip();
            function blob(color, lon, lat, lonR, latR, alpha, rot) {
                const x = px(lon), y = py(lat);
                const rx = lonR / 360 * W, ry = latR / 180 * H;
                const rg = g.createRadialGradient(0, 0, 0, 0, 0, 1);
                rg.addColorStop(0, color);
                rg.addColorStop(1, 'rgba(0,0,0,0)');
                g.save();
                g.translate(x, y);
                g.rotate(rot || 0);
                g.scale(rx, ry);
                g.globalAlpha = alpha;
                g.fillStyle = rg;
                g.beginPath(); g.arc(0, 0, 1, 0, Math.PI * 2); g.fill();
                g.restore();
            }
            // 사하라·아라비아·중앙아시아·호주 내륙 사막
            blob('rgba(206,176,116,1)', 15, 22, 34, 11, 0.85, 0);
            blob('rgba(214,186,126,1)', 45, 23, 16, 8, 0.75, 0);
            blob('rgba(200,176,126,1)', 80, 40, 26, 9, 0.55, 0);
            blob('rgba(208,170,110,1)', 132, -25, 18, 8, 0.8, 0);
            blob('rgba(198,168,120,1)', -110, 34, 14, 7, 0.55, 0);
            blob('rgba(200,168,112,1)', -68, -24, 12, 8, 0.5, 0);
            // 열대우림
            blob('rgba(26,92,56,1)', -62, -4, 18, 9, 0.85, 0);
            blob('rgba(26,92,56,1)', 22, 0, 16, 8, 0.8, 0);
            blob('rgba(28,98,60,1)', 112, 0, 18, 7, 0.7, 0);
            // 산맥 (히말라야·안데스·로키)
            blob('rgba(150,140,116,1)', 85, 33, 20, 5, 0.7, 0);
            blob('rgba(140,132,112,1)', -70, -22, 4, 20, 0.55, 0);
            blob('rgba(150,140,116,1)', -110, 42, 10, 8, 0.45, 0);
            // 툰드라(고위도 육지)
            blob('rgba(206,216,214,1)', 90, 66, 60, 10, 0.5, 0);
            blob('rgba(206,216,214,1)', -100, 66, 50, 10, 0.5, 0);
            g.restore();

            // 대륙 테두리(해안선) 한 번 더
            g.strokeStyle = 'rgba(112,196,146,0.75)';
            g.lineWidth = 3;
            landPath();
            g.stroke();

            // 구름 띠 (해양·육지 위를 은은하게)
            for (let i = 0; i < 110; i++) {
                const lon = Math.random() * 360 - 180;
                const lat = (Math.random() * 2 - 1) * 68;
                const x = px(lon), y = py(lat);
                const len = 0.5 + Math.random() * 2.2;
                const th = 0.15 + Math.random() * 0.5;
                const rot = (Math.random() - 0.5) * 0.5;
                const rg = g.createRadialGradient(0, 0, 0, 0, 0, 1);
                rg.addColorStop(0, 'rgba(255,255,255,' + (0.13 + Math.random() * 0.10).toFixed(3) + ')');
                rg.addColorStop(1, 'rgba(255,255,255,0)');
                g.save();
                g.translate(x, y);
                g.rotate(rot);
                g.scale(len * 26, th * 26);
                g.fillStyle = rg;
                g.beginPath(); g.arc(0, 0, 1, 0, Math.PI * 2); g.fill();
                g.restore();
            }

            // 남극 대륙
            g.fillStyle = '#e9f3fc';
            g.beginPath();
            g.moveTo(0, H);
            g.lineTo(0, H * 0.936);
            for (let i = 0; i <= 40; i++) {
                const x = i / 40 * W;
                const y = H * (0.936 + Math.sin(i * 1.7) * 0.006 + Math.sin(i * 0.53) * 0.004);
                g.lineTo(x, y);
            }
            g.lineTo(W, H);
            g.closePath();
            g.fill();

            // 북극 해빙
            const npg = g.createLinearGradient(0, 0, 0, H * 0.10);
            npg.addColorStop(0, 'rgba(238,247,255,0.97)');
            npg.addColorStop(0.55, 'rgba(226,240,252,0.72)');
            npg.addColorStop(1, 'rgba(226,240,252,0)');
            g.fillStyle = npg;
            g.fillRect(0, 0, W, H * 0.10);

            // 한반도(서울) 황금빛 표식
            const sx = px(127.5), sy = py(37.5);
            const sg = g.createRadialGradient(sx, sy, 0, sx, sy, 26);
            sg.addColorStop(0, 'rgba(255,205,110,0.95)');
            sg.addColorStop(0.35, 'rgba(255,179,64,0.55)');
            sg.addColorStop(1, 'rgba(255,179,64,0)');
            g.fillStyle = sg;
            g.beginPath(); g.arc(sx, sy, 26, 0, Math.PI * 2); g.fill();
            g.fillStyle = '#ffe6b8';
            g.beginPath(); g.arc(sx, sy, 4.2, 0, Math.PI * 2); g.fill();

            const tex = new THREE.CanvasTexture(cv);
            tex.anisotropy = 8;
            return tex;
        }

        const EARTH_R = 11;
        const EARTH_POS = [0, -15, -9];   // 지구 중심(발 아래·앞쪽)
        // 실제 지구 위성 이미지(three.js 예제 배포본, NASA Blue Marble). 로드되면 절차적 텍스처를 대체한다.
        const EARTH_TEX_URL = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/planets/earth_atmos_2048.jpg';

        // 위선·경선 그리드(은은한 홀로그램 느낌)
        (function buildGraticule() {

                    pts.push(new THREE.Vector3(

        // 자전축과 극 표식

        // --- 7. 카드 텍스처 생성기 (1024x600 고해상도) ---
        function roundRectPath(ctx, x, y, w, h, r) {
            const rr = Array.isArray(r) ? r : [r, r, r, r];
            ctx.beginPath();
            ctx.moveTo(x + rr[0], y);
            ctx.lineTo(x + w - rr[1], y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + rr[1]);
            ctx.lineTo(x + w, y + h - rr[2]);
            ctx.quadraticCurveTo(x + w, y + h, x + w - rr[2], y + h);
            ctx.lineTo(x + rr[3], y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - rr[3]);
            ctx.lineTo(x, y + rr[0]);
            ctx.quadraticCurveTo(x, y, x + rr[0], y);
            ctx.closePath();
        }

        function hexToRgba(hex, a) {
            const h = hex.replace('#', '');
            const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
            return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
        }

        // hires=false 이면 같은 그림을 절반 해상도로 먼저 그린다(첫 화면 지연 없이, 이후 선명하게 업그레이드).
        function createCardTexture(category, title, icon, colorHex, hires) {
            const W = 1024, H = 600;
            const canvas = document.createElement('canvas');
            canvas.width = hires ? W : W / 2;
            canvas.height = hires ? H : H / 2;
            const ctx = canvas.getContext('2d');
            if (!hires) ctx.scale(0.5, 0.5);
            const FONT = "'SeoulNamsan', -apple-system, BlinkMacSystemFont, sans-serif";

            // 흰 바탕(살짝 푸른 그라데이션) — 경로를 매번 새로 시작해 카테고리 색이 카드 전체를 덮지 않게 한다
            roundRectPath(ctx, 0, 0, W, H, 44);
            const body = ctx.createLinearGradient(0, 0, 0, H);
            body.addColorStop(0, '#ffffff');
            body.addColorStop(0.55, '#f5f9fd');
            body.addColorStop(1, '#e6eff8');
            ctx.fillStyle = body;
            ctx.fill();

            // 상단 카테고리 컬러 바
            roundRectPath(ctx, 0, 0, W, 52, [44, 44, 0, 0]);
            ctx.fillStyle = colorHex;
            ctx.fill();

            // 카테고리 뱃지
            ctx.font = `bold 30px ${FONT}`;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            const catW = ctx.measureText(category).width;
            roundRectPath(ctx, 44, 82, catW + 56, 54, 27);
            ctx.fillStyle = hexToRgba(colorHex, 0.14);
            ctx.fill();
            roundRectPath(ctx, 44, 82, catW + 56, 54, 27);
            ctx.strokeStyle = hexToRgba(colorHex, 0.32);
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = colorHex;
            ctx.fillText(category, 72, 110);

            // 아이콘
            ctx.font = '188px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(icon, W / 2, 296);

            // 제목: 카드 폭(1024)에 맞춰 크기 자동 조절, 길면 두 줄
            const MAXW = 900;
            const measure = (s, size) => {
                ctx.font = `bold ${size}px ${FONT}`;
                return ctx.measureText(s).width;
            };
            let chosen = 0;
            let lines = [title];
            const tries = [70, 64, 58, 52, 46];
            for (let i = 0; i < tries.length; i++) {
                if (measure(title, tries[i]) <= MAXW) { chosen = tries[i]; break; }
            }
            if (!chosen) {
                // 단어 경계에서 가장 고르게 두 줄로 나눈다
                const words = title.split(' ');
                let bestSplit = null;
                if (words.length > 1) {
                    for (let i = 1; i < words.length; i++) {
                        const a = words.slice(0, i).join(' ');
                        const b = words.slice(i).join(' ');
                        const m = Math.max(measure(a, 52), measure(b, 52));
                        if (!bestSplit || m < bestSplit.m) bestSplit = { m, a, b };
                    }
                }
                if (bestSplit && bestSplit.m <= MAXW) {
                    chosen = 52;
                    lines = [bestSplit.a, bestSplit.b];
                } else {
                    chosen = 44;
                    const mid = Math.ceil(title.length / 2);
                    lines = [title.slice(0, mid), title.slice(mid)];
                }
            }
            ctx.fillStyle = '#132433';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = `bold ${chosen}px ${FONT}`;
            const lineH = chosen * 1.18;
            const firstY = lines.length > 1 ? 468 - lineH / 2 : 472;
            lines.forEach((ln, i) => {
                ctx.fillText(ln, W / 2, firstY + i * lineH);
            });

            const tex = new THREE.CanvasTexture(canvas);
            tex.anisotropy = 8;
            return tex;
        }

        // --- 8. 다층(1F~4F) 카드 배치 ---
        const cardsGroup = new THREE.Group();
        const cardMeshes = [];
        const orbitRadius = 6.2;      // 카드가 걸린 원 (작을수록 카드가 눈 앞으로 다가온다)
        const CARD_W = 2.42;
        const CARD_H = 1.418;         // 카드 텍스처 비율(1024x600)에 맞춤

        // 층 정의
        //  deckY    : 층 바닥(가이드 링) 높이
        //  angleOffset : 위층 카드가 아래층 카드를 완전히 가리지 않게 층마다 각도를 비트는 값(지그재그)
        //  count    : 층별 카드 수 (총 47개 = 12 + 12 + 12 + 11)
        const FLOORS = [
            { label: '1F', deckY: -0.8, color: 0x22d3ee, count: 12, angleOffset: 0.00 },
            { label: '2F', deckY:  1.0, color: 0x7c5cff, count: 12, angleOffset: 0.17 },
            { label: '3F', deckY:  2.8, color: 0xff2d95, count: 12, angleOffset: 0.34 },
            { label: '4F', deckY:  4.6, color: 0xffd60a, count: 11, angleOffset: 0.51 }
        ];
        const CARD_LIFT = CARD_H / 2 + 0.06;   // 층 바닥 위에 카드를 세웠을 때의 중심 높이

        const allLabs = [];
        labCategories.forEach(cat => {
            cat.labs.forEach(lab => {
                allLabs.push({
                    category: cat.category,
                    color: cat.color,
                    title: lab.title,
                    icon: lab.icon,
                    url: lab.url
                });
            });
        });

        const totalCards = allLabs.length;

        // 층별 카드 수 (총 카드 수와 다르면 마지막 층에서 자동 보정)
        const floorCounts = FLOORS.map(f => f.count);
        const countSum = floorCounts.reduce((a, b) => a + b, 0);
        if (countSum !== totalCards) floorCounts[floorCounts.length - 1] += totalCards - countSum;

        // 카테고리 순서를 유지한 채 1층부터 차곡차곡 나눈다
        const floorOfLab = [];
        let cursor = 0;
        floorCounts.forEach((n, fi) => {
            for (let i = 0; i < n && cursor < totalCards; i++, cursor++) floorOfLab[cursor] = fi;
        });
        while (cursor < totalCards) { floorOfLab[cursor] = FLOORS.length - 1; cursor++; }

        const floorSlot = FLOORS.map(() => 0);

        // 앞/뒤 양면 카드용 지오메트리 (안쪽에서도, 바깥에서도 글자가 바로 읽히도록 앞뒤로 한 장씩 붙인다)
        const cardFrontGeo = new THREE.PlaneGeometry(CARD_W, CARD_H);
        const cardBackGeo = new THREE.PlaneGeometry(CARD_W, CARD_H);

        allLabs.forEach((lab, idx) => {
            const fi = floorOfLab[idx];
            const floor = FLOORS[fi];
            const n = Math.max(1, floorCounts[fi]);
            const slot = floorSlot[fi]++;

            // 같은 층 카드는 원 둘레에 고르게(호 길이 약 3.5~3.8) 떨어지게 배치 -> 카드(폭 2.5)끼리 겹치지 않음
            const angle = floor.angleOffset + (slot + 0.5) * (Math.PI * 2) / n;
            const x = Math.sin(angle) * orbitRadius;
            const z = -Math.cos(angle) * orbitRadius;
            const baseY = floor.deckY + CARD_LIFT;

            const cardMaterial = new THREE.MeshStandardMaterial({
                map: createCardTexture(lab.category, lab.title, lab.icon, lab.color, false),
                transparent: true,
                opacity: 1.0,          // 카드가 커진 만큼 뒤 배경이 비쳐 보이지 않게 불투명하게
                roughness: 0.2,
                side: THREE.FrontSide
            });

            const cardGroup = new THREE.Group();
            const frontFace = new THREE.Mesh(cardFrontGeo, cardMaterial);
            // 뒷면(바깥을 바라보는 면): 어느 쪽에서 보아도 글자가 바로 읽히도록 180도 돌려 붙인다
            const backFace = new THREE.Mesh(cardBackGeo, cardMaterial);
            backFace.rotation.y = Math.PI;      // 바깥을 바라보는 면
            backFace.position.z = -0.004;       // 앞면과의 z-파이팅 방지
            frontFace.userData.card = cardGroup;
            backFace.userData.card = cardGroup;
            cardGroup.add(frontFace);
            cardGroup.add(backFace);

            cardGroup.position.set(x, baseY, z);
            cardGroup.lookAt(0, baseY, 0);

            cardGroup.userData = {
                url: lab.url,
                title: lab.title,
                floor: fi,
                angle: angle,
                baseX: x,
                baseZ: z,
                baseY: baseY,
                targetY: baseY,
                inwardX: -x / orbitRadius,   // 카드가 바라보는(원 안쪽) 방향
                inwardZ: -z / orbitRadius,
                pop: 0,
                popTarget: 0,
                targetScale: 1.0,
                currentScale: 1.0,
                material: cardMaterial
            };

            cardsGroup.add(cardGroup);
            cardMeshes.push(cardGroup);
        });

        scene.add(cardsGroup);

        // --- 8-1. 층 느낌: 은은하게 빛나는 가이드 링 + 네온 층 표시(1F~4F) ---
        const deckGroup = new THREE.Group();
        const floorRings = [];

        function createFloorLabelSprite(floor) {
            const c = document.createElement('canvas');
            c.width = 256;
            c.height = 128;
            const ctx = c.getContext('2d');
            const css = '#' + floor.color.toString(16).padStart(6, '0');

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = css;
            ctx.shadowBlur = 26;
            ctx.fillStyle = css;
            ctx.font = 'bold 80px "SeoulNamsan", -apple-system, sans-serif';
            ctx.fillText(floor.label, 128, 56);

            // 아래쪽 가는 밑줄 장식
            ctx.shadowBlur = 14;
            ctx.strokeStyle = css;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(92, 104);
            ctx.lineTo(164, 104);
            ctx.stroke();

            const tex = new THREE.CanvasTexture(c);
            tex.anisotropy = 4;
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
                map: tex,
                transparent: true,
                depthWrite: false,
                opacity: 0.95,
                sizeAttenuation: false   // 거리와 상관없이 화면에서 같은 크기로 보이게(가까이 와도 커지지 않음)
            }));
            sprite.scale.set(0.07, 0.035, 1);
            return sprite;
        }

        FLOORS.forEach((floor, fi) => {
            // 바깥 테두리 링 (네온)
            const ringMesh = new THREE.Mesh(
                new THREE.TorusGeometry(orbitRadius, 0.035, 8, 180),
                new THREE.MeshBasicMaterial({
                    color: floor.color,
                    transparent: true,
                    opacity: 0.9,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                })
            );
            ringMesh.rotation.x = Math.PI / 2;
            ringMesh.position.y = floor.deckY;
            deckGroup.add(ringMesh);

            // 안쪽 보조 링
            const haloMesh = new THREE.Mesh(
                new THREE.TorusGeometry(orbitRadius - 0.3, 0.012, 6, 160),
                new THREE.MeshBasicMaterial({
                    color: floor.color,
                    transparent: true,
                    opacity: 0.3,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                })
            );
            haloMesh.rotation.x = Math.PI / 2;
            haloMesh.position.y = floor.deckY;
            deckGroup.add(haloMesh);

            // 층 바닥면 (아주 옅은 발판 느낌)
            const discMesh = new THREE.Mesh(
                new THREE.CircleGeometry(orbitRadius - 0.3, 96),
                new THREE.MeshBasicMaterial({
                    color: floor.color,
                    transparent: true,
                    opacity: 0.022,
                    side: THREE.DoubleSide,
                    depthWrite: false
                })
            );
            discMesh.rotation.x = -Math.PI / 2;
            discMesh.position.y = floor.deckY + 0.002;
            deckGroup.add(discMesh);

            floorRings.push({ ring: ringMesh, halo: haloMesh, disc: discMesh });

            // 층 테두리 네 곳에 층 번호(1F~4F)를 달아 어느 방향에서 돌아봐도 읽히게 스프라이트로 배치
            [0, Math.PI / 2, Math.PI, Math.PI * 1.5].forEach(a => {
                const label = createFloorLabelSprite(floor);
                label.position.set(
                    Math.sin(a) * (orbitRadius + 0.45),
                    floor.deckY - 0.3,
                    -Math.cos(a) * (orbitRadius + 0.45)
                );
                deckGroup.add(label);
            });
        });

        scene.add(deckGroup);

        // 웹폰트가 준비되면 카드 텍스처를 고해상도(1024x600)로 차근차근 업그레이드한다.
        // 한 번에 그리면 첫 화면이 멈추므로 프레임당 몇 장씩 나누어 처리한다.
        function upgradeCardTextures() {
            let i = 0;
            const step = () => {
                const end = Math.min(cardMeshes.length, i + 3);
                for (; i < end; i++) {
                    const lab = allLabs[i];
                    const mat = cardMeshes[i].userData.material;
                    if (!lab || !mat) continue;
                    const old = mat.map;
                    mat.map = createCardTexture(lab.category, lab.title, lab.icon, lab.color, true);
                    mat.needsUpdate = true;
                    if (old && old.dispose) old.dispose();
                }
                if (i < cardMeshes.length) requestAnimationFrame(step);
            };
            requestAnimationFrame(step);
        }
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(() => setTimeout(upgradeCardTextures, 120));
        } else {
            setTimeout(upgradeCardTextures, 600);
        }

        // --- 9. 마우스/터치 인터랙션 ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // 호버/탭 시 카드가 시원하게 커지며 안쪽으로 살짝 튀어나온다
        const HOVER_SCALE = 1.28;
        const HOVER_POP = 0.40;
        const HOVER_LIFT = 0.10;

        function pickCard(clientX, clientY) {
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(cardsGroup.children, true);
            return hits.length > 0 ? hits[0].object.userData.card : null;
        }

        function onPointerMove(e) {
            if (activePointers.size > 0) return;   // 드래그(둘러보기) 중에는 확대하지 않는다

            const hot = pickCard(e.clientX, e.clientY);
            cardMeshes.forEach(mesh => {
                if (mesh === hot) return;
                mesh.userData.targetY = mesh.userData.baseY;
                mesh.userData.targetScale = 1.0;
                mesh.userData.popTarget = 0;
            });

            if (hot) {
                hot.userData.targetY = hot.userData.baseY + HOVER_LIFT;
                hot.userData.targetScale = HOVER_SCALE;
                hot.userData.popTarget = HOVER_POP;
                document.body.style.cursor = 'pointer';
            } else {
                document.body.style.cursor = 'default';
            }
        }

        // 터치에서는 손을 떼면 강조를 원래대로
        function clearHover() {
            cardMeshes.forEach(mesh => {
                mesh.userData.targetY = mesh.userData.baseY;
                mesh.userData.targetScale = 1.0;
                mesh.userData.popTarget = 0;
            });
            document.body.style.cursor = 'default';
        }

        // 클릭과 드래그 구분: 거의 움직이지 않고 손을 뗐을 때만 이동
        let downX = 0, downY = 0, downValid = false;

        window.addEventListener('pointerdown', (e) => {
            // 사용자가 직접 잡으면 진행 중인 카메라 이동은 멈춘다
            if (camTween && !(e.target.closest && e.target.closest('.glass-panel'))) camTween = null;
            downValid = !(e.target.tagName === 'BUTTON' || e.target.tagName === 'A' || e.target.closest('.glass-panel'));
            downX = e.clientX;
            downY = e.clientY;
        });

        let navigating = false;
        window.addEventListener('pointerup', (e) => {
            if (!downValid) return;
            downValid = false;
            if (Math.hypot(e.clientX - downX, e.clientY - downY) > 8) return;   // 드래그였다면 무시

            const clickedCard = pickCard(e.clientX, e.clientY);
            if (!clickedCard) {
                if (e.pointerType !== 'mouse') clearHover();
                return;
            }
            if (navigating) return;
            navigating = true;

            // 1.45배로 팡 튀어나오는 피드백을 보여준 뒤 이동한다
            clickedCard.userData.targetScale = 1.45;
            clickedCard.userData.popTarget = 0.95;
            clickedCard.userData.targetY = clickedCard.userData.baseY + 0.18;
            const targetUrl = clickedCard.userData.url;
            setTimeout(() => { window.location.href = targetUrl; }, 260);
        });

        window.addEventListener('pointermove', onPointerMove);

        // --- 10. 시점 정렬 & 층별 이동(1F~4F) ---
        function flyTo(pos, target, dur) {
            camTween = {
                t0: performance.now(),
                dur: dur || 900,
                fromPos: camera.position.clone(),
                toPos: pos.clone(),
                fromTgt: controls.target.clone(),
                toTgt: target.clone()
            };
        }

        const floorButtons = Array.prototype.slice.call(document.querySelectorAll('.floor-btn'));

        function setActiveFloor(fi) {
            floorButtons.forEach(btn => {
                btn.classList.toggle('active', Number(btn.dataset.floor) === fi);
            });
        }

        // 해당 층으로 이동: 지금 보고 있는 방위의 카드를 정면으로 두고 카드 바로 앞까지 다가간다
        function focusFloor(fi) {
            const floor = FLOORS[fi];
            if (!floor) return;
            const targetY = floor.deckY + CARD_LIFT;
            const az = Math.atan2(camera.position.x - controls.target.x, camera.position.z - controls.target.z);

            // 그 방위에서 가장 가까운 카드(층별 슬롯)의 방위를 찾는다
            let best = null;
            cardMeshes.forEach(m => {
                if (m.userData.floor !== fi) return;
                const ca = Math.atan2(m.userData.baseX, m.userData.baseZ);
                let d = Math.abs(((ca - az + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
                if (!best || d < best.d) best = { d: d, az: ca };
            });
            const faceAz = best ? best.az : az;
            const dx = Math.sin(faceAz), dz = Math.cos(faceAz);

            // 카드 앞 3.6 만큼 떨어져 단상 위에서 바라본다
            const camR = Math.max(0.7, orbitRadius - 3.6);
            const pos = new THREE.Vector3(dx * camR, targetY + 0.62, dz * camR);
            const tgt = new THREE.Vector3(dx * orbitRadius, targetY, dz * orbitRadius);

            controls.minDistance = 1.0;
            controls.maxDistance = 9.0;    // 층을 볼 때는 너무 멀어지지 않게
            flyTo(pos, tgt, 900);
            setActiveFloor(fi);
        }

        document.getElementById('btn-align').addEventListener('click', () => {
            controls.minDistance = 1.0;
            controls.maxDistance = 26.0;
            flyTo(startCameraPos(), START_TARGET, 900);
            setActiveFloor(-1);
        });

        floorButtons.forEach(btn => {
            btn.addEventListener('click', () => focusFloor(Number(btn.dataset.floor)));
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 11. 애니메이션 루프 ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.06);
            const elapsed = clock.elapsedTime;

            // 지구 자전 (구름은 조금 더 빠르게 흐른다)
            earthSpin.rotation.y += delta * 0.035;
            cloudLayer.rotation.y += delta * 0.012;

            // 별 반짝임(등급별로 위상이 달라 은하 전체가 살아 있는 느낌)
            for (let i = 0; i < starGroups.length; i++) {
                const s = starGroups[i];
                s.mat.opacity = s.base * (1 - s.amp) + s.base * s.amp * Math.sin(elapsed * s.speed + s.phase);
            }

            // 성운이 아주 느리게 흐른다
            nebulaGroup.rotation.y += delta * 0.004;
            nebulaGroup.rotation.x += delta * 0.0015;

            // 층 가이드 링이 은은하게 명멸
            floorRings.forEach((r, i) => {
                const pulse = 0.5 + 0.5 * Math.sin(elapsed * 1.1 + i * 0.9);
                r.ring.material.opacity = 0.55 + pulse * 0.35;
                r.halo.material.opacity = 0.14 + pulse * 0.22;
                r.disc.material.opacity = 0.018 + pulse * 0.012;
            });

            // 층 이동 / 시점 정렬 부드러운 카메라 보간
            if (camTween) {
                const p = Math.min(1, (performance.now() - camTween.t0) / camTween.dur);
                const k = p < 0.5 ? 2 * p * p : -1 + (4 - 2 * p) * p;   // easeInOutQuad
                camera.position.lerpVectors(camTween.fromPos, camTween.toPos, k);
                controls.target.lerpVectors(camTween.fromTgt, camTween.toTgt, k);
                if (p >= 1) camTween = null;
            }

            // 카드: 확대 + 살짝 앞으로 튀어나오기
            cardMeshes.forEach(mesh => {
                const u = mesh.userData;
                u.currentScale += (u.targetScale - u.currentScale) * 0.18;
                u.pop += (u.popTarget - u.pop) * 0.18;
                const s = u.currentScale;
                mesh.scale.set(s, s, s);
                mesh.position.x = u.baseX + u.inwardX * u.pop;
                mesh.position.z = u.baseZ + u.inwardZ * u.pop;
                mesh.position.y += (u.targetY - mesh.position.y) * 0.15;
            });

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

<script>
/* ============ 모바일 화면 재조정 + 전체화면 대체 동작 (자동 생성) ============ */
(function () {
    var docEl = document.documentElement;
    var btn = document.getElementById('fullscreenBtn');
    var icon = document.getElementById('fullscreenIcon');
    var text = document.getElementById('fullscreenText');

    function realFs() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement ||
                  document.mozFullScreenElement || document.msFullscreenElement);
    }
    function pseudo() { return docEl.classList.contains('pseudo-fs'); }
    function setUI() {
        var on = realFs() || pseudo();
        if (icon) icon.textContent = on ? '🗗' : '⛶';
        if (text) text.textContent = on ? '창모드' : '전체화면';
        if (btn) btn.setAttribute('aria-label', on ? '창모드로 전환' : '전체화면으로 전환');
        document.body.classList.toggle('is-fullscreen', on);
    }
    function toast(msg) {
        var t = document.getElementById('ux-toast');
        if (!t) {
            t = document.createElement('div');
            t.id = 'ux-toast';
            t.style.cssText = 'position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);' +
                'background:rgba(28,28,30,.88);color:#fff;font-size:12px;line-height:1.4;padding:9px 14px;border-radius:14px;' +
                'z-index:9999;max-width:86vw;text-align:center;pointer-events:none;transition:opacity .3s;' +
                'font-family:inherit;box-shadow:0 8px 24px rgba(0,0,0,.25)';
            document.body.appendChild(t);
        }
        t.textContent = msg;
        t.style.opacity = '1';
        clearTimeout(t._t);
        t._t = setTimeout(function () { t.style.opacity = '0'; }, 2600);
    }

    if (btn) {
        btn.addEventListener('click', function () {
            var wasReal = realFs();
            var wasPseudo = pseudo();
            setTimeout(function () {
                if (wasReal) { setUI(); return; }          // 진짜 전체화면에서 나온 경우
                if (wasPseudo) { docEl.classList.remove('pseudo-fs'); setUI(); return; }  // 몰입 모드 해제
                if (!realFs()) {                            // 전체화면 API가 동작하지 않는 환경
                    docEl.classList.add('pseudo-fs');
                    try { window.scrollTo(0, 1); } catch (e) {}
                    toast('이 브라우저는 전체화면을 지원하지 않아 상단 정보를 숨긴 몰입 모드로 표시합니다');
                }
                setUI();
            }, 380);
        }, false);
    }
    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
        document.addEventListener(ev, setUI);
    });

    /* 좁은 화면에서는 3D 장면이 잘리지 않도록 시야각을 넓혀 전체가 들어오게 한다 */
    function mobileFit() {
        try {
            if (typeof camera === 'undefined' || !camera || !camera.isPerspectiveCamera) return;
            if (!camera.userData) camera.userData = {};
            if (!camera.userData.baseFov) camera.userData.baseFov = camera.fov;
            var w = window.innerWidth, h = window.innerHeight, f = 1;
            var k = 0.62;
            var attr = document.documentElement.getAttribute('data-mzoom');
            if (attr) { var v = parseFloat(attr); if (!isNaN(v) && v > 0) k = v; }
            if (w < h) f = 1 + (1 - w / h) * k;
            else if (h <= 500) f = 1 + k * 0.16;
            camera.fov = Math.min(88, camera.userData.baseFov * f);
            camera.updateProjectionMatrix();
        } catch (e) {}
    }
    mobileFit();

    /* 화면 회전·주소창 변화·전체화면 전환 후 렌더러 크기 재계산 */
    var rt = null;
    function refit() {
        clearTimeout(rt);
        rt = setTimeout(function () {
            mobileFit();
            try { window.dispatchEvent(new Event('resize')); } catch (e) {}
        }, 240);
    }
    window.addEventListener('orientationchange', refit);
    window.addEventListener('pageshow', refit);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) refit(); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', refit);

    setUI();
})();
</script>
