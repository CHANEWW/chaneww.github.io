<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>mobile frame check</title>
<style>
  html, body { margin:0; background:#dfe6ef; font-family:sans-serif; }
  .row { display:flex; gap:16px; padding:16px; align-items:flex-start; }
  .col { background:#fff; }
  iframe { border:1px solid #9aa7b8; display:block; background:#fff; }
  h4 { margin:0 0 6px; font:700 12px sans-serif; color:#334155; }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><h4>iPhone 390 x 844</h4>
      <iframe src="/labs/physics/electric/electriccircuit_test.html?f=390" width="390" height="844" title="phone"></iframe>
    </div>
    <div class="col"><h4>iPad 834 x 1112</h4>
      <iframe src="/labs/physics/electric/electriccircuit_test.html?f=834" width="834" height="1112" title="tablet"></iframe>
    </div>
    <div class="col"><h4>Desktop 1366 x 768</h4>
      <iframe src="/labs/physics/electric/electriccircuit_test.html?f=1366" width="1366" height="768" title="desktop"></iframe>
    </div>
  </div>
</body>
</html>
